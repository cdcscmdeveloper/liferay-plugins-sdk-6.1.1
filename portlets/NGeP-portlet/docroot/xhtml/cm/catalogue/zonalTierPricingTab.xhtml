<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="cmZonalTierPricings">
		<p:dataTable id="cmZonalTierPricingsId" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalTierPricings}"
			var="tier" rowKey="#{tier}" rowIndexVar="rowIndex" width="100%">


			<ac:paginator for="cmZonalTierPricingsId"></ac:paginator>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.zm.name']}
				</f:facet>
				<p:selectOneMenu value="#{tier.cmSupplierZone.suppZoneId}"
					style="width: 100px;"
					disabled="#{!tier.showFlag || tier.standardDisabled}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="0" />
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.supplierZoneList}"
						var="zone" itemLabel="#{zone.suppZoneName}"
						itemValue="#{zone.suppZoneId}"></f:selectItems>
					<p:ajax event="change"
						listener="#{catalogueBackingBean.validateZonalTierDateOverlap(rowIndex)}"
						update=":form:pricingTabID:headerTabId:zonalTierId:cmZonalTierPricingsId" />
				</p:selectOneMenu>
				<p:commandLink id="viewAllTierId" title="#{lbl['lbl.cm.view']}"
					disabled="#{tier.cmSupplierZone.suppZoneId==0}" update=":form:zoneDtlsId"
					oncomplete="zoneDtlspopUp.show()"
					action="#{catalogueBackingBean.viewAllZone(tier.cmSupplierZone.suppZoneId)}">
					<p:graphicImage value="/css/images/design/document.png"></p:graphicImage>
				</p:commandLink>

			</p:column>



			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.from.qty']}
				</f:facet>
				<p:inputText value="#{tier.fromQty}" styleClass="fromQty" size="4" maxlength="6"
					disabled="#{!tier.showFlag || tier.standardDisabled}">
					<p:ajax event="keyup"
						update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
				</p:inputText>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.to.qty']}
				</f:facet>
				<p:inputText value="#{tier.toQty}" size="4" maxlength="6"
					disabled="#{tier.standardDisabled}">
					<p:ajax process="@this"
						listener="#{catalogueBackingBean.updateZonalTierToQty(rowIndex)}"
						update="@(.fromQty)" />
					<p:ajax event="keyup" update="zTErrorLink," />
				</p:inputText>
			</p:column>
			<p:column>

				<f:facet name="header">
					#{lbl['lbl.cm.price.uom']}
				</f:facet>
				<p:inputText id="zTierPriceId" value="#{tier.price}" size="8" maxlength="18"
					disabled="#{tier.standardDisabled}" style="text-align:right">
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateZonalTierPrice(rowIndex)}"
						update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink, zTierPriceId" />
						<f:converter converterId="bigDecimalConverter" />
				</p:inputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{tier.startDate}" size="8" showOn="button" navigator="true"
					rendered="#{tier.showFlag}"
					mindate="#{catalogueBackingBean.managedBean.currentDate}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateZonalTierDateOverlap(rowIndex)}"
						update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateZonalTierDateOverlap(rowIndex)}"
						update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateZonalTierPrice(rowIndex)}"
						update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateZonalTierPrice(rowIndex)}"
						update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="change"
						listener="#{catalogueBackingBean.validateZonalTierPrice(rowIndex)}"
						update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
				</p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{tier.endDate}" size="8" showOn="button" navigator="true"
					rendered="#{tier.showFlag}"
					mindate="#{catalogueBackingBean.managedBean.currentDate}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateZonalTierDateOverlap(rowIndex)}"
						update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateZonalTierDateOverlap(rowIndex)}"
						update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateZonalTierPrice(rowIndex)}"
						update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateZonalTierPrice(rowIndex)}"
						update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="change"
						listener="#{catalogueBackingBean.validateZonalTierPrice(rowIndex)}"
						update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
				</p:calendar>

			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.action']}
				</f:facet>

				<p:commandLink id="zTCloneLink" title="#{lbl['lbl.btn.clone']}"
					rendered="#{tier.showFlag}"
					disabled="#{tier.cmSupplierZone.suppZoneId eq 0 or tier.standardDisabled or tier.price eq null or tier.fromQty eq null or tier.toQty eq null or tier.fromQty >= tier.toQty or tier.startDate eq null or tier.endDate eq null or tier.startDate >= tier.endDate or !tier.displayAction}"
					action="#{catalogueBackingBean.cloneZonalTierPrice(rowIndex)}"
					update=":form:pricingTabID:headerTabId:zonalTierId:cmZonalTierPricingsId, :form:pricingTabID:headerTabId:zonalTierId:addZonalTierButton">
					<p:graphicImage value="/css/images/design/add.png"></p:graphicImage>
				</p:commandLink>
				<p:commandLink title="#{lbl['lbl.btn.delete']}" id="zTDeleteLink"
					rendered="#{tier.showFlag}"
					action="#{catalogueBackingBean.setZonalRowIndex}"
					oncomplete="confirmationZonal.show()"
					update=":form:pricingTabID:headerTabId:zonalTierId:cmZonalTierPricingsId">
					<f:param name="index" value="#{rowIndex}"></f:param>
					<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
				</p:commandLink>
				<p:commandLink id="zTPromoLink"
					title="#{lbl['lbl.cm.add.to.promotion']}"
					rendered="#{tier.showFlag}"
					disabled="#{tier.cmSupplierZone.suppZoneId eq 0 or tier.price eq null or tier.fromQty eq null or tier.toQty eq null or tier.fromQty >= tier.toQty or tier.startDate eq null or tier.endDate eq null or tier.startDate >= tier.endDate or !tier.displayAction}"
					action="#{catalogueBackingBean.addToZonalTierPromotion(rowIndex)}"
					update=":form:pricingTabID:headerTabId:zonalTierId">
					<p:graphicImage height="16" width="16" value="/css/images/design/promo.png" ></p:graphicImage>
				</p:commandLink>
				<h:panelGroup id="zTErrorLink">
					<p:commandLink title="#{lbl['lbl.txt.error']}" process="@this"
						actionListener="#{catalogueBackingBean.updateZonalTierErrorDialog(rowIndex)}"
						update=":form:pricingTabID:headerTabId:zonalTierId:cmZonalTierPricingsId, :form:errorDialog"
						rendered="#{(tier.cmSupplierZone.suppZoneId eq 0 or tier.price eq null or tier.fromQty eq null or tier.toQty eq null or tier.fromQty >= tier.toQty or tier.startDate eq null or tier.endDate eq null or tier.startDate >= tier.endDate or !tier.displayAction or !tier.checkOk)}"
						oncomplete="errorDialog.show();">
						<f:param name="index" value="#{rowIndex}"></f:param>
						<p:graphicImage value="/css/images/design/icon_error.png"></p:graphicImage>
					</p:commandLink>
					<p:graphicImage value="/css/images/design/icon_success.png"
						rendered="#{!(tier.cmSupplierZone.suppZoneId eq 0 or tier.price eq null or tier.fromQty eq null or tier.toQty eq null or tier.fromQty >= tier.toQty or tier.startDate eq null or tier.endDate eq null or tier.startDate >= tier.endDate or !tier.displayAction or !tier.checkOk)}"></p:graphicImage>
				</h:panelGroup>


			</p:column>

		</p:dataTable>

		<div class="clear"></div>


		<table style="width: 100%">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.cm.add']}"
						id="addZonalTierButton" style="float:right;"
						rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'D' ||
							((catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'U' || catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'R' || catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'E') and (unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin or unspscCodeBackingBean.allSupplier))}"
						disabled="#{catalogueBackingBean.disableAddZonalTier()}"
						action="#{catalogueBackingBean.addNewZonalTierPricing()}"
						update="cmZonalTierPricingsId, :form:pricingTabID:headerTabId:zonalTierId:addZonalTierButton"
						process="@this cmZonalTierPricingsId"></p:commandButton></td>
				<td style="width: 20px"><p:graphicImage id="uidti"
						value="/css/images/design/tooltips.png" /> <p:tooltip id="uidtt"
						for="uidti">
						<p:outputLabel escape="false"
							value="#{lbl['lbl.cm.addnew.tooltip']}" />
					</p:tooltip></td>
			</tr>
		</table>


		<p:confirmDialog id="confirmDeleteZonalTierId"
			message="#{lbl['lbl.cm.dialog.cofirm.delete.msg']}"
			header="#{lbl['lbl.cm.dialog.cofirm.header']}"
			widgetVar="confirmationZonal">

			<p:commandButton id="conf" value="#{lbl['lbl.cm.dialog.cofirm.yes']}"
				actionListener="#{catalogueBackingBean.deleteZonalTierPrice()}"
				update=":form" oncomplete="confirmationZonal.hide()" />
			<p:commandButton id="decline"
				value="#{lbl['lbl.cm.dialog.cofirm.no']}"
				onclick="confirmationZonal.hide()" />

		</p:confirmDialog>




	</p:outputPanel>


</ui:composition>
