<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<table style="width:100%;margin: 5px;">
		<tr>
			<td><p:outputLabel value="#{catalogueBackingBean.managedBean.expiryAlert}" style="float:left;font-weight: bold;" /></td>
		</tr>	
	</table>

	<p:dataTable id="publishSupplierItemID" lazy="true" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		value="#{catalogueBackingBean.managedBean.publishSearchDataModel}"
		rowIndexVar="rowIndex" var="publish"
		rowKey="#{publish.supplierItemId}"
		rows="10">

		
		<ac:paginator for="publishSupplierItemID"></ac:paginator>
		
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.item.code']}
			</f:facet>
			<h:outputText value="#{publish.cmItem.extensionCode}" style="white-space: normal"/>
		</p:column>
		<p:column width="20%" style="white-space: normal;">
			<f:facet name="header">
				#{lbl['lbl.cm.item.name']}
			</f:facet>
			<h:outputText value="#{publish.cmItem.itemName}" style="white-space: normal"/>
			
			

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.price']}
			</f:facet>
			<p:inputText value="#{publish.cmStandardPricing.price}" size="10" disabled="true" style="text-align:right">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>
		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.uom']}
			</f:facet>
			<p:inputText value="#{publish.pmUom.uomName}" disabled="true"></p:inputText>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.start.date']}
			</f:facet>
			<p:calendar value="#{publish.cmStandardPricing.startDate}"
				showOn="button" size="10"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.end.date']}
			</f:facet>
			<p:calendar value="#{publish.cmStandardPricing.endDate}"
				showOn="button" size="10"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>

		</p:column>
		<p:column width="2%">
			<f:facet name="header">
				#{lbl['lbl.cm.action']}
			</f:facet>
			<p:commandLink title="#{lbl['lbl.cm.zm.edit']}"
				action="#{catalogueBackingBean.navigateToPublishedItemDet(rowIndex)}">
				<p:graphicImage value="/css/images/design/edit.png"></p:graphicImage>
			</p:commandLink>

		</p:column>
	</p:dataTable>

</ui:composition>
