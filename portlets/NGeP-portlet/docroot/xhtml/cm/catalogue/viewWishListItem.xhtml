<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="contentSection">

		<h:panelGroup id="viewWishListItemId">



			<ui:include src="catalogueMenuBar.xhtml"></ui:include>


			<h:panelGrid columns="2" columnClasses="cmLeft,cmRight" width="100%">


				<p:dataGrid var="type" rowIndexVar="rowIndex"
					value="#{catalogueBackingBean.managedBean.wishLists}" columns="1"
					style="width: 100%;">
					<p:commandLink value="#{type.wishlistDesc}"
						action="#{wishListBackingBean.filterWishListType(rowIndex)}"
						update=":form:datagrid" />
				</p:dataGrid>


				<p:dataGrid var="wishLists"
					value="#{wishListBackingBean.managedBean.selectedWishList.cmWishlistDtls}"
					rowIndexVar="rowIndex" columns="1" rows="3" id="datagrid">

					<p:panel header="#{wishLists.cmWishlist.wishlistDesc}">
						<table style="width: 100%;">
							<tr>
								<td style="width: 30%;"><p:graphicImage height="50" width="50" /></td>
								<td style="width: 50%;"><p:commandLink
										value="#{wishLists.cmSupplierItem.cmItem.itemName}" /></td>
								<td style="width: 20%;"><p:splitButton value="Action" icon="ui-icon-action">
										<p:menuitem value="Add To Cart" />
										<p:menuitem value="Delete"
											action="#{wishListBackingBean.deleteWishListItem(rowIndex)}"
											icon="ui-icon-delete" update="datagrid" />
									</p:splitButton></td>

							</tr>
						</table>
					</p:panel>


				</p:dataGrid>


			</h:panelGrid>


		</h:panelGroup>

	</ui:define>

</ui:composition>
