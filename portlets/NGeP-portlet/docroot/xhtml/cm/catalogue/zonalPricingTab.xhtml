<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:outputPanel id="zonalPricePageID">
		<p:dataTable id="zonalPricingID" 
			value="#{catalogueBackingBean.managedBean.zonalPricingList}" var="zonal"  rowKey="#{zonal.pricingSeq}"
			selection="#{catalogueBackingBean.managedBean.selectedPricing}"  width="100%" selectionMode="single">
			
			

			<p:ajax event="rowSelect" process="@this" listener="#{catalogueBackingBean.districtChecked()}"
						update=":form:pricingTabID:zonalPricePageID"></p:ajax>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.state']}" />
				</f:facet>
				<h:selectOneMenu></h:selectOneMenu>

			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.district']}" />
				</f:facet>
				<h:selectBooleanCheckbox value="#{zonal.selected}">

				</h:selectBooleanCheckbox>

			</p:column>



			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.pricing.type']}" />
				</f:facet>
				<h:selectOneMenu value="#{zonal.pricingType}">
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.pricingCriteria}" />
				</h:selectOneMenu>

			</p:column>


			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.price']}" />
				</f:facet>
				<h:inputText value="#{zonal.price}"></h:inputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.tier.from']}" />
				</f:facet>
				<h:inputText value="#{zonal.tierFrom}"></h:inputText>

			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.tier.to']}" />
				</f:facet>
				<h:inputText value="#{zonal.tierTo}"></h:inputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.start.date']}" />
				</f:facet>
				<p:calendar value="#{zonal.startDate}"></p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.end.date']}" />
				</f:facet>
				<p:calendar value="#{zonal.endDate}"></p:calendar>

			</p:column>

		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.cm.add']}"
				action="#{catalogueBackingBean.addNewZonalPricing()}"
				update="zonalPricePageID" process="@this"></p:commandButton>
		</div>



		<p:dataTable id="districtID" width="100%"
			value="#{catalogueBackingBean.managedBean.districtPricingList}"
			var="districtObj"
			rendered="#{catalogueBackingBean.managedBean.districtIND}">

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.district']}" />
				</f:facet>
				<h:selectOneMenu></h:selectOneMenu>

			</p:column>



			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.pricing.type']}" />
				</f:facet>
				<h:selectOneMenu value="#{districtObj.pricingType}">
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.pricingCriteria}" />
				</h:selectOneMenu>

			</p:column>


			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.price']}" />
				</f:facet>
				<h:inputText value="#{districtObj.price}"></h:inputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.tier.from']}" />
				</f:facet>
				<h:inputText value="#{districtObj.tierFrom}"></h:inputText>

			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.tier.to']}" />
				</f:facet>
				<h:inputText value="#{districtObj.tierTo}"></h:inputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.start.date']}" />
				</f:facet>
				<p:calendar value="#{districtObj.startDate}"></p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.end.date']}" />
				</f:facet>
				<p:calendar value="#{districtObj.endDate}"></p:calendar>

			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.cm.add']}"
				action="#{catalogueBackingBean.addNewDistrictPricing()}"
				update="zonalPricePageID" process="@this" rendered="#{catalogueBackingBean.managedBean.districtIND}"></p:commandButton>
		</div>

	</p:outputPanel>


</ui:composition>
