<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:outputPanel id="zonalPricePageID">
		<p:dataTable id="zonalPricingID"
			value="#{catalogueBackingBean.managedBean.zonalPricingList}"
			var="zonal" rowKey="#{zonal}"
			selection="#{catalogueBackingBean.managedBean.selectedPricing}"
			width="100%" selectionMode="single">



			<p:ajax event="rowSelect" process="@this"
				listener="#{catalogueBackingBean.districtChecked()}"
				update=":form:pricingTabID:zonalPricingTabId:zonalPricePageID"></p:ajax>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.state.name']}
				</f:facet>
				<p:selectOneMenu style="width: 128px;"
						value="#{}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems
							value="#{unspscCodeBackingBean.managedBean.stateList}"
							var="state" itemLabel="#{state.stateName}"
							itemValue="#{state.stateId}"></f:selectItems>
					</p:selectOneMenu>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.district']}
				</f:facet>
				<p:selectBooleanCheckbox value="#{zonal.selected}">

				</p:selectBooleanCheckbox>

			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.district.name']}
				</f:facet>
				<p:selectOneMenu></p:selectOneMenu>

			</p:column>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<h:inputText value="#{zonal.price}" size="10"></h:inputText>
			</p:column>
		
			
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{zonal.startDate}" showOn="button"></p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{zonal.endDate}" showOn="button"></p:calendar>

			</p:column>

		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.cm.add']}"
				action="#{catalogueBackingBean.addNewZonalPricing()}"
				update="zonalPricePageID" process="@this"></p:commandButton>
		</div>




	</p:outputPanel>


</ui:composition>
