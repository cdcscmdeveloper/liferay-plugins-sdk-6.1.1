<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<ui:define name="contentSection">

		<p:messages id="contractRequestViewId" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>

		<table style="width:100%">
			<tr>
				<td style="text-align: left;width:60%"><p:commandButton value="#{lbl['lbl.cm.back']}"						
						action="#{catalogueBackingBean.backTocatalogueSearch}" /></td>
				<td style="width:10%"><p:outputLabel value="#{lbl['lbl.fl.fs.no']}" rendered="#{not empty catalogueBackingBean.managedBean.availableNoList}"/></td>
				<td style="text-align: right; width: 5%"><p:selectOneMenu id="schedule" value="#{catalogueBackingBean.managedBean.scheduleNo}" rendered="#{not empty catalogueBackingBean.managedBean.availableNoList}">
						<f:selectItems value="#{catalogueBackingBean.managedBean.availableNoList}"/>
					</p:selectOneMenu></td>
				<td style="text-align: right;width:12%"><p:commandButton id="navigateCR" disabled="#{empty catalogueBackingBean.managedBean.ctRequestList}"
						value="#{lbl['lbl.cm.contract.request']}" action="#{catalogueBackingBean.navigateToCR}"/></td>
			</tr>
		</table>

		<p:panel header="#{lbl['lbl.cm.list.of.items']}" toggleable="true">

			<p:dataTable emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{catalogueBackingBean.managedBean.ctRequestList}"
				id="contractRequestId" rowIndexVar="rowIndex" var="contractObj"
				width="100%">



				<ac:paginator for="contractRequestId"></ac:paginator>

				<p:column headerText="#{lbl['lbl.cm.image']}">
					<h:panelGroup rendered="#{contractObj.imagePath == null}">
						<p:outputPanel
							style="border: 1px solid #808080; display: block; vertical-align: middle; padding: 20px 4px; text-align: center;">
								#{lbl['lbl.cm.no.image.available']}
								</p:outputPanel>

					</h:panelGroup>
					<h:panelGroup rendered="#{contractObj.imagePath != null}">
						<img
							src="/NGeP-portlet/image?imageName=#{contractObj.epNo}/#{contractObj.imagePath}"
							style="height: 80px; left: 0px !important;" />
					</h:panelGroup>
				</p:column>

				<p:column headerText="#{lbl['lbl.cm.item.name']}">
								#{contractObj.itemName}
							</p:column>

				<p:column width="10%" headerText="#{lbl['lbl.cm.contact.no']}">
								#{contractObj.contractNo}
							</p:column>

				<p:column width="10%" headerText="#{lbl['lbl.cm.circular.no']}">
								#{contractObj.circularNo}
							</p:column>

				<p:column headerText="#{lbl['lbl.cm.supplier.name']}">
					#{contractObj.companyName}		
				</p:column>

				<p:column headerText="UOM">
							#{contractObj.uomName}
							</p:column>

				<p:column headerText="#{lbl['lbl.cm.action']}" width="2%">
					<p:commandLink
						action="#{catalogueBackingBean.deleteContractRequestItem(rowIndex)}"
						update=":form:contractRequestId,:form:navigateCR">
						<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
					</p:commandLink>
				</p:column>


			</p:dataTable>




		</p:panel>

	</ui:define>

</ui:composition>
