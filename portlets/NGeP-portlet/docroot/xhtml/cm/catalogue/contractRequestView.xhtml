<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<ui:define name="contentSection">

		<p:messages id="contractRequestViewId" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>

		<table style="width: 100%;">
			<tr>
				<td style="text-align: left;"><p:commandButton value="Back"
						icon="ui-icon-back"
						action="#{catalogueBackingBean.backTocatalogueSearch}" /></td>
				<td style="text-align: right;"><p:commandButton
						value="Contract Request" action="#{catalogueBackingBean.navigateToCR}"/></td>
			</tr>
		</table>

		<p:panel header="#{lbl['lbl.cm.list.of.items']}" toggleable="true">

			<p:dataTable
				value="#{catalogueBackingBean.managedBean.ctRequestList}"
				id="contractRequestId" rowIndexVar="rowIndex" var="contractObj"
				width="100%">



				<ac:paginator for="contractRequestId"></ac:paginator>

				<p:column headerText="#{lbl['lbl.cm.image']}">
					<p:graphicImage value="/images/#{contractObj.imagePath}"
						height="80" width="80" />
				</p:column>

				<p:column headerText="#{lbl['lbl.cm.item.name']}">
								#{contractObj.itemName}
							</p:column>

				<p:column width="10%" headerText="#{lbl['lbl.cm.contact.no']}">
								#{contractObj.contractNo}
							</p:column>

				<p:column width="10%" headerText="#{lbl['lbl.cm.circular.no']}">
								#{contractObj.circularNo}
							</p:column>

				<p:column headerText="#{lbl['lbl.cm.supplier.name']}">
					#{contractObj.companyName}		
				</p:column>

				<p:column headerText="UOM">
							#{contractObj.uomName}
							</p:column>

				<p:column headerText="Action" width="2%">
					<p:commandLink
						action="#{catalogueBackingBean.deleteContractRequestItem(rowIndex)}"
						update=":form:contractRequestId">
						<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
					</p:commandLink>
				</p:column>


			</p:dataTable>




		</p:panel>

	</ui:define>

</ui:composition>
