<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<h:panelGroup id="catalogueTaskListId">

			<p:remoteCommand name="reviewCat"
				action="#{reviewCatBackingBean.navigateToCatalogDet}" />

			<p:dataTable rowKey="#{review.supplierItemId}"
				value="#{reviewCatBackingBean.managedBean.reviewSupplierItems}"
				var="review" selectionMode="single"
				selection="#{reviewCatBackingBean.managedBean.selectedReviewCat}">

				<p:ajax event="rowSelect" oncomplete="reviewCat();" />

				<p:column>
					<f:facet name="header">
						#{lbl['lbl.cm.item.name']}
					</f:facet>
			
			#{review.cmItem.itemName}

		</p:column>
			</p:dataTable>



		</h:panelGroup>

	</ui:define>

</ui:composition>
