<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="contentSection">

		<h:panelGroup id="compareCatalogueId">

			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.cm.back']}" icon="ui-icon-back"
					action="#{catalogueBackingBean.backToPervious()}" process="@this"></p:commandButton>
			</div>


			<h:panelGrid columns="2" style="width:100%;"
				columnClasses="comparelabelCss compareValueCss">


				
				<ui:repeat var="label"
					value="#{catalogueBackingBean.managedBean.compareLabel}">
					<p:panel styleClass="comparePanelLabel">
						<h:outputLabel value="#{label}" />
					</p:panel>
				</ui:repeat>



				<p:dataGrid id="compareDataList" rowIndexVar="compareKey"
					paginator="true" styleClass="datagridfloat" 
					value="#{catalogueBackingBean.managedBean.selectedSupplierItemList}"
					var="supplierItem" columns="4" rows="4" paginatorPosition="bottom"
					paginatorTemplate="{PageLinks} ">


					<table>

						<tr>
							<td colspan="5"><p:graphicImage
									value="/resources/ep/images/product/computer/879949914_125.jpg" height="80px"></p:graphicImage></td>
						</tr>
						<tr height="31px"
							style="border-bottom: 2px solid #FFFFFF !important;">
							<td colspan="5" style="background-color: #f5f5f5;"><p:commandLink
									rendered="#{unspscCodeBackingBean.requisitioner}">
									<p:graphicImage
										value="/resources/ep/images/design/icon_txt.png" height="15px"></p:graphicImage>
								</p:commandLink> <p:commandLink
									rendered="#{unspscCodeBackingBean.requisitioner}"
									disabled="#{catalogueBackingBean.managedBean.contractedExist}">
									<p:graphicImage
										value="/resources/ep/images/design/icon_txt.png" height="15px"></p:graphicImage>
								</p:commandLink> <p:commandLink
									rendered="#{unspscCodeBackingBean.requisitioner}"
									disabled="#{catalogueBackingBean.managedBean.contractedExist}">
									<p:graphicImage
										value="/resources/ep/images/design/icon_txt.png" height="15px"></p:graphicImage>
								</p:commandLink> <p:commandLink
									rendered="#{unspscCodeBackingBean.requisitioner}"
									disabled="#{catalogueBackingBean.managedBean.contractedExist}">
									<p:graphicImage library="ep/images/design" name="cart_add.png" />
								</p:commandLink> <p:commandLink
									action="#{catalogueBackingBean.deleteComparedItem(compareKey)}"
									update=":form:compareDataList">
									<p:graphicImage value="/resources/ep/images/design/trash.png"></p:graphicImage>
								</p:commandLink>&#160;</td>
						</tr>
						<tr height="31px"
							style="border-bottom: 2px solid #FFFFFF !important;">
							<td colspan="5" style="background-color: #f5f5f5;">#{supplierItem.cmItem.itemName}&#160;</td>
						</tr>
						<tr height="31px"
							style="border-bottom: 2px solid #FFFFFF !important;">
							<td colspan="5" style="background-color: #f5f5f5;">#{supplierItem.cmItem.extensionCode}&#160;</td>
						</tr>
						<tr height="31px"
							style="border-bottom: 2px solid #FFFFFF !important;">
							<td colspan="5" style="background-color: #f5f5f5;">#{supplierItem.cmStandardPricing.price} <p:commandLink
									value="More.."
									action="#{catalogueBackingBean.popUpPricing(supplierItem)}"
									oncomplete="morePrice.show()"
									rendered="#{unspscCodeBackingBean.requisitioner}"
									update=":form:catalogueViewPricingId"></p:commandLink>&#160;
							</td>
						</tr>
						<tr height="31px"
							style="border-bottom: 2px solid #FFFFFF !important;">
							<td colspan="5" style="background-color: #f5f5f5;">#{supplierItem.smSupplier.companyName}&#160;</td>
						</tr>
						<tr height="31px"
							style="border-bottom: 2px solid #FFFFFF !important;">
							<td colspan="5" style="background-color: #f5f5f5;">#{supplierItem.skuNumber}&#160;</td>
						</tr>
						<tr height="31px"
							style="border-bottom: 2px solid #FFFFFF !important;">
							<td colspan="5" style="background-color: #f5f5f5;">#{supplierItem.minOrder}&#160;</td>
						</tr>
						<tr height="31px"
							style="border-bottom: 2px solid #FFFFFF !important;">
							<td colspan="5" style="background-color: #f5f5f5;">#{supplierItem.leadTime}&#160;</td>
						</tr>
						<tr height="31px"
							style="border-bottom: 2px solid #FFFFFF !important;">
							<td colspan="5" style="background-color: #f5f5f5;">#{supplierItem.itemDesc}&#160;</td>
						</tr>


					</table>


				</p:dataGrid>



			</h:panelGrid>

			<p:dialog id="morePrice" widgetVar="morePrice" modal="true"
				header="More Price" width="800" height="250">

				<p:tabView id="catalogueViewPricingId">
					<p:tab title="Normal">
						<ui:include src="/xhtml/cm/pricing/pricingTab.xhtml" />
					</p:tab>
					<p:tab title="#{lbl['lbl.cm.tier']}"
						rendered="#{fn:length(catalogueBackingBean.managedBean.supplierItemObj.cmTierPricings) > 0}">
						<ui:include src="/xhtml/cm/pricing/pricingTierTab.xhtml" />
					</p:tab>
					<p:tab title="#{lbl['lbl.cm.promotion.tier']}"
						rendered="#{fn:length(catalogueBackingBean.managedBean.supplierItemObj.cmPromotionTierPricings) > 0}">
						<ui:include src="/xhtml/cm/pricing/pricingPromotionTierTab.xhtml" />
					</p:tab>
					<p:tab title="Zonal Standard"
						rendered="#{fn:length(catalogueBackingBean.managedBean.supplierItemObj.cmZonalStandardPricings) > 0}">
						<ui:include src="/xhtml/cm/pricing/zonalStandardPricingTab.xhtml"></ui:include>

					</p:tab>
					<p:tab title="Zonal Promotion"
						rendered="#{fn:length(catalogueBackingBean.managedBean.supplierItemObj.cmZonalPromotionPricings) > 0}">
						<ui:include src="/xhtml/cm/pricing/zonalPromotionPricingTab.xhtml"></ui:include>

					</p:tab>

					<p:tab title="Zonal Tier"
						rendered="#{fn:length(catalogueBackingBean.managedBean.supplierItemObj.cmZonalTierPricings) > 0}">
						<ui:include src="/xhtml/cm/pricing/zonalTierPricingTab.xhtml"></ui:include>

					</p:tab>
					<p:tab title="Zonal Promotion Tier"
						rendered="#{fn:length(catalogueBackingBean.managedBean.supplierItemObj.cmZonalPromotionTierPricings) > 0}">
						<ui:include
							src="/xhtml/cm/pricing/zonalPromotionTierPricingTab.xhtml"></ui:include>

					</p:tab>
				</p:tabView>

			</p:dialog>





		</h:panelGroup>

	</ui:define>

</ui:composition>
