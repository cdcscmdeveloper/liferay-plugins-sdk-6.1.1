<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<h:panelGroup id="compareCatalogueId">

			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.cm.back']}" icon="ui-icon-cancel"
					action="#{catalogueBackingBean.backToPervious()}" process="@this"></p:commandButton>
			</div>


			<h:panelGrid columns="2" style="width:100%;" columnClasses="comparelabelCss compareValueCss">

				<h:panelGroup>
					<table>
						<tr>
							<td height="70px"></td>
						</tr>
					</table>
					<ui:repeat var="label"
						value="#{catalogueBackingBean.managedBean.compareLabel}">
						<p:panel styleClass="comparePanelLabel">
							<h:outputLabel value="#{label}" />
						</p:panel>
					</ui:repeat>

				</h:panelGroup>



				<p:dataGrid id="compareDataList" rowIndexVar="compareKey"
					paginator="true"
					value="#{catalogueBackingBean.managedBean.selectedSupplierItemList}"
					var="compare" columns="4" rows="4" paginatorPosition="bottom">
					<h:panelGroup >
						<table>
							<tr>
								<td rowspan="3"><p:graphicImage
										value="/resources/ep/images/product/computer/879949914_125.jpg"
										height="100px" width="100px" /></td>
								<td></td>
								<td colspan="1"><p:commandLink
										action="#{catalogueBackingBean.deleteComparedItem(compareKey)}"
										update=":form:compareDataList">
										<p:graphicImage value="/resources/ep/images/design/trash.png"></p:graphicImage>
									</p:commandLink></td>
							</tr>
						</table>



						<h:panelGrid
							styleClass="comparePanel">
					#{compare.cmItem.itemName}
				</h:panelGrid>
						<h:panelGrid styleClass="comparePanel">
					#{compare.cmItem.itemDesc}
				</h:panelGrid>

						<h:panelGrid
							styleClass="comparePanel">
					#{compare.smSupplier.supplierName}
				</h:panelGrid>
						
						<h:panelGrid
							styleClass="comparePanel">
					#{compare.skuNumber}
				</h:panelGrid>
						<h:panelGrid
							styleClass="comparePanel">
					#{compare.paymentTerms}
				</h:panelGrid>

						<h:panelGrid
							styleClass="comparePanel">
					#{compare.itemDesc}
				</h:panelGrid>

					</h:panelGroup>
				</p:dataGrid>



			</h:panelGrid>





		</h:panelGroup>

	</ui:define>

</ui:composition>
