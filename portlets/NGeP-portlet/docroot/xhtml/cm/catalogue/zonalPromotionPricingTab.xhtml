<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:outputPanel id="cmZonalPromotionPricings">
		<p:dataTable id="cmZonalPromotionPricingsId"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalPromotionPricings}"
			var="zPromotion" rowKey="#{zPromotion}" rowIndexVar="rowIndex"
			width="100%">



			<p:column>
				<f:facet name="header">
					Zone Name
				</f:facet>
				<p:selectOneMenu style="width: 128px;" rendered="#{standard.showFlag}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItem itemLabel="Zone A" itemValue="" />
					<f:selectItem itemLabel="Zone B" itemValue="" />
					
				</p:selectOneMenu>

			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<h:inputText value="#{zPromotion.price}" size="10"></h:inputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{zPromotion.startDate}" showOn="button"
					size="10" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{zPromotion.endDate}" showOn="button" size="10"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.action']}
				</f:facet>
				<p:commandLink style="margin-left: 10px;" title="Delete"
					action="#{catalogueBackingBean.deleteZonalPromotionPrice(rowIndex)}"
					update=":form:pricingTabID:headerTabId:zonalId:cmZonalPromotionPricingsId">
					<p:graphicImage value="/resources/ep/images/design/trash.png"></p:graphicImage>
				</p:commandLink>

			</p:column>


		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.cm.add']}"
				action="#{catalogueBackingBean.addNewZonalPromotionPricing()}"
				update="cmZonalPromotionPricingsId"
				process="cmZonalPromotionPricingsId @this"></p:commandButton>
		</div>




	</p:outputPanel>


</ui:composition>
