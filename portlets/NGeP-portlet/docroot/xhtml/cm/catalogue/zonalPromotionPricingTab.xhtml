<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:outputPanel id="cmZonalPromotionPricings">
		<p:dataTable id="cmZonalPromotionPricingsId"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalPromotionPricings}"
			var="zPromotion" rowKey="#{zPromotion}" rowIndexVar="rowIndex"
			width="100%">



			<p:column>
				<f:facet name="header">
					Zone Name
				</f:facet>
				<p:selectOneMenu value="#{zPromotion.cmSupplierZone.suppZoneId}" disabled="#{zPromotion.standardDisabled}"
					style="width: 128px;">
					<f:selectItem itemLabel="Select One" itemValue="0" />
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.supplierZoneList}"
						var="zone" itemLabel="#{zone.suppZoneName}"
						itemValue="#{zone.suppZoneId}"></f:selectItems>

					<p:ajax event="change" listener="#{catalogueBackingBean.validateZonalPromoDateOverlap(rowIndex)}" update="zonalPromoErrorLink" />

				</p:selectOneMenu>

			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<p:inputText value="#{zPromotion.price}" size="10" disabled="#{zPromotion.standardDisabled}" style="text-align:right">
					<p:ajax event="keyup" update="zonalPromoErrorLink" />
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{zPromotion.startDate}" showOn="button" disabled="#{zPromotion.standardDisabled}" mindate="#{catalogueBackingBean.managedBean.currentDate}"
					size="10" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="keyup" listener="#{catalogueBackingBean.validateZonalPromoDateOverlap(rowIndex)}" update="zonalPromoErrorLink" />
					<p:ajax event="dateSelect" listener="#{catalogueBackingBean.validateZonalPromoDateOverlap(rowIndex)}" update="zonalPromoErrorLink" />
				</p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{zPromotion.endDate}" showOn="button" size="10" disabled="#{zPromotion.standardDisabled}" mindate="#{catalogueBackingBean.managedBean.currentDate}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="keyup" listener="#{catalogueBackingBean.validateZonalPromoDateOverlap(rowIndex)}" update="zonalPromoErrorLink" />
					<p:ajax event="dateSelect" listener="#{catalogueBackingBean.validateZonalPromoDateOverlap(rowIndex)}" update="zonalPromoErrorLink" />
					</p:calendar>

			</p:column>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.action']}
				</f:facet>
				<table width="5%">
					<tr>
						<td style="float: right;"><p:commandLink
								style="margin-left: 10px;" title="Delete" disabled="#{zPromotion.standardDisabled}"
								action="#{catalogueBackingBean.deleteZonalPromotionPrice(rowIndex)}"
								update=":form:pricingTabID:headerTabId:zonalId:cmZonalPromotionPricingsId">
								<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
							</p:commandLink></td>

						<td style="text-align: right;">
							<p:panel id="zonalPromoErrorLink" styleClass="noBorders tr,noBorders td">
								<p:commandLink title="Error" process="@this"
									actionListener="#{catalogueBackingBean.updateZonalPromoErrorDialog(rowIndex)}"
									update=":form" oncomplete="errorDialog.show();"
									rendered="#{(zPromotion.price eq null or zPromotion.startDate eq null or zPromotion.endDate eq null or zPromotion.startDate >= zPromotion.endDate or zPromotion.cmSupplierZone.suppZoneId == 0 or !zPromotion.displayAction)}">
									<p:graphicImage
										value="/css/images/design/icon_error.png"></p:graphicImage>
								</p:commandLink>
								<p:graphicImage value="/css/images/design/icon_success.png" 
									rendered="#{!(zPromotion.price eq null or zPromotion.startDate eq null or zPromotion.endDate eq null or zPromotion.startDate >= zPromotion.endDate or zPromotion.cmSupplierZone.suppZoneId == 0 or !zPromotion.displayAction)}"></p:graphicImage>
							</p:panel>
						</td>
					</tr>
				</table>

			</p:column>


		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.cm.add']}" rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'D' || catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'U'}"
				action="#{catalogueBackingBean.addNewZonalPromotionPricing}"
				update="cmZonalPromotionPricingsId" icon="ui-icon-add"
				process="cmZonalPromotionPricingsId @this"></p:commandButton>
		</div>




	</p:outputPanel>


</ui:composition>
