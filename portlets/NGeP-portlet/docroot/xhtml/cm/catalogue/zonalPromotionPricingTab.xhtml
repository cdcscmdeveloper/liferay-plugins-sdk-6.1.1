<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:outputPanel id="cmZonalPromotionPricings">
		<p:dataTable id="cmZonalPromotionPricingsId" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalPromotionPricings}"
			var="zPromotion" rowKey="#{zPromotion}" rowIndexVar="rowIndex"
			width="100%">



			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.zm.name']}
				</f:facet>
				<p:selectOneMenu value="#{zPromotion.cmSupplierZone.suppZoneId}"
					disabled="#{zPromotion.standardDisabled}" style="width: 128px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="0" />
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.supplierZoneList}"
						var="zone" itemLabel="#{zone.suppZoneName}"
						itemValue="#{zone.suppZoneId}"></f:selectItems>

					<p:ajax event="change"
						listener="#{catalogueBackingBean.validateZonalPromoDateOverlap(rowIndex)}"
						update="zonalPromoErrorLink" />

				</p:selectOneMenu>

			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<p:inputText id="zonalPromoPriceId" value="#{zPromotion.price}" size="10" style="text-align:right" maxlength="18">
					<p:ajax process="@this" listener="#{catalogueBackingBean.validatePromotionPrice(rowIndex)}" update="zonalPromoErrorLink zonalPromoPriceId" />
						<f:converter converterId="bigDecimalConverter" />
				</p:inputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{zPromotion.startDate}" showOn="button" navigator="true"
					mindate="#{catalogueBackingBean.managedBean.currentDate}" size="10"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateZonalPromoDateOverlap(rowIndex)}"
						update="zonalPromoErrorLink" />
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateZonalPromoDateOverlap(rowIndex)}"
						update="zonalPromoErrorLink" />
				</p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{zPromotion.endDate}" showOn="button" size="10" navigator="true"
					mindate="#{catalogueBackingBean.managedBean.currentDate}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateZonalPromoDateOverlap(rowIndex)}"
						update="zonalPromoErrorLink" />
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateZonalPromoDateOverlap(rowIndex)}"
						update="zonalPromoErrorLink" />
				</p:calendar>

			</p:column>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.action']}
				</f:facet>
				<p:commandLink 
					title="#{lbl['lbl.btn.delete']}"
					action="#{catalogueBackingBean.deleteZonalPromotionPrice(rowIndex)}"
					update=":form">
					<p:graphicImage value="/css/images/design/trash.png" style="padding-right:10px;"></p:graphicImage>
				</p:commandLink>


				<h:panelGroup id="zonalPromoErrorLink">
					<p:commandLink title="#{lbl['lbl.txt.error']}" process="@this"
						actionListener="#{catalogueBackingBean.updateZonalPromoErrorDialog(rowIndex)}"
						update=":form" oncomplete="errorDialog.show();"
						rendered="#{(zPromotion.price eq null or zPromotion.startDate eq null or zPromotion.endDate eq null or zPromotion.startDate >= zPromotion.endDate or zPromotion.cmSupplierZone.suppZoneId == 0 or !zPromotion.displayAction)}">
						<p:graphicImage value="/css/images/design/icon_error.png"></p:graphicImage>
					</p:commandLink>
					<p:graphicImage value="/css/images/design/icon_success.png"
						rendered="#{!(zPromotion.price eq null or zPromotion.startDate eq null or zPromotion.endDate eq null or zPromotion.startDate >= zPromotion.endDate or zPromotion.cmSupplierZone.suppZoneId == 0 or !zPromotion.displayAction)}"></p:graphicImage>
				</h:panelGroup>

			</p:column>


		</p:dataTable>


	</p:outputPanel>


</ui:composition>
