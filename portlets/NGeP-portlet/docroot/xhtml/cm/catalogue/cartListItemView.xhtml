<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="contentSection">

		<h:panelGroup id="viewCartListId">

			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.cm.back']}" icon="ui-icon-prev"
					action="#{catalogueBackingBean.backToPrev}" />

			</div>
			<p:dataTable var="cartList" rowIndexVar="rowIndex"
				value="#{catalogueBackingBean.managedBean.cartList}">

				<p:column headerText="#{lbl['lbl.cm.item.name']}">
				
				#{cartList.cmItem.itemName}
				</p:column>

				<p:column headerText="#{lbl['lbl.cm.supplier.name']}">
				
				#{cartList.smSupplier.supplierName}
				</p:column>

				<p:column headerText="#{lbl['lbl.cm.action']}">

					<p:commandLink
						action="#{catalogueBackingBean.deleteCartItem(rowIndex)}"
						update=":form:viewCartListId">
						<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
					</p:commandLink>
				</p:column>


			</p:dataTable>



		</h:panelGroup>

	</ui:define>

</ui:composition>
