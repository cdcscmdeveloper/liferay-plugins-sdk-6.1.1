<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="contentSection">

		<h:panelGroup id="viewCartListId">



			<ui:include src="catalogueMenuBar.xhtml"></ui:include>


			<p:dataGrid var="cartList"
				value="#{catalogueBackingBean.managedBean.cartList}"
				rowIndexVar="rowIndex" columns="1" rows="3" id="cartID">


				<table style="width: 100%;">
					<tr>
						<td style="width: 30%;"><p:graphicImage height="50" width="50" /></td>
						<td style="width: 50%;"><p:commandLink value="#{cartList.cmItem.itemName}" /></td>
						<td style="width: 20%;"> <p:splitButton value="Action" icon="ui-icon-action">
								<p:menuitem value="Delete"
									action="#{catalogueBackingBean.deleteCartItem(rowIndex)}"
									icon="ui-icon-delete" update=":form:viewCartListId" />

							</p:splitButton></td>

					</tr>
				</table>

			</p:dataGrid>



		</h:panelGroup>

	</ui:define>

</ui:composition>
