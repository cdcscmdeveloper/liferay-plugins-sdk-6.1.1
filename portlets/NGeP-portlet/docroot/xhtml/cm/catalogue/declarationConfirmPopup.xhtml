<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<style>
		#{cc.attrs.dialogCSS}
		.confirm-ui-dialog{
			max-width: 500px;
			width: auto;
		}
		.confirm-ui-dialog .ui-dialog-content table{
			margin: auto;
		}
		.confirm-ui-dialog .ui-dialog-content table td label {
			white-space: normal;
			padding-left: 5px;
			display: inline !important;
			float: none !important;
		}
		.confirm-ui-dialog .ui-dialog-content{
			padding: 1em 1em !important;
			height: auto !important;
		}
		.confirm-ui-dialog .ui-dialog-content span img{
			margin-top: -4px;
		}
		.confirm-ui-dialog .ui-dialog {
		position: fixed !important;
		}
	
	</style>
	<p:dialog styleClass="confirm-ui-dialog" id="updateDeclareDialog" widgetVar="updateDeclareDialog"
		header="#{lbl['lbl.cm.dialog.cofirm.header']}" resizable="true"
		width="410" height="200" closable="true" modal="true">
		
		<p:outputPanel id="updateDeclareDialogPopup" layout="block">
		<table width="100%">
			<tr><td colspan="2" style="padding-bottom: 10px; vertical-align: top;">
				<p:outputLabel value="#{lbl['lbl.cm.suptemp.publish.sure']}" style="float: left;"/><br/>
			</td></tr>
			<tr>
				<td align="center" style="white-space: normal; word-wrap: break-word !important; vertical-align: top;">
					<p:selectBooleanCheckbox id="isDeclareChkBox" style="float:left;"
						value="#{catalogueBackingBean.declareChecked}">
						<p:ajax event="change" listener="#{catalogueBackingBean.enableBtn(catalogueBackingBean.declareChecked)}"
							update=":form:btnSection"/>
					</p:selectBooleanCheckbox>
				</td>
				<td>
					<p:outputLabel style="white-space: normal; word-wrap: break-word !important; vertical-align: top;" 
					value="#{lbl['lbl.cm.suptemp.publish.declare']}"/>
				</td>
			</tr>
		</table>
		<p:spacer height="1" />
		<div class="ppRightBtn">
			<p:remoteCommand name="rc" update=":form" action="#{catalogueBackingBean.submitToReviewItems(false)}"
			oncomplete="updateDeclareDialog.hide();"/>
			<p:outputPanel id="btnSection">
				<p:commandButton id="yesWithLoadId" value="#{lbl['lbl.btn.yes']}"
					disabled="#{!catalogueBackingBean.managedBean.yesEnable}"
					action="#{catalogueBackingBean.submitToReviewItems(false)}" update="@form"
					oncomplete="updateDeclareDialog.hide();"/>
		    	<p:commandButton id="noWithoutActionId" value="#{lbl['lbl.btn.no']}" immediate="true"
					oncomplete="updateDeclareDialog.hide();" />
			</p:outputPanel>
		</div>
		</p:outputPanel>
	</p:dialog>
</ui:composition>
