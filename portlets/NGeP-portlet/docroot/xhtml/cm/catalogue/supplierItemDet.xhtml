<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="supplierItemDet">

		<div style="text-align: right; float: left;">


			<p:commandButton value="#{lbl['lbl.cm.back']}" 
				action="#{catalogueBackingBean.cancelToSupplierItemSearch()}"
				immediate="true"></p:commandButton>
		</div>

<p:spacer height="40px;"></p:spacer>
		<p:panel header="#{lbl['lbl.cm.item.details']}" toggleable="true">

			<table style="width: 100%; margin-top: 10px;">
				<tr style="height: 30px;">
					<td rowspan="10" style="width: 250px;"><h:panelGrid
							styleClass="imageFrame">
							
							<p:galleria id="imageUploadID" autoPlay="false"
								value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmImages}"
								var="imageObj" panelWidth="200" panelHeight="150">
								<p:graphicImage id="imageId" height="150" width="200"
									value="/images/#{imageObj.imageName}" />
							</p:galleria>
						</h:panelGrid></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.item.code']}" /></td>
					<td><p:inputText disabled="true" size="35"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.extensionCode}"></p:inputText></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}" /></td>
					<td><p:inputTextarea disabled="true" style="width: 195px;"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.itemName}"></p:inputTextarea></td>

				</tr>




				<tr style="height: 30px;">

					<td><p:outputLabel value="#{lbl['lbl.cm.payment.term']}" /></td>
					<td><p:inputText
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.paymentTerms}"
							size="26" /> <p:inputText style="margin-left: 2px;" size="3"
							value="days" /></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.sku']}" /></td>
					<td><p:inputText size="35"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.skuNumber}"></p:inputText></td>
					<td></td>
				</tr>
				<tr style="height: 30px;">

					<td><p:outputLabel
							value="#{lbl['lbl.cm.manufacturing.part.no']}" /></td>
					<td><p:inputText size="35"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.manufacturer}"></p:inputText></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.model']}" /></td>
					<td colspan="1"><p:inputText size="35"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.modelNumber}"></p:inputText></td>
				</tr>

				<tr style="height: 30px;">

					<td><p:outputLabel
							value="#{lbl['lbl.cm.unit.of.measurement']}" /></td>
					<td><ac:lov id="uomLovId" lovId="PM_UOM" size="26"
							headerText="#{lbl['lbl.cm.item.table.uom']}" update=":form:addCatDet"
							saveObject="catalogueBackingBean.managedBean.selectedMaintainItem.pmUom"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.pmUom.uomName}"
							conditionField="recordStatus^1">
						</ac:lov> <ac:lovPopup /></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.lead.time']}" /></td>
					<td><p:inputText size="26"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.leadTime}" />
						<p:inputText style="margin-left: 2px;" size="3" value="days" /></td>
					<td></td>
				</tr>

				<tr style="height: 30px;">
					<td><p:outputLabel
							value="#{lbl['lbl.cm.additional.item.description']}" /></td>
					<td colspan="3"><p:inputTextarea style="width:510px;"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemDesc}" /></td>

				</tr>


			</table>
		</p:panel>





		<p:tabView id="pricingTabID" orientation="left">

			<p:tab id="supplierInfoId" title="Supplier Info">

				<ui:include src="supplierInfoTab.xhtml"></ui:include>

			</p:tab>

		</p:tabView>



	</p:outputPanel>


</ui:composition>
