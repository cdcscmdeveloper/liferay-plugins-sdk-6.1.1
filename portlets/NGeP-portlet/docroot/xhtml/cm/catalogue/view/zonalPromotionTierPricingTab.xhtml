<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="cmZonalPromotionTierPricings">
		<p:dataTable id="cmZonalPromotionTierPricingsId"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalPromotionTierPricings}"
			var="tier" rowKey="#{tier}" rowIndexVar="rowIndex" width="100%">

			<ac:paginator for="cmZonalPromotionTierPricingsId"></ac:paginator>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.zm.name']}
				</f:facet>
				<p:selectOneMenu value="#{tier.cmSupplierZone.suppZoneId}" style="width: 100%;" disabled="true">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="0" />
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.supplierZoneList}"
						var="zone" itemLabel="#{zone.suppZoneName}"
						itemValue="#{zone.suppZoneId}"></f:selectItems>
				</p:selectOneMenu>

			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<p:inputText value="#{tier.price}" size="10" readonly="true" style="text-align:right">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.from.qty']}
				</f:facet>
				<p:inputText value="#{tier.fromQty}" readonly="true" size="4" style="text-align:right"></p:inputText>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.to.qty']}
				</f:facet>
				<p:inputText value="#{tier.toQty}" readonly="true" size="4" style="text-align:right"></p:inputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{tier.startDate}" showOn="button" size="10"
					mindate="#{tier.minDate}" maxdate="#{tier.maxDate}" rendered="true" disabled="true" readonly="true"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
				</p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{tier.endDate}" showOn="button" size="10" mindate="#{tier.minDate}"
					maxdate="#{tier.maxDate}" rendered="true" disabled="true" readonly="true"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
				</p:calendar>

			</p:column>

			
		</p:dataTable>


	</p:outputPanel>


</ui:composition>
