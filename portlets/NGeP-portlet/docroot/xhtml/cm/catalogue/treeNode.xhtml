<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">




	<h:panelGroup id="treeNodeID">

		<p:remoteCommand id="deleteNode" name="deleteNode"
			action="#{catalogueBackingBean.onNodeDelete()}">
		</p:remoteCommand>

		<div id="autoScroll">
			<p:tree styleClass="border0" value="#{catalogueBackingBean.root}"
				cache="false" selectionMode="single"
				selection="#{catalogueBackingBean.selectedNode}" var="node"
				id="tree">

				<p:treeNode type="segment">
					<p:outputLabel value="#{node}" />
				</p:treeNode>

				<p:treeNode type="families">

					<table>
						<tr>
							<td><p:outputLabel value="#{node}" /></td>
							<td><p:commandLink value="#{lbl['lbl.btn.delete']}"
									onclick="deleteNode([{name:'name1',value:'#{node}'}]);" /></td>
						</tr>
					</table>

				</p:treeNode>



			</p:tree>
		</div>

		<div id="autoScroll">


			<p:tree styleClass="border0" value="#{catalogueBackingBean.root1}"
				var="node1">
				<p:treeNode>
					<p:outputLabel value="#{node1}" />
				</p:treeNode>
			</p:tree>

		</div>


		<div id="autoScroll">


			<p:tree styleClass="border0" value="#{catalogueBackingBean.root2}"
				var="node2">
				<p:treeNode>
					<p:outputLabel value="#{node2}" />
				</p:treeNode>
			</p:tree>

		</div>

	</h:panelGroup>




</ui:composition>
