<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns="http://www.w3.org/1999/xhtml">


<h:panelGroup id="wishListPopUpId">
	<table>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.cm.wish.list']}"></p:outputLabel></td>
			<td><p:inputText
					value="#{wishListBackingBean.managedBean.wishList.wishlistDesc}"></p:inputText></td>
			<td><p:commandButton value="create" 
					onclick="wishListPopUp.hide()" update="supplierItemViewID"
					action="#{wishListBackingBean.saveWishList}"></p:commandButton></td>
		</tr>
	</table>
	<div style="border-bottom: 1px solid;"></div>

	<div style="width: 100%;">
		<div style="float: left; width: 30%">
			<p:dataGrid id="selectWishList" columns="1"
				value="#{catalogueBackingBean.managedBean.selectedSupplierItemList}"
				var="obj">

				<h:panelGrid columns="2" columnClasses="columnLeft, columnRight">

					<p:outputLabel value="#{obj.cmItem.itemName}" />
					<p:graphicImage height="100px" width="100px" />
				</h:panelGrid>

			</p:dataGrid>
		</div>

		<div style="float: right; width: 65%">
			<p:dataTable id="allWishListId" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{catalogueBackingBean.managedBean.wishLists}" var="wishList"
				rowKey="#{wishList.wishlistId}"
				selection="#{wishListBackingBean.managedBean.selectedWishLists}">

				<p:column selectionMode="multiple" style="width:2%" />


				<p:column>
					<f:facet name="header">
						<p:outputLabel value="#{lbl['lbl.cm.wish.list']}" />
					</f:facet>
					<p:outputLabel value="#{wishList.wishlistDesc}" />
				</p:column>

			</p:dataTable>
			<p:commandButton value="#{lbl['lbl.cm.ok']}" 
				action="#{wishListBackingBean.addItemIntoWishList}"  
				onclick="wishListPopUp.hide()"></p:commandButton>
		</div>
	</div>


</h:panelGroup>



</ui:composition>
