<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="pricePromotionTierPageID">

		<p:dataTable id="pricingPromotionTierID" rowIndexVar="rowIndex" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionTierPricings}"
			width="100%" var="price">
			<ac:paginator for="pricingPromotionTierID"></ac:paginator>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.from.qty']}
				</f:facet>
				<p:inputText value="#{price.fromQty}" size="5" readonly="true" maxlength="6"
					disabled="#{price.standardDisabled}"></p:inputText>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.to.qty']}
				</f:facet>
				<p:inputText value="#{price.toQty}" size="5" readonly="true" maxlength="6"
					disabled="#{price.standardDisabled}"></p:inputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price.uom']}
				</f:facet>
				<p:inputText id="promotionTierId" value="#{price.price}" size="10" maxlength="18"
					style="text-align:right">
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateTierPromotionPrice(rowIndex)}"
						update="pTErrorLink, promotionTierId" />
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{price.startDate}" showOn="button" navigator="true"
					mindate="#{price.parentPrice.startDate}"
					maxdate="#{price.parentPrice.endDate}" rendered="#{price.showFlag}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.updateValidateGroupingDates(rowIndex)}"
						update=":form:pricingTabID:headerTabId:tierId:pricingPromotionTierID" />
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.updateValidateGroupingDates(rowIndex)}"
						update=":form:pricingTabID:headerTabId:tierId:pricingPromotionTierID" />
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateTierPromotionPrice(rowIndex)}"
						update=":form:pricingTabID:headerTabId:tierId:pricingPromotionTierID" />
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateTierPromotionPrice(rowIndex)}"
						update=":form:pricingTabID:headerTabId:tierId:pricingPromotionTierID" />
				</p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{price.endDate}" showOn="button" navigator="true"
					mindate="#{price.parentPrice.startDate}"
					maxdate="#{price.parentPrice.endDate}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
					rendered="#{price.showFlag}">
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.updateValidateGroupingDates(rowIndex)}"
						update=":form:pricingTabID:headerTabId:tierId:pricingPromotionTierID" />
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.updateValidateGroupingDates(rowIndex)}"
						update=":form:pricingTabID:headerTabId:tierId:pricingPromotionTierID" />
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateTierPromotionPrice(rowIndex)}"
						update=":form:pricingTabID:headerTabId:tierId:pricingPromotionTierID" />
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateTierPromotionPrice(rowIndex)}"
						update=":form:pricingTabID:headerTabId:tierId:pricingPromotionTierID" />
				</p:calendar>

			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.action']}
				</f:facet>



				<p:commandLink
					title="#{lbl['lbl.btn.delete']}" rendered="#{price.showFlag}"
					action="#{catalogueBackingBean.deletePromotionTierPrice(rowIndex)}"
					update=":form:pricingTabID:headerTabId:tierId:pricingPromotionTierID, :form:pricingTabID:headerTabId:tierId:pricingTierID">
					<p:graphicImage style="padding-right:10px;" value="/css/images/design/trash.png"></p:graphicImage>
				</p:commandLink>

				<h:panelGroup id="pTErrorLink">
					<p:commandLink title="#{lbl['lbl.txt.error']}" process="@this"
						actionListener="#{catalogueBackingBean.updatePromotionTierErrorDialog(rowIndex)}"
						update=":form:pricingTabID:headerTabId:tierId:pricingPromotionTierID, :form:errorDialog"
						oncomplete="errorDialog.show();"
						rendered="#{(price.price eq null || price.startDate eq null or price.endDate eq null or price.startDate >= price.endDate || !price.displayAction or !price.checkOk)}">
						<p:graphicImage value="/css/images/design/icon_error.png"></p:graphicImage>
					</p:commandLink>
					<p:graphicImage value="/css/images/design/icon_success.png"
						rendered="#{!(price.price eq null || price.startDate eq null or price.endDate eq null or price.startDate >= price.endDate || !price.displayAction or !price.checkOk)}" />
				</h:panelGroup>


			</p:column>


		</p:dataTable>


	</p:outputPanel>


</ui:composition>
