<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="cmZonalPromotionTierPricings">
		<p:dataTable id="cmZonalPromotionTierPricingsId"
			value="#{catalogueBackingBean.managedBean.supplierItemObj.cmZonalPromotionTierPricings}"
			var="tier" rowKey="#{tier}" rowIndexVar="rowIndex" width="100%">

			<ac:paginator for="cmZonalPromotionTierPricingsId"></ac:paginator>


			<p:column>
				<f:facet name="header">
					Zone Name
				</f:facet>
				<p:selectOneMenu value="#{tier.cmSupplierZone.suppZoneId}"
					style="width: 128px;">
					<f:selectItem itemLabel="Select One" itemValue="0" />
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.supplierZoneList}"
						var="zone" itemLabel="#{zone.suppZoneName}"
						itemValue="#{zone.suppZoneId}"></f:selectItems>

				</p:selectOneMenu>

			</p:column>




			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<h:inputText value="#{tier.price}" size="10" disabled="true" style="text-align:right">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:inputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.tier.from']}
				</f:facet>
				<p:inputText value="#{tier.fromQty}" size="4" disabled="true"></p:inputText>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.tier.to']}
				</f:facet>
				<p:inputText value="#{tier.toQty}" size="4" disabled="true"></p:inputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{tier.startDate}" showOn="button" size="10"
					disabled="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{tier.endDate}" showOn="button" size="10"
					disabled="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

			</p:column>

		</p:dataTable>






	</p:outputPanel>


</ui:composition>
