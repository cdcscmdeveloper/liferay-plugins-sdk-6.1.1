<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">









	<p:panelGrid styleClass="tablePanel">
		<f:facet name="header">
			<p:row>
				<p:column>
							Pricing Type
						</p:column>
				<p:column>
							Price (RM) 
						</p:column>
				<p:column>
							Start Date
						</p:column>
				<p:column>
							End Date
						</p:column>
			</p:row>

		</f:facet>

		<p:row>
			<p:column>
				<p:outputLabel value="Standard" />
			</p:column>
			<p:column>
				<p:inputText style="text-align:right"
					value="#{catalogueBackingBean.managedBean.supplierItemObj.cmStandardPricing.price}" disabled="true">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
			</p:column>
			<p:column>
				<p:calendar
					value="#{catalogueBackingBean.managedBean.supplierItemObj.cmStandardPricing.startDate}" disabled="true"
					showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

			</p:column>
			<p:column>
				<p:calendar
					value="#{catalogueBackingBean.managedBean.supplierItemObj.cmStandardPricing.endDate}" disabled="true"
					showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

			</p:column>
		</p:row>



	</p:panelGrid>







</ui:composition>
