<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:outputPanel id="cmPromotionPricings">
		<p:dataTable id="cmPromotionPricingsId"
			value="#{catalogueBackingBean.managedBean.supplierItemObj.cmPromotionPricing}"
			var="zPromotion" rowKey="#{zPromotion}" rowIndexVar="rowIndex"
			width="100%">





			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<h:inputText value="#{zPromotion.price}" size="10" disabled="true"></h:inputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{zPromotion.startDate}" showOn="button"
					size="10" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
					disabled="true"></p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{zPromotion.endDate}" showOn="button" size="10"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>

			</p:column>

		</p:dataTable>


	</p:outputPanel>


</ui:composition>
