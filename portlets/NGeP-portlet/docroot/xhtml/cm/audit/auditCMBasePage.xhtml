<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:tp="http://java.sun.com/jsf/composite/ep"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<p:panel>
			<table style="width: 100%">
				<tr>
					<td>
						<div align="left" style="width: 100%">
							<p:commandButton value="#{lbl['lbl.btn.back']}"
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								action="#{auditCodificationManagementReportBackingBean.redirectToMainPage}" />
						</div>
					</td>
					<td>
						<div align="right" style="width: 100%">
							<p:commandLink value="#{lbl['lbl.txt.print.audit.all']}"
								ajax="false">
								<p:fileDownload
									value="#{auditCodificationManagementReportBackingBean.generatePDFAll()}" />
							</p:commandLink>
							&#160;
							<p:commandLink value="#{lbl['lbl.txt.file.audit.download.all']}"
								ajax="false">
								<p:fileDownload
									value="#{auditCodificationManagementReportBackingBean.generateExcelAll()}" />
							</p:commandLink>
							&#160;
						</div>
					</td>
				</tr>
			</table>
			<br />
			<ui:include src="/xhtml/cm/audit/auditCMPanel.xhtml" />
		</p:panel>
	</ui:define>
</ui:composition>
