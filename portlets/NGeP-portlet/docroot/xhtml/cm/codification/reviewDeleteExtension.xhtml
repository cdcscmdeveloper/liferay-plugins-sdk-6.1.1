<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
	
	<f:event listener="#{unspscCodeBackingBean.preRenderExtensionMaintenanceView}"
			type="preRenderView" />


		<h:panelGroup id="deleteExtensionID">
			<h:outputLabel styleClass="screen-title"
				value="#{lbl['lbl.cm.review.extension.code']}"></h:outputLabel>

			<div style="text-align: right;">
				<ui:repeat var="action"
					value="#{unspscCodeBackingBean.managedBean.action}">
					<p:commandButton value="#{action}" action="#{unspscCodeBackingBean.submitForMaintenanceRequest(action)}"></p:commandButton>
				</ui:repeat>
			</div>


			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.tempCode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.tempTitle}" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.itemName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.type']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.typeName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.brand']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.brandName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.measurementName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.color']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.colorName}" /></td>
				</tr>
			</table>






		</h:panelGroup>


	</ui:define>
</ui:composition>
