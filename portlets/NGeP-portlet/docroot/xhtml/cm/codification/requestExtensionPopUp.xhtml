<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns="http://www.w3.org/1999/xhtml">

	<h:panelGroup id="requestExtPopUpId">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}" /></td>
				<td colspan="3"><p:inputText
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.tempCode}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}" /></td>
				<td colspan="3"><p:inputText
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.tempTitle}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}" /></td>
				<td colspan="3"><p:inputText
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.itemName}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.item.description']}" /></td>
				<td colspan="3"><p:inputText
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.itemDetail}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.cm.type']}" /></td>
				<td><p:selectOneMenu
						value="#{unspscCodeBackingBean.managedBean.typeName}">
						<f:selectItem itemLabel="Select One" itemValue="" />
						<f:selectItems
							value="#{unspscCodeBackingBean.managedBean.typeList}" var="type"
							itemLabel="#{type.typeName}" itemValue="#{type.typeName}"></f:selectItems>
					</p:selectOneMenu></td>
				<td><p:selectBooleanCheckbox
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.requestType}"></p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="Request New"></p:outputLabel></td>
				<td><p:inputText
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.typeName}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.cm.brand']}" /></td>
				<td><p:selectOneMenu
						value="#{unspscCodeBackingBean.managedBean.brandName}">
						<f:selectItem itemLabel="Select One" itemValue="" />
						<f:selectItems
							value="#{unspscCodeBackingBean.managedBean.brandList}"
							var="brand" itemLabel="#{brand.brandName}"
							itemValue="#{brand.brandName}"></f:selectItems>
					</p:selectOneMenu></td>
				<td><p:selectBooleanCheckbox
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.requestBrand}"></p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="Request New"></p:outputLabel></td>
				<td><p:inputText
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.brandName}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.cm.measurement']}" /></td>
				<td><p:selectOneMenu
						value="#{unspscCodeBackingBean.managedBean.measurementName}">
						<f:selectItem itemLabel="Select One" itemValue="" />
						<f:selectItems
							value="#{unspscCodeBackingBean.managedBean.measurementList}"
							var="measurement" itemLabel="#{measurement.measurementName}"
							itemValue="#{measurement.measurementName}"></f:selectItems>
					</p:selectOneMenu></td>
				<td><p:selectBooleanCheckbox
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.requestMeasurement}"></p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="Request New"></p:outputLabel></td>
				<td><p:inputText
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.measurementName}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.cm.color']}" /></td>
				<td><p:selectOneMenu
						value="#{unspscCodeBackingBean.managedBean.colorName}">
						<f:selectItem itemLabel="Select One" itemValue="" />
						<f:selectItems
							value="#{unspscCodeBackingBean.managedBean.colorList}"
							var="color" itemLabel="#{color.colorName}"
							itemValue="#{color.colorName}"></f:selectItems>
					</p:selectOneMenu></td>
				<td><p:selectBooleanCheckbox
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.requestColor}"></p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="Request New"></p:outputLabel></td>
				<td><p:inputText
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.colorName}"></p:inputText></td>
			</tr>

		</table>




		<p:commandButton value="#{lbl['lbl.cm.ok']}" icon="ui-icon-approve"
			action="#{unspscCodeBackingBean.addNewRequest}" update=":form:extCodeId :form:requestExtPopUpId"
			oncomplete="extensionPopUp.hide()"></p:commandButton>

		<p:commandButton value="#{lbl['lbl.cm.cancel']}" icon="ui-icon-cancel" immediate="true"
			onclick="extensionPopUp.hide()"></p:commandButton>

	</h:panelGroup>





</ui:composition>
