<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns="http://www.w3.org/1999/xhtml">

	<h:panelGroup id="requestExtPopUpId">
		<p:messages id="messageId" showDetail="true" autoUpdate="true" closable="true" showSummary="false"></p:messages>
		<table style="width: 100%;">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}" /></td>
				<td colspan="3"><p:inputText
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.tempCode}"
						disabled="true" size="40"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}" /></td>
				<td colspan="3"><p:inputText
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.tempTitle}"
						disabled="true" size="40"></p:inputText></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.type']}" /><p:outputLabel value="*" styleClass="mandatory"/></td>
				<td><p:autoComplete
						value="#{unspscCodeBackingBean.managedBean.selectedType}"
						id="typePojo"
						completeMethod="#{unspscCodeBackingBean.autoCompleteType}"
						var="type" itemLabel="#{type.typeName}" itemValue="#{type}"
						converter="cmType" forceSelection="true" /></td>
				<td><p:selectBooleanCheckbox
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.requestType}">
						<p:ajax listener="#{unspscCodeBackingBean.requestNewType}"
							update="requestTypeId"></p:ajax>
					</p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.request.new']}"></p:outputLabel></td>
				<td><p:inputText id="requestTypeId"
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.typeName}"
						disabled="#{unspscCodeBackingBean.managedBean.typeDisable}">
						<p:ajax event="blur" listener="#{unspscCodeBackingBean.checkingTypeRedundency}" update="messageId"></p:ajax>
						</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.brand']}" /><p:outputLabel value="*" styleClass="mandatory"/></td>
				<td><p:autoComplete
						value="#{unspscCodeBackingBean.managedBean.selectedBrand}"
						id="brandPojo"
						completeMethod="#{unspscCodeBackingBean.autoCompleteBrand}"
						var="brand" itemLabel="#{brand.brandName}" itemValue="#{brand}"
						converter="cmBrand" forceSelection="true" /></td>
				<td><p:selectBooleanCheckbox
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.requestBrand}">
						<p:ajax listener="#{unspscCodeBackingBean.requestNewBrand}"
							update="requestBrandId"></p:ajax>
					</p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.request.new']}"></p:outputLabel></td>
				<td><p:inputText id="requestBrandId"
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.brandName}"
						disabled="#{unspscCodeBackingBean.managedBean.brandDisable}">
							<p:ajax event="blur" listener="#{unspscCodeBackingBean.checkingBrandRedundency}" update="messageId"></p:ajax>
						</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}" /><p:outputLabel value="*" styleClass="mandatory"/></td>
				<td><p:autoComplete
						value="#{unspscCodeBackingBean.managedBean.selectedMeasurement}"
						id="measurementPojo"
						completeMethod="#{unspscCodeBackingBean.autoCompleteMeasurement}"
						var="measurement" itemLabel="#{measurement.measurementName}"
						itemValue="#{measurement}" converter="cmMeasurement"
						forceSelection="true" /></td>
				<td><p:selectBooleanCheckbox
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.requestMeasurement}">
						<p:ajax listener="#{unspscCodeBackingBean.requestNewMeasurement}"
							update="requestMeasurementId"></p:ajax>
					</p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.request.new']}"></p:outputLabel></td>
				<td><p:inputText id="requestMeasurementId"
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.measurementName}"
						disabled="#{unspscCodeBackingBean.managedBean.measurementDisable}">
							<p:ajax event="blur" listener="#{unspscCodeBackingBean.checkingMeasurmentRedundency}" update="messageId"></p:ajax>
						</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.color']}" /><p:outputLabel value="*" styleClass="mandatory"/></td>
				<td><p:autoComplete
						value="#{unspscCodeBackingBean.managedBean.selectedColor}"
						id="colorPojo"
						completeMethod="#{unspscCodeBackingBean.autoCompleteColor}"
						var="color" itemLabel="#{color.colorName}" itemValue="#{color}"
						converter="cmColor" forceSelection="true" /></td>
				<td><p:selectBooleanCheckbox
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.requestColor}">
						<p:ajax listener="#{unspscCodeBackingBean.requestNewColor}"
							update="requestColorId"></p:ajax>
					</p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.request.new']}"></p:outputLabel></td>
				<td><p:inputText id="requestColorId"
						value="#{unspscCodeBackingBean.managedBean.requestExtCode.colorName}"
						disabled="#{unspscCodeBackingBean.managedBean.colorDisable}">
							<p:ajax event="blur" listener="#{unspscCodeBackingBean.checkingColorRedundency}" update="messageId"></p:ajax>
						</p:inputText></td>
			</tr>

		</table>


		<div style="text-align: right;">

			<p:commandButton value="#{lbl['lbl.cm.ok']}" icon="ui-icon-approve"
				action="#{unspscCodeBackingBean.addNewRequest}"
				update=":form:extCodeId :form:requestExtPopUpId"
				oncomplete="extensionPopUp.hide()"></p:commandButton>

			<p:commandButton value="#{lbl['lbl.cm.cancel']}"
				icon="ui-icon-cancel" immediate="true"
				onclick="extensionPopUp.hide()"></p:commandButton>
		</div>

		<div class="clear"></div>

		<h:outputText value="#{lbl['lbl.cm.request.extension.help.msg']}"></h:outputText>

	</h:panelGroup>





</ui:composition>
