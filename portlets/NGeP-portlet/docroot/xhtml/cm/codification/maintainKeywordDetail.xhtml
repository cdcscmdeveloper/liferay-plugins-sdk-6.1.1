<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">


		<table style="width: 100%;">
			<tr>
				<td style="text-align: left;">
				<p:commandButton rendered="#{codificationBackingBean.managedBean.productKeyword}"
						value="#{lbl['lbl.cm.back']}"
						action="#{codificationBackingBean.backTokeyWordSearch}" /> 
						<p:commandButton rendered="#{codificationBackingBean.managedBean.serviceKeyword}"
						value="#{lbl['lbl.cm.back']}"
						action="#{codificationBackingBean.backTokeyWordView}" /></td>
				<td style="text-align: right;"><p:commandButton
						value="#{lbl['lbl.cm.save']}"
						action="#{codificationBackingBean.saveKeyWord}" /></td>
			</tr>
		</table>






		<p:panel header="#{lbl['lbl.cm.keyword.Maintenance.Detail']}"
			toggleable="true">

			<table style="width: 100%;">
				<tr>
					<td width="20%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.segment.code']}"></p:outputLabel></td>
					<td width="20%"><p:outputLabel styleClass="outputLabel-view"
							value="#{codificationBackingBean.managedBean.segmentCode}" /></td>
					<td width="25%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.segment.title']}"></p:outputLabel></td>
					<td width="35%"><p:outputLabel styleClass="outputLabel-view"
							value="#{codificationBackingBean.managedBean.segmentTitle}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.family.code']}"></p:outputLabel></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{codificationBackingBean.managedBean.familyCode}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.family.title']}"></p:outputLabel></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{codificationBackingBean.managedBean.familyTitle}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.class.code']}"></p:outputLabel></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{codificationBackingBean.managedBean.classCode}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.class.title']}"></p:outputLabel></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{codificationBackingBean.managedBean.classTitle}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.commodity.code']}"></p:outputLabel></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscCode}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.commodity.title']}"></p:outputLabel></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}" /></td>
				</tr>

				<tr>

					<td style="vertical-align: top;"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.item.code']}" /></td>
					<td style="vertical-align: top;"><p:outputLabel size="35"
							styleClass="outputLabel-view"
							value="#{codificationBackingBean.managedBean.keywordItem.extensionCode}"></p:outputLabel></td>
					<td style="vertical-align: top;"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.item.name']}" /></td>
					<td
						style="overflow-wrap: break-word; width: 25%; vertical-align: top;"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{codificationBackingBean.managedBean.keywordItem.itemName}"></p:outputLabel></td>
				</tr>

			</table>

			<table style="width: 100%;margin-top:10px;">

				<tr>
					<td width="20%;"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.keyword']}" /></td>
					<td width="80%"><p:inputTextarea
							style="width:80% !important;height:80px;overflow:scroll;"
							value="#{codificationBackingBean.managedBean.keywordItem.cmKeyword[0].keyword}" /></td>

				</tr>

			</table>




		</p:panel>



	</ui:define>


</ui:composition>
