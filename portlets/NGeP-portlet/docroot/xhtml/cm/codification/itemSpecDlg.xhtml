<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:dialog id="itemSpecDlg" widgetVar="itemSpecDlg" header="#{lbl['lbl.ct.item.specification.list']}" 
		styleClass="pop_up_top" modal="true" width="700" height="450">
		<h:panelGrid columns="1">
			<p:outputLabel value="#{lbl['lbl.cm.item.name']}" >: #{codificationBackingBean.managedBean.selectedRequestItem.itemName}</p:outputLabel>
		</h:panelGrid>
		<p:spacer  height="5"/>
		<p:dataTable emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" id="itemSpecDt" var="data" value="#{codificationBackingBean.managedBean.selectedRequestItem.ctPanelItem.ctPanelItemSpecs}" rowIndexVar="index">
			<ac:paginator for="itemSpecDt" />
			<p:column headerText="#{lbl['lbl.ct.specification']}" style="width:45%; white-space:normal">
				<p:inputTextarea value="#{data.specification}" maxlength="200" rows="3" style="width:98%;" autoResize="false"
						disabled="true" />
			</p:column>	
			<p:column headerText="#{lbl['lbl.ct.description']}" style="width:45%; white-space:normal">
				<p:inputTextarea value="#{data.description}" maxlength="200" rows="3" style="width:98%;" autoResize="false"
						disabled="true" />
			</p:column>	
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="#{lbl['lbl.btn.close']}"  onclick="itemSpecDlg.hide();" />
		</div>	
	</p:dialog>
	
</ui:composition>
