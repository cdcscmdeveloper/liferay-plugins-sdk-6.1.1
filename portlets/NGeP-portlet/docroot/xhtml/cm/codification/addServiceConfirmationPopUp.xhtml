<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns="http://www.w3.org/1999/xhtml">

	<h:panelGroup id="confirmationPopUpId">

		<p:panel>


			<table style="width: 100">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscCode}"></p:outputLabel> -
					</td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}"></p:outputLabel></td>

				</tr>

			</table>

			<div style="text-align: left;">
				<p:outputLabel styleClass="outputLabel-view"
					value="#{lbl['lbl.cm.add.service.to.cataloque.confirmation.msg']}"></p:outputLabel>
			</div>
			<br />
			<p:spacer height="20px;" />
			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.cm.cancel']}" immediate="true"
					onclick="confirmationPopUp.hide()" />

				<p:commandButton value="#{lbl['lbl.cm.ok']}"
					action="#{catalogueBackingBean.addServiceToMaintain()}"
					oncomplete="confirmationPopUp.hide()"
					update=":form:confirmationPopUpId,:form:cmUNSPSCsearchID" />
			</div>

			<div class="clear"></div>
		</p:panel>

	</h:panelGroup>



</ui:composition>
