<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">




	<div class="header-info">
		<table style="width: 100%;">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.doc.no']}"></p:outputLabel></td>
				<td><p:inputText
						value="#{unspscCodeBackingBean.managedBean.requestCode.docNo}"
						disabled="true" size="30"></p:inputText></td>

				<td><p:outputLabel value="#{lbl['lbl.cm.doc.status']}"></p:outputLabel></td>
				<td><p:inputText
						value="#{unspscCodeBackingBean.managedBean.docStatus}"
						disabled="true" size="30"></p:inputText></td>

				<td><p:outputLabel value="#{lbl['lbl.cm.company.name']}"></p:outputLabel></td>
				<td><c:choose>
						<c:when
							test="#{unspscCodeBackingBean.managedBean.requestCode.smSupplier != null}">
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.smSupplier.companyName}"
								disabled="true" size="30"></p:inputText>
						</c:when>
						<c:otherwise>
							<p:inputText value="N/A" disabled="true" size="30"></p:inputText>
						</c:otherwise>
					</c:choose></td>

				<td><p:outputLabel value="#{lbl['lbl.cm.ep.no']}"></p:outputLabel></td>
				<td><c:choose>
						<c:when
							test="#{unspscCodeBackingBean.managedBean.requestCode.smSupplier != null}">
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.smSupplier.epNo}"
								disabled="true" size="30"></p:inputText>
						</c:when>
						<c:otherwise>
							<p:inputText value="N/A" disabled="true" size="30"></p:inputText>
						</c:otherwise>
					</c:choose></td>
			</tr>
		</table>
	</div>

</ui:composition>
