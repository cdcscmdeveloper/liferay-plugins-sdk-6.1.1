<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">




	<div class="header-info">
		<table style="width: 100%;">
			<tr>
				<td width="10%"><p:outputLabel value="#{lbl['lbl.cm.doc.no']}"
						style="text-align : right;"></p:outputLabel></td>
				<td width="15%" class="header-info-text"><h:outputText
						style="white-space: normal!important; text-align : left;"
						value="#{unspscCodeBackingBean.managedBean.requestCode.docNo}" /></td>

				<td width="10%"><p:outputLabel
						value="#{lbl['lbl.cm.doc.status']}" style="text-align : right;"></p:outputLabel></td>
				<td width="15%" class="header-info-text"><h:outputText
						style="white-space: normal!important; text-align : left;"
						value="#{unspscCodeBackingBean.managedBean.docStatus}" /></td>

				<td width="10%"><p:outputLabel
						value="#{lbl['lbl.cm.company.name']}" style="text-align : right;"></p:outputLabel></td>
				<td width="15%" class="header-info-text"><c:choose>
						<c:when
							test="#{unspscCodeBackingBean.managedBean.requestCode.smSupplier != null}">
							<h:outputText
								style="white-space: normal!important; text-align : left;"
								value="#{unspscCodeBackingBean.managedBean.requestCode.smSupplier.companyName}" />
						</c:when>
						<c:otherwise>
							<h:outputText value="N/A" style="text-align : left;" />
						</c:otherwise>
					</c:choose></td>

				<td width="10%"><p:outputLabel value="#{lbl['lbl.cm.ep.no']}"
						style="text-align : right;"></p:outputLabel></td>
				<td width="15%"><c:choose>
						<c:when
							test="#{unspscCodeBackingBean.managedBean.requestCode.smSupplier != null}">
							<h:outputText
								style="white-space: normal!important; text-align : left;"
								value="#{unspscCodeBackingBean.managedBean.requestCode.smSupplier.epNo}" />
						</c:when>
						<c:otherwise>
							<h:outputText value="N/A" style="text-align : left;" />
						</c:otherwise>
					</c:choose></td>
			</tr>
			<tr>
				<c:choose>
					<c:when
						test="#{unspscCodeBackingBean.managedBean.requestCode.smSupplier != null and unspscCodeBackingBean.managedBean.requestCode.smSupplier.smAppl.supplierType == 'O'}">
						<td><p:outputLabel value="#{lbl['lbl.txt.business.reg.no']}"
							style="text-align : right;"></p:outputLabel></td>
						<td><h:outputText
							style="white-space: normal!important; text-align : left;"
							value="#{unspscCodeBackingBean.managedBean.requestCode.smSupplier.regNo}" /></td>
					</c:when>
					<c:when
						test="#{unspscCodeBackingBean.managedBean.requestCode.smSupplier != null and unspscCodeBackingBean.managedBean.requestCode.smSupplier.smAppl.supplierType != 'O'}">
						<td><p:outputLabel value="#{lbl['lbl.sc.mof.no']}"
							style="text-align : right;"></p:outputLabel></td>
						<td><h:outputText
							style="white-space: normal!important; text-align : left;"
							value="#{unspscCodeBackingBean.retrieveMofNo(unspscCodeBackingBean.managedBean.requestCode.smSupplier.supplierId , unspscCodeBackingBean.managedBean.requestCode.smSupplier.smAppl.supplierType)}" />
					</td></c:when>
					<c:otherwise>
						<td><p:outputLabel value="#{lbl['lbl.txt.business.reg.no']}"
							style="text-align : right;"></p:outputLabel></td>
						<td><h:outputText value="N/A" style="text-align : left;" /></td>
					</c:otherwise>
				</c:choose>
			</tr>
		</table>





	</div>
	<p:spacer height="10px"></p:spacer>

</ui:composition>
