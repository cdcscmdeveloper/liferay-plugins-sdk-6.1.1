<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">


		<h:panelGroup id="cmReviewUnspsc">
			<div style="text-align: right;">
				<ui:repeat var="action"
					value="#{unspscCodeBackingBean.managedBean.action}">
					<p:commandButton value="#{action}"
						action="#{unspscCodeBackingBean.savetempCode(action)}"></p:commandButton>
				</ui:repeat>

			</div>

			<p:panel header="Review Info" toggleable="true">

				<table style="width: 66%; margin-bottom: 4px;">
					<tr>
						<td><p:outputLabel value="Item Type"></p:outputLabel></td>
						<td><p:selectOneMenu
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemType}"
								style="width:228px;" disabled="true">
								<f:selectItem itemValue="P" itemLabel="Product " />
								<f:selectItem itemValue="S" itemLabel="Service" />
							</p:selectOneMenu></td>
					</tr>
				</table>



				<table style="width: 100%;">


					<tr>
						<td><p:outputLabel value="* #{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemName}"
								size="40"></p:inputText></td>
						<td><p:outputLabel value="* #{lbl['lbl.cm.item.details']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemDetail}"
								size="40"></p:inputText></td>
					</tr>
					<tr>
						<td><p:outputLabel value="* #{lbl['lbl.cm.type']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.typeName}"
								size="40"></p:inputText></td>
						<td><p:outputLabel value="* #{lbl['lbl.cm.brand']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.brandName}"
								size="40"></p:inputText></td>
					</tr>
					<tr>
						<td><p:outputLabel value="* #{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.measurementName}"
								size="40"></p:inputText></td>
						<td><p:outputLabel value="* #{lbl['lbl.cm.color']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.colorName}"
								size="40"></p:inputText></td>
					</tr>

				</table>

			</p:panel>

			<p:panel header="Search and Recommend" toggleable="true">

				<div style="text-align: right;">
					<p:commandButton value="#{lbl['lbl.cm.search']}"
						action="#{unspscCodeBackingBean.navigateCodeAdminToSearch}"
						icon="ui-icon-search"></p:commandButton>
				</div>

				<p:dataTable id="recomemendUnspscId" rowIndexVar="rowIndex"
					value="#{codificationBackingBean.managedBean.recommendUnspscList}"
					var="unspscObj" width="100%">



					<p:column>
						<f:facet name="header">
					Recommended #{lbl['lbl.cm.unspsc.code']}
				</f:facet>

				
						#{unspscObj.unspscCode}
						


				</p:column>
					<p:column>
						<f:facet name="header">
					Recommended #{lbl['lbl.cm.unspsc.title']}
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>

					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.action']}
						</f:facet>
						<p:commandLink
							action="#{unspscCodeBackingBean.removeRecommendCode(rowIndex)}"
							update=":form:recomemendUnspscId">
							<p:graphicImage value="/resources/ep/images/design/trash.png"></p:graphicImage>
						</p:commandLink>



					</p:column>

				</p:dataTable>


			</p:panel>


			<p:panel header="Create Temporary Code" toggleable="true">

				<p:panelGrid style="width:100%;" styleClass="tablePanel"
					id="tablePanelId">
					<f:facet name="header">
						<p:row>
							<p:column>
								<h:outputLabel value="" />
							</p:column>
							<p:column>
							 Code
						</p:column>
							<p:column>
							Title
						</p:column>
							<p:column>
							Key
						</p:column>
							<p:column>
							Description
						</p:column>
						</p:row>

					</f:facet>

					<p:row>
						<p:column>
							<h:outputLabel value="Segment" />
						</p:column>
						<p:column>

							<ac:lov id="segmentUploadId" lovId="CM_UNSPSC"
								headerText="Segment Lov" update=":form:tablePanelId"
								saveObject="unspscCodeBackingBean.managedBean.selectedLovUnspscSegment"
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscCode}"
								conditionField="recordStatus^1|unspscLevel^0">
							</ac:lov>
							<ac:lovPopup />

						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscTitle}"></p:inputText>

						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscKey}"></p:inputText>
						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscDescription}"></p:inputText>

						</p:column>
					</p:row>


					<p:row>
						<p:column>
							<h:outputLabel value="Family" />
						</p:column>
						<p:column>
							<ac:lov id="familyUploadId" lovId="CM_UNSPSC"
								headerText="Family Lov" update=":form:tablePanelId"
								saveObject="unspscCodeBackingBean.managedBean.selectedLovUnspscfamily"
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscCode}"
								conditionField="recordStatus^1|unspscLevel^1|unspscParentCode^#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscCode}">
							</ac:lov>
							<ac:lovPopup />

						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscTitle}"></p:inputText>

						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscKey}"></p:inputText>
						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscDescription}"></p:inputText>

						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputLabel value="Class" />
						</p:column>
						<p:column>
							<ac:lov id="classUploadId" lovId="CM_UNSPSC"
								headerText="Class Lov" update=":form:tablePanelId"
								saveObject="unspscCodeBackingBean.managedBean.selectedLovUnspscClass"
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscCode}"
								conditionField="recordStatus^1|unspscLevel^2|unspscParentCode^#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscCode}">
							</ac:lov>
							<ac:lovPopup />

						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscTitle}"></p:inputText>

						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscKey}"></p:inputText>
						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscDescription}"></p:inputText>

						</p:column>
					</p:row>


					<p:row>
						<p:column>
							<h:outputLabel value="Commodity" />
						</p:column>
						<p:column>
							<ac:lov id="commodityUploadId" lovId="CM_UNSPSC"
								headerText="Commodity Lov" update=":form:tablePanelId"
								saveObject="unspscCodeBackingBean.managedBean.selectedLovUnspsc"
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspsc.unspscCode}"
								conditionField="recordStatus^1|unspscLevel^3|unspscParentCode^#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscCode}">
							</ac:lov>
							<ac:lovPopup />

						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspsc.unspscTitle}"></p:inputText>

						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspsc.unspscKey}"></p:inputText>
						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspsc.unspscDescription}"></p:inputText>

						</p:column>
					</p:row>


				</p:panelGrid>

			</p:panel>


		</h:panelGroup>


	</ui:define>


</ui:composition>
