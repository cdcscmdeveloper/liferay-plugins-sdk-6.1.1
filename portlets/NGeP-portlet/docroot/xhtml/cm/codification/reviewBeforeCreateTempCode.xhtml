<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="tempCodeReviewMsgId" showDetail="true"	autoUpdate="true" closable="true" showSummary="false" />
		
		<ac:lovPopup />
		
		<h:panelGroup id="cmReviewUnspsc">
			<div style="text-align: right;">
				<ui:repeat var="action"	value="#{unspscCodeBackingBean.managedBean.action}">
					<p:commandButton 
						value="#{action}"
						action="#{unspscCodeBackingBean.savetempCode(action)}"
						update="@form" />
				</ui:repeat>
			</div>


			<ui:include src="DocumentHeader.xhtml"></ui:include>

			<p:panel header="Request Info" toggleable="true">


				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="Item Type"></p:outputLabel></td>
						<td><p:selectOneMenu
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemType}"
								style="width:228px;" disabled="true">
								<f:selectItem itemValue="P" itemLabel="Product " />
								<f:selectItem itemValue="S" itemLabel="Service" />
							</p:selectOneMenu></td>
						<td></td>
						<td></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}"/><p:outputLabel value="*" styleClass="mandatory"/></td>
						<td><p:inputText disabled="true"
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemName}"
								size="40"></p:inputText></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.details']}"/><p:outputLabel value="*" styleClass="mandatory"/></td>
						<td><p:inputText disabled="true"
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemDetail}"
								size="40"></p:inputText></td>
					</tr>
					<h:panelGroup id="extensionFiledsId"
						rendered="#{unspscCodeBackingBean.managedBean.requestCode.itemType != 'S'}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.cm.type']}"/><p:outputLabel value="*" styleClass="mandatory"/></td>
							<td><p:inputText disabled="true"
									value="#{unspscCodeBackingBean.managedBean.requestCode.typeName}"
									size="40"></p:inputText></td>
							<td><p:outputLabel value="#{lbl['lbl.cm.brand']}"/><p:outputLabel value="*" styleClass="mandatory"/></td>
							<td><p:inputText disabled="true"
									value="#{unspscCodeBackingBean.managedBean.requestCode.brandName}"
									size="40"></p:inputText></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}"/><p:outputLabel value="*" styleClass="mandatory"/></td>
							<td><p:inputText disabled="true"
									value="#{unspscCodeBackingBean.managedBean.requestCode.measurementName}"
									size="40"></p:inputText></td>
							<td><p:outputLabel value="#{lbl['lbl.cm.color']}"/><p:outputLabel value="*" styleClass="mandatory"/></td>
							<td><p:inputText disabled="true"
									value="#{unspscCodeBackingBean.managedBean.requestCode.colorName}"
									size="40"></p:inputText></td>
						</tr>
					</h:panelGroup>
				</table>

			</p:panel>

			<p:panel header="Search and Recommend" toggleable="true">

				<div style="text-align: right;">
					<p:commandButton value="#{lbl['lbl.cm.search']}"
						action="#{unspscCodeBackingBean.navigateCodeAdminToSearch}"
						icon="ui-icon-search"></p:commandButton>
				</div>

				<p:dataTable id="recomemendUnspscId" rowIndexVar="rowIndex"
					value="#{unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes}"
					var="unspscObj" width="100%">



					<p:column>
						<f:facet name="header">
					Recommended Item Code
				</f:facet>

				
						#{unspscObj.unspscCode}
						


				</p:column>
					<p:column>
						<f:facet name="header">
					Recommended Item Name
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>

					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.action']}
						</f:facet>
						<p:commandLink
							action="#{unspscCodeBackingBean.removeRecommendCode(rowIndex)}"
							update=":form:recomemendUnspscId">
							<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
						</p:commandLink>



					</p:column>

				</p:dataTable>


			</p:panel>


			<p:panel header="Create Temporary Code" toggleable="true">

				<p:panelGrid style="width:100%;" styleClass="tablePanel"
					id="tablePanelId">
					<f:facet name="header">
						<p:row>
							<p:column>
								<h:outputLabel value="" />
							</p:column>
							<p:column>
							  <h:outputText  value="*" styleClass="mandatory"/><h:outputText value=" Code" />
						</p:column>
							<p:column>
							  <h:outputText  value="*" styleClass="mandatory"/><h:outputText value=" Title" />
						</p:column>

							<p:column>
							Description
						</p:column>
						</p:row>

					</f:facet>

					<p:row>
						<p:column>
							<h:outputLabel value="Segment" />
						</p:column>
						<p:column>

							<ac:lov id="segmentUploadId" lovId="CM_UNSPSC"
								headerText="Segment" update=":form:tablePanelId"
								saveObject="unspscCodeBackingBean.managedBean.selectedLovUnspscSegment"
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscCode}"
								conditionField="recordStatus^1|unspscLevel^0|unspscCode^70000000^#{unspscCodeBackingBean.productOrServiceOperator()}">
								
							</ac:lov>

						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscTitle}"
								size="40"></p:inputText>

						</p:column>

						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscDescription}"
								size="40"></p:inputText>

						</p:column>
					</p:row>


					<p:row>
						<p:column>
							<h:outputLabel value="Family" />
						</p:column>
						<p:column>
							<ac:lov id="familyUploadId" lovId="CM_UNSPSC" headerText="Family"
								update=":form:tablePanelId"
								saveObject="unspscCodeBackingBean.managedBean.selectedLovUnspscfamily"
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscCode}"
								conditionField="recordStatus^1|unspscLevel^1|unspscParentCode^#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscCode}">
							</ac:lov>

						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscTitle}"
								size="40"></p:inputText>

						</p:column>

						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscDescription}"
								size="40"></p:inputText>

						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<h:outputLabel value="Class" />
						</p:column>
						<p:column>
							<ac:lov id="classUploadId" lovId="CM_UNSPSC" headerText="Class"
								update=":form:tablePanelId"
								saveObject="unspscCodeBackingBean.managedBean.selectedLovUnspscClass"
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscCode}"
								conditionField="recordStatus^1|unspscLevel^2|unspscParentCode^#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscCode}">
							</ac:lov>

						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscTitle}"
								size="40"></p:inputText>

						</p:column>

						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscDescription}"
								size="40"></p:inputText>

						</p:column>
					</p:row>


					<p:row>
						<p:column>
							<h:outputLabel value="Commodity" />
						</p:column>
						<p:column>
							<ac:lov id="commodityUploadId" lovId="CM_UNSPSC"
								headerText="Commodity" update=":form:tablePanelId"
								saveObject="unspscCodeBackingBean.managedBean.selectedLovUnspsc"
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspsc.unspscCode}"
								conditionField="recordStatus^1|unspscLevel^3|unspscParentCode^#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscCode}">
							</ac:lov>


						</p:column>
						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspsc.unspscTitle}"
								size="40"></p:inputText>

						</p:column>

						<p:column>
							<p:inputText
								value="#{unspscCodeBackingBean.managedBean.selectedLovUnspsc.unspscDescription}"
								size="40"></p:inputText>

						</p:column>
					</p:row>


				</p:panelGrid>

			</p:panel>


		</h:panelGroup>


	</ui:define>


</ui:composition>
