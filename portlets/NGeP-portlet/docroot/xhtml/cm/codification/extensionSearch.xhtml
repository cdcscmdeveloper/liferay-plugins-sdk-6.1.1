<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<ui:define name="contentSection">
		<p:messages globalOnly="true"></p:messages>


		<h:panelGroup id="cmExtensionSearchID">

			<p:panel header="SEARCH" toggleable="true">

				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
						<td colspan="1"><p:inputText
								value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscCode}"
								size="40" /></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
						<td colspan="1"><p:inputText
								value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}"
								size="40" /></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.type']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu
								value="#{codificationBackingBean.typeFilterBean.searchValue}"
								style="width:228px;">
								<f:selectItems
									value="#{codificationBackingBean.managedBean.typeCriteria}" />
							</p:selectOneMenu></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.brand']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu
								value="#{codificationBackingBean.brandFilterBean.searchValue}"
								style="width:228px;">
								<f:selectItems
									value="#{codificationBackingBean.managedBean.brandCriteria}" />
							</p:selectOneMenu></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu
								value="#{codificationBackingBean.measurementFilterBean.searchValue}"
								style="width:228px;">
								<f:selectItems
									value="#{codificationBackingBean.managedBean.measurementCriteria}" />
							</p:selectOneMenu></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.color']}"></p:outputLabel></td>
						<td><p:selectOneMenu
								value="#{codificationBackingBean.colorFilterBean.searchValue}"
								style="width:228px;">
								<f:selectItems
									value="#{codificationBackingBean.managedBean.colorCriteria}" />
							</p:selectOneMenu></td>
					</tr>
				</table>
			</p:panel>

			<div style="text-align: right;">
				<p:commandButton value="Search" icon="ui-icon-search"
					action="#{codificationBackingBean.itemSearch}" update="itemTableID" />
			</div>

			<p:panel header="SEARCH RESULTS" toggleable="true">

				<p:dataTable id="itemTableID"
					value="#{codificationBackingBean.managedBean.itemList}"
					rowKey="#{item.itemId}" var="item" rowIndexVar="rowIndex"
					selection="#{codificationBackingBean.managedBean.selectedItems}">

					<p:column selectionMode="multiple" style="width:2%" />



					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.type']}
						</f:facet>
						#{item.cmType.typeName}

					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.brand']}
						</f:facet>
						#{item.cmBrand.brandName}
					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.measurement']}
						</f:facet>
						
						#{item.cmMeasurement.measurementName}

					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.color']}
						</f:facet>
						#{item.cmColor.colorName}
					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.action']}
						</f:facet>
						<table>
							<tr>
								<td width="2px"><p:commandLink
										action="#{codificationBackingBean.editExtension(rowIndex)}">
										<p:graphicImage value="/resources/ep/images/design/edit.png"></p:graphicImage>
									</p:commandLink></td>
								<td><p:commandLink
										action="#{codificationBackingBean.deleteExtension(rowIndex)}">
										<p:graphicImage value="/resources/ep/images/design/trash.png"></p:graphicImage>
									</p:commandLink></td>
							</tr>
						</table>



					</p:column>

				</p:dataTable>
					<div style="text-align: right;">
							<p:commandButton value="Maintenance FIle" icon="ui-icon-folder"
								action="#{catalogueBackingBean.GoToMaintain()}" />
							<p:commandButton value="Add" icon="ui-icon-add"
								action="#{catalogueBackingBean.addToMaintain()}" />
						</div>

			</p:panel>


		</h:panelGroup>


	</ui:define>




</ui:composition>
