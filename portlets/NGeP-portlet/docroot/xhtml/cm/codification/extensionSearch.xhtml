<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<ui:define name="contentSection">

		<h:panelGrid columns="2" columnClasses="cmLeft,cmRight" width="100%">


			<ui:include src="itemMenu.xhtml"></ui:include>




			<h:panelGroup id="cmExtensionSearchID">
				<p:outputLabel styleClass="titleFront"
					value="#{lbl['lbl.cm.extension.search']}"></p:outputLabel>

				<table>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
						<td colspan="1"><p:inputText
								value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscCode}" /></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
						<td colspan="1"><p:inputText
								value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.type']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu>
								<f:selectItem itemLabel="Sedan" itemValue="A"></f:selectItem>
								<f:selectItem itemLabel="4wd" itemValue="I"></f:selectItem>
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.brand']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu>
								<f:selectItem itemLabel="Toyota" itemValue=""></f:selectItem>
								<f:selectItem itemLabel="Honda" itemValue=""></f:selectItem>

							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu>
								<f:selectItem itemLabel="1.6" itemValue=""></f:selectItem>
								<f:selectItem itemLabel="2.0" itemValue=""></f:selectItem>

							</p:selectOneMenu></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.color']}"></p:outputLabel></td>
						<td><p:selectOneMenu>
								<f:selectItem itemLabel="Yellow" itemValue=""></f:selectItem>
								<f:selectItem itemLabel="Blue" itemValue=""></f:selectItem>

							</p:selectOneMenu></td>
						<td><p:commandButton value="search" /></td>
					</tr>

				</table>

				<p:dataTable value="#{codificationBackingBean.managedBean.unspscList}"
					var="extension">
					<p:column>
						<f:facet name="header">
							<p:outputLabel value="#{lbl['lbl.cm.type']}" />
						</f:facet>

					</p:column>
					<p:column>
						<f:facet name="header">
							<p:outputLabel value="#{lbl['lbl.cm.brand']}" />
						</f:facet>
					</p:column>
					<p:column>
						<f:facet name="header">
							<p:outputLabel value="#{lbl['lbl.cm.measurement']}" />
						</f:facet>

					</p:column>
					<p:column>
						<f:facet name="header">
							<p:outputLabel value="#{lbl['lbl.cm.color']}" />
						</f:facet>

					</p:column>
					<p:column>
						<f:facet name="header">
							<p:outputLabel value="#{lbl['lbl.cm.action']}" />
						</f:facet>
						<p:commandButton value="edit"
							action="#{codificationBackingBean.editExtension()}" />
						<p:commandButton value="delete"
							action="#{codificationBackingBean.deleteExtension()}" />
						<p:commandButton value="move" />

					</p:column>
				</p:dataTable>

				<table>
					<tr>
						<td><p:commandButton value="Maintenance FIle"
								action="#{catalogueBackingBean.GoToMaintain()}" /></td>
						<td><p:commandButton value="Add" /></td>
					</tr>
				</table>
				
			</h:panelGroup>


		</h:panelGrid>


	</ui:define>




</ui:composition>
