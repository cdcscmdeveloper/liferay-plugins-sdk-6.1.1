<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"> <!-- 34447 -->

	<ui:define name="contentSection">

		<p:messages showDetail="true" autoUpdate="true" closable="true"
			showSummary="true"></p:messages>
		<h:panelGroup id="cmReviewUnspsc">


			<div style="text-align: right;">
				<ui:repeat var="action" value="#{unspscCodeBackingBean.managedBean.action}">
					<ui:param name="lblBpmBtn" value="lbl.bpm.action.#{action}" />
						<!-- 34447 Start -->
						<p:commandButton value="#{lbl[lblBpmBtn]}"
							disabled="#{!(unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes.size() >=1)}"
							rendered="#{action == 'RECOMMEND_TO_SUPPLIER' and bpmTasklistBackingBean.managedBean.claim}"
        					type="button" onclick="recommendConfirmPopup.show();" />

        				<p:commandButton value="#{lbl[lblBpmBtn]}"
        					disabled="#{action == 'SUBMIT' and (unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes.size() >=1)}"
        					rendered="#{action != 'REQUEST_EXTENSION' and action != 'REJECT'
        						and action != 'RECOMMEND_TO_SUPPLIER' and bpmTasklistBackingBean.managedBean.claim}"
							action="#{unspscCodeBackingBean.bpmTesting(action)}" process="@form" update="@form" />

						<p:commandButton value="#{lbl[lblBpmBtn]}"
						    disabled="#{(action == 'REJECT') and (unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes.size() >=1)}"
						    rendered="#{action != 'REQUEST_EXTENSION' and bpmTasklistBackingBean.managedBean.claim and action == 'REJECT'}"
						    actionListener="#{unspscCodeBackingBean.validateRejectBeforePopup('rejectConfirmPopup')}"
						    process="@form" update="@form" />
    					<!-- 34447 End -->
				</ui:repeat>
				<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}"
					action="#{bpmTasklistBackingBean.claimTaskInDetailPage}"
					rendered="#{!bpmTasklistBackingBean.managedBean.claim}"
					update="@form"></p:commandButton>

				<!-- 34447 Start -->
				<p:blockUI block="cmReviewUnspsc" widgetVar="pageBlockWidget">
					<p:graphicImage value="/css/images/ajax-loader.gif" />
				</p:blockUI>

				<ac:confirmationPopupCM
					id="rejectConfirmPopup" widget="rejectConfirmPopup"
					loadingWidget="pageBlockWidget"
					okParam="#{unspscCodeBackingBean.bpmTesting('REJECT')}" hasParam="true"
					content="#{lbl['lbl.cd.dialog.message.reject.request']}"
					update="@form">
				</ac:confirmationPopupCM>

				<ac:confirmationPopupCM
					id="recommendConfirmPopup" widget="recommendConfirmPopup"
					loadingWidget="pageBlockWidget"
					okParam="#{unspscCodeBackingBean.bpmTesting('RECOMMEND_TO_SUPPLIER')}" hasParam="true"
					content="#{lbl['lbl.cd.dialog.message.recommend']}"
					update="@form"
					itemList="#{unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes}">
				</ac:confirmationPopupCM>
				<!-- 34447 End -->
			</div>

			<ui:include src="DocumentHeader.xhtml"></ui:include>


			<p:panel header="#{lbl['lbl.cm.request.info']}" toggleable="true">

				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.table.type']}"></p:outputLabel></td>
						<td><p:selectOneMenu
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemType}"
								style="width:228px;">
								<f:selectItem itemValue="P"
									itemLabel="#{lbl['lbl.txt.product']}" />
								<f:selectItem itemValue="S"
									itemLabel="#{lbl['lbl.txt.service']}" />
							</p:selectOneMenu></td>
						<td></td>
						<td></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemName}"
								disabled="true" size="40"></p:inputText></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.details']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemDetail}"
								disabled="true" size="40"></p:inputText></td>
					</tr>
					<h:panelGroup id="extensionFiledsId"
						rendered="#{unspscCodeBackingBean.managedBean.requestCode.itemType != 'S'}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.cm.type']}"></p:outputLabel></td>
							<td><p:inputText
									value="#{unspscCodeBackingBean.managedBean.requestCode.typeName}"
									disabled="true" size="40"></p:inputText></td>
							<td><p:outputLabel value="#{lbl['lbl.cm.brand']}"></p:outputLabel></td>
							<td><p:inputText
									value="#{unspscCodeBackingBean.managedBean.requestCode.brandName}"
									disabled="true" size="40"></p:inputText></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
							<td><p:inputText
									value="#{unspscCodeBackingBean.managedBean.requestCode.measurementName}"
									disabled="true" size="40"></p:inputText></td>
							<td><p:outputLabel value="#{lbl['lbl.cm.color']}"></p:outputLabel></td>
							<td><p:inputText
									value="#{unspscCodeBackingBean.managedBean.requestCode.colorName}"
									disabled="true" size="40"></p:inputText></td>
						</tr>
					</h:panelGroup>
				</table>

			</p:panel>

			<p:panel header="#{lbl['lbl.cm.search.recommend']}" toggleable="true">



				<p:dataTable id="recomemendUnspscId" rowIndexVar="rowIndex"
					value="#{unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes}"
					var="unspscObj" width="100%">



					<p:column>
						<f:facet name="header">
					#{lbl['lbl.cm.recommended.item.code']}
				</f:facet>

				
						#{unspscObj.unspscCode}
						


				</p:column>
					<p:column>
						<f:facet name="header">
					#{lbl['lbl.cm.recommended.item.name']}
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>

					<p:column rendered="#{unspscCodeBackingBean.catalogueAdmin}">
						<f:facet name="header">
							#{lbl['lbl.cm.action']}
						</f:facet>
						<p:commandLink
							action="#{unspscCodeBackingBean.removeRecommendCode(rowIndex)}"
							update="@form">
							<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
						</p:commandLink>



					</p:column>

				</p:dataTable>

				<div style="text-align: right;">
					<p:commandButton value="#{lbl['lbl.cm.item.code.search.title']}" update="@form"
						disabled="#{unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes.size() >=1}"
						action="#{unspscCodeBackingBean.navigateToSearch}"
						rendered="#{unspscCodeBackingBean.catalogueAdmin}"></p:commandButton>
				</div>
			</p:panel>
			<p:panel id="reviewUnspscCodeRemark" header="#{lbl['lbl.cm.remarks']}" toggleable="true">
				<ui:include src="codiRemarks.xhtml"/> 
			</p:panel>
		</h:panelGroup>
	</ui:define>


</ui:composition>
