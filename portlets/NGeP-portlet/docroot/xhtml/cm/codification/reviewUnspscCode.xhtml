<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<p:messages showDetail="true" autoUpdate="true" closable="true"
			showSummary="true"></p:messages>
		<h:panelGroup id="cmReviewUnspsc">


			<div style="text-align: right;">
				<ui:repeat var="action"
					value="#{unspscCodeBackingBean.managedBean.action}">
					<p:commandButton value="#{action}"
						rendered="#{action != 'REQUEST EXTENSION'}"
						action="#{unspscCodeBackingBean.bpmTesting(action)}"
						update="@form"></p:commandButton>
				</ui:repeat>

			</div>

			<ui:include src="DocumentHeader.xhtml"></ui:include>


			<p:panel header="Request Info" toggleable="true">

				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="Item Type"></p:outputLabel></td>
						<td><p:selectOneMenu disabled="true"
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemType}"
								style="width:228px;">
								<f:selectItem itemValue="P" itemLabel="Product " />
								<f:selectItem itemValue="S" itemLabel="Service" />
							</p:selectOneMenu></td>
							<td></td>
							<td></td>
					</tr>

					<tr>
						<td><p:outputLabel value="* #{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemName}"
								disabled="true" size="40"></p:inputText></td>
						<td><p:outputLabel value="* #{lbl['lbl.cm.item.details']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemDetail}"
								disabled="true" size="40"></p:inputText></td>
					</tr>
					<h:panelGroup id="extensionFiledsId"
						rendered="#{unspscCodeBackingBean.managedBean.requestCode.itemType != 'S'}">
						<tr>
							<td><p:outputLabel value="* #{lbl['lbl.cm.type']}"></p:outputLabel></td>
							<td><p:inputText
									value="#{unspscCodeBackingBean.managedBean.requestCode.typeName}"
									disabled="true" size="40"></p:inputText></td>
							<td><p:outputLabel value="* #{lbl['lbl.cm.brand']}"></p:outputLabel></td>
							<td><p:inputText
									value="#{unspscCodeBackingBean.managedBean.requestCode.brandName}"
									disabled="true" size="40"></p:inputText></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* #{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
							<td><p:inputText
									value="#{unspscCodeBackingBean.managedBean.requestCode.measurementName}"
									disabled="true" size="40"></p:inputText></td>
							<td><p:outputLabel value="* #{lbl['lbl.cm.color']}"></p:outputLabel></td>
							<td><p:inputText
									value="#{unspscCodeBackingBean.managedBean.requestCode.colorName}"
									disabled="true" size="40"></p:inputText></td>
						</tr>
					</h:panelGroup>
				</table>

			</p:panel>

			<p:panel header="Search and Recommend" toggleable="true">

				<div style="text-align: right;">
					<p:commandButton value="#{lbl['lbl.cm.search']}" update="@form"
						action="#{unspscCodeBackingBean.navigateToSearch}"
						rendered="#{unspscCodeBackingBean.catalogueAdmin}"
						icon="ui-icon-search"></p:commandButton>
				</div>

				<p:dataTable id="recomemendUnspscId" rowIndexVar="rowIndex"
					value="#{unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes}"
					var="unspscObj" width="100%">



					<p:column>
						<f:facet name="header">
					Recommended Item Code
				</f:facet>

				
						#{unspscObj.unspscCode}
						


				</p:column>
					<p:column>
						<f:facet name="header">
					Recommended Item Name
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>

					<p:column rendered="#{unspscCodeBackingBean.catalogueAdmin}">
						<f:facet name="header">
							#{lbl['lbl.cm.action']}
						</f:facet>
						<p:commandLink
							action="#{unspscCodeBackingBean.removeRecommendCode(rowIndex)}"
							update=":form:recomemendUnspscId">
							<p:graphicImage value="/resources/ep/images/design/trash.png"></p:graphicImage>
						</p:commandLink>



					</p:column>

				</p:dataTable>


			</p:panel>


		</h:panelGroup>




	</ui:define>


</ui:composition>
