	<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


         <script>
			$('#portlet_codificationMaintenance_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.cm.codification.maintenance.title']}");
		</script>
	<h:outputStylesheet library="ep/css" name="common.css"  />

	<h:panelGroup id="cmUNSPSCsearchID">
	
		<p:panel id="panel1" header="#{lbl['lbl.cm.define.search']}" toggleable="true">
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.itype']}"></p:outputLabel></td>
					<td>
						<p:selectOneMenu id="itemType" value="#{codificationMaintenanceBackingBean.managedBean.typeName}" style="width:30%">
							<f:selectItems value="#{codificationMaintenanceBackingBean.managedBean.typeList}"></f:selectItems>
						</p:selectOneMenu>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
					<td colspan="1"><p:autoComplete size="40"
							title="#{lbl['lbl.cm.eight.digits']}" maxlength="8"
							value="#{codificationMaintenanceBackingBean.managedBean.autoCompleteUnspscCode.unspscCode}"
							completeMethod="#{codificationMaintenanceBackingBean.autoCompleteUnspsc}"
							maxResults="15" dropdown="false" forceSelection="false" /><p:graphicImage id="itemNameID"
										value="/css/images/design/tooltips.png" /> <p:tooltip
										for="itemNameID">
										<p:outputLabel escape="false"
											value="#{lbl['lbl.tooltip.item.code']}" />
									</p:tooltip>
							</td>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
					<td><p:inputText title="#{lbl['lbl.cm.title.english']}"
							value="#{codificationMaintenanceBackingBean.managedBean.titleFilterBean.searchValue}"
							size="40" /><p:graphicImage id="itemCodeID"
										value="/css/images/design/tooltips.png" /> <p:tooltip
										for="itemCodeID">
										<p:outputLabel escape="false"
											value="#{lbl['lbl.tooltip.product.service']}" />
									</p:tooltip>
							</td>
				</tr>
			</table>

			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{codificationMaintenanceBackingBean.unspscSearch}"
					 update="unspscObjectTableID itemCodeSearchMsg" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}" 
				    action="#{codificationMaintenanceBackingBean.resetSearch}" 
				     update="panel1,unspscObjectTableID"/>					 	 
			</div>
		</p:panel>

		<p:panel header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable tableStyleClass="fixedTable" id="unspscObjectTableID" lazy="true" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{codificationMaintenanceBackingBean.searchDataModel}" var="unspscObj"
				width="100%" rows="10">

				<ac:paginator for="unspscObjectTableID"></ac:paginator>

				<p:column  styleClass="wrappedTd" sortBy="#{unspscObj.unspscCode}">
					<f:facet name="header">
					#{lbl['lbl.cm.unspsc.code']}
				</f:facet>
				
					<p:commandLink action="#{codificationMaintenanceBackingBean.goToAddServiceConfirmPopUp(unspscObj)}" disabled="true"
						rendered="#{unspscObj.unspscLevel eq 3}">
						#{unspscObj.unspscCode}
					</p:commandLink>
					
					   <p:commandLink				
						action="#{codificationMaintenanceBackingBean.unspscPopUpSearch(unspscObj)}"
						onclick="codificationMaintenanceSearchPopUpPortal.show()" update=":form:codificationPopUpId,:form:unspscTablePopUpId"
					    rendered="#{unspscObj.unspscLevel ne 3}">						
						#{unspscObj.unspscCode}
					</p:commandLink>
					
				</p:column>
				<p:column  styleClass = "wrappedTd" sortBy="#{unspscObj.unspscTitle}">
					<f:facet name="header">
					#{lbl['lbl.cm.unspsc.title'].concat(' (').concat(lbl['lbl.cm.lang']).concat(')')}
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>
				<p:column  styleClass = "wrappedTd" sortBy="#{unspscObj.unspscTitleEng}">
					<f:facet name="header">
					#{lbl['lbl.cm.unspsc.title'].concat(' (').concat(lbl['lbl.cm.lang.eng']).concat(')')}
				</f:facet>
				#{unspscObj.unspscTitleEng}
			</p:column>
				<p:column headerText="#{lbl['lbl.ct.action']}"  styleClass="column-align-center"  style="width:10%;white-space:normal;">
					<p:menuButton id="menuButtonId" value="#{lbl['lbl.btn.option']}" rendered="#{unspscObj.unspscLevel eq 3}">
						<p:menuitem id="menuItemId1" value="#{lbl['lbl.cm.item.code.maintenance.title.option']}" icon="ui-icon-view"							  
							action="#{codificationMaintenanceBackingBean.PopupOption(unspscObj)}">
						</p:menuitem>						
						  <p:menuitem id="menuItemId2" value="#{lbl['lbl.cm.extension.code.maintenance.title.option']}" icon="ui-icon-view"	
						              rendered="#{!(codificationMaintenanceBackingBean.productCode(unspscObj.unspscCode))}"					            
						              action="#{codificationMaintenanceBackingBean.PopupExtensionCode(unspscObj)}">
						</p:menuitem>
					</p:menuButton>
				</p:column>					
			</p:dataTable>
		</p:panel>
		
		<p:dialog id="codificationMaintenanceSearchPopUpPortal" widgetVar="codificationMaintenanceSearchPopUpPortal" modal="true"
			header="#{lbl['lbl.cm.item.code.search.title']}" resizable="false"  styleClass="pop_up_top" width="800" height="500">
			<ui:include src="codificationMaintenanceSearchPopUpPortal.xhtml"></ui:include>	
			</p:dialog>

	</h:panelGroup>
	
</ui:composition>
