<ui:composition		
   template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	
		<ui:define name="contentSection">
		
		
		<h:panelGroup id="cmUNSPSCSingleUploadID">
			<p:messages id="form" showDetail="true" autoUpdate="true" closable="true"
				showSummary="true"></p:messages>
				
	    <table width="100%">
			<tr>
				<td style="text-align: left"><p:commandButton style="width: 100px;"
						value="#{lbl['lbl.btn.back']}"
						action="#{codificationMaintenanceBackingBean.backToPrevPortal}">
						</p:commandButton></td>
			   <td style="text-align: right"><p:commandButton style="width: 100px;"
						 value="#{lbl['lbl.cm.save']}"
						 onclick="updateData.show()">
					   </p:commandButton></td>
				</tr>
		</table>
	<br/>
		
		<p:panel  header="#{lbl['lbl.cm.item.code.information']}" toggleable="true">
		
		<table width="100%;">
		
			<tr>
				<td width="15%"><p:outputLabel style="font-weight: bold;"  
						value="#{lbl['lbl.cm.segment.code']}"></p:outputLabel></td>
				<td width="30%"><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.segmentCode}"/></td>

				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.segment.title']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.segmentTitle}"
						style="white-space:normal!important;" /></td>
			</tr>
			<tr>
				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.family.code']}"></p:outputLabel></td>
				<td width="30%"><h:outputText id="familyCode"
						value="#{codificationMaintenanceBackingBean.managedBean.familyCode}"/></td>

				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.family.title']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.familyTitle}"
						style="white-space:normal!important;" /></td>
			</tr>
			<tr>
				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.class.code']}"></p:outputLabel></td>
				<td width="30%"><h:outputText id="classCode"
						value="#{codificationMaintenanceBackingBean.managedBean.classCode}" /></td>
				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.class.title']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.classTitle}"
						style="white-space:normal!important;" /></td>
			</tr>
			<tr>
				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.commodity.code']} "></p:outputLabel></td>
				<td width="30%"><h:outputText id="commodityCode"
						value="#{codificationMaintenanceBackingBean.managedBean.selectedUNSPSCObj.unspscCode}" /></td>
				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.commodity.title']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}"
						style="white-space:normal!important;"/></td>
		   </tr>
		</table>
		</p:panel>
		
		<p:panel  header="#{lbl['lbl.cm.item.code.maintenance']}" toggleable="true">
			<p:panelGrid style="width:100%;" styleClass="tablePanel"
					id="tablePanelId">
					<f:facet name="header">
						<p:row>
							<p:column>
								<h:outputLabel value="" />
							</p:column>
							<p:column>
								<h:outputText value="*" styleClass="mandatory" />
								<h:outputText style="color:white;"  value=" #{lbl['lbl.cm.code']}" />
							</p:column>
							<p:column>
								<h:outputText value="*" styleClass="mandatory" />
								<h:outputText style="color:white;"  value=" #{lbl['lbl.cm.doc.title']}" />
							</p:column>
							<p:column>
								<h:outputText value="*" styleClass="mandatory" />
								<h:outputText style="color:white;"  value=" #{lbl['lbl.cm.doc.title.eng']}" />
							</p:column>
						</p:row>
					</f:facet>
				<p:row>
					<p:column>
						<h:outputLabel value="#{lbl['lbl.cm.segment']}"/>
					</p:column>
					<p:column>
						<p:inputText style="width:120px;"
							value="#{codificationMaintenanceBackingBean.managedBean.segmentCode}" disabled="true"></p:inputText>
					</p:column>
					<p:column>
							<!--#35503 Fix as-is bug: #38727 - Start -->
							<p:inputText id="segTitle" style="width:420px;"
								value="#{codificationMaintenanceBackingBean.managedBean.segmentTitle}"
								maxlength="200"
								disabled="#{codificationMaintenanceBackingBean.managedBean.editMode}">
							</p:inputText>
							<!--#35503 Fix as-is bug: #38727 - End -->
							<p:spacer width="5px" />
							<p:commandLink action="#{codificationMaintenanceBackingBean.editSegment()}" partialSubmit="true" update=":form:segTitle">
								<h:graphicImage value="/css/images/design/ico-edit.png" />	
							</p:commandLink>
					</p:column>
					<p:column>
							<!--#35503 Fix as-is bug: #38727 - Start -->
							<p:inputText id="segTitleEng" style="width:420px;"
								value="#{codificationMaintenanceBackingBean.managedBean.segmentTitleEng}"
								maxlength="200"
								disabled="#{codificationMaintenanceBackingBean.managedBean.editMode}">
							</p:inputText>
							<!--#35503 Fix as-is bug: #38727 - End -->
							<p:spacer width="5px" />
							<p:commandLink action="#{codificationMaintenanceBackingBean.editSegment()}" partialSubmit="true" update=":form:segTitleEng">
								<h:graphicImage value="/css/images/design/ico-edit.png" />	
							</p:commandLink>
					</p:column>
				</p:row>
				
				<p:row>
					<p:column>
						<h:outputLabel value="#{lbl['lbl.cm.family']}"/>
					</p:column>
					<p:column>
						<p:inputText style="width:120px;"
							value="#{codificationMaintenanceBackingBean.managedBean.familyCode}"  disabled="true"></p:inputText>
					</p:column>
					<p:column>
							<!--#35503 Fix as-is bug: #38727 - Start -->
							<p:inputText id="famTitle" style="width:420px;"
								value="#{codificationMaintenanceBackingBean.managedBean.familyTitle}"
								maxlength="200"
								disabled="#{codificationMaintenanceBackingBean.managedBean.editModeFamily}">
							</p:inputText>
							<!--#35503 Fix as-is bug: #38727 - End -->
							<p:spacer width="5px" />
								<p:commandLink action="#{codificationMaintenanceBackingBean.editFamily()}" partialSubmit="true" update=":form:famTitle">
								<h:graphicImage value="/css/images/design/ico-edit.png" />	
							</p:commandLink>
					</p:column>
					<p:column>
							<!--#35503 Fix as-is bug: #38727 - Start -->
							<p:inputText id="famTitleEng" style="width:420px;"
								value="#{codificationMaintenanceBackingBean.managedBean.familyTitleEng}"
								maxlength="200"
								disabled="#{codificationMaintenanceBackingBean.managedBean.editModeFamily}">
							</p:inputText>
							<!--#35503 Fix as-is bug: #38727 - End -->
							<p:spacer width="5px" />
								<p:commandLink action="#{codificationMaintenanceBackingBean.editFamily()}" partialSubmit="true" update=":form:famTitleEng">
								<h:graphicImage value="/css/images/design/ico-edit.png" />	
							</p:commandLink>
					</p:column>
				</p:row>
				
				
				<p:row>
					<p:column>
						<h:outputLabel value="#{lbl['lbl.cm.class']}"/>
					</p:column>
					<p:column>
						<p:inputText style="width:120px;"
							value="#{codificationMaintenanceBackingBean.managedBean.classCode}"  disabled="true"></p:inputText>
					</p:column>
					<p:column>
							<!--#35503 Fix as-is bug: #38727 - Start -->
							<p:inputText id="classTitle" style="width:420px;"
								value="#{codificationMaintenanceBackingBean.managedBean.classTitle}"
								maxlength="200"
								disabled="#{codificationMaintenanceBackingBean.managedBean.editModeClass}">
							</p:inputText>
							<!--#35503 Fix as-is bug: #38727 - End -->
							<p:spacer width="8px" />
							<p:commandLink action="#{codificationMaintenanceBackingBean.editClass()}" partialSubmit="true" update=":form:classTitle">
								<h:graphicImage value="/css/images/design/ico-edit.png" />	
							</p:commandLink>
					</p:column>
					<p:column>
							<!--#35503 Fix as-is bug: #38727 - Start -->
							<p:inputText id="classTitleEng" style="width:420px;"
								value="#{codificationMaintenanceBackingBean.managedBean.classTitleEng}"
								maxlength="200"
								disabled="#{codificationMaintenanceBackingBean.managedBean.editModeClass}">
							</p:inputText>
							<!--#35503 Fix as-is bug: #38727 - End -->
							<p:spacer width="8px" />
							<p:commandLink action="#{codificationMaintenanceBackingBean.editClass()}" partialSubmit="true" update=":form:classTitleEng">
								<h:graphicImage value="/css/images/design/ico-edit.png" />	
							</p:commandLink>	
					</p:column>
				</p:row>
				
				
				<p:row>
					<p:column>
						<h:outputLabel value="#{lbl['lbl.cm.commodity']}"/>
					</p:column>
					<p:column>
						<p:inputText style="width:120px;"
							value="#{codificationMaintenanceBackingBean.managedBean.selectedUNSPSCObj.unspscCode}" disabled="true"></p:inputText>
					</p:column>
					<p:column>
							<!--#35503 Fix as-is bug: #38727 - Start -->
							<p:inputText style="width:420px;"
								value="#{codificationMaintenanceBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}"
								maxlength="200">
							</p:inputText>
							<!--#35503 Fix as-is bug: #38727 - End -->
						</p:column>
					<p:column>
							<!--#35503 Fix as-is bug: #38727 - Start -->
							<p:inputText style="width:420px;"
								value="#{codificationMaintenanceBackingBean.managedBean.selectedUNSPSCObj.unspscTitleEng}"
								maxlength="200">
							</p:inputText>
							<!--#35503 Fix as-is bug: #38727 - End -->
						</p:column>
				</p:row>

			
			</p:panelGrid>
		</p:panel>

			<ac:confirmationPopup id="updateData" widget="updateData"
				okAction="codificationMaintenanceBackingBean.SubmitUpdateData()"
				width="400" height="100"
				title="#{lbl['lbl.cm.dialog.cofirm.header']}"
				content="#{lbl['lbl.cm.dialog.message.item.code.maintenance']}"
				update=":form" />
		</h:panelGroup>
	

  </ui:define>
 
	
 </ui:composition>
