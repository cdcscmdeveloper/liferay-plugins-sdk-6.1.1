<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup rendered="#{unspscCodeBackingBean.allSupplier}">
		<script>
			$('#portlet_codification_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.cm.item.code.search']}");
		</script>
	</h:panelGroup>
	<h:panelGroup rendered="#{!unspscCodeBackingBean.allSupplier}">
		<script>
			$('#portlet_codification_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.cm.item.code.search.title']}");
		</script>
	</h:panelGroup>


	<h:panelGroup id="cmUNSPSCsearchID">
		<h:panelGroup
			rendered="#{unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.allSupplier}">
			<table style="width: 80%">
				<tr>
					<td style="width: 80%;"><div class="navDiv" id="menuDiv"
							align="center">
							<ul class="menu-text" style="margin: 5px 0 0 -50px;">
								<li style="width: 210px;"><h:outputText
										value="#{lbl['lbl.cm.choose.unspsc']}" /></li>

								<li style="width: 210px;"><h:outputText
										value="#{lbl['lbl.cm.choose.product.service']}" /></li>

								<li style="width: 210px;"><h:outputText
										value="#{lbl['lbl.cm.complete.product.details']}" /></li>
							</ul>
							<ul id="tripMeter" class="menu-line">
								<li class="red-dot" style="margin-right: 200px;" />
								<li class="black-dot" style="margin-right: 200px;" />
								<li class="black-dot" />

							</ul>
						</div></td>
					<td></td>
				</tr>
			</table>
		</h:panelGroup>
		<br />
		<p:panel header="#{lbl['lbl.cm.define.search']}" toggleable="true">
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
					<td colspan="1"><p:autoComplete size="40"
							title="#{lbl['lbl.cm.eight.digits']}" maxlength="8"
							value="#{codificationBackingBean.managedBean.autoCompleteUnspscCode.unspscCode}"
							completeMethod="#{codificationBackingBean.autoCompleteUnspsc}"
							maxResults="15" dropdown="false" forceSelection="true" /><p:graphicImage id="itemNameID"
										value="/css/images/design/tooltips.png" /> <p:tooltip
										for="itemNameID">
										<p:outputLabel escape="false"
											value="#{lbl['lbl.tooltip.item.code']}" />
									</p:tooltip></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
					<td><p:inputText title="#{lbl['lbl.cm.title.english']}"
							value="#{codificationBackingBean.managedBean.titleFilterBean.searchValue}"
							size="40" /><p:graphicImage id="itemCodeID"
										value="/css/images/design/tooltips.png" /> <p:tooltip
										for="itemCodeID">
										<p:outputLabel escape="false"
											value="#{lbl['lbl.tooltip.product.service']}" />
									</p:tooltip></td>
				</tr>
			</table>

			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{codificationBackingBean.unspscSearch}"
					update="unspscTableID itemCodeSearchMsg" />
			</div>
		</p:panel>



		<p:panel header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable id="unspscTableID" lazy="true"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{codificationBackingBean.managedBean.searchDataModel}"
				var="unspscObj" width="100%" rows="10">



				<ac:paginator for="unspscTableID"></ac:paginator>


				<p:column width="15%" sortBy="#{unspscObj.unspscCode}">
					<f:facet name="header">
					#{lbl['lbl.cm.unspsc.code']}
				</f:facet>

					<p:commandLink
						action="#{codificationBackingBean.goToExtensionSearch(unspscObj)}"
						rendered="#{codificationBackingBean.productCode(unspscObj.unspscCode) and (unspscObj.unspscLevel eq 3)}">
							#{unspscObj.unspscCode}
							</p:commandLink>

					<h:panelGroup rendered="#{unspscCodeBackingBean.allSupplier}">
						<p:commandLink
							action="#{codificationBackingBean.goToAddServiceConfirmPopUp(unspscObj)}"
							rendered="#{!(codificationBackingBean.productCode(unspscObj.unspscCode)) and (unspscObj.unspscLevel eq 3)}"
							onclick="confirmationPopUp.show()"
							update=":form:confirmationPopUpId">
							#{unspscObj.unspscCode}
							</p:commandLink>
					</h:panelGroup>
					
					
					<h:panelGroup rendered="#{!unspscCodeBackingBean.allSupplier}">
						<h:outputLabel value="#{unspscObj.unspscCode}" style="float:left;"
							rendered="#{!(codificationBackingBean.productCode(unspscObj.unspscCode)) and (unspscObj.unspscLevel eq 3)}">
							
							</h:outputLabel>
					</h:panelGroup>
					
					<p:commandLink
						action="#{codificationBackingBean.unspscPopUpSearch(unspscObj)}"
						onclick="unspscPopUp.show()" update=":form:codificationPopUpId"
						rendered="#{unspscObj.unspscLevel ne 3}">
							#{unspscObj.unspscCode}
							</p:commandLink>


				</p:column>
				<p:column sortBy="#{unspscObj.unspscTitle}">
					<f:facet name="header">
					#{lbl['lbl.cm.unspsc.title']}
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>

			</p:dataTable>

			<div class="clear"></div>
			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.cm.request.unspsc']}"
					rendered="#{unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.allSupplier}"
					action="#{unspscCodeBackingBean.requestUnspscCode}" />
			</div>


		</p:panel>

		<p:dialog id="unspscPopUp" widgetVar="unspscPopUp" modal="true"
			header="#{lbl['lbl.cm.item.code.search']}" width="800" height="400">

			<ui:include src="codificationSearchPopUp.xhtml"></ui:include>

		</p:dialog>

		<p:dialog id="confirmationPopUp" widgetVar="confirmationPopUp"
			modal="true" header="#{lbl['lbl.cm.add.to.catalogue']}" width="350"
			height="200">

			<ui:include src="addServiceConfirmationPopUp.xhtml"></ui:include>

		</p:dialog>

	</h:panelGroup>



</ui:composition>
