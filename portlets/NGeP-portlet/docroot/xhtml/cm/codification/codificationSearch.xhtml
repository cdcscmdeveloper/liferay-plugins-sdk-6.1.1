<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<h:panelGroup id="cmUNSPSCsearchID">
		<h:outputLabel styleClass="titleFront"
			value="#{lbl['lbl.cm.codification.search']}"></h:outputLabel>

		<table>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></h:outputLabel></td>
				<td colspan="1"><h:inputText /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></h:outputLabel></td>
				<td><h:inputText /></td>
				<td><p:commandButton value="search" /></td>
			</tr>

		</table>

		<p:remoteCommand name="extensionSearch"
			action="#{unspscCodeBackingBean.goToExtensionSearch}" />

		<p:dataTable id="unspscTableID"
			value="#{unspscCodeBackingBean.managedBean.unspscList}"
			var="unspscObj" rowKey="#{unspscObj.unspscID}"
			selection="#{unspscCodeBackingBean.managedBean.selectedUNSPSCObj}"
			width="100%" selectionMode="single">

			<p:ajax event="rowSelect" oncomplete="extensionSearch();" />

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.unspsc.code']}" />
				</f:facet>
				<h:outputText value="#{unspscObj.unspscCode}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.cm.unspsc.title']}" />
				</f:facet>
				<h:outputText value="#{unspscObj.unspscTitle}" />
			</p:column>
		</p:dataTable>

	</h:panelGroup>



</ui:composition>
