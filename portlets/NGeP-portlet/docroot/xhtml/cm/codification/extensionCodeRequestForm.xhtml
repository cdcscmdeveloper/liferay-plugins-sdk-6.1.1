<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<h:panelGrid columns="2" columnClasses="cmLeft,cmRight" width="100%">


			<ui:include src="itemMenu.xhtml"></ui:include>

			<h:panelGroup id="cmExtensionRequestFormID">

				<h:outputLabel styleClass="titleFront"
					value="#{lbl['lbl.cm.extension.code.request.form']}"></h:outputLabel>



				<table>
					<tr>
						<td><h:outputLabel value="#{lbl['lbl.cm.unspsc.code']}" /></td>
						<td><h:inputText /></td>
						<td><p:commandButton value="Find" /></td>
					</tr>
					<tr>
						<td><h:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></h:outputLabel></td>
						<td cosplan="1"><h:outputLabel
								value="Display After click find"></h:outputLabel></td>
					</tr>
				</table>

				<p:dataTable>
					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.cm.type']}" />
						</f:facet>

					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.cm.brand']}" />
						</f:facet>
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.cm.measurement']}" />
						</f:facet>

					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.cm.color']}" />
						</f:facet>

					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.cm.item.name']}" />
						</f:facet>

					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.cm.item.description']}" />
						</f:facet>

					</p:column>

					<f:facet name="footer">
						<p:commandButton value="Add More" onclick="extensionPopUp.show()"
							process="@this"></p:commandButton>
					</f:facet>
				</p:dataTable>

				<div style="text-align: right;">
					<p:commandButton value="Submit"></p:commandButton>
				</div>

				<p:dialog id="extensionDialog" widgetVar="extensionPopUp"
					width="600" height="500">

					<ui:include src="requestExtensionPopUp.xhtml" />

				</p:dialog>

			</h:panelGroup>

		</h:panelGrid>


	</ui:define>

</ui:composition>
