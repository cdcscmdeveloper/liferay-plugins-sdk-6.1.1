<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns="http://www.w3.org/1999/xhtml">

	<h:panelGroup id="requestExtPopUpId">
		<p:messages id="messageId" showDetail="true" autoUpdate="true" closable="true" showSummary="false"></p:messages>
		
		<h:outputText styleClass="instruction" value="#{lbl['lbl.cm.request.extension.help.msg']}"></h:outputText>
		<div class="clear"></div>
		
		
		<table style="width: 100%;">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.rpt.unspscCode']}" /></td>
				<td colspan="3"><p:inputText
						value="#{extensionCodeCreationBackingBean.managedBean.requestExtCode.tempCode}"
						disabled="true" size="40"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.rpt.unspscTitle']}" /></td>
				<td colspan="3"><p:inputText
						value="#{extensionCodeCreationBackingBean.managedBean.requestExtCode.tempTitle}"
						disabled="true" size="40"></p:inputText></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.type']}" /><p:outputLabel value="*" styleClass="mandatory"/></td>
				<td><p:inputText id="requestTypeId" maxlength="100"
						value="#{extensionCodeCreationBackingBean.managedBean.tempTypeName}"
						disabled="#{extensionCodeCreationBackingBean.managedBean.typeDisable}">
						</p:inputText></td>
				<td><p:selectBooleanCheckbox
						value="#{extensionCodeCreationBackingBean.managedBean.requestType}">
						<p:ajax listener="#{extensionCodeCreationBackingBean.requestNewType}"
							update="requestTypeId"></p:ajax>
					</p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.request.new']}"></p:outputLabel></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.brand']}" /><p:outputLabel value="*" styleClass="mandatory"/></td>
				<td><p:inputText id="requestBrandId" maxlength="100"
						value="#{extensionCodeCreationBackingBean.managedBean.tempBrandName}"
						disabled="#{extensionCodeCreationBackingBean.managedBean.brandDisable}">
						</p:inputText></td>
				<td><p:selectBooleanCheckbox
						value="#{extensionCodeCreationBackingBean.managedBean.requestBrand}">
						<p:ajax listener="#{extensionCodeCreationBackingBean.requestNewBrand}"
							update="requestBrandId"></p:ajax>
					</p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.request.new']}"></p:outputLabel></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}" /><p:outputLabel value="*" styleClass="mandatory"/></td>
				<td><p:inputText id="requestMeasurementId" maxlength="100"
						value="#{extensionCodeCreationBackingBean.managedBean.tempMeasurementName}"
						disabled="#{extensionCodeCreationBackingBean.managedBean.measurementDisable}">
						</p:inputText></td>
				<td><p:selectBooleanCheckbox
						value="#{extensionCodeCreationBackingBean.managedBean.requestMeasurement}">
						<p:ajax listener="#{extensionCodeCreationBackingBean.requestNewMeasurement}"
							update="requestMeasurementId"></p:ajax>
					</p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.request.new']}"></p:outputLabel></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.color']}" /><p:outputLabel value="*" styleClass="mandatory"/></td>
				<td><p:inputText id="requestColorId" maxlength="100"
						value="#{extensionCodeCreationBackingBean.managedBean.tempColorName}"
						disabled="#{extensionCodeCreationBackingBean.managedBean.colorDisable}">
						</p:inputText></td>
				<td><p:selectBooleanCheckbox
						value="#{extensionCodeCreationBackingBean.managedBean.requestColor}">
						<p:ajax listener="#{extensionCodeCreationBackingBean.requestNewColor}"
							update="requestColorId"></p:ajax>
					</p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.request.new']}"></p:outputLabel></td>
			</tr>

		</table>


		<div style="text-align: right;">

			<p:commandButton value="#{lbl['lbl.cm.ok']}" 
				action="#{extensionCodeCreationBackingBean.addNewRequest}"
				update=":form:addBtnId :form:extCodeCreationId :form:requestExtPopUpId :form:btnSubmit" />

			<p:commandButton value="#{lbl['lbl.cm.cancel']}"
				 immediate="true"
				onclick="extensionPopUp.hide()"></p:commandButton>
		</div>

		<div class="clear"></div>

		

	</h:panelGroup>





</ui:composition>
