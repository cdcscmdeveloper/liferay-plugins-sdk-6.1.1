<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:messages showDetail="true" autoUpdate="true" closable="true" showSummary="true">
		</p:messages>

		<div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px;">
			<div style="flex: 1; text-align: left;">
				<p:commandButton value="#{lbl['lbl.cm.back']}" action="#{codificationBackingBean.backToPrev}" />
			</div>
			<div style="text-align: right;">
				<p:commandLink value="#{lbl['lbl.audit.link.auditTrail']}"
					action="#{auditCodificationManagementReportBackingBean.redirectToAuditTrailView(
					codificationBackingBean.managedBean.segmentCode,
					codificationBackingBean.managedBean.familyCode,
					codificationBackingBean.managedBean.classCode,
					codificationBackingBean.managedBean.selectedUNSPSCObj.unspscCode)}"
					rendered="#{auditCodificationManagementReportBackingBean.isAuditTrailView()}" />
			</div>
		</div>
		<br/>
		<h:panelGroup id="cmExtensionSearchID">
			<p:panel header="#{lbl['lbl.cm.item.code.information']}" toggleable="true">
				<table style="width: 100%;">
					<tr>
						<td width="15%">
							<p:outputLabel value="#{lbl['lbl.cm.segment.code']}" style="font-weight: bold;">
							</p:outputLabel>
						</td>
						<td width="30%">
							<h:outputText style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.segmentCode}" />
						</td>
						<td width="15%">
							<p:outputLabel value="#{lbl['lbl.cm.segment.title']}" style="font-weight: bold;">
							</p:outputLabel>
						</td>
						<td>
							<h:outputText style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.segmentTitle}" />
						</td>
					</tr>
					<tr>
						<td width="15%">
							<p:outputLabel value="#{lbl['lbl.cm.family.code']}" style="font-weight: bold;">
							</p:outputLabel>
						</td>
						<td width="30%">
							<h:outputText style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.familyCode}" />
						</td>
						<td width="15%">
							<p:outputLabel value="#{lbl['lbl.cm.family.title']}" style="font-weight: bold;">
							</p:outputLabel>
						</td>
						<td>
							<h:outputText style="white-space: normal!important;" value="#{codificationBackingBean.managedBean.familyTitle}" />
						</td>
					</tr>
					<tr>
						<td width="15%">
							<p:outputLabel value="#{lbl['lbl.cm.class.code']}" style="font-weight: bold;">
							</p:outputLabel>
						</td>
						<td width="30%">
							<h:outputText style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.classCode}" />
						</td>
						<td width="15%">
							<p:outputLabel value="#{lbl['lbl.cm.class.title']}" style="font-weight: bold;">
							</p:outputLabel>
						</td>
						<td>
							<h:outputText style="white-space: normal!important;" value="#{codificationBackingBean.managedBean.classTitle}" />
						</td>
					</tr>
					<tr>
						<td width="15%">
							<p:outputLabel value="#{lbl['lbl.cm.commodity.code']}" style="font-weight: bold;">
							</p:outputLabel>
						</td>
						<td width="30%">
							<h:outputText style="white-space: normal!important;" value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscCode}" />
						</td>
						<td width="15%">
							<p:outputLabel value="#{lbl['lbl.cm.commodity.title']}" style="font-weight: bold;">
							</p:outputLabel>
						</td>
						<td>
							<h:outputText style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}" />
						</td>
					</tr>
				</table>
			</p:panel>
		</h:panelGroup>
	</ui:define>
</ui:composition>
