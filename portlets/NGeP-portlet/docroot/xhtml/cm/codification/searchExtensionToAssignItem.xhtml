<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="contentSection">
		<p:messages showDetail="true" autoUpdate="true" closable="true"
			showSummary="false" />

		<div class="clear"></div>

		<p:panel header="#{lbl['lbl.cm.request.info']}" toggleable="true">

			<table style="width: 100%; margin-bottom: 4px;">
				<tr>
					<td width="10%"><p:outputLabel
							style="font-weight: bold;text-align: left;"
							value="#{lbl['lbl.cm.item.table.type']}"></p:outputLabel></td>
					<td width="30%"><h:outputText style="text-align: left;"
							value="#{codificationBackingBean.getParameterDesc(codificationBackingBean.managedBean.selectedRequestItem.itemType)}" /></td>
					<td width="10%"><p:outputLabel
							style="font-weight: bold;text-align: left;"
							value="#{lbl['lbl.cm.item.details']}"></p:outputLabel></td>
					<td><h:outputText
							style="text-align: left;white-space: normal!important;"
							value="#{codificationBackingBean.managedBean.selectedRequestItem.itemDesc}" /></td>

				</tr>


				<tr>
					<td width="10%"><p:outputLabel
							style="font-weight: bold;text-align: left;"
							value="#{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
					<td width="30%"><h:outputText
							style="text-align: left;white-space: normal!important;"
							value="#{codificationBackingBean.managedBean.selectedRequestItem.itemName}" />
						<p:spacer width="8" /> <p:commandLink
							rendered="#{fn:length(codificationBackingBean.managedBean.selectedRequestItem.ctPanelItem.ctPanelItemSpecs) > 0}"
							oncomplete="itemSpecDlg.show();">
							<p:graphicImage value="/css/images/design/ico-view.png"
								title="#{lbl['lbl.ct.specification']}" />
						</p:commandLink></td>
					<td width="10%"></td>
					<td></td>
				</tr>

			</table>

		</p:panel>

		<h:panelGroup id="cmExtensionSearchToAssignID">

			<p:panel header="#{lbl['lbl.cm.define.search']}" toggleable="true">

				<table style="width: 100%; margin-bottom: 4px; margin-bottom: 6px;">
					<tr>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.segment.code']}"></p:outputLabel></td>
						<td width="30%"><h:outputText
								style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.segmentCode}" /></td>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.segment.title']}"></p:outputLabel></td>
						<td><h:outputText style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.segmentTitle}" /></td>
					</tr>
					<tr>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.family.code']}"></p:outputLabel></td>
						<td width="30%"><h:outputText
								style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.familyCode}" /></td>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.family.title']}"></p:outputLabel></td>
						<td><h:outputText style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.familyTitle}" /></td>
					</tr>
					<tr>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.class.code']}"></p:outputLabel></td>
						<td width="30%"><h:outputText
								style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.classCode}" /></td>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.class.title']}"></p:outputLabel></td>
						<td><h:outputText style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.classTitle}" /></td>
					</tr>
					<tr>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.commodity.code']}"></p:outputLabel></td>
						<td width="30%"><h:outputText
								style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscCode}" /></td>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.commodity.title']}"></p:outputLabel></td>
						<td><h:outputText style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}" /></td>
					</tr>
					<tr height="8px;" />
					<tr>
						<td><h:outputText
								style="font-weight: bold; text-align: left;"
								value="#{lbl['lbl.cm.extension.attr']}"></h:outputText></td>


					</tr>

					<tr>
						<td><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.type']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu
								value="#{codificationBackingBean.typeFilterBean.searchValue}"
								style="width:278px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{codificationBackingBean.managedBean.typeCriteria}" />
							</p:selectOneMenu></td>
						<td><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.brand']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu
								value="#{codificationBackingBean.brandFilterBean.searchValue}"
								style="width:278px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{codificationBackingBean.managedBean.brandCriteria}" />
							</p:selectOneMenu></td>
					</tr>

					<tr>
						<td><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu
								value="#{codificationBackingBean.measurementFilterBean.searchValue}"
								style="width:278px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{codificationBackingBean.managedBean.measurementCriteria}" />
							</p:selectOneMenu></td>
						<td><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.color']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu
								value="#{codificationBackingBean.colorFilterBean.searchValue}"
								style="width:278px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{codificationBackingBean.managedBean.colorCriteria}" />
							</p:selectOneMenu></td>

					</tr>
				</table>
			</p:panel>
			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{codificationBackingBean.extensionCodeSearchForAssign}"
					update="itemTable2ID" />
				<p:commandButton value="#{lbl['lbl.btn.back']}"
					action="#{codificationBackingBean.backToSearchUnspscToAssign}" />
			</div>


			<p:panel header="#{lbl['lbl.cm.search.result']}" toggleable="true">

				<!-- #31503 Start -->
				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.qt.assign.item.code.instruction3']}" />
				<br />
				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.qt.assign.item.code.instruction4']}" />

				<p:dataTable id="itemTable2ID"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{codificationBackingBean.extensionSearchItemDataModel}"
					rowKey="#{obj}" var="obj" rowIndexVar="rowIndex" lazy="true"
					selection="#{codificationBackingBean.managedBean.objSelected}">

					<ac:paginator for="itemTable2ID"></ac:paginator>

<!-- 					<p:ajax event="rowSelectRadio" process="@this" partialSubmit="true" -->
<!-- 						update="@([id$=itemTable2ID], [id$=asignCodeDialConfirm])" -->
<!-- 						listener="#{codificationBackingBean.selectedItemCode}" /> -->
					<p:column selectionMode="single" />
					<!-- #31503 End -->

					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.type']}
						</f:facet>
						#{obj[4]}

					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.brand']}
						</f:facet>
						#{obj[5]}
					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.measurement']}
						</f:facet>
						
						#{obj[6]}

					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.color']}
						</f:facet>
						#{obj[7]}
					</p:column>

				</p:dataTable>
				<!-- #31503 Start -->
				<div style="text-align: right;">
					<p:commandButton value="#{lbl['lbl.sc.qt.assign.code']}"
						action="#{codificationBackingBean.assignItemConfirmation}" />


				</div>
				<!-- #31503 End -->
				
				<div class="clear"></div>
				<div style="text-align: right;">
					<p:commandButton value="#{lbl['lbl.cm.request.extension.code']}"
						rendered="#{codificationBackingBean.managedBean.isSourcing()}"
						action="#{codificationBackingBean.requestExtensionCodeII}" />


				</div>

			</p:panel>

			<!-- Item Specification PopUp -->
			<ui:include src="/xhtml/cm/codification/itemSpecDlg.xhtml" />

			<!-- #31503 Start -->
			<p:confirmDialog id="asignCodeDialConfirm"
				widgetVar="asignCodeDialConfirm"
				message="#{lbl['lbl.sc.qt.assign.item.code.confirmation']}"
				header="#{lbl['lbl.sc.item.details']}" resizable="true"
				closable="true">
				<p:outputLabel
					value="#{codificationBackingBean.managedBean.itemCodeDesc}" />
				<br />
				<br />

				<div align="right">
					<p:commandButton value="#{lbl['lbl.btn.ok']}"
						onclick="asignCodeDialConfirm.hide();"
						action="#{codificationBackingBean.insertContractedItemCode(codificationBackingBean.managedBean.objSelected)}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						update="@form" />
					<p:commandButton value="#{lbl['lbl.btn.cancel']}"
						onclick="asignCodeDialConfirm.hide();" update="@form" />
				</div>
			</p:confirmDialog>
			<!-- #31503 End -->

		</h:panelGroup>


	</ui:define>




</ui:composition>
