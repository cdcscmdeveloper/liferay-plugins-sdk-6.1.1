<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="contentSection">
		<p:messages showDetail="true" autoUpdate="true" closable="true"
			showSummary="false" />

		<div class="clear"></div>

		<p:panel header="#{lbl['lbl.cm.request.info']}" toggleable="true">

			<table style="width: 100%; margin-bottom: 4px;">
				<tr>
					<td width="10%"><p:outputLabel
							style="font-weight: bold;text-align: left;"
							value="#{lbl['lbl.cm.item.table.type']}"></p:outputLabel></td>
					<td width="30%"><h:outputText style="text-align: left;"
							value="#{codificationBackingBean.getParameterDesc(codificationBackingBean.managedBean.selectedRequestItem.itemType)}" /></td>
							<td width="10%"><p:outputLabel
							style="font-weight: bold;text-align: left;"
							value="#{lbl['lbl.cm.item.details']}"></p:outputLabel></td>
					<td><h:outputText
							style="text-align: left;white-space: normal!important;"
							value="#{codificationBackingBean.managedBean.selectedRequestItem.itemDesc}" /></td>
					
				</tr>


				<tr>
					<td width="10%"><p:outputLabel
							style="font-weight: bold;text-align: left;"
							value="#{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
					<td width="30%"><h:outputText
							style="text-align: left;white-space: normal!important;"
							value="#{codificationBackingBean.managedBean.selectedRequestItem.itemName}" />
							<p:spacer width="8" />
							<p:commandLink rendered="#{fn:length(codificationBackingBean.managedBean.selectedRequestItem.ctPanelItem.ctPanelItemSpecs) > 0}"
								oncomplete="itemSpecDlg.show();">
								<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.ct.specification']}" />
							</p:commandLink></td>
					<td width="10%"></td>
					<td></td>
				</tr>

			</table>

		</p:panel>

		<h:panelGroup id="cmExtensionSearchToAssignID">

			<p:panel header="#{lbl['lbl.cm.define.search']}" toggleable="true">

				<table style="width: 100%; margin-bottom: 4px;margin-bottom: 6px;" >
					<tr>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.segment.code']}"></p:outputLabel></td>
						<td width="30%"><h:outputText
								style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.segmentCode}" /></td>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.segment.title']}"></p:outputLabel></td>
						<td><h:outputText
								style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.segmentTitle}" /></td>
					</tr>
					<tr>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.family.code']}"></p:outputLabel></td>
						<td width="30%"><h:outputText
								style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.familyCode}" /></td>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.family.title']}"></p:outputLabel></td>
						<td ><h:outputText
								style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.familyTitle}" /></td>
					</tr>
					<tr>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.class.code']}"></p:outputLabel></td>
						<td width="30%"><h:outputText
								style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.classCode}" /></td>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.class.title']}"></p:outputLabel></td>
						<td><h:outputText
								style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.classTitle}" /></td>
					</tr>
					<tr>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.commodity.code']}"></p:outputLabel></td>
						<td width="30%"><h:outputText
								style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscCode}" /></td>
						<td width="15%"><p:outputLabel style="font-weight: bold;"
								value="#{lbl['lbl.cm.commodity.title']}"></p:outputLabel></td>
						<td><h:outputText
								style="white-space: normal!important;"
								value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}" /></td>
					</tr>
					<tr height="8px;"/>
					<tr>
						<td ><h:outputText style="font-weight: bold; text-align: left;"
								value="#{lbl['lbl.cm.extension.attr']}"></h:outputText></td>


					</tr>

					<tr>
						<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.cm.type']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu
								value="#{codificationBackingBean.typeFilterBean.searchValue}"
								style="width:278px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{codificationBackingBean.managedBean.typeCriteria}" />
							</p:selectOneMenu></td>
						<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.cm.brand']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu
								value="#{codificationBackingBean.brandFilterBean.searchValue}"
								style="width:278px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{codificationBackingBean.managedBean.brandCriteria}" />
							</p:selectOneMenu></td>
					</tr>

					<tr>
						<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu
								value="#{codificationBackingBean.measurementFilterBean.searchValue}"
								style="width:278px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{codificationBackingBean.managedBean.measurementCriteria}" />
							</p:selectOneMenu></td>
						<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.cm.color']}"></p:outputLabel></td>
						<td colspan="1"><p:selectOneMenu
								value="#{codificationBackingBean.colorFilterBean.searchValue}"
								style="width:278px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{codificationBackingBean.managedBean.colorCriteria}" />
							</p:selectOneMenu></td>

					</tr>
				</table>
			</p:panel>
			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{codificationBackingBean.extensionCodeSearch}"
					update="itemTable2ID" />
				<p:commandButton value="#{lbl['lbl.btn.back']}"
					action="#{codificationBackingBean.backToSearchUnspscToAssign}" />
			</div>


			<p:panel header="#{lbl['lbl.cm.search.result']}" toggleable="true">

				<p:dataTable id="itemTable2ID"
					value="#{codificationBackingBean.extensionSearchItemDataModel}"
					rowKey="#{obj}" var="obj" rowIndexVar="rowIndex"
					selection="#{codificationBackingBean.managedBean.selectedExtenstionForItem}"
					lazy="true">

					<ac:paginator for="itemTable2ID"></ac:paginator>

					<p:column selectionMode="single" style="width:2%" />
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.type']}
						</f:facet>
						#{obj[4]}

					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.brand']}
						</f:facet>
						#{obj[5]}
					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.measurement']}
						</f:facet>
						
						#{obj[6]}

					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.color']}
						</f:facet>
						#{obj[7]}
					</p:column>



				</p:dataTable>
				<div class="clear"></div>
				<div style="text-align: right;">
					<p:commandButton value="#{lbl['lbl.cm.request.extension.code']}"
						action="#{codificationBackingBean.requestExtensionCodeII}" />

					<p:commandButton value="#{lbl['lbl.cm.assign']}"
						action="#{codificationBackingBean.insertContractedItemCode}"
						></p:commandButton>


				</div>

			</p:panel>
			
			<!-- Item Specification PopUp -->
			<ui:include src="/xhtml/cm/codification/itemSpecDlg.xhtml" />

		</h:panelGroup>


	</ui:define>




</ui:composition>
