<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<p:messages showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>

		<h:panelGroup id="editExtensionID">
			<p:outputLabel styleClass="screen-title"
				value="#{lbl['lbl.cm.edit.extension.code']}"></p:outputLabel>

			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					action="#{codificationBackingBean.backToPrevious}"></p:commandButton>
				<p:commandButton value="save" action="#{codificationBackingBean.saveEditedCode}" update="@form"></p:commandButton>
			</div>


			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{codificationBackingBean.managedBean.editItem.cmUnspsc.unspscCode}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{codificationBackingBean.managedBean.editItem.cmUnspsc.unspscTitle}"
							disabled="true" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{codificationBackingBean.managedBean.editItem.itemName}"
							disabled="true" /></td>
				</tr>
			</table>

			<p:panelGrid styleClass="tablePanel">
				<f:facet name="header">
					<p:row>
						<p:column>
							#{lbl['lbl.cm.extension.type']}
						</p:column>
						<p:column>
							#{lbl['lbl.cm.old.description']}
						</p:column>
						<p:column>
							#{lbl['lbl.cm.new.description']}
						</p:column>
					</p:row>

				</f:facet>

				<p:row>
					<p:column>
						<p:outputLabel value="#{lbl['lbl.cm.type']}" />
					</p:column>
					<p:column>
						<p:inputText
							value="#{codificationBackingBean.managedBean.editItem.cmType.typeName}"
							disabled="true"></p:inputText>
					</p:column>
					<p:column>
						<p:inputText value="#{codificationBackingBean.managedBean.editTypeName}"></p:inputText>
					</p:column>
				</p:row>

				<p:row>
					<p:column>
						<p:outputLabel value="#{lbl['lbl.cm.brand']}" />
					</p:column>
					<p:column>
						<p:inputText
							value="#{codificationBackingBean.managedBean.editItem.cmBrand.brandName}"
							disabled="true"></p:inputText>
					</p:column>
					<p:column>
						<p:inputText value="#{codificationBackingBean.managedBean.editBrandName}"></p:inputText>
					</p:column>
				</p:row>

				<p:row>
					<p:column>
						<p:outputLabel value="#{lbl['lbl.cm.measurement']}" />
					</p:column>
					<p:column>
						<p:inputText
							value="#{codificationBackingBean.managedBean.editItem.cmMeasurement.measurementName}"
							disabled="true"></p:inputText>
					</p:column>
					<p:column>
						<p:inputText value="#{codificationBackingBean.managedBean.editMeasurementName}"></p:inputText>
					</p:column>
				</p:row>


				<p:row>
					<p:column>
						<p:outputLabel value="#{lbl['lbl.cm.color']}" />
					</p:column>
					<p:column>
						<p:inputText
							value="#{codificationBackingBean.managedBean.editItem.cmColor.colorName}"
							disabled="true"></p:inputText>
					</p:column>
					<p:column>
						<p:inputText value="#{codificationBackingBean.managedBean.editColorName}"></p:inputText>
					</p:column>
				</p:row>

			</p:panelGrid>

		
		</h:panelGroup>


	</ui:define>
</ui:composition>
