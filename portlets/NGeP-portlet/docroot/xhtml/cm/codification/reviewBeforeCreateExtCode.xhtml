<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">


		<h:panelGroup id="cmReviewUnspsc">
			<div style="text-align: right;">

				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					action="#{unspscCodeBackingBean.saveExtCode}"></p:commandButton>

			</div>

			<table style="width: 66%; margin-bottom: 4px;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.item.table.type']}"></p:outputLabel></td>
					<td><p:selectOneMenu value="#{unspscCodeBackingBean.managedBean.requestCode.itemType}" style="width:228px;" disabled="true">
							<f:selectItem itemValue="P" itemLabel="#{lbl['lbl.txt.product']}" />
							<f:selectItem itemValue="S" itemLabel="#{lbl['lbl.txt.service']}" />
						</p:selectOneMenu></td>
				</tr>
			</table>



			<table style="width: 100%;">

				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.tempCode}"
							disabled="true" size="40"></p:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.tempTitle}"
							disabled="true" size="40"></p:inputText></td>
				</tr>


				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.itemName}"
							size="40"></p:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.item.details']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.itemDetail}"
							size="40"></p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.type']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.typeName}"
							size="40"></p:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.brand']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.brandName}"
							size="40"></p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.measurementName}"
							size="40"></p:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.color']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.colorName}"
							size="40"></p:inputText></td>
				</tr>

			</table>



		</h:panelGroup>




	</ui:define>


</ui:composition>
