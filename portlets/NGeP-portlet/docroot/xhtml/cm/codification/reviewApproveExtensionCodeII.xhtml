<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">



	<ui:define name="contentSection">


		<p:messages id="reviewApproveExt2" showDetail="true" autoUpdate="true" closable="true" showSummary="false"></p:messages>

		<h:panelGroup id="extensionFlowReviewID">

			<div style="text-align: right;">
				<ui:repeat var="action"
					value="#{unspscCodeBackingBean.managedBean.action}">
					<p:commandButton value="#{action}"
						action="#{unspscCodeBackingBean.submitToReviewExt(action)}"
						update="@form"></p:commandButton>
				</ui:repeat>
			</div>

			<ui:include src="DocumentHeader.xhtml"></ui:include>


			<p:panel header="Extension Code Request" toggleable="true">

				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempCode}"
								size="40" disabled="true" /></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempTitle}"
								size="40" disabled="true" /></td>
					</tr>
				</table>

				<p:dataTable style="width:100%;" id="dt"
					value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList}"
					var="review">

					<p:column width="10%">
						<f:facet name="header">
						Extension
					</f:facet>

						<table style="height: 140px;">
							<tr>
								<td>#{lbl['lbl.cm.type']}</td>
							</tr>
							<tr>
								<td>#{lbl['lbl.cm.brand']}</td>
							</tr>
							<tr>
								<td>#{lbl['lbl.cm.measurement']}</td>
							</tr>
							<tr>
								<td>#{lbl['lbl.cm.color']}</td>
							</tr>
						</table>



					</p:column>



					<p:column width="10%">
						<f:facet name="header">
							Supplier
						</f:facet>

						<table>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.typeName}" disabled="true"></p:inputText>


									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.brandName}" disabled="true"></p:inputText>

									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.measurementName}" disabled="true"></p:inputText>
										

									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.colorName}" disabled="true"></p:inputText>
				

									</h:panelGrid></td>
							</tr>
						</table>

					</p:column>
					<p:column width="10%">
						<f:facet name="header">
						Review By
					</f:facet>

						<table>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.reviewedTypeName}"
											disabled="true"></p:inputText>
									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.reviewedBrandName}"
											disabled="true"></p:inputText>
									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.reviewedMeasurementName}"
											disabled="true"></p:inputText>
									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.reviewedColorName}"
											disabled="true"></p:inputText>
									</h:panelGrid></td>
							</tr>
						</table>


					</p:column>

					<p:column width="10%">
						<f:facet name="header">
						Remark
					</f:facet>

						<table>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.typeRemark}" disabled="true"
											size="30"></p:inputText>
									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.brandRemark}" disabled="true"
											size="30"></p:inputText>
									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.measurementRemark}"
											disabled="true" size="30"></p:inputText>
									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.colorRemark}" disabled="true"
											size="30"></p:inputText>
									</h:panelGrid></td>
							</tr>
						</table>

					</p:column>



					<p:column width="10%">
						<f:facet name="header">
						Endorse By
					</f:facet>

						<table>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.reviewedTypeNameII}"
											disabled="#{!review.requestType or unspscCodeBackingBean.codeAdmin}" required="true" label="#{lbl['lbl.cm.type']}">
											<p:ajax event="blur"
												update=":form:dt:typeremark2 :form:dt:typeremarkmsg"></p:ajax>

										</p:inputText>
									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.reviewedBrandNameII}"
											disabled="#{!review.requestBrand or unspscCodeBackingBean.codeAdmin}" required="true" label="#{lbl['lbl.cm.brand']}">
											<p:ajax event="blur"
												update=":form:dt:brandRemark2 :form:dt:brandremarkmsg"></p:ajax>
										</p:inputText>
									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.reviewedMeasurementNameII}"
											disabled="#{!review.requestMeasurement or unspscCodeBackingBean.codeAdmin}" required="true" label="#{lbl['lbl.cm.measurement']}">
											<p:ajax event="blur"
												update=":form:dt:measurementRemark2 :form:dt:measurementremarkmsg"></p:ajax>
										</p:inputText>
									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.reviewedColorNameII}"
											disabled="#{!review.requestColor or unspscCodeBackingBean.codeAdmin}" required="true" label="#{lbl['lbl.cm.color']}">
											<p:ajax event="blur"
												update=":form:dt:colorRemark2 :form:dt:colorremarkmsg"></p:ajax>
										</p:inputText>
									</h:panelGrid></td>
							</tr>
						</table>

					</p:column>

					<p:column>
						<f:facet name="header">
						Remark
					</f:facet>

						<table>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.typeRemarkII}" size="30"
											requiredMessage="Type Remark is required!"
											disabled="#{unspscCodeBackingBean.codeAdmin}"
											required="#{unspscCodeBackingBean.checkRemark(review.reviewedTypeNameII, review.reviewedTypeName)}"
											id="typeremark2"></p:inputText>

										<p:message id="typeremarkmsg" for="typeremark2"></p:message>
									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.brandRemarkII}" size="30"
											id="brandRemark2" requiredMessage="Brand Remark is required!"
											required="#{unspscCodeBackingBean.checkRemark(review.reviewedBrandNameII, review.reviewedBrandName)}"
											disabled="#{unspscCodeBackingBean.codeAdmin}"></p:inputText>
										<p:message id="brandremarkmsg" for="brandRemark2"></p:message>
									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.measurementRemarkII}" size="30"
											id="measurementRemark2" requiredMessage="Measurement Remark is required!"
											required="#{unspscCodeBackingBean.checkRemark(review.reviewedMeasurementNameII, review.reviewedMeasurementName)}"
											disabled="#{unspscCodeBackingBean.codeAdmin}"></p:inputText>
										<p:message id="measurementremarkmsg" for="measurementRemark2"></p:message>
									</h:panelGrid></td>
							</tr>
							<tr>
								<td><h:panelGrid columns="2"
										columnClasses="cmColumnWidth">
										<p:inputText value="#{review.colorRemarkII}" size="30"
											id="colorRemark2" requiredMessage="Color Remark is required!"
											required="#{unspscCodeBackingBean.checkRemark(review.reviewedColorNameII, review.reviewedColorName)}"
											disabled="#{unspscCodeBackingBean.codeAdmin}"></p:inputText>
										<p:message id="colorremarkmsg" for="colorRemark2"></p:message>
									</h:panelGrid></td>
							</tr>
						</table>

					</p:column>

				</p:dataTable>
			</p:panel>




		</h:panelGroup>


	</ui:define>

</ui:composition>
