<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">



	<ui:define name="contentSection">

		<p:messages showDetail="true" autoUpdate="true" closable="true"
			showSummary="false"></p:messages>
			
		<h:panelGroup id="extensionFlowReviewID">

			<div style="text-align: right;">
			<p:commandButton value="#{lbl['lbl.cm.add.to.catalogue']}" action="#{catalogueBackingBean.addToMaintainByItemId()}"
					rendered="#{unspscCodeBackingBean.allSupplier}"></p:commandButton>
				<ui:repeat var="action"
					value="#{unspscCodeBackingBean.managedBean.action}">
					<p:commandButton value="#{action}" rendered="#{bpmTasklistBackingBean.managedBean.claim}"
						action="#{unspscCodeBackingBean.submitToReviewExt(action)}"
						update="@form"></p:commandButton>
				</ui:repeat>
					<p:commandButton value="Claim" action="#{bpmTasklistBackingBean.claimTaskInDetailPage}" rendered="#{!bpmTasklistBackingBean.managedBean.claim}" update="@form"></p:commandButton>
			</div>

			<ui:include src="DocumentHeader.xhtml"></ui:include>


			<p:panel header="#{lbl['lbl.cm.extension.code.request']}" toggleable="true">

				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.unspscCode']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempCode}"
								size="40" disabled="true" /></td>
						<td><p:outputLabel value="#{lbl['lbl.rpt.unspscTitle']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempTitle}"
								size="40" disabled="true" /></td>
					</tr>
				</table>

				<p:dataTable style="width:100%;" id="dt" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList}"
					var="review">

					<p:column width="10%">
						<f:facet name="header">
						#{lbl['lbl.cm.extension']}
					</f:facet>

						<div style="width:100%; padding-bottom: 9px;">#{lbl['lbl.cm.type']}</div>
						<div style="width:100%; padding-bottom: 9px;">#{lbl['lbl.cm.brand']}</div>
						<div style="width:100%; padding-bottom: 9px;">#{lbl['lbl.cm.measurement']}</div>
						<div style="width:100%; padding-bottom: 9px;">#{lbl['lbl.cm.color']}</div>
						
					</p:column>

					<p:column width="10%">
						<f:facet name="header">
							#{lbl['lbl.sc.supp.name']}
						</f:facet>

						<div style="width:100%; "><p:inputText value="#{review.typeName}" disabled="true" /></div>
						<div style="width:100%; "><p:inputText value="#{review.brandName}" disabled="true" /></div>
						<div style="width:100%; "><p:inputText value="#{review.measurementName}" disabled="true" /></div>
						<div style="width:100%; "><p:inputText value="#{review.colorName}" disabled="true" /></div>

					</p:column>
					<p:column width="10%">
						<f:facet name="header">
						#{lbl['lbl.cm.review.by']}
					</f:facet>
					
						<div style="width:100%; "><p:inputText value="#{review.reviewedTypeName}" disabled="true" /></div>
						<div style="width:100%; "><p:inputText value="#{review.reviewedBrandName}" disabled="true" /></div>
						<div style="width:100%; "><p:inputText value="#{review.reviewedMeasurementName}" disabled="true" /></div>
						<div style="width:100%; "><p:inputText value="#{review.reviewedColorName}" disabled="true" /></div>

					</p:column>

					<p:column width="10%">
						<f:facet name="header">
						#{lbl['lbl.txt.remarks']}
					</f:facet>

						<div style="width:100%; "><p:inputText value="#{review.typeRemark}" disabled="true"	size="30" /></div>
						<div style="width:100%; "><p:inputText value="#{review.brandRemark}" disabled="true"	size="30" /></div>
						<div style="width:100%; "><p:inputText value="#{review.measurementRemark}" disabled="true"	size="30" /></div>
						<div style="width:100%; "><p:inputText value="#{review.colorRemark}" disabled="true"	size="30" /></div>

					</p:column>

					<p:column width="10%">
						<f:facet name="header">
						#{lbl['lbl.cm.endorse.by']}
					</f:facet>

						<div style="width:100%; ">
							<p:inputText value="#{review.reviewedTypeNameII}"
								disabled="#{!review.requestType or unspscCodeBackingBean.codeAdmin}" required="true" label="#{lbl['lbl.cm.type']}">
								<p:ajax event="blur" update=":form:dt:typeremark2"></p:ajax>
							</p:inputText>
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.reviewedBrandNameII}"
								disabled="#{!review.requestBrand or unspscCodeBackingBean.codeAdmin}" required="true" label="#{lbl['lbl.cm.brand']}">
								<p:ajax event="blur"
									update=":form:dt:brandRemark2"></p:ajax>
							</p:inputText>
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.reviewedMeasurementNameII}"
								disabled="#{!review.requestMeasurement or unspscCodeBackingBean.codeAdmin}" required="true" label="#{lbl['lbl.cm.measurement']}">
								<p:ajax event="blur"
									update=":form:dt:measurementRemark2"></p:ajax>
							</p:inputText>
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.reviewedColorNameII}"
								disabled="#{!review.requestColor or unspscCodeBackingBean.codeAdmin}" required="true" label="#{lbl['lbl.cm.color']}">
								<p:ajax event="blur"
									update=":form:dt:colorRemark2"></p:ajax>
							</p:inputText>
						</div>

					</p:column>

					<p:column>
						<f:facet name="header">
						#{lbl['lbl.txt.remarks']}
					</f:facet>

						<div style="width:100%; ">
							<p:inputText value="#{review.typeRemarkII}" size="30" maxlength="100"
								requiredMessage="#{lbl['lbl.cm.error.error10']}"
								disabled="#{(unspscCodeBackingBean.codeAdmin) or (!unspscCodeBackingBean.codeAdmin and !(unspscCodeBackingBean.checkRemark(review.reviewedTypeNameII, review.reviewedTypeName)))}"
								required="#{unspscCodeBackingBean.checkRemark(review.reviewedTypeNameII, review.reviewedTypeName)}"
								id="typeremark2" />
							
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.brandRemarkII}" size="30"
								id="brandRemark2" requiredMessage="#{lbl['lbl.cm.error.error11']}" maxlength="100"
								required="#{unspscCodeBackingBean.checkRemark(review.reviewedBrandNameII, review.reviewedBrandName)}"
								disabled="#{(unspscCodeBackingBean.codeAdmin) or (!unspscCodeBackingBean.codeAdmin and !(unspscCodeBackingBean.checkRemark(review.reviewedBrandNameII, review.reviewedBrandName)))}"></p:inputText>
							
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.measurementRemarkII}" size="30" maxlength="100"
								id="measurementRemark2" requiredMessage="#{lbl['lbl.cm.error.error12']}"
								required="#{unspscCodeBackingBean.checkRemark(review.reviewedMeasurementNameII, review.reviewedMeasurementName)}"
								disabled="#{(unspscCodeBackingBean.codeAdmin) or (!unspscCodeBackingBean.codeAdmin and !(unspscCodeBackingBean.checkRemark(review.reviewedMeasurementNameII, review.reviewedMeasurementName)))}"></p:inputText>
							
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.colorRemarkII}" size="30" maxlength="100"
								id="colorRemark2" requiredMessage="#{lbl['lbl.cm.error.error13']}"
								required="#{unspscCodeBackingBean.checkRemark(review.reviewedColorNameII, review.reviewedColorName)}"
								disabled="#{(unspscCodeBackingBean.codeAdmin) or (!unspscCodeBackingBean.codeAdmin and !(unspscCodeBackingBean.checkRemark(review.reviewedColorNameII, review.reviewedColorName)))}"></p:inputText>
							
						</div>

					</p:column>
					

				</p:dataTable>
			</p:panel>




		</h:panelGroup>


	</ui:define>

</ui:composition>
