<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<p:panel>

			<p:dataTable id="documentTableID" lazy="true"
			value="" var="" width="100%">

				<p:column width="15%">
					<f:facet name="header">
					#{lbl['lbl.cm.doc.no']}
				</f:facet>

					<p:commandLink
						action="#{codificationBackingBean.goToAssignUnspsc()}">
							QT1400000000101
							</p:commandLink>
				</p:column>
				
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.cm.doc.type']}
				   </f:facet>
				Quotation/Tender
			   </p:column>

               <p:column>
					<f:facet name="header">
					#{lbl['lbl.cm.doc.title']}
				   </f:facet>
				doc title
			   </p:column>

			   <p:column>
					<f:facet name="header">
					#{lbl['lbl.cm.doc.ptj']}
				   </f:facet>
				perjabat ...
			   </p:column>
			   
			    <p:column>
					<f:facet name="header">
					#{lbl['lbl.cm.doc.createdDate']}
				   </f:facet>
				01-april-2014
			   </p:column>
			   
			    <p:column>
					<f:facet name="header">
					#{lbl['lbl.cm.doc.status']}
				   </f:facet>
				pending assign unspsc
			   </p:column>
			   

			</p:dataTable>

		</p:panel>



	</ui:define>
</ui:composition>
