<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<h:panelGrid columns="2" columnClasses="cmLeft,cmRight" width="100%">


			<ui:include src="itemMenu.xhtml"></ui:include>

			<h:panelGroup id="cmUNSPSCrequestID">
				<h:outputLabel styleClass="titleFront"
					value="#{lbl['lbl.cm.unspsc.code.request.form']}"></h:outputLabel>

				<h:selectOneRadio>
					<f:selectItem itemValue="P" itemLabel="Product " />
					<f:selectItem itemValue="S" itemLabel="Service" />
				</h:selectOneRadio>

				<h:panelGrid columns="2">

					<h:outputLabel value="* #{lbl['lbl.cm.item.name']}"></h:outputLabel>
					<h:inputText></h:inputText>

					<h:outputLabel value="* #{lbl['lbl.cm.item.details']}"></h:outputLabel>
					<h:inputText></h:inputText>

					<h:outputLabel value="* #{lbl['lbl.cm.type']}"></h:outputLabel>
					<h:inputText></h:inputText>

					<h:outputLabel value="* #{lbl['lbl.cm.brand']}"></h:outputLabel>
					<h:inputText></h:inputText>

					<h:outputLabel value="* #{lbl['lbl.cm.measurement']}"></h:outputLabel>
					<h:inputText></h:inputText>

					<h:outputLabel value="* #{lbl['lbl.cm.color']}"></h:outputLabel>
					<h:inputText></h:inputText>

					<h:outputLabel></h:outputLabel>
					<p:commandButton value="#{lbl['lbl.cm.submit']}"></p:commandButton>



				</h:panelGrid>



			</h:panelGroup>

		</h:panelGrid>


	</ui:define>


</ui:composition>
