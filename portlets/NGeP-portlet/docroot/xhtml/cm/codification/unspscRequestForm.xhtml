<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages globalOnly="true"></p:messages>
		<h:panelGroup id="cmUNSPSCrequestID">


			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.cm.submit']}"
					icon="ui-icon-submit"
					action="#{unspscCodeBackingBean.submitForRequest('SUBMIT')}"
					update="@form"></p:commandButton>
			</div>

			<table style="width: 66%; margin-bottom: 4px;">
				<tr>
					<td><p:outputLabel value="Item Type"></p:outputLabel></td>
					<td><p:selectOneMenu
							value="#{unspscCodeBackingBean.managedBean.requestCode.itemType}"
							style="width:228px;">
							<f:selectItem itemValue="P" itemLabel="Product " />
							<f:selectItem itemValue="S" itemLabel="Service" />
						</p:selectOneMenu></td>
					<td></td>
					<td></td>
				</tr>
			</table>


			<table style="width: 100%;">

				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
					<td><ac:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.itemName}"
							required="true" size="40"></ac:inputText></td>
					<td><p:outputLabel value="* Request Description"></p:outputLabel></td>
					<td><ac:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.itemDetail}"
							required="true" size="40"></ac:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.type']}"></p:outputLabel></td>
					<td><ac:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.typeName}"
							required="true" size="40"></ac:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.brand']}"></p:outputLabel></td>
					<td><ac:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.brandName}"
							required="true" size="40"></ac:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
					<td><ac:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.measurementName}"
							required="true" size="40"></ac:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.color']}"></p:outputLabel></td>
					<td><ac:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.colorName}"
							required="true" size="40"></ac:inputText></td>
				</tr>

			</table>

		</h:panelGroup>




	</ui:define>


</ui:composition>
