<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

	<h:panelGroup rendered="#{unspscCodeBackingBean.allSupplier}">
		<script>
			$('#portlet_codification_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.cm.item.code.search']}");
		</script>
	</h:panelGroup>
	<h:panelGroup rendered="#{!unspscCodeBackingBean.allSupplier}">
		<script>
			$('#portlet_codification_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.cm.item.code.search.title']}");
		</script>
	</h:panelGroup>

		<p:blockUI block="form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<p:messages id="unspscFormId" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<h:panelGroup id="cmUNSPSCrequestID">

			<div style="text-align: right; min-height: 40px;">

				<p:commandButton value="#{lbl['lbl.cm.submit']}"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					action="#{unspscCodeBackingBean.submitForRequest('SUBMIT')}"
					update="@form"></p:commandButton>


				<div style="float: left; clear: both;">
					<p:commandButton value="#{lbl['lbl.cm.back']}" immediate="true"
						action="#{unspscCodeBackingBean.backToCodificationSearch}"
						update="@form">
					</p:commandButton>
				</div>
			</div>

			<p:panel header="#{lbl['lbl.cm.item.code.request.form']}"
				toggleable="true">

				<table style="width: 100%;" id="unspscFormId">
					<tr>
						<td width="15%"><p:outputLabel value="#{lbl['lbl.cm.item.table.type']}"></p:outputLabel></td>
						<td width="35%"><p:selectOneMenu
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemType}"
								style="width:228px;">
								<f:selectItem itemValue="P"
									itemLabel="#{lbl['lbl.txt.product']}" />
								<f:selectItem itemValue="S"
									itemLabel="#{lbl['lbl.txt.service']}" />
								<p:ajax event="valueChange" process="@this"
									update=":form:cmUNSPSCrequestID" partialSubmit="true" />
							</p:selectOneMenu></td>
						<td></td>
						<td></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:inputText
								requiredMessage="#{lbl['lbl.cm.error.error14']}"
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemName}"
								maxlength="255" required="true" size="40"></p:inputText> <p:graphicImage
								id="uid1" value="/css/images/design/tooltips.png" /> <p:tooltip
								id="uidt1" for="uid1">
								<p:outputLabel escape="false"
									value="#{lbl['lbl.cm.tooltip.info1']}" />
							</p:tooltip></td>

						<h:panelGroup id="hideTypeId"
							rendered="#{unspscCodeBackingBean.managedBean.requestCode.itemType != 'S'}">
							<td><p:outputLabel value="#{lbl['lbl.cm.type']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:inputText
									requiredMessage="#{lbl['lbl.cm.error.error16']}"
									maxlength="100"
									value="#{unspscCodeBackingBean.managedBean.requestCode.typeName}"
									required="true" size="40"></p:inputText> <p:graphicImage
									id="uid3" value="/css/images/design/tooltips.png" /> <p:tooltip
									id="uidt3" for="uid3">
									<p:outputLabel escape="false"
										value="#{lbl['lbl.cm.tooltip.info3']}" />
								</p:tooltip></td>
						</h:panelGroup>
					</tr>





					<tr>

						<td rowspan="3"><p:outputLabel
								value="#{lbl['lbl.cm.request.description']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td rowspan="3"><p:inputTextarea
								style="width: 283px;height:60px;" maxlength="1000"
								requiredMessage="#{lbl['lbl.cm.error.error15']}"
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemDetail}"
								required="true" size="40"></p:inputTextarea> <p:graphicImage
								id="uid2" value="/css/images/design/tooltips.png" /> <p:tooltip
								id="uidt2" for="uid2">
								<p:outputLabel escape="false"
									value="#{lbl['lbl.cm.tooltip.info2']}" />
							</p:tooltip></td>

						<h:panelGroup id="hideBrandId"
							rendered="#{unspscCodeBackingBean.managedBean.requestCode.itemType != 'S'}">
							<td><p:outputLabel value="#{lbl['lbl.cm.brand']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:inputText
									requiredMessage="#{lbl['lbl.cm.error.error17']}"
									maxlength="100"
									value="#{unspscCodeBackingBean.managedBean.requestCode.brandName}"
									required="true" size="40"></p:inputText> <p:graphicImage
									id="uid4" value="/css/images/design/tooltips.png" /> <p:tooltip
									id="uidt4" for="uid4">
									<p:outputLabel escape="false"
										value="#{lbl['lbl.cm.tooltip.info4']}" />
								</p:tooltip></td>

						</h:panelGroup>


					</tr>

					<h:panelGroup id="hideMeaColorId"
							rendered="#{unspscCodeBackingBean.managedBean.requestCode.itemType != 'S'}">

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:inputText
								requiredMessage="#{lbl['lbl.cm.error.error18']}" maxlength="100"
								value="#{unspscCodeBackingBean.managedBean.requestCode.measurementName}"
								required="true" size="40"></p:inputText> <p:graphicImage
								id="uid5" value="/css/images/design/tooltips.png" /> <p:tooltip
								id="uidt5" for="uid5">
								<p:outputLabel escape="false"
									value="#{lbl['lbl.cm.tooltip.info5']}" />
							</p:tooltip></td>
				
					</tr>
					
					
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.color']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:inputText
								requiredMessage="#{lbl['lbl.cm.error.error19']}"
								value="#{unspscCodeBackingBean.managedBean.requestCode.colorName}"
								maxlength="100" required="true" size="40"></p:inputText> <p:graphicImage
								id="uid6" value="/css/images/design/tooltips.png" /> <p:tooltip
								id="uidt6" for="uid6">
								<p:outputLabel escape="false"
									value="#{lbl['lbl.cm.tooltip.info6']}" />
							</p:tooltip></td>
					</tr>
					
					</h:panelGroup>

				</table>

			</p:panel>
		</h:panelGroup>
		<p:spacer height="30px;" />



	</ui:define>


</ui:composition>
