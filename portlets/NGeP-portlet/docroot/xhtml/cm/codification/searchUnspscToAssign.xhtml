<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="searchMsgId" showDetail="true"
			autoUpdate="true" closable="true" showSummary="false" />

		<h:panelGroup id="cmUNSPSCsearchID">

			<p:panel header="Request Info" toggleable="true">

				<table style="width: 100%; margin-bottom: 4px;">
					<tr>
					<td><p:outputLabel value="Item Type"></p:outputLabel></td>
					<td><p:inputText disabled="true" size="20" value="#{codificationBackingBean.getParameterDesc(codificationBackingBean.managedBean.selectedRequestItem.itemType)}"/></td>
					<td></td>
					<td></td>
				</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{codificationBackingBean.managedBean.selectedRequestItem.itemName}"
								disabled="true" size="40"></p:inputText></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.details']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{codificationBackingBean.managedBean.selectedRequestItem.itemDesc}"
								disabled="true" size="40"></p:inputText></td>
					</tr>
				</table>

			</p:panel>

			<p:panel header="SEARCH" toggleable="true">
				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
						<td colspan="1"><p:autoComplete size="40"
								title="UNSPSC Code is 8 digits"
								value="#{codificationBackingBean.managedBean.autoCompleteUnspscCode.unspscCode}"
								completeMethod="#{codificationBackingBean.autoCompleteUnspsc}"
								maxResults="15" dropdown="false" forceSelection="true" /></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
						<td><p:inputText title="Unspsc title only in English"
								value="#{codificationBackingBean.titleFilterBean.searchValue}"
								size="40" /></td>
					</tr>
				</table>
			</p:panel>


			<div style="text-align: right;">
				<p:commandButton icon="ui-icon-search" value="Search"
					action="#{codificationBackingBean.unspscSearch}"
					update="cmUNSPSCsearchID">
					<f:param name="itemType"
						value="#{codificationBackingBean.managedBean.selectedRequestItem.itemType.parameterCode}" />
				</p:commandButton>
				<p:commandButton value="Back" icon="ui-icon-back"
					action="#{codificationBackingBean.backToPendingCodified}">
					
				</p:commandButton>

			</div>


			<p:panel header="SEARCH RESULTS" toggleable="true">

				<p:dataTable id="unspscTableID" lazy="true"
				value="#{codificationBackingBean.searchDataModel}" var="unspscObj"
				width="100%" rows="10">



					<ac:paginator for="unspscTableID"></ac:paginator>


					<p:column>
						<f:facet name="header">
					#{lbl['lbl.cm.unspsc.code']}
			        	</f:facet>
						<p:commandLink
							action="#{codificationBackingBean.insertContractedItemCodeForService(unspscObj)}"
							rendered="#{!(codificationBackingBean.productCode(unspscObj.unspscCode)) and (unspscObj.unspscLevel eq 3)}">
						
							#{unspscObj.unspscCode}
						
						</p:commandLink>

						<p:commandLink
							action="#{codificationBackingBean.selectFromExtensionToAssign(unspscObj)}"
							rendered="#{codificationBackingBean.productCode(unspscObj.unspscCode) and (unspscObj.unspscLevel eq 3)}">
						
							#{unspscObj.unspscCode}
						
						</p:commandLink>

						<p:commandLink
							action="#{codificationBackingBean.unspscPopUpSearch(unspscObj)}"
							onclick="unspscPopUp.show()" update=":form:codificationPopUpId"
							rendered="#{unspscObj.unspscLevel ne 3}">
							#{unspscObj.unspscCode}
							</p:commandLink>


					</p:column>
					<p:column>
						<f:facet name="header">
					#{lbl['lbl.cm.unspsc.title']}
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>

				</p:dataTable>
				<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.cm.request.unspsc']}"
					action="#{codificationBackingBean.redirectToequestUnspscCodeII}"/>
			</div>

			</p:panel>

			<p:dialog id="unspscPopUp" widgetVar="unspscPopUp" modal="true"
				header="Codification Search" width="800" height="500">

				<ui:include src="recommendSearchPopUp.xhtml"></ui:include>

			</p:dialog>

		</h:panelGroup>

	</ui:define>

</ui:composition>
