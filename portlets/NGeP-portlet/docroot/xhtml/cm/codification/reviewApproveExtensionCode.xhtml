<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">



	<ui:define name="contentSection">

		<p:messages showDetail="true" autoUpdate="true" closable="true"
			showSummary="false"></p:messages>

		<h:panelGroup id="extensionFlowReviewID">


			<div style="text-align: right;">
				<ui:repeat var="action"
					value="#{unspscCodeBackingBean.managedBean.action}">

					<ui:param name="buttonLabel"
						value="lbl.bpm.action.#{action}" />

						<p:commandButton value="#{!unspscCodeBackingBean.managedBean.renderV2 ? lbl[buttonLabel] : lbl['lbl.cm.endorseandpublish']}"
							rendered="#{bpmTasklistBackingBean.managedBean.claim and action == 'SUBMIT' }"
							action="#{unspscCodeBackingBean.submitToReviewExt(action)}" 
							disabled="#{unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes.size() >=1}"
							update="@form"></p:commandButton>
												
						<p:commandButton value="#{lbl[buttonLabel]}"
							action="#{unspscCodeBackingBean.bpmTesting(action)}"  
							rendered="#{bpmTasklistBackingBean.managedBean.claim and (action == 'RECOMMEND_TO_SUPPLIER' or action == 'REVISE' )}" 
							disabled="#{action == 'RECOMMEND_TO_SUPPLIER' and unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes.size() !=1}" 
							update="@form">
						</p:commandButton>
				</ui:repeat>
				
				<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}"
					action="#{bpmTasklistBackingBean.claimTaskInDetailPage}"
					rendered="#{!bpmTasklistBackingBean.managedBean.claim}"
					update="@form"></p:commandButton>
			</div>

			<ui:include src="DocumentHeader.xhtml"></ui:include>


			<p:panel header="#{lbl['lbl.cm.extension.code.request']}"
				toggleable="true">

				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.unspscCode']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempCode}"
								size="40" disabled="true" />
									<p:commandLink rendered="#{unspscCodeBackingBean.managedBean.renderV2}" disabled ="#{unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes.size() >=1}" style="margin-left: 10px;"  action="#{unspscCodeBackingBean.managedBean.toggleShowRecommend()}" 
									update="recommendPanelId">
									<p:graphicImage value="/css/images/design/search.png" />
									</p:commandLink>
								</td>
						<td><p:outputLabel value="#{lbl['lbl.rpt.unspscTitle']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempTitle}"
								size="40" disabled="true" /></td>
					</tr>
				</table>

				<p:dataTable id="dt" style="width:100%;"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList}"
					var="review">



					<p:column headerText="#{lbl['lbl.cm.extension']}" width="15%">

						<div style="width: 100%; padding-bottom: 9px;">#{lbl['lbl.cm.type']}</div>
						<div style="width: 100%; padding-bottom: 9px;">#{lbl['lbl.cm.brand']}</div>
						<div style="width: 100%; padding-bottom: 9px;">#{lbl['lbl.cm.measurement']}</div>
						<div style="width: 100%; padding-bottom: 9px;">#{lbl['lbl.cm.color']}</div>

					</p:column>


					<p:column width="15%" headerText="#{lbl['lbl.sc.supp.name']}">

						<div style="width: 100%;">
							<p:inputText value="#{review.typeName}" disabled="true" />
						</div>
						<div style="width: 100%;">
							<p:inputText value="#{review.brandName}" disabled="true" />
						</div>
						<div style="width: 100%;">
							<p:inputText value="#{review.measurementName}" disabled="true" />
						</div>
						<div style="width: 100%;">
							<p:inputText value="#{review.colorName}" disabled="true" />
						</div>

					</p:column>


					<p:column width="10%" headerText="#{lbl['lbl.cm.review.by']}"
						style="white-space: normal">


						<div style="width: 100%;">
							<p:inputText value="#{review.reviewedTypeName}"
								id="reviewedTypeNameId" maxlength="100"
								disabled="#{review.typeNameDD != null or !review.requestType}" required="true"
								label="#{lbl['lbl.cm.type']}">
								<p:ajax event="blur" update=":form:dt:typeremark1"></p:ajax>
							</p:inputText>
						</div>
						<div style="width: 100%;">
							<p:inputText id="reviewedBrandNameId" value="#{review.reviewedBrandName}" maxlength="100"
								disabled="#{review.brandNameDD != null or !review.requestBrand}" required="true"
								label="#{lbl['lbl.cm.brand']}">
								<p:ajax event="blur" update=":form:dt:brandRemark1"></p:ajax>
							</p:inputText>
						</div>
						<div style="width: 100%;">
							<p:inputText id="reviewedMeasurementNameId" value="#{review.reviewedMeasurementName}"
								maxlength="100" disabled="#{review.measurementNameDD != null or !review.requestMeasurement}"
								required="true" label="#{lbl['lbl.cm.measurement']}">
								<p:ajax event="blur" update=":form:dt:measurementRemark1"></p:ajax>
							</p:inputText>
						</div>
						<div style="width: 100%;">
							<p:inputText id="reviewedColorNameId" value="#{review.reviewedColorName}" maxlength="100"
								disabled="#{review.colorNameDD != null or !review.requestColor}" required="true"
								label="#{lbl['lbl.cm.color']}">
								<p:ajax event="blur" update=":form:dt:colorRemark1"></p:ajax>
							</p:inputText>
						</div>

					</p:column>


					<p:column>

						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.txt.remarks']}" />
							<p:graphicImage id="remarkcdcId"
								value="/css/images/design/tooltips.png" />
							<p:tooltip id="remarkTooltipId" for="remarkcdcId">
								<p:outputLabel escape="false"
									value="#{lbl['lbl.cm.tooltip.remark.cdc']}" />
							</p:tooltip>
						</f:facet>

						<div style="width: 100%;">
							<p:inputText id="typeremark1" value="#{review.typeRemark}"
								maxlength="100" size="40"
								requiredMessage="#{lbl['lbl.cm.error.error10']}"
								disabled="#{!(unspscCodeBackingBean.checkRemark(review.typeName, review.reviewedTypeName)) || review.typeNameDD != null }"
								required="#{unspscCodeBackingBean.checkRemark(review.typeName, review.reviewedTypeName) and review.typeNameDD == null }"></p:inputText>

						</div>
						<div style="width: 100%;">
							<p:inputText id="brandRemark1" value="#{review.brandRemark}"
								maxlength="100" size="40"
								requiredMessage="#{lbl['lbl.cm.error.error11']}"
								disabled="#{!(unspscCodeBackingBean.checkRemark(review.brandName, review.reviewedBrandName)) || review.brandNameDD != null }"
								required="#{unspscCodeBackingBean.checkRemark(review.brandName, review.reviewedBrandName) and review.brandNameDD == null}"></p:inputText>

						</div>
						<div style="width: 100%;">
							<p:inputText value="#{review.measurementRemark}" maxlength="100"
								size="40" id="measurementRemark1"
								requiredMessage="#{lbl['lbl.cm.error.error12']}"
								disabled="#{!(unspscCodeBackingBean.checkRemark(review.measurementName, review.reviewedMeasurementName)) || review.measurementNameDD != null }"
								required="#{unspscCodeBackingBean.checkRemark(review.measurementName, review.reviewedMeasurementName) and review.measurementNameDD == null}">
							</p:inputText>

						</div>
						<div style="width: 100%;">
							<p:inputText value="#{review.colorRemark}" maxlength="100"
								size="40" id="colorRemark1"
								requiredMessage="#{lbl['lbl.cm.error.error13']}"
								disabled="#{!(unspscCodeBackingBean.checkRemark(review.colorName, review.reviewedColorName)) || review.colorNameDD != null }"
								required="#{unspscCodeBackingBean.checkRemark(review.colorName, review.reviewedColorName) and review.measurementNameDD == null}"></p:inputText>

						</div>

					</p:column>
					
					<p:column>

						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.cm.existing.extension']}" />
						</f:facet>

						<div style="width: 100%;">
							<p:selectOneMenu style="width: 128px; padding-bottom: 5px; height: 20px;" value="#{review.typeNameDD}">
							<p:ajax event="change" update="reviewedTypeNameId typeremark1"  listener="#{unspscCodeBackingBean.onDDSelected(review, 'type')}"/>
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{unspscCodeBackingBean.managedBean.typeList}"
									var="type" itemLabel="#{type.typeName}"
									itemValue="#{type.typeId}"></f:selectItems>
							</p:selectOneMenu>
						</div>
						<div style="width: 100%;">
							<p:selectOneMenu style="width: 128px; padding-bottom: 5px; height: 20px;" value="#{review.brandNameDD}">
								<p:ajax event="change" update="reviewedBrandNameId brandRemark1"  listener="#{unspscCodeBackingBean.onDDSelected(review, 'brand')}"/>
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{unspscCodeBackingBean.managedBean.brandList}"
									var="brand" itemLabel="#{brand.brandName}"
									itemValue="#{brand.brandId}"></f:selectItems>
							</p:selectOneMenu>
						</div>
						<div style="width: 100%;">
							<p:selectOneMenu style="width: 128px; padding-bottom: 5px; height: 20px;" value="#{review.measurementNameDD}">
								<p:ajax event="change" update="reviewedMeasurementNameId measurementRemark1"  listener="#{unspscCodeBackingBean.onDDSelected(review, 'measurement')}"/>
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{unspscCodeBackingBean.managedBean.measurementList}"
									var="measurement" itemLabel="#{measurement.measurementName}"
									itemValue="#{measurement.measurementId}"></f:selectItems>
							</p:selectOneMenu>
						</div>
						<div style="width: 100%;">
							<p:selectOneMenu style="width: 128px; padding-bottom: 5px; height: 20px;" value="#{review.colorNameDD}">
								<p:ajax event="change" update="reviewedColorNameId colorRemark1" listener="#{unspscCodeBackingBean.onDDSelected(review, 'color')}"/>
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{unspscCodeBackingBean.managedBean.colorList}"
									var="color" itemLabel="#{color.colorName}"
									itemValue="#{color.colorId}"></f:selectItems>
							</p:selectOneMenu>
						</div>

					</p:column>

				</p:dataTable>

			</p:panel>




		</h:panelGroup>
			<h:panelGroup id="recommendPanelId">
					<p:panel header="#{lbl['lbl.cm.search.recommend']}" toggleable="true"  rendered="#{unspscCodeBackingBean.managedBean.isShowRecommend() and unspscCodeBackingBean.managedBean.renderV2}">
				<p:dataTable id="recomemendUnspscId" rowIndexVar="rowIndex"
					value="#{unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes}"
					var="unspscObj" width="100%">
					<p:column>
						<f:facet name="header">
					#{lbl['lbl.cm.recommended.item.code']}
				</f:facet>
						#{unspscObj.unspscCode}
				</p:column>
					<p:column>
						<f:facet name="header">
					#{lbl['lbl.cm.recommended.item.name']}
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.action']}
						</f:facet>
						<p:commandLink
							action="#{unspscCodeBackingBean.removeRecommendCode(rowIndex)}"
							update="@form">
							<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
						</p:commandLink>
					</p:column>
				</p:dataTable>
				<div style="text-align: right;">
					<p:commandButton value="#{lbl['lbl.cm.item.code.search.title']}" update="@form"
						disabled="#{unspscCodeBackingBean.managedBean.requestCode.cmRecommendCodes.size() >=1}"
						action="#{unspscCodeBackingBean.navigateToSearch}"></p:commandButton>
				</div>
			</p:panel>
		</h:panelGroup>
		<h:panelGroup>
			<p:panel id="reviewUnspscCodeRemark" header="#{lbl['lbl.cm.remarks']}" toggleable="true">
				<ui:include src="codiRemarks.xhtml"/> 
			</p:panel>
		</h:panelGroup>
	</ui:define>

</ui:composition>
