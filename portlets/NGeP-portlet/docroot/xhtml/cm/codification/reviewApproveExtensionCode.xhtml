<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">



	<ui:define name="contentSection">

				<p:messages showDetail="true" autoUpdate="true" closable="true"
			showSummary="false"></p:messages>
			
		<h:panelGroup id="extensionFlowReviewID">


			<div style="text-align: right;">
				<ui:repeat var="action"
					value="#{unspscCodeBackingBean.managedBean.action}">
					
					<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(action)}" />
  				<p:commandButton value="#{lbl[buttonLabel]}" rendered="#{bpmTasklistBackingBean.managedBean.claim}"
						action="#{unspscCodeBackingBean.submitToReviewExt(action)}"
						update="@form"></p:commandButton>
				</ui:repeat>
				<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}" action="#{bpmTasklistBackingBean.claimTaskInDetailPage}" rendered="#{!bpmTasklistBackingBean.managedBean.claim}" update="@form"></p:commandButton>
			</div>

			<ui:include src="DocumentHeader.xhtml"></ui:include>


			<p:panel header="#{lbl['lbl.cm.extension.code.request']}" toggleable="true">

				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.unspscCode']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempCode}"
								size="40" disabled="true" /></td>
						<td><p:outputLabel value="#{lbl['lbl.rpt.unspscTitle']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempTitle}"
								size="40" disabled="true" /></td>
					</tr>
				</table>

				<p:dataTable id="dt" style="width:100%;" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList}"
					var="review">



					<p:column width="15%">
						<f:facet name="header">
						#{lbl['lbl.cm.extension']}
					</f:facet>

						<div style="width:100%; padding-bottom: 9px;">#{lbl['lbl.cm.type']}</div>
						<div style="width:100%; padding-bottom: 9px;">#{lbl['lbl.cm.brand']}</div>
						<div style="width:100%; padding-bottom: 9px;">#{lbl['lbl.cm.measurement']}</div>
						<div style="width:100%; padding-bottom: 9px;">#{lbl['lbl.cm.color']}</div>

					</p:column>


					<p:column width="15%">
						<f:facet name="header">
							#{lbl['lbl.sc.supp.name']}
						</f:facet>

						<div style="width:100%; "><p:inputText value="#{review.typeName}" disabled="true" /></div>
						<div style="width:100%; "><p:inputText value="#{review.brandName}" disabled="true" /></div>
						<div style="width:100%; "><p:inputText value="#{review.measurementName}" disabled="true" /></div>
						<div style="width:100%; "><p:inputText value="#{review.colorName}" disabled="true" /></div>

					</p:column>


					<p:column width="10%">
						<f:facet name="header">
						#{lbl['lbl.cm.review.by']}
					</f:facet>

						<div style="width:100%; ">
							<p:inputText value="#{review.reviewedTypeName}" id="reviewedTypeNameId" maxlength="100"
								disabled="#{!review.requestType}" required="true" label="#{lbl['lbl.cm.type']}">
								<p:ajax event="blur" update=":form:dt:typeremark1"></p:ajax>
							</p:inputText>
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.reviewedBrandName}" maxlength="100"
								disabled="#{!review.requestBrand}" required="true" label="#{lbl['lbl.cm.brand']}">
								<p:ajax event="blur" update=":form:dt:brandRemark1"></p:ajax>
							</p:inputText>
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.reviewedMeasurementName}" maxlength="100"
								disabled="#{!review.requestMeasurement}"  required="true" label="#{lbl['lbl.cm.measurement']}">
								<p:ajax event="blur" update=":form:dt:measurementRemark1"></p:ajax>
							</p:inputText>
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.reviewedColorName}" maxlength="100"
								disabled="#{!review.requestColor}" required="true" label="#{lbl['lbl.cm.color']}">
								<p:ajax event="blur" update=":form:dt:colorRemark1"></p:ajax>
							</p:inputText>
						</div>

					</p:column>


					<p:column>
						<f:facet name="header">
						#{lbl['lbl.txt.remarks']}
					</f:facet>

						<div style="width:100%; ">
							<p:inputText id="typeremark1" value="#{review.typeRemark}" maxlength="100"
								size="40" requiredMessage="#{lbl['lbl.cm.error.error10']}"
								disabled="#{!(unspscCodeBackingBean.checkRemark(review.typeName, review.reviewedTypeName))}"
								required="#{unspscCodeBackingBean.checkRemark(review.typeName, review.reviewedTypeName)}"></p:inputText>
							
						</div>
						<div style="width:100%; ">
							<p:inputText id="brandRemark1" value="#{review.brandRemark}" maxlength="100"
								size="40" requiredMessage="#{lbl['lbl.cm.error.error11']}"
								disabled="#{!(unspscCodeBackingBean.checkRemark(review.brandName, review.reviewedBrandName))}"
								required="#{unspscCodeBackingBean.checkRemark(review.brandName, review.reviewedBrandName)}"></p:inputText>
							
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.measurementRemark}" maxlength="100" size="40" id="measurementRemark1" requiredMessage="#{lbl['lbl.cm.error.error12']}"
								disabled="#{!(unspscCodeBackingBean.checkRemark(review.measurementName, review.reviewedMeasurementName))}"
								required="#{unspscCodeBackingBean.checkRemark(review.measurementName, review.reviewedMeasurementName)}">								
							</p:inputText>
							
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.colorRemark}" maxlength="100" size="40" id="colorRemark1" requiredMessage="#{lbl['lbl.cm.error.error13']}"
							    disabled="#{!(unspscCodeBackingBean.checkRemark(review.colorName, review.reviewedColorName))}"
								required="#{unspscCodeBackingBean.checkRemark(review.colorName, review.reviewedColorName)}"></p:inputText>
							
						</div>
						
					</p:column>
                

				</p:dataTable>

			</p:panel>




		</h:panelGroup>


	</ui:define>

</ui:composition>
