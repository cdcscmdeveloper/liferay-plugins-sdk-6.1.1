<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">



	<ui:define name="contentSection">

		<p:messages id="extensionApprovalMsgId" showDetail="true" autoUpdate="true" closable="true" showSummary="false"></p:messages>

		<h:panelGroup id="extensionFlowReviewID">


			<div style="text-align: right;">
				<ui:repeat var="action"
					value="#{unspscCodeBackingBean.managedBean.action}">
					<p:commandButton value="#{action}"
						action="#{unspscCodeBackingBean.submitToReviewExt(action)}"
						update="@form"></p:commandButton>
				</ui:repeat>
			</div>

			<ui:include src="DocumentHeader.xhtml"></ui:include>


			<p:panel header="Extension Code Request" toggleable="true">

				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempCode}"
								size="40" disabled="true" /></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempTitle}"
								size="40" disabled="true" /></td>
					</tr>
				</table>

				<p:dataTable id="dt" style="width:100%;"
					value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList}"
					var="review">



					<p:column width="15%">
						<f:facet name="header">
						Extension
					</f:facet>

						<div style="width:100%; padding-bottom: 9px;">#{lbl['lbl.cm.type']}</div>
						<div style="width:100%; padding-bottom: 9px;">#{lbl['lbl.cm.brand']}</div>
						<div style="width:100%; padding-bottom: 9px;">#{lbl['lbl.cm.measurement']}</div>
						<div style="width:100%; padding-bottom: 9px;">#{lbl['lbl.cm.color']}</div>

					</p:column>


					<p:column width="15%">
						<f:facet name="header">
							Supplier
						</f:facet>

						<div style="width:100%; "><p:inputText value="#{review.typeName}" disabled="true" /></div>
						<div style="width:100%; "><p:inputText value="#{review.brandName}" disabled="true" /></div>
						<div style="width:100%; "><p:inputText value="#{review.measurementName}" disabled="true" /></div>
						<div style="width:100%; "><p:inputText value="#{review.colorName}" disabled="true" /></div>

					</p:column>


					<p:column width="10%">
						<f:facet name="header">
						Review By
					</f:facet>

						<div style="width:100%; ">
							<p:inputText value="#{review.reviewedTypeName}"
								disabled="#{!review.requestType}" required="true" label="#{lbl['lbl.cm.type']}">
								<p:ajax event="blur" update=":form:dt:typeremark1 :form:dt:typeremarkmsg"></p:ajax>
							</p:inputText>
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.reviewedBrandName}"
								disabled="#{!review.requestBrand}" required="true" label="#{lbl['lbl.cm.brand']}">
								<p:ajax event="blur" update=":form:dt:brandRemark1 :form:dt:brandremarkmsg"></p:ajax>
							</p:inputText>
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.reviewedMeasurementName}"
								disabled="#{!review.requestMeasurement}"  required="true" label="#{lbl['lbl.cm.measurement']}">
								<p:ajax event="blur" update=":form:dt:measurementRemark1 :form:dt:measurementremarkmsg"></p:ajax>
							</p:inputText>
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.reviewedColorName}"
								disabled="#{!review.requestColor}" required="true" label="#{lbl['lbl.cm.color']}">
								<p:ajax event="blur" update=":form:dt:colorRemark1 :form:dt:colorremarkmsg"></p:ajax>
							</p:inputText>
						</div>

					</p:column>


					<p:column>
						<f:facet name="header">
						Remark
					</f:facet>

						<div style="width:100%; ">
							<p:inputText id="typeremark1" value="#{review.typeRemark}"
								size="30" requiredMessage="Type Remark is required!"
								required="#{unspscCodeBackingBean.checkRemark(review.typeName, review.reviewedTypeName)}"></p:inputText>
							<p:message id="typeremarkmsg" for="typeremark1"></p:message>
						</div>
						<div style="width:100%; ">
							<p:inputText id="brandRemark1" value="#{review.brandRemark}"
								size="30" requiredMessage="Brand Remark is required!"
								required="#{unspscCodeBackingBean.checkRemark(review.brandName, review.reviewedBrandName)}"></p:inputText>
							<p:message id="brandremarkmsg" for="brandRemark1"></p:message>
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.measurementRemark}" size="30" id="measurementRemark1" requiredMessage="Measurement Remark is required!"
								required="#{unspscCodeBackingBean.checkRemark(review.measurementName, review.reviewedMeasurementName)}">								
							</p:inputText>
							<p:message id="measurementremarkmsg" for="measurementRemark1"></p:message>
						</div>
						<div style="width:100%; ">
							<p:inputText value="#{review.colorRemark}" size="30" id="colorRemark1" requiredMessage="Color Remark is required!"
								required="#{unspscCodeBackingBean.checkRemark(review.colorName, review.reviewedColorName)}"></p:inputText>
							<p:message id="colorremarkmsg" for="colorRemark1"></p:message>
						</div>
						
					</p:column>

				</p:dataTable>

			</p:panel>




		</h:panelGroup>


	</ui:define>

</ui:composition>
