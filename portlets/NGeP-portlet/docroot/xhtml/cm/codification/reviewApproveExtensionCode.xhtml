<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">



	<ui:define name="contentSection">

		<h:panelGroup id="extensionFlowReviewID">
			<p:outputLabel styleClass="screen-title"
				value="Extension Code Review"></p:outputLabel>

			<div style="text-align: right;">
				<ui:repeat var="action"
					value="#{unspscCodeBackingBean.managedBean.action}">
					<p:commandButton value="#{action}"
						action="#{unspscCodeBackingBean.submitToReviewExt(action)}"></p:commandButton>
				</ui:repeat>
			</div>

			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempCode}"
							size="40" /></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempTitle}"
							size="40" /></td>
				</tr>
			</table>

			<p:dataTable style="width:100%;"
				value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList}"
				var="review">

				<p:column>
					<f:facet name="header">
							#{lbl['lbl.cm.item.description']}
						</f:facet>
					#{review.itemDetail}
				</p:column>
				<p:column>
					<f:facet name="header">
							Extension
						</f:facet>

					<table>
						<tr>
							<td>#{lbl['lbl.cm.type']}</td>
							<td><h:panelGrid columns="2"
									columnClasses="cmColumnWidth, border0">
									<p:inputText value="#{review.typeName}" disabled="true"></p:inputText>

									<p:graphicImage value="/resources/ep/images/design/add.png"
										rendered="#{review.requestType}" />

								</h:panelGrid></td>
						</tr>
						<tr>
							<td>#{lbl['lbl.cm.brand']}</td>
							<td><h:panelGrid columns="2"
									columnClasses="cmColumnWidth, border0">
									<p:inputText value="#{review.brandName}" disabled="true"></p:inputText>


									<p:graphicImage value="/resources/ep/images/design/add.png"
										rendered="#{review.requestBrand}" />
								</h:panelGrid></td>
						</tr>
						<tr>
							<td>#{lbl['lbl.cm.measurement']}</td>
							<td><h:panelGrid columns="2"
									columnClasses="cmColumnWidth, border0">
									<p:inputText value="#{review.measurementName}" disabled="true"></p:inputText>
									<p:graphicImage value="/resources/ep/images/design/add.png"
										rendered="#{review.requestMeasurement}" />


								</h:panelGrid></td>
						</tr>
						<tr>
							<td>#{lbl['lbl.cm.color']}</td>
							<td><h:panelGrid columns="2"
									columnClasses="cmColumnWidth, border0">
									<p:inputText value="#{review.colorName}" disabled="true"></p:inputText>
									<p:graphicImage value="/resources/ep/images/design/add.png"
										rendered="#{review.requestColor}" />

								</h:panelGrid></td>
						</tr>
					</table>

				</p:column>
				<p:column>
					<f:facet name="header">
						Committe Review
					</f:facet>

					<table>
						<tr>
							<td><p:inputText value="#{review.reviewedTypeName}"></p:inputText>
							</td>
						</tr>
						<tr>
							<td><p:inputText value="#{review.reviewedBrandName}"></p:inputText></td>
						</tr>
						<tr>
							<td><p:inputText value="#{review.reviewedMeasurementName}"></p:inputText></td>
						</tr>
						<tr>
							<td><p:inputText value="#{review.reviewedColorName}"></p:inputText></td>
						</tr>
					</table>

				</p:column>

			</p:dataTable>


		</h:panelGroup>


	</ui:define>

</ui:composition>
