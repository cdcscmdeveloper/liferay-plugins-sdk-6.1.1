<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<script>
			$('#portlet_UnspscRequestForm_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.cm.unspsc.code.request.form']}");
		</script>
		
		<p:blockUI block="form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<p:messages id="unspscFormId" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />

		<h:panelGroup id="cmUNSPSCrequestID">
		
			<div style="text-align: right; min-height: 40px;">
				
					<p:commandButton value="#{lbl['lbl.cm.submit']}"
						icon="ui-icon-submit" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						action="#{unspscCodeBackingBean.submitForRequest('SUBMIT')}"
						update="@form"></p:commandButton>
				

				<div style="float: left; clear: both;">
					<p:commandButton value="#{lbl['lbl.cm.back']}" icon="ui-icon-back" immediate="true"
						action="#{unspscCodeBackingBean.backToPendingCodified}"
						update="@form">
					</p:commandButton>
				</div>
			</div>






			<table style="width: 100%;" id="unspscFormId">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.item.table.type']}"></p:outputLabel></td>
					<td><p:selectOneMenu
							value="#{unspscCodeBackingBean.managedBean.requestCode.itemType}"
							style="width:228px;">
							<f:selectItem itemValue="P" itemLabel="#{lbl['lbl.txt.product']}" />
							<f:selectItem itemValue="S" itemLabel="#{lbl['lbl.txt.service']}" />
							<p:ajax event="valueChange" process="@this" update=":form:cmUNSPSCrequestID" partialSubmit="true" />
						</p:selectOneMenu></td>
					<td></td>
					<td></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><ac:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.itemName}"
							required="true" size="40"></ac:inputText></td>
					<td><p:outputLabel
							value="#{lbl['lbl.cm.request.description']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><ac:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.itemDetail}"
							required="true" size="40"></ac:inputText></td>
				</tr>

				<h:panelGroup id="extensionFiledsId"
					rendered="#{unspscCodeBackingBean.managedBean.requestCode.itemType != 'S'}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.type']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><ac:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.typeName}"
								required="true" size="40"></ac:inputText></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.brand']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><ac:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.brandName}"
								required="true" size="40"></ac:inputText></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><ac:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.measurementName}"
								required="true" size="40"></ac:inputText></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.color']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><ac:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.colorName}"
								required="true" size="40"></ac:inputText></td>
					</tr>
				</h:panelGroup>
			</table>
		</h:panelGroup>
		<p:spacer height="30px;" />



	</ui:define>


</ui:composition>
