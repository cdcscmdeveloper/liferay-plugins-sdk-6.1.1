<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">



	<ui:define name="contentSection">

		<h:panelGroup id="extensionFlowReviewID">

			<div style="text-align: right;">
				<p:commandButton id="btnAdd" value="#{lbl['lbl.cm.add.to.catalogue']}"
					rendered="#{unspscCodeBackingBean.allSupplier}"
					action="#{catalogueBackingBean.addToMaintainByItemId('ok')}" 
					disabled="#{unspscCodeBackingBean.managedBean.daCancelReg or unspscCodeBackingBean.managedBean.daBlacklistOwner}" >	<!-- [#26282] -->
				<p:tooltip id="toolTipFade" for="btnAdd" value="#{lbl['lbl.cm.tooltip.btn.addtocatalog']}" position="top"/>
					</p:commandButton>
				<ui:repeat var="action"
					value="#{unspscCodeBackingBean.managedBean.action}">
					<p:commandButton id="btnOk" value="#{lbl['lbl.bpm.action.OK']}"
						action="#{unspscCodeBackingBean.submitToReviewExt(action)}">
						<p:tooltip id="toolTipFade" for="btnOk" value="#{lbl['lbl.cm.tooltip.btn.finish']}" position="top"/>
					</p:commandButton>
				</ui:repeat>
			</div>


			<ui:include src="DocumentHeader.xhtml"></ui:include>

			<p:panel header="#{lbl['lbl.cm.request.info']}" toggleable="true">

				<table style="width: 100%; border: none;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempCode}"
								size="40" disabled="true" /></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempTitle}"
								size="40" disabled="true" /></td>
					</tr>
				</table>

				<p:dataTable style="width:100%;"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList}"
					var="review">

					<p:column>
						<f:facet name="header">
						#{lbl['lbl.cm.extension']}
					</f:facet>

						<div style="width: 100%; padding-bottom: 9px;">#{lbl['lbl.cm.type']}</div>
						<div style="width: 100%; padding-bottom: 9px;">#{lbl['lbl.cm.brand']}</div>
						<div style="width: 100%; padding-bottom: 9px;">#{lbl['lbl.cm.measurement']}</div>
						<div style="width: 100%; padding-bottom: 9px;">#{lbl['lbl.cm.color']}</div>
					</p:column>


					<p:column>
						<f:facet name="header">
							#{lbl['lbl.sc.supp.name']}
							<p:graphicImage id="uid3" value="/css/images/design/tooltips.png" />
							<p:tooltip id="uidt3" for="uid3">
								<p:outputLabel escape="false"
									value="#{lbl['lbl.cm.tooltip.coditication.notification']}" />
									</p:tooltip>
						</f:facet>

								<div style="width: 100%;">
							<p:inputText value="#{review.reviewedTypeName !=null ? review.reviewedTypeName : review.typeName}" disabled="true" />
						</div>
						<div style="width: 100%;">
							<p:inputText value="#{review.reviewedBrandName != null ? review.reviewedBrandName : review.brandName}" disabled="true" />
						</div>
						<div style="width: 100%;">
							<p:inputText value="#{review.reviewedMeasurementName !=null ? review.reviewedMeasurementName : review.measurementName }"
								disabled="true" />
						</div>
						<div style="width: 100%;">
							<p:inputText value="#{review.reviewedColorName !=null ? review.reviewedColorName : review.colorName}" disabled="true" />
						</div>

					</p:column>


				</p:dataTable>

			</p:panel>
			<p:panel id="reviewUnspscCodeRemark" header="#{lbl['lbl.cm.remarks']}" toggleable="true">
				<ui:include src="codiRemarks.xhtml"/> 
			</p:panel>


		</h:panelGroup>


	</ui:define>

</ui:composition>
