<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">


		<h:panelGroup id="deleteExtensionID">
			<h:outputLabel styleClass="screen-title"
				value="#{lbl['lbl.cm.delete.extension.code']}"></h:outputLabel>

			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					action="#{unspscCodeBackingBean.deleteExtensionCode}"
					icon="ui-icon-submit"></p:commandButton>
			</div>


			<table style="width:100%;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{codificationBackingBean.managedBean.deleteItem.cmUnspsc.unspscCode}"
							size="40" disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{codificationBackingBean.managedBean.deleteItem.cmUnspsc.unspscTitle}"
							size="40" disabled="true" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{codificationBackingBean.managedBean.deleteItem.itemName}"
							size="40" disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.type']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{codificationBackingBean.managedBean.deleteItem.cmType.typeName}"
							size="40" disabled="true" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.brand']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{codificationBackingBean.managedBean.deleteItem.cmBrand.brandName}"
							size="40" disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{codificationBackingBean.managedBean.deleteItem.cmMeasurement.measurementName}"
							size="40" disabled="true" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.color']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{codificationBackingBean.managedBean.deleteItem.cmColor.colorName}"
							size="40" disabled="true" /></td>
					<td></td>
					<td></td>
				</tr>
			</table>






		</h:panelGroup>


	</ui:define>
</ui:composition>
