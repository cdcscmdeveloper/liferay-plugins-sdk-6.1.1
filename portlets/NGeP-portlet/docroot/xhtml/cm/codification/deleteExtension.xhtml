<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<h:panelGrid columns="2" columnClasses="cmLeft,cmRight" width="100%">


			<ui:include src="itemMenu.xhtml"></ui:include>


			<h:panelGroup id="deleteExtensionID">
				<h:outputLabel styleClass="titleFront"
					value="#{lbl['lbl.cm.delete.extension.code']}"></h:outputLabel>


				<table>
					<tr>
						<td><h:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></h:outputLabel></td>
						<td><h:inputText /></td>
					</tr>
					<tr>
						<td><h:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></h:outputLabel></td>
						<td><h:inputText /></td>

					</tr>
					<tr>
						<td><h:outputLabel value="#{lbl['lbl.cm.item.name']}"></h:outputLabel></td>
						<td><h:inputText /></td>
					</tr>
					<tr>
						<td><h:outputLabel value="#{lbl['lbl.cm.type']}"></h:outputLabel></td>
						<td><h:inputText /></td>
					</tr>
					<tr>
						<td><h:outputLabel value="#{lbl['lbl.cm.brand']}"></h:outputLabel></td>
						<td><h:inputText /></td>
					</tr>
					<tr>
						<td><h:outputLabel value="#{lbl['lbl.cm.measurement']}"></h:outputLabel></td>
						<td><h:inputText /></td>
					</tr>
					<tr>
						<td><h:outputLabel value="#{lbl['lbl.cm.color']}"></h:outputLabel></td>
						<td><h:inputText /></td>
					</tr>
				</table>

				<h:panelGrid columns="3">
					<p:commandButton value="cancel"></p:commandButton>
					<p:commandButton value="submit"></p:commandButton>
					<p:commandButton value="unPublish"></p:commandButton>
					<p:commandButton value="reject"></p:commandButton>
					<p:commandButton value="approve"></p:commandButton>
				</h:panelGrid>


			</h:panelGroup>
		</h:panelGrid>

	</ui:define>
</ui:composition>
