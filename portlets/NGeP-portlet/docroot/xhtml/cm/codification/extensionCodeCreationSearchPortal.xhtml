<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


		<script>
			$('#portlet_extensionCodeCreation_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.cm.extension.code.creation.title']}");
		</script>
	<h:outputStylesheet library="ep/css" name="common.css"  />

	<h:panelGroup id="extensionCodeCreationsearchID">
		 <table width="100%">
			<tr>
	   		<td style="text-align: left"><p:commandButton style="width: 100px;"
				    value="#{lbl['lbl.btn.back']}"
					action="#{extensionCodeCreationBackingBean.backToPrevPortal}">
					</p:commandButton></td>
				</tr>
			</table> 
			<br />
	
		<p:panel header="#{lbl['lbl.cm.define.search']}" toggleable="true" id="panelExt">
			<table style="width: 100%;">
				<!-- Start 27625 -->
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.itype']}"></p:outputLabel></td>
					<td>
						<p:selectOneMenu id="itemType" value="#{extensionCodeCreationBackingBean.managedBean.typeName}" style="width:30%" disabled="true">
							<f:selectItems value="#{extensionCodeCreationBackingBean.managedBean.typeListSI}"></f:selectItems>
						</p:selectOneMenu>
					</td>
				</tr>
				<!-- End 27625 -->
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
					<td colspan="1"><p:autoComplete size="40"
							title="#{lbl['lbl.cm.eight.digits']}" maxlength="8"
							value="#{extensionCodeCreationBackingBean.managedBean.autoCompleteUnspscCode.unspscCode}"
							completeMethod="#{extensionCodeCreationBackingBean.autoCompleteUnspsc}"
							maxResults="15" dropdown="false" forceSelection="false" /><p:graphicImage id="itemNameID"
										value="/css/images/design/tooltips.png" /> <p:tooltip
										for="itemNameID">
										<p:outputLabel escape="false"
											value="#{lbl['lbl.tooltip.item.code']}" />
									</p:tooltip>
							</td>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
					<td><p:inputText title="#{lbl['lbl.cm.title.english']}"
							value="#{extensionCodeCreationBackingBean.managedBean.titleFilterBean.searchValue}"
							size="40" /><p:graphicImage id="itemCodeID"
										value="/css/images/design/tooltips.png" /> <p:tooltip
										for="itemCodeID">
										<p:outputLabel escape="false"
											value="#{lbl['lbl.tooltip.product.service']}" />
									</p:tooltip>
							</td>
				</tr>
			</table>

			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{extensionCodeCreationBackingBean.unspscSearch}"
					update="unspscTableID" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}" 
				    action="#{extensionCodeCreationBackingBean.resetSearch}" 					 	 
			        update="panelExt,extensionCodeCreationsearchID,unspscTableID"/>			 	 
			</div>
		</p:panel>

		<p:panel header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable tableStyleClass = "fixedTable" id="unspscTableID" lazy="true" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{extensionCodeCreationBackingBean.managedBean.searchDataModel}" var="unspscObj"
				width="100%" rows="10">

				<ac:paginator for="unspscTableID"></ac:paginator>
				
				<p:column styleClass = "wrappedTd" sortBy="#{unspscObj.unspscCode}">
					<f:facet name="header">
					#{lbl['lbl.cm.unspsc.code']}
				   </f:facet>    
				      
				       <!-- #25551 01062020 - azza - start -->
				      <p:commandLink
					     action="#{extensionCodeCreationBackingBean.goToExtensionSearchPortal(unspscObj)}"
					     disabled="#{extensionCodeCreationBackingBean.managedBean.productCode(unspscObj.unspscCode)== true}"
					     rendered="#{unspscObj.unspscLevel eq 3}">
							       #{unspscObj.unspscCode}
					 </p:commandLink>
				   
	                  <p:commandLink
						 action="#{extensionCodeCreationBackingBean.unspscPopUpSearch(unspscObj)}"
					     onclick="extensionUnspscPopUp.show()" update=":form:extensionCodeCreationPopUpId"
					     disabled="#{extensionCodeCreationBackingBean.managedBean.productCode(unspscObj.unspscCode)== true}"
						 rendered="#{unspscObj.unspscLevel ne 3}">
						           #{unspscObj.unspscCode}
					  </p:commandLink>	
					    <!-- #25551 01062020 - azza - end -->

					  					
				</p:column>
				<p:column  styleClass = "wrappedTd" sortBy="#{unspscObj.unspscTitle}">
					<f:facet name="header">
					#{lbl['lbl.cm.unspsc.title'].concat(' (').concat(lbl['lbl.cm.lang']).concat(')')}
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>
				<p:column  styleClass = "wrappedTd" sortBy="#{unspscObj.unspscTitleEng}">
					<f:facet name="header">
					#{lbl['lbl.cm.unspsc.title'].concat(' (').concat(lbl['lbl.cm.lang.eng']).concat(')')}
				</f:facet>
				#{unspscObj.unspscTitleEng}
			</p:column>

			</p:dataTable>
		</p:panel>

		<p:dialog id="extensionUnspscPopUp" widgetVar="extensionUnspscPopUp" modal="true"
			header="#{lbl['lbl.cm.item.code.search.title']}" resizable="false"  styleClass="pop_up_top" width="800" height="500">
			<ui:include src="extensionCodeCreationSearchPopUp.xhtml"></ui:include>

		</p:dialog>
		
	</h:panelGroup>

</ui:composition>
