<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<h:panelGroup id="cdTaskDetViewId">

			<p:panel header="#{lbl['lbl.cm.define.search']}" toggleable="true">

				<table style="width: 100%;">
					<tr>

						<td width="15%"><p:outputLabel
								value="#{lbl['lbl.cm.doc.no']}" /></td>
						<td width="35%"><p:inputText size="50"
								value="#{requestCodeBackingBean.managedBean.docNo}"></p:inputText></td>


						<td width="15%"><p:outputLabel
								value="#{lbl['lbl.cm.status.name']}"></p:outputLabel></td>
						<td width="35%"><p:selectOneMenu
								value="#{requestCodeBackingBean.managedBean.statusID}"
								style="width:278px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="0" />
								<f:selectItems
									value="#{requestCodeBackingBean.managedBean.statusCriteria}" />
							</p:selectOneMenu></td>

					</tr>
					<tr>
						<td width="15%"><p:outputLabel
								value="#{lbl['lbl.cm.supplier.name']}"
								rendered="#{!unspscCodeBackingBean.allSupplier}" /></td>
						<td width="35%"><p:inputText size="50"
								value="#{requestCodeBackingBean.managedBean.supplierName}"
								rendered="#{!unspscCodeBackingBean.allSupplier}"></p:inputText></td>
					</tr>


				</table>

				<div style="text-align: right;">
					<p:commandButton value="#{lbl['lbl.cm.search']}"
						action="#{requestCodeBackingBean.taskDetSearch}"
						update="cdTaskDetId">

					</p:commandButton>
				</div>



			</p:panel>


			<p:panel header="#{lbl['lbl.cm.search.result']}" toggleable="true">

				<p:dataTable id="cdTaskDetId"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{requestCodeBackingBean.managedBean.requestCodeSearchDataModel}"
					rowKey="#{obj}" var="obj" rowIndexVar="rowIndex" lazy="true"
					rows="10">

					<ac:paginator for="cdTaskDetId"></ac:paginator>

					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.doc.no']}
						</f:facet>
						#{obj[0]}

					</p:column>


					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.supplier.name']}
						</f:facet>
						#{obj[2]}

					</p:column>

					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.doc.createdDate']}
						</f:facet>


						<h:outputText value="#{obj[3]}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />


						</h:outputText>

					</p:column>

					<p:column>
						<f:facet name="header">
							 #{lbl['lbl.cm.status.name']}
						</f:facet>
						#{obj[1]}

					</p:column>

				</p:dataTable>



			</p:panel>

		</h:panelGroup>



	</ui:define>


</ui:composition>
