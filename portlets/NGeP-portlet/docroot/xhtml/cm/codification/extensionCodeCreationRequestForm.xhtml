<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
		<h:panelGroup id="cmExtensionRequestFormID">

			<div style="text-align: right; min-height: 40px;">
				<p:commandButton value="#{lbl['lbl.cm.create.publish']}"
				     id="btnSubmit"
				     disabled="#{extensionCodeCreationBackingBean.managedBean.disableSelectBtn}"
                     onclick="extensionCodeCreation.show()"></p:commandButton>

				<div style="float: left; clear: both;">
					<p:commandButton value="#{lbl['lbl.cm.back']}"
						action="#{extensionCodeCreationBackingBean.backToExtensionSearch}">
					</p:commandButton>
				</div>
			</div>

			<p:panel header="#{lbl['lbl.cm.extension.code.request.form']}" toggleable="true">
				<table style="width: 100%; height: 100%;">
					<tr></tr>
				</table>
				<table>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code.lov']}" /></td>
						<td><p:inputText
								value="#{extensionCodeCreationBackingBean.managedBean.selectedLovUnspsc.unspscCode}"
								size="50" disabled="true" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title.lov']}"></p:outputLabel></td>
						<td cosplan="1"><p:inputText
								value="#{extensionCodeCreationBackingBean.managedBean.selectedLovUnspsc.unspscTitle}"
								size="50" disabled="true" /></td>
					</tr>
				</table>
				
				<p:dataTable id="extCodeCreationId"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" rowIndexVar="rowIndex"
					value="#{extensionCodeCreationBackingBean.managedBean.requestExtCodeList}"
					var="ext">
					<p:column>
						<f:facet name="header">
						#{lbl['lbl.cm.type']}
					</f:facet>
						#{ext.typeName}

					</p:column>
					<p:column>
						<f:facet name="header">
						#{lbl['lbl.cm.brand']}
					</f:facet>
						#{ext.brandName}
					</p:column>
					<p:column>
						<f:facet name="header">
						#{lbl['lbl.cm.measurement']}
					</f:facet>
						#{ext.measurementName}
					</p:column>
					<p:column>
						<f:facet name="header">
						#{lbl['lbl.cm.color']}
					</f:facet>
						#{ext.colorName}
					</p:column>
					<p:column>
						<f:facet name="header">
						#{lbl['lbl.cm.action']}
					</f:facet>
						<p:commandLink title="#{lbl['lbl.cm.zm.edit']}" update=":form:requestExtPopUpId" onclick="extensionPopUp.show()"
							action="#{extensionCodeCreationBackingBean.editExtensionRequest(rowIndex)}">
							<p:graphicImage value="/css/images/design/edit.png"></p:graphicImage>
						</p:commandLink>
						<p:commandLink style="margin-left: 10px;" update=":form:extCodeCreationId,:form:cmExtensionRequestFormID :form:btnSubmit"
							title="#{lbl['lbl.btn.delete']}"
							action="#{extensionCodeCreationBackingBean.deleteExtensionRequest(rowIndex)}">
							<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
							<f:param name="index" value="#{rowIndex}"></f:param>
						</p:commandLink>
					</p:column>


				</p:dataTable>
				<h:panelGroup id="addBtnId">
					<div style="text-align: right;">
						<p:commandButton value="#{lbl['lbl.btn.add']}"
							action="#{extensionCodeCreationBackingBean.addMoreRequest}"
							update=":form:requestExtPopUpId, :form:btnSubmit" onclick="extensionPopUp.show()">
						</p:commandButton>
					</div>
				</h:panelGroup>

			</p:panel>

			<p:dialog id="extensionDialog" widgetVar="extensionPopUp"
				header="#{lbl['lbl.cm.request.extension.code']}" width="auto" height="auto">
				<ui:include src="requestExtensionCodeCreationPopUp.xhtml" />
			</p:dialog>
		</h:panelGroup>
		
		
			<ac:confirmationPopup id="extensionCodeCreation" widget="extensionCodeCreation"
				okAction="extensionCodeCreationBackingBean.submitIntoDB"
				width="400" height="100"
				title="#{lbl['lbl.cm.dialog.cofirm.header']}"
				content="#{lbl['lbl.cm.dialog.message.extension.code.creation']}"
				update=":form"
				oncomplete="extensionCodeCreation.hide();"/>
		
	</ui:define>

</ui:composition>
