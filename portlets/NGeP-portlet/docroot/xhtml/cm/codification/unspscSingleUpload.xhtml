<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<h:panelGroup id="cmUNSPSCSingleUploadID">

			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.cm.save']}" icon="ui-icon-save"
					action="#{unspscCodeBackingBean.savetempCode}"></p:commandButton>
			</div>


			<p:panelGrid style="width:100%;" styleClass="tablePanel">
				<f:facet name="header">
					<p:row>
						<p:column>
							<h:outputLabel value="" />
						</p:column>
						<p:column>
							 Code
						</p:column>
						<p:column>
							Title
						</p:column>
						<p:column>
							Key
						</p:column>
						<p:column>
							Description
						</p:column>
					</p:row>

				</f:facet>

				<p:row>
					<p:column>
						<h:outputLabel value="Segment" />
					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.segmentCode}"></p:inputText>

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.segmentTitle}"></p:inputText>

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.segmentKey}"></p:inputText>
					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.segmentDesc}"></p:inputText>

					</p:column>
				</p:row>
				
				
				<p:row>
					<p:column>
						<h:outputLabel value="Family" />
					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.familyCode}"></p:inputText>

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.familyTitle}"></p:inputText>

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.familyKey}"></p:inputText>
					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.familyDesc}"></p:inputText>

					</p:column>
				</p:row>
				
				<p:row>
					<p:column>
						<h:outputLabel value="Class" />
					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.classCode}"></p:inputText>

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.classTitle}"></p:inputText>

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.classKey}"></p:inputText>
					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.classDesc}"></p:inputText>

					</p:column>
				</p:row>
				
				
				<p:row>
					<p:column>
						<h:outputLabel value="Commodity" />
					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.commodityCode}"></p:inputText>

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.commodityTitle}"></p:inputText>

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.commodityKey}"></p:inputText>
					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.commodityDesc}"></p:inputText>

					</p:column>
				</p:row>
				

			</p:panelGrid>



			

		</h:panelGroup>


	</ui:define>


</ui:composition>
