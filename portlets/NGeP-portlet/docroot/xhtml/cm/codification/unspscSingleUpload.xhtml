<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<h:panelGroup id="cmUNSPSCSingleUploadID">
			<p:messages showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.cm.save']}" icon="ui-icon-save"
					action="#{unspscCodeBackingBean.savetempCode}" update="@form"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.back']}" icon="ui-icon-prev"
					action="#{unspscCodeBackingBean.backToReviewUnspsc}"></p:commandButton>
			</div>

			<table style="width: 100%;">


				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.itemName}"
							size="40"></p:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.item.details']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.requestCode.itemDetail}"
							size="40"></p:inputText></td>
				</tr>
			</table>


			<p:panelGrid style="width:100%;" styleClass="tablePanel" id="tablePanelId">
				<f:facet name="header">
					<p:row>
						<p:column>
							<h:outputLabel value="" />
						</p:column>
						<p:column>
							#{lbl['lbl.cm.code']} 
						</p:column>
						<p:column>
							#{lbl['lbl.cm.doc.title']}
						</p:column>
						<p:column>
							#{lbl['lbl.cm.key']}
						</p:column>
						<p:column>
							#{lbl['lbl.cm.description']}
						</p:column>
					</p:row>

				</f:facet>

				<p:row>
					<p:column>
						<h:outputLabel value="#{lbl['lbl.cm.segment']}" />
					</p:column>
					<p:column>

						<ac:lov id="segmentUploadId" lovId="CM_UNSPSC"
							headerText="#{lbl['lbl.cm.segment']} Lov" update=":form:tablePanelId"
							saveObject="unspscCodeBackingBean.managedBean.selectedLovUnspscSegment"
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscCode}"
							conditionField="recordStatus^1|unspscLevel^0">
						</ac:lov>
						<ac:lovPopup />

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscTitle}"></p:inputText>

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscKey}"></p:inputText>
					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscDescription}"></p:inputText>

					</p:column>
				</p:row>


				<p:row>
					<p:column>
						<h:outputLabel value="#{lbl['lbl.cm.family']}" />
					</p:column>
					<p:column>
						<ac:lov id="familyUploadId" lovId="CM_UNSPSC"
							headerText="#{lbl['lbl.cm.family']} Lov" update=":form:tablePanelId"
							saveObject="unspscCodeBackingBean.managedBean.selectedLovUnspscfamily"
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscCode}"
							conditionField="recordStatus^1|unspscLevel^1|unspscParentCode^#{unspscCodeBackingBean.managedBean.selectedLovUnspscSegment.unspscCode}">
						</ac:lov>
						<ac:lovPopup />

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscTitle}"></p:inputText>

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscKey}"></p:inputText>
					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscDescription}"></p:inputText>

					</p:column>
				</p:row>

				<p:row>
					<p:column>
						<h:outputLabel value="#{lbl['lbl.cm.class']}" />
					</p:column>
					<p:column>
						<ac:lov id="classUploadId" lovId="CM_UNSPSC"
							headerText="#{lbl['lbl.cm.class']} Lov" update=":form:tablePanelId"
							saveObject="unspscCodeBackingBean.managedBean.selectedLovUnspscClass"
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscCode}"
							conditionField="recordStatus^1|unspscLevel^2|unspscParentCode^#{unspscCodeBackingBean.managedBean.selectedLovUnspscfamily.unspscCode}">
						</ac:lov>
						<ac:lovPopup />

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscTitle}"></p:inputText>

					</p:column>
					<p:column>
						<p:inputText value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscKey}"></p:inputText>
					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscDescription}"></p:inputText>

					</p:column>
				</p:row>


				<p:row>
					<p:column>
						<h:outputLabel value="#{lbl['lbl.cm.commodity']}" />
					</p:column>
					<p:column>
						<ac:lov id="commodityUploadId" lovId="CM_UNSPSC"
							headerText="#{lbl['lbl.cm.commodity']} Lov" update=":form:tablePanelId"
							saveObject="unspscCodeBackingBean.managedBean.selectedLovUnspsc"
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspsc.unspscCode}"
							conditionField="recordStatus^1|unspscLevel^3|unspscParentCode^#{unspscCodeBackingBean.managedBean.selectedLovUnspscClass.unspscCode}">
						</ac:lov>
						<ac:lovPopup />

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspsc.unspscTitle}"></p:inputText>

					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspsc.unspscKey}"></p:inputText>
					</p:column>
					<p:column>
						<p:inputText
							value="#{unspscCodeBackingBean.managedBean.selectedLovUnspsc.unspscDescription}"></p:inputText>

					</p:column>
				</p:row>


			</p:panelGrid>





		</h:panelGroup>


	</ui:define>


</ui:composition>
