<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<h:panelGroup id="cmUNSPSCSingleUploadID">
			<p:outputLabel styleClass="screen-title"
				value="#{lbl['lbl.cm.unspsc.code.single.upload']}"></p:outputLabel>

			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.cm.save']}" icon="ui-icon-save"
					action="#{unspscCodeBackingBean.savetempCode}"></p:commandButton>
			</div>
			<table style="width:100%;">
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.segment.code']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.segmentCode}"></p:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.family.code']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.familyCode}"></p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.segment.title']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.segmentTitle}"></p:inputText></td>

					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.familyTitle}"></p:inputText></td>
				</tr>

				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.segment.key']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.segmentKey}"></p:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.family.key']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.familyKey}"></p:inputText></td>
				</tr>

				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.cm.segment.description']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.segmentDesc}"></p:inputText></td>
					<td><p:outputLabel
							value="#{lbl['lbl.cm.family.description']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.familyDesc}"></p:inputText></td>
				</tr>

				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.class.code']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.classCode}"></p:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.commodity.code']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.commodityCode}"></p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.class.title']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.classTitle}"></p:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.commodity.title']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.commodityTitle}"></p:inputText></td>
				</tr>

				<tr>

					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.classKey}"></p:inputText></td>

							value="#{unspscCodeBackingBean.managedBean.commodityKey}"></p:inputText></td>
				</tr>

				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.cm.class.description']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.classDesc}"></p:inputText></td>
					<td><p:outputLabel
							value="#{lbl['lbl.cm.commodity.description']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.commodityDesc}"></p:inputText></td>
				</tr>

</ui:composition>
