<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">



	<ui:define name="contentSection">

		<h:panelGroup id="extensionFlowReviewID">

			<div style="text-align: right;">
				<ui:repeat var="action"
					value="#{unspscCodeBackingBean.managedBean.action}">
					<p:commandButton value="#{action}" rendered="#{bpmTasklistBackingBean.managedBean.claim}"
						oncomplete="extensionConfirmation.show()"
						update=":form:extensionConfirmationId"
						action="#{unspscCodeBackingBean.checkRecomendOrSubmit()}"></p:commandButton>
				</ui:repeat>
				<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}" action="#{bpmTasklistBackingBean.claimTaskInDetailPage}" rendered="#{!bpmTasklistBackingBean.managedBean.claim}" update="@form"></p:commandButton>
		
			</div>

			<ui:include src="DocumentHeader.xhtml"></ui:include>

			<p:panel header="#{lbl['lbl.cm.request.info']}" toggleable="true">

				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.unspscCode']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempCode}"
								size="40" disabled="true" /></td>
						<td><p:outputLabel value="#{lbl['lbl.rpt.unspscTitle']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempTitle}"
								size="40" disabled="true" /></td>
					</tr>
				</table>


				<p:dataTable style="width:100%;"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList}"
					var="review">

					<p:column>
						<f:facet name="header">
						#{lbl['lbl.cm.extension']}
					</f:facet>
						<div style="width: 100%; padding-bottom: 9px;">#{lbl['lbl.cm.type']}</div>
						<div style="width: 100%; padding-bottom: 9px;">#{lbl['lbl.cm.brand']}</div>
						<div style="width: 100%; padding-bottom: 9px;">#{lbl['lbl.cm.measurement']}</div>
						<div style="width: 100%; padding-bottom: 9px;">#{lbl['lbl.cm.color']}</div>
					</p:column>


					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.supplier.input']}
						</f:facet>

						<div style="width: 100%; padding-bottom: 5px; height: 20px;">
							<p:inputText value="#{review.typeName}"
								disabled="#{!review.requestType}"></p:inputText>
						</div>
						<div style="width: 100%; padding-bottom: 5px; height: 20px;">
							<p:inputText value="#{review.brandName}"
								disabled="#{!review.requestBrand}"></p:inputText>
						</div>
						<div style="width: 100%; padding-bottom: 5px; height: 20px;">
							<p:inputText value="#{review.measurementName}"
								disabled="#{!review.requestMeasurement}"></p:inputText>

						</div>
						<div style="width: 100%; padding-bottom: 5px; height: 20px;">
							<p:inputText value="#{review.colorName}"
								disabled="#{!review.requestColor}"></p:inputText>

						</div>

					</p:column>


					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.existing.extension']}
						</f:facet>

						<div style="width: 100%; padding-bottom: 5px; height: 20px;">

							<p:selectOneMenu rendered="#{review.requestType}"
								style="width: 128px;" value="#{review.typeNameDD}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{unspscCodeBackingBean.managedBean.typeList}"
									var="type" itemLabel="#{type.typeName}"
									itemValue="#{type.typeId}"></f:selectItems>
							</p:selectOneMenu>
						</div>
						<div style="width: 100%; padding-bottom: 5px; height: 20px;">

							<p:selectOneMenu rendered="#{review.requestBrand}"
								style="width: 128px;" value="#{review.brandNameDD}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{unspscCodeBackingBean.managedBean.brandList}"
									var="brand" itemLabel="#{brand.brandName}"
									itemValue="#{brand.brandId}"></f:selectItems>
							</p:selectOneMenu>
						</div>
						<div style="width: 100%; padding-bottom: 5px; height: 20px;">

							<p:selectOneMenu rendered="#{review.requestMeasurement}"
								style="width: 128px;" value="#{review.measurementNameDD}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{unspscCodeBackingBean.managedBean.measurementList}"
									var="measurement" itemLabel="#{measurement.measurementName}"
									itemValue="#{measurement.measurementId}"></f:selectItems>
							</p:selectOneMenu>
						</div>
						<div style="width: 100%; padding-bottom: 5px; height: 20px;">

							<p:selectOneMenu rendered="#{review.requestColor}"
								style="width: 128px;" value="#{review.colorNameDD}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{unspscCodeBackingBean.managedBean.colorList}"
									var="color" itemLabel="#{color.colorName}"
									itemValue="#{color.colorId}"></f:selectItems>
							</p:selectOneMenu>
						</div>

					</p:column>


				</p:dataTable>

			</p:panel>


			<p:confirmDialog id="extensionConfirmationId"
				message="#{unspscCodeBackingBean.managedBean.extensionConfirmationMsg}"
				header="#{lbl['lbl.cm.dialog.cofirm.header']}"
				widgetVar="extensionConfirmation">

				<p:commandButton id="confirmID"
					value="#{lbl['lbl.cm.dialog.cofirm.yes']}"
					action="#{unspscCodeBackingBean.submitToReviewExt('SUBMIT')}" />
				<p:commandButton id="declineID"
					value="#{lbl['lbl.cm.dialog.cofirm.no']}"
					onclick="extensionConfirmation.hide()" />

			</p:confirmDialog>


		</h:panelGroup>


	</ui:define>

</ui:composition>
