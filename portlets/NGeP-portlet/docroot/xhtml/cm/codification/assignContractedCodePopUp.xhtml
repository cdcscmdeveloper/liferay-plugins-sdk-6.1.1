<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns="http://www.w3.org/1999/xhtml">

	<h:panelGroup id="contractedItemPopUpId">

		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.segment']}"></p:outputLabel></td>
				<td><p:selectOneMenu
						value="#{codificationBackingBean.managedBean.segmentCode}">
						<f:selectItems
							value="#{codificationBackingBean.managedBean.segmentCriteria}" />
						<p:ajax event="change"
							listener="#{codificationBackingBean.filterFamily()}"
							update="familyDD"></p:ajax>
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.family']}"></p:outputLabel></td>
				<td><p:selectOneMenu id="familyDD"
						value="#{codificationBackingBean.managedBean.familyCode}">
						<f:selectItems
							value="#{codificationBackingBean.managedBean.familyCriteria}" />
						<p:ajax event="change"
							listener="#{codificationBackingBean.filterClass()}"
							update="classDD"></p:ajax>
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.class']}"></p:outputLabel></td>
				<td><p:selectOneMenu id="classDD"
						value="#{codificationBackingBean.managedBean.classCode}">
						<f:selectItems
							value="#{codificationBackingBean.managedBean.classCriteria}" />
						<p:ajax event="change"
							listener="#{codificationBackingBean.filterCommodity()}"
							update="commodityDD"></p:ajax>
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.commodity']}"></p:outputLabel></td>
				<td><p:selectOneMenu id="commodityDD"
						value="#{codificationBackingBean.managedBean.commodityCode}">
						<f:selectItems
							value="#{codificationBackingBean.managedBean.commodityCriteria}" />
						<p:ajax event="change"
							listener="#{codificationBackingBean.filterExtType()}"
							update="typeDD, brandDD, measurementDD,colorDD "></p:ajax>
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.type']}"></p:outputLabel></td>
				<td><p:selectOneMenu id="typeDD"
						value="#{codificationBackingBean.managedBean.typeCode}">
						<f:selectItems
							value="#{codificationBackingBean.managedBean.typeCriteria}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.brand']}"></p:outputLabel></td>
				<td><p:selectOneMenu id="brandDD"
						value="#{codificationBackingBean.managedBean.brandCode}">
						<f:selectItems
							value="#{codificationBackingBean.managedBean.brandCriteria}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
				<td><p:selectOneMenu id="measurementDD"
						value="#{codificationBackingBean.managedBean.measurementCode}">
						<f:selectItems
							value="#{codificationBackingBean.managedBean.measurementCriteria}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.color']}"></p:outputLabel></td>
				<td><p:selectOneMenu id="colorDD"
						value="#{codificationBackingBean.managedBean.colorCode}">
						<f:selectItems
							value="#{codificationBackingBean.managedBean.colorCriteria}" />
					</p:selectOneMenu></td>
			</tr>

		</table>


	</h:panelGroup>

	<p:commandButton value="#{lbl['lbl.cm.ok']}" action="#{codificationBackingBean.insertContractedItemCode}"
		onclick="contractedItemPopUp.hide()"></p:commandButton>







</ui:composition>
