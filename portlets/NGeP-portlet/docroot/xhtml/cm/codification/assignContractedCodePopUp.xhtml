<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns="http://www.w3.org/1999/xhtml">

	<p:messages showDetail="true" autoUpdate="true" closable="true"
		showSummary="true"></p:messages>

	<h:panelGroup id="contractedItemPopUpId">
		<p:panel header="#{lbl['lbl.cm.search']}">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.segment']}"></p:outputLabel></td>
					<td><ac:lov id="segmentId" lovId="CM_UNSPSC" size="26"
							headerText="#{lbl['lbl.cm.segment']}" update=":form:contractedItemPopUpId"
							saveObject="codificationBackingBean.managedBean.selectedLovUnspscSegment"
							value="#{codificationBackingBean.managedBean.selectedLovUnspscSegment.unspscTitle}"
							conditionField="recordStatus^1|unspscLevel^0|unspscCode^76000000^#{codificationBackingBean.productOrServiceOperator()}">

						</ac:lov></td>

				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.family']}"></p:outputLabel></td>
					<td><ac:lov id="familyId" lovId="CM_UNSPSC" size="26"
							headerText="#{lbl['lbl.cm.family']}" update=":form:contractedItemPopUpId"
							saveObject="codificationBackingBean.managedBean.selectedLovUnspscFamily"
							value="#{codificationBackingBean.managedBean.selectedLovUnspscFamily.unspscTitle}"
							conditionField="recordStatus^1|unspscLevel^1|unspscParentCode^#{codificationBackingBean.managedBean.selectedLovUnspscSegment.unspscCode}">
						</ac:lov></td>

				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.class']}"></p:outputLabel></td>
					<td><ac:lov id="classId" lovId="CM_UNSPSC" size="26"
							headerText="#{lbl['lbl.cm.class']}" update=":form:contractedItemPopUpId"
							saveObject="codificationBackingBean.managedBean.selectedLovUnspscClass"
							value="#{codificationBackingBean.managedBean.selectedLovUnspscClass.unspscTitle}"
							conditionField="recordStatus^1|unspscLevel^2|unspscParentCode^#{codificationBackingBean.managedBean.selectedLovUnspscFamily.unspscCode}">
						</ac:lov></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.commodity']}"></p:outputLabel></td>
					<td><ac:lov id="commodityId" lovId="CM_UNSPSC" size="26"
							headerText="#{lbl['lbl.cm.commodity']}" update=":form:contractedItemPopUpId"
							saveObject="codificationBackingBean.managedBean.selectedUNSPSCObj"
							value="#{codificationBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}"
							conditionField="recordStatus^1|unspscLevel^3|unspscParentCode^#{codificationBackingBean.managedBean.selectedLovUnspscClass.unspscCode}"
							postUpdateListener="#{codificationBackingBean.fillExtensionLists()}">
						</ac:lov></td>
				</tr>
				<h:panelGroup
					rendered="#{codificationBackingBean.isSelectedRequestItemProduct()}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.type']}"></p:outputLabel></td>
						<td><p:selectOneMenu id="typeDD"
								value="#{codificationBackingBean.typeFilterBean.searchValue}"
								style="width:178px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{codificationBackingBean.managedBean.typeCriteria}" />
							</p:selectOneMenu></td>
						<td><p:selectBooleanCheckbox
								disabled="#{empty codificationBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}"
								value="#{codificationBackingBean.managedBean.requestExtCode.requestType}">
								<p:ajax listener="#{codificationBackingBean.requestNewType}"
									update="requestTypeId"></p:ajax>
							</p:selectBooleanCheckbox></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.request.new']}"></p:outputLabel></td>
						<td><p:inputText id="requestTypeId"
								value="#{codificationBackingBean.managedBean.requestExtCode.typeName}"
								disabled="#{codificationBackingBean.managedBean.typeDisable}"></p:inputText></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.brand']}"></p:outputLabel></td>
						<td><p:selectOneMenu id="brandDD"
								value="#{codificationBackingBean.brandFilterBean.searchValue}"
								style="width:178px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{codificationBackingBean.managedBean.brandCriteria}" />
							</p:selectOneMenu></td>
						<td><p:selectBooleanCheckbox
								disabled="#{empty codificationBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}"
								value="#{codificationBackingBean.managedBean.requestExtCode.requestBrand}">
								<p:ajax listener="#{codificationBackingBean.requestNewBrand}"
									update="requestBrandId"></p:ajax>
							</p:selectBooleanCheckbox></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.request.new']}"></p:outputLabel></td>
						<td><p:inputText id="requestBrandId"
								value="#{codificationBackingBean.managedBean.requestExtCode.brandName}"
								disabled="#{codificationBackingBean.managedBean.brandDisable}"></p:inputText></td>
					</tr>
					<tr style="margin-bottom: 10px" />
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
						<td><p:selectOneMenu id="measurementDD"
								value="#{codificationBackingBean.measurementFilterBean.searchValue}"
								style="width:178px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{codificationBackingBean.managedBean.measurementCriteria}" />
							</p:selectOneMenu></td>
						<td><p:selectBooleanCheckbox
								disabled="#{empty codificationBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}"
								value="#{codificationBackingBean.managedBean.requestExtCode.requestMeasurement}">
								<p:ajax
									listener="#{codificationBackingBean.requestNewMeasurement}"
									update="requestMeasurementId"></p:ajax>
							</p:selectBooleanCheckbox></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.request.new']}"></p:outputLabel></td>
						<td><p:inputText id="requestMeasurementId"
								value="#{codificationBackingBean.managedBean.requestExtCode.measurementName}"
								disabled="#{codificationBackingBean.managedBean.measurementDisable}"></p:inputText></td>
					</tr>
					<tr style="margin-bottom: 10px" />
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.color']}"></p:outputLabel></td>
						<td><p:selectOneMenu id="colorDD"
								value="#{codificationBackingBean.colorFilterBean.searchValue}"
								style="width:178px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{codificationBackingBean.managedBean.colorCriteria}" />
							</p:selectOneMenu></td>
						<td><p:selectBooleanCheckbox
								disabled="#{empty codificationBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}"
								value="#{codificationBackingBean.managedBean.requestExtCode.requestColor}">
								<p:ajax listener="#{codificationBackingBean.requestNewColor}"
									update="requestColorId"></p:ajax>
							</p:selectBooleanCheckbox></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.request.new']}"></p:outputLabel></td>
						<td><p:inputText id="requestColorId"
								value="#{codificationBackingBean.managedBean.requestExtCode.colorName}"
								disabled="#{codificationBackingBean.managedBean.colorDisable}"></p:inputText></td>
					</tr>
				</h:panelGroup>
			</table>
		</p:panel>
		<h:panelGroup
			rendered="#{codificationBackingBean.isSelectedRequestItemProduct()}">

			<div style="float: right;">
				<div style="text-align: right; float: right;">
					<p:commandButton value="Search" icon="ui-icon-search"
						action="#{codificationBackingBean.extensionCodeSearch}"
						update="itemTableID" />
				</div>
				<div style="text-align: right; float: right;">
					<p:commandButton value="#{lbl['lbl.cm.r.e.c']}"
						action="#{codificationBackingBean.requestNewExtensionCode}" />
				</div>
				<div style="text-align: right; float: right;">
					<p:commandButton value="#{lbl['lbl.cm.r.u.c']}"
						action="#{codificationBackingBean.goToRequestUnspsc}" />
				</div>
			</div>
			<br />
			<p:spacer height="30px;" />
			<div style="float: left;">
				<h:outputText
					value="#{lbl['lbl.cm.request.extension.help.msg']}"></h:outputText>
			</div>

			<p:spacer height="40px;" />
			<p:panel header="#{lbl['lbl.cm.search.result']}">

				<p:dataTable id="itemTableID"
					value="#{codificationBackingBean.extensionSearchItemDataModel}"
					rowKey="#{obj}" var="obj" rowIndexVar="rowIndex"
					selection="#{codificationBackingBean.managedBean.selectedExtenstionForItem}"
					lazy="true">

					<p:column selectionMode="single" style="width:2%" />

					<ac:paginator for="itemTableID"></ac:paginator>

					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.type']}
						</f:facet>
						#{obj[4]}

					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.brand']}
						</f:facet>
						#{obj[5]}
					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.measurement']}
						</f:facet>
						
						#{obj[6]}

					</p:column>
					<p:column>
						<f:facet name="header">
							#{lbl['lbl.cm.color']}
						</f:facet>
						#{obj[7]}
					</p:column>




				</p:dataTable>

				<div class="clear"></div>
				<div style="text-align: right;"></div>

			</p:panel>
		</h:panelGroup>
		<div class="clear"></div>
		<div style="text-align: right;">
		<h:panelGroup rendered="#{!(codificationBackingBean.isSelectedRequestItemProduct())}">
		<p:commandButton value="#{lbl['lbl.cm.r.u.c']}"
						action="#{codificationBackingBean.goToRequestUnspsc}" />
		</h:panelGroup>		
			<p:commandButton value="#{lbl['lbl.cm.assign']}"
				action="#{codificationBackingBean.insertContractedItemCode}"
				update=":form:contractedTableId,:form:contractedItemID"
				icon="ui-icon-accept" onclick="contractedItemPopUp.hide()"></p:commandButton>


			<p:commandButton value="#{lbl['lbl.cm.cancel']}"
				icon="ui-icon-cancel" immediate="true"
				onclick="contractedItemPopUp.hide()"></p:commandButton>
		</div>
		<div class="clear"></div>

<h:panelGroup rendered="#{codificationBackingBean.isSelectedRequestItemProduct()}">
		<h:outputText
			value="#{lbl['lbl.cm.instruction1']}"></h:outputText>
</h:panelGroup>
	</h:panelGroup>


</ui:composition>
