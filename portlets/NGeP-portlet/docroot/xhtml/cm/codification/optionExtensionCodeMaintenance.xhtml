<ui:composition		
   template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	
		<ui:define name="contentSection">
	

		<h:panelGroup id="optionExtensionCodeID">
				<p:messages id="form" showDetail="true" autoUpdate="true" closable="true"
				showSummary="true"></p:messages>
				
	    <table width="100%">
			<tr>
				<td style="text-align: left"><p:commandButton style="width: 100px;"
						value="#{lbl['lbl.btn.back']}"
						action="#{codificationMaintenanceBackingBean.backToPrevPortal}">
						</p:commandButton></td>
			   <td style="text-align: right"><p:commandButton style="width: 100px;"
						 value="#{lbl['lbl.cm.save']}"
						 onclick="updateData.show()">
					   </p:commandButton></td>
				</tr>
		</table>
	<br/>
		
		<p:panel  header="#{lbl['lbl.cm.item.code.information']}" toggleable="true">
		
		<table width="100%;">
		
			<tr>
				<td width="20%"><p:outputLabel style="font-weight: bold;padding-left:100px;"  
						value="#{lbl['lbl.cm.segment.code']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.segmentCode}"
						size="25" /></td>

				<td width="20%"><p:outputLabel style="font-weight: bold;padding-left:120px;"
						value="#{lbl['lbl.cm.segment.title']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.segmentTitle}"
						style="white-space:normal!important;" size="25" /></td>
			</tr>
			<tr>
				<td width="20%"><p:outputLabel style="font-weight: bold;padding-left:100px;"
						value="#{lbl['lbl.cm.family.code']}"></p:outputLabel></td>
				<td><h:outputText id="familyCode"
						value="#{codificationMaintenanceBackingBean.managedBean.familyCode}"
						size="25" disabled="true"/></td>

				<td width="20%"><p:outputLabel style="font-weight: bold;padding-left:120px;"
						value="#{lbl['lbl.cm.family.title']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.familyTitle}"
						style="white-space:normal!important;" size="25" disabled="true" /></td>
			</tr>
			<tr>
				<td width="20%"><p:outputLabel style="font-weight: bold;padding-left:100px;"
						value="#{lbl['lbl.cm.class.code']}"></p:outputLabel></td>
				<td><h:outputText id="classCode"
						value="#{codificationMaintenanceBackingBean.managedBean.classCode}" size="25"
						disabled="true" /></td>
				<td width="20%"><p:outputLabel style="font-weight: bold;padding-left:120px;"
						value="#{lbl['lbl.cm.class.title']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.classTitle}"
						style="white-space:normal!important;" size="25" disabled="true" /></td>
			</tr>
			<tr>
				<td width="20%"><p:outputLabel style="font-weight: bold;padding-left:100px;"
						value="#{lbl['lbl.cm.commodity.code']} "></p:outputLabel></td>
				<td><h:outputText id="commodityCode"
						value="#{codificationMaintenanceBackingBean.managedBean.commodityCode}" size="25"
						disabled="true" /></td>
				<td width="20%"><p:outputLabel style="font-weight: bold;padding-left:120px;"
						value="#{lbl['lbl.cm.commodity.title']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.commodityTitle}"
						style="white-space:normal!important;" size="25" disabled="true" /></td>
		   </tr>
		    <tr>
				<td width="20%"><p:outputLabel style="font-weight: bold;padding-left:100px;"
						value="#{lbl['lbl.cm.extension.attr']} "></p:outputLabel></td>
				<td><p:selectOneMenu id="extension" style="width:200px">
                    <f:selectItem itemLabel="#{lbl['lbl.cm.type']}"  itemValue="T" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.brand']}" itemValue="B" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.measurement']}" itemValue="M" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.color']}" itemValue="C" />
        </p:selectOneMenu></td>
		   </tr>
		     <tr>
				<td width="20%"><p:outputLabel style="font-weight: bold;padding-left:100px;"
						value="#{lbl['lbl.cm.status.name']} "></p:outputLabel></td>
				<td><p:selectOneMenu id="status"  style="width:200px">
				    <f:selectItem itemLabel="#{lbl['lbl.cm.selectOne']}"  itemValue="" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.active']}"  itemValue="1" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.inactive']}" itemValue="0" />               
        </p:selectOneMenu></td>
		   </tr>
		</table>
		
			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{codificationMaintenanceBackingBean.extensionCodeSearch}"
					 update="itemTableID" />				 	 
			</div>
		
		</p:panel>
			
		<p:panel  header="#{lbl['lbl.cm.search.result']}" toggleable="true">
		
		<p:dataTable tableStyleClass = "fixedTable" id="itemTableID" lazy="true" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{codificationMaintenanceBackingBean.managedBean.extensionSearchItemDataModel}" rowKey="#{obj}" var="obj"
				width="100%" rows="10">

				<ac:paginator for="itemTableID"></ac:paginator>


				<p:column  styleClass = "wrappedTd">
					<f:facet name="header">
					#{lbl['lbl.cm.type']}
				</f:facet>
					#{obj[4]}
				</p:column>
				<p:column  styleClass = "wrappedTd">
					<f:facet name="header">
					#{lbl['lbl.cm.code']}
				</f:facet>
			</p:column>
				<p:column headerText="#{lbl['lbl.cm.status.name']}" styleClass="column-align-center"  style="width:10%;white-space:normal;">
					<p:selectOneMenu id="status" style="width:125px">
				    <f:selectItem itemLabel="#{lbl['lbl.cm.selectOne']}"  itemValue="" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.active']}"  itemValue="1" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.inactive']}" itemValue="0" />               
                    </p:selectOneMenu>
				</p:column>					
			</p:dataTable>
		</p:panel> 
		
		<p:confirmDialog
		           style="font-size:14px;height:20px"
		           header="#{lbl['lbl.cm.dialog.cofirm.header']}" 
                   message="#{lbl['lbl.cm.dialog.message.item.code.maintenance']}" 
                   showEffect="fade"
                   hideEffect="fade" 
                   widgetVar="updateData">
        <div style="text-align: right;">
            <p:commandButton 
                     value="#{lbl['lbl.cm.dialog.cofirm.yes']}"
                     action="#{codificationMaintenanceBackingBean.SubmitUpdateData}"
                     oncomplete="updateData.hide()" 
                     update=":form"/>
            <p:commandButton
                     value="#{lbl['lbl.btn.no']}"
                     oncomplete="updateData.hide()"/>
                     </div>
        </p:confirmDialog>
	</h:panelGroup>
		
  </ui:define>
	
 </ui:composition>
