<ui:composition		
   template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	
		<ui:define name="contentSection">
	

		<h:panelGroup id="optionExtensionCodeID">
				<p:messages id="form" showDetail="true" autoUpdate="true" closable="true"
				showSummary="true"></p:messages>
				
	    <table width="100%">
			<tr>
				<td style="text-align: left"><p:commandButton style="width: 100px;"
						value="#{lbl['lbl.btn.back']}"
						action="#{codificationMaintenanceBackingBean.backToPrevPortal}">
						</p:commandButton></td>
			   <td style="text-align: right"><p:commandButton style="width: 100px;"
						 value="#{lbl['lbl.cm.save']}"
						 onclick="updateData.show()">
					   </p:commandButton></td>
				</tr>
		</table>
	<br/>
		
		<p:panel  header="#{lbl['lbl.cm.item.code.information']}" toggleable="true">
		
		<table width="100%;">
		
			<tr>
				<td width="15%"><p:outputLabel style="font-weight: bold;"  
						value="#{lbl['lbl.cm.segment.code']}"></p:outputLabel></td>
				<td width="30%"><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.segmentCode}"/></td>

				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.segment.title']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.segmentTitle}"
						style="white-space:normal!important;" /></td>
			</tr>
			<tr>
				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.family.code']}"></p:outputLabel></td>
				<td width="30%"><h:outputText id="familyCode"
						value="#{codificationMaintenanceBackingBean.managedBean.familyCode}"/></td>

				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.family.title']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.familyTitle}"
						style="white-space:normal!important;" /></td>
			</tr>
			<tr>
				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.class.code']}"></p:outputLabel></td>
				<td width="30%"><h:outputText id="classCode"
						value="#{codificationMaintenanceBackingBean.managedBean.classCode}" /></td>
				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.class.title']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.classTitle}"
						style="white-space:normal!important;" /></td>
			</tr>
			<tr>
				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.commodity.code']} "></p:outputLabel></td>
				<td width="30%"><h:outputText id="commodityCode"
						value="#{codificationMaintenanceBackingBean.managedBean.selectedUNSPSCObj.unspscCode}" /></td>
				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.commodity.title']}"></p:outputLabel></td>
				<td><h:outputText
						value="#{codificationMaintenanceBackingBean.managedBean.selectedUNSPSCObj.unspscTitle}"
						style="white-space:normal!important;"/></td>
		   </tr>
		    <tr>
				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.extension.attr']} "></p:outputLabel></td>
				<td width="30%"><p:selectOneMenu styleClass="custom-filter"
				       id="extension" style="width:200px" value = "#{codificationMaintenanceBackingBean.data}">
                    <f:selectItem itemLabel="#{lbl['lbl.cm.type']}"  itemValue="type" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.brand']}" itemValue="brand" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.measurement']}" itemValue="measurement" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.color']}" itemValue="color" />
                  <p:ajax event="change" process="@this" update="unspscTableID" 
					listener="#{codificationMaintenanceBackingBean.changeSearchPlanType(codificationMaintenanceBackingBean.data)}" />                 
        </p:selectOneMenu></td>
		   </tr>
		     <tr>
				<td width="15%"><p:outputLabel style="font-weight: bold;"
						value="#{lbl['lbl.cm.status.name']} "></p:outputLabel></td>
				<td width="30%"><p:selectOneMenu id="status"  style="width:200px">
				    <f:selectItem itemLabel="#{lbl['lbl.cm.selectOne']}"  itemValue="" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.active']}"  itemValue="1" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.inactive']}" itemValue="0" />               
        </p:selectOneMenu></td>
		   </tr>
		</table>
		
			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					 action="#{codificationMaintenanceBackingBean.extensionCodeSearch}"
					 update="unspscTableID" />
			</div>
		
		</p:panel>
			
		<p:panel  header="#{lbl['lbl.cm.search.result']}" toggleable="true">
		<p:dataTable  id="unspscTableID" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"  lazy="true"
				value="#{codificationMaintenanceBackingBean.managedBean.extensionSearchItemDataModel}" var="obj"
				style="width:500px;" rows="10">

				<ac:paginator for="unspscTableID"></ac:paginator>

				<p:column  style="text-align:center;white-space:normal;color:white;width:300px;">
					<f:facet name="header">
					#{lbl['lbl.cm.type']}
				</f:facet>
				#{obj.typeName} 
				</p:column>
				<p:column  style="text-align:center;white-space:normal;color:white;width:100px;">
					<f:facet name="header">
					#{lbl['lbl.cm.code']}
				</f:facet>
				#{obj.typeCode} 
			</p:column>
				<p:column headerText="#{lbl['lbl.cm.status.name']}" style="text-align:center;white-space:normal;width:100px;" >
					<p:selectOneMenu id="status" style="width:125px">
					<f:selectItems value="#{obj.recordStatus}"/>
                    <f:selectItem itemLabel="#{lbl['lbl.cm.active']}"  itemValue="1" />
                    <f:selectItem itemLabel="#{lbl['lbl.cm.inactive']}" itemValue="0" />               
                    </p:selectOneMenu>
				</p:column>					
			</p:dataTable>
		</p:panel>
		</h:panelGroup>
  </ui:define>
	
 </ui:composition>
