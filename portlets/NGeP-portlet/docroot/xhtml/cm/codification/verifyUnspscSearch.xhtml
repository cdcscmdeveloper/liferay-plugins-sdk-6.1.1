<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<h:panelGroup id="cmUNSPSCsearchID">

			<p:panel header="SEARCH" toggleable="true">
				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
						<td colspan="1"><p:inputText
								value="#{codificationBackingBean.codeFilterBean.searchValue}"
								size="40" /></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{codificationBackingBean.titleFilterBean.searchValue}"
								size="40" /></td>
					</tr>
				</table>
			</p:panel>


			<div style="text-align: right;">
				<p:commandButton icon="ui-icon-search" value="Search"
					action="#{codificationBackingBean.unspscSearch}"
					update="cmUNSPSCsearchID" />
				<p:commandButton value="Cancel" icon="ui-icon-cancel"
					action="#{codificationBackingBean.backToReviewUnspsc}" />

			</div>


			<p:remoteCommand name="extensionSearch"
				action="#{codificationBackingBean.goToExtensionSearch}" />


			<p:panel header="SEARCH RESULTS" toggleable="true">

				<p:dataTable id="unspscTableID"
					value="#{codificationBackingBean.searchDataModel}" var="unspscObj"
					rowKey="#{unspscObj.unspscId}" rowIndexVar="rowIndex"
					selection="#{codificationBackingBean.managedBean.selectedUNSPSCObj}"
					width="100%" selectionMode="single">



					<ac:paginator for="unspscTableID"></ac:paginator>


					<p:column>
						<f:facet name="header">
					#{lbl['lbl.cm.unspsc.code']}
				</f:facet>

						<p:commandLink
							action="#{codificationBackingBean.goToRecommend(unspscObj)}"
							rendered="#{unspscObj.unspscLevel eq 3}">
							#{unspscObj.unspscCode}
							</p:commandLink>

						<p:commandLink
							action="#{codificationBackingBean.unspscPopUpSearch(unspscObj)}"
							onclick="unspscPopUp.show()" update=":form:codificationPopUpId"
							rendered="#{unspscObj.unspscLevel ne 3}">
							#{unspscObj.unspscCode}
							</p:commandLink>


					</p:column>
					<p:column>
						<f:facet name="header">
					#{lbl['lbl.cm.unspsc.title']}
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>

				</p:dataTable>

			</p:panel>

			<p:dialog id="unspscPopUp" widgetVar="unspscPopUp" modal="true"
				header="Codification Search" width="800" height="500">

				<ui:include src="recommendSearchPopUp.xhtml"></ui:include>

			</p:dialog>

		</h:panelGroup>

	</ui:define>

</ui:composition>
