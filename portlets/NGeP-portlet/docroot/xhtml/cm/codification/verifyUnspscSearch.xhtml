<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="searchToRecommendMsgId" showDetail="true"
			autoUpdate="true" closable="true" showSummary="false" />

		<h:panelGroup id="cmUNSPSCsearchID">

			<ui:include src="DocumentHeader.xhtml" />

			<p:panel header="#{lbl['lbl.cm.request.info']}" toggleable="true">

				<table style="width: 100%; margin-bottom: 4px;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.table.type']}"></p:outputLabel></td>
						<td><p:selectOneMenu disabled="true"
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemType}"
								style="width:228px;">
								<f:selectItem itemValue="P" itemLabel="#{lbl['lbl.txt.product']}" />
								<f:selectItem itemValue="S" itemLabel="#{lbl['lbl.txt.service']}" />
							</p:selectOneMenu></td>
						<td></td>
						<td></td>
					</tr>


					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemName}"
								disabled="true" size="40"></p:inputText></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.details']}"></p:outputLabel></td>
						<td><p:inputText
								value="#{unspscCodeBackingBean.managedBean.requestCode.itemDetail}"
								disabled="true" size="40"></p:inputText></td>
					</tr>
					<h:panelGroup id="extensionFiledsId"
						rendered="#{unspscCodeBackingBean.managedBean.requestCode.itemType != 'S'}">

						<tr>
							<td><p:outputLabel value="#{lbl['lbl.cm.type']}"></p:outputLabel></td>
							<td><p:inputText
									value="#{unspscCodeBackingBean.managedBean.requestCode.typeName}"
									disabled="true" size="40"></p:inputText></td>
							<td><p:outputLabel value="#{lbl['lbl.cm.brand']}"></p:outputLabel></td>
							<td><p:inputText
									value="#{unspscCodeBackingBean.managedBean.requestCode.brandName}"
									disabled="true" size="40"></p:inputText></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.cm.measurement']}"></p:outputLabel></td>
							<td><p:inputText
									value="#{unspscCodeBackingBean.managedBean.requestCode.measurementName}"
									disabled="true" size="40"></p:inputText></td>
							<td><p:outputLabel value="#{lbl['lbl.cm.color']}"></p:outputLabel></td>
							<td><p:inputText
									value="#{unspscCodeBackingBean.managedBean.requestCode.colorName}"
									disabled="true" size="40"></p:inputText></td>
						</tr>
					</h:panelGroup>
				</table>

			</p:panel>

			<p:panel header="#{lbl['lbl.cm.define.search']}" toggleable="true">
				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
						<td colspan="1"><p:autoComplete size="40"
								title="#{lbl['lbl.cm.eight.digits']}"
								value="#{codificationBackingBean.managedBean.autoCompleteUnspscCode.unspscCode}"
								completeMethod="#{codificationBackingBean.autoCompleteUnspsc}"
								maxResults="15" dropdown="false" forceSelection="true" /></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
						<td><p:inputText title="#{lbl['lbl.cm.title.english']}"
								value="#{codificationBackingBean.titleFilterBean.searchValue}"
								size="40" /></td>
					</tr>
				</table>
			</p:panel>


			<div style="text-align: right;">
				<p:commandButton icon="ui-icon-search" value="#{lbl['lbl.btn.search']}"
					action="#{codificationBackingBean.unspscSearch}"
					update="cmUNSPSCsearchID">
					<f:param name="itemType"
						value="#{unspscCodeBackingBean.managedBean.requestCode.itemType}" />
				</p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.back']}" icon="ui-icon-back"
					action="#{codificationBackingBean.backToReviewUnspsc}">
					<f:param name="currentTaskName"
						value="#{unspscCodeBackingBean.managedBean.taskName}" />
				</p:commandButton>

			</div>


			<p:remoteCommand name="extensionSearch"
				action="#{codificationBackingBean.goToExtensionSearch}" />


			<p:panel header="#{lbl['lbl.cm.search.result']}" toggleable="true">

				<p:dataTable id="unspscTableID" lazy="true"
				value="#{codificationBackingBean.searchDataModel}" var="unspscObj"
				width="100%" rows="10">



					<ac:paginator for="unspscTableID"></ac:paginator>


					<p:column>
						<f:facet name="header">
					#{lbl['lbl.cm.unspsc.code']}
			        	</f:facet>
						<p:commandLink
							action="#{codificationBackingBean.returnToRecommendService(unspscObj)}"
							rendered="#{!(codificationBackingBean.productCode(unspscObj.unspscCode)) and (unspscObj.unspscLevel eq 3)}">
						
							#{unspscObj.unspscCode}
							<f:param name="currentTaskName"
								value="#{unspscCodeBackingBean.managedBean.taskName}" />
						</p:commandLink>

						<p:commandLink
							action="#{codificationBackingBean.verifyExtensionSearch(unspscObj)}"
							rendered="#{codificationBackingBean.productCode(unspscObj.unspscCode) and (unspscObj.unspscLevel eq 3)}">
						
							#{unspscObj.unspscCode}
							<f:param name="currentTaskName"
								value="#{unspscCodeBackingBean.managedBean.taskName}" />
						</p:commandLink>

						<p:commandLink
							action="#{codificationBackingBean.unspscPopUpSearch(unspscObj)}"
							onclick="unspscPopUp.show()" update=":form:codificationPopUpId"
							rendered="#{unspscObj.unspscLevel ne 3}">
							#{unspscObj.unspscCode}
							</p:commandLink>


					</p:column>
					<p:column>
						<f:facet name="header">
					#{lbl['lbl.cm.unspsc.title']}
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>

				</p:dataTable>

			</p:panel>

			<p:dialog id="unspscPopUp" widgetVar="unspscPopUp" modal="true"
				header="#{lbl['lbl.cm.codification.search']}" width="800" height="500">

				<ui:include src="recommendSearchPopUp.xhtml"></ui:include>

			</p:dialog>

		</h:panelGroup>

	</ui:define>

</ui:composition>
