<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">



		<h:panelGroup id="cmExtensionCodeCreationID">
			<p:outputLabel styleClass="screen-title"
				value="#{lbl['lbl.cm.create.extension.code']}"></p:outputLabel>

			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.cm.save']}"
					action="#{unspscCodeBackingBean.saveExtCode}"></p:commandButton>
			</div>

			<h:panelGrid columns="2" columnClasses="cmPadding">
				<p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel>
				<p:inputText
					value="#{unspscCodeBackingBean.managedBean.requestCode.tempCode}"></p:inputText>



				<p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel>
				<p:inputText></p:inputText>


				<p:outputLabel value="#{lbl['lbl.cm.type.name']}"></p:outputLabel>
				<p:inputText
					value="#{unspscCodeBackingBean.managedBean.cmType.typeName}"></p:inputText>

				<p:outputLabel value="#{lbl['lbl.cm.brand.name']}"></p:outputLabel>
				<p:inputText
					value="#{unspscCodeBackingBean.managedBean.cmBrand.brandName}"></p:inputText>

				<p:outputLabel value="#{lbl['lbl.cm.measurement.name']}"></p:outputLabel>
				<p:inputText
					value="#{unspscCodeBackingBean.managedBean.cmMeasurement.measurementName}"></p:inputText>

				<p:outputLabel value="#{lbl['lbl.cm.color.name']}"></p:outputLabel>
				<p:inputText
					value="#{unspscCodeBackingBean.managedBean.cmColor.colorName}"></p:inputText>



			</h:panelGrid>


		</h:panelGroup>



	</ui:define>


</ui:composition>
