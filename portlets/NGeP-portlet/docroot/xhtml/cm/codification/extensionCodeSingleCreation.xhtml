<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">



		<h:panelGroup id="cmExtensionCodeCreationID">
			<p:outputLabel styleClass="screen-title"
				value="#{lbl['lbl.cm.create.extension.code']}"></p:outputLabel>

			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.cm.save']}"
					action="#{unspscCodeBackingBean.saveExtCode}"></p:commandButton>
			</div>



			<table style="width: 100%;">

				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
					<td><p:inputText value="#{unspscCodeBackingBean.managedBean.requestCode.tempCode}" disabled="true" size="40" ></p:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
					<td><p:inputText value="#{unspscCodeBackingBean.managedBean.requestCode.tempTitle}" disabled="true" size="40"></p:inputText></td>
				</tr>

				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.type.name']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.cmType.typeName}" size="40"></p:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.brand.name']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.cmBrand.brandName}" size="40"></p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.cm.measurement.name']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.cmMeasurement.measurementName}" size="40"></p:inputText></td>
					<td><p:outputLabel value="* #{lbl['lbl.cm.color.name']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.cmColor.colorName}" size="40"></p:inputText></td>
				</tr>
			</table>


		</h:panelGroup>



	</ui:define>


</ui:composition>
