<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<h:panelGrid columns="2" columnClasses="cmLeft,cmRight" width="100%">


			<ui:include src="itemMenu.xhtml"></ui:include>

			<h:panelGroup id="cmUNSPSCBulkUploadID">
				<h:outputLabel styleClass="titleFront"
					value="#{lbl['lbl.cm.unspsc.code.bulk.upload']}"></h:outputLabel>


				<p:commandButton value="upload" onclick="unspscUploadDialog.show()"></p:commandButton>

			</h:panelGroup>

			<p:dialog id="unspscUploadDialog" widgetVar="unspscUploadDialog"
				modal="false" resizable="false">


				<p:fileUpload
					fileUploadListener="#{unspscCodeBackingBean.uploadUNSPSC}"
					mode="advanced" id="upload" allowTypes="/(\.|\/)(xls|flv|xlsx)$/"
					invalidFileMessage="Only XLS files are accepted">
				</p:fileUpload>

			</p:dialog>


		</h:panelGrid>


	</ui:define>


</ui:composition>
