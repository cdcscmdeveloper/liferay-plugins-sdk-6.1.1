<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
		<p:dialog id="uomRefDlg" header="#{lbl['lbl.fl.instruction.uom.table']}" position="top"
			widgetVar="uomRefDialog" showEffect="fade" hideEffect="fade" modal="true"
			width="600" resizable="false">
			<p:panel id="measurementPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
				<h:panelGrid columns="2" >
				        <h:outputLabel value="#{lbl['lbl.pm.uom.code']}"></h:outputLabel>
			            <p:inputText value="#{uomBackingBean.managedBean.uomCode}" size="30"  
			            	onkeypress="if (event.keyCode == 13) { uomSearch.jq.click(); return false; }"/>					
						<h:outputLabel value="#{lbl['lbl.pm.uom.name']}"></h:outputLabel>
						<p:inputText value="#{uomBackingBean.managedBean.uomName}" size="50" 
							onkeypress="if (event.keyCode == 13) { uomSearch.jq.click(); return false; }"/>
				</h:panelGrid>
				<div align="right">
					<p:commandButton value="#{lbl['lbl.btn.search']}"  
							 action="#{uomBackingBean.retrieveMeasurement}"
						     update="measurementSR" process="measurementPanel" widgetVar="uomSearch"/>
            		<p:commandButton value="#{lbl['lbl.btn.reset']}" 
            				 action="#{uomBackingBean.resetMeasurementSearch}"
            				 process="@this" update="measurementPanel,uomResultPanel" />
	  			</div>
    			<br/>
			 </p:panel>
			<p:panel id="uomResultPanel" header="#{lbl['lbl.fl.result']}" toggleable="true">
				<p:dataTable id="measurementSR" value="#{uomBackingBean.unitOfMeasurementDataModel}"
				rows="10" var="measurementList" rowIndexVar="index" lazy="true">	
			   <ac:paginator for="measurementSR" />				
		       <p:column headerText="#{lbl['lbl.fl.uom.uomcode']}" style="width:15%"> 
					<h:outputText value="#{measurementList.uomCode}" />    
		       </p:column>		       
		       <p:column headerText="#{lbl['lbl.fl.uom.uomname']}" style="width:50%"> 
					<h:outputText value="#{measurementList.uomName}" /> 
		       </p:column>  		       
		        <p:column headerText="#{lbl['lbl.fl.uom.uomdecimal']}" style="width:20%"> 
					<h:outputText value="#{measurementList.decimalScale}" /> 
		       </p:column> 		    	
		     </p:dataTable>	
			</p:panel>			
		</p:dialog>
		
</ui:composition>
