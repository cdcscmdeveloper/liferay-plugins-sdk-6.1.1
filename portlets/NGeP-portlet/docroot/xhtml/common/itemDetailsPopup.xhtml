<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:confirmDialog id="itemDescDialogId"
		header="#{lbl['lbl.sc.item.details']}" widgetVar="itemDescDialogId"
		width="600" resizable="false" closable="true">

		<table>
			<tr>
				<td><h:outputText styleClass="instruction"
						value="#{lbl['lbl.sc.qt.assign.item.code.instruction5']}"
						style="text-align: left;" /></td>
			</tr>
		</table>

		<p:panel id="itemDetailPanel">			
			<p:dataTable id="itemTableId"
				value="#{codificationBackingBean.managedBean.tplSpecQuestion}" rows="10"
				var="question" rowIndexVar="index" lazy="true">
				<ac:paginator for="measurementSR" />
				<p:column headerText="#{lbl['lbl.sc.product.code']}"
					style="width:15%">
					<h:outputText value="#{question.cmItem.extensionCode}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.qt.item.name']}"
					style="width:50%">
					<h:outputText value="#{question.cmItem.itemName}" />
				</p:column>
			</p:dataTable>

			<table style="width: 100%; margin-bottom: 4px; margin-bottom: 6px;">
				<tr>
					<td width="15%"><p:outputLabel style="font-weight: bold;"
							value="#{lbl['lbl.cm.commodity.code']}"></p:outputLabel></td>
					<td width="30%"><h:outputText
							style="white-space: normal!important;"
							value="#{codificationBackingBean.managedBean.commodityCode}" /></td>
					<td width="15%"><p:outputLabel style="font-weight: bold;"
							value="#{lbl['lbl.cm.commodity.title']}"></p:outputLabel></td>
					<td><h:outputText style="white-space: normal!important;"
							value="#{codificationBackingBean.managedBean.commodityTitle}" /></td>
				</tr>
				<tr>
					<td width="15%"><p:outputLabel style="font-weight: bold;"
							value="#{lbl['lbl.sc.qt.extension.code']}"></p:outputLabel></td>
					<td width="30%"><h:outputText
							style="white-space: normal!important;" value="#{codificationBackingBean.managedBean.segmentCode}" /></td>
					<td width="15%"><p:outputLabel style="font-weight: bold;"
							value="#{lbl['lbl.sc.qt.extension.title']}"></p:outputLabel></td>
					<td><h:outputText style="white-space: normal!important;"
							value="#{codificationBackingBean.managedBean.segmentTitle}" /></td>
				</tr>
			</table>

		</p:panel>
	</p:confirmDialog>

</ui:composition>
