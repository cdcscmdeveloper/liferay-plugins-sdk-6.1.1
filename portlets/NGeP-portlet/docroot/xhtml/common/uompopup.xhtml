<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<h:outputText styleClass="instruction"
		value="#{lbl['lbl.pm.uom.instruction.please.click']}" escape="false" />
	<p:commandLink oncomplete="uomRefDialog.show();"
		value="#{lbl['lbl.pm.uom.instruction.please.click.here']}"
		style="font-size:15px;font-style:italic"
		action="#{uomBackingBean.resetMeasurementSearch}" process="@this"
		update="@([id$=uomRefDlg])" />
	<h:outputText styleClass="instruction"
		value="#{lbl['lbl.pm.uom.instruction.view.uom.code.name']}"
		escape="false" />
	<ui:include src="uompopinclude.xhtml"></ui:include>

</ui:composition>
