<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<f:view
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
>
<h:head />
<h:body>
<p>
#{i18n['passwordcipher-hello-world']} in view mode.
</p>

<h:form id="form">
	
	<table>
		<tr>
			<td>Plain text</td>
			<td><p:inputText value="#{passwordCipherBackingBean.userText}"></p:inputText> </td>
			<td><p:commandButton value="Submit" action="#{passwordCipherBackingBean.userText}" update="encryptedText decryptedText"></p:commandButton> </td>
		</tr>
		<tr>
			<td></td>
			<td><p:outputLabel id="encryptedText" value="#{passwordCipherBackingBean.encryptedText}" /> </td>
			<td></td>
		</tr>
		<tr>
			<td></td>
			<td><p:outputLabel id="decryptedText" value="#{passwordCipherBackingBean.decryptedText}" /> </td>
			<td></td>
		</tr>
	</table>

</h:form>
</h:body>
</f:view>
