<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:define name="contentSection">

	<p:panel header="#{lbl['lbl.cipher.panel.encrypt.text']}" toggleable="true">
		
		<h:outputText styleClass="instruction" value="#{lbl['lbl.cipher.instruction']}"/>
		<!-- <h:outputText styleClass="instruction" value="#{lbl['lbl.sm.site.visit.select.address.instruction']}"/> -->
	
		<table style="width: 100%">
			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.cipher.plain.text']}" /></td>
				<td class="tdContent">
					<p:inputText id="userText" 
						value="#{passwordCipherBackingBean.userText}" 
						size="40" /> 
					<p:commandButton 
						value="#{lbl['lbl.btn.submit']}" 
						action="#{passwordCipherBackingBean.decodeUserText}" 
						update="encryptedText decryptedText" />
				</td>
				<td class="tdTitle"/>
				<td class="tdContent"/>
			</tr>
		</table>
	</p:panel>
	<br />
	<p:panel header="#{lbl['lbl.cipher.panel.result']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.cipher.text.entered']}" /></td>
				<td class="tdContent"><h:outputText id="decryptedText" value="#{passwordCipherBackingBean.decryptedText}" /> </td>
				<td class="tdTitle"/>
				<td class="tdContent"/>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.cipher.encrypted.text']}" /></td>
				<td class="tdContent"><h:outputText id="encryptedText" value="#{passwordCipherBackingBean.encryptedText}" /> </td>
				<td class="tdTitle" />
				<td class="tdContent"/>
			</tr>
		</table>

	</p:panel>
</ui:define>
</ui:composition>
