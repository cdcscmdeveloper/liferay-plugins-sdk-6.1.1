<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:define name="contentSection">

	<p:panel header="ENCRYPT TEXT" toggleable="true">
		
		<h:outputText styleClass="instruction" value="Enter text to encrypt"/>
		<!-- <h:outputText styleClass="instruction" value="#{lbl['lbl.sm.site.visit.select.address.instruction']}"/> -->
	
		<table style="width: 100%" >
			<tr>
				<td width="10%" class="tdContent">Plain text</td>
				<td class="tdTitle">
					<p:inputText value="#{passwordCipherBackingBean.userText}"></p:inputText> 
					<p:commandButton value="Submit" action="#{passwordCipherBackingBean.decodeUserText}" update="encryptedText decryptedText"></p:commandButton>
				</td>
			</tr>
		</table>
	</p:panel>
	<br />
	<p:panel header="RESULT" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="10%" class="tdContent">Text Entered</td>
				<td class="tdTitle"><p:outputLabel id="encryptedText" value="#{passwordCipherBackingBean.encryptedText}" /> </td>
			</tr>
			<tr>
				<td width="10%" class="tdContent">Encrypted Text</td>
				<td class="tdTitle"><p:outputLabel id="decryptedText" value="#{passwordCipherBackingBean.decryptedText}" /> </td>
			</tr>
		</table>

	</p:panel>
</ui:define>
</ui:composition>
