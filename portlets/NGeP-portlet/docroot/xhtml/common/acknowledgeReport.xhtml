<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" >
	
    <ui:define name="contentSection">
		<p:panel id="acknowledge" header="#{lbl['lbl.acknowledgement.title']}">
			<p:messages id="ackMsg" showDetail="true" autoUpdate="true" severity="info" />
			<h:outputText value="#{lbl['lbl.txt.view']}" />
			<p:spacer width="5px" />
			<p:commandLink ajax="false" value="#{commonBackingBean.managedBean.reportDisplayName}" 
				action="#{commonBackingBean.generateReport()}" />
		</p:panel>
	</ui:define>
		    
</ui:composition>
