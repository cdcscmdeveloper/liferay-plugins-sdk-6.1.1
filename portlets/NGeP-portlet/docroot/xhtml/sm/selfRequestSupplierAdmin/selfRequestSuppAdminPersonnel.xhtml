<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.selfrequest.suppadmin']}" toggleable="true" id="suppAdminPanelId">
		
		<table>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.selfrequest.mof.number']}" />
				</td>
				<td>
					<p:inputText value="#{selfRequestSupplierAdminBackingBean.managedBean.mofNo}"
						size="35" disabled="true"/>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.assocCmpny.companyName']}" />
				</td>
				<td>
					<p:inputText value="#{selfRequestSupplierAdminBackingBean.managedBean.supplier.companyName}"
						size="35" disabled="true" />
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.selfrequest.suppadmin.name']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<p:autoComplete id="suppAdminNameId" scrollHeight="250"
						label="#{lbl['lbl.sm.selfrequest.suppadmin.name']}" 
						value="#{selfRequestSupplierAdminBackingBean.managedBean.selectedAdmin}" 
						completeMethod="#{selfRequestSupplierAdminBackingBean.autoCompletePersonnels}" 
						var="per" itemLabel="#{per.name}" itemValue="#{per}"
						converter="personnelsSessionConverter" dropdown="true" forceSelection="true">
						<p:ajax event="itemSelect" process="@this" update="@this" partialSubmit="true" 
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
                    </p:autoComplete>
                    
                    <ui:remove>
	                    <p:selectOneMenu id="suppAdminNameId"
							label="#{lbl['lbl.sm.selfrequest.suppadmin.name']}"
							value="#{selfRequestSupplierAdminBackingBean.managedBean.selectedPersonnelId}"
							style="width: 207px;margin-bottom: 5px;" required="true">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems value="#{selfRequestSupplierAdminBackingBean.managedBean.personnelItems}" />
							<p:ajax event="change" process="@this" update="@this" partialSubmit="true" />
						</p:selectOneMenu>
					</ui:remove>
					<p:messages for="suppAdminNameId" showDetail="true" closable="true" 
						showSummary="false" escape="false"/>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.shrHldrInfo.idNo']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<p:inputText label="#{lbl['lbl.sm.person.icNum']}" id="icNoId"
						value="#{selfRequestSupplierAdminBackingBean.managedBean.icNo}"
						size="35" maxlength="15"
						validatorMessage="#{lbl['lbl.sm.userprofile.idno']} - #{lbl['lbl.sm.invalidNo']}">
						<p:ajax event="blur" process="suppAdminPanelId" update="@form" partialSubmit="true" 
							listener="#{selfRequestSupplierAdminBackingBean.onBlurIcNo(selfRequestSupplierAdminBackingBean.managedBean.icNo)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
						<f:attribute name="labelName" value="#{lbl['lbl.sm.person.icNum']}" />
					</p:inputText>
					<p:messages for="icNoId" showDetail="true" closable="true" showSummary="false" 
						escape="false"/>
				</td>
			</tr>
		</table>
		
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.prev']}" update="@form"
						immediate="true" action="#{selfRequestSupplierAdminBackingBean.back('1')}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
				</td>
				<td style="white-space: nowrap; float: right;">
					<p:commandButton value="#{lbl['lbl.btn.cancel']}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
						action="#{selfRequestSupplierAdminBackingBean.redirectToMainPage}"
						update="@form" />
					
					<p:commandButton id="btnSubmit" value="#{lbl['lbl.btn.proceed']}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form"
						action="#{selfRequestSupplierAdminBackingBean.navigateToSuppAdminDetails}" />
				</td>
			</tr>
		</table>
	
	</p:panel>

</ui:composition>
