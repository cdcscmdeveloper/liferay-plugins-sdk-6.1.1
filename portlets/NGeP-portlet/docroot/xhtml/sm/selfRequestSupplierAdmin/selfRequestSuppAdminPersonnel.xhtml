<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.selfrequest.suppadmin']}" toggleable="true" id="suppAdminPanelId">
		
		<table>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.selfrequest.mof.number']}" />
				</td>
				<td>
					<p:inputText id="mofNoId" value="#{selfRequestSupplierAdminBackingBean.managedBean.mofNo}"
						size="35" disabled="true"/>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.assocCmpny.companyName']}" />
				</td>
				<td>
					<p:inputText value="#{selfRequestSupplierAdminBackingBean.managedBean.supplier.companyName}"
						id="compNameId" size="35" disabled="true" />
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.selfrequest.suppadmin.name']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<p:selectOneMenu id="suppAdminNameId"
						label="#{lbl['lbl.sm.selfrequest.suppadmin.name']}"
						value="#{selfRequestSupplierAdminBackingBean.managedBean.selectedPersonnelId}"
						style="width: 207px;margin-bottom: 5px;" required="true">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems value="#{smPersonnelBackingBean.managedBean.personnelItems}" />
					</p:selectOneMenu>
					<p:messages for="suppAdminNameId" showDetail="true" closable="true" showSummary="false" escape="false"/>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.person.icNum']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<p:inputText label="#{lbl['lbl.sm.person.icNum']}"
						required="true" id="icNoId"
						value="#{selfRequestSupplierAdminBackingBean.managedBean.icNo}"
						size="35" maxlength="12"
						validatorMessage="#{lbl['lbl.sm.userprofile.idno']} - #{lbl['lbl.sm.invalidNo']}">
						<p:ajax event="blur" process="@this" update="@form" partialSubmit="true" />
						<f:attribute name="labelName" value="#{lbl['lbl.sm.assocCmpny.regNo']}" />
					</p:inputText>
					<p:messages for="icNoId" showDetail="true" closable="true" showSummary="false" escape="false"/>
				</td>
			</tr>
		</table>
		
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.prev']}" update="@form"
						immediate="true" action="#{selfRequestSupplierAdminBackingBean.backFromSuppAdmin}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
				</td>
				<td style="white-space: nowrap; float: right;">
					<p:commandButton value="#{lbl['lbl.btn.cancel']}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
						action="#{selfRequestSupplierAdminBackingBean.redirectToMainPage}"
						update="@form" />
					
					<p:commandButton id="btnSubmit" value="#{lbl['lbl.sm.next']}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form"
						action="#{selfRequestSupplierAdminBackingBean.submit}" />
				</td>
			</tr>
		</table>
	
	</p:panel>

</ui:composition>
