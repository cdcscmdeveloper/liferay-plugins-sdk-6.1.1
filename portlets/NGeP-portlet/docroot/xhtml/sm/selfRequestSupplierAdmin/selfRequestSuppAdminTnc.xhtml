<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_selfRequestSupplierAdmin_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.selfrequest.suppadmin.title']}");
		</script>
		<h:outputScript library="js" name="logout.js" />
	</ui:define>
	
	<ui:define name="contentSection">
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	
	<p:panel header="#{lbl['lbl.sm.term.and.condition.header']}" toggleable="true">
	
		<p:scrollPanel style="height:250px;border:0;" mode="native">
			<b>#{lbl['lbl.sm.selfrequest.header.uppercase.tnc']}</b>
			<br />
			<p><h:outputText escape="false" value="#{lbl['lbl.sm.selfrequest.tnc']}" /></p>
		</p:scrollPanel>
		
		<br />
		<p:panel id="captchaPanel">
			<table>
				<tr>
					<td width="250px">
						<p:inputText value="#{selfRequestSupplierAdminBackingBean.managedBean.captchaAnswer}" 
							validator="#{selfRequestSupplierAdminBackingBean.validateCaptcha}" id="captchaAnswerId"
							size="10" />
						<p:graphicImage id="captchaText" value="#{selfRequestSupplierAdminBackingBean.captchaTextImage}" />
						&#160;
						<p:commandLink update="captchaText" >
							<p:graphicImage value="/css/images/design/ico-refresh.png" />
						</p:commandLink>
					</td>
					<td>
						<p:messages id="messages" showDetail="true" autoUpdate="true"
								closable="true" showSummary="false"/>
					</td>
				</tr>
			</table>
		</p:panel>
		<br />
		
		<p:selectBooleanCheckbox id="chkTcId" value="#{selfRequestSupplierAdminBackingBean.managedBean.agreeTC}" >
			<p:ajax update="btnProceed" partialSubmit="true" process="@this" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
		</p:selectBooleanCheckbox>
		#{lbl['lbl.sm.selfrequest.agreed.tnc']}
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" 
				onclick="clickLogout();" />
			
			<p:commandButton id="btnProceed" value="#{lbl['lbl.sm.next']}" 
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form"
				disabled="#{!selfRequestSupplierAdminBackingBean.managedBean.agreeTC}" 
				action="#{selfRequestSupplierAdminBackingBean.navigateToCompanyValidation}" />
		</div>
		
		<div style="clear: both;"></div>
	     
	</p:panel>
	
	</ui:define>

</ui:composition>
