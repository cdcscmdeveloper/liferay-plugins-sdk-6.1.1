<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.companyinfo']}" toggleable="true" id="compInfoPanelId">
		<table style="width: 100%;">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.selfrequest.mof.number']}" /></td>
				<td><p:inputText value="#{selfRequestSupplierAdminBackingBean.managedBean.mofNo}"
						size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.assocCmpny.companyName']}" /></td>
				<td><p:inputText value="#{selfRequestSupplierAdminBackingBean.managedBean.supplier.companyName}"
						size="35" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.suppadmin.info']}" toggleable="true" id="suppAdminInfoPanelId">
		
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.softcert.disclaimer']}"/>
		
		<table style="width: 100%;">
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.fullname']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<p:inputText id="suppAdminName" maxlength="80"
						label="#{lbl['lbl.sm.fullname']}" required="true" size="35"
						value="#{selfRequestSupplierAdminBackingBean.managedBean.selectedAdmin.name}"  />
					<p:message id="suppAdminNameMsg" for="suppAdminName"
						showSummary="true" showDetail="false" display="icon" />
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.phoneno']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<ac:phone id="suppAdminPhone" label="#{lbl['lbl.sm.mobileNo']}"
						countryCode="#{selfRequestSupplierAdminBackingBean.managedBean.selectedAdmin.mobileCountry}" 
						areaCode="#{selfRequestSupplierAdminBackingBean.managedBean.selectedAdmin.mobileArea}" 
						number="#{selfRequestSupplierAdminBackingBean.managedBean.selectedAdmin.mobileNo}" 
						isMobile="true" required="true" validatorMessage="#{lbl['lbl.sm.mobileNo']} - #{lbl['lbl.sm.invalidNo']}"
						telcoId="#{selfRequestSupplierAdminBackingBean.managedBean.selectedAdmin.mobileTelcoId}" />
				</td>
			</tr>
		</table>
		
		<br />
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.prev']}" update="@form"
						immediate="true" action="#{selfRequestSupplierAdminBackingBean.back('2')}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
				</td>
				<td style="white-space: nowrap; float: right;">
					<p:commandButton value="#{lbl['lbl.btn.cancel']}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
						action="#{selfRequestSupplierAdminBackingBean.redirectToMainPage}"
						update="@form" />
					
					<p:commandButton id="btnSubmitSuppAdminDetails" value="#{lbl['lbl.btn.proceed']}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form"
						action="#{selfRequestSupplierAdminBackingBean.navigateToSuppAdminDetails}" />
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
