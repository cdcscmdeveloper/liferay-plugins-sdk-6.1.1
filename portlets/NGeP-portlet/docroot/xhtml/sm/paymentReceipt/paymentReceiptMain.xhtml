<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>		
		<p:panel id="searchContent">
			<table style="customTbl">
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.payment.receipt.date.from']}" />	
					</td>
					
					<td class="tdContent">
						<p:calendar id="dateFromCalId" navigator="true" value="#{paymentReceiptBB.managedBean.dateFrom}"
							label="#{lbl['lbl.sm.payment.receipt.date.from']}" 
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							maxdate="#{CommonConstants.CURRENT_DATE}" display="inline"
							size="30" showOn="button" />
					</td>
					
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.payment.receipt.date.to']}" />	
					</td>
					
					<td class="tdContent">
						<p:calendar id="dateToCalId" navigator="true" value="#{paymentReceiptBB.managedBean.dateTo}"
							label="#{lbl['lbl.sm.payment.receipt.date.to']}" 
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							maxdate="#{CommonConstants.CURRENT_DATE}" display="inline"
							size="30" showOn="button" />
					</td>
				</tr>
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="Payment Type" />	
					</td>
					
					<td class="tdContent" colspan="3">
						<table>
							<tr>
								<td>
								<p:selectBooleanCheckbox value="#{paymentReceiptBB.managedBean.allType}">
									<p:ajax event="change" update="pymtSelectionTypes" />
								</p:selectBooleanCheckbox>
								<h:outputText value="#{lbl['lbl.sm.payment.receipt.payment.type.all']}"></h:outputText>
								&#160;
								</td>
								
								<td>
								<p:selectManyCheckbox id="pymtSelectionTypes" value="#{paymentReceiptBB.managedBean.selectedTypes}"
								 disabled="#{paymentReceiptBB.managedBean.allType}">
							        <f:selectItem itemLabel="#{lbl['lbl.sm.payment.receipt.payment.type.reg']}" itemValue="#{SupplierMgmtConst.billTypeRegFee}"  />
							        <f:selectItem itemLabel="#{lbl['lbl.sm.payment.receipt.payment.type.proc']}" itemValue="#{SupplierMgmtConst.billTypeProcessFee}" />
							        <f:selectItem itemLabel="#{lbl['lbl.sm.payment.receipt.payment.type.softcert']}" itemValue="#{SupplierMgmtConst.billTypeSoftcert}" />
							    </p:selectManyCheckbox>
							    </td>
						    </tr>
					    </table>
					</td>
				</tr>
			</table>
			
			<div align="right">
				<p:commandButton id="schBtn" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							action="#{paymentReceiptBB.searchAction}" value="#{lbl['lbl.btn.search']}"
							update="rsDt" />
				<p:commandButton id="resetBtn" 
							action="#{paymentReceiptBB.resetSearchCriteria}" value="#{lbl['lbl.btn.reset']}"
							update="searchContent" />
			</div>
		</p:panel>
	
		<p:panel>
			<p:dataTable var="payment" value="#{paymentReceiptBB.managedBean.searchDataModel}" 
			lazy="true" rows="10" id="rsDt"  emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<ac:paginator for="rsDt"></ac:paginator>
				<p:column style="width : 5%;">
					<p:outputLabel value="#{index + 1}"
						style="float: left;white-space: normal;" />
				</p:column>
			
				<p:column headerText="#{lbl['lbl.sm.payment.receipt.date.time']}">		
					<ac:labelDateTime value="#{payment.createdDate}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.payment.receipt.payment.desc']}">
					<h:outputText value="#{lbl['lbl.sm.payment.receipt.payment.type.reg']}" 
					rendered="#{payment.pyBill.billType eq SupplierMgmtConst.billTypeRegFee}" />
					<h:outputText value="#{lbl['lbl.sm.payment.receipt.payment.type.proc']}" 
					rendered="#{payment.pyBill.billType eq SupplierMgmtConst.billTypeProcessFee}" />
					<h:outputText value="#{lbl['lbl.sm.payment.receipt.payment.type.softcert']}" 
					rendered="#{payment.pyBill.billType eq SupplierMgmtConst.billTypeSoftcert}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.payment.receipt.receipt.no']}">
					#{payment.receiptNo}
				</p:column>
				
<!-- 				<p:column headerText="Payment Method"> -->
<!-- 				</p:column> -->
				
				<p:column headerText="#{lbl['lbl.sm.payment.receipt.appl.no']}">
					#{payment.pyBill.billNo}			
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.payment.receipt.amount']}">
					#{payment.paymentAmt}			
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.payment.receipt.ref.no']}">
					<ui:param name="paymentResp" value="#{paymentReceiptBB.getLatestPaymentResponse(payment.paymentId)}" />
					<h:outputText value="#{paymentResp.transactionId}" rendered="#{not empty paymentResp}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.payment.receipt.reprint.rec']}">
					<p:commandButton value="#{lbl['lbl.btn.download']}" ajax="false">
						<p:fileDownload value="#{paymentReceiptBB.printReceipt(payment.paymentId)}" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
		</p:panel>
	</ui:define>

</ui:composition>
