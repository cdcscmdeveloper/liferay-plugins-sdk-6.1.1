<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_supplierDataMaintenance_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.enquiry.sdo.expired']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false"/>
		
		<p:panel header="#{lbl['lbl.sm.enquiry.sdo.expired.appl.list']}" toggleable="true" id="searchSupplierProfilePanelId" >
			
		<p:dataTable var="smAppl" widgetVar="smApplWidgetVar"
			editable="false" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{supportingDocInquiryBackingBean.managedBean.expiredSdoVerifySuppDocApplList}"
			rowKey="#{smAppl}" rowIndexVar="index" id="supplierApplHistoryDtId">
			<ac:paginator for="supplierApplHistoryDtId" />
			
			<p:column headerText="#{lbl['lbl.sm.companyname']}" style="width :25%;white-space : normal" >
				<h:outputText value="#{smAppl[0]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.application.no']}">
				<h:outputText value="#{smAppl[1]}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.applicationtype']}" style="width :25%;white-space : normal">
				<h:outputText value="#{lbl['lbl.sm.appltype.newmof']}" rendered="#{smAppl[2] eq 'N'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.bumiputera']}" rendered="#{smAppl[2] eq 'B'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.categorycode']}" rendered="#{smAppl[2] eq 'A'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.updateprofile']}" rendered="#{smAppl[2] eq 'U'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.cancelmof']}" rendered="#{smAppl[2] eq 'C'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.renewmof']}" rendered="#{smAppl[2] eq 'R'}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.rpt.supplierType']}">
				<h:outputText value="#{lbl['lbl.sm.contractor']}" rendered="#{smAppl[3] eq 'K'}"/>
				<h:outputText value="#{lbl['lbl.sm.consultant']}" rendered="#{smAppl[3] eq 'J'}"/>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.label.action']}">
				<p:commandLink onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{supportingDocInquiryBackingBean.navigateToExpiredInquiryApplication(smAppl[1])}"
					process="@this" partialSubmit="true" update="@form"
					style="padding-right:5px;">
					<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
				</p:commandLink>
			</p:column>
			
		</p:dataTable>
			
		</p:panel>
	</ui:define>
</ui:composition>
