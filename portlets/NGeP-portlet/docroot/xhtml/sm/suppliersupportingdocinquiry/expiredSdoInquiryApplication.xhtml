<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" 
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_supplierDataMaintenance_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.enquiry.sdo.expired']}");
		</script>
	</ui:define>


	<ui:define name="contentSection">
		<ui:param name="backingBean" value="#{supportingDocInquiryBackingBean}" />
		<ui:param name="viewSmApplBackingBean" value="#{supportingDocInquiryBackingBean}" />
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.back']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
						action="#{backingBean.backToExpiredSdoInquiryListPage}" update="@form"/>
				</td>
				<td style="white-space: nowrap; float: right;">
				    <p:commandButton value="#{lbl['lbl.btn.submit']}" 
				    	style="float:right;" id="submitBtnId" update="@form"
				    	disabled="#{backingBean.managedBean.allowedToSubmit}" oncomplete="confirmDialog.show()"/>
				</td>
			</tr>
		</table>

		<ui:include src="/xhtml/sm/shared/applViewOnlyPages/companyBasicInfoFormViewOnly.xhtml" />
		<p:outputPanel rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq SupplierManagementConst.SUPPORTING_DOC_OFFLINE}">
			<ui:include src="/xhtml/sm/shared/applViewOnlyPages/offlineSupportingDocsFormViewOnly.xhtml" />
		</p:outputPanel> 
		<p:outputPanel id="onSupGroup" rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq SupplierManagementConst.SUPPORTING_DOC_ONLINE}">
			<ui:include src="/xhtml/sm/shared/applViewOnlyPages/onlineSupportingDocsFormViewOnly.xhtml" />
		</p:outputPanel>
		
		<p:dialog id="confirmDialog" header="#{lbl['lbl.sm.userprofile.confirmation']}"
			widgetVar="confirmDialog" modal="true" width="500px" height="100px">
			<table style="width: 100%">
				<tr>
					<td style="white-space: nowrap;"><p:outputLabel value="#{lbl['lbl.sm.exp.sdo.inquiry.resubmitmsg']}" style="float:left"/></td>
				</tr>
			</table>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDialog.hide();" action="#{backingBean.submitResendToSdoInquiry()}"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@this" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDialog.hide();" />
			</div>
		</p:dialog>
		
	</ui:define>
</ui:composition>
