<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<ui:param name="supplierName" value="#{supportingDocInquiryBackingBean.managedBean.smApplInquiry.smAppl.smSupplier.companyName}" />
		<ui:param name="applNo" value="#{supportingDocInquiryBackingBean.managedBean.smApplInquiry.smAppl.applNo}" />
		<ui:param name="applType" value="#{supportingDocInquiryBackingBean.getsupplierApplTypeDesc(supportingDocInquiryBackingBean.managedBean.smApplInquiry.smAppl.applType)}" />
		<ui:include src="/xhtml/sm/shared/common/commonHeader.xhtml" />
		
		<div align="right">
			<p:commandButton value="Submit" onclick="submissionConfirmDlg.show();" />
		</div>

		<p:dialog widgetVar="submissionConfirmDlg" modal="true" height="100"
			width="500">
   			 Do you want to proceed ?	
   		<div align="right">
				<p:commandButton value="Yes"
					action="#{supportingDocInquiryBackingBean.submitInquiryResponse}"></p:commandButton>
				<p:commandButton value="No" onclick="submissionDlg.hide();"></p:commandButton>
			</div>
		</p:dialog>

		<p:panel header="#{lbl['lbl.sm.supportingdoc.panel.supportingdocinquiry']}">
			<table style="width: 100%;">
				<tr>
					<td style="width:15%;" valign="top"><p:outputLabel value="#{lbl['lbl.sm.supportingdoc.subject']}" /></td>
					<td style="width:85%;"><p:inputText size="50" disabled="true"
							value="#{supportingDocInquiryBackingBean.managedBean.smApplInquiry.inquirySubject}" /></td>
				</tr>

				<tr>
					<td style="width:15%;" valign="top"><p:outputLabel value="#{lbl['lbl.sm.supportingdoc.inquiry']}" /></td>
					<td style="width:85%;"><p:inputTextarea id="inquiryDetailId" rows="20" cols="180"
							disabled="true" autoResize="false"
							value="#{supportingDocInquiryBackingBean.managedBean.smApplInquiry.inquiryText}" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="#{lbl['lbl.sm.supportingdoc.panel.response']}">
			<p:message id="inquiryResIdMsg" for="inquiryResId" display="icon" />
			<table style="width: 100%;">
				<tr>
					<td style="width:15%;" valign="top"><p:outputLabel value="#{lbl['lbl.sm.supportingdoc.panel.response']}" /></td>
					<td style="width:85%;"><p:inputTextarea id="inquiryResId" rows="10" cols="100"
							required="true"
							value="#{supportingDocInquiryBackingBean.managedBean.smApplInquiry.responseText}"
							autoResize="false" /></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
