<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_basicAccountActivation_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.reactivate.basicacc.activation']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	
	<table>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sm.reactivate.basicacc.activationkey']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:inputText id="activationKeyId"
					label="#{lbl['lbl.sm.reactivate.basicacc.activationkey']}"
					value="#{reactivateBasicBackingBean.activationKey}"
					size="35" maxlength="40" required="true"  />
				<p:message id="activationKeyIdMsg" for="activationKeyId"
					showSummary="true" showDetail="false" display="icon" />
			</td>
		</tr>
		<tr>
			<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.reactivate.basicacc.loginid']}" /></td>
			<td><p:outputLabel styleClass="outputLabel-view" value="#{reactivateBasicBackingBean.loginId}" /></td>
		</tr>
		
		<tr>
			<td>
				<p:outputLabel
					value="#{lbl['lbl.sm.reactivate.basicacc.pwd']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:password id="pwd1" value="#{reactivateBasicBackingBean.password}" maxlength="20" 
				feedback="false" match="pwd2" label="#{lbl['lbl.sm.reactivate.basicacc.pwd']}" required="true">
					<f:validateLength minimum="8" maximum="20"></f:validateLength>
				</p:password>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sm.reactivate.basicacc.confirmpwd']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:password id="pwd2" value="#{reactivateBasicBackingBean.confirmPassword}" maxlength="20" 
				feedback="false" label="#{lbl['lbl.sm.reactivate.basicacc.confirmpwd']}" required="true"/>
			</td>
		</tr>
		<tr>
			<td>
				<p:commandButton value="#{lbl['lbl.btn.submit']}"  update=":form"
					action="#{reactivateBasicBackingBean.activateAccount}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
			</td>
		</tr>

	</table>

	</ui:define>


</ui:composition>
