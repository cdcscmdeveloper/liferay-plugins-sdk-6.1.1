<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_reactivateBasicAccount_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.basic.account.reactivate']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	
	<ac:httpsRedirectScript />
	
	<table>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.businessregno']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
			<td>
				<p:inputText id="businessRegNo"
					label="#{lbl['lbl.sm.businessregno']}"
					value="#{reactivateBasicBackingBean.reactivateBasic.regNo}"
					size="35" maxlength="20" required="true"  />
				<p:message id="businessRegNoMsg" for="businessRegNo"
					showSummary="true" showDetail="false" display="icon" />
			</td>
		</tr>
		
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.sm.estdate']}" />
				<p:outputLabel value="*" styleClass="mandatory" /></td>
			<td><p:calendar showOn="button" navigator="true"
					display="inline" required="true" readonlyInput="true"
					label="#{lbl['lbl.sm.estdate']}" id="estDate"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					yearRange="-99:+0" 
					value="#{reactivateBasicBackingBean.reactivateBasic.establishDate}" />
				<p:message id="estDateMsg" for="estDate"
						showSummary="true" showDetail="false" display="icon" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.person.composition.suppAdmin.idno']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
			<td>
				<p:inputText
					label="#{lbl['lbl.sm.person.composition.suppAdmin.idno']}"
					required="true" id="idNo"
					value="#{reactivateBasicBackingBean.reactivateBasic.identificationNo}"
					size="35" maxlength="15">
				</p:inputText>
				<p:message id="idNoMsg" for="idNo"
						showSummary="true" showDetail="false" display="icon" />
			</td>
		</tr>
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.sm.person.composition.suppAdmin.email']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:inputText id="email"
					label="#{lbl['lbl.sm.person.composition.suppAdmin.email']}"
					value="#{reactivateBasicBackingBean.reactivateBasic.email}"
					size="40" required="true" >
					<f:validateRegex
				pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
					</p:inputText>
				<p:message id="emailMsg" for="email"
					showSummary="true" showDetail="false" display="icon" /></td>
		</tr>
	</table>
	
	<div align="right">
		<!-- #34400 - start -->
		<p:commandButton value="#{lbl['lbl.btn.submit']}" process="@form" 
			oncomplete="if (!args.validationFailed) confirmDlg.show();" />
	</div>
	<ac:confirmationPopupSM id="confirmDlg" widget="confirmDlg"
			bean="#{reactivateBasicBackingBean}"
			okAction="reactivateBasic"
			content="#{lbl['lbl.sm.confirm.reactivate']}" 
			update=":form"
			loadingWidget="blockWidget" />
	<!-- #34400 - end -->
	</ui:define>


</ui:composition>
