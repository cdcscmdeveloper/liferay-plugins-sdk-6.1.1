<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" 
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_basicDataMaintenance_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.basic.data.maintenance']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	
	<ui:param name="bb" value="#{basicDataMaintenanceBackingBean}" />
	
	<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.back']}"
						immediate="true" action="#{bb.back}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
				</td>
				<td style="white-space: nowrap; float: right;">
					<p:commandButton value="#{lbl['lbl.btn.submit']}" process="@form" id="submitBtnId"
						disabled="#{bb.managedBean.selectedSupplier.businessType eq bb.managedBean.oldBusinessType}"
						partialSubmit="true" update="@form" oncomplete="confirmDeclareDialog.show()" />
				</td>
			</tr>
		</table>
	
	<p:panel header="#{lbl['lbl.sm.panHdr.comBasic']}" toggleable="true"
		id="basicDataMaintenancePanelId">
		
		<table style="width: 100%;table-layout:fixed">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.ownername']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smSupplierOwners[0].ownerName}" 
					rendered="#{not empty bb.managedBean.selectedSupplier.smSupplierOwners}"/>
				</td>
				<td><p:outputLabel styleClass="outputLabel-view-label" 
					value="#{bb.managedBean.selectedSupplier.smSupplierOwners[0].identificationType.parameterCode eq SupplierManagementConst.NEW_IC?lbl['lbl.sm.individual.newicno']:lbl['lbl.sm.identificationno']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smSupplierOwners[0].identificationNo}" 
					rendered="#{not empty bb.managedBean.selectedSupplier.smSupplierOwners}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.companyname']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.companyName}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.estdate']}" /></td>
				<td><ac:labelDate styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.establishDate}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.rocNo']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.regNo}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.ep.no']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.epNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.companyaddress']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCountry.countryName}"/></td>
			</tr>
			<tr>
				<td></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateName}"/></td>
			</tr>
			<tr>
				<td></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict.districtName}"/></td>
			</tr>
			<tr>
				<td></td>
				<td></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity.cityName}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smAppl.smCompanyBasic.phoneNo}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.faxno']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smAppl.smCompanyBasic.faxNo}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.website']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedSupplier.smAppl.smCompanyBasic.website}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.remark']}" styleClass="outputLabel-view-label"/><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputTextarea autoResize="false"
						id="remarkId" cols="50"
						maxlength="2000" required="true"
						validatorMessage="#{lbl['lbl.sm.basic.data.maintenance.remarks.maxlength.msg']}"
						value="#{bb.managedBean.remarks}">
						<f:validateLength maximum="2000" />
					</p:inputTextarea> <p:message id="remarkIdMsg" for="remarkId"
						showSummary="true" showDetail="false" display="icon" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.businesscomptype']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneMenu id="busTypeId" required="true" value="#{bb.managedBean.selectedSupplier.businessType}">
						<f:selectItems value="#{bb.managedBean.businessTypeItems}"/>
						<p:ajax event="change" update=":#{p:component('submitBtnId')}" process="@this" />
					</p:selectOneMenu>
					<p:graphicImage id="typeofbusiness" value="/css/images/design/tooltips.png" />
					<p:tooltip id="businesscomtype" for="typeofbusiness">
						<p:outputLabel escape="false" rendered="#{bb.managedBean.selectedSupplier.smAppl.applType eq SupplierManagementConst.ACC_BASIC}"
							value="#{lbl['tt.sm.registration.business.basic.company.type']}" />
						<p:outputLabel escape="false" rendered="#{bb.managedBean.selectedSupplier.smAppl.applType eq SupplierManagementConst.ACC_MOF}"
							value="#{lbl['tt.sm.registration.business.mof.company.type']}" />	
					</p:tooltip>&#160;					
					<p:message id="busTypeIdMsg" for="busTypeId" display="icon" />
				</td>
			</tr>
		</table>
		
		<p:confirmDialog id="confirmDeclareDialog" closable="true"
			message="#{lbl['lbl.sm.basic.data.maintenance.submit.confirm.msg']}"
			header="#{lbl['lbl.sm.userprofile.confirmation']}" severity="alert"
			widgetVar="confirmDeclareDialog">
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDeclareDialog.hide();" 
					action="#{bb.submit}" update="@form"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDeclareDialog.hide();" />
			</div>
		</p:confirmDialog>
	</p:panel>
	
	</ui:define>


</ui:composition>
