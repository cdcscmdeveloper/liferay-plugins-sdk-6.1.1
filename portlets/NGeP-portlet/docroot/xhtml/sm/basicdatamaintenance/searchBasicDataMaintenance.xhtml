<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_basicDataMaintenance_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.basic.data.maintenance']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:messages id="messages" showDetail="true" closable="false" showSummary="false" escape="false"/>
		
		<ui:param name="bb" value="#{basicDataMaintenanceBackingBean}" />
		
		<p:panel header="#{lbl['lbl.sm.search.basic.supplier']}" toggleable="true" id="searchBasicSupplierPanelId">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.complaint.search.by']}" /></td>
					<td><p:selectOneRadio id="searchModeId" required="false"
							value="#{bb.managedBean.searchMode}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.ep.no']}" itemValue="E" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.rocNo']}" itemValue="R" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.companyname']}" itemValue="C" />
							<p:ajax update="searchBasicSupplierPanelId" event="change" process="@this" 
								listener="#{bb.onChangeSearchBy}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
						</p:selectOneRadio></td>
				</tr>
				<p:outputPanel rendered="#{bb.managedBean.searchMode eq 'C'}">
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.companyname']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td>
						<p:inputText label="#{lbl['lbl.sm.companyname']}" required="true"
							value="#{bb.managedBean.searchSupplier.companyName}"
							size="40" />
					</td>
				</tr>
				</p:outputPanel>
				<p:outputPanel rendered="#{bb.managedBean.searchMode eq 'R'}">
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.rocNo']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td>
						<p:inputText label="#{lbl['lbl.sm.rocNo']}" required="true"
							value="#{bb.managedBean.searchSupplier.regNo}"
							size="35"/>
					</td>
				</tr>
				</p:outputPanel>
				<p:outputPanel rendered="#{bb.managedBean.searchMode eq 'E'}">
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.ep.no']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td>
						<p:inputText label="#{lbl['lbl.sm.ep.no']}" required="true"
							value="#{bb.managedBean.searchSupplier.epNo}"
							size="35"/>
					</td>
				</tr>
				</p:outputPanel>
				<tr>
					<td colspan="2">
						<div style="text-align: right;">
							<p:commandButton value="#{lbl['lbl.btn.search']}" 
								action="#{bb.search}"
								update="@form" 
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
							</p:commandButton>
							<p:commandButton value="#{lbl['lbl.btn.reset']}" 
								action="#{bb.resetSearch}"
								update="searchBasicSupplierPanelId">
							</p:commandButton>
						</div>
					</td>
				</tr>
			</table>
		</p:panel>
		
		<p:panel header="#{lbl['lbl.sm.results']}" toggleable="true" id="resultBasicSupplierPanelId">	
			<p:dataTable var="smSupplier" widgetVar="smSupplierWidgetVar"
				editable="false" lazy="true" rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{bb.managedBean.smSupplierDataModel}"
				selection="#{bb.managedBean.selectedSupplier}"
				rowKey="#{smSupplier}" rowIndexVar="index" id="basicSupplierDtId">
				<ac:paginator for="basicSupplierDtId" />
				
				<p:column headerText="#{lbl['lbl.sm.ep.no']}">
					<h:outputText value="#{smSupplier.epNo}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.rocNo']}">
					<h:outputText value="#{smSupplier.regNo}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.companyname']}" style="white-space : normal">
					<h:outputText value="#{smSupplier.companyName}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						action="#{bb.viewSupplier(smSupplier)}"
						process="@this" partialSubmit="true" update="@form"
						style="padding-right:5px;">
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
					</p:commandLink>
				</p:column>
				
			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
