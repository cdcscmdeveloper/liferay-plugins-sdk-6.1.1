<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection" />
	
	<ui:define name="contentSection">
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	<table>
		<tr>
			<td colspan="2">
				#{lbl['lbl.sm.activation.msg']}
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.key']}:" />
			</td>
			<td>
				<p:inputText value="#{supplierUserActivationBackingBean.tempPassword}" maxlength="15" required="true" label="#{lbl['lbl.sm.activation.key']}" />
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.loginid']}:" />
			</td>
			<td>
				<p:inputText id="loginId"  required="true" maxlength="40" size="40"
				value="#{supplierUserActivationBackingBean.loginId}" label="#{lbl['lbl.sm.activation.loginid']}"
				validatorMessage="#{lbl['lbl.sm.validation.loginid']}">
					<f:validator validatorId="loginIdValidator" />
				</p:inputText>
				&#160;
				<p:graphicImage id="regNoti" value="/css/images/design/tooltips.png" />
				<p:tooltip id="regNott" for="regNoti">
					<p:outputLabel escape="false" value="#{lbl['tt.sm.supplieractivation.login.id']}"  />
				</p:tooltip>&#160;
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.password']}:" />
			</td>
			<td>
				<p:password id="pwd1" value="#{supplierUserActivationBackingBean.password}" maxlength="20" 
				feedback="false" match="pwd2" label="#{lbl['lbl.sm.activation.password']}" required="true">
					<f:validateLength minimum="8" maximum="20"></f:validateLength>
				</p:password>
				
				<p:graphicImage id="regPassTT" value="/css/images/design/tooltips.png" />
				<p:tooltip id="regPass" for="regPassTT">
					<p:outputLabel escape="false" value="#{lbl['tt.sm.supplieractivation.password']}"  />
				</p:tooltip>&#160;
			</td>
		</tr>
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.password2']}:" />
			</td>
			<td>
				<p:password id="pwd2" value="#{supplierUserActivationBackingBean.confirmPassword}" maxlength="20" 
				feedback="false" label="#{lbl['lbl.sm.activation.password2']}" required="true"/>
			</td>
		</tr>
		<tr>
			<td>
				<p:commandButton 
					value="#{lbl['lbl.btn.submit']}" onclick="submissionDialog.show();"  oncomplete="submissionDialog.hide();"
					action="#{supplierUserActivationBackingBean.activateSupplierUser}" />
			</td>
			<td />
		</tr>

	</table>

			<p:dialog widgetVar="submissionDialog" modal="true" draggable="false"
				closable="false" resizable="false" showHeader="false">
				<p:graphicImage value="/css/images/ajax-loader.gif" />
			</p:dialog>

	</ui:define>


</ui:composition>
