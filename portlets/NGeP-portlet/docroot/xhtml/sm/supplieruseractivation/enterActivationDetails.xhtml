<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection" />
	
	<ui:define name="contentSection">
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	<table>
		<tr>
			<td colspan="2">
				<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.activation.msg']}"></h:outputText>
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.userprofile.name']}" />
			</td>
			<td>
				<h:outputText value="#{supplierUserActivationBackingBean.managedBean.smPersonnel.name}" disabled="true" />
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.userprofile.idno']}" />
			</td>
			<td>
				<h:outputText value="#{supplierUserActivationBackingBean.managedBean.smPersonnel.identificationNo}" disabled="true" />
			</td>
		</tr>

		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.key']}" />
			</td>
			<td>
				<p:inputText value="#{supplierUserActivationBackingBean.tempPassword}" maxlength="15" required="true" label="#{lbl['lbl.sm.activation.key']}" />
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.loginid']}" />
			</td>
			<td>
				<p:inputText id="loginId"  required="true" maxlength="20" size="40"
				value="#{supplierUserActivationBackingBean.loginId}" label="#{lbl['lbl.sm.activation.loginid']}"
				validatorMessage="#{lbl['lbl.sm.validation.loginid']}">
					<f:validator validatorId="loginIdValidator" />
				</p:inputText>
				&#160;
				<p:graphicImage id="regNoti" value="/css/images/design/tooltips.png" />
				<p:tooltip id="regNott" for="regNoti">
					<p:outputLabel escape="false" style="text-align: left" value="#{lbl['tt.sm.supplieractivation.login.id']}"  />
				</p:tooltip>&#160;
				<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.activation.loginid.instruction']}"></h:outputText>
			</td>
		</tr>
		<tr>
			<td>
				<!-- #34400 -->
				<p:commandButton value="#{lbl['lbl.btn.submit']}" oncomplete="if (!args.validationFailed) confirmDlg.show();" />
			</td>
			<td />
		</tr>

	</table>

			<p:dialog widgetVar="submissionDialog" modal="true" draggable="false"
				closable="false" resizable="false" showHeader="false">
				<p:graphicImage value="/css/images/ajax-loader.gif" />
			</p:dialog>
	<!-- #34400 -->
	<ac:confirmationPopup id="confirmDlg" widget="confirmDlg"
		okAction="supplierUserActivationBackingBean.activateSupplierUser"
		okProcess="@form"
		width="400" height="100"
		title="#{lbl['lbl.btn.dialog.cofirm.header']}"
		content="#{lbl['lbl.sm.confirm.user.activate']}" 
		update="@form"
		loadingWidget="submissionDialog"/>
	</ui:define>


</ui:composition>
