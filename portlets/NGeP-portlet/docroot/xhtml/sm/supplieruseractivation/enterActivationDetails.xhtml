<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection" />
	
	<ui:define name="contentSection">
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	<table>
		<tr>
			<td colspan="2">
				<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.activation.msg']}"></h:outputText>
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.userprofile.name']}" />
			</td>
			<td>
				<h:outputText value="#{supplierUserActivationBackingBean.managedBean.smPersonnel.name}" disabled="true" />
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.userprofile.idno']}" />
			</td>
			<td>
				<h:outputText value="#{supplierUserActivationBackingBean.managedBean.smPersonnel.identificationNo}" disabled="true" />
			</td>
		</tr>

		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.key']}" />
			</td>
			<td>
				<p:inputText value="#{supplierUserActivationBackingBean.tempPassword}" maxlength="15" required="true" label="#{lbl['lbl.sm.activation.key']}" />
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.loginid']}" />
			</td>
			<td>
				<p:inputText id="loginId"  required="true" maxlength="20" size="40"
				value="#{supplierUserActivationBackingBean.loginId}" label="#{lbl['lbl.sm.activation.loginid']}"
				validatorMessage="#{lbl['lbl.sm.validation.loginid']}">
					<f:validator validatorId="loginIdValidator" />
				</p:inputText>
				&#160;
				<p:graphicImage id="regNoti" value="/css/images/design/tooltips.png" />
				<p:tooltip id="regNott" for="regNoti">
					<p:outputLabel escape="false" style="text-align: left" value="#{lbl['tt.sm.supplieractivation.login.id']}"  />
				</p:tooltip>&#160;
				<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.activation.loginid.instruction']}"></h:outputText>
			</td>
		</tr>
		<tr>
			<td><!-- #34400 -->
				<p:commandButton value="#{lbl['lbl.btn.submit']}" oncomplete="if (!args.validationFailed) confirmDlg.show();" />
			</td>
			<td />
		</tr>

	</table>

			<p:dialog widgetVar="submissionDialog" modal="true" draggable="false"
				closable="false" resizable="false" showHeader="false">
				<p:graphicImage value="/css/images/ajax-loader.gif" />
			</p:dialog>
	<!-- #34400 -->
	<!-- ac:confirmationPopupSM was not used due to null error because JSTL tag (c:when) render before cc.attrs -->
	<style>
			#{cc.attrs.dialogCSS}
			.confirm-ui-dialog{
				max-width: 500px;
				width: auto;
			}
			.confirm-ui-dialog .ui-dialog-content table{
				margin: auto;
			}
			.confirm-ui-dialog .ui-dialog-content table td label {
				white-space: normal;
				padding-left: 5px;
				display: inline !important;
				float: none !important;
			}
			.confirm-ui-dialog .ui-dialog-content{
				padding: 1em 1em !important;
				height: auto !important;
			}
			.confirm-ui-dialog .ui-dialog-content span img{
				margin-top: -4px;
			}
	</style>
	<p:dialog styleClass="confirm-ui-dialog" id="confirmDlg" widgetVar="confirmDlg"
		header="#{lbl['lbl.btn.dialog.cofirm.header']}" resizable="false"
		width="400" height="auto" closable="false" modal="true">
		
		<p:outputPanel id="confirmDlgPopup" layout="block">
		<table width="100%">
			<tr>
				<!-- #34400 Start-->
				<td align="left" style="white-space: normal; word-wrap: break-word !important;">
				<h:outputText value="#{lbl['lbl.sm.confirm.user.activate']}" 
					escape="false" style="padding-left:0px"/></td>
				<!-- #34400 End-->
			</tr>
		</table>
		<p:spacer height="1" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" onstart="confirmDlg.hide();submissionDialog.show();"
				action="#{supplierUserActivationBackingBean.activateSupplierUser()}"
				oncomplete="submissionDialog.hide();" 
				ajax="false"/>
			
			<p:commandButton value="#{lbl['lbl.btn.no']}" oncomplete="confirmDlg.hide();" />
		</div>
		</p:outputPanel>
	</p:dialog>
	</ui:define>

</ui:composition>
