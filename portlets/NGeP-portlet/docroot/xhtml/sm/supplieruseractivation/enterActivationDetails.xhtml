<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	<table>
		<tr>
			<td colspan="2">
				#{lbl['lbl.sm.activation.msg']}
			</td>
		</tr>
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.loginid']}:" />
			</td>
			<td>
				#{supplierUserActivationBackingBean.managedBean.smPersonnel.identificationNo}
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.key']}:" />
			</td>
			<td>
				<p:inputText value="#{supplierUserActivationBackingBean.tempPassword}" required="true" />
			</td>
		</tr>
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.password']}:" />
			</td>
			<td>
				<p:password id="pwd1" value="#{supplierUserActivationBackingBean.password}" feedback="false" match="pwd2" label="Password" required="true"/>
			</td>
		</tr>
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.password2']}:" />
			</td>
			<td>
				<p:password id="pwd2" value="#{supplierUserActivationBackingBean.confirmPassword}" feedback="false" label="Confirm Password" required="true"/>
			</td>
		</tr>
		<tr>
			<td>
				<p:commandButton 
					value="#{lbl['lbl.btn.submit']}" onstart="submissionDialog.show();" oncomplete="submissionDialog.hide();"
					action="#{supplierUserActivationBackingBean.activateSupplierUser}" />
			</td>
			<td />
		</tr>

	</table>

		<p:dialog widgetVar="submissionDialog" modal="true" draggable="false"
			closable="false" resizable="false" showHeader="false">
			<p:graphicImage library="ep/images/" name="ajax-loader.gif" />
		</p:dialog>

	</ui:define>


</ui:composition>
