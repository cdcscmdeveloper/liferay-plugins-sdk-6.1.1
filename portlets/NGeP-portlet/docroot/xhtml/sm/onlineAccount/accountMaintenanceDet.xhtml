<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				action="#{registrationBackingBean.updateOnlineAccount}" />
		</div>
		<ui:include src="/xhtml/sm/shared/onlinereg/accountInfo.xhtml" />
		<p:outputPanel id="outPnlRegForm">
			<c:choose>
				<c:when
					test="${registrationBackingBean.managedBean.smSupp.businessType == SupplierManagementConst.INDIVIDUAL_FLAG}">
					<ui:include src="/xhtml/sm/shared/onlinereg/individualregform.xhtml" />
				</c:when>

				<c:otherwise>
					<ui:include src="/xhtml/sm/shared/onlinereg/corporateregform.xhtml" />
				</c:otherwise>
			</c:choose>
		</p:outputPanel>
	</ui:define>
</ui:composition>
