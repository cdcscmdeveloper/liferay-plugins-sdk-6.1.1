<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" 
			closable="true" showSummary="false" severity="error"/>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}" action="#{registrationBackingBean.updateBasicSupplier}" update="@([id$=Msg])" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
				<f:param name="disableValidation" value="true" />
			</p:commandButton>
		</div>
		
		<p:dialog widgetVar="submissionConfirmDlg" modal="true" height="100" width="500">
   			 #{lbl['lbl.sm.basic.msg.account.confirm.deactivate']}
   			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" action="#{registrationBackingBean.updateOnlineAccount(SupplierManagementConst.BPM_VERIFY)}" 
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="submissionConfirmDlg.hide();" />
			</div>
		</p:dialog>
		
		<ui:include src="/xhtml/sm/shared/onlinereg/accountInfo.xhtml" />
		<p:outputPanel id="outPnlRegForm">
			<c:choose>
				<c:when
					test="${registrationBackingBean.managedBean.smSupp.businessType == SupplierManagementConst.INDIVIDUAL_FLAG}">
					<ui:include src="/xhtml/sm/shared/onlinereg/individualregform.xhtml" />
				</c:when>

				<c:otherwise>
					<ui:include src="/xhtml/sm/shared/onlinereg/corporateregform.xhtml" />
				</c:otherwise>
			</c:choose>
		</p:outputPanel>
		
		<p:dialog id="successDialog" header="#{lbl['lbl.sm.success.dialog.header']}" closable="false"
			widgetVar="successDialog" modal="true" width="400px" height="100px">
			<p:messages id="successDialogMsg" showSummary="false"
				showDetail="true" autoUpdate="true" closable="false" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.proceed']}" action="#{registrationBackingBean.proceedToLogout()}" />
			</div>
		</p:dialog>
	</ui:define>
</ui:composition>
