<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_SiteVisit_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.supplier.businessnature.maintenance']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.save']}"  onclick="submissionConfirmDlg.show();"/>
		</div>
	<p:panel header="#{lbl['lbl.sm.natureofbusiness']}" id="natureBusinessId">
		<p:dataTable var="suppBizNature" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{supplierBusinessNatureBackingBean.managedBean.smSupplier.smSupplierBusinesses}"
			selection="#{supplierBusinessNatureBackingBean.managedBean.selectedBusinessNatureLs}"
			id="suppBizNatureId" rowKey="#{suppBizNature}" rows="10">
			<ac:paginator for="suppBizNatureId" />
			
			<p:column selectionMode="multiple" style="width:2%" 
			rendered="#{not empty supplierBusinessNatureBackingBean.managedBean.smSupplier.smSupplierBusinesses and supplierBusinessNatureBackingBean.managedBean.smSupplier.smSupplierBusinesses.size() gt 1}"
			disabledSelection="#{supplierBusinessNatureBackingBean.managedBean.smSupplier.smSupplierBusinesses.size() le 1}" />
			
			<p:ajax event="rowSelectCheckbox" update=":#{p:component('btnRemove')}" />
			<p:ajax event="rowUnselectCheckbox" update=":#{p:component('btnRemove')}" />
			<p:ajax event="rowSelect" update=":#{p:component('btnRemove')}" />   
            <p:ajax event="rowUnselect" update=":#{p:component('btnRemove')}" />  
            <p:ajax event="toggleSelect" update=":#{p:component('btnRemove')}" />     
	
			<p:column>
				<f:facet name="header">
					<h:outputText value="*" styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sm.businessnature.code']}" />
					&#160;
					<p:graphicImage id="codeti" value="/css/images/design/tooltips.png" />
					<p:tooltip id="codett" for="codeti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.biz.nature.code']}" />
					</p:tooltip>
				</f:facet>
					<h:outputText value="#{supplierBusinessNatureBackingBean.getBusinessNatureSection(suppBizNature)} - #{suppBizNature.pmBusinessNature.levelCode}" />
			</p:column>
			
			<p:column>
				<f:facet name="header">
					<h:outputText value="*" styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sm.natureofbusiness']}" />
					&#160;
					<p:graphicImage id="bnti" value="/css/images/design/tooltips.png" />
					<p:tooltip id="bntt" for="bnti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.biz.nature']}" />
					</p:tooltip>
				</f:facet>
				#{suppBizNature.pmBusinessNature.levelName}
			</p:column>

		</p:dataTable>

		<div align="right">
			<ui:remove>
			<p:commandButton id="btnAdd" value="#{lbl['lbl.btn.add']}" oncomplete="bizDlg.show();" process="@this"
				update="natureBusinessId,bizDialog"
				action="#{registrationBackingBean.addBusinessNature}" />
			</ui:remove>
			#{lbl['lbl.sm.payment.click']}
						<p:commandLink value="#{lbl['lbl.sm.payment.here']}" ajax="false" action="#{supplierBusinessNatureBackingBean.downloadFile('/shared/SM/Piawaian_Klasifikasi_Industri_Malaysia_2008.pdf')}"></p:commandLink>
			#{lbl['lbl.sm.download.natureofbusiness']}
			
		    <ac:lov id="busiNatureId" lovId="PM_BUSINESS_NATURE"
				postUpdateListener="supplierBusinessNatureBackingBean.postUpdateBizNature"
				headerText="Business Nature" buttonLabel="#{lbl['lbl.btn.add']}"
			    selectionMode="multiple"
				saveObject="supplierBusinessNatureBackingBean.managedBean.bizNatures"
				conditionField="recordStatus^1|businessLevel^#{ParameterConst.businessNatureLevel}"
				update=":form:suppBizNatureId" />

			<p:commandButton id="btnRemove" update="natureBusinessId" partialSubmit="true" process="@this,suppBizNatureId"
				value="#{lbl['lbl.btn.delete']}" oncomplete="businessNatureDeletePopUp.show();" 
				disabled="#{empty supplierBusinessNatureBackingBean.managedBean.selectedBusinessNatureLs}" />
		</div>
		
		<ac:lovPopup />
		
		<p:dialog widgetVar="submissionConfirmDlg" modal="true" height="100" width="500">
   			 #{lbl['lbl.sm.supplier.businessnature.confirm.save']}
   			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" action="#{supplierBusinessNatureBackingBean.updateBusinessNature}" oncomplete="submissionConfirmDlg.hide();"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="submissionConfirmDlg.hide();" ></p:commandButton>
			</div>
		</p:dialog>
	</p:panel>
	
	<ac:confirmationPopup id="businessNatureDeletePopUpId"
		widget="businessNatureDeletePopUp"
		okAction="supplierBusinessNatureBackingBean.removeBusinessNature()"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update=":#{p:component('natureBusinessId')}"/>
	</ui:define>
</ui:composition>
