<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 99%; margin-left: 25px;">
		<tr>
			<td><h6 style="color: blue;">
					<h:outputText value="#{lbl['lbl.sm.applnTypeLbl']}" />
				</h6></td>
			<td>
				<h6>
					<h:outputText value="#{lbl['lbl.sm.newMofAppln']}"
						rendered="#{backingBean.managedBean.smAppl.applType eq 'N'}" />
					<h:outputText value="Apply Bumiputera Status"
						rendered="#{backingBean.managedBean.smAppl.applType eq 'B'}" />
					<h:outputText value="Apply Additional Categories"
						rendered="#{backingBean.managedBean.smAppl.applType eq 'A'}" />
					<h:outputText value="Renew MOF Account"
						rendered="#{backingBean.managedBean.smAppl.applType eq 'R'}" />
					<h:outputText value="Update MOF Account Details"
						rendered="#{backingBean.managedBean.smAppl.applType eq 'U'}" />

				</h6>
			</td>
			<td>
				<h6 style="color: blue;">
					<h:outputText value="#{lbl['lbl.sm.application.no']}" />
				</h6>
			</td>
			<td>
				<h6>
					<h:outputText value=" - #{backingBean.managedBean.smAppl.applNo}" />
				</h6>

			</td>
		</tr>
		<tr>

			<td>
				<h6 style="color: blue;">
					<h:outputText value="#{lbl['lbl.sm.current.status']}" />
				</h6>
			</td>
			<td>
				<h6>
					<h:outputText value="-- Status Value --" />
				</h6>

			</td>
			<td>
				<h6 style="color: blue;">
					<h:outputText value="#{lbl['lbl.sm.dateSubmitted']}" />
				</h6>
			</td>
			<td>
				<h6>
					<h:outputText value="-- Date Value -- " />
				</h6>

			</td>
		</tr>
		<c:if test="#{backingBean.managedBean.approverUser}">
			<tr>

				<td>
					<h6 style="color: blue;">
						<h:outputText value="#{lbl['lbl.sm.po.recommend']}" />
					</h6>
				</td>
				<td>
					<h6>
						<h:outputText
							value="#{backingBean.managedBean.poSecReview.recommendation}" />
					</h6>

				</td>

			</tr>
		</c:if>
	</table>
	<br />
	<table style="width: 250px;">
		<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
						value="#{backingBean.managedBean.poSecReview.verifiedAll}">
						<p:ajax update=":form" event="change"
							listener="#{backingBean.changeVerifyAll(backingBean.managedBean.poSecReview.verifiedAll)}" />
					</p:selectBooleanCheckbox></td>
				<td valign="top"><h:outputText
						value=" Application Verified By PO"
						title="For PO to highlight the verified section " /></td>

			</tr>
		</p:outputPanel>
		<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
						value="#{backingBean.managedBean.apprvrSecReview.verifiedAll}">
						<p:ajax update=":form" event="change"
							listener="#{backingBean.changeVerifyAll(backingBean.managedBean.apprvrSecReview.verifiedAll)}" />
					</p:selectBooleanCheckbox></td>
				<td valign="top"><h:outputText
						value=" Application Verified By Approver"
						title="For PO to highlight the verified section " /></td>

			</tr>
		</p:outputPanel>
	</table>
</ui:composition>
