<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
		<tr>
			<td colspan="2"><h4
					style="color: blue; text-decoration: underline; text-align: center;">
					<h:outputText value="#{lbl['lbl.sm.applnTypeLbl']}" />
					<h:outputText value="Apply Bumiputera Status" />
					<h:outputText value=" - #{backingBean.managedBean.smAppl.applNo}" />
				</h4></td>
		</tr>
		<tr>
			<td><h6 style="color: blue;">
					<h:outputText value="#{lbl['lbl.sm.step1Lbl']}" />
					<h:outputText value="#{lbl['lbl.sm.companyStepLbl']}" />
				</h6></td>
			<td><div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}" />
				</div></td>
		</tr>
	</table>
	<ui:include
		src="/xhtml/sm/shared/mofRegistration/companyBasicInfoForm.xhtml" />
	<ui:include src="/xhtml/sm/shared/mofRegistration/staffInfoForm.xhtml" />
	<ui:include
		src="/xhtml/sm/shared/mofRegistration/companyProjectsExperienceInfoForm.xhtml" />
	<table style="width: 100%">
		<tr>
			<td></td>
			<td><div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.sm.next']}"
						actionListener="#{backingBean.setTabValue('0','1')}"
						action="#{backingBean.updateSmAppl}" update=":form:tt" />
				</div></td>
		</tr>
	</table>

</ui:composition>
