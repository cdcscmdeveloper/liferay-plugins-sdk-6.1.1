<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">

	</ui:define>


	<ui:define name="contentSection">
		<p:outputPanel
			rendered="#{backingBean.managedBean.approverUser or backingBean.managedBean.poUser}"
			id="revPanHdr">
			<ui:include
				src="/xhtml/sm/shared/mofRegistration/applicationReviewHeaderPage.xhtml" />
		</p:outputPanel>
		<ac:smPanel id="tt">
			<p:messages id="messages" showDetail="true" autoUpdate="true"
				closable="true" />

			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 0}">
				<ui:include src="step1BumiAppln_CompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 1}">
				<ui:include src="step2BumiAppln_CaptialAndEquityStatusInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 2}">
				<ui:include src="step4BumiAppln_PersonnelInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 3}">
				<ui:include src="step3BumiAppln_BankInfo.xhtml" />
			</c:if>
			<c:if
				test="#{backingBean.managedBean.tabActiveIndex eq 4 and backingBean.managedBean.supplierUser}">
				<ui:include src="step5BumiAppln_SupportingDocumentsInfo.xhtml" />
			</c:if>

			<c:if
				test="#{backingBean.managedBean.tabActiveIndex eq 4 and backingBean.managedBean.poUser}">
				<ui:include
					src="/xhtml/sm/poDecisionPages/poReviewSupportingDocuments.xhtml" />
			</c:if>
			<c:if
				test="#{backingBean.managedBean.tabActiveIndex eq 5 and backingBean.managedBean.poUser}">
				<ui:include
					src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
			</c:if>

			<c:if
				test="#{backingBean.managedBean.tabActiveIndex eq 4 and backingBean.managedBean.approverUser}">
				<ui:include
					src="/xhtml/sm/approverDecisionPages/approverReviewSupportingDocuments.xhtml" />
			</c:if>
			<c:if
				test="#{backingBean.managedBean.tabActiveIndex eq 5 and backingBean.managedBean.approverUser}">
				<ui:include
					src="/xhtml/sm/approverDecisionPages/approverDefault_DescisionPage.xhtml" />
			</c:if>
		</ac:smPanel>

	</ui:define>
</ui:composition>
