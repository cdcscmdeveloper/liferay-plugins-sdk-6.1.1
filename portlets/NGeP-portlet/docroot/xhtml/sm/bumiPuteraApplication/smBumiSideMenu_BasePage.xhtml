<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<h:panelGroup rendered="#{backingBean.managedBean.supplierUser}">
			<script>
				var emptyText = document.createTextNode("");
				$('#breadcrumbs').find('.last').append(emptyText);
				if(emptyText.parentNode != null) {
					emptyText.parentNode.children[0].text = "#{lbl['lbl.sm.apply.bumi.status']}";
				}
				
				$('#portlet_MOFApplication_WAR_NGePportlet').find(
						'.portlet-title-text').html(
						"#{lbl['lbl.sm.apply.bumi.status']} (#{lbl['lbl.sm.mofacc.expiry.date']}: #{backingBean.managedBean.expiryDate})");
			</script>
		</h:panelGroup>

		<h:panelGroup
			rendered="#{(backingBean.managedBean.approverUser or backingBean.managedBean.poUser) and backingBean.managedBean.smAppl.resubmit}">
			<script>
				var emptyText = document.createTextNode("");
				$('#breadcrumbs').find('.last').append(emptyText);
				if(emptyText.parentNode != null) {
					emptyText.parentNode.children[0].text = "#{lbl['lbl.sm.review.resubmitApplication']}";
				}	
			
				$('#portlet_MOFApplication_WAR_NGePportlet').find(
						'.portlet-title-text').html(
						"#{lbl['lbl.sm.review.resubmitApplication']} (#{lbl['lbl.sm.mofacc.expiry.date']}: #{backingBean.managedBean.expiryDate})");
			</script>
		</h:panelGroup>

		<h:panelGroup
			rendered="#{(backingBean.managedBean.approverUser or backingBean.managedBean.poUser) and !backingBean.managedBean.smAppl.resubmit}">
			<script>
				var emptyText = document.createTextNode("");
				$('#breadcrumbs').find('.last').append(emptyText);
				if(emptyText.parentNode != null) {
					emptyText.parentNode.children[0].text = "#{lbl['lbl.sm.review.application']}";
				}	
			
				$('#portlet_MOFApplication_WAR_NGePportlet').find(
						'.portlet-title-text').html(
						"#{lbl['lbl.sm.review.application']} (#{lbl['lbl.sm.mofacc.expiry.date']}: #{backingBean.managedBean.expiryDate})");
			</script>
		</h:panelGroup>
	</ui:define>


	<ui:define name="contentSection">

		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<p:outputPanel
			rendered="#{backingBean.managedBean.approverUser or backingBean.managedBean.poUser}"
			id="revPanHdr">
			<ui:include
				src="/xhtml/sm/shared/mofRegistration/applicationReviewHeaderPage.xhtml" />
		</p:outputPanel>
		<p:outputPanel
			rendered="#{backingBean.managedBean.supplierUser}"
			id="addApplInfoHdr">
			<ui:include src="/xhtml/sm/shared/mofRegistration/applAdditionalInfo.xhtml" />
		</p:outputPanel>
		<ac:smPanel id="tt">
			<p:messages id="messages" showDetail="true" escape="false"
				autoUpdate="#{backingBean.managedBean.showParentMsg}"
				closable="true" showSummary="false" />

			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 0}">
				<ui:include src="step1BumiAppln_CompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 1}">
				<ui:include src="step2BumiAppln_BranchCompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 2}">
				<ui:include src="step4BumiAppln_PersonnelInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 3}">
				<ui:include src="step2BumiAppln_CaptialAndEquityStatusInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 4}">
				<ui:include src="step3BumiAppln_BankInfo.xhtml" />
			</c:if>
			<c:choose>
				<c:when test="#{backingBean.managedBean.supplierUser}">
					<c:if test="#{backingBean.managedBean.tabActiveIndex eq 5}">
						<ui:include src="step5BumiAppln_SupportingDocumentsInfo.xhtml" />
					</c:if>
				</c:when>
				<c:otherwise>
					<c:if test="#{backingBean.managedBean.tabActiveIndex eq 5}">
						<ui:include src="step6BumiAppln_RegisterCategoryCodesInfo.xhtml" />
					</c:if>
					
					<c:choose>
						<c:when test="#{backingBean.managedBean.smAppl.applCategoryType eq 'S'}">
							
							<c:if test="#{backingBean.managedBean.tabActiveIndex eq 6}">
								<ui:include src="step6.1BumiAppln_FactoryInfo.xhtml" />
							</c:if>
							
							<c:choose>
								<c:when test="#{backingBean.managedBean.showMachineryEquipmentPanel or backingBean.managedBean.showTravelSoftwarePanel}">
									<c:if test="#{backingBean.managedBean.tabActiveIndex eq 7}">
										<ui:include src="step6.2BumiAppln_EquipmentInfo.xhtml" />
									</c:if>
									<c:if test="#{backingBean.managedBean.tabActiveIndex eq 8 and backingBean.managedBean.poUser}">
										<ui:include src="/xhtml/sm/poDecisionPages/poReviewSupportingDocuments.xhtml" />
									</c:if>
									<c:if test="#{backingBean.managedBean.tabActiveIndex eq 8 and backingBean.managedBean.approverUser}">
										<ui:include src="/xhtml/sm/approverDecisionPages/approverReviewSupportingDocuments.xhtml" />
									</c:if>
									<c:choose>
										<c:when test="#{backingBean.managedBean.reviewSiteVisit}">
											<c:if test="#{backingBean.managedBean.tabActiveIndex eq 9}">
												<ui:include src="/xhtml/sm/reviewSiteVisitReport/reviewSiteVisitReportDocuments.xhtml" />
											</c:if>
											<c:if test="#{backingBean.managedBean.tabActiveIndex eq 10 and backingBean.managedBean.poUser}">
												<ui:include src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
											</c:if>
											<c:if test="#{backingBean.managedBean.tabActiveIndex eq 10 and backingBean.managedBean.approverUser}">
												<ui:include src="/xhtml/sm/approverDecisionPages/approverDefault_DescisionPage.xhtml" />
											</c:if>
										</c:when>
										<c:otherwise>
											<c:if test="#{backingBean.managedBean.tabActiveIndex eq 9 and backingBean.managedBean.poUser}">
												<ui:include src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
											</c:if>
											<c:if test="#{backingBean.managedBean.tabActiveIndex eq 9 and backingBean.managedBean.approverUser}">
												<ui:include src="/xhtml/sm/approverDecisionPages/approverDefault_DescisionPage.xhtml" />
											</c:if>
										</c:otherwise>
									 </c:choose>
								</c:when>
								<c:otherwise>
									<c:if test="#{backingBean.managedBean.tabActiveIndex eq 7 and backingBean.managedBean.poUser}">
										<ui:include src="/xhtml/sm/poDecisionPages/poReviewSupportingDocuments.xhtml" />
									</c:if>
									<c:if test="#{backingBean.managedBean.tabActiveIndex eq 7 and backingBean.managedBean.approverUser}">
										<ui:include src="/xhtml/sm/approverDecisionPages/approverReviewSupportingDocuments.xhtml" />
									</c:if>
									<c:choose>
										<c:when test="#{backingBean.managedBean.reviewSiteVisit}">
											<c:if test="#{backingBean.managedBean.tabActiveIndex eq 8}">
												<ui:include src="/xhtml/sm/reviewSiteVisitReport/reviewSiteVisitReportDocuments.xhtml" />
											</c:if>
											<c:if test="#{backingBean.managedBean.tabActiveIndex eq 9 and backingBean.managedBean.poUser}">
												<ui:include src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
											</c:if>
											<c:if test="#{backingBean.managedBean.tabActiveIndex eq 9 and backingBean.managedBean.approverUser}">
												<ui:include src="/xhtml/sm/approverDecisionPages/approverDefault_DescisionPage.xhtml" />
											</c:if>
										</c:when>
										<c:otherwise>
											<c:if test="#{backingBean.managedBean.tabActiveIndex eq 8 and backingBean.managedBean.poUser}">
												<ui:include src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
											</c:if>
											<c:if test="#{backingBean.managedBean.tabActiveIndex eq 8 and backingBean.managedBean.approverUser}">
												<ui:include src="/xhtml/sm/approverDecisionPages/approverDefault_DescisionPage.xhtml" />
											</c:if>
										</c:otherwise>
									 </c:choose>
								</c:otherwise>
							</c:choose>
							
						</c:when>
						<c:otherwise>
							<c:if test="#{backingBean.managedBean.tabActiveIndex eq 6 and backingBean.managedBean.poUser}">
								<ui:include src="/xhtml/sm/poDecisionPages/poReviewSupportingDocuments.xhtml" />
							</c:if>
							<c:if test="#{backingBean.managedBean.tabActiveIndex eq 6 and backingBean.managedBean.approverUser}">
								<ui:include src="/xhtml/sm/approverDecisionPages/approverReviewSupportingDocuments.xhtml" />
							</c:if>
							<c:choose>
								<c:when test="#{backingBean.managedBean.reviewSiteVisit}">
									<c:if test="#{backingBean.managedBean.tabActiveIndex eq 7}">
										<ui:include src="/xhtml/sm/reviewSiteVisitReport/reviewSiteVisitReportDocuments.xhtml" />
									</c:if>
									<c:if test="#{backingBean.managedBean.tabActiveIndex eq 8 and backingBean.managedBean.poUser}">
										<ui:include src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
									</c:if>
									<c:if test="#{backingBean.managedBean.tabActiveIndex eq 8 and backingBean.managedBean.approverUser}">
										<ui:include src="/xhtml/sm/approverDecisionPages/approverDefault_DescisionPage.xhtml" />
									</c:if>
								</c:when>
								<c:otherwise>
									<c:if test="#{backingBean.managedBean.tabActiveIndex eq 7 and backingBean.managedBean.poUser}">
										<ui:include src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
									</c:if>
									<c:if test="#{backingBean.managedBean.tabActiveIndex eq 7 and backingBean.managedBean.approverUser}">
										<ui:include src="/xhtml/sm/approverDecisionPages/approverDefault_DescisionPage.xhtml" />
									</c:if>
								</c:otherwise>
							 </c:choose>
						</c:otherwise>
					</c:choose>
				</c:otherwise>
			</c:choose>


			<p:dialog id="attachDlg1" widgetVar="attachDlg1" modal="true"
				dynamic="true" resizable="false" width="700px" height="200"
				styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
				<p:fileUpload allowTypes="/(\.|\/)(pdf|doc|docx)$/"
					sizeLimit="#{SupplierManagementConst.SM_SUPPORTDOCS_FILE_SIZE_LIMIT}"
					invalidFileMessage="#{lbl['lbl.sm.upload.format.errmsg']}"
					invalidSizeMessage="#{lbl['lbl.sm.upload.fileSize.exceed20Mb']}"
					fileUploadListener="#{backingBean.handleSupDocFileAttachment}"
					update=":form:tt:onSdList" oncomplete="attachDlg1.hide();" 
					uploadLabel="#{lbl['lbl.btn.upload']}"  
					label="#{lbl['lbl.btn.choose']}" 
					cancelLabel="#{lbl['lbl.btn.cancel']}" />
			</p:dialog>
		</ac:smPanel>

	</ui:define>
</ui:composition>
