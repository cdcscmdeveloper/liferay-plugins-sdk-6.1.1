<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;"><ui:include
					src="smBumiApplnSideMenuItem.xhtml" /></td>
			<td><p:outputPanel
					rendered="#{backingBean.managedBean.supplierUser}">
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							icon="ui-icon-save" style="margin-bottom:5px;" />
						<p:commandButton value="Submit Application"
							style="margin-bottom:5px;"
							action="#{backingBean.submitBumiApplToBpm}" />
					</div>
				</p:outputPanel> <p:outputPanel id="supDocPan">
					<ui:fragment
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'F'}">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/offlineSupportingDocsForm.xhtml" />
						<div class="nav-wrapper">
							<table>
								<tr>
									<td><p:commandButton value="#{lbl['lbl.sm.prev']}"
											actionListener="#{backingBean.setTabValue('4','3')}"
											action="#{backingBean.updateSmAppl}" update=":form"
											icon="ui-icon-prev" /></td>
								</tr>
							</table>
						</div>
					</ui:fragment>
					<ui:fragment
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'O'}">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/onlineSupportingDocsForm.xhtml" />
						<div class="nav-wrapper">
							<table>
								<tr>
									<td><p:commandButton value="#{lbl['lbl.sm.prev']}"
											actionListener="#{backingBean.setTabValue('4','3')}"
											action="#{backingBean.updateSmAppl}" update=":form"
											icon="ui-icon-prev" /></td>
								</tr>
							</table>
						</div>
					</ui:fragment>

				</p:outputPanel></td>
		</tr>
	</table>
</ui:composition>
