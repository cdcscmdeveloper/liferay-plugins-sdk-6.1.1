
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: top;" class="sidemenutd"><ui:include
					src="smBumiApplnSideMenuItem.xhtml" /></td>
			<td style="vertical-align: top;"><p:outputPanel
					id="renewStep7OnlySuppPan"
					rendered="#{backingBean.managedBean.supplierUser}">
					<div align="right" style="width: 99%" class="button-wrapper">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/deleteApplicationCommonPage.xhtml" />
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							onclick="this.disabled=true;"
							onstart="blockWidget.show()" oncomplete="this.disabled=false;blockWidget.hide();"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType)}"
							update=":form" style="margin-bottom:5px;" />
						
						<ui:include src="/xhtml/sm/shared/mofRegistration/declareButtonWithoutSpki.xhtml" />
						<!-- disable spki for now -->
						<ui:remove>
							<c:choose>
								<c:when test="#{backingBean.managedBean.overLappedCategoryExists}">
									<ui:include src="/xhtml/sm/shared/mofRegistration/declareButtonWithSpki.xhtml" />
								</c:when>
								<c:otherwise>
									<ui:include src="/xhtml/sm/shared/mofRegistration/declareButtonWithoutSpki.xhtml" />
								</c:otherwise>
							</c:choose>
						</ui:remove>
					</div>
				</p:outputPanel> <p:outputPanel id="supDocPan">
					<h:panelGroup
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq SupplierManagementConst.SUPPORTING_DOC_OFFLINE}">

						<ui:include
							src="/xhtml/sm/shared/mofRegistration/offlineSupportingDocsForm.xhtml" />
						<c:choose>
							<c:when
								test="#{backingBean.managedBean.smAppl.applCategoryType eq 'S'}">
								<div class="nav-wrapper">
									<table style="width: 100%">
										<tr>
											<td><div align="left" style="width: 99%">
													<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
														onstart="blockWidget.show()"
														oncomplete="blockWidget.hide()"
														actionListener="#{backingBean.setTabValue('8','7')}"
														action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
														update=":form" />
												</div></td>
										</tr>
									</table>
								</div>
							</c:when>
							<c:otherwise>
								<div class="nav-wrapper">
									<table style="width: 100%">
										<tr>
											<td><div align="left" style="width: 99%">
													<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
														onstart="blockWidget.show()"
														oncomplete="blockWidget.hide()"
														actionListener="#{backingBean.setTabValue('6','5')}"
														action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
														update=":form" />
												</div></td>
										</tr>
									</table>
								</div>
							</c:otherwise>
						</c:choose>
					</h:panelGroup>
					<h:panelGroup id="onSupGroup"
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq SupplierManagementConst.SUPPORTING_DOC_ONLINE}">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/onlineSupportingDocsForm.xhtml" />
						<c:choose>
							<c:when
								test="#{backingBean.managedBean.smAppl.applCategoryType == 'S'}">
								<div class="nav-wrapper">
									<table style="width: 100%">
										<tr>
											<td><div align="left" style="width: 99%">
													<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
														onstart="blockWidget.show()"
														oncomplete="blockWidget.hide()"
														actionListener="#{backingBean.setTabValue('8','7')}"
														action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
														update=":form" />
												</div></td>
										</tr>
									</table>
								</div>
							</c:when>
							<c:otherwise>
								<div class="nav-wrapper">
									<table style="width: 100%">
										<tr>
											<td><div align="left" style="width: 99%">
													<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
														onstart="blockWidget.show()"
														oncomplete="blockWidget.hide()"
														actionListener="#{backingBean.setTabValue('6','5')}"
														action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
														update=":form" />
												</div></td>
										</tr>
									</table>
								</div>
							</c:otherwise>
						</c:choose>
					</h:panelGroup>

				</p:outputPanel></td>
		</tr>
	</table>
</ui:composition>
