<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"/>
		<c:if test="#{backingBean.managedBean.supplierUser}">
			<table style="width: 99%">
				<tr>
					<td
						style="color: red; font-weight: bolder; padding-right: 10px; text-align: right;"><h:outputText
							value="#{lbl['Last Submission Date']} : " /></td>
					<td
						style="color: red; font-weight: bolder; padding-right: 10px; width: 85px;"><h:outputText
							value="#{backingBean.managedBean.smAppl.draftExpiryDate}">
							<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
						</h:outputText></td>
				</tr>
			</table>
		</c:if>


		<p:outputPanel
			rendered="#{backingBean.managedBean.approverUser or backingBean.managedBean.poUser}"
			id="revPanHdr">
			<ui:include
				src="/xhtml/sm/shared/mofRegistration/applicationReviewHeaderPage.xhtml" />
		</p:outputPanel>
		<p:remoteCommand name="updateBlockUI" update="@(.ui-panel)" />
		<p:tabView id="tt" orientation="left" widgetVar="tt"
			activeIndex="#{backingBean.managedBean.tabActiveIndex}"
			onTabShow="updateBlockUI();" dynamic="true">
			<p:tab title="#{lbl['lbl.sm.companyStepLbl']}">
				<ui:include src="step1BumiAppln_CompanyInfo.xhtml" />
			</p:tab>

			<p:tab title="#{lbl['lbl.sm.capitalStepLbl']}">
				<ui:include src="step2BumiAppln_CaptialAndEquityStatusInfo.xhtml" />
			</p:tab>
			<p:tab title="#{lbl['lbl.sm.personStepLbl']}">
				<ui:include src="step4BumiAppln_PersonnelInfo.xhtml" />
			</p:tab>
			<p:tab title="#{lbl['lbl.sm.bankStepLbl']}">
				<ui:include src="step3BumiAppln_BankInfo.xhtml" />
			</p:tab>
			<c:if test="#{backingBean.managedBean.supplierUser}">
				<p:tab title="#{lbl['lbl.sm.supDocStepLbl']}">
					<ui:include src="step5BumiAppln_SupportingDocumentsInfo.xhtml" />
				</p:tab>
			</c:if>
			<c:if test="#{backingBean.managedBean.poUser}">
				<p:tab title="#{lbl['lbl.sm.docsReviewLbl']}">
					<ui:include
						src="/xhtml/sm/poDecisionPages/poReviewSupportingDocuments.xhtml" />
				</p:tab>
				<p:tab title="#{lbl['lbl.sm.poDecisionLbl']}">
					<ui:include
						src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
				</p:tab>
			</c:if>
			<c:if test="#{backingBean.managedBean.approverUser}">
				<p:tab title="#{lbl['lbl.sm.docsReviewLbl']}">
					<ui:include
						src="/xhtml/sm/approverDecisionPages/approverReviewSupportingDocuments.xhtml" />
				</p:tab>
				<p:tab title="#{lbl['lbl.sm.aprvrDecisionLbl']}">
					<ui:include
						src="/xhtml/sm/approverDecisionPages/approverDefault_DescisionPage.xhtml" />
				</p:tab>
			</c:if>
		</p:tabView>
	</ui:define>
</ui:composition>
