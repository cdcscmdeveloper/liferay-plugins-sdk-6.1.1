<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.approver.decision.cancel.header']}"
		toggleable="true" id="cancelDecisionPanel">

		<table style="width: 50%; table-layout: fixed">
			<tr height="10">
				<td colspan="2"></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.dateSubmitted']}" /></td>
				<td><ac:labelDate styleClass="outputLabel-view"
						value="#{backingBean.managedBean.smAppl.applSubmitDate}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.current.status']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.currentStatus}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.reason.supplier']}" /></td>
				<td style="word-wrap: break-word"><p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.supplierRemarks}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.supportingdoc.panel.supportingdoc']}"
						styleClass="outputLabel-view-label" /></td>
				<td><p:commandButton value="#{lbl['lbl.cm.download']}"
						style="float: left;"
						action="#{backingBean.downloadSelectedSuppDoc(backingBean.managedBean.cancellationAttachment.fileName,backingBean.managedBean.cancellationAttachment.filePath)}"
						update=":form" ajax="false">
						<p:fileDownload value="#{backingBean.file}" />
					</p:commandButton> <p:outputLabel
						value="#{backingBean.managedBean.cancellationAttachment.fileName}"
						style="float: left;padding: 12px 0px 0px 10px;font-weight: normal !important;"
						rendered="#{backingBean.managedBean.cancellationAttachment.fileName ne null}" />
				</td>
			</tr>
		</table>

		<br />
		<p:separator />
		<div>
			<p>
				<h:outputText value="#{lbl['lbl.sm.apprvr.splNotes']}"
					escape="false" />
			</p>
		</div>
		<p:separator />

		<div style="width: 100%" align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.approve']}" disabled="#{!backingBean.managedBean.claimTask}"
				onclick="approveAppCanDialog.show();" />
			<p:commandButton value="#{lbl['lbl.sm.button.reject']}" disabled="#{!backingBean.managedBean.claimTask}"
				update="rejectAppCanDialog" partialSubmit="true" process="@this"
				action="#{backingBean.approveOrRejectMofCancellation('rejectAppCanDialog')}" />

		</div>

	</p:panel>
</ui:composition>
