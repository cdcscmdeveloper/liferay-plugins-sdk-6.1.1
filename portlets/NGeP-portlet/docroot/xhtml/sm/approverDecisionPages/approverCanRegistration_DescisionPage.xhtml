<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"/>

		<p:panel header="#{lbl['lbl.sm.approver.decision.cancel.header']}">
			<table>
				<!-- <tr>
				<td colspan="3"><h4
						style="color: blue; text-align: center; font-weight: bold;">
						<p:outputLabel
							value="Decision For - #{backingBean.managedBean.smAppl.applNo}" />
					</h4></td>
			</tr> -->
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.suppname']}" /></td>
					<td><p:outputLabel value="   : " /></td>
					<td><p:inputText readonly="true"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.companyName}"
							disabled="true" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.dateSubmitted']}" /></td>
					<td><p:outputLabel value="   : " /></td>
					<td><p:inputText readonly="true"
							value="#{backingBean.managedBean.smAppl.applSubmitDate}"
							disabled="true">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.current.status']}" /></td>
					<td><p:outputLabel value="   : " /></td>
					<td><p:inputText readonly="true"
							value="#{backingBean.managedBean.currentStatus}" disabled="true" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.reason.supplier']}" /></td>
					<td><p:outputLabel value="   : " /></td>
					<td><p:inputTextarea cols="60" readonly="true"
							value="#{backingBean.managedBean.supplierRemarks}"
							disabled="true" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.supportingdoc.panel.supportingdoc']}" /></td>
					<td><p:outputLabel value="   : " /></td>
					<td><p:commandButton value="#{lbl['lbl.btn.download']}"
							icon="ui-icon-arrowthichk-s" /></td>
				</tr>

			</table>
			<p:separator />
			<div>
				<p>
					You have finished reviewing all the necessary information for MOF
					account registration. Please perform one the below operations to
					provide your decision<br /> 1.Click 'Approve'' to approve the
					application.<br /> 2. Click ' Reject' to reject the application.
				</p>
			</div>
			<p:separator />

			<div style="width: 100%" align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.approve']}"
					onclick="approveAppCanDialog.show();" />
				<p:commandButton value="#{lbl['lbl.sm.button.reject']}" onclick="rejectAppCanDialog.show();" />

			</div>
		</p:panel>


		<p:dialog width="650px" header="#{lbl['lbl.sm.approve.application']}"
			widgetVar="approveAppCanDialog" resizable="false" showEffect="fade"
			hideEffect="fade" modal="true">

			<ui:include
				src="/xhtml/sm/shared/poDecisionSharedPages/approvedRemarksPopUpForm.xhtml" />
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					onclick="approveAppCanDialog.hide();"
					action="#{backingBean.submitPOorApproverReviewToBPM('APPROVE')}" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					onclick="approveAppCanDialog.hide();" />
			</div>
		</p:dialog>
		<p:dialog width="650px" header="#{lbl['lbl.sm.reject.application']}"
			widgetVar="rejectAppCanDialog" resizable="false" showEffect="fade"
			hideEffect="fade" modal="true">

			<ui:include
				src="/xhtml/sm/shared/poDecisionSharedPages/rejectedRemarksPopUpForm.xhtml" />
			<div align="center">
				<p:commandButton value="Submit" onclick="rejectAppCanDialog.hide();"
					action="#{backingBean.submitPOorApproverReviewToBPM('REJECT')}" />
				<p:commandButton value="Cancel" onclick="rejectAppCanDialog.hide();" />
			</div>
		</p:dialog>
	</ui:define>
</ui:composition>
