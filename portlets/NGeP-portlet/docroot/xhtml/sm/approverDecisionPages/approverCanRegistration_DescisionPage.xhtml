<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true"
			autoUpdate="#{backingBean.managedBean.showParentMsg}" closable="true"
			showSummary="false" />

		<p:panel header="#{lbl['lbl.sm.approver.decision.cancel.header']}">
			<table>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mof.no']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.mofNo}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.companyaddress']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.address.smAddress.address1}" rendered="#{not empty backingBean.managedBean.basicInfo.address}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mof.startDate']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.startDate}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.address.smAddress.address2}" rendered="#{not empty backingBean.managedBean.basicInfo.address}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mof.endDate']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.endDate}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.address.smAddress.address3}" rendered="#{not empty backingBean.managedBean.basicInfo.address}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.epno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.epNo}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.address.smAddress.address4}" rendered="#{not empty backingBean.managedBean.basicInfo.address}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.regno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.regNo}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.address.smAddress.postcode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.composition.suppAdmin.name']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.adminName}"/></td>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.address.smAddress.pmCity.cityName}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.composition.suppAdmin.phone']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.adminPhoneNo}"/></td>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.address.smAddress.pmDistrict.districtName}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.composition.suppAdmin.email']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.adminEmail}"/></td>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.address.smAddress.pmState.stateName}"/></td>
				</tr>
				<tr>
					<td colspan="2"></td>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.address.smAddress.pmCountry.countryName}"/></td>
				</tr>
				<tr height="15"><td colspan="4"></td></tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.suppname']}" /></td>
					<td><p:inputText readonly="true" size="30"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.companyName}"
							disabled="true" /></td>
					<td></td>
					<td></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.dateSubmitted']}" /></td>
					<td><p:inputText readonly="true" size="30"
							value="#{backingBean.managedBean.smAppl.applSubmitDate}"
							disabled="true">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText></td>
					<td></td>
					<td></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.current.status']}" /></td>
					<td><p:inputText readonly="true" size="30"
							value="#{backingBean.managedBean.currentStatus}" disabled="true" /></td>
					<td></td>
					<td></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.reason.supplier']}" /></td>
					<td><p:inputTextarea cols="60" readonly="true"
							value="#{backingBean.managedBean.supplierRemarks}"
							disabled="true" /></td>
					<td></td>
					<td></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.supportingdoc.panel.supportingdoc']}" /></td>
					<td><p:commandButton value="#{lbl['lbl.cm.download']}"
							style="float: left;"
							action="#{backingBean.downloadSelectedSuppDoc(backingBean.managedBean.cancellationAttachment.fileName,backingBean.managedBean.cancellationAttachment.filePath)}"
							update=":form" icon="ui-icon-download" ajax="false">
							<p:fileDownload value="#{backingBean.file}" />
						</p:commandButton> <p:outputLabel
							value="#{backingBean.managedBean.cancellationAttachment.fileName}"
							style="float: left;padding: 12px 0px 0px 10px;"
							rendered="#{backingBean.managedBean.cancellationAttachment.fileName ne null}" />
					</td>
					<td></td>
					<td></td>
				</tr>
			</table>
			<br />
			<p:separator />
			<div>
				<p>
					<h:outputText value="#{lbl['lbl.sm.apprvr.splNotes']}"
						escape="false" />
				</p>
			</div>
			<p:separator />

			<div style="width: 100%" align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.approve']}"
					onclick="approveAppCanDialog.show();" />
				<p:commandButton value="#{lbl['lbl.sm.button.reject']}"
					update="rejectAppCanDialog" partialSubmit="true" process="@this"
					action="#{backingBean.approveOrRejectMofCancellation('rejectAppCanDialog')}" />

			</div>
		</p:panel>


		<p:dialog width="800px" header="#{lbl['lbl.sm.approve.application']}"
			widgetVar="approveAppCanDialog" resizable="false" showEffect="fade"
			hideEffect="fade" modal="true">

			<ui:include
				src="/xhtml/sm/shared/poDecisionSharedPages/approvedRemarksPopUpForm.xhtml" />
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					onclick="approveAppCanDialog.hide();"
					action="#{backingBean.submitPOorApproverReviewToBPM('APPROVE')}" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					onclick="approveAppCanDialog.hide();" />
			</div>
		</p:dialog>
		<p:dialog width="800px" header="#{lbl['lbl.sm.reject.application']}"
			id="rejectAppCanDialog" widgetVar="rejectAppCanDialog"
			resizable="false" showEffect="fade" hideEffect="fade" modal="true">

			<ui:include
				src="/xhtml/sm/shared/poDecisionSharedPages/rejectedRemarksPopUpForm.xhtml" />
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					partialSubmit="true" process="rejectAppCanDialog"
					action="#{backingBean.finalDecisionApproveOrRejectAppln('rejectAppCanDialog','REJECT')}" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					action="#{backingBean.resetMofCancellationFinalApproveOrReject('rejectAppCanDialog')}"
					partialSubmit="true" process="@this" />
			</div>
		</p:dialog>
	</ui:define>
</ui:composition>
