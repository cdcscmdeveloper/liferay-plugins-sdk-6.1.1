<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.contactinfo']}" toggleable="true"
		id="contactInfoPanel">

			<table style="width: 100%;table-layout:fixed">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.composition.name']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.adminName}"/></td>
					<td colspan="2">&#160;</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.userprofile.mobile']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.adminPhoneNo}"/></td>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.email']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.basicInfo.adminEmail}"/></td>
				</tr>
			</table>

	</p:panel>
</ui:composition>
