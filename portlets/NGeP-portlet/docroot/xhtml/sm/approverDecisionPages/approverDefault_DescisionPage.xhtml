<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForMof}">
					<ui:include
						src="/xhtml/sm/NewMofApplication/smMofApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForBumi}">
					<ui:include
						src="/xhtml/sm/updateMofDetails/smUpdateMofApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
					<ui:include
						src="/xhtml/sm/renewMofApplication/smRenewApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForApplcatcodes}">
					<ui:include
						src="/xhtml/sm/renewMofApplication/smRenewApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForUpdate}">
					<ui:include
						src="/xhtml/sm/updateMofDetails/smUpdateMofApplnSideMenuItem.xhtml" />
				</c:if></td>
			<td><h:inputHidden
					value="#{backingBean.managedBean.smAppl.applCategoryType}" />
				<div style="width: 100%" align="right">
					<p:commandButton value="#{lbl['lbl.sm.button.approve']}"
						partialSubmit="true" process="@this" onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						update=":form:tt:approverAppDialog"
						disabled="#{!backingBean.managedBean.apprvrSecReview.verifiedAll or !backingBean.managedBean.allowedToApprove}"
						action="#{backingBean.assignFinalApproveOrReject('approverAppDialog')}" />
					<p:commandButton value="#{lbl['lbl.sm.button.reject']}"
						update=":form:tt:approverRejDialog" partialSubmit="true"
						process="@this" onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						action="#{backingBean.assignFinalApproveOrReject('approverRejDialog')}" />

				</div> <c:if
					test="#{!backingBean.managedBean.apprvrSecReview.verifiedAll}">
					<table style="width: 100%">
						<tr>
							<td><h:outputText value="#{lbl['lbl.sm.po.vrfyAllNotes']}"
									style="float:left;" /></td>
						</tr>
					</table>
				</c:if> <p:panel header="#{lbl['lbl.sm.aprvrDecisionLbl']}">
					<table>
						<!-- <tr>
				<td colspan="3"><h4
						style="color: blue; text-align: center; font-weight: bold;">
						<p:outputLabel
							value="Decision For - #{backingBean.managedBean.smAppl.applNo}" />
					</h4></td>
			</tr> -->
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.suppname']}" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputText readonly="true" size="50"
									value="#{backingBean.managedBean.smAppl.smCompanyBasic.companyName}"
									disabled="true" /></td>

						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.dateSubmitted']}" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputText readonly="true" size="50"
									value="#{backingBean.managedBean.smAppl.applSubmitDate}"
									disabled="true">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</p:inputText></td>

						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.curr.regstatus']}" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputText readonly="true" size="50"
									value="#{backingBean.managedBean.currRegStatus}"
									disabled="true" /></td>

						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.po.apprvrRmrk']}" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputTextarea cols="52" disabled="true" rows="5"
									style="width : auto;"
									value="#{backingBean.managedBean.poSecReview.remarkToApprover}" /></td>

						</tr>
					</table>

					<c:if
						test="#{not empty backingBean.managedBean.bumiRecommendationNote}">
						<table style="width: 100%">
							<tr>
								<td><h:outputText
										value="#{backingBean.managedBean.bumiRecommendationNote}"
										style="color: green;font-weight: bold;float:left;" /></td>
							</tr>
						</table>
					</c:if>

					<p:separator />
					<div>
						<TABLE style="width: 100%">
							<tr>
								<td><h:outputText value="#{lbl['lbl.sm.apprvr.splNotes']}"
										styleClass="splNotesFonts" escape="false" /></td>
							</tr>
						</TABLE>

					</div>
					<!-- <div align="center">
			<p:splitButton value="Select Decision">
				<p:menuitem value="Approve" onclick="approverAppDialog.show();" />
				<p:menuitem value="Reject" onclick="approverRejDialog.show();" />

			</p:splitButton>
		</div> -->

				</p:panel></td>
		</tr>
	</table>

	<p:dialog width="1000px" header="#{lbl['lbl.sm.approve.application']}" height="350px"
		closable="false" id="approverAppDialog" widgetVar="approverAppDialog"
		resizable="false" showEffect="fade" hideEffect="fade" modal="true">
		
		<p:outputPanel layout="block" id="approverApprovedBlockPanel">
			<ui:include src="/xhtml/sm/shared/poDecisionSharedPages/approvedRemarksPopUpForm.xhtml" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					onclick="approverApprovedBlockWidget.show()" oncomplete="approverApprovedBlockWidget.hide();" 
					action="#{backingBean.finalDecisionApproveOrRejectAppln('approverAppDialog','APPROVE')}"
					partialSubmit="true" process="approverApprovedBlockPanel" />
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
					action="#{backingBean.cancelFinalApproveOrReject('approverAppDialog')}"
					partialSubmit="true" process="@this" />
			</div>
			<p:blockUI block="approverApprovedBlockPanel" widgetVar="approverApprovedBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
		</p:outputPanel>
	</p:dialog>
	
	<p:dialog width="1000px" header="#{lbl['lbl.sm.reject.application']}" height="350px"
			closable="false" id="approverRejDialog" widgetVar="approverRejDialog"
			resizable="false" showEffect="fade" hideEffect="fade" modal="true">
		<ac:smSearchRejectReasons>
			<p:commandButton value="#{lbl['lbl.btn.submit']}"
				onclick="rejectBlockPanelWidget.show()" oncomplete="rejectBlockPanelWidget.hide();" 
				partialSubmit="true" process="rejectBlockPanel"
				action="#{backingBean.finalDecisionApproveOrRejectAppln('approverRejDialog','REJECT')}" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				action="#{backingBean.cancelFinalApproveOrReject('approverRejDialog')}"
				onclick="rejectBlockPanelWidget.show()" oncomplete="rejectBlockPanelWidget.hide()"
				partialSubmit="true" process="@this" />
		</ac:smSearchRejectReasons>
	</p:dialog>
	
</ui:composition>
