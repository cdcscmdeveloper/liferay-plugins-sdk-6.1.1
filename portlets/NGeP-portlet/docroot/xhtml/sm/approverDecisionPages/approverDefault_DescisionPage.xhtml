<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForMof}">
					<ui:include
						src="/xhtml/sm/NewMofApplication/smMofApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForBumi}">
					<ui:include
						src="/xhtml/sm/bumiPuteraApplication/smBumiApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
					<ui:include
						src="/xhtml/sm/renewMofApplication/smRenewApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForApplcatcodes}">
					<ui:include
						src="/xhtml/sm/addAdditionalCategoryCodes/smAddtnlCatApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForUpdate}">
					<ui:include
						src="/xhtml/sm/updateMofDetails/smUpdateMofApplnSideMenuItem.xhtml" />
				</c:if></td>
			<td><h:inputHidden
					value="#{backingBean.managedBean.smAppl.applCategoryType}" />
				<div style="width: 100%" align="right">
					<p:commandButton value="Approve"
						onclick="approverAppDialog.show();" />
					<p:commandButton value="Reject" onclick="approverRejDialog.show();" />

				</div> <p:panel header="Approver Decision">
					<table>
						<!-- <tr>
				<td colspan="3"><h4
						style="color: blue; text-align: center; font-weight: bold;">
						<p:outputLabel
							value="Decision For - #{backingBean.managedBean.smAppl.applNo}" />
					</h4></td>
			</tr> -->
						<tr>
							<td><p:outputLabel value="Supplier Name" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputText readonly="true"
									value="#{backingBean.managedBean.smAppl.smCompanyBasic.companyName}"
									disabled="true" /></td>

						</tr>
						<tr>
							<td><p:outputLabel value="Date Submitted" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputText readonly="true"
									value="#{backingBean.managedBean.smAppl.applSubmitDate}"
									disabled="true">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</p:inputText></td>

						</tr>
						<tr>
							<td><p:outputLabel value="Current Status" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputText readonly="true"
									value="#{backingBean.managedBean.currentStatus}"
									disabled="true" /></td>

						</tr>
						<tr>
							<td><p:outputLabel value="PO Recommendation" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputTextarea cols="70"
									value="#{backingBean.managedBean.poSecReview.remarkToApprover}" /></td>

						</tr>
					</table>
					<p:separator />
					<div>
						<p>
							You have finished reviewing all the necessary information for MOF
							account registration. Please perform one the below operations to
							provide your decision<br /> 1.Click 'Approve'' to approve the
							application.<br /> 2. Click ' Reject' to reject the application.
						</p>
					</div>
					<p:separator />
					<!-- <div align="center">
			<p:splitButton value="Select Decision">
				<p:menuitem value="Approve" onclick="approverAppDialog.show();" />
				<p:menuitem value="Reject" onclick="approverRejDialog.show();" />

			</p:splitButton>
		</div> -->

				</p:panel></td>
		</tr>
	</table>

	<p:dialog width="650px" header="Approve Application"
		widgetVar="approverAppDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">

		<ui:include
			src="/xhtml/sm/shared/poDecisionSharedPages/approvedRemarksPopUpForm.xhtml" />
		<div align="right">
			<p:commandButton value="Submit"
				oncomplete="approverAppDialog.hide();"
				action="#{backingBean.submitPOorApproverReviewToBPM('APPROVE')}" />
			<p:commandButton value="Cancel" onclick="approverAppDialog.hide();" />
		</div>
	</p:dialog>
	<p:dialog width="650px" header="Reject Application"
		widgetVar="approverRejDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">

		<ui:include
			src="/xhtml/sm/shared/poDecisionSharedPages/rejectedRemarksPopUpForm.xhtml" />
		<div align="right">
			<p:commandButton value="Submit"
				oncomplete="approverRejDialog.hide();"
				action="#{backingBean.submitPOorApproverReviewToBPM('REJECT')}" />
			<p:commandButton value="Cancel" onclick="approverRejDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
