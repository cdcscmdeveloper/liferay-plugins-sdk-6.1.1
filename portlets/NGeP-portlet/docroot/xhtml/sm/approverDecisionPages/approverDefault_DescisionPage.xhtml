<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForMof}">
					<ui:include
						src="/xhtml/sm/NewMofApplication/smMofApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForBumi}">
					<ui:include
						src="/xhtml/sm/bumiPuteraApplication/smBumiApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
					<ui:include
						src="/xhtml/sm/renewMofApplication/smRenewApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForApplcatcodes}">
					<ui:include
						src="/xhtml/sm/addAdditionalCategoryCodes/smAddtnlCatApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForUpdate}">
					<ui:include
						src="/xhtml/sm/updateMofDetails/smUpdateMofApplnSideMenuItem.xhtml" />
				</c:if></td>
			<td><h:inputHidden
					value="#{backingBean.managedBean.smAppl.applCategoryType}" />
				<div style="width: 100%" align="right">
					<p:commandButton value="#{lbl['lbl.sm.button.approve']}" partialSubmit="true"
						process="@this" update=":form:tt:approverAppDialog"
						action="#{backingBean.assignFinalApproveOrReject('approverAppDialog')}" />
					<p:commandButton value="#{lbl['lbl.sm.button.reject']}" update=":form:tt:approverRejDialog"
						partialSubmit="true" process="@this"
						action="#{backingBean.assignFinalApproveOrReject('approverRejDialog')}" />

				</div> <p:panel header="#{lbl['lbl.sm.aprvrDecisionLbl']}">
					<table>
						<!-- <tr>
				<td colspan="3"><h4
						style="color: blue; text-align: center; font-weight: bold;">
						<p:outputLabel
							value="Decision For - #{backingBean.managedBean.smAppl.applNo}" />
					</h4></td>
			</tr> -->
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.suppname']}" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputText readonly="true" size="50"
									value="#{backingBean.managedBean.smAppl.smCompanyBasic.companyName}"
									disabled="true" /></td>

						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.dateSubmitted']}" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputText readonly="true" size="50"
									value="#{backingBean.managedBean.smAppl.applSubmitDate}"
									disabled="true">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</p:inputText></td>

						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.status']}" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputText readonly="true" size="50"
									value="#{backingBean.managedBean.currentStatus}"
									disabled="true" /></td>

						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.po.recommend']}" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputTextarea cols="70"
									value="#{backingBean.managedBean.poSecReview.remarkToApprover}" /></td>

						</tr>
					</table>
					<table style="width: 100%">
						<tr>
							<td><c:choose>
									<c:when
										test="#{backingBean.managedBean.personCalc.halfBumiStatus and backingBean.managedBean.smAppl.applType ne 'C'}">
										<p:outputLabel
											value="#{lbl['lbl.sm.recommendation.halfBumi']}"
											style="color: green;font-weight: bold;float:left;" />
									</c:when>
									<c:when
										test="#{backingBean.managedBean.personCalc.fullBumiStatus and backingBean.managedBean.smAppl.applType ne 'C'}">
										<p:outputLabel
											value="#{lbl['lbl.sm.recommendation.fullBumi']}"
											style="color: green;font-weight: bold;float:left;" />
									</c:when>
									<c:otherwise>
										<p:outputLabel value="#{lbl['lbl.sm.recommendation.noBumi']}"
											style="color: green;font-weight: bold;float:left;" />
									</c:otherwise>
								</c:choose></td>
						</tr>

					</table>

					<p:separator />
					<div>
						<p:outputLabel value="#{lbl['lbl.sm.apprvr.splNotes']}"
							style="float :left;" escape="false" />
					</div>
					<!-- <div align="center">
			<p:splitButton value="Select Decision">
				<p:menuitem value="Approve" onclick="approverAppDialog.show();" />
				<p:menuitem value="Reject" onclick="approverRejDialog.show();" />

			</p:splitButton>
		</div> -->

				</p:panel></td>
		</tr>
	</table>

	<p:dialog width="750px" header="Approve Application" closable="false"
		id="approverAppDialog" widgetVar="approverAppDialog" resizable="false"
		showEffect="fade" hideEffect="fade" modal="true">

		<ui:include
			src="/xhtml/sm/shared/poDecisionSharedPages/approvedRemarksPopUpForm.xhtml" />
		<div align="right">
			<p:commandButton value="Submit"
				action="#{backingBean.finalDecisionApproveOrRejectAppln('approverAppDialog','APPROVE')}"
				partialSubmit="true" process="approverAppDialog" />
			<p:commandButton value="Cancel"
				action="#{backingBean.cancelFinalApproveOrReject('approverAppDialog')}"
				partialSubmit="true" process="@this" />
		</div>
	</p:dialog>
	<p:dialog width="850px" header="Reject Application" closable="false"
		id="approverRejDialog" widgetVar="approverRejDialog" resizable="false"
		showEffect="fade" hideEffect="fade" modal="true">

		<ui:include
			src="/xhtml/sm/shared/poDecisionSharedPages/rejectedRemarksPopUpForm.xhtml" />
		<div align="right">
			<p:commandButton value="Submit" partialSubmit="true"
				process="approverRejDialog"
				action="#{backingBean.finalDecisionApproveOrRejectAppln('approverRejDialog','REJECT')}" />
			<p:commandButton value="Cancel"
				action="#{backingBean.cancelFinalApproveOrReject('approverRejDialog')}"
				partialSubmit="true" process="@this" />
		</div>
	</p:dialog>
</ui:composition>
