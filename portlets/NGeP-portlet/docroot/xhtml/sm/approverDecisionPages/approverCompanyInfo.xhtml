<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.panHdr.comBasic']}" toggleable="true"
		id="companyInfoPanel">

		<table style="width: 100%; table-layout: fixed">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.companyname']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.basicInfo.companyName}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.mof.no']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.basicInfo.mofNo}" /></td>

			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.businessregno']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.basicInfo.regNo}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.mof.startDate']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.basicInfo.startDate}" /></td>

			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.epno']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.basicInfo.epNo}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.mof.endDate']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.basicInfo.endDate}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.gstNo']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.basicInfo.gstNum}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.gst.effdate']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.basicInfo.gstRegDate}" /></td>

			</tr>
			<tr>
				<td colspan="2">&#160;</td>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.gst.eff.end.date']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.basicInfo.gstEndDate}" /></td>
			</tr>
			<tr>
				<td style="vertical-align: baseline;"><p:outputLabel
						styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.companyaddress']}" /></td>
				<td style="word-wrap: break-word"><p:outputLabel
						styleClass="outputLabel-view"
						value="#{backingBean.managedBean.basicInfo.addressLine}"
						escape="false" /></td>

			</tr>
		</table>

	</p:panel>
</ui:composition>
