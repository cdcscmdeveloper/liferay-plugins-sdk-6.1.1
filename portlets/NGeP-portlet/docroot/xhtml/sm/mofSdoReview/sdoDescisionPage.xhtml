<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="sideMenu">
		<ui:include src="/xhtml/sm/shared/sidemenu/sdoReviewSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<p:panel header="SDO Decision">			
			
<table style="background-color:#FFCC66; ">
  <tr>
    <td><p:outputLabel value="You have finished reviewing all the necessary information for MOF account registration. Please perform one the below operations to provide your decision " /></td>
  </tr>
  <tr>
    <td><p:outputLabel value="1. Click ' Send Enquiry ' to submit an enquiry to the supplier regarding missing / incomplete supporting documents  " /></td>
  </tr>
  <tr>
    <td style="text-align: center;"><p:outputLabel value="or" /></td>
  </tr>
  <tr>
    <td><p:outputLabel value="2. Click 'Submit To PO' for futher proceeding with the next step of registration i.e. submitting the application to the processing officer " /></td>
  </tr>
</table>
			<p:separator />
			<div align="center">
				<p:splitButton value="-- Select Decision --">
					<p:menuitem value="Submit To PO" />
					<p:menuitem value="Send Enquiry" onclick="sendEnqDialog.show();" />
				</p:splitButton>
			</div>
		</p:panel>
		<p:dialog width="850px" height="500px" header="Send Enquiry"
			widgetVar="sendEnqDialog" resizable="false" showEffect="fade"
			hideEffect="fade" modal="true">

		 <!-- <ui:include
				src="/xhtml/sm/shared/poDecisionSharedPages/assignToSvcForm.xhtml" /> -->
				
			<ui:include
				src="/xhtml/sm/shared/mofSdoSharedPages/sdoSendEnquiry.xhtml" />
			
			<div align="center">
				<p:commandButton value="Submit" onclick="sendEnqDialog.hide();" />
				<p:commandButton value="Cancel" onclick="sendEnqDialog.hide();" />
			</div>
		</p:dialog>
	</ui:define>
</ui:composition>
