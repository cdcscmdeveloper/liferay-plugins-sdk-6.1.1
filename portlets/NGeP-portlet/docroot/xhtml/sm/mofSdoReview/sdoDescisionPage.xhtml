<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="sideMenu">
		<ui:include src="/xhtml/sm/shared/sidemenu/sdoReviewSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<p:panel header="SDO Decision">
			<table>
				<tr>
					<td colspan="3"><h4
							style="color: blue; text-align: center; font-weight: bold;">
							<p:outputLabel
								value="Decision For Application Type - XXXXXX Type - Appln No.123434" />
						</h4></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Supplier Name" /></td>
					<td><p:outputLabel value="   : " /></td>
					<td><p:inputText readonly="true" value="Sample Data"
							disabled="true" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="Date Submitted" /></td>
					<td><p:outputLabel value="   : " /></td>
					<td><p:inputText readonly="true" value="Sample Date"
							disabled="true" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="Current Status" /></td>
					<td><p:outputLabel value="   : " /></td>
					<td><p:inputText readonly="true" value="Sample Data"
							disabled="true" /></td>

				</tr>
			</table>
			<p:separator />
			<div>
				<p>--- ENTER DATA HERE ----</p>
			</div>
			<p:separator />
			<div align="center">
				<p:splitButton value="-- Select Decision --">
					<p:menuitem value="Submit To PO" />
					<p:menuitem value="Send Enquiry" onclick="sendEnqDialog.show();" />
				</p:splitButton>
			</div>
		</p:panel>
		<p:dialog width="800px" height="500px" header="Assign Site Visit"
			widgetVar="sendEnqDialog" resizable="false" showEffect="fade"
			hideEffect="fade" modal="true">

			<ui:include
				src="/xhtml/sm/shared/poDecisionSharedPages/assignToSvcForm.xhtml" />
			<div align="center">
				<p:commandButton value="Submit" onclick="sendEnqDialog.hide();" />
				<p:commandButton value="Cancel" onclick="sendEnqDialog.hide();" />
			</div>
		</p:dialog>
	</ui:define>
</ui:composition>
