<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		
	</ui:define>
	
	<ui:param name="viewSmApplBackingBean" value="#{viewApplHistoryBackingBean}" />
	
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:outputPanel id="unclaimTaskPanelId">
			<ac:smPanel id="tt">
					
				<p:messages id="messages" showDetail="true" closable="false" showSummary="false" />
				
				<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.unclaim.task.view.msg']}" escape="false"/><br />
				
				<div align="right">
					<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}" action="#{viewSmApplBackingBean.onClickClaimButton}" update="@form" process="@this"
						rendered="#{!viewSmApplBackingBean.managedBean.claimTask}" onclick="blockWidget.show()" oncomplete="blockWidget.hide()">
						<f:param name="taskId" value="#{viewSmApplBackingBean.managedBean.taskId}" />
						<f:param name="claim" value="true" />
					</p:commandButton>
				</div>
				
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 0}">
					<ui:include src="/xhtml/sm/revisionSmApplView/unclaimtaskView/step1ViewProfileCompanyInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 1}">
					<ui:include src="/xhtml/sm/revisionSmApplView/unclaimtaskView/step2ViewProfileBranchCompanyInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 2}">
					<ui:include src="/xhtml/sm/revisionSmApplView/unclaimtaskView/step4ViewProfilePersonnelInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 3}">
					<ui:include src="/xhtml/sm/revisionSmApplView/unclaimtaskView/step3ViewProfileCaptialAndEquityStatusInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 4}">
					<ui:include src="/xhtml/sm/revisionSmApplView/unclaimtaskView/step5ViewProfileBankInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 5}">
					<ui:include src="/xhtml/sm/revisionSmApplView/unclaimtaskView/step6ViewProfileCategoryCodesInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
					<ui:include src="/xhtml/sm/revisionSmApplView/unclaimtaskView/step6.1ViewProfileFactoryInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
					<ui:include src="/xhtml/sm/revisionSmApplView/unclaimtaskView/step6.2ViewProfileEquipmentInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 8}">
					<ui:include src="/xhtml/sm/revisionSmApplView/unclaimtaskView/step7ViewProfileSupportingDocumentsInfo.xhtml" />
				</c:if>
			</ac:smPanel>
		</p:outputPanel>
	</ui:define>
		
</ui:composition>
