<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	
	<c:if test="#{viewSmApplBackingBean.managedBean.reviewApplicationExist}">
		<ac:smPanel id="tt">
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 0}">
				<ui:include src="step1ViewBumiAppln_CompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 1}">
				<ui:include src="step4ViewBumiAppln_PersonnelInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 2}">
				<ui:include src="step2ViewBumiAppln_CaptialAndEquityStatusInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 3}">
				<ui:include src="step3ViewBumiAppln_BankInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 4}">
				<ui:include src="step5ViewBumiAppln_SupportingDocumentsInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.previousApproved}">
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 5}">
					<ui:include src="step6ViewBumiPoDecision.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
					<ui:include src="step6ViewBumiApproverDecision.xhtml" />
				</c:if>
			</c:if>
		</ac:smPanel>
	</c:if>
</ui:composition>
