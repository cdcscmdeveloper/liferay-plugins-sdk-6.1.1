<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_viewApplicationHistory_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.supplier.application.history']}asdsadsad");
		</script>
	</ui:define>
	
	<ui:param name="viewSmApplBackingBean" value="#{viewProfileBackingBean}" />
	
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:outputPanel id="supplierProfilePanelId">
			
			<ui:include src="/xhtml/sm/shared/applViewOnlyPages/backButtonAndUrl.xhtml" />
			<ui:include src="/xhtml/sm/shared/applViewOnlyPages/applicationHistoryHeaderInfo.xhtml" />
			
			<ac:smPanel id="tt">
				
				<p:messages id="messages" showDetail="true" closable="false" showSummary="false" />
				
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 0}">
					<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step1ViewProfileCompanyInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 1}">
					<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step2ViewProfileBranchCompanyInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 2}">
					<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step4ViewProfilePersonnelInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 3}">
					<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step3ViewProfileCaptialAndEquityStatusInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 4}">
					<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step5ViewProfileBankInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 5}">
					<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step6ViewProfileCategoryCodesInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
					<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step6.1ViewProfileFactoryInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
					<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step6.2ViewProfileEquipmentInfo.xhtml" />
				</c:if>
				<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 8}">
					<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step7ViewProfileSupportingDocumentsInfo.xhtml" />
				</c:if>
				<c:choose>
					<c:when test="#{!viewSmApplBackingBean.managedBean.supplierUser}">
						<c:if
							test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 9}">
							<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step10ViewSiteVisitInfo.xhtml" />
						</c:if>
						<c:if
							test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 10}">
							<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step8ViewVirtualCertInfo.xhtml" />
						</c:if>
						<c:if
							test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 11}">
							<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step9ViewTrackingDiary.xhtml" />
						</c:if>
						<c:if
							test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 12}">
							<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step12POApproverDecisionRemark.xhtml" />
						</c:if>
					</c:when>
					<c:otherwise>
						<c:if
							test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 9}">
							<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step8ViewVirtualCertInfo.xhtml" />
						</c:if>
						<c:if
							test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 10}">
							<ui:include src="/xhtml/sm/revisionSmApplView/viewProfile/step9ViewTrackingDiary.xhtml" />
						</c:if>
					</c:otherwise>
				</c:choose>

			</ac:smPanel>
		</p:outputPanel>
	</ui:define>
		
</ui:composition>
