<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
	<c:if test="#{viewSmApplBackingBean.managedBean.reviewApplicationExist}">
		<ac:smPanel id="tt">
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 0}">
				<ui:include src="step1ViewAddnlCatCode_CompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 1}">
				<ui:include src="step2ViewAddnlCatCode_BranchCompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 2}">
				<ui:include src="step4ViewAddnlCatCode_PersonnelInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 3}">
				<ui:include src="step3ViewAddnlCatCode_CaptialAndEquityStatusInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 4}">
				<ui:include src="step5ViewAddnlCatCode_RegisterCategoryCodesInfo.xhtml" />
			</c:if>
			<c:choose>
				<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.applCategoryType eq 'S'}">
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 5}">
						<ui:include src="step5.1ViewAddnlCatCode_FactoryInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
						<ui:include src="step5.2ViewAddnlCatCode_EquipmentInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
						<ui:include src="step6ViewAddnlCatCode_SupportingDocumentsInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.previousApproved}">
						<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 8}">
							<ui:include src="step7ViewAddnlPoDecision.xhtml" />
						</c:if>
						<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 9}">
							<ui:include src="step7ViewAddnlApproverDecision.xhtml" />
						</c:if>
					</c:if>
				</c:when>
				<c:otherwise>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 5}">
						<ui:include src="step6ViewAddnlCatCode_SupportingDocumentsInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.previousApproved}">
						<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
							<ui:include src="step7ViewAddnlPoDecision.xhtml" />
						</c:if>
						<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
							<ui:include src="step7ViewAddnlApproverDecision.xhtml" />
						</c:if>
					</c:if>
				</c:otherwise>
			</c:choose>
		</ac:smPanel>
	</c:if>
</ui:composition>
