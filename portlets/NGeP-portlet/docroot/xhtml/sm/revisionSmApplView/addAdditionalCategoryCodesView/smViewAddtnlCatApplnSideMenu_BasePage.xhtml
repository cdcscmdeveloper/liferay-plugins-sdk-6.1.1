<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">

	</ui:define>

	
	<ui:define name="contentSection">

		<ac:smPanel id="tt">
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 0}">
				<ui:include src="step1ViewAddnlCatCode_CompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 1}">
				<ui:include src="step2ViewAddnlCatCode_BranchCompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 2}">
				<ui:include src="step4ViewAddnlCatCode_PersonnelInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 3}">
				<ui:include src="step3ViewAddnlCatCode_CaptialAndEquityStatusInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 4}">
				<ui:include src="step5ViewAddnlCatCode_RegisterCategoryCodesInfo.xhtml" />
			</c:if>
			<c:choose>
				<c:when
					test="#{viewSmApplBackingBean.managedBean.smAppl.applCategoryType eq 'S'}">
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 5}">
						<ui:include src="step5.1ViewAddnlCatCode_FactoryInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
						<ui:include src="step5.2ViewAddnlCatCode_EquipmentInfo.xhtml" />
					</c:if>
					<c:choose>
						<c:when test="#{viewSmApplBackingBean.managedBean.supplierUser }">
							<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
								<ui:include
									src="step6ViewAddnlCatCode_SupportingDocumentsInfo.xhtml" />
							</c:if>
						</c:when>
						<c:when test="#{viewSmApplBackingBean.managedBean.poUser}">
							<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
								<ui:include
									src="/xhtml/sm/poDecisionPages/poReviewSupportingDocuments.xhtml" />
							</c:if>
							<c:choose>
								<c:when test="#{viewSmApplBackingBean.managedBean.reviewSiteVisit}">
									<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 8}">
										<ui:include
											src="/xhtml/sm/reviewSiteVisitReport/reviewSiteVisitReportDocuments.xhtml" />
									</c:if>
									<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 9}">
										<ui:include
											src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
									</c:if>
								</c:when>
								<c:otherwise>
									<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 8}">
										<ui:include
											src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
									</c:if>
								</c:otherwise>
							</c:choose>

						</c:when>
						<c:when test="#{viewSmApplBackingBean.managedBean.approverUser}">
							<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
								<ui:include
									src="/xhtml/sm/approverDecisionPages/approverReviewSupportingDocuments.xhtml" />
							</c:if>
							<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 8}">
								<ui:include
									src="/xhtml/sm/approverDecisionPages/approverDefault_DescisionPage.xhtml" />
							</c:if>
						</c:when>
						<c:otherwise>
						</c:otherwise>
					</c:choose>

				</c:when>
				<c:otherwise>
					<c:choose>
						<c:when test="#{viewSmApplBackingBean.managedBean.supplierUser }">
							<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 5}">
								<ui:include
									src="step6ViewAddnlCatCode_SupportingDocumentsInfo.xhtml" />
							</c:if>
						</c:when>
						<c:when test="#{viewSmApplBackingBean.managedBean.poUser}">
							<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 5}">
								<ui:include
									src="/xhtml/sm/poDecisionPages/poReviewSupportingDocuments.xhtml" />
							</c:if>
							<c:choose>
								<c:when test="#{viewSmApplBackingBean.managedBean.reviewSiteVisit}">
									<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
										<ui:include
											src="/xhtml/sm/reviewSiteVisitReport/reviewSiteVisitReportDocuments.xhtml" />
									</c:if>
									<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
										<ui:include
											src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
									</c:if>
								</c:when>
								<c:otherwise>
									<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
										<ui:include
											src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
									</c:if>
								</c:otherwise>
							</c:choose>

						</c:when>
						<c:when test="#{viewSmApplBackingBean.managedBean.approverUser}">
							<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 5}">
								<ui:include
									src="/xhtml/sm/approverDecisionPages/approverReviewSupportingDocuments.xhtml" />
							</c:if>
							<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
								<ui:include
									src="/xhtml/sm/approverDecisionPages/approverDefault_DescisionPage.xhtml" />
							</c:if>
						</c:when>
						<c:otherwise>
						</c:otherwise>
					</c:choose>
				</c:otherwise>
			</c:choose>
		</ac:smPanel>

	</ui:define>
</ui:composition>
