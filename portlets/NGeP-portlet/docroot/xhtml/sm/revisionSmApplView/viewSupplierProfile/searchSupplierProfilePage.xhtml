<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_viewSupplierProfile_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.supprofile']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:messages id="messages" showDetail="true" closable="false" showSummary="false" />
		
		<p:panel header="#{lbl['lbl.sm.search.supprofile']}" toggleable="true" id="searchSupplierProfilePanelId">
		
		<ui:include src="/xhtml/sm/shared/applViewOnlyPages/supplierApplicationSearchCriteria.xhtml" />
			
		<p:dataTable var="smSupplier" widgetVar="smApplWidgetVar"
			editable="false" lazy="true" rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{viewSuppProfileBackingBean.managedBean.smSupplierDataModel}"
			selection="#{viewSuppProfileBackingBean.managedBean.selectedSupplier}"
			rowKey="#{smSupplier}" rowIndexVar="index" id="supplierApplHistoryDtId">
			<ac:paginator for="supplierApplHistoryDtId" />
			
			<p:column headerText="#{lbl['lbl.sm.companyname']}" rendered="#{!viewSuppProfileBackingBean.managedBean.supplierUser}">
				<h:outputText value="#{smSupplier.companyName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.application.no']}">
				<h:outputText value="#{smSupplier.smAppl.applNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.applicationtype']}">
				<h:outputText value="#{lbl['lbl.sm.appltype.newmof']}" rendered="#{smSupplier.smAppl.applType eq 'N'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.bumiputera']}" rendered="#{smSupplier.smAppl.applType eq 'B'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.categorycode']}" rendered="#{smSupplier.smAppl.applType eq 'A'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.updateprofile']}" rendered="#{smSupplier.smAppl.applType eq 'U'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.cancelmof']}" rendered="#{smSupplier.smAppl.applType eq 'C'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.renewmof']}" rendered="#{smSupplier.smAppl.applType eq 'R'}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.label.action']}">
				<p:commandLink onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{viewSuppProfileBackingBean.viewApplication(smSupplier.smAppl)}"
					process="@this" partialSubmit="true" update="@([id$=searchSupplierProfilePanelId])"
					style="padding-right:5px;">
					<p:graphicImage value="/css/images/design/document.png" />
				</p:commandLink>
			</p:column>
			
		</p:dataTable>
			
		</p:panel>
	</ui:define>
</ui:composition>
