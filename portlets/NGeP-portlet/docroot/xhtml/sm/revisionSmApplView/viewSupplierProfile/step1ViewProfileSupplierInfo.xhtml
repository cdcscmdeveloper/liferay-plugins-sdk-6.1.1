<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
	<p:outputPanel>
		<tr>
			<td style="width: 20%; vertical-align: top;" class="sidemenutd">
				<ui:include	src="smViewProfileApplnSideMenuItem.xhtml" />
			</td>
			<td style="vertical-align: top;">
			<c:choose>
			<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.SUPP_TYPE_BASIC}">
			<c:choose>
				<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.smSupplier.businessType eq SupplierMgmtConst.smSupplierBusinessTypeIndividual}">
					<ui:include	src="/xhtml/sm/shared/applViewOnlyPages/individualInfoFormViewOnly.xhtml" />
				</c:when>
				<c:otherwise>
					<ui:include	src="/xhtml/sm/shared/applViewOnlyPages/companyInfoFormViewOnly_BasicNonIndividual.xhtml" />
				</c:otherwise>			
			</c:choose>
			</c:when>
			<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.SUPP_TYPE_GOVT_TO_GOVT}">
				<ui:include	src="/xhtml/sm/shared/applViewOnlyPages/agencyInfoFormViewOnly.xhtml" />
			</c:when>
			</c:choose>
			<!-- #28237 -->
			<ui:include src="/xhtml/sm/shared/applViewOnlyPages/disciplinaryActionInfo.xhtml" />
			</td>
		</tr>
	</p:outputPanel>	
	</table>
</ui:composition>
