<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 0}">
		<ui:include src="step1ViewUpdateMof_CompanyInfo.xhtml" />
	</c:if>
	<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 1}">
		<ui:include src="step2ViewUpdateMof_BranchCompanyInfo.xhtml" />
	</c:if>
	<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 2}">
		<ui:include src="step4ViewUpdateMof_PersonnelInfo.xhtml" />
	</c:if>
	<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 3}">
		<ui:include src="step3ViewUpdateMof_CaptialAndEquityStatusInfo.xhtml" />
	</c:if>
	<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 4}">
		<ui:include src="step5ViewUpdateMof_BankInfo.xhtml" />
	</c:if>
	
	<!-- Only rendered for Supplier Profile -->
	<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 5}">
		<ui:include src="step5ViewBumi_RegisterCategoryCodesInfo.xhtml" />
	</c:if>
	
	<c:choose>
		<c:when test="#{viewSmApplBackingBean.managedBean.supplierUser}">
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
				<ui:include src="step6ViewUpdateMof_SupportingDocumentsInfo.xhtml" />
			</c:if>
		</c:when>
		<c:when test="#{viewSmApplBackingBean.managedBean.poUser}">
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
				<ui:include src="step6ViewUpdateMof_SupportingDocumentsInfo.xhtml" />
			</c:if>
			<c:choose>
				<c:when test="#{viewSmApplBackingBean.managedBean.reviewSiteVisit}">
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
						<ui:include src="/xhtml/sm/shared/applViewOnlyPages/reviewSiteVisitReportDocumentsViewOnly.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 8}">
						<ui:include src="step7ViewUpdateMofPoDecision.xhtml" />
					</c:if>
				</c:when>
				<c:otherwise>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
						<ui:include src="step7ViewUpdateMofPoDecision.xhtml" />
					</c:if>
				</c:otherwise>
			</c:choose>
		</c:when>
		<c:when test="#{viewSmApplBackingBean.managedBean.approverUser}">
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
				<ui:include src="step6ViewUpdateMof_SupportingDocumentsInfo.xhtml" />
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
				<ui:include src="step7ViewUpdateMofApproverDecision.xhtml" />
			</c:if>
		</c:when>
		<c:otherwise>
		</c:otherwise>
	</c:choose>
</ui:composition>
