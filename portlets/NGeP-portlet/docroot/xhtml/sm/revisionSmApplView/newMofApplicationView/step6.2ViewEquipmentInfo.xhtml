<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<c:if
		test="#{viewSmApplBackingBean.managedBean.approverUser or viewSmApplBackingBean.managedBean.poUser}">
		<table style="width: 100%">
			<tr>
				<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
						src="smViewMofApplnSideMenuItem.xhtml" /></td>
				<td><h:inputHidden
						value="#{viewSmApplBackingBean.managedBean.smAppl.applCategoryType}" />
					<ui:include
						src="/xhtml/sm/shared/applViewOnlyPages/manufacturingOrAssmblyInfoFormViewOnly.xhtml" />
					<ui:include
						src="/xhtml/sm/shared/applViewOnlyPages/machineryInfoFormViewOnly.xhtml" />
				</td>
			</tr>

		</table>
	</c:if>


	<c:if test="#{viewSmApplBackingBean.managedBean.supplierUser}">

		<h:inputHidden
			value="#{viewSmApplBackingBean.managedBean.smAppl.applCategoryType}" />
		<ui:include
			src="/xhtml/sm/shared/applViewOnlyPages/manufacturingOrAssmblyInfoFormViewOnly.xhtml" />
		<ui:include
			src="/xhtml/sm/shared/applViewOnlyPages/machineryInfoFormViewOnly.xhtml" />
	</c:if>
</ui:composition>
