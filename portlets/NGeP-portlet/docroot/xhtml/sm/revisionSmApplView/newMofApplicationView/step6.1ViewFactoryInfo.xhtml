<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<c:if
		test="#{viewSmApplBackingBean.managedBean.approverUser or viewSmApplBackingBean.managedBean.poUser}">
		<table style="width: 100%">
			<tr>
				<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include src="smViewMofApplnSideMenuItem.xhtml" /></td>
				<td><p:panel id="facInfPan">
						<ui:include src="/xhtml/sm/shared/applViewOnlyPages/factoryOrWorkshopInfoFormViewOnly.xhtml" />
						<ui:include src="/xhtml/sm/shared/applViewOnlyPages/dockyardInfoFormViewOnly.xhtml" />
						<ui:include src="/xhtml/sm/shared/applViewOnlyPages/workshopInfoFormViewOnly.xhtml" />
						<ui:include src="/xhtml/sm/shared/applViewOnlyPages/storeInfoFormViewOnly.xhtml" />
						<br />
						<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.poUser}">
							<table style="width: 50%">
								<tr>
									<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
									<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.factoryRemark}" /></td>
								</tr>
							</table>
						</p:outputPanel>
						<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
							<table style="width: 100%">
								<tr>
									<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
									<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.factoryRemark}" /></td>
									<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']} :" /></td>
									<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.apprvrSecReview.factoryRemark}" /></td>

								</tr>
							</table>
						</p:outputPanel>
					</p:panel>
				</td>
			</tr>
		</table>
	</c:if>


	<c:if test="#{viewSmApplBackingBean.managedBean.supplierUser}">
		<ui:include src="/xhtml/sm/shared/applViewOnlyPages/factoryOrWorkshopInfoFormViewOnly.xhtml" />
		<ui:include src="/xhtml/sm/shared/applViewOnlyPages/dockyardInfoFormViewOnly.xhtml" />
		<ui:include src="/xhtml/sm/shared/applViewOnlyPages/workshopInfoFormViewOnly.xhtml" />
		<ui:include src="/xhtml/sm/shared/applViewOnlyPages/storeInfoFormViewOnly.xhtml" />
	</c:if>

</ui:composition>
