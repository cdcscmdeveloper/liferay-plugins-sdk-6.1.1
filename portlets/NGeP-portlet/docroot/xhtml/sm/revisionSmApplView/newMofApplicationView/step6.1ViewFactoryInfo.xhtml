<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<c:if
		test="#{viewSmApplBackingBean.managedBean.approverUser or viewSmApplBackingBean.managedBean.poUser}">
		<table style="width: 100%">
			<tr>
				<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
						src="smViewMofApplnSideMenuItem.xhtml" /></td>
				<td><br />
					<table style="width: 250px">
						<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.poUser}">
							<tr>
								<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
										value="#{viewSmApplBackingBean.managedBean.poSecReview.factoryVerify}"
										id="poFacVer">
										<p:ajax update=":form:tt:facInfPan,:form:revPanHdr"
											event="change"
											listener="#{viewSmApplBackingBean.changeVerifySection(viewSmApplBackingBean.managedBean.poSecReview.factoryVerify)}" />
									</p:selectBooleanCheckbox></td>
								<td valign="top"><h:outputText
										value="#{lbl['lbl.sm.sectionPoVerf']}"
										title="For PO to highlight the verified section " /></td>

							</tr>
						</p:outputPanel>
						<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
							<tr>
								<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
										value="#{viewSmApplBackingBean.managedBean.apprvrSecReview.factoryVerify}"
										id="apprFacVer">
										<p:ajax update=":form:tt:facInfPan,:form:revPanHdr"
											event="change"
											listener="#{viewSmApplBackingBean.changeVerifySection(viewSmApplBackingBean.managedBean.apprvrSecReview.factoryVerify)}" />
									</p:selectBooleanCheckbox></td>
								<td valign="top"><h:outputText
										value="#{lbl['lbl.sm.sectionApprVerf']}"
										title="For Approver to highlight the verified section " /></td>
							</tr>
						</p:outputPanel>
					</table> <br /> <p:panel id="facInfPan">
						<p:blockUI block=":form:tt:facInfPan" widgetVar="buiPoFac"
							id="poFacBlc"
							blocked="#{viewSmApplBackingBean.managedBean.poUser ? viewSmApplBackingBean.managedBean.poSecReview.factoryVerify : (viewSmApplBackingBean.managedBean.approverUser ? viewSmApplBackingBean.managedBean.apprvrSecReview.factoryVerify : false)}" />

						<h:inputHidden
							value="#{viewSmApplBackingBean.managedBean.smAppl.applCategoryType}" />
						<ui:include
							src="/xhtml/sm/shared/applViewOnlyPages/factoryOrWorkshopInfoFormViewOnly.xhtml" />
						<ui:include
							src="/xhtml/sm/shared/applViewOnlyPages/dockyardInfoFormViewOnly.xhtml" />
						<ui:include
							src="/xhtml/sm/shared/applViewOnlyPages/workshopInfoFormViewOnly.xhtml" />

						<ui:include
							src="/xhtml/sm/shared/applViewOnlyPages/storeInfoFormViewOnly.xhtml" />
						<br />
						<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.poUser}">
							<table style="width: 50%">
								<tr>
									<td style="padding-left: 38px;"><p:outputLabel
											value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
									<td><p:inputTextarea autoResize="true" cols="41"
											value="#{viewSmApplBackingBean.managedBean.poSecReview.factoryRemark}" /></td>
								</tr>
							</table>
						</p:outputPanel>
						<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
							<table style="width: 100%">
								<tr>
									<td style="padding-left: 38px;"><p:outputLabel
											value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
									<td><p:inputTextarea autoResize="true" readonly="true"
											disabled="true" cols="41"
											value="#{viewSmApplBackingBean.managedBean.poSecReview.factoryRemark}" /></td>
									<td style="padding-left: 22px;"><p:outputLabel
											value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
									<td><p:inputTextarea autoResize="true" cols="41"
											value="#{viewSmApplBackingBean.managedBean.apprvrSecReview.factoryRemark}" /></td>

								</tr>
							</table>
						</p:outputPanel>
					</p:panel>


					</td>
			</tr>

		</table>
	</c:if>


	<c:if test="#{viewSmApplBackingBean.managedBean.supplierUser}">

		<h:inputHidden
			value="#{viewSmApplBackingBean.managedBean.smAppl.applCategoryType}" />
		<ui:include
			src="/xhtml/sm/shared/applViewOnlyPages/factoryOrWorkshopInfoFormViewOnly.xhtml" />
		<ui:include
			src="/xhtml/sm/shared/applViewOnlyPages/dockyardInfoFormViewOnly.xhtml" />
		<ui:include
			src="/xhtml/sm/shared/applViewOnlyPages/workshopInfoFormViewOnly.xhtml" />

		<ui:include src="/xhtml/sm/shared/applViewOnlyPages/storeInfoFormViewOnly.xhtml" />
		
	</c:if>

</ui:composition>
