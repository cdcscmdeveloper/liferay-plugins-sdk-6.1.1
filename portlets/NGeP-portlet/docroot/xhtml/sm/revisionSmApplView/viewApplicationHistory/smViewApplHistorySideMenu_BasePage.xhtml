<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_viewApplicationHistory_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.supplier.application.history']}");
		</script>
	</ui:define>
	
	<ui:param name="viewSmApplBackingBean" value="#{viewApplHistoryBackingBean}" />
	
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:outputPanel id="supplierProfilePanelId">
			<c:if test="#{viewSmApplBackingBean.managedBean.reviewApplicationExist}">
			
				<ui:include src="/xhtml/sm/shared/applViewOnlyPages/backButtonAndUrl.xhtml" />
				<ui:include src="/xhtml/sm/shared/applViewOnlyPages/applicationHistoryHeaderInfo.xhtml" />
				
				<ac:smPanel id="tt">
					
					<p:messages id="messages" showDetail="true" closable="false" showSummary="false" />
					
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 0}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step1ViewProfileCompanyInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 1}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step2ViewProfileBranchCompanyInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 2}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step4ViewProfilePersonnelInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 3}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step3ViewProfileCaptialAndEquityStatusInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 4}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step5ViewProfileBankInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 5}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step6ViewProfileCategoryCodesInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step6.1ViewProfileFactoryInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step6.2ViewProfileEquipmentInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 8}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step7ViewProfileSupportingDocumentsInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 9}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step8ViewVirtualCertInfo.xhtml" />
					</c:if>
				</ac:smPanel>
			</c:if>
		</p:outputPanel>
	</ui:define>
		
</ui:composition>
