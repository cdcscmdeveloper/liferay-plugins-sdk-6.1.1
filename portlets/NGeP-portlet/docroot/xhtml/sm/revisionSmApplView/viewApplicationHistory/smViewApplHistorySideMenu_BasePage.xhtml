<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_viewApplicationHistory_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.supplier.application.history']}");
		</script>
	</ui:define>
	<!-- #27250 -->
	<p:messages id="messages" showSummary="false" showDetail="true"  escape="false" autoUpdate="true" closable="true" severity="error, info, warn" />
	
	<ui:param name="viewSmApplBackingBean" value="#{viewApplHistoryBackingBean}" />
	
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:outputPanel id="supplierProfilePanelId">
		
		<!-- Enhancement 26238 - START -->
		<p:outputPanel style="color:red;font-weight:bold;" rendered="#{!viewSmApplBackingBean.managedBean.supplierUser
			and viewApplHistoryBackingBean.managedBean.disciplinaryAction}">
			<h:outputText styleClass="warning" value="#{lbl['lbl.sm.supplier.disciplinary.action.msg']}" escape="false"/><p:spacer width="2"/>
			<h:outputText styleClass="warning" value="#{lbl['lbl.sm.disciplinary.click']}" escape="false"/>
			<p:commandLink onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				action="#{viewApplHistoryBackingBean.onViewDisciplinaryAction}" 
				process="@this" partialSubmit="true" >
					<u><h:outputText value="#{lbl['lbl.sm.disciplinary.here']}" styleClass="warning" /></u>
			</p:commandLink><p:spacer width="2"/>
			<h:outputText styleClass="warning" value="#{lbl['lbl.sm.disciplinary.to.view.history.disciplinary.action']}" escape="false"/><br />
			<p:spacer height="2"/>
		</p:outputPanel>
		<!-- 26238 - END -->
		
			<c:if test="#{viewSmApplBackingBean.managedBean.reviewApplicationExist}">
			
				<ui:include src="/xhtml/sm/shared/applViewOnlyPages/backButtonAndUrl.xhtml" />
				<ui:include src="/xhtml/sm/shared/applViewOnlyPages/applicationHistoryHeaderInfo.xhtml" />
				<c:choose>
				<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.supplierType ne SupplierManagementConst.SUPP_TYPE_BASIC 
				and viewSmApplBackingBean.managedBean.smAppl.supplierType ne SupplierManagementConst.SUPP_TYPE_GOVT_TO_GOVT}">
				<ac:smPanel id="tt">
					
					<p:messages id="messages" showDetail="true" closable="false" showSummary="false" />
					
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 0}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step1ViewProfileCompanyInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 1}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step2ViewProfileBranchCompanyInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 2}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step4ViewProfilePersonnelInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 3}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step3ViewProfileCaptialAndEquityStatusInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 4}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step5ViewProfileBankInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 5}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step6ViewProfileCategoryCodesInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 6}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step6.1ViewProfileFactoryInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 7}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step6.2ViewProfileEquipmentInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 8}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step7ViewProfileSupportingDocumentsInfo.xhtml" />
					</c:if>
					<c:choose>
						<c:when test="#{!viewSmApplBackingBean.managedBean.supplierUser}">
							<c:if
								test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 9}">
								<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step10ViewSiteVisitInfo.xhtml" />
							</c:if>
							<c:if
								test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 10}">
								<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step8ViewVirtualCertInfo.xhtml" />
							</c:if>
							<c:if
								test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 11}">
								<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step9ViewTrackingDiary.xhtml" />
							</c:if>
							<c:if
								test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 12}">
								<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step12POApproverDecisionRemark.xhtml" />
							</c:if>
						    <!-- #27565 BPKU: #28913 Start -->
							<c:if
								test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 13}">
								<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step13ViewBumiputeraApproverRemarks.xhtml" />
							</c:if>
						    <!-- #27565 BPKU: #28913 End -->
						
						</c:when>
						<c:otherwise>
							<c:if
								test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 9}">
								<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step8ViewVirtualCertInfo.xhtml" />
							</c:if>
							<c:if
								test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 10}">
								<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step9ViewTrackingDiary.xhtml" />
							</c:if>
						</c:otherwise>
					</c:choose>
				</ac:smPanel>
				</c:when>
				<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.SUPP_TYPE_BASIC}">
				<ac:smPanel id="tt">					
					<p:messages id="messages" showDetail="true" closable="false" showSummary="false" />
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 0}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step1ViewProfileSupplierInfo.xhtml" />
					</c:if>
					<c:choose>
					<c:when test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 1 and 
					  viewSmApplBackingBean.managedBean.smSupplier.businessType ne SupplierMgmtConst.smSupplierBusinessTypeIndividual}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step2ViewProfilePersonnelInfo.xhtml" />
					</c:when>
					<c:when test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 1 and 
					viewSmApplBackingBean.managedBean.smSupplier.businessType eq SupplierMgmtConst.smSupplierBusinessTypeIndividual}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step5ViewProfileCatalogueInfo.xhtml" />
					</c:when>
					</c:choose>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 2}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step3ViewProfileBankInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 3 and 
					viewSmApplBackingBean.managedBean.smSupplier.businessType ne SupplierMgmtConst.smSupplierBusinessTypeIndividual}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step4ViewProfileNatureOfBizInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 4 and 
					viewSmApplBackingBean.managedBean.smSupplier.businessType ne SupplierMgmtConst.smSupplierBusinessTypeIndividual}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step5ViewProfileCatalogueInfo.xhtml" />
					</c:if>
				</ac:smPanel>
				</c:when>	
				<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.SUPP_TYPE_GOVT_TO_GOVT}">
				<ac:smPanel id="tt">					
					<p:messages id="messages" showDetail="true" closable="false" showSummary="false" />
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 0}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step1ViewProfileSupplierInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 1}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step2ViewProfilePersonnelInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 2}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step3ViewProfileBankInfo.xhtml" />
					</c:if>
					<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveIndex eq 3}">
						<ui:include src="/xhtml/sm/revisionSmApplView/viewSupplierProfile/step5ViewProfileCatalogueInfo.xhtml" />
					</c:if>
				</ac:smPanel>
				</c:when>
				</c:choose>			
			</c:if>
		</p:outputPanel>
		<ac:disciplinaryActionHistory voList="#{viewApplHistoryBackingBean.managedBean.disciplineVOs}" />
	</ui:define>
		
</ui:composition>
