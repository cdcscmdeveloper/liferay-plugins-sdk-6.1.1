<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_viewBumiputeraApplicationHistory_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.supplier.bumi.application.history']}");			
		</script>
		<h:outputStylesheet>
		.ui-datatable .ui-datatable-header {
		    text-align: right;
   		   background: unset;
           border: 0px none;
           font-size: 100%;
    	font-family: inherit;
		}
		</h:outputStylesheet>
	</ui:define>
	
	<ui:param name="viewSuppProfileBackingBean" value="#{viewApplHistoryBackingBean}" />
	
	<ui:define name="contentSection">
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:messages id="messages" showDetail="true" closable="true" showSummary="false" />
		
		<p:panel header="#{lbl['lbl.sm.search.supp.bumi.appl.history']}" toggleable="true" id="searchSupplierProfilePanelId">
			<ui:include src="/xhtml/sm/shared/applViewOnlyPages/supplierBumiApplicationHistorySearchCriteria.xhtml" />
		</p:panel>
		
		<p:panel header="#{lbl['lbl.sm.results']}" toggleable="true" id="resultSupplierProfilePanelId">
			<p:dataTable var="smAppl" widgetVar="smApplWidgetVar"
				editable="false" lazy="true" rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{viewSuppProfileBackingBean.managedBean.smSupplierDataModel}"
				rowKey="#{smAppl}" rowIndexVar="index" id="supplierApplHistoryDtId" >
				
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.row.total']}: #{viewSuppProfileBackingBean.managedBean.smSupplierDataModel.getRowCount()}" />
				</f:facet>
				
				<ac:paginator for="supplierApplHistoryDtId" />
				
				<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sm.row.no']}" />
						</f:facet>
						<h:outputText value="#{index + 1}"/>
						
				</p:column>
				<p:column headerText="#{lbl['lbl.rpt.supplierType']}">
					<h:outputText value="#{lbl['lbl.sm.contractor']}" rendered="#{smAppl[2] eq 'K'}"/>
					<h:outputText value="#{lbl['lbl.sm.consultant']}" rendered="#{smAppl[2] eq 'J'}"/>
					<h:outputText value="#{lbl['lbl.sm.basic']}" rendered="#{smAppl[2] ne 'K' and smAppl[2] ne 'J'}"/>
				</p:column>
				
				<p:column headerText="#{viewSuppProfileBackingBean.managedBean.searchAccountType eq SupplierManagementConst.SUPP_TYPE_GOVT_TO_GOVT ? lbl['lbl.sm.agency.name'] : lbl['lbl.sm.companyname']}" style="width :25%;white-space : normal" 
					rendered="#{!viewSuppProfileBackingBean.managedBean.supplierUser}">
					<h:outputText value="#{smAppl[3]}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.mofno']}">
					<h:outputText value="#{smAppl[8]}" rendered="#{not empty smAppl[8]}"/>
					<h:outputText value="#{viewSuppProfileBackingBean.managedBean.currMof.mofNo}" 
						rendered="#{empty smAppl[8] and not empty viewSuppProfileBackingBean.managedBean.currMof}"/>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty smAppl[8] and empty viewSuppProfileBackingBean.managedBean.currMof}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.epno']}">
					<h:outputText value="#{smAppl[9]}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.application.no']}">
					<h:outputText value="#{smAppl[0]}" rendered="#{not empty smAppl[0]}"/>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty smAppl[0]}"/>
				</p:column>
		
				<p:column headerText="#{lbl['lbl.sm.applicationtype']}" style="width :25%;white-space : normal">
					<h:outputText value="#{lbl['lbl.sm.appltype.basic']}" rendered="#{smAppl[1] eq 'O'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.newmof']}" rendered="#{smAppl[1] eq 'N'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.bumiputera']}" rendered="#{smAppl[1] eq 'B'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.categorycode']}" rendered="#{smAppl[1] eq 'A'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.updateprofile']}" rendered="#{smAppl[1] eq 'U'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.cancelmof']}" rendered="#{smAppl[1] eq 'C'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.renewmof']}" rendered="#{smAppl[1] eq 'R'}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.applicationstatus']}">
					<h:outputText value="#{viewSuppProfileBackingBean.getStatusDescription(smAppl)}" />
				</p:column>	
				
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						action="#{viewSuppProfileBackingBean.initSmApplByApplNo(smAppl[10],smAppl[6])}"
						process="@this" partialSubmit="true" update="@form"
						style="padding-right:5px;">
						<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
					</p:commandLink>
				</p:column>
				
			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
