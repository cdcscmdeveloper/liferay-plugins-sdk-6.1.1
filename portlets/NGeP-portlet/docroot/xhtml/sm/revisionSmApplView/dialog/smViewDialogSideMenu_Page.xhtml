<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
	<!-- <ac:smPanel id="smViewRevisionDlg"> -->
	<p:outputPanel id="smViewRevisionDlg" layout="block">
		<style type="text/css">
			.container-fluid{
				display:table !important;
				width: 100% !important;
			}
		</style>
	
		<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveDlg eq '0'}">
			<ui:include src="step1ViewDialog_CompanyInfo.xhtml" />
		</c:if>
		<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveDlg eq '1'}">
			<ui:include src="step2ViewDialog_BranchCompanyInfo.xhtml" />
		</c:if>
		<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveDlg eq '2'}">
			<ui:include src="step3ViewDialog_PersonnelInfo.xhtml" />
		</c:if>
		<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveDlg eq '3'}">
			<ui:include src="step4ViewDialog_CaptialAndEquityStatusInfo.xhtml" />
		</c:if>
		<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveDlg eq 'b'}">
			<ui:include src="step5ViewDialog_BankInfo.xhtml" />
		</c:if>
		<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveDlg eq '5'}">
			<ui:include src="step6ViewDialog_RegisterCategoryCodesInfo.xhtml" />
		</c:if>
		<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveDlg eq '6'}">
			<ui:include src="step7ViewDialog_SupportingDocumentsInfo.xhtml" />
		</c:if>
		<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveDlg eq '7'
					and viewSmApplBackingBean.managedBean.previousApproved}">
			<ui:include src="step8ViewDialogPoDecision.xhtml" />
		</c:if>
		<c:if test="#{viewSmApplBackingBean.managedBean.tabActiveDlg eq '8'
					and viewSmApplBackingBean.managedBean.previousApproved}">
			<ui:include src="step9ViewDialogApproverDecision.xhtml" />
		</c:if>
	</p:outputPanel>
</ui:composition>
