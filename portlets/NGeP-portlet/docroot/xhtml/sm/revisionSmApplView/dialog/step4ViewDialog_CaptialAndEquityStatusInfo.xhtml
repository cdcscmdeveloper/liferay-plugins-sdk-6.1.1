<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<c:choose>
	<c:when test="#{viewSmApplBackingBean.managedBean.redirectToPersonPage}">
		<ui:include src="/xhtml/sm/shared/applViewOnlyPages/captialShareHolderInfoRedirectFormViewOnly.xhtml" />
	</c:when><c:otherwise>
		
		<ui:include src="/xhtml/sm/shared/applViewOnlyPages/captialOrEquityStatusInfoFormViewOnly.xhtml" />
		<c:if test="#{viewSmApplBackingBean.managedBean.businessTypeVal 
			ne SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROS_DEFAULT}">
			<ui:include 
				src="/xhtml/sm/shared/applViewOnlyPages/captialOrEquityShareHolderInfoFormViewOnly.xhtml" />
			<c:if test="#{viewSmApplBackingBean.managedBean.businessTypeVal 
					eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_DEFAULT or 
					viewSmApplBackingBean.managedBean.businessTypeVal 
					eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_LLP_DEFAULT}">
				<ui:include 
					src="/xhtml/sm/shared/applViewOnlyPages/dlg/captialOrEquityShareHoldingCompanyInfoFormViewOnly.xhtml"/>
			</c:if>
		</c:if>
	</c:otherwise>
	</c:choose>
</ui:composition>
