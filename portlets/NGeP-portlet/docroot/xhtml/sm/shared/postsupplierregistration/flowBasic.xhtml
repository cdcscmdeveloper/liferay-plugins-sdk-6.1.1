<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:param name="supplierType" value="#{postSupplierRegBB.managedBean.smSupplier.businessType}" />
	<ui:param name="g2gType" value="#{postSupplierRegBB.getG2GBusinessType()}" />
	<ui:param name="step2" value="#{supplierType == g2gType ? '1' : '2'}"  />
	<ui:param name="step3" value="#{supplierType == g2gType ? '2' : '3'}" />

	<div class="flow-chartbox">
  	<div class="flow-chart">
	<c:if test="#{postSupplierRegBB.managedBean.flowStatus == 1}">
		<c:if test="#{supplierType != postSupplierRegBB.getG2GBusinessType()}">
		<div class="flow-chart-left flowActive">
			<div class="bg"><div class="no">1</div></div><p>
			<p:commandLink styleClass="current-link" value="#{lbl['lbl.sm.basic.catalogue.upload']}" 
			action="#{postSupplierRegBB.pageNavigate}" update="@form"/></p>
		</div>
		</c:if>
		
		<!-- #10729 start -->
		<div class="flow-chart-left flowInactive">
			<div class="bg"><div class="no">#{step2}</div></div><p style="top: 1px">#{lbl['lbl.sm.basic.softcert.request']}&#160;&#160;</p>
		</div>
		<!-- #10729 end -->
	</c:if>
	
	<c:if test="#{postSupplierRegBB.managedBean.flowStatus == 2}">
		<c:if test="#{supplierType != postSupplierRegBB.getG2GBusinessType()}">
		<div class="flow-chart-left flowInactive">
			<div class="bg"><div class="no">1</div></div><p>#{lbl['lbl.sm.basic.catalogue.upload']}</p>
		</div>
		</c:if>
		
		<!-- #10729 start -->
		<div class="flow-chart-left flowActive">
			<div class="bg"><div class="no">#{step2}</div></div><p style="top: 1px">
			<c:if test="#{(postSupplierRegBB.retrieveCurrentUserSoftCertStatus() == postSupplierRegBB.softCertProsseingStatus()) or 
				(postSupplierRegBB.retrieveCurrentUserSoftCertStatus() == postSupplierRegBB.softCertIsActiveStatus())}">
				#{lbl['lbl.sm.basic.softcert.request']}&#160;&#160;
			</c:if></p>
			
			<c:if test="#{(postSupplierRegBB.retrieveCurrentUserSoftCertStatus() != postSupplierRegBB.softCertProsseingStatus()) and 
						(postSupplierRegBB.retrieveCurrentUserSoftCertStatus() != postSupplierRegBB.softCertIsActiveStatus())}">
				<p style="top: 1px"><p:commandLink styleClass="current-link" value="#{lbl['lbl.sm.basic.softcert.request']}&#160;&#160;" 
				action="#{postSupplierRegBB.pageNavigate}" /></p>
			</c:if>

		</div>
		<!-- #10729 end -->
	</c:if>
	</div>
	</div>
</ui:composition>
