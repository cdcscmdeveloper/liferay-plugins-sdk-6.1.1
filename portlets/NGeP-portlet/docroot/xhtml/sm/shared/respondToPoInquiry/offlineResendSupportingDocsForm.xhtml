<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			function printDiv() {
				newWin = window.open();
	
				var divToPrint = document.getElementById('printArea');
				newWin.document.write(divToPrint.innerHTML);
	
				var style = newWin.document.createElement('style');
				style.type = 'text/css';
				style.innerHTML = '.ui-panel-title{font-family: Arial;margin: 0 0 0 5px !important;border: 0px !important;border-radius: 0px !important;background: none !important;color: #5BA218;font-size: 14px !important;font-weight: bold;}.ui-panel-titlebar{padding: 2px 0 3px 5px !important;background: none !important;height: 19px !important;border-radius: 0px;text-transform: uppercase;}.ui-outputlabel{display: inline-block;text-align: left !important;font-size: 12px;vertical-align: middle;padding: 0 10px 0 0;font-family: Arial;}table {border-collapse: collapse;border-spacing: 0;font-family: Tahoma;font-size: 11px;overflow: hidden;}.ui-datatable{font-family: Arial;color: #333333 !important;text-decoration: none;}.ui-datatable-tablewrapper{overflow: auto;}.ui-widget .ui-widget{font-size: 12px;}.ui-datatable th.ui-state-default{font-family: Arial;font-weight: bold !important;text-decoration: none;background: #F0EFEF;}thead>tr>th.ui-state-default{color: #555555 !important;font-size: 12px !important;text-align: left;}.ui-datatable thead th, .ui-datatable tbody td, .ui-datatable tfoot td{border: 1px solid #DDDDDD !important;}.ui-datatable thead th, .ui-datatable tbody td, .ui-datatable tfoot td{padding: 4px 10px;overflow: hidden;white-space: nowrap;border-width: 1px;border-style: solid;}.ui-state-default{text-shadow: none !important;box-shadow: none !important;}';
				newWin.document.getElementsByTagName('head')[0].appendChild(style);
	
				newWin.print();
				newWin.close();
			}
		</script>
	</ui:define>


	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:messages id="messages" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" />
		<table style="width: 100%">
			<tr>
				<td></td>
				<td>
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="#{lbl['lbl.sm.button.resubmit']}" disabled="#{!backingBean.managedBean.claimTask}"
							action="#{backingBean.resubmitSmApplInquiryToBpm(backingBean.managedBean.smAppl.applType)}"
							style="margin-bottom:5px;" />
						<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}" action="#{backingBean.onClickClaimButton}" update="@form" process="@this"
							rendered="#{!backingBean.managedBean.claimTask}" onclick="blockWidget.show()" oncomplete="blockWidget.hide()">
							<f:param name="taskId" value="#{backingBean.managedBean.taskId}" />
						</p:commandButton>
					</div>
				</td>
			</tr>
		</table>
		
		<div id="printArea">
		<p:panel
			header="#{lbl['lbl.sm.suppDoc.offline.checklist.application.no']} #{backingBean.managedBean.smAppl.applNo}">
			<br />
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel style="float:left"
							value="#{lbl['lbl.sm.suppDoc.offline.note1']}" /> <br /> <p:outputLabel
							style="float:left" value="#{lbl['lbl.sm.suppDoc.offline.note2']}" />
						<br /> <p:outputLabel style="float:left"
							value="#{lbl['lbl.sm.suppDoc.offline.note3']}" /> <br /></td>

				</tr>
			</table>
			<p:spacer height="10px" />
			<table style="width: 100%;">
				<tr>
					<td style="width: 33%">
						<table>
							<tr>
								<td><h:outputText style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.peninAddr1']}"
										escape="false" /></td>
							</tr>
							<tr>
								<td style="padding-top: 10px;"><h:outputText
										style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.peninAddr2']}"
										escape="false" /></td>
							</tr>
						</table>
					</td>

					<td style="width: 33%"><table>
							<tr>
								<td><h:outputText style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr1']}"
										escape="false" /></td>
							</tr>
							<tr>
								<td style="padding-top: 10px;"><h:outputText
										style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr2']}"
										escape="false" /></td>
							</tr>
						</table></td>
					<td style="width: 33%"><table>
							<tr>
								<td><h:outputText style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr1']}"
										escape="false" /></td>
							</tr>
							<tr>
								<td style="padding-top: 10px;"><h:outputText
										style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr2']}"
										escape="false" /></td>
							</tr>
						</table></td>
				</tr>
			</table>
			<p:spacer height="10px" />

			<p:dataTable var="table" id="offSdList"
				value="#{backingBean.managedBean.missinDocs}">
				<ac:paginator for="offSdList" />

				<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" style="width : 70%;">
					<p:outputLabel value="#{table.pmDocument.docName}"
						rendered="#{table.verifiedFlg != 1}"
						style="float: left;white-space: normal;" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.sectionPoRmrk']}" style="width : 30%;">
					<p:inputTextarea value="#{table.poRemarks}" readonly="true"
						disabled="true" rendered="#{table.verifiedFlg != 1}" />
				</p:column>

			</p:dataTable>

			<br />
			<p:spacer height="2px;" />

		</p:panel>
		</div>
		
		<div align="right">
			<h:commandButton value="#{lbl['lbl.sm.printList']}"
				onclick="printDiv();" type="button" styleClass="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-only">
			</h:commandButton>
		</div>
	</ui:define>
</ui:composition>
