<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_MOFApplication_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					"#{lbl['lbl.sm.review.application']}");
		</script>
	</ui:define>


	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:messages id="messages" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" />
			
		
		<p:dialog id="docCheckListDlg" widgetVar="docCheckListDlg" modal="true"
			dynamic="true" resizable="false" width="900px"
			height="700px" styleClass="pop_up_top" 
			header="#{lbl['lbl.sm.printchecklist.header']}">
			<p:media value="#{backingBean.getOfflineSuppDocCheckList()}" 
				width="100%" height="700px" player="pdf" />
			<p:panelGrid styleClass="noBorders tr,noBorders td" >
				<p:row>
					<p:column width="100%" style="text-align:right">
						<p:commandButton value="#{lbl['lbl.btn.close']}"
							onclick="docCheckListDlg.hide()" />
					</p:column>
				</p:row>
			</p:panelGrid>
		</p:dialog>
		
		<table style="width: 100%">
			<tr>
				<td></td>
				<td>
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="#{lbl['lbl.sm.button.resubmit']}" disabled="#{!backingBean.managedBean.claimTask}"
							onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
							action="#{backingBean.resubmitSmApplInquiryToBpm(backingBean.managedBean.smAppl.applType)}"
							style="margin-bottom:5px;" />
						<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}" action="#{backingBean.onClickClaimButton}" update="@form" process="@this"
							rendered="#{!backingBean.managedBean.claimTask}" onclick="blockWidget.show()" oncomplete="blockWidget.hide()">
							<f:param name="taskId" value="#{backingBean.managedBean.taskId}" />
						</p:commandButton>
					</div>
				</td>
			</tr>
		</table>
		
		
		<p:panel
			header="#{lbl['lbl.sm.suppDoc.offline.checklist.application.no']} #{backingBean.managedBean.smAppl.applNo}">
			<br />
			<table style="width: 100%;">
				<tr>
					<td>
						<h:outputText style="font-weight: bold !important;" value="#{lbl['lbl.sm.suppDoc.offline.note1']}" /> <br /> 
						<h:outputText style="font-weight: bold !important;" value="#{lbl['lbl.sm.suppDoc.offline.note2']}" /><br /> 
						<h:outputText style="font-weight: bold !important;" value="#{lbl['lbl.sm.suppDoc.offline.note3']}" /> <br />
					</td>
					<td>
						<div align="right">
							<p:commandLink action="#{backingBean.printSupplierRespondPoInquiry}" update="@form"
							   onstart="blockWidget.show()" oncomplete="blockWidget.hide()" process="@this">
								<p:graphicImage value="/css/images/design/print.png"
											style="margin-right:2px;" title="#{lbl['lbl.sm.printList']}"/>
							</p:commandLink>
						</div>
					</td>
				</tr>
			</table>
			<p:spacer height="10px" />
			<table style="width: 100%;">
				<tr>
					<td style="width: 33%">
						<table>
							<tr>
								<td><h:outputText style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.peninAddr1']}"
										escape="false" /></td>
							</tr>
							<tr>
								<td style="padding-top: 10px;"><h:outputText
										style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.peninAddr2']}"
										escape="false" /></td>
							</tr>
						</table>
					</td>

					<td style="width: 33%"><table>
							<tr>
								<td><h:outputText style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr1']}"
										escape="false" /></td>
							</tr>
							<tr>
								<td style="padding-top: 10px;"><h:outputText
										style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr2']}"
										escape="false" /></td>
							</tr>
						</table></td>
					<td style="width: 33%"><table>
							<tr>
								<td><h:outputText style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr1']}"
										escape="false" /></td>
							</tr>
							<tr>
								<td style="padding-top: 10px;"><h:outputText
										style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr2']}"
										escape="false" /></td>
							</tr>
						</table></td>
				</tr>
			</table>
			<p:spacer height="10px" />

			<p:dataTable var="table" id="offSdList"
				value="#{backingBean.managedBean.missinDocs}">
				<ac:paginator for="offSdList" />

				<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" style="width : 70%;">
					<h:outputText value="#{table.pmDocument.docName}" style="float: left;white-space: normal;" 
						rendered="#{table.verifiedFlg != 1}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.sectionPoRmrk']}" style="width : 30%;">
					<h:outputText value="#{table.poRemarks}" style="float: left;white-space: normal;" 
						rendered="#{table.verifiedFlg != 1}" />
				</p:column>

			</p:dataTable>

			<br />
			<p:spacer height="2px;" />

		</p:panel>
	</ui:define>
</ui:composition>
