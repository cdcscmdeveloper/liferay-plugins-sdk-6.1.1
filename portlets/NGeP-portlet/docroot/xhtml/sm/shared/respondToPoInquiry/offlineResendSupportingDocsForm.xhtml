<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">

	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" />
		<table style="width: 100%">
			<tr>
				<td></td>
				<td>
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="Re Submit"
							action="#{backingBean.resubmitSmApplInquiryToBpm(backingBean.managedBean.smAppl.applType)}"
							style="margin-bottom:5px;" />
					</div>
				</td>
			</tr>
		</table>
		<p:panel
			header=" Supporting Document Offline Check List - Application No. - #{backingBean.managedBean.smAppl.applNo}">
			<br />
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel style="float:left"
							value="#{lbl['lbl.sm.suppDoc.offline.note1']}" /> <br /> <p:outputLabel
							style="float:left" value="#{lbl['lbl.sm.suppDoc.offline.note2']}" />
						<br /> <p:outputLabel style="float:left"
							value="#{lbl['lbl.sm.suppDoc.offline.note3']}" /> <br /></td>

				</tr>
			</table>
			<p:spacer height="10px" />
			<table style="width: 100%;">
				<tr>
					<td style="width: 33%">
						<table>
							<tr>
								<td><p:outputLabel style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.peninAddr1']}"
										escape="false" /></td>
							</tr>
							<tr>
								<td style="padding-top: 10px;"><p:outputLabel
										style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.peninAddr2']}"
										escape="false" /></td>
							</tr>
						</table>
					</td>

					<td style="width: 33%"><table>
							<tr>
								<td><p:outputLabel style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr1']}"
										escape="false" /></td>
							</tr>
							<tr>
								<td style="padding-top: 10px;"><p:outputLabel
										style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr2']}"
										escape="false" /></td>
							</tr>
						</table></td>
					<td style="width: 33%"><table>
							<tr>
								<td><p:outputLabel style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr1']}"
										escape="false" /></td>
							</tr>
							<tr>
								<td style="padding-top: 10px;"><p:outputLabel
										style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr2']}"
										escape="false" /></td>
							</tr>
						</table></td>
				</tr>
			</table>
			<p:spacer height="10px" />

			<p:dataTable var="table" id="offSdList"
				value="#{backingBean.managedBean.smAppl.smApplSupportDocs}">
				<ac:paginator for="offSdList" />

				<p:column headerText="Document Description" style="width : 70%;">
					<p:outputLabel value="#{table.pmDocument.docName}"
						rendered="#{table.verifiedFlg != 1}"
						style="float: left;white-space: normal;" />
				</p:column>

				<p:column headerText="PO Remarks" style="width : 30%;">
					<p:inputTextarea value="#{table.poRemarks}" readonly="true"
						disabled="true" rendered="#{table.verifiedFlg != 1}" />
				</p:column>

			</p:dataTable>

			<br />
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.printList']}">
					<p:printer target=":form:tt:offSdList" />
				</p:commandButton>
			</div>

		</p:panel>
	</ui:define>
</ui:composition>
