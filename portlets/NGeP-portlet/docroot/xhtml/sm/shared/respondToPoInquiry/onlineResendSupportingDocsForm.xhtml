<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_MOFApplication_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					"#{lbl['lbl.sm.review.application']}");
		</script>
	</ui:define>


	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:messages id="messages" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" />
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.unclaim.task.submit.msg']}" rendered="#{!backingBean.managedBean.claimTask}"/><br />
		<table style="width: 100%">
			<tr>
				<td></td>
				<td>
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="#{lbl['lbl.sm.button.resubmit']}" disabled="#{!backingBean.managedBean.claimTask}"
							onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
							action="#{backingBean.resubmitSmApplInquiryToBpm(backingBean.managedBean.smAppl.applType)}"
							style="margin-bottom:5px;" />
						<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}" action="#{backingBean.onClickClaimButton}" update="@form" process="@this"
							rendered="#{!backingBean.managedBean.claimTask}" onclick="blockWidget.show()" oncomplete="blockWidget.hide()">
							<f:param name="taskId" value="#{backingBean.managedBean.taskId}" />
						</p:commandButton>
					</div>
				</td>
			</tr>
		</table>
		<p:panel
			header="#{lbl['lbl.sm.suppDoc.online.checklist.application.no']} #{backingBean.managedBean.smAppl.applNo}"
			id="onSupTblPan">
			<br />
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel style="float:left"
							value="#{lbl['lbl.sm.suppDoc.online.notes']}" escape="false" /></td>
				</tr>
			</table>
			<p:spacer height="10px" />

			<p:dataTable var="table" id="onSdList"
				value="#{backingBean.managedBean.missinDocs}">
				<ac:paginator for="onSdList" />

				<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
					style="width : 60%;">
					<h:outputText value="#{table.pmDocument.docName}" 
						style="float: left;white-space: normal;" 
						rendered="#{table.verifiedFlg != 1}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.sectionPoRmrk']}"
					style="width : 20%;">
					<h:outputText value="#{table.poRemarks}" 
						style="float: left;white-space: normal;" 
						rendered="#{table.verifiedFlg != 1}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.btn.upload.doc']}"
					style="width : 10%;">
					<p:commandLink oncomplete="attachDlg1.show();return false;"
						process="@this" partialSubmit="true" disabled="#{!backingBean.managedBean.claimTask}"
						action="#{backingBean.assignSelectedSupportDoc(table)}"
						rendered="#{table.verifiedFlg != 1}">
						<p:graphicImage value="/css/images/design/upload.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.suppDoc.added.document.name']}"
					style="width : 10%;">
					<h:outputText value="#{table.smApplDocFiles[0].fileName}"
						rendered="#{table.verifiedFlg != 1}"
						style="float: left;white-space: normal;" />
				</p:column>
			</p:dataTable>

		</p:panel>
		<p:dialog id="attachDlg1" widgetVar="attachDlg1" modal="true"
			dynamic="true" resizable="false" width="700px" height="200"
			styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
			<p:fileUpload allowTypes="/(\.|\/)(pdf|doc|docx)$/"
				sizeLimit="#{SupplierManagementConst.SM_SUPPORTDOCS_FILE_SIZE_LIMIT}"
				invalidFileMessage="#{lbl['lbl.sm.upload.format.errmsg']}"
				invalidSizeMessage="#{lbl['lbl.sm.upload.fileSize.exceed20Mb']}"
				fileUploadListener="#{backingBean.handleResubmitSupDocFileAttachment}"
				update="onSdList" oncomplete="attachDlg1.hide();" 
				uploadLabel="#{lbl['lbl.btn.upload']}"  
				label="#{lbl['lbl.btn.choose']}" 
				cancelLabel="#{lbl['lbl.btn.cancel']}" />
		</p:dialog>
	</ui:define>
</ui:composition>
