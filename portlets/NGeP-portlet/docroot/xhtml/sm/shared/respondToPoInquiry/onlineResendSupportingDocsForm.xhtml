<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">

	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" />
		<table style="width: 100%">
			<tr>
				<td></td>
				<td>
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="#{lbl['lbl.sm.button.resubmit']}"
							action="#{backingBean.resubmitSmApplInquiryToBpm(backingBean.managedBean.smAppl.applType)}"
							style="margin-bottom:5px;" />
					</div>
				</td>
			</tr>
		</table>
		<p:panel
			header="#{lbl['lbl.sm.suppDoc.online.checklist.application.no']} #{backingBean.managedBean.smAppl.applNo}"
			id="onSupTblPan">
			<br />
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel style="float:left"
							value="#{lbl['lbl.sm.suppDoc.online.notes']}" escape="false" /></td>
				</tr>
			</table>
			<p:spacer height="10px" />

			<p:dataTable var="table" id="onSdList"
				value="#{backingBean.managedBean.missinDocs}">
				<ac:paginator for="onSdList" />

				<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" style="width : 60%;">
					<p:outputLabel value="#{table.pmDocument.docName}"
						rendered="#{table.verifiedFlg != 1}"
						style="float: left;white-space: normal;" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.sectionPoRmrk']}" style="width : 20%;">
					<p:inputTextarea value="#{table.poRemarks}" readonly="true"
						disabled="true" rendered="#{table.verifiedFlg != 1}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.btn.upload.doc']}" style="width : 10%;">
					<p:commandLink oncomplete="attachDlg1.show();return false;"
						action="#{backingBean.assignSelectedSupportDoc(table)}"
						rendered="#{table.verifiedFlg != 1}">
						<p:graphicImage library="ep/images/design" name="upload.png"
							value="/resources/ep/images/design/upload.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.suppDoc.added.document.name']}" style="width : 10%;">
					<p:outputLabel value="#{table.smApplDocFiles[0].fileName}"
						rendered="#{table.verifiedFlg != 1}"
						style="float: left;white-space: normal;" />
				</p:column>
			</p:dataTable>

		</p:panel>
		<p:dialog id="attachDlg1" widgetVar="attachDlg1" modal="true"
			dynamic="true" resizable="false" width="700px" height="200"
			styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
			<p:fileUpload allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|pdf|doc|docx)$/"
				invalidFileMessage="Only JPG, GIF, PNG, BMP, PDF, DOC files are accepted"
				fileUploadListener="#{backingBean.handleSupDocFileAttachment}"
				update="onSdList" oncomplete="attachDlg1.hide();" />
		</p:dialog>
	</ui:define>
</ui:composition>
