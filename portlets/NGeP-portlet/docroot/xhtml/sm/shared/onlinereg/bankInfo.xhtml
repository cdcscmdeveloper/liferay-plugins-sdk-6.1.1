<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Bank Information">
		<table class="test">
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.bankname']}" /></td>
				<td><p:selectOneMenu value="#{registrationBackingBean.managedBean.smSuppBank.bankId}">
						<f:selectItem itemLabel="Select" itemValue="" />
						<f:selectItem itemLabel="CIMB" itemValue="1" />
					</p:selectOneMenu></td>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.bankaccnumber']}" /></td>
				<td><p:inputText value="#{registrationBackingBean.managedBean.smSuppBank.accountNo}"/></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
