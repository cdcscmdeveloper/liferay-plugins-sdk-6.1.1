	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Bank Information">
		<table class="customTbl">
			<tr>
				<td id="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.bankname']}" /></td>
				<td id="tdContent"><p:selectOneMenu >
						<f:selectItem itemLabel="Select" itemValue="" />
						<f:selectItem itemLabel="CIMB" itemValue="1" />
					</p:selectOneMenu></td>
				<td id="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.bankaccnumber']}" /></td>
				<td id="tdContent"><p:inputText /></td>
			</tr>
		</table>
	</p:panel>
