	<p:panel header="Bank Information" toggleable="true" id="pnlBankInfo">
		<p:dataTable var="bankInfo"
			value="#{registrationBackingBean.managedBean.smSuppBanks}"
			selection="#{registrationBackingBean.managedBean.selectedSuppBanks}"
			id="bankInfoId" rowKey="#{bankInfo}">

			<p:column selectionMode="multiple" style="width:2%" />
			<p:column headerText="Bank Name">
				<p:selectOneMenu value="#{bankInfo.pmFinancialOrg.financialOrgId}">
					<f:selectItem itemLabel="---Select---" itemValue="" />
					<f:selectItems
						value="#{registrationBackingBean.managedBean.financialOrgLs}"
						var="finOrg" itemValue="#{finOrg.financialOrgId}"
						itemLabel="#{finOrg.finOrgName}" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="Account Number">
				<p:inputText value="#{bankInfo.accountNo}" />
			</p:column>
		</p:dataTable>

		<div align="right">
			<p:commandButton value="Add"
				action="#{registrationBackingBean.addSupplierBank}"
				update="bankInfoId" />
			<p:commandButton value="Remove"
				action="#{registrationBackingBean.removeSupplierBank}"
				update="bankInfoId" />
		</div>
	</p:panel>
	<br />
</ui:composition>
