	<p:panel header="Bank Information" toggleable="true" id="pnlBankInfo">
		<p:dataTable var="bankInfo"
			value="#{registrationBackingBean.managedBean.smAppl.smSupplierBanks}">
			<p:column headerText="Bank Name">
				<p:selectOneMenu>
					<f:selectItem itemLabel="Select" itemValue="" />
					<f:selectItem itemLabel="CIMB" itemValue="1" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="Account Number">
				<p:inputText />
			</p:column>
		</p:dataTable>

		<div align="right">
			<p:commandButton value="Add"
				action="#{registrationBackingBean.addSupplierBank}"
				update="pnlBankInfo" />
			<p:commandButton value="Remove"
				action="#{registrationBackingBean.removeSupplierBank}"
				update="pnlBankInfo" />
		</div>
	</p:panel>
