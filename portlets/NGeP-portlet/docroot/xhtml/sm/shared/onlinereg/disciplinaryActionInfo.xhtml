<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.disciplinary.action.info.headerlbl']}" toggleable="true">
		<p:outputPanel>
			<h:outputText value="#{lbl['lbl.sm.disciplinary.click']}" escape="false"/>
			<p:commandLink onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				action="#{viewSuppProfileBackingBean.onViewDisciplinaryAction}"
				process="@this" partialSubmit="true" update=":form">
					<u><h:outputText value="#{lbl['lbl.sm.disciplinary.here']}" style="color:blue;" escape="false"/></u>
			</p:commandLink><p:spacer width="2"/>
			<h:outputText value="#{lbl['lbl.sm.disciplinary.to.view.history.disciplinary.action']}" escape="false"/><br />
			<p:spacer height="2"/>
		</p:outputPanel>
		<table style="width: 50%;table-layout:fixed">
			<tr>
				<td style="vertical-align: top;">
					<p:outputLabel value="#{lbl['lbl.sm.disciplinary.jktt.punishment.type']}" />
				</td>
				<td style="vertical-align: top;">
					<p:outputLabel rendered="#{registrationBackingBean.managedBean.noDisciplinary}"
						value="#{lbl['lbl.sm.no.available']}" styleClass="outputLabel-view"/>
					
					<p:outputLabel rendered="#{registrationBackingBean.managedBean.warning}" styleClass="outputLabel-view"
						value="#{lbl['lbl.sm.disciplinary.jktt.warning']}"/>
					<p:outputLabel rendered="#{registrationBackingBean.managedBean.suspendRegistration}" styleClass="outputLabel-view"
						value="#{lbl['lbl.sm.disciplinary.jktt.suspend.registration']}"/>
					<p:outputLabel rendered="#{registrationBackingBean.managedBean.cancelRegistration}" styleClass="outputLabel-view"
						value="#{lbl['lbl.sm.disciplinary.jktt.cancel.registration']}"/> 
					<!-- 38928 Start -->
					<p:outputLabel
						rendered="#{registrationBackingBean.managedBean.blacklistowner}"
						styleClass="outputLabel-view"
						value="#{lbl['lbl.sm.disciplinary.jktt.blacklist.owner']}" /> 
					<!-- 38928 End -->
					<!-- 30842 Start -->
					<p:outputLabel rendered="#{registrationBackingBean.managedBean.cancelCategory}" styleClass="outputLabel-view"
						value="#{lbl['lbl.sm.disciplinary.jktt.cancel.cat.code']}"/>
					<!-- 30842 End -->	
						
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.disciplinary.jktt.start.date']}" />
				</td>
				<td>
					<p:outputLabel rendered="#{registrationBackingBean.managedBean.noDisciplinary}"
						value="#{lbl['lbl.sm.no.available']}" styleClass="outputLabel-view"/>
					<p:outputLabel rendered="#{!registrationBackingBean.managedBean.noDisciplinary}"
						value="#{registrationBackingBean.managedBean.startDate}" styleClass="outputLabel-view"/>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.disciplinary.jktt.end.date']}" />
				</td>
				<td>
					<p:outputLabel rendered="#{registrationBackingBean.managedBean.noDisciplinary}"
						value="#{lbl['lbl.sm.no.available']}" styleClass="outputLabel-view"/>
					<p:outputLabel rendered="#{!registrationBackingBean.managedBean.noDisciplinary}"
						value="#{registrationBackingBean.managedBean.endDate}" styleClass="outputLabel-view"/>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.disciplinary.jktt.remarks']}" />
				</td>
				<td>
					<p:outputLabel rendered="#{registrationBackingBean.managedBean.noDisciplinary}"
						value="#{lbl['lbl.sm.no.available']}" styleClass="outputLabel-view"/>
					<p:outputLabel rendered="#{!registrationBackingBean.managedBean.noDisciplinary}"
						value="#{registrationBackingBean.managedBean.remarks}" styleClass="outputLabel-view"/>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.disciplinary.list.of.ic.no.blacklist']}" />
				</td>
				<td>
					<p:outputLabel rendered="#{empty registrationBackingBean.managedBean.blacklistownerDirectorList}"
						value="#{lbl['lbl.sm.no.available']}" styleClass="outputLabel-view"/>
					<p:outputLabel rendered="#{not empty registrationBackingBean.managedBean.blacklistownerDirectorList}" styleClass="outputLabel-view">
						<h:dataTable value="#{registrationBackingBean.managedBean.blacklistownerDirectorList}"
							var="blacklist" style="border: none !important;">
								<p:column style="border: none !important;">
									<h:outputText value="#{blacklist.icNo}"/>
								</p:column>
						</h:dataTable>
					</p:outputLabel>
				</td>
			</tr>
		</table>
	</p:panel>
	<!-- 30842 Start -->
	<ac:disciplinaryActionHistory mofView="false" voList="#{viewSuppProfileBackingBean.managedBean.disciplineVOs}" smAppl="#{registrationBackingBean.managedBean.smAppl}" />
	<!-- 30842 End -->
</ui:composition>
