<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.natureofbusiness']}" id="natureBusinessId" toggleable="true">
	
		<p:messages id="bnmsg" showDetail="true" autoUpdate="false" closable="true" showSummary="false" escape="false"/>
		
		<p:dataTable var="suppBizNature" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{registrationBackingBean.managedBean.smSupp.smSupplierBusinesses}"
			selection="#{registrationBackingBean.managedBean.selectedBusinessNatureLs}"
			id="suppBizNatureId" rowKey="#{suppBizNature}" rows="10">
			<ac:paginator for="suppBizNatureId" />
			<p:column selectionMode="multiple" style="width:2%" rendered="#{not empty registrationBackingBean.managedBean.smSupp.smSupplierBusinesses}" 
				disabledSelection="#{!registrationBackingBean.managedBean.smSupp.brandNew and registrationBackingBean.managedBean.smSupp.smSupplierBusinesses.size() le 1}" />
			<p:ajax event="rowSelectCheckbox" />

			<p:column>
				<f:facet name="header">
					<h:outputText value="*" styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sm.businessnature.code']}" />
					&#160;
					<p:graphicImage id="codeti" value="/css/images/design/tooltips.png" />
					<p:tooltip id="codett" for="codeti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.biz.nature.code']}" />
					</p:tooltip>
				</f:facet>
				<h:outputText value="#{registrationBackingBean.getBusinessNatureSection(suppBizNature)} - #{suppBizNature.pmBusinessNature.levelCode}" />
			</p:column>
			
			<p:column>
				<f:facet name="header">
					<h:outputText value="*" styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sm.natureofbusiness']}" />
					&#160;
					<p:graphicImage id="bnti" value="/css/images/design/tooltips.png" />
					<p:tooltip id="bntt" for="bnti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.biz.nature']}" />
					</p:tooltip>
				</f:facet>
				#{suppBizNature.pmBusinessNature.levelName}
			</p:column>
			<ui:remove>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.action']}" />
				</f:facet>
				<p:commandLink id="btnBizNatEdit" oncomplete="bizDlg.show();"
					action="#{registrationBackingBean.editBusinessNature(suppBizNature)}" update=":form:bizDialog" process="@this">
					<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}"/>
<!-- 					<f:setPropertyActionListener value="#{suppBizNature}"  -->
<!-- 						target="#{registrationBackingBean.managedBean.selectedBusinessNature}" /> -->
				</p:commandLink>
			</p:column>
			</ui:remove>
		</p:dataTable>

		<div align="right">
			<ui:remove>
			<p:commandButton id="btnAdd" value="#{lbl['lbl.btn.add']}" oncomplete="bizDlg.show();" process="@this"
				update="natureBusinessId,bizDialog"
				action="#{registrationBackingBean.addBusinessNature}" />
			</ui:remove>
			#{lbl['lbl.sm.payment.click']}
			<p:commandLink value="#{lbl['lbl.sm.payment.here']}" ajax="false" action="#{registrationBackingBean.downloadFile('/shared/SM/Piawaian_Klasifikasi_Industri_Malaysia_2008.pdf')}"></p:commandLink>
			#{lbl['lbl.sm.download.natureofbusiness']}
			
		    <ac:lov id="busiNatureId" lovId="PM_BUSINESS_NATURE"
				postUpdateListener="registrationBackingBean.postUpdateBizNature"
				headerText="Business Nature" buttonLabel="#{lbl['lbl.btn.add']}"
			    selectionMode="multiple"
				saveObject="registrationBackingBean.managedBean.bizNatures"
				conditionField="recordStatus^1|businessLevel^#{ParameterConst.businessNatureLevel}"
				update=":form:suppBizNatureId :form:bnmsg" />

			<p:commandButton id="btnRemove" update="natureBusinessId" partialSubmit="true" process="@this,suppBizNatureId"
				value="#{lbl['lbl.btn.delete']}"
				action="#{registrationBackingBean.removeBusinessNature}" />
		</div>
	</p:panel>

		<ui:remove>
		<p:dialog id="bizDialog" header="#{lbl['lbl.sm.natureofbusiness']}" widgetVar="bizDlg" styleClass="smBizDialog"
			modal="true" width="750" dynamic="true">
			<p:outputPanel header="Nature of Business" id="outPnlNatBiz">
			<p:messages id="businessNatureMsgId" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
				<table class="customTbl">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.businessnature.lvl1.section']}" /></td>
						<td>
							<p:selectOneMenu id="bizNatL1" style="width:600px;"
								value="#{registrationBackingBean.managedBean.selectedBusinessNature.lvl1}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{registrationBackingBean.managedBean.businessNatureL1}"
									var="bsNatureL1" itemValue="#{bsNatureL1.businessNatureId}"
									itemLabel="#{bsNatureL1.levelCode} - #{bsNatureL1.levelName}" />
								<p:ajax event="change"
									update="bizNatL2,bizNatL3,bizNatL4,bizNatL5,pnlBusinessNatureBtn"
									listener="#{registrationBackingBean.businessLvlOnChange('20')}" />
							</p:selectOneMenu></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.businessnature.lvl2.division']}" /></td>
						<td><p:selectOneMenu id="bizNatL2" style="width:600px;"
								value="#{registrationBackingBean.managedBean.selectedBusinessNature.lvl2}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{registrationBackingBean.managedBean.businessNatureL2}"
									var="bsNatureL2" itemValue="#{bsNatureL2.businessNatureId}"
									itemLabel="#{bsNatureL2.levelCode} - #{bsNatureL2.levelName}" />
								<p:ajax event="change" update="bizNatL3,bizNatL4,bizNatL5,pnlBusinessNatureBtn"
									listener="#{registrationBackingBean.businessLvlOnChange('30')}" />
							</p:selectOneMenu></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.businessnature.lvl3.group']}" /></td>
						<td><p:selectOneMenu id="bizNatL3" style="width:600px;"
								value="#{registrationBackingBean.managedBean.selectedBusinessNature.lvl3}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{registrationBackingBean.managedBean.businessNatureL3}"
									var="bsNatureL3" itemValue="#{bsNatureL3.businessNatureId}"
									itemLabel="#{bsNatureL3.levelCode} - #{bsNatureL3.levelName}" />
								<p:ajax event="change" update="bizNatL4,bizNatL5,pnlBusinessNatureBtn"
									listener="#{registrationBackingBean.businessLvlOnChange('40')}" />
							</p:selectOneMenu></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.businessnature.lvl4.class']}" /></td>
						<td><p:selectOneMenu id="bizNatL4" style="width:600px;"
								value="#{registrationBackingBean.managedBean.selectedBusinessNature.lvl4}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{registrationBackingBean.managedBean.businessNatureL4}"
									var="bsNatureL4" itemValue="#{bsNatureL4.businessNatureId}"
									itemLabel="#{bsNatureL4.levelCode} - #{bsNatureL4.levelName}" />
								<p:ajax event="change" update="bizNatL5,pnlBusinessNatureBtn"
									listener="#{registrationBackingBean.businessLvlOnChange('50')}" />
							</p:selectOneMenu></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.businessnature.lvl5.item']}" /></td>
						<td><p:selectOneMenu id="bizNatL5" style="width:600px;"
								value="#{registrationBackingBean.managedBean.selectedBusinessNature.lvl5}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{registrationBackingBean.managedBean.businessNatureL5}"
									var="bsNatureL5" itemValue="#{bsNatureL5.businessNatureId}"
									itemLabel="#{bsNatureL5.levelCode} - #{bsNatureL5.levelName}" />
								<p:ajax event="change" update="pnlBusinessNatureBtn" />
								
							</p:selectOneMenu></td>
					</tr>
				</table>
			</p:outputPanel>

			<p:outputPanel id="pnlBusinessNatureBtn">
			<div align="right">
				<c:choose>
					<c:when
						test="#{!registrationBackingBean.managedBean.selectedBusinessNature.pmBusinessNature.brandNew}">
						<p:commandButton id="btnBizAddSave" value="#{lbl['lbl.btn.save']}" immediate="true"
							disabled="#{registrationBackingBean.managedBean.selectedBusinessNature.lvl5 == null or registrationBackingBean.managedBean.selectedBusinessNature.lvl5 eq ''}" 
							update="natureBusinessId,suppBizNatureId,outPnlNatBiz" 
							action="#{registrationBackingBean.updateBusinessNature()}" />
					</c:when>

					<c:otherwise>
						<p:commandButton id="btnBizAddSave" value="#{lbl['lbl.btn.add']}" immediate="true"
							disabled="#{registrationBackingBean.managedBean.selectedBusinessNature.lvl5 == null or registrationBackingBean.managedBean.selectedBusinessNature.lvl5 eq ''}"
							update="natureBusinessId,outPnlNatBiz"
							action="#{registrationBackingBean.addSupplierBusinessNature}" />
					</c:otherwise>
					
				</c:choose>
			</div>
			</p:outputPanel>
		</p:dialog>
		</ui:remove>
		<ac:lovPopup />
</ui:composition>
