<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.prof.profbodyinformation']}" id="pnlProfCert"
		toggleable="true">
		<p:dataTable var="suppCert" id="profCertId"
			value="#{registrationBackingBean.managedBean.smAppl.smSupplierCerts}"
			selection="#{registrationBackingBean.managedBean.selectedSuppCerts}" rowKey="#{suppCert}">
			<!-- 				<ac:paginator for="dt" /> -->
			<p:column selectionMode="multiple" style="width:2%" />
			<p:column headerText="Certificate Name">
				<p:inputText value="#{suppCert.certName}" maxlength="50" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.prof.certificationbody']}">
				<p:selectOneMenu id="certBodyId" value="#{suppCert.pmCertBody.certBodyId}">
					<f:selectItems
						value="#{registrationBackingBean.managedBean.profCertBodyLs}"
						var="certBody" itemLabel="#{certBody.bodyName}"
						itemValue="#{certBody.certBodyId}" />
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.prof.startdate']}">
				<p:calendar value="#{suppCert.certStartDate}" id="startDateId"
					showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.prof.enddate']}">
				<p:calendar value="#{suppCert.certEndDate}" id="endDateId"
					showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.prof.rating']}">
				<p:inputText value="#{suppCert.certScore}" maxlength="30"/>
			</p:column>
		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}" immediate="true"
				action="#{registrationBackingBean.addProfessionalCert}"
				update="pnlProfCert" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" immediate="true"
				action="#{registrationBackingBean.removeProfessionalCert}"
				update="pnlProfCert" />
		</div>
	</p:panel>
</ui:composition>
