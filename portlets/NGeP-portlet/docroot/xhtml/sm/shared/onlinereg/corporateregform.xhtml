<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:include src="/xhtml/sm/shared/onlinereg/companyInfo.xhtml" />
	<ui:include src="/xhtml/sm/shared/onlinereg/bankInfo.xhtml" />

	<c:if
		test="#{registrationBackingBean.managedBean.smSupp.businessType == 'P'}">
		<p:panel header="Professional Body Information" id="pnlProfCert"
			toggleable="true">
			<p:dataTable var="suppCert" id="profCertDt"
				value="#{registrationBackingBean.managedBean.smSuppCerts}">
				<!-- 				<ac:paginator for="dt" /> -->
				<p:column headerText="Certificate Name">
					<p:inputText value="#{suppCert.certName}" />
				</p:column>

				<p:column headerText="Certification Body">
					<p:inputText value="#{suppCert.certBody}" />
				</p:column>

				<p:column headerText="Start Date">
					<p:calendar value="#{suppCert.certStartDate}" id="startDateId"
						showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</p:column>

				<p:column headerText="End Date">
					<p:calendar value="#{suppCert.certEndDate}" id="endDateId"
						showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</p:column>
			</p:dataTable>

			<div align="right">
				<p:commandButton value="Add"
					action="#{registrationBackingBean.addProfessionalCert}"
					update="pnlProfCert" />
				<p:commandButton value="Remove"
					action="#{registrationBackingBean.removeProfessionalCert}"
					update="pnlProfCert" />
			</div>
		</p:panel>
	</c:if>

	<c:if test="#{registrationBackingBean.managedBean.smSupp.brandNew}">
		<div class="nav-wrapper" align="justify">

				<p:commandButton value="Previous" style="float:left;"
					action="#{registrationBackingBean.returnToSignUp}" />

				<p:commandButton value="Next" style="float:right;"
					action="#{registrationBackingBean.proceedToFirstUserRegistration}" />
				<!-- 			<p:commandButton value="Ajax" update="pnlCompInfo"  validateClient="true" /> -->
		</div>
		<div style="clear: both;"></div>
	</c:if>
</ui:composition>
