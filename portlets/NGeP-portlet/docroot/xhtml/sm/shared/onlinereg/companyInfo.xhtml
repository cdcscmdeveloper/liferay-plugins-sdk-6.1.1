
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel header="Company Information">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.businessregno']}" /></td>
				<td><p:inputText
						value="#{registrationBackingBean.managedBean.smSupp.regNo}" /></td>

				<td><p:outputLabel value="Owner Name" /></td>
				<td><p:inputText
						value="#{registrationBackingBean.managedBean.smSuppOwner.ownerName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.identificationtype']}" /></td>
				<td><p:selectOneMenu id="cmbUsrIdenType"
						value="#{registrationBackingBean.managedBean.smSuppOwner.identificationType}">
						<f:selectItem itemLabel="Select" itemValue="" />
						<f:selectItem itemLabel="New NRIC" itemValue="I" />
						<f:selectItem itemLabel="Passport" itemValue="P" />
						<!-- <f:selectItem itemLabel="New NRIC" itemValue="0" />
							<f:selectItem itemLabel="Passport" itemValue="1" /> -->
					</p:selectOneMenu></td>

				<td><p:outputLabel value="#{lbl['lbl.sm.identificationno']}" /></td>
				<td><p:inputText id="txtIdNumber"
						value="#{registrationBackingBean.managedBean.smSuppOwner.identificationNo}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.companyname']}" /></td>
				<td><p:inputText value="#{registrationBackingBean.managedBean.smSupp.supplierName}" /></td>

				<td><p:outputLabel value="#{lbl['lbl.sm.estdate']}" /></td>
				<td><p:calendar id="cal" navigator="true" display="inline" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /></td>
				<td><p:selectOneMenu value="MY">
						<f:selectItem itemLabel="MY - Malaysia" itemValue="MY" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.companyaddress']}" /></td>
				<td id="tdContent" colspan="2"><p:inputText size="50"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address1}" /></td>

			</tr>

			<tr>
				<td></td>
				<td id="tdContent" colspan="2"><p:inputText size="50"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address2}" /></td>
			</tr>

			<tr>
				<td></td>
				<td id="tdContent" colspan="2"><p:inputText size="50"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address3}" /></td>
			</tr>

			<tr>
				<td></td>
				<td id="tdContent" colspan="2"><p:inputText size="50"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address4}" /></td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:inputText value="#{registrationBackingBean.managedBean.smBusinessAdd.postcode}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:inputText value="#{registrationBackingBean.managedBean.smBusinessAdd.stateId}"/></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
				<td><p:inputText value="#{registrationBackingBean.managedBean.smBusinessAdd.districtId}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:inputText value="#{registrationBackingBean.managedBean.smBusinessAdd.cityId}"/></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.telnumber']}" /></td>
				<td><p:inputText value="#{registrationBackingBean.managedBean.smBusinessAdd.phoneNo}" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxnumber']}" /></td>
				<td><p:inputText value="#{registrationBackingBean.managedBean.smBusinessAdd.faxNo}" /></td>
			</tr>
			<tr>

				<td>Nature of Business</td>
				<td id="tdContent" colspan="3">
				 <p:inputText  />
				<!-- <p:inputText value="#{registrationBackingBean.managedBean.smBusNature.businessNatureId}" /> -->
				
				</td>
			</tr>

		</table>
	</p:panel>
</ui:composition>
