
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel header="Company Information" toggleable="true">
		<table class="customTbl">
			<tr>
				<td id="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.businessregno']}" /></td>
				<td id="tdContent"><p:inputText
						value="#{registrationBackingBean.managedBean.smSupp.regNo}" disabled="#{!registrationBackingBean.managedBean.smSupp.brandNew}"/></td>

				<td id="tdTitle"><p:outputLabel value="* Owner Name" /></td>
				<td id="tdContent"><p:inputText
						value="#{registrationBackingBean.managedBean.smSuppOwner.ownerName}"   size="40"/></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.identificationtype']}" /></td>
				<td id="tdContent"><p:selectOneMenu id="cmbUsrIdenType"
						value="#{registrationBackingBean.managedBean.smSuppOwner.identificationType}">
						<f:selectItem itemLabel="Select" itemValue="" />
						<f:selectItem itemLabel="New NRIC" itemValue="I" />
						<f:selectItem itemLabel="Passport" itemValue="P" />
						<p:ajax event="change" update="txtIdNumber" listener="#{registrationBackingBean.suppOwnerIdTypeOnChange}" />
					</p:selectOneMenu></td>

				<td id="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.identificationno']}" /></td>
				<td id="tdContent"><p:inputMask id="txtIdNumber"
						value="#{registrationBackingBean.managedBean.smSuppOwner.identificationNo}"  size="40" mask="#{registrationBackingBean.managedBean.suppOwnerIdMask}"/></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.companyname']}" /></td>
				<td id="tdContent"><p:inputText value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.companyName}"  size="40" /></td>

				<td id="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.estdate']}" /></td>
				<td id="tdContent"><p:calendar id="cal" navigator="true" display="inline" showOn="button"/></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.country']}" /></td>
				<td id="tdContent"><p:selectOneMenu value="#{registrationBackingBean.managedBean.smBusinessAdd.pmCountry.countryId}">
						<f:selectItem itemValue="0" itemLabel="---Select---" />
						<f:selectItems  var="counLs" value="#{registrationBackingBean.managedBean.countryLs}" itemLabel="#{counLs.countryName}" itemValue="#{counLs.countryId}" />
						<p:ajax event="change" listener="#{registrationBackingBean.populateAddressByAddType('business')}" update="busState" />
					</p:selectOneMenu></td>
			</tr>
	
			<tr>
				<td id="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.companyaddress']}" /></td>
				<td id="tdContent" colspan="2"><p:inputText  size="40"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address1}" /></td>

			</tr>

			<tr>
				<td></td>
				<td id="tdContent" colspan="2"><p:inputText  size="40"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address2}" /></td>
			</tr>

			<tr>
				<td></td>
				<td id="tdContent" colspan="2"><p:inputText  size="40"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address3}" /></td>
			</tr>

			<tr>
				<td></td>
				<td id="tdContent" colspan="2"><p:inputText  size="40"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address4}" /></td>
			</tr>
			
			<tr>
				<td id="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.postcode']}" /></td>
				<td id="tdContent"><p:inputText value="#{registrationBackingBean.managedBean.smBusinessAdd.postcode}" size="40" maxlength="10"/></td>
				<td id="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.state']}" /></td>
				<td><p:selectOneMenu id="busState"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.pmState.stateId}">

						<f:selectItems var="state"
							value="#{registrationBackingBean.managedBean.businessStateLs}"
							itemValue="#{state.stateId}" itemLabel="#{state.stateName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateDistrictByAddType('business')}"
							update="busDistrict" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.district']}" /></td>
				 <td><p:selectOneMenu id="busDistrict"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.pmDistrict.districtId}">
						<f:selectItems var="dist"
							value="#{registrationBackingBean.managedBean.businessDistrictLs}"
							itemValue="#{dist.districtId}" itemLabel="#{dist.districtName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateCityByAddType('business')}"
							update="busCity" />
					</p:selectOneMenu></td>
				<td id="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.towncity']}" /></td>
				<td><p:selectOneMenu id="busCity"
								value="#{registrationBackingBean.managedBean.smBusinessAdd.pmCity.cityId}">
								<f:selectItems var="pcity"
									value="#{registrationBackingBean.managedBean.businessCityLs}"
									itemValue="#{pcity.cityId}" itemLabel="#{pcity.cityName}" />
							</p:selectOneMenu></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.telnumber']}" /></td>
				<td id="tdContent"><p:inputText value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.phoneNo}"  size="40" /></td>
				<td id="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.faxnumber']}" /></td>
				<td id="tdContent"><p:inputText value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.faxNo}"  size="40" /></td>
			</tr>
			<tr>

				<td id="tdTitle"><p:outputLabel value="* Nature of Business" /></td>
				<td id="tdContent" colspan="3">
				 <p:inputText  size="40" />
				</td>
			</tr>

		</table>
	</p:panel>
</ui:composition>
