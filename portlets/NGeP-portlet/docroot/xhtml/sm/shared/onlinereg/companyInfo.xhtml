<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Company Information" toggleable="true"
		id="pnlCompInfo">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.businessregno']}" /></td>
				<td class="tdContent"><p:inputText id="regNo"
						value="#{registrationBackingBean.managedBean.smSupp.regNo}"
						disabled="#{!registrationBackingBean.managedBean.smSupp.brandNew}"
						size="40" />
					&#160;
					<p:graphicImage id="regNoti" library="ep/images/design" name="tooltips.png" />
					<p:tooltip id="regNott" for="regNoti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.registration.no']}"  />
					</p:tooltip>
				</td>

				<td class="tdTitle"><p:outputLabel value="* Owner Name" /></td>
				<td class="tdContent"><p:inputText
						value="#{registrationBackingBean.managedBean.smSuppOwner.ownerName}"
						size="40" />
					&#160;
					<p:graphicImage id="ownNmti" library="ep/images/design" name="tooltips.png" />
					<p:tooltip id="ownNmtt" for="ownNmti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.owner.name']}"  />
					</p:tooltip>
				</td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.identificationtype']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbUsrIdenType"
						value="#{registrationBackingBean.managedBean.smSuppOwner.identificationType}"
						style="width:200px">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItem itemLabel="New NRIC" itemValue="I" />
						<f:selectItem itemLabel="Passport" itemValue="P" />
						<p:ajax event="change" update="txtIdNumber"
							listener="#{registrationBackingBean.suppOwnerIdTypeOnChange}" />
					</p:selectOneMenu></td>

				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.identificationno']}" /></td>
				<td class="tdContent"><p:inputMask id="txtIdNumber"
						value="#{registrationBackingBean.managedBean.smSuppOwner.identificationNo}"
						size="30"
						mask="#{registrationBackingBean.managedBean.suppOwnerIdMask}" />
					&#160;
					<p:graphicImage id="icti" library="ep/images/design" name="tooltips.png" />
					<p:tooltip id="ictt" for="icti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.owner.ic']}"  />
					</p:tooltip>
				</td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.companyname']}" /></td>
				<!-- 				<td class="tdContent"><p:inputText -->
				<!-- 						value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.companyName}" -->
				<!-- 						size="40" id="companyNameId" validatorMessage="Value does not match pattern." required="true"> -->
				<!-- 						<f:validateRegex pattern="[a-zA-Z\.\'\-_]{1,40}" /> -->
				<!-- 					</p:inputText> -->
				<td class="tdContent"><p:inputText
						value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.companyName}"
						size="40" id="companyNameId" /></td>

				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.estdate']}" /></td>
				<td class="tdContent"><p:calendar id="cal" navigator="true"
						value="#{registrationBackingBean.managedBean.smSupp.establishDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
						size="30" showOn="button" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.country']}" /></td>
				<td class="tdContent"><p:selectOneMenu
						value="#{registrationBackingBean.managedBean.smBusinessAdd.pmCountry.countryId}">
						<f:selectItem itemValue="0" itemLabel="---Select---" />
						<f:selectItems var="counLs"
							value="#{registrationBackingBean.managedBean.countryLs}"
							itemLabel="#{counLs.countryName}" itemValue="#{counLs.countryId}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateStateByAddType('business')}"
							update="busState" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.companyaddress']}" /></td>
				<td class="tdContent" colspan="2"><p:inputText size="40"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address1}" /></td>

			</tr>

			<tr>
				<td></td>
				<td class="tdContent" colspan="2"><p:inputText size="40"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address2}" /></td>
			</tr>

			<tr>
				<td></td>
				<td class="tdContent" colspan="2"><p:inputText size="40"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address3}" /></td>
			</tr>

			<tr>
				<td></td>
				<td class="tdContent" colspan="2"><p:inputText size="40"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address4}" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.postcode']}" /></td>
				<td class="tdContent"><p:inputText
						value="#{registrationBackingBean.managedBean.smBusinessAdd.postcode}"
						size="40" maxlength="10" /></td>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.state']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="busState"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.pmState.stateId}"
						style="width:250px">
						<f:selectItem itemValue="" itemLabel="---Select---" />
						<f:selectItems var="state"
							value="#{registrationBackingBean.managedBean.businessStateLs}"
							itemValue="#{state.stateId}" itemLabel="#{state.stateName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateDistrictByAddType('business')}"
							update="busDistrict" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.district']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="busDistrict"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.pmDistrict.districtId}"
						style="width:250px">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="dist"
							value="#{registrationBackingBean.managedBean.businessDistrictLs}"
							itemValue="#{dist.districtId}" itemLabel="#{dist.districtName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateCityByAddType('business')}"
							update="busCity" />
					</p:selectOneMenu></td>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.towncity']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="busCity"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.pmCity.cityId}"
						style="width:250px">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="pcity"
							value="#{registrationBackingBean.managedBean.businessCityLs}"
							itemValue="#{pcity.cityId}" itemLabel="#{pcity.cityName}" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.telnumber']}" /></td>
				<td class="tdContent"><p:inputText
						value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.phoneNo}"
						size="40" maxlength="14" /></td>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.faxnumber']}" /></td>
				<td class="tdContent"><p:inputText
						value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.faxNo}"
						size="40" maxlength="14" /></td>
			</tr>
			<!-- 			<tr> -->
			<!-- 				<td class="tdTitle"><p:outputLabel value="* Nature of Business" /></td> -->
			<!-- 				<td class="tdContent" colspan="3"><p:inputText size="40" /></td> -->
			<!-- 			</tr> -->
		</table>
	</p:panel>

	<ui:include src="/xhtml/sm/shared/onlinereg/businessNature.xhtml" />
</ui:composition>
