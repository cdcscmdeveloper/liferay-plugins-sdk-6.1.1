<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<h:outputScript library="js" name="smGstCalendar.js" />
	<script type="application/javascript">
		$(document).ready(function(e){
			  $("input[id$=compAdd1]").keydown(function(e){
				if(e.which==9 || e.keycode==9){
					$("input[id$=compAdd2]").focus();
					e.preventDefault();
				}
			  });
			  $("input[id$=compAdd2]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=compAdd3]").focus();
					e.preventDefault();
				} 
			  });
			  $("input[id$=compAdd3]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=compAdd4]").focus();
					e.preventDefault();
				} 
			  });
			  $("input[id$=compAdd4]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=compPostCodeMy]").focus();
					e.preventDefault();
				} 
			  });
			  $("input[id$=compPostCode]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=compCountryId_focus]").focus();
					e.preventDefault();
				} 
			  });
			  $("input[id$=compCountryId_focus]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=busState_focus]").focus();
					e.preventDefault();
				} 
			  });
			  $("input[id$=busState_focus]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=busDistrict_focus]").focus();
					e.preventDefault();
				} 
			  });
			  $("input[id$=busDistrict_focus]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=busCity_focus]").focus();
					e.preventDefault();
				} 
			  });
			  $("input[id$=busCity_focus]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=telNoId]").focus();
					e.preventDefault();
				} 
			  });
		});
			
	</script>
		
	<p:panel header="#{lbl['lbl.sm.companyinfo']}" toggleable="true" id="pnlCompInfo">
		<table class="customTbl">
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.businessregno']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				
				<td class="tdContent">
					<p:outputPanel id="regNoPanelId">
						<p:inputText id="regNo" required="#{!empty param['disableValidation']}" maxlength="30"
							value="#{registrationBackingBean.managedBean.smSupp.regNo}"
							disabled="#{!registrationBackingBean.managedBean.smSupp.brandNew}"
							size="40" label="#{lbl['lbl.sm.businessregno']}" >
							<p:ajax event="blur" update="regNoPanelId" listener="#{registrationBackingBean.removeRegNoWhiteSpace}" />
							<f:validator validatorId="busRegNoValidator" />
							</p:inputText>
						&#160;
						<p:graphicImage id="regNoti" value="/css/images/design/tooltips.png" />
						<p:tooltip id="regNott" for="regNoti">
							<p:outputLabel escape="false" value="#{lbl['tt.sm.registration.no']}"  />
						</p:tooltip>&#160;
						<p:message id="regNoMsg" for="regNo" display="icon" />
					</p:outputPanel>
				</td>
				
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.ownername']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td class="tdContent"><p:inputText id="ownerNameId" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.ownername']}"
						value="#{registrationBackingBean.managedBean.smSuppOwner.ownerName}"
						size="40" maxlength="50" disabled="#{!registrationBackingBean.managedBean.smSuppOwner.brandNew}"/>
					&#160;
					<p:graphicImage id="ownNmti" value="/css/images/design/tooltips.png" />
					<p:tooltip id="ownNmtt" for="ownNmti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.owner.name']}"  />
					</p:tooltip>
					<p:message id="ownerNameIdMsg" for="ownerNameId" display="icon" />
				</td>
			</tr>

			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.identificationtype']}" />	
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<p:selectOneMenu id="cmbUsrIdenType" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.identificationtype']}"
						value="#{registrationBackingBean.managedBean.smSuppOwner.identificationTypeId}"
						style="width:200px" disabled="#{!registrationBackingBean.managedBean.smSuppOwner.brandNew}">
						<f:selectItems value="#{registrationBackingBean.pmIdTypeDropdownValues()}" />
						<p:ajax event="change" update="txtIdNumber,pnlIdentLabel"
							listener="#{registrationBackingBean.suppOwnerIdTypeChange}" />
					</p:selectOneMenu>
					
					<p:message id="cmbUsrIdenTypeMsg" for="cmbUsrIdenType" display="icon" /></td>

				<td class="tdTitle">
					<p:outputPanel id="pnlIdentLabel">
					<c:choose>
							<c:when test="#{registrationBackingBean.managedBean.smSuppOwner.identificationType.parameterCode == SupplierManagementConst.NEW_IC}">
								<p:outputLabel value="#{lbl['lbl.sm.individual.newicno']}" />
							</c:when>
							<c:otherwise>
								<p:outputLabel value="#{lbl['lbl.sm.identificationno']}" />
							</c:otherwise>
					</c:choose>
					<p:outputLabel value="*" styleClass="mandatory" />
					</p:outputPanel>
				</td>
				<td class="tdContent">
					<c:choose>
						<c:when test="#{registrationBackingBean.managedBean.smSuppOwner.identificationType.parameterCode == SupplierManagementConst.NEW_IC}">
							<p:inputText id="txtIdNumber" required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.sm.identificationno']}"
								value="#{registrationBackingBean.managedBean.smSuppOwner.identificationNo}"
								size="30" maxlength="12" validatorMessage="#{lbl['lbl.sm.individual.newicno']} - #{lbl['lbl.sm.invalidIcNo']}"
								disabled="#{!registrationBackingBean.managedBean.smSuppOwner.brandNew}">
								<f:validateRegex pattern="[0-9]+" disabled="#{empty param['disableValidation']}" />
								<f:validateLength minimum="12" disabled="#{empty param['disableValidation']}"></f:validateLength>
							</p:inputText>
						</c:when>
						
						<c:otherwise>
							<p:inputText id="txtIdNumber" required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.sm.identificationno']}"
								value="#{registrationBackingBean.managedBean.smSuppOwner.identificationNo}"
								size="30" maxlength="15"
								disabled="#{!registrationBackingBean.managedBean.smSuppOwner.brandNew}">
								<p:ajax process="@this" partialSubmit="true" update="@this" listener="#{registrationBackingBean.trimOwnerPassportValue}"/>
							</p:inputText>
						</c:otherwise>
					</c:choose>
					
					&#160;
					<p:graphicImage id="icti" value="/css/images/design/tooltips.png" />
					<p:tooltip id="ictt" for="icti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.owner.ic']}"  />
					</p:tooltip>
					<p:message id="txtIdNumberMsg" for="txtIdNumber" display="icon" />
				</td>
			</tr>

			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.companyname']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:inputText required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.sm.companyname']}" maxlength="100"
						value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.companyName}"
						size="40" id="companyNameId"  
						disabled="#{registrationBackingBean.managedBean.disabledCompanyNameInMaintenance}" /> 
						<p:message id="companyNameIdMsg" for="companyNameId" display="icon" /></td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.estdate']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:calendar id="estDateCalId"
						navigator="true" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.estdate']}"
						value="#{registrationBackingBean.managedBean.smSupp.establishDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"  disabled="#{!registrationBackingBean.managedBean.smSupp.brandNew}"
						readonlyInput="true" size="30" showOn="button" yearRange="-99:+0" maxdate="#{CommonConstants.CURRENT_DATE}" />
					<p:message id="estDateCalIdMsg" for="estDateCalId" display="icon" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.incometaxno']}" /></td>
				<td class="tdContent"><p:inputText
						value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.incomeTaxNo}"
						size="40" id="incomeTaxId" maxlength="30" validatorMessage="#{lbl['lbl.sm.incometaxno']} is alphanumeric ">
							<f:validateRegex pattern="^[a-zA-Z0-9]*$" />
						</p:inputText>
				<p:message for="incomeTaxId" id="incomeTaxIdMsg" display="icon" /></td>
				<td></td>
			</tr>

			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.companyaddress']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent" >
					<p:inputText size="40"
						id="compAdd1" required="#{!empty param['disableValidation']}" maxlength="35"
						label="#{lbl['lbl.sm.companyaddress']}"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address1}">
						<p:ajax event="blur" update=":form:acgmap:gmapInput:gmapInput"></p:ajax>
					</p:inputText>
					<p:message id="compAdd1Msg" for="compAdd1" display="icon" /></td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.country']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:selectOneMenu id="compCountryId" disabled="#{registrationBackingBean.managedBean.sabahSarawakType}"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.country']}"  style="width:80%"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.pmCountry.countryId}">
						<f:selectItems var="counLs"
							value="#{registrationBackingBean.managedBean.countryLs}"
							itemLabel="#{counLs.countryName}" itemValue="#{counLs.countryId}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateStateByAddType('business',true)}"
							update="busState,busDistrict,busCity,compPostCodePanelId,:form:acgmap:gmapInput:gmapInput" />
					</p:selectOneMenu> <p:message id="compCountryIdMsg" for="compCountryId"
						display="icon" /></td>
			</tr>

			<tr>
				<td></td>
				<td class="tdContent"><p:inputText size="40"
						id="compAdd2" maxlength="35"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address2}" /></td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.state']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:selectOneMenu id="busState" disabled="#{registrationBackingBean.managedBean.sabahSarawakType}"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.state']}"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.pmState.stateId}"
						style="width:80%">
						<f:selectItem itemValue="" itemLabel="#{lbl['lbl.txt.select']}" />
						<f:selectItems var="state"
							value="#{registrationBackingBean.managedBean.businessStateLs}"
							itemValue="#{state.stateId}" itemLabel="#{state.stateName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateDistrictByAddType('business', true)}"
							update="busDistrict,busCity,:form:acgmap:gmapInput:gmapInput" />
					</p:selectOneMenu> <p:message id="busStateMsg" for="busState" display="icon" /></td>
			</tr>

			<tr>
				<td></td>
				<td class="tdContent"><p:inputText size="40"
						id="compAdd3" maxlength="35"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address3}" /></td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.district']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:selectOneMenu id="busDistrict"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.district']}"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.pmDistrict.districtId}"
						style="width:80%">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="dist"
							value="#{registrationBackingBean.managedBean.businessDistrictLs}"
							itemValue="#{dist.districtId}" itemLabel="#{dist.districtName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateCityByAddType('business',true)}"
							update="busCity,:form:acgmap:gmapInput:gmapInput,localAuthLabelOutPanelId,localAuthInputOutPanelId" />
					</p:selectOneMenu> <p:message id="busDistrictMsg" for="busDistrict" display="icon" /></td>
			</tr>

			<tr>
				<td></td>
				<td class="tdContent" ><p:inputText size="40"
						id="compAdd4" maxlength="35"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address4}" /></td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.towncity']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:selectOneMenu id="busCity"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.towncity']}"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.pmCity.cityId}"
						style="width:80%">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="pcity"
							value="#{registrationBackingBean.managedBean.businessCityLs}"
							itemValue="#{pcity.cityId}" itemLabel="#{pcity.cityName}" />
						<p:ajax event="change" update=":form:acgmap:gmapInput:gmapInput"></p:ajax>
					</p:selectOneMenu> <p:message id="busCityMsg" for="busCity" display="icon" /></td>
			</tr>

			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.postcode']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<p:outputPanel id="compPostCodePanelId">
						<p:outputPanel
							rendered="#{registrationBackingBean.managedBean.smBusinessAdd.pmCountry.countryId==registrationBackingBean.managedBean.myCountryId}">
							<p:inputText maxlength="5" required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.sm.postcode']}" id="compPostCodeMy"
								value="#{registrationBackingBean.managedBean.smBusinessAdd.postcode}"
								validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
								size="40">
								<f:validator validatorId="postcodeValidator" />
							</p:inputText>
							<p:message id="compPostCodeMyMsg" for="compPostCodeMy"
								showSummary="true" showDetail="false" display="icon" />
						</p:outputPanel>
						<p:outputPanel
							rendered="#{registrationBackingBean.managedBean.smBusinessAdd.pmCountry.countryId!=registrationBackingBean.managedBean.myCountryId}">
							<p:inputText maxlength="10" required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.sm.postcode']}" id="compPostCodeForeign"
								value="#{registrationBackingBean.managedBean.smBusinessAdd.postcode}"
								size="35">
							</p:inputText>
							<p:message id="compPostCodeForeignMsg"
								for="compPostCodeForeign" showSummary="true"
								showDetail="false" display="icon" />
						</p:outputPanel>
					</p:outputPanel>
				</td>
				<td class="tdTitle">
					<p:outputPanel id="localAuthLabelOutPanelId" 
						rendered="#{registrationBackingBean.managedBean.smSupp.businessType eq 'D' or registrationBackingBean.managedBean.smSupp.businessType eq 'E'
							or registrationBackingBean.managedBean.smSupp.businessType eq 'G' or registrationBackingBean.managedBean.smSupp.businessType eq 'H'}">
						<p:outputLabel value="#{lbl['lbl.sm.local.authority']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</p:outputPanel>
				</td>
				<td class="tdContent">
					<p:outputPanel id="localAuthInputOutPanelId" 
						rendered="#{registrationBackingBean.managedBean.smSupp.businessType eq 'D' or registrationBackingBean.managedBean.smSupp.businessType eq 'E'
							or registrationBackingBean.managedBean.smSupp.businessType eq 'G' or registrationBackingBean.managedBean.smSupp.businessType eq 'H'}">
						<ac:smLocalAuthoritySelectItems backingBean="#{registrationBackingBean}" 
							smSupplier="#{registrationBackingBean.managedBean.smSupp}" required="#{!empty param['disableValidation']}"/>
					</p:outputPanel>
				</td>
			</tr>
			
			<tr>
				<td></td>
				<td colspan="3">
					<SCRIPT type="text/javascript">
				      function getAddress() {
				    	  
				    	  var addr1 = document.getElementById('#{p:component(&quot;compAdd1&quot;)}').value + ',';
				    	  var addr2 = document.getElementById('#{p:component(&quot;compAdd2&quot;)}').value + ',';
				    	  var addr3 = document.getElementById('#{p:component(&quot;compAdd3&quot;)}').value + ',';
				    	  var addr4 = document.getElementById('#{p:component(&quot;compAdd4&quot;)}').value + ',';

				    	  var cityName = document.getElementById('#{p:component(&quot;busCity&quot;)}_input').options[document.getElementById('#{p:component(&quot;busCity&quot;)}_input').selectedIndex].text;
				    	  var districtName = document.getElementById('#{p:component(&quot;busDistrict&quot;)}_input').options[document.getElementById('#{p:component(&quot;busDistrict&quot;)}_input').selectedIndex].text;
				    	  var stateName = document.getElementById('#{p:component(&quot;busState&quot;)}_input').options[document.getElementById('#{p:component(&quot;busState&quot;)}_input').selectedIndex].text;
				    	  var countryName = document.getElementById('#{p:component(&quot;compCountryId&quot;)}_input').options[document.getElementById('#{p:component(&quot;compCountryId&quot;)}_input').selectedIndex].text;
				    	  
				    	  /*var cityName = '';
				    	  var districtName = '';
				    	  var stateName = '';
				    	  var countryName = '';
				    	  */
				    	  var address = addr1 + addr2 + addr3 + addr4 + cityName + ',' + districtName + ',' + stateName + ',' + countryName;

				      	return address;
				      }
				      </SCRIPT>
						
					<ac:gmap id="acgmap" 
						address="getAddress()"
						locationName="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.companyName}"
						latitude="#{registrationBackingBean.managedBean.smBusinessAdd.mapLatitude}"
						longitude="#{registrationBackingBean.managedBean.smBusinessAdd.mapLongitude}"
						disabled="#{registrationBackingBean.gmapDisabled}" />			
				</td>
			</tr>
						
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.telno']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<ac:phone id="telNoId" isMobile="false" label="#{lbl['lbl.sm.telno']}" required="#{!empty param['disableValidation']}"
						countryCode="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.phoneCountry}" 
						areaCode="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.phoneArea}" 
						number="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.phoneNo}"  
						validatorMessage="#{lbl['lbl.sm.telno']} - #{lbl['lbl.sm.invalidNo']}" /></td>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.faxno']}" />
				</td>
				<td class="tdContent">
					<ac:phone id="faxNoId" isMobile="false" label="#{lbl['lbl.sm.faxno']}"
						countryCode="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.faxCountry}" 
						areaCode="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.faxArea}" 
						number="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.faxNo}"  
						validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}" />
				</td>
			</tr>
			
			<c:if test="#{!registrationBackingBean.managedBean.smSupp.brandNew}">
				<ui:param name="gstSupplier" value="#{registrationBackingBean.managedBean.smGstSupplier}" />
				<tr>
						<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.gst.regno']}" /></td>
						<td class="tdContent"><p:inputText
								value="#{gstSupplier.gstRegNo}" disabled="true" size="40" /></td>
				</tr>
				
				<tr>
						<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.gst.effdate']}" /></td>
						<td class="tdContent">
							<p:inputText value="#{gstSupplier.gstEffDate}" disabled="true" size="40">
								<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</p:inputText>
						</td>
				</tr>
			</c:if>
		</table>
	</p:panel>
	
	<c:if test="#{registrationBackingBean.managedBean.smSupp.brandNew}">
		<ui:include src="/xhtml/sm/shared/onlinereg/gstInfo.xhtml" />
	</c:if>
	
	<ui:include src="/xhtml/sm/shared/onlinereg/businessNature.xhtml" />



</ui:composition>
