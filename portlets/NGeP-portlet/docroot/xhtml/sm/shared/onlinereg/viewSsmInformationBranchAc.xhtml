<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.viewSsm.branch.details']}" id="branchPanel"
		toggleable="true">

		<p:dataTable var="branchBean" id="dt"
			value="#{cc.attrs.bBean.managedBean.smSupplierBranchSsm}"
			rowKey="#{branchBean}" rowIndexVar="index"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			sortBy="#{branchBean.branchName}">
			<ac:paginator for="dt" />


			<p:column>
				<f:facet name="header">
					<div style="text-align: center;">
						<h:outputText value="#{lbl['lbl.sm.branch.address']}"></h:outputText>
					</div>
				</f:facet>
				<div style="text-align: left;">
				<h:outputText rendered="#{not empty branchBean.branchName}"
						value="#{branchBean.branchName}"
						converter="toUpperCaseConverter" /><br />
					<h:outputText rendered="#{not empty branchBean.smAddress.address1}"
						value="#{branchBean.smAddress.address1}"
						converter="toUpperCaseConverter" /><br />					
					<h:outputText rendered="#{not empty branchBean.smAddress.address2}"
						value="#{branchBean.smAddress.address2}" escape="false"
						converter="toUpperCaseConverter" /><br />
					<h:outputText rendered="#{not empty branchBean.smAddress.address3}"
						value="#{branchBean.smAddress.address3}" escape="false"
						converter="toUpperCaseConverter" /><br />
					<h:outputText rendered="#{not empty branchBean.smAddress.postcode}"
						value="#{branchBean.smAddress.postcode}"
						escape="false" converter="toUpperCaseConverter" /><br />
					<h:outputText
						rendered="#{not empty branchBean.smAddress.pmState.stateName}"
						value=" #{branchBean.smAddress.pmState.stateName}" escape="false"
						converter="toUpperCaseConverter" />
				</div>
			</p:column>
		</p:dataTable>

	</p:panel>

</ui:composition>
