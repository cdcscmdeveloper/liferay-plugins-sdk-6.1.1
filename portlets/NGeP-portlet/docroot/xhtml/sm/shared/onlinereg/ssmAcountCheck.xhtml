<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	
		<script type='text/javascript'>
			//var $jq = jQuery.noConflict(true);
		</script>
	
	</ui:define>

	<ui:define name="contentSection">
	
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>		

	    <p:messages id="messages" showSummary="false" showDetail="true"  escape="false" autoUpdate="true" closable="true" severity="error, info, warn" />
	
		
		<p:panel header="#{lbl['lbl.sm.account.info']}" toggleable="true">
		<table class="customTbl">
		<c:if test="#{registrationBackingBean.managedBean.smAppl.applType == SupplierManagementConst.ACC_MOF}">
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.mofsuppliertype']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent"><p:selectOneMenu id="suppTypeId" required="#{!empty param['disableValidation']}"
							value="#{registrationBackingBean.managedBean.smAppl.supplierType}"
							label="#{lbl['lbl.sm.mofsuppliertype']}" style="width:200px"
							disabled="#{!registrationBackingBean.managedBean.smSupp.brandNew or registrationBackingBean.managedBean.companyValidWithSSM}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}"
								itemValue="#{SupplierManagementConst.STYPE_CONTRACTOR}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}"
								itemValue="#{SupplierManagementConst.STYPE_CONSULTANT}" />
							<p:ajax event="change" update="busTypeId" process="@form" />
						</p:selectOneMenu>
						 &#160; <p:graphicImage id="mofsupp"
						value="/css/images/design/tooltips.png" /> <p:tooltip style="width:25%;"
						id="mofsupplier" for="mofsupp">
						<p:outputLabel escape="false"
							value="#{lbl['tt.sm.registration.business.mof.supplier.type']}" />
					</p:tooltip>&#160;
						<p:message id="suppTypeIdMsg" for="suppTypeId" display="icon" />						
						</td>						
					<td class="tdTitle"></td>
					<td class="tdContent"></td>
				</tr>
			</c:if>
			<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.businesscomptype']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td style="text-align:left;width:30%;word-wrap: break-word;">
						<p:selectOneMenu id="busTypeId" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.businesscomptype']}"
							value="#{registrationBackingBean.managedBean.smSupp.businessType}" 
							rendered="#{registrationBackingBean.managedBean.smAppl.brandNew or !registrationBackingBean.managedBean.disabledBusinessTypeInMaintenance}" 
							style="width:310px">
							<f:selectItems value="#{registrationBackingBean.pmBusinessTypeDropDown()}"/>
							<p:ajax event="change" listener="#{registrationBackingBean.pmStateDropdownValues}"  update="@form" process="@form" disabled="#{!registrationBackingBean.managedBean.smAppl.brandNew}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"></p:ajax>
						</p:selectOneMenu>
						<p:outputLabel styleClass="outputLabel-view" 
						value="#{registrationBackingBean.getParameterDesc(SupplierManagementConst.supplierBusinessType,registrationBackingBean.managedBean.smSupp.businessType)}" 
						rendered="#{registrationBackingBean.managedBean.disabledBusinessTypeInMaintenance}" />
						&#160;
						<p:graphicImage id="typeofbusiness" value="/css/images/design/tooltips.png" />
						<p:tooltip id="businesscomtype" for="typeofbusiness">
							<p:outputLabel escape="false" rendered="#{registrationBackingBean.managedBean.smAppl.applType eq SupplierManagementConst.ACC_BASIC}"
								value="#{lbl['tt.sm.registration.business.basic.company.type']}" />
							<p:outputLabel escape="false" rendered="#{registrationBackingBean.managedBean.smAppl.applType eq SupplierManagementConst.ACC_MOF}"
								value="#{lbl['tt.sm.registration.business.mof.company.type']}" />	
						</p:tooltip>&#160;					
						
					</td>
				 </tr>
				 <tr>
				 	<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.businessregno']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				
				<td class="tdContent">
					<p:outputPanel id="regNoPanelId">
						<p:inputText id="regNo" required="#{!empty param['disableValidation']}" maxlength="30"
							value="#{registrationBackingBean.managedBean.smSupp.regNo}" converter="toUpperCaseConverter"
							disabled="#{!registrationBackingBean.managedBean.smSupp.brandNew or registrationBackingBean.managedBean.companyValidWithSSM}"
							size="40" label="#{lbl['lbl.sm.businessregno']}" >
							<p:ajax event="blur" update="regNoPanelId" listener="#{registrationBackingBean.removeRegNoWhiteSpace}" />
							<f:validator validatorId="busRegNoValidator" />
							</p:inputText>
						&#160;
						<p:graphicImage id="regNoti" value="/css/images/design/tooltips.png" rendered="#{not empty registrationBackingBean.managedBean.smSupp.businessType and registrationBackingBean.managedBean.smSupp.businessType != SupplierManagementConst.INDIVIDUAL_FLAG}"/>
						<ui:param name="lblRegNoTlTip" value="tt.sm.business.type.#{registrationBackingBean.managedBean.smSupp.businessType}" />
						<c:choose>
							<c:when test="registrationBackingBean.businessTypeTovalidateWithSSM()">
								<p:tooltip id="regNott" for="regNoti" rendered="#{not empty registrationBackingBean.managedBean.smSupp.businessType and registrationBackingBean.managedBean.smSupp.businessType != SupplierManagementConst.INDIVIDUAL_FLAG}" >
							<p:outputLabel escape="false" value="#{lbl[lblRegNoTlTip]}"  />
						</p:tooltip>&#160;
							</c:when>
							<c:otherwise>
								<p:tooltip id="regNott" for="regNoti" rendered="#{not empty registrationBackingBean.managedBean.smSupp.businessType and registrationBackingBean.managedBean.smSupp.businessType != SupplierManagementConst.INDIVIDUAL_FLAG}" >
							<p:outputLabel escape="false" value="#{lbl[lblRegNoTlTip]}"  />
						</p:tooltip>&#160;
							</c:otherwise>
						</c:choose>
						
						
						<p:message id="regNoMsg" for="regNo" display="icon" />
					</p:outputPanel>
				</td>
				 </tr>
				 <c:if test="#{registrationBackingBean.businessTypeIsROB(registrationBackingBean.managedBean.smSupp.businessType)}">
					 <tr >
						<td class="tdTitle">
							<p:outputLabel value="#{lbl['lbl.sm.register.owner.newic']} #{registrationBackingBean.managedBean.applType == SupplierManagementConst.ACC_BASIC ? lbl['lbl.sm.register.mycardonly'] : ''}" />
							<p:outputLabel value="*" styleClass="mandatory" />
						</td>
						<td class="tdContent">
							<p:inputText maxlength="12" size="40" label="#{lbl['lbl.sm.register.owner.newic']}" value="#{registrationBackingBean.managedBean.regIcCheckSSM}"></p:inputText>
							<p:graphicImage id="noic" value="/css/images/design/tooltips.png" />
							<p:tooltip style="width:25%;" id="noictt" for="noic">
								<p:outputLabel escape="false" value="#{lbl['lbl.sm.register.owner.newic.tt']}" />
							</p:tooltip>
						</td>
					</tr>
				 </c:if>
				 <c:if test="#{registrationBackingBean.businessTypeIsROC(registrationBackingBean.managedBean.smSupp.businessType)}">
				 	<tr>
				 		<td class="tdTitle">
				 			<p:outputLabel value="#{lbl['lbl.sm.register.ownerdirector.newic']} #{registrationBackingBean.managedBean.applType == SupplierManagementConst.ACC_BASIC ? lbl['lbl.sm.register.mycardonly'] : ''}" />
				 			<p:outputLabel value="*" styleClass="mandatory" />
				 		</td>
				 		<td class="tdContent">
				 			<p:inputText maxlength="12" size="40" label="#{lbl['lbl.sm.register.ownerdirector.newic']}" value="#{registrationBackingBean.managedBean.regIcCheckSSM}"></p:inputText>
				 			<p:graphicImage id="noic" value="/css/images/design/tooltips.png" />
				 			<p:tooltip style="width:25%;" id="noictt" for="noic">
				 				<p:outputLabel escape="false" value="#{lbl['lbl.sm.register.ownerdirector.newic.tt']}" />
				 			</p:tooltip>
				 			<p:message id="noicMsg" for="noic" display="icon" />
				 		</td>
				 	</tr>
				 </c:if>
			</table>
		<!-- 35581 -->
		<div class="nav-wrapper" align="justify" >
			<p:commandButton id="btnNext" value="#{lbl['lbl.sm.next']}" 
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()" style="float:right;"
			disabled="#{registrationBackingBean.managedBean.applType == null}"
				action="#{registrationBackingBean.validateWithSSM}" update="@all" rendered="#{!registrationBackingBean.managedBean.companyValidWithSSM}"
				listener="#{registrationBackingBean.regNoValidity}"/>
		
			<p:commandButton value="#{lbl['lbl.sm.prev']}" style="float:left;"
			action="#{registrationBackingBean.returnToTermAndCondition}"
			rendered="#{!registrationBackingBean.managedBean.companyValidWithSSM}"
			>
			</p:commandButton>
		</div>
		
	</p:panel>	
	<p:panel id="ssmResult" header="#{lbl['lbl.sm.search.result']}" toggleable="true" rendered="#{registrationBackingBean.managedBean.companyValidWithSSM}">		
		<p:dataTable id="tableSucc" var="varSucc" rowIndexVar="index"
			value="#{registrationBackingBean.managedBean.dummy}" 
			widgetVar="tableOwnerWidget"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{rowKeyObj}">

			<p:column style="width:3%;" styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.no']}" />
				</f:facet>
				<h:outputText value="#{index + 1}" />
			</p:column>
			
			<p:column  styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.businessregno']}" />
				</f:facet>
				<h:outputText value="#{registrationBackingBean.managedBean.smSupp.regNo}" />
			</p:column>
			 
			<!-- #24819  -->
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.new.business.regNo']}" />
				</f:facet>
				<h:outputText value="#{registrationBackingBean.managedBean.smSupp.ssmNewRegNo}" 
					rendered ="#{!empty registrationBackingBean.managedBean.smSupp.ssmNewRegNo}"/> 
				<h:outputText value="#{lbl['lbl.sm.no.available']}" 
					rendered ="#{empty registrationBackingBean.managedBean.smSupp.ssmNewRegNo}" /> 
			</p:column>
			
			<p:column  styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.companyname']}" />
				</f:facet>
				<h:outputText value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.companyName}" />
			</p:column>
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.status']}" />
				</f:facet>
				<h:outputText value="#{registrationBackingBean.managedBean.statusDescFromSSM}" /> 
			
			</p:column>
			
			</p:dataTable>
		<div class="nav-wrapper" align="justify">
				<p:commandButton value="#{lbl['lbl.sm.prev']}" style="float:left;"
				action="#{registrationBackingBean.returnToTermAndCondition}">
				</p:commandButton>
			
				<p:commandButton id="btnProceed" value="#{lbl['lbl.sm.next']}"  style="float:right;"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()" rendered="#{(registrationBackingBean.managedBean.statusFromSSM == 'A' || registrationBackingBean.managedBean.statusFromSSM == 'E') and !registrationBackingBean.managedBean.hideButton}"			
				disabled="#{!registrationBackingBean.managedBean.agreeTC}" action="#{registrationBackingBean.proceedToCompanyInfo}"
				 />
				
				
			</div>
	</p:panel>
	
	</ui:define>
</ui:composition>
