<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	
	<p:panel header="#{lbl['lbl.sm.prof.profbodyinformation']}" id="pnlProfCert" toggleable="true">
		<p:dataTable var="suppAssocBody" id="profBodyId"
			value="#{registrationBackingBean.managedBean.smAppl.smAssociationBodies}"
			selection="#{registrationBackingBean.managedBean.selectedAssociationBodies}" rowKey="#{suppAssocBody}">
			<p:column selectionMode="multiple" style="width:2%" />

			<p:column>
				<f:facet name="header">
					<h:outputText value="*" styleClass="mandatory" />
					#{lbl['lbl.sm.profBody.profBody']}
				</f:facet>
				
				<p:selectOneMenu id="profBodyName" value="#{suppAssocBody.pmCertBody.certBodyId}" 
					required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.profBody.profBody']}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemDisabled="#{profBody.certBodyId == null}" />	
					<f:selectItems value="#{registrationBackingBean.managedBean.profCertBodyLs}"
						var="profBody" itemLabel="#{profBody.bodyName}" itemValue="#{profBody.certBodyId}" />
					<p:ajax event="change" update="profBodyId" />
				</p:selectOneMenu>
				<p:message id="profBodyNameMsg" for="profBodyName" display="icon" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.profBody.others']}">
				<p:inputText id="otherAssocId"  
				disabled="#{!registrationBackingBean.profBodyOnChange(suppAssocBody.pmCertBody)}"
				value="#{suppAssocBody.otherAssociation}" maxlength="200" label="#{lbl['lbl.sm.profBody.othersprofbody']}"
				required="#{registrationBackingBean.profBodyOnChange(suppAssocBody.pmCertBody) and !empty param['disableValidation']}"></p:inputText>
				<p:message id="otherAssocIdMsg" for="otherAssocId" display="icon" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.profBody.regNo']}">
				<p:inputText value="#{suppAssocBody.regNo}" id="assocBodyRegNoId" label="#{lbl['lbl.sm.profBody.regNo']}"
				required="#{!empty param['disableValidation']}" maxlength="30" />
				<p:message id="assocBodyRegNoMsg" for="assocBodyRegNoId" display="icon" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.prof.enddate']}">
				<p:calendar navigator="true" value="#{suppAssocBody.expDate}" id="assocBodyExpDateId" required="#{!empty param['disableValidation']}"
				label="#{lbl['lbl.sm.prof.enddate']}" showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" mindate="#{CommonConstants.THREE_MONTHS_LATER_DATE}"/>
				<p:message id="assocBodyExpDateMsg" for="assocBodyExpDateId" display="icon" />
			</p:column>
		</p:dataTable>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}" action="#{registrationBackingBean.addProfessionalBody}" update="pnlProfCert" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" action="#{registrationBackingBean.removeProfessionalBody}" update="pnlProfCert" />
		</div>
		
	</p:panel>
	
</ui:composition>
