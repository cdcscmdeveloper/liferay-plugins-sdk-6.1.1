<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="indBtnSubmit">
		<c:if test="#{registrationBackingBean.managedBean.smAppl.brandNew}">
			<c:if
				test="#{registrationBackingBean.managedBean.smSupp.businessType == SupplierManagementConst.INDIVIDUAL_FLAG}">
				<div align="right">
					<p:commandButton value="#{lbl['lbl.btn.submit']}" onstart="submissionDialog.show();" oncomplete="submissionDialog.hide();"
						action="#{registrationBackingBean.submitRegistration}" update="@([id$=Msg])">
							<f:param name="disableValidation" value="true" />
					</p:commandButton>
				</div>
				
				<p:dialog widgetVar="submissionDialog" modal="true" draggable="false"
					closable="false" resizable="false" showHeader="false">
					<p:graphicImage value="/css/images/ajax-loader.gif" />
				</p:dialog>
			</c:if>
		</c:if>
	</p:outputPanel>

	<p:panel header="#{lbl['lbl.sm.account.info']}" toggleable="true">
		<table class="customTbl">
			<c:if test="#{registrationBackingBean.managedBean.smAppl.applType == SupplierManagementConst.ACC_MOF}">
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.mofsuppliertype']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent"><p:selectOneMenu id="suppTypeId" required="#{!empty param['disableValidation']}"
							value="#{registrationBackingBean.managedBean.smAppl.supplierType}"
							label="#{lbl['lbl.sm.mofsuppliertype']}" style="width:200px"
							disabled="#{!registrationBackingBean.managedBean.smAppl.brandNew}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}"
								itemValue="#{SupplierManagementConst.STYPE_CONTRACTOR}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}"
								itemValue="#{SupplierManagementConst.STYPE_CONSULTANT}" />
							<p:ajax event="change" update="busTypeId,outPnlRegForm" process="@form" />
						</p:selectOneMenu>
						 &#160; <p:graphicImage id="mofsupp"
						value="/css/images/design/tooltips.png" /> <p:tooltip style="width:25%;"
						id="mofsupplier" for="mofsupp">
						<p:outputLabel escape="false"
							value="#{lbl['tt.sm.registration.business.mof.supplier.type']}" />
					</p:tooltip>&#160;
						<p:message id="suppTypeIdMsg" for="suppTypeId" display="icon" />						
						</td>						
					<td class="tdTitle"></td>
					<td class="tdContent"></td>
				</tr>
			</c:if>
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.businesscomptype']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td style="text-align:left;width:30%;word-wrap: break-word;">
					<p:selectOneMenu id="busTypeId" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.businesscomptype']}"
						value="#{registrationBackingBean.managedBean.smSupp.businessType}" 
						rendered="#{registrationBackingBean.managedBean.smAppl.brandNew or !registrationBackingBean.managedBean.disabledBusinessTypeInMaintenance}" 
						style="width:310px">
						<f:selectItems value="#{registrationBackingBean.pmBusinessTypeDropDown()}"/>
						<p:ajax event="change" listener="#{registrationBackingBean.pmStateDropdownValues}" update="outPnlRegForm" process="@form" disabled="#{!registrationBackingBean.managedBean.smAppl.brandNew}" ></p:ajax>
					</p:selectOneMenu>
					<p:outputLabel styleClass="outputLabel-view" 
					value="#{registrationBackingBean.getParameterDesc(SupplierManagementConst.supplierBusinessType,registrationBackingBean.managedBean.smSupp.businessType)}" 
					rendered="#{registrationBackingBean.managedBean.disabledBusinessTypeInMaintenance}" />
					&#160;
					<p:graphicImage id="typeofbusiness" value="/css/images/design/tooltips.png" />
					<p:tooltip id="businesscomtype" for="typeofbusiness">
						<p:outputLabel escape="false" rendered="#{registrationBackingBean.managedBean.smAppl.applType eq SupplierManagementConst.ACC_BASIC}"
							value="#{lbl['tt.sm.registration.business.basic.company.type']}" />
						<p:outputLabel escape="false" rendered="#{registrationBackingBean.managedBean.smAppl.applType eq SupplierManagementConst.ACC_MOF}"
							value="#{lbl['tt.sm.registration.business.mof.company.type']}" />	
					</p:tooltip>&#160;					
					<p:message id="busTypeIdMsg" for="busTypeId" display="icon" />
				</td>
				<c:choose>
					<c:when test="#{!registrationBackingBean.managedBean.smAppl.brandNew}">
						<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.basic.account.created.date']}" /></td>
						<td class="tdContent"><p:calendar id="createdDateId"
						navigator="true" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.basic.account.created.date']}"
						value="#{registrationBackingBean.managedBean.smSupp.createdDate}" rendered="#{not empty registrationBackingBean.managedBean.smSupp.createdDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"  disabled="true"
						readonlyInput="true" size="30" showOn="button" yearRange="-99:+0" maxdate="#{CommonConstants.CURRENT_DATE}" />
						</td>
					</c:when>
					<c:otherwise>
						<td class="tdTitle"></td>
						<td class="tdContent"></td>
					</c:otherwise>
				</c:choose>
			 </tr>
		</table>
	</p:panel>

	<p:panel rendered="#{registrationBackingBean.managedBean.smAppl.brandNew 
					and registrationBackingBean.managedBean.smAppl.applType == SupplierManagementConst.ACC_MOF 
					and registrationBackingBean.managedBean.smAppl.supplierType == SupplierManagementConst.STYPE_CONTRACTOR}" 
					header="#{lbl['lbl.sm.busNtw.panHdr']}" id="pnlBusNetwork" toggleable="true">
		
		<table style="width:80%;margin-left:auto; margin-right:auto;">
			<tr>
				<td>
					<p:selectBooleanCheckbox id="chkFdrGovId" value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.withFederal}" />
					#{lbl['lbl.sm.busNtw.fdrGov']}
				</td>
			
				<td>
					<p:selectBooleanCheckbox id="chkstateGovId" value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.withState}" />
					#{lbl['lbl.sm.busNtw.stateGov']}
				</td>
			
				<td>
					<p:selectBooleanCheckbox id="chkstatBodyId" value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.withStatutory}" />
					#{lbl['lbl.sm.busNtw.statBody']}
				</td>
		
				<td>
					<p:selectBooleanCheckbox id="chkGlcId" value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.withGlc}" />
					#{lbl['lbl.sm.busNtw.glc']}
				</td>
				
				<td>	
					<p:selectBooleanCheckbox id="chkOthersId" value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.withOthers}" />
					#{lbl['lbl.sm.busNtw.others']}
				</td>
			</tr>
		</table>
	</p:panel>


</ui:composition>
