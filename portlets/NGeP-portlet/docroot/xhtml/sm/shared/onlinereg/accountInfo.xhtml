
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Account Information" toggleable="true">
		<table class="customTbl">
			<tr>
				<c:if
					test="#{registrationBackingBean.managedBean.smAppl.applType == 'N'}">

					<td id="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.mofsuppliertype']}" /></td>
					<td id="tdContent"><p:selectOneMenu
							value="#{registrationBackingBean.managedBean.smAppl.supplierType}">
							<f:selectItem itemLabel="Select" itemValue="" />
							<f:selectItem itemLabel="Contractor" itemValue="K" />
							<f:selectItem itemLabel="Consultant" itemValue="P" />
							<f:selectItem itemLabel="Government Seller" itemValue="G" />
						</p:selectOneMenu></td>
				</c:if>

				<td id="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.businesscomptype']}" /></td>
				<td id="tdContent"><p:selectOneMenu id="somId"
						value="#{registrationBackingBean.managedBean.smSupp.businessType}">
						<f:selectItem itemLabel="Select" itemValue="" />
						<f:selectItem itemLabel="ROB-Semenanjung" itemValue="G" />
						<f:selectItem itemLabel="ROB-Sabah" itemValue="H" />
						<f:selectItem itemLabel="ROB-Sarawak" itemValue="K" />
						<f:selectItem itemLabel="ROC" itemValue="C" />
						<f:selectItem itemLabel="LLP" itemValue="L" />
						<f:selectItem itemLabel="Individual" itemValue="I" />
						<f:selectItem itemLabel="Society(ROS)" itemValue="S" />
						<f:selectItem itemLabel="Professional Body" itemValue="P" />
						<p:ajax event="change" update="@form" />
					</p:selectOneMenu></td>
			<c:if
					test="#{registrationBackingBean.managedBean.smAppl.applType != 'N'}">
					<td id="tdTitle"></td>
					<td id="tdContent"></td>
			</c:if>
			</tr>
		</table>
	</p:panel>
</ui:composition>
