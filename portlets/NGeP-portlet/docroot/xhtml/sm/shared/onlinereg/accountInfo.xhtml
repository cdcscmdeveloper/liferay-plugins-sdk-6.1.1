<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="indBtnSubmit">
		<c:if test="#{registrationBackingBean.managedBean.smAppl.brandNew}">
			<c:if
				test="#{registrationBackingBean.managedBean.smSupp.businessType == SupplierManagementConst.INDIVIDUAL_FLAG}">
				<div align="right">
					<p:commandButton value="Submit" onstart="submissionDialog.show();" oncomplete="submissionDialog.hide();"
						action="#{registrationBackingBean.submitRegistration}" update="@([id$=Msg])">
							<f:param name="disableValidation" value="true" />
					</p:commandButton>
				</div>
				
				<p:dialog widgetVar="submissionDialog" modal="true" draggable="false"
					closable="false" resizable="false" showHeader="false">
					<p:graphicImage library="ep/images/" name="ajax-loader.gif" />
				</p:dialog>
			</c:if>
		</c:if>
	</p:outputPanel>

	<p:panel header="Account Information" toggleable="true">
		<table class="customTbl">
			<tr>
				<c:if
					test="#{registrationBackingBean.managedBean.smAppl.applType == SupplierManagementConst.ACC_MOF}">

					<td class="tdTitle">
						<p:outputLabel value="*" styleClass="mandatory" />
						<p:outputLabel value="#{lbl['lbl.sm.mofsuppliertype']}" />
					</td>
					<td class="tdContent"><p:selectOneMenu id="suppTypeId" required="#{!empty param['disableValidation']}"
							value="#{registrationBackingBean.managedBean.smAppl.supplierType}"
							label="#{lbl['lbl.sm.mofsuppliertype']}" style="width:200px"
							disabled="#{!registrationBackingBean.managedBean.smAppl.brandNew}">
							<f:selectItem itemLabel="---Select---" itemValue="" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}"
								itemValue="#{SupplierManagementConst.STYPE_CONTRACTOR}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}"
								itemValue="#{SupplierManagementConst.STYPE_CONSULTANT}" />
							<p:ajax event="change" update="busTypeId,outPnlRegForm" process="@form" />
						</p:selectOneMenu>
						<p:message id="suppTypeIdMsg" for="suppTypeId" display="icon" /></td>
				</c:if>

				<td class="tdTitle">
					<p:outputLabel value="*" styleClass="mandatory" />
					<p:outputLabel value="#{lbl['lbl.sm.businesscomptype']}" />
				</td>
				<td class="tdContent">
					<p:selectOneMenu id="busTypeId" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.businesscomptype']}"
						value="#{registrationBackingBean.managedBean.smSupp.businessType}"
						disabled="#{!registrationBackingBean.managedBean.smAppl.brandNew}"
						readonly="#{!registrationBackingBean.managedBean.smAppl.brandNew}" style="width:200px">
						<f:selectItems value="#{registrationBackingBean.pmBusinessTypeDropDown()}" />
						<p:ajax event="change" update="outPnlRegForm" process="@form"></p:ajax>
					</p:selectOneMenu><p:message id="busTypeIdMsg" for="busTypeId" display="icon" /></td>
				<c:if
					test="#{registrationBackingBean.managedBean.smAppl.applType != 'M'}">
					<td class="tdTitle"></td>
					<td class="tdContent"></td>
				</c:if>
			</tr>

			<c:if test="#{!registrationBackingBean.managedBean.smAppl.brandNew}">
				<tr>
					<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.accountstatus']}" /></td>
					<td class="tdContent"><p:selectOneRadio value="#{registrationBackingBean.managedBean.smSupp.recordStatusFlg}">
							<f:selectItem itemLabel="Active" itemValue="1" />
							<f:selectItem itemLabel="Deactivate" itemValue="0" />
						</p:selectOneRadio></td>
				</tr>
			</c:if>
		</table>
	</p:panel>
</ui:composition>
