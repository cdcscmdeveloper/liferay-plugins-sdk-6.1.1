<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" 
	xmlns:cc="http://java.sun.com/jsf/composite">

	<p:outputPanel id="indBtnSubmit">
		<c:if test="#{registrationBackingBean.managedBean.smAppl.brandNew}">
			<c:if
				test="#{registrationBackingBean.managedBean.smSupp.businessType == SupplierManagementConst.INDIVIDUAL_FLAG}">
				<div align="right">
					<p:commandButton value="#{lbl['lbl.btn.submit']}" onstart="submissionDialog.show();" oncomplete="submissionDialog.hide();"
						action="#{registrationBackingBean.submitRegistration}" update="@([id$=Msg])">
							<f:param name="disableValidation" value="true" />
					</p:commandButton>
				</div>
				
				<p:dialog widgetVar="submissionDialog" modal="true" draggable="false"
					closable="false" resizable="false" showHeader="false">
					<p:graphicImage value="/css/images/ajax-loader.gif" />
				</p:dialog>
			</c:if>
		</c:if>
	</p:outputPanel>

	<p:panel header="#{lbl['lbl.sm.account.info']}" toggleable="true">
		<table class="customTbl">
			<c:if test="#{registrationBackingBean.managedBean.smAppl.applType == SupplierManagementConst.ACC_MOF}">
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.mofsuppliertype']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<!-- 16052019 - SSM INTEGRATION CR - Fahmi-->
					<td class="tdContent"><p:selectOneMenu id="suppTypeId" required="#{!empty param['disableValidation']}"
							value="#{registrationBackingBean.managedBean.smAppl.supplierType}"
							label="#{lbl['lbl.sm.mofsuppliertype']}" style="width:200px"
							disabled="#{!registrationBackingBean.managedBean.smAppl.brandNew || registrationBackingBean.managedBean.smAppl.applValidWithSsm || registrationBackingBean.managedBean.activeDisicplinaryAction}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}"
								itemValue="#{SupplierManagementConst.STYPE_CONTRACTOR}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}"
								itemValue="#{SupplierManagementConst.STYPE_CONSULTANT}" />
							<p:ajax event="change" update="busTypeId,outPnlRegForm" process="@form" />
						</p:selectOneMenu>
						 &#160; <p:graphicImage id="mofsupp"
						value="/css/images/design/tooltips.png" /> <p:tooltip style="width:25%;"
						id="mofsupplier" for="mofsupp">
						<p:outputLabel escape="false"
							value="#{lbl['tt.sm.registration.business.mof.supplier.type']}" />
					</p:tooltip>&#160;
						<p:message id="suppTypeIdMsg" for="suppTypeId" display="icon" />						
						</td>						
					<td class="tdTitle"></td>
					<td class="tdContent"></td>
				</tr>
			</c:if>
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.businesscomptype']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<!-- 16052019 - SSM INTEGRATION CR - Fahmi-->
				<td style="text-align:left;width:30%;word-wrap: break-word;">
				<c:choose>
					<c:when test="#{registrationBackingBean.managedBean.smAppl.brandNew and registrationBackingBean.managedBean.smAppl.applValidWithSsm}">
						<p:selectOneMenu id="busTypeId" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.businesscomptype']}"
							value="#{registrationBackingBean.managedBean.smSupp.businessType}" 
							rendered="#{registrationBackingBean.managedBean.smAppl.brandNew or !registrationBackingBean.managedBean.disabledBusinessTypeInMaintenance}" 
							style="width:310px">
							<f:selectItems value="#{registrationBackingBean.pmBusinessTypeDropDown()}"/>
							<!-- #36718 - add parameter to pmStateDropdownValues listener method -->
							<p:ajax event="change" listener="#{registrationBackingBean.pmStateDropdownValues(true)}" update="@all" process="@this" disabled="#{!registrationBackingBean.managedBean.smAppl.brandNew || registrationBackingBean.managedBean.smAppl.applValidWithSsm || registrationBackingBean.managedBean.activeDisicplinaryAction}" ></p:ajax>
						</p:selectOneMenu>
					</c:when>
					<c:when test="#{!registrationBackingBean.managedBean.smAppl.brandNew and registrationBackingBean.managedBean.regAccountMaintainance}">
						<p:selectOneMenu id="busTypeId" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.businesscomptype']}"
							value="#{registrationBackingBean.managedBean.smSupp.businessType}" 
							disabled="#{(!registrationBackingBean.businessTypeIsROB(registrationBackingBean.managedBean.smSupp.businessType) and !registrationBackingBean.businessTypeIsROC(registrationBackingBean.managedBean.smSupp.businessType)) 
								|| registrationBackingBean.managedBean.activeDisicplinaryAction }"
							style="width:310px">
							<f:selectItems value="#{registrationBackingBean.pmBusinessTypeDropDown()}"/>
							<!-- #36718 - add parameter to pmStateDropdownValues listener method -->
							<p:ajax event="change" listener="#{registrationBackingBean.pmStateDropdownValues(true)}" update="@all" process="@this" ></p:ajax>
						</p:selectOneMenu>
					</c:when>
					<!-- #36710 START -->
					<c:when test="#{registrationBackingBean.managedBean.smAppl.brandNew and !registrationBackingBean.managedBean.smAppl.applValidWithSsm and !registrationBackingBean.managedBean.ssmIntegrationActive}">
						<p:selectOneMenu id="busTypeId" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.businesscomptype']}"
							value="#{registrationBackingBean.managedBean.smSupp.businessType}" 
							rendered="#{registrationBackingBean.managedBean.smAppl.brandNew or !registrationBackingBean.managedBean.disabledBusinessTypeInMaintenance}" 
							style="width:310px"
							disabled="#{(registrationBackingBean.managedBean.smAppl.applType == SupplierManagementConst.ACC_BASIC and registrationBackingBean.managedBean.disabledBusinessTypeInMaintenance) or (!registrationBackingBean.managedBean.smAppl.brandNew or registrationBackingBean.managedBean.companyValidWithSSM) or registrationBackingBean.managedBean.activeDisicplinaryAction}">
							<f:selectItems value="#{registrationBackingBean.pmBusinessTypeDropDown()}"/> 
							<!-- #36718 - add parameter to pmStateDropdownValues listener method -->
							<p:ajax event="change" listener="#{registrationBackingBean.pmStateDropdownValues(true)}" update="@all" process="@this" disabled="#{!registrationBackingBean.managedBean.smAppl.brandNew || registrationBackingBean.managedBean.smAppl.applValidWithSsm || registrationBackingBean.managedBean.activeDisicplinaryAction}" ></p:ajax>
						</p:selectOneMenu> <!-- #36710 END-->
					</c:when>
					<c:otherwise>
						<p:selectOneMenu id="busTypeId" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.businesscomptype']}"
							value="#{registrationBackingBean.managedBean.smSupp.businessType}" 
							rendered="#{registrationBackingBean.managedBean.smAppl.brandNew or !registrationBackingBean.managedBean.disabledBusinessTypeInMaintenance}" 
							style="width:310px"
							disabled="#{(registrationBackingBean.managedBean.smAppl.applType == SupplierManagementConst.ACC_BASIC and registrationBackingBean.managedBean.disabledBusinessTypeInMaintenance) or (!registrationBackingBean.managedBean.smAppl.brandNew or registrationBackingBean.managedBean.companyValidWithSSM) or registrationBackingBean.managedBean.activeDisicplinaryAction}">
							<f:selectItems value="#{registrationBackingBean.pmBusinessTypeDropDownAccountInfo()}"/> <!-- #36710 -->
							<!-- #36718 - add parameter to pmStateDropdownValues listener method -->
							<p:ajax event="change" listener="#{registrationBackingBean.pmStateDropdownValues(true)}" update="@all" process="@this" disabled="#{!registrationBackingBean.managedBean.smAppl.brandNew || registrationBackingBean.managedBean.smAppl.applValidWithSsm || registrationBackingBean.managedBean.activeDisicplinaryAction}" ></p:ajax>
						</p:selectOneMenu>
					</c:otherwise>
				</c:choose>
				
					
					<!-- <p:outputLabel styleClass="outputLabel-view" 
					value="#{registrationBackingBean.getParameterDesc(SupplierManagementConst.supplierBusinessType,registrationBackingBean.managedBean.smSupp.businessType)}" 
					rendered="#{registrationBackingBean.managedBean.disabledBusinessTypeInMaintenance}" /> -->
					&#160;
					<p:graphicImage id="typeofbusiness" value="/css/images/design/tooltips.png" />
					<p:tooltip id="businesscomtype" for="typeofbusiness" >						
					<p:outputLabel escape="false" rendered="#{registrationBackingBean.managedBean.smAppl.applType eq SupplierManagementConst.ACC_BASIC}"
							value="#{lbl['tt.sm.registration.business.basic.company.type']}" />
						<p:outputLabel escape="false" rendered="#{registrationBackingBean.managedBean.smAppl.applType eq SupplierManagementConst.ACC_MOF}"
							value="#{lbl['tt.sm.registration.business.mof.company.type']}" />	
					</p:tooltip>&#160;					
					<p:message id="busTypeIdMsg" for="busTypeId" display="icon" />
				</td>
				<c:choose>
					<c:when test="#{!registrationBackingBean.managedBean.smAppl.brandNew}">
						<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.basic.account.created.date']}" /></td>
						<td class="tdContent"><p:calendar id="createdDateId"
						navigator="true" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.basic.account.created.date']}"
						value="#{registrationBackingBean.managedBean.smSupp.createdDate}" rendered="#{not empty registrationBackingBean.managedBean.smSupp.createdDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"  disabled="true"
						readonlyInput="true" size="30" showOn="button" yearRange="-99:+0" maxdate="#{CommonConstants.CURRENT_DATE}" />
						</td>
					</c:when>
					<c:otherwise>
						<td class="tdTitle"></td>
						<td class="tdContent"></td>
					</c:otherwise>
				</c:choose>
			 </tr>
			 
			 <tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.businessregno']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				
				<td class="tdContent">
					<p:outputPanel id="regNoPanelId">
					<!--  #16052019 - SSM INTEGRATION CR - Fahmi  -->
						<p:inputText id="regNo" required="#{!empty param['disableValidation']}" maxlength="20"
							value="#{registrationBackingBean.managedBean.smSupp.regNo}" converter="toUpperCaseConverter"
							disabled="#{!registrationBackingBean.managedBean.smSupp.brandNew || registrationBackingBean.managedBean.smAppl.applValidWithSsm || registrationBackingBean.managedBean.activeDisicplinaryAction}"
							size="40" label="#{lbl['lbl.sm.businessregno']}" >
							<p:ajax event="blur" update="regNoPanelId" listener="#{registrationBackingBean.removeRegNoWhiteSpace}" />
							<f:validator validatorId="busRegNoValidator" />
							</p:inputText>
						&#160;
						<p:graphicImage id="regNoti" value="/css/images/design/tooltips.png" rendered="#{not empty registrationBackingBean.managedBean.smSupp.businessType and registrationBackingBean.managedBean.smSupp.businessType != SupplierManagementConst.INDIVIDUAL_FLAG}"/>
						<ui:param name="lblRegNoTlTip" value="tt.sm.business.type.#{registrationBackingBean.managedBean.smSupp.businessType}" />
						<p:tooltip id="regNott" for="regNoti" rendered="#{not empty registrationBackingBean.managedBean.smSupp.businessType and registrationBackingBean.managedBean.smSupp.businessType != SupplierManagementConst.INDIVIDUAL_FLAG}" >
							<p:outputLabel escape="false" value="#{lbl[lblRegNoTlTip]}"  />
						</p:tooltip>&#160;
						<p:message id="regNoMsg" for="regNo" display="icon" />
					</p:outputPanel>
				</td>
				
				<!--  16052019 - SSM INTEGRATION CR  -->
				<c:choose>
					<c:when test="#{!registrationBackingBean.managedBean.smAppl.brandNew}">
						<td class="tdTitle">
							<p:outputLabel value="#{lbl['lbl.sm.epno']}" />
						</td>
						<td class="tdContent">
							<p:outputLabel styleClass="outputLabel-view" value="#{registrationBackingBean.managedBean.smSupp.epNo}" />
						</td>
					</c:when>
					<c:otherwise>
						<td class="tdTitle"></td>
						<td class="tdContent"></td>
					</c:otherwise>
				</c:choose>
			</tr>
			<!-- #24819 -->
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.new.business.regNo']}" /></td>
				<td class="tdContent">
					<p:outputPanel id="newRegNoPanelId">
					<p:inputText id="newregNo1"  maxlength="30"
							value="#{registrationBackingBean.managedBean.smSupp.ssmNewRegNo}"  
							rendered="#{not empty registrationBackingBean.managedBean.smSupp.ssmNewRegNo}" 
							converter="toUpperCaseConverter"
							disabled="#{!registrationBackingBean.managedBean.smSupp.brandNew 
							|| registrationBackingBean.managedBean.smAppl.applValidWithSsm 
							|| registrationBackingBean.managedBean.activeDisicplinaryAction}"
							size="40" label="#{lbl['lbl.sm.new.business.regNo']}" >
					</p:inputText>	
					<p:inputText id="newregNo2" maxlength="30"
							value="#{lbl['lbl.sm.no.available']}" 
							converter="toUpperCaseConverter" 
							rendered="#{empty registrationBackingBean.managedBean.smSupp.ssmNewRegNo}"
							disabled="#{registrationBackingBean.managedBean.smSupp.brandNew 
							|| !registrationBackingBean.managedBean.smSupp.brandNew 
							|| registrationBackingBean.managedBean.smAppl.applValidWithSsm 
							|| registrationBackingBean.managedBean.activeDisicplinaryAction}"
							size="40" label="#{lbl['lbl.sm.new.business.regNo']}" >
					</p:inputText>&#160;
					<p:graphicImage id="newRegNoti" value="/css/images/design/tooltips.png"/>
					<p:tooltip id="newRegNott" for="newRegNoti"  >
						<p:outputLabel escape="false" value="#{lbl['tt.sm.new.business.regNo']}"  />
					</p:tooltip>&#160;
					<p:message id="newRegNoMsg" for="regNo" display="icon" />	
					</p:outputPanel></td>
			</tr>
		
			<tr>
				<td class="tdTitle"></td>
				<td class = "tdContent">
					<ac:instructionText value="#{lbl['lbl.sm.new.business.regNo.notes']}" /></td>
			</tr>
			<!-- #24819 -->
		</table>
	</p:panel>

	<p:panel rendered="#{registrationBackingBean.managedBean.smAppl.brandNew 
					and registrationBackingBean.managedBean.smAppl.applType == SupplierManagementConst.ACC_MOF 
					and registrationBackingBean.managedBean.smAppl.supplierType == SupplierManagementConst.STYPE_CONTRACTOR}" 
					header="#{lbl['lbl.sm.busNtw.panHdr']}" id="pnlBusNetwork" toggleable="true">
		
		<table style="width:80%;margin-left:auto; margin-right:auto;">
			<tr>
				<td>
					<p:selectBooleanCheckbox id="chkFdrGovId" value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.withFederal}" />
					#{lbl['lbl.sm.busNtw.fdrGov']}
				</td>
			
				<td>
					<p:selectBooleanCheckbox id="chkstateGovId" value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.withState}" />
					#{lbl['lbl.sm.busNtw.stateGov']}
				</td>
			
				<td>
					<p:selectBooleanCheckbox id="chkstatBodyId" value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.withStatutory}" />
					#{lbl['lbl.sm.busNtw.statBody']}
				</td>
		
				<td>
					<p:selectBooleanCheckbox id="chkGlcId" value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.withGlc}" />
					#{lbl['lbl.sm.busNtw.glc']}
				</td>
				
				<td>	
					<p:selectBooleanCheckbox id="chkOthersId" value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.withOthers}" />
					#{lbl['lbl.sm.busNtw.others']}
				</td>
			</tr>
		</table>
	</p:panel>


</ui:composition>
