<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Account Information" toggleable="true">
		<table class="customTbl">
			<tr>
				<c:if
					test="#{registrationBackingBean.managedBean.smAppl.applType == 'M'}">

					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.mofsuppliertype']}" /></td>
					<td class="tdContent"><p:selectOneMenu
							value="#{registrationBackingBean.managedBean.smAppl.supplierType}">
							<f:selectItem itemLabel="---Select---" itemValue="" />
							<f:selectItem itemLabel="Contractor" itemValue="K" />
							<f:selectItem itemLabel="Consultant" itemValue="P" />
							<p:ajax event="change" update="busTypeId" listener="#{registrationBackingBean.suppTypeOnChange}"/>
						</p:selectOneMenu></td>
				</c:if>

				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.businesscomptype']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="busTypeId"
						value="#{registrationBackingBean.managedBean.smSupp.businessType}" readonly="#{!registrationBackingBean.managedBean.smAppl.brandNew}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems value="#{registrationBackingBean.managedBean.businessTypeLs}" var="busTypeLs" itemValue="#{busTypeLs.pmParameter.parameterCode}" itemLabel="#{busTypeLs.codeName}"></f:selectItems>
						<p:ajax event="change" update="@form" listener="#{registrationBackingBean.businessTypeOnChange}"/>
					
					</p:selectOneMenu></td>
			<c:if
					test="#{registrationBackingBean.managedBean.smAppl.applType != 'M'}">
					<td class="tdTitle"></td>
					<td class="tdContent"></td>
			</c:if>
			</tr>
		</table>
	</p:panel>
</ui:composition>
