<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="indBtnSubmit">
		<c:if test="#{registrationBackingBean.managedBean.smAppl.brandNew}">
			<c:if
				test="#{registrationBackingBean.managedBean.smSupp.businessType == '13'}">
				<div align="right">
					<p:commandButton value="Submit"
						action="#{registrationBackingBean.submitRegistration}" />
				</div>
			</c:if>
		</c:if>
	</p:outputPanel>

	<p:panel header="Account Information" toggleable="true">
		<table class="customTbl">
			<tr>
				<c:if
					test="#{registrationBackingBean.managedBean.smAppl.applType == 'M'}">

					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.mofsuppliertype']}" /></td>
					<td class="tdContent"><p:selectOneMenu
							value="#{registrationBackingBean.managedBean.smAppl.supplierType}" style="width:200px">
							<f:selectItem itemLabel="---Select---" itemValue="" />
							<f:selectItem itemLabel="Contractor" itemValue="K" />
							<f:selectItem itemLabel="Consultant" itemValue="J" />
							<p:ajax event="change" update="busTypeId,outPnlRegForm,"
								listener="#{registrationBackingBean.suppTypeOnChange}" />
						</p:selectOneMenu></td>
				</c:if>

				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.businesscomptype']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="busTypeId"
						value="#{registrationBackingBean.managedBean.smSupp.businessType}"
						readonly="#{!registrationBackingBean.managedBean.smAppl.brandNew}" style="width:200px">
						<f:selectItems value="#{registrationBackingBean.pmBusinessTypeDropDown()}" />
					</p:selectOneMenu></td>
				<c:if
					test="#{registrationBackingBean.managedBean.smAppl.applType != 'M'}">
					<td class="tdTitle"></td>
					<td class="tdContent"></td>
				</c:if>
			</tr>

			<c:if test="#{!registrationBackingBean.managedBean.smAppl.brandNew}">
				<tr>
					<td class="tdTitle"><p:outputLabel value="Account Status" /></td>
					<td class="tdContent"><p:selectOneRadio>
							<f:selectItem itemLabel="Active" itemValue="1" />
							<f:selectItem itemLabel="Deactivate" itemValue="0" />
						</p:selectOneRadio></td>
				</tr>
			</c:if>
		</table>
	</p:panel>
</ui:composition>
