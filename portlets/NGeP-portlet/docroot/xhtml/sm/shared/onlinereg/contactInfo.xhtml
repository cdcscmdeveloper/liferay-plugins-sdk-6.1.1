<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Contact Information" toggleable="true"
		id="pnlContactInfo">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.correspondenceadd']}" /></td>
				<td class="tdContent"><p:selectBooleanCheckbox id="chkAddMode"
						value="#{registrationBackingBean.managedBean.sameAddress}">
						<p:ajax event="change" update="pnlContactInfo" 
							listener="#{registrationBackingBean.updateCorrespondenceAddress()}"
							process="@this,txtPermAdd1,txtPermAdd2,txtPermAdd3,txtPermAdd4,txtPermPostcode,cmbPermState,cmbPermDistrict,cmbPermCity" />
					</p:selectBooleanCheckbox> <h:outputText value="Same as abv."></h:outputText></td>
			</tr>

			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent" ><p:inputText size="40"
						id="conAddress1" maxlength="35"
						required="#{!registrationBackingBean.managedBean.sameAddress}"
						label="#{lbl['lbl.sm.correspondenceadd']}"
						value="#{registrationBackingBean.managedBean.smResAdd.address1}"
						disabled="#{registrationBackingBean.managedBean.sameAddress}" />
					<p:message id="conAddress1Msg" for="conAddress1" display="icon" />
				</td>

				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.state']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbResState"
						required="#{!registrationBackingBean.managedBean.sameAddress}"
						label="#{lbl['lbl.sm.state']}"
						value="#{registrationBackingBean.managedBean.smResAdd.pmState.stateId}"
						disabled="#{registrationBackingBean.managedBean.sameAddress}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="resState"
							value="#{registrationBackingBean.managedBean.residentialStateLs}"
							itemValue="#{resState.stateId}" itemLabel="#{resState.stateName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateDistrictByAddType('residential')}"
							update="cmbResDistrict cmbResCity" />
					</p:selectOneMenu> <p:message id="cmbResStateMsg" for="cmbResState" display="icon" />
				</td>
			</tr>

			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="40"
						id="conAddress2" maxlength="35"
						value="#{registrationBackingBean.managedBean.smResAdd.address2}"
						disabled="#{registrationBackingBean.managedBean.sameAddress}" /></td>

				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.district']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbResDistrict"
						required="#{!registrationBackingBean.managedBean.sameAddress}"
						label="#{lbl['lbl.sm.district']}"
						disabled="#{registrationBackingBean.managedBean.sameAddress}"
						value="#{registrationBackingBean.managedBean.smResAdd.pmDistrict.districtId}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="dist"
							value="#{registrationBackingBean.managedBean.residentialDistrictLs}"
							itemValue="#{dist.districtId}" itemLabel="#{dist.districtName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateCityByAddType('residential')}"
							update="cmbResCity" />
					</p:selectOneMenu> <p:message id="cmbResDistrictMsg" for="cmbResDistrict"
						display="icon" /></td>
			</tr>

			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="40"
						id="conAddress3" maxlength="35"
						value="#{registrationBackingBean.managedBean.smResAdd.address3}"
						disabled="#{registrationBackingBean.managedBean.sameAddress}" /></td>

				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.towncity']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbResCity"
						required="#{!registrationBackingBean.managedBean.sameAddress}"
						label="#{lbl['lbl.sm.towncity']}"
						disabled="#{registrationBackingBean.managedBean.sameAddress}"
						value="#{registrationBackingBean.managedBean.smResAdd.pmCity.cityId}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="city"
							value="#{registrationBackingBean.managedBean.residentialCityLs}"
							itemValue="#{city.cityId}" itemLabel="#{city.cityName}" />
					</p:selectOneMenu> <p:message id="cmbResCityMsg" for="cmbResCity" display="icon" /></td>
			</tr>

			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="40"
						id="conAddress4" maxlength="35"
						value="#{registrationBackingBean.managedBean.smResAdd.address4}"
						disabled="#{registrationBackingBean.managedBean.sameAddress}" /></td>

				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.postcode']}" /></td>
				<td class="tdContent"><p:inputText size="40" maxlength="10"
						required="#{!registrationBackingBean.managedBean.sameAddress}"
						label="#{lbl['lbl.sm.postcode']}"
						value="#{registrationBackingBean.managedBean.smResAdd.postcode}"
						disabled="#{registrationBackingBean.managedBean.sameAddress}"
						id="conPostCode" /> <p:message id="conPostCodeMsg"
						for="conPostCode" display="icon" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td class="tdContent"><p:inputText id="txtPhoneNoId" size="40"
						maxlength="25"
						label="#{lbl['lbl.sm.phnNo']}"
						value="#{registrationBackingBean.managedBean.smPersonnel.phoneNo}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
					</p:inputText>
					<p:message id="txtPhoneNoIdMsg" for="txtPhoneNoId" display="icon" />
				</td>


				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.mobilenumber']}" /></td>
				<td class="tdContent"><p:inputText size="40" id="txtMobileNoId" maxlength="20"
						required="true" label="#{lbl['lbl.sm.mobilenumber']}"
						value="#{registrationBackingBean.managedBean.smPersonnel.mobileNo}" />
					<p:message id="txtMobileNoIdMsg" for="txtMobileNoId" display="icon" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.email']}" /></td>
				<td class="tdContent"><p:inputText size="40" id="usrEmail" required="true"  label="#{lbl['lbl.sm.email']}" maxlength="80"
						value="#{registrationBackingBean.managedBean.smPersonnel.email}" />
					&#160;
					<p:graphicImage id="emailti" library="ep/images/design" name="tooltips.png" />
					<p:tooltip id="emailtt" for="emailti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.user.email']}"  />
					</p:tooltip>
					<p:message id="usrEmailMsg" for="usrEmail" display="icon" />
				</td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.confirmemail']}" /></td>
				<td class="tdContent">
				<p:inputText size="40" id="conEmail" value="#{registrationBackingBean.managedBean.confirmEmail}" required="true"  label="#{lbl['lbl.sm.confirmemail']}" maxlength="80"/>
				<p:message id="conEmailMsg" for="conEmail" display="icon" /></td>
			</tr>

				<td class="tdTitle"><p:outputLabel

				<td class="tdContent">
					<table>
						<tr>
							<td>
								<p:selectManyCheckbox
									id="notificationMode">
									<f:selectItem itemLabel="Email" itemValue="0" />
									<f:selectItem itemLabel="SMS" itemValue="1" />
								</p:selectManyCheckbox>							
							</td>
							<td>
								&#160;
								<p:graphicImage id="smsti" library="ep/images/design" name="tooltips.png" />
								<p:tooltip id="smstt" for="smsti">
									<p:outputLabel escape="false" value="#{lbl['tt.sm.sms.notification']}"  />
								</p:tooltip>							
							</td>
						</tr>
					</table>
				</td>
			</tr> -->
		</table>
	</p:panel>
</ui:composition>
