<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<script type="application/javascript">
		$(document).ready(function(e){
			  $("input[id$=conAddress1]").keydown(function(e){
				if(e.which==9 || e.keycode==9){
					$("input[id$=conAddress2]").focus();
					e.preventDefault();
				}
			  });
			  $("input[id$=conAddress2]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=conAddress3]").focus();
					e.preventDefault();
				} 
			  });
			  $("input[id$=conAddress3]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					 $("input[id$=cmbResState_focus]").focus();
					e.preventDefault();
				} 
			  });
			  
			  $("input[id$=cmbResState_focus]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=cmbResDistrict_focus]").focus();
					e.preventDefault();
				} 
			  });
			  $("input[id$=cmbResDistrict_focus]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=cmbResCity_focus]").focus();
					e.preventDefault();
				} 
			  });
			  $("input[id$=cmbResCity_focus]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=conPostCode]").focus();
					e.preventDefault();
				} 
			  });
			  $("input[id$=conPostCode]").keydown(function(e){
				 if(e.which==9 || e.keycode==9){
					$("input[id$=txtPhoneNoId]").focus();
					e.preventDefault();
				} 
			  });
		});
			
	</script>
	
	<p:outputPanel id="pnlContactInfo">
		<table class="customTbl">
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.correspondenceadd']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:selectBooleanCheckbox id="chkAddMode"
						value="#{registrationBackingBean.managedBean.sameAddress}">
						<p:ajax event="change" update="pnlContactInfo"  />
					</p:selectBooleanCheckbox> <h:outputText value="#{lbl['lbl.sm.sameasabove']}"></h:outputText></td>
				<td class="tdTitle">&#160;</td>
				<td class="tdContent">&#160;</td>
			
			</tr>

			<c:if test="#{!registrationBackingBean.managedBean.sameAddress}">
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent" ><p:inputText size="40"
						id="conAddress1" maxlength="35"
						required="#{!registrationBackingBean.managedBean.sameAddress and !empty param['disableValidation']}"
						label="#{lbl['lbl.sm.correspondenceadd']}"
						value="#{registrationBackingBean.managedBean.smResAdd.address1}"
						disabled="#{registrationBackingBean.managedBean.sameAddress}" /> 
					<p:message id="conAddress1Msg" for="conAddress1" display="icon" />
				</td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.state']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:selectOneMenu id="cmbResState"
						required="#{!registrationBackingBean.managedBean.sameAddress and !empty param['disableValidation']}"
						label="#{lbl['lbl.sm.state']}" style="width:80%"
						value="#{registrationBackingBean.managedBean.smResAdd.pmState.stateId}"
						disabled="#{registrationBackingBean.managedBean.sameAddress}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="resState"
							value="#{registrationBackingBean.managedBean.residentialStateLs}"
							itemValue="#{resState.stateId}" itemLabel="#{resState.stateName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateDistrictByAddType('residential', false)}"
							update="cmbResDistrict cmbResCity" />
					</p:selectOneMenu> <p:message id="cmbResStateMsg" for="cmbResState" display="icon" />
				</td>
			</tr>

			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="40"
						id="conAddress2" maxlength="35"
						value="#{registrationBackingBean.managedBean.smResAdd.address2}"
						disabled="#{registrationBackingBean.managedBean.sameAddress}" /></td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.district']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:selectOneMenu id="cmbResDistrict"
						required="#{!registrationBackingBean.managedBean.sameAddress and !empty param['disableValidation']}"
						label="#{lbl['lbl.sm.district']}" style="width:80%"
						disabled="#{registrationBackingBean.managedBean.sameAddress}"
						value="#{registrationBackingBean.managedBean.smResAdd.pmDistrict.districtId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="dist"
							value="#{registrationBackingBean.managedBean.residentialDistrictLs}"
							itemValue="#{dist.districtId}" itemLabel="#{dist.districtName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateCityByAddType('residential', false)}"
							update="cmbResCity" />
					</p:selectOneMenu> <p:message id="cmbResDistrictMsg" for="cmbResDistrict"
						display="icon" /></td>
			</tr>

			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="40"
						id="conAddress3" maxlength="35"
						value="#{registrationBackingBean.managedBean.smResAdd.address3}"
						disabled="#{registrationBackingBean.managedBean.sameAddress}" /></td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.towncity']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:selectOneMenu id="cmbResCity"
						required="#{!registrationBackingBean.managedBean.sameAddress and !empty param['disableValidation']}"
						label="#{lbl['lbl.sm.towncity']}" style="width:80%"
						disabled="#{registrationBackingBean.managedBean.sameAddress}"
						value="#{registrationBackingBean.managedBean.smResAdd.pmCity.cityId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="city"
							value="#{registrationBackingBean.managedBean.residentialCityLs}"
							itemValue="#{city.cityId}" itemLabel="#{city.cityName}" />
					</p:selectOneMenu> <p:message id="cmbResCityMsg" for="cmbResCity" display="icon" /></td>
			</tr>

			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"></td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.postcode']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<p:inputText maxlength="5" required="#{!registrationBackingBean.managedBean.sameAddress and !empty param['disableValidation']}"
								label="#{lbl['lbl.sm.postcode']}" id="conPostCodeMy" disabled="#{registrationBackingBean.managedBean.sameAddress}"
								value="#{registrationBackingBean.managedBean.smResAdd.postcode}"
								validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
								size="40">
								<f:validator validatorId="postcodeValidator" />
							</p:inputText>
							<p:message id="conPostCodeMyMsg" for="conPostCodeMy"
								showSummary="true" showDetail="false" display="icon" />
				</td>
			</tr>
			</c:if>

			<!-- <tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.notificationmode']}" /></td>
				<td class="tdContent">
					<table>
						<tr>
							<td>
								<p:selectManyCheckbox
									id="notificationMode">
									<f:selectItem itemLabel="Email" itemValue="0" />
									<f:selectItem itemLabel="SMS" itemValue="1" />
								</p:selectManyCheckbox>							
							</td>
							<td>
								&#160;
								<p:graphicImage id="smsti" library="ep/images/design" name="tooltips.png" />
								<p:tooltip id="smstt" for="smsti">
									<p:outputLabel escape="false" value="#{lbl['tt.sm.sms.notification']}"  />
								</p:tooltip>							
							</td>
						</tr>
					</table>
				</td>
			</tr> -->
		</table>
	</p:outputPanel>
</ui:composition>
