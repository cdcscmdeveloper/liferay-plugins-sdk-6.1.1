<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Contact Information" toggleable="true"
		id="pnlContactInfo">
			<table class="customTbl">
			<tr>
				<td id="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.correspondenceadd']}" /></td>
				<td id="tdContent"><p:selectBooleanCheckbox id="chkAddMode"
						value="#{registrationBackingBean.managedBean.sameAddress}">
						<p:ajax event="change" update="pnlContactInfo" listener="#{registrationBackingBean.sameAsPermenantAddress}"/>
					</p:selectBooleanCheckbox>Same as Permenant Address</td>
			</tr>

			<tr>
				<td id="tdTitle"></td>
				<td id="tdContent" colspan="2"><p:inputText size="40" id="conAddress1"/></td>
			</tr>

			<tr>
				<td id="tdTitle"></td>
				<td id="tdContent" colspan="2"><p:inputText size="40" id="conAddress2"/></td>
			</tr>

			<tr>
				<td id="tdTitle"></td>
				<td id="tdContent" colspan="2"><p:inputText size="40" /></td>
			</tr>

			<tr>
				<td id="tdTitle"></td>
				<td id="tdContent" colspan="2"><p:inputText size="40" /></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.postcode']}" /></td>
				<td id="tdContent"><p:inputText size="40" /></td>
				<td id="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.state']}" /></td>
				<td id="tdContent"><p:inputText size="40" /></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.district']}" /></td>
				<td id="tdContent"><p:inputText size="40" /></td>
				<td id="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.towncity']}" /></td>
				<td id="tdContent"><p:inputText size="40" /></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel value="Phone No" /></td>
				<td id="tdContent"><p:inputText size="40" /></td>

				<td id="tdTitle"><p:outputLabel value="Fax No" /></td>
				<td id="tdContent"><p:inputText size="40" id="txtFaxNo" /></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.mobilenumber']}" /></td>
				<td id="tdContent"><p:inputText size="40"
						value="#{registrationBackingBean.managedBean.smResAdd.mobileNo}" /></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.email']}" /></td>
				<td id="tdContent"><p:inputText size="40" id="usrEmail"
						value="#{registrationBackingBean.managedBean.smPersonnel.email}" /></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.confirmemail']}" /></td>
				<td id="tdContent"><p:inputText size="40" id="conEmail" /></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.notificationmode']}" /></td>
				<td id="tdContent"><p:selectManyCheckbox id="notificationMode">
						<f:selectItem itemLabel="Email" itemValue="0" />
						<f:selectItem itemLabel="SMS" itemValue="1" />
					</p:selectManyCheckbox></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
