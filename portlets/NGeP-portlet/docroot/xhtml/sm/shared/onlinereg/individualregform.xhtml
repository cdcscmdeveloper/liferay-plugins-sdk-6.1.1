<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Individual Registration Information">
		<table class="test">
			<tr>
				<td>Type of service category *</td>
				<td colspan="3"><p:selectOneRadio
						value="#{registrationBackingBean.managedBean.smSupp.serviceCategory}">
						<f:selectItem itemLabel="Professional Service" itemValue="P" />
						<f:selectItem itemLabel="Special Service" itemValue="S" />
					</p:selectOneRadio></td>
			</tr>

			<tr>
				<td>Service *</td>
				<td><p:selectOneMenu
						value="#{registrationBackingBean.managedBean.smSupp.serviceType}">
						<f:selectItem itemLabel="Select" itemValue="0" />
						<f:selectItem itemLabel="Bomoh hujan" itemValue="1" />
						<f:selectItem itemLabel="Penggali kubur" itemValue="2" />
						<f:selectItem itemLabel="Bidan" itemValue="3" />
						<f:selectItem itemLabel="Penyewaan sampan" itemValue="4" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td>Identification No</td>
				<td><p:inputText
						value="#{registrationBackingBean.managedBean.smSupp.regNo}" /></td>
			</tr>
			<tr>
				<td>Full Name(As Per/IC) *</td>
				<td><p:inputText
						value="#{registrationBackingBean.managedBean.smSupp.supplierName}" /></td>

			</tr>

			<tr>
				<td>Permanent Address(As Per/IC) *</td>
				<td><p:inputText size="50" colspan="3"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address1}" /></td>
			</tr>

			<tr>
				<td></td>
				<td><p:inputText size="50" colspan="3"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address2}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText size="50" colspan="3"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address3}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText size="50" colspan="3"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.address4}" /></td>
			</tr>
			<tr>
				<td>Post Code *</td>
				<td><p:inputText
						value="#{registrationBackingBean.managedBean.smBusinessAdd.postcode}" /></td>
				<td>State *</td>
				<td><p:inputText
						value="#{registrationBackingBean.managedBean.smBusinessAdd.stateId}" /></td>
			</tr>

			<tr>
				<td>District *</td>
				<td><p:inputText
						value="#{registrationBackingBean.managedBean.smBusinessAdd.districtId}" /></td>
				<td>Town/ City *</td>
				<td><p:inputText
						value="#{registrationBackingBean.managedBean.smBusinessAdd.cityId}" /></td>
			</tr>
			<tr>
				<td>Phone No.</td>
				<td><p:inputText
						value="#{registrationBackingBean.managedBean.smBusinessAdd.phoneNo}" /></td>
				<td>Mobile No.</td>
				<td><p:inputText
						value="#{registrationBackingBean.managedBean.smBusinessAdd.mobileNo}" /></td>
			</tr>

			<tr>
				<td>Fax No.</td>
				<td><p:inputText
						value="#{registrationBackingBean.managedBean.smBusinessAdd.faxNo}" /></td>
			</tr>
			<tr>
				<td>Email</td>
				<td><p:inputText size="40"
						value="#{registrationBackingBean.managedBean.smBusinessAdd.email}" /></td>
			</tr>
			<tr>
				<td>Confirm Email</td>
				<td><p:inputText size="40" /></td>
			</tr>
		</table>

		<ui:include src="/xhtml/sm/shared/onlinereg/bankInfo.xhtml" />
	</p:panel>
</ui:composition>
