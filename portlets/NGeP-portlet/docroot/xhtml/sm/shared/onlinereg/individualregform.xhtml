<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Individual Registration Information" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* Type of service category" /></td>
				<td class="tdContent" colspan="3"><p:selectOneRadio
						value="#{registrationBackingBean.managedBean.smSupp.serviceCategory}">
						<f:selectItem itemLabel="Professional Service" itemValue="P" />
						<f:selectItem itemLabel="Special Service" itemValue="S" />
					</p:selectOneRadio></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* Service" /></td>
				<td class="tdContent"><p:selectOneMenu
						value="#{registrationBackingBean.managedBean.smSupp.serviceType}">
						<f:selectItem itemLabel="Select" itemValue="0" />
						<f:selectItem itemLabel="Bomoh hujan" itemValue="1" />
						<f:selectItem itemLabel="Penggali kubur" itemValue="2" />
						<f:selectItem itemLabel="Bidan" itemValue="3" />
						<f:selectItem itemLabel="Penyewaan sampan" itemValue="4" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="* Identification No" /></td>
				<td class="tdContent"><p:inputMask
						value="#{registrationBackingBean.managedBean.smSupp.regNo}"
						size="40" mask="999999999999"
						disabled="#{!registrationBackingBean.managedBean.smSupp.brandNew}" /></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="* Full Name" /></td>
				<td class="tdContent"><p:inputText size="40" value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.companyName}"/></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* Permanent Address" /></td>
				<td class="tdContent"><p:inputText size="40" colspan="3"
						id="txtPermAdd1"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.address1}" /></td>
			</tr>

			<tr>
				<td></td>
				<td class="tdContent"><p:inputText size="40" colspan="3"
						id="txtPermAdd2"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.address2}" /></td>
			</tr>
			<tr>
				<td></td>
				<td class="tdContent"><p:inputText size="40" colspan="3"
						id="txtPermAdd3"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.address3}" /></td>
			</tr>
			<tr>
				<td></td>
				<td class="tdContent"><p:inputText size="40" colspan="3"
						id="txtPermAdd4"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.address4}" /></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="* Post Code" /></td>
				<td class="tdContent"><p:inputText size="40"
						id="txtPermPostcode"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.postcode}" /></td>
				<td class="tdTitle"><p:outputLabel value="* State" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbPermState"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.pmState.stateId}">

						<f:selectItems var="state"
							value="#{registrationBackingBean.managedBean.permenantStateLs}"
							itemValue="#{state.stateId}" itemLabel="#{state.stateName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateDistrictByAddType('permenant')}"
							update="cmbPermDistrict" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* District" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbPermDistrict"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.pmDistrict.districtId}">
						<f:selectItems var="dist"
							value="#{registrationBackingBean.managedBean.permenantDistrictLs}"
							itemValue="#{dist.districtId}" itemLabel="#{dist.districtName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateCityByAddType('permenant')}"
							update="cmbPermCity" />
					</p:selectOneMenu></td>

				<td class="tdTitle"><p:outputLabel value="* Town/ City" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbPermCity"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.pmCity.cityId}">
						<f:selectItems var="pcity"
							value="#{registrationBackingBean.managedBean.permenantCityLs}"
							itemValue="#{pcity.cityId}" itemLabel="#{pcity.cityName}" />
					</p:selectOneMenu></td>
			</tr>
			<!-- <tr>
				<td id="tdTitle">Phone No.</td>
				<td id="tdContent"><p:inputText size="40" /></td>
				<td id="tdTitle">* Mobile No.</td>
				<td id="tdContent"><p:inputText size="40" /></td>
			</tr>

			<tr>
				<td id="tdTitle">Fax No.</td>
				<td id="tdContent"><p:inputText size="40" /></td>
			</tr>-->
			<!-- 			<tr> -->
			<!-- 				<td id="tdTitle">* Email</td> -->
			<!-- 				<td id="tdContent"><p:inputText size="40" /></td> -->
			<!-- 			</tr> -->
			<!-- 			<tr> -->
			<!-- 				<td id="tdTitle">* Confirm Email</td> -->
			<!-- 				<td id="tdContent"><p:inputText size="40" /></td> -->
			<!-- 			</tr> -->
		</table>
	</p:panel>

	<ui:include src="/xhtml/sm/shared/onlinereg/bankInfo.xhtml" />
	<ui:include src="/xhtml/sm/shared/onlinereg/contactInfo.xhtml" />

	<div align="right">
		<p:commandButton value="Submit"
			action="#{registrationBackingBean.submitRegistration}" />
	</div>
</ui:composition>
