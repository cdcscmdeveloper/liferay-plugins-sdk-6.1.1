<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		<p:panel header="Individual Registration Information">
		<table class="test">
			<tr>
				<td id="tdTitle">Type of special service *</td>
				<td colspan="3" id="tdContent"><h:selectOneRadio>
						<f:selectItem itemLabel="Professional Service"
							itemValue="professional" />
						<f:selectItem itemLabel="Special Service" itemValue="special" />
						<!-- <p:ajax update="specServiceId,profServiceId" /> -->
					</h:selectOneRadio></td>
			</tr>

			<tr>
				<td id="tdTitle">Service *</td>
				<td id="tdContent"><p:selectOneMenu>
						<f:selectItem itemLabel="Select" itemValue="0" />
						<f:selectItem itemLabel="Bomoh hujan" itemValue="1" />
						<f:selectItem itemLabel="Penggali kubur" itemValue="2" />
						<f:selectItem itemLabel="Bidan" itemValue="3" />
						<f:selectItem itemLabel="Penyewaan sampan" itemValue="4" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td id="tdTitle">Identification No</td>
				<td id="tdContent"><h:inputText /></td>
			</tr>
			<tr>
				<td id="tdTitle">Owner Name *</td>
				<td id="tdContent"><h:inputText /></td>

			</tr>

			<tr>
				<td id="tdTitle">Permanent Address 1(As Per/IC) *</td>
				<td id="tdContent"><h:inputText size="50" colspan="3" /></td>
			</tr>

			<tr>
				<td id="tdTitle"></td>
				<td id="tdContent"><h:inputText size="50" colspan="3" /></td>
			</tr>
			<tr>
				<td id="tdTitle"></td>
				<td id="tdContent"><h:inputText size="50" colspan="3" /></td>
			</tr>
			<tr>
				<td id="tdTitle">Post Code *</td>
				<td id="tdContent"><h:inputText /></td>
				<td id="tdTitle">State *</td>
				<td id="tdContent"><h:inputText /></td>
			</tr>

			<tr>
				<td id="tdTitle">District *</td>
				<td id="tdContent"><h:inputText /></td>
				<td id="tdTitle">Town/ City *</td>
				<td id="tdContent"><h:inputText /></td>
			</tr>
			<tr>
				<td id="tdTitle">Telephone/ Mobile Number</td>
				<td id="tdContent"><h:inputText /></td>
			</tr>
			<tr>
				<td id="tdTitle">Email</td>
				<td id="tdContent"><h:inputText size="40" /></td>
			</tr>
			<tr>
				<td id="tdTitle">Confirm Email</td>
				<td id="tdContent"><h:inputText size="40" /></td>
			</tr>
		</table>
		</p:panel>
</ui:composition>
