<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<script type="application/javascript">
			$(document).ready(function(){
			  $("input[id$=usrEmail]").bind("cut copy paste",function(e) {
		          e.preventDefault();
		      });
			  
			  $("input[id$=conEmail]").bind("cut copy paste",function(e) {
		          e.preventDefault();
		      });
		    });
	</script>
	
	<p:panel header="#{lbl['lbl.sm.individual.individualreginfo']}"
		toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.individual.service']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:selectOneMenu required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.sm.individual.service']}"
						disabled="#{registrationBackingBean.managedBean.viewMode}"
						value="#{registrationBackingBean.managedBean.smSupp.serviceType}"
						id="serviceTypeId">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems
							value="#{registrationBackingBean.managedBean.serviceLs}"
							var="servType" itemLabel="#{servType.codeName}"
							itemValue="#{servType.pmParameter.parameterCode}" />
					</p:selectOneMenu> <p:message id="serviceTypeIdMsg" for="serviceTypeId"
						display="icon" /></td>

			</tr>
			
			<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.person.bumi']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					
					<td class="tdContent">
						<p:selectOneRadio id="bumiId" label="#{lbl['lbl.sm.person.bumi']}" 
							required="#{!empty param['disableValidation']}" 
							disabled="#{registrationBackingBean.managedBean.viewMode}"
							value="#{registrationBackingBean.managedBean.userBumiFlg}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
						</p:selectOneRadio></td>
					
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.person.religion']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					
					<td class="tdContent">
						<p:selectOneRadio id="religionId" label="#{lbl['lbl.sm.person.religion']}" 
							required="#{!empty param['disableValidation']}" 
							disabled="#{registrationBackingBean.managedBean.viewMode}"
							value="#{registrationBackingBean.managedBean.userMuslimFlg}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.person.religion.muslim']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.person.religion.non.muslim']}" itemValue="0" />
						</p:selectOneRadio>
					</td>
				</tr>			
			
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.individual.newicno']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<p:inputText id="individualRegNoId" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.individual.newicno']}"
						value="#{registrationBackingBean.managedBean.smSupp.regNo}"
						size="40" maxlength="12"
						disabled="#{!registrationBackingBean.managedBean.smSupp.brandNew}">
					</p:inputText>
					&#160; <p:graphicImage id="uidti" value="/css/images/design/tooltips.png" /> <p:tooltip id="uidtt" for="uidti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.user.id.no']}" />
					</p:tooltip> <p:message id="individualRegNoIdMsg" for="individualRegNoId"
						display="icon" /></td>
			</tr>
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.individual.nameasperic']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:inputText size="40" maxlength="100"
						id="individualNameId" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.sm.individual.nameasperic']}"
						disabled="#{registrationBackingBean.managedBean.viewMode}"
						value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.companyName}" />
					&#160; <p:graphicImage id="fNmti" value="/css/images/design/tooltips.png" /> <p:tooltip id="fNmtt" for="fNmti">
						<p:outputLabel escape="false"
							value="#{lbl['tt.sm.user.full.name']}" />
					</p:tooltip> <p:message id="individualNameIdMsg" for="individualNameId"
						display="icon" /></td>
						
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.userprofile.dob']}" />
					<p:outputLabel value="*" styleClass="mandatory" />		
				</td>
				<td class="tdContent"><p:calendar id="dobCalId"
						navigator="true" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.sm.userprofile.dob']}"
						value="#{registrationBackingBean.managedBean.smPersonnel.birthDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
						readonlyInput="true" size="30" showOn="button" yearRange="-99"  maxdate="#{CommonConstants.CURRENT_DATE}">
					</p:calendar></td>
			</tr>

			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.ic.address']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:inputText size="40" 
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.ic.address']}"
						id="txtPermAdd1" maxlength="35"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.address1}" />
					&#160; <p:graphicImage id="addti" value="/css/images/design/tooltips.png" /> <p:tooltip id="addtt" for="addti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.user.address']}" />
					</p:tooltip> <p:message id="txtPermAdd1Msg" for="txtPermAdd1" display="icon" /></td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.state']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:selectOneMenu id="cmbPermState" style="width:80%"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.state']}"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.pmState.stateId}"
						disabled="#{registrationBackingBean.managedBean.viewMode}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="state"
							value="#{registrationBackingBean.managedBean.permenantStateLs}"
							itemValue="#{state.stateId}" itemLabel="#{state.stateName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateDistrictByAddType('permenant', false)}"
							update="cmbPermDistrict,cmbPermCity" />
					</p:selectOneMenu> <p:message id="cmbPermStateMsg" for="cmbPermState" display="icon" /></td>
			</tr>

			<tr>
				<td></td>
				<td class="tdContent"><p:inputText size="40"
						id="txtPermAdd2" maxlength="35"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.address2}" /></td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.district']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:selectOneMenu id="cmbPermDistrict" style="width:80%"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.district']}"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.pmDistrict.districtId}"
						disabled="#{registrationBackingBean.managedBean.viewMode}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="dist"
							value="#{registrationBackingBean.managedBean.permenantDistrictLs}"
							itemValue="#{dist.districtId}" itemLabel="#{dist.districtName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateCityByAddType('permenant',false)}"
							update="cmbPermCity" />
					</p:selectOneMenu> <p:message id="cmbPermDistrictMsg" for="cmbPermDistrict"
						display="icon" /></td>
			</tr>

			<tr>
				<td></td>
				<td class="tdContent"><p:inputText size="40"
						id="txtPermAdd3" maxlength="35"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.address3}" /></td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.towncity']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:selectOneMenu id="cmbPermCity" style="width:80%"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.towncity']}"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.pmCity.cityId}"
						disabled="#{registrationBackingBean.managedBean.viewMode}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="pcity"
							value="#{registrationBackingBean.managedBean.permenantCityLs}"
							itemValue="#{pcity.cityId}" itemLabel="#{pcity.cityName}" />
					</p:selectOneMenu> <p:message id="cmbPermCityMsg" for="cmbPermCity" display="icon" /></td>
			</tr>

			<tr>
				<td></td>
				<td class="tdContent"><p:inputText size="40" 
						id="txtPermAdd4" maxlength="35"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.address4}" /></td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.postcode']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<p:inputText maxlength="5" required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.sm.postcode']}" id="txtPermPostcodeMy"
								value="#{registrationBackingBean.managedBean.smPermenantAdd.postcode}"
								validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
								size="40" disabled="#{registrationBackingBean.managedBean.viewMode}">
								<f:validator validatorId="postcodeValidator" />
							</p:inputText>
							<p:message id="txtPermPostcodeMyMsg" for="txtPermPostcodeMy"
								showSummary="true" showDetail="false" display="icon" />	
					
				</td>


			</tr>
		</table>

	</p:panel>
	<!-- 	<ui:include src="/xhtml/sm/shared/onlinereg/businessNature.xhtml" /> -->
	<!-- 	<ui:include src="/xhtml/sm/shared/onlinereg/identityUpload.xhtml"></ui:include> -->
	<ui:include src="/xhtml/sm/shared/onlinereg/bankInfo.xhtml"></ui:include>

	<p:panel header="#{lbl['lbl.sm.contactinfo']}" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td class="tdContent">
					<ac:phone id="txtPhoneNoId" isMobile="false" label="#{lbl['lbl.sm.phoneno']}"
						countryCode="#{registrationBackingBean.managedBean.smPersonnel.phoneCountry}" 
						areaCode="#{registrationBackingBean.managedBean.smPersonnel.phoneArea}" 
						number="#{registrationBackingBean.managedBean.smPersonnel.phoneNo}"  
						validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" />
				</td>


				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.mobilenumber']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<ac:phone id="txtMobileNoId" label="#{lbl['lbl.sm.mobileNo']}"
						countryCode="#{registrationBackingBean.managedBean.smPersonnel.mobileCountry}" 
						areaCode="#{registrationBackingBean.managedBean.smPersonnel.mobileArea}" 
						number="#{registrationBackingBean.managedBean.smPersonnel.mobileNo}" 
						isMobile="true" required="#{!empty param['disableValidation']}"
						validatorMessage="#{lbl['lbl.sm.mobilenumber']} - #{lbl['lbl.sm.invalidNo']}"
						telcoId="#{registrationBackingBean.managedBean.smPersonnel.mobileTelcoId}" /></td>
			</tr>

			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.email']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent"><p:inputText size="40" id="usrEmail"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.email']}" maxlength="80"
						value="#{registrationBackingBean.managedBean.smPersonnel.email}" validatorMessage="#{lbl['lbl.sm.invalidEmail']}">
						<f:validateRegex disabled="#{empty param['disableValidation']}"
							pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
					</p:inputText> &#160;
					<p:graphicImage id="emailti" value="/css/images/design/tooltips.png" />
					<p:tooltip id="emailtt" for="emailti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.user.email']}"  />
					</p:tooltip>
					<p:message id="usrEmailMsg" for="usrEmail" display="icon" />
				</td>
			</tr>

			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.confirmemail']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
				<p:inputText size="40" id="conEmail" value="#{registrationBackingBean.managedBean.confirmEmail}" 
				required="#{!empty param['disableValidation']}"  label="#{lbl['lbl.sm.confirmemail']}" maxlength="80"/>
				<p:message id="conEmailMsg" for="conEmail" display="icon" /></td>
			</tr>
	</table>
	<c:if test="#{registrationBackingBean.managedBean.smSupp.brandNew}">
		<ui:include src="/xhtml/sm/shared/onlinereg/contactInfo.xhtml" />
	</c:if>
	</p:panel>
</ui:composition>
