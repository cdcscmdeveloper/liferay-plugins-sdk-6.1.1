<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="#{lbl['lbl.sm.individual.individualreginfo']}" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.individual.servicecategory']}" /></td>
				<td class="tdContent" colspan="3">
					<p:selectOneRadio id="serviceCatId" required="true" label="#{lbl['lbl.sm.individual.servicecategory']}"
						value="#{registrationBackingBean.managedBean.smSupp.serviceCategory}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.individual.profservice']}" itemValue="P" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.individual.specialservice']}" itemValue="S" />
						<p:ajax event="valueChange" update="outPnl,serviceTypeId" listener="#{registrationBackingBean.getIndividualServiceType}"/>
					</p:selectOneRadio>
					<p:message id="serviceCatIdMsg" for="serviceCatId" display="icon" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.individual.service']}" /></td>
				<td class="tdContent"><p:selectOneMenu required="true" label="#{lbl['lbl.sm.individual.service']}"
						value="#{registrationBackingBean.managedBean.smSupp.serviceType}"
						id="serviceTypeId">
						<f:selectItem itemLabel="---Select" itemValue="" />
						<f:selectItems value="#{registrationBackingBean.managedBean.serviceLs}" var="servType" 
						itemLabel="#{servType.codeName}" itemValue="#{servType.pmParameter.parameterCode}" />
					</p:selectOneMenu>
					<p:message id="serviceTypeIdMsg" for="serviceTypeId" display="icon" /></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.individual.newicno']}" /></td>
				<td class="tdContent">
					<p:inputMask id="individualRegNoId" required="true" label="#{lbl['lbl.sm.individual.newicno']}"
						value="#{registrationBackingBean.managedBean.smSupp.regNo}"
						size="40" mask="999999999999"
						disabled="#{!registrationBackingBean.managedBean.smSupp.brandNew}" />
					&#160; <p:graphicImage id="uidti" library="ep/images/design"
						name="tooltips.png" /> <p:tooltip id="uidtt" for="uidti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.user.id.no']}" />
					</p:tooltip>
					<p:message id="individualRegNoIdMsg" for="individualRegNoId" display="icon" /></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.individual.nameasperic']}" /></td>
				<td class="tdContent">
				<p:inputText size="40" id="individualNameId" required="true" label="#{lbl['lbl.sm.individual.nameasperic']}"
						value="#{registrationBackingBean.managedBean.smAppl.smCompanyBasic.companyName}" />
					&#160; <p:graphicImage id="fNmti" library="ep/images/design"
						name="tooltips.png" /> <p:tooltip id="fNmtt" for="fNmti">
						<p:outputLabel escape="false"
							value="#{lbl['tt.sm.user.full.name']}" />
					</p:tooltip>
					<p:message id="individualNameIdMsg" for="individualNameId" display="icon" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.permenantaddress']}" /></td>
				<td class="tdContent"><p:inputText size="40" colspan="3" required="true" label="#{lbl['lbl.sm.permenantaddress']}"
						id="txtPermAdd1"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.address1}" />
					&#160; <p:graphicImage id="addti" library="ep/images/design"
						name="tooltips.png" /> <p:tooltip id="addtt" for="addti">
						<p:outputLabel escape="false" value="#{lbl['tt.sm.user.address']}" />
					</p:tooltip>
					<p:message id="txtPermAdd1Msg" for="txtPermAdd1" display="icon" /></td>
			</tr>

			<tr>
				<td></td>
				<td class="tdContent"><p:inputText size="40" colspan="3"
						id="txtPermAdd2"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.address2}" /></td>
			</tr>
			<tr>
				<td></td>
				<td class="tdContent"><p:inputText size="40" colspan="3"
						id="txtPermAdd3"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.address3}" /></td>
			</tr>
			<tr>
				<td></td>
				<td class="tdContent"><p:inputText size="40" colspan="3"
						id="txtPermAdd4"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.address4}" /></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.postcode']}" /></td>
				<td class="tdContent"><p:inputText size="40" required="true" label="#{lbl['lbl.sm.postcode']}"
						id="txtPermPostcode"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.postcode}" />
						<p:message id="txtPermPostcodeMsg" for="txtPermPostcode" display="icon" /></td>
						
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.state']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbPermState" required="true" label="#{lbl['lbl.sm.state']}"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.pmState.stateId}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="state"
							value="#{registrationBackingBean.managedBean.permenantStateLs}"
							itemValue="#{state.stateId}" itemLabel="#{state.stateName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateDistrictByAddType('permenant')}"
							update="cmbPermDistrict" />
					</p:selectOneMenu>
					<p:message id="cmbPermStateMsg" for="cmbPermState" display="icon" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.district']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbPermDistrict" required="true" label="#{lbl['lbl.sm.district']}"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.pmDistrict.districtId}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="dist"
							value="#{registrationBackingBean.managedBean.permenantDistrictLs}"
							itemValue="#{dist.districtId}" itemLabel="#{dist.districtName}" />
						<p:ajax event="change"
							listener="#{registrationBackingBean.populateCityByAddType('permenant')}"
							update="cmbPermCity" />
					</p:selectOneMenu>
					<p:message id="cmbPermDistrictMsg" for="cmbPermDistrict" display="icon" /></td>

				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.towncity']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbPermCity" required="true" label="#{lbl['lbl.sm.towncity']}"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.pmCity.cityId}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="pcity"
							value="#{registrationBackingBean.managedBean.permenantCityLs}"
							itemValue="#{pcity.cityId}" itemLabel="#{pcity.cityName}" />
					</p:selectOneMenu>
					<p:message id="cmbPermCityMsg" for="cmbPermCity" display="icon" /></td>
			</tr>
		</table>
	</p:panel>\
<!-- 	<ui:include src="/xhtml/sm/shared/onlinereg/businessNature.xhtml" /> -->
	<!-- 	<ui:include src="/xhtml/sm/shared/onlinereg/identityUpload.xhtml"></ui:include> -->
	<ui:include src="/xhtml/sm/shared/onlinereg/bankInfo.xhtml"></ui:include>

	<p:outputPanel id="outPnl">
		<c:if
			test="#{registrationBackingBean.managedBean.smSupp.serviceCategory == 'P'}">
			<ui:include src="/xhtml/sm/shared/onlinereg/profCert.xhtml" />
		</c:if>
	</p:outputPanel>

	<c:if test="#{registrationBackingBean.managedBean.smSupp.brandNew}">
		<ui:include src="/xhtml/sm/shared/onlinereg/contactInfo.xhtml" />
		<div align="left">
			<p:commandButton value="#{lbl['lbl.sm.prev']}" immediate="true"
				action="#{registrationBackingBean.returnToSignUp}" />
		</div>
	</c:if>
</ui:composition>
