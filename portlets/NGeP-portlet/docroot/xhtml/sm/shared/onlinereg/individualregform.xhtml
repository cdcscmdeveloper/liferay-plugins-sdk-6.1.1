<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Individual Registration Information" toggleable="true">
		<table class="customTbl">
			<tr>
				<td id="tdTitle">* Type of service category</td>
				<td colspan="3"><p:selectOneRadio
						value="#{registrationBackingBean.managedBean.smSupp.serviceCategory}">
						<f:selectItem itemLabel="Professional Service" itemValue="P" />
						<f:selectItem itemLabel="Special Service" itemValue="S" />
					</p:selectOneRadio></td>
			</tr>

			<tr>
				<td id="tdTitle">* Service</td>
				<td id="tdContent"><p:selectOneMenu
						value="#{registrationBackingBean.managedBean.smSupp.serviceType}">
						<f:selectItem itemLabel="Select" itemValue="0" />
						<f:selectItem itemLabel="Bomoh hujan" itemValue="1" />
						<f:selectItem itemLabel="Penggali kubur" itemValue="2" />
						<f:selectItem itemLabel="Bidan" itemValue="3" />
						<f:selectItem itemLabel="Penyewaan sampan" itemValue="4" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td id="tdTitle">* Identification No</td>
				<td id="tdContent"><p:inputText
						value="#{registrationBackingBean.managedBean.smSupp.regNo}"
						size="40"
						disabled="#{!registrationBackingBean.managedBean.smSupp.brandNew}" /></td>
			</tr>
			<tr>
				<td id="tdTitle">* Full Name(As Per/IC)</td>
				<td id="tdContent"><p:inputText
						value="#{registrationBackingBean.managedBean.smSupp.supplierName}"
						size="40" /></td>

			</tr>

			<tr>
				<td id="tdTitle">* Permanent Address(As Per/IC)</td>
				<td id="tdContent"><p:inputText size="40" colspan="3" /></td>
			</tr>

			<tr>
				<td></td>
				<td id="tdContent"><p:inputText size="40" colspan="3" /></td>
			</tr>
			<tr>
				<td></td>
				<td id="tdContent"><p:inputText size="40" colspan="3" /></td>
			</tr>
			<tr>
				<td></td>
				<td id="tdContent"><p:inputText size="40" colspan="3" /></td>
			</tr>
			<tr>
				<td id="tdTitle">* Post Code</td>
				<td id="tdContent"><p:inputText size="40" /></td>
				<td id="tdTitle">* State</td>
				<td id="tdContent"><p:inputText size="40" /></td>
			</tr>

			<tr>
				<td id="tdTitle">* District</td>
				<td id="tdContent"><p:inputText size="40" /></td>
				<td id="tdTitle">* Town/ City</td>
				<td id="tdContent"><p:inputText size="40" /></td>
			</tr>
			<!-- <tr>
				<td id="tdTitle">Phone No.</td>
				<td id="tdContent"><p:inputText size="40" /></td>
				<td id="tdTitle">* Mobile No.</td>
				<td id="tdContent"><p:inputText size="40" /></td>
			</tr>

			<tr>
				<td id="tdTitle">Fax No.</td>
				<td id="tdContent"><p:inputText size="40" /></td>
			</tr>-->
			<!-- 			<tr> -->
			<!-- 				<td id="tdTitle">* Email</td> -->
			<!-- 				<td id="tdContent"><p:inputText size="40" /></td> -->
			<!-- 			</tr> -->
			<!-- 			<tr> -->
			<!-- 				<td id="tdTitle">* Confirm Email</td> -->
			<!-- 				<td id="tdContent"><p:inputText size="40" /></td> -->
			<!-- 			</tr> -->
		</table>
	</p:panel>

	<ui:include src="/xhtml/sm/shared/onlinereg/bankInfo.xhtml" />

	<c:if test="#{registrationBackingBean.managedBean.smSupp.brandNew}">
		<ui:include src="/xhtml/sm/shared/onlinereg/contactInfo.xhtml" />
	</c:if>
	
	<div align="right">
		<p:commandButton value="Submit\"
			action="#{registrationBackingBean.submitRegisteration}" />
	</div>
</ui:composition>
