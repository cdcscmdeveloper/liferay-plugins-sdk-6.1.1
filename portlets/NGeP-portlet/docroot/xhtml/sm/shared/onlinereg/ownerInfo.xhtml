<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{registrationBackingBean.managedBean.headerName}" id="ownerBusiness"
		toggleable="true">
		<!-- 27691 START -->
		<p:dataTable id="tableOwner" var="varOwner" rowIndexVar="index"
			widgetVar="tableOwnerWidget"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.ssm']}"
			rendered="#{!registrationBackingBean.managedBean.showOwnerPersonnel}"
			value="#{registrationBackingBean.managedBean.smSuppOwners}"
			rowKey="#{varOwner}"
			sortBy="#{varOwner.ownerName}"	>
			<ac:paginator for="tableOwner" />	
			<p:column style="width:2%" disabledSelection="#{registrationBackingBean.isSmSupplierOwnerIsAdmin(varOwner)}" rendered="#{not empty registrationBackingBean.managedBean.smSuppOwners and registrationBackingBean.managedBean.companyValidWithSSM eq 'false'}">
				<f:facet name="header">
		        	<p:selectBooleanCheckbox value="#{registrationBackingBean.managedBean.allOwnerSelected}" >
		          		<p:ajax event="change" update=":#{p:component('ownerBusiness')}" 
							process="@this" partialSubmit="true" 
							listener="#{registrationBackingBean.toggleAllOwnerTick()}"/>
		          	</p:selectBooleanCheckbox>
		       	</f:facet>
				<p:selectBooleanCheckbox value="#{varOwner.ownerSelected}" disabled="#{registrationBackingBean.isSmSupplierOwnerIsAdmin(varOwner)}">
					<p:ajax event="change" update=":#{p:component('ownerBusiness')}" listener="#{registrationBackingBean.toggleOwnerCheckBox(varOwner)}"
						process="@this" partialSubmit="true" />
				</p:selectBooleanCheckbox>
			</p:column>
		<!-- 27691 END -->
			<p:column style="width:3%" styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.no']}" />
				</f:facet>
				<h:outputText value="#{index + 1}" />
			</p:column>
			<!-- #27691 START -->
			<p:column styleClass="column-align-center">
				<f:facet name="header">
				<c:choose>
				<c:when test="#{registrationBackingBean.managedBean.smSupp.businessType == 'K' or 
				registrationBackingBean.managedBean.smSupp.businessType == 'L' or 
				registrationBackingBean.managedBean.smSupp.businessType == 'M' or 
				registrationBackingBean.managedBean.smSupp.businessType == 'O'}">
					<h:outputText value="#{lbl['lbl.sm.directorname']}"/>
				</c:when>
				<c:otherwise>
					<h:outputText value="#{lbl['lbl.sm.ownername']}"/>
				</c:otherwise>
				</c:choose>		
				</f:facet>
						<h:outputText rendered="#{!varOwner.showTextField}" value="#{varOwner.ownerName}" />
					
						<p:inputText rendered="#{varOwner.showTextField}" maxlength="80"  value="#{varOwner.ownerName}"  converter="toUpperCaseConverter">								
						</p:inputText>		
			</p:column>
			<!-- #27691 END -->
			<p:column  styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.identificationtype']}" />
				</f:facet>
				<h:outputText value="#{registrationBackingBean.getParamDescriptionByLanguageAndPmParameter(varOwner.identificationType)}" />
			</p:column>
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<c:if test="#{not empty varOwner.nationality and varOwner.nationality.countryCode != 'MY' and varOwner.identificationType.parameterCode != 'I'}">
						<h:outputText value="#{lbl['lbl.sm.individual.passport']}" />
					</c:if>
					<c:if test="#{empty varOwner.nationality or varOwner.nationality.countryCode eq 'MY' or varOwner.identificationType.parameterCode eq 'I'}">
						<h:outputText value="#{lbl['lbl.sm.individual.newicno']}" />
					</c:if>
				</f:facet>
				<h:outputText rendered="#{!varOwner.showTextField}" value="#{varOwner.identificationNo}" />
			
				<p:inputText rendered="#{varOwner.showTextField}" maxlength="12" value="#{varOwner.identificationNo}">								
				</p:inputText>				
			</p:column>
			
			<p:column  styleClass="column-align-center">
				<f:facet name="header">
					<!-- #27826 start --><h:outputText value="*" styleClass="mandatory" /><!-- #27826 end -->
					<h:outputText value="#{lbl['lbl.sm.person.nationality.origin']}" />
				</f:facet>
				<!-- <h:outputText value="#{varOwner.nationality.countryName}" /> -->
				<!-- 16052019 - SSM INTEGRATION CR - START -->
				<!-- #27878 disable when choose applType = SupplierManagementConst.ACC_BASIC-->
				<!-- #27826 start -->
				<!-- #30064 varOwner.disableNationality -->
				<p:selectOneMenu 
					required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.person.nationality.origin']}" 
					value="#{varOwner.tempCountryId}"
					disabled="#{registrationBackingBean.managedBean.smAppl.applType==SupplierManagementConst.ACC_BASIC or 
					(varOwner.identificationType.parameterCode eq ParameterConst.identificationTypesIc and !varOwner.disableNationality) and
					(!varOwner.nationalityNull and varOwner.tempCountryId ne 0 )}">
					<f:selectItem itemValue="" itemLabel="#{lbl['lbl.txt.select']}" />
					<f:selectItems var="counLs"
						value="#{registrationBackingBean.managedBean.countryLs}" />
					<p:ajax event="change"
						listener="#{registrationBackingBean.setOwnerNationality(varOwner,true)}"
						update=":form:tableOwner" />
				</p:selectOneMenu>
				<!-- #27826 end start -->
				<!-- 16052019 - SSM INTEGRATION CR  - END -->
			</p:column>
			
			<p:column  styleClass="column-align-center" rendered="#{registrationBackingBean.managedBean.showOwner || registrationBackingBean.managedBean.showDirector}">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.composition.role']}" />
				</f:facet>
				<p:outputPanel>
						<table>
							<tr>
								<c:if test="#{registrationBackingBean.managedBean.showOwner}">
									<td style="width:10%" >
										<c:choose>
										<c:when test="registrationBackingBean.managedBean.smPersonnelAll.size() != null and registrationBackingBean.managedBean.smPersonnelAll.size() > 0">
										<!-- 27691 Start -->
											<p:selectBooleanCheckbox rendered="#{!varOwner.showTextField and registrationBackingBean.managedBean.showOwner}" value="#{varOwner.ownerIsEquity}" disabled="#{registrationBackingBean.managedBean.disableRole}" />												
										</c:when>
										<c:otherwise>
											<p:selectBooleanCheckbox rendered="#{!varOwner.showTextField and registrationBackingBean.managedBean.showOwner}" value="#{varOwner.ownerIsEquity}" disabled="#{registrationBackingBean.managedBean.disableRole}" />																						
										</c:otherwise>
										</c:choose>
										<p:selectBooleanCheckbox rendered="#{varOwner.showTextField and registrationBackingBean.managedBean.showOwner}" value="#{varOwner.ownerIsEquity}" disabled="#{registrationBackingBean.managedBean.disableRole}" />
										<!-- 27691 End -->
									</td>
									<td style="width:20%" >
										<h:outputText style="float: left" rendered="#{registrationBackingBean.managedBean.showOwner}" value="#{lbl['lbl.sm.person.equiOwner']}" />
								</td>
								</c:if>
								<c:if test="#{registrationBackingBean.managedBean.showDirectorInOwner}">
									<td style="width:10%" >
										<c:choose>
										<c:when test="registrationBackingBean.managedBean.smPersonnelAll.size() != null and registrationBackingBean.managedBean.smPersonnelAll.size() > 0">
										<!-- 27691 Start -->
											<p:selectBooleanCheckbox rendered="#{!varOwner.showTextField and registrationBackingBean.managedBean.showDirector}" value="#{varOwner.ownerIsDirector}" disabled="#{registrationBackingBean.managedBean.disableRole}" />
										</c:when>
										<c:otherwise>
											<p:selectBooleanCheckbox rendered="#{!varOwner.showTextField and registrationBackingBean.managedBean.showDirector}" disabled="#{registrationBackingBean.managedBean.disableRole}" value="#{varOwner.ownerIsDirector}"/>
										</c:otherwise>
										</c:choose>
										
										<p:selectBooleanCheckbox rendered="#{varOwner.showTextField and registrationBackingBean.managedBean.showDirector}" disabled="#{registrationBackingBean.managedBean.disableRole}" value="#{varOwner.ownerIsDirector}"/>
										<!-- 27691 End -->
									</td>
									<td style="width:20%" >
										<h:outputText style="float: left" rendered="#{registrationBackingBean.managedBean.showDirector}" value="#{lbl['lbl.sm.person.dir']}" />
									</td>
								</c:if>
							</tr>
						</table>
					</p:outputPanel>
			</p:column>

		</p:dataTable>
		<!-- 27691 - start - Unbold disabled on DEV Server -->
		<style>
		.ui-state-disabled {
			font-weight: normal !important;
		}
		</style>
		<!-- 27691 - end - Unbold disabled on DEV Server -->
		<!-- 27691 - start - Add/Delete Supplier Owner -->
		<script>
			function unselectSupplierOwner(index) {
				tableOwnerWidget.unselectRow(index);
				if (tableOwnerWidget.checkAllToggler.hasClass('ui-state-active')) {
   					tableOwnerWidget.checkAllToggler.removeClass('ui-state-active');
   					tableOwnerWidget.checkAllToggler.children().removeClass('ui-icon ui-icon-check');
   				}
			}
		</script>
	
		<!-- 27691 - start - Add/Delete Supplier Owner, #26238 (39153) -->
		<p:outputPanel id="suppOwnersActionPanel" 
			rendered="#{registrationBackingBean.showSupplierOwnersActionPanel}">
			<div align="right">
				<p:commandButton id="addOwnerBtnId" value="#{lbl['lbl.btn.add']}" partialSubmit="true"
					action="#{registrationBackingBean.addSupplierOwner}"
					disabled="#{registrationBackingBean.managedBean.activeDisicplinaryAction}"
					process="@this,tableOwner"
					update="@this,tableOwner,deleteOwnerBtnId"/>
				<p:commandButton id="deleteOwnerBtnId" value="#{lbl['lbl.btn.delete']}" partialSubmit="true"
					disabled="#{empty registrationBackingBean.managedBean.selectedSuppOwners
								or registrationBackingBean.managedBean.activeDisicplinaryAction}"
					process="@this,tableOwner"
					onclick="ownerDeletePopUp.show();"/>
			</div>
		</p:outputPanel>
		<!-- 27691 - end - Add/Delete Supplier Owner -->
		
		<p:dataTable id="tableOwnerPersonnel" var="varOwnerPersonnel" rowIndexVar="index"
			widgetVar="tableOwnerPersonnelWidget"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rendered="#{registrationBackingBean.managedBean.showOwnerPersonnel}"
			value="#{registrationBackingBean.managedBean.smPersonnelOwners}"
			rowKey="#{rowKeyObj}" 
			sortBy="#{varOwnerPersonnel.name}">
			<ac:paginator for="tableOwnerPersonnel" />

			<p:column style="width:3%" styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.no']}" />
				</f:facet>
				<h:outputText value="#{index + 1}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.ownername']}" />
				</f:facet>
				<h:outputText value="#{varOwnerPersonnel.name}" />
			</p:column>
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.identificationtype']}" />
				</f:facet>
				<h:outputText value="#{registrationBackingBean.getParamDescriptionByLanguageAndPmParameter(varOwnerPersonnel.identificationType)}" />
			</p:column>
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<c:if test="#{not empty varOwnerPersonnel.pmCountry and varOwnerPersonnel.pmCountry.countryCode != 'MY'}">
						<h:outputText value="#{lbl['lbl.sm.individual.passport']}" />
					</c:if>
					<c:if test="#{empty varOwnerPersonnel.pmCountry or varOwnerPersonnel.pmCountry.countryCode eq 'MY'}">
						<h:outputText value="#{lbl['lbl.sm.individual.newicno']}" />
					</c:if>
				</f:facet>
				<h:outputText value="#{varOwnerPersonnel.identificationNo}" />				
			</p:column>
			
			<p:column  styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.nationality.origin']}" />
				</f:facet>
				<p:selectOneMenu value="#{varOwnerPersonnel.pmCountry.countryId}" disabled="#{varOwnerPersonnel.identificationType.parameterCode eq ParameterConst.identificationTypesIc}">
					<f:selectItems var="counLs"
						value="#{registrationBackingBean.managedBean.countryLs}" />
						<p:ajax event="change" listener="#{registrationBackingBean.ownerNationalityOnChange}" update=":form:tableOwnerPersonnel" />
				</p:selectOneMenu>
			</p:column>
			
			<p:column  styleClass="column-align-center" rendered="#{registrationBackingBean.managedBean.showOwner || registrationBackingBean.managedBean.showDirector}">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.composition.role']}" />
				</f:facet>
				<p:outputPanel>
					<table>
						<tr>
							<c:if test="#{registrationBackingBean.managedBean.showOwner}">
								<td style="width:10%" >
									<p:selectBooleanCheckbox rendered="#{registrationBackingBean.managedBean.showOwner}" value="#{registrationBackingBean.managedBean.showOwner}" disabled="#{registrationBackingBean.managedBean.disableRole}" />
								</td>
								<td style="width:20%" >
									<h:outputText style="float: left" rendered="#{registrationBackingBean.managedBean.showOwner}" value="#{lbl['lbl.sm.person.equiOwner']}" />
								</td>
							</c:if>
							<c:if test="#{registrationBackingBean.managedBean.showDirectorInOwner}">
								<td style="width:10%" >
									<c:choose>
										<c:when test="registrationBackingBean.managedBean.smPersonnelAll.size() != null and registrationBackingBean.managedBean.smPersonnelAll.size() > 0">
											<p:selectBooleanCheckbox rendered="#{registrationBackingBean.managedBean.showDirector}" value="#{registrationBackingBean.managedBean.showDirector}" disabled="#{registrationBackingBean.managedBean.disableRole}" />
										</c:when>
										<c:otherwise>
											<p:selectBooleanCheckbox rendered="#{registrationBackingBean.managedBean.showDirector}" disabled="#{registrationBackingBean.managedBean.disableRole}" value="#{registrationBackingBean.managedBean.showDirector}"/>
										</c:otherwise>
									</c:choose>		
									<p:selectBooleanCheckbox rendered="#{registrationBackingBean.managedBean.showDirector}" disabled="#{registrationBackingBean.managedBean.disableRole}" value="#{registrationBackingBean.managedBean.showDirector}"/>
								</td>
								<td style="width:20%" >
									<h:outputText style="float: left" rendered="#{registrationBackingBean.managedBean.showDirector}" value="#{lbl['lbl.sm.person.dir']}" />
								</td>
							</c:if>
						</tr>
					</table>
				</p:outputPanel>
			</p:column>
			
		</p:dataTable>
		
	</p:panel>
	
	<ac:confirmationPopup id="ownerDeletePopUpId"
		widget="ownerDeletePopUp"
		okAction="registrationBackingBean.removeSupplierOwner"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update=":#{p:component('ownerBusiness')}"/>
	
	</ui:composition>
