<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.directorinfo']}" id="directorBusiness"
		toggleable="true">

		<p:dataTable id="tableDirector" var="varDirector" rowIndexVar="index"
			widgetVar="tableDirectorWidget"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			render="#{registrationBackingBean.managedBean.smPersonnelDirector != null and registrationBackingBean.managedBean.smPersonnelDirector.size() >0}"
			value="#{registrationBackingBean.managedBean.smPersonnelDirector}"
			rowKey="#{rowKeyObj}" 
			sortBy="#{varDirector.name}">
			<ac:paginator for="tableDirector" />

			<p:column style="width:3%" styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.no']}" />
				</f:facet>
				<h:outputText value="#{index + 1}" />
			</p:column>

			<p:column  styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.directorname']}" />
				</f:facet>
				<c:if test="#{varDirector.name!=''}">	
					<h:outputText value="#{varDirector.name}" />
				</c:if>
				<c:if test="#{varDirector.name==''}">	
					<p:inputText maxlength="80"  value="#{varDirector.name}" converter="toUpperCaseConverter">								
					</p:inputText>
				</c:if>
				
			</p:column>
			
			<p:column  styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.identificationtype']}" />
				</f:facet>
				<h:outputText value="#{registrationBackingBean.getParamDescriptionByLanguageAndPmParameter(varDirector.identificationType)}" />
			</p:column>
			
			<p:column  styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.individual.newicno']}" />
				</f:facet>
				<c:if test="#{varDirector.name==''}">
					<p:inputText 
								maxlength="12"  value="#{varDirector.identificationNo}">								
					</p:inputText>
				</c:if>
				<c:if test="#{varDirector.name!=''}">	
					<h:outputText value="#{varDirector.identificationNo}" />
				</c:if>
				
				
			</p:column>
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.nationality.origin']}" />
				</f:facet>
				<p:selectOneMenu id="origin#{varDirector.personnelId}" value="#{varDirector.pmCountry.countryId}" disabled="#{varDirector.identificationType.parameterCode eq ParameterConst.identificationTypesIc}">
					<f:selectItem itemValue="" itemLabel="#{lbl['lbl.txt.select']}" />
					<f:selectItems var="counLs"
						value="#{registrationBackingBean.managedBean.countryLs}" 
						itemLabel="#{counLs.countryName}" itemValue="#{counLs.countryId}"/>						
						<p:ajax event="change" partialSubmit="true" process="@this" update=":form:tableDirector"
						listener="#{registrationBackingBean.directorNationalityOnChange(varDirector)}"
						/>						
				</p:selectOneMenu>
				
			</p:column>
			
			<p:column  styleClass="column-align-center" rendered="#{registrationBackingBean.managedBean.showDirector}">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.composition.role']}" />
				</f:facet>
				<p:outputPanel>
						<table>
							<tr>	
								<td style="width:10%" >
									<p:selectBooleanCheckbox rendered="#{registrationBackingBean.managedBean.showDirector}" disabled="#{registrationBackingBean.managedBean.disableRole}" value="#{varDirector.director}"/>
								</td>
								<td style="width:20%" >
									<h:outputText style="float: left" rendered="#{registrationBackingBean.managedBean.showDirector}" value="#{lbl['lbl.sm.person.dir']}" />
								</td>
							</tr>
						</table>
					</p:outputPanel>
			</p:column>
			
		</p:dataTable>
	</p:panel>
	</ui:composition>
