<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.gst.info']}" toggleable="true" id="pnlGstInfo" rendered="#{registrationBackingBean.managedBean.smSupp.brandNew}">
		<table class="customTbl">	
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.gst.regno']}" />
					</td>
					<td class="tdContent" colspan="3">
						<p:inputText id="gstRegNoId"  maxlength="12"
							value="#{registrationBackingBean.managedBean.smGstSupplier.gstRegNo}"
							size="30" label="#{lbl['lbl.sm.gst.regno']}">
							<p:ajax event="blur" update="pnlGstInfo" listener="#{registrationBackingBean.validateGstRegNo}" 
								partialSubmit="true" process="@this"/>
						</p:inputText>
						<p:message id="gstRegNoIdMsg" for="gstRegNoId" display="icon" />
						
					</td>
				</tr>
				
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.gst.effdate']}" />
					</td>
					
					<td class="tdContent">
						<p:calendar id="gstEffDateCalId"
							navigator="true" required="#{registrationBackingBean.managedBean.gstFlag and !empty param['disableValidation']}" label="#{lbl['lbl.sm.gst.regdate']}"
							value="#{registrationBackingBean.managedBean.smGstSupplier.gstEffDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
							disabled="#{!registrationBackingBean.managedBean.gstFlag}"
							readonlyInput="true" size="30" showOn="button" yearRange="-99:+0" mindate="#{CommonConstants.GST_LAUNCH_DATE}">
							<p:ajax event="dateSelect" process="@this" partialSubmit="true" update="gstEndDateCalId"/>
						</p:calendar>
						<p:message id="gstEffDateCalIdMsg" for="gstEffDateCalId" display="icon" />
					</td>
					<td>&#160;</td>
					<td>&#160;</td>
				</tr>
				
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.gst.eff.end.date']}" />
					</td>
					
					<td class="tdContent">
						<p:calendar id="gstEndDateCalId"
							navigator="true" label="#{lbl['lbl.sm.gst.eff.end.date']}"
							value="#{registrationBackingBean.managedBean.smGstSupplier.gstEndDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"  
							disabled="#{!registrationBackingBean.managedBean.gstFlag}"
							readonlyInput="true" size="30" showOn="button" 
							mindate="#{registrationBackingBean.minGstEndDate}">
							<p:ajax event="dateSelect" process="@this" partialSubmit="true"/>
						</p:calendar>
					</td>
					<td>&#160;</td>
					<td>&#160;</td>
				</tr>
		</table>
		<br />

		<p:dataTable value="#{registrationBackingBean.managedBean.smGstSupplier.smGstSupplierDocs}" var="gstDoc" rowIndexVar="index" id="dtGstDocId">
			<p:column headerText="No.">
				#{index +1}
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.gst.document.desc']}">
				#{gstDoc.pmDocument.docName}
			</p:column>
			<p:column headerText="#{lbl['lbl.btn.upload.doc']}">
					<p:commandLink oncomplete="uploadDlg.show();return false;" update="@([id$=uploadDlg])" 
					disabled="#{!registrationBackingBean.managedBean.gstFlag}" action="#{registrationBackingBean.setSelectedGstDoc(gstDoc)}">
						<p:graphicImage value="/css/images/design/upload.png" style="margin-right:2px;" />
					</p:commandLink>
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.gst.document.name']}">
				<p:commandLink ajax="false" value="#{gstDoc.fileName}" rendered="#{not empty gstDoc.fileName}">
						<p:fileDownload value="#{registrationBackingBean.commonDownload(gstDoc.filePath,gstDoc.fileName,gstDoc.fileName)}" />
				</p:commandLink>
				<p:commandLink  rendered="#{not empty gstDoc.fileName}"  onclick="confirmDeleteHqDialog.show();"
					disabled="#{!registrationBackingBean.managedBean.gstFlag}" action="#{registrationBackingBean.setSelectedGstDoc(gstDoc)}">
						<p:graphicImage value="/css/images/design/delete.png" style="margin-right:2px;" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<p:dialog id="uploadDlg" widgetVar="uploadDlg" appendToBody="false" resizable="false" width="700px"
		height="350" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}">
		<p:fileUpload style="display:inline;" multiple="false" fileUploadListener="#{registrationBackingBean.handleFileUpload}"
			mode="basic" id="upload" fileLimit="1" sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" 
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" update="dtGstDocId"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			oncomplete="uploadDlg.hide();return false;" 
			uploadLabel="#{lbl['lbl.btn.upload']}"  
			label="#{lbl['lbl.btn.choose']}" 
			cancelLabel="#{lbl['lbl.btn.cancel']}" >
		</p:fileUpload>
	</p:dialog>
	
	<p:confirmDialog id="confirmDeleteHqDialog" closable="true" message="#{lbl['lbl.sm.gst.delete.attachment.confirm.msg']}"
	   header="#{lbl['lbl.sm.gst.delete.attachment.header']}" severity="alert"
	   widgetVar="confirmDeleteHqDialog">
	   
	   <div align="right">
	    <p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDeleteHqDialog.hide();" 
		     action="#{registrationBackingBean.removeGstUploadedFile()}" update="@([id$=pnlGstInfo])" />
	    <p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDeleteHqDialog.hide();" />
	   </div>
	 </p:confirmDialog>
</ui:composition>
