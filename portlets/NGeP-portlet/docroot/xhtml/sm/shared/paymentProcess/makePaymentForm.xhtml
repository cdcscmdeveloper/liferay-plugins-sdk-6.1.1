<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.payment.details']}" rendered="#{backingBean.managedBean.smAppl.applType eq 'N' or backingBean.managedBean.smAppl.applType eq 'R'}"
		toggleable="true">
		
		<h:outputText value="#{backingBean.managedBean.applDeclarationAlertMsg}" escape="false" /><br /><br />
		
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.application.no']}" /></td>
				<td><h:outputText value="#{backingBean.managedBean.smAppl.applNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.applicationtype']}" /></td>
				<td>
					<h:outputText value="#{lbl['lbl.sm.appltype.newmof']}" rendered="#{backingBean.managedBean.smAppl.applType eq 'N'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.renewmof']}" rendered="#{backingBean.managedBean.smAppl.applType eq 'R'}" />
				</td>
			</tr>
		</table><br /><br />
		
		<h:outputText value="#{lbl['lbl.sm.payment.section.instruction']}" escape="false" /><br /><br />
		
		<p:dataTable value="#{backingBean.managedBean.paymentDetailsVOList}" var="itemLs" rowIndexVar="index">
			<p:columnGroup type="header">
				<p:row>
					<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" />
					<p:column headerText="#{lbl['lbl.sm.payment.details']}" />
	                <p:column headerText="#{lbl['lbl.sm.price']}" />
	                <p:column headerText="#{lbl['lbl.sm.quantity']}" />
	                <p:column headerText="#{lbl['lbl.sm.payment.total.amount']}" />
	             </p:row>
			</p:columnGroup>
			
			<p:column style="width : 2% !important;">
				<h:outputText value="#{index + 1}" />
			</p:column>
			
			<p:column>
				<h:outputText value="** #{itemLs.details}" />
			</p:column>
	
			<p:column style="text-align:right !important;">
				<h:outputText value="#{itemLs.price}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column style="text-align:right !important;">
				<h:outputText value="-" />
			</p:column>
			
			<p:column style="text-align:right !important;">
				<h:outputText value="#{itemLs.totalAmount}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:columnGroup type="footer">
				<p:row>
	                <p:column style="text-align:right" footerText="#{lbl['lbl.sm.gst.total.exclude.gst']} :" colspan="4"/>
	                <p:column footerText="#{backingBean.managedBean.totalPaymentAmount}" style="text-align:right !important;" colspan="1"/>
	            </p:row>
	            <p:row>
	                <p:column style="text-align:right" footerText="#{backingBean.managedBean.gstPercentageLabels} :" colspan="4"/>
	                <p:column footerText="0.00" style="text-align:right !important;" colspan="1"/>
	            </p:row>
	            <p:row>
	                <p:column style="text-align:right" footerText="#{lbl['lbl.sm.payment.rounding.adjustment']} :" colspan="4"/>
	                <p:column footerText="0.00" style="text-align:right !important;" colspan="1"/>
	            </p:row>
	            <p:row>
	                <p:column style="text-align:right;font-weight: bold !important;" footerText="#{lbl['lbl.sm.payment.total.payable']} :" colspan="4"/>
	                <p:column footerText="#{backingBean.managedBean.totalPaymentAmount}" style="text-align:right !important;" colspan="1"/>
	            </p:row>
	        </p:columnGroup>
		</p:dataTable>
	
	</p:panel>

</ui:composition>
