<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
			<p:panel header="Payment Summary :">
				<p:dataTable>
					<p:columnGroup type="header">
						<p:row>
							<p:column headerText="Include" />
							<p:column headerText="NO." />
							<p:column headerText="Process / Description" />
							<p:column headerText="Quantity / No. Of Applications" />
							<p:column headerText="Amount (RM.)" />

						</p:row>
					</p:columnGroup>

					<p:column>
						<p:outputLabel />
					</p:column>

					<p:column>
						<p:outputLabel />
					</p:column>
					<p:column>
						<p:outputLabel />
					</p:column>
					<p:column>
						<p:outputLabel />
					</p:column>
					<p:column>
						<p:outputLabel />
					</p:column>

					<p:columnGroup type="footer">
						<p:row>
							<p:column colspan="4" footerText=" Total : 450"
								style="text-align:right" />
							<p:column footerText="" />

						</p:row>
					</p:columnGroup>
				</p:dataTable>
			</p:panel>
			<div align="center">
				<p:commandButton value="Make Payment" action="/xhtml/sm/shared/paymentProcess/paymentMsg.xhtml" />
				<p:commandButton value="Cancel" />
			</div>
	</ui:define>
</ui:composition>
