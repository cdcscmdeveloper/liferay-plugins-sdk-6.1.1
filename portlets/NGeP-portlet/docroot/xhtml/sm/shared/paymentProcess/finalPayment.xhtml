<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
			<div align="right">
				<p:commandButton value="Make Payment" action="#{commApplBackingBean.makePayment}" />
				<p:commandButton value="Cancel" />
			</div>
	
			<p:panel header="Payment Summary :">
				<p:dataTable id="paymentList" rowKey="#{pay}" rowIndexVar="index" 
				value="#{commApplBackingBean.managedBean.personnelList}" var="pay" 
				editable="true" style="word-wrap: break-word;table-layout: fixed;" 
				selection="#{commApplBackingBean.managedBean.selectPersonnelList}">
					<p:columnGroup type="header">
						<p:row>
							<p:column selectionMode="multiple" style="width:2%"/>
							<p:column headerText="Process / Description" />
							<p:column headerText="Amount (RM.)" />

						</p:row>
					</p:columnGroup>

					<p:ajax event="toggleSelect" listener="#{commApplBackingBean.updateAmount()}" update=":form:paymentList:payTotalAmt"/>
					<p:ajax event="rowSelect" listener="#{commApplBackingBean.updateAmount()}" update=":form:paymentList:payTotalAmt"/>
					<p:ajax event="rowSelectCheckbox" listener="#{commApplBackingBean.updateAmount()}" update=":form:paymentList:payTotalAmt"/>
					<p:ajax event="rowUnselectCheckbox" listener="#{commApplBackingBean.updateAmount()}" update=":form:paymentList:payTotalAmt"/>
					<p:ajax event="rowUnselect" listener="#{commApplBackingBean.updateAmount()}" update=":form:paymentList:payTotalAmt"/>
 
					<p:column selectionMode="multiple" style="width:2%" rendered="#{commApplBackingBean.managedBean.pListSize != index}"/>
					<p:column style="width:2%" rendered="#{commApplBackingBean.managedBean.pListSize == index}"/>

					<p:column rendered="#{commApplBackingBean.managedBean.pListSize != index}">
						<h:outputText value="Soft Cert Payment for #{pay.name}" rendered="#{commApplBackingBean.managedBean.pListSize != index}"/>
					</p:column>
					<p:column rendered="#{commApplBackingBean.managedBean.pListSize == index}" disabledSelection="true">	
						<h:outputText value="New MoF Fee" rendered="#{commApplBackingBean.managedBean.pListSize == index and commApplBackingBean.managedBean.applType eq 'N'}"/>
						<h:outputText value="Renew MoF Fee" rendered="#{commApplBackingBean.managedBean.pListSize == index and commApplBackingBean.managedBean.applType eq 'R'}"/>
					</p:column>
					<p:column rendered="#{commApplBackingBean.managedBean.pListSize != index}">
						<h:outputText value="150.00" rendered="#{commApplBackingBean.managedBean.pListSize != index}"/>
					</p:column>
					<p:column rendered="#{commApplBackingBean.managedBean.pListSize == index}" disabledSelection="true">	
						<h:outputText value="400.00" rendered="#{commApplBackingBean.managedBean.pListSize == index}"/>
					</p:column>
					
					<p:columnGroup type="footer">
						<p:row>
							<p:column footerText=""></p:column>
							<p:column footerText="Total"
								style="text-align:left" />
							<p:column id="payTotalAmt" footerText="#{commApplBackingBean.managedBean.totalAmount}" style="text-align:left"/>

						</p:row>
					</p:columnGroup>
				</p:dataTable>
			</p:panel>
	</ui:define>
</ui:composition>
