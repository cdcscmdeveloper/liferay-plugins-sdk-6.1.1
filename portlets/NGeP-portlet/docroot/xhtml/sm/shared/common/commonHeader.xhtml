<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<h:outputText styleClass="warning" style="font-weight: bold;" value="&#x26A0;  #{lbl['lbl.sm.glp.alert']}" rendered="#{showGlpAlert}" />
	<div align="left" class="header-info">
	<table class="customTbl">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.suppname']}" /></td>
				<td class="header-info-text">
					#{supplierName}
				</td>
				
				<td><p:outputLabel value="#{lbl['lbl.sm.application.no']}" /></td>
				<td class="header-info-text">
					#{applNo}
				</td>
				
				<td><p:outputLabel value="#{lbl['lbl.sm.applicationtype']} :" /></td>
				<td class="header-info-text">
					#{lbl[applType]}
				</td>
			</tr>
			<p:outputPanel rendered="#{not empty sdoReviewBackingBean.managedBean.rejectReasonsMsg 
				and sdoReviewBackingBean.managedBean.smAppl.resubmit}">
				<tr>
					<td style="vertical-align: baseline;"><p:outputLabel
							value="#{lbl['lbl.sm.rejection.reasons']}"
							styleClass="outputLabel-view-label" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" escape="false"
							value="#{sdoReviewBackingBean.managedBean.rejectReasonsMsg}" />
					</td>
					<td colspan="4">&#160;</td>
				</tr>
			</p:outputPanel>
	</table>
	</div>
</ui:composition>
