<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<table class="customTbl">
			<tr>
				<td><p:outputLabel value="Supplier Name" /></td>
				<td><p:inputText value="#{supplierName}"
						disabled="true" size="40" /></td>
				
				<td><p:outputLabel value="Application No." /></td>
				<td><p:inputText value="#{applNo}" disabled="true"
						size="40" /></td>
				
				<td><p:outputLabel value="Application Type" /></td>
				<td><p:inputText value="#{lbl[applType]}" disabled="true"
						size="40" /></td>
			</tr>
	</table>
</ui:composition>
