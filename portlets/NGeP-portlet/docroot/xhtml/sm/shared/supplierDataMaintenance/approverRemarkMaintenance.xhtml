<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.sectionApprRmrk']}" toggleable="true"
		id="approverRemarkPanelId">

		<table style="width: 50%; table-layout: fixed">
			<tr>

				<td>#{lbl['lbl.sm.approver.remark.click']} <p:commandLink
						value="#{lbl['lbl.sm.approver.remark.instruction']}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						action="#{supplierDataMaintenanceBackingBean.onViewApprRemarkHistoryList()}"
						process="@this" partialSubmit="true">
					</p:commandLink> #{lbl['lbl.sm.approver.remark.history.remark']}
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
				<td><p:inputTextarea autoResize="false" cols="41"
						id="approveRemark" maxlength="2500"
						label="#{lbl['lbl.sm.sectionApprRmrk']}"
						value="#{supplierDataMaintenanceBackingBean.managedBean.approverRemark}" />
					<p:message id="approverRemarkMsg" for="approveRemark"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
		</table>
	</p:panel>

	<p:dialog id="approverRemarkDialog" widgetVar="approverRemarkDialog"
		header="#{lbl['lbl.sm.approver.remark.viewhistory.remark']}"
		showEffect="fade" hideEffect="fade" modal="true" width="600px"
		height="500px" resizable="true">

		<p:dataTable id="approvalHistoryRemarklist" var="smRemark"
			value="#{supplierDataMaintenanceBackingBean.managedBean.approverRemarkList}"
			rowKey="#{smRemark}" rowIndexVar="index">
			<p:column headerText="#{lbl['lbl.sm.approvremark.no']}"
			 style="width:5%;white-space: normal;">
				<h:outputText value="#{index +1}" />
			</p:column>

			<p:column  headerText="#{lbl['lbl.sm.approvremark.actiondate']}"
			style="width:10%;white-space: normal;">
				<h:outputText value="#{smRemark.createdDate}">

					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATETIME_WITH_SECONDS_FORMAT}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.approvremark.remarknotes']}"
				style="width:55%;white-space: normal;">
				<h:outputText value="#{smRemark.remark}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.approvremark.actionby']}"
				style="width:30%;white-space: normal;">
				<h:outputText
					value="#{supplierDataMaintenanceBackingBean.getUserNameByUserId(smRemark.createdBy)}" />
			</p:column>

		</p:dataTable>

	</p:dialog>




</ui:composition>
