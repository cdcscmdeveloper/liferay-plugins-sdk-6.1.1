<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.supp.data.maintenance.delete.approved.cat.instruction']}" />
	
	<p:dataTable var="aprvdCatBean"
		widgetVar="smApprvdCatCodesNonRenewApplDtWidVar"
		value="#{supplierDataMaintenanceBackingBean.managedBean.approvedCategoryList}" 
		selection="#{supplierDataMaintenanceBackingBean.managedBean.selectedApprovedCategories}"
		rowKey="#{aprvdCatBean}" rowIndexVar="index" id="catApprDt"
		emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
		<ac:paginator for="catApprDt" />
			<p:ajax event="rowSelect" partialSubmit="true" process="@this"
				update=":form:catCodeInfPan,@([id$=deletedApprBtnId])"></p:ajax>
			<p:ajax event="rowUnselect"
				update=":form:catCodeInfPan,@([id$=deletedApprBtnId])"></p:ajax>
			<p:ajax event="rowSelectCheckbox"
				update=":form:catCodeInfPan,@([id$=deletedApprBtnId])"></p:ajax>
			<p:ajax event="rowUnselectCheckbox"
				update=":form:catCodeInfPan,@([id$=deletedApprBtnId])"></p:ajax>
			<p:ajax event="rowDblselect"
				update=":form:catCodeInfPan,@([id$=deletedApprBtnId])"></p:ajax>
		<p:columnGroup type="header">
			<p:row>
				<p:column style="width:2%" />
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
					style="width : 2%;" />
				<p:column style="width :350px;white-space : normal"
					headerText="#{lbl['lbl.sm.catCodes.cate']}" />
				<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}" style="width : 10% !important;"/>
				<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}" style="width : 25% !important;"/>
				<p:column headerText="#{lbl['lbl.sm.status']}" />
			</p:row>
		</p:columnGroup>
		<p:column selectionMode="multiple" style="width:2%" />
		<p:column style="width : 2%;">
			<p:outputLabel value="#{index + 1}"
				style="float: left;white-space: normal;" />
		</p:column>
		<p:column style="width :350px;white-space : normal">
			<h:outputText
				value="#{aprvdCatBean.pmCategoryL1.categoryL1Code} -  #{aprvdCatBean.pmCategoryL1.categoryName}" />
			<br />
			<h:outputText
				value="#{aprvdCatBean.pmCategoryL2.categoryL2Code} -  #{aprvdCatBean.pmCategoryL2.categoryName}" />
			<br />
			<h:outputText
				value="#{aprvdCatBean.pmCategoryL3.categoryL3Code} -  #{aprvdCatBean.pmCategoryL3.categoryName}" />
		</p:column>
		<p:column style="width : 10% !important;">
			<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
				rendered="#{!aprvdCatBean.specialCategory}" />
			<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
				rendered="#{aprvdCatBean.specialCategory}" />
		</p:column>
		<p:column style="width : 25% !important;">
			<p:inputTextarea id="otherDescMaintenance" maxlength="100"
				style="width : auto;" label="#{lbl['lbl.sm.catCodes.othDesc']}"
				value="#{aprvdCatBean.otherDesc}" rows="5" cols="40"
				rendered="#{aprvdCatBean.pmCategoryL3.otherDescReq eq 1}">
			</p:inputTextarea>
			<p:graphicImage id="otherDescMaintenanceImg"
				value="/css/images/design/icon_alert.png"
				style="padding-left : 3px;"
				rendered="#{not empty aprvdCatBean.approvedDate 
				and aprvdCatBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS 
				and not empty aprvdCatBean.prevOtherDesc}" />
			<p:tooltip for="otherDescMaintenanceImg">
				<p:inputTextarea readonly="true" disabled="true" rows="5" cols="20"
					style="width : auto;"
					value="#{lbl['lbl.sm.catCodes.prevDesc']} #{aprvdCatBean.prevOtherDesc}" />
			</p:tooltip>
			<p:message for="otherDescMaintenance" showDetail="false" showSummary="true"
				display="icon" />
		</p:column>
		<p:column>
			<h:outputText value="#{lbl['lbl.sm.catCodes.registered']}" />
		</p:column>
	</p:dataTable>
	
	<div align="right">
		<!-- #30766 & #34209 - START - add component to update -->
		<p:commandButton value="#{lbl['lbl.sm.button.delete']}" id="deletedApprBtnId" 
			disabled="#{empty supplierDataMaintenanceBackingBean.managedBean.selectedApprovedCategories or 
				!supplierDataMaintenanceBackingBean.managedBean.allowedToDoMaintenance}"
			action="#{supplierDataMaintenanceBackingBean.deleteSelectedPendingApprovalCategoryCodes(supplierDataMaintenanceBackingBean.managedBean.selectedApprovedCategories)}" 
			update=":#{p:component('catcodeMainPanelId')},:#{p:component('messages')}" partialSubmit="true" 
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			process="@this">
		</p:commandButton>
		<!-- #30766 & #34209 - END -->
	</div>

</ui:composition>
