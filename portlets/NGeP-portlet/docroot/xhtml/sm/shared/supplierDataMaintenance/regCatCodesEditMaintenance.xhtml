<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<p:dataTable var="catBean" widgetVar="smCatCodesNonRenewApplDtWidVar"
			value="#{viewSmApplBackingBean.managedBean.activeCategoryList}"
			rowKey="#{catBean}" rowIndexVar="index" id="catDt"
			selection="#{viewSmApplBackingBean.managedBean.deleteNewApplCategoryList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<ac:paginator for="catDt" />
			<p:ajax event="rowSelect" partialSubmit="true" process="@this"
				listener="#{viewSmApplBackingBean.unSelectApprovedCategories}"
				update=":form:catCodeInfPan"></p:ajax>
			<p:ajax event="rowUnselect"
				listener="#{viewSmApplBackingBean.unSelectApprovedCategories}"
				update=":form:catCodeInfPan"></p:ajax>
			<p:ajax event="rowSelectCheckbox"
				listener="#{viewSmApplBackingBean.unSelectApprovedCategories}"
				update=":form:catCodeInfPan"></p:ajax>
			<p:ajax event="rowUnselectCheckbox"
				listener="#{viewSmApplBackingBean.unSelectApprovedCategories}"
				update=":form:catCodeInfPan"></p:ajax>
			<p:ajax event="rowDblselect"
				listener="#{viewSmApplBackingBean.unSelectApprovedCategories}"
				update=":form:catCodeInfPan"></p:ajax>
			<p:columnGroup type="header">
				<p:row>
					<!-- 1 -->
					<p:column style="width:2%" 
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS or not empty catBean.approvedDate}" />
					<!-- 2 -->
					<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
						style="width : 2%;"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<!-- 3 -->
					<p:column style="width :350px;white-space : normal"
						headerText="#{lbl['lbl.sm.catCodes.cate']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<!-- 4 -->
					<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<!-- 5 -->
					<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<!-- 6 -->
					<p:column headerText="#{lbl['lbl.sm.status']}"
						rendered="#{!viewSmApplBackingBean.managedBean.poUser and !viewSmApplBackingBean.managedBean.approverUser}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:row>
			</p:columnGroup>
			<!-- 1 -->
			<p:column selectionMode="multiple" style="width:2%" disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS or not empty catBean.approvedDate}" />
			<!-- 2 -->
			<p:column style="width : 2%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>
			<!-- 3 -->
			<p:column style="width :350px;white-space : normal"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
				<h:outputText
					value="#{catBean.pmCategoryL1.categoryL1Code} -  #{catBean.pmCategoryL1.categoryName}" />
				<br />
				<h:outputText
					value="#{catBean.pmCategoryL2.categoryL2Code} -  #{catBean.pmCategoryL2.categoryName}" />
				<br />
				<h:outputText
					value="#{catBean.pmCategoryL3.categoryL3Code} -  #{catBean.pmCategoryL3.categoryName}" />
			</p:column>
			<!-- 4 -->
			<p:column
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
				<p:inputTextarea id="otherDesc" maxlength="100"
					style="width : auto;" label="#{lbl['lbl.sm.catCodes.othDesc']}"
					value="#{catBean.otherDesc}" rows="5" cols="20"
					rendered="#{catBean.pmCategoryL3.otherDescReq eq 1}">
					<p:ajax event="blur" process="@this" partialSubmit="true"
						listener="#{viewSmApplBackingBean.assignCategoryReApprovalOnOtherDescChange(catBean)}"
						update="@([id$=editCatCodePanelId])" />
				</p:inputTextarea>
				<p:graphicImage id="prevOtherDesc"
					value="/css/images/design/icon_alert.png"
					style="padding-left : 3px;"
					rendered="#{not empty catBean.approvedDate and catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and not empty catBean.prevOtherDesc and (viewSmApplBackingBean.managedBean.poUser or viewSmApplBackingBean.managedBean.approverUser)}" />
				<p:tooltip for="prevOtherDesc">
					<p:inputTextarea readonly="true" disabled="true" rows="5" cols="20"
						style="width : auto;"
						value="#{lbl['lbl.sm.catCodes.prevDesc']} #{catBean.prevOtherDesc}" />
				</p:tooltip>
				<p:message for="otherDesc" showDetail="false" showSummary="true"
					display="icon" />
			</p:column>
			<!-- 5 -->
			<p:column
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
				<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
					rendered="#{!catBean.specialCategory}" />
				<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
					rendered="#{catBean.specialCategory}" />
			</p:column>
			<!-- 6 -->
			<p:column
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}"
				rendered="#{!viewSmApplBackingBean.managedBean.poUser and !viewSmApplBackingBean.managedBean.approverUser}">
				<h:outputText value="#{lbl['lbl.sm.catCodes.pendingDec']}"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}" />
				<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
			</p:column>
		</p:dataTable>
		
		<div align="right">
			#{lbl['lbl.sm.payment.click']}
			<p:commandLink value="#{lbl['lbl.sm.payment.here']}" ajax="false"
				action="#{viewSmApplBackingBean.downloadFile('/docuRepo/dev/ngep/shared/SM/Kod_Bidang_Baharu_Bekalan_Perkhidmatan.pdf')}"
				rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType ne 'J'}"></p:commandLink>
			<p:commandLink value="#{lbl['lbl.sm.payment.here']}" ajax="false"
				action="#{viewSmApplBackingBean.downloadFile('/docuRepo/dev/ngep/shared/SM/Kod_Bidang_Baharu_Perkhidmatan_Perunding.pdf')}"
				rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq 'J'}"></p:commandLink>
			#{lbl['lbl.sm.download.categorycode']}
			<p:commandButton value="#{lbl['lbl.sm.button.add']}"
				partialSubmit="true" process="@this"
				oncomplete="catCodePopup.show();">
			</p:commandButton>

			<ac:lookupCategoryCode okAction="viewSmApplBackingBean.addNewCategoryAction"
				update="@([id$=catCodeInfPan])"
				supplierType="#{viewSmApplBackingBean.managedBean.smAppl.supplierType}"
				facilityType="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.facilityType}"
				paidUpCapital="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.paidUpCapital}"
				categoryType="#{viewSmApplBackingBean.managedBean.smAppl.applCategoryType}"
				bumiPercentage="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.bumiPercentage}"
				businessTypeCode="#{viewSmApplBackingBean.managedBean.smSupplier.businessType}" />

			<p:commandButton value="#{lbl['lbl.sm.button.delete']}" disabled="#{empty viewSmApplBackingBean.managedBean.deleteNewApplCategoryList}"
				action="#{viewSmApplBackingBean.deleteSelectedPendingApprovalCategoryCodes}"
				update=":form:catCodeInfPan" partialSubmit="false" ajax="false"
				process=":form:catCodeInfPan">
			</p:commandButton>

		</div>
		
		<p:spacer height="2px;" />
</ui:composition>
