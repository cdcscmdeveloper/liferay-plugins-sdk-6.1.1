<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="#{lbl['lbl.sm.rv.section.name']}" toggleable="true"
		id="revisitPanelId">
		<div align="left">
			#{lbl['lbl.sm.rv.history.link.part.one']}
			<p:commandLink value="#{lbl['lbl.sm.rv.history.link.part.two']}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				action="#{supplierDataMaintenanceBackingBean.onClickRevisitHistoryList()}"
				process="@this" partialSubmit="true">
			</p:commandLink>
			#{lbl['lbl.sm.rv.history.link.part.three']}
		</div>
	</p:panel>
	<ac:smRevisitHistoryPopUp dialogName="revisitHistoryDialog"
		smRevisitList="#{supplierDataMaintenanceBackingBean.managedBean.smRevisitList}"
		backingBean="#{supplierDataMaintenanceBackingBean}" />
</ui:composition>
