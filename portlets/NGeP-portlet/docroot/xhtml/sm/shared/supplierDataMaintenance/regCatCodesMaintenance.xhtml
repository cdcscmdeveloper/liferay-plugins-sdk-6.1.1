<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.catCodes.panHdr']}" toggleable="true" id="catcodeMainPanelId">
		<!-- 36504 - START -->
		<table style="width: 100%">
			<tr>
				<td><p:outputPanel
						align="left">
						<h:outputText
							value="#{lbl['lbl.sm.other.desc.history.click']}"
							escape="false" />
						<p:commandLink
							onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()"
							action="#{backingBean.otherDescriptionHistory}"
							process="@this"
							partialSubmit="true"
							update=":form">
							<u><h:outputText
									value="#{lbl['lbl.sm.other.desc.history.here']}"
									style="color:blue;"
									escape="false" /></u>
						</p:commandLink>
						<p:spacer width="2" />
						<h:outputText
							value="#{lbl['lbl.sm.other.desc.history.to.view.history.of.other.desc']}"
							escape="false" />
						<br />
						<p:spacer height="2" />
					</p:outputPanel></td>
			</tr>
		</table>
		<!-- 36504 - END -->
			
		<ui:include src="regCatCodesApprovedMaintenance.xhtml" />
			
		<p:outputPanel id="catCodeInfPan" layout="block">
			<c:if test="#{supplierDataMaintenanceBackingBean.managedBean.overLappedCategoryExists}">
				<table style="width: 100%">
					<tr>
						<td>
							<span id="blinkId4"><h:outputText styleClass="instruction" value="#{lbl['lbl.txt.alert']}" /></span><span style="opacity: 0.0;"><h:outputText styleClass="warning" value="#{lbl['lbl.txt.alert']}" /></span>
						</td>
					</tr>
					<tr>
						<td>
						<p:outputLabel escape="false"
								value="#{supplierDataMaintenanceBackingBean.managedBean.overLappedCategoryMsg}"
								style="color: red;font-weight: bold;float:left;" /></td>
					</tr>
				</table>
				
				<script>
					$(function(){
					    // Self-executing recursive animation
					    (function pulse(){
					        $('#blinkId4').delay(1000).fadeOut('slow').delay(50).fadeIn('slow',pulse);
					    })();
					});
				</script>
				
			</c:if>
			
			<table style="width: 100%">
				<c:choose>
					<c:when test="#{supplierDataMaintenanceBackingBean.managedBean.smAppl.supplierType eq 'J'}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.applCatType']}" /></td>
							<td>
								<p:selectOneRadio value="#{supplierDataMaintenanceBackingBean.managedBean.physicalConsulting}">
									<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.physical.service']}"
										itemValue="33" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.non.physical.service']}"
										itemValue="34" />
									<p:ajax event="change" oncomplete="typeConfirmation.show()"
										listener="#{supplierDataMaintenanceBackingBean.applicationCategorySelected}"
										update="@([id$=typeConfirmationId])" process="@this"/>
								</p:selectOneRadio>
							</td>							
						</tr>
					</c:when>
					<c:otherwise>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.catType']}" /></td>
							<td><p:selectOneRadio
									value="#{supplierDataMaintenanceBackingBean.managedBean.smAppl.applCategoryType}">
									<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.catTypeNrm']}"
										itemValue="N" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.catTypeSpl']}"
										itemValue="S"
										itemDisabled="#{supplierDataMaintenanceBackingBean.managedBean.basicCompanyFacility.facilityType eq 'H'}" />
									<p:ajax event="change" oncomplete="typeConfirmation.show()"
										listener="#{supplierDataMaintenanceBackingBean.applicationCategorySelected}"
										update="@([id$=typeConfirmationId])" />
								</p:selectOneRadio></td>
						</tr>
					</c:otherwise>
				</c:choose>
			</table>
			
			<table>
				<tr>
					<td align="left" colspan="2"><h:outputText
							value="#{supplierDataMaintenanceBackingBean.managedBean.catTypeConfirm}"
							rendered="#{supplierDataMaintenanceBackingBean.managedBean.smAppl.applCategoryType != null}"
							style="color: blue; font-weight: bold;" /></td>
				</tr>
			</table>

			<br />
			
			<ui:include src="regCatCodesEditMaintenance.xhtml" />
			
		</p:outputPanel>
		
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.catCodes.overlapped.cat.remarkHdr']}" toggleable="true" id="overlapCategoryRemarkPanelId">
		<table style="width: 50%;table-layout:fixed">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.catCodes.overlapped.remarks']}" />
					</td>
				<td><p:inputTextarea autoResize="false" cols="41" id="overlapCategoryRemark" 
						maxlength="500" label="#{lbl['lbl.sm.catCodes.overlapped.remarks']}"
						value="#{supplierDataMaintenanceBackingBean.managedBean.poApprOverlappedRemark}" />
					<p:message id="overlapCategoryRemarkMsg"
					for="overlapCategoryRemark" showSummary="true" showDetail="false"
					display="icon" />
				</td>
			</tr>
		</table>
	</p:panel>	

	<p:confirmDialog id="typeConfirmationId"
		message="#{supplierDataMaintenanceBackingBean.managedBean.regCatCodeConfirmMsg}"
		header="#{supplierDataMaintenanceBackingBean.managedBean.regCatCodeConfirmHeader}"
		widgetVar="typeConfirmation">
		
		<div align="right">
			<p:commandButton id="conf" value="#{lbl['lbl.txt.yes']}"
				process="@this" partialSubmit="true" update="@form"
				action="#{supplierDataMaintenanceBackingBean.assignApplnCategoryType}"
				oncomplete="typeConfirmation.hide()" />
			<p:commandButton id="decline" value="#{lbl['lbl.txt.no']}"
				process="@this" partialSubmit="true" update=":form:catCodeInfPan"
				action="#{supplierDataMaintenanceBackingBean.resetApplnCategoryType}" />
		</div>

	</p:confirmDialog>
	
	<!-- 36504 - START -->
	<ac:otherDescriptionHistory categoryCodeList="#{backingBean.managedBean.approvedCategoryList}" applNo="#{backingBean.managedBean.smAppl.applNo}" />
   	<!-- 36504 - END -->
   	
</ui:composition>
