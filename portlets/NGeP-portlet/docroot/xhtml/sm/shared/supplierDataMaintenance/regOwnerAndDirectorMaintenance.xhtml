<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.list.owner.director']}"
		toggleable="true" id="smPersonnelParentPan">

		<p:outputPanel id="persInfPan" layout="block">
			<p:outputPanel id="persInfoDtPanel" layout="block">
	
			<p:dataTable var="person" widgetVar="suppPersonnelInfoDtWidVar"
				value="#{supplierDataMaintenanceBackingBean.managedBean.ownerAndDirectorList}"
				rowKey="#{person}" rowIndexVar="index" id="personDt">
				<ac:paginator for="personDt" />
				
				<p:column>
					<h:graphicImage value="/css/images/design/ico-disabled-chckbx.png" 
						rendered="#{!supplierDataMaintenanceBackingBean.managedBean.suspendRegistration and
						!supplierDataMaintenanceBackingBean.managedBean.cancelRegistration and 
						!supplierDataMaintenanceBackingBean.managedBean.blacklistOwnerOrDirector}"/>
					<h:graphicImage value="/css/images/design/ico-tick-checkbox.png" 
						rendered="#{supplierDataMaintenanceBackingBean.managedBean.suspendRegistration  or
						supplierDataMaintenanceBackingBean.managedBean.cancelRegistration or
						supplierDataMaintenanceBackingBean.managedBean.blacklistOwnerOrDirector}"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.person.composition.name']}">
					<h:outputText value="#{person.name}" />
				</p:column>
		
				<p:column headerText="#{lbl['lbl.sm.person.composition.idenNum']}">
					<h:outputText value="#{person.identificationNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.person.composition.isEqui']}">
					<h:outputText value="#{lbl['lbl.txt.yes']}" rendered="#{person.equityOwner}" />
					<h:outputText value="#{lbl['lbl.txt.no']}" rendered="#{!person.equityOwner}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.person.composition.isAuth']}">
					<h:outputText value="#{lbl['lbl.txt.yes']}"
						rendered="#{person.authorizedFlg eq '1'}" />
					<h:outputText value="#{lbl['lbl.txt.no']}"
						rendered="#{person.authorizedFlg eq '0'}" />
				</p:column>
				<p:column rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq 'K'}"
					headerText="#{lbl['lbl.sm.person.composition.certStatus']}">
					<ac:smSoftcertStatus personnel="#{person}"  />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.person.composition.role']}">
					<h:outputText value="#{lbl['lbl.sm.person.equiOwner']}" rendered="#{person.equityOwner}"/>
					<h:outputText value="," rendered="#{person.equityOwner and person.director}"/>
					<h:outputText value="#{lbl['lbl.sm.person.dir']}" 
						rendered="#{person.director}"/>
					<h:outputText value="," rendered="#{(person.equityOwner or person.director)
						and (person.contractSignerFlg eq 1 
						and supplierDataMaintenanceBackingBean.managedBean.smAppl.supplierType ne 'J')}"/>
					<h:outputText value=" (#{lbl['lbl.sm.contract.signer']})"
						rendered="#{person.contractSignerFlg eq 1 
						and supplierDataMaintenanceBackingBean.managedBean.smAppl.supplierType ne 'J'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.person.composition.eprole']}">
					<ac:smRoleDesc backingBean="#{supplierDataMaintenanceBackingBean}" roleCode="#{person.epRole}"/>
				</p:column>
		
			</p:dataTable>
			
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>

</ui:composition>
