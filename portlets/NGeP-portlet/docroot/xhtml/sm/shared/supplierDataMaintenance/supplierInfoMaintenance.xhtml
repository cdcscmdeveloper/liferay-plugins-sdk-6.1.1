<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.supp.info']}" toggleable="true"
		id="suppInfoPanelId">
		<p:outputPanel id="suppInfoOutId" layout="block">
			<table style="width: 50%;table-layout:fixed">
				<p:outputPanel rendered="#{not empty supplierDataMaintenanceBackingBean.managedBean.smAppl.pmStatus}">
					<tr><td><p:outputLabel value="#{lbl['lbl.rpt.rgstStatus']}" styleClass="outputLabel-view-label"/> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
	
					<td><p:selectOneMenu label="#{lbl['lbl.rpt.rgstStatus']}"
							id="regStatusId" required="true" disabled="#{!supplierDataMaintenanceBackingBean.managedBean.allowedToDoMaintenance}"
							value="#{supplierDataMaintenanceBackingBean.managedBean.smAppl.pmStatus.statusId}"
							style="width: 270px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{supplierDataMaintenanceBackingBean.managedBean.regStatusDescList}" var="reg"
								itemLabel="#{reg.statusName}"
								itemValue="#{reg.pmStatus.statusId}" />
	
						</p:selectOneMenu> <p:message id="regStatusIdMsg" for="regStatusId"
							showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</p:outputPanel>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.mofacc.expiry.date']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:calendar showOn="button" navigator="true"
							display="inline" required="true" readonlyInput="true"
							label="#{lbl['lbl.sm.mofacc.expiry.date']}" id="expDate"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							mindate="#{CommonConstants.CURRENT_DATE}"
							value="#{supplierDataMaintenanceBackingBean.managedBean.smMofAccount.expDate}" />
						<p:message id="expDateMsg" for="expDate"
								showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
			</table>
		</p:outputPanel>

	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.disciplinary.action.headerLbl']}" toggleable="true" id="disciplinaryActionPanelId">
		<table style="width: 50%;table-layout:fixed">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.disciplinary.action.edit']}" /></td>
				<td>
					<p:selectBooleanCheckbox value="#{supplierDataMaintenanceBackingBean.managedBean.editDisciplinaryAction}" 
						disabled="#{!supplierDataMaintenanceBackingBean.managedBean.allowedToDoMaintenance}">
			            <p:ajax update="@form" />
			        </p:selectBooleanCheckbox>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.disciplinary.jktt.start.date']}" />
					<p:outputLabel value="*" styleClass="mandatory" 
					rendered="#{supplierDataMaintenanceBackingBean.managedBean.editDisciplinaryAction}"/></td>
				<td><p:calendar showOn="button" navigator="true"
						display="inline" readonlyInput="true"
						label="#{lbl['lbl.sm.disciplinary.jktt.start.date']}" id="startDate"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						mindate="#{CommonConstants.CURRENT_DATE}" 
						value="#{supplierDataMaintenanceBackingBean.managedBean.disciplineVO.smDiscplinaryAction.startDate}" 
						required="#{supplierDataMaintenanceBackingBean.managedBean.editDisciplinaryAction}" 
						disabled="#{!supplierDataMaintenanceBackingBean.managedBean.editDisciplinaryAction}" />
					<p:message id="startDateMsg" for="startDate"
							showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.disciplinary.jktt.end.date']}" />
					<p:outputLabel value="*" styleClass="mandatory" 
					rendered="#{supplierDataMaintenanceBackingBean.managedBean.editDisciplinaryAction}"/></td>
				<td><p:calendar showOn="button" navigator="true"
						display="inline" readonlyInput="true"
						label="#{lbl['lbl.sm.disciplinary.jktt.end.date']}" id="endDate"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						mindate="#{CommonConstants.CURRENT_DATE}" 
						value="#{supplierDataMaintenanceBackingBean.managedBean.disciplineVO.smDiscplinaryAction.endDate}" 
						required="#{supplierDataMaintenanceBackingBean.managedBean.editDisciplinaryAction}" 
						disabled="#{!supplierDataMaintenanceBackingBean.managedBean.editDisciplinaryAction}" />
					<p:message id="endDateMsg" for="endDate"
							showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.disciplinary.jktt.remarks']}" />
					<p:outputLabel value="*" styleClass="mandatory" 
					rendered="#{supplierDataMaintenanceBackingBean.managedBean.editDisciplinaryAction}"/></td>
				<td><p:inputTextarea autoResize="false" cols="41" id="suspendRemark" 
						disabled="#{!supplierDataMaintenanceBackingBean.managedBean.editDisciplinaryAction}"
						maxlength="500" label="#{lbl['lbl.sm.disciplinary.jktt.remarks']}"
						value="#{supplierDataMaintenanceBackingBean.managedBean.disciplineVO.smDiscplinaryAction.remark}" 
						required="#{supplierDataMaintenanceBackingBean.managedBean.editDisciplinaryAction}" />
					<p:message id="suspendRemarkMsg"
					for="suspendRemark" showSummary="true" showDetail="false"
					display="icon" />
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
