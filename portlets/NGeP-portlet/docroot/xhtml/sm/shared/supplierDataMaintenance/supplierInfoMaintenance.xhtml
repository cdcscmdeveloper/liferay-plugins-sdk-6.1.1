<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.supp.info']}" toggleable="true"
		id="suppInfoPanelId">
		<p:outputPanel id="bsInfPan" layout="block">
			<table style="width: 100%;table-layout:fixed">
				<p:outputPanel rendered="#{not empty viewSmApplBackingBean.managedBean.smAppl.pmStatus}">
					<tr><td><p:outputLabel value="#{lbl['lbl.rpt.rgstStatus']}" styleClass="outputLabel-view-label"/> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
	
					<td><p:selectOneMenu label="#{lbl['lbl.rpt.rgstStatus']}"
							id="approveSelBox" required="true"
							value="#{viewSmApplBackingBean.managedBean.smAppl.pmStatus.statusId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{viewSmApplBackingBean.managedBean.regStatusDescList}" var="reg"
								itemLabel="#{reg.statusName}"
								itemValue="#{reg.pmStatus.statusId}" />
	
						</p:selectOneMenu> <p:message id="approveSelBoxMsg" for="approveSelBox"
							showSummary="true" showDetail="false" display="icon" /></td>
						<td>&#160;</td>
					</tr>
				</p:outputPanel>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.mofacc.expiry.date']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:calendar showOn="button" navigator="true"
							display="inline" required="true" readonlyInput="true"
							label="#{lbl['lbl.sm.mofacc.expiry.date']}" id="expDate"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							yearRange="-99:+0" maxdate="#{viewSmApplBackingBean.managedBean.currDate}"
							value="#{viewSmApplBackingBean.managedBean.smMofAccount.expDate}" />
						<p:message id="expDateMsg" for="expDate"
								showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
			</table>
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.save']}" update=":form:suppInfoPanelId,bsInfPan"
					action="#{viewSmApplBackingBean.update}" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
				</p:commandButton>
			</div>
		</p:outputPanel>

	</p:panel>
</ui:composition>
