<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:tabMenu  styleClass="sidemenu" style="display : table-caption;" activeIndex="#{svoSiteVisitBackingBean.managedBean.activeIndex}" id="tabIndex">
		<p:menuitem value="Site Visit Info" update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(0,'')}" />
		<p:menuitem value="Financial Information" update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(1,'')}" />
		<p:menuitem value="Category Applicable" update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(2,'')}" />
		
		<c:forEach var="catType" items="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvTemplates}">
				<p:menuitem value="#{lbl['lbl.sm.sitevisit.category.transportation']}"
					update="pnlDisplay,tabIndex" rendered="#{catType.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_TRANSPORTATION}"
					actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(11,catType.pmParameter.parameterCode)}" />
			
				<p:menuitem value="#{lbl['lbl.sm.sitevisit.category.workshop']}"  
					update="pnlDisplay,tabIndex" rendered="#{catType.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_WORKSHOP}"
					actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(12,catType.pmParameter.parameterCode)}" />

				<p:menuitem value="#{lbl['lbl.sm.sitevisit.category.insurance']}" 
					update="pnlDisplay,tabIndex" rendered="#{catType.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_INSURANCE}"
					actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(13,catType.pmParameter.parameterCode)}" />
			
				<p:menuitem value="#{lbl['lbl.sm.sitevisit.category.dockyard']}"
					update="pnlDisplay,tabIndex" rendered="#{catType.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_DOCKYARD}"
					actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(14,catType.pmParameter.parameterCode)}" />

				<p:menuitem value="#{lbl['lbl.sm.sitevisit.category.manufacturing']}" 
					update="pnlDisplay,tabIndex" rendered="#{catType.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_MANUFACTURING}"
					actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(15,catType.pmParameter.parameterCode)}" />
			
				<p:menuitem value="#{lbl['lbl.sm.sitevisit.category.printing']}" 
					update="pnlDisplay,tabIndex" rendered="#{catType.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_PRINTING}"
					actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(16,catType.pmParameter.parameterCode)}" />
			
				<p:menuitem value="#{lbl['lbl.sm.sitevisit.category.travel']}" 
					update="pnlDisplay,tabIndex" rendered="#{catType.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_TRAVEL}"
					actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(17,catType.pmParameter.parameterCode)}" />
					
		</c:forEach>
		<p:menuitem value="Report Submission" update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(20,'')}" />
	</p:tabMenu>
