<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:tabMenu  styleClass="sidemenu" style="display : table-caption;" activeIndex="#{svoSiteVisitBackingBean.managedBean.activeIndex}" id="tabIndex">
		<p:menuitem value="Site Visit Info" update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(0,'')}" />
		<p:menuitem value="Financial Information" update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(1,'')}" />
		<p:menuitem value="Category Applicable" update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(2,'')}" />
		<p:menuitem value="Office Location"  update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(3,'')}" />
		
		<c:forEach items="#{svoSiteVisitBackingBean.managedBean.indexPageMap}" var="entry">
			<ui:param name="lblCategory" value="lbl.sm.sitevisit.category.categorycode_#{entry.value}" />
	   		<p:menuitem value="#{lbl[lblCategory]}" update="pnlDisplay,tabIndex" 
					actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(entry.key,entry.value)}" />
		</c:forEach>

		<p:menuitem value="Report Submission" update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(svoSiteVisitBackingBean.managedBean.lastIndex,'')}" />.
	</p:tabMenu>
	
</ui:composition>
