<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:tabMenu  styleClass="sidemenu" style="display:table-caption; width:20%;" activeIndex="#{svoSiteVisitBackingBean.managedBean.activeIndex}" id="tabIndex">
		<p:menuitem value="#{lbl['lbl.sm.svo.sitevisit.info']}" update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(0,null)}" />
		<p:menuitem value="#{lbl['lbl.sm.sitevisit.section.b']}" update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(1,null)}" />
		<ui:remove>
		<c:forEach items="#{svoSiteVisitBackingBean.managedBean.indexPageMap}" var="entry">
		
	   		<p:menuitem value="#{svoSiteVisitBackingBean.getParameterDesc(entry.value.pmParameter)}" update="pnlDisplay,tabIndex" 
					actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(entry.key,entry.value)}" />
		</c:forEach>
		</ui:remove>
		
		<p:menuitem value="#{svoSiteVisitBackingBean.getParameterDesc(svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3.categoryTypeCode)}" update="pnlDisplay,tabIndex" 
				rendered="#{not empty svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3}" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(2,svoSiteVisitBackingBean.managedBean.selectedSvTemplate)}" />
					
		<p:menuitem value="#{lbl['lbl.sm.sv.templ.bumiputera']}" update="pnlDisplay,tabIndex" 
				rendered="#{empty svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3}"
				actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(2,svoSiteVisitBackingBean.managedBean.selectedSvTemplate)}" />
					
		<p:menuitem value="#{lbl['lbl.sm.sitevisit.section.d']}" update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(3,null)}" />
		<p:menuitem value="#{lbl['lbl.sm.officeloc']}"  update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(4,null)}" />
		<p:menuitem value="#{lbl['lbl.sm.sitevist.report.submission']}" 
		update="pnlDisplay,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(svoSiteVisitBackingBean.managedBean.lastIndex,null)}" />
	</p:tabMenu>
	
</ui:composition>
