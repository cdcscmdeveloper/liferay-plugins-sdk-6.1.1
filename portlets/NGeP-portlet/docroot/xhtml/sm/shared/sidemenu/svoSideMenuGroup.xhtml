<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:tabMenu  styleClass="sidemenu" style="display:table-caption; width:20%;" activeIndex="#{svoSiteVisitBackingBean.managedBean.activeIndex}" id="tabIndex">
		<p:menuitem value="#{lbl['lbl.sm.svo.sitevisit.info']}" 
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			update="@form" actionListener="#{svoSiteVisitBackingBean.changePageIndex(0,null,true)}" />
			
		<p:menuitem value="#{lbl['lbl.sm.sitevisit.section.b']}" 
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			update="@form" actionListener="#{svoSiteVisitBackingBean.changePageIndex(1,null,true)}" />
		
		<p:menuitem value="#{lbl['lbl.sm.sitevisit.licenseinsurance']}" update="@form" 
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				actionListener="#{svoSiteVisitBackingBean.changePageIndex('l',svoSiteVisitBackingBean.managedBean.smSvTask.smSvTemplate,true)}" 
				rendered="#{svoSiteVisitBackingBean.managedBean.licensed}"/>
		
		<p:menuitem value="#{svoSiteVisitBackingBean.managedBean.parameterDesc}" update="@form" 
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				rendered="#{not empty svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3}" 
				actionListener="#{svoSiteVisitBackingBean.changePageIndex('c',svoSiteVisitBackingBean.managedBean.smSvTask.smSvTemplate,true)}" />
					
		<p:menuitem value="#{lbl['lbl.sm.sv.templ.bumiputera']}" update="@form" 
				rendered="#{empty svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3}"
				actionListener="#{svoSiteVisitBackingBean.changePageIndex('c',svoSiteVisitBackingBean.managedBean.smSvTask.smSvTemplate,true)}" />
					
		<p:menuitem value="#{lbl['lbl.sm.sitevisit.section.d']}" update="@form" 
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				actionListener="#{svoSiteVisitBackingBean.changePageIndex('r',null,true)}" />
				
		<p:menuitem value="#{lbl['lbl.sm.officeloc']}"  update="@form" 
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				actionListener="#{svoSiteVisitBackingBean.changePageIndex('o',null,true)}" />
				
		<p:menuitem value="#{lbl['lbl.sm.sitevist.report.submission']}" update="@form" 
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				actionListener="#{svoSiteVisitBackingBean.changePageIndex('s',svoSiteVisitBackingBean.managedBean.smSvTask.smSvTemplate,true)}" />
	</p:tabMenu>
	
</ui:composition>
