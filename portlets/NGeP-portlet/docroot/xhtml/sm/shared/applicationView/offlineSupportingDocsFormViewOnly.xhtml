<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<script>
		function printDiv() {
			newWin = window.open();

			var divToPrint = document.getElementById('printArea');
			newWin.document.write(divToPrint.innerHTML);

			var style = newWin.document.createElement('style');
			style.type = 'text/css';
			style.innerHTML = '.ui-panel-title{font-family: Arial;margin: 0 0 0 5px !important;border: 0px !important;border-radius: 0px !important;background: none !important;color: #5BA218;font-size: 12px !important;font-weight: bold;}.ui-panel-titlebar{padding: 2px 0 3px 5px !important;background: none !important;height: 19px !important;border-radius: 0px;text-transform: uppercase;}.ui-outputlabel{display: inline-block;text-align: left !important;font-size: 12px;vertical-align: middle;padding: 0 10px 0 0;font-family: Arial;}table {border-collapse: collapse;border-spacing: 0;font-family: Tahoma;font-size: 11px;overflow: hidden;}.ui-datatable{font-family: Arial;color: #333333 !important;text-decoration: none;}.ui-datatable-tablewrapper{overflow: auto;}.ui-widget .ui-widget{font-size: 12px;}.ui-datatable th.ui-state-default{font-family: Arial;font-weight: bold !important;text-decoration: none;background: #F0EFEF;}thead>tr>th.ui-state-default{color: #555555 !important;font-size: 12px !important;text-align: left;}.ui-datatable thead th, .ui-datatable tbody td, .ui-datatable tfoot td{border: 1px solid #DDDDDD !important;}.ui-datatable thead th, .ui-datatable tbody td, .ui-datatable tfoot td{padding: 4px 10px;overflow: hidden;white-space: nowrap;border-width: 1px;border-style: solid;}.ui-state-default{text-shadow: none !important;box-shadow: none !important;}';
			newWin.document.getElementsByTagName('head')[0].appendChild(style);

			newWin.print();
			newWin.close();
		}
	</script>
	
	<p:dialog id="docCheckListDlg" widgetVar="docCheckListDlg" modal="true"
		dynamic="true" resizable="false" width="900px"
		height="700px" styleClass="pop_up_top" 
		header="#{lbl['lbl.sm.printchecklist.header']}">
		<p:media value="#{viewSmApplBackingBean.getOfflineSuppDocCheckList()}" 
			width="100%" height="700px" player="pdf" />
		<p:panelGrid styleClass="noBorders tr,noBorders td" >
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.btn.close']}"
						onclick="docCheckListDlg.hide()" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>
	
	<div id="printArea">
	<p:panel
		header="#{lbl['lbl.sm.suppDoc.offline.checklist.application.no']} #{viewSmApplBackingBean.managedBean.smAppl.applNo}"
		toggleable="true">
		
		<ui:remove>
			<c:if test="#{not empty viewSmApplBackingBean.managedBean.bumiRecommendationNote}">
				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.bumiRecommendationNote}" 
								style="color: green;font-weight: bold;float:left;"/></td>
					</tr>
				</table>
			</c:if>
			<br />
		</ui:remove>
		
		<table style="width: 100%;">

			<tr>
				<td>
					<h:outputText style="float:left"
						value="#{lbl['lbl.sm.suppDoc.offline.note1']}" /> <br /> 
					<h:outputText style="float:left"
						value="#{lbl['lbl.sm.suppDoc.offline.note3']}" /> <br />
				</td>
				<td>
					<div align="right">
						<p:commandLink onclick="printDiv();">
							<p:graphicImage value="/css/images/design/print.png"
										style="margin-right:2px;" title="#{lbl['lbl.sm.printList']}"/>
						</p:commandLink>
					</div>
				</td>
			</tr>

		</table>
		<p:spacer height="10px" />
		<table style="width: 100%;">
			<tr>
				<td style="width: 33%">
					<table>
						<tr>
							<td><p:outputLabel style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.peninAddr1']}"
									escape="false" /></td>
						</tr>
						<tr>
							<td style="padding-top: 10px;"><p:outputLabel
									style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.peninAddr2']}"
									escape="false" /></td>
						</tr>
					</table>
				</td>

				<td style="width: 33%"><table>
						<tr>
							<td><p:outputLabel style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr1']}"
									escape="false" /></td>
						</tr>
						<tr>
							<td style="padding-top: 10px;"><p:outputLabel
									style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr2']}"
									escape="false" /></td>
						</tr>
					</table></td>
				<td style="width: 33%"><table>
						<tr>
							<td><p:outputLabel style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr1']}"
									escape="false" /></td>
						</tr>
						<tr>
							<td style="padding-top: 10px;"><p:outputLabel
									style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr2']}"
									escape="false" /></td>
						</tr>
					</table></td>
			</tr>
		</table>
		<p:spacer height="10px" />


		<p:dataTable var="table" id="offSdList"
			value="#{viewSmApplBackingBean.managedBean.smApplSupportDocs}" rowIndexVar="index">
			
			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 5%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" style="width : 95%;">
				<h:outputText value="#{table.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>

		</p:dataTable>

		<br />
		<p:spacer height="2px;" />

	</p:panel>
	</div>
</ui:composition>
