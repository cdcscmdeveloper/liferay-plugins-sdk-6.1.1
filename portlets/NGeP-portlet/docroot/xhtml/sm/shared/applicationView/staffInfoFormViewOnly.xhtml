<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.panHdr.stfInfo']}" toggleable="true">
		<p:outputPanel id="stfInfPan" layout="block">
			<ui:repeat var="staff" value="#{viewSmApplBackingBean.managedBean.smStaffTotals}">
				<table style="width: 50%;table-layout:fixed">
					<tr>
						<td style="vertical-align: baseline;">
							<p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.staff.totalStaff']} "
								rendered="#{staff.staffCategory eq SupplierManagementConst.STAFF_TYPE_CONTRACTOR}" />
							<p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.staff.profStaff']}"
								rendered="#{staff.staffCategory eq SupplierManagementConst.STAFF_TYPE_PROFESSIONAL}" />
							<p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.staff.semiProfStaff']}"
								rendered="#{staff.staffCategory eq SupplierManagementConst.STAFF_TYPE_SEMIPROF}" />
							<p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.staff.clericalStaff']}"
								rendered="#{staff.staffCategory eq SupplierManagementConst.STAFF_TYPE_CLERICAL}" /></td>
						<td>
							<table>
								<tr>
									<td><p:outputLabel value="#{lbl['lbl.sm.staff.bumi']}" styleClass="outputLabel-view" /></td>
									<td><p:outputLabel value="(#{staff.totalBumi})" styleClass="outputLabel-view" /></td>
								</tr>
								<tr>
									<td><p:outputLabel value="#{lbl['lbl.sm.staff.nonBumi']}" styleClass="outputLabel-view" /></td>
									<td><p:outputLabel value="(#{staff.totalNonBumi})" styleClass="outputLabel-view" /></td>
								</tr>
								<tr>
									<td><p:outputLabel value="#{lbl['lbl.sm.staff.frgnr']}" styleClass="outputLabel-view" /></td>
									<td><p:outputLabel value="(#{staff.totalForeigner})" styleClass="outputLabel-view" /></td>
								</tr>
							</table>
						</td>
					</tr>
				</table>
			</ui:repeat>
				
		</p:outputPanel>
		
		<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
						poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.staffRemark}" 
						approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.staffRemark}" />
	</p:panel>
</ui:composition>
