<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.panHdr.offFacility']}" id="ofp"
		toggleable="true">
		<p:outputPanel id="offInfPan" layout="block">
			<table style="width: 100%;table-layout:fixed">

				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.ownerType']}" /></td>
					<td>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.own']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownershipType eq 'O'}"/>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.rent']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownershipType eq 'R'}"/>
					</td>
					<td>&#160;</td>
					<td>&#160;</td>
				</tr>
				<c:if test="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownershipType eq 'R'}">
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.facilityType']}" /></td>
						<td>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.facilityType.home.office']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.facilityType eq 'H'}"/>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.facilityType.business.office']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.facilityType eq 'B'}" />
						</td>
						<td>&#160;</td>
						<td>&#160;</td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.landLordName']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownerName}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.monthRent']}" /></td>
						<td><ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.rentalRate}" /></td>
					</tr>
					
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.companyaddress']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.address1}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.pmCountry.countryName}"/></td>
					</tr>
					<tr>
						<td>&#160;</td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.address2}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.pmState.stateName}"/></td>
					</tr>
					<tr>
						<td>&#160;</td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.address3}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.pmDistrict.districtName}"/></td>
					</tr>
					<tr>
						<td>&#160;</td>
						<td></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.pmCity.cityName}"/></td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.postcode}" /></td>
						<td>&#160;</td>
						<td>&#160;</td>
					</tr>
					</c:if>
					
					<c:if test="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownershipType eq 'O'}">
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.facilityType']}" /></td>
						<td>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.facilityType.home.office']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.facilityType eq 'H'}"/>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.facilityType.business.office']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.facilityType eq 'B'}" />
						</td>
						<td>&#160;</td>
						<td>&#160;</td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.ownerName']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownerName}"/></td>
						<td>&#160;</td>
						<td>&#160;</td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.purchaseDate']}" /></td>
						<td><ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.purchaseDate}" /></td>
						<td>&#160;</td>
						<td>&#160;</td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.purchasePrice']}" /></td>
						<td><ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.purchasePrice}" /></td>
						<td>&#160;</td>
						<td>&#160;</td>
					</tr>
					</c:if>
					
				</table>
				
		</p:outputPanel>
		
		<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
					poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.officeFacilityRemark}" 
					approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.officeFacilityRemark}" />
	</p:panel>
</ui:composition>
