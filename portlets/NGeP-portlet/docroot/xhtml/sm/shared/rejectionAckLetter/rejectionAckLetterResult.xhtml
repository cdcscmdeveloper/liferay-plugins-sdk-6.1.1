<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel header="#{lbl['lbl.sm.results']}" toggleable="true"
		id="resultSupplierProfilePanelId">
		<p:dataTable var="smAppl" widgetVar="rejectAckWidgetVar"
			editable="false" lazy="true" rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{rejectionAckLetterBB.managedBean.rejectionAckDataModel}" 
			id="rejectionAckLetterDtId" rowKey="#{smAppl}" rowIndexVar="index">
			<ac:paginator for="rejectionAckLetterDtId" />

			<p:column headerText="#{lbl['lbl.sm.companyname']}" style="width :25%;white-space : normal">
				<h:outputText value="#{smAppl.smSupplier.companyName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.application.no']}">
				<h:outputText value="#{smAppl.applNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.applicationtype']}" style="width :25%;white-space : normal">
				<h:outputText value="#{lbl['lbl.sm.appltype.newmof']}" rendered="#{smAppl.applType eq 'N'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.bumiputera']}" rendered="#{smAppl.applType eq 'B'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.categorycode']}" rendered="#{smAppl.applType eq 'A'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.updateprofile']}" rendered="#{smAppl.applType eq 'U'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.cancelmof']}" rendered="#{smAppl.applType eq 'C'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.renewmof']}" rendered="#{smAppl.applType eq 'R'}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.rpt.supplierType']}">
				<h:outputText value="#{lbl['lbl.sm.contractor']}" rendered="#{smAppl.supplierType eq 'K'}" />
				<h:outputText value="#{lbl['lbl.sm.consultant']}" rendered="#{smAppl.supplierType eq 'J'}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.regStatus']}">
				<h:outputText value="" />
				<h:outputText value="#{lbl['lbl.sm.no.available']}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
				<p:commandLink id="editLinkId" value="#{lbl['lbl.sm.view']}" action="#{rejectionAckLetterBB.navigateToApplInfo(smAppl)}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
				<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</p:panel>
</ui:composition>
