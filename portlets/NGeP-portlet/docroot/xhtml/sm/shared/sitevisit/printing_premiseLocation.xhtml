<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel id="pnlPremiseLocation" header="#{lbl['lbl.sm.sitevisit.premiselocation']}" toggleable="true">

	<table class="customTbl">
		<tr>
			<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.sitevisit.ownership']}" /></td>
			<td class="tdContent">
				<ui:remove>
					 <p:selectOneMenu style="width:100px" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.ownershipType}" disabled="#{viewFlag}">
						<f:selectItem itemLabel = "#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel = "#{lbl['lbl.sm.officeloc.ownership.prvt']}" itemValue="P" />
						<f:selectItem itemLabel = "#{lbl['lbl.sm.officeloc.ownership.rent']}" itemValue="R" />
					</p:selectOneMenu>
				</ui:remove>
			
				<h:outputText value="#{lbl['lbl.sm.facility.own']}" 
					rendered="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.ownershipType eq 'O'}" />
				<h:outputText value="#{lbl['lbl.sm.facility.rent']}" 
					rendered="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.ownershipType eq 'R'}" />
			</td>
			
			<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.officeloc.purchase.monthly.price']}" /></td>
			<td class="tdContent">
				<ui:remove>
					<p:inputText  id="pmPriceRate" maxlength="14" disabled="#{viewFlag}" 
					value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.purchaseRentPrice}">
						<f:convertNumber  pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
				</ui:remove>
				
				<h:outputText  id="pmPriceRate" 
					value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.purchaseRentPrice}">
						<f:convertNumber  pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle" valign="top"><p:outputLabel value="#{lbl['lbl.sm.sitevisit.printing.premiseloc.docs']}" /></td>
			<td class="tdContent">
			<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.document}" />
			<!-- #24964 -->
			<ac:smFieldChangeAlertSVO
				isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
				oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvTemplate.smSvFacility.document}" 
				currValue="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.document}" 
				alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvTemplate.smSvFacility.document}"/>
			</td>
			
			<td class="tdTitle" valign="top"><p:outputLabel value="#{lbl['lbl.sm.sitevisit.printing.premiseloc.aggrmnt.lttr']}" /></td>
			<td class="tdContent">
			<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.agreementLetter}" />
			<!-- #24964 -->
			<ac:smFieldChangeAlertSVO
				isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
				oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvTemplate.smSvFacility.agreementLetter}" 
				currValue="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.agreementLetter}" 
				alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvTemplate.smSvFacility.agreementLetter}"/>
			</td>
		</tr>
	</table>
	</p:panel>
</ui:composition>
