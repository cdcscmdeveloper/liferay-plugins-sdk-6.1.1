<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel id="pnlPremiseLocation" header="#{lbl['lbl.sm.sitevisit.premiselocation']}" toggleable="true">

	<table class="customTbl">
		<tr>
			<td class="tdTitle"><p:outputLabel value="Ownership" /></td>
			<td class="tdContent">
			<p:selectOneMenu style="width:100px" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.ownershipType}" disabled="#{viewFlag}">
					<f:selectItem itemLabel = "---Select one---" itemValue="" />
					<f:selectItem itemLabel = "Private" itemValue="P" />
					<f:selectItem itemLabel = "Rent" itemValue="R" />
				</p:selectOneMenu>
			</td>
			
			<td class="tdTitle"><p:outputLabel value="Purchasing Price/ Monthly Rate(RM)" /></td>
			<td class="tdContent">
				<p:inputText  id="pmPriceRate" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.purchaseRentPrice}" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle" valign="top"><p:outputLabel value="Documents" /></td>
			<td class="tdContent">
			<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.document}" />
			</td>
			
			<td class="tdTitle" valign="top"><p:outputLabel value="Agreement letter" /></td>
			<td class="tdContent">
			<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.agreementLetter}" />
			</td>
		</tr>
	</table>
	</p:panel>
</ui:composition>
