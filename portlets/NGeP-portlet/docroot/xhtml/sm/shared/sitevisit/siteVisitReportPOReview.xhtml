<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:param name="viewFlag" value="true" />
	
	<p:tabMenu activeIndex="#{svoSiteVisitBackingBean.managedBean.activeIndex}" id="tabIndex" update="outPnlSiteVisitReport">
				<p:menuitem value="#{lbl['lbl.sm.svo.sitevisit.info']}" update="outPnlSiteVisitReport,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(0,null)}" />
		<p:menuitem value="#{lbl['lbl.sm.sitevisit.section.b']}" update="outPnlSiteVisitReport,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(1,null)}" />	
		<p:menuitem value="#{svoSiteVisitBackingBean.getParameterDesc(svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3.categoryTypeCode)}" update="outPnlSiteVisitReport,tabIndex" 
					actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(2,svoSiteVisitBackingBean.managedBean.selectedSvTemplate)}" 
					rendered="#{not empty svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3}" />
		<p:menuitem value="#{lbl['lbl.sm.sv.templ.bumiputera']}" update="outPnlSiteVisitReport,tabIndex" 
					actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(2,svoSiteVisitBackingBean.managedBean.selectedSvTemplate)}" 
					rendered="#{empty svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3}" />
		<p:menuitem value="#{lbl['lbl.sm.sitevisit.section.d']}" update="outPnlSiteVisitReport,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(3,null)}" />
		<p:menuitem value="#{lbl['lbl.sm.officeloc']}"  update="outPnlSiteVisitReport,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(4,null)}" />
		<p:menuitem value="#{lbl['lbl.sm.sitevist.report.submission']}" 
		update="outPnlSiteVisitReport,tabIndex" actionListener="#{svoSiteVisitBackingBean.changeActiveIndex(svoSiteVisitBackingBean.managedBean.lastIndex,null)}" />
	</p:tabMenu>
	
	<p:outputPanel id="outPnlSiteVisitReport">
		
		<ui:param name="template"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3.categoryTypeCode.parameterCode}" />
		<c:if test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 0}">
			<ui:include src="/xhtml/sm/svositevisit/siteVisitCommonInfo.xhtml" />
		</c:if>

		
		<c:if test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 1}">
			<ui:include src="/xhtml/sm/svositevisit/commonFinancialInfo.xhtml" />
		</c:if>


		<c:if test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 2}">
			<c:if
				test="#{template == SupplierManagementConst.CAT_TYPE_TRANSPORTATION}">
				<ui:include src="/xhtml/sm/svositevisit/transportation.xhtml" />
			</c:if>

			<c:if test="#{template == SupplierManagementConst.CAT_TYPE_WORKSHOP}">
				<ui:include src="/xhtml/sm/svositevisit/workshop.xhtml" />
			</c:if>

			<c:if
				test="#{template == SupplierManagementConst.CAT_TYPE_INSURANCE}">
				<ui:include src="/xhtml/sm/svositevisit/insurance.xhtml" />
			</c:if>

			<c:if test="#{template == SupplierManagementConst.CAT_TYPE_DOCKYARD}">
				<ui:include src="/xhtml/sm/svositevisit/dockyard.xhtml" />
			</c:if>

			<c:if
				test="#{template == SupplierManagementConst.CAT_TYPE_MANUFACTURING}">
				<ui:include src="/xhtml/sm/svositevisit/manufacturing.xhtml" />
			</c:if>

			<c:if test="#{template == SupplierManagementConst.CAT_TYPE_PRINTING}">
				<ui:include src="/xhtml/sm/svositevisit/printing.xhtml" />
			</c:if>

			<c:if test="#{template == SupplierManagementConst.CAT_TYPE_TRAVEL}">
				<ui:include src="/xhtml/sm/svositevisit/travel.xhtml" />
			</c:if>

			<c:if
				test="#{empty template}">
				<ui:include src="/xhtml/sm/svositevisit/bumiputera.xhtml" />
			</c:if>

			<c:if
				test="#{template == SupplierManagementConst.CAT_TYPE_READING_MATERIAL_FROM_OVERSEA}">
				<ui:include
					src="/xhtml/sm/svositevisit/overseaReadingMaterial.xhtml" />
			</c:if>
		</c:if>
		

		<c:if test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 3}">
			<ui:include src="/xhtml/sm/svositevisit/categoryApplicable.xhtml" />
		</c:if>

		<c:if test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 4}">
			<ui:include src="/xhtml/sm/svositevisit/officeLocation.xhtml" />
		</c:if>

		<c:if
			test="#{svoSiteVisitBackingBean.managedBean.activeIndex == svoSiteVisitBackingBean.managedBean.lastIndex}">
				<ui:include src="/xhtml/sm/shared/sitevisit/view_uploadedSiteVisitReport.xhtml" />
				<ui:include src="/xhtml/sm/shared/sitevisit/recommendation.xhtml" />
		</c:if>
	</p:outputPanel>
</ui:composition>
