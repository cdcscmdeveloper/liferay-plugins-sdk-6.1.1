<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.comments']}" toggleable="true">
		<p:inputTextarea rows="8" disabled="#{viewFlag}"  style="width:80%;" autoResize="false" maxlength="4000" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment.officerComment}">
	    <f:validateLength maximum="4000" />
	    </p:inputTextarea>
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.officeloc.cmpny.info.update.any']}"
		toggleable="true">
		<p:inputTextarea rows="8" disabled="#{viewFlag}" style="width:80%;" autoResize="false" maxlength="4000" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment.companyInfoUpdate}">
	    <f:validateLength maximum="4000" />
	    </p:inputTextarea>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.recommend']}" toggleable="true">
		<p:inputTextarea rows="8" disabled="#{viewFlag}"  style="width:80%;" autoResize="false" maxlength="4000" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment.recommendation}" >
	    <f:validateLength maximum="4000" />
	    </p:inputTextarea>
	</p:panel>
</ui:composition>
