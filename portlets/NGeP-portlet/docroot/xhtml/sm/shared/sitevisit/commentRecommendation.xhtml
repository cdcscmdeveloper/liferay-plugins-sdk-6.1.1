<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	

	<p:panel header="Office Location" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="Office Ownership" /></td>
				<td><p:selectBooleanCheckbox value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.owned}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Private, Purchasing Price(RM)" /></td>
				<td><p:inputText value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.purchasePrice}" readonly="true"></p:inputText></td>
				
				<td><p:outputLabel value="Rent, Monthly Rate(RM)" /></td>
				<td><p:inputText value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.rentalRate}" readonly="true"></p:inputText></td>
			</tr>

<!-- 			<tr> -->
<!-- 				<td>&#160;</td> -->
<!-- 				<td>&#160;</td> -->
<!-- 			</tr> -->

			<tr>
				<td><p:outputLabel value="Sign Board" /></td>
				<td><p:selectBooleanCheckbox value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.signboardValid}" /></td>
				<td><p:outputLabel value="Share With" /></td>
				<td><p:selectBooleanCheckbox value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.share}" /></td>
			</tr>

			
			<tr>
				<td valign="top"><p:outputLabel value="Office Arrangement" /></td>
				<td><p:inputTextarea rows="5" cols="50"  autoResize="false" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.officeArrangement}"/></td>
			</tr>
		</table>
	</p:panel>
	

	<p:panel header="Comments" toggleable="true">
		<p:inputTextarea rows="5" cols="100"  autoResize="false" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment.officerComment}"/>
	</p:panel>

	<p:panel header="Company Information Update (If any changes)"
		toggleable="true">
		<p:inputTextarea rows="5" cols="100" autoResize="false" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment.companyInfoUpdate}"/>
	</p:panel>
	
	<p:panel header="Recommendation" toggleable="true">
		<p:inputTextarea rows="5" cols="100" autoResize="false" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment.recommendation}" />
	</p:panel>
</ui:composition>
