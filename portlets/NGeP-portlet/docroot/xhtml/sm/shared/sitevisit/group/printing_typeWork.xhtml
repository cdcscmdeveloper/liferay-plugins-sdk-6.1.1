<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.sitevisit.printing.type.wrkdone.inprgrss']}">
		<p:dataTable value="#{template.smSvPrintworks}" var="pWork" id="printTbl#{catCode}"
		selection="#{template.selectedPrintWorks}" rowKey="#{pWork}" 
		emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:column selectionMode="multiple" style="width:2%" rendered="#{!viewFlag}" />
			
			<p:ajax event="rowSelectCheckbox" update="@parent" />
			<p:ajax event="rowUnselectCheckbox" update="@parent" />
			<p:ajax event="rowSelect" update="@parent" />
    	    <p:ajax event="rowUnselect" update="@parent" />
        	<p:ajax event="toggleSelect" update="@parent" />
			
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sm.sitevisit.printing.type']}
				</f:facet>
				<p:inputText value="#{pWork.printType}" maxlength="100" disabled="#{viewFlag}"
				required="#{empty param['disabledValidation']}" label="#{lbl['lbl.sm.sitevisit.printing.type']}" />
			</p:column>
			
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sm.sitevisit.printing.uname']}
				</f:facet>
				<p:inputText value="#{pWork.clientName}" maxlength="100" disabled="#{viewFlag}" 
				required="#{empty param['disabledValidation']}" label="#{lbl['lbl.sm.sitevisit.printing.uname']}" />
			</p:column>
			
			<p:column>	
				<f:facet name="header">
					#{lbl['lbl.sm.sitevisit.printing.workval.rm']}
				</f:facet>
				<p:inputText value="#{pWork.printAmt}" maxlength="14" label="#{lbl['lbl.sm.sitevisit.printing.workval.rm']}"
					disabled="#{viewFlag}" required="#{empty param['disabledValidation']}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>

			</p:column>
		</p:dataTable>
		
		<div align="right">
		<p:commandButton value="#{lbl['lbl.sm.button.add']}"  update="@parent" rendered="#{!viewFlag}"
			actionListener="#{svoSiteVisitBackingBean.setSelectedTemplate(template)}"
			action="#{svoSiteVisitBackingBean.addPrintWork()}" />
		<p:commandButton value="#{lbl['lbl.sm.button.delete']}"  update="@parent"  rendered="#{!viewFlag}" 
			action="#{svoSiteVisitBackingBean.setSelectedTemplate(template)}" oncomplete="printingWorkDeletePopUp.show();"
			disabled="#{empty template.selectedPrintWorks}"/>
		</div>
	</p:panel>

</ui:composition>
