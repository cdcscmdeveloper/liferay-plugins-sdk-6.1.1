<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:tabMenu activeIndex="#{svoSiteVisitBackingBean.managedBean.activeIndex}" id="tabIndex" update="outPnlSiteVisitReport">
				
		<p:menuitem value="#{lbl['lbl.sm.svo.sitevisit.info']}" update="outPnlSiteVisitReport,tabIndex" actionListener="#{svoSiteVisitBackingBean.changePageIndex(0,null,false)}" />
		<p:menuitem value="#{lbl['lbl.sm.sitevisit.section.b']}" update="outPnlSiteVisitReport,tabIndex" actionListener="#{svoSiteVisitBackingBean.changePageIndex(1,null,false)}" />	
		<p:menuitem value="#{lbl['lbl.sm.sitevisit.licenseinsurance']}" update="outPnlSiteVisitReport,tabIndex" 
					actionListener="#{svoSiteVisitBackingBean.changePageIndex('l',null,false)}" 
					rendered="#{svoSiteVisitBackingBean.managedBean.licensed}"/>
		<p:menuitem value="#{svoSiteVisitBackingBean.getParameterDesc(svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3.categoryTypeCode)}" update="outPnlSiteVisitReport,tabIndex" 
					actionListener="#{svoSiteVisitBackingBean.changePageIndex('c',svoSiteVisitBackingBean.managedBean.selectedSvTemplate,false)}"
					rendered="#{not empty svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3}" />
		<p:menuitem value="#{lbl['lbl.sm.sv.templ.bumiputera']}" update="outPnlSiteVisitReport,tabIndex" 
					actionListener="#{svoSiteVisitBackingBean.changePageIndex('c',svoSiteVisitBackingBean.managedBean.selectedSvTemplate,false)}" 
					rendered="#{empty svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3}" />
		<p:menuitem value="#{lbl['lbl.sm.sitevisit.section.d']}" update="outPnlSiteVisitReport,tabIndex" actionListener="#{svoSiteVisitBackingBean.changePageIndex('r',null,false)}" />
		<p:menuitem value="#{lbl['lbl.sm.officeloc']}"  update="outPnlSiteVisitReport,tabIndex" actionListener="#{svoSiteVisitBackingBean.changePageIndex('o',null,false)}" />
		<p:menuitem value="#{lbl['lbl.sm.sitevist.report.submission']}" 
					update="outPnlSiteVisitReport,tabIndex" actionListener="#{svoSiteVisitBackingBean.changePageIndex('s',null,false)}" />
	</p:tabMenu>
	
	
	<p:outputPanel id="outPnlSiteVisitReport">
		<p:messages id="messages1" showDetail="true" escape="false"
				autoUpdate="#{backingBean.managedBean.showParentMsg}"
				closable="true" showSummary="false" />
		<ui:param name="template"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3.categoryTypeCode.parameterCode}" />
		<c:if test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 0}">
			<ui:include src="/xhtml/sm/svositevisit/siteVisitCommonInfo.xhtml" />
		</c:if>

		<c:if test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 1}">
			<ui:include src="/xhtml/sm/svositevisit/commonFinancialInfo.xhtml" />
		</c:if>
		
		<c:if test="#{svoSiteVisitBackingBean.managedBean.activePage eq 'l'}">
			<ui:include src="/xhtml/sm/svositevisit/group/license.xhtml" />
		</c:if>

		<c:if test="#{svoSiteVisitBackingBean.managedBean.activePage eq 'c'}">
		<c:choose>
		<c:when test="#{svoSiteVisitBackingBean.managedBean.licensed}">
			<ui:include src="/xhtml/sm/svositevisit/group/categoryType.xhtml" />
		</c:when>
						
		<c:otherwise>
			<c:if test="#{template == SupplierManagementConst.CAT_TYPE_TRANSPORTATION}">
				<ui:include src="/xhtml/sm/svositevisit/transportation.xhtml" />
			</c:if>

			<c:if test="#{template == SupplierManagementConst.CAT_TYPE_WORKSHOP}">
				<ui:include src="/xhtml/sm/svositevisit/workshop.xhtml" />
			</c:if>

			<c:if test="#{template == SupplierManagementConst.CAT_TYPE_INSURANCE}">
				<ui:include src="/xhtml/sm/svositevisit/insurance.xhtml" />
			</c:if>

			<c:if test="#{template == SupplierManagementConst.CAT_TYPE_DOCKYARD}">
				<ui:include src="/xhtml/sm/svositevisit/dockyard.xhtml" />
			</c:if>

			<c:if test="#{template == SupplierManagementConst.CAT_TYPE_MANUFACTURING}">
				<ui:include src="/xhtml/sm/svositevisit/manufacturing.xhtml" />
			</c:if>

			<c:if test="#{template == SupplierManagementConst.CAT_TYPE_PRINTING}">
				<ui:include src="/xhtml/sm/svositevisit/printing.xhtml" />
			</c:if>

			<c:if test="#{template == SupplierManagementConst.CAT_TYPE_TRAVEL}">
				<ui:include src="/xhtml/sm/svositevisit/travel.xhtml" />
			</c:if>
						
			<c:if test="#{empty svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3}">
				<ui:include src="/xhtml/sm/svositevisit/bumiputera.xhtml" />
			</c:if>

			<c:if test="#{template == SupplierManagementConst.CAT_TYPE_READING_MATERIAL_FROM_OVERSEA}">
				<ui:include src="/xhtml/sm/svositevisit/overseaReadingMaterial.xhtml" />
			</c:if>
		</c:otherwise>
		</c:choose>
		</c:if>
						
		<c:if test="#{svoSiteVisitBackingBean.managedBean.activePage eq 'r'}">
			<ui:include src="/xhtml/sm/svositevisit/categoryApplicable.xhtml" />
		</c:if>

		<c:if test="#{svoSiteVisitBackingBean.managedBean.activePage eq 'o'}">
			<ui:include src="/xhtml/sm/svositevisit/officeLocation.xhtml" />
		</c:if>
						
		<c:if test="#{svoSiteVisitBackingBean.managedBean.activePage eq 's'}">
			<ui:include src="/xhtml/sm/svositevisit/reportPreview.xhtml" />
		</c:if>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.close']}" action="#{svoSiteVisitBackingBean.saveSiteVisitReportByPO}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()" rendered="#{!viewFlag}"/>
			<p:commandButton value="#{lbl['lbl.btn.close']}" onclick="poReportDlg.hide()" 
				actionListener="#{svoSiteVisitBackingBean.changePageIndex(0,null,false)}" rendered="#{viewFlag}"/>
		</div>	
	</p:outputPanel>
</ui:composition>
