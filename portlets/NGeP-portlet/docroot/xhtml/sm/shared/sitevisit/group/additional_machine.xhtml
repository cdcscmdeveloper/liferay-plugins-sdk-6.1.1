<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.sitevisit.additional.machine']}" >
		<p:dataTable value="#{template.smSvAdtMachines}" var="addMachineDtl" id="addMachTbl#{catCode}"
			selection="#{template.selectedAdtMachines}" rowKey="#{addMachineDtl}" 
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:column selectionMode="multiple" style="width:2%" rendered="#{!viewFlag and not empty template.smSvAdtMachines}"/>
			<p:ajax event="rowSelectCheckbox" update="@parent" />
			<p:ajax event="rowUnselectCheckbox" update="@parent" />
			<p:ajax event="rowSelect" update="@parent" />
        	<p:ajax event="rowUnselect" update="@parent" />
        	<p:ajax event="toggleSelect" update="@parent" />

			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.manufacturing.type.machine']}
					</f:facet>
					<h:outputText value="#{addMachineDtl.machineType}"  style="float: left;white-space: normal;" />
			</p:column>			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.brand']}
					</f:facet>
					<h:outputText value="#{addMachineDtl.brandName}"  style="float: left;white-space: normal;" />	
			</p:column>			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.quantity']}
					</f:facet>
					<h:outputText value="#{addMachineDtl.qty}"  style="float: left;white-space: normal;" />
			</p:column>			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.value']}
					</f:facet>
					<h:outputText value="#{addMachineDtl.value}"  style="float: left;white-space: normal;">
						<f:convertNumber  pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />		
					</h:outputText>		
			</p:column>			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.purMthd']}
					</f:facet>
					<h:outputText value="#{svoSiteVisitBackingBean.getParameterDesc(ParameterTypeConst.purchasingMethod,
						addMachineDtl.purchaseMethod)}" style="float: left;white-space: normal;" />
					<ui:fragment rendered="#{addMachineDtl.purchaseMethod eq 'O'}" ><br /></ui:fragment>
					<h:outputText value="(#{addMachineDtl.purchaseMethodRemark})" rendered="#{addMachineDtl.purchaseMethod eq 'O'}" 
						style="float: left;white-space: normal;" />
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.purchase.year']}
					</f:facet>
					<h:outputText value="#{addMachineDtl.purchaseYear}"  style="float: left;white-space: normal;" />		
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.guarnName']}
					</f:facet>
					<h:outputText  value="#{addMachineDtl.guarantorName}"  style="float: left;white-space: normal;" />		
			</p:column>
			
			<p:column rendered="#{!viewFlag}">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.action']}" />
				</f:facet>
				<p:commandLink oncomplete="adtMacDlg.show();" update=":#{p:component('adtMachineDlg')}" rendered="#{!viewFlag}"
					action="#{svoSiteVisitBackingBean.editMachine(addMachineDtl)}" process="@this">
					<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}"/>
				</p:commandLink>
			</p:column>
		</p:dataTable>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this" rendered="#{!viewFlag}" 
				actionListener="#{svoSiteVisitBackingBean.setSelectedTemplate(template)}"
				action="#{svoSiteVisitBackingBean.addAdditionalMachine()}" onstart="blockWidget.show()"
				oncomplete="blockWidget.hide();adtMacDlg.show();" update=":#{p:component('adtMachineDlg')},@parent">
			</p:commandButton>
			
			<p:commandButton value="#{lbl['lbl.btn.delete']}" oncomplete="additionalMachineDeletePopUp.show();"
				rendered="#{!viewFlag}" update="@parent" disabled="#{empty template.selectedAdtMachines}"
				action="#{svoSiteVisitBackingBean.setSelectedTemplate(template)}">
			</p:commandButton>
		</div>
	</p:panel>
</ui:composition>
