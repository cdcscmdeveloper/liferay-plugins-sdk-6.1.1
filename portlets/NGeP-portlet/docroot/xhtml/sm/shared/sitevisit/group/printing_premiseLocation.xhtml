<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.sitevisit.ownership']}" /></td>
			<td class="tdContent">
				<h:outputText value="#{lbl['lbl.sm.facility.own']}" 
					rendered="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvTemplate.smSvFacility.ownershipType eq 'O'}" />
				<h:outputText value="#{lbl['lbl.sm.facility.rent']}" 
					rendered="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvTemplate.smSvFacility.ownershipType eq 'R'}" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle" valign="top">
				<p:outputLabel value="#{lbl['lbl.sm.sitevisit.printing.premiseloc.docs']}" /></td>
			<td class="tdContent">
			<p:selectBooleanCheckbox disabled="#{viewFlag}" 
				value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvTemplate.smSvFacility.document}" />
			</td>
			
			<td class="tdTitle" valign="top">
				<p:outputLabel value="#{lbl['lbl.sm.sitevisit.printing.premiseloc.aggrmnt.lttr']}" /></td>
			<td class="tdContent">
			<p:selectBooleanCheckbox disabled="#{viewFlag}" 
				value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvTemplate.smSvFacility.agreementLetter}" />
			</td>
		</tr>
	</table>
</ui:composition>
