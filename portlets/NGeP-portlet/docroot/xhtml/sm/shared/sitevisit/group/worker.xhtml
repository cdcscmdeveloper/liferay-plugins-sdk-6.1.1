<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.worker.employee']}" >
		<c:set var="isRequired" value="#{empty param['disabledValidation'] and empty param['disableMsgAutoUpdate'] 
				and empty param['disabledValidation']}"/>
		<p:dataTable value="#{template.smSvWorkers}" var="svWorker" selection="#{template.selectedWorkers}" 
			rowKey="#{svWorker}" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" id="workTbl#{catCode}">
			<p:column selectionMode="multiple" style="width:2%" rendered="#{!viewFlag}" />
			<p:ajax event="rowSelectCheckbox" update="@parent" />
			<p:ajax event="rowUnselectCheckbox" update="@parent" />
			<p:ajax event="rowSelect" update="@parent" />
	        <p:ajax event="rowUnselect" update="@parent" />
	        <p:ajax event="toggleSelect" update="@parent" />
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.worker.specialization']}
					</f:facet>
					<p:inputText value="#{svWorker.expertise}" disabled="#{viewFlag}" label="#{lbl['lbl.sm.worker.specialization']}" 
						maxlength="2000" required="#{isRequired}" />
			</p:column>
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.worker.name']}
					</f:facet>
				<p:inputText value="#{svWorker.name}" disabled="#{viewFlag}" label="#{lbl['lbl.sm.worker.name']}" maxlength="50" 
					required="#{isRequired}"/>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sm.employee.idtype']}
				</f:facet>
				<p:selectOneMenu id="empIdTypeId" size="50" disabled="#{viewFlag}" label="#{lbl['lbl.sm.employee.idtype']}"
						required="#{isRequired}" value="#{svWorker.identificationTypeId}">
						<f:selectItems value="#{svoSiteVisitBackingBean.managedBean.identificationTypes}" />
						<p:ajax event="change" process="@this" update="@this,pnlIdentType"/>
				</p:selectOneMenu>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sm.worker.icno']}
				</f:facet>
				<p:outputPanel id="pnlIdentType">
                	<p:inputText id="empIcId" value="#{svWorker.identificationNo}"
						label="#{lbl['lbl.sm.worker.icno']}"
						rendered="#{svWorker.identificationTypeId eq '115'}"
						required="#{isRequired}" disabled="#{viewFlag}"
						maxlength="12" size="30" style="width: 80% !important;"
						validatorMessage="#{lbl['lbl.sm.worker.icno']} - #{lbl['lbl.sm.invalidNo']}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						<p:ajax process="@this" partialSubmit="true" update="@this,empIcIdMsg" />
					</p:inputText>
					<p:message id="empIcIdMsg" for="empIcId"
									showSummary="true" showDetail="false" display="icon" />	
									
					<p:inputText id="empPassId" value="#{svWorker.identificationNo}"
						label="#{lbl['lbl.sm.worker.icno']}"
						rendered="#{svWorker.identificationTypeId ne '115'}"
						required="#{isRequired}" disabled="#{viewFlag}"
						maxlength="15" size="30" style="width: 80% !important;">
					</p:inputText>
					<p:message id="empPassIdMsg" for="empPassId"
									showSummary="true" showDetail="false" display="icon" />
				</p:outputPanel>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sm.worker.experience']}
				</f:facet>
				<p:inputText value="#{svWorker.workExpYear}" disabled="#{viewFlag}" label="#{lbl['lbl.sm.worker.experience']}"
					maxlength="2" required="#{isRequired}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</p:inputText>
			</p:column>
		</p:dataTable>		
		
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}" rendered="#{!viewFlag}"
				actionListener="#{svoSiteVisitBackingBean.setSelectedTemplate(template)}"
				action="#{svoSiteVisitBackingBean.addWorkshopWorker()}" 
				update="@parent" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				rendered="#{!viewFlag}" oncomplete="workerDeletePopUp.show();"
				update="@parent" action="#{svoSiteVisitBackingBean.setSelectedTemplate(template)}"
				disabled="#{empty template.selectedWorkers}">
				<f:param name="disabledValidation" value="true" />
			</p:commandButton>
		</div>
	</p:panel>
</ui:composition>
