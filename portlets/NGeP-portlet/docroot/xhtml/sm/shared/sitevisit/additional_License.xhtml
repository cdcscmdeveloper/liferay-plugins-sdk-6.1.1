<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.sitevisit.additional.license']}" id="additionalLicensePnl">
		<p:dataTable var="adtLicense" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvDocLicenses}"
			selection="#{svoSiteVisitBackingBean.managedBean.selectedAdtLicense}" rowKey="#{adtLicense}">
			
			<p:column selectionMode="multiple" style="width:2%" rendered="#{!viewFlag}"/>
			<!-- #24964 -->
			<p:ajax event="rowSelectCheckbox" update=":#{p:component('btnLicenseDelete')}" />
			<p:ajax event="rowUnselectCheckbox" update=":#{p:component('btnLicenseDelete')}" />
			<p:ajax event="rowSelect" update=":#{p:component('btnLicenseDelete')}" />
        	<p:ajax event="rowUnselect" update=":#{p:component('btnLicenseDelete')}" />
        	<p:ajax event="toggleSelect" update=":#{p:component('btnLicenseDelete')}" />
			
			<p:column>
				<f:facet name="header">
						#{lbl['lbl.sm.availableLbl']}
				</f:facet>
				<p:selectBooleanCheckbox value="#{adtLicense.available}" disabled="#{viewFlag}">
				</p:selectBooleanCheckbox>
			</p:column>

			<p:column style="white-space: normal;word-wrap: break-word;">
				<f:facet name="header">
					#{lbl['lbl.sm.sitevisit.license']}
				</f:facet>

				<p:inputText
					value="#{adtLicense.smApplSupportDoc.pmDocument.docName}" disabled="#{viewFlag}" maxlength="100"/>
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sm.license.closingexpiry.date']}
				</f:facet>
				<p:calendar id="dateIssuedCalId" navigator="true" disabled="#{viewFlag}"
					label="#{lbl['lbl.sm.license.closingexpiry.date']}" value="#{adtLicense.smApplSupportDoc.licenseExpDate}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
					readonlyInput="true" size="15" showOn="button" 
					required="#{!empty adtLicense.smApplSupportDoc.pmDocument.docName}"/> 
				<!-- 
				<h:outputText
					value="#{adtLicense.smApplSupportDoc.licenseExpDate}">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />	
				</h:outputText>
				-->
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.suppdoc.license.no']}">
				<p:inputText value="#{adtLicense.smApplSupportDoc.licenseNo}" disabled="#{viewFlag}" maxlength="80"
					required="#{!empty adtLicense.smApplSupportDoc.pmDocument.docName}"/>
			</p:column>
		</p:dataTable>
		
		<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.add']}" rendered="#{!viewFlag}"
					action="#{svoSiteVisitBackingBean.addAdditionalLicense}"
					update="additionalLicensePnl" />
				<p:commandButton value="#{lbl['lbl.btn.delete']}" rendered="#{!viewFlag}"
					oncomplete="additionalLicenseDeletePopUp.show();"
					update="additionalLicensePnl"  id="btnLicenseDelete"
					disabled="#{empty svoSiteVisitBackingBean.managedBean.selectedAdtLicense}">
				</p:commandButton>
			</div>
	</p:panel>
	
	<ac:confirmationPopup id="additionalLicenseDeletePopUpId"
		widget="additionalLicenseDeletePopUp"
		okAction="svoSiteVisitBackingBean.removeAdditionalLicense()"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update=":#{p:component('additionalLicensePnl')}"/>
</ui:composition>
