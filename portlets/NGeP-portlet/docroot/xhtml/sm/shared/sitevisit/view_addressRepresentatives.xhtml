<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	
<!-- 	<ui:include src="/xhtml/sm/shared/sitevisit/assistingOfficer.xhtml" /> -->
	
	<p:panel header="#{lbl['lbl.sm.companyinfo.intvw.represent']}" id="pnlIntRep">
		<p:dataTable id="dtIntRepTbl" var="interviewee" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvInterviewees}" 
		emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:column headerText="#{lbl['lbl.sm.person.composition.name']}">
				<h:outputText value="#{interviewee.name}" id="intName"  disabled="#{viewFlag}"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.userprofile.designation']}">
				<h:outputText value="#{interviewee.designation}" id="intDesignation" disabled="#{viewFlag}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
