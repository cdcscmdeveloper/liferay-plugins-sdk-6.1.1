<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<c:forEach items="#{svoSiteVisitBackingBean.managedBean.printingCatLs}" var="item">
	<ui:param name="lblVar" value="lbl.sm.sitevisit.printing.#{item}" />
		<p:panel header="#{lbl[lblVar]}" toggleable="true">
			<p:dataTable  toggleable = "true"
				value="#{svoSiteVisitBackingBean.managedBean.printingCatMap[item].smSvPrintmachines}" var="acc"
				rowKey="#{acc}" rowIndexVar="rowId">

				<p:column>
					<f:facet name="header">
						Apparatus/ Machine
					</f:facet>
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.printingParamMap[acc.pmParameter.parameterId].codeName}"></h:outputText>
				</p:column>

				<p:column>
					<f:facet name="header">
						Brand
					</f:facet>
					<p:inputText value="#{acc.brand}" disabled="#{viewFlag}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						Qty/ Set
					</f:facet>
					<p:inputText value="#{acc.qty}" disabled="#{viewFlag}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						Req. Method
					</f:facet>
					<p:inputText value="#{acc.requisiteMethod}" disabled="#{viewFlag}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						Reg. Year
					</f:facet>
					<p:inputText value="#{acc.requisiteYear}" disabled="#{viewFlag}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						Guarantor Name
					</f:facet>
					<p:inputText value="#{acc.guarantor}" disabled="#{viewFlag}" />
				</p:column>
			</p:dataTable>
		</p:panel>
	</c:forEach>

</ui:composition>
