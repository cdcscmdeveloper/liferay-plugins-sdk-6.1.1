<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<c:forEach items="#{svoSiteVisitBackingBean.managedBean.printingCatLs}" var="item">
	<ui:param name="lblVar" value="lbl.sm.sitevisit.printing.#{item}" />
		<p:panel header="#{lbl[lblVar]}" toggleable="true">
			<p:dataTable  toggleable = "true" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" id="dtlPrintMac"
				value="#{svoSiteVisitBackingBean.managedBean.printingCatMap[item].smSvPrintmachines}" var="acc"
				rowKey="#{acc}" rowIndexVar="rowId">
				
				<p:column rendered="#{!viewFlag}">
					<p:selectBooleanCheckbox value="#{acc.selected}" id="chkPrintMachineAvailabiliy">
						<p:ajax update="dtlPrintMac" listener="#{svoSiteVisitBackingBean.printMachineSelectOnChange(acc)}"></p:ajax>
					</p:selectBooleanCheckbox>
				</p:column>
				
				<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.sitevisit.printing.apparatus.mchne']}
					</f:facet>
					<h:outputText value="#{svoSiteVisitBackingBean.getParameterDesc(acc.pmParameter)}"></h:outputText>
				</p:column>

				<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.sitevisit.printing.brand']}
					</f:facet>
					<p:inputText value="#{acc.brand}" disabled="#{viewFlag || !acc.selected}" maxlength="100" 
					required="#{acc.selected}" label="#{lbl['lbl.sm.sitevisit.printing.brand']}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.sitevisit.printing.qty.set']}
					</f:facet>
					<p:inputText value="#{acc.qty}" maxlength="8" label="#{lbl['lbl.sm.sitevisit.printing.qty.set']}" disabled="#{viewFlag  || !acc.selected}" 
					required="#{acc.selected}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.sitevisit.printing.req.method']}
					</f:facet>
					<p:inputText value="#{acc.requisiteMethod}" maxlength="30" disabled="#{viewFlag || !acc.selected}" 
					required="#{acc.selected}" label="#{lbl['lbl.sm.sitevisit.printing.req.method']}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.sitevisit.printing.reg.year']}
					</f:facet>
					<p:inputText value="#{acc.requisiteYear}" maxlength="4" label="#{lbl['lbl.sm.sitevisit.printing.reg.year']}" disabled="#{viewFlag || !acc.selected}" 
					required="#{acc.selected}"  />
				</p:column>

				<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.sitevisit.printing.guarantorname']}
					</f:facet>
					<p:inputText value="#{acc.guarantor}" maxlength="30" disabled="#{viewFlag || !acc.selected}" 
					required="#{acc.selected}" label="#{lbl['lbl.sm.sitevisit.printing.guarantorname']}" />
				</p:column>
			</p:dataTable>
		</p:panel>
	</c:forEach>

</ui:composition>
