<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<!-- 	<ui:include src="/xhtml/sm/shared/sitevisit/categoryCodeByTemplate.xhtml" /> -->
<!-- 	<ui:include src="/xhtml/sm/shared/sitevisit/assistingOfficer.xhtml" /> -->
	<p:panel header="#{lbl['lbl.sm.companyinfo.intvw.represent']}" id="pnlIntRep" toggleable="true">
		<!-- #24964 - START -->
		<c:if test="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO ne null}">
			#{svoSiteVisitBackingBean.mapSmSvIntervieweesSVOWithPO(svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvTemplate.smSvInterviewees)}
		</c:if>
		<!-- #24964 - END -->
		<!-- 28775 - Site Visit Grouping Enhancement - 28775 - start --> 
		<p:dataTable id="dtIntRepTbl" var="interviewee" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvTemplate.smSvInterviewees}"
		selection="#{svoSiteVisitBackingBean.managedBean.selectedInterviewees}" rowKey="#{interviewee}">
		<p:column selectionMode="multiple" style="width:2%" rendered="#{not empty svoSiteVisitBackingBean.managedBean.smSvTask.smSvTemplate.smSvInterviewees}" />
		<!-- 28775 - Site Visit Grouping Enhancement - 28775 - end -->
		
		<p:ajax event="rowSelectCheckbox" update=":#{p:component('btnIntervieweeRemove')}" />
		<p:ajax event="rowUnselectCheckbox" update=":#{p:component('btnIntervieweeRemove')}" />
		<p:ajax event="rowSelect" update=":#{p:component('btnIntervieweeRemove')}" />   
        <p:ajax event="rowUnselect" update=":#{p:component('btnIntervieweeRemove')}" />  
        <p:ajax event="toggleSelect" update=":#{p:component('btnIntervieweeRemove')}" />  
		
		<p:column>	
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.sm.person.composition.name']}" />
			</f:facet>
			<p:inputText value="#{interviewee.name}" label="#{lbl['lbl.sm.person.composition.name']}" id="intName"  maxlength="50" size="55"  required="true" />
			<!-- #24964 - START -->
			<ac:smFieldChangeAlertSVO 
				isShow="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO ne null}"
				oriValue="#{interviewee.svoSmSvInterviewee.name}" 
				currValue="#{interviewee.name}" 
				alertValue="#{interviewee.svoSmSvInterviewee.name}"   />
			<!-- #24964 - END -->
		</p:column>
		
		<p:column>	
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.sm.userprofile.designation']}" />
			</f:facet>
			<p:inputText value="#{interviewee.designation}" label="#{lbl['lbl.sm.userprofile.designation']}" id="intDesignation"  
			maxlength="50" size="55"  required="true" />
			<!-- #24964 - START -->
			<ac:smFieldChangeAlertSVO 
				isShow="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO ne null}"
				oriValue="#{interviewee.svoSmSvInterviewee.designation}" 
				currValue="#{interviewee.designation}" 
				alertValue="#{interviewee.svoSmSvInterviewee.designation}"   />
			<!-- #24964 - START -->
		</p:column>
		
		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}"  update="dtIntRepTbl" action="#{svoSiteVisitBackingBean.addInterviewee}">
				<f:param name="disabledValidation" value="true" />
			</p:commandButton>
			<p:commandButton value="#{lbl['lbl.sm.button.delete']}" update="dtIntRepTbl" id="btnIntervieweeRemove"
			oncomplete="representativeDeletePopUp.show();" disabled="#{empty svoSiteVisitBackingBean.managedBean.selectedInterviewees}">
			</p:commandButton>
		</div>
	</p:panel>
	
	<ac:confirmationPopup id="representativeDeletePopUpId"
		widget="representativeDeletePopUp"
		okAction="svoSiteVisitBackingBean.removeInterviewee()"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update=":#{p:component('pnlIntRep')}"/>
</ui:composition>
