<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.sitevist.address']}" id="pnlSvSelectSvAdd" align="left">
		<p:dataTable var="svAdd" id="dtblSelectedSvAdd"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvAddresses}" 
			selection="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.selectedAddresses}" 
			 rowKey="#{svAdd}">
				<p:column selectionMode="multiple" style="width:2%" disabledSelection="#{viewFlag}"/>
			<p:column headerText="#{lbl['lbl.sm.address']}">
					#{svAdd.smAddress.address1}<br />
					#{svAdd.smAddress.address2}<br />
					#{svAdd.smAddress.address3}<br />
					#{svAdd.smAddress.address4}
				</p:column>

			<p:column headerText="#{lbl['lbl.sm.postcode']}">
				#{svAdd.smAddress.postcode}
				</p:column>

			<p:column headerText="#{lbl['lbl.sm.towncity']}">
				#{svAdd.smAddress.pmCity.cityName}
				</p:column>
				
			<p:column headerText="#{lbl['lbl.sm.district']}">
				#{svAdd.smAddress.pmDistrict.districtName}
				</p:column>

			<p:column headerText="#{lbl['lbl.sm.state']}">
				#{svAdd.smAddress.pmState.stateName}
				</p:column>

			<p:column headerText="#{lbl['lbl.sm.country']}">
				#{svAdd.smAddress.pmCountry.countryName}
			</p:column>
		</p:dataTable>
	</p:panel>
		
	<p:panel header="#{lbl['lbl.sm.companyinfo.intvw.represent']}" id="pnlIntRep">
		<p:dataTable id="dtIntRepTbl" var="interviewee" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvInterviewees}"
		selection="#{svoSiteVisitBackingBean.managedBean.selectedInterviewees}" rowKey="#{interviewee}">
		<p:column selectionMode="multiple" style="width:2%" />
			<p:column headerText="#{lbl['lbl.sm.person.composition.name']}">
				<p:inputText value="#{interviewee.name}" id="intName"  />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.userprofile.designation']}">
				<p:inputText value="#{interviewee.designation}" id="intDesignation"  />
			</p:column>
		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}"  update="dtIntRepTbl" action="#{svoSiteVisitBackingBean.addInterviewee}" />
			<p:commandButton value="#{lbl['lbl.sm.button.delete']}"  update="dtIntRepTbl" action="#{svoSiteVisitBackingBean.removeInterviewee}"/>
		</div>
	</p:panel>
</ui:composition>
