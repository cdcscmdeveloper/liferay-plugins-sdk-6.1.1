<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<!-- 	<ui:include src="/xhtml/sm/shared/sitevisit/categoryCodeByTemplate.xhtml" /> -->
<!-- 	<ui:include src="/xhtml/sm/shared/sitevisit/assistingOfficer.xhtml" /> -->
	<p:panel header="#{lbl['lbl.sm.companyinfo.intvw.represent']}" id="pnlIntRep">
		<p:dataTable id="dtIntRepTbl" var="interviewee" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvInterviewees}"
		selection="#{svoSiteVisitBackingBean.managedBean.selectedInterviewees}" rowKey="#{interviewee}">
		<p:column selectionMode="multiple" style="width:2%" rendered="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvInterviewees}" />
		
		<p:column>	
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.sm.person.composition.name']}" />
			</f:facet>
			<p:inputText value="#{interviewee.name}" label="#{lbl['lbl.sm.person.composition.name']}" id="intName"  maxlength="50" size="55"  required="#{empty param['disabledValidation']}" />
		</p:column>
		
		<p:column>	
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.sm.userprofile.designation']}" />
			</f:facet>
			<p:inputText value="#{interviewee.designation}" label="#{lbl['lbl.sm.userprofile.designation']}" id="intDesignation"  
			maxlength="50" size="55"  required="#{empty param['disabledValidation']}" />
		</p:column>
		
		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}"  update="dtIntRepTbl" action="#{svoSiteVisitBackingBean.addInterviewee}" />
			<p:commandButton value="#{lbl['lbl.sm.button.delete']}" update="dtIntRepTbl" oncomplete="representativeDeletePopUp.show();">
				<f:param name="disabledValidation" value="true" />
			</p:commandButton>
		</div>
	</p:panel>
	
	<ac:confirmationPopup id="representativeDeletePopUpId"
		widget="representativeDeletePopUp"
		okAction="svoSiteVisitBackingBean.removeInterviewee()"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update=":#{p:component('dtIntRepTbl')}"/>
</ui:composition>
