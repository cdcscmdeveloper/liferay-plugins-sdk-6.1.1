	<div align="right">
		<p:commandButton value="Test Get Value" action="#{svoSiteVisitBackingBean.testGetValue}"/>
	</div>

	<p:panel header="Site Visit Address" id="pnlSvSelectSvAdd" align="left">
		<p:dataTable var="svAdd" id="dtblSelectedSvAdd"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvAddresses}" 
			selection="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvAddress}" 
			 rowKey="#{svAdd}">
			<p:column selectionMode="single" style="width:2%" event="rowSelect" update=":form:pnlIntRep" />
			<p:ajax event="rowSelectRadio" update=":form:pnlIntRep" listener="#{svoSiteVisitBackingBean.selectSvAddress}" />
<!-- 			selectionMode="single" <p:ajax event="rowSelect" update=":form:pnlIntRep" listener="#{svoSiteVisitBackingBean.selectSvAddress}" /> -->
			<p:column headerText="Address">
					#{svAdd.smAddress.address1}<br />
					#{svAdd.smAddress.address2}<br />
					#{svAdd.smAddress.address3}<br />
					#{svAdd.smAddress.address4}
				</p:column>

			<p:column headerText="Post Code">
				#{svAdd.smAddress.postcode}
				</p:column>

			<p:column headerText="City">
				#{svAdd.smAddress.pmCity.cityName}
				</p:column>
				
			<p:column headerText="District">
				#{svAdd.smAddress.pmDistrict.districtName}
				</p:column>

			<p:column headerText="State">
				#{svAdd.smAddress.pmState.stateName}
				</p:column>

			<p:column headerText="Country">
				#{svAdd.smAddress.pmCountry.countryName}
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<p:panel header="Interviewed Representatives" id="pnlIntRep">
		<p:dataTable id="intRepTbl" var="interviewee" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvAddress.smSvInterviewees}">
			<p:column headerText="Name">
				<p:inputText value="#{interviewee.name}" id="intName"></p:inputText>
			</p:column>

			<p:column headerText="Designation">
				<p:inputText value="#{interviewee.designation}" id="intDesignation"></p:inputText>
			</p:column>
		</p:dataTable>

		<div align="right">
			<p:commandButton value="Add" update="intRepTbl" action="#{svoSiteVisitBackingBean.addInterviewee}" />
			<p:commandButton value="Remove" />
		</div>
	</p:panel>

</ui:composition>
