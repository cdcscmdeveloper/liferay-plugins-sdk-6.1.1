<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel heaader="License/ Insurance">
		<p:dataTable var="dockWorkLicenseIns"
			value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvLicenseInsurances}">
			<p:column>
				<f:facet name="header">
				License/ Insurance
				</f:facet>

				<h:outputText
					value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.licenseInsuranceParamMap[dockWorkLicenseIns.pmParameter.parameterId].codeName}"></h:outputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					Closing Date
				</f:facet>
				<p:calendar id="closingDateCalId"
						navigator="true"  label="Closing Date"
						value="#{dockWorkLicenseIns.expDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
						readonlyInput="true" size="30" showOn="button" />

			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
