<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.license.insurance']}">
		<!-- 28775 - Site Visit Grouping Enhancement - 28775 -->
		<p:dataTable var="dockWorkLicenseIns" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvTemplate.smSvLicenseInsurances}">
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sm.license.insurance']}
				</f:facet>

				<h:outputText
					value="#{svoSiteVisitBackingBean.getParameterDesc(dockWorkLicenseIns.pmParameter)}"></h:outputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sm.license.closingexpiry.date']}
				</f:facet>
				<p:calendar id="closingDateCalId"
						navigator="true"  label="#{lbl['lbl.sm.license.closingexpiry.date']}"
						value="#{dockWorkLicenseIns.expDate}" disabled="#{viewFlag}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
						yearRange="0:+99" 
						mindate="#{CommonConstants.CURRENT_DATE}"
						readonlyInput="true" size="30" showOn="button" />
				<!-- #24964 -->
				<ac:smFieldChangeAlertSVO
						isShow="#{not empty dockWorkLicenseIns and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.getSVOLicense(dockWorkLicenseIns).expDate}" 
						currValue="#{dockWorkLicenseIns.expDate}" 
						alertValue="#{svoSiteVisitBackingBean.getSVOLicense(dockWorkLicenseIns).expDate}"/>

			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
