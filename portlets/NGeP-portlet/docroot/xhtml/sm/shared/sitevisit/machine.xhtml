<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.manufacturing.equipmnt.mchne']}">
		<p:dataTable value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.smMachineDtls}" var="machineDtl"
		selection="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.selectedSmMachine}"
		rowKey="#{machineDtl}">
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.manufacturing.type.machine']}
					</f:facet>
				
					<h:outputText value="#{machineDtl.machineType}"></h:outputText>
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.brand']}
					</f:facet>
					<h:outputText value="#{machineDtl.brandName}"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.function']}
					</f:facet>
					<h:outputText value="#{machineDtl.machineFunction}"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.quantity']}
					</f:facet>
					<h:outputText value="#{machineDtl.qty}"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.value']}
					</f:facet>
					<h:outputText value="#{machineDtl.value}"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.purMthd']}
					</f:facet>
					<h:outputText value="#{machineDtl.purchaseMethod}"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.guarnName']}
					</f:facet>
					<h:outputText value="#{machineDtl.guarantorName}"></h:outputText>			
			</p:column>
						
			<p:column selectionMode="multiple" style="width:2%" headerText="Valid"/>
			<p:ajax event="rowSelectCheckbox" />
		</p:dataTable>
	</p:panel>
</ui:composition>
