<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.manufacturing.equipmnt.mchne']}">
		<p:dataTable value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.selectedSmMachine}" var="machine" 
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.manufacturing.type.machine']}
					</f:facet>
				
					<h:outputText value="#{machine.machineType}" style="float: left;white-space: normal;"></h:outputText>
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.brand']}
					</f:facet>
					<h:outputText value="#{machine.brandName}" style="float: left;white-space: normal;"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.function']}
					</f:facet>
					<h:outputText value="#{machine.machineFunction}" style="float: left;white-space: normal;"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.quantity']}
					</f:facet>
					<h:outputText value="#{machine.qty}" style="float: left;white-space: normal;"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.value']}
					</f:facet>
					<h:outputText value="#{machine.value}" style="float: left;white-space: normal;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>				
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.purMthd']}
					</f:facet>
					<h:outputText value="#{svoSiteVisitBackingBean.getParameterDesc(ParameterTypeConst.purchasingMethod,machine.purchaseMethod)}" 
					style="float: left;white-space: normal;"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.guarnName']}
					</f:facet>
					<h:outputText value="#{machine.guarantorName}" style="float: left;white-space: normal;"></h:outputText>			
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<ui:include src="/xhtml/sm/shared/sitevisit/additional_machine.xhtml" />
</ui:composition>
