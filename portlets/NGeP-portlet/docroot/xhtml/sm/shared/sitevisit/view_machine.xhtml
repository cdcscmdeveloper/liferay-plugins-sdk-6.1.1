<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Machine/ Equipment List">
		<p:dataTable value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvMachines}" var="machine">
			<p:column>
					<f:facet name="header">
						Type of Machine/ Equipment
					</f:facet>
				
					<h:outputText value="#{machine.smMachineDtl.machineType}"></h:outputText>
			</p:column>
			
			<p:column>
					<f:facet name="header">
						Brand
					</f:facet>
					<h:outputText value="#{machine.smMachineDtl.brandName}"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						Function
					</f:facet>
					<h:outputText value="#{machine.smMachineDtl.machineFunction}"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						Qty
					</f:facet>
					<h:outputText value="#{machine.smMachineDtl.qty}"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						Value(RM)
					</f:facet>
					<h:outputText value="#{machine.smMachineDtl.value}"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						Purchasing Method
					</f:facet>
					<h:outputText value="#{machine.smMachineDtl.purchaseMethod}"></h:outputText>			
			</p:column>
			
			<p:column>
					<f:facet name="header">
						Guarantor Name
					</f:facet>
					<h:outputText value="#{machine.smMachineDtl.guarantorName}"></h:outputText>			
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
