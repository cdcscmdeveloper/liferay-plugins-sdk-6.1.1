<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/js">
	
	<ui:param name="applInfo" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl}" />
	<p:panel header="#{lbl['lbl.sm.companyinfo']}" toggleable="true">
		<table class="customTbl">
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.equiComp.compName']}" /></td>
				<td class="header-info-text"><h:outputText value="#{applInfo.smSupplier.companyName}" /></td>
<!-- 				<td>MOF Registration No</td> -->
			</tr>
			
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.application.ref.no']}" /></td>
				<td class="header-info-text"><h:outputText value="#{applInfo.applNo}" /></td>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.applicationtype']}" /></td>
				<td class="header-info-text"><h:outputText value="#{lbl[svoSiteVisitBackingBean.getsupplierApplTypeDesc(applInfo.applType)]}" /></td>
			</tr>
			
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sc.spec.roc.no']}" /></td>
				<td class="header-info-text"><h:outputText value="#{applInfo.smSupplier.regNo}" /></td>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.telno']}" /></td>
				<td class="header-info-text"><h:outputText value="#{applInfo.smCompanyBasic.phoneFull}" /></td>
			</tr>
			
			<ui:param name="gstSupplier" value="#{svoSiteVisitBackingBean.managedBean.smGstSupplier}" />
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.gst.regno']}" /></td>
				<td class="header-info-text"><h:outputText value="#{gstSupplier.gstRegNo}" /></td>
				<td>&#160;</td>
				<td>&#160;</td>
				
			</tr>
			
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.gst.effdate']}" /></td>
				<td class="header-info-text">
					<h:outputText value="#{gstSupplier.gstEffDate}">
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</td>
				<td>&#160;</td>
				<td>&#160;</td>
			</tr>
			
			<ui:remove>
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.gst.eff.end.date']}" /></td>
				<td class="header-info-text">
					<h:outputText value="#{gstSupplier.gstEndDate}">
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</td>
				<td>&#160;</td>
				<td>&#160;</td>
			</tr>
			</ui:remove>
			
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.contact.person.name']}" /></td>
				<td class="header-info-text"><h:outputText value="#{svoSiteVisitBackingBean.managedBean.contactPerson.name}" /></td>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.contact.person.designation']}" /></td>
				<td class="header-info-text"><h:outputText value="#{svoSiteVisitBackingBean.managedBean.contactPerson.designation}" /></td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
