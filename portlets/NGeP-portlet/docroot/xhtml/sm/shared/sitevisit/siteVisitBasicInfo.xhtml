<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/js">
	
	<ui:param name="applInfo" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl}" />
	<p:panel header="#{lbl['lbl.sm.companyinfo']}">
		<table class="customTbl">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.equiComp.compName']}" /></td>
				<td><p:inputText value="#{applInfo.smSupplier.companyName}" disabled="true" /></td>
<!-- 				<td>MOF Registration No</td> -->
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.application.ref.no']}" /></td>
				<td><p:inputText value="#{applInfo.applNo}" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.applicationtype']}" /></td>
				<td><p:inputText value="#{lbl[svoSiteVisitBackingBean.getsupplierApplTypeDesc(applInfo.applType)]}" disabled="true" /></td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.roc.no']}" /></td>
				<td><p:inputText value="#{applInfo.smSupplier.regNo}" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.telno']}" /></td>
				<td><p:inputText value="#{applInfo.smCompanyBasic.phoneNo}" disabled="true" /></td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.contact.person.name']}" /></td>
				<td><p:inputText value="#{svoSiteVisitBackingBean.managedBean.contactPerson.name}" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.contact.person.designation']}" /></td>
				<td><p:inputText value="#{svoSiteVisitBackingBean.managedBean.contactPerson.designation}" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
