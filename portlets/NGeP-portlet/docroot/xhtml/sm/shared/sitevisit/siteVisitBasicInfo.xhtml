<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/js"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:param name="applInfo" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl}" />
	<p:panel header="#{lbl['lbl.sm.companyinfo']}" toggleable="true">
		<table class="customTbl">
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.companyinfo.accptd.app.date']}" /></td>
				<td>
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOfficers[0].createdDate}">
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</td>
				
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.companyinfo.final.info.date']}" /></td>
				<td>
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.changedDate}">
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</td>
			</tr>
		
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.equiComp.compName']}" /></td>
				<td class="header-info-text"><h:outputText value="#{applInfo.smSupplier.companyName}" /></td>

				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.business.company.type']}" /></td>
				<td class="header-info-text">
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.businessTypeDesc}" />
				</td>
			</tr>
			
			<tr>
				<td><p:outputLabel style="font-weight: bold;white-space:normal;" value="#{lbl['lbl.sm.companyaddress']}" /></td>
				<td class="header-info-text" style="word-break: keep-all;" colspan="3">
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.companyAddress}" />
				</td>
			</tr>
			
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.rocNo']}" /></td>
				<td class="header-info-text"><h:outputText value="#{applInfo.smSupplier.regNo}" /></td>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.telno']}" /></td>
				<td class="header-info-text"><h:outputText value="#{applInfo.smCompanyBasic.phoneFull}" /></td>
			</tr>
			
			<!-- #24819 - start -->
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.new.business.regNo']}" /></td>
				<td class="header-info-text">
					<h:outputText value="#{applInfo.smSupplier.ssmNewRegNo}"
						rendered="#{!empty applInfo.smSupplier.ssmNewRegNo}" />
					<h:outputText value="#{lbl['lbl.sm.no.available']}"
						rendered="#{empty applInfo.smSupplier.ssmNewRegNo}" /> &#160;
					<p:graphicImage id="newRegNoti" value="/css/images/design/tooltips.png" />
					<p:tooltip id="newRegNott" for="newRegNoti">
					<p:outputLabel escape="false" value="#{lbl['tt.sm.new.business.regNo']}" />
					</p:tooltip>&#160;</td>

				<td></td>
				<td></td>
			</tr>

			<tr>
				<td></td>
				<td class="header-info-text">
					<ac:instructionText value="#{lbl['lbl.sm.new.business.regNo.notes']}" /></td>
				<td></td>
				<td></td>
			</tr>
			<!-- #24819 - end -->
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.mofno']}" /></td>
				<td class="header-info-text">
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.mofNo}" rendered="#{!empty svoSiteVisitBackingBean.managedBean.mofNo}"/>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty svoSiteVisitBackingBean.managedBean.mofNo}"/>
				</td>
				
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.gst.regno']}" /></td>
				<td class="header-info-text">
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.smGstSupplier.gstRegNo}" rendered="#{!empty svoSiteVisitBackingBean.managedBean.smGstSupplier}"/>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty svoSiteVisitBackingBean.managedBean.smGstSupplier}"/>
				</td>
			</tr>
			
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.contact.person.name']}" /></td>
				<td class="header-info-text"><h:outputText value="#{svoSiteVisitBackingBean.managedBean.contactPerson.name}" /></td>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.contact.person.designation']}" /></td>
				<td class="header-info-text"><h:outputText value="#{svoSiteVisitBackingBean.managedBean.contactPerson.designation}" /></td>
			</tr>
			
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{lbl['lbl.sm.sitevisit.no']}" /></td>
				<td class="header-info-text"><h:outputText value="#{svoSiteVisitBackingBean.managedBean.siteVisitNo}" /></td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
