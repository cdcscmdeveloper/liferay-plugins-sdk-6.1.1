<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.equipment.maintnce.ovrhl']}">
		<p:dataTable value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.equipmentMain}" var="equipMaint">
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.equiType']}
					</f:facet>
				
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.equipmentParamMap[equipMaint.pmParameter.parameterId].codeName}"></h:outputText>
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.availableLbl']}
					</f:facet>
					
					<p:selectBooleanCheckbox value="#{equipMaint.equipmentAvailable}" disabled="#{viewFlag}"></p:selectBooleanCheckbox>
					
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.equipment.qtty.set']}
					</f:facet>
					<p:inputText value="#{equipMaint.equipmentQty}" disabled="#{viewFlag}"></p:inputText>
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.equipment.pnl.beat.spray.paint']}">
		<p:dataTable value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.equipmentBeating}" var="equipBinding">
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.equiType']}
					</f:facet>
				
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.equipmentParamMap[equipBinding.pmParameter.parameterId].codeName}"></h:outputText>
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.availableLbl']}
					</f:facet>
					
					<p:selectBooleanCheckbox value="#{equipBinding.equipmentAvailable}" disabled="#{viewFlag}"></p:selectBooleanCheckbox>
					
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.equipment.qtty.set']}
					</f:facet>
					<p:inputText value="#{equipBinding.equipmentQty}" disabled="#{viewFlag}"></p:inputText>
			</p:column>
		</p:dataTable>
	</p:panel>
	
</ui:composition>
