<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.equipment.maintnce.ovrhl']}">
		<p:dataTable value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.equipmentMain}" var="equipMaint" id="dtlEquipMain"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.equiType']}
					</f:facet>
				
					<h:outputText value="#{equipMaint.pmMachine.machineDesc}"></h:outputText>
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.availableLbl']}
					</f:facet>
					
					<div align="center">
					<p:selectBooleanCheckbox value="#{equipMaint.equipmentAvailable}" disabled="#{viewFlag}">
						<p:ajax event="change" listener="#{svoSiteVisitBackingBean.svEquipmentOnChange(equipMaint)}" update="dtlEquipMainQtySetId"></p:ajax>
					</p:selectBooleanCheckbox>
					</div>
					
			</p:column>
			
			<p:column>
					<f:facet name="header">
						<h:outputText value="*" styleClass="mandatory" />
						#{lbl['lbl.sm.equipment.qtty.set']}
					</f:facet>
					<p:inputText value="#{equipMaint.equipmentQty}" label="#{lbl['lbl.sm.equipment.qtty.set']}" id="dtlEquipMainQtySetId" maxlength="8"
						converterMessage="#{lbl['lbl.sm.equipment.qtty.set']}: #{lbl['lbl.sm.validator.number.min1']}" 
						validatorMessage="#{lbl['lbl.sm.equipment.qtty.set']}: #{lbl['lbl.sm.validator.number.min1']}"
						disabled="#{viewFlag || !equipMaint.equipmentAvailable}" 
						required="#{equipMaint.equipmentAvailable and empty param['disableMsgAutoUpdate'] and empty param['disabledValidation']}" >
						<f:validateLongRange minimum="1"  for="dtlEquipMainQtySetId"></f:validateLongRange>
					</p:inputText>
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty equipMaint and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.getSVOSmSvEquipment(equipMaint).equipmentQty}" 
						currValue="#{equipMaint.equipmentQty}" 
						alertValue="#{svoSiteVisitBackingBean.getSVOSmSvEquipment(equipMaint).equipmentQty}"/>
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.equipment.pnl.beat.spray.paint']}">
		<p:dataTable value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.equipmentBeating}" var="equipBinding" id="dtlEquipBinding"
		emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.equiType']}
					</f:facet>
					<h:outputText value="#{equipBinding.pmMachine.machineDesc}"></h:outputText>
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.availableLbl']}
					</f:facet>
					<div align="center">
					<p:selectBooleanCheckbox value="#{equipBinding.equipmentAvailable}" disabled="#{viewFlag}">
						<p:ajax event="change" listener="#{svoSiteVisitBackingBean.svEquipmentOnChange(equipBinding)}" update="dtlEquipBeatingQtySetId"></p:ajax>
					</p:selectBooleanCheckbox>
					</div>
			</p:column>
			
			<p:column>
					<f:facet name="header">
						<h:outputText value="*" styleClass="mandatory" />
						#{lbl['lbl.sm.equipment.qtty.set']}
					</f:facet>
					<p:inputText value="#{equipBinding.equipmentQty}" label="#{lbl['lbl.sm.equipment.qtty.set']}" maxlength="8" id="dtlEquipBeatingQtySetId"
						converterMessage="#{lbl['lbl.sm.equipment.qtty.set']}: #{lbl['lbl.sm.validator.number.min1']}" 
						validatorMessage="#{lbl['lbl.sm.equipment.qtty.set']}: #{lbl['lbl.sm.validator.number.min1']}"
						disabled="#{viewFlag || !equipBinding.equipmentAvailable}" 
						required="#{equipBinding.equipmentAvailable and empty param['disableMsgAutoUpdate'] and empty param['disabledValidation']}">
							<f:validateLongRange minimum="1" for="dtlEquipBeatingQtySetId"></f:validateLongRange>
					</p:inputText>
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty equipBinding and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.getSVOSmSvEquipment(equipBinding).equipmentQty}" 
						currValue="#{equipBinding.equipmentQty}" 
						alertValue="#{svoSiteVisitBackingBean.getSVOSmSvEquipment(equipBinding).equipmentQty}"/>
			</p:column>
		</p:dataTable>
	</p:panel>
	
</ui:composition>
