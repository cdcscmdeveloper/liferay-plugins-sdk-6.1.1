<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.officeloc.operation.stage']}" toggleable="true">
		<p:inputTextarea  rows="8"  disabled="#{viewFlag}" autoResize="false" style="width:80%;"  maxlength="4000" 
		value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment.operationStage}" label="#{lbl['lbl.sm.officeloc.operation.stage']}">
		 <f:validateLength maximum="4000" />	   
		</p:inputTextarea>
		<!-- #24964 -->
		<ac:smFieldChangeAlertSVO 
			isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
			oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvTemplate.smSvComment.operationStage}" 
			currValue="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment.operationStage}" 
			alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvTemplate.smSvComment.operationStage}" />
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.officeloc.prod.capability']}" toggleable="true">
		<p:inputTextarea  rows="8"   disabled="#{viewFlag}" autoResize="false" style="width:80%;" maxlength="4000" 
		value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment.productionCapacity}" label="#{lbl['lbl.sm.officeloc.prod.capability']}">
		 <f:validateLength maximum="4000" />
		</p:inputTextarea>
		<!-- #24964 -->
		<ac:smFieldChangeAlertSVO 
			isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
			oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvTemplate.smSvComment.productionCapacity}" 
			currValue="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment.productionCapacity}" 
			alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvTemplate.smSvComment.productionCapacity}" />
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.manufacturing.factrymchne.ownrshp.method']}" toggleable="true">
		<p:inputTextarea rows="8"   disabled="#{viewFlag}" autoResize="false" style="width:80%;" maxlength="4000" 
		value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment.fmOwnershipMethod}" label="#{lbl['lbl.sm.manufacturing.factrymchne.ownrshp.method']}">
		 <f:validateLength maximum="4000" />
		</p:inputTextarea>
		<!-- #24964 -->
		<ac:smFieldChangeAlertSVO 
			isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
			oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvTemplate.smSvComment.fmOwnershipMethod}" 
			currValue="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvComment.fmOwnershipMethod}" 
			alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvTemplate.smSvComment.fmOwnershipMethod}" />
	</p:panel>
</ui:composition>
