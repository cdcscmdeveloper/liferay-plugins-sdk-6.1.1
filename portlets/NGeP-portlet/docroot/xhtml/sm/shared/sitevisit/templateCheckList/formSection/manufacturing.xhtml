<ui:composition

	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<p:panel header="#{lbl['lbl.sm.manufacturing.financial']}"  toggleable="true">
			<p:dataTable var="manuList"
				value="#{svoSiteVisitBackingBean.managedBean.manuFactList}">
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">
					<p:outputLabel value="#{manuList.manuNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.manufacturing.documents']}">
					<p:outputLabel value="#{manuList.manuDoc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.manufacturing.referee']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.manufacturing.dateissued']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.manufacturing.notes']}">
					<p:outputLabel />
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel header="#{lbl['lbl.sm.manufacturing.additional.docs']}"  toggleable="true">
			<p:dataTable>
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.manufacturing.documents']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.manufacturing.referee']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.manufacturing.dateissued']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.manufacturing.notes']}">
					<p:outputLabel />
				</p:column>
			</p:dataTable>

			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}" />

				<p:commandButton value="#{lbl['lbl.sm.button.edit']}" />

				<p:commandButton value="#{lbl['lbl.sm.button.delete']}" />
			</div>
		</p:panel>

		<p:panel header="#{lbl['lbl.sm.manufacturing.equipmnt.mchne']}"  toggleable="true">
			<p:dataTable>
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.manufacturing.type.machine']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.manufacture.brand']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.machine.function']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.machine.quantity']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.equiStatus.valTabHdr']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.machine.purMthd']}">
					<p:outputLabel />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.machine.guarnName']}">
					<p:outputLabel />
				</p:column>
			</p:dataTable>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}" />

				<p:commandButton value="#{lbl['lbl.sm.button.edit']}" />

				<p:commandButton value="#{lbl['lbl.sm.button.delete']}" />
			</div>
		</p:panel>

</ui:composition>
