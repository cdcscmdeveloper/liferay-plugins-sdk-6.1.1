<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Company Information" toggleable="true">
		<table class="test">
			<tr>
				<td><p:outputLabel
						value="Accepted Application Date" /></td>
				<td><p:inputText /></td>

				<td><p:outputLabel value="Company Name" /></td>
				<td><p:inputText /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Final Information Date" /></td>
				<td><p:inputText /></td>

			</tr>

			<tr>
				<td><p:outputLabel value="Address" /></td>
				<td id="tdContent" colspan="3"><p:inputText /></td>
			</tr>
			<tr>
				<td><p:outputLabel /></td>
				<td id="tdContent" colspan="3"><p:inputText /></td>
			</tr>
			<tr>
				<td><p:outputLabel /></td>
				<td id="tdContent" colspan="3"><p:inputText /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Postal Code" /></td>
				<td><p:inputText /></td>

				<td><p:outputLabel value="Town/City" /></td>
				<td><p:inputText /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="State" /></td>
				<td><p:inputText /></td>

				<td><p:outputLabel value="District" /></td>
				<td><p:inputText /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="MOF Registration No." /></td>
				<td><p:inputText /></td>

				<td><p:outputLabel
						value="Application Reference No." /></td>
				<td><p:inputText /></td>
			</tr>

		</table>
	</p:panel>

	<p:panel header="Visiting Information" toggleable="true">
		<table class="test">
			<tr>
				<td><p:outputLabel value="Visiting Date" /></td>
				<td><p:calendar showOn="button" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Visiting Officers" /></td>
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td><p:outputLabel /></td>
				<td><p:inputText /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Visiting Officers" /></td>
				<td><p:inputText /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="Interviewed Representatives" toggleable="true">
		<p:dataTable>
			<p:column headerText="Name"></p:column>
			<p:column headerText="Designation"></p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add" />
			<p:commandButton value="Remove" />
		</div>
	</p:panel>
</ui:composition>
