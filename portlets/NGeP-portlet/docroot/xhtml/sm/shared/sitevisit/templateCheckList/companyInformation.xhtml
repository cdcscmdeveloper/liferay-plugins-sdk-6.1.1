<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.companyinfo']}" toggleable="true">
		<table class="rptTbl">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.companyinfo.accptd.app.date']}" /></td>
				<td><p:inputText size="40" /></td>

				<td><p:outputLabel value="#{lbl['lbl.sm.equiComp.compName']}" /></td>
				<td><p:inputText size="40" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.companyinfo.final.info.date']}" /></td>
				<td><p:inputText size="40" /></td>

			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.address']}" /></td>
				<td colspan="3"><p:inputText size="40" /></td>
			</tr>
			<tr>
				<td><p:outputLabel /></td>
				<td colspan="3"><p:inputText size="40" /></td>
			</tr>
			<tr>
				<td><p:outputLabel /></td>
				<td colspan="3"><p:inputText size="40" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:inputText /></td>

				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:inputText size="40" /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:inputText size="40" /></td>

				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
				<td><p:inputText size="40" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.mof']}" /></td>
				<td><p:inputText size="40" /></td>

				<td><p:outputLabel value="#{lbl['lbl.sm.application.ref.no']}" /></td>
				<td><p:inputText size="40" /></td>
			</tr>

		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.visiting.info']}" toggleable="true">
		<table class="rptTbl">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.visiting.date']}" /></td>
				<td><p:calendar showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.visiting.officers.one']}" /></td>
				<td><p:inputText size="40" /></td>
				<td><p:outputLabel value="2" /></td>
				<td><p:inputText size="40" /></td>
			</tr>

		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.companyinfo.intvw.represent']}" toggleable="true">
		<p:dataTable>
			<p:column headerText="#{lbl['lbl.sm.person.name']}"></p:column>
			<p:column headerText="#{lbl['lbl.sm.userprofile.designation']}"></p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}" />
			<p:commandButton value="#{lbl['lbl.sm.button.delete']}" />
		</div>
	</p:panel>
</ui:composition>
