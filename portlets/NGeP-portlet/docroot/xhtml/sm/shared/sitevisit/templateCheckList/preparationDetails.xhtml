<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.svo.company.prep.details']}" toggleable="true">
		<table class="rptTbl">
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.application.ref.no']}" /></td>
				<td><p:inputText size="40"/></td>

				<td><p:outputLabel value="#{lbl['lbl.sm.assocCmpny.companyName']}" /></td>
				<td><p:inputText size="40" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.roc.no']}" /></td>
				<td><p:inputText size="40" /></td>

				<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.address']}" /></td>
				<td><p:inputText size="40" /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:inputText size="40" /></td>

				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:inputText size="40" /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:inputText size="40" /></td>

				<td><p:outputLabel value="#{lbl['lbl.sm.telno']}" /></td>
				<td><p:inputText size="40" /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.visiting.purpose']}" /></td>
				<td><p:inputText size="40" /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.contact.person.name']}" /></td>
				<td><p:inputText size="40" /></td>

				<td><p:outputLabel
						value="#{lbl['lbl.sm.userprofile.designation']}" /></td>
				<td><p:inputText size="40" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel toggleable="true">
		<p:dataTable>
			<p:column headerText="#{lbl['lbl.sm.category.description']}">
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.category.remarks']}">
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.button.add']}" />
			<p:commandButton value="#{lbl['lbl.button.delete']}" />
		</div>
	</p:panel>
</ui:composition>
