<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Preparation Details" toggleable="true">
		<table class="rptTbl">
			<tr>
				<td><p:outputLabel
						value="Application Reference No." /></td>
				<td><p:inputText size="40"/></td>

				<td><p:outputLabel value="Company Name" /></td>
				<td><p:inputText size="40" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="ROC/ROB/ROS No." /></td>
				<td><p:inputText size="40" /></td>

				<td><p:outputLabel value="Site Visit Address" /></td>
				<td><p:inputText size="40" /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="Postal Code" /></td>
				<td><p:inputText size="40" /></td>

				<td><p:outputLabel value="Town/City" /></td>
				<td><p:inputText size="40" /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="State" /></td>
				<td><p:inputText size="40" /></td>

				<td><p:outputLabel value="Telephone No." /></td>
				<td><p:inputText size="40" /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="Visiting Purpose" /></td>
				<td><p:inputText size="40" /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="Contact Person Name" /></td>
				<td><p:inputText size="40" /></td>

				<td><p:outputLabel
						value="Designation" /></td>
				<td><p:inputText size="40" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel toggleable="true">
		<p:dataTable>
			<p:column headerText="Category Description">
			</p:column>

			<p:column headerText="Category Remarks">
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add" />
			<p:commandButton value="Remove" />
		</div>
	</p:panel>
</ui:composition>
