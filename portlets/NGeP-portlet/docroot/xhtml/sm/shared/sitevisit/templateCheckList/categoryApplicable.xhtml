<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<p:panel header="#{lbl['lbl.sm.sitevist.svo.category.applicable']}"  toggleable="true">
			<p:dataTable>
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">
					<f:facet name="header">#{lbl['lbl.sm.userprofile.num']}</f:facet>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.catCodes.catcode']}">
					<f:facet name="header">#{lbl['lbl.sm.catCodes.catcode']}</f:facet>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.category.description']}">
					<f:facet name="header">#{lbl['lbl.sm.category.description']}</f:facet>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.sitevist.svo.first.recommendation']}">
					<f:facet name="header"></f:facet>
				</p:column>
			</p:dataTable>

			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}" />
			</div>
		</p:panel>

</ui:composition>
