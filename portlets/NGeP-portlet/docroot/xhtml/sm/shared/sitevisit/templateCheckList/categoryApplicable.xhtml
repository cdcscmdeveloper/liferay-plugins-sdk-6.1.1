<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<p:panel header="Category Applicable">
			<p:dataTable>
				<p:column headerText="No">
					<f:facet name="header">No</f:facet>
				</p:column>

				<p:column headerText="Category Code">
					<f:facet name="header">Category Code</f:facet>
				</p:column>

				<p:column headerText="Category Description">
					<f:facet name="header">Category Description</f:facet>
				</p:column>

				<p:column headerText="First Recommendation">
					<f:facet name="header"></f:facet>
				</p:column>
			</p:dataTable>

			<div align="right">
				<p:commandButton value="Add" />
				<p:commandButton value="Remove" />
			</div>
		</p:panel>

</ui:composition>
