<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Office Location" toggleable="true">
		<table class="rptTbl">
			<tr>
				<td><p:outputLabel value="Office Ownership" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="Select" itemValue="" />
						<f:selectItem itemLabel="Private" itemValue="private"></f:selectItem>
						<f:selectItem itemLabel="Rent" itemValue="rent"></f:selectItem>
					</p:selectOneMenu></td>

				<td><p:outputLabel value="Purchase Price/ Monthly Rate (RM)" />
				</td>
				<td><p:inputText /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Share With" /></td>
				<td><p:inputText /></td>

				<td><p:outputLabel value="Sign Board" /></td>
				<td><p:inputText /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Office Arrangement" /></td>
				<td><p:inputText /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="Comment" toggleable="true">
		<table style="width: 80%;">
			<tr>
				<td><b>Operation Stage</b></td>
			</tr>
			<tr>
				<td><p:inputTextarea rows="5" cols="100" /></td>
			</tr>

			<tr>
				<td><b>Production Capability</b></td>
			</tr>
			<tr>
				<td><p:inputTextarea rows="5" cols="100" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="Company Information Update (If any changes)"
		toggleable="true">
		<p:inputTextarea rows="5" cols="100" />
	</p:panel>
	<p:panel header="Recommendation" toggleable="true">
		<p:inputTextarea rows="5" cols="100" />
	</p:panel>

	<p:panel header="Declaration" toggleable="true">
		<table class="rptTbl">
			<tr>
				<td><p:outputLabel value="Name" /></td>
				<td><p:inputText /></td>
				<td><p:outputLabel value="Date" /></td>
				<td><p:calendar id="cal" navigator="true" display="inline" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Name" /></td>
				<td><p:inputText /></td>

				<td><p:outputLabel value="Date" /></td>
				<td><p:calendar id="cal1" navigator="true" display="inline" /></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
