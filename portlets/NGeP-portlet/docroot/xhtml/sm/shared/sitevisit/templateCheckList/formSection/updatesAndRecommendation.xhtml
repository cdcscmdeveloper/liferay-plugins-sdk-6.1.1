	<p:panel header="Office Location" toggleable="true">
		<table class="test">
			<tr>

				<td id="tdContent"><p:selectOneMenu>
						<f:selectItem itemLabel="Select" itemValue="" />

						<f:selectItem itemLabel="Rent" itemValue="rent"></f:selectItem>
					</p:selectOneMenu></td>

				<td id="tdTitle">Purchase Price/<br />Monthly Rate (RM)
				</td>

			<tr>

			</tr>

	<p:panel header="Comment" toggleable="true">
		<p:outputLabel value="Operation Stage" />
		<br />
		<p:inputTextarea rows="10" cols="100" />
		<br />
		<p:outputLabel value="Production Capability" />
		<br />
		<p:inputTextarea rows="10" cols="100" />
		<br />
		<p:outputLabel value="Factory/Machine Ownership and Ownership Method" />
		<br />
		<p:inputTextarea rows="10" cols="100" />
		<br />

	<p:panel header="Company Information Update (If any changes)"
		toggleable="true">
		<p:inputTextarea rows="10" cols="100" />
	</p:panel>
	<p:panel header="Recommendation/Declaration" toggleable="true">
		<p:inputTextarea rows="10" cols="100" />

		<table class="test">
			<tr>
				<td id="tdTitle"><p:outputLabel value="Name" /></td>
				<td id="tdContent"><p:inputText /></td>
				<td id="tdTitle"><p:outputLabel value="Date" /></td>
				<td id="tdContent"><p:calendar id="cal" navigator="true"
						display="inline" /></td>
			</tr>

			<tr>
				<td id="tdTitle"><p:outputLabel value="Name" /></td>
