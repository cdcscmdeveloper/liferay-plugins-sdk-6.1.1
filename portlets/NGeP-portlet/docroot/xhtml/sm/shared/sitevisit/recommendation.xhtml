<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.sitevisit.recommdeclaration']}" toggleable="true">
		<table width="80%">
			<tr>
				<td valign="top" width="35%"><p:outputLabel value="#{lbl['lbl.sm.comments']}" /></td>
				<td>
					<p:inputTextarea rows="8" id="commentId"  style="width:70%;" autoResize="false"  label="#{lbl['lbl.sm.comments']}"
					maxlength="5000" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.officerComment}">
						<f:validateLength maximum="5000" />
					</p:inputTextarea>
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.smSvTask.officerComment and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.officerComment}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.smSvTask.officerComment}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.officerComment}"/>
				</td>
			</tr>
			
			<!-- 28775 - Site Visit Grouping Enhancement - 28775 -->
			<ui:remove>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sm.officeloc.cmpny.info.update.any']}" /></td>
				<td>
					<p:inputTextarea rows="8" id="compInfoId"  style="width:70%;" autoResize="false" label="#{lbl['lbl.sm.officeloc.cmpny.info.update.any']}"
					maxlength="1000" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.companyInfoUpdate}">
						<f:validateLength maximum="1000" />
					</p:inputTextarea>
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.smSvTask.companyInfoUpdate and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.companyInfoUpdate}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.smSvTask.companyInfoUpdate}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.companyInfoUpdate}"/>
				</td>
			</tr>
			</ui:remove>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.sitevisit.recommdeclaration']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneRadio id="recommendationId" label="#{lbl['lbl.sm.sitevisit.recommdeclaration']}" required="#{!empty param['disableValidation']}"
					value="#{svoSiteVisitBackingBean.managedBean.smSvTask.recommended}">
			            <f:selectItem itemLabel="#{lbl['lbl.sm.sitevisit.approve']}" itemValue="true" />
			            <f:selectItem itemLabel="#{lbl['lbl.sm.sitevisit.reject']}" itemValue="false" />
			        </p:selectOneRadio>
			        <!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.recommended}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.smSvTask.recommended}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.recommended}"/>
				</td>
			</tr>
			
			<!-- 28775 - Site Visit Grouping Enhancement - 28775 - start -->
			<ui:remove>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.sitevisit.bumirecommend']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneRadio id="bumiRecommendId" label="#{lbl['lbl.sm.sitevisit.bumirecommend']}" required="#{!empty param['disableValidation']}"
					value="#{svoSiteVisitBackingBean.managedBean.smSvTask.bumiRecommended}">
			            <f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="true" />
			            <f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="false" />
			        </p:selectOneRadio>
			        <!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.bumiRecommended}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.smSvTask.bumiRecommended}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.bumiRecommended}"/>
				</td>
			</tr>
			</ui:remove>
			<!-- 28775 - Site Visit Grouping Enhancement - 28775 - end -->
		</table>
	</p:panel>
	
</ui:composition>
