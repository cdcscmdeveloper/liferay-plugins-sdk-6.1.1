<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.sitevisit.recommdeclaration']}" toggleable="true">
		<table>
			<tr>
				<td valign="top" style="width:30%"><p:outputLabel value="#{lbl['lbl.sm.comments']}" /></td>
				<td>
					<p:inputTextarea rows="8" id="commentId"  style="width:70%;" autoResize="false" 
					maxlength="1000" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.companyInfoUpdate}" />
				</td>
			</tr>
			
			<tr>
				<td valign="top" style="width:30%"><p:outputLabel value="#{lbl['lbl.sm.officeloc.cmpny.info.update.any']}" /></td>
				<td>
					<p:inputTextarea rows="8" id="compInfoId"  style="width:50%;" autoResize="false" 
					maxlength="1000" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.companyInfoUpdate}" />
				</td>
			</tr>

			<tr>
				<td style="width:30%"><p:outputLabel value="#{lbl['lbl.sm.sitevisit.recommdeclaration']}" /></td>
				<td>
					<p:selectOneRadio id="recommendationId" label="#{lbl['lbl.sm.sitevisit.recommdeclaration']}" required="#{!empty param['disableValidation']}"
					value="#{svoSiteVisitBackingBean.managedBean.smSvTask.recommended}">
			            <f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="true" />
			            <f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="false" />
			        </p:selectOneRadio>
				</td>
			</tr>
			
			<tr>
				<td style="width:30%"><p:outputLabel value="#{lbl['lbl.sm.sitevisit.bumirecommend']}" /></td>
				<td>
					<p:selectOneRadio id="bumiRecommendId" label="#{lbl['lbl.sm.sitevisit.bumirecommend']}" required="#{!empty param['disableValidation']}"
					value="#{svoSiteVisitBackingBean.managedBean.smSvTask.bumiRecommended}">
			            <f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="true" />
			            <f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="false" />
			        </p:selectOneRadio>
				</td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
