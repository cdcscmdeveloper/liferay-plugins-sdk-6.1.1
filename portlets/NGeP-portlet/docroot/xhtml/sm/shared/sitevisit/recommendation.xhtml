<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.sitevisit.recommdeclaration']}" toggleable="true">
		<table width="80%">
			<tr>
				<td valign="top" width="35%"><p:outputLabel value="#{lbl['lbl.sm.comments']}" /></td>
				<td>
					<!-- 28775 - Site Visit Grouping Enhancement - 28775 -->
					<!-- #34166 - Start  -->
					<p:inputTextarea rows="8" id="commentId"  style="width:70%;" autoResize="false"  label="#{lbl['lbl.sm.comments']}"
						maxlength="4000" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.officerComment}" 
						disabled="#{svoSiteVisitBackingBean.managedBean.viewMode}" validator="#{svoSiteVisitBackingBean.validateText}" >
						<f:attribute name="param" value="#{lbl['lbl.sm.comments']}" />
						<f:ajax event="blur" execute="@this" />
						<f:validateLength maximum="4000" />
					</p:inputTextarea>
					<!-- #34166 - End  -->
				</td>
			</tr>
			
			<!-- 28775 - Site Visit Grouping Enhancement - 28775 -->
			<ui:remove>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sm.officeloc.cmpny.info.update.any']}" /></td>
				<td>
				<!-- #34166 - Start -->
					<p:inputTextarea rows="8" id="compInfoId"  style="width:70%;" autoResize="false" 
						label="#{lbl['lbl.sm.officeloc.cmpny.info.update.any']}"
						maxlength="1000" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.companyInfoUpdate}" 
						disabled="#{svoSiteVisitBackingBean.managedBean.viewMode}" validator="#{svoSiteVisitBackingBean.validateText}">
							<f:attribute name="param" value="#{lbl['lbl.sm.officeloc.cmpny.info.update.any']}" />
							<f:ajax event="blur" execute="@this" />
							<f:validateLength maximum="1000" />
						</p:inputTextarea>
				<!-- #34166 - End -->
				</td>
			</tr>
			</ui:remove>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.sitevisit.recommdeclaration']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneRadio id="recommendationId" label="#{lbl['lbl.sm.sitevisit.recommdeclaration']}" 
					required="#{!empty param['disableValidation']}"
					value="#{svoSiteVisitBackingBean.managedBean.smSvTask.recommended}" disabled="#{svoSiteVisitBackingBean.managedBean.viewMode}">
			            <f:selectItem itemLabel="#{lbl['lbl.sm.sitevisit.approve']}" itemValue="true" />
			            <f:selectItem itemLabel="#{lbl['lbl.sm.sitevisit.reject']}" itemValue="false" />
			        </p:selectOneRadio>
				</td>
			</tr>
			
			<!-- 28775 - Site Visit Grouping Enhancement - 28775 - start -->
			<ui:remove>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.sitevisit.bumirecommend']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneRadio id="bumiRecommendId" label="#{lbl['lbl.sm.sitevisit.bumirecommend']}" 
					required="#{!empty param['disableValidation']}" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.bumiRecommended}" 
					disabled="#{svoSiteVisitBackingBean.managedBean.viewMode}">
			            <f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="true" />
			            <f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="false" />
			        </p:selectOneRadio>
				</td>
			</tr>
			</ui:remove>
			<!-- 28775 - Site Visit Grouping Enhancement - 28775 - end -->
		</table>
	</p:panel>
	
</ui:composition>
