<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel id="pnlPremiseLocation" header="#{lbl['lbl.sm.sitevisit.premiselocation']}" toggleable="true">
	<table class="customTbl">
		<tr>
			<td><p:outputLabel value="Ownership" /></td>
			<td>
				<p:selectOneMenu style="width:100px" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.ownershipType}" disabled="#{viewFlag}">
					<f:selectItem itemLabel = "---Select one---" itemValue="" />
					<f:selectItem itemLabel = "Private" itemValue="P" />
					<f:selectItem itemLabel = "Rent" itemValue="R" />
				</p:selectOneMenu>
			</td>
			
			<td><p:outputLabel value="Purchasing Price/ Monthly Rate(RM)" /></td>
			<td>
				<p:inputText  id="pmPriceRate" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.purchaseRentPrice}" disabled="#{viewFlag}"/>
			</td>
		</tr>
		
		<tr>
		
			<td><p:outputLabel value="Overall Square Feet/ Meter" /></td>
			<td><p:inputText value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.overallSqft}" maxlength="20" disabled="#{viewFlag}" /></td>
			
			<td><p:outputLabel value="Enclosed Square Feet/ Meter" /></td>
			<td><p:inputText value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.enclosedSqft}" maxlength="20" disabled="#{viewFlag}" /></td>
		</tr>
		
		<tr>
			<td valign="top"><p:outputLabel value="Floor" /></td>
			<td>
				<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.cementFloor}" />Cement<br />
				<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.tarFloor}" />Tar<br />
				<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.otherFloor}" />Others
			</td>
			
			<td valign="top"><p:outputLabel value="Environment" /></td>
			<td>
				<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.envFence}" />Fenced<br />
				<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.envClean}" />Cleanliness<br />
				<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.envOrganize}" />Organized
			</td>
		</tr>
		
	</table>
	</p:panel>
</ui:composition>
