<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel id="pnlPremiseLocation" header="#{lbl['lbl.sm.sitevisit.premiselocation']}" toggleable="true">
	<table class="customTbl">
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.sitevisit.ownership']}" /></td>
			<td>
				<p:selectOneMenu style="width:100px" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.ownershipType}" disabled="true">
					<f:selectItem itemLabel = "#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.facility.own']}" itemValue="O" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.facility.rent']}" itemValue="R" />
				</p:selectOneMenu>
			</td>
			
			<td><p:outputLabel value="#{lbl['lbl.sm.officeloc.purchase.monthly.price']}" /></td>
			<td>
		    <p:inputText size="35" id="pmPriceRate" maxlength="17"
								label="#{lbl['lbl.sm.officeloc.purchase.monthly.price']}"
								disabled="true"
								validatorMessage="#{lbl['lbl.sm.facility.purchasePrice']} - #{lbl['lbl.sm.minAmt.validMsg']}"
								value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.purchaseRentPrice}"
								required="true">
					            <f:validateDoubleRange
								     minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
								     maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
				                <f:convertNumber 
				                     pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				                <p:ajax process="@this" partialSubmit="true"
								       update="@this,purchasePriceMsg" />
			</p:inputText>      <p:message id="purchasePriceMsg" for="pmPriceRate"
								    showSummary="true" showDetail="false" display="icon" />
						
			</td>
		</tr>
		
		<tr>
		
			<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.premiseloc.overall.sqft']}" /></td>
			<td><p:inputText value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.overallSqft}" maxlength="20" disabled="true" /></td>
			
			<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.premiseloc.enclsd.sqft']}" /></td>
			<td><p:inputText value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.enclosedSqft}" maxlength="20" disabled="true" /></td>
		</tr>
		
		<tr>
			<td valign="top"><p:outputLabel value="#{lbl['lbl.sm.sitevist.premiseloc.floor']}" /></td>
			<td>
				<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.cementFloor}" />Cement<br />
				<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.tarFloor}" />Tar<br />
				<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.otherFloor}" />Others
			</td>
			
			<td valign="top"><p:outputLabel value="#{lbl['lbl.sm.sitevist.premiseloc.environment']}" /></td>
			<td>
				<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.envFence}" />Fenced<br />
				<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.envClean}" />Cleanliness<br />
				<p:selectBooleanCheckbox disabled="#{viewFlag}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvFacility.envOrganize}" />Organized
			</td>
		</tr>
		
	</table>
	</p:panel>
</ui:composition>
