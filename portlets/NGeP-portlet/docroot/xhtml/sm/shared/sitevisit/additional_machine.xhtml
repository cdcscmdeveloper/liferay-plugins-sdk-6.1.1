<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="#{lbl['lbl.sm.sitevisit.additional.machine']}" id="pnlAdtMachine">
		<p:dataTable id="addlMachineDtTbl" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvAdtMachines}" var="addMachineDtl"
			selection="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.selectedAdtMachines}" rowKey="#{addMachineDtl}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:column selectionMode="multiple" style="width:2%" rendered="#{!viewFlag and not empty svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvAdtMachines}"/>
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.manufacturing.type.machine']}
					</f:facet>
					<h:outputText value="#{addMachineDtl.machineType}"  style="float: left;white-space: normal;" />
			</p:column>			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.brand']}
					</f:facet>
					<h:outputText value="#{addMachineDtl.brandName}"  style="float: left;white-space: normal;" />	
			</p:column>			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.function']}
					</f:facet>
					<h:outputText value="#{addMachineDtl.machineFunction}"  style="float: left;white-space: normal;" />		
			</p:column>			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.quantity']}
					</f:facet>
					<h:outputText value="#{addMachineDtl.qty}"  style="float: left;white-space: normal;" />
			</p:column>			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.value']}
					</f:facet>
					<h:outputText value="#{addMachineDtl.value}"  style="float: left;white-space: normal;">
						<f:convertNumber  pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />		
					</h:outputText>		
			</p:column>			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.purMthd']}
					</f:facet>
					<h:outputText value="#{svoSiteVisitBackingBean.getParameterDesc(ParameterTypeConst.purchasingMethod,addMachineDtl.purchaseMethod)}"  style="float: left;white-space: normal;" />
					<ui:fragment rendered="#{addMachineDtl.purchaseMethod eq 'O'}" ><br /></ui:fragment>
					<h:outputText value="(#{addMachineDtl.purchaseMethodRemark})" rendered="#{addMachineDtl.purchaseMethod eq 'O'}" style="float: left;white-space: normal;"></h:outputText>
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.purchase.year']}
					</f:facet>
					<h:outputText value="#{addMachineDtl.purchaseYear}"  style="float: left;white-space: normal;" />		
			</p:column>
			
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.machine.guarnName']}
					</f:facet>
					<h:outputText  value="#{addMachineDtl.guarantorName}"  style="float: left;white-space: normal;" />		
			</p:column>
			
			<p:column rendered="#{!viewFlag}">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.action']}" />
				</f:facet>
				<p:commandLink id="btnAdtMacEdit" oncomplete="adtMacDlg.show();" update=":#{p:component('adtMachineDlg')}" rendered="#{!viewFlag}"
					action="#{svoSiteVisitBackingBean.editAdditionalMachine(addMachineDtl)}" process="@this">
					<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}"/>
				</p:commandLink>
			</p:column>
		</p:dataTable>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}" oncomplete="adtMacDlg.show();"  process="@this" 
				action="#{svoSiteVisitBackingBean.addAdditionalMachine}" rendered="#{!viewFlag}"
				update="addlMachineDtTbl,adtMachineDlg">
			</p:commandButton>
			
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				action="#{svoSiteVisitBackingBean.removeAdditionalMachine}" rendered="#{!viewFlag}" update="addlMachineDtTbl">
			</p:commandButton>
		</div>
	</p:panel>

	<p:dialog id="adtMachineDlg" header="#{lbl['lbl.sm.sitevisit.additional.machine']}" widgetVar="adtMacDlg" 
		modal="true" width="600" dynamic="true">
		<p:messages id="dlgMessages" showDetail="true" autoUpdate="#{!empty param['disableMsgAutoUpdate']}" closable="true" showSummary="false" />
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacturing.type.machine']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="50" size="50" label="#{lbl['lbl.sm.manufacturing.type.machine']}" required="#{!empty param['disableMsgAutoUpdate']}" value="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.machineType}" /></td>
			</tr>
			
			<tr>	
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.brand']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="50" size="50" label="#{lbl['lbl.sm.machine.brand']}" required="#{!empty param['disableMsgAutoUpdate']}" value="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.brandName}" /></td>
			</tr>
			
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sm.machine.function']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputTextarea  maxlength="100" style="width:75;" label="#{lbl['lbl.sm.machine.function']}" 
				required="#{!empty param['disableMsgAutoUpdate']}" value="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.machineFunction}">
					<f:validateLength maximum="100" />
				</p:inputTextarea>
				</td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.quantity']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:inputText maxlength="8" size="50" label="#{lbl['lbl.sm.machine.quantity']}" required="#{!empty param['disableMsgAutoUpdate']}" 
					value="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.qty}">
						<f:validateLongRange minimum="1" maximum="99999999"></f:validateLongRange>
					</p:inputText>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.value']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="14" size="50" label="#{lbl['lbl.sm.machine.value']}" required="#{!empty param['disableMsgAutoUpdate']}" value="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.value}">
						<f:validateDoubleRange minimum="#{SupplierManagementConst.MIN_AMT_RANGE}" 
						maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" disabled="#{empty param['disableMsgAutoUpdate']}"/>
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax process="@this" partialSubmit="true" update="@this" />
						<f:param name="disableMsgAutoUpdate" value="true" />
					</p:inputText>
				</td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.purMthd']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="purchaseMethodId" label="#{lbl['lbl.sm.machine.purMthd']}"  rendered="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine != null}"
					value="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.purchaseMethod}" required="#{!empty param['disableMsgAutoUpdate']}">
						<f:selectItems value="#{svoSiteVisitBackingBean.getDropdownCodeValues(ParameterTypeConst.purchasingMethod)}" />
						<p:ajax event="change" update="txtPurchaseMethodRemark,lblPurchaseMethodRemark"></p:ajax>
					</p:selectOneMenu></td>
			</tr>
			
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.sitevist.remarks']}" />
					<p:outputLabel value="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.purchaseMethod eq 'O' ? '*' : ''}" 
					id="lblPurchaseMethodRemark" styleClass="mandatory" />
				</td>
				<td>
					<p:inputText maxlength="50" id="txtPurchaseMethodRemark" size="50" label="#{lbl['lbl.sm.sitevist.remarks']}" 
						value="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.purchaseMethodRemark}" 
						disabled="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.purchaseMethod ne 'O'}" 
						required="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.purchaseMethod eq 'O'}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.guarnName']}" /></td>
				<td><p:inputText maxlength="50" size="50" label="#{lbl['lbl.sm.machine.guarnName']}" value="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.guarantorName}" /></td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.purchase.year']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu label="#{lbl['lbl.sm.machine.purchase.year']}"  rendered="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine != null}"
					value="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.purchaseYear}" required="#{!empty param['disableMsgAutoUpdate']}">
					<f:selectItems value="#{svoSiteVisitBackingBean.getYearDropDown()}" />
				</p:selectOneMenu></td>
			</tr>
		</table>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}" update="addlMachineDtTbl" rendered="#{svoSiteVisitBackingBean.managedBean.selectedAdtMachine.newMachine}"
				action="#{svoSiteVisitBackingBean.addAdditionalMachineToList}" >
				<f:param name="disableMsgAutoUpdate" value="true" />
			</p:commandButton>
			
			<p:commandButton value="#{lbl['lbl.btn.save']}" update="addlMachineDtTbl" rendered="#{!svoSiteVisitBackingBean.managedBean.selectedAdtMachine.newMachine}"
				action="#{svoSiteVisitBackingBean.saveAdditionalMachine}" >
				<f:param name="disableMsgAutoUpdate" value="true" />
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
