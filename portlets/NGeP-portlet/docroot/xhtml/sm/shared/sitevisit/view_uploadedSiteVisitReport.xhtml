<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.rptpreview.by.category']}" toggleable="true">
		<p:dataTable emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" id="dtlTemplate"
		value="#{svoSiteVisitBackingBean.managedBean.smSvTask}" var="svTask">
			<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}">
				#{svoSiteVisitBackingBean.getParameterDesc(svTask.smSvTemplate.pmParameter)}
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.sitevist.report.uploadedfile']} - #{svTask.smSvTemplate.smAttachment}">
				<table>
					<ui:repeat var="attch" value="#{svTask.smSvTemplate.smAttachments}">
						<p:outputPanel rendered="#{attch.recordStatusFlg == svoSiteVisitBackingBean.getRecordStatusActive()}">
							<tr>
								<td><p:commandLink ajax="false" value="#{attch.fileName}">
										<p:fileDownload
											value="#{svoSiteVisitBackingBean.attachmentDownload(attch)}" />
									</p:commandLink></td>
							</tr>
						</p:outputPanel>
					</ui:repeat>
				</table>
			</p:column>
		</p:dataTable>
	</p:panel>
	
</ui:composition>
