<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.rptpreview.by.category']}" toggleable="true">
		<!-- #28775 -->
		<p:dataTable emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" id="dtlTemplate"
		value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate}" var="selectedTemplate">
			<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}">
				<ui:param name="lblCategoryDesc"
				value="lbl.sm.sitevisit.category.categorycode_#{selectedTemplate.pmParameter.parameterCode}" />
				#{lbl[lblCategoryDesc]}
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.sitevist.report.uploadedfile']}">
				<table>
					<ui:repeat var="attch" value="#{selectedTemplate.smAttachments}">
						<p:outputPanel rendered="#{attch.recordStatusFlg == svoSiteVisitBackingBean.getRecordStatusActive()}">
							<tr>
								<td><p:commandLink ajax="false" value="#{attch.fileName}">
										<p:fileDownload
											value="#{svoSiteVisitBackingBean.attachmentDownload(attch)}" />
									</p:commandLink></td>
							</tr>
						</p:outputPanel>
					</ui:repeat>
				</table>
			</p:column>
		</p:dataTable>
	</p:panel>
	<!-- 28775 -->
	<c:if test="#{!svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.siteVisitGroup}">
	<p:panel header="#{lbl['lbl.sm.rptpreview.actual.site.visit.date']}">
		<table class="customTbl">
				<tr>
					<td class="tdTitle">
						<p:outputLabel
							value="#{lbl['lbl.sm.rptpreview.actual.site.visit.date']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
						<p:calendar showOn="button" id="actualSvDate" required="#{!empty param['disableValidation']}"
							label="#{lbl['lbl.sm.rptpreview.actual.site.visit.date']}"
							maxdate="#{CommonConstants.CURRENT_DATE}" readonlyInput="true"
							value="#{svoSiteVisitBackingBean.managedBean.smSvTask.actualVisitDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							disabled="#{viewFlag}" />
					</td>

					<td class="tdTitle">
					</td>

					<td class="tdContent">
					</td>
				</tr>
		</table>
	</p:panel>
	</c:if>
	
</ui:composition>
