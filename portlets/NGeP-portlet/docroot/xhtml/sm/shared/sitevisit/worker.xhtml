<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.worker.employee']}" id="pnlSvWorkerId">
	<p:dataTable id="dtWorkerId" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvWorkers}" var="svWorker"
		selection="#{svoSiteVisitBackingBean.managedBean.selectedWorkers}" rowKey="#{svWorker}">
		<p:column selectionMode="multiple" style="width:2%" rendered="#{!viewFlag}" />
		<p:ajax event="rowSelectCheckbox" disabled="#{viewFlag}" />
			<p:column>
					<f:facet name="header">
						#{lbl['lbl.sm.worker.specialization']}
					</f:facet>
					<p:inputText id="workerSpecializationId" value="#{svWorker.expertise}" disabled="#{viewFlag}" />
			</p:column>

			<p:column>
				<f:facet name="header">
						#{lbl['lbl.sm.worker.name']}
					</f:facet>
				<p:inputText id="workerNameId" value="#{svWorker.name}" disabled="#{viewFlag}" />
			</p:column>

			<p:column>
				<f:facet name="header">
						#{lbl['lbl.sm.worker.icno']}
					</f:facet>
				<p:inputText id="identificationNoId" value="#{svWorker.identificationNo}" disabled="#{viewFlag}" />
			</p:column>
			<p:column>
				<f:facet name="header">
						#{lbl['lbl.sm.worker.experience']}
				</f:facet>
				<p:inputText id="workExpYearId" value="#{svWorker.workExpYear}" disabled="#{viewFlag}" />
			</p:column>
		</p:dataTable>
		
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}" immediate="true"
				action="#{svoSiteVisitBackingBean.addWorkshopWorker}" rendered="#{!viewFlag}"
				update="pnlSvWorkerId" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				action="#{svoSiteVisitBackingBean.removeWorkshopWorker}" rendered="#{!viewFlag}"
				update="pnlSvWorkerId" />
		</div>
	</p:panel>
</ui:composition>
