<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.sitevisit.printing.license.insurance']}">
		<p:dataTable var="printingLicenseIns"
			value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvLicenseInsurances}">
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sm.sitevisit.printing.license.insurance']}
				</f:facet>

				<h:outputText
					value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.licenseInsuranceParamMap[printingLicenseIns.pmParameter.parameterId].codeName}"></h:outputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sm.sitevisit.printing.closing.date']}
				</f:facet>
				<p:calendar id="closingDateCalId" disabled="#{viewFlag || printingLicenseIns.pmParameter.parameterCode == 'C'}"
						navigator="true"  label="Closing Date"
						value="#{printingLicenseIns.expDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
						readonlyInput="true" size="30" showOn="button" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">
				<p:inputText value="#{printingLicenseIns.pppmmNo}" disabled="#{viewFlag || printingLicenseIns.pmParameter.parameterCode != 'C'}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
