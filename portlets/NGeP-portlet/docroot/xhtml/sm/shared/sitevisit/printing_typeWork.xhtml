<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.sitevisit.printing.type.wrkdone.inprgrss']}">
		<p:dataTable id="dtPrintWorkId" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvPrintworks}" 
		var="pWork" selection="#{svoSiteVisitBackingBean.managedBean.selectedPrintWorks}" rowKey="#{pWork}" 
		emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:column selectionMode="multiple" style="width:2%" 
			rendered="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvPrintworks}" />
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sm.sitevisit.printing.type']}
				</f:facet>
				<p:inputText value="#{pWork.printType}" maxlength="100" id="txtPrintTypeId" disabled="#{viewFlag}"
				required="#{empty param['disabledValidation']}" label="#{lbl['lbl.sm.sitevisit.printing.type']}" />
			</p:column>
			
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sm.sitevisit.printing.uname']}
				</f:facet>
				<p:inputText value="#{pWork.clientName}" maxlength="100" id="txtUsernameId" disabled="#{viewFlag}" 
				required="#{empty param['disabledValidation']}" label="#{lbl['lbl.sm.sitevisit.printing.uname']}" />
			</p:column>
			
			<p:column>	
				<f:facet name="header">
					#{lbl['lbl.sm.sitevisit.printing.workval.rm']}
				</f:facet>
				<p:inputText value="#{pWork.printAmt}" maxlength="14" label="#{lbl['lbl.sm.sitevisit.printing.workval.rm']}"
					id="txtWorkValueId" disabled="#{viewFlag}" required="#{empty param['disabledValidation']}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />					
				</p:inputText>

			</p:column>
		</p:dataTable>
		
		<div align="right">
		<p:commandButton value="#{lbl['lbl.sm.button.add']}"  update="dtPrintWorkId" action="#{svoSiteVisitBackingBean.addPrintWork}" rendered="#{!viewFlag}"/>
		<p:commandButton value="#{lbl['lbl.sm.button.delete']}"  update="dtPrintWorkId"  rendered="#{!viewFlag}" 
		oncomplete="printingWorkDeletePopUp.show();"/>
		</div>
	</p:panel>
	
	<ac:confirmationPopup id="printingWorkDeletePopUpId"
		widget="printingWorkDeletePopUp"
		okAction="svoSiteVisitBackingBean.removePrintWork()"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update=":#{p:component('dtPrintWorkId')}"/>

</ui:composition>
