<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Printing Type/ Work Done/ In Progress">
		<p:dataTable id="dtPrintWorkId" value="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.smSvPrintworks}" 
		var="pWork" selection="#{svoSiteVisitBackingBean.managedBean.selectedPrintWorks}" rowKey="#{pWork}">
			<p:column selectionMode="multiple" style="width:2%" />
			<p:column>
				<f:facet name="header">
					Type
				</f:facet>
				<p:inputText value="#{pWork.printType}" id="txtPrintTypeId" disabled="#{viewFlag}" />
			</p:column>
			
			<p:column>
				<f:facet name="header">
					User Name
				</f:facet>
				<p:inputText value="#{pWork.clientName}" id="txtUsernameId" disabled="#{viewFlag}"/>
			</p:column>
			
			<p:column>	
				<f:facet name="header">
					Work Value(RM)
				</f:facet>
				<p:inputText value="#{pWork.printAmt}" id="txtWorkValueId" disabled="#{viewFlag}"/>
			</p:column>
		</p:dataTable>
		
		<div align="right">
		<p:commandButton value="Add"  update="dtPrintWorkId" action="#{svoSiteVisitBackingBean.addPrintWork}" rendered="#{!viewFlag}"/>
			<p:commandButton value="Delete"  update="dtPrintWorkId" action="#{svoSiteVisitBackingBean.removePrintWork}"  rendered="#{!viewFlag}" />
		</div>
	</p:panel>

</ui:composition>
