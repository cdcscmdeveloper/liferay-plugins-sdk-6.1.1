<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.manufacture.panHdr']}"
		id="manufacturingPanel">

		<p:dataTable
			value="#{svoSiteVisitBackingBean.managedBean.manufacturingDtlLs}"
			var="manufacturingDtl"
			selection="#{svoSiteVisitBackingBean.managedBean.selectedManufacturingList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			id="smManufacturingDtl" rowKey="#{manufacturingDtl}">

			<p:column selectionMode="multiple" style="width:2%"
				rendered="#{!viewFlag and not empty svoSiteVisitBackingBean.managedBean.manufacturingDtlLs}" />

			<p:column headerText="#{lbl['lbl.sm.manufacture.prdType']}">
				<h:outputText value="#{manufacturingDtl.goodsType}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.manufacture.brand']}">
				<h:outputText value="#{manufacturingDtl.brand}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sm.manufacture.prodCap']} / #{lbl['lbl.sm.manufacture.month']}">
				<h:outputText value="#{manufacturingDtl.productionCapacity}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.manufacture.mesUnit']}">
				<h:outputText value="#{manufacturingDtl.uom}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.action']}"
				rendered="#{!viewFlag}">
				<p:commandLink id="btnEditManufacturing"
					oncomplete="manufacturingDialog.show();"
					update=":#{p:component('manufacturingDlg')}"
					rendered="#{!viewFlag}"
					action="#{svoSiteVisitBackingBean.editMachine(manufacturingDtl)}"
					process="@this">
					<p:graphicImage value="/css/images/design/edit.png"
						title="#{lbl['lbl.sm.edit']}" />
				</p:commandLink>
			</p:column>

		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}"
				oncomplete="manufacturingDialog.show();"
				action="#{svoSiteVisitBackingBean.addAdditionalManufacturing}"
				rendered="#{!viewFlag}" update="smManufacturingDtl,manufacturingDlg">
			</p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				oncomplete="additionalManufacturingDeletePopUp.show();"
				rendered="#{!viewFlag}" update="smManufacturingDtl">
			</p:commandButton>
		</div>

	</p:panel>

	<p:dialog id="manufacturingDlg"
		header="#{lbl['lbl.sm.manufacture.diaHdr']}"
		widgetVar="manufacturingDialog" modal="true" width="500px"
		dynamic="true" closable="true">

		<p:messages id="manufacturingDialogMsg" showDetail="true"
			autoUpdate="#{!empty param['disableMsgAutoUpdateMac']}"
			closable="true" showSummary="false" />

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.prdType']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.manufacture.prdType']}"
						id="smManuDtlProdType" size="35" maxlength="50"
						required="#{!empty param['disableMsgAutoUpdateMac']}"
						value="#{svoSiteVisitBackingBean.managedBean.selectedManufacturer.goodsType}" />
					<p:message id="smManuDtlProdTypeMsg" for="smManuDtlProdType"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.brand']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.manufacture.brand']}"
						id="smManuDtlBrdType" size="35" maxlength="50"
						required="#{!empty param['disableMsgAutoUpdateMac']}"
						value="#{svoSiteVisitBackingBean.managedBean.selectedManufacturer.brand}" />
					<p:message id="smManuDtlBrdTypeMsg" for="smManuDtlBrdType"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.manufacture.prodCapMonth']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.manufacture.prodCap']}"
						id="smManuDtlProdCap" size="35" maxlength="6"
						required="#{!empty param['disableMsgAutoUpdateMac']}"
						value="#{svoSiteVisitBackingBean.managedBean.selectedManufacturer.productionCapacity}" />
					<p:message id="smManuDtlProdCapMsg" for="smManuDtlProdCap"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.mesUnit']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td valign="top"><p:inputText
						label="#{lbl['lbl.sm.manufacture.mesUnit']}" id="smManuDtlMesUnit"
						maxlength="20"
						required="#{!empty param['disableMsgAutoUpdateMac']}"
						value="#{svoSiteVisitBackingBean.managedBean.selectedManufacturer.uom}" />
					<p:message id="smManuDtlMesUnitMsg" for="smManuDtlMesUnit"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
		</table>

		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.save']}"
				update="smManufacturingDtl"
				action="#{svoSiteVisitBackingBean.saveSmManufacturingDtl}">
				<f:param name="disableMsgAutoUpdateMac" value="true" />
			</p:commandButton>

		</div>

	</p:dialog>

	<ac:confirmationPopup id="additionalManufacturingDeletePopUpId"
		widget="additionalManufacturingDeletePopUp"
		okAction="svoSiteVisitBackingBean.removeAdditionalManufacturingDtl()"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}"
		update=":#{p:component('smManufacturingDtl')}" />

</ui:composition>
