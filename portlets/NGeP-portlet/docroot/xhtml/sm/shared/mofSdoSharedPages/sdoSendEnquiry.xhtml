<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Enquiry Supporting Documents List"
		id="InqSuppDocPanel">

		<p:dataTable var="onTable" id="inqSdList"
			value="#{backingBean.managedBean.missinDocs}">
			<ac:paginator for="inqSdList" />

			<p:column headerText="Document Description">
				<h:outputText value="#{onTable.pmDocument.docName}"
					rendered="#{onTable.verifiedFlg != 1}" />
			</p:column>

			<p:column headerText="Doc Status">
				<h:outputText value="Missing / Invalid "
					rendered="#{onTable.verifiedFlg != 1}" />
			</p:column>

			<p:column headerText="Remarks To Supplier">
				<p:inputTextarea rendered="#{onTable.verifiedFlg != 1}"
					value="#{onTable.poRemarks}" />
			</p:column>

		</p:dataTable>

	</p:panel>
</ui:composition>
