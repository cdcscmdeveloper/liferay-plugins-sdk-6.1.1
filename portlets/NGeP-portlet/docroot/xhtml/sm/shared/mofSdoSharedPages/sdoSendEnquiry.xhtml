<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.enquiry.supporting.documents.list']}"
		id="InqSuppDocPanel">

		<p:dataTable var="onTable" id="inqSdList"
			value="#{backingBean.managedBean.missinDocs}">
			<ac:paginator for="inqSdList" />

			<p:column headerText="#{lbl['lbl.sm.enquiry.document.description']}" style="width : 60%">
				<p:outputLabel value="#{onTable.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.enquiry.document.status']}" style="width : 20%">
				<p:outputLabel value="#{lbl['lbl.sm.enquiry.document.status.missinginvalid']}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.enquiry.remarks.to.supplier']}" style="width : 20%">
				<p:inputTextarea value="#{onTable.poRemarks}" />
			</p:column>

		</p:dataTable>

	</p:panel>
</ui:composition>
