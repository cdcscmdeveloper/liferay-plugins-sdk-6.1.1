		<p:dataTable var="table"

			style="width:1000px !important; table-layout: fixed !important;"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:columnGroup type="header">
				<p:row>
					<p:column headerText="#{lbl['lbl.sm.mandatory.suppdoc']}"
						colspan="5"
						style="background-color:PeachPuff !important;text-align: center !important;color:black !important" />
				</p:row>
				<p:row>
					<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
						style="width : 3% !important;text-align: center !important;" />
					<p:column
						headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
						style="width : 70% !important;overflow: hidden !important;" />
					<p:column headerText="#{lbl['lbl.sm.remarks']}"
						style="width : 27% !important;overflow: hidden !important;" />
				</p:row>
			</p:columnGroup>
			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
				style="width : 3% !important;"
				rendered="#{table.pmDocument.mandatory}">
				<h:outputText value="#{sdoReviewBackingBean.mandatoryCounter}"
					style="float: left;white-space: normal;font-weight:bold;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}"

			<p:column headerText="#{lbl['lbl.sm.remarks']}"
				style="width : 27% !important;"
				rendered="#{table.pmDocument.mandatory}">
				<p:inputTextarea value="#{table.inquiryRemark}"
					style="float: left;white-space: normal;width:97% !important;" maxlength="2500"/>
			</p:column>
		</p:dataTable>
		<!-- datatable for mandatory support doc with no record to display(fix bug in primeface version) -->

			rendered="#{empty backingBean.managedBean.missinDocsMandatory}"

	<p:panel id="inquiryTextPanelId" header="#{lbl['lbl.sm.other.application.inquiry']}"
		rendered="#{backingBean.managedBean.poUser and backingBean.managedBean.poToSupplierInquiry ne null}">
		<h:outputText value="*" styleClass="mandatory" rendered="#{backingBean.managedBean.valueReqd}"/>&#160;
		<p:inputTextarea value="#{backingBean.managedBean.poToSupplierInquiry.inquiryText}" 
			label="#{lbl['lbl.sm.other.application.inquiry']}" id="inquiryTextId"
			maxlength="2000" cols="140" rows="10" required="#{backingBean.managedBean.valueReqd}"/>
		<p:message id="inquiryTextIdMsg" for="inquiryTextId" showSummary="true" showDetail="false" display="icon" />
	</p:panel>
