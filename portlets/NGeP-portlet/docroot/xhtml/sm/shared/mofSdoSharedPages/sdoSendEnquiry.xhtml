<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:messages id="poInquiryMsg" showSummary="false"
				showDetail="true" autoUpdate="true" closable="true" />

	<p:panel header="#{lbl['lbl.sm.enquiry.supporting.documents.list']}"
		id="InqSuppDocPanel">

		<p:dataTable var="onTable" id="inqSdList" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{backingBean.managedBean.missinDocs}">
			<ac:paginator for="inqSdList" />

			<p:column headerText="#{lbl['lbl.sm.enquiry.document.description']}"
				style="width : 60%">
				<p:outputLabel value="#{onTable.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.enquiry.document.status']}"
				style="width : 20%">
				<p:outputLabel
					value="#{lbl['lbl.sm.enquiry.document.status.missinginvalid']}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.enquiry.remarks.to.supplier']}"
				style="width : 20%">
				<p:inputTextarea value="#{onTable.poRemarks}" maxlength="100" />
			</p:column>

		</p:dataTable>

	</p:panel>
	
	<p:panel id="inquiryTextPanelId" header="#{lbl['lbl.sm.other.application.inquiry']}"
		rendered="#{backingBean.managedBean.poUser and backingBean.managedBean.poToSupplierInquiry ne null}">
		<h:outputText value="*" styleClass="mandatory" rendered="#{backingBean.managedBean.valueReqd}"/>&#160;
		<p:inputTextarea value="#{backingBean.managedBean.poToSupplierInquiry.inquiryText}" 
			label="#{lbl['lbl.sm.other.application.inquiry']}" id="inquiryTextId"
			maxlength="2000" cols="140" rows="10" required="#{backingBean.managedBean.valueReqd}"/>
		<p:message id="inquiryTextIdMsg" for="inquiryTextId" showSummary="true" showDetail="false" display="icon" />
	</p:panel>
	
</ui:composition>
