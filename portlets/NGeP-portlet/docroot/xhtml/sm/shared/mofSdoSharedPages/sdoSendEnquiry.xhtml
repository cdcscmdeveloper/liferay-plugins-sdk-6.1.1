<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Enquiry Check List">
		<p:dataTable var="table"
			value="#{mofRegistrationBackingBean.dataList}">
			<p:column headerText="No.">  
                   #{table.no}  
      		    </p:column>

			<p:column headerText="Document Name">  
		            #{table.documentName} 
		        </p:column>
			<p:column headerText="Document Description">  
		            #{table.documentdescription} 
		        </p:column>

			<p:column headerText="Missing / Incomplete">
				<p:panelGrid columns="1" styleClass="noBorders tr,noBorders td">
					<p:selectBooleanCheckbox value="#{table.documentValid}">
						<p:ajax
							listener="#{mofRegistrationBackingBean.sendEnquiry(table)}"
							update="panelId" />
					</p:selectBooleanCheckbox>
				</p:panelGrid>
			</p:column>

			<p:column headerText="Remarks By SDO">
				<p:panelGrid id="panelId" columns="1"
					styleClass="noBorders tr,noBorders td">
					<p:inputText rendered="#{table.documentValid}"
						value="#{table.remarks}" />
				</p:panelGrid>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
