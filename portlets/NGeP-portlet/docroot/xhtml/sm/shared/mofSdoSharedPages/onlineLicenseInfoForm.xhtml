<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel rendered="#{not empty backingBean.managedBean.mandatoryLicenseDocs}" id="onlineLicenseOutPanelId">
		<div class="ui-datatable ui-widget"
			style="width: 100% !important; table-layout: fixed !important;">
			<div class="ui-datatable-tablewrapper">
				<table role="grid">
					<thead>
						<tr>
							<th class="ui-state-default" role="columnheader"
								style="text-align: center !important;"><span><h:outputText
										value="#{lbl['lbl.sm.license.cert.info']}" /></span></th>
						</tr>
					</thead>
				</table>
			</div>
		</div>
	
		<ui:repeat var="mainTable"
			value="#{backingBean.managedBean.mandatoryLicenseDocs}"
			varStatus="mainTableStatus">
			<p:dataTable var="onlineLicenseTable" id="onlineLicenseTableId"
				value="#{mainTable.licenseSuppDocs}" rowIndexVar="index"
				style="width:100% !important; table-layout: fixed !important;">
	
				<p:columnGroup type="header">
					<p:row>						
						<p:column colspan="5"
							style="background-color:lightblue !important;text-align: left !important;color:black !important">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sm.category']} : "/>
								<!-- 34239 -->
								<h:outputText value="#{mainTable.categoryDesc}"
									style="word-wrap:break-word !important; white-space:normal !important;"/>
							</f:facet>
						</p:column>
					</p:row>
				</p:columnGroup>
	
				<p:column
					style="width : 5% !important;text-align: center !important;">
					<h:outputText value="#{mainTable.count}" />
				</p:column>
	
				<p:column style="width : 65% !important;">
	
					<h:outputText value="#{onlineLicenseTable.pmDocument.docName}"
						style="float: left;white-space: normal;" />
					
					<br />
					
					<table style="width: 50%;table-layout:fixed">
						<tr>
							<td style="border-style: none !important;"><h:outputText
									value="#{lbl['lbl.sm.suppdoc.license.no']}" /></td>
							<td style="border-style: none !important;width: 10% !important;">:</td>
							<td style="border-style: none !important;">
								<h:outputText value="#{onlineLicenseTable.licenseNo}" rendered="#{not empty onlineLicenseTable.licenseNo}"/>
								<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty onlineLicenseTable.licenseNo}"/>
							</td>
						</tr>
						<tr>
							<td style="border-style: none !important;"><h:outputText
									value="#{lbl['lbl.sm.suppdoc.license.effdate']}" /></td>
							<td style="border-style: none !important;">:</td>
							<td style="border-style: none !important;">
								<h:outputText value="#{onlineLicenseTable.licenseEffDate}" rendered="#{not empty onlineLicenseTable.licenseEffDate}">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</h:outputText>
								<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty onlineLicenseTable.licenseEffDate}"/>
							</td>
						</tr>
						<tr>
							<td style="border-style: none !important;"><h:outputText
									value="#{lbl['lbl.sm.suppdoc.license.expdate']}" /></td>
							<td style="border-style: none !important;">:</td>
							<td style="border-style: none !important;">
								<h:outputText value="#{onlineLicenseTable.licenseExpDate}" rendered="#{not empty onlineLicenseTable.licenseExpDate}">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</h:outputText>
								<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty onlineLicenseTable.licenseExpDate}"/>
							</td>
						</tr>
					</table>
	
				</p:column>
				<!--#33240-START-->
				<p:column style="width : 10%;overflow: hidden !important;">
					<ui:repeat var="applDocsFile" value="#{onlineLicenseTable.smApplDocFiles}">
						<p:outputLabel rendered="#{onlineLicenseTable.pmDocument.hardCopyReq}"
						value="#{lbl['lbl.sm.suppDoc.document.hdrCpySent']}"
						style="float: left;white-space: normal;" />
						<ui:remove>
						<p:commandLink value="#{applDocsFile.fileName}" rendered="#{not empty onlineLicenseTable.smApplDocFiles}"  ajax="false"
							            		action="#{backingBean.downloadSuppDoc(applDocsFile.fileName,applDocsFile.filePath)}">
						<p:fileDownload value="#{backingBean.file}"/>
						</p:commandLink>
						</ui:remove>
						<h:panelGroup rendered="#{not empty onlineLicenseTable.smApplDocFiles}">
							<!-- #39316 - Start -->
							<h:commandLink id="file" value="#{backingBean.getShortFileName(applDocsFile.fileName)}"
								rendered="#{not empty applDocsFile and !onlineLicenseTable.pmDocument.hardCopyReq}">
								<p:fileDownload value="#{backingBean.commonDownload(applDocsFile.filePath,applDocsFile.fileName,applDocsFile.fileName)}" />
							</h:commandLink>
							<!-- #39316 - End -->
						</h:panelGroup>
						<br />
					</ui:repeat>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{!onlineLicenseTable.pmDocument.hardCopyReq and 
						(empty onlineLicenseTable.smApplDocFiles[0].fileName or onlineLicenseTable.smApplDocFiles[0].fileName eq ' ')}"/>
				</p:column>
				<!--#33240-END-->
				<p:column style="width : 20%;">
					<p:selectOneRadio value="#{onlineLicenseTable.verifiedFlg}"
						id="onlineLicenseSuppDocVerify"
						label="#{onlineLicenseTable.pmDocument.docName} - #{lbl['lbl.sm.suppDoc.document.dwldVld']}"
						layout="pageDirection">
						<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.document.valid']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.document.invalid']}"
							itemValue="0" />
						<p:ajax event="change" partialSubmit="true" process="@this"
							update=":form" listener="#{backingBean.assignDocVerified}"></p:ajax>
					</p:selectOneRadio>
					<p:message id="onlineLicenseSuppDocVerifyMsg" for="onlineLicenseSuppDocVerify"
						showSummary="true" showDetail="false" display="icon" />
				</p:column>
			</p:dataTable>
		</ui:repeat>
	</p:outputPanel>

</ui:composition>
