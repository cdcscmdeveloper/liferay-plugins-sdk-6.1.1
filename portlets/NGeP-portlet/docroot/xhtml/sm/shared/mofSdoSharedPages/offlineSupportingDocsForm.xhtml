<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel
		header="Offline Supporting Documents List For Application No. - #{backingBean.managedBean.smAppl.applNo} ">


		<p:dataTable var="table"
			value="#{mofRegistrationBackingBean.dataList}">

			<p:column headerText="Document Name">  
		            #{table.documentName} 
		        </p:column>
			<p:column headerText="Document Description">  
		            #{table.documentdescription} 
		        </p:column>
			<p:column headerText="Is Sent By Supplier?">
					#{table.isSentBySupplier}
				</p:column>
			<p:column headerText="Is Valid?">
				<p:selectBooleanCheckbox value="#{table.docSent}" />
			</p:column>


		</p:dataTable>
		<br />



	</p:panel>
</ui:composition>
