<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel
		header="Offline Supporting Documents List For Application No. - #{backingBean.managedBean.smAppl.applNo} ">


		<p:dataTable var="offTable" id="revOffSdList"
			value="#{backingBean.managedBean.smAppl.smApplSupportDocs}">
			<ac:paginator for="revOffSdList" />

			<p:column headerText="Document Description" style="width :80%;">
				<p:outputLabel value="#{offTable.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="Document Valid?" style="width : 20%;">
				<p:selectOneRadio value="#{offTable.verifiedFlg}"
					layout="pageDirection">
					<f:selectItem itemLabel="Valid" itemValue="1" />
					<f:selectItem itemLabel="In-Valid" itemValue="0" />
				</p:selectOneRadio>
			</p:column>
		</p:dataTable>
		<br />



	</p:panel>
</ui:composition>
