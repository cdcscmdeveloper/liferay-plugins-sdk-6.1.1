<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel
		header="#{lbl['lbl.sm.suppDoc.document.offLnHdrLst']} - #{backingBean.managedBean.smAppl.applNo} ">


		<p:dataTable var="offTable" id="revOffSdList"
			value="#{backingBean.managedBean.smAppl.smApplSupportDocs}">
			<ac:paginator for="revOffSdList" />

			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
				style="width :80%;">
				<p:outputLabel value="#{offTable.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.dwldVld']}"
				style="width : 20%;">
				<p:selectOneRadio value="#{offTable.verifiedFlg}" required="true"
					label="#{offTable.pmDocument.docName} - #{lbl['lbl.sm.suppDoc.document.dwldVld']}"
					layout="pageDirection" id="offln">
					<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.document.valid']}"
						itemValue="1" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.document.invalid']}"
						itemValue="0" />
				</p:selectOneRadio>
				<p:message id="offlnMsg" for="offln" showSummary="true"
					showDetail="false" display="icon" />
			</p:column>
		</p:dataTable>
		<br />



	</p:panel>
</ui:composition>
