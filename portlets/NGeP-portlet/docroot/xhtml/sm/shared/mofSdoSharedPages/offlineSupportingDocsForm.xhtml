<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel
		header="Offline Supporting Documents List For Application No. - #{backingBean.managedBean.smAppl.applNo} ">


		<p:dataTable var="offTable" id="revOffSdList"
			value="#{backingBean.managedBean.smAppl.smApplSupportDocs}">
			<ac:paginator for="revOffSdList" />

			<p:column headerText="Document Description">
				<h:outputText value="#{offTable.pmDocument.docName}" />
			</p:column>

			<p:column headerText="Document Valid?">
				<p:selectBooleanCheckbox value="#{offTable.verified}" />
			</p:column>
		</p:dataTable>
		<br />



	</p:panel>
</ui:composition>
