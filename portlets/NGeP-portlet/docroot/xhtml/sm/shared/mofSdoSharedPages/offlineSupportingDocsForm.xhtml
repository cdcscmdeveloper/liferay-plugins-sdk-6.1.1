<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel>
		
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sm.suppDoc.document.offLnHdrLst']}" escape="false"/>
			&#160;
			<h:outputText value="#{backingBean.managedBean.smAppl.applNo}" />
		</f:facet>
		
		<ac:smPoApproverOfflineSuppDoc tableId="offlineMandatoryTableId"
			smApplSupportDocs="#{backingBean.managedBean.mandatoryDocs}" mandatory="true" />
		<ui:include src="offlineLicenseInfoForm.xhtml" />
		<ac:smPoApproverOfflineSuppDoc tableId="offlineNonMandatoryTableId"
			smApplSupportDocs="#{backingBean.managedBean.nonMandatoryDocs}" mandatory="false" />
			
		<!-- #3460 - Start -->
		<br/>
		<table>
					<tr>
						<td><p:outputLabel valign="top" value="#{lbl['lbl.sm.supportingdoc.supp.application.sdo.remarks']}" /></td>
						<td><p:inputTextarea align="right" id="sdoRemarks" rows="10" cols="10" autoResize="false" maxlength="4000" style="width: 300px;"
						value="#{backingBean.managedBean.sdoRemark}"  readonly = "true"/></td>
					</tr>
				</table>
		<!-- #3460 - End -->		

	</p:panel>
</ui:composition>
