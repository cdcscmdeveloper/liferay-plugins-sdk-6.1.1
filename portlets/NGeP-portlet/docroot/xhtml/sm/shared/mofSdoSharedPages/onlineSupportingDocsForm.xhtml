<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Online Supporting Documents List">

		<p:dataTable var="table"
			value="#{mofRegistrationBackingBean.dataList}">

			<p:column headerText="Document Name">  
		            #{table.documentName} 
		        </p:column>
			<p:column headerText="Document Description">  
		            #{table.documentdescription} 
		        </p:column>
			<p:column headerText="View/Download Document">
				<!-- #{table.isSentBySupplier} -->
				<p:commandButton value="Download" icon="ui-icon-arrowthichk-s"></p:commandButton>
			</p:column>
			<p:column headerText="Is Document Valid?">
				<p:selectBooleanCheckbox value="#{table.documentValid}" />
			</p:column>

		</p:dataTable>


	</p:panel>
</ui:composition>
