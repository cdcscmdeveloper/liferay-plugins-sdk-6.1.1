<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Online Supporting Documents List">

		<p:dataTable var="onTable" id="revOnSdList"
			value="#{backingBean.managedBean.smAppl.smApplSupportDocs}">
			<ac:paginator for="revOnSdList" />

			<p:column headerText="Document Description" style="width : 70%;">
				<p:outputLabel value="#{onTable.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="Download Document " style="width : 10%;">
				<p:commandLink value="#{onTable.smApplDocFiles[0].fileName}" />
			</p:column>

			<p:column headerText="Document Valid?" style="width : 20%;">
				<p:selectOneRadio value="#{onTable.verifiedFlg}"
					layout="pageDirection">
					<f:selectItem itemLabel="Valid" itemValue="1" />
					<f:selectItem itemLabel="In-Valid" itemValue="0" />
				</p:selectOneRadio>
			</p:column>
		</p:dataTable>

	</p:panel>
</ui:composition>
