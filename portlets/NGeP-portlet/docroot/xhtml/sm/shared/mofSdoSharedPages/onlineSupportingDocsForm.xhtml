<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel
		header="#{lbl['lbl.sm.suppDoc.document.onLnHdrLst']} - #{backingBean.managedBean.smAppl.applNo}">

		<p:dataTable var="onTable" id="revOnSdList"
			value="#{backingBean.managedBean.smAppl.smApplSupportDocs}"
			rowIndexVar="index">
			<ac:paginator for="revOnSdList" />

			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
				style="width : 5%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
				style="width : 65%;">
				<h:outputText value="#{onTable.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.cm.download']}" style="width : 10%;">
				<p:outputLabel rendered="#{onTable.pmDocument.hardCopyReq}"
					value="#{lbl['lbl.sm.suppDoc.document.hdrCpySent']}"
					style="float: left;white-space: normal;" />
				<p:commandButton value="#{lbl['lbl.cm.download']}"
					rendered="#{!onTable.pmDocument.hardCopyReq and not empty onTable.smApplDocFiles and not empty onTable.smApplDocFiles[0].filePath}"
					action="#{backingBean.downloadSelectedSuppDoc(onTable.smApplDocFiles[0].fileName,onTable.smApplDocFiles[0].filePath)}"
					update=":form" ajax="false">
					<p:fileDownload value="#{backingBean.file}" />
				</p:commandButton>
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.dwldVld']}"
				style="width : 20%;">
				<p:selectOneRadio value="#{onTable.verifiedFlg}"
					id="onlSuppDocVerify"
					label="#{onTable.pmDocument.docName} - #{lbl['lbl.sm.suppDoc.document.dwldVld']}"
					layout="pageDirection">
					<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.document.valid']}"
						itemValue="1" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.document.invalid']}"
						itemValue="0" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update=":form" listener="#{backingBean.assignDocVerified}"></p:ajax>
				</p:selectOneRadio>
				<p:message id="onlSuppDocVerifyMsg" for="onlSuppDocVerify"
					showSummary="true" showDetail="false" display="icon" />
			</p:column>
		</p:dataTable>

	</p:panel>
</ui:composition>
