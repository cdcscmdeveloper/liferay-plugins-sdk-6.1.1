<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel>
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sm.suppDoc.document.onLnHdrLst']}" escape="false"/>
			&#160;
			<h:outputText value="#{backingBean.managedBean.smAppl.applNo}" />
		</f:facet>
		
		<ac:smPoApproverOnlineSuppDoc tableId="mandatoryTableId"
			smApplSupportDocs="#{backingBean.managedBean.mandatoryDocs}" mandatory="true" />
		<ac:smPoApproverOnlineSuppDoc tableId="nonMandatoryTableId"
			smApplSupportDocs="#{backingBean.managedBean.nonMandatoryDocs}" mandatory="false" />
	</p:panel>
</ui:composition>
