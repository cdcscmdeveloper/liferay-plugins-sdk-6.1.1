<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sm.busNtw.panHdr']}" />
			<p:graphicImage id="trxNtwTipImg" value="/css/images/design/tooltips.png"
				 style="padding-left : 10px;" />
			<p:tooltip id="trxNtwTipImgtt" for="trxNtwTipImg">
				<table>
					<tr>
						<td width="300px">
							<h:outputText value="#{lbl['lbl.sm.busNtw.panHdrToolTip']}" escape="false" />
						</td>
					</tr>
				</table>
			</p:tooltip>
		</f:facet>
		<p:outputPanel id="trxInfPan">

			<table style="width: 100%">

				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.withFederal}"
							disabled="true" /></td>
					<td valign="middle" width="150px;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.fdrGov']}" />
						<ac:smCheckBoxChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.withFederal}" 
								currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.withFederal}" />
					</td>

					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.withState}" disabled="true" /></td>
					<td valign="middle" width="150px;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.stateGov']}" />
						<ac:smCheckBoxChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.withState}" 
								currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.withState}" />
					</td>

					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.withStatutory}" disabled="true" /></td>
					<td valign="middle" width="150px;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.statBody']}" />
						<ac:smCheckBoxChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.withStatutory}" 
								currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.withStatutory}" />
					</td>

					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.withGlc}" disabled="true" /></td>
					<td valign="middle" width="160px;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.glc']}" />
						<ac:smCheckBoxChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.withGlc}" 
								currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.withGlc}" />
					</td>

					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.withOthers}" disabled="true" /></td>
					<td valign="middle" width="160px;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.others']}" />
						<ac:smCheckBoxChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.withOthers}" 
								currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.withOthers}" />
					</td>
				</tr>
			</table>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser or (backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser)}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="trxNtmSecPoRmrk" readonly="#{backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser}"
								validatorMessage="#{lbl['lbl.sm.busNtw.panHdr']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.trnsNetworkRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="trxNtmSecPoRmrkMsg" for="trxNtmSecPoRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.trnsNetworkRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="trxNtwSecAprvrRmrk"
								validatorMessage="#{lbl['lbl.sm.busNtw.panHdr']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.trnsNetworkRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="trxNtwSecAprvrRmrkMsg" for="trxNtwSecAprvrRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
</ui:composition>
