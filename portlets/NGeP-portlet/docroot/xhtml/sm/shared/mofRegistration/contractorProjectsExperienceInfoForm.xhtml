<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Company Experience Project" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:dataTable var="contrBean"
			value="#{backingBean.managedBean.smAppl.smContractExperiences}"
			selection="#{backingBean.managedBean.selectedContractProjs}"
			rowKey="#{contrBean.contractExperienceId}" rowIndexVar="index"
			id="contDt">
			<ac:paginator for="contDt" />
			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<h:outputText value="#{index+1}" />
			</p:column>

			<p:column headerText="Project Title">
				<h:outputText value="#{contrBean.title}" />
			</p:column>

			<p:column headerText="Contract Value">
				<h:outputText value="#{contrBean.contractValue}" />
			</p:column>

			<p:column headerText="Procurement Date">
				<h:outputText value="#{contrBean.procureDate}">
					<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
				</h:outputText>
			</p:column>

			<p:column headerText="Result / Progress">
				<h:outputText value="In Progress"
					rendered="#{contrBean.endResult eq '1'}" />
				<h:outputText value="Complete"
					rendered="#{contrBean.endResult eq '2'}" />
				<h:outputText value="Fail" rendered="#{contrBean.endResult eq '3'}" />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink
					action="#{backingBean.assignSelContractProj(contrBean)}"
					oncomplete="contDialog.show();" update=":form:tt:contDialog">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="Add "
				action="#{backingBean.assignNewContractProj}"
				oncomplete="contDialog.show();" update=":form:tt:contDialog" />
			<p:commandButton value="Delete " />

		</div>
		<br />
		<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
			<table style="width: 50%">
				<tr>
					<td style="padding-left: 38px;"><p:outputLabel
							value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" cols="41" /></td>
				</tr>
			</table>
		</p:outputPanel>
		<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
			<table style="width: 100%">
				<tr>
					<td style="padding-left: 38px;"><p:outputLabel
							value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" readonly="true"
							disabled="true" cols="41" /></td>
					<td style="padding-left: 22px;"><p:outputLabel
							value="Approver Remarks" /></td>
					<td><p:inputTextarea autoResize="true" cols="41" /></td>

				</tr>
			</table>
		</p:outputPanel>
	</p:panel>
	<p:dialog header="Project Details - For Contractor"
		widgetVar="contDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="contDialog" width="500px">
		<table style="width: 100%">
			<tr>
				<td valign="top">

					<table style="width: 100%">
						<tr>
							<td><p:outputLabel value="* Title" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedContractProj.title}"
									size="35" /></td>
						</tr>

						<tr>
							<td><p:outputLabel value="* Contract Value" /></td>

							<td><table>
									<tr>
										<td style="padding-right: 5px;"><p:inputText
												value="#{backingBean.managedBean.selectedContractProj.contractValue}"
												size="20" /></td>
										<td valign="top"><p:selectOneMenu
												style="margin-bottom : 5px;">
												<f:selectItem itemLabel="MYR" itemValue="1"></f:selectItem>
											</p:selectOneMenu></td>
									</tr>
								</table></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Procurement Mode" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.selectedContractProj.procureMode}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select One--" itemValue="1" />
									<f:selectItem itemLabel="Tender" itemValue="T" />
									<f:selectItem itemLabel="eBidding" itemValue="E" />
									<f:selectItem itemLabel="SebutHarga" itemValue="S" />
								</p:selectOneMenu></td>
						</tr>

						<tr>
							<td><p:outputLabel value="* Ministry/Statutory Body/Private" /></td>
							<td><p:inputTextarea
									value="#{backingBean.managedBean.selectedContractProj.orgName}"
									cols="36" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Project Status" /></td>
							<td><p:selectOneRadio
									value="#{backingBean.managedBean.selectedContractProj.endResult}">
									<f:selectItem itemLabel="In Progress" itemValue="1" />
									<f:selectItem itemLabel="Complete" itemValue="2" />
									<f:selectItem itemLabel="Fail" itemValue="3" />
								</p:selectOneRadio></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Procurement Date" /></td>
							<td><p:calendar showOn="button"
									value="#{backingBean.managedBean.selectedContractProj.procureDate}" /></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
		<br />

		<div align="right">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdateContractProjsToSmAppl}"
				oncomplete="contDialog.hide();" update=":form:tt:contDt" />
			<p:commandButton value="Cancel" onclick="contDialog.hide();" />
		</div>

	</p:dialog>
</ui:composition>
