<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.projDtls.panHdr']}" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.experienceVerified}"
							id="poContrVer">
							<p:ajax update=":form:tt:contrInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.experienceVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.experienceVerified}"
							id="apprContrVer">
							<p:ajax update=":form:tt:contrInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.experienceVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="contrInfPan">
			<p:blockUI block=":form:tt:contrInfPan" widgetVar="buiPoContr"
				id="poContrBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.experienceVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.experienceVerified : false)}" />
			<p:dataTable var="contrBean" widgetVar="suppContrExpDtWidVar"
				value="#{backingBean.managedBean.smAppl.smCompanyExperiences}"
				selection="#{backingBean.managedBean.selectedCompanyExperiences}"
				rowKey="#{contrBean}" rowIndexVar="index" id="contDt">
				<ac:paginator for="contDt" />
				<p:column selectionMode="multiple" width="5%" />

				<p:column headerText="#{lbl['lbl.sm.projDtls.projTitle']}">
					<h:outputText value="#{contrBean.title}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.contrVal']}">
					<h:outputText value="#{contrBean.contractValue}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.procDate']}">
					<h:outputText value="#{contrBean.procurementDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.workProgress']}">
					<h:outputText value="#{lbl['lbl.sm.projDtls.inProgress']} "
						rendered="#{contrBean.progressStatus eq 'P'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.success']}"
						rendered="#{contrBean.progressStatus eq 'S'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.fail']}"
						rendered="#{contrBean.progressStatus eq 'F'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink partialSubmit="true" process="@this"
						action="#{backingBean.assignSelCompanyExperience(contrBean)}"
						update=":form:tt:contDialog">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					action="#{backingBean.assignNewCompanyExperience}"
					partialSubmit="true" process="@this" update=":form:tt:contDialog" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']} "
					partialSubmit="true" process="contrInfPan"
					action="#{backingBean.deleteSelectedCompanyExperiences}"
					update=":form:tt:contDt" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.experienceRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.experienceRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.experienceRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog header="#{lbl['lbl.sm.projDtls.projDiaHdr']}"
		widgetVar="contDialog" resizable="false" showEffect="fade"
		closable="false" hideEffect="fade" modal="true" id="contDialog"
		width="520px" height="500px">
		<p:messages id="contractPrjMsg" showSummary="true" showDetail="false"
			autoUpdate="true" closable="true" />
		<table style="width: 100%">
			<tr>
				<td valign="top">

					<table style="width: 100%">
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.projTitle']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:inputText maxlength="100"
									required="#{backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.projDtls.projTitle']}" id="supCntrPrjTtl"
									value="#{backingBean.managedBean.selectedCompanyExperience.title}"
									size="35" /> <p:message id="supCntrPrjTtlMsg"
									for="supCntrPrjTtl" showSummary="true" showDetail="false"
									display="icon" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.contrVal']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>

							<td><p:inputText label="#{lbl['lbl.sm.projDtls.contrVal']}"
									id="contractorContractVal"
									required="#{backingBean.managedBean.valueReqd}"
									value="#{backingBean.managedBean.selectedCompanyExperience.contractValue}"
									size="35">
									<f:convertNumber
										pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								</p:inputText> <p:message id="contractorContractValMsg"
									for="contractorContractVal" showSummary="true"
									showDetail="false" display="icon" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.procMode']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:selectOneMenu
									required="#{backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.projDtls.procMode']}" id="supCntrPrcMod"
									value="#{backingBean.managedBean.selectedCompanyExperience.procurementModeId}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItems value="#{backingBean.getDropdownValues('PM')}" />
								</p:selectOneMenu> <p:message id="supCntrPrcModMsg" for="supCntrPrcMod"
									showSummary="true" showDetail="false" display="icon" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value=" #{lbl['lbl.sm.projDtls.doneFor']}" /></td>
							<td><p:selectOneRadio
									value="#{backingBean.managedBean.selectedCompanyExperience.clientType}">
									<f:selectItem itemLabel="Federal Govt" itemValue="F" />
									<f:selectItem itemLabel="Others" itemValue="O" />
								</p:selectOneRadio></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.statBody']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:inputTextarea maxlength="100"
									required="#{backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.projDtls.statBody']}" id="supCntrStuBdy"
									value="#{backingBean.managedBean.selectedCompanyExperience.clientName}"
									cols="36" /> <p:message id="supCntrStuBdyMsg"
									for="supCntrStuBdy" showSummary="true" showDetail="false"
									display="icon" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.workProgress']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:selectOneRadio
									required="#{backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.projDtls.workProgress']}"
									id="supCntrPrgSts"
									value="#{backingBean.managedBean.selectedCompanyExperience.progressStatus}">
									<f:selectItem itemLabel="In Progress" itemValue="P" />
									<f:selectItem itemLabel="Success" itemValue="S" />
									<f:selectItem itemLabel="Fail" itemValue="F" />
								</p:selectOneRadio> <p:message id="supCntrPrgStsMsg" for="supCntrPrgSts"
									showSummary="true" showDetail="false" display="icon" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.procDate']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:calendar showOn="button" navigator="true"
									display="inline" readonlyInput="true"
									required="#{backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.projDtls.procDate']}" id="supCntrPrcDate"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									yearRange="-99:+0"
									value="#{backingBean.managedBean.selectedCompanyExperience.procurementDate}" />
								<p:message id="supCntrPrcDateMsg" for="supCntrPrcDate"
									showSummary="true" showDetail="false" display="icon" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="
										#{lbl['lbl.sm.projDtls.mainCat']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:selectOneMenu
									required="#{backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.projDtls.mainCat']}"
									id="supCntrMainCatCode"
									value="#{backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL1.categoryL1Id}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select  -- " itemValue="" />
									<f:selectItems
										value="#{backingBean.managedBean.supplierParentCatList}"
										var="parent" itemLabel="#{parent.categoryName}"
										itemValue="#{parent.categoryL1Id}" />
									<p:ajax event="change"
										listener="#{backingBean.populateChildCategoryByParent(backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL1.categoryL1Id,
								backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL2,
								backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL3)}"
										update="contrChild,contrSubChild" />
								</p:selectOneMenu> <p:message id="supCntrMainCatCodeMsg" for="supCntrMainCatCode"
									showSummary="true" showDetail="false" display="icon" /></td>


						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.subCat']}" />
								<p:outputLabel value="*" styleClass="mandatory" /></td>
							<td><p:selectOneMenu
									required="#{backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.projDtls.subCat']}"
									value="#{backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL2.categoryL2Id}"
									id="contrChild" style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel=" -- Select  -- " itemValue="" />
									<f:selectItems
										value="#{backingBean.managedBean.supplierChildCatList}"
										var="contrChild" itemLabel="#{contrChild.categoryName}"
										itemValue="#{contrChild.categoryL2Id}" />
									<p:ajax event="change"
										listener="#{backingBean.populateSubChildCategoryByChild(backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL2.categoryL2Id,backingBean.managedBean.selectedCategory.pmCategoryL3)}"
										update="contrSubChild" />
								</p:selectOneMenu> <p:message id="contrChildMsg" for="contrChild"
									showSummary="true" showDetail="false" display="icon" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.subCatDiv']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:selectOneMenu
									required="#{backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.projDtls.subCatDiv']}"
									value="#{backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL3.categoryL3Id}"
									id="contrSubChild" style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel=" -- Select  --  " itemValue="" />
									<f:selectItems
										value="#{backingBean.managedBean.supplierSubChildCatList}"
										var="contrSubChild" itemLabel="#{contrSubChild.categoryName}"
										itemValue="#{contrSubChild.categoryL3Id}" />
								</p:selectOneMenu> <p:message id="contrSubChildMsg" for="contrSubChild"
									showSummary="true" showDetail="false" display="icon" /></td>
						</tr>


					</table>
				</td>
			</tr>
		</table>
		<br />

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				id="contractProjPopUpSaveBtn"
				action="#{backingBean.addOrUpdateCompanyExperienceToSmAppl}"
				update=":form:tt:contDt, @([id$=Msg])" partialSubmit="true"
				process="contDialog" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				partialSubmit="true" process="@this"
				action="#{backingBean.cancelCompExpFunctions}">
			</p:commandButton>
		</div>

	</p:dialog>
</ui:composition>
