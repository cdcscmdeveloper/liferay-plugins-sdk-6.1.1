<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.factory.details']}" toggleable="true"
		id="smFacilityFactoryDtPanel" rendered="#{backingBean.managedBean.showFactoryPanel}">
		<p:outputPanel rendered="#{backingBean.managedBean.showFactoryPanel}">
			<p:dataTable var="fac" widgetVar="smFacilityFactorDtWidVar"
				value="#{backingBean.managedBean.applFactoryFacilities}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				selection="#{backingBean.managedBean.selectedFactoryFacilities}"
				rowKey="#{fac}" rowIndexVar="index" id="facDt">
				<ac:paginator for="facDt" />
				<p:column selectionMode="multiple" width="1%" rendered="#{not empty backingBean.managedBean.applFactoryFacilities}"/>

				<p:column headerText="#{lbl['lbl.sm.facility.factory.name']}">
					<h:outputText value="#{fac.facilityName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.factory.address']}"
					style="width :60%;white-space : normal">
					<h:outputText value="#{backingBean.getFullAddress(fac.smAddress)}"
						style="float : left" />
						<br />
						<script>
						
					      function getAddress2(addr1, addr2, addr3, addr4, cityName, districtName, stateName, countryName) {

					    	  var address = addr1 + addr2 + addr3 + addr4 + cityName + ',' + districtName + ',' + stateName + ',' + countryName;

					      	return address;
					      }
						
						</script>


						<ac:gmapInput id="gmapInput" 
							latitude="#{fac.smAddress.mapLatitude}" 
							longitude="#{fac.smAddress.mapLongitude}" 
							address="getAddress2('#{fac.smAddress.address1}', '#{fac.smAddress.address2}', '#{fac.smAddress.address3}', '#{fac.smAddress.address4}', '#{fac.smAddress.pmCity.cityName}', '#{fac.smAddress.pmDistrict.districtName}', '#{fac.smAddress.pmState.stateName}', '#{fac.smAddress.pmCountry.countryName}')"
							showButton="true"
							disabled="false" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.action']}" style="text-align: center  !important;">
					<p:commandLink action="#{backingBean.assignSelFactory(fac)}"
						partialSubmit="true" process="@this"
						update=":form:tt:factoryDialog" style="padding-right:5px" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					partialSubmit="true" process="@this"
					action="#{backingBean.assignNewFactoryBean}"
					update=":form:tt:factoryDialog" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					partialSubmit="true" process="smFacilityFactoryDtPanel"
					action="#{backingBean.deleteSelectedFactories}"
					id="delFactoryBtnId" disabled="#{empty backingBean.managedBean.applFactoryFacilities}"
					update=":form:tt:facDt,@this" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
			</div>
			<br />
		</p:outputPanel>
		
		<ac:gmapDialog id="gmapDialog" 
			latitude="#{cc.attrs.latitude}" 
			longitude="#{cc.attrs.longitude}" 
			locationName="#{cc.attrs.locationName}" />
	
		<ac:gmapScript />
		
		<p:outputPanel rendered="#{!backingBean.managedBean.showFactoryPanel}"
			layout="block">
			<table style="width: 100%">
				<tr>
					<td><h:outputText style="float:left"
							value="#{lbl['lbl.sm.factory.notApplicable']}" /></td>
				</tr>
			</table>

		</p:outputPanel>

	</p:panel>
	<p:dialog width="500px" height="500px"
		header="#{lbl['lbl.sm.factory.information']}"
		widgetVar="factoryDialog" resizable="false" showEffect="fade"
		closable="false" hideEffect="fade" modal="true" id="factoryDialog">
		
		<p:outputPanel layout="block" id="factoryBlockPanel">
			<p:messages id="factoryDialogMsg" showSummary="false"
				showDetail="true" autoUpdate="true" closable="true" />
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.facility.factory.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText size="35" maxlength="50" id="smFacFactorName"
							required="#{backingBean.managedBean.valueReqd}" label="Name"
							value="#{backingBean.managedBean.selectedFactoryFacility.facilityName}" />
						<p:message id="smFacFactorNameMsg" for="smFacFactorName"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				
				<ac:smFacilityAddress backingBean="#{backingBean}" smAddress="#{backingBean.managedBean.selectedFactoryFacility.smAddress}"
					countryItems="#{backingBean.managedBean.countryItems}" stateItems="#{backingBean.managedBean.factoryFacilityStates}"
					districtItems="#{backingBean.managedBean.factoryFacilityDistricts}" cityItems="#{backingBean.managedBean.factoryFacilityCities}" 
					facilityPanel="#{SupplierManagementConst.SM_FACTORY_FACILITY_PANEL}" panelId="factoryAddrId"/>
				
				
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td>
						<ac:phone id="smFacFactoryPhnNo" isMobile="false" label="#{lbl['lbl.sm.phoneno']}"
						countryCode="#{backingBean.managedBean.selectedFactoryFacility.phoneCountry}" 
						areaCode="#{backingBean.managedBean.selectedFactoryFacility.phoneArea}" 
						number="#{backingBean.managedBean.selectedFactoryFacility.phoneNo}"  
						validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
					<td>
						<ac:phone id="smFacFactoryFaxNo" isMobile="false" label="#{lbl['lbl.sm.faxno']}"
						countryCode="#{backingBean.managedBean.selectedFactoryFacility.faxCountry}" 
						areaCode="#{backingBean.managedBean.selectedFactoryFacility.faxArea}" 
						number="#{backingBean.managedBean.selectedFactoryFacility.faxNo}"  
						validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.spec.area.feat']}" /></td>
					<td><p:inputText id="smFacFactoryArea"
							label="#{lbl['lbl.sc.spec.area.feat']}"
							value="#{backingBean.managedBean.selectedFactoryFacility.areaSquareFeet}"
							size="35">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText> <p:message id="smFacFactoryAreaMsg" for="smFacFactoryArea"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.facility.ownerType']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneRadio id="smOwnerType"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.facility.ownerType']}"
							value="#{backingBean.managedBean.selectedFactoryFacility.ownershipType}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.facility.rent']}"
								itemValue="R" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.facility.own']}"
								itemValue="O" />
							<p:ajax event="change"
								listener="#{backingBean.factoryOwnerTypeSel}"
								update="facPan,facPanLbl" />
						</p:selectOneRadio> <p:message id="smOwnerTypeMsg" for="smOwnerType"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputPanel id="facPanLbl">
							<p:outputLabel value="#{lbl['lbl.sm.buy.price']}"
								rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}"
								id="oid" />
							<p:outputLabel value="#{lbl['lbl.sm.facility.rent.rm']}"
								rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}"
								id="rid" />
							<p:outputLabel value="*" styleClass="mandatory"
								rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O' or 
								backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}" />
						</p:outputPanel></td>
					<td><p:outputPanel id="facPan">
							<ui:fragment
								rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}">
								<p:inputText id="smFacFactoryPrice"
									disabled="#{!backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.cm.price']}" maxlength="17"
									validatorMessage="#{lbl['lbl.cm.price']} - #{lbl['lbl.sm.rangeAmt.validMsg']}"
									value="#{backingBean.managedBean.selectedFactoryFacility.purchasePrice}"
									size="20"
									required="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}">
									<f:validateDoubleRange
										minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
										maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
									<f:convertNumber
										pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
									<p:ajax process="@this" partialSubmit="true"
										update="@this,smFacFactoryPriceMsg" />
								</p:inputText>
								<p:message id="smFacFactoryPriceMsg" for="smFacFactoryPrice"
									showSummary="true" showDetail="false" display="icon" />
							</ui:fragment>
							<ui:fragment
								rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}">
								<p:inputText id="smFacFactoryRent"
									disabled="#{!backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.facility.rent.rm']}" maxlength="17"
									validatorMessage="#{lbl['lbl.sm.facility.rent.rm']} - #{lbl['lbl.sm.rangeAmt.validMsg']}"
									value="#{backingBean.managedBean.selectedFactoryFacility.rentalRate}"
									size="20"
									required="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}">
									<f:validateDoubleRange
										minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
										maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
									<f:convertNumber
										pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
									<p:ajax process="@this" partialSubmit="true"
										update="@this,smFacFactoryRentMsg" />
								</p:inputText>
								<p:message id="smFacFactoryRentMsg" for="smFacFactoryRent"
									showSummary="true" showDetail="false" display="icon" />
							</ui:fragment>
						</p:outputPanel></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.ownername']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="50" id="smFacFactoryOwnName"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.ownername']}"
							value="#{backingBean.managedBean.selectedFactoryFacility.ownerName}"
							size="35" /> <p:message id="smFacFactoryOwnNameMsg"
							for="smFacFactoryOwnName" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
	
			</table>
			<br />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.save']}"
					action="#{backingBean.addOrUpdateFactoryToSmAppl}"
					partialSubmit="true" process="factoryDialog"
					onclick="factoryBlockWidget.show();" oncomplete="factoryBlockWidget.hide();"
					update=":form:tt:facDt, @([id$=Msg]),:#{p:component('delFactoryBtnId')}" />
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
					partialSubmit="true" process="@this"
					action="#{backingBean.cancelFactorySaveorUpdate}"
					update=":form:tt:factoryDialog, @([id$=Msg])" />
			</div>
			<p:blockUI block="factoryBlockPanel" widgetVar="factoryBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
		</p:outputPanel>
	</p:dialog>
</ui:composition>
