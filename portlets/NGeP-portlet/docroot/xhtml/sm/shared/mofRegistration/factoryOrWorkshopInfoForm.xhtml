<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.factoryStepLbl']}" toggleable="true"
		id="smFacilityFactoryDtPanel">

		<p:dataTable var="fac" widgetVar="smFacilityFactorDtWidVar"
			value="#{backingBean.managedBean.applFactoryFacilities}"
			selection="#{backingBean.managedBean.selectedFactoryFacilities}"
			rowKey="#{fac}" rowIndexVar="index" id="facDt">
			<ac:paginator for="facDt" />
			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="#{lbl['lbl.sm.factory.name']}">
				<h:outputText value="#{fac.facilityName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.factory.address']}">
				<h:outputText
					value="#{fac.smAddress.address1},#{fac.smAddress.address2},#{fac.smAddress.address3}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.action']}">
				<p:commandLink action="#{backingBean.assignSelFactory(fac)}"
					partialSubmit="true" process="@this"
					update=":form:tt:factoryDialog" style="padding-right:5px">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}" partialSubmit="true" process="@this"
				action="#{backingBean.assignNewFactoryBean}"
				update=":form:tt:factoryDialog" />
			<p:commandButton value="#{lbl['lbl.sm.button.delete']}" partialSubmit="true"
				process="smFacilityFactoryDtPanel"
				action="#{backingBean.deleteSelectedFactories}"
				update=":form:tt:facDt" />
		</div>
		<br />
	</p:panel>
	<p:dialog width="500px" height="500px" header="#{lbl['lbl.sm.factory.information']}"
		widgetVar="factoryDialog" resizable="false" showEffect="fade"
		closable="false" hideEffect="fade" modal="true" id="factoryDialog">
		<p:messages id="factoryDialogMsg" showSummary="false"
			showDetail="true" autoUpdate="true" closable="true" />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.facilityType']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.facilityType}" readonly="true"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.name']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td><p:inputText size="35" maxlength="50" id="smFacFactorName"
						required="#{backingBean.managedBean.valueReqd}" label="Name"
						value="#{backingBean.managedBean.selectedFactoryFacility.facilityName}" />
					<p:message id="smFacFactorNameMsg" for="smFacFactorName"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.address']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td><p:inputText maxlength="35" id="smFacFactoryAddr"
						required="#{backingBean.managedBean.valueReqd}" label="Address"
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address1}"
						size="35" /> <p:message id="smFacFactoryAddrMsg"
						for="smFacFactoryAddr" showSummary="true" showDetail="false"
						display="icon" /></td>
			</tr>

			<tr>
				<td></td>
				<td><p:inputText maxlength="35"
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address2}"
						size="35" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="35"
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address3}"
						size="35" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="35"
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address4}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="smFacFactoryCntry"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.country']}"
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmCountry.countryId}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="factoryCountry"
							value="#{backingBean.managedBean.countryLs}"
							itemValue="#{factoryCountry.countryId}"
							itemLabel="#{factoryCountry.countryName}" />
						<p:ajax event="change"
							listener="#{backingBean.populateStatesByCountry(backingBean.managedBean.selectedFactoryFacility.smAddress.pmCountry.countryId, 
								SupplierManagementConst.SM_FACTORY_FACILITY_PANEL,
								backingBean.managedBean.selectedFactoryFacility.smAddress.pmState,
								backingBean.managedBean.selectedFactoryFacility.smAddress.pmDistrict,
								backingBean.managedBean.selectedFactoryFacility.smAddress.pmCity)}"
							update="factoryState,factoryDist,factoryCity" />
					</p:selectOneMenu> <p:message id="smFacFactoryCntryMsg" for="smFacFactoryCntry"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.state']}"
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmState.stateId}"
						id="factoryState">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="facState"
							value="#{backingBean.managedBean.factoryFacilityStates}"
							itemValue="#{facState.stateId}" itemLabel="#{facState.stateName}" />
						<p:ajax event="change"
							listener="#{backingBean.populateDistrictsByState(backingBean.managedBean.selectedFactoryFacility.smAddress.pmState.stateId, 
								SupplierManagementConst.SM_FACTORY_FACILITY_PANEL,
								backingBean.managedBean.selectedFactoryFacility.smAddress.pmDistrict,
								backingBean.managedBean.selectedFactoryFacility.smAddress.pmCity)}"
							update="factoryDist,factoryCity" />

					</p:selectOneMenu> <p:message id="factoryStateMsg" for="factoryState"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						id="factoryDist" required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.district']}"
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmDistrict.districtId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="factoryDist"
							value="#{backingBean.managedBean.factoryFacilityDistricts}"
							itemValue="#{factoryDist.districtId}"
							itemLabel="#{factoryDist.districtName}" />
						<p:ajax event="change"
							listener="#{backingBean.populateCitiesByDistrict(backingBean.managedBean.selectedFactoryFacility.smAddress.pmDistrict.districtId, 
								SupplierManagementConst.SM_FACTORY_FACILITY_PANEL,
								backingBean.managedBean.selectedFactoryFacility.smAddress.pmCity)}"
							update="factoryCity" />
					</p:selectOneMenu> <p:message id="factoryDistMsg" for="factoryDist"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						id="factoryCity" required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.towncity']}"
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmCity.cityId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="factoryCity"
							value="#{backingBean.managedBean.factoryFacilityCities}"
							itemValue="#{factoryCity.cityId}"
							itemLabel="#{factoryCity.cityName}" />
					</p:selectOneMenu> <p:message id="factoryCityMsg" for="factoryCity"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="10" id="smFacFactoryPostCode"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.postcode']}"
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.postcode}"
						size="35" /> <p:message id="smFacFactoryPostCodeMsg"
						for="smFacFactoryPostCode" showSummary="true" showDetail="false"
						display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td><p:inputText id="smFacFactoryPhnNo"
						label="#{lbl['lbl.sm.phoneno']}"
						value="#{backingBean.managedBean.selectedFactoryFacility.phoneNo}"
						size="35" maxlength="12"
						validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
					</p:inputText> <p:message id="smFacFactoryPhnNoMsg" for="smFacFactoryPhnNo"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
				<td><p:inputText id="smFacFactoryFaxNo"
						label="#{lbl['lbl.sm.faxno']}"
						value="#{backingBean.managedBean.selectedFactoryFacility.faxNo}"
						size="35" maxlength="12"
						validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
					</p:inputText> <p:message id="smFacFactoryFaxNoMsg" for="smFacFactoryFaxNo"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sp.area']}" /></td>
				<td><p:inputText id="smFacFactoryArea" label="#{lbl['lbl.sc.sp.area']}"
						value="#{backingBean.managedBean.selectedFactoryFacility.areaSquareFeet}"
						size="35">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText> <p:message id="smFacFactoryAreaMsg" for="smFacFactoryArea"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.ownerType']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneRadio id="smOwnerType"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.facility.ownerType']}"
						value="#{backingBean.managedBean.selectedFactoryFacility.ownershipType}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.facility.rent']}" itemValue="R" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.facility.own']}" itemValue="O" />
						<p:ajax event="change"
							listener="#{backingBean.factoryOwnerTypeSel}"
							update="facPan,facPanLbl" />
					</p:selectOneRadio> <p:message id="smOwnerTypeMsg" for="smOwnerType"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputPanel id="facPanLbl">
						<p:outputLabel value="#{lbl['lbl.cm.price']}"
							rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}"
							id="oid" />
						<p:outputLabel value="#{lbl['lbl.sm.facility.rent.rm']}"
							rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}"
							id="rid" />
					</p:outputPanel></td>
				<td><p:outputPanel id="facPan">
						<ui:fragment
							rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}">
							<p:inputText id="smFacFactoryPrice" label="#{lbl['lbl.cm.price']}"
								value="#{backingBean.managedBean.selectedFactoryFacility.purchasePrice}"
								size="20">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText>
							<p:message id="smFacFactoryPriceMsg" for="smFacFactoryPrice"
								showSummary="true" showDetail="false" display="icon" />
						</ui:fragment>
						<ui:fragment
							rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}">
							<p:inputText id="smFacFactoryRent" label="#{lbl['lbl.sm.facility.rent.rm']}"
								value="#{backingBean.managedBean.selectedFactoryFacility.rentalRate}"
								size="20">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText>
							<p:message id="smFacFactoryRentMsg" for="smFacFactoryRent"
								showSummary="true" showDetail="false" display="icon" />
						</ui:fragment>
					</p:outputPanel></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.ownername']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="50" id="smFacFactoryOwnName"
						required="#{backingBean.managedBean.valueReqd}" label="#{lbl['lbl.sm.ownername']}"
						value="#{backingBean.managedBean.selectedFactoryFacility.ownerName}"
						size="35" /> <p:message id="smFacFactoryOwnNameMsg"
						for="smFacFactoryOwnName" showSummary="true" showDetail="false"
						display="icon" /></td>
			</tr>

		</table>
		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				action="#{backingBean.addOrUpdateFactoryToSmAppl}"
				partialSubmit="true" process="factoryDialog"
				update=":form:tt:facDt, @([id$=Msg])" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}" partialSubmit="true" process="@this"
				action="#{backingBean.cancelFactorySaveorUpdate}" />
		</div>
	</p:dialog>
</ui:composition>
