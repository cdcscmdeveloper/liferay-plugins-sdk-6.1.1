<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Factory / Workshop / Store / Dockyard Facilities"
		toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:dataTable var="fac"
			value="#{backingBean.managedBean.smAppl.smFacilities}"
			selection="#{backingBean.managedBean.selectedFactoryFacilities}"
			rowKey="#{fac.facilityId}" rowIndexVar="index" id="facDt">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<h:outputText value="#{index+1}" />
			</p:column>

			<p:column headerText="Factory Name">
				<h:outputText value="#{fac.smAddress.address1}" />
			</p:column>

			<p:column headerText="Factory/ Workshop/Dockyard Address">
				<h:outputText
					value="#{fac.smAddress.address2},#{fac.smAddress.address3},#{fac.smAddress.address4}" />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink oncomplete="factoryDialog.show();"
					action="#{backingBean.assignSelFactory(fac)}"
					update=":form:tt:factoryDialog" style="padding-right:5px">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add " oncomplete="factoryDialog.show();"
				action="#{backingBean.assignNewFactoryBean}"
				update=":form:tt:factoryDialog" />
			<p:commandButton value="Delete " />
		</div>
		<br />
		<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
			<table style="width: 50%">
				<tr>
					<td><p:outputLabel value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" /></td>
				</tr>
			</table>
		</p:outputPanel>
		<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" readonly="true"
							disabled="true" /></td>
					<td><p:outputLabel value="Approver Remarks" /></td>
					<td><p:inputTextarea autoResize="true" /></td>

				</tr>
			</table>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="500px" height="480px"
		header="Factory / Workshop / Store / Shipyard Page"
		widgetVar="factoryDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="factoryDialog">
		<!-- 	<p:panel header="Factory / Workshop / Store / Shipyard Details"> -->

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Facility Type" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedFactoryFacility.facilityType}" style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="Factory" itemValue="FA" />
						<f:selectItem itemLabel="Workshop" itemValue="WO" />
						<f:selectItem itemLabel="Store" itemValue="ST" />
						<f:selectItem itemLabel="Shipyard" itemValue="SH" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Name" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address1}" size="35"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Address" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address2}" size="35"/></td>
			</tr>

			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address3}" size="35"/></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address4}" size="35"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Country" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmCountry.countryCode}" style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="Malaysia" itemValue="MY" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.postcode}" size="35"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmState.stateCode}" size="35"/></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmDistrict.districtCode}" size="35"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmCity.cityCode}" size="35"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Phone NO." /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.phoneNo}" size="35"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Fax NO." /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.faxNo}" size="35"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="*Area(Sq Ft) *" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.areaSquareFeet}" size="35"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="Ownership Type" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedFactoryFacility.ownershipType}">
						<f:selectItem itemLabel="Rented " itemValue="R" />
						<f:selectItem itemLabel="Owned" itemValue="O" />
						<p:ajax event="change"
							listener="#{backingBean.factoryOwnerTypeSel}"
							update="facPan,facPanLbl" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputPanel id="facPanLbl">
						<p:outputLabel value="* Purchase Price"
							rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}"
							id="oid" />
						<p:outputLabel value="* Rent"
							rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}"
							id="rid" />
					</p:outputPanel></td>
				<td><p:outputPanel id="facPan">
						<ui:fragment
							rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}">
							<table>
								<tr>
									<td style="padding-right: 5px;"><p:inputText
											value="#{backingBean.managedBean.selectedFactoryFacility.purchasePrice}"
											size="20" /></td>
									<td valign="top"><p:selectOneMenu
											style="margin-bottom:5px;">
											<f:selectItem itemLabel="MYR" itemValue="1" />
										</p:selectOneMenu></td>
								</tr>
							</table>
						</ui:fragment>
						<ui:fragment
							rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}">
							<table>
								<tr>
									<td style="padding-right: 5px;"><p:inputText
											value="#{backingBean.managedBean.selectedFactoryFacility.rentalRate}"
											size="20" /></td>
									<td valign="top"><p:selectOneMenu
											style="margin-bottom:5px;">
											<f:selectItem itemLabel="MYR" itemValue="1" />
										</p:selectOneMenu></td>
								</tr>
							</table>
						</ui:fragment>
					</p:outputPanel></td>
			</tr>

			<tr>
				<td><p:outputLabel value="
								Owner Name *" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.ownerName}" size="35"/></td>
			</tr>

		</table>
		<!-- </p:panel> -->
		<br />
		<div align="right">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdateFactoryToSmAppl}"
				oncomplete="factoryDialog.hide();" update=":form:tt:facDt" />
			<p:commandButton value="Cancel" onclick="factoryDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
