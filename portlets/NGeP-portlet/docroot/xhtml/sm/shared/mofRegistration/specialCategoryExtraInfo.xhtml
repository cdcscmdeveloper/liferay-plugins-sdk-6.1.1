<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<c:choose>
		<c:when test="#{backingBean.managedBean.dummyCatType =='261'}">
			<ui:include src="categoryFactoryDetails.xhtml" />
		</c:when>
		<c:when test="#{backingBean.managedBean.dummyCatType =='264'}">
			<ui:include src="categoryManufacturingDetails.xhtml" />
		</c:when>
		<c:when test="#{backingBean.managedBean.dummyCatType =='266'}">
			<ui:include src="categoryMachineryDetails.xhtml" />
		</c:when>

		<c:otherwise>
			<p:separator />
			<table style="width: 100%">
				<tr>
					<td align="left"><p:outputLabel
							value="#{lbl['lbl.sm.specialcat.note']}"
							style="color: blue; font-weight: bold;" /></td>
				</tr>
			</table>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.save']}"
					action="#{backingBean.saveSelectedCategory}"
					oncomplete="regCatDialog.hide();" type="submit"
					partialSubmit="true" process="regCatDialog" update=":form:tt:catDt" />
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}" onclick="regCatDialog.hide();" />
			</div>
		</c:otherwise>
	</c:choose>

</ui:composition>
