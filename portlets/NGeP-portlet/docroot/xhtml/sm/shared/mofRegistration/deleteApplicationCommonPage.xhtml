<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:commandButton value="#{lbl['lbl.sm.deleteDraft']}" update=":form"
		onclick="mofApplDelConfirm.show()" type="button"
		style="margin-bottom:5px;" />

	<p:confirmDialog id="mofApplDelConfirm" closable="false"
		message="#{lbl['lbl.sm.deleteDraft.cnfmMsg']}"
		header="#{lbl['lbl.sm.deleteDraft.cnfmHdr']}" severity="alert"
		widgetVar="mofApplDelConfirm">
		
		<div align="right">
			<p:commandButton id="confApplDel" value="#{lbl['lbl.btn.yes']}"
				onclick="mofApplDelConfirm.hide()"
				onstart="blockWidget.show()"
				oncomplete="blockWidget.hide()"
				partialSubmit="true"
				process="@this" action="#{backingBean.deleteDraftApplication}" 
				update="@form"/>
			<p:commandButton id="declineApplnDelete" value="#{lbl['lbl.btn.no']}"
				onclick="mofApplDelConfirm.hide()" type="button" />
		</div>

	</p:confirmDialog>

</ui:composition>
