<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel rendered="#{not empty backingBean.managedBean.mandatoryLicenseDocs}" id="onlineLicenseOutPanelId">
		<div class="ui-datatable ui-widget"
			style="width: 100% !important; table-layout: fixed !important;">
			<div class="ui-datatable-tablewrapper">
				<table role="grid">
					<thead>
						<tr>
							<th class="ui-state-default" role="columnheader"
								style="text-align: center !important;"><span><h:outputText
										value="#{lbl['lbl.sm.license.cert.info']}" /></span></th>
						</tr>
					</thead>
				</table>
			</div>
		</div>
	
		<ui:repeat var="mainTable"
			value="#{backingBean.managedBean.mandatoryLicenseDocs}"
			varStatus="mainTableStatus">
			<p:dataTable var="table" id="onlineLicenseTableId"
				value="#{mainTable.licenseSuppDocs}" rowIndexVar="index"
				style="width:100% !important; table-layout: fixed !important;">
	
				<p:columnGroup type="header">
					<p:row>
						<ui:param name="categoryName" 
							value="#{table.pmDocument.pmDocumentRestrs[0].pmCategoryL3.fullCatcode} 
								#{table.pmDocument.pmDocumentRestrs[0].pmCategoryL3.categoryName}" />
						<p:column
							headerText="#{lbl['lbl.sm.category']} : (#{empty categoryName ? lbl['lbl.txt.na'] : categoryName})"
							style="background-color:lightblue !important;text-align: left !important;color:black !important"
							colspan="5" />
					</p:row>
				</p:columnGroup>
	
				<p:column
					style="width : 5% !important;text-align: center !important;">
					<h:outputText value="#{mainTable.count}" />
				</p:column>
	
				<p:column style="width : 55% !important;">
	
	
					<h:outputText value="#{table.pmDocument.docName}"
						style="float: left;white-space: normal;" />
					
					<br />
					<br />
					<table width="100%">
						<tr>
							<td style="border-style: none !important;">
								<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.no']}" />
								<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}"/>
							</td>
							<td style="border-style: none !important;">
								<p:inputText value="#{table.licenseNo}" size="20" id="licenseNoId" required="#{table.pmDocument.mandatory}" label="#{lbl['lbl.sm.suppdoc.license.no']}" >
									<p:ajax process="@this" partialSubmit="true"/>
								</p:inputText>
								<p:message id="licenseNoIdMsg" for="licenseNoId" showSummary="true" showDetail="false" display="icon" />
							</td>
							<td colspan="2" style="border-style: none !important;"></td>
						</tr>
						<tr>
							<td style="border-style: none !important;">
								<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.effdate']}" />
								<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}"/>
							</td>
							<td style="border-style: none !important;">
								<p:calendar id="licenseEffDateId"
									navigator="true" required="#{table.pmDocument.mandatory}" 
									label="#{lbl['lbl.sm.suppdoc.license.effdate']}"
									value="#{table.licenseEffDate}"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
									readonlyInput="true" size="10" showOn="button" yearRange="-99:+0" >
									<p:ajax event="dateSelect" update="licenseExpDateId" process="@this"/>
								</p:calendar>
								<p:message id="licenseEffDateIdMsg"
									for="licenseEffDateId" showSummary="true" showDetail="false"
									display="icon" />
							</td>
							<td style="border-style: none !important;">
								<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.expdate']}" />
								<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}"/>
							</td>
							<td style="border-style: none !important;">
								<p:calendar id="licenseExpDateId" disabled="#{empty table.licenseEffDate}"
									navigator="true" required="#{table.pmDocument.mandatory}"
									label="#{lbl['lbl.sm.suppdoc.license.expdate']}"
									value="#{table.licenseExpDate}"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
									readonlyInput="true" size="10" showOn="button" yearRange="-99:+10" 
									mindate="#{table.licenseEffDate}">
									<p:ajax event="dateSelect" process="@this"/>
								</p:calendar>
								<p:message id="licenseExpDateIdMsg"
									for="licenseExpDateId" showSummary="true" showDetail="false"
									display="icon" />
							</td>
						</tr>
					</table>
	
				</p:column>
	
				<p:column rendered="#{backingBean.managedBean.hasSuppDocToDownload}"
					style="width : 10%;text-align: center  !important;">
					<h:outputText rendered="#{table.pmDocument.hardCopyReq}"
						value="#{lbl['lbl.sm.suppDoc.document.hdrCpyOnly']}"
						style="float: left;white-space: normal;" />
	
					<p:commandLink rendered="#{table.pmDocument.download}"
						action="#{backingBean.downloadSignatureSuppDoc(table.pmDocument.docDefinitionKey)}"
						update=":form" ajax="false">
						<p:fileDownload value="#{backingBean.file}" />
						<p:graphicImage value="/css/images/design/download.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
	
				<p:column style="width : 10%;text-align: center  !important;">
					<p:commandLink
						oncomplete="uploadLicenseDialog.show();return false;"
						process="@this" partialSubmit="true"
						rendered="#{!table.pmDocument.hardCopyReq}"
						update="@([id$=uploadLicenseDialog])"
						action="#{backingBean.assignSelectedSupportDoc(table)}">
						<p:graphicImage value="/css/images/design/upload.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
				<p:column style="width : 20%;overflow: hidden !important;">
					<h:outputText rendered="#{table.pmDocument.hardCopyReq}"
						value="#{lbl['lbl.sm.suppDoc.document.hdrCpyRmrks']}"
						style="float: left;white-space: normal;" />
	
					<p:commandLink ajax="false"
						value="#{table.smApplDocFiles[0].fileName}"
						rendered="#{not empty table.smApplDocFiles and !table.pmDocument.hardCopyReq}">
						<p:fileDownload
							value="#{backingBean.commonDownload(table.smApplDocFiles[0].filePath,table.smApplDocFiles[0].fileName,table.smApplDocFiles[0].fileName)}" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</ui:repeat>
	</p:outputPanel>

	<p:dialog id="uploadLicenseDialog" widgetVar="uploadLicenseDialog"
		modal="true" dynamic="true" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}"
		onShow="singleUploadListener(uploadWV);"
		onHide="uploadWV.buttonBar.find('input[type=file]').get(0).disabled=false;">
		<p:fileUpload widgetVar="uploadWV"
			allowTypes="/(\.|\/)(pdf|doc|docx)$/"
			sizeLimit="#{SupplierManagementConst.SM_SUPPORTDOCS_FILE_SIZE_LIMIT}"
			invalidFileMessage="#{lbl['lbl.sm.upload.format.errmsg']}"
			invalidSizeMessage="#{lbl['lbl.sm.upload.fileSize.exceed20Mb']}"
			fileUploadListener="#{backingBean.handleSupDocFileAttachment}"
			update="onlineLicenseOutPanelId"
			oncomplete="uploadLicenseDialog.hide();"
			uploadLabel="#{lbl['lbl.btn.upload']}"
			label="#{lbl['lbl.btn.choose']}"
			cancelLabel="#{lbl['lbl.btn.cancel']}" multiple="false"
			showButtons="false" />
	</p:dialog>

</ui:composition>
