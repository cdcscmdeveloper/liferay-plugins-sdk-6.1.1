<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sm.facility.workshop.dockyard.factory.store.details']}">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.facility.type']}" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedFactoryFacility.facilityType}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.facility.type.factory']}" itemValue="FA" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.facility.type.workshop']}" itemValue="WO" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.facility.type.store']}" itemValue="ST" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.facility.type.dockyard']}" itemValue="SH" />
					</p:selectOneMenu></td>

				<td><p:outputLabel value="* #{lbl['lbl.sm.facility.name']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address1}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.address']}" /></td>
				<td colspan="3"><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address2}"
						size="50" /></td>
			</tr>

			<tr>
				<td></td>
				<td colspan="3"><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address3}"
						size="50" /></td>
			</tr>
			<tr>
				<td></td>
				<td colspan="3"><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address4}"
						size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.country']}" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmCountry.countryCode}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="Malaysia" itemValue="MY" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmState.stateCode}"
						size="35" /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmDistrict.districtCode}"
						size="35" /></td>

				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmCity.cityCode}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.postcode}"
						size="35" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td><p:inputText size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
				<td><p:inputText size="35" /></td>

				<td><p:outputLabel value="* #{lbl['lbl.sc.spec.area.feat']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.areaSquareFeet}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.ownerType']}" /></td>
				<td colspan="3"><p:selectOneRadio
						value="#{backingBean.managedBean.selectedFactoryFacility.ownershipType}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.facility.rent']}" itemValue="R" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.facility.own']}" itemValue="O" />
						<p:ajax event="change"
							listener="#{backingBean.factoryOwnerTypeSel}"
							update="facPan,facPanLbl" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputPanel id="facPanLbl">
						<p:outputLabel value="* #{lbl['lbl.sm.price']}"
							rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}"
							id="oid" />
						<p:outputLabel value="* #{lbl['lbl.sm.facility.rent.rm']}"
							rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}"
							id="rid" />
					</p:outputPanel></td>
				<td><p:outputPanel id="facPan">
						<ui:fragment
							rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}">
							<table>
								<tr>
									<td style="padding-right: 5px;"><p:inputText
											value="#{backingBean.managedBean.selectedFactoryFacility.purchasePrice}"
											size="20" /></td>
								</tr>
							</table>
						</ui:fragment>
						<ui:fragment
							rendered="#{backingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}">
							<table>
								<tr>
									<td style="padding-right: 5px;"><p:inputText
											value="#{backingBean.managedBean.selectedFactoryFacility.rentalRate}"
											size="20" /></td>
								</tr>
							</table>
						</ui:fragment>
					</p:outputPanel></td>
				<td><p:outputLabel value="* #{lbl['lbl.sm.ownername']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedFactoryFacility.ownerName}"
						size="35" /></td>
			</tr>



		</table>
	</p:panel>
	<br />
	<div align="right">
		<p:commandButton value="#{lbl['lbl.sm.button.save']}"
			action="#{backingBean.saveSelectedCategory}"
			oncomplete="regCatDialog.hide();" type="submit" partialSubmit="true"
			process="regCatDialog" update=":form:tt:catDt" />
		<p:commandButton value="#{lbl['lbl.sm.button.cancel']}" onclick="regCatDialog.hide();" />
	</div>

</ui:composition>
