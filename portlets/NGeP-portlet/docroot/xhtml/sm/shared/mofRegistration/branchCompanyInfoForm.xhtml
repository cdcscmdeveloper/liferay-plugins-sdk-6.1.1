<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Company Branches" toggleable="true" id="sample">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.branchVerified}"
							id="poBrcVer">
							<p:ajax update=":form:tt:brnInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.branchVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.branchVerified}"
							id="apprBrcVer">
							<p:ajax update=":form:tt:brnInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.branchVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />

		<p:panel id="brnInfPan">
			<p:blockUI block=":form:tt:brnInfPan" widgetVar="buiPoBrn"
				id="poBrnBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.branchVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.branchVerified : false)}" />
			<p:dataTable var="branchBean" id="dt"
				value="#{backingBean.managedBean.smAppl.smSupplierBranches}"
				selection="#{backingBean.managedBean.selectedBranches}"
				rowKey="#{branchBean}" rowIndexVar="index">
				<ac:paginator for="dt" />

				<p:column selectionMode="multiple" width="5%" />

				<p:column headerText="Branch Name">
					<h:outputText value="#{branchBean.branchName}" />
				</p:column>

				<p:column headerText="Address">
					<h:outputText
						value="#{branchBean.smAddress.address1},#{branchBean.smAddress.address2}" />
				</p:column>
				<p:column headerText="Action">
					<p:commandLink id="selectButton" update=":form:tt:display"
						oncomplete="banchDialog.show();"
						action="#{backingBean.assignSelBranch(branchBean)}">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png"
							style="margin-right:2px;" />
					</p:commandLink>

				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="Add"
					action="#{backingBean.assignNewBranchBean}"
					oncomplete="banchDialog.show();" update=":form:tt:display" />
				<p:commandButton value="Delete"
					action="#{backingBean.deleteSelectedBranches}" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41" /></td>
						<td style="padding-left: 22px;"><p:outputLabel
								value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="450px" header="Branch Details" widgetVar="banchDialog"
		id="display" resizable="false" showEffect="fade" hideEffect="fade"
		modal="true">

		<p:panel header="Branch Details" toggleable="true">
			<ui:include src="branchDetailsTablePage.xhtml" />
		</p:panel>
		<p:panel header="Point Of Contact"
			rendered="#{backingBean.managedBean.smAppl.supplierType eq '2'}"
			toggleable="true">
			<table style="width: 100%">

				<tr>
					<td><p:outputLabel value="* Name" /></td>
					<td><p:inputText size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Position" /></td>
					<td><p:inputText size="35" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="* Nationality" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One--" itemValue="1" />
							<f:selectItem itemLabel="Malaysian" itemValue="2" />
							<f:selectItem itemLabel="Chinese" itemValue="3" />
							<f:selectItem itemLabel="Indian" itemValue="4" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* IC/Pspt No." /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedPersonnel.identificationNo}"
							size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value=" Bumi " title="For Malaysian Only" /></td>
					<td><p:selectOneRadio>
							<f:selectItem itemLabel="Yes" itemValue="1" />
							<f:selectItem itemLabel="No" itemValue="0" />
						</p:selectOneRadio></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Qualification"
							title="For Malaysian Only" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="-- Others--" itemValue="1" />
							<f:selectItem itemLabel="Graduate" itemValue="1" />
							<f:selectItem itemLabel="Post Graduate" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>

			</table>
		</p:panel>
		<br />
		<div align="right">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdateBranchToSmAppl}"
				oncomplete="banchDialog.hide();" type="submit" partialSubmit="true"
				process="display" update=":form:tt:dt" />
			<p:commandButton value="Cancel" onclick="banchDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
