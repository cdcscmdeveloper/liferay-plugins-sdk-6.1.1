<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel toggleable="true" id="sample">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sm.branch.panHdr']} " />
			<p:graphicImage id="sampleImg" value="/css/images/design/tooltips.png"
			 style="padding-left : 10px;" />
			<p:tooltip id="sampleImgtt" for="sampleImg">
				<p:inputTextarea escape="false" readonly="true" disabled="true"
					rows="2" cols="50" value="#{lbl['lbl.sm.branch.panHdrToolTip']}" />
			</p:tooltip>
		</f:facet>
		<table style="width: 100%">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.branchVerified}"
							id="poBrcVer">
							<p:ajax update=":form:tt:brnInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:brnInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.branchVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.branchVerified}"
							id="apprBrcVer">
							<p:ajax update=":form:tt:brnInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:brnInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.branchVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<p:outputPanel id="brnInfPan" layout="block">
			<p:blockUI block=":form:tt:brnInfPan" widgetVar="buiPoBrn"
				id="poBrnBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.branchVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.branchVerified : false)}" />

			<p:dataTable var="branchBean" id="dt" widgetVar="suppBrnachDtWidVar"
				value="#{backingBean.managedBean.smAppl.smSupplierBranches}"
				selection="#{backingBean.managedBean.selectedBranches}"
				rowKey="#{branchBean}" rowIndexVar="index"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<ac:paginator for="dt" />

				<p:column selectionMode="multiple" width="5%" />

				<p:column headerText="#{lbl['lbl.sm.branch.branchName']}">
					<table style="width: 100%">
						<tr>
							<td colspan="2" style="border-style: none !important;"><h:outputText
									value="#{branchBean.branchName}" /></td>
						</tr>
						<tr>
							<td style="border-style: none !important; width: 40%;"><h:outputText
									value="#{lbl['lbl.sm.gstNo']}" /></td>
							<td style="border-style: none !important; width: 5%;">:</td>
							<td style="border-style: none !important;; width: 55%;"><h:outputText
									value="#{branchBean.gstRegistrationNo}" /></td>
						</tr>
						<tr>
							<td style="border-style: none !important;"><h:outputText
									value="#{lbl['lbl.sm.gstDate']}" /></td>
							<td style="border-style: none !important;">:</td>
							<td style="border-style: none !important;"><h:outputText
									value="#{branchBean.gstRegistrationDate}">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</h:outputText></td>
						</tr>
					</table>

				</p:column>

				<p:column headerText="#{lbl['lbl.sm.companyaddress']}"
					style="width :50%;white-space : normal">
					<h:outputText
						value="#{backingBean.getFullAddress(branchBean.smAddress)}"
						style="float : left" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.person.composition.poc']}"
					style="width :150px;white-space : normal">
					<h:outputText value="#{branchBean.smPersonnel.name}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink id="selectButton" update=":form:tt:banchDialog"
						partialSubmit="true" process="@this"
						action="#{backingBean.assignSelBranch(branchBean,index)}">
						<p:graphicImage value="/css/images/design/edit.png"
							style="margin-right:2px;" />
					</p:commandLink>

				</p:column>
			</p:dataTable>

			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					action="#{backingBean.assignNewBranchBean}" partialSubmit="true"
					process="@this" update=":form:tt:banchDialog" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					partialSubmit="true" process="brnInfPan"
					action="#{backingBean.deleteSelectedBranches}" update=":form:tt:dt" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								maxlength="200" id="poBranchRemarkId"
								validatorMessage="#{lbl['lbl.sm.branch.panHdr']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.branchRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="poBranchRemarkMsg" for="poBranchRemarkId"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41" maxlength="200" id="poBranchRemark2Id"
								validatorMessage="#{lbl['lbl.sm.branch.panHdr']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.branchRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="poBranchRemark2Msg" for="poBranchRemark2Id"
								showSummary="true" showDetail="false" display="icon" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								maxlength="200" id="apprBranchRemarkId"
								validatorMessage="#{lbl['lbl.sm.branch.panHdr']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.branchRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="apprBranchRemarkMsg" for="apprBranchRemarkId"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="450px" height="430px"
		header="#{lbl['lbl.sm.branch.branchDiaHdr']}" widgetVar="banchDialog"
		id="banchDialog" resizable="false" showEffect="fade" hideEffect="fade"
		modal="true" closable="false">
		<p:messages id="suppBranchMsg" showSummary="false" showDetail="true"
			autoUpdate="true" closable="true" />
		<ui:fragment
			rendered="#{backingBean.managedBean.smAppl.supplierType eq 'K' or backingBean.managedBean.smAppl.supplierType eq 'J'}">
			<ui:include src="branchDetailsTablePage.xhtml" />
		</ui:fragment>
		<p:panel header="#{lbl['lbl.sm.branch.details']}" toggleable="true"
			rendered="#{backingBean.managedBean.smAppl.supplierType eq 'MKM'}">
			<ui:include src="branchDetailsTablePageConsultant.xhtml" />
		</p:panel>

		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				id="branchPopUpSaveBtn"
				action="#{backingBean.addOrUpdateBranchToSmAppl}"
				partialSubmit="true" process="banchDialog"
				update=":form:tt:dt,:form:tt:personDt,@([id$=Msg])" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				partialSubmit="true" process="@this"
				action="#{backingBean.assignCancelBranchBean}" />
		</div>
	</p:dialog>
</ui:composition>
