<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Company Branches" toggleable="true" id="sample">
		<table style="width: 250px">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By PO: "
						title="For PO to highlight the verified section " /></td>

			</tr>
			<tr>
				<td width="10px"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By Approver: "
						title="For Approver to highlight the verified section " /></td>
			</tr>
		</table>
		<br />
		<p:dataTable var="branchBean" id="dt"
			value="#{backingBean.managedBean.smAppl.smApplSupplierBranches}"
			selection="#{backingBean.managedBean.selectedBranches}"
			rowKey="#{branchBean.applSupplierBranchId}" rowIndexVar="index">

			<p:column selectionMode="multiple" width="5%" />
			<p:column headerText="NO.">
				<p:outputLabel value="#{index+1}" />
			</p:column>

			<p:column headerText="Branch Name">
				<p:commandLink id="selectButton" update=":form:tt:display"
					oncomplete="banchDialog.show();"
					action="#{backingBean.assignSelBranch(branchBean)}"
					value="#{branchBean.branchName}">

				</p:commandLink>
			</p:column>

			<p:column headerText="Address">
				<p:outputLabel
					value="#{branchBean.pmAddress.address1},#{branchBean.pmAddress.address2}" />
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Branch"
				action="#{backingBean.assignNewBranchBean}"
				oncomplete="banchDialog.show();" update=":form:tt:display" />
			<p:commandButton value="Delete Branch(es)"
				action="#{backingBean.deleteSelectedBranches}" />

		</div>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog width="400px" header="Branch Page" widgetVar="banchDialog"
		id="display" resizable="false" showEffect="fade" hideEffect="fade"
		modal="true">
		<p:panel header="Branch Details">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Branch Name *" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBranch.branchName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Address" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBranch.pmAddress.address1}" /></td>
				</tr>

				<tr>
					<td></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBranch.pmAddress.address2}" /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBranch.pmAddress.address3}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Country *" /></td>
					<td><p:selectOneMenu
							value="#{backingBean.managedBean.selectedBranch.pmAddress.pmCountry.countryCode}">
							<f:selectItem itemLabel="-- Select One -- " itemValue="" />
							<f:selectItem itemLabel="Malaysia" itemValue="MY" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBranch.pmAddress.postcode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBranch.pmAddress.pmState.stateCode}" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBranch.pmAddress.pmDistrict.districtCode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBranch.pmAddress.pmCity.cityCode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Phone No." /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBranch.pmAddress.phoneNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Fax No." /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBranch.pmAddress.faxNo}" /></td>
				</tr>

			</table>
		</p:panel>
		<br />
		<div align="center">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdateBranchToSmAppl}"
				oncomplete="banchDialog.hide();" type="submit" partialSubmit="true"
				process="display" update=":form:tt:dt" />
			<p:commandButton value="Cancel" onclick="banchDialog.hide();" />
		</div>
	</p:dialog>

</ui:composition>
