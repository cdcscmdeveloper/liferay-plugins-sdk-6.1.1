<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Company Branches" toggleable="true" id="sample">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:dataTable var="branchBean" id="dt"
			value="#{backingBean.managedBean.smAppl.smSupplierBranches}"
			selection="#{backingBean.managedBean.selectedBranches}"
			rowKey="#{branchBean.supplierBranchId}" rowIndexVar="index">

			<p:column selectionMode="multiple" width="5%" />
			<p:column headerText="NO.">
				<h:outputText value="#{index+1}" />
			</p:column>

			<p:column headerText="Branch Name">
				<h:outputText value="#{branchBean.branchName}" />
			</p:column>

			<p:column headerText="Address">
				<h:outputText
					value="#{branchBean.smAddress.address1},#{branchBean.smAddress.address2}" />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink id="selectButton" update=":form:display"
					oncomplete="banchDialog.show();"
					action="#{backingBean.assignSelBranch(branchBean)}">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" style="margin-right:2px;"/>
				</p:commandLink>
				
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add"
				action="#{backingBean.assignNewBranchBean}"
				oncomplete="banchDialog.show();" update=":form:display" />
			<p:commandButton value="Delete"
				action="#{backingBean.deleteSelectedBranches}" />

		</div>
		<br />
		<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
			<table style="width: 50%">
				<tr>
					<td style="padding-left: 38px;"><p:outputLabel
							value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" cols="41" /></td>
				</tr>
			</table>
		</p:outputPanel>
		<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
			<table style="width: 100%">
				<tr>
					<td style="padding-left: 38px;"><p:outputLabel
							value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" readonly="true"
							disabled="true" cols="41" /></td>
					<td style="padding-left: 22px;"><p:outputLabel
							value="Approver Remarks" /></td>
					<td><p:inputTextarea autoResize="true" cols="41" /></td>

				</tr>
			</table>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="450px" header="Branch Details" widgetVar="banchDialog"
		id="display" resizable="false" showEffect="fade" hideEffect="fade"
		modal="true">
		<!-- <p:panel header="Branch Details"> -->
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Branch Name" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedBranch.branchName}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Address" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedBranch.smAddress.address1}"
						size="35" /></td>
			</tr>

			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedBranch.smAddress.address2}"
						size="35" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedBranch.smAddress.address3}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Country" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedBranch.smAddress.pmCountry.countryCode}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItem itemLabel="Malaysia" itemValue="MY" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedBranch.smAddress.postcode}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedBranch.smAddress.pmState.stateCode}"
						size="35" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedBranch.smAddress.pmDistrict.districtCode}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedBranch.smAddress.pmCity.cityCode}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Phone NO." /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedBranch.smAddress.phoneNo}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Fax NO." /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedBranch.smAddress.faxNo}"
						size="35" /></td>
			</tr>

		</table>
		<!-- </p:panel> -->
		<br />
		<div align="right">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdateBranchToSmAppl}"
				oncomplete="banchDialog.hide();" type="submit" partialSubmit="true"
				process="display" update=":form:dt" />
			<p:commandButton value="Cancel" onclick="banchDialog.hide();" />
		</div>
	</p:dialog>

</ui:composition>
