<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.branch.panHdr']} " toggleable="true"
		id="sample">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.branchVerified}"
							id="poBrcVer">
							<p:ajax update=":form:tt:brnInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.branchVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.branchVerified}"
							id="apprBrcVer">
							<p:ajax update=":form:tt:brnInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.branchVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />

		<p:panel id="brnInfPan">
			<p:blockUI block=":form:tt:brnInfPan" widgetVar="buiPoBrn"
				id="poBrnBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.branchVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.branchVerified : false)}" />

			<p:dataTable var="branchBean" id="dt" widgetVar="suppBrnachDtWidVar"
				value="#{backingBean.managedBean.smAppl.smSupplierBranches}"
				selection="#{backingBean.managedBean.selectedBranches}"
				rowKey="#{branchBean}" rowIndexVar="index">
				<ac:paginator for="dt" />

				<p:column selectionMode="multiple" width="5%" />

				<p:column headerText="#{lbl['lbl.sm.branch.branchName']}">
					<h:outputText value="#{branchBean.branchName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.companyaddress']}">
					<h:outputText
						value="#{branchBean.smAddress.address1},#{branchBean.smAddress.address2}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink id="selectButton" update=":form:tt:banchDialog"
						partialSubmit="true" process="@this"
						action="#{backingBean.assignSelBranch(branchBean,index)}">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png"
							style="margin-right:2px;" />
					</p:commandLink>

				</p:column>
			</p:dataTable>

			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					action="#{backingBean.assignNewBranchBean}" partialSubmit="true"
					process="@this" update=":form:tt:banchDialog" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					partialSubmit="true" process="brnInfPan"
					action="#{backingBean.deleteSelectedBranches}" update=":form:tt:dt" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.branchRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.branchRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.branchRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="450px" height="430px"
		header="#{lbl['lbl.sm.branch.branchDiaHdr']}" widgetVar="banchDialog"
		id="banchDialog" resizable="false" showEffect="fade" hideEffect="fade"
		modal="true" closable="false">
		<p:messages id="suppBranchMsg" showSummary="false" showDetail="true"
			autoUpdate="true" closable="true" />
		<ui:fragment
			rendered="#{backingBean.managedBean.smAppl.supplierType eq 'K' or backingBean.managedBean.smAppl.supplierType eq 'J'}">
			<ui:include src="branchDetailsTablePage.xhtml" />
		</ui:fragment>
		<p:panel header="Branch Details" toggleable="true"
			rendered="#{backingBean.managedBean.smAppl.supplierType eq 'MKM'}">
			<ui:include src="branchDetailsTablePageConsultant.xhtml" />
		</p:panel>

		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				id="branchPopUpSaveBtn"
				action="#{backingBean.addOrUpdateBranchToSmAppl}"
				partialSubmit="true" process="banchDialog"
				update=":form:tt:dt,@([id$=Msg])" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				partialSubmit="true" process="@this"
				action="#{backingBean.assignCancelBranchBean}" />
		</div>
	</p:dialog>
</ui:composition>
