<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:messages id="perMsg" showSummary="true" showDetail="true"
		autoUpdate="true" closable="true" />
	<p:panel header="#{lbl['lbl.sm.person.panHdr']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.person.name']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.name}"
						size="35" /></td>
				<td><p:outputLabel value="* #{lbl['lbl.sm.person.nationality']}" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedPersonnel.pmCountry.countryId}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="shrOffCountry"
							value="#{backingBean.managedBean.countryLs}"
							itemValue="#{shrOffCountry.countryId}"
							itemLabel="#{shrOffCountry.countryName}" />
					</p:selectOneMenu></td>


			</tr>
			<tr>

				<td><p:outputLabel value="* #{lbl['lbl.sm.userprofile.detailsicno']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.identificationNo}"
						size="35" /></td>
				<!-- <td><p:outputLabel value="* Race" title="For Malaysian Only" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="Select One" itemValue="1" />
						<f:selectItem itemLabel="Melayu" itemValue="M" />
						<f:selectItem itemLabel="Chinese" itemValue="C" />
						<f:selectItem itemLabel="Indian" itemValue="I" />
					</p:selectOneMenu></td> -->
				<td><p:outputLabel value="* #{lbl['lbl.sm.person.dob']}" /></td>
				<td><p:calendar showOn="button"
						value="#{backingBean.managedBean.selectedPersonnel.birthDate}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.userprofile.designation']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.designation}"
						size="35" /></td>
				<c:choose>
					<c:when
						test="#{backingBean.managedBean.selectedPersonnel.dirOrHghrMngmt or backingBean.managedBean.selectedPersonnel.director or backingBean.managedBean.selectedPersonnel.higherManagement}">
						<td><p:outputLabel value="* #{lbl['lbl.sm.person.role']} : " /></td>
						<td>
							<table>
								<tr>
									<td><p:selectBooleanCheckbox
											value="#{backingBean.managedBean.selectedPersonnel.director}" /></td>
									<td><p:outputLabel value="#{lbl['lbl.sm.person.dir']}" /></td>
									<td><p:selectBooleanCheckbox
											value="#{backingBean.managedBean.selectedPersonnel.higherManagement}" /></td>
									<td><p:outputLabel value="#{lbl['lbl.sm.person.hghMngmt']}" /></td>
								</tr>

							</table>
						</td>
					</c:when>
					<c:otherwise>
						<c:choose>
							<c:when
								test="#{backingBean.managedBean.smAppl.supplierType eq 'K'}">
								<td><p:outputLabel value="* #{lbl['lbl.sm.person.role']}" /></td>
								<td>
									<table>
										<tr>
											<td><p:selectOneMenu
													value="#{backingBean.managedBean.selectedPersonnel.staffRoleFlg}">
													<f:selectItems
														value="#{backingBean.getDropdownValues('KPT')}" />
												</p:selectOneMenu></td>
										</tr>

									</table>
								</td>
							</c:when>
							<c:otherwise>
								<td><p:outputLabel value="* #{lbl['lbl.sm.person.role']}" /></td>
								<td>
									<table>
										<tr>
											<td><p:selectOneMenu
													value="#{backingBean.managedBean.selectedPersonnel.staffRoleFlg}">
													<f:selectItems
														value="#{backingBean.getDropdownValues('JPT')}" />
												</p:selectOneMenu></td>
										</tr>

									</table>
								</td>
							</c:otherwise>

						</c:choose>

					</c:otherwise>
				</c:choose>


			</tr>
			<!--<tr>

				 <td><p:outputLabel value="* Branch Associated" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="Select One" itemValue="1" />
						<f:selectItems
							value="#{backingBean.managedBean.smAppl.smSupplierBranches}"
							var="supBean" itemLabel="#{supBean.branchName}"
							itemValue="#{supBean.branchName}" />
					</p:selectOneMenu></td> 

			</tr>-->

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.epfNo']}" /></td>
				<td><p:inputText title="For Malaysian Only"
						value="#{backingBean.managedBean.selectedPersonnel.epfNo}"
						size="35" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.exp']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.workExperienceYear}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.email']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.email}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.bumi']}" title="For Malaysian Only" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedPersonnel.bumiFlg}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
					</p:selectOneRadio></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.religion']}" title="For Malaysian Only" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedPersonnel.muslimFlg}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.person.religion.muslim']}" itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.person.religion.non.muslim']}" itemValue="0" />
					</p:selectOneRadio></td>

			</tr>

		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.personnel.dir.highmngmnt.privilege']}"
		toggleable="true" id="mngmtPrivPanel"
		rendered="#{backingBean.managedBean.smAppl.smCompanyBasic.withFederal and backingBean.managedBean.smAppl.supplierType eq 'K' and (backingBean.managedBean.selectedPersonnel.authorizedFlg eq '1' or backingBean.managedBean.authPerCount lt '5')}">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.isAuth']}" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedPersonnel.authorizedFlg}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
						<p:ajax event="change" update="mngmtPrivPanel"
							listener="#{backingBean.assignShareHolderPrivilege}" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.isSoftCert']}"
						rendered="#{backingBean.managedBean.selectedPersonnel.authorizedFlg eq '1'}" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedPersonnel.softcertFlg}"
						rendered="#{backingBean.managedBean.selectedPersonnel.authorizedFlg eq '1'}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="2" />
						<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
						<p:ajax event="change" update="mngmtPrivPanel"
							listener="#{backingBean.assignShareHolderPrivilege}" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.person.isContrSign']}"
						rendered="#{backingBean.managedBean.selectedPersonnel.softcertFlg eq '1'}" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedPersonnel.contractSignerFlg}"
						rendered="#{backingBean.managedBean.selectedPersonnel.softcertFlg eq '1'}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
					</p:selectOneRadio></td>
			</tr>
		</table>

	</p:panel>
	<p:panel header="#{lbl['lbl.sm.personnel.shareholder.privilege']}" toggleable="true"
		id="mngmtPrivPanel1"
		rendered="#{backingBean.managedBean.smAppl.smCompanyBasic.withFederal and backingBean.managedBean.smAppl.supplierType eq 'K' and backingBean.managedBean.authPerCount eq '5'}">
		<table>
			<tr>
				<td><h:outputText value="#{lbl['lbl.sm.person.authMsg']}" /></td>
			</tr>
		</table>

	</p:panel>
	<p:panel header="#{lbl['lbl.sm.job.function.details']}" toggleable="true">
		<p:dataTable id="perMngJfdt"
			value="#{backingBean.managedBean.selectedPersonnel.smStaffExperiences}"
			var="jf"
			selection="#{backingBean.managedBean.selectedShrHldrJobFunctions}"
			rowIndexVar="rowIndex" rowKey="#{jf}">
			<ac:paginator for="perMngJfdt" />
			<p:column selectionMode="multiple" style="width:2%" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.assocCmpny.companyName']}" />
				</f:facet>
				<p:inputText value="#{jf.companyName}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.userprofile.designation']}" />
				</f:facet>
				<p:inputText value="#{jf.designation}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.year.from']}" />
				</f:facet>
				<p:inputText value="#{jf.fromYear}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.year.to']}" />
				</f:facet>
				<p:inputText value="#{jf.toYear}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}"
				action="#{backingBean.addShrHldrJobFunction(backingBean.managedBean.selectedPersonnel.equityOwner)}"
				update="perMngJfdt" />
			<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
				action="#{backingBean.deleteSelectedShrHldrJobFunction(backingBean.managedBean.selectedPersonnel.equityOwner)}"
				update="perMngJfdt" />
		</div>
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.related.company.details']}" toggleable="true">

		<p:dataTable id="perMngRelCom"
			value="#{backingBean.managedBean.selectedPersonnel.smRelatedCompanies}"
			var="relCom"
			selection="#{backingBean.managedBean.selectedShrHldrRelatedCompanies}"
			rowIndexVar="rowIndex" rowKey="#{relCom}">
			<ac:paginator for="perMngRelCom" />
			<p:column selectionMode="multiple" style="width:2%" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.assocCmpny.companyName']}" />
				</f:facet>
				<p:inputText value="#{relCom.companyName}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.spec.roc.no']}" />
				</f:facet>
				<p:inputText value="#{relCom.regNo}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.userprofile.designation']}" />
				</f:facet>
				<p:inputText value="#{relCom.designation}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.shareholding.total.rm']}" />
				</f:facet>
				<p:inputText value="#{relCom.shareAmt}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.equiComp.shrPerc']}" />
				</f:facet>
				<p:inputText value="#{relCom.sharePercentage}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.mof.reg.no']}" />
				</f:facet>
				<p:inputText value="#{relCom.mofNo}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}"
				action="#{backingBean.addShrHldrRelatedCompany(backingBean.managedBean.selectedPersonnel.equityOwner)}"
				update="perMngRelCom" />
			<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
				action="#{backingBean.deleteSelectedShrHldrRelatedCompanies(backingBean.managedBean.selectedPersonnel.equityOwner)}"
				update="perMngRelCom" />
		</div>
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.profBody.panHdr']}" toggleable="true">
		<p:dataTable var="profBean"
			value="#{backingBean.managedBean.selectedPersonnel.smAssociationBodies}"
			selection="#{backingBean.managedBean.selectedShrHldrProfBodies}"
			rowKey="#{profBean}" rowIndexVar="index" id="perMngProfDt">
			<ac:paginator for="perMngProfDt" />
			<p:column selectionMode="multiple" width="5%" />


			<p:column headerText="#{lbl['lbl.sm.profBody.profBody']}">
				<p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
					value="#{profBean.pmCertBody.certBodyId}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="0" />
					<f:selectItems var="shrProfBody"
						value="#{backingBean.managedBean.profBodyLs}"
						itemValue="#{shrProfBody.certBodyId}"
						itemLabel="#{shrProfBody.bodyName}" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.regno']}">
				<p:inputText size="35" value="#{profBean.regNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.prof.enddate']}">
				<p:calendar showOn="button" value="#{profBean.expDate}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}"
				action="#{backingBean.addShrHldrProfBody(backingBean.managedBean.selectedPersonnel.equityOwner)}"
				update="perMngProfDt" />
			<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
				action="#{backingBean.deleteSelectedShrHldrProfBodies(backingBean.managedBean.selectedPersonnel.equityOwner)}"
				update="perMngProfDt" />
		</div>
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.academic.qualification']}" toggleable="true">

		<p:dataTable id="perMngAqdt"
			value="#{backingBean.managedBean.selectedPersonnel.smStaffAcademics}"
			var="aq"
			selection="#{backingBean.managedBean.selectedShrHldrAcademics}"
			rowIndexVar="rowIndex" rowKey="#{aq}">
			<ac:paginator for="perMngAqdt" />
			<p:column selectionMode="multiple" style="width:2%" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.year']}" />
				</f:facet>
				<p:selectOneMenu style="margin-bottom: 5px;" value="#{aq.year}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="1" />
					<f:selectItem itemLabel="2013" itemValue="2013" />
					<f:selectItem itemLabel="2012" itemValue="2012" />
					<f:selectItem itemLabel="2011" itemValue="2011" />
				</p:selectOneMenu>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.institute']}" />
				</f:facet>
				<p:inputText value="#{aq.instituteName}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.qualification.level']}" />
				</f:facet>
				<p:selectOneMenu style="margin-bottom: 5px;"
					value="#{aq.qualificationLevelId}">
					<f:selectItems value="#{backingBean.getDropdownValues('QL')}" />
				</p:selectOneMenu>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.education.field']}" />
				</f:facet>
				<p:selectOneMenu style="margin-bottom: 5px;"
					value="#{aq.pmEduField.eduFieldId}">
					<f:selectItems var="eduField"
						value="#{backingBean.managedBean.eduFieldList}"
						itemValue="#{eduField.eduFieldId}"
						itemLabel="#{eduField.fieldName}" />
				</p:selectOneMenu>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.major.in']}" />
				</f:facet>
				<p:inputText value="#{aq.fieldMajor}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}"
				action="#{backingBean.addShrHldrAcademicQualification(backingBean.managedBean.selectedPersonnel.equityOwner)}"
				update="perMngAqdt" />
			<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
				action="#{backingBean.deleteSelectedShrHldrAcademics(backingBean.managedBean.selectedPersonnel.equityOwner)}"
				update="perMngAqdt" />
		</div>
	</p:panel>
</ui:composition>
