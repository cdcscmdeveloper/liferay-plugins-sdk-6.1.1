<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Personnel Info" toggleable="true">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value=" Name *" /></td>
				<td><p:inputText /></td>
				<td><p:outputLabel value="Nationality *" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One--" itemValue="1" />
						<f:selectItem itemLabel="Malaysian" itemValue="1" />
						<f:selectItem itemLabel="Chinese" itemValue="1" />
						<f:selectItem itemLabel="Indian" itemValue="1" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="Race*" title="For Malaysian Only" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Others--" itemValue="1" />
						<f:selectItem itemLabel="Melayu" itemValue="1" />
						<f:selectItem itemLabel="Chinese" itemValue="1" />
						<f:selectItem itemLabel="Indian" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value=" New IC/Pspt No. *" /></td>
				<td><p:inputText /></td>
				<td><p:outputLabel value=" Old IC/Pspt No. *" /></td>
				<td><p:inputText /></td>
				<td><p:outputLabel value=" DOB *" /></td>
				<td><p:calendar showOn="button" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value=" Bumi *" title="For Malaysian Only" /></td>
				<td><p:selectOneRadio>
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="2" />
					</p:selectOneRadio></td>
				<td><p:outputLabel value=" Religion *"
						title="For Malaysian Only" /></td>
				<td><p:selectOneRadio>
						<f:selectItem itemLabel="Islam" itemValue="1" />
						<f:selectItem itemLabel="Non-Islam" itemValue="2" />
					</p:selectOneRadio></td>
				<td><p:outputLabel value=" EPF No." /></td>
				<td><p:inputText title="For Malaysian Only" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Branch Associated *" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One--" itemValue="1" />
						<f:selectItem itemLabel="Branch1" itemValue="1" />
						<f:selectItem itemLabel="Branch2" itemValue="1" />
						<f:selectItem itemLabel="Branch3" itemValue="1" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value=" Designation *" /></td>
				<td><p:inputText /></td>
				<td><p:outputLabel value=" Experience" /></td>
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Roles In Company *" /></td>
				<!-- <td><p:pickList  /></td> -->
				<td><p:inputText /></td>
				<td><p:outputLabel value=" Job Function *" /></td>
				<td><p:inputTextarea /></td>
				<td><p:outputLabel value=" Email " /></td>
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td align="right"><p:selectBooleanCheckbox /></td>
				<td><p:outputLabel value="Authorized User" /></td>
				<td align="right"><p:selectBooleanCheckbox /></td>
				<td><p:outputLabel value="Issue Soft Cert" /></td>
			</tr>

		</table>

	</p:panel>
	<p:panel
		header="Academic Qualification ( All fields in this section Mandatory for consultant)"
		toggleable="true">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value=" Institution *" /></td>
				<td><p:inputText /></td>
				<td><p:outputLabel value="Year *" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One--" itemValue="1" />
						<f:selectItem itemLabel="2013" itemValue="1" />
						<f:selectItem itemLabel="2012" itemValue="1" />
						<f:selectItem itemLabel="2011" itemValue="1" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="Qualification"
						title="For Malaysian Only" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Others--" itemValue="1" />
						<f:selectItem itemLabel="Graduate" itemValue="1" />
						<f:selectItem itemLabel="Post Graduate" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Educational Field *" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One--" itemValue="1" />
						<f:selectItem itemLabel="Computers" itemValue="1" />
						<f:selectItem itemLabel="Mechanical" itemValue="1" />
						<f:selectItem itemLabel="Civil" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>



		</table>

	</p:panel>
	<p:panel header="Address Info" toggleable="true">

		<table style="width: 100%">
			<tr>
				<td valign="top" width="50%">

					<table style="width: 100%">
						<tr>
							<td><u><b> <h:outputText
											value="Permenant Address : " /></b></u></td>
							<td></td>
						</tr>
						<tr>
							<td><p:outputLabel value="Address" /></td>
							<td><p:inputText /></td>
						</tr>

						<tr>
							<td></td>
							<td><p:inputText /></td>
						</tr>
						<tr>
							<td></td>
							<td><p:inputText /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="Country *" /></td>
							<td><p:selectOneMenu>
									<f:selectItem itemLabel="-- Select One -- " itemValue="" />
									<f:selectItem itemLabel="Malaysia" itemValue="1" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
							<td><p:inputText /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
							<td><p:inputText /></td>
						</tr>

						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
							<td><p:inputText /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
							<td><p:inputText /></td>
						</tr>
						<tr>
							<td><p:outputLabel value=" Phn No. *" /></td>
							<td><p:inputText /></td>
						</tr>
					</table>

				</td>
				<td valign="top">

					<table style="width: 100%">
						<tr>
							<td><u><b><h:outputText value="Mailing Address : " /></b></u>
								<p:selectBooleanCheckbox /> <h:outputText
									value=" Same as permenant: " /></td>
							<td></td>
						</tr>
						<tr>
							<td><p:outputLabel value="Address" /></td>
							<td><p:inputText /></td>
						</tr>

						<tr>
							<td></td>
							<td><p:inputText /></td>
						</tr>
						<tr>
							<td></td>
							<td><p:inputText /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="Country *" /></td>
							<td><p:selectOneMenu>
									<f:selectItem itemLabel="-- Select One -- " itemValue="" />
									<f:selectItem itemLabel="Malaysia" itemValue="1" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
							<td><p:inputText /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
							<td><p:inputText /></td>
						</tr>

						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
							<td><p:inputText /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
							<td><p:inputText /></td>
						</tr>
						<tr>
							<td><p:outputLabel value=" Phn No. *" /></td>
							<td><p:inputText /></td>
						</tr>
					</table>

				</td>
			</tr>

		</table>
	</p:panel>

</ui:composition>
