<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Personnel Info" toggleable="true">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Name" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.name}" /></td>
				<td><p:outputLabel value="* Nationality" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedPersonnel.nationalityId}">
						<f:selectItem itemLabel="-- Select One--" itemValue="1" />
						<f:selectItem itemLabel="Malaysian" itemValue="2" />
						<f:selectItem itemLabel="Chinese" itemValue="3" />
						<f:selectItem itemLabel="Indian" itemValue="4" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value="* IC/Pspt No." /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.identificationNo}" /></td>
				<td><p:outputLabel value="Race*" title="For Malaysian Only" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedPersonnel.race}">
						<f:selectItem itemLabel="-- Others--" itemValue="1" />
						<f:selectItem itemLabel="Melayu" itemValue="M" />
						<f:selectItem itemLabel="Chinese" itemValue="C" />
						<f:selectItem itemLabel="Indian" itemValue="I" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value="* DOB" /></td>
				<td><p:calendar showOn="button"
						value="#{backingBean.managedBean.selectedPersonnel.birthDate}" /></td>
				<td><p:outputLabel value="* Personnel Type" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedPersonnel.personnelType}">
						<f:selectItem itemLabel="-- Select One--" itemValue="" />
						<f:selectItem itemLabel="BOD" itemValue="B" />
						<f:selectItem itemLabel="Management Staff" itemValue="M" />
						<f:selectItem itemLabel="Normal Staff" itemValue="N" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value=" EPF NO." /></td>
				<td><p:inputText title="For Malaysian Only"
						value="#{backingBean.managedBean.selectedPersonnel.epfNo}" /></td>
				<td><p:outputLabel value=" Experience" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.workExperienceYear}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value=" Designation" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.designation}" /></td>
				<td><p:outputLabel value="* Branch Associated" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select " itemValue="1" />
						<f:selectItems
							value="#{backingBean.managedBean.smAppl.smSupplierBranches}"
							var="supBean" itemLabel="#{supBean.branchName}"
							itemValue="#{supBean.branchName}" />
					</p:selectOneMenu></td>


			</tr>
			<tr>
				<td><p:outputLabel value="Email" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.email}" /></td>
				<td><p:outputLabel value="* Job Function" /></td>
				<td><p:inputTextarea
						value="#{backingBean.managedBean.selectedPersonnel.jobFunction}" /></td>

			</tr>
			<tr>
				<td style="float: right; padding-right: 20px;"><p:selectBooleanCheckbox
						value="#{backingBean.managedBean.selectedPersonnel.authorized}" /></td>
				<td><h:outputText value="Authorized User" /></td>
				<td style="float: right; padding-right: 20px;"><p:selectBooleanCheckbox
						value="#{backingBean.managedBean.selectedPersonnel.softcert}" /></td>
				<td><h:outputText value="Issue Soft Cert" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value=" Bumi " title="For Malaysian Only" /></td>
				<td><p:selectOneRadio>
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
					</p:selectOneRadio></td>
				<td><p:outputLabel value=" Religion "
						title="For Malaysian Only" /></td>
				<td><p:selectOneRadio>
						<f:selectItem itemLabel="Islam" itemValue="0" />
						<f:selectItem itemLabel="Non-Islam" itemValue="1" />
					</p:selectOneRadio></td>

			</tr>

		</table>

	</p:panel>
	<p:panel header="Academic Qualification" toggleable="true">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Institution" /></td>
				<td><p:inputText /></td>
				<td><p:outputLabel value="Year " /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One--" itemValue="1" />
						<f:selectItem itemLabel="2013" itemValue="2013" />
						<f:selectItem itemLabel="2012" itemValue="2012" />
						<f:selectItem itemLabel="2011" itemValue="2011" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value="Educational Field" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One--" itemValue="1" />
						<f:selectItem itemLabel="Computers" itemValue="1" />
						<f:selectItem itemLabel="Mechanical" itemValue="1" />
						<f:selectItem itemLabel="Civil" itemValue="1" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="Qualification"
						title="For Malaysian Only" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Others--" itemValue="1" />
						<f:selectItem itemLabel="Graduate" itemValue="1" />
						<f:selectItem itemLabel="Post Graduate" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>



		</table>

	</p:panel>
	<p:panel header="Address Info" toggleable="true">

		<table style="width: 100%">
			<tr>
				<td valign="top" width="50%">

					<table style="width: 100%">
						<tr>
							<td><u><b> <h:outputText
											value="Permenant Address : " /></b></u></td>
							<td></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Address" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.address1}" /></td>
						</tr>

						<tr>
							<td></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.address2}" /></td>
						</tr>
						<tr>
							<td></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.address3}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Country" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.pmCountry.countryCode}">
									<f:selectItem itemLabel="-- Select One -- " itemValue="" />
									<f:selectItem itemLabel="Malaysia" itemValue="1" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.postcode}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.pmState.stateCode}" /></td>
						</tr>

						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.pmDistrict.districtCode}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.pmCity.cityCode}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="Phone NO." /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.phoneNo}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="Fax NO." /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.faxNo}" /></td>
						</tr>
					</table>

				</td>
				<td valign="top">

					<table style="width: 100%">
						<tr>
							<td><u><b><h:outputText value="Mailing Address : " /></b></u>
							</td>
							<td><table style="width: 100%">
									<tr>
										<td><p:selectBooleanCheckbox /></td>
										<td><h:outputText value=" Same as permenant: " /></td>
									</tr>
								</table></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Address" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.address1}" /></td>
						</tr>

						<tr>
							<td></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.address2}" /></td>
						</tr>
						<tr>
							<td></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.address3}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Country" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.pmCountry.countryCode}">
									<f:selectItem itemLabel="-- Select One -- " itemValue="" />
									<f:selectItem itemLabel="Malaysia" itemValue="1" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.postcode}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.pmState.stateCode}" /></td>
						</tr>

						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.pmDistrict.districtCode}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.pmCity.cityCode}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="Phone NO." /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.phoneNo}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="Fax NO." /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.faxNo}" /></td>
						</tr>
					</table>

				</td>
			</tr>

		</table>
	</p:panel>

</ui:composition>
