<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Personnel Info" toggleable="true">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Name" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.name}"
						size="35" /></td>
				<td><p:outputLabel value="* Nationality" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One--" itemValue="1" />
						<f:selectItem itemLabel="Malaysian" itemValue="2" />
						<f:selectItem itemLabel="Chinese" itemValue="3" />
						<f:selectItem itemLabel="Indian" itemValue="4" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value="* IC/Pspt No." /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.identificationNo}"
						size="35" /></td>
				<td><p:outputLabel value="Race*" title="For Malaysian Only" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Others--" itemValue="1" />
						<f:selectItem itemLabel="Melayu" itemValue="M" />
						<f:selectItem itemLabel="Chinese" itemValue="C" />
						<f:selectItem itemLabel="Indian" itemValue="I" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value="* DOB" /></td>
				<td><p:calendar showOn="button"
						value="#{backingBean.managedBean.selectedPersonnel.birthDate}" /></td>
				<td><p:outputLabel value="* Personnel Type" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedPersonnel.personnelType}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One--" itemValue="" />
						<f:selectItem itemLabel="BOD" itemValue="B" />
						<f:selectItem itemLabel="Management Staff" itemValue="M" />
						<f:selectItem itemLabel="Normal Staff" itemValue="N" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value=" Designation" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.designation}"
						size="35" /></td>
				<td><p:outputLabel value="* Branch Associated" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select " itemValue="1" />
						<f:selectItems
							value="#{backingBean.managedBean.smAppl.smSupplierBranches}"
							var="supBean" itemLabel="#{supBean.branchName}"
							itemValue="#{supBean.branchName}" />
					</p:selectOneMenu></td>


			</tr>
			<tr>
				<td><p:outputLabel value=" EPF NO." /></td>
				<td><p:inputText title="For Malaysian Only"
						value="#{backingBean.managedBean.selectedPersonnel.epfNo}"
						size="35" /></td>
				<td><p:outputLabel value=" Experience" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.workExperienceYear}"
						size="35" /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="Email" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.email}"
						size="35" /></td>
				<td><p:outputLabel value="* Job Function" /></td>
				<td><p:inputTextarea
						value="#{backingBean.managedBean.selectedPersonnel.jobFunction}"
						cols="36" /></td>

			</tr>

			<tr>
				<td><p:outputLabel value="Bumi" title="For Malaysian Only" /></td>
				<td><p:selectOneRadio>
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
					</p:selectOneRadio></td>
				<td><p:outputLabel value=" Religion" title="For Malaysian Only" /></td>
				<td><p:selectOneRadio>
						<f:selectItem itemLabel="Islam" itemValue="1" />
						<f:selectItem itemLabel="Non-Islam" itemValue="0" />
					</p:selectOneRadio></td>

			</tr>
		</table>
	</p:panel>
	<p:panel header="Personnel Priviliges" toggleable="true"
		id="perPrivPanel">
		<table>
			<tr>
				<td><p:outputLabel value="Is this an authorized personnel ? " /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedPersonnel.authorizedFlg}">
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
						<p:ajax event="change" update="perPrivPanel"
							listener="#{backingBean.assignPersonnelPrivilege}" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Issue soft cert to this personnel ? "
						rendered="#{backingBean.managedBean.selectedPersonnel.authorizedFlg eq '1' and (backingBean.managedBean.smAppl.applType eq 'R' or backingBean.managedBean.smAppl.applType eq 'N')}" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedPersonnel.softcertFlg}"
						rendered="#{backingBean.managedBean.selectedPersonnel.authorizedFlg eq '1' and (backingBean.managedBean.smAppl.applType eq 'R' or backingBean.managedBean.smAppl.applType eq 'N')}">
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
						<p:ajax event="change" update="perPrivPanel"
							listener="#{backingBean.assignPersonnelPrivilege}" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="Is this personnel a contract signer ? "
						rendered="#{backingBean.managedBean.selectedPersonnel.softcertFlg eq '1' and (backingBean.managedBean.smAppl.applType eq 'R' or backingBean.managedBean.smAppl.applType eq 'N')}" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedPersonnel.contractSignerFlg}"
						rendered="#{backingBean.managedBean.selectedPersonnel.softcertFlg eq '1' and (backingBean.managedBean.smAppl.applType eq 'R' or backingBean.managedBean.smAppl.applType eq 'N')}">
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
						<p:ajax event="change" update="perPrivPanel" />
					</p:selectOneRadio></td>
			</tr>
		</table>

	</p:panel>
	<p:panel header="Academic Qualification" toggleable="true">

		<table style="width: 100%">
			<tr>
				<td width="85px;"><p:outputLabel value="* Institution" /></td>
				<td style="padding-right: 42px;"><p:inputText size="35" /></td>
				<td><p:outputLabel value="Year " /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select --" itemValue="1" />
						<f:selectItem itemLabel="2013" itemValue="2013" />
						<f:selectItem itemLabel="2012" itemValue="2012" />
						<f:selectItem itemLabel="2011" itemValue="2011" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value=" Field" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select --" itemValue="1" />
						<f:selectItem itemLabel="Computers" itemValue="1" />
						<f:selectItem itemLabel="Mechanical" itemValue="1" />
						<f:selectItem itemLabel="Civil" itemValue="1" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="Qualification"
						title="For Malaysian Only" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Others--" itemValue="1" />
						<f:selectItem itemLabel="Graduate" itemValue="1" />
						<f:selectItem itemLabel="Post Graduate" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>



		</table>

	</p:panel>
	<p:panel header="Address Info" toggleable="true">

		<table style="width: 100%">
			<tr>
				<td valign="top" width="50%">

					<table style="width: 100%">
						<tr>
							<td><u><b> <h:outputText
											value="Permenant Address : " /></b></u></td>
							<td></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Address" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.address1}"
									size="35" /></td>
						</tr>

						<tr>
							<td></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.address2}"
									size="35" /></td>
						</tr>
						<tr>
							<td></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.address3}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Country" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.pmCountry.countryCode}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="Malaysia" itemValue="1" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.postcode}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.pmState.stateCode}"
									size="35" readonly="true" disabled="true" /></td>
						</tr>

						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.pmDistrict.districtCode}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.pmCity.cityCode}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="Phone NO." /></td>
							<td><p:inputText size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="Fax NO." /></td>
							<td><p:inputText size="35" /></td>
						</tr>
					</table>

				</td>
				<td valign="top">

					<table style="width: 100%">
						<tr>
							<td><u><b><h:outputText value="Mailing Address : " /></b></u>
							</td>
							<td><table style="width: 100%">
									<tr>
										<td><p:selectBooleanCheckbox /></td>
										<td><h:outputText value=" Same as permenant: " /></td>
									</tr>
								</table></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Address" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.address1}"
									size="35" /></td>
						</tr>

						<tr>
							<td></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.address2}"
									size="35" /></td>
						</tr>
						<tr>
							<td></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.address3}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Country" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.pmCountry.countryCode}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="Malaysia" itemValue="1" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.postcode}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.pmState.stateCode}"
									size="35" readonly="true" disabled="true" /></td>
						</tr>

						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.pmDistrict.districtCode}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.pmCity.cityCode}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="Phone NO." /></td>
							<td><p:inputText size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="Fax NO." /></td>
							<td><p:inputText size="35" /></td>
						</tr>
					</table>

				</td>
			</tr>

		</table>
	</p:panel>

</ui:composition>
