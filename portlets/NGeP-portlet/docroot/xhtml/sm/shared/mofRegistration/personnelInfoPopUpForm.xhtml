<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Personnel Info" toggleable="true">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Name" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.name}"
						size="35" /></td>
				<td><p:outputLabel value="* Nationality" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One--" itemValue="1" />
						<f:selectItem itemLabel="Malaysian" itemValue="2" />
						<f:selectItem itemLabel="Chinese" itemValue="3" />
						<f:selectItem itemLabel="Indian" itemValue="4" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value="* IC/Pspt No." /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.identificationNo}"
						size="35" /></td>
				<td><p:outputLabel value="Race*" title="For Malaysian Only" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Others--" itemValue="1" />
						<f:selectItem itemLabel="Melayu" itemValue="M" />
						<f:selectItem itemLabel="Chinese" itemValue="C" />
						<f:selectItem itemLabel="Indian" itemValue="I" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value="* DOB" /></td>
				<td><p:calendar showOn="button"
						value="#{backingBean.managedBean.selectedPersonnel.birthDate}" /></td>
				<td><p:outputLabel value="* Personnel Type" /></td>
				<td><p:selectOneRadio>
						<f:selectItem itemLabel="Management Personnel" itemValue="1" />
						<f:selectItem itemLabel="Staff" itemValue="0" />
					</p:selectOneRadio></td>

			</tr>
			<tr>
				<td><p:outputLabel value=" Designation" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.designation}"
						size="35" /></td>
				<td><p:outputLabel value="* Branch Associated" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select " itemValue="1" />
						<f:selectItems
							value="#{backingBean.managedBean.smAppl.smSupplierBranches}"
							var="supBean" itemLabel="#{supBean.branchName}"
							itemValue="#{supBean.branchName}" />
					</p:selectOneMenu></td>


			</tr>
			<tr>
				<td><p:outputLabel value=" EPF NO." /></td>
				<td><p:inputText title="For Malaysian Only"
						value="#{backingBean.managedBean.selectedPersonnel.epfNo}"
						size="35" /></td>
				<td><p:outputLabel value=" Experience" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.workExperienceYear}"
						size="35" /></td>
			</tr>


			<tr>
				<td><p:outputLabel value="Email" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedPersonnel.email}"
						size="35" /></td>
				<td><p:outputLabel value="* Job Function" /></td>
				<td><p:inputTextarea
						value="#{backingBean.managedBean.selectedPersonnel.jobFunction}"
						cols="36" /></td>

			</tr>

			<tr>
				<td><p:outputLabel value="Bumi" title="For Malaysian Only" /></td>
				<td><p:selectOneRadio>
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
					</p:selectOneRadio></td>
				<td><p:outputLabel value=" Religion" title="For Malaysian Only" /></td>
				<td><p:selectOneRadio>
						<f:selectItem itemLabel="Islam" itemValue="1" />
						<f:selectItem itemLabel="Non-Islam" itemValue="0" />
					</p:selectOneRadio></td>

			</tr>
		</table>
	</p:panel>
	<p:panel header="Personnel Priviliges" toggleable="true"
		id="perPrivPanel">
		<table>
			<tr>
				<td><p:outputLabel value="Is this an authorized personnel ? " /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedPersonnel.authorizedFlg}">
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
						<p:ajax event="change" update="perPrivPanel"
							listener="#{backingBean.assignPersonnelPrivilege}" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Issue soft cert to this personnel ? "
						rendered="#{backingBean.managedBean.selectedPersonnel.authorizedFlg eq '1' and (backingBean.managedBean.smAppl.applType eq 'R' or backingBean.managedBean.smAppl.applType eq 'N')}" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedPersonnel.softcertFlg}"
						rendered="#{backingBean.managedBean.selectedPersonnel.authorizedFlg eq '1' and (backingBean.managedBean.smAppl.applType eq 'R' or backingBean.managedBean.smAppl.applType eq 'N')}">
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
						<p:ajax event="change" update="perPrivPanel"
							listener="#{backingBean.assignPersonnelPrivilege}" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="Is this personnel a contract signer ? "
						rendered="#{backingBean.managedBean.selectedPersonnel.softcertFlg eq '1' and (backingBean.managedBean.smAppl.applType eq 'R' or backingBean.managedBean.smAppl.applType eq 'N')}" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedPersonnel.contractSignerFlg}"
						rendered="#{backingBean.managedBean.selectedPersonnel.softcertFlg eq '1' and (backingBean.managedBean.smAppl.applType eq 'R' or backingBean.managedBean.smAppl.applType eq 'N')}">
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
						<p:ajax event="change" update="perPrivPanel" />
					</p:selectOneRadio></td>
			</tr>
		</table>

	</p:panel>
	<p:panel header="Job Function" toggleable="true">

		<p:dataTable id="perStfJfdt"
			value="#{backingBean.managedBean.jobFunctions}" var="jf"
			selection="#{backingBean.managedBean.selectedJobFunctions}"
			selectionMode="multiple" rowIndexVar="rowIndex" rowKey="#{jf}">
			<ac:paginator for="perStfJfdt" />
			<p:column selectionMode="multiple" style="width:2%" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="Year From" />
				</f:facet>
				<p:inputText />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Year To" />
				</f:facet>
				<p:inputText />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Company" />
				</f:facet>
				<p:inputText />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Designation" />
				</f:facet>
				<p:inputText />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="Add"
				action="#{backingBean.managedBean.addJobFunction}"
				update="perStfJfdt">
			</p:commandButton>
			<p:commandButton value="Delete">
			</p:commandButton>
		</div>
	</p:panel>
	<p:panel header="Related Companies" toggleable="true">

		<p:dataTable id="perStfRelCom"
			value="#{backingBean.managedBean.relatedCompanies}" var="relCom"
			selection="#{backingBean.managedBean.selectedRelatedCompanies}"
			selectionMode="multiple" rowIndexVar="rowIndex" rowKey="#{relCom}">
			<ac:paginator for="perStfRelCom" />
			<p:column selectionMode="multiple" style="width:2%" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="Company Name" />
				</f:facet>
				<p:inputText />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="ROC/ROB/ROS NO." />
				</f:facet>
				<p:inputText />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Designation" />
				</f:facet>
				<p:inputText />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Shareholding Total(RM.)" />
				</f:facet>
				<p:inputText />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Shareholding (%)" />
				</f:facet>
				<p:inputText />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="MOF Reg NO." />
				</f:facet>
				<p:inputText />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="Add"
				action="#{backingBean.managedBean.addRelatedCompany}"
				update="perStfRelCom">
			</p:commandButton>
			<p:commandButton value="Delete">
			</p:commandButton>
		</div>
	</p:panel>
	<p:panel header="Professional Body" toggleable="true">
		<p:dataTable var="profBean"
			value="#{backingBean.managedBean.profBodies}"
			selection="#{backingBean.managedBean.selectedProfBodies}"
			rowKey="#{profBean}" rowIndexVar="index" id="perStfProfDt">
			<ac:paginator for="perStfProfDt" />
			<p:column selectionMode="multiple" width="5%" />


			<p:column headerText="Professionl Body">
				<p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
					<f:selectItem itemLabel="-- Select  -- " itemValue="N" />
					<f:selectItem itemLabel="prof Body1" itemValue="M" />
					<f:selectItem itemLabel="prof Body2" itemValue="B" />
					<f:selectItem itemLabel="prof Body3" itemValue="T" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="Registration NO.">
				<p:inputText size="35" />
			</p:column>
			<p:column headerText="End Date.">
				<p:calendar showOn="button" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="Add"
				action="#{backingBean.managedBean.addProfBody}"
				update="perStfProfDt">
			</p:commandButton>
			<p:commandButton value="Delete">
			</p:commandButton>
		</div>
	</p:panel>
	<p:panel header="Academic Qualification" toggleable="true">

		<p:dataTable id="perStfAqdt"
			value="#{backingBean.managedBean.academicQualifications}" var="aq"
			selection="#{backingBean.managedBean.selectedAcademicQualifications}"
			selectionMode="multiple" rowIndexVar="rowIndex" rowKey="#{aq}">
			<ac:paginator for="perStfAqdt" />
			<p:column selectionMode="multiple" style="width:2%" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="Year" />
				</f:facet>
				<p:selectOneMenu style="margin-bottom: 5px;">
					<f:selectItem itemLabel="Select One" itemValue="1" />
					<f:selectItem itemLabel="2013" itemValue="2013" />
					<f:selectItem itemLabel="2012" itemValue="2012" />
					<f:selectItem itemLabel="2011" itemValue="2011" />
				</p:selectOneMenu>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Institute" />
				</f:facet>
				<p:inputText />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Qualification Level" />
				</f:facet>
				<p:selectOneMenu style="margin-bottom: 5px;">
					<f:selectItem itemLabel="-- Others--" itemValue="1" />
					<f:selectItem itemLabel="Graduate" itemValue="1" />
					<f:selectItem itemLabel="Post Graduate" itemValue="1" />
				</p:selectOneMenu>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Education Field" />
				</f:facet>
				<p:selectOneMenu style="margin-bottom: 5px;">
					<f:selectItem itemLabel="-- Select One--" itemValue="1" />
					<f:selectItem itemLabel="Computers" itemValue="1" />
					<f:selectItem itemLabel="Mechanical" itemValue="1" />
					<f:selectItem itemLabel="Civil" itemValue="1" />
				</p:selectOneMenu>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Major In" />
				</f:facet>
				<p:inputText />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="Add"
				action="#{backingBean.managedBean.addAcademicQualification}"
				update="perStfAqdt">
			</p:commandButton>
			<p:commandButton value="Delete">
			</p:commandButton>
		</div>
	</p:panel>

</ui:composition>
