<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.profBody.panHdr']}" toggleable="true">
		<table style="width: 350px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.assocBodyVerified}"
							id="poAssocBodVer">
							<p:ajax update=":form:tt:profInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:profInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.assocBodyVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.assocBodyVerified}"
							id="apprAssocBodVer">
							<p:ajax update=":form:tt:profInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:profInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.assocBodyVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>

		<p:outputPanel id="profInfPan" layout="block">
			<p:blockUI block=":form:tt:profInfPan" widgetVar="buiPoProf"
				id="poProfBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.assocBodyVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.assocBodyVerified : false)}" />


			<p:dataTable var="profBean" widgetVar="suppProfBodyDtWidVar"
				value="#{backingBean.managedBean.nonPersonnelProfBodyList}"
				selection="#{backingBean.managedBean.selectedAssocBodyList}"
				rowKey="#{profBean}" rowIndexVar="index" id="profDt">
				<ac:paginator for="profDt" />
				<p:column selectionMode="multiple" width="5%" />


				<p:column>
					<f:facet name="header">
						<h:outputText value="*" styleClass="mandatory"
							style="padding-right: 4px;" />
						<h:outputText value="#{lbl['lbl.sm.profBody.profBody']}" />
					</f:facet>
					<h:outputText value="#{profBean.pmCertBody.bodyName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.profBody.regNo']}">
					<h:outputText value="#{profBean.regNo}" />
				</p:column>
				<p:column>
					
					<f:facet name="header">
						#{lbl['lbl.sm.profBody.expDate']}
						&#160;
						<p:graphicImage id="expdateti" value="/css/images/design/tooltips.png" />
						<p:tooltip id="expdatett" for="expdateti">
							<p:outputLabel escape="false" value="#{lbl['tt.sm.prof.body.expdate']}" />
						</p:tooltip>
					</f:facet>
					
					<h:outputText value="#{profBean.expDate}">
						<f:convertDateTime type="date"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink action="#{backingBean.assignSelAssocBody(profBean)}"
						partialSubmit="true" process="@this" update=":form:tt:profPop">
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					action="#{backingBean.assignNewAssocBody}" partialSubmit="true"
					process="@this" update=":form:tt:profPop" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					disabled="#{empty backingBean.managedBean.nonPersonnelProfBodyList}"
					id="profBodyDelBtnId" oncomplete="profBodyDeletePopUp.show()" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser or (backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser)}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="profBdySecPoRmrk" readonly="#{backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser}"
								validatorMessage="#{lbl['lbl.sm.profBody.panHdr']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.assocBodyRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="profBdySecPoRmrkMsg" for="profBdySecPoRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.assocBodyRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="profBdySecAprvrRmrk"
								validatorMessage="#{lbl['lbl.sm.profBody.panHdr']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.assocBodyRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="profBdySecAprvrRmrkMsg" for="profBdySecAprvrRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="630px"
		header="#{lbl['lbl.sm.profBody.profBodDiaHdr']}"
		widgetVar="profDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="profPop" closable="false">
		<!-- <p:panel header="profificate Details"> -->
		<p:messages id="profDialogInfoMsg" showSummary="false"
			showDetail="true" autoUpdate="true" closable="true" />
		<table style="width: 100%">


			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.profBody.profBody']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu style="width: 430px;margin-bottom: 5px;"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.profBody.profBody']}" id="profBodyBdy"
						value="#{backingBean.managedBean.selectedAssocBody.pmCertBody.certBodyId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="profBody"
							value="#{backingBean.managedBean.profBodyLs}"
							itemValue="#{profBody.certBodyId}"
							itemLabel="#{profBody.bodyName}" />

						<p:ajax event="change" process="@this"
							update="profBodyOthersAssoc, profBodyOthersAssocMand" />
					</p:selectOneMenu> <p:message id="profBodyBdyMsg" for="profBodyBdy"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputPanel id="profBodyOthersAssocMand">
						<p:outputLabel value="#{lbl['lbl.sm.profBody.others']}" />
						<p:outputLabel value="*" styleClass="mandatory"
							rendered="#{backingBean.managedBean.selectedAssocBody.pmCertBody.certBodyId eq 10}" />
					</p:outputPanel></td>
				<td><p:inputText size="35" id="profBodyOthersAssoc"
						label="#{lbl['lbl.sm.profBody.others']}"
						required="#{backingBean.managedBean.valueReqd and backingBean.managedBean.selectedAssocBody.pmCertBody.certBodyId eq 10}"
						value="#{backingBean.managedBean.selectedAssocBody.otherAssociation}"
						disabled="#{backingBean.managedBean.selectedAssocBody.pmCertBody.certBodyId ne 10}" />
					<p:message id="profBodyOthersAssocMsg" for="profBodyOthersAssoc"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="
						#{lbl['lbl.sm.profBody.regNo']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="35"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.profBody.regNo']}" id="profBodyRegNo"
						value="#{backingBean.managedBean.selectedAssocBody.regNo}"
						maxlength="20" /> <p:message id="profBodyRegNoMsg"
						for="profBodyRegNo" showSummary="true" showDetail="false"
						display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.profBody.expDate']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:calendar showOn="button" navigator="true"
						display="inline" required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.profBody.expDate']}" id="profBodyExpDate"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						mindate="#{CommonConstants.THREE_MONTHS_LATER_DATE}"
						yearRange="0:+20" readonlyInput="true"
						value="#{backingBean.managedBean.selectedAssocBody.expDate}" /> <p:message
						id="profBodyExpDateMsg" for="profBodyExpDate" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>

		</table>
		<!-- </p:panel> -->
		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				action="#{backingBean.addOrUpdateAssocBodiesToSmAppl}"
				partialSubmit="true" process="profPop" id="suppProfBodyPopUpSaveBtn"
				update=":form:tt:profDt, @([id$=Msg])" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				action="#{backingBean.cancelSelProfBody}" partialSubmit="true"
				process="@this" />
		</div>

	</p:dialog>
	
	<ac:confirmationPopup id="profBodyDeletePopUpId"
		widget="profBodyDeletePopUp"
		okAction="backingBean.deleteSelectedAssocBodies"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update=":form:tt:profDt, @([id$=Msg]),:#{p:component('profBodyDelBtnId')}"/>
</ui:composition>
