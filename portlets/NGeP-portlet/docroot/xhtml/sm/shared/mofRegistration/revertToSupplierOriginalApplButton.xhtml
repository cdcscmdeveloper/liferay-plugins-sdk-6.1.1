<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:commandButton value="#{lbl['lbl.sm.button.revert.to.original']}" update=":form"
		onclick="revertConfirmDialog.show()" type="button"
		style="margin-bottom:5px;" />

	<p:confirmDialog id="revertConfirmDialog" closable="false"
		message="#{lbl['lbl.sm.confirm.revert.msg']}"
		header="#{lbl['lbl.sm.confirm.revert.header']}" severity="alert"
		widgetVar="revertConfirmDialog">
		
		<div align="right">
			<p:commandButton id="confApplRevert" value="#{lbl['lbl.btn.yes']}"
				onclick="revertConfirmDialog.hide()"
				onstart="blockWidget.show()"
				oncomplete="blockWidget.hide()"
				partialSubmit="true"
				process="@this" action="#{backingBean.revertToOriginalApplication}" 
				update="@form"/>
			<p:commandButton id="declineApplRevert" value="#{lbl['lbl.btn.no']}"
				onclick="revertConfirmDialog.hide()" type="button" />
		</div>

	</p:confirmDialog>

</ui:composition>
