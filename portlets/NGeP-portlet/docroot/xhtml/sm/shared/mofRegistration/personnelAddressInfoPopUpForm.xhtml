<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.userprofile.addr.info']}" toggleable="true">

		<table style="width: 100%">
			<tr>
				<td valign="top" width="50%">

					<table style="width: 100%">
						<tr>
							<td><u><b> <h:outputText
											value="#{lbl['lbl.sm.permenantaddress']} : " /></b></u></td>
							<td></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* #{lbl['lbl.sm.address']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.address1}"
									size="35" /></td>
						</tr>

						<tr>
							<td></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.address2}"
									size="35" /></td>
						</tr>
						<tr>
							<td></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.address3}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* #{lbl['lbl.sm.country']}" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.pmCountry.countryCode}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="Malaysia" itemValue="1" />
								</p:selectOneMenu></td>
						</tr>

						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
							<td><p:selectOneMenu
									style="width: 207px;margin-bottom: 5px;"
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.pmState.stateCode}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="N/A" />
									<f:selectItem itemLabel="SELANGOR" itemValue="SEL" />
									<f:selectItem itemLabel="WILAYAH PERSEKUTUAN (K.L)"
										itemValue="KL" />
									<f:selectItem itemLabel="PULAU PINANG" itemValue="PG" />
								</p:selectOneMenu></td>
						</tr>

						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
							<td><p:selectOneMenu
									style="width: 207px;margin-bottom: 5px;"
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.pmDistrict.districtCode}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="N/A" />
									<f:selectItem itemLabel="NABAWAN" itemValue="SEL" />
									<f:selectItem itemLabel="PADANG TERAP" itemValue="KL" />
									<f:selectItem itemLabel="PAKAN" itemValue="PG" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
							<td><p:selectOneMenu
									style="width: 207px;margin-bottom: 5px;"
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.pmCity.cityCode}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="N/A" />
									<f:selectItem itemLabel="CYBERJAYA" itemValue="SEL" />
									<f:selectItem itemLabel="SEPANG" itemValue="KL" />
									<f:selectItem itemLabel="NILAI" itemValue="PG" />
									<f:selectItem itemLabel="KUALA KUBU BARU" itemValue="PG" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelPermAddr.smAddress.postcode}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
							<td><p:inputText size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
							<td><p:inputText size="35" /></td>
						</tr>
					</table>

				</td>
				<td valign="top">

					<table style="width: 100%">
						<tr>
							<td><u><b><h:outputText value="#{lbl['lbl.sm.person.mailAddr']} : " /></b></u>
							</td>
							<td><table style="width: 100%">
									<tr>
										<td><p:selectBooleanCheckbox /></td>
										<td><h:outputText value="#{lbl['lbl.sm.person.duplicateAddr']} : " /></td>
									</tr>
								</table></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* #{lbl['lbl.sm.address']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.address1}"
									size="35" /></td>
						</tr>

						<tr>
							<td></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.address2}"
									size="35" /></td>
						</tr>
						<tr>
							<td></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.address3}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* #{lbl['lbl.sm.country']}" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.pmCountry.countryCode}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="Malaysia" itemValue="1" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
							<td><p:selectOneMenu
									style="width: 207px;margin-bottom: 5px;"
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.pmState.stateCode}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="N/A" />
									<f:selectItem itemLabel="SELANGOR" itemValue="SEL" />
									<f:selectItem itemLabel="WILAYAH PERSEKUTUAN (K.L)"
										itemValue="KL" />
									<f:selectItem itemLabel="PULAU PINANG" itemValue="PG" />
								</p:selectOneMenu></td>
						</tr>

						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
							<td><p:selectOneMenu
									style="width: 207px;margin-bottom: 5px;"
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.pmDistrict.districtCode}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="N/A" />
									<f:selectItem itemLabel="NABAWAN" itemValue="SEL" />
									<f:selectItem itemLabel="PADANG TERAP" itemValue="KL" />
									<f:selectItem itemLabel="PAKAN" itemValue="PG" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
							<td><p:selectOneMenu
									style="width: 207px;margin-bottom: 5px;"
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.pmCity.cityCode}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="N/A" />
									<f:selectItem itemLabel="CYBERJAYA" itemValue="SEL" />
									<f:selectItem itemLabel="SEPANG" itemValue="KL" />
									<f:selectItem itemLabel="NILAI" itemValue="PG" />
									<f:selectItem itemLabel="KUALA KUBU BARU" itemValue="PG" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.personnelMailAddr.smAddress.postcode}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
							<td><p:inputText size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
							<td><p:inputText size="35" /></td>
						</tr>
					</table>

				</td>
			</tr>

		</table>
	</p:panel>

</ui:composition>
