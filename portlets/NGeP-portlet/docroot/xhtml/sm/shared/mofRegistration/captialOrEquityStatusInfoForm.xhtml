<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Capital / Equity Status" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.captialVerified}"
							id="poCapVer">
							<p:ajax update=":form:tt:capInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.captialVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.captialVerified}"
							id="apprCapVer">
							<p:ajax update=":form:tt:capInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.captialVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="capInfPan">
			<p:blockUI block=":form:tt:capInfPan" widgetVar="buiPoCap"
				id="poCapBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.captialVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.captialVerified : false)}" />
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="* Authorized Capital (RM.)" /></td>
					<td style="width: 58%;"><p:inputText id="authCapAmt"
							title="This field is applicable for companies of type ROC Only"
							size="10"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.authorizedCapital}" required="true">
							<p:ajax event="blur" update=":form:tt:capInfPan"
								listener="#{backingBean.calculateCapital}" />
						</p:inputText>
					<p:message id="authCapAmtMsg" for="authCapAmt" showSummary="true"
								showDetail="false" display="icon" />
					</td>

					<td><p:outputLabel value="* Paid-Up Capital (RM.)" /></td>
					<td><p:inputText
							title="This field is applicable for companies of type ROC Only"
							size="10"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.paidUpCapital}"
							readonly="true" disabled="true" /></td>
				</tr>
				<tr>
					<c:if
						test="#{backingBean.managedBean.businessTypeVal ne SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_DEFAULT}">
						<td><p:outputLabel value="Accumulated Capital (RM.)" /></td>
						<td><p:inputText
								title="This field is applicable and 
						data is auto populated for companies other than ROC"
								readonly="true" size="10" disabled="true" /></td>
						<td><p:outputLabel value="Accumulated Share (RM.)" /></td>
						<td><p:inputText
								title="This field is applicable and 
						data is auto populated for companies other than ROC"
								readonly="true" size="10" disabled="true"
								value="#{backingBean.managedBean.smAppl.smSupplier.businessType}" /></td>
					</c:if>
				</tr>
				<tr>
					<td colspan="4">
						<div style="width: 98%" align="center">
							<p:panelGrid styleClass="tablePanel">
								<f:facet name="header">
									<p:row>
										<p:column>Composition of Capital Distribution</p:column>
										<!-- <p:column>NO. Of Members</p:column> -->
										<p:column>Value (MYR)</p:column>
										<p:column>%</p:column>
									</p:row>
								</f:facet>
								<p:row>
									<p:column>Bumiputera</p:column>

									<p:column>
										<p:inputText id="bumiAmt"
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.bumiEquity}">
											<p:ajax event="blur" update=":form:tt:capInfPan"
												listener="#{backingBean.calculateCapital}" />
										</p:inputText>
									</p:column>
									<p:column>
										<p:inputText readonly="true" id="bumiPerc" disabled="true"
											size="10"
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.bumiPercent}" />
									</p:column>
								</p:row>
								<p:row>
									<p:column>Non Bumiputera</p:column>

									<p:column>
										<p:inputText id="nomBumAmt"
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.nonBumiEquity}">
											<p:ajax event="blur" update=":form:tt:capInfPan"
												listener="#{backingBean.calculateCapital}" />
										</p:inputText>
									</p:column>
									<p:column>
										<p:inputText disabled="true" readonly="true" id="nonBumPer"
											size="10"
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.nonBumiPercent}" />
									</p:column>
								</p:row>
								<p:row>
									<p:column>Non - Malaysian</p:column>
									<p:column>
										<p:inputText
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.foreignerEquity}"
											id="frgAmt">
											<p:ajax event="blur" update=":form:tt:capInfPan"
												listener="#{backingBean.calculateCapital}" />
										</p:inputText>
									</p:column>
									<p:column>
										<p:inputText disabled="true" readonly="true" size="10"
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.foriegnerPercent}"
											id="frgAmter" />
									</p:column>
								</p:row>
								<p:row>
									<p:column>Equity Government / UT Agency</p:column>

									<p:column>
										<p:inputText
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.govtUnitrustEquity}"
											id="gvtUtAmt">
											<p:ajax event="blur" update=":form:tt:capInfPan"
												listener="#{backingBean.calculateCapital}" />
										</p:inputText>
									</p:column>
									<p:column>
										<p:inputText disabled="true" readonly="true" size="10"
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.govtUTPercent}"
											id="gvtUtPer" />
									</p:column>
								</p:row>
								<p:row>
									<p:column>Government equity</p:column>

									<p:column>
										<p:inputText
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.govtEquity}"
											id="gvtEquAmt">
											<p:ajax event="blur" update=":form:tt:capInfPan"
												listener="#{backingBean.calculateCapital}" />
										</p:inputText>
									</p:column>
									<p:column>
										<p:inputText disabled="true" readonly="true" size="10"
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.govtEquityPercent}"
											id="gvtEquPer" />
									</p:column>
								</p:row>
								<p:row>
									<p:column>Foreign Company</p:column>

									<p:column>
										<p:inputText
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.foreignCompanyEquity}"
											id="lclAmt">
											<p:ajax event="blur" update=":form:tt:capInfPan"
												listener="#{backingBean.calculateCapital}" />
										</p:inputText>
									</p:column>
									<p:column>
										<p:inputText disabled="true" readonly="true" size="10"
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.foriegnCompPercent}"
											id="lclAmtPer" />
									</p:column>
								</p:row>
								<p:row>
									<p:column>Local Company</p:column>

									<p:column>
										<p:inputText
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.localCompanyEquity}"
											id="frgCmpAmt">
											<p:ajax event="blur" update=":form:tt:capInfPan"
												listener="#{backingBean.calculateCapital}" />
										</p:inputText>
									</p:column>
									<p:column>
										<p:inputText disabled="true" readonly="true" size="10"
											value="#{backingBean.managedBean.smAppl.smCompanyBasic.localCompPercent}"
											id="frgCmpPer" />
									</p:column>
								</p:row>
							</p:panelGrid>
						</div>
					</td>

				</tr>
				<tr>
					<td><br /></td>
				</tr>
			</table>

			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.capitalRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.capitalRemark}" /></td>
						<td><p:outputLabel value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.capitalRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
</ui:composition>
