<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Capital / Equity Status" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="Authorized Capital *" /></td>
				<td><p:panelGrid columns="2"
						styleClass="noBorders tr,noBorders td">
						<p:column>
							<p:inputText
								title="This field is applicable for companies of type ROC Only" />
						</p:column>
						<p:column>
							<p:selectOneMenu>
								<f:selectItem itemLabel="MYR" itemValue="1" />
							</p:selectOneMenu>
						</p:column>
					</p:panelGrid></td>
				<td><p:outputLabel value=" Paid-Up Capital *" /></td>
				<td><p:panelGrid columns="2"
						styleClass="noBorders tr,noBorders td">
						<p:column>
							<p:inputText
								title="This field is applicable for companies of type ROC Only" />
						</p:column>
						<p:column>
							<p:selectOneMenu>
								<f:selectItem itemLabel="MYR" itemValue="1" />
							</p:selectOneMenu>
						</p:column>
					</p:panelGrid></td>
			</tr>
			<tr>
				<td><p:outputLabel value=" Accum Capital *" /></td>
				<td><p:panelGrid columns="2"
						styleClass="noBorders tr,noBorders td">
						<p:column>
							<p:inputText
								title="This field is applicable and 
						data is auto populated for companies other than ROC"
								readonly="true" />
						</p:column>
						<p:column>
							<p:selectOneMenu>
								<f:selectItem itemLabel="MYR" itemValue="1" />
							</p:selectOneMenu>
						</p:column>
					</p:panelGrid></td>
				<td><p:outputLabel value=" / Accum Share *" /></td>
				<td><p:panelGrid columns="2"
						styleClass="noBorders tr,noBorders td">
						<p:column>
							<p:inputText
								title=" This field is applicable and
						data is auto populated for companies of type ROS"
								readonly="true" />
						</p:column>
						<p:column>
							<p:selectOneMenu>
								<f:selectItem itemLabel="MYR" itemValue="1" />
							</p:selectOneMenu>
						</p:column>
					</p:panelGrid></td>
			</tr>
			<tr>
				<td colspan="4" align="center"><p:panelGrid>
						<f:facet name="header">
							<p:row>
								<p:column>Composition of Capital Distribution</p:column>
								<p:column>No. Of Members</p:column>
								<p:column>Value (MYR)</p:column>
								<p:column>%</p:column>
							</p:row>
						</f:facet>
						<p:row>
							<p:column>Bumiputera</p:column>
							<p:column>
								<p:inputText id="bumiMem" />
								<p:watermark for="bumiMem" value="0"></p:watermark>
							</p:column>
							<p:column>
								<p:inputText id="bumiAmt" />
								<p:watermark for="bumiAmt" value="0.00"></p:watermark>
							</p:column>
							<p:column>
								<p:inputText label="0.00" readonly="true" id="bumiPerc"
									title="Auto calculated / populated value" />
								<p:watermark for="bumiPerc" value="0.00"></p:watermark>
							</p:column>
						</p:row>
						<p:row>
							<p:column>Non Bumiputera</p:column>
							<p:column>
								<p:inputText />
							</p:column>
							<p:column>
								<p:inputText label="0.00" />
							</p:column>
							<p:column>
								<p:inputText label="0.00" readonly="true"
									title="Auto calculated / populated value" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>Non - Malaysian</p:column>
							<p:column>
								<p:inputText />
							</p:column>
							<p:column>
								<p:inputText label="0.00" />
							</p:column>
							<p:column>
								<p:inputText label="0.00" readonly="true"
									title="Auto calculated / populated value" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>Equity Government / UT Agency</p:column>
							<p:column>
								<p:inputText />
							</p:column>
							<p:column>
								<p:inputText label="0.00" />
							</p:column>
							<p:column>
								<p:inputText label="0.00" readonly="true"
									title="Auto calculated / populated value" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>Government equity</p:column>
							<p:column>
								<p:inputText />
							</p:column>
							<p:column>
								<p:inputText label="0.00" />
							</p:column>
							<p:column>
								<p:inputText label="0.00" readonly="true"
									title="Auto calculated / populated value" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>Local Company</p:column>
							<p:column>
								<p:inputText />
							</p:column>
							<p:column>
								<p:inputText label="0.00" />
							</p:column>
							<p:column>
								<p:inputText label="0.00" readonly="true"
									title="Auto calculated / populated value" />
							</p:column>
						</p:row>
						<p:row>
							<p:column>Foreign Company</p:column>
							<p:column>
								<p:inputText />
							</p:column>
							<p:column>
								<p:inputText label="0.00" />
							</p:column>
							<p:column>
								<p:inputText label="0.00" readonly="true"
									title="Auto calculated / populated value" />
							</p:column>
						</p:row>
					</p:panelGrid></td>

			</tr>
			<tr>
				<td><br /></td>
			</tr>
		</table>
		<br />
		<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
			<table style="width: 50%">
				<tr>
					<td><p:outputLabel value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" /></td>
				</tr>
			</table>
		</p:outputPanel>
		<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" readonly="true"
							disabled="true" /></td>
					<td><p:outputLabel value="Approver Remarks" /></td>
					<td><p:inputTextarea autoResize="true" /></td>

				</tr>
			</table>
		</p:outputPanel>
	</p:panel>
</ui:composition>
