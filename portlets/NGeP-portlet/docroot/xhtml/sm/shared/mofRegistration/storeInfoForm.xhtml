<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.store.details']}" toggleable="true"
		id="smStrDtPanel">
		<p:outputPanel rendered="#{backingBean.managedBean.showStorePanel}">
			<p:dataTable var="stor" widgetVar="smFacStoreDtWidVar"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.applStoreFacilities}"
				selection="#{backingBean.managedBean.selectedStoreFacilities}"
				rowKey="#{stor}" rowIndexVar="index" id="storeDt">
				<ac:paginator for="storeDt" />
				<p:column selectionMode="multiple" width="1%" rendered="#{not empty backingBean.managedBean.applStoreFacilities}"/>

				<p:column headerText="#{lbl['lbl.sm.store.name']}">
					<h:outputText value="#{stor.facilityName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.store.address']}"
					style="width :60%;white-space : normal">
					<h:outputText value="#{backingBean.getFullAddress(stor.smAddress)}"
						style="float : left" />
					<br />
					<script>
					
				      function getAddress2(addr1, addr2, addr3, addr4, cityName, districtName, stateName, countryName) {

				    	  var address = addr1 + addr2 + addr3 + addr4 + cityName + ',' + districtName + ',' + stateName + ',' + countryName;

				      	return address;
				      }
					
					</script>

					<ac:gmapInput id="gmapInput" 
						latitude="#{stor.smAddress.mapLatitude}" 
						longitude="#{stor.smAddress.mapLongitude}" 
						address="getAddress2('#{stor.smAddress.address1}', '#{stor.smAddress.address2}', '#{stor.smAddress.address3}', '#{stor.smAddress.address4}', '#{stor.smAddress.pmCity.cityName}', '#{stor.smAddress.pmDistrict.districtName}', '#{stor.smAddress.pmState.stateName}', '#{stor.smAddress.pmCountry.countryName}')"
						showButton="true"
						disabled="false" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.action']}" style="text-align: center  !important;">
					<p:commandLink process="@this" partialSubmit="true"
						action="#{backingBean.assignSelStore(stor)}"
						update=":form:tt:storeDialog" style="padding-right:5px"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}"/>
					</p:commandLink>
				</p:column>

			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					action="#{backingBean.assignNewStoreBean}"
					update=":form:tt:storeDialog" partialSubmit="true" process="@this" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					process="smStrDtPanel" partialSubmit="true"
					action="#{backingBean.deleteSelectedStores}"
					update=":form:tt:storeDt" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
			</div>
			<br />
		</p:outputPanel>
		<p:outputPanel rendered="#{!backingBean.managedBean.showStorePanel}"
			layout="block">

			<table style="width: 100%">
				<tr>
					<td><h:outputText style="float:left"
							value="#{lbl['lbl.sm.store.notApplicable']}" /></td>
				</tr>
			</table>
		</p:outputPanel>

	</p:panel>
	<p:dialog width="500px" height="500px"
		header="#{lbl['lbl.sm.store.information']}" widgetVar="storeDialog"
		resizable="false" showEffect="fade" closable="false" hideEffect="fade"
		modal="true" id="storeDialog">
		<p:messages id="storeDialogMsg" showSummary="false" showDetail="true"
			autoUpdate="true" closable="true" />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.facility.facilityType']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.facilityType}" readonly="true"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.name']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="35" maxlength="50"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.facility.name']}" id="smStoreName"
						value="#{backingBean.managedBean.selectedStoreFacility.facilityName}" />
					<p:message id="smStoreNameMsg" for="smStoreName" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.address']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="35"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.address']}" id="smStoreAddr"
						value="#{backingBean.managedBean.selectedStoreFacility.smAddress.address1}"
						size="35" /> <p:message id="smStoreAddrMsg" for="smStoreAddr"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td></td>
				<td><p:inputText maxlength="35"
						value="#{backingBean.managedBean.selectedStoreFacility.smAddress.address2}"
						size="35" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="35"
						value="#{backingBean.managedBean.selectedStoreFacility.smAddress.address3}"
						size="35" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="35"
						value="#{backingBean.managedBean.selectedStoreFacility.smAddress.address4}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="smFacStoreCntry"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.country']}"
						value="#{backingBean.managedBean.selectedStoreFacility.smAddress.countryId}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="storeCountry"
							value="#{backingBean.managedBean.countryItems}" />
						<p:ajax event="change" process="@this"
							listener="#{backingBean.onChangeCountry(backingBean.managedBean.selectedStoreFacility.smAddress,SupplierManagementConst.SM_STORE_FACILITY_PANEL)}"
							update="storeState,storeDist,storeCity,postCodeFacStorePanelId" />
					</p:selectOneMenu> <p:message id="smFacStoreCntryMsg" for="smFacStoreCntry"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.state']}"
						value="#{backingBean.managedBean.selectedStoreFacility.smAddress.stateId}"
						id="storeState">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="storeState"
							value="#{backingBean.managedBean.storeFacilityStates}" />
						<p:ajax event="change" process="@this"
							listener="#{backingBean.onChangeState(backingBean.managedBean.selectedStoreFacility.smAddress,SupplierManagementConst.SM_STORE_FACILITY_PANEL)}"
							update="storeDist,storeCity" />

					</p:selectOneMenu> <p:message id="storeStateMsg" for="storeState" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						id="storeDist" required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.district']}"
						value="#{backingBean.managedBean.selectedStoreFacility.smAddress.districtId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="storeDist"
							value="#{backingBean.managedBean.storeFacilityDistricts}" />
						<p:ajax event="change" process="@this"
							listener="#{backingBean.onChangeDistrict(backingBean.managedBean.selectedStoreFacility.smAddress,SupplierManagementConst.SM_STORE_FACILITY_PANEL)}"
							update="storeCity" />
					</p:selectOneMenu> <p:message id="storeDistMsg" for="storeDist" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						id="storeCity" required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.towncity']}"
						value="#{backingBean.managedBean.selectedStoreFacility.smAddress.cityId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="storeCity"
							value="#{backingBean.managedBean.storeFacilityCities}" />
						<p:ajax event="change" process="@this"
							listener="#{backingBean.onChangeCity(backingBean.managedBean.selectedStoreFacility.smAddress,SupplierManagementConst.SM_STORE_FACILITY_PANEL)}"
							update="storeCity" />
					</p:selectOneMenu> <p:message id="storeCityMsg" for="storeCity" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:outputPanel id="postCodeFacStorePanelId">
						<p:outputPanel
							rendered="#{backingBean.managedBean.selectedStoreFacility.smAddress.countryId==backingBean.managedBean.myCountryId}">
							<p:inputText maxlength="5"
								required="#{backingBean.managedBean.valueReqd}"
								label="#{lbl['lbl.sm.postcode']}" id="smFacStorePosCodeMy"
								value="#{backingBean.managedBean.selectedStoreFacility.smAddress.postcode}"
								validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
								size="35">
								<f:validator validatorId="postcodeValidator" />
							</p:inputText>
							<p:message id="smFacStorePosCodeMyMsg" for="smFacStorePosCodeMy"
								showSummary="true" showDetail="false" display="icon" />
						</p:outputPanel>
						<p:outputPanel
							rendered="#{backingBean.managedBean.selectedStoreFacility.smAddress.countryId!=backingBean.managedBean.myCountryId}">
							<p:inputText maxlength="10"
								required="#{backingBean.managedBean.valueReqd}"
								label="#{lbl['lbl.sm.postcode']}" id="smFacStorePosCodeForeign"
								value="#{backingBean.managedBean.selectedStoreFacility.smAddress.postcode}"
								size="35">
							</p:inputText>
							<p:message id="smFacStorePosCodeForeignMsg"
								for="smFacStorePosCodeForeign" showSummary="true"
								showDetail="false" display="icon" />
						</p:outputPanel>
					</p:outputPanel></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td>
					<ac:phone id="smFacStorePhnNo" isMobile="false" label="#{lbl['lbl.sm.phoneno']}"
					countryCode="#{backingBean.managedBean.selectedStoreFacility.phoneCountry}" 
					areaCode="#{backingBean.managedBean.selectedStoreFacility.phoneArea}" 
					number="#{backingBean.managedBean.selectedStoreFacility.phoneNo}"  
					validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
				<td>
					<ac:phone id="smFacStoreFaxNo" isMobile="false" label="#{lbl['lbl.sm.faxno']}"
					countryCode="#{backingBean.managedBean.selectedStoreFacility.faxCountry}" 
					areaCode="#{backingBean.managedBean.selectedStoreFacility.faxArea}" 
					number="#{backingBean.managedBean.selectedStoreFacility.faxNo}"  
					validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.area.feat']}" /></td>
				<td><p:inputText id="smFacStoreArea"
						label="#{lbl['lbl.sc.spec.area.feat']}"
						value="#{backingBean.managedBean.selectedStoreFacility.areaSquareFeet}"
						size="35">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText> <p:message id="smFacStoreAreaMsg" for="smFacStoreArea"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.ownerType']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneRadio id="smStoreOwnerType"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.facility.ownerType']}"
						value="#{backingBean.managedBean.selectedStoreFacility.ownershipType}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.facility.rent']}"
							itemValue="R" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.facility.own']}"
							itemValue="O" />
						<p:ajax event="change" listener="#{backingBean.storeOwnerTypeSel}"
							update="storPan,storPanLbl" />
					</p:selectOneRadio> <p:message id="smStoreOwnerTypeMsg" for="smStoreOwnerType"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputPanel id="storPanLbl">
						<p:outputLabel value="#{lbl['lbl.cm.price']}"
							rendered="#{backingBean.managedBean.selectedStoreFacility.ownershipType eq 'O'}" />
						<p:outputLabel value="#{lbl['lbl.sm.facility.rent.rm']}"
							rendered="#{backingBean.managedBean.selectedStoreFacility.ownershipType eq 'R'}" />
						<p:outputLabel value="*" styleClass="mandatory"
							rendered="#{backingBean.managedBean.selectedStoreFacility.ownershipType eq 'O' or 
							backingBean.managedBean.selectedStoreFacility.ownershipType eq 'R'}" />
					</p:outputPanel></td>
				<td><p:outputPanel id="storPan">
						<ui:fragment
							rendered="#{backingBean.managedBean.selectedStoreFacility.ownershipType eq 'O'}">
							<p:inputText id="smFacStorePrice"
								disabled="#{!backingBean.managedBean.valueReqd}"
								label="#{lbl['lbl.cm.price']}" maxlength="17"
								validatorMessage="#{lbl['lbl.cm.price']} - #{lbl['lbl.sm.minAmt.validMsg']}"
								value="#{backingBean.managedBean.selectedStoreFacility.purchasePrice}"
								size="20"
								required="#{backingBean.managedBean.selectedStoreFacility.ownershipType eq 'O'}">
								<f:validateDoubleRange
									minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
									maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								<p:ajax process="@this" partialSubmit="true"
									update="@this,smFacStorePriceMsg" />
							</p:inputText>
							<p:message id="smFacStorePriceMsg" for="smFacStorePrice"
								showSummary="true" showDetail="false" display="icon" />
						</ui:fragment>
						<ui:fragment
							rendered="#{backingBean.managedBean.selectedStoreFacility.ownershipType eq 'R'}">
							<p:inputText id="smFacStoreRent"
								disabled="#{!backingBean.managedBean.valueReqd}"
								label="#{lbl['lbl.sm.facility.rent.rm']}" maxlength="17"
								validatorMessage="#{lbl['lbl.sm.facility.rent.rm']} - #{lbl['lbl.sm.minAmt.validMsg']}"
								value="#{backingBean.managedBean.selectedStoreFacility.rentalRate}"
								size="20"
								required="#{backingBean.managedBean.selectedStoreFacility.ownershipType eq 'R'}">
								<f:validateDoubleRange
									minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
									maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								<p:ajax process="@this" partialSubmit="true"
									update="@this,smFacStoreRentMsg" />
							</p:inputText>
							<p:message id="smFacStoreRentMsg" for="smFacStoreRent"
								showSummary="true" showDetail="false" display="icon" />
						</ui:fragment>
					</p:outputPanel></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.ownername']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="50" id="smFacStoreOwnName"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.ownername']}"
						value="#{backingBean.managedBean.selectedStoreFacility.ownerName}"
						size="35" /> <p:message id="smFacStoreOwnNameMsg"
						for="smFacStoreOwnName" showSummary="true" showDetail="false"
						display="icon" /></td>
			</tr>

		</table>
		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				action="#{backingBean.addOrUpdateStoreToSmAppl}"
				partialSubmit="true" process="storeDialog"
				update=":form:tt:storeDt, @([id$=Msg])" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				process="@this" partialSubmit="true"
				action="#{backingBean.cancelStoreSaveorUpdate}"
				update=":form:tt:storeDialog, @([id$=Msg])" />
		</div>
	</p:dialog>
</ui:composition>
