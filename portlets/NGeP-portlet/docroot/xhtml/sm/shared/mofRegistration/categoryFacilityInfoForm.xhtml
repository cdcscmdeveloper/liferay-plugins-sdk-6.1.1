<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<tr>
		<td><p:outputLabel value="* #{lbl['lbl.sm.facility.type']}" /></td>
		<td><p:inputText value="#{lbl['lbl.sm.facility.type.factory']}" readonly="true" disabled="true"
				rendered="#{backingBean.managedBean.selectedFactoryFacility.facilityType eq SupplierManagementConst.SM_FACILITY_TYPE_FACTORY}" />
			<p:inputText value="#{lbl['lbl.sm.facility.type.dockyard']}" readonly="true" disabled="true"
				rendered="#{backingBean.managedBean.selectedFactoryFacility.facilityType eq SupplierManagementConst.SM_FACILITY_TYPE_DOCKYARD}" />
			<p:inputText value="#{lbl['lbl.sm.facility.type.workshop']}" readonly="true" disabled="true"
				rendered="#{backingBean.managedBean.selectedFactoryFacility.facilityType eq SupplierManagementConst.SM_FACILITY_TYPE_WORKSHOP}" />
			<p:inputText value="#{lbl['lbl.sm.facility.type.store']}" readonly="true" disabled="true"
				rendered="#{backingBean.managedBean.selectedFactoryFacility.facilityType eq SupplierManagementConst.SM_FACILITY_TYPE_STORE}" /></td>
	</tr>
	<tr>
		<td><p:outputLabel value="* #{lbl['lbl.sm.facility.name']}" /></td>
		<td><p:inputText size="35" /></td>
	</tr>
	<tr>
		<td><p:outputLabel value="* #{lbl['lbl.sm.facility.address']}" /></td>
		<td><p:inputText
				value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address1}"
				size="35" /></td>
	</tr>

	<tr>
		<td></td>
		<td><p:inputText
				value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address2}"
				size="35" /></td>
	</tr>
	<tr>
		<td></td>
		<td><p:inputText
				value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address3}"
				size="35" /></td>
	</tr>
	<tr>
		<td></td>
		<td><p:inputText
				value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.address4}"
				size="35" /></td>
	</tr>
	<tr>
		<td><p:outputLabel value="* #{lbl['lbl.sm.country']}" /></td>
		<td><p:selectOneMenu
				value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmCountry.countryCode}"
				style="width: 207px;margin-bottom: 5px;">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				<f:selectItem itemLabel="Malaysia" itemValue="MY" />
			</p:selectOneMenu></td>
	</tr>

	<tr>
		<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
		<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
				value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmState.stateCode}">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="N/A" />
				<f:selectItem itemLabel="SELANGOR" itemValue="SEL" />
				<f:selectItem itemLabel="WILAYAH PERSEKUTUAN (K.L)" itemValue="KL" />
				<f:selectItem itemLabel="PULAU PINANG" itemValue="PG" />
			</p:selectOneMenu></td>
	</tr>

	<tr>
		<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
		<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
				value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmDistrict.districtCode}">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="N/A" />
				<f:selectItem itemLabel="NABAWAN" itemValue="SEL" />
				<f:selectItem itemLabel="PADANG TERAP" itemValue="KL" />
				<f:selectItem itemLabel="PAKAN" itemValue="PG" />
			</p:selectOneMenu></td>
	</tr>
	<tr>
		<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
		<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
				value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.pmCity.cityCode}">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="N/A" />
				<f:selectItem itemLabel="CYBERJAYA" itemValue="SEL" />
				<f:selectItem itemLabel="SEPANG" itemValue="KL" />
				<f:selectItem itemLabel="NILAI" itemValue="PG" />
				<f:selectItem itemLabel="KUALA KUBU BARU" itemValue="PG" />
			</p:selectOneMenu></td>
	</tr>
	<tr>
		<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
		<td><p:inputText
				value="#{backingBean.managedBean.selectedFactoryFacility.smAddress.postcode}"
				size="35" /></td>
	</tr>
	<tr>
		<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
		<td><p:inputText value=" --TBC--" size="35" /></td>
	</tr>
	<tr>
		<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
		<td><p:inputText value=" --TBC--" size="35" /></td>
	</tr>
	<tr>
		<td><p:outputLabel value="* #{lbl['lbl.sc.spec.area.feat']}" /></td>
		<td><p:inputText
				value="#{backingBean.managedBean.selectedFactoryFacility.areaSquareFeet}"
				size="35" /></td>
	</tr>
</ui:composition>
