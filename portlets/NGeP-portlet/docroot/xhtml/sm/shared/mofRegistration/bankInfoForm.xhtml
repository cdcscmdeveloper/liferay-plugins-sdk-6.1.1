<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.bankDtls.panHdr']}" toggleable="true">

		<table style="width: 100%">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.bankVerified}"
							id="poBankVer">
							<p:ajax update=":form:tt:bankInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:bankInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.bankVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.bankVerified}"
							id="apprBankVer">
							<p:ajax update=":form:tt:bankInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:bankInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.bankVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>

		<p:outputPanel id="bankInfPan" layout="block">
			<p:blockUI block=":form:tt:bankInfPan" widgetVar="buiPoBank"
				id="poBankBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.bankVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.bankVerified : false)}" />
			
			<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.bankDtls.instruction']}" escape="false" /><br />
			
			<p:dataTable var="bankBean" widgetVar="suppBankInfoDtWidVar"
				value="#{backingBean.managedBean.smAppl.smSupplierBanks}"
				selection="#{backingBean.managedBean.selectedBanks}"
				rowKey="#{bankBean}" rowIndexVar="index" id="bankDt"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<ac:paginator for="bankDt" />
				<p:column selectionMode="multiple" width="1%" rendered="#{not empty backingBean.managedBean.smAppl.smSupplierBanks}"/>

				<p:column headerText="#{lbl['lbl.sm.bankDtls.acctNo']}">
					<h:outputText value="#{bankBean.accountNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.bankDtls.bankName']}">
					<h:outputText value="#{bankBean.pmFinancialOrg.finOrgName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.bankDtls.acctPurpose']}"
					style="text-align: center;width: 15%">
					<h:outputText value="#{lbl['lbl.sm.paymentLbl']}"
						rendered="#{bankBean.accountPurpose eq 'P'}" />
					<h:outputText value="#{lbl['lbl.sm.bankDtls.registration']}"
						rendered="#{bankBean.accountPurpose eq 'R'}" />
					<h:outputText value="#{lbl['lbl.sm.bankDtls.both.regandpay']}"
						rendered="#{bankBean.accountPurpose eq 'B'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.bankDtls.addr']}"
					style="width :50%;white-space : normal">
					<h:outputText
						value="#{backingBean.getFullAddress(bankBean.smAddress)}"
						style="float : left" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink partialSubmit="true" process="@this"
						action="#{backingBean.assignSelBank(bankBean)}"
						update=":form:tt:bankDialog" style="padding-right :5px;" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
					</p:commandLink>
					<ac:smFieldChangeTableAlert object="#{bankBean}" />
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandLink action="#{backingBean.viewSignatories}"
					partialSubmit="true" process="bankInfPan" update="sfieldset,@([id$=Msg])"
					style="padding-right :5px;" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
					<p:graphicImage value="/css/images/design/seller_detail.png"
						title="#{lbl['lbl.sm.view.signatories']}" />
				</p:commandLink>
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					partialSubmit="true" process="@this"
					actionListener="#{backingBean.assignNewBank}"
					update=":form:tt:bankDialog" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					action="#{backingBean.deleteSelectedBanks}" partialSubmit="true"
					process="bankInfPan" update=":form:tt:bankDt ,sfieldset" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
			</div>
			
			<p:outputPanel id="sfieldset">
				<ui:repeat var="bank" value="#{backingBean.managedBean.selectedSignatoryBankAccts}">
					<p:panel header="#{lbl['lbl.sm.bankDtls.cheSignPanHdr']}  #{bank.accountNo} (#{bank.pmFinancialOrg.finOrgName})">
						<p:dataTable id="signatory" var="auth"
							emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
							value="#{bank.smChequeSignatories}"
							rowKey="#{auth}" rowIndexVar="index">
							<ac:paginator for="signatory" />
		
							<p:column headerText="#{lbl['lbl.sm.bankDtls.signName']}">
								<h:outputText value="#{auth.smPersonnel.name}" />
							</p:column>
		
							<p:column headerText="#{lbl['lbl.sm.bankDtls.signId']}">
								<h:outputText value="#{auth.smPersonnel.identificationNo}" />
							</p:column>
		
							<p:column headerText="#{lbl['lbl.sm.bankDtls.signIsBumi']}">
								<h:outputText value="#{lbl['lbl.txt.no']}"
									rendered="#{auth.smPersonnel.bumiFlg eq 0}" />
								<h:outputText value="#{lbl['lbl.txt.yes']}"
									rendered="#{auth.smPersonnel.bumiFlg eq 1}" />
							</p:column>
		
							<p:column headerText="#{lbl['lbl.sm.bankDtls.signPos']}">
								<h:outputText value="#{auth.smPersonnel.designation}" />
								<ac:smFieldChangeTableAlert object="#{auth}" />
							</p:column>
						</p:dataTable>
					</p:panel>
					<br />
				</ui:repeat>
			</p:outputPanel>
			
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="bankPoRmrkSec"
								validatorMessage="#{lbl['lbl.sm.bankDtls.panHdr']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.bankRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="bankPoRmrkSecMsg" for="bankPoRmrkSec"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.bankRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="bankApprvRmrkSec"
								validatorMessage="#{lbl['lbl.sm.bankDtls.panHdr']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.bankRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="bankApprvRmrkSecMsg" for="bankApprvRmrkSec"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="600px" height="470px"
		header="#{lbl['lbl.sm.bankDtls.bankDiaHdr']}" widgetVar="bankDialog"
		resizable="false" showEffect="fade" closable="false" hideEffect="fade"
		modal="true" id="bankDialog">
		<p:outputPanel id="bankDetailsPanel" layout="block">
			<p:messages id="suppBankAcctInfoMsg" showSummary="false"
				showDetail="true" autoUpdate="true" closable="true" />
			<table style="width: 100%">

				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.bankDtls.acctPurpose']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.bankDtls.acctPurpose']}"
							id="smBankAcctPurposeVal"
							value="#{backingBean.managedBean.selectedBank.accountPurpose}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="O" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.bankDtls.registration']}"
								itemValue="R" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.paymentLbl']}"
								itemValue="P" />
							<f:selectItem
								itemLabel="#{lbl['lbl.sm.bankDtls.both.regandpay']}"
								itemValue="B" />
							<p:ajax event="change" update="bankDetailsPanel"
								listener="#{backingBean.retrieveBankFinOrgListByType}" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.accountPurpose}" 
							currValue="#{backingBean.managedBean.selectedBank.accountPurpose}" 
							alertValue="#{backingBean.getBankAccPurposeLabel(backingBean.managedBean.latestBank.accountPurpose)}"/>
						<p:message id="smBankAcctPurposeValMsg"
							for="smBankAcctPurposeVal" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.bankName']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.bankDtls.bankName']}" id="smBankNameVal"
							value="#{backingBean.managedBean.selectedBank.pmFinancialOrg.financialOrgId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="finOrg"
								value="#{backingBean.managedBean.finOrgLs}"
								itemValue="#{finOrg.financialOrgId}"
								itemLabel="#{finOrg.finOrgName}" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.pmFinancialOrg.financialOrgId}" 
							currValue="#{backingBean.managedBean.selectedBank.pmFinancialOrg.financialOrgId}" 
							alertValue="#{backingBean.getFinOrgByIdFromList(backingBean.managedBean.latestBank.pmFinancialOrg.financialOrgId)}"/>
						<p:message id="smBankNameValMsg" for="smBankNameVal"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.bankDtls.bankBranch']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="60"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.bankDtls.bankBranch']}"
							id="smBankBranchName"
							value="#{backingBean.managedBean.selectedBank.bankBranch}"
							size="35" /> 
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
								oriValue="#{backingBean.managedBean.latestBank.bankBranch}" 
								currValue="#{backingBean.managedBean.selectedBank.bankBranch}" 
								alertValue="#{backingBean.managedBean.latestBank.bankBranch}"/>
							<p:message id="smBankBranchNameMsg"
							for="smBankBranchName" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.acctNo']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="18"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.bankDtls.acctNo']}" id="smBankAcctNo"
							value="#{backingBean.managedBean.selectedBank.accountNo}"
							size="35">
						</p:inputText> 
						&#160;
						<p:graphicImage id="banti" value="/css/images/design/tooltips.png" />
						<p:tooltip id="bantt" for="banti">
							<p:outputLabel escape="false" value="#{lbl['tt.sm.account.no']}"  />
						</p:tooltip>
						<p:message id="smBankAcctNoMsg" for="smBankAcctNo"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.address']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="35"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.address']}" id="suppBankAddrs"
							value="#{backingBean.managedBean.selectedBank.smAddress.address1}"
							size="35" /> 
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
								oriValue="#{backingBean.managedBean.latestBank.smAddress.address1}" 
								currValue="#{backingBean.managedBean.selectedBank.smAddress.address1}" 
								alertValue="#{backingBean.managedBean.latestBank.smAddress.address1}"/>
							<p:message id="suppBankAddrsMsg"
							for="suppBankAddrs" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>

				<tr>
					<td></td>
					<td><p:inputText maxlength="35"
							value="#{backingBean.managedBean.selectedBank.smAddress.address2}"
							size="35" />
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.smAddress.address2}" 
							currValue="#{backingBean.managedBean.selectedBank.smAddress.address2}" 
							alertValue="#{backingBean.managedBean.latestBank.smAddress.address2}"/>
					</td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText maxlength="35"
							value="#{backingBean.managedBean.selectedBank.smAddress.address3}"
							size="35" />
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.smAddress.address3}" 
							currValue="#{backingBean.managedBean.selectedBank.smAddress.address3}" 
							alertValue="#{backingBean.managedBean.latestBank.smAddress.address3}"/>
					</td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBank.smAddress.address4}"
							size="35" />
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.smAddress.address4}" 
							currValue="#{backingBean.managedBean.selectedBank.smAddress.address4}" 
							alertValue="#{backingBean.managedBean.latestBank.smAddress.address4}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.country']}" id="smBankCntryId"
							value="#{backingBean.managedBean.selectedBank.smAddress.countryId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="smBankCountry"
								value="#{backingBean.managedBean.countryItems}" />
							<p:ajax event="change" process="@this"
								listener="#{backingBean.onChangeCountry(backingBean.managedBean.selectedBank.smAddress,SupplierManagementConst.SM_BANK_INFO_PANEL)}"
								update="smBankCntryId,smBankState,smBankDist,smBankCity,postCodeBankPanelId" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.smAddress.pmCountry.countryId}" 
							currValue="#{backingBean.managedBean.selectedBank.smAddress.pmCountry.countryId}" 
							alertValue="#{(empty backingBean.managedBean.latestBank.smAddress or empty backingBean.managedBean.latestBank.smAddress.pmCountry) ?
								lbl['lbl.txt.na'] : backingBean.getCountryLabelById(backingBean.managedBean.latestBank.smAddress.pmCountry.countryId)}"/>
						<p:message id="smBankCntryIdMsg" for="smBankCntryId"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.state']}"
							value="#{backingBean.managedBean.selectedBank.smAddress.stateId}"
							id="smBankState">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="smBankState"
								value="#{backingBean.managedBean.bankStates}" />
							<p:ajax event="change" process="@this"
								listener="#{backingBean.onChangeState(backingBean.managedBean.selectedBank.smAddress,SupplierManagementConst.SM_BANK_INFO_PANEL)}"
								update="smBankState,smBankDist,smBankCity" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.smAddress.pmState.stateId}" 
							currValue="#{backingBean.managedBean.selectedBank.smAddress.pmState.stateId}" 
							alertValue="#{(empty backingBean.managedBean.latestBank.smAddress or empty backingBean.managedBean.latestBank.smAddress.pmState) ?
								lbl['lbl.txt.na'] : backingBean.getStateLabelById(backingBean.managedBean.latestBank.smAddress.pmState.stateId)}"/>
						<p:message id="smBankStateMsg" for="smBankState"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							id="smBankDist" required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.district']}"
							value="#{backingBean.managedBean.selectedBank.smAddress.districtId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="smBankDist"
								value="#{backingBean.managedBean.bankDistricts}" />
							<p:ajax event="change" process="@this"
								listener="#{backingBean.onChangeDistrict(backingBean.managedBean.selectedBank.smAddress,SupplierManagementConst.SM_BANK_INFO_PANEL)}"
								update="smBankDist,smBankCity" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.smAddress.pmDistrict.districtId}" 
							currValue="#{backingBean.managedBean.selectedBank.smAddress.pmDistrict.districtId}" 
							alertValue="#{(empty backingBean.managedBean.latestBank.smAddress or empty backingBean.managedBean.latestBank.smAddress.pmDistrict) ?
								lbl['lbl.txt.na'] : backingBean.getDistrictLabelById(backingBean.managedBean.latestBank.smAddress.pmDistrict.districtId)}"/>
						<p:message id="smBankDistMsg" for="smBankDist" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							id="smBankCity" required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.towncity']}"
							value="#{backingBean.managedBean.selectedBank.smAddress.cityId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="smBankCity"
								value="#{backingBean.managedBean.bankCities}" />
							<p:ajax event="change" process="@this"
								listener="#{backingBean.onChangeCity(backingBean.managedBean.selectedBank.smAddress,SupplierManagementConst.SM_BANK_INFO_PANEL)}"
								update="smBankCity" />
						</p:selectOneMenu>
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.smAddress.pmCity.cityId}" 
							currValue="#{backingBean.managedBean.selectedBank.smAddress.pmCity.cityId}" 
							alertValue="#{(empty backingBean.managedBean.latestBank.smAddress or empty backingBean.managedBean.latestBank.smAddress.pmCity) ?
								lbl['lbl.txt.na'] : backingBean.getCityLabelById(backingBean.managedBean.latestBank.smAddress.pmCity.cityId)}"/>
						<p:message id="smBankCityMsg" for="smBankCity" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:outputPanel id="postCodeBankPanelId">
							<p:outputPanel
								rendered="#{backingBean.managedBean.selectedBank.smAddress.countryId==backingBean.managedBean.myCountryId}">
								<p:inputText maxlength="5"
									required="#{backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.postcode']}" id="suppBankPostCodeMy"
									value="#{backingBean.managedBean.selectedBank.smAddress.postcode}"
									validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
									size="35">
									<f:validator validatorId="postcodeValidator" />
								</p:inputText>
								<ac:smFieldChangeAlert 
									isShow="#{backingBean.managedBean.showFieldChanges
										and not empty backingBean.managedBean.selectedBank.supplierBankId}"
									oriValue="#{backingBean.managedBean.latestBank.smAddress.postcode}" 
									currValue="#{backingBean.managedBean.selectedBank.smAddress.postcode}" 
									alertValue="#{backingBean.managedBean.latestBank.smAddress.postcode}"/>
								<p:message id="suppBankPostCodeMsgMy" for="suppBankPostCodeMy"
									showSummary="true" showDetail="false" display="icon" />
							</p:outputPanel>
							<p:outputPanel
								rendered="#{backingBean.managedBean.selectedBank.smAddress.countryId!=backingBean.managedBean.myCountryId}">
								<p:inputText maxlength="10"
									required="#{backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.postcode']}" id="suppBankPostCodeForeign"
									value="#{backingBean.managedBean.selectedBank.smAddress.postcode}"
									size="35">
								</p:inputText>
								<ac:smFieldChangeAlert 
									isShow="#{backingBean.managedBean.showFieldChanges
										and not empty backingBean.managedBean.selectedBank.supplierBankId}"
									oriValue="#{backingBean.managedBean.latestBank.smAddress.postcode}" 
									currValue="#{backingBean.managedBean.selectedBank.smAddress.postcode}" 
									alertValue="#{backingBean.managedBean.latestBank.smAddress.postcode}"/>
								<p:message id="suppBankPostCodeMsgForeign"
									for="suppBankPostCodeForeign" showSummary="true"
									showDetail="false" display="icon" />
							</p:outputPanel>
						</p:outputPanel></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.is.associate.to.hq']}" /></td>
					<td>
						<table>
							<tr>
								<td><p:selectOneRadio disabled="#{backingBean.managedBean.selectedBank.accountPurpose ne 'P' 
										or empty backingBean.managedBean.smAppl.smSupplierBranches }"
										value="#{backingBean.managedBean.selectedBank.forHqFlg}">
										<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
										<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
										<p:ajax event="change" partialSubmit="true" process="@this" />
									</p:selectOneRadio>
								</td>
								<td>
									<p:graphicImage id="hqFlgImg" value="/css/images/design/tooltips.png" />
									<p:tooltip id="hqFlgImgTt" for="hqFlgImg">
										<p:outputLabel escape="false" value="#{lbl['tt.sm.account.used.for.hq']}"  />
									</p:tooltip>
								</td>
							</tr>
						</table>
					</td>
				</tr>
				<p:outputPanel rendered="#{(backingBean.managedBean.selectedBank.accountPurpose eq 'P' 
					or backingBean.managedBean.selectedBank.accountPurpose eq 'B')
					and not empty backingBean.managedBean.smAppl.smSupplierBranches}" >
					<tr>
						<td>
							<p:outputLabel value="#{(backingBean.managedBean.businessTypeVal eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROB_PARTNER_DEFAULT 
								or backingBean.managedBean.businessTypeVal eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROB_INDIVIDUAL_DEFAULT) ? 
								lbl['lbl.sm.bankDtls.rob.assocBran'] : lbl['lbl.sm.bankDtls.assocBran']}" id="banBranchLbl" />
						</td>
						<td>
							<table>
								<tr>
									<td>
										<p:selectManyMenu showCheckbox="true"
											required="false"
											label="#{lbl['lbl.sm.bankDtls.assocBran']}" id="banBranchVal"
											value="#{backingBean.managedBean.selectedBankBranchIds}"
											style="height:100px;width: 200px;">
											<f:selectItems
												value="#{backingBean.managedBean.smAppl.smSupplierBranches}" var="br"
												itemLabel="#{br.branchName}" itemValue="#{br.supplierBranchId}" />
										</p:selectManyMenu>
									</td>
									<td style="vertical-align: baseline;">
										&#160;
										<p:graphicImage id="brImg" value="/css/images/design/tooltips.png" />
										<p:tooltip id="brImgtt" for="brImg">
											<p:outputLabel escape="false" value="#{lbl['tt.sm.account.no']}"  />
										</p:tooltip>
										<p:message id="banBranchValMsg" for="banBranchVal"
											showSummary="true" showDetail="false" display="icon" />
									</td>
								</tr>
							</table>
						</td>
					</tr>
				</p:outputPanel>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.bankDtls.chequesign.tnc']}" /> 
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td><p:inputTextarea maxlength="1000"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.bankDtls.chequesign.tnc']}" id="banCqTnc"
							value="#{backingBean.managedBean.selectedBank.signatureInstruction}"
							validatorMessage="#{lbl['lbl.sm.bankDtls.chequesign.tnc']} - #{lbl['lbl.sm.banktnc.length.validMsg']}"
							cols="36">
							<f:validateLength maximum="1000" />
						</p:inputTextarea> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
									and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.signatureInstruction}" 
							currValue="#{backingBean.managedBean.selectedBank.signatureInstruction}" 
							alertValue="#{backingBean.managedBean.latestBank.signatureInstruction}"/>
						<p:message id="banCqTncMsg" for="banCqTnc" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.cheSigns']} " />
						<p:outputLabel value="*" styleClass="mandatory" /></td>

					<td><p:selectManyMenu showCheckbox="true"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.bankDtls.cheSigns']}" id="bankCheqSignId"
							value="#{backingBean.managedBean.chequeSingPerId}"
							style="height:100px;width: 200px;">
							<f:selectItems
								value="#{backingBean.managedBean.smAppl.smPersonnels}" var="per"
								itemLabel="#{per.name}" itemValue="#{per.personnelId}" />
						</p:selectManyMenu> <p:message id="bankCheqSignIdMsg" for="bankCheqSignId"
							showSummary="true" showDetail="false" display="icon" /></td>

				</tr>

			</table>
		</p:outputPanel>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				partialSubmit="true" process=":form:tt:bankDialog"
				action="#{backingBean.addOrUpdateBankInfoToSmAppl}"
				onclick="bankDetailsPanelWidget.show();" oncomplete="bankDetailsPanelWidget.hide();"
				update=":form:tt:bankDt , sfieldset, @([id$=Msg])" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				partialSubmit="true" process="@this"
				action="#{backingBean.cancelSmBankFunctions}" />
		</div>
		<p:blockUI block="bankDetailsPanel" widgetVar="bankDetailsPanelWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
	</p:dialog>
</ui:composition>
