<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header=" Bank Account Details" toggleable="true">
		<table style="width: 250px">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
				<td><p:outputLabel value=" Section Verified By PO: "
						title="For PO to highlight the verified section " /></td>

			</tr>
			<tr>
				<td width="10px"><p:selectBooleanCheckbox /></td>
				<td><p:outputLabel value=" Section Verified By Approver: "
						title="For Approver to highlight the verified section " /></td>
			</tr>
		</table>
		<br />
		<p:dataTable var="utilBean"
			value="#{mofRegistrationBackingBean.utilList}"
			selection="#{mofRegistrationBackingBean.managedBean.selectedUtilList}"
			rowKey="#{utilBean.seqNo}" rowIndexVar="index">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<p:outputLabel value="1" />
			</p:column>
			<p:column headerText="Bank Name">
				<p:outputLabel value="Maybank" />
			</p:column>

			<p:column headerText="Bank Branch">
				<p:outputLabel value="Maybank - PJ Branch" />
			</p:column>

			<p:column headerText="Account No.">
				<p:commandLink value="127637373938" onclick="bankDialog.show();" />
			</p:column>

			<p:column headerText="Designated Bank">
				<p:outputLabel value="Yes" />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink value="View Signatories"
					action="#{mofRegistrationBackingBean.getSignatoryList}"
					update=":form:tt:signatory" />
				<!-- oncomplete="updateSignatory();" /> -->
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Account" onclick="bankDialog.show();" />
			<p:commandButton value="Delete Account(s)" />
		</div>
		<p:fieldset id="sfieldset"
			legend="Cheque Signatories Composition For Account No.  :  123456">
			<!-- <p:remoteCommand name="updateSignatory" update="signatory" /> -->
			<p:dataTable id="signatory" var="auth"
				value="#{mofRegistrationBackingBean.signList}"
				rowKey="#{auth.personelSeq}" rowIndexVar="index"
				styleClass="updateSignatory">
				<p:column headerText="NO.">
					<p:outputLabel value="#{index+1}" />
				</p:column>

				<p:column headerText="Name">
					<p:outputLabel value="XXXX#{index+1}" />
				</p:column>

				<p:column headerText="IC/Passport No.">
					<p:outputLabel value="F738382#{index+1}" />
				</p:column>

				<p:column headerText="Bumiputera?">
					<p:outputLabel value="Y" />
				</p:column>

				<p:column headerText="Position">
					<p:outputLabel value="Role#{index+1}" />
				</p:column>
			</p:dataTable>
		</p:fieldset>
		<br />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog width="400px" height="500px" header="Bank Info Page"
		widgetVar="bankDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		<p:panel header="Bank Details">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Bank Name *" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="-- Select One -- " itemValue="" />
							<f:selectItem itemLabel="Maybank" itemValue="1" />
							<f:selectItem itemLabel="CIMB" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Branch Name *" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Address *" /></td>
					<td><p:inputText /></td>
				</tr>

				<tr>
					<td></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Country *" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="-- Select One -- " itemValue="" />
							<f:selectItem itemLabel="Malaysia" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:inputText /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Purpose Of Account/Branch *" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="-- Select One -- " itemValue="" />
							<f:selectItem itemLabel="Registration" itemValue="1" />
							<f:selectItem itemLabel="Payment" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Cheque Signatories *" /></td>
					<!-- <td><p:pickList  /></td> -->
					<td><p:selectManyMenu>
							<f:selectItem itemLabel="-- Select One--" itemValue="1" />
							<f:selectItem itemLabel="User1" itemValue="1" />
							<f:selectItem itemLabel="User2" itemValue="1" />
							<f:selectItem itemLabel="User2" itemValue="1" />
						</p:selectManyMenu></td>
				</tr>
				<tr>
					<td align="right"><p:selectBooleanCheckbox /></td>
					<td><p:outputLabel value="Designated Bank Account" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Associated Company Branch *" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="-- Select One -- " itemValue="" />
							<f:selectItem itemLabel="Branch1" itemValue="1" />
							<f:selectItem itemLabel="Branch2" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Fax No." /></td>
					<td><p:inputText /></td>
				</tr>

			</table>
		</p:panel>
		<br />
		<div align="center">
			<p:commandButton value="Save" onclick="bankDialog.hide();" />
			<p:commandButton value="Cancel" onclick="bankDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
