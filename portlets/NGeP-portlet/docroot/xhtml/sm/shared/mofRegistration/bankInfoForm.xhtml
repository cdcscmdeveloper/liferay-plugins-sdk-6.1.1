<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header=" Bank Account Details" toggleable="true">

		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.bankVerified}"
							id="poBankVer">
							<p:ajax update=":form:tt:bankInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.bankVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.bankVerified}"
							id="apprBankVer">
							<p:ajax update=":form:tt:bankInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.bankVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="bankInfPan">
			<p:blockUI block=":form:tt:bankInfPan" widgetVar="buiPoBank"
				id="poBankBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.bankVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.bankVerified : false)}" />

			<p:dataTable var="bankBean"
				value="#{backingBean.managedBean.smAppl.smSupplierBanks}"
				selection="#{backingBean.managedBean.selectedBanks}"
				rowKey="#{bankBean.supplierBankId}" rowIndexVar="index" id="bankDt">
				<ac:paginator for="bankDt" />
				<p:column selectionMode="multiple" width="5%" />

				<p:column headerText="Account NO.">
					<h:outputText value="#{bankBean.accountNo}" />
				</p:column>
				<p:column headerText="Bank Name">
					<h:outputText value="#{bankBean.pmFinancialOrg.finOrgCode}" />
				</p:column>

				<p:column headerText="Registration Account"
					style="text-align: center;width: 15%">
					<p:selectBooleanCheckbox />
				</p:column>

				<p:column headerText="Payment Account"
					style="text-align: center;width: 15%">
					<p:selectBooleanCheckbox />
				</p:column>

				<p:column headerText="Action">
					<p:commandLink action="#{backingBean.viewSignatories(bankBean)}"
						update=":form:tt:sfieldset" style="padding-right :5px;">
						<p:graphicImage library="ep/images/design"
							name="seller_detail.png"
							value="/resources/ep/images/design/seller_detail.png"
							title="View Signatories" />
					</p:commandLink>
					<p:commandLink oncomplete="bankDialog.show();"
						action="#{backingBean.assignSelBank(bankBean)}"
						update=":form:tt:bankDialog" style="padding-right :5px;">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>

					<!-- oncomplete="updateSignatory();" /> -->
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="Add" oncomplete="bankDialog.show();"
					actionListener="#{backingBean.assignNewBank}"
					update=":form:tt:bankDialog" />
				<p:commandButton value="Delete" />
			</div>
			<p:panel id="sfieldset"
				header="Cheque Signatories Composition For Account No.  :  
			#{backingBean.managedBean.selectedSignatoryBankAcct.accountNo}">
				<!-- <p:remoteCommand name="updateSignatory" update="signatory" /> -->
				<p:dataTable id="signatory" var="auth"
					value="#{backingBean.managedBean.selectedSignatoryBankAcct.smChequeSignatories}"
					rowKey="#{auth.chequeSignatoryId}" rowIndexVar="index">
					<ac:paginator for="signatory" />

					<p:column headerText="Name">
						<h:outputText value="#{auth.smPersonnel.name}" />
					</p:column>

					<p:column headerText="IC/Passport No.">
						<h:outputText value="#{auth.smPersonnel.identificationNo}" />
					</p:column>

					<p:column headerText="Bumiputera?">

						<h:outputText value="Yes" />
					</p:column>

					<p:column headerText="Position">
						<h:outputText value="#{auth.smPersonnel.designation}" />
					</p:column>
				</p:dataTable>
			</p:panel>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41" /></td>
						<td><p:outputLabel value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="500px" height="470px" header="Bank Info Page"
		widgetVar="bankDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="bankDialog">
		<p:panel id="bankDetailsPanel">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="* Bank Name" /></td>
					<td><p:selectOneMenu
							value="#{backingBean.managedBean.selectedBank.pmFinancialOrg.finOrgCode}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One -- " itemValue="" />
							<f:selectItem itemLabel="Maybank" itemValue="MY" />
							<f:selectItem itemLabel="CIMB" itemValue="CIMB" />
							<f:selectItem itemLabel="BSN" itemValue="BSN" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Account NO." /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBank.accountNo}"
							size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Address" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBank.smAddress.address1}"
							size="35" /></td>
				</tr>

				<tr>
					<td></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBank.smAddress.address2}"
							size="35" /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBank.smAddress.address3}"
							size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Country" /></td>
					<td><p:selectOneMenu
							value="#{backingBean.managedBean.selectedBank.smAddress.pmCountry.countryCode}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="Malaysia" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							value="#{backingBean.managedBean.selectedBank.smAddress.pmState.stateCode}">
							<f:selectItem itemLabel="-- Select One --" itemValue="N/A" />
							<f:selectItem itemLabel="SELANGOR" itemValue="SEL" />
							<f:selectItem itemLabel="WILAYAH PERSEKUTUAN (K.L)"
								itemValue="KL" />
							<f:selectItem itemLabel="PULAU PINANG" itemValue="PG" />
						</p:selectOneMenu></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							value="#{backingBean.managedBean.selectedBank.smAddress.pmDistrict.districtCode}">
							<f:selectItem itemLabel="-- Select One --" itemValue="N/A" />
							<f:selectItem itemLabel="NABAWAN" itemValue="SEL" />
							<f:selectItem itemLabel="PADANG TERAP" itemValue="KL" />
							<f:selectItem itemLabel="PAKAN" itemValue="PG" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							value="#{backingBean.managedBean.selectedBank.smAddress.pmCity.cityCode}">
							<f:selectItem itemLabel="-- Select One --" itemValue="N/A" />
							<f:selectItem itemLabel="CYBERJAYA" itemValue="SEL" />
							<f:selectItem itemLabel="SEPANG" itemValue="KL" />
							<f:selectItem itemLabel="NILAI" itemValue="PG" />
							<f:selectItem itemLabel="KUALA KUBU BARU" itemValue="PG" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedBank.smAddress.postcode}"
							size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Account Purpose *" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							value="#{backingBean.managedBean.selectedBank.accountPurpose}">
							<f:selectItem itemLabel="Select " itemValue="0" />
							<f:selectItem itemLabel="Registration" itemValue="R" />
							<f:selectItem itemLabel="Payment" itemValue="P" />
							<p:ajax event="change" update="bankDetailsPanel" />
						</p:selectOneMenu></td>
				</tr>

				<tr>
					<td style="float: right; padding-right: 20px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.selectedBank.defaultAccount}" /></td>
					<td><h:outputText value="Designated Bank Account" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Associated Branch"
							id="banBranchLbl"
							rendered="#{backingBean.managedBean.selectedBank.accountPurpose eq 'P'}" /></td>
					<td><p:selectManyMenu showCheckbox="true"
							style="width: 207px;margin-bottom: 5px;" id="banBranchVal"
							rendered="#{backingBean.managedBean.selectedBank.accountPurpose eq 'P'}">
							<f:selectItems
								value="#{backingBean.managedBean.smAppl.smSupplierBranches}"
								var="supBean" itemLabel="#{supBean.branchName}"
								itemValue="#{supBean.branchName}" />
						</p:selectManyMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Fax NO." /></td>
					<td><p:inputText size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Cheque Signatories" /></td>

					<td><p:selectManyMenu showCheckbox="true"
							value="#{backingBean.managedBean.chequeSingNames}">
							<f:selectItems
								value="#{backingBean.managedBean.smAppl.smPersonnels}" var="per"
								itemLabel="#{per.name}" itemValue="#{per.name}" />
						</p:selectManyMenu></td>

				</tr>

			</table>
		</p:panel>
		<div align="right">
			<p:commandButton value="Save" oncomplete="bankDialog.hide();"
				action="#{backingBean.addOrUpdateBankInfoToSmAppl}"
				update=":form:tt:bankDt , :form:tt:sfieldset" />
			<p:commandButton value="Cancel" onclick="bankDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
