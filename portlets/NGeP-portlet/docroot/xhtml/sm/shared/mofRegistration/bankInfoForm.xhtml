<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.bankDtls.panHdr']}" toggleable="true">					    
		<table style="width: 100%">							
			<!-- Disable for UPS 32008 - START -->
			<p:outputPanel rendered="#{backingBean.managedBean.poUser and !backingBean.managedBean.upsCannotEdit}">
				<tr>
					<td width="10px" style="padding-right: 2px;">
						<p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.bankVerified}"
							id="poBankVer">
							<p:ajax update=":form:tt:bankInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:bankInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.bankVerified)}"						
								disabled="#{backingBean.managedBean.upsCannotEdit}"/>							
						</p:selectBooleanCheckbox>		
					</td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser and !backingBean.managedBean.upsCannotEdit}">
				<tr>
					<td width="10px" style="padding-right: 2px;">
						<p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.bankVerified}"
							id="apprBankVer">
							<p:ajax update=":form:tt:bankInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:bankInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.bankVerified)}"
								disabled="#{backingBean.managedBean.upsCannotEdit}"/>
						</p:selectBooleanCheckbox>
					</td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>

		<p:outputPanel id="bankInfPan" layout="block">
			<p:blockUI rendered="#{!backingBean.managedBean.upsCannotEdit}" block=":form:tt:bankInfPan" widgetVar="buiPoBank"
				id="poBankBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.bankVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.bankVerified : false)}" />
			<!--#12492-START-->
			<h:outputText styleClass="instruction" value="1. #{lbl['lbl.sm.insertcmpnybank.instruction']}" escape="false" /><br />	
			<h:outputText styleClass="instruction" value="2. #{lbl['lbl.sm.bankDtls.instruction']}" escape="false" /><br />					
			<!--#12492-END-->
			<!-- #17906 -->
			<p:messages id="bankDeleteMsg" showSummary="false" showDetail="true" autoUpdate="true" closable="true" for="bankDeleteMsg" escape="false"/>	
			<p:dataTable var="bankBean" widgetVar="suppBankInfoDtWidVar"
				value="#{backingBean.managedBean.smAppl.smSupplierBanks}"
				selection="#{backingBean.managedBean.selectedBanks}"
				rowKey="#{bankBean}" rowIndexVar="index" id="bankDt"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">				
					
				<!-- #17906 - start -->
				<p:ajax event="toggleSelect"
					listener="#{backingBean.itemRowSelectCheckbox}" 					 
					update=":form:tt:bankDelBtnId"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/>
				<!-- #17906 - end -->
				<p:ajax event="rowSelectCheckbox"
					listener="#{backingBean.itemRowSelectCheckbox}" 					 
					update=":form:tt:bankDelBtnId"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/>
				<p:ajax event="rowUnselectCheckbox"
					listener="#{backingBean.itemRowUnselectCheckbox}"
					update=":form:tt:bankDelBtnId"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
					
				<ac:paginator for="bankDt" />
				<p:column selectionMode="multiple" width="1%" action="#{backingBean.checkActiveAndPendingTransaction}" rendered="#{not empty backingBean.managedBean.smAppl.smSupplierBanks}"/>
				
				<p:column headerText="#{lbl['lbl.sm.bankDtls.acctNo']}">
					<h:outputText value="#{bankBean.accountNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.bankDtls.bankName']}">
					<h:outputText value="#{bankBean.pmFinancialOrg.finOrgName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.bankDtls.acctPurpose']}"
					style="text-align: center;width: 15%">
					<h:outputText value="#{lbl['lbl.sm.paymentLbl']}"
						rendered="#{bankBean.accountPurpose eq 'P'}" />
					<h:outputText value="#{lbl['lbl.sm.bankDtls.registration']}"
						rendered="#{bankBean.accountPurpose eq 'R'}" />
					<h:outputText value="#{lbl['lbl.sm.bankDtls.both.regandpay']}"
						rendered="#{bankBean.accountPurpose eq 'B'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.bankDtls.addr']}"
					style="width :50%;white-space : normal">
					<h:outputText
						value="#{backingBean.getFullAddress(bankBean.smAddress)}"
						style="float : left" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink partialSubmit="true" process="@this" id="edit"
						action="#{backingBean.assignSelBankWithPendingTransaction(bankBean)}"
						update=":form:tt:bankDialog" style="padding-right :5px;" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
						<p:graphicImage rendered="#{!backingBean.managedBean.upsCannotEdit}" value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
						<p:graphicImage rendered="#{backingBean.managedBean.upsCannotEdit}" value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
					</p:commandLink>
					<ac:smFieldChangeTableAlert object="#{bankBean}" listener="#{backingBean.assignSelBankWithPendingTransaction(bankBean)}" update=":form:tt:bankDialog"/>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandLink action="#{backingBean.viewSignatories}"
					partialSubmit="true" process="bankInfPan" update="sfieldset,@([id$=Msg])"
					style="padding-right :5px;" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
					<p:graphicImage value="/css/images/design/seller_detail.png"
						title="#{lbl['lbl.sm.view.signatories']}" />
				</p:commandLink>
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					rendered="#{!backingBean.managedBean.upsCannotEdit}" 
					partialSubmit="true" process="@this"
					actionListener="#{backingBean.assignNewBank}"
					update=":form:tt:bankDialog" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"	
					rendered="#{!backingBean.managedBean.upsCannotEdit}" 				
					id="bankDelBtnId" partialSubmit="true"
					process="bankInfPan" update=":form:tt:bankDt ,sfieldset, bankDelBtnId" 
					disabled="#{backingBean.managedBean.itemDeleteButtonShow}"
					action="#{backingBean.checkActiveAndPendingTransaction}"/>
			</div>
			
			<p:outputPanel id="sfieldset">
				<ui:repeat var="bank" value="#{backingBean.managedBean.selectedSignatoryBankAccts}">
					<p:panel header="#{lbl['lbl.sm.bankDtls.cheSignPanHdr']}  #{bank.accountNo} (#{bank.pmFinancialOrg.finOrgName})">
						<p:dataTable id="signatory" var="auth"
							emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
							value="#{bank.smChequeSignatories}"
							rowKey="#{auth}" rowIndexVar="index">
							<ac:paginator for="signatory" />
		
							<p:column headerText="#{lbl['lbl.sm.bankDtls.signName']}">
								<h:outputText value="#{auth.smPersonnel.name}" />
							</p:column>
		
							<p:column headerText="#{lbl['lbl.sm.bankDtls.signId']}">
								<h:outputText value="#{auth.smPersonnel.identificationNo}" />
							</p:column>
		
							<p:column headerText="#{lbl['lbl.sm.bankDtls.signIsBumi']}">
								<h:outputText value="#{lbl['lbl.txt.no']}"
									rendered="#{auth.smPersonnel.bumiFlg eq 0}" />
								<h:outputText value="#{lbl['lbl.txt.yes']}"
									rendered="#{auth.smPersonnel.bumiFlg eq 1}" />
							</p:column>
		
							<p:column headerText="#{lbl['lbl.sm.bankDtls.signPos']}">
								<h:outputText value="#{auth.smPersonnel.designation}" />
								<ac:smFieldChangeTableAlert object="#{auth}" />
							</p:column>
						</p:dataTable>
					</p:panel>
					<br />
				</ui:repeat>
			</p:outputPanel>
			
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser or (backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser)}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="bankPoRmrkSec"
								readonly="#{backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser}"
								validatorMessage="#{lbl['lbl.sm.bankDtls.panHdr']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.bankRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="bankPoRmrkSecMsg" for="bankPoRmrkSec"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.bankRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="bankApprvRmrkSec"
								validatorMessage="#{lbl['lbl.sm.bankDtls.panHdr']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.bankRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="bankApprvRmrkSecMsg" for="bankApprvRmrkSec"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="700px" height="600px"
		header="#{lbl['lbl.sm.bankDtls.bankDiaHdr']}" widgetVar="bankDialog"
		resizable="false" showEffect="fade" closable="true" hideEffect="fade"
		modal="true" id="bankDialog">
		<!--#37779-START-->
		<p:ajax event="close" listener="#{backingBean.cancelSmBankFunctions}"/>
		<!--#37779-End-->
		<p:outputPanel id="bankDetailsPanel" layout="block">
		<p:messages id="msg" showSummary="false" showDetail="true" autoUpdate="true" closable="true" escape="false"/>				
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.bankDtls.acctPurpose']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<!-- #36718 - add !empty param['disableValidation'] in required condition -->
						<p:selectOneMenu style="width: 207px;margin-bottom: 5px;background-color:white;"
							disabled="#{backingBean.managedBean.pendingTransaction or backingBean.managedBean.upsCannotEdit}"
							required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
							label="#{lbl['lbl.sm.bankDtls.acctPurpose']}"
							id="smBankAcctPurposeVal"
							value="#{backingBean.managedBean.selectedBank.accountPurpose}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.bankDtls.registration']}"
								itemValue="R" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.paymentLbl']}"
								itemValue="P" />
							<f:selectItem
								itemLabel="#{lbl['lbl.sm.bankDtls.both.regandpay']}"
								itemValue="B" />
							<p:ajax event="change" update="bankDetailsPanel"
								listener="#{backingBean.retrieveBankFinOrgListByType}" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.accountPurpose}" 
							currValue="#{backingBean.managedBean.selectedBank.accountPurpose}" 
							alertValue="#{backingBean.getBankAccPurposeLabel(backingBean.managedBean.latestBank.accountPurpose)}"/>
						<p:message id="smBankAcctPurposeValMsg"
							for="smBankAcctPurposeVal" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.bankName']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
						<!--#12492-START-->
					<td>
						<!-- #36718 - add !empty param['disableValidation'] in required condition -->
						<p:selectOneMenu
							disabled="#{backingBean.managedBean.pendingTransaction or backingBean.managedBean.upsCannotEdit}"
							required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
							label="#{lbl['lbl.sm.bankDtls.bankName']}" id="smBankNameVal"
							value="#{backingBean.managedBean.selectedBank.pmFinancialOrg.financialOrgId}" update="@([id$=save])"
							style="width: 207px;margin-bottom: 5px;background-color:white;"
							oncomplete="scrollToTop();">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="finOrg"								
								value="#{backingBean.managedBean.finOrgLs}"
								itemValue="#{finOrg.financialOrgId}"
								itemLabel="#{finOrg.finOrgName}" />
								<p:ajax event="change" update="@this"/>
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.pmFinancialOrg.financialOrgId}" 
							currValue="#{backingBean.managedBean.selectedBank.pmFinancialOrg.financialOrgId}" 
							alertValue="#{backingBean.getFinOrgByIdFromList(backingBean.managedBean.latestBank.pmFinancialOrg.financialOrgId)}"/>
					</td>
					<!--#12492-END-->
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.bankDtls.bankBranch']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<!-- #36718 - add !empty param['disableValidation'] in required condition -->
						<p:inputText maxlength="60"
							disabled="#{backingBean.managedBean.pendingTransaction or backingBean.managedBean.upsCannotEdit}"
							required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
							label="#{lbl['lbl.sm.bankDtls.bankBranch']}"
							id="smBankBranchName"
							value="#{backingBean.managedBean.selectedBank.bankBranch}"
							size="35" /> 
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
								oriValue="#{backingBean.managedBean.latestBank.bankBranch}" 
								currValue="#{backingBean.managedBean.selectedBank.bankBranch}" 
								alertValue="#{backingBean.managedBean.latestBank.bankBranch}"/>
							<p:message id="smBankBranchNameMsg"
							for="smBankBranchName" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.acctNo']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
						<!--#12492-START-->
					<td>
						<!-- #36718 - add !empty param['disableValidation'] in required condition -->
						<p:inputText maxlength="18"
							disabled="#{backingBean.managedBean.pendingTransaction or backingBean.managedBean.upsCannotEdit}"
							required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
							label="#{lbl['lbl.sm.bankDtls.acctNo']}" id="smBankAcctNo"
							value="#{backingBean.managedBean.selectedBank.accountNo}"
							size="35">
							<p:ajax event="change" process="@this" update="@this" listener="#{backingBean.CheckBankAccountInfoForm('fromBankInfo')}"/>
						</p:inputText> 
						&#160;
						<p:graphicImage id="banti" value="/css/images/design/tooltips.png" />
						<p:tooltip id="bantt" for="banti">
							<p:outputLabel escape="false" value="#{lbl['tt.sm.account.no']}"  />
						</p:tooltip>
					</td>
					<!--#12492-END-->
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.address']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<!-- #36718 - add !empty param['disableValidation'] in required condition -->
						<p:inputText maxlength="100"
							required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
							label="#{lbl['lbl.sm.address']}" id="suppBankAddrs"
							value="#{backingBean.managedBean.selectedBank.smAddress.address1}"
							size="35"
							disabled="#{backingBean.managedBean.upsCannotEdit}"/> 
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
								oriValue="#{backingBean.managedBean.latestBank.smAddress.address1}" 
								currValue="#{backingBean.managedBean.selectedBank.smAddress.address1}" 
								alertValue="#{backingBean.managedBean.latestBank.smAddress.address1}"/>
							<p:message id="suppBankAddrsMsg"
							for="suppBankAddrs" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>

				<tr>
					<td></td>
					<td><p:inputText maxlength="100"
							value="#{backingBean.managedBean.selectedBank.smAddress.address2}"
							size="35"
							disabled="#{backingBean.managedBean.upsCannotEdit}"/>
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.smAddress.address2}" 
							currValue="#{backingBean.managedBean.selectedBank.smAddress.address2}" 
							alertValue="#{backingBean.managedBean.latestBank.smAddress.address2}"/>
					</td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText maxlength="100"
							value="#{backingBean.managedBean.selectedBank.smAddress.address3}"
							size="35"
							disabled="#{backingBean.managedBean.upsCannotEdit}"/>
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.smAddress.address3}" 
							currValue="#{backingBean.managedBean.selectedBank.smAddress.address3}" 
							alertValue="#{backingBean.managedBean.latestBank.smAddress.address3}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
					<!-- #34159 - START - add required condition -->
						<p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
							label="#{lbl['lbl.sm.country']}" id="smBankCntryId"
							value="#{backingBean.managedBean.selectedBank.smAddress.countryId}"
							style="width: 207px;margin-bottom: 5px;background-color:white;"
							disabled="#{backingBean.managedBean.upsCannotEdit}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="smBankCountry"
								value="#{backingBean.managedBean.countryItems}" />
							<!-- #36718 - add @([id$=shareholderAddrPanel]) to ajax process -->
							<p:ajax event="change" process="@this @([id$=bankDetailsPanel])"
								listener="#{backingBean.onChangeCountry(backingBean.managedBean.selectedBank.smAddress,SupplierManagementConst.SM_BANK_INFO_PANEL)}"
								update="smBankCntryId,smBankState,smBankDivision,smBankDist,smBankCity,postCodeBankPanelId,divisionBankFormLabelPanelId,divisionBankFormDropdownPanelId" />
						</p:selectOneMenu> 
					<!-- #34159 - END -->
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedBank.supplierBankId}"
							oriValue="#{backingBean.managedBean.latestBank.smAddress.pmCountry.countryId}" 
							currValue="#{backingBean.managedBean.selectedBank.smAddress.pmCountry.countryId}" 
							alertValue="#{(empty backingBean.managedBean.latestBank.smAddress or empty backingBean.managedBean.latestBank.smAddress.pmCountry) ?
								lbl['lbl.txt.na'] : backingBean.getCountryLabelById(backingBean.managedBean.latestBank.smAddress.pmCountry.countryId)}"/>
						<p:message id="smBankCntryIdMsg" for="smBankCntryId"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
					<!-- #34159 - START - add required condition -->
						<p:selectOneMenu style="width: 207px;margin-bottom: 5px;background-color:white;"
							required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
							label="#{lbl['lbl.sm.state']}"
							value="#{backingBean.managedBean.selectedBank.smAddress.stateId}"
							id="smBankState"
							disabled="#{backingBean.managedBean.upsCannotEdit}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="smBankState"
								value="#{backingBean.managedBean.bankStates}" />
							<!-- #36718 - add @([id$=shareholderAddrPanel]) to ajax process -->
							<p:ajax event="change" process="@this @([id$=bankDetailsPanel])"
								listener="#{backingBean.onChangeState(backingBean.managedBean.selectedBank.smAddress,SupplierManagementConst.SM_BANK_INFO_PANEL)}"
								update="smBankState,divisionBankFormDropdownPanelId,divisionBankFormLabelPanelId,divisionBankFormDropdownPanelId,smBankDist,smBankCity,postCodeBankPanelId" />
						</p:selectOneMenu> 
					<!-- #34159 - END -->
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
