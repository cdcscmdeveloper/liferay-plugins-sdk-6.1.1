<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header=" Machinery / Equipment List" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:dataTable var="macBean"
			value="#{backingBean.managedBean.smAppl.smMachineDtls}"
			selection="#{backingBean.managedBean.selectedMachineList}"
			rowKey="#{macBean.machineDtlId}" rowIndexVar="index" id="macDt">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<h:outputText value="#{index+1}" />
			</p:column>

			<p:column headerText="Equipment Type">
				<p:commandLink value="#{macBean.machineType}"
					oncomplete="equipmentDialog.show();"
					action="#{backingBean.assignSelMachinery(macBean)}"
					update=":form:tt:eqDia" />
			</p:column>

			<p:column headerText="Brand">
				<h:outputText value="#{macBean.brandName}" />
			</p:column>
			<p:column headerText="Function">
				<h:outputText value="#{macBean.machineFunction}" />
			</p:column>

			<p:column headerText="Quantity">
				<h:outputText value="#{macBean.qty}" />
			</p:column>

			<p:column headerText="Value">
				<h:outputText value="RM. #{macBean.value}" />
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Machinery"
				oncomplete="equipmentDialog.show();" update=":form:tt:eqDia"
				action="#{backingBean.assignNewMachineryBean}" />
			<p:commandButton value="Delete Machine(s)" />
		</div>
		<br />
		<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
			<table style="width: 50%">
				<tr>
					<td><p:outputLabel value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" /></td>
				</tr>
			</table>
		</p:outputPanel>
		<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" readonly="true"
							disabled="true" /></td>
					<td><p:outputLabel value="Approver Remarks" /></td>
					<td><p:inputTextarea autoResize="true" /></td>

				</tr>
			</table>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="600px" header="Manufacturing / Assembly Page"
		widgetVar="equipmentDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="eqDia">
		<p:panel header="Machinery / Equipment Information">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Type Machinery / Equipment(s)" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedMachine.machineType}" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Brand" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedMachine.brandName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Funtion *" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedMachine.machineFunction}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Quantity *" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedMachine.qty}" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Value *" /></td>
					<td>
						<table>
							<tr>
								<td style="padding-right: 20px;"><p:inputText
										value="#{backingBean.managedBean.selectedMachine.value}" /></td>
								<td valign="top"><p:selectOneMenu>
										<f:selectItem itemLabel="MYR" itemValue="1" />
									</p:selectOneMenu></td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="Purchase Method *" /></td>
					<td><p:selectOneMenu
							value="#{backingBean.managedBean.selectedMachine.purchaseMethod}">
							<f:selectItem itemLabel="-- Select --" itemValue="" />
							<f:selectItem itemLabel="Cash" itemValue="1" />
							<f:selectItem itemLabel="Credit Card" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Guarantor Name" /></td>
					<td><p:inputText value=" -- TBC --" /></td>
				</tr>

			</table>
		</p:panel>
		<br />
		<div align="center">
			<p:commandButton value="Save" oncomplete="equipmentDialog.hide();"
				action="#{backingBean.addOrUpdateMachineToSmAppl}"
				update=":form:tt:macDt" />
			<p:commandButton value="Cancel" onclick="equipmentDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
