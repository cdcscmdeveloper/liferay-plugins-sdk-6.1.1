<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header=" Machinery / Equipment List" toggleable="true">
		<div>
			<p:outputLabel value=" Section Verified : "
				title="For PO / Approver highlight the verified section " />
			<p:selectBooleanCheckbox />
		</div>
		<br />
		<p:dataTable>
			<!-- <p:column selectionMode="multiple">
			</p:column> -->

			<p:column headerText="NO.">
				<h:outputText />
			</p:column>

			<p:column headerText="Equipment Type">
				<p:outputLabel />
			</p:column>

			<p:column headerText="Brand">
				<p:outputLabel />
			</p:column>
			<p:column headerText="Function">
				<p:outputLabel />
			</p:column>

			<p:column headerText="Quantity">
				<p:outputLabel />
			</p:column>

			<p:column headerText="Value">
				<p:outputLabel />
			</p:column>

			<p:column headerText="Action">
				<p:outputLabel />
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Machinery"
				onclick="equipmentDialog.show();" />
			<p:commandButton value="Delete Machine(s)" />
		</div>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog width="400px" header="Manufacturing / Assembly Page"
		widgetVar="equipmentDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		<p:panel header="Manufacturing / Assembly Information">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Type Machinery / Equipment(s)" /></td>
					<td><p:inputText /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Brand" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Type Of Product(s) *" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Funtion *" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Quantity *" /></td>
					<td><p:inputText /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Value *" /></td>
					<td><p:inputText /> <p:selectOneMenu>
							<f:selectItem itemLabel="MYR" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Purchase Method *" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="Cash" itemValue="1" />
							<f:selectItem itemLabel="Credit Card" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Guarantor Name" /></td>
					<td><p:inputText /></td>
				</tr>

			</table>
		</p:panel>
		<br />
		<div align="center">
			<p:commandButton value="Save" onclick="equipmentDialog.hide();" />
			<p:commandButton value="Cancel" onclick="equipmentDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
