<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.machine.panHdr']}" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.machineryVerified}"
							id="poMachVer">
							<p:ajax update=":form:tt:machInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:machInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.machineryVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.machineryVerified}"
							id="apprMachVer">
							<p:ajax update=":form:tt:machInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:machInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.machineryVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="machInfPan">
			<p:blockUI block=":form:tt:machInfPan" widgetVar="buiPoMach"
				id="poMachBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.machineryVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.machineryVerified : false)}" />

			<p:dataTable var="macBean" widgetVar="smMachDtWidVar"
				value="#{backingBean.managedBean.smAppl.smMachineDtls}"
				selection="#{backingBean.managedBean.selectedMachineList}"
				rowKey="#{macBean}" rowIndexVar="index" id="macDt">
				<ac:paginator for="macDt" />
				<p:column selectionMode="multiple" width="5%" />

				<p:column headerText="#{lbl['lbl.sm.machine.equiType']}">
					<h:outputText value="#{macBean.machineType}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.brand']}">
					<h:outputText value="#{macBean.brandName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.machine.function']}">
					<h:outputText value="#{macBean.machineFunction}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.quantity']}">
					<h:outputText value="#{macBean.qty}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.value']}">
					<h:outputText value="#{macBean.value}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink partialSubmit="true" process="@this"
						action="#{backingBean.assignSelMachinery(macBean)}"
						update=":form:tt:equipmentDialog" style="padding-right:5px">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					update=":form:tt:equipmentDialog" process="@this"
					partialSubmit="true" action="#{backingBean.assignNewMachineryBean}" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					action="#{backingBean.deleteSelectedMachinery}"
					partialSubmit="true" process="machInfPan" update=":form:tt:macDt" />
			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.machineryRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.machineryRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.machineryRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="600px" height="350px"
		header="#{lbl['lbl.sm.machine.diaHdr']}" widgetVar="equipmentDialog"
		resizable="false" showEffect="fade" closable="false" hideEffect="fade"
		modal="true" id="equipmentDialog">

		<p:messages id="equipmentDialogMsg" showSummary="false"
			showDetail="true" autoUpdate="true" closable="true" />

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.equiType']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="50"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.machine.equiType']}" id="smMachEquiType"
						value="#{backingBean.managedBean.selectedMachine.machineType}"
						size="35" /> <p:message id="smMachEquiTypeMsg"
						for="smMachEquiType" showSummary="true" showDetail="false"
						display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.brand']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="50"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.machine.brand']}" id="smMachBrand"
						value="#{backingBean.managedBean.selectedMachine.brandName}"
						size="35">
					</p:inputText> <p:message id="smMachBrandMsg" for="smMachBrand"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.function']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="50"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.machine.function']}" id="smMachFnc"
						value="#{backingBean.managedBean.selectedMachine.machineFunction}"
						size="35" /> <p:message id="smMachFncMsg" for="smMachFnc"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.quantity']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="6"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.machine.quantity']}" id="smMachQuant"
						value="#{backingBean.managedBean.selectedMachine.qty}" size="35" />
					<p:message id="smMachQuantMsg" for="smMachQuant" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.value']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="18"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.machine.value']}" id="smMachVal"
						value="#{backingBean.managedBean.selectedMachine.value}" size="35">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText> <p:message id="smMachValMsg" for="smMachVal" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.purMthd']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.machine.purMthd']}" id="smMachPurMthd"
						value="#{backingBean.managedBean.selectedMachine.purchaseMethod}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.machine.cash']}" itemValue="A" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.machine.credit.card']}" itemValue="B" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.machine.debit.card']}" itemValue="C" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.machine.online.banking']}" itemValue="D" />
					</p:selectOneMenu> <p:message id="smMachPurMthdMsg" for="smMachPurMthd"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.guarnName']}" /></td>
				<td><p:inputText maxlength="50"
						value="#{backingBean.managedBean.selectedMachine.guarantorName}"
						size="35" /></td>
			</tr>


		</table>
		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				action="#{backingBean.addOrUpdateMachineToSmAppl}"
				partialSubmit="true" process="equipmentDialog"
				update=":form:tt:macDt, @([Id$=Msg])" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				partialSubmit="true" process="@this"
				action="#{backingBean.cancelMachineSaveorUpdate}" />
		</div>
	</p:dialog>
</ui:composition>
