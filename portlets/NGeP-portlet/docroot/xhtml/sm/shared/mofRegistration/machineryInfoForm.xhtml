<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.machine.panHdr']}" toggleable="true">
		<table style="width: 100%">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.machineryVerified}"
							id="poMachVer">
							<p:ajax update=":form:tt:machInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:machInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.machineryVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.machineryVerified}"
							id="apprMachVer">
							<p:ajax update=":form:tt:machInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:machInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.machineryVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<p:outputPanel id="machInfPan" layout="block">
			<p:blockUI block=":form:tt:machInfPan" widgetVar="buiPoMach"
				id="poMachBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.machineryVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.machineryVerified : false)}" />

			<p:dataTable var="macBean" widgetVar="smMachDtWidVar"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.smAppl.smMachineDtls}"
				selection="#{backingBean.managedBean.selectedMachineList}"
				rowKey="#{macBean}" rowIndexVar="index" id="macDt">
				<ac:paginator for="macDt" />
				<p:column selectionMode="multiple" width="1%" rendered="#{not empty backingBean.managedBean.smAppl.smMachineDtls}"/>
				
				<p:column headerText="#{lbl['lbl.sm.machine.category']}">
					<h:outputText value="#{backingBean.getMachineCategoryType(macBean)}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.machine.categorycode']}" style="width : 25%;white-space: normal;">
					<h:outputText value="#{macBean.categoryCode.categoryL3Code} - #{macBean.categoryCode.categoryName}" 
						rendered="#{not empty macBean.categoryCode}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.machine.equiType']}" style="width : 25%;white-space: normal;">
					<h:outputText value="#{macBean.machineType}" rendered="#{not empty macBean.machineType}"/>
					<h:outputText value="#{macBean.machine.machineDesc}" rendered="#{empty macBean.machineType}"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.brand']}">
					<h:outputText value="#{macBean.brandName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.machine.function']}">
					<h:outputText value="#{macBean.machineFunction}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.quantity']}">
					<h:outputText value="#{macBean.qty}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.value']}">
					<ac:labelAmount value="#{macBean.value}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink partialSubmit="true" process="@this"
						action="#{backingBean.assignSelMachinery(macBean)}"
						update=":form:tt:equipmentDialog" style="padding-right:5px" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					update=":form:tt:equipmentDialog" process="@this"
					partialSubmit="true" action="#{backingBean.assignNewMachineryBean}" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					action="#{backingBean.deleteSelectedMachinery}" id="delMachBtnId"
					disabled="#{empty backingBean.managedBean.smAppl.smMachineDtls}"
					partialSubmit="true" process="machInfPan" update=":form:tt:macDt,@this" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="machSecPormrk"
								validatorMessage="#{lbl['lbl.sm.machine.panHdr']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.machineryRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="machSecPormrkMsg" for="machSecPormrk"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.machineryRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="machSecApprvrRmrk"
								validatorMessage="#{lbl['lbl.sm.machine.panHdr']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.machineryRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="machSecApprvrRmrkMsg" for="machSecApprvrRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="700px" height="400px"
		header="#{lbl['lbl.sm.machine.diaHdr']}" widgetVar="equipmentDialog"
		resizable="false" showEffect="fade" closable="false" hideEffect="fade"
		modal="true" id="equipmentDialog">
		
		<p:outputPanel id="machineOutPanelId">
			<p:messages id="equipmentDialogMsg" showSummary="false"
				showDetail="true" autoUpdate="true" closable="true" />
	
			<table style="width: 100%">
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.machine.category']}" /> 
						<p:outputLabel value="*" styleClass="mandatory"/>
					</td>
					<td><p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.machine.category']}" id="smMachineCatTypeId"
							value="#{backingBean.managedBean.selectedMachine.categoryType.parameterId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems value="#{backingBean.managedBean.categoryTypeItems}" />
							<p:ajax event="change" process="@this" 
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								listener="#{backingBean.onChangeCategoryType()}"
								update="machineOutPanelId" />
						</p:selectOneMenu>
						<p:message id="smMachineCatTypeIdMsg" for="smMachineCatTypeId"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<p:outputPanel rendered="#{backingBean.managedBean.selectedMachine.categoryType.parameterCode eq 'PC'}">
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.sm.machine.categorycode']}" /> 
							<p:outputLabel value="*" styleClass="mandatory"/>
						</td>
						<td><p:selectOneMenu
								required="#{backingBean.managedBean.valueReqd}"
								label="#{lbl['lbl.sm.machine.categorycode']}" id="smMachineCatCodeId"
								value="#{backingBean.managedBean.selectedMachine.categoryCode.categoryL3Id}"
								style="width: 207px;margin-bottom: 5px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems value="#{backingBean.managedBean.categoryCodeItems}" />
								<p:ajax event="change" process="@this"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									listener="#{backingBean.onChangeCategoryCode()}"
									update="machineOutPanelId" />
							</p:selectOneMenu>
							<p:message id="smMachineCatCodeIdMsg" for="smMachineCatCodeId"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</p:outputPanel>
				<tr>
					<td style="border-style: none !important;float: right !important;">
						<p:selectBooleanCheckbox value="#{backingBean.managedBean.othersMachine}">
							<p:ajax event="change" partialSubmit="true" process="@this" 
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								update="machineOutPanelId" listener="#{backingBean.onTickOtherMachine()}"/>
						</p:selectBooleanCheckbox>
					</td>
					<td valign="top" style="border-style: none !important;">
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.machine.equiType.others']}" />
					</td>
				</tr>
				<p:outputPanel rendered="#{!backingBean.managedBean.othersMachine}">
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.sm.machine.equiType']}" /> 
							<p:outputLabel value="*" styleClass="mandatory"/>
						</td>
						<td><p:selectOneMenu
								required="#{backingBean.managedBean.valueReqd}"
								label="#{lbl['lbl.sm.machine.equiType']}" id="smMachineTypeId"
								value="#{backingBean.managedBean.selectedMachine.machine.machineId}"
								style="width: 207px;margin-bottom: 5px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems value="#{backingBean.managedBean.machineItems}" />
								<p:ajax event="change" process="@this" update="@this" />
							</p:selectOneMenu>
							<p:message id="smMachineTypeIdMsg" for="smMachineTypeId"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</p:outputPanel>
				<p:outputPanel rendered="#{backingBean.managedBean.othersMachine}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.machine.equiType']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><p:inputText maxlength="50"
								required="#{backingBean.managedBean.valueReqd}"
								label="#{lbl['lbl.sm.machine.equiType']}" id="smMachEquiType"
								value="#{backingBean.managedBean.selectedMachine.machineType}"
								size="35" >
								<p:ajax process="@this" update="@this,smMachEquiTypeMsg" partialSubmit="true" event="blur" />
							</p:inputText> 
							<p:message id="smMachEquiTypeMsg"
								for="smMachEquiType" showSummary="true" showDetail="false"
								display="icon" />
						</td>
					</tr>
				</p:outputPanel>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.brand']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="50"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.machine.brand']}" id="smMachBrand"
							value="#{backingBean.managedBean.selectedMachine.brandName}"
							size="35">
							<p:ajax process="@this" update="@this,smMachBrandMsg" partialSubmit="true" event="blur" />
						</p:inputText> 
						<p:message id="smMachBrandMsg" for="smMachBrand"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.function']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="50"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.machine.function']}" id="smMachFnc"
							value="#{backingBean.managedBean.selectedMachine.machineFunction}"
							size="35" >
							<p:ajax process="@this" update="@this,smMachFncMsg" partialSubmit="true" event="blur" />
						</p:inputText> 
						<p:message id="smMachFncMsg" for="smMachFnc"
							showSummary="true" showDetail="false" display="icon" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.quantity']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="6"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.machine.quantity']}" id="smMachQuant"
							value="#{backingBean.managedBean.selectedMachine.qty}" size="35">
							<p:ajax process="@this" update="@this,smMachQuantMsg" partialSubmit="true" event="blur" />
						</p:inputText>
						<p:message id="smMachQuantMsg" for="smMachQuant" showSummary="true"
							showDetail="false" display="icon" />
					</td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.value']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="18"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.machine.value']}" id="smMachVal"
							value="#{backingBean.managedBean.selectedMachine.value}" size="35">
							<f:validateDoubleRange 
								minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
								maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							<p:ajax process="@this" partialSubmit="true" event="blur"
								update="@this,smMachValMsg" />
						</p:inputText> 
						<p:message id="smMachValMsg" for="smMachVal" showSummary="true"
							showDetail="false" display="icon" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.purMthd']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.machine.purMthd']}" id="smMachPurMthd"
							value="#{backingBean.managedBean.selectedMachine.purchaseMethod}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItems value="#{backingBean.getDropdownCodeValues('BM')}" />
							<p:ajax process="@this" update="@this,smMachPurMthdMsg" partialSubmit="true" event="change" />
						</p:selectOneMenu> 
						<p:message id="smMachPurMthdMsg" for="smMachPurMthd"
							showSummary="true" showDetail="false" display="icon" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.guarnName']}" /></td>
					<td><p:inputText maxlength="50"
							value="#{backingBean.managedBean.selectedMachine.guarantorName}"
							size="35" >
							<p:ajax process="@this" update="@this" partialSubmit="true" event="blur" />
						</p:inputText>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.machine.purchase.year']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText style="margin-bottom : 5px;" maxlength="4"
							required="#{backingBean.managedBean.valueReqd}"
							validatorMessage="#{lbl['lbl.sm.machine.purchase.year.invalid.msg']}"
							label="#{lbl['lbl.sm.machine.purchase.year']}" id="smMachPurYr"
							value="#{backingBean.managedBean.selectedMachine.purchaseYear}"
							size="35">
							<f:validateLongRange minimum="1950" 
								maximum="#{backingBean.managedBean.currYear}" />
							<p:ajax process="@this" update="@this,smMachPurYrMsg" partialSubmit="true" event="blur" />
						</p:inputText> 
						<p:message id="smMachPurYrMsg" for="smMachPurYr"
							showSummary="true" showDetail="false" display="icon" />
					</td>
				</tr>
	
	
			</table>
		</p:outputPanel>
		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				action="#{backingBean.addOrUpdateMachineToSmAppl}"
				partialSubmit="true" process="equipmentDialog"
				onclick="this.disabled=true;" oncomplete="this.disabled=false;"
				update=":form:tt:macDt, @([Id$=Msg]),:#{p:component('delMachBtnId')}" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				partialSubmit="true" process="@this" update="machineOutPanelId"
				action="#{backingBean.cancelMachineSaveorUpdate}" />
		</div>
	</p:dialog>
</ui:composition>
