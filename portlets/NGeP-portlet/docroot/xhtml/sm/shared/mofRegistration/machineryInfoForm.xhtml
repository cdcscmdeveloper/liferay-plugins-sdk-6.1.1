<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header=" Machinery / Equipment List" toggleable="true">
		<table style="width: 250px">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By PO: "
						title="For PO to highlight the verified section " /></td>

			</tr>
			<tr>
				<td width="10px"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By Approver: "
						title="For Approver to highlight the verified section " /></td>
			</tr>
		</table>
		<br />
		<p:dataTable var="utilBean"
			value="#{mofRegistrationBackingBean.utilList}"
			selection="#{mofRegistrationBackingBean.managedBean.selectedUtilList}"
			rowKey="#{utilBean.seqNo}" rowIndexVar="index">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<p:outputLabel value="1" />
			</p:column>

			<p:column headerText="Equipment Type">
				<p:commandLink value="Screwdrivers"
					onclick="equipmentDialog.show();" />
			</p:column>

			<p:column headerText="Brand">
				<p:outputLabel value="Stanley's" />
			</p:column>
			<p:column headerText="Function">
				<p:outputLabel value="Fixing" />
			</p:column>

			<p:column headerText="Quantity">
				<p:outputLabel value="10" />
			</p:column>

			<p:column headerText="Value">
				<p:outputLabel value="RM.150.00" />
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Machinery"
				onclick="equipmentDialog.show();" />
			<p:commandButton value="Delete Machine(s)" />
		</div>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog width="600px" header="Manufacturing / Assembly Page"
		widgetVar="equipmentDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		<p:panel header="Machinery / Equipment Information">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Type Machinery / Equipment(s)" /></td>
					<td><p:inputText /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Brand" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Funtion *" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Quantity *" /></td>
					<td><p:inputText /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Value *" /></td>
					<td>
						<table>
							<tr>
								<td style="padding-right: 20px;"><p:inputText /></td>
								<td valign="top"><p:selectOneMenu>
										<f:selectItem itemLabel="MYR" itemValue="1" />
									</p:selectOneMenu></td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="Purchase Method *" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="Cash" itemValue="1" />
							<f:selectItem itemLabel="Credit Card" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Guarantor Name" /></td>
					<td><p:inputText /></td>
				</tr>

			</table>
		</p:panel>
		<br />
		<div align="center">
			<p:commandButton value="Save" onclick="equipmentDialog.hide();" />
			<p:commandButton value="Cancel" onclick="equipmentDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
