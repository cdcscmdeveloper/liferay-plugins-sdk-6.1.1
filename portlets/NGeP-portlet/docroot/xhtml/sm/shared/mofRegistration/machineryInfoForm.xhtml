<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header=" Machinery / Equipment Details" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.machineryVerified}"
							id="poMachVer">
							<p:ajax update=":form:tt:machInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.machineryVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.machineryVerified}"
							id="apprMachVer">
							<p:ajax update=":form:tt:machInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.machineryVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="machInfPan">
			<p:blockUI block=":form:tt:machInfPan" widgetVar="buiPoMach"
				id="poMachBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.machineryVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.machineryVerified : false)}" />

			<p:dataTable var="macBean"
				value="#{backingBean.managedBean.smAppl.smMachineDtls}"
				selection="#{backingBean.managedBean.selectedMachineList}"
				rowKey="#{macBean}" rowIndexVar="index" id="macDt">
				<ac:paginator for="macDt" />
				<p:column selectionMode="multiple" width="5%" />

				<p:column headerText="Equipment Type">
					<h:outputText value="#{macBean.machineType}" />
				</p:column>

				<p:column headerText="Brand">
					<h:outputText value="#{macBean.brandName}" />
				</p:column>
				<p:column headerText="Function">
					<h:outputText value="#{macBean.machineFunction}" />
				</p:column>

				<p:column headerText="Quantity">
					<h:outputText value="#{macBean.qty}" />
				</p:column>

				<p:column headerText="Value(RM.)">
					<h:outputText value="#{macBean.value}" />
				</p:column>
				<p:column headerText="Action">
					<p:commandLink oncomplete="equipmentDialog.show();"
						action="#{backingBean.assignSelMachinery(macBean)}"
						update=":form:tt:eqDia" style="padding-right:5px">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="Add" oncomplete="equipmentDialog.show();"
					update=":form:tt:eqDia"
					action="#{backingBean.assignNewMachineryBean}" />
				<p:commandButton value="Delete"
					action="#{backingBean.deleteSelectedMachinery}"
					update=":form:tt:macDt" />
			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.machineryRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.machineryRemark}" /></td>
						<td><p:outputLabel value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.machineryRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="600px" header="Machinery / Equipment Information"
		widgetVar="equipmentDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="eqDia">
		<!-- <p:panel header="Machinery / Equipment Information"> -->

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Machinery Type" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedMachine.machineType}"
						size="35" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Brand" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedMachine.brandName}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Funtion" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedMachine.machineFunction}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Quantity" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedMachine.qty}" size="35" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="* Value (RM.)" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedMachine.value}" size="35" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Purchase Method" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedMachine.purchaseMethod}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select --" itemValue="" />
						<f:selectItem itemLabel="Cash" itemValue="A" />
						<f:selectItem itemLabel="Credit Card" itemValue="B" />
						<f:selectItem itemLabel="Debit Card" itemValue="C" />
						<f:selectItem itemLabel="Online Banking" itemValue="D" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Guarantor Name" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedMachine.guarantorName}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="*Associated Facility" /></td>

				<td><p:selectManyMenu showCheckbox="true">
						<f:selectItems
							value="#{backingBean.managedBean.smAppl.smFacilities}" var="fac"
							itemLabel="#{fac.ownerName}" itemValue="#{fac.ownerName}" />
					</p:selectManyMenu></td>

			</tr>

		</table>
		<!-- </p:panel> -->
		<br />
		<div align="right">
			<p:commandButton value="Save" oncomplete="equipmentDialog.hide();"
				action="#{backingBean.addOrUpdateMachineToSmAppl}"
				update=":form:tt:macDt" />
			<p:commandButton value="Cancel" onclick="equipmentDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
