<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<script>
		$('.blinkClass').each(function() {
		    var elem = $(this);
		    setInterval(function() {
		        if (elem.css('visibility') == 'hidden') {
		            elem.css('visibility', 'visible');
		        } else {
		            elem.css('visibility', 'hidden');
		        }    
		    }, 1000);
		});
	</script>
	
	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr height="10"><td colspan="4"></td></tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.appl.status.createdbydate']}" styleClass="outputLabel-view-label"/>
				</td>
				<td>
					<p:outputLabel value="#{backingBean.managedBean.applStatusInfo.createdByAndDate}" styleClass="outputLabel-view"/>
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.epNo']}" />
				</td>
				<td>
					<p:outputLabel value="#{backingBean.managedBean.smSupplier.epNo}" styleClass="outputLabel-view"/>
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.application.no']}" />
				</td>
				<td>
					<p:outputLabel value="#{backingBean.managedBean.smAppl.applNo}" styleClass="outputLabel-view"/>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.appl.status.modifiedbydate']}" styleClass="outputLabel-view-label"/>
				</td>
				<td>
					<p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.applStatusInfo.modifiedByAndDate}" />
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.mofNo']}" />
				</td>
				<td>
					<p:outputLabel value="#{backingBean.managedBean.mofNumber}" styleClass="outputLabel-view"/>
				</td>
				<td
					style="color: red; font-weight: bold; text-align: right;">
					<h:outputText value="#{lbl['lbl.sm.lastSubmitDate']}" />&#160;&#160;
				</td>
				<td
					style="color: red; font-weight: bold; text-align: left;">
					<h:outputText
						value="#{backingBean.managedBean.applStatusInfo.submissionDate} " />
					<span id="blinkId" class="blinkClass"><h:outputText id="daysLeftId"
						value="#{backingBean.managedBean.applStatusInfo.daysLeft}" /></span>
				</td>
			</tr>
		</table>
	</div>

</ui:composition>
