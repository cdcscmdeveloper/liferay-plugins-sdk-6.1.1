<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
	<style type="text/css">
		.blink_text {

	    animation:1s blinker linear infinite;
	    -webkit-animation:1s blinker linear infinite;
	    -moz-animation:1s blinker linear infinite;
	
	     color: red;
	    }
	
	    @-moz-keyframes blinker {  
	     0% { opacity: 1.0; }
	     50% { opacity: 0.0; }
	     100% { opacity: 1.0; }
	     }
	
	    @-webkit-keyframes blinker {  
	     0% { opacity: 1.0; }
	     50% { opacity: 0.0; }
	     100% { opacity: 1.0; }
	     }
	
	    @keyframes blinker {  
	     0% { opacity: 1.0; }
	     50% { opacity: 0.0; }
	     100% { opacity: 1.0; }
	     }
	</style>
	
	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr height="10">
				<td colspan="4"></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.appl.status.createdbydate']}"
						styleClass="outputLabel-view-label" /></td>
				<td><p:outputLabel
						value="#{backingBean.managedBean.applStatusInfo.createdByAndDate}"
						styleClass="outputLabel-view" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.epno']}"
						styleClass="outputLabel-view-label" /></td>
				<td><p:outputLabel
						value="#{backingBean.managedBean.smSupplier.epNo}"
						styleClass="outputLabel-view" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.application.no']}"
						styleClass="outputLabel-view-label" /></td>
				<td><p:outputLabel
						value="#{backingBean.managedBean.smAppl.applNo}"
						styleClass="outputLabel-view"
						rendered="#{backingBean.managedBean.smAppl.activeAppl or backingBean.managedBean.smAppl.resubmit}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.appl.status.modifiedbydate']}"
						styleClass="outputLabel-view-label" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						value="#{backingBean.managedBean.applStatusInfo.modifiedByAndDate}" />
				</td>
				<td><p:outputLabel value="#{lbl['lbl.sm.mofNo']}"
						styleClass="outputLabel-view-label" /></td>
				<td><p:outputLabel value="#{backingBean.managedBean.mofNumber}"
						styleClass="outputLabel-view" /></td>
				<td style="color: red; font-weight: bold; text-align: right;">
					<span class="blink_text"><h:outputText value="#{lbl['lbl.sm.lastSubmitDate']}" /></span>
					&#160;&#160;
				</td>
				<td style="color: red; font-weight: bold; text-align: left;">
					<span class="blink_text">
						<h:outputText id="daysLeftId"
							value="#{backingBean.managedBean.applStatusInfo.submissionDate} #{backingBean.managedBean.applStatusInfo.daysLeft}" />
					</span>
				</td>
			</tr>
			<p:outputPanel rendered="#{not empty backingBean.managedBean.rejectReasonsMsg and backingBean.managedBean.smAppl.resubmit}">
				<tr>
					<td style="vertical-align: baseline;"><p:outputLabel
							value="#{lbl['lbl.sm.rejection.reasons']}"
							styleClass="outputLabel-view-label" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" escape="false"
							value="#{backingBean.managedBean.rejectReasonsMsg}" />
					</td>
					<td colspan="4">&#160;</td>
				</tr>
			</p:outputPanel>
		</table>
	</div>

</ui:composition>
