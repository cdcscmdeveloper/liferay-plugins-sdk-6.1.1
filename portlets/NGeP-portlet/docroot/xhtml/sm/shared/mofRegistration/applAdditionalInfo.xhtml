<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<script>
		function blink(selector){
		$(selector).fadeOut('slow', function(){
		    $(this).fadeIn('slow', function(){
		        blink(this);
		    });
		});
		}
		 
		blink('#blinkId');
	</script>

	<table style="width: 100%">
		<tr>
			<td
				style="color: red; font-weight: bolder; padding-right: 5px; text-align: right;">
				<h:outputText value="#{lbl['lbl.sm.lastSubmitDate']}" />
			</td>
			<td
				style="color: red; font-weight: bolder; text-align: left; width: 200px;">
				<h:outputText
					value="#{backingBean.managedBean.applStatusInfo.submissionDate} " />
				<span id="blinkId"><h:outputText id="daysLeftId"
					value="#{backingBean.managedBean.applStatusInfo.daysLeft}" /></span>
			</td>
		</tr>
		<tr>
			<td
				style="color: red; font-weight: bolder; padding-right: 5px; text-align: right;">
				<h:outputText value="#{lbl['lbl.sm.appl.status.createdbydate']} :" />
			</td>
			<td
				style="color: red; font-weight: bolder; text-align: left; width: 200px;">
				<h:outputText
					value="#{backingBean.managedBean.applStatusInfo.createdByAndDate}" />
			</td>
		</tr>
		<tr>
			<td
				style="color: red; font-weight: bolder; padding-right: 5px; text-align: right;">
				<h:outputText value="#{lbl['lbl.sm.appl.status.modifiedbydate']} :" />
			</td>
			<td
				style="color: red; font-weight: bolder; text-align: left; width: 200px;">
				<h:outputText
					value="#{backingBean.managedBean.applStatusInfo.modifiedByAndDate}" />
			</td>
		</tr>
	</table>

</ui:composition>
