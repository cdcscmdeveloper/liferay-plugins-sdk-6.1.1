<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel id="catCodeInfPan" layout="block" >
	
		<p:panel header="#{lbl['lbl.sm.catCodes.existing.panHdr']}" toggleable="true" >
			<p:dataTable var="aprvdCatBean"
				widgetVar="smApprvdCatCodesNonRenewApplDtWidVar"
				value="#{backingBean.managedBean.approvedCategoryList}"
				rowKey="#{aprvdCatBean}" rowIndexVar="index" id="catExistDt"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" 
				selection="#{backingBean.managedBean.deleteExistingCategoryList}">
				<ac:paginator for="catExistDt" />
				<p:column selectionMode="multiple" style="width:2%" rendered="#{!backingBean.managedBean.approverUser}" />
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 2%;">
					<p:outputLabel value="#{index + 1}"
						style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.cate']}" style="white-space : normal">
					<h:outputText
						value="#{aprvdCatBean.pmCategoryL1.categoryL1Code} -  #{empty aprvdCatBean.categoryL1Name ? aprvdCatBean.pmCategoryL1.categoryName : aprvdCatBean.categoryL1Name}" />
					<br />
					<h:outputText
						value="#{aprvdCatBean.pmCategoryL2.categoryL2Code} -  #{empty aprvdCatBean.categoryL2Name ? aprvdCatBean.pmCategoryL2.categoryName : aprvdCatBean.categoryL2Name}" />
					<br />
					<h:outputText
						value="#{aprvdCatBean.pmCategoryL3.categoryL3Code} -  #{empty aprvdCatBean.categoryL3Name ? aprvdCatBean.pmCategoryL3.categoryName : aprvdCatBean.categoryL3Name}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}" style="white-space : normal">
					<h:outputText value="#{lbl['lbl.sm.no.available']}"
						rendered="#{empty aprvdCatBean.otherDesc}" />
					<h:outputText value="#{aprvdCatBean.otherDesc}"
						rendered="#{not empty aprvdCatBean.otherDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}" style="width : 15%;white-space : normal">
					<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
						rendered="#{!aprvdCatBean.specialCategory}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
						rendered="#{aprvdCatBean.specialCategory}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.status']}" style="width : 10%;white-space : normal">
					<h:outputText value="#{lbl['lbl.sm.catCodes.pendingDec']}"
					rendered="#{aprvdCatBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.pendingVer']}"
						rendered="#{aprvdCatBean.recordStatusFlg eq SupplierManagementConst.PENDING_RE_APPROVAL_STATUS}" />
					<p:graphicImage id="pendReApprvImg"
						value="/css/images/design/icon_alert.png"
						style="padding-left : 3px;"
						rendered="#{aprvdCatBean.recordStatusFlg eq SupplierManagementConst.PENDING_RE_APPROVAL_STATUS}" />
					<p:tooltip for="pendReApprvImg">
						<h:outputText value="#{lbl['lbl.sm.catCodes.prevAppvd.toolTip']}" />
					</p:tooltip>
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{aprvdCatBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<c:if test="#{!backingBean.managedBean.approverUser}">
				<div align="right">
					<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
						onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
						action="#{backingBean.deleteSelectedExistingCatCodes}"
						update=":form:tt:catCodeInfPan" partialSubmit="true"
						process=":form:tt:catCodeInfPan">
					</p:commandButton>
				</div>
			</c:if>
		</p:panel>
		
		<p:panel header="#{lbl['lbl.sm.addtnl.catCodes.panHdr']}" toggleable="true">
			<c:if test="#{backingBean.managedBean.overLappedCategoryExists}">
				<table style="width: 100%">
					<tr>
						<td><h:outputText styleClass="instruction" value="#{backingBean.managedBean.overLappedCategoryMsg}" escape="false"/></td>
					</tr>
				</table>
			</c:if>
			<c:choose>
				<c:when
					test="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser  and backingBean.managedBean.smAppl.supplierType ne 'J'}">
					<table>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.catType']}" /></td>
							<td><h:outputText value="#{lbl['lbl.sm.catCodes.catTypeNrm']}" /></td>
						</tr>
					</table>
				</c:when>
				<c:otherwise>
					<table style="width: 100%">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.applCatType']}" /></td>
							<td>
								<c:choose>
									<c:when test="#{backingBean.managedBean.smAppl.supplierType eq 'J'}">
										<c:choose>
											<c:when test="#{backingBean.managedBean.supplierUser}">
												<td><p:selectOneRadio
													value="#{backingBean.managedBean.physicalConsulting}">
													<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.physical.service']}"
														itemValue="33" />
													<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.non.physical.service']}"
														itemValue="34" />
													<p:ajax event="change" oncomplete="typeConfirmation.show()"
														listener="#{backingBean.applicationCategorySelected}"
														update="@([id$=typeConfirmationId])" process="@this"/>
												</p:selectOneRadio></td>
											</c:when>
											<c:otherwise>
												<p:outputPanel rendered="#{backingBean.managedBean.physicalConsulting eq '33'}">
													#{lbl['lbl.sm.catCodes.physical.service']}
												</p:outputPanel>
												<p:outputPanel rendered="#{backingBean.managedBean.physicalConsulting eq '34'}">
													#{lbl['lbl.sm.catCodes.non.physical.service']}
												</p:outputPanel>
											</c:otherwise>
										</c:choose>
									</c:when>
									<c:otherwise>
										<p:outputPanel rendered="#{backingBean.managedBean.smAppl.applCategoryType eq 'N'}">
											#{lbl['lbl.sm.catCodes.catTypeNrm']}
										</p:outputPanel>
										<p:outputPanel rendered="#{backingBean.managedBean.smAppl.applCategoryType eq 'S'}">
											#{lbl['lbl.sm.catCodes.catTypeSpl']}
										</p:outputPanel>
									</c:otherwise>
								</c:choose>
							</td>
							<c:if test="#{backingBean.managedBean.poUser or backingBean.managedBean.approverUser}">
								<td>
									<div align="right" style="width: 99%">
										<p:commandButton value="#{lbl['lbl.sm.approve.all']}"
											onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
											action="#{backingBean.approveAllCategoryCodesByPOorApprover}"
											update=":form">
											<f:param name="disableValidation" value="true" />
										</p:commandButton>
									</div>
								</td>
							</c:if>
						</tr>
					</table>
				</c:otherwise>
			</c:choose>
			<br />
			<h:inputHidden
				value="#{backingBean.managedBean.smAppl.supportingDocMode}" />
			<ui:include src="regCatCodesFoRenewalApplicationTable.xhtml" />
		</p:panel>
		
		<br />
	</p:outputPanel>
	
	<p:dialog width="1000px" header="#{lbl['lbl.sm.catCodes.diaHdr']}"
		widgetVar="regCatDialog" resizable="false" showEffect="fade"
		closable="false" hideEffect="fade" modal="true" id="regCatDialog">

		<p:outputPanel id="catPanel">
			<p:messages id="regCatCodeMsg" showSummary="false" showDetail="true"
				autoUpdate="true" closable="true" />
			<table style="width: 100%">

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.mainCat']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="supCatParCat"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.catCodes.mainCat']}"
							value="#{backingBean.managedBean.selectedCategory.pmCategoryL1.categoryL1Id}"
							style="width: 680px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.supplierParentCatList}"
								var="parent"
								itemLabel="#{parent.categoryL1Code} - #{parent.categoryName}"
								itemValue="#{parent.categoryL1Id}" />
							<p:ajax event="change"
								listener="#{backingBean.populateChildCategoryByParent(backingBean.managedBean.selectedCategory.pmCategoryL1.categoryL1Id,
								backingBean.managedBean.selectedCategory.pmCategoryL2,
								backingBean.managedBean.selectedCategory.pmCategoryL3)}"
								update="child,subChild" />
						</p:selectOneMenu> <p:message id="supCatParCatMsg" for="supCatParCat"
							showSummary="true" showDetail="false" display="icon" /></td>


				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.subCat']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.catCodes.subCat']}"
							value="#{backingBean.managedBean.selectedCategory.pmCategoryL2.categoryL2Id}"
							id="child" style="width: 680px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.supplierChildCatList}"
								var="child"
								itemLabel="#{child.categoryL2Code} - #{child.categoryName}"
								itemValue="#{child.categoryL2Id}" />
							<p:ajax event="change"
								listener="#{backingBean.populateSubChildCategoryByChild(backingBean.managedBean.selectedCategory.pmCategoryL2.categoryL2Id,backingBean.managedBean.selectedCategory.pmCategoryL3)}"
								update="subChild" />
						</p:selectOneMenu> <p:message id="childMsg" for="child" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.subCatDiv']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd}"
							label=" #{lbl['lbl.sm.catCodes.subCatDiv']}"
							value="#{backingBean.managedBean.selectedCategory.pmCategoryL3.categoryL3Id}"
							id="subChild" style="width: 680px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.supplierSubChildCatList}"
								var="subChild"
								itemLabel="#{subChild.categoryL3Code} - #{subChild.categoryName}"
								itemValue="#{subChild.categoryL3Id}" />
						</p:selectOneMenu> <p:message id="subChildMsg" for="subChild" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<!-- <tr>
					<td><p:outputLabel value="Business Type" /></td>
					<td><p:inputText readonly="true"
							title="Auto populated based on the category code selected"
							size="35" /></td>
				</tr> -->
				<tr>
					<td colspan="2">
						<div align="right">
							<p:commandButton value="#{lbl['lbl.sm.button.save']}"
								action="#{backingBean.saveSelectedCategory}"
								partialSubmit="true" process="regCatDialog"
								update=":form, @([id$=Msg])" />
							<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
								action="#{backingBean.cancelCategoryCodesSaveorUpdate}"
								partialSubmit="true" process="@this" />
						</div>
					</td>

				</tr>
			</table>
		</p:outputPanel>
		<br />

	</p:dialog>
	

</ui:composition>
