    <!-- AI Assistant Button CSS -->
	<style>
		/* AI Assistant Button Styling - Green Gradient like AI Logo */
		.ui-button.ai-assistant-btn {
			background: linear-gradient(135deg, #10b981 0%, #22c55e 50%, #84cc16 100%) !important;
			border: none !important;
			color: white !important;
			font-weight: 500 !important;
			padding: 8px 20px !important;
			border-radius: 6px !important;
			box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3) !important;
			transition: all 0.3s ease !important;
			position: relative !important;
			overflow: hidden !important;
			display: inline-flex !important;
			align-items: center !important;
			justify-content: center !important;
		}
	
		.ui-button.ai-assistant-btn:hover {
			background: linear-gradient(135deg, #059669 0%, #16a34a 50%, #65a30d 100%) !important;
			box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4) !important;
			transform: translateY(-1px) !important;
		}
	
		.ui-button.ai-assistant-btn:active {
			transform: translateY(0) !important;
			box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3) !important;
		}
	
		/* AI Icon/Sparkle Effect - Closer to text */
		.ui-button.ai-assistant-btn::before {
			content: "\2728";
			margin-right: 3px;
			display: inline-block;
			vertical-align: middle;
			line-height: 1;
		}
	
		/* Button text alignment */
		.ui-button.ai-assistant-btn .ui-button-text {
			display: inline-flex !important;
			white-space: nowrap !important;
			align-items: center !important;
			vertical-align: middle !important;
			gap: 3px !important;
		}
	
		/* Shimmer Animation Effect */
		.ui-button.ai-assistant-btn::after {
			content: "";
			position: absolute;
			top: 0;
			left: -100%;
			width: 100%;
			height: 100%;
			background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
			transition: left 0.5s;
			z-index: 0;
		}
	
		.ui-button.ai-assistant-btn:hover::after {
			left: 100%;
		}
		
		/* Center align the button container */
		.ai-assistant-container {
			text-align: left;
			vertical-align: middle;
		}
	</style>
