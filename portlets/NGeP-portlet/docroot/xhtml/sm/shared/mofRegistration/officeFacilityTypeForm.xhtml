<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.panHdr.offFacility']}" id="ofp"
		toggleable="true">
		<!-- Disable for UPS 32008 - START -->
		<table style="width: 350px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser and !backingBean.managedBean.upsCannotEdit}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.officeFacilityVerfied}"
							id="poOffVer">
							<p:ajax update=":form:tt:offInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:offInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.officeFacilityVerfied)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser and !backingBean.managedBean.upsCannotEdit}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.officeFacilityVerfied}"
							id="apprOffVer">
							<p:ajax update=":form:tt:offInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:offInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.officeFacilityVerfied)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<p:outputPanel id="offInfPan" layout="block">
			<p:blockUI rendered="#{!backingBean.managedBean.upsCannotEdit}" block=":form:tt:offInfPan" widgetVar="buiPoOff"
				id="poOffBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.officeFacilityVerfied : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.officeFacilityVerfied : false)}" />

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.facility.ownerType']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td style="padding-bottom: 2px;"><p:selectOneRadio
							id="ownTypeId" label="#{lbl['lbl.sm.facility.ownerType']}"
							value="#{backingBean.managedBean.basicCompanyFacility.ownershipType}"
							required="true"
							disabled="#{backingBean.managedBean.upsCannotEdit}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.facility.own']}"
								itemValue="O" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.facility.rent']}"
								itemValue="R" />
							<p:ajax update="ofp" event="change" process="@this"
								listener="#{backingBean.officeFacilitySelected}" />
						</p:selectOneRadio>
						
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges}"
							oriValue="#{backingBean.managedBean.latestAppl.hqFacility.ownershipType}" 
							currValue="#{backingBean.managedBean.basicCompanyFacility.ownershipType}" 
							alertValue="#{backingBean.getOwnershipTypeLabel(backingBean.managedBean.latestAppl.hqFacility.ownershipType)}"/>
						
						<p:message for="ownTypeId" showDetail="false" showSummary="true"
							display="icon" /></td>
					<td colspan='2'>&#160;</td>
				</tr>
				<!-- 29480 - Update: remove code for Re-endorsed CR -->
				<p:outputPanel rendered="#{backingBean.managedBean.basicCompanyFacility.ownershipType eq 'O' or backingBean.managedBean.basicCompanyFacility.ownershipType eq 'R'}">
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.sm.facility.facilityType']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
	
						<p:outputPanel
							rendered="#{!backingBean.managedBean.disabledHomeOffice}">
							<td style="padding-bottom: 4px;"><p:selectOneRadio
									id="rentedFacTypeId"
									value="#{backingBean.managedBean.basicCompanyFacility.facilityType}"
									required="true" label="#{lbl['lbl.sm.facility.facilityType']}"
									disabled="#{backingBean.managedBean.upsCannotEdit}">
									<f:selectItem
										itemLabel="#{lbl['lbl.sm.facility.facilityType.home.office']}"
										itemValue="H" />
	
									<f:selectItem
										itemLabel="#{lbl['lbl.sm.facility.facilityType.business.office']}"
										itemValue="B" />
										
									<p:ajax event="change" process="@this" partialSubmit="true" update="@this"
										listener="#{backingBean.onChangeFacilityType}"/>
								</p:selectOneRadio> 
								
								<ac:smFieldChangeAlert 
									isShow="#{backingBean.managedBean.showFieldChanges}"
									oriValue="#{backingBean.managedBean.latestAppl.hqFacility.facilityType}" 
									currValue="#{backingBean.managedBean.basicCompanyFacility.facilityType}" 
									alertValue="#{backingBean.getFacTypeLabel(backingBean.managedBean.latestAppl.hqFacility.facilityType)}"/>
								
								<p:message id="rentedFacTypeIdMsg" for="rentedFacTypeId"
									showSummary="true" showDetail="false" display="icon" /></td>
						</p:outputPanel>
						<p:outputPanel
							rendered="#{backingBean.managedBean.disabledHomeOffice}">
							<td><p:outputLabel styleClass="outputLabel-view"
									value="#{lbl['lbl.sm.facility.facilityType.business.office']}"></p:outputLabel>
							</td>
						</p:outputPanel>
						<td colspan='2'>&#160;</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{backingBean.managedBean.basicCompanyFacility.ownershipType eq 'R'?
								lbl['lbl.sm.facility.landLordName']:lbl['lbl.sm.facility.ownerName']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td>
							<p:inputText id="fcltyOwnerName"
								label="#{lbl['lbl.sm.facility.ownerName']}" maxlength="50"
								value="#{backingBean.managedBean.basicCompanyFacility.ownerName}"
								size="35" required="true"
								disabled="#{backingBean.managedBean.upsCannotEdit}"> 
								<p:ajax partialSubmit="true" process="@this" />
							</p:inputText>
								
								<ac:smFieldChangeAlert 
									isShow="#{backingBean.managedBean.showFieldChanges}"
									oriValue="#{backingBean.managedBean.latestAppl.hqFacility.ownerName}" 
									currValue="#{backingBean.managedBean.basicCompanyFacility.ownerName}" 
									alertValue="#{backingBean.managedBean.latestAppl.hqFacility.ownerName}"/>
								
								<p:message id="fcltyOwnerNameMsg"
								for="fcltyOwnerName" showSummary="true" showDetail="false"
								display="icon" /></td>
						<p:outputPanel rendered="#{backingBean.managedBean.basicCompanyFacility.ownershipType eq 'O'}">
							<td><p:outputLabel
									value="#{lbl['lbl.sm.facility.purchaseDate']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td style="padding-bottom: 3px;">
								<p:calendar showOn="button"
									id="purchaseDate" navigator="true" readonlyInput="true"
									display="inline" maxdate="#{CommonConstants.CURRENT_DATE}"
									label="#{lbl['lbl.sm.facility.purchaseDate']}"
									value="#{backingBean.managedBean.basicCompanyFacility.purchaseDate}"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									required="true" yearRange="-99:+0"
									disabled="#{backingBean.managedBean.upsCannotEdit}">
									<p:ajax event="dateSelect" process="@this" partialSubmit="true"/>
								</p:calendar> 
								
								<ac:smFieldChangeAlert 
									isShow="#{backingBean.managedBean.showFieldChanges}"
									oriValue="#{backingBean.managedBean.latestAppl.hqFacility.purchaseDate}" 
									currValue="#{backingBean.managedBean.basicCompanyFacility.purchaseDate}" 
									alertValue="#{backingBean.getDateFormat(backingBean.managedBean.latestAppl.hqFacility.purchaseDate)}"/>
								
								<p:message id="purchaseDateMsg" for="purchaseDate"
									showSummary="true" showDetail="false" display="icon" />
							</td>
						</p:outputPanel>
						<p:outputPanel rendered="#{backingBean.managedBean.basicCompanyFacility.ownershipType eq 'R'}">
							<td><p:outputLabel
										value="#{lbl['lbl.sm.facility.monthRent']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
							<td><p:inputText id="rental" rendered="#{backingBean.managedBean.basicCompanyFacility.ownershipType eq 'R'}"
									value="#{backingBean.managedBean.basicCompanyFacility.rentalRate}"
									size="35" required="true" maxlength="17"
									validatorMessage="#{lbl['lbl.sm.facility.monthRent']} - #{lbl['lbl.sm.minAmt.validMsg']}"
									label="#{lbl['lbl.sm.facility.monthRent']}"
									disabled="#{backingBean.managedBean.upsCannotEdit}">
									<f:validateDoubleRange
										minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
										maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
									<f:convertNumber
										pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
									<p:ajax process="@this" partialSubmit="true"
										update="@this,rentalMsg" />
								</p:inputText> 
								
								<ac:smFieldChangeAlert 
									isShow="#{backingBean.managedBean.showFieldChanges}"
									oriValue="#{backingBean.managedBean.latestAppl.hqFacility.rentalRate}" 
									currValue="#{backingBean.managedBean.basicCompanyFacility.rentalRate}" 
									alertValue="#{backingBean.getPriceAmountFormat(backingBean.managedBean.latestAppl.hqFacility.rentalRate)}"/>
								
								<p:message id="rentalMsg" for="rental" showSummary="true"
									showDetail="false" display="icon" />
							</td>
						</p:outputPanel>
					</tr>
				</p:outputPanel>
				<p:outputPanel rendered="#{backingBean.managedBean.basicCompanyFacility.ownershipType eq 'O'}">

						<td colspan='2'>&#160;</td>
						<td><p:outputLabel

						<td><p:inputText size="35" id="purchasePrice" maxlength="17"
								label="#{lbl['lbl.sm.facility.purchasePrice']}"
								validatorMessage="#{lbl['lbl.sm.facility.purchasePrice']} - #{lbl['lbl.sm.minAmt.validMsg']}"
								value="#{backingBean.managedBean.basicCompanyFacility.purchasePrice}"
								required="true"
								disabled="#{backingBean.managedBean.upsCannotEdit}">
								<f:validateDoubleRange
									minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
									maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								<p:ajax process="@this" partialSubmit="true"
									update="@this,purchasePriceMsg" />
							</p:inputText> 
							
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.managedBean.latestAppl.hqFacility.purchasePrice}" 
								currValue="#{backingBean.managedBean.basicCompanyFacility.purchasePrice}" 
								alertValue="#{backingBean.getPriceAmountFormat(backingBean.managedBean.latestAppl.hqFacility.purchasePrice)}"/>
							
							<p:message id="purchasePriceMsg" for="purchasePrice"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</p:outputPanel>

								alertValue="#{backingBean.managedBean.latestAppl.hqFacility.smAddress.address1}"/>
							
							<p:message id="companyAdd1Msg" for="companyAdd1"

								<f:selectItems var="basicCountry"

								alertValue="#{backingBean.getCountryLabelById(backingBean.managedBean.latestAppl.hqFacility.smAddress.pmCountry.countryId)}"/>
							
							<p:message id="cmpnyCntryNameMsg" for="companyCntry"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					<tr>

								disabled="#{backingBean.managedBean.upsCannotEdit}" >
								<p:ajax partialSubmit="true" process="@this" />
							</p:inputText>
							
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.managedBean.latestAppl.hqFacility.smAddress.address2}" 
								currValue="#{backingBean.managedBean.basicCompanyFacility.smAddress.address2}" 
								alertValue="#{backingBean.managedBean.latestAppl.hqFacility.smAddress.address2}"/>
							
						</td>
						<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /> <p:outputLabel

						<td>
							<!-- #34159 - START -->

								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					<!-- 13320 -->
					<tr id="divisoTrId">
				<td></td>
				<td></td>
				<td class="tdTitle">
					<!-- #34159 - START -->
					<h:panelGroup id="divisionOfficeLabelPanelId">
						<p:outputLabel value="#{lbl['lbl.sm.division']}" rendered="#{backingBean.managedBean.basicCompanyFacility.smAddress.pmState.adoptDivision}"/>

					</h:panelGroup>

								update="basicOffFacDist,basicOffFacCity,postCodeOffFacPanelId,hqFacCoordinatePanelId" />
					</p:selectOneMenu>

            </tr>
