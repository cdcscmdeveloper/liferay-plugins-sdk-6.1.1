<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Office Facility Type " id="ofp" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.officeFacilityVerfied}"
							id="poOffVer">
							<p:ajax update=":form:tt:offInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.officeFacilityVerfied)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.officeFacilityVerfied}"
							id="apprOffVer">
							<p:ajax update=":form:tt:offInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.officeFacilityVerfied)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="offInfPan">
			<p:blockUI block=":form:tt:offInfPan" widgetVar="buiPoOff"
				id="poOffBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.officeFacilityVerfied : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.officeFacilityVerfied : false)}" />

			<table style="width: 100%">

				<tr>
					<td width="134px;"><p:outputLabel value="Ownership Type" /></td>
					<td style="width: 100px; padding-bottom: 2px;"><p:selectOneRadio
							id="ownTypeId" label="OwnerShip Type"
							value="#{backingBean.managedBean.basicCompanyFacility.ownershipType}"
							required="true">
							<f:selectItem itemLabel="Own" itemValue="O" />
							<f:selectItem itemLabel="Rent" itemValue="R" />
							<p:ajax update="ofp" event="change"
								listener="#{backingBean.officeFacilitySelected}" />
						</p:selectOneRadio></td>
					<td><p:message for="ownTypeId" showDetail="false"
							showSummary="true" display="icon" /></td>

				</tr>
			</table>
			<ui:fragment
				rendered="#{backingBean.managedBean.basicCompanyFacility.ownershipType eq 'R'}">
				<table style="width: 100%">
					<tr>
						<td width="134px;"><p:outputLabel value="Facility Type" /></td>
						<td colspan="3" style="padding-bottom: 4px;"><p:selectOneRadio
								value="#{backingBean.managedBean.basicCompanyFacility.facilityType}">
								<f:selectItem itemLabel="Home Office" itemValue="H" />
								<f:selectItem itemLabel="Business Office" itemValue="B" />

							</p:selectOneRadio></td>

					</tr>
					<tr>
						<td><p:outputLabel value="* Landlord's Name" /></td>
						<td><p:inputText id="landlordName"
								value="#{backingBean.managedBean.basicCompanyFacility.ownerName}"
								size="35" required="true" /> <p:message id="landlordNameMsg"
								for="landlordName" showSummary="true" showDetail="false"
								display="icon" /></td>
						<td><p:outputLabel value="* Monthly Rental (RM.)" /></td>
						<td><p:inputText id="rental"
								value="#{backingBean.managedBean.basicCompanyFacility.rentalRate}"
								size="35" required="true">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText> <p:message id="rentalMsg" for="rental" showSummary="true"
								showDetail="false" display="icon" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.companyaddress']}" /></td>
						<td><p:inputText id="companyAdd1" size="35" colspan="3"
								value="#{backingBean.managedBean.basicCompanyFacility.smAddress.address1}" />
							<p:message id="companyAdd1Msg" for="companyAdd1"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					<tr>
						<td></td>
						<td><p:inputText size="35" colspan="3"
								value="#{backingBean.managedBean.basicCompanyFacility.smAddress.address2}" /></td>
					</tr>
					<tr>
						<td></td>
						<td><p:inputText size="35" colspan="3"
								value="#{backingBean.managedBean.basicCompanyFacility.smAddress.address3}" /></td>
					</tr>
					<tr>
						<td></td>
						<td><p:inputText size="35" colspan="3"
								value="#{backingBean.managedBean.basicCompanyFacility.smAddress.address4}" /></td>
						<td><p:outputLabel value="* #{lbl['lbl.sm.country']}" /></td>
						<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
								id="companyCntry"
								value="#{backingBean.managedBean.basicCompanyFacility.smAddress.pmCountry.countryId}"
								required="true">
								<f:selectItem itemLabel="---Select---" itemValue="" />
								<f:selectItems var="basicCountry"
									value="#{backingBean.managedBean.countryLs}"
									itemValue="#{basicCountry.countryId}"
									itemLabel="#{basicCountry.countryName}" />
								<p:ajax event="change"
									listener="#{backingBean.populateStatesByCountry(backingBean.managedBean.basicCompanyFacility.smAddress.pmCountry.countryId, 
								SupplierManagementConst.SM_OFFICE_FACILITY_INFO_PANEL,
								backingBean.managedBean.basicCompanyFacility.smAddress.pmState,
								backingBean.managedBean.basicCompanyFacility.smAddress.pmDistrict,
								backingBean.managedBean.basicCompanyFacility.smAddress.pmCity)}"
									update="basicOffFacState,basicOffFacDist,basicOffFacCity" />
							</p:selectOneMenu> <p:message id="cmpnyCntryNameMsg" for="companyCntry"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
						<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
								value="#{backingBean.managedBean.basicCompanyFacility.smAddress.pmState.stateId}"
								id="basicOffFacState" required="true">
								<f:selectItem itemLabel="---Select---" itemValue="" />
								<f:selectItems var="offState"
									value="#{backingBean.managedBean.basicOffFacStates}"
									itemValue="#{offState.stateId}"
									itemLabel="#{offState.stateName}" />
								<p:ajax event="change"
									listener="#{backingBean.populateDistrictsByState(backingBean.managedBean.basicCompanyFacility.smAddress.pmState.stateId, 
								SupplierManagementConst.SM_OFFICE_FACILITY_INFO_PANEL,
								backingBean.managedBean.basicCompanyFacility.smAddress.pmDistrict,
								backingBean.managedBean.basicCompanyFacility.smAddress.pmCity)}"
									update="basicOffFacDist,basicOffFacCity" />

							</p:selectOneMenu> <p:message id="basicOffFacStateMsg" for="basicOffFacState"
								showSummary="true" showDetail="false" display="icon" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
						<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
								id="basicOffFacDist" required="true"
								value="#{backingBean.managedBean.basicCompanyFacility.smAddress.pmDistrict.districtId}">
								<f:selectItem itemLabel="---Select---" itemValue="" />
								<f:selectItems var="offDist"
									value="#{backingBean.managedBean.basicOffFacDistricts}"
									itemValue="#{offDist.districtId}"
									itemLabel="#{offDist.districtName}" />
								<p:ajax event="change"
									listener="#{backingBean.populateCitiesByDistrict(backingBean.managedBean.basicCompanyFacility.smAddress.pmDistrict.districtId, 
								SupplierManagementConst.SM_OFFICE_FACILITY_INFO_PANEL,
								backingBean.managedBean.basicCompanyFacility.smAddress.pmCity)}"
									update="basicOffFacCity" />
							</p:selectOneMenu> <p:message id="basicOffFacDistMsg" for="basicOffFacDist"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
						<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
								id="basicOffFacCity" required="true"
								value="#{backingBean.managedBean.basicCompanyFacility.smAddress.pmCity.cityId}">
								<f:selectItem itemLabel="---Select---" itemValue="" />
								<f:selectItems var="offCity"
									value="#{backingBean.managedBean.basicOffFacCities}"
									itemValue="#{offCity.cityId}" itemLabel="#{offCity.cityName}" />
							</p:selectOneMenu> <p:message id="basicOffFacCityMsg" for="basicOffFacCity"
								showSummary="true" showDetail="false" display="icon" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
						<td><p:inputText size="35"
								value="#{backingBean.managedBean.basicCompanyFacility.smAddress.postcode}" /></td>
					</tr>
					<p:outputPanel rendered="#{backingBean.managedBean.poUser}">

						<tr>
							<td><p:outputLabel value="PO Remarks" /></td>
							<td colspan="3"><p:inputTextarea autoResize="true" cols="41"
									value="#{backingBean.managedBean.poSecReview.officeFacilityRemark}" /></td>
						</tr>

					</p:outputPanel>
					<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">

						<tr>
							<td><p:outputLabel value="PO Remarks" /></td>
							<td><p:inputTextarea autoResize="true" readonly="true"
									disabled="true" cols="41"
									value="#{backingBean.managedBean.poSecReview.officeFacilityRemark}" /></td>
							<td><p:outputLabel value="Approver Remarks" /></td>
							<td><p:inputTextarea autoResize="true" cols="41"
									value="#{backingBean.managedBean.apprvrSecReview.officeFacilityRemark}" /></td>

						</tr>

					</p:outputPanel>
				</table>
			</ui:fragment>
			<ui:fragment
				rendered="#{backingBean.managedBean.basicCompanyFacility.ownershipType eq 'O'}">
				<table style="width: 100%">
					<tr>
						<td width="134px;"><p:outputLabel value="Facility Type" /></td>
						<td colspan="3" style="padding-bottom: 4px;"><p:selectOneRadio
								value="#{backingBean.managedBean.basicCompanyFacility.facilityType}">
								<f:selectItem itemLabel="Home Office" itemValue="H" />
								<f:selectItem itemLabel="Business Office" itemValue="B" />

							</p:selectOneRadio></td>

					</tr>
					<tr>
						<td width="134px;"><p:outputLabel value="* Owner Name" /></td>
						<td colspan="3"><p:inputText id="fcltyOwnerName"
								label="OwnerName"
								value="#{backingBean.managedBean.basicCompanyFacility.ownerName}"
								size="35" required="true" /> <p:message id="fcltyOwnerNameMsg"
								for="fcltyOwnerName" showSummary="true" showDetail="false"
								display="icon" /></td>
					</tr>
					<tr>
						<td width="134px;"><p:outputLabel value="* Purchase Date" /></td>
						<td colspan="3" style="padding-bottom: 3px;"><p:calendar
								showOn="button" id="purchaseDate" navigator="true"
								display="inline" label="Purchase Date"
								value="#{backingBean.managedBean.basicCompanyFacility.purchaseDate}"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								required="true" yearRange="c-99:c+0">
							</p:calendar> <p:message id="purchaseDateMsg" for="purchaseDate"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					<tr>
						<td width="134px;"><p:outputLabel value="* Purchase Price " /></td>
						<td colspan="3"><p:inputText size="35" id="purchasePrice"
								label="Purchase Price"
								value="#{backingBean.managedBean.basicCompanyFacility.purchasePrice}"
								required="true">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText> <p:message id="purchasePriceMsg" for="purchasePrice"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>
					<p:outputPanel rendered="#{backingBean.managedBean.poUser}">

						<tr>
							<td><p:outputLabel value="PO Remarks" /></td>
							<td colspan="3"><p:inputTextarea autoResize="true" cols="41" /></td>
						</tr>

					</p:outputPanel>
					<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">

						<tr>
							<td><p:outputLabel value="PO Remarks" /></td>
							<td><p:inputTextarea autoResize="true" readonly="true"
									disabled="true" cols="41" /></td>
							<td><p:outputLabel value="Approver Remarks" /></td>
							<td><p:inputTextarea autoResize="true" cols="41" /></td>

						</tr>

					</p:outputPanel>
				</table>
			</ui:fragment>
		</p:panel>
	</p:panel>
</ui:composition>
