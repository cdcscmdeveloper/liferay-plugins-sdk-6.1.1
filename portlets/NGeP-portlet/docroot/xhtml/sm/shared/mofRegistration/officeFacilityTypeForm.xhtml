<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Office Facility Type " id="ofp" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.officeFacilityVerfied}"
							id="poOffVer">
							<p:ajax update=":form:tt:offInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.officeFacilityVerfied)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="offInfPan">
			<p:blockUI block=":form:tt:offInfPan" widgetVar="buiPoOff"
				id="poOffBlc"
				blocked="#{backingBean.managedBean.poSecReview.officeFacilityVerfied and backingBean.managedBean.poUser}" />

			<table style="width: 100%">

				<tr>
					<td width="127px;"><p:outputLabel value="Ownership Type" /></td>
					<td colspan="3" style="padding-bottom: 2px;"><p:selectOneRadio
							value="#{backingBean.managedBean.officeFacility.ownershipType}">
							<f:selectItem itemLabel="Owned" itemValue="O" />
							<f:selectItem itemLabel="Rented" itemValue="R" />
							<p:ajax update="ofp" event="change"
								listener="#{backingBean.officeFacilitySelected}" />
						</p:selectOneRadio></td>

				</tr>
			</table>
			<ui:fragment
				rendered="#{backingBean.managedBean.officeFacility.ownershipType eq 'R'}">
				<table style="width: 100%">
					<tr>
						<td width="127px;"><p:outputLabel value="Facility Type" /></td>
						<td colspan="3" style="padding-bottom: 4px;"><p:selectOneRadio
								value="#{backingBean.managedBean.officeFacility.facilityType}">
								<f:selectItem itemLabel="Home Office" itemValue="H" />
								<f:selectItem itemLabel="Business Office" itemValue="B" />

							</p:selectOneRadio></td>

					</tr>
					<tr>
						<td><p:outputLabel value="* Landlord's Name" /></td>
						<td><p:inputText
								value="#{backingBean.managedBean.officeFacility.ownerName}"
								size="35" /></td>
						<td><p:outputLabel value="* Monthly Rental (RM.)" /></td>
						<td><p:inputText
								value="#{backingBean.managedBean.officeFacility.rentalRate}"
								size="35" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.companyaddress']}" /></td>
						<td><p:inputText size="35" colspan="3" /></td>
					</tr>
					<tr>
						<td></td>
						<td><p:inputText size="35" colspan="3" /></td>
					</tr>
					<tr>
						<td></td>
						<td><p:inputText size="35" colspan="3" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
						<td><p:inputText size="35" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
						<td><p:inputText size="35" readonly="true" disabled="true" /></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
						<td><p:inputText size="35" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
						<td><p:inputText size="35" /></td>
					</tr>
					<p:outputPanel rendered="#{backingBean.managedBean.poUser}">

						<tr>
							<td><p:outputLabel value="PO Remarks" /></td>
							<td colspan="3"><p:inputTextarea autoResize="true" cols="41" /></td>
						</tr>

					</p:outputPanel>
					<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">

						<tr>
							<td><p:outputLabel value="PO Remarks" /></td>
							<td><p:inputTextarea autoResize="true" readonly="true"
									disabled="true" cols="41" /></td>
							<td><p:outputLabel value="Approver Remarks" /></td>
							<td><p:inputTextarea autoResize="true" cols="41" /></td>

						</tr>

					</p:outputPanel>
				</table>
			</ui:fragment>
			<ui:fragment
				rendered="#{backingBean.managedBean.officeFacility.ownershipType eq 'O'}">
				<table style="width: 100%">
					<tr>
						<td width="127px;"><p:outputLabel value="Facility Type" /></td>
						<td colspan="3" style="padding-bottom: 4px;"><p:selectOneRadio
								value="#{backingBean.managedBean.officeFacility.facilityType}">
								<f:selectItem itemLabel="Home Office" itemValue="H" />
								<f:selectItem itemLabel="Business Office" itemValue="B" />

							</p:selectOneRadio></td>

					</tr>
					<tr>
						<td width="127px;"><p:outputLabel value="* Owner Name" /></td>
						<td colspan="3"><p:inputText
								value="#{backingBean.managedBean.officeFacility.ownerName}"
								size="35" /></td>
					</tr>
					<tr>
						<td width="127px;"><p:outputLabel value="* Purchase Date" /></td>
						<td colspan="3"><p:calendar showOn="button"
								value="#{backingBean.managedBean.officeFacility.purchaseDate}"
								style="margin-bottom:5px;" /></td>
					</tr>
					<tr>
						<td width="127px;"><p:outputLabel
								value="* Purchase Price (RM.)" /></td>
						<td colspan="3"><p:inputText size="35"
								value="#{backingBean.managedBean.officeFacility.purchasePrice}" />
						</td>

					</tr>
					<p:outputPanel rendered="#{backingBean.managedBean.poUser}">

						<tr>
							<td><p:outputLabel value="PO Remarks" /></td>
							<td colspan="3"><p:inputTextarea autoResize="true" cols="41" /></td>
						</tr>

					</p:outputPanel>
					<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">

						<tr>
							<td><p:outputLabel value="PO Remarks" /></td>
							<td><p:inputTextarea autoResize="true" readonly="true"
									disabled="true" cols="41" /></td>
							<td><p:outputLabel value="Approver Remarks" /></td>
							<td><p:inputTextarea autoResize="true" cols="41" /></td>

						</tr>

					</p:outputPanel>
				</table>
			</ui:fragment>
		</p:panel>
	</p:panel>
</ui:composition>
