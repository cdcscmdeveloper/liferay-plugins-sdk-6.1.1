<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Manufacturing / Assembly Information"
		toggleable="true">
		<table style="width: 250px">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By PO: "
						title="For PO to highlight the verified section " /></td>

			</tr>
			<tr>
				<td width="10px"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By Approver: "
						title="For Approver to highlight the verified section " /></td>
			</tr>
		</table>
		<br />
		<p:dataTable var="manBean"
			value="#{backingBean.managedBean.smAppl.smApplManufacturingDtls}"
			selection="#{backingBean.managedBean.selectedManufacturingList}"
			rowKey="#{manBean.applManufacturingDtlId}" rowIndexVar="index"
			id="manDt">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<p:outputLabel value="#{index+1}" />
			</p:column>

			<p:column headerText="Type Of Product (s)">
				<p:commandLink value="#{manBean.goodsType}"
					oncomplete="manufactorDialog.show();" update=":form:tt:manDia"
					action="#{backingBean.assignSelManufacturer(manBean)}" />
			</p:column>

			<p:column headerText="Brand">
				<p:outputLabel value="#{manBean.brand}" />
			</p:column>
			<p:column headerText="Production Capability / Month">
				<p:outputLabel value="#{manBean.producationCapacity}" />
			</p:column>

			<p:column headerText="Measurement Unit">
				<p:outputLabel value="#{manBean.uom}" />
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Assembly Info"
				oncomplete="manufactorDialog.show();" update=":form:tt:manDia"
				action="#{backingBean.assignNewManufacturerBean}" />
			<p:commandButton value="Delete Assembly Info(s)" />
		</div>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog width="600px" header="Manufacturing / Assembly Page"
		widgetVar="manufactorDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="manDia">
		<p:panel header="Manufacturing / Assembly Information">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Type Of Product(s) *" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedManufacturer.goodsType}" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Brand" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedManufacturer.brand}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Production Capacity *" /></td>
					<td>
						<table>
							<tr>
								<td style="padding-right: 20px;"><p:inputText
										value="#{backingBean.managedBean.selectedManufacturer.producationCapacity}" /></td>
								<td valign="top"><p:outputLabel value=" / Month" /></td>
							</tr>
						</table>
					</td>
				</tr>

				<tr>
					<td><p:outputLabel value="Measurement *" /></td>
					<td valign="top"><p:selectOneMenu
							value="#{backingBean.managedBean.selectedManufacturer.uom}">
							<f:selectItem itemLabel="Unit " itemValue="Unit" />
							<f:selectItem itemLabel="Volume" itemValue="Volume" />
						</p:selectOneMenu></td>
					<!-- <td>
						<table>
							<tr>
								<td style="padding-right: 20px;"><p:inputText /></td>

							</tr>
						</table>
					</td> -->
				</tr>

			</table>
		</p:panel>
		<br />
		<div align="center">
			<p:commandButton value="Save" oncomplete="manufactorDialog.hide();"
				action="#{backingBean.addOrUpdateManufacturerToSmAppl}"
				update=":form:tt:manDt" />
			<p:commandButton value="Cancel" onclick="manufactorDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
