<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.manufacture.panHdr']}" toggleable="true">
		<table style="width: 100%">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.manufacturingVerified}"
							id="poManuVer">
							<p:ajax update=":form:tt:manuInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:manuInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.manufacturingVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.manufacturingVerified}"
							id="apprManuVer">
							<p:ajax update=":form:tt:manuInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:manuInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.manufacturingVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<p:outputPanel id="manuInfPan" layout="block">
			<p:blockUI block=":form:tt:manuInfPan" widgetVar="buiPoManu"
				id="poManuBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.manufacturingVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.manufacturingVerified : false)}" />

			<p:dataTable var="manBean" widgetVar="smManuDtWidVar"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.smAppl.smManufacturingDtls}"
				selection="#{backingBean.managedBean.selectedManufacturingList}"
				rowKey="#{manBean}" rowIndexVar="index" id="manDt">
				<ac:paginator for="manDt" />
				<p:column selectionMode="multiple" width="1%" rendered="#{not empty backingBean.managedBean.smAppl.smManufacturingDtls}"/>

				<p:column headerText="#{lbl['lbl.sm.manufacture.prdType']}">
					<h:outputText value="#{manBean.goodsType}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.manufacture.brand']}">
					<h:outputText value="#{manBean.brand}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.sm.manufacture.prodCap']} / #{lbl['lbl.sm.manufacture.month']}">
					<h:outputText value="#{manBean.productionCapacity}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.manufacture.mesUnit']}">
					<h:outputText value="#{manBean.pmUom.uomName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink update=":form:tt:manufactorDialog" process="@this"
						partialSubmit="true"
						action="#{backingBean.assignSelManufacturer(manBean)}"
						style="padding-right:5px" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}" process="@this"
					partialSubmit="true" update=":form:tt:manufactorDialog"
					action="#{backingBean.assignNewManufacturerBean}" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					partialSubmit="true" process="manuInfPan" id="delManuBtnId"
					disabled="#{empty backingBean.managedBean.smAppl.smManufacturingDtls}"
					action="#{backingBean.deleteSelectedManufacturers}"
					update=":form:tt:manDt,@this" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser or (backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser)}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="manufactSecPoRmrk"
								readonly="#{backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser}"
								validatorMessage="#{lbl['lbl.sm.manufacture.panHdr']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.manufacturingRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="manufactSecPoRmrkMsg" for="manufactSecPoRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.manufacturingRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="manufactSecAprvrRmrk"
								validatorMessage="#{lbl['lbl.sm.manufacture.panHdr']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.manufacturingRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="manufactSecAprvrRmrkMsg"
								for="manufactSecAprvrRmrk" showSummary="true" showDetail="false"
								display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="500px" height="200px"
		header="#{lbl['lbl.sm.manufacture.diaHdr']}"
		widgetVar="manufactorDialog" resizable="false" showEffect="fade"
		closable="false" hideEffect="fade" modal="true" id="manufactorDialog">
		
		<p:outputPanel layout="block" id="manuFacBlockPanel">
			<p:messages id="manufactorDialogMsg" showSummary="false"
				showDetail="true" autoUpdate="true" closable="true" />
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.prdType']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.manufacture.prdType']}" id="smManuProdType"
							maxlength="50"
							value="#{backingBean.managedBean.selectedManufacturer.goodsType}"
							size="35" /> <p:message id="smManuProdTypeMsg"
							for="smManuProdType" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.brand']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.manufacture.brand']}" id="smManuBrdType"
							maxlength="50"
							value="#{backingBean.managedBean.selectedManufacturer.brand}"
							size="35" /> <p:message id="smManuBrdTypeMsg" for="smManuBrdType"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.prodCap']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="6"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.manufacture.prodCap']}" id="smManuProdCap"
							value="#{backingBean.managedBean.selectedManufacturer.productionCapacity}"
							size="35">
	
						</p:inputText> <p:message id="smManuProdCapMsg" for="smManuProdCap"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.mesUnit']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td valign="top"><p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.manufacture.mesUnit']}" id="smManuMesUnit"
							value="#{backingBean.managedBean.selectedManufacturer.pmUom.uomId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems value="#{backingBean.managedBean.uomSelectItems}"
								var="select" itemLabel="select.label" itemValue="select.value" />
						</p:selectOneMenu> <p:message id="smManuMesUnitMsg" for="smManuMesUnit"
							showSummary="true" showDetail="false" display="icon" /></td>
	
				</tr>
	
			</table>
	
			<br />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.save']}"
					action="#{backingBean.addOrUpdateManufacturerToSmAppl}"
					partialSubmit="true" process="manufactorDialog"
					onclick="storeBlockWidget.show();" oncomplete="storeBlockWidget.hide();"
					update=":form:tt:manDt, @([id$=Msg]),:#{p:component('delManuBtnId')}" />
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
					action="#{backingBean.cancelManuSaveorUpdate}" process="@this"
					partialSubmit="true" />
			</div>
			<p:blockUI block="manuFacBlockPanel" widgetVar="manuFacBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
		</p:outputPanel>
	</p:dialog>
</ui:composition>
