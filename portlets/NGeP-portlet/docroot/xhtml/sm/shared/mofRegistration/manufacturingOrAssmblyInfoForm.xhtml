<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Manufacturing / Assembly Information"
		toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:dataTable var="manBean"
			value="#{backingBean.managedBean.smAppl.smManufacturingDtls}"
			selection="#{backingBean.managedBean.selectedManufacturingList}"
			rowKey="#{manBean.manufacturingDtlId}" rowIndexVar="index" id="manDt">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<h:outputText value="#{index+1}" />
			</p:column>

			<p:column headerText="Type Of Product (s)">
				<h:outputText value="#{manBean.goodsType}" />
			</p:column>

			<p:column headerText="Brand">
				<h:outputText value="#{manBean.brand}" />
			</p:column>
			<p:column headerText="Production Capability / Month">
				<h:outputText value="#{manBean.productionCapacity}" />
			</p:column>

			<p:column headerText="Measurement Unit">
				<h:outputText value="#{manBean.uom}" />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink oncomplete="manufactorDialog.show();"
					update=":form:tt:manDia"
					action="#{backingBean.assignSelManufacturer(manBean)}"
					style="padding-right:5px">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add" oncomplete="manufactorDialog.show();"
				update=":form:tt:manDia"
				action="#{backingBean.assignNewManufacturerBean}" />
			<p:commandButton value="Delete" />
		</div>
		<br />
		<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
			<table style="width: 50%">
				<tr>
					<td><p:outputLabel value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" /></td>
				</tr>
			</table>
		</p:outputPanel>
		<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" readonly="true"
							disabled="true" /></td>
					<td><p:outputLabel value="Approver Remarks" /></td>
					<td><p:inputTextarea autoResize="true" /></td>

				</tr>
			</table>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="600px" header="Manufacturing / Assembly Page"
		widgetVar="manufactorDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="manDia">
		<!-- <p:panel header="Manufacturing / Assembly Information"> -->

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Product Type" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedManufacturer.goodsType}" size="35"/></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Brand" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedManufacturer.brand}" size="35"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Production Capacity" /></td>
				<td>
					<table>
						<tr>
							<td style="padding-right: 5px;"><p:inputText
									value="#{backingBean.managedBean.selectedManufacturer.productionCapacity}" size="15"/></td>
							<td valign="top"><h:outputText value=" per Month" /></td>
						</tr>
					</table>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="* Measurement" /></td>
				<td valign="top"><p:selectOneMenu
						value="#{backingBean.managedBean.selectedManufacturer.uom}" style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select --" itemValue="" />
						<f:selectItem itemLabel="Unit " itemValue="Unit" />
						<f:selectItem itemLabel="Volume" itemValue="Volume" />
					</p:selectOneMenu></td>
				<!-- <td>
						<table>
							<tr>
								<td style="padding-right: 20px;"><p:inputText /></td>

							</tr>
						</table>
					</td> -->
			</tr>

		</table>
		<!-- </p:panel> -->
		<br />
		<div align="right">
			<p:commandButton value="Save" oncomplete="manufactorDialog.hide();"
				action="#{backingBean.addOrUpdateManufacturerToSmAppl}"
				update=":form:tt:manDt" />
			<p:commandButton value="Cancel" onclick="manufactorDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
