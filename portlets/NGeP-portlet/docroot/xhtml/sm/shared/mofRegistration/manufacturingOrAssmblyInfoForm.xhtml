<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Manufacturing / Assembly Information"
		toggleable="true">
		<table style="width: 250px">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
				<td><p:outputLabel value=" Section Verified By PO: "
						title="For PO to highlight the verified section " /></td>

			</tr>
			<tr>
				<td width="10px"><p:selectBooleanCheckbox /></td>
				<td><p:outputLabel value=" Section Verified By Approver: "
						title="For Approver to highlight the verified section " /></td>
			</tr>
		</table>
		<br />
		<p:dataTable var="utilBean"
			value="#{mofRegistrationBackingBean.utilList}"
			selection="#{mofRegistrationBackingBean.managedBean.selectedUtilList}"
			rowKey="#{utilBean.seqNo}" rowIndexVar="index">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<p:outputLabel value="1" />
			</p:column>

			<p:column headerText="Type Of Product (s)">
				<p:commandLink value="Tables,Chairs"
					onclick="manufactorDialog.show();" />
			</p:column>

			<p:column headerText="Brand">
				<p:outputLabel value="Stanley" />
			</p:column>
			<p:column headerText="Production Capability / Month">
				<p:outputLabel value="100" />
			</p:column>

			<p:column headerText="Measurement Unit">
				<p:outputLabel value="Unit" />
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Assembly Info"
				onclick="manufactorDialog.show();" />
			<p:commandButton value="Delete Assembly Info(s)" />
		</div>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog width="400px" header="Manufacturing / Assembly Page"
		widgetVar="manufactorDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		<p:panel header="Manufacturing / Assembly Information">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Type Of Product(s) *" /></td>
					<td><p:inputText /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Brand" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Production Capacity *" /></td>
					<td><p:inputText /> <p:outputLabel value=" / Month" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Measurement *" /></td>
					<td><p:panelGrid columns="2"
							styleClass="noBorders tr,noBorders td">
							<p:column>
								<p:inputText />
							</p:column>
							<p:column>
								<p:selectOneMenu>
									<f:selectItem itemLabel="Unit " itemValue="" />
									<f:selectItem itemLabel="Volume" itemValue="" />
								</p:selectOneMenu>
							</p:column>
						</p:panelGrid></td>
				</tr>

			</table>
		</p:panel>
		<br />
		<div align="center">
			<p:commandButton value="Save" onclick="manufactorDialog.hide();" />
			<p:commandButton value="Cancel" onclick="manufactorDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
