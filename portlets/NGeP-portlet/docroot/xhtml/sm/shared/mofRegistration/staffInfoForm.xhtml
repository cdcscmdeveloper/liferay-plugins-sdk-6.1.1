<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"

	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel
		header="Staff Information ( The input in this section depends on type of MOF i.e Contractor or Consultant)"
		toggleable="true">
		<div>
			<p:outputLabel value=" Section Verified : "
				title="For PO / Approver highlight the verified section " />
			<p:selectBooleanCheckbox />
		</div>
		<br />
		<p:dataGrid
			value="#{backingBean.managedBean.smAppl.smApplStaffTotals}"
			var="staff" columns="1">

			<table style="width: 800px;">
				<tr>
					<td width="150"><p:outputLabel value="Total No. Of Staff : "
							rendered="#{staff.staffCategory eq 'C'}" /> <p:outputLabel
							value="Total Professional Staff : "
							rendered="#{staff.staffCategory eq 'P'}" /> <p:outputLabel
							value="Total Semi Professional Staff : "
							rendered="#{staff.staffCategory eq 'S'}" /> <p:outputLabel
							value="Total Clerical Staff : "
							rendered="#{staff.staffCategory eq 'L'}" /></td>
					<td width="150"><p:outputLabel value="Bumi* " /> <p:inputText
							size="5" value="#{staff.totalBumi}" /></td>
					<td width="150"><p:outputLabel value="Non-Bumi* " /> <p:inputText
							size="5" value="#{staff.totalNonBumi}" /></td>
					<td width="150"><p:outputLabel value="Non-Malaysian* " /> <p:inputText
							size="5" value="#{staff.totalForeign}" /></td>
				</tr>
			</table>
		</p:dataGrid>
