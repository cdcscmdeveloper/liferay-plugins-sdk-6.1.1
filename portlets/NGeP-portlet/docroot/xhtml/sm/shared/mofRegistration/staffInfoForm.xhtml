<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.panHdr.stfInfo']}" toggleable="true"
		id="stfInfoHdrPanel">
		<table style="width: 350px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.staffVerified}"
							id="poStfVer">
							<p:ajax update=":form:tt:stfInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:stfInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.staffVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.staffVerified}"
							id="apprStfVer">
							<p:ajax update=":form:tt:stfInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:stfInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.staffVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<p:outputPanel id="stfInfPan" layout="block">
			<p:blockUI block=":form:tt:stfInfPan" widgetVar="buiPoStf"
				id="poStfBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.staffVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.staffVerified : false)}" />
			<ui:repeat value="#{backingBean.managedBean.smAppl.smStaffTotals}" var="staff" >

				<table style="width: 100%">
					<tr>
						<td width="200px">
							<p:outputLabel
								value="#{lbl['lbl.sm.staff.totalStaff']} "
								rendered="#{staff.staffCategory eq SupplierManagementConst.STAFF_TYPE_CONTRACTOR}" />
							<p:outputLabel value="#{lbl['lbl.sm.staff.profStaff']}"
								rendered="#{staff.staffCategory eq SupplierManagementConst.STAFF_TYPE_PROFESSIONAL}" />
							<p:outputLabel value="#{lbl['lbl.sm.staff.semiProfStaff']}"
								rendered="#{staff.staffCategory eq SupplierManagementConst.STAFF_TYPE_SEMIPROF}" />
							<p:outputLabel value="#{lbl['lbl.sm.staff.clericalStaff']}"
								rendered="#{staff.staffCategory eq SupplierManagementConst.STAFF_TYPE_CLERICAL}" />
							<p:outputLabel value="*" styleClass="mandatory" />
						</td>
						<td width="110px">
							<p:outputLabel value="#{lbl['lbl.sm.staff.bumi']}" /> 
						</td>
						<td width="55px"><p:inputText size="4" id="bumiStf"
								value="#{staff.totalBumi}" maxlength="4"
								style="min-width: 0px !important;"
								label="#{lbl['lbl.sm.staff.bumi']}" required="true">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
							</p:inputText> 
							<p:message for="bumiStf" showDetail="false" showSummary="true"
								display="icon" /></td>
						<td width="10px">
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.getStaffTotalByCategory(staff.staffCategory).totalBumi}" 
								currValue="#{staff.totalBumi}" 
								alertValue="#{backingBean.getStaffTotalByCategory(staff.staffCategory).totalBumi}"/>
						</td>
						<td width="150px">
							<p:outputLabel value="#{lbl['lbl.sm.staff.nonBumi']}" />
						</td>
						<td width="55px"><p:inputText size="4" id="nonBumStf"
								style="min-width: 0px !important;"
								label="#{lbl['lbl.sm.staff.nonBumi']}"
								value="#{staff.totalNonBumi}" maxlength="4" required="true">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
							</p:inputText> 
							<p:message for="nonBumStf" showDetail="false" showSummary="true"
								display="icon" /></td>
						<td width="10px">
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.getStaffTotalByCategory(staff.staffCategory).totalNonBumi}" 
								currValue="#{staff.totalNonBumi}" 
								alertValue="#{backingBean.getStaffTotalByCategory(staff.staffCategory).totalNonBumi}"/>
						</td>
						<td width="250px">
							<p:outputLabel value="#{lbl['lbl.sm.staff.frgnr']}" />
						</td>
						<td width="55px"><p:inputText id="frgStf" size="4"
								value="#{staff.totalForeigner}"
								label="#{lbl['lbl.sm.staff.frgnr']}" maxlength="4"
								style="min-width: 0px !important;" required="true">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
							</p:inputText> 
							<p:message for="frgStf" showDetail="false" showSummary="true"
								display="icon" /></td>
						<td width="10px">
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.getStaffTotalByCategory(staff.staffCategory).totalForeigner}" 
								currValue="#{staff.totalForeigner}" 
								alertValue="#{backingBean.getStaffTotalByCategory(staff.staffCategory).totalForeigner}"/>
						</td>
					</tr>

				</table>
			</ui:repeat>
			<p:outputPanel rendered="#{backingBean.managedBean.poUser or (backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser)}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="stfInfoSecPoRmrk" readonly="#{backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser}"
								validatorMessage="#{lbl['lbl.sm.panHdr.stfInfo']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.staffRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="stfInfoSecPoRmrkMsg" for="stfInfoSecPoRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.staffRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="stfInfoSecAprvrRmrk"
								validatorMessage="#{lbl['lbl.sm.panHdr.stfInfo']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.staffRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="stfInfoSecAprvrRmrkMsg" for="stfInfoSecAprvrRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
</ui:composition>
