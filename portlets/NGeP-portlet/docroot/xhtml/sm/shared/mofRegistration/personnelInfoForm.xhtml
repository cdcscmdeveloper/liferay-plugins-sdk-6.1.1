<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel
		header="Composition of the Board of Directors / Management / Staff Company"
		toggleable="true">

		<br />
		<table style="width: 100%">
			<tr>
				<td colspan="4"><div align="center" style="width: 98%">
						<p:panelGrid>
							<f:facet name="header">
								<!-- <p:row>
									<p:column rowspan="2"></p:column>
									<p:column rowspan="2">Management</p:column>
									<p:column colspan="2">Personnel</p:column>
								</p:row> -->
								<p:row>
									<p:column />
									<p:column>Management</p:column>
									<p:column>No. Of Actual Personnel</p:column>
									<p:column colspan="2">No. Of Personnel Entered</p:column>
								</p:row>
							</f:facet>
							<p:row>
								<p:column>Bumiputera</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
							</p:row>
							<p:row>
								<p:column>Non Bumiputera</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
							</p:row>
							<p:row>
								<p:column>Non - Malaysian</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
							</p:row>
						</p:panelGrid>
					</div></td>

			</tr>
		</table>
	</p:panel>
	<p:panel
		header=" List of Company's Board of Directors / Management / Staff"
		toggleable="true">

		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.personnelVerified}"
							id="poPersVer">
							<p:ajax update=":form:tt:persInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.personnelVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="persInfPan">
			<p:blockUI block=":form:tt:persInfPan" widgetVar="buiPoPers"
				id="poPersBlc"
				blocked="#{backingBean.managedBean.poSecReview.personnelVerified and backingBean.managedBean.poUser}" />
			<p:dataTable var="person"
				value="#{backingBean.managedBean.smAppl.smPersonnels}"
				selection="#{backingBean.managedBean.selectedPersonnels}"
				rowKey="#{person.personnelId}" rowIndexVar="index" id="personDt">
				<ac:paginator for="personDt" />
				<p:column selectionMode="multiple" width="5%" />


				<p:column headerText="Name">

					<h:outputText value="#{person.name}" />
					<!-- <p:commandLink value="#{person.name}"
					rendered="#{person.equityOwner == false}"
					action="#{backingBean.assignSelPersonnel(person)}"
					oncomplete="personnelDialog.show();"
					update=":form:tt:personnelDialog" /> -->
				</p:column>

				<p:column headerText="Roles In Company">
					<h:outputText value="#{person.designation}" />
				</p:column>
				<p:column headerText="Is Equity Owner">
					<h:outputText value="Yes" rendered="#{person.equityOwner == true}" />
					<h:outputText value="No" rendered="#{person.equityOwner == false}" />
				</p:column>
				<p:column headerText="Is Authorized">
					<h:outputText value="Yes" rendered="#{person.authorized == true}" />
					<h:outputText value="No" rendered="#{person.authorized == false}" />
				</p:column>
				<p:column headerText="Is Cert Issued">
					<h:outputText value="Yes" rendered="#{person.softcert == true}" />
					<h:outputText value="No" rendered="#{person.softcert == false}" />
				</p:column>
				<p:column headerText="Action">
					<p:commandLink rendered="#{person.equityOwner == false}"
						action="#{backingBean.assignSelPersonnel(person)}"
						oncomplete="personnelDialog.show();"
						update=":form:tt:personnelDialog">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="Add"
					action="#{backingBean.assignNewPersonnel}"
					oncomplete="personnelDialog.show();"
					update=":form:tt:personnelDialog" />
				<p:commandButton value="Delete" />
			</div>
			<!-- <p:panel header="List of Authorized Personnel">
			<p:dataTable var="auth"
				value="#{backingBean.managedBean.smapplAuthPersonnels}"
				rowKey="#{auth.personnelId}" rowIndexVar="index" id="authDt">

				<p:column headerText="No.">
					<h:outputText value="#{index+1}" />
				</p:column>

				<p:column headerText="Name">
					<h:outputText value="#{auth.name}" />
				</p:column>

				<p:column headerText="Roles In Company">
					<h:outputText value="#{auth.designation} " />
				</p:column>
				<p:column headerText="Soft Cert Issued?">
					<h:outputText value="Yes" rendered="#{auth.softcert == true}" />
					<h:outputText value="No" rendered="#{auth.softcert == false}" />
				</p:column>
			</p:dataTable>
		</p:panel>
 -->
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41" /></td>
						<td style="padding-left: 22px;"><p:outputLabel
								value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="750px" height="560px" header="Personnel Details"
		widgetVar="personnelDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="personnelDialog">

		<ui:include
			src="/xhtml/sm/shared/mofRegistration/personnelInfoPopUpForm.xhtml" />
		<div align="right">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdatePersonnelToSmAppl}"
				oncomplete="personnelDialog.hide();" update=":form:tt:personDt" />
			<p:commandButton value="Cancel" onclick="personnelDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
