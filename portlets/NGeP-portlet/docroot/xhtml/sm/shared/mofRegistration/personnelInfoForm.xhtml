<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel
		header="Composition of the Board of Directors / Management / Staff Company"
		toggleable="true">
		<div>
			<p:outputLabel value=" Section Verified : "
				title="For PO / Approver highlight the verified section " />
			<p:selectBooleanCheckbox />
		</div>

		<br />
		<table style="width: 100%">
			<tr>
				<td colspan="4" align="center"><p:panelGrid>
						<f:facet name="header">
							<p:row>
								<p:column rowspan="2"></p:column>
								<p:column rowspan="2">Management</p:column>
								<p:column colspan="2">Personnel</p:column>
							</p:row>
							<p:row>
								<p:column>No. Of Actual Personnel</p:column>
								<p:column colspan="2">No. Of Personnel Entered</p:column>
							</p:row>
						</f:facet>
						<p:row>
							<p:column>Bumiputera</p:column>
							<p:column>
								<p:outputLabel />
							</p:column>
							<p:column>
								<p:outputLabel />
							</p:column>
							<p:column>
								<p:outputLabel />
							</p:column>
						</p:row>
						<p:row>
							<p:column>Non Bumiputera</p:column>
							<p:column>
								<p:outputLabel />
							</p:column>
							<p:column>
								<p:outputLabel />
							</p:column>
							<p:column>
								<p:outputLabel />
							</p:column>
						</p:row>
						<p:row>
							<p:column>Non - Malaysian</p:column>
							<p:column>
								<p:outputLabel />
							</p:column>
							<p:column>
								<p:outputLabel />
							</p:column>
							<p:column>
								<p:outputLabel />
							</p:column>
						</p:row>
					</p:panelGrid></td>

			</tr>
			<tr>
				<td><br /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel
		header=" List of Company's Board of Directors / Management / Staff"
		toggleable="true">
		<div>
			<p:outputLabel value=" Section Verified : "
				title="For PO / Approver highlight the verified section " />
			<p:selectBooleanCheckbox />
		</div>
		<br />
		<p:dataTable var="person"
			value="#{mofRegistrationBackingBean.personList}"
			selection="#{mofRegistrationBackingBean.managedBean.selectedPersonList}"
			rowKey="#{person.personelSeq}" rowIndexVar="index">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<p:outputLabel value="#{index+1}" />
			</p:column>

			<p:column headerText="Name">
				<p:commandLink value="#{person.name}"
					onclick="personnelDialog.show();" />
			</p:column>

			<p:column headerText="Roles In Company">
				<p:outputLabel
					value="Role#{person.personelSeq}, Role#{person.personelSeq} , Role#{person.personelSeq} " />
			</p:column>

			<p:column headerText="Is Authorized ?">
				<p:outputLabel value="Yes" rendered="#{person.auth == true}" />
				<p:outputLabel value="No" rendered="#{person.auth == false}" />
			</p:column>
			<p:column headerText="Soft Cert Issued?">
				<p:outputLabel value="Yes"
					rendered="#{person.softCertIssued == true}" />
				<p:outputLabel value="No"
					rendered="#{person.softCertIssued == false}" />
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Personnel"
				onclick="personnelDialog.show();" />
			<p:commandButton value="Delete Personnel(s)" />
		</div>
		<p:fieldset legend="List of Authorized Personnel">
			<p:dataTable var="auth"
				value="#{mofRegistrationBackingBean.authList}"
				rowKey="#{auth.personelSeq}" rowIndexVar="index">

				<p:column headerText="No.">
					<p:outputLabel value="#{index+1}" />
				</p:column>

				<p:column headerText="Name">
					<p:outputLabel value="#{auth.name}" />
				</p:column>

				<p:column headerText="Roles In Company">
					<p:outputLabel
						value="Role#{auth.personelSeq}, Role#{auth.personelSeq} , Role#{auth.personelSeq} " />
				</p:column>
				<p:column headerText="Soft Cert Issued?">
					<p:outputLabel value="Yes"
						rendered="#{auth.softCertIssued == true}" />
					<p:outputLabel value="No"
						rendered="#{auth.softCertIssued == false}" />
				</p:column>
			</p:dataTable>
		</p:fieldset>

		<br />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog width="800px" height="500px" header="Personnel Details"
		widgetVar="personnelDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">

		<ui:include
			src="/xhtml/sm/shared/mofRegistration/personnelInfoPopUpForm.xhtml" />
		<div align="center">
			<p:commandButton value="Save" onclick="personnelDialog.hide();" />
			<p:commandButton value="Cancel" onclick="personnelDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
