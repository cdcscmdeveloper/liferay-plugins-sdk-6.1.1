<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel
		header="Composition of the Board of Directors / Management / Staff Company"
		toggleable="true"
		rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType eq '1' or backingBean.managedBean.smAppl.smSupplier
							.businessType eq '3' }">

		<br />
		<table style="width: 100%">
			<tr>
				<td colspan="4"><div align="center" style="width: 98%">
						<p:panelGrid styleClass="tablePanel">
							<f:facet name="header">

								<p:row>
									<p:column />
									<p:column>Board Of Director</p:column>
									<p:column>Higher Management (CEO,CBO,CTO,CFO,etc)</p:column>
									<p:column>Management</p:column>
									<p:column>Actual Staff Total</p:column>
									<p:column>Entered Staff Total</p:column>
								</p:row>
							</f:facet>
							<p:row>
								<p:column>Bumiputera</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
							</p:row>
							<p:row>
								<p:column>Non-Bumiputera</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
							</p:row>
							<p:row>
								<p:column>Non-Malaysian</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
							</p:row>
						</p:panelGrid>
						<p:panelGrid styleClass="tablePanel"
							rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType eq '2' }">
							<f:facet name="header">

								<p:row>
									<p:column />
									<p:column>Management</p:column>
									<p:column>Actual Staff Total</p:column>
									<p:column>Entered Staff Total</p:column>
								</p:row>
							</f:facet>
							<p:row>
								<p:column>Bumiputera</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>

							</p:row>
							<p:row>
								<p:column>Non-Bumiputera</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>

							</p:row>
							<p:row>
								<p:column>Non-Malaysian</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
								<p:column>
									<p:outputLabel />
								</p:column>
							</p:row>
						</p:panelGrid>
					</div></td>

			</tr>
		</table>
	</p:panel>
	<p:panel
		header=" List of Company's Board of Directors / Management / Staff"
		toggleable="true">

		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.personnelVerified}"
							id="poPersVer">
							<p:ajax update=":form:tt:persInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.personnelVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.personnelVerified}"
							id="apprPersVer">
							<p:ajax update=":form:tt:persInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.personnelVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="persInfPan">
			<p:blockUI block=":form:tt:persInfPan" widgetVar="buiPoPers"
				id="poPersBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.personnelVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.personnelVerified : false)}" />
			<p:dataTable var="person"
				value="#{backingBean.managedBean.smAppl.smPersonnels}"
				selection="#{backingBean.managedBean.selectedPersonnels}"
				rowKey="#{person}" rowIndexVar="index" id="personDt">
				<ac:paginator for="personDt" />
				<p:column selectionMode="multiple" width="5%" />

				<p:column headerText="Name">
					<h:outputText value="#{person.name}" />
				</p:column>

				<p:column headerText="Roles In Company">
					<h:outputText value="#{person.designation}" />
				</p:column>
				<p:column headerText="Is Equity Owner">
					<h:outputText value="Yes" rendered="#{person.equityOwner}" />
					<h:outputText value="No" rendered="#{!person.equityOwner}" />
				</p:column>
				<p:column headerText="Is Authorized">
					<h:outputText value="Yes" rendered="#{person.authorizedFlg eq '1'}" />
					<h:outputText value="No" rendered="#{person.authorizedFlg eq '0'}" />
				</p:column>
				<p:column headerText="Is Cert Issued">
					<h:outputText value="Yes" rendered="#{person.softcertFlg eq '1'}" />
					<h:outputText value="No" rendered="#{person.softcertFlg eq '0'}" />
				</p:column>
				<p:column headerText="Action">
					<p:commandLink rendered="#{!person.equityOwner}"
						action="#{backingBean.assignSelPersonnel(person)}"
						oncomplete="directorDialog.show();" style="padding-right:5px;"
						update=":form:tt:directorDialog">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>


					<p:commandLink oncomplete="perShareHolderDialog.show();"
						rendered="#{person.equityOwner}"
						action="#{backingBean.assignSelShareHolder(person)}"
						update=":form:tt:perShareHolderDialog" style="padding-right:5px;">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
					<p:commandLink oncomplete="perShareHolderAddrDialog.show();"
						id="PerShrAddrLnk"
						action="#{backingBean.assignSelShareHolderAddress(person)}"
						update=":form:tt:perShareHolderAddrDialog">
						<p:graphicImage library="ep/images/design" name="register.png"
							value="/resources/ep/images/design/register.png" />
					</p:commandLink>
					<p:tooltip for="PerShrAddrLnk">
						<h:outputText value="Address Details" />
					</p:tooltip>
				</p:column>

			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="Add Management / Staff"
					action="#{backingBean.assignNewPersonnel(SupplierManagementConst.PERSONNEL_TYPE_STAFF)}"
					oncomplete="directorDialog.show();"
					update=":form:tt:directorDialog" />
				<ui:fragment
					rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType eq '1' or backingBean.managedBean.smAppl.smSupplier.businessType eq '3'}">
					<p:commandButton value="Add Director/Higher Management"
						action="#{backingBean.assignNewPersonnel(SupplierManagementConst.PERSONNEL_TYPE_DIRECTOR)}"
						oncomplete="directorDialog.show();"
						update=":form:tt:directorDialog" />
				</ui:fragment>
				<p:commandButton value="Delete"
					action="#{backingBean.deleteSelectedPersonnel}"
					update=":form:tt:personDt" />
			</div>

			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41" /></td>
						<td style="padding-left: 22px;"><p:outputLabel
								value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>



	<p:dialog width="1050px" height="500px"
		header="Higher Management/Director Information"
		widgetVar="directorDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="directorDialog">

		<ui:include
			src="/xhtml/sm/shared/mofRegistration/personnelHigherMngmtInfoPopUpForm.xhtml" />
		<div align="right">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdatePersonnelToSmAppl}"
				oncomplete="directorDialog.hide();" update=":form:tt:personDt" />
			<p:commandButton value="Cancel" onclick="directorDialog.hide();" />
		</div>
	</p:dialog>


	<p:dialog width="1050px" height="500px"
		header="Share Holder Information" widgetVar="perShareHolderDialog"
		resizable="false" showEffect="fade" hideEffect="fade" modal="true"
		id="perShareHolderDialog">

		<ui:include
			src="/xhtml/sm/shared/mofRegistration/personnel_ShareHolderInfoPopUpForm.xhtml" />
		<div align="right">
			<p:commandButton value="Save"
				oncomplete="perShareHolderDialog.hide();"
				action="#{backingBean.addOrUpdateShareHolderToSmAppl}"
				update=":form:tt:personDt" />
			<p:commandButton value="Cancel"
				onclick="perShareHolderDialog.hide();" />
		</div>
	</p:dialog>

	<p:dialog width="1050px" height="500px"
		header="Share Holder Address Information"
		widgetVar="perShareHolderAddrDialog" resizable="false"
		showEffect="fade" hideEffect="fade" modal="true"
		id="perShareHolderAddrDialog">

		<ui:include
			src="/xhtml/sm/shared/mofRegistration/personnel_ShareHolderAddressInfoPopUpForm.xhtml" />
		<div align="right">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdateShareHolderAddress(backingBean.managedBean.selectedShareHolder)}"
				oncomplete="perShareHolderAddrDialog.hide();"
				update=":form:tt:personDt" />
			<p:commandButton value="Cancel"
				onclick="perShareHolderAddrDialog.hide();" />
		</div>
	</p:dialog>


</ui:composition>
