<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.category.categories']}" toggleable="true" id="siteVisitCatPanelId">
		<p:dataTable var="facVO"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{backingBean.managedBean.siteVisitFacVOList}"
			rowKey="#{facVO}" rowIndexVar="indexVO" id="svcFacVODt">
			<ac:paginator for="svcFacVODt" />

			<p:column headerText="#{lbl['lbl.sm.facility.type']}">
				<h:outputText value="#{facVO.facTypeLabel}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.catCodes.catcode']}">
				<table>
					<ui:repeat var="catCode" value="#{facVO.suppCategories}">
						<tr>
							<td style="border-style: none !important;">
								<h:outputText value="#{catCode.pmCategoryL1.categoryL1Code}" />
								<h:outputText value="#{catCode.pmCategoryL2.categoryL2Code}" />
								<h:outputText value="#{catCode.pmCategoryL3.categoryL3Code}" />
							</td>
						</tr>
					</ui:repeat>
				</table>
			</p:column>

			<p:column style="width: 70%;white-space: normal;" headerText="#{lbl['lbl.sm.facilities']}">
				<p:dataTable var="fac"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{facVO.facilities}"
					rowKey="#{fac}" rowIndexVar="index" id="svcFacDt">
					
					<ac:paginator for="svcFacDt" />
		
					<p:column headerText="#{lbl['lbl.sm.facility.name']}">
						<p:selectBooleanCheckbox value="#{fac.selected}" >
						    <p:ajax event="change" update=":#{p:component('siteVisitCatPanelId')}" listener="#{backingBean.onCheckedSiteVisitFacilityAddress()}"/>
						</p:selectBooleanCheckbox>
						<h:outputText value="#{fac.facilityName}" />
					</p:column>
		
					<p:column style="width: 70%;white-space: normal;" headerText="#{lbl['lbl.sm.facility.address']}">
						<h:outputText value="#{backingBean.getFullAddress(fac.smAddress)}" />
					</p:column>
		
				</p:dataTable>
			</p:column>
		</p:dataTable>
	</p:panel>
	
</ui:composition>
