<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 99%;" class="header-info">
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.applnTypeLbl']}" /></td>
			<td><p:inputText readonly="true" disabled="true"
					value="#{lbl['lbl.sm.newMofAppln']}"
					rendered="#{backingBean.managedBean.smAppl.applType eq 'N'}" /> <p:inputText
					readonly="true" disabled="true" value="Apply Bumiputera Status"
					rendered="#{backingBean.managedBean.smAppl.applType eq 'B'}" /> <p:inputText
					readonly="true" disabled="true" value="Apply Additional Categories"
					rendered="#{backingBean.managedBean.smAppl.applType eq 'A'}" /> <p:inputText
					readonly="true" disabled="true" value="Renew MOF Account"
					rendered="#{backingBean.managedBean.smAppl.applType eq 'R'}" /> <p:inputText
					readonly="true" disabled="true" value="Update MOF Account Details"
					rendered="#{backingBean.managedBean.smAppl.applType eq 'U'}" /></td>
			<td><p:outputLabel value="Application NO." /></td>
			<td><p:inputText readonly="true" disabled="true"
					value="#{backingBean.managedBean.smAppl.applNo}" /></td>
			<td><p:outputLabel value="Current Status" /></td>
			<td><p:inputText readonly="true" disabled="true"
					value="#{backingBean.managedBean.currentStatus}" /></td>
		</tr>
		<tr>

			<td><p:outputLabel value="Date Submitted :" /></td>
			<td><p:inputText readonly="true"
					value="#{backingBean.managedBean.smAppl.applSubmitDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText></td>


			<c:if test="#{backingBean.managedBean.approverUser}">
				<td><p:outputLabel value="PO Recommendation" /></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{backingBean.managedBean.poSecReview.recommendation}" /></td>
			</c:if>
		</tr>
	</table>
	<br />
	<table style="width: 250px;">
		<p:outputPanel
			rendered="#{backingBean.managedBean.poUser and !backingBean.managedBean.redirectToPersonPage}">
			<tr>
				<td width="10px" style="padding: 0px 2px 0px 7px;"><p:selectBooleanCheckbox
						value="#{backingBean.managedBean.poSecReview.verifiedAll}">
						<p:ajax update=":form" event="change"
							listener="#{backingBean.changeVerifyAll(backingBean.managedBean.poSecReview.verifiedAll)}" />
					</p:selectBooleanCheckbox></td>
				<td valign="top"><h:outputText
						value=" Application Verified By PO"
						title="For PO to highlight the verified section " /></td>

			</tr>
		</p:outputPanel>
		<p:outputPanel
			rendered="#{backingBean.managedBean.approverUser and !backingBean.managedBean.redirectToPersonPage}">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
						value="#{backingBean.managedBean.apprvrSecReview.verifiedAll}">
						<p:ajax update=":form" event="change"
							listener="#{backingBean.changeVerifyAll(backingBean.managedBean.apprvrSecReview.verifiedAll)}" />
					</p:selectBooleanCheckbox></td>
				<td valign="top"><h:outputText
						value=" Application Verified By Approver"
						title="For PO to highlight the verified section " /></td>

			</tr>
		</p:outputPanel>
	</table>
</ui:composition>
