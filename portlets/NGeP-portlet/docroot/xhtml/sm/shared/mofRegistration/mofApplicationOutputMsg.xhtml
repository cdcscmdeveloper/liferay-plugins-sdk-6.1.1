<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_MOFApplication_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					"#{lbl['lbl.sm.review.application']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		<p:panel id="acknowledge" header="#{lbl['lbl.acknowledgement.title']}">
			<p:messages id="messages" showDetail="true" showSummary="false" autoUpdate="true" escape="false" /><br/>
			
			<p:outputPanel rendered="#{smOutputMsgBackingBean.managedBean.smAppl.applType eq 'N' 
				or smOutputMsgBackingBean.managedBean.smAppl.applType eq 'R'}">
				<div align="center">
					<p:commandButton id="pyDetailsBtnId" value="#{lbl['lbl.sm.print.payment.details']}" ajax="false">
						<p:fileDownload value="#{smOutputMsgBackingBean.printPaymentDetails()}" />
					</p:commandButton>
					<p:commandButton id="applDetailsBtnId" value="#{lbl['lbl.sm.print.application.details']}" ajax="false">
						<p:fileDownload value="#{smOutputMsgBackingBean.printSupplierProfile()}" />
					</p:commandButton>
					<p:commandButton id="pyAckBtnId" value="#{lbl['lbl.sm.print.acknowledgement']}" ajax="false">
						<p:fileDownload value="#{smOutputMsgBackingBean.printPaymentAck()}" />
					</p:commandButton>
				</div>
			</p:outputPanel>
			
			<p:outputPanel rendered="#{smOutputMsgBackingBean.managedBean.smAppl.applType ne 'N' 
				and smOutputMsgBackingBean.managedBean.smAppl.applType ne 'R'}">
				<div align="right">
					<p:commandButton id="appl2DetailsBtnId" value="#{lbl['lbl.sm.print.application.details']}" ajax="false">
						<p:fileDownload value="#{smOutputMsgBackingBean.printSupplierProfile()}" />
					</p:commandButton>
				</div>
			</p:outputPanel>
			
		</p:panel> 
	</ui:define>
	
</ui:composition>
