<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.projDtls.catHdr']}" toggleable="true"
		id="compExpCatPanHdr">
		<p:dataTable var="expCategoryBean" widgetVar="suppExpCatCodesDtWidVar"
			value="#{backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}"
			rowKey="#{expCategoryBean}" rowIndexVar="index"
			id="suppExpCatCodesDtWidVar">
			
			<p:column style="width:2%">
				<ac:paginator for="suppExpCatCodesDtWidVar" />
				<f:facet name="header">
					<!-- Disable for UPS 32008 - START -->
					<p:selectBooleanCheckbox
						value="#{backingBean.managedBean.selectedAll}"
						disabled="#{backingBean.managedBean.upsCannotEdit}">
						<p:ajax partialSubmit="true" process="@this"
							update="@([id$=suppExpCatCodesDtWidVar])"
							listener="#{backingBean.selectAllCompanyExperinceCategories}" />
					</p:selectBooleanCheckbox>
				</f:facet>

				<p:selectBooleanCheckbox
					value="#{backingBean.managedBean.selected}"
					disabled="#{backingBean.managedBean.upsCannotEdit}">
					<p:ajax partialSubmit="true" process="@this" update="@this"
						listener="#{backingBean.selectedCompanyExperinceCategory(index)}" />
				</p:selectBooleanCheckbox>

			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.projDtls.mainCat']}">
				<h:outputText value="*" style="font-size: 12px;font-family: Arial;color: #FF0000;font-weight: bold;"/>
				<p:selectOneMenu required="#{backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.projDtls.mainCat']}"
					id="consultProjParCatCode"
					value="#{expCategoryBean.pmCategoryL1.categoryL1Id}"
					style="width: 207px;margin-bottom: 5px;"
					disabled="#{backingBean.managedBean.upsCannotEdit}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems
						value="#{backingBean.managedBean.supplierParentCatList}"
						var="parent" itemLabel="#{parent.categoryL1Code} - #{parent.categoryName}"
						itemValue="#{parent.categoryL1Id}" />
					<p:ajax event="change"
						listener="#{backingBean.populateExperienceChildCategoryByParent(expCategoryBean.pmCategoryL1.categoryL1Id,
								expCategoryBean.pmCategoryL2,
								expCategoryBean.pmCategoryL3)}"
						update="conslChild,conslSubChild" />
				</p:selectOneMenu>
				<p:message id="consultProjParCatCodeMsg" for="consultProjParCatCode"
					showSummary="true" showDetail="false" display="icon" />
			</p:column>


			<p:column headerText="#{lbl['lbl.sm.projDtls.subCat']}">
				<h:outputText value="*" style="font-size: 12px;font-family: Arial;color: #FF0000;font-weight: bold;"/>
				<p:selectOneMenu required="#{backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.projDtls.subCat']}"
					value="#{expCategoryBean.pmCategoryL2.categoryL2Id}"
					id="conslChild" style="width: 207px;margin-bottom: 5px;"
					disabled="#{backingBean.managedBean.upsCannotEdit}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems
						value="#{expCategoryBean.pmCategoryL2.pmCategoryL2s}"
						var="conslChild" itemLabel="#{conslChild.categoryL2Code} - #{conslChild.categoryName}"
						itemValue="#{conslChild.categoryL2Id}" />
					<p:ajax event="change"
						listener="#{backingBean.populateExperienceSubChildCategoryByChild(expCategoryBean.pmCategoryL2.categoryL2Id,expCategoryBean.pmCategoryL3)}"
						update="conslSubChild" />
				</p:selectOneMenu>
				<p:message id="conslChildMsg" for="conslChild" showSummary="true"
					showDetail="false" display="icon" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.projDtls.subCatDiv']}">
				<h:outputText value="*" style="font-size: 12px;font-family: Arial;color: #FF0000;font-weight: bold;"/>
				<p:selectOneMenu required="#{backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.projDtls.subCatDiv']}"
					value="#{expCategoryBean.pmCategoryL3.categoryL3Id}"
					id="conslSubChild" style="width: 207px;margin-bottom: 5px;"
					disabled="#{backingBean.managedBean.upsCannotEdit}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems
						value="#{expCategoryBean.pmCategoryL3.pmCategoryL3s}"
						var="conslSubChild" itemLabel="#{conslSubChild.categoryL3Code} - #{conslSubChild.categoryName}"
						itemValue="#{conslSubChild.categoryL3Id}" />
					<p:ajax event="change"
						listener="#{backingBean.checkDuplicateCategoryForProject(expCategoryBean,backingBean.managedBean.selectedCompanyExperience)}"
						update="conslSubChild" />
				</p:selectOneMenu>
				<ac:smFieldChangeTableAlert object="#{expCategoryBean}" />
				<p:message id="conslSubChildMsg" for="conslSubChild"
					showSummary="true" showDetail="false" display="icon" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}" id="addCatcodeExpId"
				rendered="#{!backingBean.managedBean.upsCannotEdit}"
				action="#{backingBean.assignCategoryForCompExperience(backingBean.managedBean.selectedCompanyExperience)}"
				update=":form:tt:suppExpCatCodesDtWidVar,deleteCatcodeExpId" partialSubmit="true"
				process=":form:tt:compExpCatPanHdr" />

			<p:commandButton value="#{lbl['lbl.sm.button.delete']}" id="deleteCatcodeExpId"
				rendered="#{!backingBean.managedBean.upsCannotEdit}"
				disabled="#{empty backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}"
				action="#{backingBean.deleteSelectedCategoryFromCompanyExperience(backingBean.managedBean.selectedCompanyExperience)}"
				update=":form:tt:suppExpCatCodesDtWidVar,@this" partialSubmit="true"
				process="@this" />
			<!-- Disable for UPS 32008 - END -->

		</div>

	</p:panel>
</ui:composition>
