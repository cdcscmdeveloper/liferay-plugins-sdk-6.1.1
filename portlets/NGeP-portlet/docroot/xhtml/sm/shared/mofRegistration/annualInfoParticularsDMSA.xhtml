<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel toggleable="true" id="partCompDMSAPanel">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sm.partDMSA.panHdr']}" />
		</f:facet>
	
	
	<p:panel  id="DirectorManager" toggleable="true">
	<h:outputText style="font-weight:bold" value="#{lbl['lbl.sm.partDirectorManager']}"/>
		<p:dataTable id="tableOwner1" var="varOwner1" rowIndexVar="index"
			editable = "false"
			widgetVar="tableOwner1Widget"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{backingBean.managedBean.personnelDirectorManager}"
			rowKey="#{varOwner1}"
			sortBy="#{varOwner1.name}">
			<ac:paginator for="tableOwner" />

			<p:column style="width:3%" styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.no1']}" />
				</f:facet>
				<h:outputText value="#{index + 1}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.person.composition.name']}" />
				</f:facet>
				<h:outputText value="#{varOwner1.name}" />
			</p:column>

		
		
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.userprofile.designation']}" />
				</f:facet>
				<h:outputText  value="#{varOwner1.designation}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.idType']}" />
				</f:facet>
				<h:outputText
					value="#{backingBean.getParameterDesc(varOwner1.identificationType)}" />
			</p:column>
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.composition.idenNum']}" />
				</f:facet>
				<h:outputText value="#{varOwner1.identificationNo}" />
			</p:column>
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.dob']}" />
				</f:facet>
				<h:outputText value="#{varOwner1.birthDate}">
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>
			</p:column>
			
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.resiAddr']}" />
				</f:facet>
				<h:outputText
					rendered="#{not empty varOwner1.smPersonnelAddresses[0].smAddress.address1}"
					value="#{varOwner1.smPersonnelAddresses[0].smAddress.address1}"
					converter="toUpperCaseConverter" />
				<h:outputText
					rendered="#{not empty varOwner1.smPersonnelAddresses[0].smAddress.address2}"
					value="&lt;br/&gt; #{varOwner1.smPersonnelAddresses[0].smAddress.address2}"
					escape="false" converter="toUpperCaseConverter" />
				<h:outputText
					rendered="#{not empty varOwner1.smPersonnelAddresses[0].smAddress.address3}"
					value="&lt;br/&gt; #{varOwner1.smPersonnelAddresses[0].smAddress.address3}"
					escape="false" converter="toUpperCaseConverter" />
				<h:outputText
					rendered="#{not empty varOwner1.smPersonnelAddresses[0].smAddress.postcode}"
					value="&lt;br/&gt; #{varOwner1.smPersonnelAddresses[0].smAddress.postcode}"
					escape="false" converter="toUpperCaseConverter" />
				<h:outputText
					rendered="#{not empty varOwner1.smPersonnelAddresses[0].smAddress.pmState.stateName}"
					value="&lt;br/&gt; #{varOwner1.smPersonnelAddresses[0].smAddress.pmState.stateName}"
					escape="false" converter="toUpperCaseConverter" />
			</p:column>

		</p:dataTable>
	</p:panel>
	
	
	<p:panel  id="Secretary" toggleable="true">
		<h:outputText style="font-weight:bold" value="#{lbl['lbl.sm.partSecretary']}" />
		<p:dataTable id="tableSecretary1" var="Secretary1" rowIndexVar="index"
			editable = "false"
			widgetVar="tableSecretary1 Widget"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{backingBean.managedBean.smAppl.smPersonnelSecretaries}"
			rowKey="#{varSecretary1}"
			sortBy="#{varSecretary1.name}">
			<ac:paginator for="tableSecretary1" />

			<p:column style="width:3%" styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.no1']}" />
				</f:facet>
				<h:outputText value="#{index + 1}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.person.composition.name']}" />
				</f:facet>
				<h:outputText value="#{Secretary1.secName}" />
			</p:column>
					
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.userprofile.designation']}" />
				</f:facet>
				<h:outputText  value="#{Secretary1.secDesignation}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.idType']}" />
				</f:facet>
				<h:outputText
					value="#{backingBean.getParameterDesc(Secretary1.identificationType)}" />
			</p:column>
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.composition.idenNum']}" />
				</f:facet>
				<h:outputText value="#{Secretary1.identificationNo}" />
			</p:column>
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.dob']}" />
				</f:facet>
				<h:outputText value="#{Secretary1.birthDate}">
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>
			</p:column>
			
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.residentialAdress']}" />
				</f:facet>
				<h:outputText
					rendered="#{not empty Secretary1.residentialAdress}"
					value="#{Secretary1.residentialAdress}"
					converter="toUpperCaseConverter" />

			</p:column>

		</p:dataTable>
	</p:panel>
	
	<p:panel id="Auditor" toggleable="true">
		<h:outputText style="font-weight:bold" value="#{lbl['lbl.sm.partAuditor']}"/>
		<p:dataTable id="tableAuditor1" var="Auditor1" rowIndexVar="index"
			editable = "false"
			widgetVar="tableAuditor1 Widget"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{backingBean.managedBean.smAppl.smApplAuditors}"
			rowKey="#{varAuditor1}"
			sortBy="#{varAuditor1.auditFirmName}">
			<ac:paginator for="tableAuditor1" />

			
			<p:column style="width:3%" styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.auditFirmNo']}" />
				</f:facet>
				<h:outputText value="#{Auditor1.auditFirmNo}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.auditFirmName']}" />
				</f:facet>
				<h:outputText value="#{Auditor1.auditFirmName}" />
			</p:column>

		
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.auditFirmAdress']}" />
				</f:facet>
				<h:outputText
					rendered="#{not empty Auditor1.auditFirmAdress}"
					value="#{Auditor1.auditFirmAdress}"
					converter="toUpperCaseConverter" />
			</p:column>

		</p:dataTable>
	</p:panel>
</p:panel>

	<p:panel toggleable="true" id="partMembers">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sm.partMemberpanHdr']}" />
		</f:facet>
		
	<p:panel id="Members" toggleable="true">
	<p:dataTable id="tableMembers1" var="Members1" rowIndexVar="index"
			editable = "false"
			widgetVar="tableMembers1 Widget"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{backingBean.managedBean.personnelMembers}"
			rowKey="#{Members1}"
			sortBy="#{Members1.name}">
			<ac:paginator for="tableMembers1" />

			<p:column style="width:3%" styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.no1']}" />
				</f:facet>
				<h:outputText value="#{index + 1}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.person.composition.name']}" />
				</f:facet>
				<h:outputText value="#{Members1.name}" />
			</p:column>

			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.idType']}" />
				</f:facet>
				<h:outputText
					value="#{backingBean.getParameterDesc(Members1.identificationType)}" />
			</p:column>
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.composition.idenNum']}" />
				</f:facet>
				<h:outputText value="#{Members1.identificationNo}" />
			</p:column>
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.dob']}" />
				</f:facet>
				<h:outputText value="#{Members1.birthDate}">
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>
			</p:column>
			
			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.share']}" />
				</f:facet>
				<h:outputText value="#{Members1.shareAmt}">
				</h:outputText>
			</p:column>
			
	   <p:columnGroup type="footer">
            <p:row>
                <p:column colspan="5" style="text-align:left" footerText="#{lbl['lbl.sm.shareNum']}" />
                <p:column style="text-align:left" footerText="#{backingBean.managedBean.totalShare}" />
            </p:row>
        </p:columnGroup>

		</p:dataTable>
	</p:panel>
</p:panel>

</ui:composition>
