<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Capital/Equity Shareholding Companies"
		toggleable="true"
		rendered="#{backingBean.managedBean.businessTypeVal eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROB_DEFAULT}">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.equityCompVerifed}"
							id="poEquiVer">
							<p:ajax update=":form:tt:equiInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.equityCompVerifed)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.equityCompVerifed}"
							id="apprEquiVer">
							<p:ajax update=":form:tt:equiInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.equityCompVerifed)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="equiInfPan">
			<p:blockUI block=":form:tt:equiInfPan" widgetVar="buiPoEqui"
				id="poBasEqui"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.equityCompVerifed : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.equityCompVerifed : false)}" />
			<p:dataTable var="equiBean"
				value="#{backingBean.managedBean.smAppl.smEquityCompanies}"
				selection="#{backingBean.managedBean.selectedEquityCompanies}"
				rowKey="#{equiBean}" rowIndexVar="index" id="eqiComDt">
				<ac:paginator for="eqiComDt" />

				<p:column selectionMode="multiple" width="5%" />
				<p:column headerText="Company Name">
					<h:outputText value="#{equiBean.companyName}" />
				</p:column>

				<p:column headerText="Address">
					<h:outputText
						value="#{equiBean.smAddress.address1},
					#{equiBean.smAddress.address2},#{equiBean.smAddress.address3}" />
				</p:column>

				<p:column headerText="Share Amt (RM.)">
					<h:outputText value="#{equiBean.shareAmt}" />
				</p:column>
				<p:column headerText="Share holding(%)">
					<h:outputText value="#{equiBean.sharePercentage}" />
				</p:column>
				<p:column headerText="Action">
					<p:commandLink update=":form:tt:eqiCompDialog"
						oncomplete="eqiCompDialog.show();"
						action="#{backingBean.assignSelEquiCompany(equiBean)}">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="Add"
					action="#{backingBean.assignNewEquiCompBean}"
					oncomplete="eqiCompDialog.show();" update=":form:tt:eqiCompDialog" />
				<p:commandButton value="Delete"
					action="#{backingBean.deleteSelectedEquiCompanies}"
					update=":form:tt:eqiComDt" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.equityCompRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.equityCompRemark}" /></td>
						<td><p:outputLabel value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.equityCompRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="450px"
		header="ShareHolding / Equity Company Information" id="eqiCompDialog"
		widgetVar="eqiCompDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		<!-- <p:panel header="Associated Company Details"> -->
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Company Name" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedEquityCompany.companyName}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* ROC/ROB/ROS NO." /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedEquityCompany.regNo}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Share Amount (RM.)" /></td>
				<td><p:inputText id="equiCompShrAmt"
						value="#{backingBean.managedBean.selectedEquityCompany.shareAmt}"
						size="35">
						<p:ajax event="blur" update="equiCompShrAmt, equiCompShrPer"
							listener="#{backingBean.calculateEquityCompanyPercent}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Share Percentage(%)" /></td>
				<td><p:inputText id="equiCompShrPer"
						value="#{backingBean.managedBean.selectedEquityCompany.sharePercentage}"
						size="10" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Address" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedEquityCompany.smAddress.address1}"
						size="35" /></td>
			</tr>

			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedEquityCompany.smAddress.address2}"
						size="35" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedEquityCompany.smAddress.address3}"
						size="35" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedEquityCompany.smAddress.address4}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Country" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmCountry.countryId}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="equiCountry"
							value="#{backingBean.managedBean.countryLs}"
							itemValue="#{equiCountry.countryId}"
							itemLabel="#{equiCountry.countryName}" />
						<p:ajax event="change"
							listener="#{backingBean.populateStatesByCountry(backingBean.managedBean.selectedEquityCompany.smAddress.pmCountry.countryId, 
								SupplierManagementConst.SM_EQUI_COMPANY_PANEL,
								backingBean.managedBean.selectedEquityCompany.smAddress.pmState,
								backingBean.managedBean.selectedEquityCompany.smAddress.pmDistrict,
								backingBean.managedBean.selectedEquityCompany.smAddress.pmCity)}"
							update="equiState,equiDist,equiCity" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>

				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						value="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmState.stateId}"
						id="equiState">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="equiState"
							value="#{backingBean.managedBean.equiCompanyStates}"
							itemValue="#{equiState.stateId}"
							itemLabel="#{equiState.stateName}" />
						<p:ajax event="change"
							listener="#{backingBean.populateDistrictsByState(backingBean.managedBean.selectedEquityCompany.smAddress.pmState.stateId, 
								SupplierManagementConst.SM_EQUI_COMPANY_PANEL,
								backingBean.managedBean.selectedEquityCompany.smAddress.pmDistrict,
								backingBean.managedBean.selectedEquityCompany.smAddress.pmCity)}"
							update="equiDist,equiCity" />

					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						id="equiDist"
						value="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmDistrict.districtId}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="equiDist"
							value="#{backingBean.managedBean.equiCompanyDistricts}"
							itemValue="#{equiDist.districtId}"
							itemLabel="#{equiDist.districtName}" />
						<p:ajax event="change"
							listener="#{backingBean.populateCitiesByDistrict(backingBean.managedBean.selectedEquityCompany.smAddress.pmDistrict.districtId, 
								SupplierManagementConst.SM_EQUI_COMPANY_PANEL,
								backingBean.managedBean.selectedEquityCompany.smAddress.pmCity)}"
							update="equiCity" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						id="equiCity"
						value="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmCity.cityId}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="equiCity"
							value="#{backingBean.managedBean.equiCompanyCities}"
							itemValue="#{equiCity.cityId}" itemLabel="#{equiCity.cityName}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedEquityCompany.smAddress.postcode}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Phone NO." /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedEquityCompany.phoneNo}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Fax NO." /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedEquityCompany.faxNo}"
						size="35" /></td>
			</tr>

		</table>
		<!-- </p:panel> -->
		<br />
		<div align="right">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdateEquityCompanyToSmAppl}"
				oncomplete="eqiCompDialog.hide();" type="submit"
				partialSubmit="true" process=":form:tt:eqiCompDialog"
				update=":form:tt:eqiComDt" />
			<p:commandButton value="Cancel" onclick="eqiCompDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
