<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Capital/Equity Shareholding Companies"
		toggleable="true">
		<table style="width: 250px">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By PO: "
						title="For PO to highlight the verified section " /></td>

			</tr>
			<tr>
				<td width="10px"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By Approver: "
						title="For Approver to highlight the verified section " /></td>
			</tr>
		</table>
		<br />
		<p:dataTable var="equiBean"
			value="#{backingBean.managedBean.smAppl.smEquityCompanies}"
			selection="#{backingBean.managedBean.selectedEquityCompanies}"
			selectionMode="multiple" rowKey="#{equiBean.equityCompanyId}"
			rowIndexVar="index" id="eqiComDt">


			<p:column headerText="NO.">
				<h:outputText value="#{index+1}" />
			</p:column>

			<p:column headerText="Company Name">
				<p:commandLink value="#{equiBean.companyName}"
					update=":form:tt:eqiCompDialog" oncomplete="eqiCompDialog.show();"
					action="#{backingBean.assignSelEquiCompany(equiBean)}" />
			</p:column>

			<p:column headerText="Address">
				<h:outputText
					value="#{equiBean.smAddress.address1},
					#{equiBean.smAddress.address2},#{equiBean.smAddress.address3}" />
			</p:column>

			<p:column headerText="Share Amt">
				<h:outputText value="RM. #{equiBean.shareAmount}" />
			</p:column>
			<p:column headerText="Share holding(%)">
				<h:outputText value="#{equiBean.sharePercentage}" />
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Equity Company"
				action="#{backingBean.assignNewEquiCompBean}"
				oncomplete="eqiCompDialog.show();" update=":form:tt:eqiCompDialog" />
			<p:commandButton value="Delete" />

		</div>
		<br />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog width="500px" height="510px"
		header="ShareHolding / Equity Company Page" id="eqiCompDialog"
		widgetVar="eqiCompDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		<p:panel header="Associated Company Details">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Company Name *" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.companyName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="ROC/ROB/ROS No. *" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.regNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Share Amount *" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.shareAmount}" />
						<h:outputText value="MYR" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Share Percentage *" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.sharePercentage}" />
						<h:outputText value="%" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Address" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.smAddress.address1}" /></td>
				</tr>

				<tr>
					<td></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.smAddress.address2}" /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.smAddress.address3}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Country *" /></td>
					<td><p:selectOneMenu
							value="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmCountry.countryCode}">
							<f:selectItem itemLabel="-- Select One -- " itemValue="" />
							<f:selectItem itemLabel="Malaysia" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.smAddress.postcode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmState.stateCode}" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmDistrict.districtCode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmCity.cityCode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Phone No." /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.smAddress.phoneNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Fax No." /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedEquityCompany.smAddress.faxNo}" /></td>
				</tr>

			</table>
		</p:panel>
		<br />
		<div align="center">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdateEquityCompanyToSmAppl}"
				oncomplete="eqiCompDialog.hide();" type="submit"
				partialSubmit="true" process=":form:tt:eqiCompDialog"
				update=":form:tt:eqiComDt" />
			<p:commandButton value="Cancel" onclick="eqiCompDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
