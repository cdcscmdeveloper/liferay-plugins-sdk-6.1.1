<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- #33783 - start -->
	<ui:param name="headerEquiCompany" value="#{backingBean.managedBean.smAppl.smCompanyBasic.companyTypeSSM 
		== SupplierManagementConst.COMPANY_TYPE_CLBG ? lbl['lbl.sm.equiComp.panHdr.clbg'] : lbl['lbl.sm.equiComp.panHdr']}" />
	<p:panel header="#{headerEquiCompany}" toggleable="true">
	<!-- #33783 - end -->
		<!-- 28466 - start - add screen instruction -->
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sm.shareholder.valid.value.shareholding']}"
			escape="false"
			rendered="#{backingBean.managedBean.smSupplier.businessType ne 'K' and backingBean.managedBean.smSupplier.businessType ne 'L'
					and backingBean.managedBean.smSupplier.businessType ne 'M' and backingBean.managedBean.smSupplier.businessType ne 'O'
					and backingBean.managedBean.smSupplier.businessType ne 'P' and backingBean.managedBean.businessTypeVal eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_DEFAULT}" />
		<!-- 28466 - end -->
		<table style="width: 350px">
			<!-- Disable for UPS 32008 - START -->
			<p:outputPanel rendered="#{backingBean.managedBean.poUser and !backingBean.managedBean.upsCannotEdit}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.equityCompVerifed}"
							id="poEquiVer">
							<p:ajax update=":form:tt:equiInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:equiInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.equityCompVerifed)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser and !backingBean.managedBean.upsCannotEdit}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.equityCompVerifed}"
							id="apprEquiVer">
							<p:ajax update=":form:tt:equiInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:equiInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.equityCompVerifed)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>

		<p:outputPanel id="equiInfPan" layout="block">
			<p:blockUI rendered="#{!backingBean.managedBean.upsCannotEdit}" block=":form:tt:equiInfPan" widgetVar="buiPoEqui"
				id="poBasEqui"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.equityCompVerifed : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.equityCompVerifed : false)}" />
			<p:dataTable var="equiBean" widgetVar="suppEquiCompDtWidVar"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.smAppl.smEquityCompanies}"
				selection="#{backingBean.managedBean.selectedEquityCompanies}"
				rowKey="#{equiBean}" rowIndexVar="index" id="eqiComDt">
				<ac:paginator for="eqiComDt" />
				<p:ajax event="rowSelect" listener="#{backingBean.unSelectEquityCompany}"
					update=":form:tt:eqiComDt"></p:ajax>
				<p:ajax event="rowUnselect" listener="#{backingBean.unSelectEquityCompany}"
					update=":form:tt:eqiComDt"></p:ajax>
				<p:ajax event="rowSelectCheckbox"
					listener="#{backingBean.unSelectEquityCompany}" update=":form:tt:eqiComDt"></p:ajax>
				<p:ajax event="rowUnselectCheckbox"
					listener="#{backingBean.unSelectEquityCompany}" update=":form:tt:eqiComDt"></p:ajax>
				<p:ajax event="rowDblselect" listener="#{backingBean.unSelectEquityCompany}"
					update=":form:tt:eqiComDt"></p:ajax>

				<p:column selectionMode="multiple" width="1%" rendered="#{(not empty backingBean.managedBean.smAppl.smEquityCompanies) and (!backingBean.managedBean.upsCannotEdit)}" disabledSelection="#{equiBean.ssmData}" />
				<p:column headerText="#{lbl['lbl.sm.equiComp.compName']}" style="white-space: break-spaces;">
					<h:outputText value="#{equiBean.companyName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.equiComp.addr']}" style="white-space:normal;word-break:break-word;">
					<h:outputText
						value="#{backingBean.getFullAddress(equiBean.smAddress)}"
						style="float : left" />
				</p:column>

				<!-- 28466 - start - add mandatory sign (*) and allow supplier to key-in the Share Amount (RM) -->
				<p:column>
					<c:choose>
						<c:when
							test="#{backingBean.managedBean.businessTypeVal eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_DEFAULT}">
							<f:facet name="header">
								<p:outputLabel value="*" styleClass="mandatory"
									style="float:left" />
								<h:outputText value="#{lbl['lbl.sm.equiComp.shrAmt']}" />
							</f:facet>
							<!-- #30660 - disable edit -->
							<p:inputText value="#{equiBean.shareAmt}" disabled="#{backingBean.managedBean.disAllowOwnerEdit or backingBean.managedBean.upsCannotEdit}">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								<p:ajax event="blur" update="eqiComDt"
									listener="#{backingBean.calculateCapital}" />
							</p:inputText>
						</c:when>
						<c:otherwise>
							<h:outputText value="#{equiBean.shareAmt}">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</h:outputText>
						</c:otherwise>
					</c:choose>
				<!-- 28466 - end -->
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.equiComp.shrPerc']}">
					<h:outputText value="#{equiBean.sharePercentage}" >
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE_EQUITY)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<!-- #30660 start - fix reopen -->
					<p:commandLink update=":form:tt:eqiCompDialog :form:tt:viewEqiCompDialog" partialSubmit="true"
						process="@this" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" action="#{backingBean.assignSelEquiCompany(equiBean)}">
						<p:outputPanel rendered="#{backingBean.managedBean.disAllowOwnerEdit}">
							<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
						</p:outputPanel>
						<p:outputPanel rendered="#{!backingBean.managedBean.disAllowOwnerEdit}">
							<p:graphicImage rendered="#{backingBean.managedBean.upsCannotEdit}" value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
						<p:graphicImage rendered="#{!backingBean.managedBean.upsCannotEdit}" value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
						</p:outputPanel>
					</p:commandLink> 
					<!-- #30660 end -->
					<ac:smFieldChangeTableAlert object="#{equiBean}" />
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<!-- #30660 start - fix reopen -->
				<p:commandButton
					rendered="#{!backingBean.managedBean.upsCannotEdit}"
					disabled="#{backingBean.managedBean.disAllowOwnerEdit}"
					value="#{lbl['lbl.sm.button.add']}"
					action="#{backingBean.assignNewEquiCompBean}" partialSubmit="true" 
					process="@this" update=":form:tt:eqiCompDialog" /> 
				<p:commandButton
					rendered="#{!backingBean.managedBean.upsCannotEdit}"
					value="#{lbl['lbl.sm.button.delete']}" id="equiCompDelBtnId"
					disabled="#{empty backingBean.managedBean.smAppl.smEquityCompanies or backingBean.managedBean.disAllowOwnerEdit}"
					oncomplete="equiCompDeletePopUp.show()" process="equiInfPan"
					partialSubmit="true" update=":form:tt:eqiComDt" />
				<!-- #30660 end -->

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser or (backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser)}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<!-- #33783 -->
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="capEquiShrCompPoRmrk" readonly="#{backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser}"
								validatorMessage="#{headerEquiCompany} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.equityCompRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="capEquiShrCompPoRmrkMsg"
								for="capEquiShrCompPoRmrk" showSummary="true" showDetail="false"
								display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.equityCompRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<!-- #33783 -->
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="capEquiShrCompApprvrRmrk"
								validatorMessage="#{headerEquiCompany} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.equityCompRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="capEquiShrCompApprvrRmrkMsg"
								for="capEquiShrCompApprvrRmrk" showSummary="true"
								showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	<!-- #30660 start - fix reopen -->
	<p:dialog style="max-height:350px;width:500px" header="#{lbl['lbl.sm.equiComp.dialHdr']}"
	id="viewEqiCompDialog" widgetVar="viewEqiCompDialog" resizable="false" closable="true"
		showEffect="fade" hideEffect="fade" modal="true"> 
		<p:scrollPanel mode="native" style="max-height:300px;width:450px;border:none">
			<table style="width: 100%; table-layout: fixed"> 
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiComp.compName']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.companyName}" /></td>
				</tr> 
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiComp.regNo']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.regNo}" /></td>
				</tr> 
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiComp.shrAmt']}" /></td>
					<td><ac:labelAmount styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.shareAmt}" /></td>
				</tr> 
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiComp.shrPerc']}" /></td>
					<td><ac:labelEquityAmount styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.sharePercentage}" />
					</td> 
				</tr> 
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiComp.addr']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.smAddress.address1}" /></td>
				</tr> 
				<tr> 
					<td></td> 
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.smAddress.address2}" /></td>
				</tr> 
				<tr> 
					<td></td> 
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.smAddress.address3}" /></td>
				</tr> 
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmCountry.countryName}" /></td>
				</tr> 
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmState.stateName}" /></td>
				</tr> 
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.division']}" rendered="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmState.adoptDivision}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmDivision.divisionName}" rendered="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmState.adoptDivision}" /></td>
				</tr> 
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmDistrict.districtName}" /></td>
				</tr> 
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.smAddress.pmCity.cityName}" /></td>
				</tr>  
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.smAddress.postcode}" /></td>
				</tr> 
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.phoneFull}" /></td>
				</tr> 
				<tr> 
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.faxno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedEquityCompany.faxFull}" /></td>
				</tr> 
			</table> 
		</p:scrollPanel> 
	</p:dialog> 
	<!-- #30660 end -->
	<p:dialog width="500px" height="450px"
		header="#{lbl['lbl.sm.equiComp.dialHdr']}" id="eqiCompDialog"
		widgetVar="eqiCompDialog" resizable="false" closable="true"
		showEffect="fade" hideEffect="fade" modal="true">
		
		<p:outputPanel layout="block" id="equiCompBlockPanel">
			<p:messages id="suppEquiCompInfoMsg" showSummary="false"
				showDetail="true" autoUpdate="true" closable="true" />
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.equiComp.compName']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText
							validator="#{backingBean.validateRequiredField}"
							label="#{lbl['lbl.sm.equiComp.compName']}" id="supEquiCompName"
							value="#{backingBean.managedBean.selectedEquityCompany.companyName}"
							disabled ="#{(backingBean.managedBean.selectedEquityCompany.ssmData and not empty backingBean.managedBean.selectedEquityCompany.companyName) or backingBean.managedBean.upsCannotEdit}"
							size="35" >
								<p:ajax event="blur" process="@this" update="@this"/>
								<f:attribute name="labelName" value="#{lbl['lbl.sm.equiComp.compName']}" />
							</p:inputText>
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.managedBean.latestEquityCompany.companyName}" 
								currValue="#{backingBean.managedBean.selectedEquityCompany.companyName}" 
								alertValue="#{backingBean.managedBean.latestEquityCompany.companyName}"/>
							<p:message id="supEquiCompNameMsg"
							for="supEquiCompName" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.equiComp.regNo']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="20"
							validator="#{backingBean.validateRequiredField}"
							label="#{lbl['lbl.sm.equiComp.regNo']}" id="suppEquiCompRegNo"
							value="#{backingBean.managedBean.selectedEquityCompany.regNo}"
							disabled ="#{(backingBean.managedBean.selectedEquityCompany.ssmData and not empty backingBean.managedBean.selectedEquityCompany.regNo) or backingBean.managedBean.upsCannotEdit}"
							size="35" > 
							<f:attribute name="labelName" value="#{lbl['lbl.sm.assocCmpny.regNo']}" />
							<p:ajax event="blur" process="@this" update="equiCompBlockPanel" partialSubmit="true"
									listener="#{backingBean.onBlurRegNo(backingBean.managedBean.selectedEquityCompany,'EquiCompanyPanel')}"/>
							</p:inputText>
							<p:message id="suppEquiCompRegNoMsg"
							for="suppEquiCompRegNo" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.mofNo']}" /></td>
					<td>
						<p:inputText value="#{backingBean.managedBean.selectedEquityCompany.mofNo}"
							readonly="true" size="35" id="suppEquiMofNoId" disabled="#{backingBean.managedBean.upsCannotEdit}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.equiComp.shrAmt']} " />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<!-- #28466 start - remove #27308 showstopper #30660 start - fix reopen -->
					<td><p:inputText id="equiCompShrAmt"
							disabled="#{backingBean.managedBean.disAllowOwnerEdit or !backingBean.managedBean.valueReqd or backingBean.managedBean.upsCannotEdit}" 
							required="#{backingBean.managedBean.valueReqd and not backingBean.managedBean.disAllowOwnerEdit}"
							label="#{lbl['lbl.sm.equiComp.shrAmt']}" 
							validatorMessage="#{lbl['lbl.sm.equiComp.shrAmt']} - #{lbl['lbl.sm.minAmt.validMsg']}" 
							value="#{backingBean.managedBean.selectedEquityCompany.shareAmt}" 
							size="35"> 
					<!-- #30660 end -->
					<!-- #28466 start - remove #27308 showstopper -->
							<f:validateDoubleRange for="contractorContractVal"
								minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
								maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							<p:ajax event="blur" update="equiCompShrAmt, equiCompShrPer"
								listener="#{backingBean.calculateEquityCompanyPercent}" />
						</p:inputText> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges 
								and not empty backingBean.managedBean.selectedEquityCompany.equityCompanyId}"
							oriValue="#{backingBean.managedBean.latestEquityCompany.shareAmt}" 
							currValue="#{backingBean.managedBean.selectedEquityCompany.shareAmt}" 
							alertValue="#{backingBean.getPriceAmountFormat(backingBean.managedBean.latestEquityCompany.shareAmt)}"/>
						<p:message id="equiCompShrAmtMsg" for="equiCompShrAmt"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.equiComp.shrPerc']}" /></td>
					<td><p:inputText id="equiCompShrPer"
							value="#{backingBean.managedBean.selectedEquityCompany.sharePercentage}"
							size="10" readonly="true" disabled="true">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE_EQUITY)}" />
						</p:inputText>
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges}"
							oriValue="#{backingBean.managedBean.latestEquityCompany.sharePercentage}" 
							currValue="#{backingBean.managedBean.selectedEquityCompany.sharePercentage}" 
							alertValue="#{backingBean.getPriceAmountFormat(backingBean.managedBean.latestEquityCompany.sharePercentage)}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.equiComp.addr']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<!-- #30660 start - fix reopen -->
					<td><p:inputText maxlength="100" 
							required="#{backingBean.managedBean.valueReqd and not backingBean.managedBean.disAllowOwnerEdit}"
							label="#{lbl['lbl.sm.equiComp.addr']}" id="suppEquiCompAddr" 
							value="#{backingBean.managedBean.selectedEquityCompany.smAddress.address1}" 
							disabled ="#{(backingBean.managedBean.selectedEquityCompany.smAddress.ssmData and not empty backingBean.managedBean.selectedEquityCompany.smAddress.address1) or backingBean.managedBean.upsCannotEdit}" 
							size="35" />
					<!-- #30660 end -->
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.managedBean.latestEquityCompany.smAddress.address1}" 
								currValue="#{backingBean.managedBean.selectedEquityCompany.smAddress.address1}" 
								alertValue="#{backingBean.managedBean.latestEquityCompany.smAddress.address1}"/>
							<p:message id="suppEquiCompAddrMsg"
							for="suppEquiCompAddr" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
	
				<tr>
					<td></td>
					<td><p:inputText maxlength="100"
							value="#{backingBean.managedBean.selectedEquityCompany.smAddress.address2}"
							disabled ="#{(backingBean.managedBean.selectedEquityCompany.smAddress.ssmData and not empty backingBean.managedBean.selectedEquityCompany.smAddress.address1) or backingBean.managedBean.upsCannotEdit}"							
							size="35" />
						<ac:smFieldChangeAlert

							oriValue="#{backingBean.managedBean.latestEquityCompany.smAddress.address2}"
