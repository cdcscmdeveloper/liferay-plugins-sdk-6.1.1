<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel
		header="Capital/Equity Shareholding Companies  
		(Applicable Only For ROC - Read Only display table with all share holding companies)
		-- TBC No SSM Integration"
		toggleable="true">
		<table style="width: 250px">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
				<td><p:outputLabel value=" Section Verified By PO: "
						title="For PO to highlight the verified section " /></td>

			</tr>
			<tr>
				<td width="10px"><p:selectBooleanCheckbox /></td>
				<td><p:outputLabel value=" Section Verified By Approver: "
						title="For Approver to highlight the verified section " /></td>
			</tr>
		</table>
		<br />
		<p:dataTable var="utilBean"
			value="#{mofRegistrationBackingBean.utilList}"
			rowKey="#{utilBean.seqNo}" rowIndexVar="index">


			<p:column headerText="NO.">
				<p:outputLabel value="1" />
			</p:column>

			<p:column headerText="Company Name">
				<p:outputLabel value="CDC Sdn Bhd" />
			</p:column>

			<p:column headerText="Address">
				<p:outputLabel
					value="Block Belatuk,Cyber View Garden,Cyber Jaya, Selangor,Malaysia" />
			</p:column>

			<p:column headerText="Value(MYR)">
				<p:outputLabel value="1,000.00" />
			</p:column>
			<p:column headerText="Share holding(%)">
				<p:outputLabel value="21" />
			</p:column>
		</p:dataTable>
		<br />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
