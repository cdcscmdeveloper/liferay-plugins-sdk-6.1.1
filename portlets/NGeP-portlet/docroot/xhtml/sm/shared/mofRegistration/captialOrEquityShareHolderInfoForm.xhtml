<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Capital / Equity Shareholders' ( Personnel)"
		toggleable="true">
		<div>
			<p:outputLabel value=" Section Verified : "
				title="For PO / Approver highlight the verified section " />
			<p:selectBooleanCheckbox />
		</div>
		<br />
		<p:dataTable>
			<!-- <p:column selectionMode="multiple">
			</p:column> -->

			<p:column headerText="NO.">
				<h:outputText />
			</p:column>

			<p:column headerText="Name">
				<h:outputText />
			</p:column>
			<p:column headerText="IC/Passport Num">
				<h:outputText />
			</p:column>
			<p:column headerText="Share Holding(%)">
				<h:outputText />
			</p:column>
			<p:column headerText="Value(MYR)">
				<h:outputText />
			</p:column>
			<p:column headerText="Equity Owner?">
				<h:outputText />
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Share Holder"
				onclick="shareHolderDialog.show();" />
			<p:commandButton value="Delete Share Holder(s)" />
		</div>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog width="800px" height="500px" header="Share Holder Details"
		widgetVar="shareHolderDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">

		<ui:include
			src="/xhtml/sm/shared/mofRegistration/personnelInfoPopUpForm.xhtml" />
		<div align="center">
			<p:commandButton value="Save" onclick="shareHolderDialog.hide();" />
			<p:commandButton value="Cancel" onclick="shareHolderDialog.hide();" />
		</div>
	</p:dialog>

</ui:composition>
