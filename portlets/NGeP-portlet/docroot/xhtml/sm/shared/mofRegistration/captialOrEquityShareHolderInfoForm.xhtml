<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Capital / Equity Shareholders ( Personnel)"
		toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:dataTable var="shareBean"
			value="#{backingBean.managedBean.smapplShareHolders}"
			selection="#{backingBean.managedBean.selectedShareHolders}"
			rowKey="#{shareBean.personnelId}" rowIndexVar="index" id="shrPerDt">
			<ac:paginator for="shrPerDt" />
			<p:column selectionMode="multiple" width="5%" />


			<p:column headerText="Name">
				<h:outputText value="#{shareBean.name}" />
			</p:column>
			<p:column headerText="IC/Passport Num">
				<h:outputText value="#{shareBean.identificationNo}" />
			</p:column>
			<p:column headerText="Share Holding(%)">
				<h:outputText value="#{shareBean.sharePercentage}" />
			</p:column>
			<p:column headerText="Value (RM.)">
				<h:outputText value="#{shareBean.shareAmount}" />
			</p:column>
			<p:column headerText="Equity Owner?">
				<h:outputText value="Yes" />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink oncomplete="shareHolderDialog.show();"
					action="#{backingBean.assignSelShareHolder(shareBean)}"
					update=":form:tt:shareHolderDialog">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="Add" oncomplete="shareHolderDialog.show();"
				action="#{backingBean.assignNewShareHolder}"
				update=":form:tt:shareHolderDialog" />
			<p:commandButton value="Delete" />
		</div>
		<br />
		<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
			<table style="width: 50%">
				<tr>
					<td style="padding-left: 38px;"><p:outputLabel
							value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" cols="41" /></td>
				</tr>
			</table>
		</p:outputPanel>
		<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
			<table style="width: 100%">
				<tr>
					<td style="padding-left: 38px;"><p:outputLabel
							value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" readonly="true"
							disabled="true" cols="41" /></td>
					<td style="padding-left: 22px;"><p:outputLabel
							value="Approver Remarks" /></td>
					<td><p:inputTextarea autoResize="true" cols="41" /></td>

				</tr>
			</table>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="850px" height="500px" header="Share Holder Details"
		widgetVar="shareHolderDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="shareHolderDialog">

		<ui:include
			src="/xhtml/sm/shared/mofRegistration/shareHolderInfoPopUpForm.xhtml" />
		<div align="right">
			<p:commandButton value="Save" oncomplete="shareHolderDialog.hide();"
				action="#{backingBean.addOrUpdateShareHolderToSmAppl}"
				update=":form:tt:shrPerDt" />
			<p:commandButton value="Cancel" onclick="shareHolderDialog.hide();" />
		</div>
	</p:dialog>

</ui:composition>
