<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Capital / Equity Shareholders ( Personnel)"
		toggleable="true"
		rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType eq '1' or backingBean.managedBean.smAppl.smSupplier.businessType eq '2'}">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.shareholderVerifed}"
							id="poShrVer">
							<p:ajax update=":form:tt:shrInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.shareholderVerifed)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.shareholderVerifed}"
							id="apprShrVer">
							<p:ajax update=":form:tt:shrInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.shareholderVerifed)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="shrInfPan">
			<p:blockUI block=":form:tt:shrInfPan" widgetVar="buiPoShr"
				id="poShrBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.shareholderVerifed : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.shareholderVerifed : false)}" />
			<p:dataTable var="shareBean"
				value="#{backingBean.managedBean.smapplShareHolders}"
				selection="#{backingBean.managedBean.selectedShareHolders}"
				rowKey="#{shareBean}" rowIndexVar="index" id="shrPerDt">
				<ac:paginator for="shrPerDt" />
				<p:column selectionMode="multiple" width="5%" />


				<p:column headerText="Name">
					<h:outputText value="#{shareBean.name}" />
				</p:column>
				<p:column headerText="IC/Passport Num">
					<h:outputText value="#{shareBean.identificationNo}" />
				</p:column>
				<p:column headerText="Share Holding(%)">
					<h:outputText value="#{shareBean.sharePercentage}" />
				</p:column>
				<p:column headerText="Value (RM.)">
					<h:outputText value="#{shareBean.shareAmt}" />
				</p:column>
				<p:column headerText="Equity Owner?">
					<h:outputText value="Yes" />
				</p:column>
				<p:column headerText="Action">
					<p:commandLink oncomplete="shareHolderDialog.show();"
						action="#{backingBean.assignSelShareHolder(shareBean)}"
						update=":form:tt:shareHolderDialog" style="padding-right:5px;">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
					<p:commandLink oncomplete="shareHolderAddrDialog.show();"
						action="#{backingBean.assignSelShareHolderAddress(shareBean)}"
						update=":form:tt:shareHolderAddrDialog" id="shrAddrLnk">
						<p:graphicImage library="ep/images/design" name="register.png"
							value="/resources/ep/images/design/register.png" />
					</p:commandLink>
					<p:tooltip for="shrAddrLnk">
						<h:outputText value="Address Details" />
					</p:tooltip>
				</p:column>
			</p:dataTable>

			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="Add" oncomplete="shareHolderDialog.show();"
					action="#{backingBean.assignNewShareHolder}"
					update=":form:tt:shareHolderDialog" />
				<p:commandButton value="Delete"
					action="#{backingBean.deleteSelectedShareHolders}"
					update=":form:tt:shrPerDt" />
			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41" /></td>
						<td style="padding-left: 22px;"><p:outputLabel
								value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="1050px" height="500px"
		header="Share Holder Information" widgetVar="shareHolderDialog"
		resizable="false" showEffect="fade" hideEffect="fade" modal="true"
		id="shareHolderDialog">

		<ui:include
			src="/xhtml/sm/shared/mofRegistration/shareHolderInfoPopUpForm.xhtml" />
		<div align="right" style="padding-top: 10px;">
			<p:commandButton value="Save" oncomplete="shareHolderDialog.hide();"
				action="#{backingBean.addOrUpdateShareHolderToSmAppl}"
				update=":form:tt:shrPerDt" />
			<p:commandButton value="Cancel" onclick="shareHolderDialog.hide();" />
		</div>
	</p:dialog>
	<p:dialog width="1050px" height="500px"
		header="Share Holder Address Information"
		widgetVar="shareHolderAddrDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="shareHolderAddrDialog">

		<ui:include
			src="/xhtml/sm/shared/mofRegistration/shareHolderAddressInfoPopUpForm.xhtml" />
		<div align="right">
			<p:commandButton value="Save"
				oncomplete="shareHolderAddrDialog.hide();"
				update=":form:tt:shrPerDt"
				action="#{backingBean.addOrUpdateShareHolderAddress(backingBean.managedBean.selectedShareHolder)}" />
			<p:commandButton value="Cancel"
				onclick="shareHolderAddrDialog.hide();" />
		</div>
	</p:dialog>

</ui:composition>
