<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Capital / Equity Shareholders' ( Personnel)"
		toggleable="true">
		<table style="width: 250px">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By PO: "
						title="For PO to highlight the verified section " /></td>

			</tr>
			<tr>
				<td width="10px"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By Approver: "
						title="For Approver to highlight the verified section " /></td>
			</tr>
		</table>
		<br />
		<p:dataTable var="utilBean"
			value="#{mofRegistrationBackingBean.utilList}"
			selection="#{mofRegistrationBackingBean.managedBean.selectedUtilList}"
			rowKey="#{utilBean.seqNo}" rowIndexVar="index">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<p:outputLabel value="1" />
			</p:column>

			<p:column headerText="Name">
				<p:commandLink value="Venkat" onclick="shareHolderDialog.show();" />
			</p:column>
			<p:column headerText="IC/Passport Num">
				<p:outputLabel value="F383864837" />
			</p:column>
			<p:column headerText="Share Holding(%)">
				<p:outputLabel value="10" />
			</p:column>
			<p:column headerText="Value(MYR)">
				<p:outputLabel value="1,000.00" />
			</p:column>
			<p:column headerText="Equity Owner?">
				<p:outputLabel value="Yes" />
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Share Holder"
				onclick="shareHolderDialog.show();" />
			<p:commandButton value="Delete Share Holder(s)" />
		</div>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog width="800px" height="500px" header="Share Holder Details"
		widgetVar="shareHolderDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">

		<ui:include
			src="/xhtml/sm/shared/mofRegistration/personnelInfoPopUpForm.xhtml" />
		<div align="center">
			<p:commandButton value="Save" onclick="shareHolderDialog.hide();" />
			<p:commandButton value="Cancel" onclick="shareHolderDialog.hide();" />
		</div>
	</p:dialog>

</ui:composition>
