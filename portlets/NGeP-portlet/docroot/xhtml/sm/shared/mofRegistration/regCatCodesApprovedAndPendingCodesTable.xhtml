<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- 29723 Start -->	
	<p:outputPanel
		rendered="#{backingBean.managedBean.smAppl.applType ne 'R' and 
		backingBean.managedBean.currentStatus ne 'Pending Review Site Visit Report - After Approval' and
		backingBean.managedBean.currentStatus ne 'Menunggu Laporan Lawatan Tapak - Selepas Diluluskan'}">
		<!-- 29723 End -->	
		<p:dataTable var="catBean" widgetVar="smCatCodesNonRenewApplDtWidVar"
			value="#{backingBean.managedBean.activeCategoryList}"
			rowKey="#{catBean}" rowIndexVar="index" id="catDt"
			selection="#{backingBean.managedBean.deleteNewApplCategoryList}"
			rendered="#{backingBean.managedBean.smAppl.applType ne 'R'}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<ac:paginator for="catDt" />
			<p:ajax event="rowSelect" partialSubmit="true" process="@this"
				listener="#{backingBean.unSelectApporvedCategories}"
				update=":form:tt:catCodeInfPan"></p:ajax>
			<p:ajax event="rowUnselect"
				listener="#{backingBean.unSelectApporvedCategories}"
				update=":form:tt:catCodeInfPan"></p:ajax>
			<p:ajax event="rowSelectCheckbox"
				listener="#{backingBean.unSelectApporvedCategories}"
				update=":form:tt:catCodeInfPan"></p:ajax>
			<p:ajax event="rowUnselectCheckbox"
				listener="#{backingBean.unSelectApporvedCategories}"
				update=":form:tt:catCodeInfPan"></p:ajax>
			<p:ajax event="rowDblselect"
				listener="#{backingBean.unSelectApporvedCategories}"
				update=":form:tt:catCodeInfPan"></p:ajax>
			<p:columnGroup type="header">
				<p:row>
					<!-- #32008 -->
					<p:column style="width:2%"
						rendered="#{!backingBean.managedBean.approverUser and !backingBean.managedBean.upsCannotEdit}"
						disabledSelection="#{backingBean.managedBean.supplierUser and 
							(catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS or not empty catBean.approvedDate)}" />
					<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
						style="width : 2%;"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column style="width :350px;white-space : normal"
						headerText="#{lbl['lbl.sm.catCodes.cate']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<!-- #28774 - Start -->
					<p:column style="width :250px;white-space : normal"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" rendered="#{backingBean.specialDescriptionMandatory(backingBean.managedBean.activeCategoryList)}"/>
							<h:outputText value="#{lbl['lbl.sm.catCodes.othDesc']}" />
						</f:facet>
					</p:column>
					<!-- #28774 - End -->
					<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column headerText="#{lbl['lbl.sm.status']}"
						rendered="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column headerText="#{lbl['lbl.sm.catCodes.poAct']}"
						rendered="#{backingBean.managedBean.poUser or backingBean.managedBean.approverUser}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column rendered="#{backingBean.managedBean.poUser}"
						headerText="#{lbl['lbl.sm.catCodes.remark']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column rendered="#{backingBean.managedBean.approverUser}"
						headerText="#{lbl['lbl.sm.catCodes.appAct']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column rendered="#{backingBean.managedBean.approverUser}"
						headerText="#{lbl['lbl.sm.catCodes.remark']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column rendered="#{backingBean.managedBean.smAppl.resubmit}"
						headerText="#{lbl['lbl.sm.catCodes.prevDecision']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:row>
			</p:columnGroup>
			<!-- 26238 add catBean.cancelCategory and catBean.disciplinaryActionId!=null, #32008, #37605 -->
			<p:column selectionMode="multiple" style="width:2%;vertical-align: top;"
				rendered="#{!backingBean.managedBean.approverUser and !backingBean.managedBean.upsCannotEdit}"
				disabledSelection="#{backingBean.managedBean.supplierUser and 
					(catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS or 
					(not empty catBean.approvedDate and catBean.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS))
					or (catBean.cancelCategory and catBean.disciplinaryActionId!=null)}" />
			<p:column style="width : 2%;vertical-align: top;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>
			<!-- 26238 add catBean.cancelCategory and catBean.disciplinaryActionId!=null-->
			<p:column style="width :350px;white-space : normal;vertical-align: top;"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS
					or (catBean.cancelCategory and catBean.disciplinaryActionId!=null)}">
				<h:outputText
					value="#{catBean.pmCategoryL1.categoryL1Code} -  #{catBean.pmCategoryL1.categoryName}" />
				<br />
				<h:outputText
					value="#{catBean.pmCategoryL2.categoryL2Code} -  #{catBean.pmCategoryL2.categoryName}" />
				<br />
				<h:outputText
					value="#{catBean.pmCategoryL3.categoryL3Code} -  #{catBean.pmCategoryL3.categoryName}" />
				<!-- 26238, 38984, 38896 -->
				<p:outputLabel rendered="#{catBean.typeDisciplinaryAction eq 'C'}" 
					styleClass="warning" style="color:red;text-align:left; float:none">
					<h:outputText value="#{lbl['lbl.sm.cancellation.of.category.code.by.disciplinary.action']}"/> 
				</p:outputLabel> 
				<p:outputLabel rendered="#{catBean.typeDisciplinaryAction eq 'M'}" 
					styleClass="warning" style="color:red;text-align:left; float:none">
					<h:outputText value="#{lbl['lbl.sm.cancellation.manufacturer.category.code.by.disciplinary.action']}"/>
				</p:outputLabel> 
			</p:column> 
			<!-- 26238 add catBean.cancelCategory -->
			<p:column style="white-space:normal;vertical-align: top;width:500px"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS
					or catBean.cancelCategory}">
				<p:inputTextarea id="otherDesc" maxlength="5000"
					style="width : 95%;" label="#{lbl['lbl.sm.catCodes.othDesc']}"
					value="#{catBean.otherDesc}" rows="5" cols="80"
					rendered="#{catBean.pmCategoryL3.otherDescReq eq 1}"
					disabled="#{backingBean.managedBean.upsCannotEdit}" autoResize="false"><!-- #32008 --><!-- #36289,#37605 -->
					<p:ajax event="blur" process="@this" partialSubmit="true"
						listener="#{backingBean.assignCategoryReApprovalOnOtherDescChange(catBean)}"
						update=":form:tt:catCodeInfPan" />
				</p:inputTextarea><br/>
				<p:graphicImage id="prevOtherDesc"
					value="/css/images/design/icon_alert.png"
					style="padding-left : 3px;"
					rendered="#{not empty catBean.approvedDate and catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and not empty catBean.prevOtherDesc and (backingBean.managedBean.poUser or backingBean.managedBean.approverUser)}" />
				<p:tooltip for="prevOtherDesc">
					<p:inputTextarea readonly="true" disabled="true" rows="5" cols="20"
						style="width : auto;"
						value="#{lbl['lbl.sm.catCodes.prevDesc']} #{catBean.prevOtherDesc}" />
				</p:tooltip>
				<p:message for="otherDesc" showDetail="false" showSummary="true"
					display="icon" />
			</p:column>
			<!-- 26238 add catBean.cancelCategory -->
			<p:column style="white-space:normal;vertical-align: top;width: 100px"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS
					or catBean.cancelCategory}">
				<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
					rendered="#{!catBean.specialCategory}" />
				<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
					rendered="#{catBean.specialCategory}" />
			</p:column>
			<!-- 26238 add catBean.cancelCategory -->
			<p:column style="white-space:normal;vertical-align: top;width: 100px"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS
					or catBean.cancelCategory}"
				rendered="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}">
				<h:outputText value="#{lbl['lbl.sm.catCodes.pendingDec']}"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}" />
				<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
			</p:column>
			<!-- 26238 add catBean.cancelCategory -->
			<p:column style="white-space:normal;vertical-align: top;"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS
					or catBean.cancelCategory}"
				rendered="#{backingBean.managedBean.poUser or backingBean.managedBean.approverUser}">

				<p:selectOneRadio layout="pageDirection" id="catPoAppr"
					value="#{catBean.poDecFlg}"
					label="#{lbl['lbl.sm.catCodes.poAct']} #{lbl['lbl.sm.catCodes.forCatCode']} #{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and backingBean.managedBean.poUser}">
					<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
						itemValue="1" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
						itemValue="0" />
					<p:ajax event="change" process="@this" update="poCatDecisionRmrk"
						partialSubmit="true"
						listener="#{backingBean.assignCategoryApproveOrRejectDate(catBean)}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
				</p:selectOneRadio>
				<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS and backingBean.managedBean.poUser}" />

				<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
					<table
						style="width: 100%; border: none !important; table-layout: fixed !important;">
						<tr>
							<td
								style="border: none !important; white-space: normal; word-wrap: break-word !important;">
								<h:outputText
									value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.approved']}"
									rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}"
									escape="false" /> <h:outputText
									value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.approved']}"
									rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBean.poDecFlg eq 1}"
									escape="false" /> <h:outputText
									value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.rejected']}"
									rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBean.poDecFlg eq 0}"
									escape="false" />
							</td>
						</tr>
						<tr>
							<td style="border: none !important; font-weight: bold;"><h:outputText
									value="#{lbl['lbl.sm.catCodes.remark']}" />:</td>
						</tr>
						<tr>
							<td
								style="border: none !important; white-space: normal; word-wrap: break-word !important;">
								<p:scrollPanel mode="native" style="height:100px; width:auto;">
									<h:outputText value="#{catBean.poRemarks}"
										rendered="#{not empty catBean.poRemarks}" />
								</p:scrollPanel>
							</td>
						</tr>
					</table>
				</p:outputPanel>
			</p:column>
			<!-- 26238 add catBean.cancelCategory -->
			<p:column rendered="#{backingBean.managedBean.poUser}"
				style="width : 25%;vertical-align: top;"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS
					or catBean.cancelCategory}">
				<p:inputTextarea autoResize="false" value="#{catBean.poRemarks}" maxlength="2000"
					style="white-space:normal; width: 95%" rows="6" cols="30"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and backingBean.managedBean.poUser}"
					label="#{lbl['lbl.sm.catCodes.rejRemarks']} #{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
					id="poCatDecisionRmrk">
					<f:validateLength maximum="2000" />
					<p:ajax process="@this" update=":form:tt:catCodeInfPan" />
				</p:inputTextarea>
			</p:column>
			<!-- 26238 add catBean.cancelCategory -->
			<p:column rendered="#{backingBean.managedBean.approverUser}" style="white-space : normal;vertical-align: top;"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS
					or catBean.cancelCategory}">
				<p:selectOneRadio layout="pageDirection" id="catApprvrAppr"
					value="#{catBean.apprvrDecFlg}"
					label="#{lbl['lbl.sm.catCodes.appAct']} #{lbl['lbl.sm.catCodes.forCatCode']} #{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
					<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
						itemValue="1" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
						itemValue="0" />
					<p:ajax event="change" process="@this"
						update="apprvrCatDecisionRmrk" partialSubmit="true"
						listener="#{backingBean.assignCategoryApproveOrRejectDate(catBean)}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
				</p:selectOneRadio>
				<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
			</p:column>
			<!-- 26238 add catBean.cancelCategory -->
			<p:column rendered="#{backingBean.managedBean.approverUser}" style="white-space:normal;vertical-align: top;"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS
					or catBean.cancelCategory}">
				<p:inputTextarea autoResize="false" value="#{catBean.approverRemarks}" maxlength="2000"
					style="white-space:normal;" rows="5" cols="20"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}"
					label="#{lbl['lbl.sm.catCodes.rejRemarks']} #{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
					id="apprvrCatDecisionRmrk">
					<p:ajax process="@this" update=":form:tt:catCodeInfPan" />
					<f:validateLength maximum="2000" />
				</p:inputTextarea>
			</p:column>
			<!-- 26238 add catBean.cancelCategory -->
			<p:column rendered="#{backingBean.managedBean.smAppl.resubmit}" style="white-space : normal;vertical-align: top;"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS
					or catBean.cancelCategory}">
				<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
					<p:outputPanel
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<p:outputPanel rendered="#{not empty catBean.prevApprDecFlg}">
							<table
								style="width: 100%; border: none !important; table-layout: fixed !important;">
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;">
										<h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.approved']}"
											rendered="#{catBean.prevApprDecFlg eq 1}" escape="false" />
										<h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.rejected']}"
											rendered="#{catBean.prevApprDecFlg eq 0}" escape="false" />
									</td>
								</tr>
								<tr>
									<td style="border: none !important; font-weight: bold;"><h:outputText
											value="#{lbl['lbl.sm.catCodes.prevRmrk']}" /></td>
								</tr>
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;"><h:outputText
											value="#{catBean.prevApproverRemarks}"
											rendered="#{not empty catBean.prevApproverRemarks}" /></td>
								</tr>
							</table>
						</p:outputPanel>
						<p:outputPanel rendered="#{empty catBean.prevApprDecFlg}">
							<h:outputText value="#{lbl['lbl.sm.no.available']}" />
						</p:outputPanel>
					</p:outputPanel>
					<p:outputPanel
						rendered="#{catBean.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS}">
						<h:outputText value="#{lbl['lbl.sm.no.available']}" />
					</p:outputPanel>
				</p:outputPanel>
				<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
					<p:outputPanel
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<p:outputPanel rendered="#{not empty catBean.prevPoDecFlg}">
							<table
								style="width: 100%; border: none !important; table-layout: fixed !important;">
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;">
										<h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.approved']}"
											rendered="#{catBean.prevPoDecFlg eq 1}" escape="false" /> <h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.rejected']}"
											rendered="#{catBean.prevPoDecFlg eq 0}" escape="false" />
									</td>
								</tr>
								<tr>
									<td style="border: none !important; font-weight: bold;"><h:outputText
											value="#{lbl['lbl.sm.catCodes.prevRmrk']}" /></td>
								</tr>
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;"><h:outputText
											value="#{catBean.prevPoRemarks}"
											rendered="#{not empty catBean.prevPoRemarks}" /></td>
								</tr>
							</table>
						</p:outputPanel>
						<p:outputPanel rendered="#{empty catBean.prevPoDecFlg}">
							<h:outputText value="#{lbl['lbl.sm.no.available']}" />
						</p:outputPanel>
					</p:outputPanel>
					<p:outputPanel
						rendered="#{catBean.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS}">
						<h:outputText value="#{lbl['lbl.sm.no.available']}" />
					</p:outputPanel>
				</p:outputPanel>
				<p:outputPanel
					rendered="#{!backingBean.managedBean.approverUser  and !backingBean.managedBean.poUser}">
					<p:outputPanel
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<p:outputPanel rendered="#{not empty catBean.prevApprDecFlg}">
							<table
								style="width: 100%; border: none !important; table-layout: fixed !important;">
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;">
										<h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.approved']}"
											rendered="#{catBean.prevApprDecFlg eq 1}" escape="false" />
										<h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.rejected']}"
											rendered="#{catBean.prevApprDecFlg eq 0}" escape="false" />
									</td>
								</tr>
								<tr>
									<td style="border: none !important; font-weight: bold;"><h:outputText
											value="#{lbl['lbl.sm.catCodes.prevRmrk']}" /></td>
								</tr>
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;"><h:outputText
											value="#{catBean.prevApproverRemarks}"
											rendered="#{not empty catBean.prevApproverRemarks}" /></td>
								</tr>
							</table>
						</p:outputPanel>
						<p:outputPanel rendered="#{empty catBean.prevApprDecFlg}">
							<table
								style="width: 100%; border: none !important; table-layout: fixed !important;">
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;">
										<h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.approved']}"
											rendered="#{catBean.prevPoDecFlg eq 1}" escape="false" /> <h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.rejected']}"
											rendered="#{catBean.prevPoDecFlg eq 0}" escape="false" />
									</td>
								</tr>
								<tr>
									<td style="border: none !important; font-weight: bold;"><h:outputText
											value="#{lbl['lbl.sm.catCodes.prevRmrk']}" /></td>
								</tr>
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;"><h:outputText
											value="#{catBean.prevPoRemarks}"
											rendered="#{not empty catBean.prevPoRemarks}" /></td>
								</tr>
							</table>
						</p:outputPanel>

					</p:outputPanel>
					<p:outputPanel
						rendered="#{catBean.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS}">
						<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}" />
					</p:outputPanel>
				</p:outputPanel>
			</p:column>
		</p:dataTable>
		<c:if
			test="#{!backingBean.managedBean.approverUser}">
			<div align="right">
				#{lbl['lbl.sm.payment.click']}
				<h:panelGroup rendered="#{backingBean.managedBean.smAppl.supplierType ne 'J'}">
					<a href="#{DocumentRepositoryUtils.baseRepo}shared/SM/Kod_Bidang_Baharu_Bekalan_Perkhidmatan.pdf">#{lbl['lbl.sm.payment.here']}</a>
				</h:panelGroup>

				<h:panelGroup rendered="#{backingBean.managedBean.smAppl.supplierType eq 'J'}">
					<a href="#{DocumentRepositoryUtils.baseRepo}shared/SM/Kod_Bidang_Baharu_Perkhidmatan_Perunding.pdf">#{lbl['lbl.sm.payment.here']}</a>
				</h:panelGroup>

				#{lbl['lbl.sm.download.categorycode']}
				<!-- Disable for UPS 32008 - START -->
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					rendered="#{!backingBean.managedBean.upsCannotEdit}"
					action="#{backingBean.validateCategoryOtherDescription}"
					partialSubmit="true" process="@this"
					>
				</p:commandButton>

				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					rendered="#{!backingBean.managedBean.upsCannotEdit}"
					oncomplete="addtnlCatCodeDeletePopUp.show()"
					update="@form" partialSubmit="true"
					process=":form:tt:catCodeInfPan">
				</p:commandButton>
				<!-- Disable for UPS 32008 - END -->
			</div>
		</c:if>
	</p:outputPanel>
	
	<!-- 29723 Start -->	
	<p:outputPanel
		rendered="#{backingBean.managedBean.smAppl.applType ne 'R' and 
		(backingBean.managedBean.currentStatus eq 'Pending Review Site Visit Report - After Approval' 
		or backingBean.managedBean.currentStatus eq 'Menunggu Laporan Lawatan Tapak - Selepas Diluluskan')}">

		<!-- 29723 Start -->	
		<p:dataTable var="aprvdCatNBean"
			widgetVar="smApprvdCatCodesNewApplDtWidVar"
			value="#{backingBean.managedBean.activeCategoryList}"
			rowKey="#{aprvdCatNBean}" rowIndexVar="index" id="catApprNDt"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<ac:paginator for="catApprNDt" />
			<!-- 29723 End -->	
			
			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 2%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.catCodes.cate']}" style="width :350px;white-space : normal">
				<h:outputText
					value="#{aprvdCatNBean.pmCategoryL1.categoryL1Code} -  #{empty aprvdCatNBean.categoryL1Name ? aprvdCatNBean.pmCategoryL1.categoryName : aprvdCatNBean.categoryL1Name}" />
				<br />
				<h:outputText
					value="#{aprvdCatNBean.pmCategoryL2.categoryL2Code} -  #{empty aprvdCatNBean.categoryL2Name ? aprvdCatNBean.pmCategoryL2.categoryName : aprvdCatNBean.categoryL2Name}" />
				<br />
				<h:outputText
					value="#{aprvdCatNBean.pmCategoryL3.categoryL3Code} -  #{empty aprvdCatNBean.categoryL3Name ? aprvdCatNBean.pmCategoryL3.categoryName : aprvdCatNBean.categoryL3Name}" />
				<!-- 26238 add catBean.cancelCategory -->
				<p:outputLabel rendered="#{aprvdCatNBean.cancelCategory}" styleClass="warning" style="color:red !important; text-align:left;">
					<h:outputText value="#{lbl['lbl.sm.cancellation.of.category.code.by.disciplinary.action']}"/>
				</p:outputLabel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}" style="white-space : normal">
				<h:outputText value="#{lbl['lbl.sm.no.available']}"
					rendered="#{empty aprvdCatNBean.otherDesc}" />
				<h:outputText value="#{aprvdCatNBean.otherDesc}"
					rendered="#{not empty aprvdCatNBean.otherDesc}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}" style="width : 15%;white-space : normal">
				<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
					rendered="#{!aprvdCatNBean.specialCategory}" />
				<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
					rendered="#{aprvdCatNBean.specialCategory}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.status']}" style="width : 10%;white-space : normal">
				<h:outputText value="#{lbl['lbl.sm.catCodes.pendingDec']}"
					rendered="#{aprvdCatNBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}" />
				<h:outputText value="#{lbl['lbl.sm.catCodes.registered']}"
					rendered="#{aprvdCatNBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				<h:outputText value="#{lbl['lbl.sm.catCodes.cancel']}"
					rendered="#{aprvdCatNBean.recordStatusFlg eq SupplierManagementConst.CANCEL_RECORD_STATUS}" />
			</p:column>
		</p:dataTable>
		<br />
	</p:outputPanel>
	<!-- 29723 End -->	

	<p:spacer height="2px;" />
	
	<ac:confirmationPopup id="addtnlCatCodeDeletePopUpId"
		widget="addtnlCatCodeDeletePopUp"
		okAction="backingBean.deleteSelectedPendingApprovalCategoryCodes"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update="@form"/>
