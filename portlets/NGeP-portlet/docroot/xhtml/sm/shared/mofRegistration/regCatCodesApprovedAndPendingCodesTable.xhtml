<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:outputPanel
		rendered="#{backingBean.managedBean.smAppl.applType ne 'R'}">
		<p:dataTable var="catBean" widgetVar="smCatCodesNonRenewApplDtWidVar"
			value="#{backingBean.managedBean.activeCategoryList}"
			rowKey="#{catBean}" rowIndexVar="index" id="catDt"
			selection="#{backingBean.managedBean.deleteNewApplCategoryList}"
			rendered="#{backingBean.managedBean.smAppl.applType ne 'R'}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<ac:paginator for="catDt" />
			<p:ajax event="rowSelect" partialSubmit="true" process="@this"
				listener="#{backingBean.unSelectApporvedCategories}"
				update=":form:tt:catCodeInfPan"></p:ajax>
			<p:ajax event="rowUnselect"
				listener="#{backingBean.unSelectApporvedCategories}"
				update=":form:tt:catCodeInfPan"></p:ajax>
			<p:ajax event="rowSelectCheckbox"
				listener="#{backingBean.unSelectApporvedCategories}"
				update=":form:tt:catCodeInfPan"></p:ajax>
			<p:ajax event="rowUnselectCheckbox"
				listener="#{backingBean.unSelectApporvedCategories}"
				update=":form:tt:catCodeInfPan"></p:ajax>
			<p:ajax event="rowDblselect"
				listener="#{backingBean.unSelectApporvedCategories}"
				update=":form:tt:catCodeInfPan"></p:ajax>
			<p:columnGroup type="header">
				<p:row>
					<p:column style="width:2%"
						rendered="#{!backingBean.managedBean.approverUser}"
						disabledSelection="#{backingBean.managedBean.supplierUser and 
							(catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS or not empty catBean.approvedDate)}" />
					<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
						style="width : 2%;"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column style="width :350px;white-space : normal"
						headerText="#{lbl['lbl.sm.catCodes.cate']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column headerText="#{lbl['lbl.sm.status']}"
						rendered="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column headerText="#{lbl['lbl.sm.catCodes.poAct']}"
						rendered="#{backingBean.managedBean.poUser or backingBean.managedBean.approverUser}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column rendered="#{backingBean.managedBean.poUser}"
						headerText="#{lbl['lbl.sm.catCodes.remark']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column rendered="#{backingBean.managedBean.approverUser}"
						headerText="#{lbl['lbl.sm.catCodes.appAct']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column rendered="#{backingBean.managedBean.approverUser}"
						headerText="#{lbl['lbl.sm.catCodes.remark']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<p:column rendered="#{backingBean.managedBean.smAppl.resubmit}"
						headerText="#{lbl['lbl.sm.catCodes.prevDecision']}"
						disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="multiple" style="width:2%"
				rendered="#{!backingBean.managedBean.approverUser}"
				disabledSelection="#{backingBean.managedBean.supplierUser and 
					(catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS or not empty catBean.approvedDate)}" />
			<p:column style="width : 2%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>
			<p:column style="width :350px;white-space : normal"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
				<h:outputText
					value="#{catBean.pmCategoryL1.categoryL1Code} -  #{catBean.pmCategoryL1.categoryName}" />
				<br />
				<h:outputText
					value="#{catBean.pmCategoryL2.categoryL2Code} -  #{catBean.pmCategoryL2.categoryName}" />
				<br />
				<h:outputText
					value="#{catBean.pmCategoryL3.categoryL3Code} -  #{catBean.pmCategoryL3.categoryName}" />
			</p:column>
			<p:column
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
				<p:inputTextarea id="otherDesc" maxlength="100"
					style="width : 95%;" label="#{lbl['lbl.sm.catCodes.othDesc']}"
					value="#{catBean.otherDesc}" rows="5" cols="20"
					rendered="#{catBean.pmCategoryL3.otherDescReq eq 1}">
					<p:ajax event="blur" process="@this" partialSubmit="true"
						listener="#{backingBean.assignCategoryReApprovalOnOtherDescChange(catBean)}"
						update=":form:tt:catCodeInfPan" />
				</p:inputTextarea><br/>
				<p:graphicImage id="prevOtherDesc"
					value="/css/images/design/icon_alert.png"
					style="padding-left : 3px;"
					rendered="#{not empty catBean.approvedDate and catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and not empty catBean.prevOtherDesc and (backingBean.managedBean.poUser or backingBean.managedBean.approverUser)}" />
				<p:tooltip for="prevOtherDesc">
					<p:inputTextarea readonly="true" disabled="true" rows="5" cols="20"
						style="width : auto;"
						value="#{lbl['lbl.sm.catCodes.prevDesc']} #{catBean.prevOtherDesc}" />
				</p:tooltip>
				<p:message for="otherDesc" showDetail="false" showSummary="true"
					display="icon" />
			</p:column>
			<p:column
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
				<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
					rendered="#{!catBean.specialCategory}" />
				<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
					rendered="#{catBean.specialCategory}" />
			</p:column>
			<p:column
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}"
				rendered="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}">
				<h:outputText value="#{lbl['lbl.sm.catCodes.pendingDec']}"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}" />
				<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
			</p:column>
			<p:column
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}"
				rendered="#{backingBean.managedBean.poUser or backingBean.managedBean.approverUser}">

				<p:selectOneRadio layout="pageDirection" id="catPoAppr"
					value="#{catBean.poDecFlg}"
					label="#{lbl['lbl.sm.catCodes.poAct']} #{lbl['lbl.sm.catCodes.forCatCode']} #{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and backingBean.managedBean.poUser}">
					<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
						itemValue="1" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
						itemValue="0" />
					<p:ajax event="change" process="@this" update="poCatDecisionRmrk"
						partialSubmit="true"
						listener="#{backingBean.assignCategoryApproveOrRejectDate(catBean)}" />
				</p:selectOneRadio>
				<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS and backingBean.managedBean.poUser}" />

				<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
					<table
						style="width: 100%; border: none !important; table-layout: fixed !important;">
						<tr>
							<td
								style="border: none !important; white-space: normal; word-wrap: break-word !important;">
								<h:outputText
									value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.approved']}"
									rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}"
									escape="false" /> <h:outputText
									value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.approved']}"
									rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBean.poDecFlg eq 1}"
									escape="false" /> <h:outputText
									value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.rejected']}"
									rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBean.poDecFlg eq 0}"
									escape="false" />
							</td>
						</tr>
						<tr>
							<td style="border: none !important; font-weight: bold;"><h:outputText
									value="#{lbl['lbl.sm.catCodes.remark']}" />:</td>
						</tr>
						<tr>
							<td
								style="border: none !important; white-space: normal; word-wrap: break-word !important;"><h:outputText
									value="#{catBean.poRemarks}"
									rendered="#{not empty catBean.poRemarks}" /></td>
						</tr>
					</table>
				</p:outputPanel>
			</p:column>
			<p:column rendered="#{backingBean.managedBean.poUser}"
				style="width : 25%;"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
				<p:inputTextarea value="#{catBean.poRemarks}" maxlength="200"
					style="width : auto;" rows="5" cols="20"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and backingBean.managedBean.poUser}"
					label="#{lbl['lbl.sm.catCodes.rejRemarks']} #{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
					id="poCatDecisionRmrk">
					<f:validateLength maximum="200" />
					<p:ajax process="@this" update=":form:tt:catCodeInfPan" />
				</p:inputTextarea>
			</p:column>
			<p:column rendered="#{backingBean.managedBean.approverUser}"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
				<p:selectOneRadio layout="pageDirection" id="catApprvrAppr"
					value="#{catBean.apprvrDecFlg}"
					label="#{lbl['lbl.sm.catCodes.appAct']} #{lbl['lbl.sm.catCodes.forCatCode']} #{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
					<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
						itemValue="1" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
						itemValue="0" />
					<p:ajax event="change" process="@this"
						update="apprvrCatDecisionRmrk" partialSubmit="true"
						listener="#{backingBean.assignCategoryApproveOrRejectDate(catBean)}" />
				</p:selectOneRadio>
				<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
			</p:column>
			<p:column rendered="#{backingBean.managedBean.approverUser}"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
				<p:inputTextarea value="#{catBean.approverRemarks}" maxlength="200"
					style="width : auto;" rows="5" cols="20"
					rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}"
					label="#{lbl['lbl.sm.catCodes.rejRemarks']} #{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
					id="apprvrCatDecisionRmrk">
					<p:ajax process="@this" update=":form:tt:catCodeInfPan" />
					<f:validateLength maximum="200" />
				</p:inputTextarea>
			</p:column>
			<p:column rendered="#{backingBean.managedBean.smAppl.resubmit}"
				disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
				<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
					<p:outputPanel
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<p:outputPanel rendered="#{not empty catBean.prevApprDecFlg}">
							<table
								style="width: 100%; border: none !important; table-layout: fixed !important;">
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;">
										<h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.approved']}"
											rendered="#{catBean.prevApprDecFlg eq 1}" escape="false" />
										<h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.rejected']}"
											rendered="#{catBean.prevApprDecFlg eq 0}" escape="false" />
									</td>
								</tr>
								<tr>
									<td style="border: none !important; font-weight: bold;"><h:outputText
											value="#{lbl['lbl.sm.catCodes.prevRmrk']}" /></td>
								</tr>
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;"><h:outputText
											value="#{catBean.prevApproverRemarks}"
											rendered="#{not empty catBean.prevApproverRemarks}" /></td>
								</tr>
							</table>
						</p:outputPanel>
						<p:outputPanel rendered="#{empty catBean.prevApprDecFlg}">
							<h:outputText value="#{lbl['lbl.sm.no.available']}" />
						</p:outputPanel>
					</p:outputPanel>
					<p:outputPanel
						rendered="#{catBean.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS}">
						<h:outputText value="#{lbl['lbl.sm.no.available']}" />
					</p:outputPanel>
				</p:outputPanel>
				<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
					<p:outputPanel
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<p:outputPanel rendered="#{not empty catBean.prevPoDecFlg}">
							<table
								style="width: 100%; border: none !important; table-layout: fixed !important;">
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;">
										<h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.approved']}"
											rendered="#{catBean.prevPoDecFlg eq 1}" escape="false" /> <h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.rejected']}"
											rendered="#{catBean.prevPoDecFlg eq 0}" escape="false" />
									</td>
								</tr>
								<tr>
									<td style="border: none !important; font-weight: bold;"><h:outputText
											value="#{lbl['lbl.sm.catCodes.prevRmrk']}" /></td>
								</tr>
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;"><h:outputText
											value="#{catBean.prevPoRemarks}"
											rendered="#{not empty catBean.prevPoRemarks}" /></td>
								</tr>
							</table>
						</p:outputPanel>
						<p:outputPanel rendered="#{empty catBean.prevPoDecFlg}">
							<h:outputText value="#{lbl['lbl.sm.no.available']}" />
						</p:outputPanel>
					</p:outputPanel>
					<p:outputPanel
						rendered="#{catBean.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS}">
						<h:outputText value="#{lbl['lbl.sm.no.available']}" />
					</p:outputPanel>
				</p:outputPanel>
				<p:outputPanel
					rendered="#{!backingBean.managedBean.approverUser  and !backingBean.managedBean.poUser}">
					<p:outputPanel
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<p:outputPanel rendered="#{not empty catBean.prevApprDecFlg}">
							<table
								style="width: 100%; border: none !important; table-layout: fixed !important;">
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;">
										<h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.approved']}"
											rendered="#{catBean.prevApprDecFlg eq 1}" escape="false" />
										<h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.rejected']}"
											rendered="#{catBean.prevApprDecFlg eq 0}" escape="false" />
									</td>
								</tr>
								<tr>
									<td style="border: none !important; font-weight: bold;"><h:outputText
											value="#{lbl['lbl.sm.catCodes.prevRmrk']}" /></td>
								</tr>
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;"><h:outputText
											value="#{catBean.prevApproverRemarks}"
											rendered="#{not empty catBean.prevApproverRemarks}" /></td>
								</tr>
							</table>
						</p:outputPanel>
						<p:outputPanel rendered="#{empty catBean.prevApprDecFlg}">
							<table
								style="width: 100%; border: none !important; table-layout: fixed !important;">
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;">
										<h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.approved']}"
											rendered="#{catBean.prevPoDecFlg eq 1}" escape="false" /> <h:outputText
											value="#{lbl['lbl.sm.catCodes.status.bold']}  #{lbl['lbl.sm.catCodes.rejected']}"
											rendered="#{catBean.prevPoDecFlg eq 0}" escape="false" />
									</td>
								</tr>
								<tr>
									<td style="border: none !important; font-weight: bold;"><h:outputText
											value="#{lbl['lbl.sm.catCodes.prevRmrk']}" /></td>
								</tr>
								<tr>
									<td
										style="border: none !important; white-space: normal; word-wrap: break-word !important;"><h:outputText
											value="#{catBean.prevPoRemarks}"
											rendered="#{not empty catBean.prevPoRemarks}" /></td>
								</tr>
							</table>
						</p:outputPanel>

					</p:outputPanel>
					<p:outputPanel
						rendered="#{catBean.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS}">
						<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}" />
					</p:outputPanel>
				</p:outputPanel>
			</p:column>
		</p:dataTable>
		<c:if
			test="#{!backingBean.managedBean.approverUser}">
			<div align="right">
				#{lbl['lbl.sm.payment.click']}
				<p:commandLink value="#{lbl['lbl.sm.payment.here']}" ajax="false"
					action="#{registrationBackingBean.downloadFile('/shared/SM/Kod_Bidang_Baharu_Bekalan_Perkhidmatan.pdf')}"
					rendered="#{backingBean.managedBean.smAppl.supplierType ne 'J'}"></p:commandLink>
				<p:commandLink value="#{lbl['lbl.sm.payment.here']}" ajax="false"
					action="#{registrationBackingBean.downloadFile('/shared/SM/Kod_Bidang_Baharu_Perkhidmatan_Perunding.pdf')}"
					rendered="#{backingBean.managedBean.smAppl.supplierType eq 'J'}"></p:commandLink>
				#{lbl['lbl.sm.download.categorycode']}
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					partialSubmit="true" process="@this"
					oncomplete="catCodePopup.show();">
				</p:commandButton>

				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					oncomplete="addtnlCatCodeDeletePopUp.show()"
					update="@form" partialSubmit="true"
					process=":form:tt:catCodeInfPan">
				</p:commandButton>

			</div>
		</c:if>
	</p:outputPanel>

	<p:spacer height="2px;" />
	
	<ac:confirmationPopup id="addtnlCatCodeDeletePopUpId"
		widget="addtnlCatCodeDeletePopUp"
		okAction="backingBean.deleteSelectedPendingApprovalCategoryCodes"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update="@form"/>
</ui:composition>
