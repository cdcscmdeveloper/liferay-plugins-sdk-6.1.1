<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Company Experience Project" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.experienceVerified}"
							id="poConsVer">
							<p:ajax update=":form:tt:consInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.experienceVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.experienceVerified}"
							id="apprConsVer">
							<p:ajax update=":form:tt:consInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.experienceVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="consInfPan">
			<p:blockUI block=":form:tt:consInfPan" widgetVar="buiPoCons"
				id="poConsBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.experienceVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.experienceVerified : false)}" />
			<p:dataTable var="consBean"
				value="#{backingBean.managedBean.smAppl.smCompanyExperiences}"
				selection="#{backingBean.managedBean.selectedCompanyExperiences}"
				rowKey="#{consBean}" rowIndexVar="index" id="consDt">
				<ac:paginator for="consDt" />
				<p:column selectionMode="multiple" width="5%" />

				<p:column headerText="Project Title">
					<h:outputText value="#{consBean.title}" />
				</p:column>

				<p:column headerText="Project Value">
					<h:outputText value="#{consBean.contractValue}" />
				</p:column>

				<p:column headerText="Procurement Date">
					<h:outputText value="#{consBean.procurementDate}">
						<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
					</h:outputText>
				</p:column>

				<p:column headerText=" Work Progress">
					<h:outputText value="#{consBean.progressStatus} %" />
				</p:column>
				<p:column headerText="Action">
					<p:commandLink
						action="#{backingBean.assignSelCompanyExperience(consBean)}"
						oncomplete="consDialog.show();" update=":form:tt:consDialog">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="Add"
					action="#{backingBean.assignNewCompanyEcperience}"
					oncomplete="consDialog.show();" update=":form:tt:consDialog" />
				<p:commandButton value="Delete" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41" /></td>
						<td style="padding-left: 22px;"><p:outputLabel
								value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog header="Project Information"
		widgetVar="consDialog" id="consDialog" resizable="false"
		showEffect="fade" hideEffect="fade" modal="true" width="500px">
		<table style="width: 100%">
			<tr>
				<td valign="top">

					<table style="width: 100%">
						<tr>
							<td><p:outputLabel value="* Project Name" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedCompanyExperience.title}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Project Done For" /></td>
							<td><p:selectOneRadio>
									<f:selectItem itemLabel="Fedral Govt" itemValue="F" />
									<f:selectItem itemLabel="Non-Fedral Govt" itemValue="N" />
								</p:selectOneRadio></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Project Ref NO." /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedCompanyExperience.refNo}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Project Location" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedCompanyExperience.projectLocation}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Client's Name" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedCompanyExperience.clientName}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Project Cost (RM.)" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedCompanyExperience.contractValue}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Service Provided" /></td>
							<td><p:inputTextarea
									value="#{backingBean.managedBean.selectedCompanyExperience.workServiceDesc}"
									cols="36" style="margin-bottom:5px;" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Work Progress(%)" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedCompanyExperience.progressStatus}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Consultant Fee (RM.)" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedCompanyExperience.consultantFee}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Appointment Date" /></td>
							<td><p:calendar showOn="button"
									value="#{backingBean.managedBean.selectedCompanyExperience.procurementDate}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="
										* Main Category" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.selectedParentCat}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select -- " itemValue="" />
									<f:selectItems
										value="#{backingBean.managedBean.defaultParentCatList}"
										var="parent" itemLabel="#{parent.categoryName}"
										itemValue="#{parent.categoryL1Code}" />
									<p:ajax event="change"
										listener="#{backingBean.changeParentCategory}"
										update="conslChild,conslSubChild" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Sub Category" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.selectedChildCat}"
									id="conslChild" style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel=" -- Select  -- " itemValue="" />
									<f:selectItems
										value="#{backingBean.managedBean.selectedCategory.pmCategoryL1.pmCategoryL2s}"
										var="child" itemLabel="#{child.categoryName}"
										itemValue="#{child.categoryL2Code}" />
									<p:ajax event="change"
										listener="#{backingBean.changeChildCategory}"
										update="conslSubChild" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Sub Category Division" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.selectedSubChildCat}"
									id="conslSubChild" style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel=" -- Select One --  " itemValue="" />
									<f:selectItems
										value="#{backingBean.managedBean.selectedCategory.pmCategoryL2.pmCategoryL3s}"
										var="subChild" itemLabel="#{subChild.categoryName}"
										itemValue="#{subChild.categoryL3Code}" />
									<p:ajax event="change"
										listener="#{backingBean.changeSubChildCategory}" />
								</p:selectOneMenu></td>
						</tr>
					</table>

				</td>

			</tr>
		</table>
		<br />

		<div align="right">
			<p:commandButton value="Save"
				actionListener="#{backingBean.addOrUpdateCompanyExperienceToSmAppl}"
				ajax="true" onclick="consDialog.hide();" update=":form:tt:consDt" />
			<p:commandButton value="Cancel" onclick="consDialog.hide();" />
		</div>

	</p:dialog>
</ui:composition>
