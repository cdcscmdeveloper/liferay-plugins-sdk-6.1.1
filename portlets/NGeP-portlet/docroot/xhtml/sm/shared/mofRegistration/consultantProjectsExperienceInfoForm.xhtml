<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Company Experience Project" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:dataTable var="consBean"
			value="#{backingBean.managedBean.smAppl.smProjectExperiences}"
			selection="#{backingBean.managedBean.selectedConstProjs}"
			rowKey="#{consBean.projectExperienceId}" rowIndexVar="index"
			id="consDt">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<h:outputText value="#{index+1}" />
			</p:column>

			<p:column headerText="Project Title">
				<h:outputText value="#{consBean.projectName}" />
			</p:column>

			<p:column headerText="Project Value">
				<h:outputText value="#{consBean.projectCost}" />
			</p:column>

			<p:column headerText="Procurement Date">
				<h:outputText value="#{consBean.appointmentDate}">
					<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
				</h:outputText>
			</p:column>

			<p:column headerText=" Work Progress">
				<h:outputText value="#{consBean.workStatus} %" />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink
					action="#{backingBean.assignSelConsultantProj(consBean)}"
					oncomplete="consDialog.show();" update=":form:tt:consDialog">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add"
				action="#{backingBean.assignNewConsultantProj}"
				oncomplete="consDialog.show();" update=":form:tt:consDialog" />
			<p:commandButton value="Delete" />

		</div>
		<br />
		<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
			<table style="width: 50%">
				<tr>
					<td style="padding-left: 38px;"><p:outputLabel
							value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" cols="41" /></td>
				</tr>
			</table>
		</p:outputPanel>
		<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
			<table style="width: 100%">
				<tr>
					<td style="padding-left: 38px;"><p:outputLabel
							value="PO Remarks" /></td>
					<td><p:inputTextarea autoResize="true" readonly="true"
							disabled="true" cols="41" /></td>
					<td style="padding-left: 22px;"><p:outputLabel
							value="Approver Remarks" /></td>
					<td><p:inputTextarea autoResize="true" cols="41" /></td>

				</tr>
			</table>
		</p:outputPanel>
	</p:panel>
	<p:dialog header="Project Details - For Consultant"
		widgetVar="consDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="consDialog" width="500px">
		<table style="width: 100%">
			<tr>
				<td valign="top">

					<table style="width: 100%">
						<tr>
							<td><p:outputLabel value="* Project Name" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedConstProj.projectName}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Project Ref NO." /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedConstProj.projectRefNo}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Project Location" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedConstProj.projectLocation}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Client's Name" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedConstProj.clientName}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Project Cost" /></td>
							<td><table>
									<tr>
										<td style="padding-right: 5px;"><p:inputText
												value="#{backingBean.managedBean.selectedConstProj.projectCost}"
												size="20" /></td>
										<td valign="top"><p:selectOneMenu
												style="margin-bottom : 5px;">
												<f:selectItem itemLabel="MYR" itemValue="1"></f:selectItem>
											</p:selectOneMenu></td>
									</tr>
								</table></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Service Provided" /></td>
							<td><p:inputTextarea
									value="#{backingBean.managedBean.selectedConstProj.serviceDesc}"
									cols="36" style="margin-bottom:5px;" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Work Progress(%)" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedConstProj.workStatus}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Consultant Fee" /></td>
							<td><table>
									<tr>
										<td style="padding-right: 5px;"><p:inputText
												value="#{backingBean.managedBean.selectedConstProj.consultantFee}"
												size="20" /></td>
										<td valign="top"><p:selectOneMenu
												style="margin-bottom : 5px;">
												<f:selectItem itemLabel="MYR" itemValue="1"></f:selectItem>
											</p:selectOneMenu></td>
									</tr>
								</table></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* Appointment Date" /></td>
							<td><p:calendar showOn="button"
									value="#{backingBean.managedBean.selectedConstProj.appointmentDate}" /></td>
						</tr>
					</table>

				</td>

			</tr>
		</table>
		<br />

		<div align="right">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdateConsultantProjsToSmAppl}"
				oncomplete="consDialog.hide();" update=":form:tt:consDt" />
			<p:commandButton value="Cancel" onclick="consDialog.hide();" />
		</div>

	</p:dialog>
</ui:composition>
