<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.projDtls.panHdr']}" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.experienceVerified}"
							id="poConsVer">
							<p:ajax update=":form:tt:consInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.experienceVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.experienceVerified}"
							id="apprConsVer">
							<p:ajax update=":form:tt:consInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.experienceVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="consInfPan">
			<p:blockUI block=":form:tt:consInfPan" widgetVar="buiPoCons"
				id="poConsBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.experienceVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.experienceVerified : false)}" />
			<p:dataTable var="consBean"
				value="#{backingBean.managedBean.smAppl.smCompanyExperiences}"
				selection="#{backingBean.managedBean.selectedCompanyExperiences}"
				rowKey="#{consBean}" rowIndexVar="index" id="consDt">
				<ac:paginator for="consDt" />
				<p:column selectionMode="multiple" width="5%" />

				<p:column headerText="#{lbl['lbl.sm.projDtls.projTitle']}">
					<h:outputText value="#{consBean.title}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.projVal']}">
					<h:outputText value="#{consBean.contractValue}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.procDate']}">
					<h:outputText value="#{consBean.procurementDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.workProgress']}">
					<h:outputText value="#{lbl['lbl.sm.projDtls.inProgress']}"
						rendered="#{consBean.progressStatus eq 'P'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.success']}"
						rendered="#{consBean.progressStatus eq 'S'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.fail']}"
						rendered="#{consBean.progressStatus eq 'F'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink
						action="#{backingBean.assignSelCompanyExperience(consBean)}"
						update=":form:tt:consDialog">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					action="#{backingBean.assignNewCompanyExperience}"
					update=":form:tt:consDialog" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']} "
					action="#{backingBean.deleteSelectedCompanyExperiences}"
					update=":form:tt:consDt" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.experienceRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.experienceRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.experienceRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog header="#{lbl['lbl.sm.projDtls.projDiaHdr']}"
		widgetVar="consDialog" id="consDialog" resizable="false"
		showEffect="fade" hideEffect="fade" modal="true" width="500px">
		<p:messages id="consultPrjMsg" showSummary="true" showDetail="false"
			autoUpdate="true" closable="true" />
		<table style="width: 100%">
			<tr>
				<td valign="top">

					<table style="width: 100%">
						<tr>
							<td><p:outputLabel
									value="* #{lbl['lbl.sm.projDtls.projTitle']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedCompanyExperience.title}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="* #{lbl['lbl.sm.projDtls.doneFor']}" /></td>
							<td><p:selectOneRadio>
									<f:selectItem itemLabel="Fedral Govt" itemValue="F" />
									<f:selectItem itemLabel="Non-Fedral Govt" itemValue="N" />
								</p:selectOneRadio></td>
						</tr>
						<tr>
							<td><p:outputLabel value="* #{lbl['lbl.sm.projDtls.refNo']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedCompanyExperience.refNo}"
									size="35" maxlength="20" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="* #{lbl['lbl.sm.projDtls.projLoc']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedCompanyExperience.projectLocation}"
									size="35" maxlength="30" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="* #{lbl['lbl.sm.projDtls.clientName']}" /></td>
							<td><p:inputText
									value="#{backingBean.managedBean.selectedCompanyExperience.clientName}"
									size="35" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="* #{lbl['lbl.sm.projDtls.projCost']}" /></td>
							<td><p:inputText label="#{lbl['lbl.sm.projDtls.projCost']}"
									id="consultantProjCost"
									value="#{backingBean.managedBean.selectedCompanyExperience.contractValue}"
									size="35">

								</p:inputText> <p:message id="consultantProjCostMsg" for="consultantProjCost"
									showSummary="true" showDetail="false" display="icon" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="* #{lbl['lbl.sm.projDtls.serviceProvide']} " /></td>
							<td><p:inputTextarea
									value="#{backingBean.managedBean.selectedCompanyExperience.workServiceDesc}"
									cols="36" style="margin-bottom:5px;" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="* #{lbl['lbl.sm.projDtls.workProgress']}" /></td>
							<td><p:selectOneRadio
									value="#{backingBean.managedBean.selectedCompanyExperience.progressStatus}">
									<f:selectItem itemLabel="In Progress" itemValue="P" />
									<f:selectItem itemLabel="Success" itemValue="S" />
									<f:selectItem itemLabel="Fail" itemValue="F" />
								</p:selectOneRadio></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="* #{lbl['lbl.sm.projDtls.consultFee']}" /></td>
							<td><p:inputText id="consultantProjConsultFee"
									label=" #{lbl['lbl.sm.projDtls.consultFee']}"
									value="#{backingBean.managedBean.selectedCompanyExperience.consultantFee}"
									size="35">

								</p:inputText> <p:message id="consultantProjConsultFeeMsg"
									for="consultantProjConsultFee" showSummary="true"
									showDetail="false" display="icon" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="* #{lbl['lbl.sm.projDtls.apptDate']}" /></td>
							<td><p:calendar showOn="button" id="consultProjAppDate"
									navigator="true" display="inline" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									yearRange="c-99:c+0"
									value="#{backingBean.managedBean.selectedCompanyExperience.procurementDate}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="* #{lbl['lbl.sm.projDtls.mainCat']}" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL1.categoryL1Id}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select  -- " itemValue="" />
									<f:selectItems
										value="#{backingBean.managedBean.supplierParentCatList}"
										var="parent" itemLabel="#{parent.categoryName}"
										itemValue="#{parent.categoryL1Id}" />
									<p:ajax event="change"
										listener="#{backingBean.populateChildCategoryByParent(backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL1.categoryL1Id,
								backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL2,
								backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL3)}"
										update="conslChild,conslSubChild" />
								</p:selectOneMenu></td>


						</tr>
						<tr>
							<td><p:outputLabel
									value="* #{lbl['lbl.sm.projDtls.subCat']}" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL2.categoryL2Id}"
									id="conslChild" style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel=" -- Select  -- " itemValue="" />
									<f:selectItems
										value="#{backingBean.managedBean.supplierChildCatList}"
										var="conslChild" itemLabel="#{conslChild.categoryName}"
										itemValue="#{conslChild.categoryL2Id}" />
									<p:ajax event="change"
										listener="#{backingBean.populateSubChildCategoryByChild(backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL2.categoryL2Id,backingBean.managedBean.selectedCategory.pmCategoryL3)}"
										update="conslSubChild" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="* #{lbl['lbl.sm.projDtls.subCatDiv']}" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL3.categoryL3Id}"
									id="conslSubChild" style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel=" -- Select  --  " itemValue="" />
									<f:selectItems
										value="#{backingBean.managedBean.supplierSubChildCatList}"
										var="conslSubChild" itemLabel="#{conslSubChild.categoryName}"
										itemValue="#{conslSubChild.categoryL3Id}" />
								</p:selectOneMenu></td>
						</tr>
					</table>

				</td>

			</tr>
		</table>
		<br />

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				actionListener="#{backingBean.addOrUpdateCompanyExperienceToSmAppl}"
				update=":form:tt:consDt" />

			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}" type="reset"
				immediate="true" update=":form:tt:contDialog"
				onclick="consDialog.hide();">
			</p:commandButton>
		</div>

	</p:dialog>
</ui:composition>
