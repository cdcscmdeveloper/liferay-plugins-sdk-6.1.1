<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.submissionType']}" /></td>
			<td><p:selectOneRadio id="onLnSuppDocs"
					value="#{backingBean.managedBean.smAppl.supportingDocMode}">
					<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.offline']}"
						itemValue="H" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.online']}"
						itemValue="S" />
					<p:ajax update="supDocPan" event="change" />
				</p:selectOneRadio></td>
		</tr>
	</table>
	<p:panel toggleable="true" id="onSupTblPan">
		<f:facet name="header">
			<h:outputText
				value="#{lbl['lbl.sm.suppDoc.online.checklist.application.no']}" />&#160;
			<h:outputText value="#{backingBean.managedBean.smAppl.applNo}"
				rendered="#{backingBean.managedBean.smAppl.activeAppl}" />
		</f:facet>

		<c:if
			test="#{not empty backingBean.managedBean.bumiRecommendationNote}">
			<br />
			<table style="width: 100%">
				<tr>
					<td><h:outputText
							value="#{backingBean.managedBean.bumiRecommendationNote}"
							style="color: green;font-weight: bold;float:left;" /></td>
				</tr>
			</table>
			<br />
		</c:if>

		<table style="width: 100%">

			<tr>
				<td><h:outputText style="float:left"
						value="#{lbl['lbl.sm.suppDoc.online.notes']}" escape="false" /></td>

			</tr>
			<tr>
				<td><h:outputText style="float:left"
						value="#{lbl['lbl.sm.instruction.attachment']}" escape="false" /></td>
			</tr>
		</table>
		<p:spacer height="10px" />
		<p:dataTable var="table" id="onSdList"
			value="#{backingBean.managedBean.smAppl.smApplSupportDocs}"
			rowIndexVar="index">

			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
				style="width : 5%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" style="width : 55%;">
			
				<h:outputText value="#{table.pmDocument.docName}" style="float: left;white-space: normal;" />
					
				<p:outputPanel rendered="#{table.pmDocument.licenseReq}">
					<table width="100%">
						<tr>
							<td style="border-style: none !important;">
								<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.no']}" />
								<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}"/>
							</td>
							<td style="border-style: none !important;">
								<p:inputText value="#{table.licenseNo}" size="20" id="licenseNoId" required="#{table.pmDocument.mandatory}" label="#{lbl['lbl.sm.suppdoc.license.no']}" >
									<p:ajax process="@this" partialSubmit="true"/>
								</p:inputText>
								<p:message id="licenseNoIdMsg" for="licenseNoId" showSummary="true" showDetail="false" display="icon" />
							</td>
							<td colspan="2" style="border-style: none !important;"></td>
						</tr>
						<tr>
							<td style="border-style: none !important;">
								<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.effdate']}" />
								<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}"/>
							</td>
							<td style="border-style: none !important;">
								<p:calendar id="licenseEffDateId"
									navigator="true" required="#{table.pmDocument.mandatory}" 
									label="#{lbl['lbl.sm.suppdoc.license.effdate']}"
									value="#{table.licenseEffDate}"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
									readonlyInput="true" size="10" showOn="button" yearRange="-99:+0" >
									<p:ajax event="dateSelect" update="licenseExpDateId" process="@this"/>
								</p:calendar>
								<p:message id="licenseEffDateIdMsg"
									for="licenseEffDateId" showSummary="true" showDetail="false"
									display="icon" />
							</td>
							<td style="border-style: none !important;">
								<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.expdate']}" />
								<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}"/>
							</td>
							<td style="border-style: none !important;">
								<p:calendar id="licenseExpDateId" disabled="#{empty table.licenseEffDate}"
									navigator="true" required="#{table.pmDocument.mandatory}"
									label="#{lbl['lbl.sm.suppdoc.license.expdate']}"
									value="#{table.licenseExpDate}"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
									readonlyInput="true" size="10" showOn="button" yearRange="-99:+10" 
									mindate="#{table.licenseEffDate}">
									<p:ajax event="dateSelect" process="@this"/>
								</p:calendar>
								<p:message id="licenseExpDateIdMsg"
									for="licenseExpDateId" showSummary="true" showDetail="false"
									display="icon" />
							</td>
						</tr>
					</table>
				</p:outputPanel>
				
			</p:column>

			<p:column headerText="#{lbl['lbl.btn.download']}"
				rendered="#{backingBean.managedBean.hasSuppDocToDownload}"
				style="width : 10%;text-align: center  !important;">
				<h:outputText rendered="#{table.pmDocument.hardCopyReq}"
					value="#{lbl['lbl.sm.suppDoc.document.hdrCpyOnly']}"
					style="float: left;white-space: normal;" />

				<p:commandLink rendered="#{table.pmDocument.download}"
					action="#{backingBean.downloadSignatureSuppDoc(table.pmDocument.filePath,table.pmDocument.filePath)}"
					update=":form" ajax="false">
					<p:fileDownload value="#{backingBean.file}" />
					<p:graphicImage value="/css/images/design/download.png"
						style="margin-right:2px;" />
				</p:commandLink>
			</p:column>

			<p:column headerText="#{lbl['lbl.btn.upload.doc']}"
				style="width : 10%;text-align: center  !important;">

				<p:commandLink oncomplete="attachDlg1.show();return false;"
					process="@this" partialSubmit="true"
					rendered="#{!table.pmDocument.hardCopyReq}"
					update="@([id$=attachDlg1])"
					action="#{backingBean.assignSelectedSupportDoc(table)}">
					<p:graphicImage value="/css/images/design/upload.png"
						style="margin-right:2px;" />
				</p:commandLink>

			</p:column>
			<p:column headerText="#{lbl['lbl.pm.document.name']}"
				style="width : 20%;">

				<h:outputText rendered="#{table.pmDocument.hardCopyReq}"
					value="#{lbl['lbl.sm.suppDoc.document.hdrCpyRmrks']}"
					style="float: left;white-space: normal;" />

				<h:outputText value="#{table.smApplDocFiles[0].fileName}"
					style="float: left;white-space: normal;"
					rendered="#{!table.pmDocument.hardCopyReq}" />


			</p:column>
		</p:dataTable>

	</p:panel>

</ui:composition>
