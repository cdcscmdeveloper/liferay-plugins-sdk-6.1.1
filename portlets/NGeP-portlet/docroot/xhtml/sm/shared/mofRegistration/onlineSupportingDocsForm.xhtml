	<p:panel toggleable="true" id="onSupTblPan">
		<f:facet name="header">
			<h:outputText
				value="#{lbl['lbl.sm.suppDoc.online.checklist.application.no']}" />&#160;
			<h:outputText value="#{backingBean.managedBean.smAppl.applNo}"
				rendered="#{backingBean.managedBean.smAppl.activeAppl}" />
		</f:facet>

		<c:if
			test="#{not empty backingBean.managedBean.bumiRecommendationNote}">
			<br />
			<table style="width: 100%">
				<tr>
					<td><h:outputText
							value="#{backingBean.managedBean.bumiRecommendationNote}"
							style="color: green;font-weight: bold;float:left;" /></td>
				</tr>
			</table>
			<br />
		</c:if>
		<table style="width: 100%">

			<tr>
				<td><h:outputText styleClass="instruction"
						value="#{lbl['lbl.sm.suppDoc.online.notes']}" escape="false" /></td>

			</tr>
			<tr>
				<td><h:outputText styleClass="instruction"
						value="#{lbl['lbl.sm.suppDoc.instruction.attachment']}" escape="false" /></td>
			</tr>
			<!-- #28807 - Start -->
			<tr>
				<td><h:outputText styleClass="instruction"
						value="#{lbl['lbl.sm.suppDoc.online.multipleDoc']}" escape="false" /></td>

			</tr>
			<!-- #28807 - End -->
		</table>
		<p:spacer height="10px" />
		
		<ac:smSupplierOnlineSuppDoc tableId="mandatoryTableId" uploadDialogId="mandatoryUploadId"
			smApplSupportDocs="#{backingBean.managedBean.mandatoryDocs}" mandatory="true" hasAI="true"/> <!-- #38890 -->
		<ui:include src="onlineLicenseInfoForm.xhtml" />
		<ac:smSupplierOnlineSuppDoc tableId="nonMandatoryTableId" uploadDialogId="nonMandatoryUploadId"
			smApplSupportDocs="#{backingBean.managedBean.nonMandatoryDocs}" mandatory="false" />

		<!-- #3460 - Start -->
		<br />
		<p:outputPanel
			rendered="#{backingBean.managedBean.poUser or (backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser)}">
			<table>
				<tr>
					<td><p:outputLabel valign="top"
							value="#{lbl['lbl.sm.supportingdoc.supp.application.sdo.remarks']}" /></td>
					<td><p:inputTextarea align="right" id="sdoRemarks" rows="10"
							cols="10" autoResize="false" maxlength="4000"
							style="width: 300px;"
							value="#{backingBean.managedBean. sdoRemark}" readonly="true" /></td>
				</tr>
			</table>
		</p:outputPanel>
		<!-- #3460 - End -->
	</p:panel>
