<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel
		header=" Supporting Document Online Check List - Application No. - #{backingBean.managedBean.smAppl.applNo}"
		toggleable="true" id="onSupTblPan">
		<table style="width: 30%">
			<tr>
				<td><h:outputText value="#{lbl['lbl.sm.submissionType']}" /></td>
				<td><p:selectOneRadio id="onLnSuppDocs"
						value="#{backingBean.managedBean.smAppl.supportingDocMode}">
						<f:selectItem itemLabel="Offline" itemValue="F" />
						<f:selectItem itemLabel="Online" itemValue="O" />
						<p:ajax update="supDocPan" event="change" />
					</p:selectOneRadio></td>
			</tr>
		</table>
		<br />
		<table style="width: 30%">
			<tr>
				<td colspan="2"><c:choose>
						<c:when
							test="#{backingBean.managedBean.personCalc.halfBumiStatus and backingBean.managedBean.smAppl.applType ne 'C'}">
							<h:outputText value="#{lbl['lbl.sm.recommendation.halfBumi']}"
								style="color: green;font-weight: bold;font-size: 12px;" />
						</c:when>
						<c:when
							test="#{backingBean.managedBean.personCalc.fullBumiStatus and backingBean.managedBean.smAppl.applType ne 'C'}">
							<h:outputText value="#{lbl['lbl.sm.recommendation.fullBumi']}"
								style="color: green;font-weight: bold;font-size: 12px;" />
						</c:when>
						<c:otherwise>
							<h:outputText value="#{lbl['lbl.sm.recommendation.noBumi']}"
								style="color: green;font-weight: bold;font-size: 12px;" />
						</c:otherwise>
					</c:choose></td>
			</tr>

		</table>
		<br />
		<table style="width: 100%">

			<tr>
				<td style="background-color: aqua; color: black; text-align: left;">
					<h:outputText
						value="* You choose to send the documents online. Please send all the necessary documents mentioned in the check list." />
					<br /> <h:outputText
						value="* The system can only accommodate files in Word format and PDF:" />
					<br /> <br />
				</td>

			</tr>

		</table>

		<p:dataTable var="table" id="onSdList"
			value="#{backingBean.managedBean.smAppl.smApplSupportDocs}">
			<ac:paginator for="onSdList" />

			<p:column headerText="Document Description" style="width : 70%;">
				<p:outputLabel value="#{table.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="Upload Document " style="width : 10%;">
				<p:commandLink oncomplete="attachDlg1.show();return false;"
					action="#{backingBean.assignSelectedSupportDoc(table)}">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png"
						style="margin-right:2px;" />
				</p:commandLink>
			</p:column>
			<p:column headerText="Added Document Name" style="width : 20%;">
				<p:outputLabel value="#{table.smApplDocFiles[0].fileName}"
					style="float: left;white-space: normal;" />
			</p:column>
		</p:dataTable>

	</p:panel>

</ui:composition>
