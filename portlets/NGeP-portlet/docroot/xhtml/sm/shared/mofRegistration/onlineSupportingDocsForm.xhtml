<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header=" Supporting Document " toggleable="true">
		<br />
		<table>

			<tr>
				<td
					style="height: 50px; background-color: aqua; color: black; text-align: left; font-size: 8px;"><h6>
						<h:outputText
							value="* You choose to send the documents online. Please send all the necessary documents mentioned in the check list." />
						<br />
						<h:outputText
							value="* The system can only accommodate files in Word format and PDF:" />
						<br />

					</h6></td>

			</tr>

		</table>




		<p:panel
			header="Online Documents Check List - Application No. - 12374837"
			toggleable="true">
			<p:dataTable var="table"
				value="#{mofRegistrationBackingBean.dataList}">
				<p:column headerText="No.">  
                   #{table.no}  
      		    </p:column>

				<p:column headerText="Document Name">  
		            #{table.documentName} 
		        </p:column>
				<p:column headerText="Document Description">  
		            #{table.documentdescription} 
		        </p:column>
				<p:column headerText="Upload Document?">
					<p:fileUpload value="#{testBean.file}" mode="simple" />
				</p:column>
				<p:column headerText="Added Document Name">  
                   #{table.addedDocumentName}  
      		    </p:column>

			</p:dataTable>

			<br />

		</p:panel>


		<table>
			<tr>
				<td><p:commandButton value="Previous"></p:commandButton></td>
				<td><p:commandButton value="Declare"></p:commandButton></td>
			</tr>
		</table>


	</p:panel>
</ui:composition>
