<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header=" Supporting Document " toggleable="true">
		<br />
		<table style="width: 100%">

			<tr>
				<td style="background-color: aqua; color: black; text-align: left;">
					<h:outputText
						value="* You choose to send the documents online. Please send all the necessary documents mentioned in the check list." />
					<br /> <h:outputText
						value="* The system can only accommodate files in Word format and PDF:" />
					<br />

				</td>

			</tr>

		</table>

		<p:panel
			header="Online Documents Check List - Application No. - #{backingBean.managedBean.smAppl.applNo}">
			<p:dataTable var="table" id="onSdList"
				value="#{mofRegistrationBackingBean.dataList}">
				<ac:paginator for="onSdList" />
				<p:column headerText="No.">  
                   #{table.no}  
      		    </p:column>

				<p:column headerText="Document Name">  
		            #{table.documentName} 
		        </p:column>
				<p:column headerText="Document Description">  
		            #{table.documentdescription} 
		        </p:column>
				<p:column headerText="Upload Document ">
					<!-- <p:fileUpload mode="simple"></p:fileUpload> -->
					<p:commandLink>
						<p:graphicImage library="ep/images/design" name="upload.png"
							value="/resources/ep/images/design/upload.png"
							style="margin-right:2px;" />
					</p:commandLink>

				</p:column>
				<p:column headerText="Added Document Name">  
                   #{table.addedDocumentName}  
      		    </p:column>
			</p:dataTable>

			<br />

		</p:panel>

	</p:panel>
</ui:composition>
