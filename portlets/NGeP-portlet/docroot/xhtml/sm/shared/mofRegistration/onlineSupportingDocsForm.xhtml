<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel
		header="#{lbl['lbl.sm.suppDoc.online.checklist.application.no']} #{backingBean.managedBean.smAppl.applNo}"
		toggleable="true" id="onSupTblPan">
		<table style="width: 30%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.submissionType']}" /></td>
				<td><p:selectOneRadio id="onLnSuppDocs"
						value="#{backingBean.managedBean.smAppl.supportingDocMode}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.offline']}" itemValue="F" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.online']}" itemValue="O" />
						<p:ajax update="supDocPan" event="change" />
					</p:selectOneRadio></td>
			</tr>
		</table>
		<br />
		<table style="width: 100%">
			<tr>
				<td><c:choose>
						<c:when
							test="#{backingBean.managedBean.personCalc.halfBumiStatus and backingBean.managedBean.smAppl.applType ne 'C'}">
							<p:outputLabel value="#{lbl['lbl.sm.recommendation.halfBumi']}"
								style="color: green;font-weight: bold;float:left;" />
						</c:when>
						<c:when
							test="#{backingBean.managedBean.personCalc.fullBumiStatus and backingBean.managedBean.smAppl.applType ne 'C'}">
							<p:outputLabel value="#{lbl['lbl.sm.recommendation.fullBumi']}"
								style="color: green;font-weight: bold;float:left;" />
						</c:when>
						<c:otherwise>
							<p:outputLabel value="#{lbl['lbl.sm.recommendation.noBumi']}"
								style="color: green;font-weight: bold;float:left;" />
						</c:otherwise>
					</c:choose></td>
			</tr>

		</table>
		<br />
		<table style="width: 100%">

			<tr>
				<td><p:outputLabel style="float:left"
						value="#{lbl['lbl.sm.suppDoc.online.notes']}" escape="false" /></td>

			</tr>

		</table>
		<p:spacer height="10px" />
		<p:dataTable var="table" id="onSdList"
			value="#{backingBean.managedBean.smAppl.smApplSupportDocs}">
			<ac:paginator for="onSdList" />

			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" style="width : 70%;">
				<p:outputLabel value="#{table.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.btn.upload.doc']}" style="width : 10%;">
				<p:commandLink oncomplete="attachDlg1.show();return false;"
					action="#{backingBean.assignSelectedSupportDoc(table)}">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png"
						style="margin-right:2px;" />
				</p:commandLink>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.document.name']}" style="width : 20%;">
				<p:outputLabel value="#{table.smApplDocFiles[0].fileName}"
					style="float: left;white-space: normal;" />
			</p:column>
		</p:dataTable>

	</p:panel>

</ui:composition>
