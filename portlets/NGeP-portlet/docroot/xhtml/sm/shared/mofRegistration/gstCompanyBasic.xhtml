<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.gst.info']}" toggleable="true" id="gstHqPanelId">
		<table style="width: 58%">
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.gstNo']}" />
					<p:outputLabel value="*" styleClass="mandatory" 
					rendered="#{not empty backingBean.managedBean.companyBasicGst.gstEffDate 
					or not empty backingBean.managedBean.companyBasicGst.gstEndDate 
					and (backingBean.managedBean.supplierUser
					and (backingBean.managedBean.smAppl.applType eq 'N' 
							or backingBean.managedBean.smAppl.applType eq 'R'))}"/>
				</td>
				<td><c:choose>
						<c:when test="#{backingBean.managedBean.supplierUser 
							and (backingBean.managedBean.smAppl.applType eq 'N' 
							or backingBean.managedBean.smAppl.applType eq 'R')}">
							<p:inputText label="#{lbl['lbl.sm.gstNo']}"
								required="#{not empty backingBean.managedBean.companyBasicGst.gstEffDate 
								or not empty backingBean.managedBean.companyBasicGst.gstEndDate}"
								value="#{backingBean.managedBean.companyBasicGst.gstRegNo}"
								id="smGstRegistrationNo" size="35" maxlength="12"
								validatorMessage="#{lbl['lbl.sm.gstNo']} - #{lbl['lbl.sm.invalidNo']}">
								<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
								<p:ajax process="@this" partialSubmit="true" update="@([id$=gstHqPanelId])" />
							</p:inputText>
							<p:message id="smgstRegistrationNoMsg" for="smGstRegistrationNo"
								showSummary="true" showDetail="false" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText label="#{lbl['lbl.sm.gstNo']}"
								value="#{backingBean.managedBean.companyBasicGst.gstRegNo}"
								id="smGstRegistrationNoRdOnly" size="35" maxlength="12"
								readonly="true" disabled="true" />
						</c:otherwise>
					</c:choose></td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.gst.effdate']}" />
					<p:outputLabel value="*" styleClass="mandatory" 
					rendered="#{not empty backingBean.managedBean.companyBasicGst.gstRegNo 
					or not empty backingBean.managedBean.companyBasicGst.gstEndDate 
					and (backingBean.managedBean.supplierUser
					and (backingBean.managedBean.smAppl.applType eq 'N' 
							or backingBean.managedBean.smAppl.applType eq 'R'))}"/>
				</td>
				<td><c:choose>
						<c:when test="#{backingBean.managedBean.supplierUser 
							and (backingBean.managedBean.smAppl.applType eq 'N' 
							or backingBean.managedBean.smAppl.applType eq 'R')}">
							<p:calendar id="gstEffDate" showOn="button" navigator="true"
								display="inline" label="#{lbl['lbl.sm.gst.effdate']}"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								yearRange="-99:+0" readonlyInput="true" mindate="#{CommonConstants.GST_LAUNCH_DATE}"
								maxdate="#{CommonConstants.CURRENT_DATE}" 
								value="#{backingBean.managedBean.companyBasicGst.gstEffDate}" 
								required="#{not empty backingBean.managedBean.companyBasicGst.gstRegNo 
								or not empty backingBean.managedBean.companyBasicGst.gstEndDate}">
								<p:ajax event="dateSelect"  update="@([id$=gstHqPanelId])" process="@this" />
							</p:calendar>
							<p:message id="gstEffDateMsg" for="gstEffDate"
								showSummary="true" showDetail="false" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText
								value="#{backingBean.managedBean.companyBasicGst.gstEffDate}"
								readonly="true" size="35">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</p:inputText>
						</c:otherwise>

					</c:choose></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.gst.eff.end.date']}" /></td>
				<td><c:choose>
						<c:when test="#{backingBean.managedBean.supplierUser 
							and (backingBean.managedBean.smAppl.applType eq 'N' 
							or backingBean.managedBean.smAppl.applType eq 'R')}">
							<p:calendar id="gstEndDate" showOn="button" navigator="true"
								display="inline" label="#{lbl['lbl.sm.gst.eff.end.date']}"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								yearRange="-99:+10" readonlyInput="true"
								mindate="#{CommonConstants.GST_LAUNCH_DATE}"
								value="#{backingBean.managedBean.companyBasicGst.gstEndDate}" >
								<p:ajax event="dateSelect"  update="@([id$=gstHqPanelId])" process="@this" partialSubmit="true"/>
							</p:calendar>
							<p:message id="gstEndDateMsg" for="gstEndDate"
								showSummary="true" showDetail="false" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText
								value="#{backingBean.managedBean.companyBasicGst.gstEndDate}"
								readonly="true" size="35">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</p:inputText>
						</c:otherwise>
					</c:choose></td>
			</tr>
			<tr><td colspan="2" height="10"></td></tr>
		</table>
		<table style="width: 100%">
			<tr>
				<td>
					<p:dataTable var="tableGstHq" id="hqSuppDocDtId" value="#{backingBean.managedBean.companyBasicGst.smGstSupplierDocs}" rowIndexVar="index">
			
						<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
							style="width : 5%;">
							<p:outputLabel value="#{index + 1}"
								style="float: left;white-space: normal;" />
						</p:column>
			
						<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
							style="width : 55%;">
							<h:outputText value="#{tableGstHq.pmDocument.docName}"
								style="float: left;white-space: normal;" />
						</p:column>
			
						<p:column headerText="#{lbl['lbl.btn.upload.doc']}"
							style="width : 20%;" rendered="#{backingBean.managedBean.supplierUser 
							and (backingBean.managedBean.smAppl.applType eq 'N' 
							or backingBean.managedBean.smAppl.applType eq 'R') 
							and not empty backingBean.managedBean.companyBasicGst 
							and not empty backingBean.managedBean.companyBasicGst.gstRegNo}">
			
							<p:commandLink oncomplete="gstUploadDialog.show();return false;"
								rendered="#{!tableGstHq.pmDocument.hardCopyReq}"
								update="@([id$=gstUploadDialog])" process="@this"
								action="#{backingBean.assignSelectedGstDoc(tableGstHq)}">
								<p:graphicImage value="/css/images/design/upload.png"
									style="margin-right:2px;" />
							</p:commandLink>
			
						</p:column>
						<p:column headerText="#{lbl['lbl.pm.document.name']}"
							style="width : 20%;">
							<h:outputText value="#{tableGstHq.fileName}" rendered="#{not empty tableGstHq.fileName}"
								style="float: left;white-space: normal;" />
							<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty tableGstHq.fileName}" />
							<p:commandLink id="deleteHqAttId" style="white-space: normal !important;"
								partialSubmit="true" rendered="#{not empty tableGstHq.fileName and (backingBean.managedBean.supplierUser 
								and (backingBean.managedBean.smAppl.applType eq 'N' 
								or backingBean.managedBean.smAppl.applType eq 'R') 
								and not empty backingBean.managedBean.companyBasicGst 
								and not empty backingBean.managedBean.companyBasicGst.gstRegNo)}"
								process="@this" action="#{backingBean.onDeleteHqAttachment(tableGstHq)}"
								update="@form" onstart="blockWidget.show()"
								oncomplete="blockWidget.hide()">
								&#160;
								<p:graphicImage value="/css/images/design/icon_trash.png" 
									title="#{lbl['lbl.sm.gst.delete.attachment']}" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</td>
			</tr>
		</table>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
				rendered="#{backingBean.managedBean.supplierUser and 
						(backingBean.managedBean.smAppl.applType eq 'N' or backingBean.managedBean.smAppl.applType eq 'R')}"
				partialSubmit="true" process="@this" update=":#{p:component('gstHqPanelId')}"
				disabled="#{empty backingBean.managedBean.companyBasicGst 
					or empty backingBean.managedBean.companyBasicGst.gstRegNo}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				action="#{backingBean.deleteGst(backingBean.managedBean.companyBasicGst)}">
			</p:commandButton>
		</div>
		
		<p:dialog id="gstUploadDialog" widgetVar="gstUploadDialog" modal="true"
			dynamic="true" resizable="false" width="700px" height="200"
			styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
			<p:fileUpload allowTypes="/(\.|\/)(pdf|doc|docx)$/"
				sizeLimit="1000000"
				invalidFileMessage="#{lbl['lbl.sm.upload.format.errmsg']}"
				invalidSizeMessage="#{lbl['lbl.sm.upload.fileSize.exceed1Mb']}"
				fileUploadListener="#{backingBean.handleGstSupDocFileAttachment}"
				update="gstHqPanelId" oncomplete="gstUploadDialog.hide();" 
				uploadLabel="#{lbl['lbl.btn.upload']}"  
				label="#{lbl['lbl.btn.choose']}" 
				cancelLabel="#{lbl['lbl.btn.cancel']}" />
		</p:dialog>
		
		<p:confirmDialog id="confirmDeleteHqDialog" closable="true"
			message="#{lbl['lbl.sm.gst.delete.attachment.confirm.msg']}"
			header="#{lbl['lbl.sm.gst.delete.attachment.header']}" severity="alert"
			widgetVar="confirmDeleteHqDialog">
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDeleteHqDialog.hide();" 
					action="#{backingBean.deleteHqAttachment}" update="@form" partialSubmit="true"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" process="@this"/>
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDeleteHqDialog.hide();" />
			</div>
		</p:confirmDialog>
	</p:panel>

</ui:composition>
