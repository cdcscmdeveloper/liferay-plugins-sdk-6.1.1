<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.workshop.details']}" toggleable="true"
		id="smWorkShopDtPanel" rendered="#{backingBean.managedBean.showWorkShopPanel}">
		<p:outputPanel id="workShopPan" rendered="#{backingBean.managedBean.showWorkShopPanel}">
			<br />
			<!-- #28775 - 38500 -->
			<c:forEach var="workshopCatVar" items="#{backingBean.managedBean.workshopFacilitiesVOList}" varStatus="workshopCatVarStatus">
				<table style="width: 100%;">
					<tr>
						<td>
							<!-- #28175, 29380 - Site Visit Grouping Enhancement -28775 -->
						    <p:outputLabel value="#{workshopCatVarStatus.index + 1}. #{workshopCatVar.fullCatcode} 
						    	(#{backingBean.getSupplierCategoryName(workshopCatVar, false, true)})" 
						    	style="word-wrap:break-word; float:left !important; text-align:left !important;"/>
						</td>
					</tr>
				</table>
				<br />
				
				<p:dataTable var="work" widgetVar="smWorkShopDtWidVar"
					value="#{workshopCatVar.facilityList}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					rowKey="#{work}" rowIndexVar="index" id="workDt_#{workshopCatVarStatus.index}">
					<ac:paginator for="workDt_#{workshopCatVarStatus.index}" /><!-- #28775 - 38498 -->
					
					<!-- Disable for UPS 32008 - START -->
					<p:column style="width: 5% !important;" rendered="#{not empty workshopCatVar.facilityList and !backingBean.managedBean.upsCannotEdit}" >
						<f:facet name="header">
				          <p:selectBooleanCheckbox value="#{workshopCatVar.selected}" >
				          	<p:ajax event="change" update=":#{p:component('smWorkShopDtPanel')}" 
								process="@this" partialSubmit="true" 
								listener="#{backingBean.selectAll(workshopCatVar.selected,workshopCatVar.facilityList)}"/>
				          </p:selectBooleanCheckbox>
				       </f:facet>
						<p:selectBooleanCheckbox value="#{work.selected}">
							<p:ajax event="change" update="@this,:#{p:component('workShopPan')}" 
								process="@this" partialSubmit="true" />
						</p:selectBooleanCheckbox>
					</p:column>
	
					<p:column headerText="#{lbl['lbl.sm.facility.workshop.name']}">
						<p:outputPanel rendered="#{not empty work.smSupplierCategoryFacilities and work.smSupplierCategoryFacilities.size() gt 1}">
							<p:graphicImage value="/css/images/design/ico-same-with.png" 
								title="#{lbl['lbl.sm.facility.address.attach.more.than.one.category']}" />&#160;
						</p:outputPanel>
						<h:outputText value="#{work.facilityName}" />
					</p:column>
					
					<ui:remove>
						<p:column headerText="#{lbl['lbl.sm.category']}">
							<h:outputText value="#{workshopCatVar.fullCatcode} (#{workshopCatVar.categoryName})" />
						</p:column>
					</ui:remove>
					
					<p:column headerText="#{lbl['lbl.sm.workshop.address']}"
						style="width :60%;white-space : normal">
						<h:outputText value="#{backingBean.getFullAddress(work.smAddress)}"
							style="float : left" />
						<br />
						<script>
						
					      function getWorkAddress2(addr1, addr2, addr3, cityName, districtName, stateName, countryName) {
	
					    	  var address = addr1 + ',' + addr2 + ',' + addr3 + ',' + cityName + ',' + districtName + ',' + stateName + ',' + countryName;
	
					      	return address;
					      }
						
						</script>
	
						<ac:gmapInput id="gmapInput" 
							latitude="#{work.smAddress.mapLatitude}" 
							longitude="#{work.smAddress.mapLongitude}" 
							address="getWorkAddress2('#{work.smAddress.address1}', '#{work.smAddress.address2}', '#{work.smAddress.address3}', '#{work.smAddress.pmCity.cityName}', '#{work.smAddress.pmDistrict.districtName}', '#{work.smAddress.pmState.stateName}', '#{work.smAddress.pmCountry.countryName}')"
							showButton="true"
							disabled="#{backingBean.managedBean.upsCannotEdit}" />
							
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.action']}" style="text-align: center  !important;">
						<p:commandLink partialSubmit="true" process="@this"
							action="#{backingBean.assignSelWorkshop(work)}"
							update=":form:tt:workShopDialog" style="padding-right:5px"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
							<p:graphicImage value="/css/images/design/edit.png"
								title="#{lbl['lbl.sm.edit']}" rendered="#{!backingBean.managedBean.upsCannotEdit}"/>
							<p:graphicImage value="/css/images/design/ico-view.png"
								title="#{lbl['lbl.sm.view']}" rendered="#{backingBean.managedBean.upsCannotEdit}" />
						</p:commandLink>
					</p:column>
	
				</p:dataTable><br />
			</c:forEach><!-- #28775 - 38500 -->
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}" rendered="#{!backingBean.managedBean.upsCannotEdit}"
					partialSubmit="true" process="@this"
					action="#{backingBean.assignNewWorkshopBean}"
					update=":form:tt:workShopDialog" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<!-- #28775 - 38498 -->
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}" rendered="#{!backingBean.managedBean.upsCannotEdit}"
					partialSubmit="true" process="workShopPan"
					id="delWorkshopBtnId" disabled="#{backingBean.disableDeleteBtnFacility(backingBean.managedBean.workshopFacilitiesVOList)}"
					update=":#{p:component('smWorkShopDtPanel')},@this" oncomplete="workshopDeletePopUp.show()" />
			</div>
			<br />
		</p:outputPanel>

	</p:panel>
	<!-- 29379 - Site Visit Grouping Enhancement -28775 -->
	<p:dialog width="1200px" height="500px"
		header="#{lbl['lbl.sm.workshop.information']}"
		widgetVar="workShopDialog" resizable="false" showEffect="fade"
		closable="true" hideEffect="fade" modal="true" id="workShopDialog">
		
		<p:ajax event="close" listener="#{backingBean.cancelWorkShopSaveorUpdate}"/>
		
		<p:outputPanel layout="block" id="workShopBlockPanel">
			<p:messages id="workShopDialogMsg" showSummary="false"
				showDetail="true" autoUpdate="false" closable="true" />
				
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.facility.workshop.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
						<!-- #28775 - Site Visit Grouping Enhancement -28775 -->
					<td><p:inputText size="35" maxlength="50"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.facility.workshop.name']}" id="smWrkShpName"
							value="#{backingBean.managedBean.selectedWorkShopFacility.facilityName}"
							disabled="#{backingBean.managedBean.upsCannotEdit}" >
							<p:ajax process="@this" update="@this"/>
						</p:inputText>
						<p:message id="smWrkShpNameMsg" for="smWrkShpName"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.category']}" /> 
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td>
						<p:selectManyMenu showCheckbox="#{backingBean.managedBean.valueReqd}"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.category']}" id="workshopCategoryId"
							value="#{backingBean.managedBean.selectedSuppCategoryFacilityIds}"
							style="height:100px;width: 200px;"
							rendered="#{!backingBean.managedBean.upsCannotEdit}">
							<f:selectItems
								value="#{backingBean.getSelectedCategoryItemsByFacilityType(backingBean.managedBean.selectedWorkShopFacility.facilityType)}" />
							<p:ajax event="change" update="@this" process="@this" partialSubmit="true" />
						</p:selectManyMenu>
						<p:outputPanel rendered="#{backingBean.managedBean.upsCannotEdit}">
							<ui:repeat var="cat" value="#{backingBean.managedBean.selectedWorkShopFacility.smSupplierCategoryFacilities}">
								<h:outputText value="#{cat.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}
									#{cat.pmCategoryL3.pmCategoryL2.categoryL2Code} #{cat.pmCategoryL3.categoryL3Code}
									(#{backingBean.getSupplierCategoryName(cat.pmCategoryL3, false, false)})" style="float:left"/><br/> 
								<!-- #28175, 29380 - Site Visit Grouping Enhancement -28775 -->
							</ui:repeat>
						</p:outputPanel>
						<p:message id="workshopCategoryIdMsg" for="workshopCategoryId"
							showSummary="true" showDetail="false" display="icon" />
					</td>
				</tr>
				<!-- #13320 - added division -->
				<ac:smFacilityAddress backingBean="#{backingBean}" facility="#{backingBean.managedBean.selectedWorkShopFacility}"
					countryItems="#{backingBean.managedBean.countryItems}" stateItems="#{backingBean.managedBean.workShopFacilityStates}"
					divisionItems="#{backingBean.managedBean.workShopFacilityDivisions}"
					districtItems="#{backingBean.managedBean.workShopFacilityDistricts}" cityItems="#{backingBean.managedBean.workShopFacilityCities}" 
					facilityPanel="#{SupplierManagementConst.SM_WORKSHOP_FACILITY_PANEL}" panelId="workShopBlockPanel" disabled="#{backingBean.managedBean.upsCannotEdit}"/>
					
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td>
						<ac:phone id="smWrkShpPhNo" isMobile="false" label="#{lbl['lbl.sm.phoneno']}"
						countryCode="#{backingBean.managedBean.selectedWorkShopFacility.phoneCountry}" 
						areaCode="#{backingBean.managedBean.selectedWorkShopFacility.phoneArea}" 
						number="#{backingBean.managedBean.selectedWorkShopFacility.phoneNo}"  
						validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" 
						disabled="#{backingBean.managedBean.upsCannotEdit}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
					<td>
						<ac:phone id="smWrkShpFaxNo" isMobile="false" label="#{lbl['lbl.sm.faxno']}"
						countryCode="#{backingBean.managedBean.selectedWorkShopFacility.faxCountry}" 
						areaCode="#{backingBean.managedBean.selectedWorkShopFacility.faxArea}" 
						number="#{backingBean.managedBean.selectedWorkShopFacility.faxNo}"  
						validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}"
						disabled="#{backingBean.managedBean.upsCannotEdit}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.spec.area.feat']}" /></td>
					<td><p:inputText id="smWrkShpArea"
							label="#{lbl['lbl.sc.spec.area.feat']}"
							value="#{backingBean.managedBean.selectedWorkShopFacility.areaSquareFeet}"
							size="35"
							disabled="#{backingBean.managedBean.upsCannotEdit}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText> <p:message id="smWrkShpAreaMsg" for="smWrkShpArea"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				
				
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.facility.ownerType']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneRadio
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.facility.ownerType']}" id="smWrkShpOwnType"
							value="#{backingBean.managedBean.selectedWorkShopFacility.ownershipType}"
							disabled="#{backingBean.managedBean.upsCannotEdit}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.facility.rent']} "
								itemValue="R" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.facility.own']}"
								itemValue="O" />
							<p:ajax event="change"
								listener="#{backingBean.workShopOwnerTypeSel}"
								update="workShopBlockPanel" />
						</p:selectOneRadio> <p:message id="smWrkShpOwnTypeMsg" for="smWrkShpOwnType"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.price']}"
							rendered="#{backingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O'}" />
						<p:outputLabel value="#{lbl['lbl.sm.facility.rent.rm']}"
							rendered="#{backingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}" />
						<p:outputLabel value="*" styleClass="mandatory"
							rendered="#{backingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O' or 
							backingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}" /></td>
					<td><ui:fragment
							rendered="#{backingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O'}">
							<p:inputText id="smWrkShpPrice"
								disabled="#{!backingBean.managedBean.valueReqd or backingBean.managedBean.upsCannotEdit}"
								label="#{lbl['lbl.cm.price']}" maxlength="17"
								validatorMessage="#{lbl['lbl.cm.price']} - #{lbl['lbl.sm.rangeAmt.validMsg']}"
								value="#{backingBean.managedBean.selectedWorkShopFacility.purchasePrice}"
								size="20"
								required="#{backingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O'}">
								<f:validateDoubleRange
									minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
									maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								<p:ajax process="@this" partialSubmit="true"
									update="@this,smWrkShpPriceMsg" />
							</p:inputText>
							<p:message id="smWrkShpPriceMsg" for="smWrkShpPrice"
								showSummary="true" showDetail="false" display="icon" />
						</ui:fragment>
						<ui:fragment
							rendered="#{backingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}">
							<p:inputText id="smWrkShpRent"
								disabled="#{!backingBean.managedBean.valueReqd or backingBean.managedBean.upsCannotEdit}"
								label="#{lbl['lbl.sm.facility.rent.rm']}" maxlength="17"
								validatorMessage="#{lbl['lbl.sm.facility.rent.rm']} - #{lbl['lbl.sm.rangeAmt.validMsg']}"
								value="#{backingBean.managedBean.selectedWorkShopFacility.rentalRate}"
								size="20"
								required="#{backingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}">
								<f:validateDoubleRange
									minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
									maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								<p:ajax process="@this" partialSubmit="true"
									update="@this,smWrkShpRentMsg" />
							</p:inputText>
							<p:message id="smWrkShpRentMsg" for="smWrkShpRent"
								showSummary="true" showDetail="false" display="icon" />
						</ui:fragment></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.facility.ownerName']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="50" id="smWrkShpOwnName"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.facility.ownerName']}"
							value="#{backingBean.managedBean.selectedWorkShopFacility.ownerName}"
							size="35" disabled="#{backingBean.managedBean.upsCannotEdit}"/> <p:message id="smWrkShpOwnNameMsg"
							for="smWrkShpOwnName" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
	
			</table>
			<!-- 29379 - Site Visit Grouping Enhancement -28775 -->
			<ui:include src="/xhtml/sm/shared/mofRegistration/employeeInfoForm.xhtml" />
			<br />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.save']}" rendered="#{!backingBean.managedBean.upsCannotEdit}"
					action="#{backingBean.addOrUpdateWorkshopToSmAppl}"
					partialSubmit="true" process="workShopDialog"
					onclick="workShopBlockWidget.show();" oncomplete="workShopBlockWidget.hide();" 
					update=":#{p:component('smWorkShopDtPanel')}, @([id$=Msg])" />
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}" rendered="#{!backingBean.managedBean.upsCannotEdit}"
					process="@this" partialSubmit="true"
					action="#{backingBean.cancelWorkShopSaveorUpdate}"
					update=":form:tt:workShopDialog, @([id$=Msg])" />
				<!-- Disable for UPS 32008 - END -->
			</div>
			<p:blockUI block="workShopBlockPanel" widgetVar="workShopBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
		</p:outputPanel>
	</p:dialog>
	
	<ac:confirmationPopup id="workshopDeletePopUpId"
		widget="workshopDeletePopUp"
		okAction="backingBean.deleteSelectedWorkShops" width="400"
		height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}"
		update=":#{p:component('smWorkShopDtPanel')}, @([id$=Msg])" />

	<!-- 29379 - Site Visit Grouping Enhancement -28775  START-->
	<ac:confirmationPopup id="empDeletePopUpId" widget="empDeletePopUp"
		okAction="backingBean.removeEmployee()" width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}"
		update=":#{p:component('pnlEmployeeInfo')}" />
	<!-- 29379 - Site Visit Grouping Enhancement -28775  END-->
</ui:composition>
