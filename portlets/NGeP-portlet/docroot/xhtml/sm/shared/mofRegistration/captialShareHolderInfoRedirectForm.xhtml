<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="shrHolderPanGroup">
		<p:outputPanel id="shareHolderDialog" layout="block">
			<div align="left">
				<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true"
					update=":form" process="@this" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					actionListener="#{backingBean.backFromPersonnelPage}" />
			</div>
			<c:choose>
				<c:when test="#{backingBean.managedBean.showPersonnelViewOnly}">
					<ui:param name="viewSmApplBackingBean" value="#{backingBean}" />
					<ui:include
						src="/xhtml/sm/shared/applViewOnlyPages/shareHolderInfoPopUpFormViewOnly.xhtml" />
				</c:when>
				<c:otherwise>
					<ui:include
						src="/xhtml/sm/shared/mofRegistration/shareHolderInfoPopUpForm.xhtml" />
					<div align="right" style="padding-top: 10px;">
						<p:commandButton value="#{lbl['lbl.sm.button.save']}"
							onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
							action="#{backingBean.addOrUpdateShareHolderToSmAppl}"
							update=":form" />
					</div>
				</c:otherwise>
			</c:choose>
		</p:outputPanel>
	</h:panelGroup>


</ui:composition>
