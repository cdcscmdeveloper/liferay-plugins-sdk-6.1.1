<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.travelling.system']}" toggleable="true" rendered="#{backingBean.managedBean.showTravelSoftwarePanel}" id="travelSoftwarePanelId">
		<table style="width: 100%">
			<!-- Disable for UPS 32008 - START -->
			<!-- p:outputPanel rendered="#{backingBean.managedBean.poUser or backingBean.managedBean.upsCannotEdit}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.supplierSystemVerified}"
							id="poSystemVer">
							<p:ajax update=":form:tt:systemInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:systemInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.supplierSystemVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser or backingBean.managedBean.upsCannotEdit}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.supplierSystemVerified}"
							id="apprSystemVer">
							<p:ajax update=":form:tt:systemInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:systemInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.supplierSystemVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel-->
		</table>
		<p:outputPanel id="systemInfPan" layout="block">
			<p:blockUI rendered="#{!backingBean.managedBean.upsCannotEdit}" block=":form:tt:systemInfPan" widgetVar="buiPoSystem"
				id="poSystemBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.supplierSystemVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.supplierSystemVerified : false)}" />
				
			<p:outputPanel rendered="#{backingBean.managedBean.showTravelSoftwarePanel}">
				
				<ui:remove>
					<p:dataTable var="systemBean" widgetVar="systemBeanDtWidVar"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						value="#{backingBean.managedBean.travellingSoftwareList}"
						rowKey="#{systemBean}" rowIndexVar="index" id="systemBeanDt">
						<ac:paginator for="systemBeanDt" />
						
						<p:column style="width: 2% !important;">
							<f:facet name="header">
					          <p:selectBooleanCheckbox value="#{backingBean.managedBean.selectedAll}" disabled="#{backingBean.managedBean.upsCannotEdit}">
					          	<p:ajax event="change" update=":#{p:component('travelSoftwarePanelId')}" 
									process="@this" partialSubmit="true" 
									listener="#{backingBean.selectAll(backingBean.managedBean.selectedAll,backingBean.managedBean.travellingSoftwareList)}"/>
					          </p:selectBooleanCheckbox>
					       </f:facet>
							<p:selectBooleanCheckbox value="#{systemBean.selected}" rendered="#{not empty systemBean.machineId}" disabled="#{backingBean.managedBean.upsCannotEdit}">
								<p:ajax event="change" update="@this" process="@this" partialSubmit="true" />
							</p:selectBooleanCheckbox>
							<h:outputText value="*" styleClass="mandatory" rendered="#{empty systemBean.machineId}"/>
						</p:column>
						
						<p:column headerText="#{lbl['lbl.sm.travelling.system.name']}">
							<h:outputText value="#{systemBean.machineDesc}" rendered="#{not empty systemBean.machineId}"/>
							<p:outputPanel rendered="#{empty systemBean.machineId}">
								<p:inputText id="travelSoftwareNameId" required="true" label="#{lbl['lbl.sm.travelling.system.name']}"
									value="#{systemBean.machineDesc}" size="35" disabled="#{backingBean.managedBean.upsCannotEdit}">
									<p:ajax process="@this" update="@this" partialSubmit="true"/>
								</p:inputText> 
								<p:message id="travelSoftwareNameIdMsg" for="travelSoftwareNameId" showSummary="true" showDetail="false" display="icon" />
							</p:outputPanel>
						</p:column>
						
						
						<p:column headerText="#{lbl['lbl.sm.label.action']}" 
							style="text-align: center  !important;width: 2% !important;">
							<p:commandLink id="deleteActionId"
								partialSubmit="true"
								process="@this" update="@([id$=Msg])" 
								oncomplete="travelSoftwareDeletePopUp.show();" 
								action="#{backingBean.onDeleteSystem(systemBean)}" 
								rendered="#{empty systemBean.machineId}">
								<p:graphicImage value="/css/images/design/icon_trash.png" 
									title="#{lbl['lbl.sm.travel.software.delete']}"/>
							</p:commandLink>
						</p:column>
					
					</p:dataTable>
					
					<p:spacer height="2px;" />
					<table style="width: 100%;">
						<tr>
							<td>
								<p:commandButton value="#{lbl['lbl.sm.button.add']}" style="float:right;"
									update=":#{p:component('travelSoftwarePanelId')}" process="@this"
									partialSubmit="true" action="#{backingBean.assignNewSystemBean}" 
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
							</td>
							<td style="width: 20px">
								<p:graphicImage id="uidti" value="/css/images/design/tooltips.png"  />
								<p:tooltip id="uidtt" for="uidti">
									<p:outputLabel escape="false" value="#{lbl['lbl.sm.travel.software.click.add.others']}" />
								</p:tooltip>
							</td>
						</tr>
					</table>
				</ui:remove>
				
				<h:outputText styleClass="instruction" value="#{backingBean.showTravellingInstruction()}"/><br /><br />
				<table style="width: 50%;">
					<tr>
						<td style='vertical-align: baseline;'>
							<p:outputLabel value="#{lbl['lbl.sm.travelling.system.name']}" />
							<p:outputLabel value="*" styleClass="mandatory" />
						</td>
						<td>
							<table>
								<ui:repeat var="systemBean" value="#{backingBean.managedBean.travellingSoftwareList}">
									<p:outputPanel rendered="#{not empty systemBean.machineId}">
										<tr>
											<td style="width: 2% !important;">
												<p:selectBooleanCheckbox value="#{systemBean.selected}" disabled="#{backingBean.managedBean.upsCannotEdit}">
													<p:ajax event="change" update="@this" process="@this" partialSubmit="true" />
												</p:selectBooleanCheckbox>
											</td>
											<td>
												<h:outputText value="#{systemBean.machineDesc}" />
											</td>
										</tr>
									</p:outputPanel>
									<p:outputPanel rendered="#{empty systemBean.machineId}">
										<tr>
											<td colspan="2">
												<br />
												<h:outputText value="#{lbl['lbl.sm.sitevisit.if.others']}" />&#160;
												<p:inputText id="travelSoftwareNameId"
													label="#{lbl['lbl.sm.travelling.system.name']}"
													value="#{systemBean.machineDesc}" size="35"
													disabled="#{backingBean.managedBean.upsCannotEdit}">
													<!-- Disable for UPS 32008 - END -->
													<p:ajax process="@this" update="@this" partialSubmit="true"/>
												</p:inputText>
											</td>
										</tr>
									</p:outputPanel>
								</ui:repeat>
							</table>
						</td>
					</tr>
				</table>
			</p:outputPanel>
			
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser or (backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser)}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="systemSecPormrk"
								readonly="#{backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser}"
								validatorMessage="#{lbl['lbl.sm.travelling.system']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.supplierSystemRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="systemSecPormrkMsg" for="systemSecPormrk"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.supplierSystemRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="systemSecApprvrRmrk"
								validatorMessage="#{lbl['lbl.sm.travelling.system']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.supplierSystemRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="systemSecApprvrRmrkMsg" for="systemSecApprvrRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	
	<ac:confirmationPopup id="travellingSoftwarePopUpId"
		widget="travelSoftwareDeletePopUp"
		okAction="backingBean.deleteSelectedSystem"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update=":#{p:component('travelSoftwarePanelId')}, @([id$=Msg])"/>
	
</ui:composition>
