<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.travelling.system']}" toggleable="true">
		<table style="width: 100%">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.supplierSystemVerified}"
							id="poSystemVer">
							<p:ajax update=":form:tt:systemInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:systemInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.supplierSystemVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.supplierSystemVerified}"
							id="apprSystemVer">
							<p:ajax update=":form:tt:systemInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:systemInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.supplierSystemVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<p:outputPanel id="systemInfPan" layout="block">
			<p:blockUI block=":form:tt:systemInfPan" widgetVar="buiPoSystem"
				id="poSystemBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.supplierSystemVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.supplierSystemVerified : false)}" />
			
			<p:outputPanel rendered="#{backingBean.managedBean.showTravelSoftwarePanel}">
				<p:dataTable var="systemBean" widgetVar="systemDtWidVar"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{backingBean.managedBean.smAppl.smSupplierSystems}"
					selection="#{backingBean.managedBean.selectedSupplierSystemList}"
					rowKey="#{systemBean}" rowIndexVar="index" id="systemDt">
					<ac:paginator for="systemDt" />
					<p:column selectionMode="multiple" width="1%" rendered="#{not empty backingBean.managedBean.smAppl.smSupplierSystems}"/>
	
					<p:column headerText="#{lbl['lbl.sm.travelling.system.name']}">
						<h:outputText value="#{systemBean.system.machineDesc}" rendered="#{empty systemBean.systemName}"/>
						<h:outputText value="#{systemBean.systemName}" rendered="#{not empty systemBean.systemName}"/>
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
						<p:commandLink partialSubmit="true" process="@this"
							action="#{backingBean.assignSelSystem(systemBean)}"
							update=":form:tt:systemDialog" style="padding-right:5px" 
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
							<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
						</p:commandLink>
					</p:column>
	
				</p:dataTable>
				
				<p:spacer height="2px;" />
				<div align="right">
					<p:commandButton value="#{lbl['lbl.sm.button.add']}"
						update=":form:tt:systemDialog" process="@this"
						partialSubmit="true" action="#{backingBean.assignNewSystemBean}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
					<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
						action="#{backingBean.deleteSelectedSystem}" id="delSystemBtnId"
						disabled="#{empty backingBean.managedBean.smAppl.smSupplierSystems}"
						partialSubmit="true" process="machInfPan" update=":form:tt:systemDt,@this" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				</div>
			</p:outputPanel>
			<p:outputPanel
				rendered="#{!backingBean.managedBean.showTravelSoftwarePanel}"
				layout="block">
	
				<table style="width: 100%">
					<tr>
						<td><h:outputText style="float:left"
								value="#{lbl['lbl.sm.travelling.system.notApplicable']}" /></td>
					</tr>
				</table>
	
			</p:outputPanel>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="systemSecPormrk"
								validatorMessage="#{lbl['lbl.sm.travelling.system']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.supplierSystemRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="systemSecPormrkMsg" for="systemSecPormrk"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.supplierSystemRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="systemSecApprvrRmrk"
								validatorMessage="#{lbl['lbl.sm.travelling.system']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.supplierSystemRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="systemSecApprvrRmrkMsg" for="systemSecApprvrRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	
	<p:dialog width="600px" height="150px"
		header="#{lbl['lbl.sm.travelling.system.diaHdr']}" widgetVar="systemDialog"
		resizable="false" showEffect="fade" closable="false" hideEffect="fade"
		modal="true" id="systemDialog">
		
		<p:outputPanel id="systemOutPanelId" layout="block">
			<p:messages id="systemDialogMsg" showSummary="false" showDetail="true" autoUpdate="true" closable="true" />
			<table style="width: 100%">
				<tr>
					<td style="border-style: none !important;float: right !important;">
						<p:selectBooleanCheckbox value="#{backingBean.managedBean.othersSystem}">
							<p:ajax event="change" partialSubmit="true" process="@this"
								update="systemOutPanelId" listener="#{backingBean.onTickOtherSystem()}"/>
						</p:selectBooleanCheckbox>
					</td>
					<td valign="top" style="border-style: none !important;">
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.travelling.system.others']}" />
					</td>
				</tr>
				<p:outputPanel rendered="#{!backingBean.managedBean.othersSystem}">
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.sm.travelling.system.name']}" /> 
							<p:outputLabel value="*" styleClass="mandatory"/>
						</td>
						<td><p:selectOneMenu
								required="#{backingBean.managedBean.valueReqd}"
								label="#{lbl['lbl.sm.travelling.system.name']}" id="systemTypeId"
								value="#{backingBean.managedBean.selectedSystem.system.machineId}"
								style="width: 207px;margin-bottom: 5px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems var="sytemVar"
									value="#{backingBean.managedBean.travellingSoftwareItems}" />
							</p:selectOneMenu>
							<p:message id="systemTypeIdMsg" for="systemTypeId"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</p:outputPanel>
				<p:outputPanel rendered="#{backingBean.managedBean.othersSystem}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.travelling.system.name']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><p:inputText maxlength="50"
								required="#{backingBean.managedBean.valueReqd}"
								label="#{lbl['lbl.sm.travelling.system.name']}" id="othersSystemTypeId"
								value="#{backingBean.managedBean.selectedSystem.systemName}"
								size="35" /> 
							<p:message id="othersSystemTypeIdMsg"
								for="othersSystemTypeId" showSummary="true" showDetail="false"
								display="icon" />
						</td>
					</tr>
				</p:outputPanel>
			</table>
		</p:outputPanel>
		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				action="#{backingBean.addOrUpdateSystemToSmAppl}"
				partialSubmit="true" process="systemDialog"
				onclick="systemOutWidget.show();" oncomplete="systemOutWidget.hide();"
				update=":form:tt:systemDt, @([Id$=Msg]),:#{p:component('delSystemBtnId')}" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				partialSubmit="true" process="@this"
				action="#{backingBean.cancelSystemSaveorUpdate}" />
		</div>
		<p:blockUI block="systemOutPanelId" widgetVar="systemOutWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
	</p:dialog>
</ui:composition>
