<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:dialog id="docCheckListDlg" widgetVar="docCheckListDlg" modal="true"
		dynamic="true" resizable="false" width="900px"
		height="700px" styleClass="pop_up_top" 
		header="#{lbl['lbl.sm.printchecklist.header']}">
		<p:media value="#{backingBean.getOfflineSuppDocCheckList()}" 
			width="100%" height="700px" player="pdf" />
		<p:panelGrid styleClass="noBorders tr,noBorders td" >
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.btn.close']}"
						onclick="docCheckListDlg.hide()" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>

	<table>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.submissionType']}" /></td>
			<td><p:selectOneRadio id="offLnSuppDocs"
					value="#{backingBean.managedBean.smAppl.supportingDocMode}">
					<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.offline']}"
						itemValue="H" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.online']}"
						itemValue="S" />
					<p:ajax update="supDocPan" event="change" process="@this"/>
				</p:selectOneRadio></td>
		</tr>

	</table>

	<div id="printArea">
		<p:panel toggleable="true" id="offSupDocPanelHdr">
			<f:facet name="header">
				<h:outputText
					value="#{lbl['lbl.sm.suppDoc.offline.checklist.application.no']}" />&#160;
				<h:outputText value="#{backingBean.managedBean.smAppl.applNo}"
					rendered="#{backingBean.managedBean.smAppl.activeAppl}" />
			</f:facet>
			<c:if
				test="#{not empty backingBean.managedBean.bumiRecommendationNote}">
				<br />
				<table style="width: 100%">
					<tr>
						<td><h:outputText
								value="#{backingBean.managedBean.bumiRecommendationNote}"
								style="color: green;font-weight: bold;float:left;" /></td>
					</tr>
				</table>
				<br />
			</c:if>

			<table style="width: 100%;">

				<tr>
					<td><h:outputText style="float:left"
							value="#{lbl['lbl.sm.suppDoc.offline.note1']}" /> <br /> <h:outputText
							style="float:left" value="#{lbl['lbl.sm.suppDoc.offline.note2']}" />
						<br /> <h:outputText style="float:left"
							value="#{lbl['lbl.sm.suppDoc.offline.note3']}" /> <br /></td>
					<td>
						<div align="right">
							<p:commandLink action="#{backingBean.printDocCheckList}" update="@form"
							   onstart="blockWidget.show()" oncomplete="blockWidget.hide()" process="@this">
								<p:graphicImage value="/css/images/design/print.png"
											style="margin-right:2px;" title="#{lbl['lbl.sm.printList']}"/>
							</p:commandLink>
						</div>
					</td>

				</tr>

			</table>
			<p:spacer height="10px" />
			<table style="width: 100%;">
				<tr>
					<td style="width: 33%">
						<table>
							<tr>
								<td><h:outputText style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.peninAddr1']}"
										escape="false" /></td>
							</tr>
							<tr>
								<td style="padding-top: 10px;"><h:outputText
										style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.peninAddr2']}"
										escape="false" /></td>
							</tr>
						</table>
					</td>

					<td style="width: 33%"><table>
							<tr>
								<td><h:outputText style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr1']}"
										escape="false" /></td>
							</tr>
							<tr>
								<td style="padding-top: 10px;"><h:outputText
										style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr2']}"
										escape="false" /></td>
							</tr>
						</table></td>
					<td style="width: 33%"><table>
							<tr>
								<td><h:outputText style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr1']}"
										escape="false" /></td>
							</tr>
							<tr>
								<td style="padding-top: 10px;"><h:outputText
										style="float:left"
										value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr2']}"
										escape="false" /></td>
							</tr>
						</table></td>
				</tr>
			</table>
			<p:spacer height="10px" />


			<p:dataTable var="table" id="offSdList"
				value="#{backingBean.managedBean.smAppl.smApplSupportDocs}"
				rowIndexVar="index">

				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
					style="width : 5%;">
					<p:outputLabel value="#{index + 1}"
						style="float: left;white-space: normal;" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" style="width : 95%;">
				
					<h:outputText value="#{table.pmDocument.docName}" style="float: left;white-space: normal;" />
					
					<p:outputPanel rendered="#{table.pmDocument.licenseReq}">
						<table width="100%">
							<tr>
								<td style="border-style: none !important;">
									<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.no']}" />
									<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}"/>
								</td>
								<td style="border-style: none !important;">
									<p:inputText value="#{table.licenseNo}" size="20" id="licenseNoOfflineId" required="#{table.pmDocument.mandatory}" label="#{lbl['lbl.sm.suppdoc.license.no']}" >
										<p:ajax process="@this" partialSubmit="true"/>
									</p:inputText>
									<p:message id="licenseNoOfflineIdMsg" for="licenseNoOfflineId" showSummary="true" showDetail="false" display="icon" />
								</td>
								<td colspan="2" style="border-style: none !important;"></td>
							</tr>
							<tr>
								<td style="border-style: none !important;">
									<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.effdate']}" />
									<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}"/>
								</td>
								<td style="border-style: none !important;">
									<p:calendar id="licenseEffDateOfflineId"
										navigator="true" required="#{table.pmDocument.mandatory}" 
										label="#{lbl['lbl.sm.suppdoc.license.effdate']}"
										value="#{table.licenseEffDate}"
										pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
										readonlyInput="true" size="10" showOn="button" yearRange="-99:+0" >
										<p:ajax event="dateSelect" update="licenseExpDateOfflineId" process="@this" partialSubmit="true"/>
									</p:calendar>
									<p:message id="licenseEffDateOfflineIdMsg"
										for="licenseEffDateOfflineId" showSummary="true" showDetail="false"
										display="icon" />
								</td>
								<td style="border-style: none !important;">
									<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.expdate']}" />
									<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}"/>
								</td>
								<td style="border-style: none !important;">
									<p:calendar id="licenseExpDateOfflineId" disabled="#{empty table.licenseEffDate}"
										navigator="true" required="#{table.pmDocument.mandatory}"
										label="#{lbl['lbl.sm.suppdoc.license.expdate']}"
										value="#{table.licenseExpDate}"
										pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
										readonlyInput="true" size="10" showOn="button" yearRange="-99:+10" 
										mindate="#{table.licenseEffDate}">
										<p:ajax event="dateSelect" process="@this" partialSubmit="true"/>
									</p:calendar>
									<p:message id="licenseExpDateOfflineIdMsg"
										for="licenseExpDateOfflineId" showSummary="true" showDetail="false"
										display="icon" />
								</td>
							</tr>
						</table>
					</p:outputPanel>
					
				</p:column>

				<p:column headerText="#{lbl['lbl.btn.download']}"
					rendered="#{backingBean.managedBean.hasSuppDocToDownload}"
					style="width : 5%;text-align: center  !important;">
					<p:commandLink rendered="#{table.pmDocument.download}"
						action="#{backingBean.downloadSignatureSuppDoc(table.pmDocument.filePath,table.pmDocument.filePath)}"
						update=":form" ajax="false">
						<p:fileDownload value="#{backingBean.file}" />
						<p:graphicImage value="/css/images/design/download.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>

			</p:dataTable>

			<br />
			<p:spacer height="2px;" />
		</p:panel>
	</div>
</ui:composition>
