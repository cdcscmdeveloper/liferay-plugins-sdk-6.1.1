<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:dialog id="docCheckListDlg" widgetVar="docCheckListDlg" modal="true"
		dynamic="true" resizable="false" width="900px"
		height="700px" styleClass="pop_up_top" 
		header="#{lbl['lbl.sm.printchecklist.header']}">
		<p:media value="#{backingBean.getOfflineSuppDocCheckList()}" 
			width="100%" height="700px" player="pdf" />
		<p:panelGrid styleClass="noBorders tr,noBorders td" >
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.btn.close']}"
						onclick="docCheckListDlg.hide()" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>

	<table>
		<!-- #25243 -->
		<c:choose>
			<c:when test="#{backingBean.managedBean.wasBumiApplication or backingBean.managedBean.smAppl.applType == 'B'}">
				<tr>
					<td>
						<h:outputText value="#{lbl['lbl.sm.suppDoc.online.bumi.only']}" escape="false" />
					</td>
				</tr>
			</c:when>
			<c:otherwise>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.submissionType']}" /></td>
					<td>
						<p:selectOneRadio id="offLnSuppDocs" value="#{backingBean.managedBean.smAppl.supportingDocMode}"
							required="true" >
							<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.offline']}"
								itemValue="H" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.online']}"
								itemValue="S" />
							<p:ajax update="supDocPan" event="change" process="@this"/>
						</p:selectOneRadio>
					</td>
				</tr>
			</c:otherwise>
		</c:choose>
	</table>

	<div id="printArea">
		<p:panel toggleable="true" id="offSupDocPanelHdr">
			<f:facet name="header">
				<!-- #25243 -->
				<c:choose>
				    <c:when test="#{backingBean.managedBean.wasBumiApplication or backingBean.managedBean.smAppl.applType == 'B'}">
				       <h:outputText
							value="#{lbl['lbl.sm.suppDoc.online.checklist.application.no']}" />
				    </c:when>
				    <c:otherwise>
				        <h:outputText
							value="#{lbl['lbl.sm.suppDoc.offline.checklist.application.no']}" />
				    </c:otherwise>
				</c:choose>&#160;	
				<h:outputText value="#{backingBean.managedBean.smAppl.applNo}"
					rendered="#{backingBean.managedBean.smAppl.activeAppl}" />
			</f:facet>
			<c:if
				test="#{not empty backingBean.managedBean.bumiRecommendationNote}">
				<br />
				<table style="width: 100%">
					<tr>
						<td><h:outputText
								value="#{backingBean.managedBean.bumiRecommendationNote}"
								style="color: green;font-weight: bold;float:left;" /></td>
					</tr>
				</table>
				<br />
			</c:if>
			<!-- #25243 -->
			<c:choose>
			    <c:when test="#{backingBean.managedBean.wasBumiApplication or backingBean.managedBean.smAppl.applType != 'B'}">
					<table style="width: 100%;">
						<tr>
							<td>
								<h:outputText style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.note1']}" /> <br /> 
								<h:outputText style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.note3']}" /> <br />
							</td>
							<td>
								<div align="right">
									<p:commandLink action="#{backingBean.printDocCheckList}" update="@form"
									   onstart="blockWidget.show()" oncomplete="blockWidget.hide()" process="@this">
										<p:graphicImage value="/css/images/design/print.png"
													style="margin-right:2px;" title="#{lbl['lbl.sm.printList']}"/>
									</p:commandLink>
								</div>
							</td>
						</tr>
					</table>
					<p:spacer height="10px" />
					<table style="width: 100%;">
						<tr>
							<td style="width: 33%">
								<table>
									<tr>
										<td><h:outputText style="float:left"
												value="#{lbl['lbl.sm.suppDoc.offline.peninAddr1']}"
												escape="false" /></td>
									</tr>
									<tr>
										<td style="padding-top: 10px;"><h:outputText
												style="float:left"
												value="#{lbl['lbl.sm.suppDoc.offline.peninAddr2']}"
												escape="false" /></td>
									</tr>
								</table>
							</td>
		
							<td style="width: 33%"><table>
									<tr>
										<td><h:outputText style="float:left"
												value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr1']}"
												escape="false" /></td>
									</tr>
									<tr>
										<td style="padding-top: 10px;"><h:outputText
												style="float:left"
												value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr2']}"
												escape="false" /></td>
									</tr>
								</table></td>
							<td style="width: 33%"><table>
									<tr>
										<td><h:outputText style="float:left"
												value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr1']}"
												escape="false" /></td>
									</tr>
									<tr>
										<td style="padding-top: 10px;"><h:outputText
												style="float:left"
												value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr2']}"
												escape="false" /></td>
									</tr>
								</table></td>
						</tr>
					</table>
				 </c:when>
				 <c:otherwise>
				 	<table style="width: 100%">
						<tr>
							<td><h:outputText styleClass="instruction"
								value="#{lbl['lbl.sm.suppDoc.online.notes']}" escape="false" /></td>
						</tr>
						<tr>
							<td><h:outputText styleClass="instruction"
								value="#{lbl['lbl.sm.suppDoc.instruction.attachment']}" escape="false" /></td>
						</tr>
					</table>
				 </c:otherwise>	
			</c:choose>		
			<p:spacer height="10px" />


			<ac:smSupplierOfflineSuppDoc tableId="mandatoryOfflineTableId" uploadDialogId="mandatoryUploadId"
				smApplSupportDocs="#{backingBean.managedBean.mandatoryDocs}" mandatory="true" />
			<ui:include src="offlineLicenseInfoForm.xhtml" />
			<ac:smSupplierOfflineSuppDoc tableId="nonMandatoryOfflineTableId" uploadDialogId="nonMandatoryUploadId"
				smApplSupportDocs="#{backingBean.managedBean.nonMandatoryDocs}" mandatory="false" />

			<br />
		
		<!-- #3460 - Start -->
		<br/>
		<p:outputPanel
			rendered="#{backingBean.managedBean.poUser or (backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser)}">
		<table>
					<tr>
						<td><p:outputLabel valign="top" value="#{lbl['lbl.sm.supportingdoc.supp.application.sdo.remarks']}" /></td>
						<td><p:inputTextarea align="right" id="sdoRemark" rows="10" cols="10" autoResize="false" maxlength="4000" style="width: 300px;"
						value="#{backingBean.managedBean.sdoRemark}"  readonly = "true"/></td>
					</tr>
				</table>
				</p:outputPanel>
		<!-- #3460 - End -->
		
			<p:spacer height="2px;" />
		</p:panel>
	</div>
</ui:composition>
