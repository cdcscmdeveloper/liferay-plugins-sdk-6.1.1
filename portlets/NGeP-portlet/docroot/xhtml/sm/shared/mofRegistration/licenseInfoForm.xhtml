<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="License Details" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox>

						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox>

						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="licInfPan">

			<p:dataTable var="licBean"
				value="#{backingBean.managedBean.smAppl.smSupplierCerts}"
				selection="#{backingBean.managedBean.selectedCertList}"
				rowKey="#{licBean}" rowIndexVar="index" id="licDt">
				<ac:paginator for="licDt" />
				<p:column selectionMode="multiple" width="5%" />


				<p:column headerText="License Name">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="License Body">
					<h:outputText value="-- TBC --" />
				</p:column>

				<p:column headerText="Start Date">
					<h:outputText value="#{licBean.certStartDate}">
						<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
					</h:outputText>
				</p:column>

				<p:column headerText="End Date">
					<h:outputText value="#{licBean.certEndDate}">
						<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
					</h:outputText>

				</p:column>
				<p:column headerText="Action">
					<p:commandLink oncomplete="licDialog.show();"
						update=":form:tt:licPop">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="Add " oncomplete="licDialog.show();"
					update=":form:tt:licPop" />
				<p:commandButton value="Delete " />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41" /></td>
						<td style="padding-left: 22px;"><p:outputLabel
								value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="500px" header="License Information"
		widgetVar="licDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="licPop">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* License Name" size="35" /></td>
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="*License Body" /></td>
				<td><p:inputTextarea /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="* Start Date" /></td>
				<td><p:calendar showOn="button" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Expiry Date" /></td>
				<td><p:calendar showOn="button" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="*Associated Equipment" /></td>

				<td><p:selectManyMenu showCheckbox="true">
						<f:selectItems
							value="#{backingBean.managedBean.smAppl.smMachineDtls}" var="mac"
							itemLabel="#{mac.brandName}" itemValue="#{mac.brandName}" />
					</p:selectManyMenu></td>

			</tr>

			<tr>
				<td><p:outputLabel value="*Associated Facility" /></td>

				<td><p:selectManyMenu showCheckbox="true">
						<f:selectItems
							value="#{backingBean.managedBean.smAppl.smFacilities}" var="fac"
							itemLabel="#{fac.ownerName}" itemValue="#{fac.ownerName}" />
					</p:selectManyMenu></td>

			</tr>

		</table>
		<!-- </p:panel> -->
		<br />
		<div align="right">
			<p:commandButton value="Save" oncomplete="licDialog.hide();"
				update=":form:tt:licDt" />
			<p:commandButton value="Cancel" onclick="licDialog.hide();" />
		</div>

	</p:dialog>
</ui:composition>
