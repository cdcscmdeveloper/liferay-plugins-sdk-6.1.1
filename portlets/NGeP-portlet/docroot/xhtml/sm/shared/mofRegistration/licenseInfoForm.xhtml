<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.license.details']}" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.licenseVerified}"
							id="poLicVer">
							<p:ajax update=":form:tt:licInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.licenseVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.licenseVerified}"
							id="apprLicVer">
							<p:ajax update=":form:tt:licInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.licenseVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="licInfPan">
			<p:blockUI block=":form:tt:licInfPan" widgetVar="buiPoLic"
				id="poLicBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.licenseVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.licenseVerified : false)}" />


			<p:dataTable var="licBean"
				value="#{backingBean.managedBean.smAppl.smSupplierCerts}"
				selection="#{backingBean.managedBean.selectedCertList}"
				rowKey="#{licBean}" rowIndexVar="index" id="licDt">
				<ac:paginator for="licDt" />
				<p:column selectionMode="multiple" width="5%" />


				<p:column headerText="#{lbl['lbl.sm.license.name']}">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.license.body']}">
					<h:outputText value="-- TBC --" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.license.startdate']}">
					<h:outputText value="#{licBean.certStartDate}">
						<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.license.enddate']}">
					<h:outputText value="#{licBean.certEndDate}">
						<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
					</h:outputText>

				</p:column>
				<p:column headerText="#{lbl['lbl.sm.action']}">
					<p:commandLink oncomplete="licDialog.show();"
						update=":form:tt:licPop">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}" oncomplete="licDialog.show();"
					update=":form:tt:licPop" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.licenseRemarks}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.licenseRemarks}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.licenseRemarks}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="500px" header="#{lbl['lbl.sm.license.information']}"
		widgetVar="licDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="licPop">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.license.name']}" size="35" /></td>
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.license.body']}" /></td>
				<td><p:inputTextarea /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.license.startdate']}" /></td>
				<td><p:calendar showOn="button" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.license.enddate']}" /></td>
				<td><p:calendar showOn="button" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.license.assc.equipmnt']}" /></td>

				<td><p:selectManyMenu showCheckbox="true">
						<f:selectItems
							value="#{backingBean.managedBean.smAppl.smMachineDtls}" var="mac"
							itemLabel="#{mac.brandName}" itemValue="#{mac.brandName}" />
					</p:selectManyMenu></td>

			</tr>

			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.license.assc.facility']}" /></td>

				<td><p:selectManyMenu showCheckbox="true">
						<f:selectItems
							value="#{backingBean.managedBean.smAppl.smFacilities}" var="fac"
							itemLabel="#{fac.ownerName}" itemValue="#{fac.ownerName}" />
					</p:selectManyMenu></td>

			</tr>

		</table>
		<!-- </p:panel> -->
		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}" oncomplete="licDialog.hide();"
				update=":form:tt:licDt" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}" onclick="licDialog.hide();" />
		</div>

	</p:dialog>
</ui:composition>
