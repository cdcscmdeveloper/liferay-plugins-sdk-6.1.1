<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Dockyard Details" toggleable="true">

		<p:dataTable var="doc"
			value="#{backingBean.managedBean.applDockyardFacilities}"
			selection="#{backingBean.managedBean.selectedDockyardFacilities}"
			rowKey="#{doc}" rowIndexVar="index" id="docDt">
			<ac:paginator for="docDt" />
			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="Dockyard Name">
				<h:outputText value="-- DOC Name TBC --" />
			</p:column>

			<p:column headerText="Dockyard Address">
				<h:outputText
					value="#{doc.smAddress.address1},#{doc.smAddress.address2},#{doc.smAddress.address3}" />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink oncomplete="dockYardDialog.show();"
					action="#{backingBean.assignSelDockyard(doc)}"
					update=":form:tt:dockYardDialog" style="padding-right:5px">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="Add " oncomplete="dockYardDialog.show();"
				action="#{backingBean.assignNewDockyardBean}"
				update=":form:tt:dockYardDialog" />
			<p:commandButton value="Delete "
				action="#{backingBean.deleteSelectedDocks}" update=":form:tt:docDt" />
		</div>
		<br />
	</p:panel>
	<p:dialog width="500px" height="500px" header="Dockyard Information"
		widgetVar="dockYardDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="dockYardDialog">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Facility Type" /></td>
				<td><p:inputText value="Dockyard" readonly="true"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Name" /></td>
				<td><p:inputText size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Address" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedDockyardFacility.smAddress.address1}"
						size="35" /></td>
			</tr>

			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedDockyardFacility.smAddress.address2}"
						size="35" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedDockyardFacility.smAddress.address3}"
						size="35" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedDockyardFacility.smAddress.address4}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="*#{lbl['lbl.sm.country']}" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedDockyardFacility.smAddress.pmCountry.countryId}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="dockyardCountry"
							value="#{backingBean.managedBean.countryLs}"
							itemValue="#{dockyardCountry.countryId}"
							itemLabel="#{dockyardCountry.countryName}" />
						<p:ajax event="change"
							listener="#{backingBean.populateStatesByCountry(backingBean.managedBean.selectedDockyardFacility.smAddress.pmCountry.countryId, 
								SupplierManagementConst.SM_DOCKYARD_FACILITY_PANEL,
								backingBean.managedBean.selectedDockyardFacility.smAddress.pmState,
								backingBean.managedBean.selectedDockyardFacility.smAddress.pmDistrict,
								backingBean.managedBean.selectedDockyardFacility.smAddress.pmCity)}"
							update="dockyardState,dockyardDist,dockyardCity" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						value="#{backingBean.managedBean.selectedDockyardFacility.smAddress.pmState.stateId}"
						id="dockyardState">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="dockyardState"
							value="#{backingBean.managedBean.dockFacilityStates}"
							itemValue="#{dockyardState.stateId}"
							itemLabel="#{dockyardState.stateName}" />
						<p:ajax event="change"
							listener="#{backingBean.populateDistrictsByState(backingBean.managedBean.selectedDockyardFacility.smAddress.pmState.stateId, 
								SupplierManagementConst.SM_DOCKYARD_FACILITY_PANEL,
								backingBean.managedBean.selectedDockyardFacility.smAddress.pmDistrict,
								backingBean.managedBean.selectedDockyardFacility.smAddress.pmCity)}"
							update="dockyardDist,dockyardCity" />

					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						id="dockyardDist"
						value="#{backingBean.managedBean.selectedDockyardFacility.smAddress.pmDistrict.districtId}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="dockyardDist"
							value="#{backingBean.managedBean.dockFacilityDistricts}"
							itemValue="#{dockyardDist.districtId}"
							itemLabel="#{dockyardDist.districtName}" />
						<p:ajax event="change"
							listener="#{backingBean.populateCitiesByDistrict(backingBean.managedBean.selectedDockyardFacility.smAddress.pmDistrict.districtId, 
								SupplierManagementConst.SM_DOCKYARD_FACILITY_PANEL,
								backingBean.managedBean.selectedDockyardFacility.smAddress.pmCity)}"
							update="dockyardCity" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						id="dockyardCity"
						value="#{backingBean.managedBean.selectedDockyardFacility.smAddress.pmCity.cityId}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="dockyardCity"
							value="#{backingBean.managedBean.dockFacilityCities}"
							itemValue="#{dockyardCity.cityId}"
							itemLabel="#{dockyardCity.cityName}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedDockyardFacility.smAddress.postcode}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Phone NO." /></td>
				<td><p:inputText value=" --TBC--" size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Fax NO." /></td>
				<td><p:inputText value=" --TBC--" size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="*Area(Sq Ft) *" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedDockyardFacility.areaSquareFeet}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Ownership Type" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedDockyardFacility.ownershipType}">
						<f:selectItem itemLabel="Rent " itemValue="R" />
						<f:selectItem itemLabel="Own" itemValue="O" />
						<p:ajax event="change" listener="#{backingBean.dockOwnerTypeSel}"
							update="docPan,docPanLbl" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputPanel id="docPanLbl">
						<p:outputLabel value="* Price (RM.)"
							rendered="#{backingBean.managedBean.selectedDockyardFacility.ownershipType eq 'O'}" />
						<p:outputLabel value="* Rent (RM.)"
							rendered="#{backingBean.managedBean.selectedDockyardFacility.ownershipType eq 'R'}" />
					</p:outputPanel></td>
				<td><p:outputPanel id="docPan">
						<ui:fragment
							rendered="#{backingBean.managedBean.selectedDockyardFacility.ownershipType eq 'O'}">
							<p:inputText
								value="#{backingBean.managedBean.selectedDockyardFacility.purchasePrice}"
								size="20" />
						</ui:fragment>
						<ui:fragment
							rendered="#{backingBean.managedBean.selectedDockyardFacility.ownershipType eq 'R'}">
							<p:inputText
								value="#{backingBean.managedBean.selectedDockyardFacility.rentalRate}"
								size="20" />
						</ui:fragment>
					</p:outputPanel></td>
			</tr>

			<tr>
				<td><p:outputLabel value="
								Owner Name *" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedDockyardFacility.ownerName}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="*Associated Category" /></td>

				<td><p:selectManyMenu showCheckbox="true"
						style="width : 150px;">
						<f:selectItems
							value="#{backingBean.managedBean.smAppl.smSupplierCategories}"
							var="catBean"
							itemLabel="#{catBean.pmCategoryL3.categoryL3Code} -  #{catBean.pmCategoryL3.categoryName}"
							itemValue="#{catBean.supplierCategoryId}" />
					</p:selectManyMenu></td>

			</tr>
		</table>
		<br />
		<div align="right">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdateDockYardToSmAppl}" type="submit"
				partialSubmit="true" process="dockYardDialog"
				oncomplete="dockYardDialog.hide();" update=":form:tt:docDt" />
			<p:commandButton value="Cancel" onclick="dockYardDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
