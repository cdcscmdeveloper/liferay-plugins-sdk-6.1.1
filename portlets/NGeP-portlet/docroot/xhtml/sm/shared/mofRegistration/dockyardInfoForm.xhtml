<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.dockyard.details']}" toggleable="true"
		id="smDocDtPanel" rendered="#{backingBean.managedBean.showDockyardPanel}">
		<p:outputPanel rendered="#{backingBean.managedBean.showDockyardPanel}">
			<p:dataTable var="doc" widgetVar="smFacilityDockDtWidVar"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.applDockyardFacilities}"
				selection="#{backingBean.managedBean.selectedDockyardFacilities}"
				rowKey="#{doc}" rowIndexVar="index" id="docDt">
				<ac:paginator for="docDt" />
				<p:column selectionMode="multiple" width="1%" rendered="#{not empty backingBean.managedBean.applDockyardFacilities}"/>

				<p:column headerText="#{lbl['lbl.sm.facility.dockyard.name']}">
					<h:outputText value="#{doc.facilityName}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.category']}">
					<ui:repeat var="catFac" value="#{doc.smSupplierCategoryFacilities}">
						<h:outputText value="#{catFac.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}
									#{catFac.pmCategoryL3.pmCategoryL2.categoryL2Code}
									#{catFac.pmCategoryL3.categoryL3Code}
								 	(#{catFac.pmCategoryL3.categoryName})" 
							style="float: left;white-space: normal;" /><br />
					</ui:repeat>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.dockyard.address']}"
					style="width :60%;white-space : normal">
					<h:outputText value="#{backingBean.getFullAddress(doc.smAddress)}"
						style="float : left" />
						
					<br />
					<script>
					
				      function getDocAddress2(addr1, addr2, addr3, addr4, cityName, districtName, stateName, countryName) {

				    	  var address = addr1 + addr2 + addr3 + addr4 + cityName + ',' + districtName + ',' + stateName + ',' + countryName;

				      	return address;
				      }
					
					</script>

					<ac:gmapInput id="gmapInput" 
						latitude="#{doc.smAddress.mapLatitude}" 
						longitude="#{doc.smAddress.mapLongitude}" 
						address="getDocAddress2('#{doc.smAddress.address1}', '#{doc.smAddress.address2}', '#{doc.smAddress.address3}', '#{doc.smAddress.address4}', '#{doc.smAddress.pmCity.cityName}', '#{doc.smAddress.pmDistrict.districtName}', '#{doc.smAddress.pmState.stateName}', '#{doc.smAddress.pmCountry.countryName}')"
						showButton="true"
						disabled="false" />
						
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.action']}" style="text-align: center  !important;">
					<p:commandLink action="#{backingBean.assignSelDockyard(doc)}"
						process="@this" partialSubmit="true"
						update=":form:tt:dockYardDialog" style="padding-right:5px"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}" process="@this"
					partialSubmit="true" action="#{backingBean.assignNewDockyardBean}"
					update=":form:tt:dockYardDialog" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					process="smDocDtPanel" partialSubmit="true"
					update=":form:tt:docDt,@this" 
					id="delDockyardBtnId" disabled="#{empty backingBean.managedBean.applDockyardFacilities}"
					oncomplete="dockyardDeletePopUp.show()" />
			</div>
			<br />
		</p:outputPanel>
		<p:outputPanel
			rendered="#{!backingBean.managedBean.showDockyardPanel}"
			layout="block">

			<table style="width: 100%">
				<tr>
					<td><h:outputText style="float:left"
							value="#{lbl['lbl.sm.dockyard.notApplicable']}" /></td>
				</tr>
			</table>

		</p:outputPanel>

	</p:panel>
	<p:dialog width="500px" height="500px"
		header="#{lbl['lbl.sm.dockyard.information']}"
		widgetVar="dockYardDialog" resizable="false" showEffect="fade"
		closable="false" hideEffect="fade" modal="true" id="dockYardDialog">
		
		<p:outputPanel id="dockYardBlockPanelId" layout="block">
			<p:messages id="dockYardDialogMsg" showSummary="false"
				showDetail="true" autoUpdate="true" closable="true" />
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.facility.dockyard.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText size="35"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.facility.name']}" maxlength="50"
							id="smFacDockName"
							value="#{backingBean.managedBean.selectedDockyardFacility.facilityName}" />
						<p:message id="smFacDockNameMsg" for="smFacDockName"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.category']}" /> 
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td>
						<p:selectManyMenu showCheckbox="true"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.category']}" id="dockyardCategoryId"
							value="#{backingBean.managedBean.selectedSuppCategoryFacilityIds}"
							style="height:100px;width: 200px;">
							<f:selectItems
								value="#{backingBean.getSelectedCategoryItemsByFacilityType(backingBean.managedBean.selectedDockyardFacility.facilityType)}" />
						</p:selectManyMenu>
						<p:message id="dockyardCategoryIdMsg" for="dockyardCategoryId"
							showSummary="true" showDetail="false" display="icon" />
					</td>
				</tr>
				
				<ac:smFacilityAddress backingBean="#{backingBean}" smAddress="#{backingBean.managedBean.selectedDockyardFacility.smAddress}"
					countryItems="#{backingBean.managedBean.countryItems}" stateItems="#{backingBean.managedBean.dockFacilityStates}"
					districtItems="#{backingBean.managedBean.dockFacilityDistricts}" cityItems="#{backingBean.managedBean.dockFacilityCities}" 
					facilityPanel="#{SupplierManagementConst.SM_DOCKYARD_FACILITY_PANEL}" panelId="dockyardAddrId"/>
					
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td>
						<ac:phone id="smDockPhnNo" isMobile="false" label="#{lbl['lbl.sm.phoneno']}"
						countryCode="#{backingBean.managedBean.selectedDockyardFacility.phoneCountry}" 
						areaCode="#{backingBean.managedBean.selectedDockyardFacility.phoneArea}" 
						number="#{backingBean.managedBean.selectedDockyardFacility.phoneNo}"  
						validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
					<td>
						<ac:phone id="smDockFaxNo" isMobile="false" label="#{lbl['lbl.sm.faxno']}"
						countryCode="#{backingBean.managedBean.selectedDockyardFacility.faxCountry}" 
						areaCode="#{backingBean.managedBean.selectedDockyardFacility.faxArea}" 
						number="#{backingBean.managedBean.selectedDockyardFacility.faxNo}"  
						validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.spec.area.feat']}" /></td>
					<td><p:inputText id="smDockAreaSq"
							value="#{backingBean.managedBean.selectedDockyardFacility.areaSquareFeet}"
							size="35">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText> <p:message id="smDockAreaSqMsg" for="smDockAreaSq"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.facility.ownerType']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneRadio
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.facility.ownerType']}" id="smDockOwnerType"
							value="#{backingBean.managedBean.selectedDockyardFacility.ownershipType}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.facility.rent']}"
								itemValue="R" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.facility.own']}"
								itemValue="O" />
							<p:ajax event="change" listener="#{backingBean.dockOwnerTypeSel}"
								update="docPan,docPanLbl" />
						</p:selectOneRadio> <p:message id="smDockOwnerTypeMsg" for="smDockOwnerType"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputPanel id="docPanLbl">
							<p:outputLabel value="#{lbl['lbl.cm.price']}"
								rendered="#{backingBean.managedBean.selectedDockyardFacility.ownershipType eq 'O'}" />
							<p:outputLabel value="#{lbl['lbl.sm.facility.rent.rm']}"
								rendered="#{backingBean.managedBean.selectedDockyardFacility.ownershipType eq 'R'}" />
							<p:outputLabel value="*" styleClass="mandatory"
								rendered="#{backingBean.managedBean.selectedDockyardFacility.ownershipType eq 'O' or 
								backingBean.managedBean.selectedDockyardFacility.ownershipType eq 'R'}" />
						</p:outputPanel></td>
					<td><p:outputPanel id="docPan">
							<ui:fragment
								rendered="#{backingBean.managedBean.selectedDockyardFacility.ownershipType eq 'O'}">
								<p:inputText id="smDocPrice"
									disabled="#{!backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.cm.price']}" maxlength="17"
									validatorMessage="#{lbl['lbl.cm.price']} - #{lbl['lbl.sm.rangeAmt.validMsg']}"
									value="#{backingBean.managedBean.selectedDockyardFacility.purchasePrice}"
									size="20"
									required="#{backingBean.managedBean.selectedDockyardFacility.ownershipType eq 'O'}">
									<f:validateDoubleRange
										minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
										maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
									<f:convertNumber
										pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
									<p:ajax process="@this" partialSubmit="true"
										update="@this,smDocPriceMsg" />
								</p:inputText>
								<p:message id="smDocPriceMsg" for="smDocPrice" showSummary="true"
									showDetail="false" display="icon" />
							</ui:fragment>
							<ui:fragment
								rendered="#{backingBean.managedBean.selectedDockyardFacility.ownershipType eq 'R'}">
								<p:inputText id="smDocRent"
									disabled="#{!backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.facility.rent.rm']}" maxlength="17"
									validatorMessage="#{lbl['lbl.sm.facility.rent.rm']} - #{lbl['lbl.sm.rangeAmt.validMsg']}"
									value="#{backingBean.managedBean.selectedDockyardFacility.rentalRate}"
									size="20"
									required="#{backingBean.managedBean.selectedDockyardFacility.ownershipType eq 'R'}">
									<f:validateDoubleRange
										minimum="#{SupplierManagementConst.MIN_AMT_RANGE}"
										maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" />
									<f:convertNumber
										pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
									<p:ajax process="@this" partialSubmit="true"
										update="@this,smDocRentMsg" />
								</p:inputText>
								<p:message id="smDocRentMsg" for="smDocRent" showSummary="true"
									showDetail="false" display="icon" />
							</ui:fragment>
						</p:outputPanel></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.ownername']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="smDockOwnerName"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.ownername']}"
							value="#{backingBean.managedBean.selectedDockyardFacility.ownerName}"
							size="35" /> <p:message id="smDockOwnerNameMsg"
							for="smDockOwnerName" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
	
			</table>
			<br />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.save']}"
					action="#{backingBean.addOrUpdateDockYardToSmAppl}"
					partialSubmit="true" process="dockYardDialog"
					onclick="dockyardBlockWidget.show();" oncomplete="dockyardBlockWidget.hide();"
					update=":form:tt:docDt, @([id$=Msg]),:#{p:component('delDockyardBtnId')}" />
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
					process="@this" partialSubmit="true"
					action="#{backingBean.cancelDockyardSaveorUpdate}"
					update=":form:tt:dockYardDialog, @([id$=Msg])" />
			</div>
			<p:blockUI block="dockYardBlockPanelId" widgetVar="dockyardBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
		</p:outputPanel>
	</p:dialog>
	
	<ac:confirmationPopup id="dockyardDeletePopUpId"
		widget="dockyardDeletePopUp"
		okAction="backingBean.deleteSelectedDocks"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update=":form:tt:docDt, @([id$=Msg]),:#{p:component('delDockyardBtnId')}"/>
</ui:composition>
