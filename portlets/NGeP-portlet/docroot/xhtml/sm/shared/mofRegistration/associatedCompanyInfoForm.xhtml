<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.assocCmpny.panHdr']}" toggleable="true"
		id="assocPanel">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.associateVerified}"
							id="poAssocVer">
							<p:ajax update=":form:tt:assocInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.associateVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.associateVerified}"
							id="apprAssocVer">
							<p:ajax update=":form:tt:assocInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.associateVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="assocInfPan">
			<p:blockUI block=":form:tt:assocInfPan" widgetVar="buiPoAssoc"
				id="poAssocBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.associateVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.associateVerified : false)}" />

			<p:dataTable var="assocBean"
				value="#{backingBean.managedBean.smAppl.smAssociateCompanies}"
				selection="#{backingBean.managedBean.selectedAssocCompanies}"
				rowKey="#{assocBean}" rowIndexVar="index" id="asoc">
				<ac:paginator for="asoc" />

				<p:column selectionMode="multiple" width="5%" />

				<p:column headerText="#{lbl['lbl.sm.assocCmpny.companyName']}">
					<h:outputText value="#{assocBean.companyName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.companyaddress']}">
					<h:outputText
						value="#{assocBean.smAddress.address1},#{assocBean.smAddress.address2}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink update=":form:tt:asDisp"
						action="#{backingBean.assignSelAssoc(assocBean)}"
						oncomplete="assocDialog.show();">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png"
							style="margin-right:2px;" />
					</p:commandLink>

				</p:column>


			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					action="#{backingBean.assignNewAssocBean}"
					oncomplete="assocDialog.show();" update=":form:tt:asDisp" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']} "
					action="#{backingBean.deleteSelectedAssocCompanies}"
					update=":form:tt:asoc" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.associateRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.associateRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.associateRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="500px" height="435px"
		header="#{lbl['lbl.sm.assocCmpny.assocDiaHdr']}" id="asDisp"
		widgetVar="assocDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		<!-- <p:panel header="Associated Company Details"> -->
		<p:messages id="suppAssocCompMsg" showSummary="true" showDetail="true"
			autoUpdate="true" closable="true" />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel
						value="*#{lbl['lbl.sm.assocCmpny.companyName']} " /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedAssocCompany.companyName}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.assocCmpny.regNo']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedAssocCompany.regNo}"
						size="35" maxlength="20" /></td>
			</tr>
			<!-- <tr>
				<td><p:outputLabel value="* MOF NO." /></td>
				<td><p:inputText readonly="true"
						value="Read Only  - Autopopulated as per ROC/ROB/ROS No."
						title="This field TBC" size="35" /></td>
			</tr> -->
			<tr>
				<!-- 	<td><p:outputLabel value="Share Holding *" /></td>
					<td><p:inputText /> <p:outputLabel value="%" /></td> -->
				<td><p:outputLabel
						value="#{lbl['lbl.sm.assocCmpny.shrHolding']} " /></td>
				<td><p:selectOneRadio id="shopt"
						value="#{backingBean.managedBean.selectedAssocCompany.isShareholding}">
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.companyaddress']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedAssocCompany.smAddress.address1}"
						size="35" /></td>
			</tr>

			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedAssocCompany.smAddress.address2}"
						size="35" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedAssocCompany.smAddress.address3}"
						size="35" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedAssocCompany.smAddress.address4}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="*#{lbl['lbl.sm.country']}" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedAssocCompany.smAddress.pmCountry.countryId}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="assCountry"
							value="#{backingBean.managedBean.countryLs}"
							itemValue="#{assCountry.countryId}"
							itemLabel="#{assCountry.countryName}" />
						<p:ajax event="change"
							listener="#{backingBean.populateStatesByCountry(backingBean.managedBean.selectedAssocCompany.smAddress.pmCountry.countryId, 
								SupplierManagementConst.SM_ASSOC_COMPANY_PANEL,
								backingBean.managedBean.selectedAssocCompany.smAddress.pmState,
								backingBean.managedBean.selectedAssocCompany.smAddress.pmDistrict,
								backingBean.managedBean.selectedAssocCompany.smAddress.pmCity)}"
							update="assocState,assocDist,assocCity" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						value="#{backingBean.managedBean.selectedAssocCompany.smAddress.pmState.stateId}"
						id="assocState">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="assState"
							value="#{backingBean.managedBean.assocCompanyStates}"
							itemValue="#{assState.stateId}" itemLabel="#{assState.stateName}" />
						<p:ajax event="change"
							listener="#{backingBean.populateDistrictsByState(backingBean.managedBean.selectedAssocCompany.smAddress.pmState.stateId, 
								SupplierManagementConst.SM_ASSOC_COMPANY_PANEL,
								backingBean.managedBean.selectedAssocCompany.smAddress.pmDistrict,
								backingBean.managedBean.selectedAssocCompany.smAddress.pmCity)}"
							update="assocDist,assocCity" />

					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>

				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						id="assocDist"
						value="#{backingBean.managedBean.selectedAssocCompany.smAddress.pmDistrict.districtId}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="assDist"
							value="#{backingBean.managedBean.assocCompanyDistricts}"
							itemValue="#{assDist.districtId}"
							itemLabel="#{assDist.districtName}" />
						<p:ajax event="change"
							listener="#{backingBean.populateCitiesByDistrict(backingBean.managedBean.selectedAssocCompany.smAddress.pmDistrict.districtId, 
								SupplierManagementConst.SM_ASSOC_COMPANY_PANEL,
								backingBean.managedBean.selectedAssocCompany.smAddress.pmCity)}"
							update="assocCity" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						id="assocCity"
						value="#{backingBean.managedBean.selectedAssocCompany.smAddress.pmCity.cityId}">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="assCity"
							value="#{backingBean.managedBean.assocCompanyCities}"
							itemValue="#{assCity.cityId}" itemLabel="#{assCity.cityName}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedAssocCompany.smAddress.postcode}"
						size="35" maxlength="10" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.phoneno']}"
						id="assocCompanyPhnNo"
						value="#{backingBean.managedBean.selectedAssocCompany.phoneNo}"
						size="35" maxlength="20">
					</p:inputText> <p:message id="assocCompanyPhnNoMsg" for="assocCompanyPhnNo"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.faxno']}"
						id="assocCompanyFaxNo"
						value="#{backingBean.managedBean.selectedAssocCompany.faxNo}"
						size="35" maxlength="20">
					</p:inputText> <p:message id="assocCompanyFaxNoMsg" for="assocCompanyFaxNo"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

		</table>
		<!-- </p:panel> -->
		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				action="#{backingBean.addOrUpdateAssocToSmAppl}" type="submit"
				partialSubmit="true" process="asDisp" update=":form:tt:asoc" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				onclick="assocDialog.hide();" immediate="true" />
		</div>
	</p:dialog>
</ui:composition>
