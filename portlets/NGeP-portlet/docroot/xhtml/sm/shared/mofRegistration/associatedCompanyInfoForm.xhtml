<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel toggleable="true" id="assocPanel">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sm.assocCmpny.panHdr']}" />
			<p:graphicImage id="assocPanelTipImg" value="/css/images/design/tooltips.png" 
			style="padding-left : 10px;" />
			<p:tooltip id="assocPaneltt" for="assocPanelTipImg">
				<p:inputTextarea escape="false" readonly="true" disabled="true"
					rows="3" cols="50"
					value="#{lbl['lbl.sm.assocCmpny.panHdrToolTip']}" />
			</p:tooltip>
		</f:facet>
		<table style="width: 350px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.associateVerified}"
							id="poAssocVer">
							<p:ajax update=":form:tt:assocInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:assocInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.associateVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.associateVerified}"
							id="apprAssocVer">
							<p:ajax update=":form:tt:assocInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:assocInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.associateVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>

		<p:outputPanel id="assocInfPan" layout="block">
			<p:blockUI block=":form:tt:assocInfPan" widgetVar="buiPoAssoc"
				id="poAssocBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.associateVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.associateVerified : false)}" />

			<p:dataTable var="assocBean" widgetVar="assocDtWidVar"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.smAppl.smAssociateCompanies}"
				selection="#{backingBean.managedBean.selectedAssocCompanies}"
				rowKey="#{assocBean}" rowIndexVar="index" id="asoc">
				<ac:paginator for="asoc" />

				<p:column selectionMode="multiple" width="1%" rendered="#{not empty backingBean.managedBean.smAppl.smAssociateCompanies}"/>

				<p:column headerText="#{lbl['lbl.sm.assocCmpny.companyName']}">
					<h:outputText value="#{assocBean.companyName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.companyaddress']}"
					style="width: 60%;white-space: normal;">
					<h:outputText
						value="#{backingBean.getFullAddress(assocBean.smAddress)}"
						style="float : left" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink update=":form:tt:asDisp"
						action="#{backingBean.assignSelAssoc(assocBean)}"
						partialSubmit="true" process="@this" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}"
							style="margin-right:2px;" />
					</p:commandLink>
					<ac:smFieldChangeTableAlert object="#{assocBean}" />
				</p:column>


			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					action="#{backingBean.assignNewAssocBean}" partialSubmit="true"
					process="@this" update=":form:tt:asDisp" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					id="delAssocBtnId" disabled="#{empty backingBean.managedBean.smAppl.smAssociateCompanies}"
					action="#{backingBean.deleteSelectedAssocCompanies}"
					partialSubmit="true" process="assocInfPan" update=":form:tt:asoc,@this" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="assocCmpnyPORmrks"
								validatorMessage="#{lbl['lbl.sm.assocCmpny.panHdr']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.associateRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="assocCmpnyPORmrksMsg" for="assocCmpnyPORmrks"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.associateRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="assocCompanyAprvrRmrk"
								validatorMessage="#{lbl['lbl.sm.assocCmpny.panHdr']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.associateRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="assocCompanyAprvrRmrkMsg"
								for="assocCompanyAprvrRmrk" showSummary="true"
								showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="500px" height="435px" closable="false"
		header="#{lbl['lbl.sm.assocCmpny.assocDiaHdr']}" id="asDisp"
		widgetVar="assocDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		<!-- <p:panel header="Associated Company Details"> -->
		
		<p:outputPanel layout="block" id="assocBlockPanel">
			<p:messages id="suppAssocCompMessage" showSummary="false"
				showDetail="true" autoUpdate="true" closable="true" />
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.assocCmpny.companyName']} " /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="100"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.assocCmpny.companyName']}"
							id="asocCompCmpName"
							value="#{backingBean.managedBean.selectedAssocCompany.companyName}"
							size="35" /> 
							<ac:smFieldChangeAlert 
									isShow="#{backingBean.managedBean.showFieldChanges 
									and not empty backingBean.managedBean.selectedAssocCompany.associateCompanyId}"
									oriValue="#{backingBean.managedBean.latestAssocCompany.companyName}" 
									currValue="#{backingBean.managedBean.selectedAssocCompany.companyName}" 
									alertValue="#{backingBean.managedBean.latestAssocCompany.companyName}"/>
							<p:message id="asocCompCmpNameMsg"
							for="asocCompCmpName" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.assocCmpny.regNo']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText
							required="#{backingBean.managedBean.valueReqd}"
							label=" #{lbl['lbl.sm.assocCmpny.regNo']}" id="asocRegNo"
							value="#{backingBean.managedBean.selectedAssocCompany.regNo}"
							size="35" maxlength="20" >
							<p:ajax event="blur" process="@this" update="assocMofNoId" partialSubmit="true"
								listener="#{backingBean.onBlurSetMofNo(backingBean.managedBean.selectedAssocCompany)}"/>
						</p:inputText> 
						<p:graphicImage id="asocRegNoImg"
							value="/css/images/design/tooltips.png" 
							style="padding-left : 10px;" rendered="false" /> 
						<p:tooltip
						id="asocRegNoImgtt" for="asocRegNoImg">
						<p:inputTextarea escape="false" readonly="true" disabled="true"
							rows="3" cols="50"
							value="#{lbl['lbl.sm.assocCmpny.regNoToolTip']}" />
						</p:tooltip>
						<p:message id="asocRegNoMsg" for="asocRegNo" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.mofNo']}" /></td>
					<td>
						<p:inputText value="#{backingBean.managedBean.selectedAssocCompany.mofNo}"
							readonly="true" size="35" id="assocMofNoId"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.companyaddress']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText maxlength="35"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.companyaddress']}" id="assocCompCmpAddr"
							value="#{backingBean.managedBean.selectedAssocCompany.smAddress.address1}"
							size="35" /> 
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges 
									and not empty backingBean.managedBean.selectedAssocCompany.associateCompanyId}"
								oriValue="#{backingBean.managedBean.latestAssocCompany.smAddress.address1}" 
								currValue="#{backingBean.managedBean.selectedAssocCompany.smAddress.address1}" 
								alertValue="#{backingBean.managedBean.latestAssocCompany.smAddress.address1}"/>
							<p:message id="assocCompCmpAddrMsg"
							for="assocCompCmpAddr" showSummary="true" showDetail="false"
							display="icon" /></td>
				</tr>
	
				<tr>
					<td></td>
					<td><p:inputText maxlength="35"
							value="#{backingBean.managedBean.selectedAssocCompany.smAddress.address2}"
							size="35" />
						<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges 
									and not empty backingBean.managedBean.selectedAssocCompany.associateCompanyId}"
								oriValue="#{backingBean.managedBean.latestAssocCompany.smAddress.address2}" 
								currValue="#{backingBean.managedBean.selectedAssocCompany.smAddress.address2}" 
								alertValue="#{backingBean.managedBean.latestAssocCompany.smAddress.address2}"/>
					</td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText maxlength="35"
							value="#{backingBean.managedBean.selectedAssocCompany.smAddress.address3}"
							size="35" />
						<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges 
									and not empty backingBean.managedBean.selectedAssocCompany.associateCompanyId}"
								oriValue="#{backingBean.managedBean.latestAssocCompany.smAddress.address3}" 
								currValue="#{backingBean.managedBean.selectedAssocCompany.smAddress.address3}" 
								alertValue="#{backingBean.managedBean.latestAssocCompany.smAddress.address3}"/>
					</td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText maxlength="35"
							value="#{backingBean.managedBean.selectedAssocCompany.smAddress.address4}"
							size="35" />
						<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges 
									and not empty backingBean.managedBean.selectedAssocCompany.associateCompanyId}"
								oriValue="#{backingBean.managedBean.latestAssocCompany.smAddress.address4}" 
								currValue="#{backingBean.managedBean.selectedAssocCompany.smAddress.address4}" 
								alertValue="#{backingBean.managedBean.latestAssocCompany.smAddress.address4}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.country']}" id="asocCompCntrId"
							value="#{backingBean.managedBean.selectedAssocCompany.smAddress.countryId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="assCountry"
								value="#{backingBean.managedBean.countryItems}" />
							<p:ajax event="change" process="@this"
								listener="#{backingBean.onChangeCountry(backingBean.managedBean.selectedAssocCompany.smAddress,SupplierManagementConst.SM_ASSOC_COMPANY_PANEL)}"
								update="assocState,assocDist,assocCity,postCodeAssocPanelId" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges 
								and not empty backingBean.managedBean.selectedAssocCompany.associateCompanyId}"
							oriValue="#{backingBean.managedBean.latestAssocCompany.smAddress.pmCountry.countryId}" 
							currValue="#{backingBean.managedBean.selectedAssocCompany.smAddress.pmCountry.countryId}" 
							alertValue="#{(not empty backingBean.managedBean.latestAssocCompany and 
							 	not empty backingBean.managedBean.latestAssocCompany.smAddress) ?
								backingBean.getCountryLabelById(backingBean.managedBean.latestAssocCompany.smAddress.pmCountry.countryId)
								: lbl['lbl.txt.na']}"/>
						<p:message id="asocCompCntrIdMsg" for="asocCompCntrId"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
					<p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.state']}"
							value="#{backingBean.managedBean.selectedAssocCompany.smAddress.stateId}"
							id="assocState">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="assState"
								value="#{backingBean.managedBean.assocCompanyStates}"/>
							<p:ajax event="change" process="@this"
								listener="#{backingBean.onChangeState(backingBean.managedBean.selectedAssocCompany.smAddress,SupplierManagementConst.SM_ASSOC_COMPANY_PANEL)}"
								update="assocDist,assocCity" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges 
									and not empty backingBean.managedBean.selectedAssocCompany.associateCompanyId}"
							oriValue="#{backingBean.managedBean.latestAssocCompany.smAddress.pmState.stateId}" 
							currValue="#{backingBean.managedBean.selectedAssocCompany.smAddress.pmState.stateId}" 
							alertValue="#{(not empty backingBean.managedBean.latestAssocCompany and 
							 	not empty backingBean.managedBean.latestAssocCompany.smAddress) ?
								backingBean.getStateLabelById(backingBean.managedBean.latestAssocCompany.smAddress.pmState.stateId)
								: lbl['lbl.txt.na']}"/>
						<p:message id="assocStateMsg" for="assocState" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
	
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							id="assocDist" required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.district']}"
							value="#{backingBean.managedBean.selectedAssocCompany.smAddress.districtId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="assDist"
								value="#{backingBean.managedBean.assocCompanyDistricts}" />
							<p:ajax event="change" process="@this"
								listener="#{backingBean.onChangeDistrict(backingBean.managedBean.selectedAssocCompany.smAddress,SupplierManagementConst.SM_ASSOC_COMPANY_PANEL)}"
								update="assocCity" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges 
									and not empty backingBean.managedBean.selectedAssocCompany.associateCompanyId}"
							oriValue="#{backingBean.managedBean.latestAssocCompany.smAddress.pmDistrict.districtId}" 
							currValue="#{backingBean.managedBean.selectedAssocCompany.smAddress.pmDistrict.districtId}" 
							alertValue="#{(not empty backingBean.managedBean.latestAssocCompany and 
							 	not empty backingBean.managedBean.latestAssocCompany.smAddress) ?
								backingBean.getDistrictLabelById(backingBean.managedBean.latestAssocCompany.smAddress.pmDistrict.districtId)
								: lbl['lbl.txt.na']}"/>
						<p:message id="assocDistMsg" for="assocDist" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							id="assocCity" required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.towncity']}"
							value="#{backingBean.managedBean.selectedAssocCompany.smAddress.cityId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="assCity"
								value="#{backingBean.managedBean.assocCompanyCities}" />
							<p:ajax event="change" process="@this"
								listener="#{backingBean.onChangeCity(backingBean.managedBean.selectedAssocCompany.smAddress,SupplierManagementConst.SM_ASSOC_COMPANY_PANEL)}"
								update="assocCity" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges 
									and not empty backingBean.managedBean.selectedAssocCompany.associateCompanyId}"
							oriValue="#{backingBean.managedBean.latestAssocCompany.smAddress.pmCity.cityId}" 
							currValue="#{backingBean.managedBean.selectedAssocCompany.smAddress.pmCity.cityId}" 
							alertValue="#{(not empty backingBean.managedBean.latestAssocCompany and 
							 not empty backingBean.managedBean.latestAssocCompany.smAddress) ?
							 backingBean.getCityLabelById(backingBean.managedBean.latestAssocCompany.smAddress.pmCity.cityId) 
							 : lbl['lbl.txt.na']}"/>
						<p:message id="assocCityMsg" for="assocCity" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:outputPanel id="postCodeAssocPanelId">
							<p:outputPanel
								rendered="#{backingBean.managedBean.selectedAssocCompany.smAddress.countryId==backingBean.managedBean.myCountryId}">
								<p:inputText maxlength="5"
									required="#{backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.postcode']}" id="assocCmpyPostCodeMy"
									value="#{backingBean.managedBean.selectedAssocCompany.smAddress.postcode}"
									validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
									size="35">
									<f:validator validatorId="postcodeValidator" />
								</p:inputText>
								<ac:smFieldChangeAlert 
									isShow="#{backingBean.managedBean.showFieldChanges 
									and not empty backingBean.managedBean.selectedAssocCompany.associateCompanyId}"
									oriValue="#{backingBean.managedBean.latestAssocCompany.smAddress.postcode}" 
									currValue="#{backingBean.managedBean.selectedAssocCompany.smAddress.postcode}" 
									alertValue="#{backingBean.managedBean.latestAssocCompany.smAddress.postcode}"/>
								<p:message id="assocCmpyPostCodeMyMsg" for="assocCmpyPostCodeMy"
									showSummary="true" showDetail="false" display="icon" />
							</p:outputPanel>
							<p:outputPanel
								rendered="#{backingBean.managedBean.selectedAssocCompany.smAddress.countryId!=backingBean.managedBean.myCountryId}">
								<p:inputText maxlength="10"
									required="#{backingBean.managedBean.valueReqd}"
									label="#{lbl['lbl.sm.postcode']}" id="assocCmpyPostCodeForeign"
									value="#{backingBean.managedBean.selectedAssocCompany.smAddress.postcode}"
									size="35">
								</p:inputText>
								<ac:smFieldChangeAlert 
									isShow="#{backingBean.managedBean.showFieldChanges 
									and not empty backingBean.managedBean.selectedAssocCompany.associateCompanyId}"
									oriValue="#{backingBean.managedBean.latestAssocCompany.smAddress.postcode}" 
									currValue="#{backingBean.managedBean.selectedAssocCompany.smAddress.postcode}" 
									alertValue="#{backingBean.managedBean.latestAssocCompany.smAddress.postcode}"/>
								<p:message id="assocCmpyPostCodeForeignMsg"
									for="assocCmpyPostCodeForeign" showSummary="true"
									showDetail="false" display="icon" />
							</p:outputPanel>
						</p:outputPanel></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td>
						<ac:phone id="assocCompanyPhnNo" isMobile="false" label="#{lbl['lbl.sm.phoneno']}"
						countryCode="#{backingBean.managedBean.selectedAssocCompany.phoneCountry}" 
						areaCode="#{backingBean.managedBean.selectedAssocCompany.phoneArea}" 
						number="#{backingBean.managedBean.selectedAssocCompany.phoneNo}"  
						validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" />
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges 
									and not empty backingBean.managedBean.selectedAssocCompany.associateCompanyId}"
							oriValue="#{backingBean.managedBean.latestAssocCompany.phoneNo}" 
							currValue="#{backingBean.managedBean.selectedAssocCompany.phoneNo}" 
							alertValue="#{backingBean.managedBean.latestAssocCompany.phoneNo}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
					<td>
						<ac:phone id="assocCompanyFaxNo" isMobile="false" label="#{lbl['lbl.sm.faxno']}"
						countryCode="#{backingBean.managedBean.selectedAssocCompany.faxCountry}" 
						areaCode="#{backingBean.managedBean.selectedAssocCompany.faxArea}" 
						number="#{backingBean.managedBean.selectedAssocCompany.faxNo}"
