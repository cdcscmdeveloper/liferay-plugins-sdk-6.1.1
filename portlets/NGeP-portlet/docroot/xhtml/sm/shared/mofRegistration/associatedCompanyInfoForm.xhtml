<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel
		header="Associated Companies (Read Only For ROC - i.e. data auto pop up by SSM and can perform add /edit/delete operations)"
		toggleable="true">
		<div>
			<p:outputLabel value=" Section Verified : "
				title="For PO / Approver highlight the verified section " />
			<p:selectBooleanCheckbox />
		</div>
		<br />
		<p:dataTable var="utilBean"
			value="#{mofRegistrationBackingBean.utilList}"
			selection="#{mofRegistrationBackingBean.managedBean.selectedUtilList}"
			rowKey="#{utilBean.seqNo}" rowIndexVar="index">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<p:outputLabel value="1" />
			</p:column>
			<p:column headerText="Company Name">
				<p:commandLink value="CDC Sdn Bhd" onclick="assocDialog.show();" />
			</p:column>

			<p:column headerText="Address">
				<p:outputLabel
					value="Block Belatuk,Cyber View Garden,Cyber Jaya, Selangor,Malaysia" />
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Associated Company"
				onclick="assocDialog.show();" />
			<p:commandButton value="Delete Associate(s)" />

		</div>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog width="400px" header="Associated Company Page"
		widgetVar="assocDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		<p:panel header="Associated Company Details">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Company Name *" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="ROC/ROB/ROS No. *" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="MOF Registration No. *" /></td>
					<td><p:inputText readonly="true"
							value="Read Only  - Autopopulated as per ROC/ROB/ROS No."
							title="This field TBC" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Share Holding *" /></td>
					<td><p:inputText /> <p:outputLabel value="%" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Address" /></td>
					<td><p:inputText /></td>
				</tr>

				<tr>
					<td></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Country *" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="-- Select One -- " itemValue="" />
							<f:selectItem itemLabel="Malaysia" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:inputText /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Phone No." /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Fax No." /></td>
					<td><p:inputText /></td>
				</tr>

			</table>
		</p:panel>
		<br />
		<div align="center">
			<p:commandButton value="Save" onclick="assocDialog.hide();" />
			<p:commandButton value="Cancel" onclick="assocDialog.hide();" />
		</div>
	</p:dialog>
</ui:composition>
