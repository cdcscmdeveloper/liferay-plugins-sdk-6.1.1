<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.catCodes.panHdr']}" toggleable="true">

		<br />
		<p:panel id="catCodeInfPan">
			<c:if test="#{backingBean.managedBean.overLappedCategoryExists}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel escape="false"
								value="#{backingBean.managedBean.overLappedCategoryMsg}"
								style="color: red;font-weight: bold;float:left;" /></td>
					</tr>
				</table>
			</c:if>
			<c:choose>
				<c:when
					test="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser  and backingBean.managedBean.smAppl.supplierType ne 'J'}">
					<table>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.catType']}" /></td>
							<td><p:selectOneRadio
									value="#{backingBean.managedBean.smAppl.applCategoryType}">
									<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.catTypeNrm']}"
										itemValue="N" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.catTypeSpl']}"
										itemValue="S"
										itemDisabled="#{backingBean.managedBean.basicCompanyFacility.facilityType eq 'H'}" />
									<p:ajax event="change" oncomplete="typeConfirmation.show()"
										listener="#{backingBean.applicationCategorySelected}"
										update="@([id$=typeConfirmationId])" />
								</p:selectOneRadio></td>
						</tr>
					</table>
					<table>
						<tr>
							<td align="left" colspan="2"><h:outputText
									value="#{backingBean.managedBean.catTypeConfirm}"
									rendered="#{backingBean.managedBean.smAppl.applCategoryType != null}"
									style="color: blue; font-weight: bold;" /></td>

						</tr>
					</table>
				</c:when>
				<c:otherwise>
					<table>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.catCodes.applCatType']}" /></td>
							<td><h:outputText
									value="#{lbl['lbl.sm.catCodes.catTypeNrm']}"
									rendered="#{backingBean.managedBean.smAppl.applCategoryType eq 'N'}"
									style="font-weight: bold;" /> <h:outputText
									value="#{lbl['lbl.sm.catCodes.catTypeSpl']}"
									rendered="#{backingBean.managedBean.smAppl.applCategoryType eq 'S'}"
									style="font-weight: bold;" /></td>
						</tr>
					</table>
				</c:otherwise>
			</c:choose>
			<br />
			<h:inputHidden
				value="#{backingBean.managedBean.smAppl.supportingDocMode}" />
			<p:dataTable var="catBean" widgetVar="smCatCodesNonRenewApplDtWidVar"
				value="#{backingBean.managedBean.activeCategoryList}"
				rowKey="#{catBean}" rowIndexVar="index" id="catDt"
				selection="#{backingBean.managedBean.deleteNewApplCategoryList}"
				rendered="#{backingBean.managedBean.smAppl.applType ne 'R'}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<ac:paginator for="catDt" />
				<p:ajax event="rowSelect"
					listener="#{backingBean.unSelectApporvedCategories}"
					update=":form:tt:catCodeInfPan"></p:ajax>
				<p:ajax event="rowUnselect"
					listener="#{backingBean.unSelectApporvedCategories}"
					update=":form:tt:catCodeInfPan"></p:ajax>
				<p:ajax event="rowSelectCheckbox"
					listener="#{backingBean.unSelectApporvedCategories}"
					update=":form:tt:catCodeInfPan"></p:ajax>
				<p:ajax event="rowUnselectCheckbox"
					listener="#{backingBean.unSelectApporvedCategories}"
					update=":form:tt:catCodeInfPan"></p:ajax>
				<p:ajax event="rowDblselect"
					listener="#{backingBean.unSelectApporvedCategories}"
					update=":form:tt:catCodeInfPan"></p:ajax>
				<p:columnGroup type="header">
					<p:row>
						<p:column style="width:2%"
							rendered="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}"
							disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
						<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
							style="width : 2%;"
							disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
						<p:column style="width :350px;white-space : normal"
							headerText="#{lbl['lbl.sm.catCodes.cate']}"
							disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}"
							disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}"
							disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
						<p:column headerText="#{lbl['lbl.sm.status']}"
							rendered="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}"
							disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.poAct']}"
							rendered="#{backingBean.managedBean.poUser or backingBean.managedBean.approverUser}"
							disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
						<p:column rendered="#{backingBean.managedBean.poUser}"
							headerText="#{lbl['lbl.sm.catCodes.remark']}"
							disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
						<p:column rendered="#{backingBean.managedBean.approverUser}"
							headerText="#{lbl['lbl.sm.catCodes.appAct']}"
							disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
						<p:column rendered="#{backingBean.managedBean.approverUser}"
							headerText="#{lbl['lbl.sm.catCodes.remark']}"
							disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
						<p:column rendered="#{backingBean.managedBean.smAppl.resubmit}"
							headerText="#{lbl['lbl.sm.catCodes.prevDecision']}"
							disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					</p:row>
				</p:columnGroup>
				<p:column selectionMode="multiple" style="width:2%"
					rendered="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}"
					disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				<p:column style="width : 2%;">
					<p:outputLabel value="#{index + 1}"
						style="float: left;white-space: normal;" />
				</p:column>
				<p:column style="width :350px;white-space : normal"
					disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
					<h:outputText
						value="#{catBean.pmCategoryL1.categoryL1Code} -  #{catBean.pmCategoryL1.categoryName}" />
					<br />
					<h:outputText
						value="#{catBean.pmCategoryL2.categoryL2Code} -  #{catBean.pmCategoryL2.categoryName}" />
					<br />
					<h:outputText
						value="#{catBean.pmCategoryL3.categoryL3Code} -  #{catBean.pmCategoryL3.categoryName}" />
				</p:column>
				<p:column
					disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
					<p:inputTextarea id="otherDesc" maxlength="100"
						label="#{lbl['lbl.sm.catCodes.othDesc']}"
						value="#{catBean.otherDesc}" required="true"
						rendered="#{catBean.pmCategoryL3.categoryL3Code eq 99}" />
					<p:message for="otherDesc" showDetail="false" showSummary="true"
						display="icon" />
				</p:column>
				<p:column
					disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
					<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
						rendered="#{!catBean.specialCategory}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
						rendered="#{catBean.specialCategory}" />
				</p:column>
				<p:column
					disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}"
					rendered="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}">
					<h:outputText value="#{lbl['lbl.sm.catCodes.pendingDec']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:column>
				<p:column
					disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}"
					rendered="#{backingBean.managedBean.poUser or backingBean.managedBean.approverUser}">

					<p:selectOneRadio layout="pageDirection" id="catPoAppr"
						value="#{catBean.poDecFlg}" required="true"
						label="#{lbl['lbl.sm.catCodes.poAct']} #{lbl['lbl.sm.catCodes.forCatCode']} #{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and backingBean.managedBean.poUser}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
						<p:ajax event="change" process="@this" update="poCatDecisionRmrk"
							partialSubmit="true"
							listener="#{backingBean.assignCategoryApproveOrRejectDate(catBean)}" />
					</p:selectOneRadio>
					<p:message id="catPoApprMsg" for="catPoAppr" showSummary="true"
						showDetail="false" display="icon" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS and backingBean.managedBean.poUser}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS and backingBean.managedBean.approverUser}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBean.poDecFlg eq 1 and backingBean.managedBean.approverUser}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.rejected']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBean.poDecFlg eq 0 and backingBean.managedBean.approverUser}" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.poUser}"
					disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
					<p:inputTextarea value="#{catBean.poRemarks}" maxlength="200"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and backingBean.managedBean.poUser}"
						label="#{lbl['lbl.sm.catCodes.rejRemarks']} #{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
						id="poCatDecisionRmrk" required="#{catBean.poDecFlg == 0}" />
					<p:message id="poCatDecisionRmrkMsg" for="poCatDecisionRmrk"
						showSummary="true" showDetail="false" display="icon" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.approverUser}"
					disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
					<p:selectOneRadio layout="pageDirection" id="catApprvrAppr"
						value="#{catBean.apprvrDecFlg}" required="true"
						label="#{lbl['lbl.sm.catCodes.appAct']} #{lbl['lbl.sm.catCodes.forCatCode']} #{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
						<p:ajax event="change" process="@this"
							update="apprvrCatDecisionRmrk" partialSubmit="true"
							listener="#{backingBean.assignCategoryApproveOrRejectDate(catBean)}" />
					</p:selectOneRadio>
					<p:message id="catApprvrApprMsg" for="catApprvrAppr"
						showSummary="true" showDetail="false" display="icon" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.approverUser}"
					disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
					<p:inputTextarea value="#{catBean.approverRemarks}" maxlength="200"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}"
						label="#{lbl['lbl.sm.catCodes.rejRemarks']} #{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
						id="apprvrCatDecisionRmrk" required="#{catBean.apprvrDecFlg == 0}" />
					<p:message id="apprvCatDecisionRmrkMsg" for="apprvrCatDecisionRmrk"
						showSummary="true" showDetail="false" display="icon" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.smAppl.resubmit}"
					disabledSelection="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}">
					<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
						<p:outputPanel
							rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
							<p:outputPanel rendered="#{not empty catBean.prevApprDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.catCodes.apprByApr']}"
									rendered="#{catBean.prevApprDecFlg eq 1}" />
								<h:outputText value="#{lbl['lbl.sm.catCodes.rejByApr']}"
									rendered="#{catBean.prevApprDecFlg eq 0}" />
								<br />
								<h:outputText value="#{catBean.prevApproverRemarks}"
									rendered="#{not empty catBean.prevApproverRemarks}" />
							</p:outputPanel>
							<p:outputPanel rendered="#{empty catBean.prevApprDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.no.available']}" />
							</p:outputPanel>
						</p:outputPanel>
						<p:outputPanel
							rendered="#{catBean.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS}">
							<h:outputText value="#{lbl['lbl.sm.no.available']}" />
						</p:outputPanel>
					</p:outputPanel>
					<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
						<p:outputPanel
							rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
							<p:outputPanel rendered="#{not empty catBean.prevPoDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.catCodes.apprByPO']}"
									rendered="#{catBean.prevPoDecFlg eq 1}" />
								<h:outputText value="#{lbl['lbl.sm.catCodes.rejByPO']}"
									rendered="#{catBean.prevPoDecFlg eq 0}" />
								<br />
								<h:outputText value="#{catBean.prevPoRemarks}"
									rendered="#{not empty catBean.prevPoRemarks}" />
							</p:outputPanel>
							<p:outputPanel rendered="#{empty catBean.prevPoDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.no.available']}" />
							</p:outputPanel>
						</p:outputPanel>
						<p:outputPanel
							rendered="#{catBean.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS}">
							<h:outputText value="#{lbl['lbl.sm.no.available']}" />
						</p:outputPanel>
					</p:outputPanel>
					<p:outputPanel
						rendered="#{!backingBean.managedBean.approverUser  and !backingBean.managedBean.poUser}">
						<p:outputPanel
							rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
							<p:outputPanel rendered="#{not empty catBean.prevApprDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.catCodes.apprByApr']}"
									rendered="#{catBean.prevApprDecFlg eq 1}" />
								<h:outputText value="#{lbl['lbl.sm.catCodes.rejByApr']}"
									rendered="#{catBean.prevApprDecFlg eq 0}" />
								<br />
								<h:outputText value="#{catBean.prevApproverRemarks}"
									rendered="#{not empty catBean.prevApproverRemarks}" />
							</p:outputPanel>
							<p:outputPanel rendered="#{empty catBean.prevApprDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.catCodes.apprByPO']}"
									rendered="#{catBean.prevPoDecFlg eq 1}" />
								<h:outputText value="#{lbl['lbl.sm.catCodes.rejByPO']}"
									rendered="#{catBean.prevPoDecFlg eq 0}" />
								<br />
								<h:outputText value="#{catBean.prevPoRemarks}"
									rendered="#{not empty catBean.prevPoRemarks}" />
							</p:outputPanel>

						</p:outputPanel>
						<p:outputPanel
							rendered="#{catBean.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS}">
							<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}" />
						</p:outputPanel>
					</p:outputPanel>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<p:dataTable var="catBeanR" widgetVar="smCatCodesRenewApplDtWidVar"
				value="#{backingBean.managedBean.activeCategoryList}"
				rowKey="#{catBeanR}" rowIndexVar="index" id="catDtR"
				rendered="#{backingBean.managedBean.smAppl.applType eq 'R'}"
				selection="#{backingBean.managedBean.deleteCategoryList}">
				<ac:paginator for="catDtR" />
				<p:columnGroup type="header">

					<p:row>
						<p:column selectionMode="multiple" style="width:2%"
							rendered="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}" />
						<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
							style="width : 2%;" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.cate']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}" />
						<p:column headerText="#{lbl['lbl.sm.status']}"
							rendered="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.poAct']}"
							rendered="#{backingBean.managedBean.poUser or backingBean.managedBean.approverUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.appAct']}"
							rendered="#{backingBean.managedBean.approverUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.remark']}"
							rendered="#{backingBean.managedBean.poUser or backingBean.managedBean.approverUser}" />
						<p:column rendered="#{backingBean.managedBean.smAppl.resubmit}"
							headerText="#{lbl['lbl.sm.catCodes.prevDecision']}" />
					</p:row>
				</p:columnGroup>
				<p:column selectionMode="multiple" style="width:2%"
					rendered="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}" />
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
					style="width : 2%;">
					<p:outputLabel value="#{index + 1}"
						style="float: left;white-space: normal;" />
				</p:column>
				<p:column style="width :350px;white-space : normal">
					<h:outputText
						value="#{catBeanR.pmCategoryL1.categoryL1Code} -  #{catBeanR.pmCategoryL1.categoryName}" />
					<br />
					<h:outputText
						value="#{catBeanR.pmCategoryL2.categoryL2Code} -  #{catBeanR.pmCategoryL2.categoryName}" />
					<br />
					<h:outputText
						value="#{catBeanR.pmCategoryL3.categoryL3Code} -  #{catBeanR.pmCategoryL3.categoryName}" />
				</p:column>
				<p:column>
					<p:inputTextarea id="otherDescR" maxlength="100"
						label="#{lbl['lbl.sm.catCodes.othDesc']}"
						value="#{catBeanR.otherDesc}" required="true"
						rendered="#{catBeanR.pmCategoryL3.categoryL3Code eq 99}" />
					<p:message for="otherDescR" showDetail="false" showSummary="true"
						display="icon" />
				</p:column>
				<p:column>
					<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
						rendered="#{!catBeanR.specialCategory}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
						rendered="#{catBeanR.specialCategory}" />
				</p:column>
				<p:column
					rendered="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}">
					<h:outputText value="#{lbl['lbl.sm.catCodes.pendingDec']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:column>
				<p:column
					rendered="#{backingBean.managedBean.poUser or backingBean.managedBean.approverUser}">
					<p:selectOneRadio layout="pageDirection" id="catPoApprR"
						value="#{catBeanR.poDecFlg}" required="true"
						label="#{lbl['lbl.sm.catCodes.poAct']} #{lbl['lbl.sm.catCodes.forCatCode']} #{catBeanR.pmCategoryL1.categoryL1Code} #{catBeanR.pmCategoryL2.categoryL2Code} #{catBeanR.pmCategoryL3.categoryL3Code} "
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and backingBean.managedBean.poUser}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
						<p:ajax event="change" process="@this" update="poCatRDecisionRmrk"
							partialSubmit="true"
							listener="#{backingBean.assignCategoryApproveOrRejectDate(catBeanR)}" />
					</p:selectOneRadio>
					<p:message id="catPoApprRMsg" for="catPoApprR" showSummary="true"
						showDetail="false" display="icon" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS and backingBean.managedBean.poUser}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS and backingBean.managedBean.approverUser}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBeanR.poDecFlg eq 1 and backingBean.managedBean.approverUser}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.rejected']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBeanR.poDecFlg eq 0 and backingBean.managedBean.approverUser}" />

				</p:column>
				<p:column rendered="#{backingBean.managedBean.poUser}">
					<p:inputTextarea value="#{catBeanR.poRemarks}" maxlength="200"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and backingBean.managedBean.poUser}"
						label="#{lbl['lbl.sm.catCodes.rejRemarks']} #{catBeanR.pmCategoryL1.categoryL1Code} #{catBeanR.pmCategoryL2.categoryL2Code} #{catBeanR.pmCategoryL3.categoryL3Code} "
						id="poCatRDecisionRmrk" required="#{catBeanR.poDecFlg == 0}" />
					<p:message id="poCatRDecisionRmrkMsg" for="poCatRDecisionRmrk"
						showSummary="true" showDetail="false" display="icon" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.approverUser}">
					<p:selectOneRadio layout="pageDirection" id="catRApprvrAppr"
						value="#{catBeanR.apprvrDecFlg}" required="true"
						label="#{lbl['lbl.sm.catCodes.appAct']} #{lbl['lbl.sm.catCodes.forCatCode']} #{catBeanR.pmCategoryL1.categoryL1Code} #{catBeanR.pmCategoryL2.categoryL2Code} #{catBeanR.pmCategoryL3.categoryL3Code} "
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
						<p:ajax event="change" process="@this"
							update="apprvrCatRDecisionRmrk" partialSubmit="true"
							listener="#{backingBean.assignCategoryApproveOrRejectDate(catBeanR)}" />
					</p:selectOneRadio>
					<p:message id="catRApprvrApprMsg" for="catRApprvrAppr"
						showSummary="true" showDetail="false" display="icon" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.approverUser}">
					<p:inputTextarea value="#{catBeanR.approverRemarks}"
						id="apprvrCatRDecisionRmrk"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}"
						label="#{lbl['lbl.sm.catCodes.rejRemarks']} #{catBeanR.pmCategoryL1.categoryL1Code} #{catBeanR.pmCategoryL2.categoryL2Code} #{catBeanR.pmCategoryL3.categoryL3Code} "
						maxlength="200" required="#{catBeanR.apprvrDecFlg == 0}" />
					<p:message id="apprvrCatRDecisionRmrkMsg"
						for="apprvrCatRDecisionRmrk" showSummary="true" showDetail="false"
						display="icon" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.smAppl.resubmit}">
					<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
						<p:outputPanel
							rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
							<p:outputPanel rendered="#{not empty catBeanR.prevApprDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.catCodes.apprByApr']}"
									rendered="#{catBeanR.prevApprDecFlg eq 1}" />
								<h:outputText value="#{lbl['lbl.sm.catCodes.rejByApr']}"
									rendered="#{catBeanR.prevApprDecFlg eq 0}" />
								<br />
								<h:outputText value="#{catBeanR.prevApproverRemarks}"
									rendered="#{not empty catBeanR.prevApproverRemarks}" />
							</p:outputPanel>
							<p:outputPanel rendered="#{empty catBeanR.prevApprDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.no.available']}" />
							</p:outputPanel>
						</p:outputPanel>
						<p:outputPanel
							rendered="#{catBeanR.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS}">
							<h:outputText value="#{lbl['lbl.sm.no.available']}" />
						</p:outputPanel>
					</p:outputPanel>
					<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
						<p:outputPanel
							rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
							<p:outputPanel rendered="#{not empty catBeanR.prevPoDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.catCodes.apprByPO']}"
									rendered="#{catBeanR.prevPoDecFlg eq 1}" />
								<h:outputText value="#{lbl['lbl.sm.catCodes.rejByPO']}"
									rendered="#{catBeanR.prevPoDecFlg eq 0}" />
								<br />
								<h:outputText value="#{catBeanR.prevPoRemarks}"
									rendered="#{not empty catBeanR.prevPoRemarks}" />
							</p:outputPanel>
							<p:outputPanel rendered="#{empty catBeanR.prevPoDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.no.available']}" />
							</p:outputPanel>
						</p:outputPanel>
						<p:outputPanel
							rendered="#{catBeanR.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS}">
							<h:outputText value="#{lbl['lbl.sm.no.available']}" />
						</p:outputPanel>
					</p:outputPanel>
					<p:outputPanel
						rendered="#{!backingBean.managedBean.approverUser  and !backingBean.managedBean.poUser}">
						<p:outputPanel
							rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
							<p:outputPanel rendered="#{not empty catBeanR.prevApprDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.catCodes.apprByApr']}"
									rendered="#{catBeanR.prevApprDecFlg eq 1}" />
								<h:outputText value="#{lbl['lbl.sm.catCodes.rejByApr']}"
									rendered="#{catBeanR.prevApprDecFlg eq 0}" />
								<br />
								<h:outputText value="#{catBeanR.prevApproverRemarks}"
									rendered="#{not empty catBeanR.prevApproverRemarks}" />
							</p:outputPanel>
							<p:outputPanel rendered="#{empty catBeanR.prevApprDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.catCodes.apprByPO']}"
									rendered="#{catBeanR.prevPoDecFlg eq 1}" />
								<h:outputText value="#{lbl['lbl.sm.catCodes.rejByPO']}"
									rendered="#{catBeanR.prevPoDecFlg eq 0}" />
								<br />
								<h:outputText value="#{catBeanR.prevPoRemarks}"
									rendered="#{not empty catBeanR.prevPoRemarks}" />
							</p:outputPanel>

						</p:outputPanel>
						<p:outputPanel
							rendered="#{catBeanR.recordStatusFlg ne SupplierManagementConst.PENDING_ACT_STATUS}">
							<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}" />
						</p:outputPanel>
					</p:outputPanel>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<c:if
				test="#{!backingBean.managedBean.poUser and !backingBean.managedBean.approverUser}">
				<div align="right">
					<p:commandButton value="#{lbl['lbl.sm.button.add']}"
						action="#{backingBean.assignNewCategoryCode}" partialSubmit="true"
						process="@this" update=":form:tt:regCatDialog"
						disabled="#{backingBean.managedBean.smAppl.applCategoryType == null}" />
					<c:choose>
						<c:when test="#{backingBean.managedBean.smAppl.applType eq 'R'}">
							<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
								action="#{backingBean.deleteSelectedCategoryCodes}"
								update=":form:tt:catDtR" partialSubmit="true"
								process=":form:tt:catCodeInfPan" />
						</c:when>
						<c:otherwise>
							<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
								action="#{backingBean.deleteSelectedPendingApprovalCategoryCodes}"
								update=":form:tt:catDt" partialSubmit="true"
								process=":form:tt:catCodeInfPan" />
						</c:otherwise>
					</c:choose>


				</div>
			</c:if>

			<br />
		</p:panel>
	</p:panel>

	<p:dialog width="1000px" header="#{lbl['lbl.sm.catCodes.diaHdr']}"
		widgetVar="regCatDialog" resizable="false" showEffect="fade"
		closable="false" hideEffect="fade" modal="true" id="regCatDialog">

		<p:outputPanel id="catPanel">
			<p:messages id="regCatCodeMsg" showSummary="false" showDetail="true"
				autoUpdate="true" closable="true" />
			<table style="width: 100%">

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.mainCat']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="supCatParCat"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.catCodes.mainCat']}"
							value="#{backingBean.managedBean.selectedCategory.pmCategoryL1.categoryL1Id}"
							style="width: 680px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.supplierParentCatList}"
								var="parent"
								itemLabel="#{parent.categoryL1Code} - #{parent.categoryName}"
								itemValue="#{parent.categoryL1Id}" />
							<p:ajax event="change"
								listener="#{backingBean.populateChildCategoryByParent(backingBean.managedBean.selectedCategory.pmCategoryL1.categoryL1Id,
								backingBean.managedBean.selectedCategory.pmCategoryL2,
								backingBean.managedBean.selectedCategory.pmCategoryL3)}"
								update="child,subChild" />
						</p:selectOneMenu> <p:message id="supCatParCatMsg" for="supCatParCat"
							showSummary="true" showDetail="false" display="icon" /></td>


				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.subCat']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.catCodes.subCat']}"
							value="#{backingBean.managedBean.selectedCategory.pmCategoryL2.categoryL2Id}"
							id="child" style="width: 680px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.supplierChildCatList}"
								var="child"
								itemLabel="#{child.categoryL2Code} - #{child.categoryName}"
								itemValue="#{child.categoryL2Id}" />
							<p:ajax event="change"
								listener="#{backingBean.populateSubChildCategoryByChild(backingBean.managedBean.selectedCategory.pmCategoryL2.categoryL2Id,backingBean.managedBean.selectedCategory.pmCategoryL3)}"
								update="subChild" />
						</p:selectOneMenu> <p:message id="childMsg" for="child" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.subCatDiv']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd}"
							label=" #{lbl['lbl.sm.catCodes.subCatDiv']}"
							value="#{backingBean.managedBean.selectedCategory.pmCategoryL3.categoryL3Id}"
							id="subChild" style="width: 680px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.supplierSubChildCatList}"
								var="subChild"
								itemLabel="#{subChild.categoryL3Code} - #{subChild.categoryName}"
								itemValue="#{subChild.categoryL3Id}" />
						</p:selectOneMenu> <p:message id="subChildMsg" for="subChild" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<!-- <tr>
					<td><p:outputLabel value="Business Type" /></td>
					<td><p:inputText readonly="true"
							title="Auto populated based on the category code selected"
							size="35" /></td>
				</tr> -->
				<tr>
					<td colspan="2">
						<div align="right">
							<p:commandButton value="#{lbl['lbl.sm.button.save']}"
								action="#{backingBean.saveSelectedCategory}"
								partialSubmit="true" process="regCatDialog"
								update=":form, @([id$=Msg])" />
							<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
								action="#{backingBean.cancelCategoryCodesSaveorUpdate}"
								partialSubmit="true" process="@this" />
						</div>
					</td>

				</tr>
			</table>
		</p:outputPanel>
		<br />

	</p:dialog>

	<p:confirmDialog id="typeConfirmationId"
		message="#{backingBean.managedBean.regCatCodeConfirmMsg}"
		header="#{backingBean.managedBean.regCatCodeConfirmHeader}"
		widgetVar="typeConfirmation">

		<p:commandButton id="conf" value="#{lbl['lbl.txt.yes']}"
			process="@this" partialSubmit="true" update="@form"
			action="#{backingBean.assignApplnCategoryType}"
			oncomplete="typeConfirmation.hide()" />
		<p:commandButton id="decline" value="#{lbl['lbl.txt.no']}"
			process="@this" partialSubmit="true" update=":form:tt:catCodeInfPan"
			action="#{backingBean.resetApplnCategoryType}" />

	</p:confirmDialog>

</ui:composition>
