<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header=" Category Codes" toggleable="true">
		<div>
			<p:outputLabel value=" Section Verified : "
				title="For PO / Approver highlight the verified section " />
			<p:selectBooleanCheckbox />
		</div>
		<br />
		<p:dataTable var="utilBean"
			value="#{mofRegistrationBackingBean.utilList}"
			selection="#{mofRegistrationBackingBean.managedBean.selectedUtilList}"
			rowKey="#{utilBean.seqNo}" rowIndexVar="index">
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="2" headerText="No." />
					<p:column rowspan="2" headerText="Code" />
					<p:column colspan="3" headerText="Category" />
					<p:column rowspan="2" headerText="Business Type" />
					<p:column rowspan="2" headerText="Category Type" />
					<p:column rowspan="2" headerText="PO Action" />
				</p:row>

				<p:row>
					<p:column headerText="Parent" />
					<p:column headerText="Child" />
					<p:column headerText="Sub-Child" />
				</p:row>
			</p:columnGroup>
			<p:column>
				<p:outputLabel value="1" />
			</p:column>
			<p:column>
				<p:outputLabel value="101099" />
			</p:column>
			<p:column>
				<p:outputLabel value="10" />
			</p:column>
			<p:column>
				<p:outputLabel value="10" />
			</p:column>
			<p:column>
				<p:outputLabel value="99" />
			</p:column>
			<p:column>
				<p:outputLabel value="Normal" />
			</p:column>
			<p:column>
				<p:outputLabel value="Category Type" />
			</p:column>
			<p:column>
				<p:selectOneRadio>
					<f:selectItem itemLabel="Approve" itemValue="1" />
					<f:selectItem itemLabel="Reject" itemValue="2" />
				</p:selectOneRadio>
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Category Code"
				onclick="regCatDialog.show();" />
		</div>

		<br />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>

	<p:dialog width="400px" header="Branch Page" widgetVar="regCatDialog"
		resizable="false" showEffect="fade" hideEffect="fade" modal="true">
		<p:panel header="Branch Details">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Category Type *" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="-- Select One -- " itemValue="" />
							<f:selectItem itemLabel="Normal" itemValue="1" />
							<f:selectItem itemLabel="Special" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Choose code entry mode" /></td>
					<td><p:selectOneRadio>
							<f:selectItem itemLabel="Enter Code" itemValue="1" />
							<f:selectItem itemLabel="Select Code" itemValue="1" />
						</p:selectOneRadio></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Enter Category Code" /></td>
					<td><p:inputText /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Parent Category *" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="-- Select One -- " itemValue="" />
							<f:selectItem itemLabel="Category1" itemValue="1" />
							<f:selectItem itemLabel="Category2" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Sub-Category *" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="-- Select One -- " itemValue="" />
							<f:selectItem itemLabel="Sub-Category1" itemValue="1" />
							<f:selectItem itemLabel="Sub-Category1" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Sub-Sub-Category *" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="-- Select One -- " itemValue="" />
							<f:selectItem itemLabel="Sub-Sub-Category1" itemValue="1" />
							<f:selectItem itemLabel="Sub-Sub-Category1" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Business Type" /></td>
					<td><p:inputText readonly="true"
							title="Auto populated based on the category code enterd/selected" /></td>
				</tr>
			</table>
		</p:panel>
		<br />
		<div align="center">
			<p:commandButton value="Save" onclick="regCatDialog.hide();" />
			<p:commandButton value="Cancel" onclick="regCatDialog.hide();" />
		</div>
	</p:dialog>

</ui:composition>
