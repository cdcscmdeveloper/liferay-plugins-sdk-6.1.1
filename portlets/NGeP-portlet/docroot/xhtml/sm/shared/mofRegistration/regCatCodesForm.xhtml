<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.catCodes.panHdr']}" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.categoryVerified}"
							id="poCatCodeVer">
							<p:ajax update=":form:tt:catCodeInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.categoryVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.categoryVerified}"
							id="apprCatCodeVer">
							<p:ajax update=":form:tt:catCodeInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.categoryVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="catCodeInfPan">
			<p:blockUI block=":form:tt:catCodeInfPan" widgetVar="buiPoCatCode"
				id="poCatCodeBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.categoryVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.categoryVerified : false)}" />
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.catType']}" /></td>
					<td><p:selectOneRadio
							value="#{backingBean.managedBean.smAppl.applCategoryType}">
							<f:selectItem itemLabel="Normal" itemValue="N" />
							<f:selectItem itemLabel="Special" itemValue="S" />
							<p:ajax event="change" oncomplete="typeConfirmation.show()"
								listener="#{backingBean.applicationCategorySelected}" />
						</p:selectOneRadio></td>
				</tr>
			</table>
			<table>
				<tr>
					<td align="left" colspan="2"><h:outputText
							value="#{backingBean.managedBean.catTypeConfirm}"
							rendered="#{backingBean.managedBean.smAppl.applCategoryType != null}"
							style="color: blue; font-weight: bold;" /></td>

				</tr>
			</table>

			<br />
			<h:inputHidden
				value="#{backingBean.managedBean.smAppl.supportingDocMode}" />
			<p:dataTable var="catBean" widgetVar="smCatCodesNonRenewApplDtWidVar"
				value="#{backingBean.managedBean.smAppl.smSupplierCategories}"
				rowKey="#{catBean}" rowIndexVar="index" id="catDt"
				rendered="#{!(backingBean.managedBean.smAppl.applType == 'R')}">
				<ac:paginator for="catDt" />
				<p:columnGroup type="header">

					<p:row>
						<p:column headerText="#{lbl['lbl.sm.catCodes.cate']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.poAct']}"
							rendered="#{backingBean.managedBean.poUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.appAct']}"
							rendered="#{backingBean.managedBean.approverUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.remark']}"
							rendered="#{backingBean.managedBean.poUser or backingBean.managedBean.approverUser}" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText
						value="#{catBean.pmCategoryL1.categoryL1Code} -  #{catBean.pmCategoryL1.categoryName}" />
					<br />
					<h:outputText
						value="#{catBean.pmCategoryL2.categoryL2Code} -  #{catBean.pmCategoryL2.categoryName}" />
					<br />
					<h:outputText
						value="#{catBean.pmCategoryL3.categoryL3Code} -  #{catBean.pmCategoryL3.categoryName}" />
				</p:column>
				<p:column>
					<p:inputTextarea id="otherDesc"
						label="#{lbl['lbl.sm.catCodes.othDesc']}"
						value="#{catBean.otherDesc}" required="true"
						rendered="#{catBean.pmCategoryL3.categoryL3Code eq 99}" />
					<p:message for="otherDesc" showDetail="false" showSummary="true"
						display="icon" />
				</p:column>
				<p:column>
					<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
						rendered="#{!catBean.specialCategory}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
						rendered="#{catBean.specialCategory}" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.poUser}">
					<p:selectOneRadio layout="pageDirection" id="catPoAppr"
						value="#{catBean.poDecFlg}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
					</p:selectOneRadio>
				</p:column>
				<p:column rendered="#{backingBean.managedBean.poUser}">
					<p:inputTextarea value="#{catBean.poRemarks}" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.approverUser}">
					<p:selectOneRadio layout="pageDirection" id="catApprvrAppr"
						value="#{catBean.apprvrDecFlg}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
					</p:selectOneRadio>
				</p:column>
				<p:column rendered="#{backingBean.managedBean.approverUser}">
					<p:inputTextarea value="#{catBean.approverRemarks}" />
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<p:dataTable var="catBeanR" widgetVar="smCatCodesRenewApplDtWidVar"
				value="#{backingBean.managedBean.smAppl.smSupplierCategories}"
				rowKey="#{catBeanR}" rowIndexVar="index" id="catDtR"
				rendered="#{backingBean.managedBean.smAppl.applType eq 'R'}"
				selection="#{backingBean.managedBean.deleteCategoryList}">
				<ac:paginator for="catDtR" />
				<p:columnGroup type="header">

					<p:row>
						<p:column selectionMode="multiple" style="width:2%" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.cate']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.poAct']}"
							rendered="#{backingBean.managedBean.poUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.appAct']}"
							rendered="#{backingBean.managedBean.approverUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.remark']}"
							rendered="#{backingBean.managedBean.poUser or backingBean.managedBean.approverUser}" />
					</p:row>
				</p:columnGroup>
				<p:column selectionMode="multiple" style="width:2%" />
				<p:column>
					<h:outputText
						value="#{catBeanR.pmCategoryL1.categoryL1Code} -  #{catBeanR.pmCategoryL1.categoryName}" />
					<br />
					<h:outputText
						value="#{catBeanR.pmCategoryL2.categoryL2Code} -  #{catBeanR.pmCategoryL2.categoryName}" />
					<br />
					<h:outputText
						value="#{catBeanR.pmCategoryL3.categoryL3Code} -  #{catBeanR.pmCategoryL3.categoryName}" />
				</p:column>
				<p:column>
					<p:inputTextarea id="otherDescR"
						label="#{lbl['lbl.sm.catCodes.othDesc']}"
						value="#{catBeanR.otherDesc}" required="true"
						rendered="#{catBeanR.pmCategoryL3.categoryL3Code eq 99}" />
					<p:message for="otherDescR" showDetail="false" showSummary="true"
						display="icon" />
				</p:column>
				<p:column>
					<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
						rendered="#{!catBeanR.specialCategory}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
						rendered="#{catBeanR.specialCategory}" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.poUser}">
					<p:selectOneRadio layout="pageDirection" id="catPoApprR"
						value="#{catBeanR.poDecFlg}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
					</p:selectOneRadio>
				</p:column>
				<p:column rendered="#{backingBean.managedBean.poUser}">
					<p:inputTextarea value="#{catBeanR.poRemarks}" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.approverUser}">
					<p:selectOneRadio layout="pageDirection" id="catApprvrAppr"
						value="#{catBeanR.apprvrDecFlg}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
					</p:selectOneRadio>
				</p:column>
				<p:column rendered="#{backingBean.managedBean.approverUser}">
					<p:inputTextarea value="#{catBeanR.approverRemarks}" />
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />

			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					action="#{backingBean.assignNewCategoryCode}" partialSubmit="true"
					process="@this" update=":form:tt:regCatDialog"
					disabled="#{backingBean.managedBean.smAppl.applCategoryType == null}" />

				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					action="#{backingBean.deleteSelectedCategoryCodes}"
					update=":form:tt:catDtR" partialSubmit="true"
					process="catCodeInfPan"
					rendered="#{(backingBean.managedBean.smAppl.applType == 'R')}" />
			</div>

			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.categoryRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.categoryRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.categoryRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>

	<p:dialog width="750px" header="#{lbl['lbl.sm.catCodes.diaHdr']}"
		widgetVar="regCatDialog" resizable="false" showEffect="fade"
		closable="false" hideEffect="fade" modal="true" id="regCatDialog">

		<p:outputPanel id="catPanel">
			<p:messages id="regCatCodeMsg" showSummary="false" showDetail="true"
				autoUpdate="true" closable="true" />
			<table style="width: 100%">

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.mainCat']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="supCatParCat"
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.catCodes.mainCat']}"
							value="#{backingBean.managedBean.selectedCategory.pmCategoryL1.categoryL1Id}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select  -- " itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.supplierParentCatList}"
								var="parent" itemLabel="#{parent.categoryName}"
								itemValue="#{parent.categoryL1Id}" />
							<p:ajax event="change"
								listener="#{backingBean.populateChildCategoryByParent(backingBean.managedBean.selectedCategory.pmCategoryL1.categoryL1Id,
								backingBean.managedBean.selectedCategory.pmCategoryL2,
								backingBean.managedBean.selectedCategory.pmCategoryL3)}"
								update="child,subChild" />
						</p:selectOneMenu> <p:message id="supCatParCatMsg" for="supCatParCat"
							showSummary="true" showDetail="false" display="icon" /></td>


				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.subCat']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.catCodes.subCat']}"
							value="#{backingBean.managedBean.selectedCategory.pmCategoryL2.categoryL2Id}"
							id="child" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel=" -- Select  -- " itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.supplierChildCatList}"
								var="child" itemLabel="#{child.categoryName}"
								itemValue="#{child.categoryL2Id}" />
							<p:ajax event="change"
								listener="#{backingBean.populateSubChildCategoryByChild(backingBean.managedBean.selectedCategory.pmCategoryL2.categoryL2Id,backingBean.managedBean.selectedCategory.pmCategoryL3)}"
								update="subChild" />
						</p:selectOneMenu> <p:message id="childMsg" for="child" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.subCatDiv']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							required="#{backingBean.managedBean.valueReqd}"
							label=" #{lbl['lbl.sm.catCodes.subCatDiv']}"
							value="#{backingBean.managedBean.selectedCategory.pmCategoryL3.categoryL3Id}"
							id="subChild" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel=" -- Select  --  " itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.supplierSubChildCatList}"
								var="subChild" itemLabel="#{subChild.categoryName}"
								itemValue="#{subChild.categoryL3Id}" />
						</p:selectOneMenu> <p:message id="subChildMsg" for="subChild" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<!-- <tr>
					<td><p:outputLabel value="Business Type" /></td>
					<td><p:inputText readonly="true"
							title="Auto populated based on the category code selected"
							size="35" /></td>
				</tr> -->
				<tr>
					<td colspan="2">
						<div align="right">
							<p:commandButton value="#{lbl['lbl.sm.button.save']}"
								action="#{backingBean.saveSelectedCategory}"
								partialSubmit="true" process="regCatDialog"
								update=":form, @([id$=Msg])" />
							<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
								action="#{backingBean.cancelCategoryCodesSaveorUpdate}"
								partialSubmit="true" process="@this" />
						</div>
					</td>

				</tr>
			</table>
		</p:outputPanel>
		<br />

	</p:dialog>

	<p:confirmDialog id="typeConfirmationId"
		message="#{lbl['lbl.sm.catCodes.cnfrmMsg']}"
		header="#{lbl['lbl.sm.catCodes.cmfrmHdr']}"
		widgetVar="typeConfirmation">

		<p:commandButton id="conf" value="Yes" update="@form"
			action="#{backingBean.assignApplnCategoryType}"
			oncomplete="typeConfirmation.hide()" />
		<p:commandButton id="decline" value="No" process="@this"
			partialSubmit="true" update=":form:tt:catCodeInfPan"
			action="#{backingBean.resetApplnCategoryType}" />

	</p:confirmDialog>

</ui:composition>
