<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header=" Category Codes" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.categoryVerified}"
							id="poCatCodeVer">
							<p:ajax update=":form:tt:catCodeInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.categoryVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.categoryVerified}"
							id="apprCatCodeVer">
							<p:ajax update=":form:tt:catCodeInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.categoryVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="catCodeInfPan">
			<p:blockUI block=":form:tt:catCodeInfPan" widgetVar="buiPoCatCode"
				id="poCatCodeBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.categoryVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.categoryVerified : false)}" />
			<table>
				<tr>
					<td><p:outputLabel value="Category Type" /></td>
					<td><p:selectOneRadio
							value="#{backingBean.managedBean.smAppl.applCategoryType}">
							<f:selectItem itemLabel="Normal" itemValue="N" />
							<f:selectItem itemLabel="Special" itemValue="S" />
							<p:ajax event="change" oncomplete="typeConfirmation.show()"
								listener="#{backingBean.applicationCategorySelected}" />
						</p:selectOneRadio></td>
				</tr>
			</table>
			<table>
				<tr>
					<td align="left" colspan="2"><h:outputText
							value="#{backingBean.managedBean.catTypeConfirm}"
							rendered="#{backingBean.managedBean.smAppl.applCategoryType != null}"
							style="color: blue; font-weight: bold;" /></td>

				</tr>
			</table>

			<br />
			<h:inputHidden
				value="#{backingBean.managedBean.smAppl.supportingDocMode}" />
			<p:dataTable var="catBean"
				value="#{backingBean.managedBean.smAppl.smSupplierCategories}"
				rowKey="#{catBean.supplierCategoryId}" rowIndexVar="index"
				id="catDt">
				<ac:paginator for="catDt" />
				<p:columnGroup type="header">

					<p:row>
						<p:column headerText="Category" />

						<p:column headerText="Business Type" />
						<p:column headerText="Category Type" />
						<p:column headerText="PO Action"
							rendered="#{backingBean.managedBean.poUser}" />
						<p:column headerText="Remarks"
							rendered="#{backingBean.managedBean.poUser}" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText
						value="#{catBean.pmCategoryL1.categoryL1Code} -  #{catBean.pmCategoryL1.categoryName}" />
					<br />
					<h:outputText
						value="#{catBean.pmCategoryL2.categoryL2Code} -  #{catBean.pmCategoryL2.categoryName}" />
					<br />
					<h:outputText
						value="#{catBean.pmCategoryL3.categoryL3Code} -  #{catBean.pmCategoryL3.categoryName}" />
				</p:column>
				<p:column>
					<h:outputText value=" -- TBC -- " />
				</p:column>
				<p:column>
					<h:outputText value="Normal" rendered="#{!catBean.specialCategory}" />
					<h:outputText value="Special" rendered="#{catBean.specialCategory}" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.poUser}">
					<p:selectOneRadio layout="pageDirection" id="catPoAppr">
						<f:selectItem itemLabel="Approve" itemValue="true" />
						<f:selectItem itemLabel="Reject" itemValue="false" />
					</p:selectOneRadio>
				</p:column>
				<p:column rendered="#{backingBean.managedBean.poUser}">
					<p:inputTextarea />
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />


			<div align="right">
				<p:commandButton value="Add"
					action="#{backingBean.assignNewCategoryCode}"
					oncomplete="regCatDialog.show();" update=":form:tt:regCatDialog"
					disabled="#{backingBean.managedBean.smAppl.applCategoryType == null}" />
			</div>

			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.categoryRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.categoryRemark}" /></td>
						<td><p:outputLabel value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.categoryRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>

	<p:dialog width="750px" header="Category Code Information"
		widgetVar="regCatDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="regCatDialog">
		<p:outputPanel id="catPanel">
			<table style="width: 100%">

				<tr>
					<td><p:outputLabel value="
										* Main Category" /></td>
					<td><p:selectOneMenu
							value="#{backingBean.managedBean.selectedCategory.pmCategoryL1.categoryL1Id}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select  -- " itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.supplierParentCatList}"
								var="parent" itemLabel="#{parent.categoryName}"
								itemValue="#{parent.categoryL1Id}" />
							<p:ajax event="change"
								listener="#{backingBean.populateChildCategoryByParent(backingBean.managedBean.selectedCategory.pmCategoryL1.categoryL1Id,
								backingBean.managedBean.selectedCategory.pmCategoryL2,
								backingBean.managedBean.selectedCategory.pmCategoryL3)}"
								update="child,subChild" />
						</p:selectOneMenu></td>


				</tr>
				<tr>
					<td><p:outputLabel value="* Sub Category" /></td>
					<td><p:selectOneMenu
							value="#{backingBean.managedBean.selectedCategory.pmCategoryL2.categoryL2Id}"
							id="child" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel=" -- Select  -- " itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.supplierChildCatList}"
								var="child" itemLabel="#{child.categoryName}"
								itemValue="#{child.categoryL2Id}" />
							<p:ajax event="change"
								listener="#{backingBean.populateSubChildCategoryByChild(backingBean.managedBean.selectedCategory.pmCategoryL2.categoryL2Id,backingBean.managedBean.selectedCategory.pmCategoryL3)}"
								update="subChild" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Sub Category Division" /></td>
					<td><p:selectOneMenu
							value="#{backingBean.managedBean.selectedCategory.pmCategoryL3.categoryL3Id}"
							id="subChild" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel=" -- Select  --  " itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.supplierSubChildCatList}"
								var="subChild" itemLabel="#{subChild.categoryName}"
								itemValue="#{subChild.categoryL3Id}" />
						</p:selectOneMenu></td>
				</tr>
				<!-- <tr>
					<td><p:outputLabel value="Business Type" /></td>
					<td><p:inputText readonly="true"
							title="Auto populated based on the category code selected"
							size="35" /></td>
				</tr> -->
				<tr>
					<td colspan="2">
						<div align="right">
							<p:commandButton value="Save"
								action="#{backingBean.saveSelectedCategory}"
								oncomplete="regCatDialog.hide();" type="submit"
								partialSubmit="true" process="regCatDialog"
								update=":form:tt:catDt, :form" />
							<p:commandButton value="Cancel" onclick="regCatDialog.hide();" />
						</div>
					</td>

				</tr>
			</table>
		</p:outputPanel>
		<br />

	</p:dialog>

	<p:confirmDialog id="typeConfirmationId"
		message="You can add categories of the selected type only.Are you sure ?"
		header="Select Category Type" widgetVar="typeConfirmation">

		<p:commandButton id="conf" value="Yes" update=":form:tt:catCodeInfPan"
			action="#{backingBean.assignApplnCategoryType}"
			oncomplete="typeConfirmation.hide()" />
		<p:commandButton id="decline" value="No"
			update=":form:tt:catCodeInfPan" onclick="typeConfirmation.hide()"
			action="#{backingBean.resetApplnCategoryType}" />

	</p:confirmDialog>

</ui:composition>
