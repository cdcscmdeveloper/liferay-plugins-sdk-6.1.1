<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header=" Category Codes" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.categoryVerified}"
							id="poCatCodeVer">
							<p:ajax update=":form:tt:catCodeInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.categoryVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px"><p:selectBooleanCheckbox /></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="catCodeInfPan">
			<p:blockUI block=":form:tt:catCodeInfPan" widgetVar="buiPoCatCode"
				id="poCatCodeBlc"
				blocked="#{backingBean.managedBean.poSecReview.categoryVerified and backingBean.managedBean.poUser}" />
			<p:dataTable var="catBean"
				value="#{backingBean.managedBean.smAppl.smSupplierCategories}"
				rowKey="#{catBean.supplierCategoryId}" rowIndexVar="index"
				id="catDt">
				<ac:paginator for="catDt" />
				<p:columnGroup type="header">
					<!-- <p:row>
					<p:column rowspan="2" headerText="No." />
					<p:column rowspan="2" headerText="Code" />
					<p:column colspan="3" headerText="Category" />
					<p:column rowspan="2" headerText="Business Type" />
					<p:column rowspan="2" headerText="Category Type" />
					<p:column rowspan="2" headerText="PO Action"
						rendered="#{backingBean.managedBean.poUser}" />
				</p:row> -->

					<p:row>
						<p:column headerText="Main Category" />
						<p:column headerText="Sub Category" />
						<p:column headerText="Sub Category Division" />
						<p:column headerText="Business Type" />
						<p:column headerText="Category Type" />
						<p:column headerText="PO Action"
							rendered="#{backingBean.managedBean.poUser}" />
						<p:column headerText="Remarks"
							rendered="#{backingBean.managedBean.poUser}" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText
						value="#{catBean.pmCategoryL1.categoryL1Code} -  #{catBean.pmCategoryL1.categoryName}" />
				</p:column>
				<p:column>
					<h:outputText
						value="#{catBean.pmCategoryL2.categoryL2Code} -  #{catBean.pmCategoryL2.categoryName}" />
				</p:column>
				<p:column>
					<h:outputText
						value="#{catBean.pmCategoryL3.categoryL3Code} -  #{catBean.pmCategoryL3.categoryName}" />
				</p:column>
				<p:column>
					<h:outputText value=" -- TBC -- " />
				</p:column>
				<p:column>
					<!-- <p:outputLabel value="#{catBean.categoryType}" /> -->
					<h:outputText value="Normal"
						rendered="#{catBean.categoryType eq 'N'}" />
					<h:outputText value="Special"
						rendered="#{catBean.categoryType eq 'S'}" />
				</p:column>
				<p:column rendered="#{backingBean.managedBean.poUser}">
					<p:selectOneRadio value="#{catBean.no}" layout="pageDirection"
						id="catPoAppr">
						<f:selectItem itemLabel="Approve" itemValue="1" />
						<f:selectItem itemLabel="Reject" itemValue="2" />
					</p:selectOneRadio>
				</p:column>
				<p:column rendered="#{backingBean.managedBean.poUser}">
					<p:inputTextarea />
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="Add"
					action="#{backingBean.assignNewCategoryCode}"
					oncomplete="regCatDialog.show();" update=":form:tt:regCatDialog" />
			</div>

			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41" /></td>
						<td><p:outputLabel value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>

	<p:dialog width="600px" header="Category Code Page"
		widgetVar="regCatDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="regCatDialog">
		<p:outputPanel id="catPanel">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Choose code entry mode" /></td>
					<td><p:selectOneRadio
							value="#{backingBean.managedBean.selectedCategory.entryMode}">
							<f:selectItem itemLabel="Enter Code" itemValue="E" />
							<f:selectItem itemLabel="Select Code" itemValue="S" />
							<p:ajax event="change"
								listener="#{backingBean.changeCatEntryModeValues}"
								update="catPanel" />
						</p:selectOneRadio></td>
				</tr>

				<ui:fragment
					rendered="#{backingBean.managedBean.selectedCategory.entryMode eq 'E'}">
					<tr>
						<td><p:outputLabel value="* Category Type" /></td>
						<td><p:selectOneMenu
								value="#{backingBean.managedBean.selectedCategory.categoryType}"
								style="width: 232px;margin-bottom: 5px;">
								<f:selectItem itemLabel="-- Select  -- " itemValue="O" />
								<f:selectItem itemLabel="Normal" itemValue="N" />
								<f:selectItem itemLabel="Special" itemValue="S" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel value="Enter Category Code" /></td>
						<td><p:inputText maxlength="2" size="2"
								value="#{backingBean.managedBean.selectedParentCat}" /> -<p:inputText
								maxlength="2" size="2"
								value="#{backingBean.managedBean.selectedChildCat}"
								style="margin-left: 3px;" /> -<p:inputText maxlength="2"
								size="2" value="#{backingBean.managedBean.selectedSubChildCat}"
								style="margin-left: 3px;" /></td>
					</tr>

					<tr>
						<td><p:outputLabel value="Business Type" /></td>
						<td><p:inputText readonly="true"
								title="Auto populated based on the category code enterd/selected"
								size="40" /></td>
					</tr>
					<tr>
						<td colspan="2">
							<div align="center">
								<p:commandButton value="Save"
									action="#{backingBean.saveEnteredCategory}"
									oncomplete="regCatDialog.hide();" update=":form:tt:catDt" />
								<p:commandButton value="Cancel" onclick="regCatDialog.hide();" />
							</div>
						</td>

					</tr>
				</ui:fragment>
				<ui:fragment
					rendered="#{backingBean.managedBean.selectedCategory.entryMode eq 'S'}">
					<tr>
						<td><p:outputLabel value="* Category Type" /></td>
						<td><p:selectOneMenu
								value="#{backingBean.managedBean.selectedCategory.categoryType}"
								style="width: 207px;margin-bottom: 5px;">
								<f:selectItem itemLabel="-- Select  -- " itemValue="O" />
								<f:selectItem itemLabel="Normal" itemValue="N" />
								<f:selectItem itemLabel="Special" itemValue="S" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel value="
										* Main Category" /></td>
						<td><p:selectOneMenu
								value="#{backingBean.managedBean.selectedParentCat}"
								style="width: 207px;margin-bottom: 5px;">
								<f:selectItem itemLabel="-- Select  -- " itemValue="" />
								<f:selectItems
									value="#{backingBean.managedBean.defaultParentCatList}"
									var="parent" itemLabel="#{parent.categoryName}"
									itemValue="#{parent.categoryL1Code}" />
								<p:ajax event="change"
									listener="#{backingBean.changeParentCategory}"
									update="child,subChild" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel value="* Sub Category" /></td>
						<td><p:selectOneMenu
								value="#{backingBean.managedBean.selectedChildCat}" id="child"
								style="width: 207px;margin-bottom: 5px;">
								<f:selectItem itemLabel=" -- Select  -- " itemValue="" />
								<f:selectItems
									value="#{backingBean.managedBean.selectedCategory.pmCategoryL1.pmCategoryL2s}"
									var="child" itemLabel="#{child.categoryName}"
									itemValue="#{child.categoryL2Code}" />
								<p:ajax event="change"
									listener="#{backingBean.changeChildCategory}" update="subChild" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel value="* Sub Category Division" /></td>
						<td><p:selectOneMenu
								value="#{backingBean.managedBean.selectedSubChildCat}"
								id="subChild" style="width: 207px;margin-bottom: 5px;">
								<f:selectItem itemLabel=" -- Select  --  " itemValue="" />
								<f:selectItems
									value="#{backingBean.managedBean.selectedCategory.pmCategoryL2.pmCategoryL3s}"
									var="subChild" itemLabel="#{subChild.categoryName}"
									itemValue="#{subChild.categoryL3Code}" />
								<p:ajax event="change"
									listener="#{backingBean.changeSubChildCategory}" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel value="Business Type" /></td>
						<td><p:inputText readonly="true"
								title="Auto populated based on the category code enterd/selected"
								size="35" /></td>
					</tr>
					<tr>
						<td colspan="2">
							<div align="center">
								<p:commandButton value="Save"
									action="#{backingBean.saveSelectedCategory}"
									oncomplete="regCatDialog.hide();" type="submit"
									partialSubmit="true" process="regCatDialog"
									update=":form:tt:catDt" />
								<p:commandButton value="Cancel" onclick="regCatDialog.hide();" />
							</div>
						</td>

					</tr>
				</ui:fragment>
			</table>
		</p:outputPanel>
		<br />

	</p:dialog>

</ui:composition>
