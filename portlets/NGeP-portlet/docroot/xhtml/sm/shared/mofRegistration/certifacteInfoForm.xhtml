<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.panHdr.certInfo']}" toggleable="true"
		id="certPanHead">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.certVerified}"
							id="poCertVer">
							<p:ajax update=":form:tt:certInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:certInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.certVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.certVerified}"
							id="apprCertVer">
							<p:ajax update=":form:tt:certInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:certInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.certVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="certInfPan">
			<p:blockUI block=":form:tt:certInfPan" widgetVar="buiPoCert"
				id="poCertBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.certVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.certVerified : false)}" />

			<p:dataTable var="certBean" editable="true"
				widgetVar="suppCertDtWidVar"
				value="#{backingBean.managedBean.smAppl.smSupplierCerts}"
				selection="#{backingBean.managedBean.selectedCertList}"
				rowKey="#{certBean}" rowIndexVar="index" id="certDt">
				<ac:paginator for="certDt" />
				<p:column selectionMode="multiple" width="5%" />


				<p:column headerText="#{lbl['lbl.sm.cert.certName']}">
					<h:outputText value="#{certBean.certName}" />
				</p:column>

				<!-- <p:column headerText="Cert Type">
					<h:outputText value="TBC" />
				</p:column> -->

				<p:column headerText="#{lbl['lbl.sm.cert.strtDate']}">
					<h:outputText value="#{certBean.certStartDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.expDate']}">
					<h:outputText value="#{certBean.certEndDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>

				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink action="#{backingBean.assignSelCert(certBean)}"
						update=":form:tt:certPop" partialSubmit="true" process="@this">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}" process="@this"
					action="#{backingBean.assignNewCert}" update=":form:tt:certPop" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					partialSubmit="true" process="certInfPan"
					action="#{backingBean.deleteSelectedCerts}"
					update=":form:tt:certDt" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.certRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.certRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.certRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="500px" height="275px"
		header="#{lbl['lbl.sm.cert.certDiaHdrMsg']}" widgetVar="certDialog"
		resizable="false" showEffect="fade" hideEffect="fade" modal="true"
		id="certPop" closable="false">
		<p:messages id="suppCertInfoMsg" showSummary="false" showDetail="true"
			autoUpdate="true" closable="true" />


		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.cert.certType']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.cert.certType']}"
						value="#{backingBean.managedBean.selectedCert.certTypeId}"
						id="certTypeId" rendered="true">
						<f:selectItems value="#{backingBean.getDropdownValues('CRT')}" />
					</p:selectOneMenu> <p:message id="certTypeMsg" for="certTypeId" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.cert.certBody']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						id="certBody" required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.cert.certBody']}"
						value="#{backingBean.managedBean.selectedCert.pmCertBody.certBodyId}">
						<f:selectItem itemLabel="-- Select  -- " itemValue="" />
						<f:selectItems var="certBody"
							value="#{backingBean.managedBean.certBodyLs}"
							itemValue="#{certBody.certBodyId}"
							itemLabel="#{certBody.bodyName}" />
					</p:selectOneMenu> <p:message id="certBodyMsg" for="certBody" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.cert.certName']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="certName"
						required="#{backingBean.managedBean.valueReqd}"
						label=" #{lbl['lbl.sm.cert.certName']}"
						value="#{backingBean.managedBean.selectedCert.certName}" size="35" />
					<p:message id="certNameMsg" for="certName" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.cert.strtDate']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:calendar id="stDate" showOn="button" navigator="true"
						display="inline" required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.cert.strtDate']}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						yearRange="-99:+0" readonlyInput="true"
						value="#{backingBean.managedBean.selectedCert.certStartDate}" />
					<p:message id="certStrttMsg" for="stDate" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.cert.expDate']}" /></td>
				<td><p:calendar id="endDate" showOn="button" navigator="true"
						display="inline"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						yearRange="-99:+10" readonlyInput="true"
						value="#{backingBean.managedBean.selectedCert.certEndDate}" /> <p:message
						id="certEndDtMsg" for="endDate" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.cert.rating']}" /></td>
				<td><p:inputText size="35" maxlength="2" id="certRatingVal"
						validatorMessage="#{lbl['lbl.sm.cert.rating']} - #{lbl['lbl.sm.invalidNo']}"
						value="#{backingBean.managedBean.selectedCert.certScore}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
					</p:inputText> <p:message id="certRatingValMsg" for="certRatingVal"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

		</table>

		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}"
				id="certSaveBtn" action="#{backingBean.addOrUpdateCertsToSmAppl}"
				partialSubmit="true" process="certPop"
				update=":form:tt:certDt, @([id$=Msg])" />
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				action="#{backingBean.cancelSupplierCertAction}"
				partialSubmit="true" process="@this" />
		</div>

	</p:dialog>
</ui:composition>
