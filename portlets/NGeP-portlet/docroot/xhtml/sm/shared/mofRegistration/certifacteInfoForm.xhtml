<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Certificate of Recognition" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.certVerified}"
							id="poCertVer">
							<p:ajax update=":form:tt:certInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.certVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By PO: "
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.certVerified}"
							id="apprCertVer">
							<p:ajax update=":form:tt:certInfPan,:form:revPanHdr"
								event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.certVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value=" Section Verified By Approver: "
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="certInfPan">
			<p:blockUI block=":form:tt:certInfPan" widgetVar="buiPoCert"
				id="poCertBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.certVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.certVerified : false)}" />

			<p:dataTable var="certBean"
				value="#{backingBean.managedBean.smAppl.smSupplierCerts}"
				selection="#{backingBean.managedBean.selectedCertList}"
				rowKey="#{certBean}" rowIndexVar="index" id="certDt">
				<ac:paginator for="certDt" />
				<p:column selectionMode="multiple" width="5%" />


				<p:column headerText="Cert Name">
					<h:outputText value="#{certBean.certName}" />
				</p:column>

				<p:column headerText="Cert Type">
					<h:outputText value="-- TBC --" />
				</p:column>

				<p:column headerText="Issue Date">
					<h:outputText value="#{certBean.certStartDate}">
						<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
					</h:outputText>
				</p:column>

				<p:column headerText="Expiry Date">
					<h:outputText value="#{certBean.certEndDate}">
						<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
					</h:outputText>

				</p:column>
				<p:column headerText="Action">
					<p:commandLink action="#{backingBean.assignSelCert(certBean)}"
						oncomplete="certDialog.show();" update=":form:tt:certPop">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="Add " oncomplete="certDialog.show();"
					action="#{backingBean.assignNewCert}" update=":form:tt:certPop" />
				<p:commandButton value="Delete " />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td style="padding-left: 38px;"><p:outputLabel
								value="PO Remarks" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41" /></td>
						<td style="padding-left: 22px;"><p:outputLabel
								value="Approver Remarks" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="500px" header="Company Certificate Information"
		widgetVar="certDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="certPop">
		<!-- <p:panel header="Certificate Details"> -->

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Certificate Type" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						value="#{backingBean.managedBean.selectedCert.certTypeId}">
						<f:selectItem itemLabel="-- Select -- " itemValue="0" />
						<f:selectItem itemLabel="MOF" itemValue="1" />
						<f:selectItem itemLabel="Bumiputera" itemValue="2" />
						<f:selectItem itemLabel="Type3" itemValue="3" />
					</p:selectOneMenu></td>
			</tr>


			<tr>
				<td><p:outputLabel value="Certificate Body *" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						value="#{backingBean.managedBean.selectedCert.pmCertBody.certBodyId}">
						<f:selectItem itemLabel="-- Select  -- " itemValue="0" />
						<f:selectItems var="certBody"
							value="#{backingBean.managedBean.certBodyLs}"
							itemValue="#{certBody.certBodyId}"
							itemLabel="#{certBody.bodyName}" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><p:outputLabel value="* Certificate Name" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedCert.certName}" size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Start Date" /></td>
				<td><p:calendar showOn="button"
						value="#{backingBean.managedBean.selectedCert.certStartDate}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Expiry Date" /></td>
				<td><p:calendar showOn="button"
						value="#{backingBean.managedBean.selectedCert.certEndDate}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Rating" /></td>
				<td><p:inputText size="35"
						value="#{backingBean.managedBean.selectedCert.certScore}" /></td>
			</tr>

		</table>
		<!-- </p:panel> -->
		<br />
		<div align="right">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdateCertsToSmAppl}"
				partialSubmit="true" process="certPop"
				oncomplete="certDialog.hide();" update=":form:tt:certDt" />
			<p:commandButton value="Cancel" onclick="certDialog.hide();" />
		</div>

	</p:dialog>
</ui:composition>
