<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.panHdr.certInfo']}" toggleable="true"
		id="certPanHead">
		<!-- Disable for UPS 32008 - START -->
		<table style="width: 350px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser and !backingBean.managedBean.upsCannotEdit}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.certVerified}"
							id="poCertVer">
							<p:ajax update=":form:tt:certInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:certInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.certVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser and !backingBean.managedBean.upsCannotEdit}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.certVerified}"
							id="apprCertVer">
							<p:ajax update=":form:tt:certInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:certInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.certVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>

		<p:outputPanel id="certInfPan" layout="block">
			<p:blockUI rendered="#{!backingBean.managedBean.upsCannotEdit}" block=":form:tt:certInfPan" widgetVar="buiPoCert"
				id="poCertBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.certVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.certVerified : false)}" />

			<p:dataTable var="certBean" editable="true"
				widgetVar="suppCertDtWidVar"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.smAppl.smSupplierCerts}"
				selection="#{backingBean.managedBean.selectedCertList}"
				rowKey="#{certBean}" rowIndexVar="index" id="certDt">
				<ac:paginator for="certDt" />
				<!--  Refs #28766 - add on changes - 24/2/2021 - start -->
				<p:ajax event="rowSelect"
						update=":#{p:component('delCertBtnId')}"></p:ajax>
				<p:ajax event="rowUnselect"
						update=":#{p:component('delCertBtnId')}"></p:ajax>				
				<p:ajax event="rowSelectCheckbox"
						update=":#{p:component('delCertBtnId')}"></p:ajax>
				<p:ajax event="rowUnselectCheckbox"
						update=":#{p:component('delCertBtnId')}"></p:ajax>
				<p:ajax event="toggleSelect"
						update=":#{p:component('delCertBtnId')}"></p:ajax>
				<!--  Refs #28766 - add on changes - 24/2/2021 - end -->
				<p:column selectionMode="multiple" width="1%" rendered="#{not empty backingBean.managedBean.smAppl.smSupplierCerts}"/>

				<p:column headerText="#{lbl['lbl.sm.cert.certName']}" style="width : 35%;white-space : normal">
					<h:outputText value="#{certBean.certName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.certBody']}" style="width : 35%;white-space : normal">
					<h:outputText value="#{certBean.pmCertBody.bodyName}" rendered="#{not empty certBean.pmCertBody}"/>
					<h:outputText value="#{lbl['lbl.txt.na']}" rendered="#{empty certBean.pmCertBody}"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.strtDate']}">
					<h:outputText value="#{certBean.certStartDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.expDate']}">
					<h:outputText value="#{certBean.certEndDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>

				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink action="#{backingBean.assignSelCert(certBean)}"
						update=":form:tt:certPop" partialSubmit="true" process="@this" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
						<!--  Refs #28766 - add on changes - 19/2/2021 - start -->
<!-- 						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" -->
<!-- 							style="margin-right:2px;" /> -->
						<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}"
							style="margin-right:2px;" />
							<!--  Refs #28766 - add on changes - 19/2/2021 - end -->
					</p:commandLink>
					<ac:smFieldChangeTableAlert object="#{certBean}" />
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}"
					rendered="#{!backingBean.managedBean.upsCannotEdit}"
					disabled="true" process="@this"
					action="#{backingBean.assignNewCert}" update=":form:tt:certPop" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
					<!--  Refs #28766 - add on changes - 24/2/2021 - start -->
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					rendered="#{!backingBean.managedBean.upsCannotEdit}"
					partialSubmit="true" process="certInfPan"
					disabled="#{empty backingBean.managedBean.smAppl.smSupplierCerts or empty backingBean.managedBean.selectedCertList}"
					update=":form:tt:certDt,@this" 
					id="delCertBtnId" oncomplete="certDeletePopUp.show();" />
					<!--  Refs #28766 - add on changes - 24/2/2021 - end -->
			<!-- Disable for UPS 32008 - END -->
			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser or (backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser)}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="certInfoPoRmrk" readonly="#{backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser}"
								validatorMessage="#{lbl['lbl.sm.panHdr.certInfo']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.certRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="certInfoPoRmrkMsg" for="certInfoPoRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.certRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="certInforAprvrRmrk"
								validatorMessage="#{lbl['lbl.sm.panHdr.certInfo']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.certRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="certInforAprvrRmrkMsg" for="certInforAprvrRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	
		<p:dialog style="max-height:350px;width:500px"
		header="#{lbl['lbl.sm.cert.certDiaHdrMsg']}" widgetVar="certDialog"
		resizable="false" showEffect="fade" hideEffect="fade" modal="true"
		id="certPop" closable="true">
		
		<p:scrollPanel mode="native" style="max-height:300px;width:450px;border:none">
			<p:outputPanel id="certBlockPanel">
				<table style="width: 100%;table-layout:fixed">
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.cert.certType']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.glp.codeName}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.cert.certBody']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedCert.pmCertBody.bodyName}" /></td>
					</tr>
		
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.cert.certName']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedCert.certName}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.cert.strtDate']}" /></td>
						<td>
							<ac:labelDate styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedCert.certStartDate}" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.cert.expDate']}" /></td>
						<td>
							<ac:labelDate styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedCert.certEndDate}" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.cert.rating']}" /></td>
						<td>
							<p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.selectedCert.certScore}"/>
						</td>
					</tr>
				</table>
			</p:outputPanel>
		</p:scrollPanel>
	</p:dialog>
<!--  Refs #28766 - add on changes - 19/2/2021 - end -->
	
	<ac:confirmationPopup id="certDeletePopUpId"
		widget="certDeletePopUp"
		okAction="backingBean.deleteSelectedCerts"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update=":form:tt:certDt, @([id$=Msg]),:#{p:component('delCertBtnId')}"/>
		
</ui:composition>
