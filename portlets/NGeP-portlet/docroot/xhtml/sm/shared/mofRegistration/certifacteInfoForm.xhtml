<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.panHdr.certInfo']}" toggleable="true"
		id="certPanHead">
		<table style="width: 350px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.certVerified}"
							id="poCertVer">
							<p:ajax update=":form:tt:certInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:certInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.certVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.certVerified}"
							id="apprCertVer">
							<p:ajax update=":form:tt:certInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:certInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.certVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>

		<p:outputPanel id="certInfPan" layout="block">
			<p:blockUI block=":form:tt:certInfPan" widgetVar="buiPoCert"
				id="poCertBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.certVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.certVerified : false)}" />

			<p:dataTable var="certBean" editable="true"
				widgetVar="suppCertDtWidVar"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.smAppl.smSupplierCerts}"
				selection="#{backingBean.managedBean.selectedCertList}"
				rowKey="#{certBean}" rowIndexVar="index" id="certDt">
				<ac:paginator for="certDt" />
				
				<p:column selectionMode="multiple" width="1%" rendered="#{not empty backingBean.managedBean.smAppl.smSupplierCerts}"/>

				<p:column headerText="#{lbl['lbl.sm.cert.certName']}" style="width : 35%;white-space : normal">
					<h:outputText value="#{certBean.certName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.certBody']}" style="width : 35%;white-space : normal">
					<h:outputText value="#{certBean.pmCertBody.bodyName}" rendered="#{not empty certBean.pmCertBody}"/>
					<h:outputText value="#{lbl['lbl.txt.na']}" rendered="#{empty certBean.pmCertBody}"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.strtDate']}">
					<h:outputText value="#{certBean.certStartDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.expDate']}">
					<h:outputText value="#{certBean.certEndDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>

				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink action="#{backingBean.assignSelCert(certBean)}"
						update=":form:tt:certPop" partialSubmit="true" process="@this" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}"
							style="margin-right:2px;" />
					</p:commandLink>
					<ac:smFieldChangeTableAlert object="#{certBean}" />
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.add']}" process="@this"
					action="#{backingBean.assignNewCert}" update=":form:tt:certPop" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
					partialSubmit="true" process="certInfPan"
					disabled="#{empty backingBean.managedBean.smAppl.smSupplierCerts}"
					update=":form:tt:certDt,@this" 
					id="delCertBtnId" oncomplete="certDeletePopUp.show();" />

			</div>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser or (backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser)}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="certInfoPoRmrk" readonly="#{backingBean.managedBean.smAppl.resubmit and backingBean.managedBean.supplierUser}"
								validatorMessage="#{lbl['lbl.sm.panHdr.certInfo']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.certRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="certInfoPoRmrkMsg" for="certInfoPoRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								disabled="true" cols="41" maxlength="200"
								value="#{backingBean.managedBean.poSecReview.certRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="certInforAprvrRmrk"
								validatorMessage="#{lbl['lbl.sm.panHdr.certInfo']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.certRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="certInforAprvrRmrkMsg" for="certInforAprvrRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	<p:dialog width="550px" height="275px"
		header="#{lbl['lbl.sm.cert.certDiaHdrMsg']}" widgetVar="certDialog"
		resizable="false" showEffect="fade" hideEffect="fade" modal="true"
		id="certPop" closable="false">
		
		<p:outputPanel layout="block" id="certBlockPanel">
			<p:messages id="suppCertInfoMsg" showSummary="false" showDetail="true"
				autoUpdate="true" closable="true" />
	
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.cert.certType']}" /></td>
					<td><h:outputText value="#{backingBean.managedBean.glp.codeName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.cert.certBody']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 230px;margin-bottom: 5px;"
							id="certBody" required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.cert.certBody']}"
							value="#{backingBean.managedBean.selectedCert.pmCertBody.certBodyId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="certBody"
								value="#{backingBean.managedBean.certBodyLs}"
								itemValue="#{certBody.certBodyId}"
								itemLabel="#{certBody.bodyName}" />
							<p:ajax event="change" partialSubmit="true" process="@this"
								update="certNameOutPanelId" listener="#{backingBean.onChangeCertBody}" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.selectedCert.supplierCertId}"
							oriValue="#{backingBean.managedBean.latestCert.pmCertBody.certBodyId}" 
							currValue="#{backingBean.managedBean.selectedCert.pmCertBody.certBodyId}" 
							alertValue="#{backingBean.getProfBodyByIdFromList(backingBean.managedBean.latestCert.pmCertBody.certBodyId)}" />
						<p:message id="certBodyMsg" for="certBody" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.cert.certName']}" /></td>
					<td style="white-space : normal">
						<p:outputPanel id="certNameOutPanelId">
							<h:outputText value="#{backingBean.managedBean.selectedCert.certName}" />
						</p:outputPanel>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.cert.strtDate']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:calendar id="stDate" showOn="button" navigator="true"
							display="inline" required="#{backingBean.managedBean.valueReqd}"
							label="#{lbl['lbl.sm.cert.strtDate']}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							yearRange="-99:+0" readonlyInput="true"
							maxdate="#{CommonConstants.CURRENT_DATE}"
							value="#{backingBean.managedBean.selectedCert.certStartDate}" />
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges 
								and not empty backingBean.managedBean.selectedCert.supplierCertId}"
							oriValue="#{backingBean.managedBean.latestCert.certStartDate}" 
							currValue="#{backingBean.managedBean.selectedCert.certStartDate}" 
							alertValue="#{backingBean.getDateFormat(backingBean.managedBean.latestCert.certStartDate)}"/>
						<p:message id="certStrttMsg" for="stDate" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.cert.expDate']}" /></td>
					<td><p:calendar id="endDate" showOn="button" navigator="true"
							display="inline"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							yearRange="-99:+10" readonlyInput="true"
							value="#{backingBean.managedBean.selectedCert.certEndDate}" /> 
							<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges 
									and not empty backingBean.managedBean.selectedCert.supplierCertId}"
								oriValue="#{backingBean.managedBean.latestCert.certEndDate}" 
								currValue="#{backingBean.managedBean.selectedCert.certEndDate}" 
								alertValue="#{backingBean.getDateFormat(backingBean.managedBean.latestCert.certEndDate)}"/>
							<p:message
							id="certEndDtMsg" for="endDate" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.cert.rating']}" /></td>
					<td><p:inputText size="35" maxlength="2" id="certRatingVal"
							validatorMessage="#{lbl['lbl.sm.cert.rating']} - #{lbl['lbl.sm.invalidNo']}"
							value="#{backingBean.managedBean.selectedCert.certScore}">
							<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						</p:inputText> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges 
								and not empty backingBean.managedBean.selectedCert.supplierCertId}"
							oriValue="#{backingBean.managedBean.latestCert.certScore}" 
							currValue="#{backingBean.managedBean.selectedCert.certScore}" 
							alertValue="#{backingBean.managedBean.latestCert.certScore}"/>
						<p:message id="certRatingValMsg" for="certRatingVal"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
	
			</table>
	
			<br />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.save']}"
					id="certSaveBtn" action="#{backingBean.addOrUpdateCertsToSmAppl}"
					partialSubmit="true" process="certBlockPanel"
					onclick="certBlockWidget.show();" oncomplete="certBlockWidget.hide();" 
					update=":form:tt:certDt, @([id$=Msg]),:#{p:component('delCertBtnId')}" />
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
					action="#{backingBean.cancelSupplierCertAction}"
					partialSubmit="true" process="@this" />
			</div>
			<p:blockUI block="certBlockPanel" widgetVar="certBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
		</p:outputPanel>
	</p:dialog>
	
	<ac:confirmationPopup id="certDeletePopUpId"
		widget="certDeletePopUp"
		okAction="backingBean.deleteSelectedCerts"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}" 
		update=":form:tt:certDt, @([id$=Msg]),:#{p:component('delCertBtnId')}"/>
		
</ui:composition>
