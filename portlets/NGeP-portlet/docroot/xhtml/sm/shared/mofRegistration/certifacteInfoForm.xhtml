<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Certificate of Recognition" toggleable="true">
		<table style="width: 250px">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
				<td><p:outputLabel value=" Section Verified By PO: "
						title="For PO to highlight the verified section " /></td>

			</tr>
			<tr>
				<td width="10px"><p:selectBooleanCheckbox /></td>
				<td><p:outputLabel value=" Section Verified By Approver: "
						title="For Approver to highlight the verified section " /></td>
			</tr>
		</table>
		<br />
		<p:dataTable var="certBean"
			value="#{backingBean.managedBean.smAppl.smApplSupplierCerts}"
			selection="#{backingBean.managedBean.selectedCertList}"
			rowKey="#{certBean.applSupplierCertId}" rowIndexVar="index"
			id="certDt">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<p:outputLabel value="#{index+1}" />
			</p:column>

			<p:column headerText="Cert Name">
				<p:commandLink value="#{certBean.certName}"
					action="#{backingBean.assignSelCert(certBean)}"
					oncomplete="certDialog.show();" update=":form:tt:certPop" />
			</p:column>

			<p:column headerText="Cert Type">
				<p:outputLabel value="#{certBean.certType}" />
			</p:column>

			<p:column headerText="Issue Date">
				<h:outputText value="#{certBean.certStartDate}">
					<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
				</h:outputText>
			</p:column>

			<p:column headerText="Expiry Date">
				<h:outputText value="#{certBean.certEndDate}">
					<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
				</h:outputText>

			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Certificate"
				oncomplete="certDialog.show();"
				action="#{backingBean.assignNewCert}" update=":form:tt:certPop" />
			<p:commandButton value="Delete Certificate(s)" />

		</div>
		<table style="width: 100%">

			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog width="400px" header="Company Certificate Page"
		widgetVar="certDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="certPop">
		<p:panel header="Certificate Details">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Certificate Type *" /></td>
					<td><p:selectOneMenu
							value="#{backingBean.managedBean.selectedCert.certType}">
							<f:selectItem itemLabel="-- Select One -- " itemValue="N" />
							<f:selectItem itemLabel="MOF" itemValue="M" />
							<f:selectItem itemLabel="BumiPutera" itemValue="B" />
							<f:selectItem itemLabel="Type3" itemValue="T" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Certificate Name *" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.selectedCert.certName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Certificate Body *" /></td>
					<td><p:inputTextarea readonly="true"
							title="-- Auto populated based on the Certificate Type , 
							can key the body for type - Others only ----"
							value="#{backingBean.managedBean.selectedCert.certBody}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Start Date *" /></td>
					<td><p:calendar showOn="button"
							value="#{backingBean.managedBean.selectedCert.certStartDate}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Expiry Date *" /></td>
					<td><p:calendar showOn="button"
							value="#{backingBean.managedBean.selectedCert.certEndDate}" /></td>
				</tr>

			</table>
		</p:panel>
		<br />
		<div align="center">
			<p:commandButton value="Save"
				action="#{backingBean.addOrUpdateCertsToSmAppl}"
				oncomplete="certDialog.hide();" update=":form:tt:certDt" />
			<p:commandButton value="Cancel" onclick="certDialog.hide();" />
		</div>

	</p:dialog>
</ui:composition>
