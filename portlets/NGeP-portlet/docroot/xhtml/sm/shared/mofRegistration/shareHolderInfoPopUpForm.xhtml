	<p:tabView>

		<p:tab title="Shareholder Info">
			<p:panel header="Personnel Info" toggleable="true">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="* Name" /></td>
						<td><p:inputText
								value="#{backingBean.managedBean.selectedShareHolder.name}"
								size="35" /></td>
						<td><p:outputLabel value="* Nationality" /></td>
						<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
								<f:selectItem itemLabel="-- Select One--" itemValue="1" />
								<f:selectItem itemLabel="Malaysian" itemValue="2" />
								<f:selectItem itemLabel="Chinese" itemValue="3" />
								<f:selectItem itemLabel="Indian" itemValue="4" />
							</p:selectOneMenu></td>

					</tr>
					<tr>

						<td><p:outputLabel value="* IC/Pspt No." /></td>
						<td><p:inputText
								value="#{backingBean.managedBean.selectedShareHolder.identificationNo}"
								size="35" /></td>
						<td><p:outputLabel value="* Race" title="For Malaysian Only" /></td>
						<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
								<f:selectItem itemLabel="-- Select One --" itemValue="1" />
								<f:selectItem itemLabel="Melayu" itemValue="M" />
								<f:selectItem itemLabel="Chinese" itemValue="C" />
								<f:selectItem itemLabel="Indian" itemValue="I" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel value="* DOB" /></td>
						<td><p:calendar showOn="button"
								value="#{backingBean.managedBean.selectedShareHolder.birthDate}" /></td>
						<td><p:outputLabel value="* Role : " /></td>
						<td>
							<table>
								<tr>
									<td><p:selectBooleanCheckbox /></td>
									<td><p:outputLabel value="Equity Owner"
											style="margin-bottom: 5px;" /></td>
									<td><p:selectBooleanCheckbox
											rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType eq '2'}" /></td>
									<td><p:outputLabel value="Director"
											rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType eq '2'}" /></td>
									<td><p:selectBooleanCheckbox
											rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType eq '2'}" /></td>
									<td><p:outputLabel value="Higher Management"

			<p:panel header="Shareholer Priviliges" toggleable="true"
				id="shrPrivPanel">
				<table>
					<tr>
						<td><p:outputLabel value="Is this an authorized personnel ? " /></td>
						<td><p:selectOneRadio
								value="#{backingBean.managedBean.selectedShareHolder.authorizedFlg}">
								<f:selectItem itemLabel="Yes" itemValue="1" />
								<f:selectItem itemLabel="No" itemValue="0" />
								<p:ajax event="change" update="shrPrivPanel"
									listener="#{backingBean.assignShareHolderPrivilege}" />
							</p:selectOneRadio></td>
					</tr>
					<tr>
						<td><p:outputLabel
								value="Issue soft cert to this personnel ? "
								rendered="#{backingBean.managedBean.selectedShareHolder.authorizedFlg eq '1' and (backingBean.managedBean.smAppl.applType eq 'R' or backingBean.managedBean.smAppl.applType eq 'N')}" /></td>
						<td><p:selectOneRadio
								value="#{backingBean.managedBean.selectedShareHolder.softcertFlg}"
								rendered="#{backingBean.managedBean.selectedShareHolder.authorizedFlg eq '1' and (backingBean.managedBean.smAppl.applType eq 'R' or backingBean.managedBean.smAppl.applType eq 'N')}">
								<f:selectItem itemLabel="Yes" itemValue="1" />
								<f:selectItem itemLabel="No" itemValue="0" />
								<p:ajax event="change" update="shrPrivPanel"
									listener="#{backingBean.assignShareHolderPrivilege}" />
							</p:selectOneRadio></td>
					</tr>
					<tr>
						<td><p:outputLabel
								value="Is this personnel a contract signer ? "
								rendered="#{backingBean.managedBean.selectedShareHolder.softcertFlg eq '1' and (backingBean.managedBean.smAppl.applType eq 'R' or backingBean.managedBean.smAppl.applType eq 'N')}" /></td>

								value="#{backingBean.managedBean.selectedShareHolder.contractSignerFlg}"
								rendered="#{backingBean.managedBean.selectedShareHolder.softcertFlg eq '1' and (backingBean.managedBean.smAppl.applType eq 'R' or backingBean.managedBean.smAppl.applType eq 'N')}">
								<f:selectItem itemLabel="Yes" itemValue="1" />
								<f:selectItem itemLabel="No" itemValue="0" />
							</p:selectOneRadio></td>
					</tr>
				</table>

			</p:panel>
			<p:panel header="Job Function" toggleable="true">
			
				<p:dataTable id="jfdt" 
					value="#{backingBean.managedBean.jobFunctions}"
					var="jf"
					selection="#{backingBean.managedBean.selectedJobFunctions}"
					selectionMode="multiple"
					rowIndexVar="rowIndex"
					rowKey="#{jf}">
					<p:column selectionMode="multiple" style="width:2%" />
					<p:column>
						<f:facet name="header">
							<h:outputText value="Year From" />
						</f:facet>
						<p:inputText />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Year To" />
						</f:facet>
						<p:inputText />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Company" />
						</f:facet>
						<p:inputText />
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="Designation" />
						</f:facet>
						<p:inputText />
					</p:column>
				</p:dataTable>
				<div align="right">
					<p:commandButton value="Add" action="#{backingBean.managedBean.addJobFunction}" update="jfdt">
					</p:commandButton>
					<p:commandButton value="Delete">
					</p:commandButton>
				</div>
			</p:panel>
			<p:panel header="Academic Qualification" toggleable="true">

							<h:outputText value="Year" />

							<f:selectItem itemLabel="Select One" itemValue="1" />
							<f:selectItem itemLabel="2013" itemValue="2013" />
							<f:selectItem itemLabel="2012" itemValue="2012" />
							<f:selectItem itemLabel="2011" itemValue="2011" />
						</p:selectOneMenu>

					<p:column>

							<h:outputText value="Major In" />
						</f:facet>
						<p:inputText />
					</p:column>

				<div align="right">
					<p:commandButton value="Add" action="#{backingBean.managedBean.addAcademicQualification}" update="aqdt">
					</p:commandButton>
					<p:commandButton value="Delete">
