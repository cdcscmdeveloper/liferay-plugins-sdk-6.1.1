<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.person.panHdr']}" toggleable="true"
		id="equiPerDtlPan">
		<c:if
			test="#{(backingBean.managedBean.approverUser or backingBean.managedBean.poUser) and backingBean.managedBean.selectedShareHolder.identificationType.parameterCode eq 'I'}">
			<p:outputLabel style="float : left" styleClass="ui-panel-title"
				value="#{lbl['lbl.sm.person.myIdResp']} - " />
			<p:outputLabel style="float : left" styleClass="ui-panel-title"
				value="#{backingBean.getMyIdentityStatusDescription(backingBean.managedBean.selectedShareHolder.identityResponseCode)}" />
		</c:if>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.name']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="equiPerNam" maxlength="80"
						label="#{lbl['lbl.sm.person.name']}" required="true"
						value="#{backingBean.managedBean.selectedShareHolder.name}"
						disabled="#{backingBean.managedBean.disabledShareholderPersonnelNameAndNationality}"
						size="35" /> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges 
								and not empty backingBean.managedBean.latestPersonnel}"
							oriValue="#{backingBean.managedBean.latestPersonnel.name}" 
							currValue="#{backingBean.managedBean.selectedShareHolder.name}" 
							alertValue="#{backingBean.managedBean.latestPersonnel.name}"/>
						<p:message id="equiPerNamMsg" for="equiPerNam"
						showSummary="true" showDetail="false" display="icon" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.nationality']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu
						label="#{lbl['lbl.sm.person.nationality']}" id="equiPerNational"
						required="true"
						value="#{backingBean.managedBean.selectedShareHolder.pmCountry.countryId}"
						disabled="#{backingBean.managedBean.disabledShareholderPersonnelNameAndNationality}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="shrOffCountry"
							value="#{backingBean.managedBean.countryLs}"
							itemValue="#{shrOffCountry.countryId}"
							itemLabel="#{shrOffCountry.countryName}" />
						<p:ajax event="change" partialSubmit="true" process="@this"
							listener="#{backingBean.assignPersonNationality}" update="equiPerIdenType,equiPerDtlIdenTypePan,equiPerDtlIdenTypeLblPan"/>
					</p:selectOneMenu> 
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges 
							and not empty backingBean.managedBean.latestPersonnel}"
						oriValue="#{backingBean.managedBean.latestPersonnel.pmCountry.countryId}" 
						currValue="#{backingBean.managedBean.selectedShareHolder.pmCountry.countryId}" 
						alertValue="#{(not empty backingBean.managedBean.latestPersonnel and 
						 not empty backingBean.managedBean.latestPersonnel.pmCountry) ?
						 backingBean.getCountryLabelById(backingBean.managedBean.latestPersonnel.pmCountry.countryId) 
						 : lbl['lbl.txt.na']}"/>
					<p:message id="equiPerNationalMsg" for="equiPerNational"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.salutation']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneMenu id="equiPerSalutation"
							label="#{lbl['lbl.pm.profiles.userdetails.salutation']}"
							value="#{backingBean.managedBean.selectedShareHolder.title.salutationId}"
							style="width: 207px;margin-bottom: 5px;" required="true">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{backingBean.managedBean.salutationSelectItems}" />
						</p:selectOneMenu>
						<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges 
							and not empty backingBean.managedBean.latestPersonnel}"
						oriValue="#{backingBean.managedBean.latestPersonnel.title.salutationId}" 
						currValue="#{backingBean.managedBean.selectedShareHolder.title.salutationId}" 
						alertValue="#{(not empty backingBean.managedBean.latestPersonnel and 
						 not empty backingBean.managedBean.latestPersonnel.title) ?
						 backingBean.getLabelFromSelectItems(backingBean.managedBean.latestPersonnel.title.salutationId,backingBean.managedBean.salutationSelectItems) 
						 : lbl['lbl.txt.na']}"/>
						<p:message id="equiPerSalutationMsg" for="equiPerSalutation"
							showSummary="true" showDetail="false" display="icon" />
				</td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.race']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu label="#{lbl['lbl.sm.person.race']}"
						id="equiPerRace" required="true"
						value="#{backingBean.managedBean.selectedShareHolder.pmRace.raceId}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="select"
							value="#{backingBean.managedBean.raceSelectItems}"
							itemLabel="select.label" itemValue="select.value" />
						<p:ajax event="change" process="@this"/>
					</p:selectOneMenu> 
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.latestPersonnel}"
						oriValue="#{backingBean.managedBean.latestPersonnel.pmRace.raceId}" 
						currValue="#{backingBean.managedBean.selectedShareHolder.pmRace.raceId}" 
						alertValue="#{backingBean.getRaceLabel(backingBean.managedBean.latestPersonnel.pmRace.raceId)}"/>
					<p:message id="equiPerRaceMsg" for="equiPerRace"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.identificationtype']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="equiPerIdenType" required="true"
						label="#{lbl['lbl.sm.identificationtype']}"
						disabled="true"
						value="#{backingBean.managedBean.selectedShareHolder.identificationTypeId}"
						style="width:200px">
						<f:selectItems
							value="#{backingBean.managedBean.identificationTypes}" />
						<p:ajax event="change" partialSubmit="true" process="@this"
							listener="#{backingBean.assignPersonIdentType}"
							update="equiPerDtlIdenTypePan,equiPerDtlIdenTypeLblPan" />
					</p:selectOneMenu> <p:message id="equiPerIdenTypeMsg" for="equiPerIdenType"
						showSummary="true" showDetail="false" display="icon" /></td>

				<td><p:outputPanel id="equiPerDtlIdenTypeLblPan">
						<p:outputLabel value="#{lbl['lbl.sm.person.icNum']}"
							id="equiPerIcNumLbl"
							rendered="#{backingBean.managedBean.selectedShareHolder.identificationType.parameterCode ne 'P'}" />
						<p:outputLabel value="#{lbl['lbl.sm.person.psptNum']}"
							id="equiPerPsptNumLbl"
							rendered="#{backingBean.managedBean.selectedShareHolder.identificationType.parameterCode eq 'P'}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</p:outputPanel></td>

				<td><p:outputPanel id="equiPerDtlIdenTypePan">
						<p:inputText label="#{lbl['lbl.sm.shrHldrInfo.idNo']}"
							required="true" id="equiPerIcNum"
							disabled="#{backingBean.managedBean.disableIcEmail}"
							rendered="#{backingBean.managedBean.selectedShareHolder.identificationType.parameterCode eq 'I'}"
							value="#{backingBean.managedBean.selectedShareHolder.identificationNo}"
							size="35" maxlength="12"
							validatorMessage="#{lbl['lbl.sm.person.icNum']} - #{lbl['lbl.sm.invalidNo']}">
							<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						</p:inputText>
						<p:inputText label="#{lbl['lbl.sm.shrHldrInfo.idNo']}"
							required="true" id="equiPerPasptNum"
							disabled="#{backingBean.managedBean.disableIcEmail}"
							rendered="#{backingBean.managedBean.selectedShareHolder.identificationType.parameterCode ne 'I'}"
							value="#{backingBean.managedBean.selectedShareHolder.identificationNo}"
							size="35" maxlength="12">
							<p:ajax process="@this" partialSubmit="true" update="@this"
								listener="#{backingBean.trimPersonnelPassportValue}" />
						</p:inputText>
						   &#160; <p:graphicImage id="tooltip1"
							value="/css/images/design/tooltips.png" />
						<p:tooltip id="toolinfo1" for="tooltip1">
							<p:outputLabel escape="false"
								value="#{lbl['tt.sm.registration.identification.no']}" />
						</p:tooltip>&#160;
						<p:message id="equiPerIcNumMsg" for="equiPerIcNum"
							rendered="#{backingBean.managedBean.selectedShareHolder.identificationType.parameterCode eq 'I'}"
							showSummary="true" showDetail="false" display="icon" />
						<p:message id="equiPerPasptNumMsg" for="equiPerPasptNum"
							rendered="#{backingBean.managedBean.selectedShareHolder.identificationType.parameterCode ne 'I'}"
							showSummary="true" showDetail="false" display="icon" />
					</p:outputPanel></td>


			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.dob']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:calendar showOn="button" navigator="true"
						display="inline" required="true" readonlyInput="true"
						label="#{lbl['lbl.sm.person.dob']}" id="equiPerDob"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						yearRange="-99:+0" maxdate="#{backingBean.managedBean.currDate}"
						value="#{backingBean.managedBean.selectedShareHolder.birthDate}" />
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges 
							and not empty backingBean.managedBean.latestPersonnel}"
						oriValue="#{backingBean.managedBean.latestPersonnel.birthDate}" 
						currValue="#{backingBean.managedBean.selectedShareHolder.birthDate}" 
						alertValue="#{backingBean.getDateFormat(backingBean.managedBean.latestPersonnel.birthDate)}"/>
					<p:message id="equiPerDobMsg" for="equiPerDob" showSummary="true"
						showDetail="false" display="icon" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.designation']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.person.designation']}"
						id="smPerDesignation" maxlength="30" required="true"
						value="#{backingBean.managedBean.selectedShareHolder.designation}"
						size="35" /> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges 
								and not empty backingBean.managedBean.latestPersonnel}"
							oriValue="#{backingBean.managedBean.latestPersonnel.designation}" 
							currValue="#{backingBean.managedBean.selectedShareHolder.designation}" 
							alertValue="#{backingBean.managedBean.latestPersonnel.designation}"/>
						<p:message id="smPerDesignationMsg"
						for="smPerDesignation" showSummary="true" showDetail="false"
						display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.epfNo']}" /> <p:outputLabel
						value="*" styleClass="mandatory"
						rendered="#{backingBean.managedBean.smAppl.supplierType
						eq SupplierManagementConst.STYPE_CONSULTANT}" /></td>
				<td><p:inputText title="For Malaysian Only" maxlength="10"
						label="#{lbl['lbl.sm.person.epfNo']}"
						required="#{backingBean.managedBean.smAppl.supplierType
						eq SupplierManagementConst.STYPE_CONSULTANT}"
						validatorMessage="#{lbl['lbl.sm.person.epfNo']} - #{lbl['lbl.sm.invalidNo']}"
						value="#{backingBean.managedBean.selectedShareHolder.epfNo}"
						id="equiEpfNo" size="35">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
					</p:inputText> 
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges 
							and not empty backingBean.managedBean.latestPersonnel}"
						oriValue="#{backingBean.managedBean.latestPersonnel.epfNo}" 
						currValue="#{backingBean.managedBean.selectedShareHolder.epfNo}" 
						alertValue="#{backingBean.managedBean.latestPersonnel.epfNo}"/>
					<p:message id="equiEpfNoMsg" for="equiEpfNo" showSummary="true"
						showDetail="false" display="icon" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.exp']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.person.exp']}"
						id="equiExper" required="true"
						validatorMessage="#{lbl['lbl.sm.person.exp']} - #{lbl['lbl.sm.expRange.validMsg']}"
						value="#{backingBean.managedBean.selectedShareHolder.workExperienceYear}"
						size="35" maxlength="5">
						<f:validateDoubleRange for="equiExper"
							minimum="#{SupplierManagementConst.MIN_EXP_RANGE}"
							maximum="#{SupplierManagementConst.MAX_EXP_RANGE}" />
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText> 
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges 
							and not empty backingBean.managedBean.latestPersonnel}"
						oriValue="#{backingBean.managedBean.latestPersonnel.workExperienceYear}" 
						currValue="#{backingBean.managedBean.selectedShareHolder.workExperienceYear}" 
						alertValue="#{backingBean.managedBean.latestPersonnel.workExperienceYear}"/>
					<p:message id="equiExperMsg" for="equiExper" showSummary="true"
						showDetail="false" display="icon" /></td>

			</tr>

			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.person.email']} " /> 
					<p:outputPanel id="emailOutPanelId" >
						<p:outputLabel value="*" styleClass="mandatory" rendered="#{not empty backingBean.managedBean.selectedShareHolder.epRole}"/>
					</p:outputPanel>
				</td>
				<td>
					<p:outputPanel id="emailInputPanelId" >
						<p:inputText label="#{lbl['lbl.sm.person.email']}"
							id="equiEmail" required="#{not empty backingBean.managedBean.selectedShareHolder.epRole}" maxlength="80"
							disabled="#{backingBean.managedBean.disableIcEmail}"
							validatorMessage="#{lbl['lbl.sm.person.email']} - #{lbl['lbl.sm.invalidEmail']}"
							value="#{backingBean.managedBean.selectedShareHolder.email}"
							size="35">
							<f:validateRegex disabled="#{empty backingBean.managedBean.selectedShareHolder.email}" 
								pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
							<p:ajax process="@this" partialSubmit="true"/>
						</p:inputText> 
					</p:outputPanel>
					&#160; <p:graphicImage id="tooltip2"
						value="/css/images/design/tooltips.png" /> <p:tooltip
						id="toolinfo2" for="tooltip2">
						<p:outputLabel escape="false"
							value="#{lbl['tt.sm.registration.equity.owner.email']}" />
					</p:tooltip>&#160; 
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges 
							and not empty backingBean.managedBean.latestPersonnel}"
						oriValue="#{backingBean.managedBean.latestPersonnel.email}" 
						currValue="#{backingBean.managedBean.selectedShareHolder.email}" 
						alertValue="#{backingBean.managedBean.latestPersonnel.email}"/>
					<p:message id="equiEmailMsg" for="equiEmail"
						showSummary="true" showDetail="false" display="icon" /></td>

				<td><p:outputLabel value="#{lbl['lbl.sm.mobileNo']}" /> <p:outputPanel
						id="mobileOutputPanel">
						<p:outputLabel id="equiPerMobMandatory"
							rendered="#{backingBean.managedBean.selectedShareHolder.authorizedFlg eq 1}"
							value="*" styleClass="mandatory" />
					</p:outputPanel></td>
				<td>
					<ac:phone id="equiPerMob" label="#{lbl['lbl.sm.mobileNo']}"
					countryCode="#{backingBean.managedBean.selectedShareHolder.mobileCountry}" 
					areaCode="#{backingBean.managedBean.selectedShareHolder.mobileArea}" 
					number="#{backingBean.managedBean.selectedShareHolder.mobileNo}" 
					isMobile="true" required="#{backingBean.managedBean.selectedShareHolder.authorizedFlg eq 1}"
					validatorMessage="#{lbl['lbl.sm.mobileNo']} - #{lbl['lbl.sm.invalidNo']}"
					telcoId="#{backingBean.managedBean.selectedShareHolder.mobileTelcoId}" />
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.latestPersonnel}"
						oriValue="#{backingBean.managedBean.latestPersonnel.mobileNo}" 
						currValue="#{backingBean.managedBean.selectedShareHolder.mobileNo}" 
						alertValue="#{backingBean.managedBean.latestPersonnel.mobileNo}"/>
				</td>

			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td>
					<ac:phone id="equiPerPhnNo" isMobile="false" label="#{lbl['lbl.sm.phoneno']}"
					countryCode="#{backingBean.managedBean.selectedShareHolder.phoneCountry}" 
					areaCode="#{backingBean.managedBean.selectedShareHolder.phoneArea}" 
					number="#{backingBean.managedBean.selectedShareHolder.phoneNo}"  
					validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" />
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.latestPersonnel}"
						oriValue="#{backingBean.managedBean.latestPersonnel.phoneNo}" 
						currValue="#{backingBean.managedBean.selectedShareHolder.phoneNo}" 
						alertValue="#{backingBean.managedBean.latestPersonnel.phoneNo}"/>
				</td>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
				<td>
					<ac:phone id="equiPerFaxNo" isMobile="false" label="#{lbl['lbl.sm.faxno']}"
					countryCode="#{backingBean.managedBean.selectedShareHolder.faxCountry}" 
					areaCode="#{backingBean.managedBean.selectedShareHolder.faxArea}" 
					number="#{backingBean.managedBean.selectedShareHolder.faxNo}"  
					validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}" /> 
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.latestPersonnel}"
						oriValue="#{backingBean.managedBean.latestPersonnel.faxNo}" 
						currValue="#{backingBean.managedBean.selectedShareHolder.faxNo}" 
						alertValue="#{backingBean.managedBean.latestPersonnel.faxNo}"/>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.bumi']}"
						title="For Malaysian Only" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedShareHolder.bumiFlg}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
						<p:ajax event="change" partialSubmit="true" process="@this" />
					</p:selectOneRadio>
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.latestPersonnel}"
						oriValue="#{backingBean.managedBean.latestPersonnel.bumiFlg}" 
						currValue="#{backingBean.managedBean.selectedShareHolder.bumiFlg}" 
						alertValue="#{backingBean.managedBean.latestPersonnel.bumiFlg eq '1' ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}"/>
				</td>
				<td><p:outputLabel value=" #{lbl['lbl.sm.person.religion']}"
						title="For Malaysian Only" /></td>
				<td colspan="3"><p:selectOneRadio
						value="#{backingBean.managedBean.selectedShareHolder.muslimFlg}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.person.religion.muslim']}"
							itemValue="1" />
						<f:selectItem
							itemLabel="#{lbl['lbl.sm.person.religion.non.muslim']}"
							itemValue="0" />
					</p:selectOneRadio>
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.latestPersonnel}"
						oriValue="#{backingBean.managedBean.latestPersonnel.muslimFlg}" 
						currValue="#{backingBean.managedBean.selectedShareHolder.muslimFlg}" 
						alertValue="#{backingBean.managedBean.latestPersonnel.muslimFlg eq '1' ? 
							lbl['lbl.sm.person.religion.muslim'] : lbl['lbl.sm.person.religion.non.muslim']}"/>
				</td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.user.roles']}" toggleable="true"
		id="shrRolesPanel">
		<ui:include src="personnelRolesPanel.xhtml" />
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.person.shrPrvHdr']}" toggleable="true"
		id="shrPrivPanel">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.disabled.role.msg']}" rendered="#{backingBean.managedBean.disableRoleSelection}"/>
		<p:outputPanel rendered="#{backingBean.managedBean.validSmUserLimit}">
			<br /><h:outputText styleClass="instruction" value="#{lbl['lbl.sm.authorized.personnel.reach.limit.msg']}" escape="false"/><br />
		</p:outputPanel>
		<table>
			<p:outputPanel rendered="#{!backingBean.managedBean.validSmUserLimit or (backingBean.managedBean.validSmUserLimit and backingBean.managedBean.selectedShareHolder.authorizedFlg eq '1')}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.person.isAuth']}" /></td>
					<td><p:selectOneRadio disabled="#{backingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_ADMIN' 
						or backingBean.managedBean.selectedShareHolder.epRole eq 'SUPPLIER_TEMP'}"
							value="#{backingBean.managedBean.selectedShareHolder.authorizedFlg}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
							<p:ajax event="change" process="@this" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								update=":form:tt:shareHolderAddrDialog,shrPrivPanel, @([id$=mobileOutputPanel]),tooltip5"
								listener="#{backingBean.assignShareHolderPrivilege}" partialSubmit="true"/>
						</p:selectOneRadio></td>
					<td><p:graphicImage id="tooltip3"
							value="/css/images/design/tooltips.png"
							style="padding-bottom : 7px;" /> <p:tooltip id="toolinfo3"
							for="tooltip3">
							<p:outputLabel escape="false"
								value="#{lbl['tt.sm.registration.equity.owner.authorized.personal']}" />
						</p:tooltip>
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
								and not empty backingBean.managedBean.latestPersonnel}"
							oriValue="#{backingBean.managedBean.latestPersonnel.authorizedFlg}" 
							currValue="#{backingBean.managedBean.selectedShareHolder.authorizedFlg}" 
							alertValue="#{backingBean.managedBean.latestPersonnel.authorizedFlg eq '1' ? 
								lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}"/>
					</td>
				</tr>
			</p:outputPanel>
		</table>
		<table>
			<tr><td></td></tr>
			<tr>
