<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.person.panHdr']}" toggleable="true"
		id="equiPerDtlPan">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.name']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="equiPerNam" maxlength="50"
						label="#{lbl['lbl.sm.person.name']}" required="true"
						value="#{backingBean.managedBean.selectedShareHolder.name}"
						size="35" /> <p:message id="equiPerNamMsg" for="equiPerNam"
						showSummary="true" showDetail="false" display="icon" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.nationality']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu
						label="#{lbl['lbl.sm.person.nationality']}" id="equiPerNational"
						required="true"
						value="#{backingBean.managedBean.selectedShareHolder.pmCountry.countryId}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="---Select---" itemValue="" />
						<f:selectItems var="shrOffCountry"
							value="#{backingBean.managedBean.countryLs}"
							itemValue="#{shrOffCountry.countryId}"
							itemLabel="#{shrOffCountry.countryName}" />
					</p:selectOneMenu> <p:message id="equiPerNationalMsg" for="equiPerNational"
						showSummary="true" showDetail="false" display="icon" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.identificationtype']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="equiPerIdenType" required="true"
						label="#{lbl['lbl.sm.identificationtype']}"
						value="#{backingBean.managedBean.selectedShareHolder.identificationTypeId}"
						style="width:200px">
						<f:selectItems value="#{backingBean.getDropdownValues('ID')}" />
						<p:ajax event="change" partialSubmit="true" process="@this"
							listener="#{backingBean.assignPersonIdentType}"
							update="equiPerDtlIdenTypePan,equiPerDtlIdenTypeLblPan" />
					</p:selectOneMenu> <p:message id="equiPerIdenTypeMsg" for="equiPerIdenType"
						showSummary="true" showDetail="false" display="icon" /></td>

				<td><p:outputPanel id="equiPerDtlIdenTypeLblPan">
						<p:outputLabel value="#{lbl['lbl.sm.shrHldrInfo.idNo']}"
							id="equiPerIcNumLbl" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</p:outputPanel></td>

				<td><p:outputPanel id="equiPerDtlIdenTypePan">
						<p:inputText label="#{lbl['lbl.sm.shrHldrInfo.idNo']}"
							required="true" id="equiPerIcNum"
							rendered="#{backingBean.managedBean.selectedShareHolder.identificationType.parameterCode eq 'I'}"
							value="#{backingBean.managedBean.selectedShareHolder.identificationNo}"
							size="35" maxlength="12"
							validatorMessage="#{lbl['lbl.sm.person.icNum']} - #{lbl['lbl.sm.invalidNo']}">
							<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						</p:inputText>
						<p:message id="equiPerIcNumMsg" for="equiPerIcNum"
							showSummary="true" showDetail="false" display="icon" />
						<p:inputText label="#{lbl['lbl.sm.shrHldrInfo.idNo']}"
							required="true" id="equiPerPasptNum"
							rendered="#{backingBean.managedBean.selectedShareHolder.identificationType.parameterCode ne 'I'}"
							value="#{backingBean.managedBean.selectedShareHolder.identificationNo}"
							size="35" maxlength="12">
						</p:inputText>
						<p:message id="equiPerPasptNumMsg" for="equiPerPasptNum"
							showSummary="true" showDetail="false" display="icon" />
					</p:outputPanel></td>


			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.dob']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:calendar showOn="button" navigator="true"
						display="inline" required="true" readonlyInput="true"
						label="#{lbl['lbl.sm.person.dob']}" id="equiPerDob"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						yearRange="-99:+0"
						value="#{backingBean.managedBean.selectedShareHolder.birthDate}" />
					<p:message id="equiPerDobMsg" for="equiPerDob" showSummary="true"
						showDetail="false" display="icon" /></td>

				<c:choose>
					<c:when
						test="#{backingBean.managedBean.selectedShareHolder.equityOwner}">
						<td><p:outputLabel value="#{lbl['lbl.sm.person.role']} : " /></td>
						<td>
							<table>
								<tr>
									<td><p:selectBooleanCheckbox disabled="true"
											value="#{backingBean.managedBean.selectedShareHolder.equityOwner}" /></td>
									<td><p:outputLabel
											value="#{lbl['lbl.sm.person.equiOwner']}"
											style="margin-bottom: 5px;" /></td>
									<td><p:selectBooleanCheckbox
											rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType eq '2'}"
											value="#{backingBean.managedBean.selectedShareHolder.director}" /></td>
									<td><p:outputLabel value="#{lbl['lbl.sm.person.dir']}"
											rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType eq '2'}" /></td>
									<td><p:selectBooleanCheckbox
											rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType eq '2'}"
											value="#{backingBean.managedBean.selectedShareHolder.higherManagement}" /></td>
									<td><p:outputLabel
											value="#{lbl['lbl.sm.person.hghMngmt']}"
											rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType eq '2'}" /></td>
								</tr>

							</table>
						</td>
					</c:when>
					<c:otherwise>
						<c:choose>
							<c:when
								test="#{backingBean.managedBean.selectedShareHolder.dirOrHghrMngmt or backingBean.managedBean.selectedShareHolder.director or backingBean.managedBean.selectedShareHolder.higherManagement}">
								<td><p:outputLabel value="#{lbl['lbl.sm.person.role']} : " /></td>
								<td>
									<table>
										<tr>
											<td><p:selectBooleanCheckbox
													value="#{backingBean.managedBean.selectedShareHolder.director}" /></td>
											<td><p:outputLabel value="Director" /></td>
											<td><p:selectBooleanCheckbox
													value="#{backingBean.managedBean.selectedShareHolder.higherManagement}" /></td>
											<td><p:outputLabel value="Higher Management" /></td>
										</tr>

									</table>
								</td>
							</c:when>
							<c:otherwise>
								<c:choose>
									<c:when
										test="#{backingBean.managedBean.smAppl.supplierType eq 'K'}">
										<td><p:outputLabel value="#{lbl['lbl.sm.person.role']}" />
											<p:outputLabel value="*" styleClass="mandatory" /></td>
										<td>
											<table>
												<tr>
													<td><p:selectOneMenu required="true"
															id="equiCntrctRoleFlg"
															label="#{lbl['lbl.sm.person.role']}"
															value="#{backingBean.managedBean.selectedShareHolder.staffRoleFlg}">
															<f:selectItems
																value="#{backingBean.getDropdownValues('KPT')}" />
														</p:selectOneMenu> <p:message id="equiCntrctRoleFlgMsg"
															for="equiCntrctRoleFlg" showSummary="true"
															showDetail="false" display="icon" /></td>
												</tr>

											</table>
										</td>
									</c:when>
									<c:otherwise>
										<td><p:outputLabel value="#{lbl['lbl.sm.person.role']}" />
											<p:outputLabel value="*" styleClass="mandatory" /></td>
										<td>
											<table>
												<tr>
													<td><p:selectOneMenu required="true"
															label="#{lbl['lbl.sm.person.role']}"
															id="equiConsultRoleFlg"
															value="#{backingBean.managedBean.selectedShareHolder.staffRoleFlg}">
															<f:selectItems
																value="#{backingBean.getDropdownValues('JPT')}" />
														</p:selectOneMenu> <p:message id="equiConsultRoleFlgMsg"
															for="equiConsultRoleFlg" showSummary="true"
															showDetail="false" display="icon" /></td>
												</tr>

											</table>
										</td>
									</c:otherwise>

								</c:choose>

							</c:otherwise>
						</c:choose>
					</c:otherwise>
				</c:choose>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.designation']}" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.person.designation']}"
						maxlength="30"
						value="#{backingBean.managedBean.selectedShareHolder.designation}"
						size="35" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.epfNo']}" /></td>
				<td><p:inputText title="For Malaysian Only" maxlength="10"
						label="#{lbl['lbl.sm.person.epfNo']}"
						validatorMessage="#{lbl['lbl.sm.person.epfNo']} - #{lbl['lbl.sm.invalidNo']}"
						value="#{backingBean.managedBean.selectedShareHolder.epfNo}"
						id="equiEpfNo" size="35">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
					</p:inputText> <p:message id="equiEpfNoMsg" for="equiEpfNo" showSummary="true"
						showDetail="false" display="icon" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.exp']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.person.exp']}"
						id="equiExper" required="true"
						value="#{backingBean.managedBean.selectedShareHolder.workExperienceYear}"
						size="35" maxlength="2">
						<f:validateLongRange minimum="0" maximum="99" />
					</p:inputText> <p:message id="equiExperMsg" for="equiExper" showSummary="true"
						showDetail="false" display="icon" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.email']} " /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.person.email']}"
						id="equiEmail" required="true" maxlength="80"
						validatorMessage="#{lbl['lbl.sm.person.email']} - #{lbl['lbl.sm.invalidEmail']}"
						value="#{backingBean.managedBean.selectedShareHolder.email}"
						size="35">
						<f:validateRegex
							pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
					</p:inputText> <p:message id="equiEmailMsg" for="equiEmail" showSummary="true"
						showDetail="false" display="icon" /></td>


			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.mobileNo']}" /></td>
				<td><p:inputText size="35" maxlength="12"
						value="#{backingBean.managedBean.selectedShareHolder.mobileNo}"
						validatorMessage="#{lbl['lbl.sm.mobileNo']} - #{lbl['lbl.sm.invalidNo']}"
						label="#{lbl['lbl.sm.mobileNo']}" id="equiPerMob">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
					</p:inputText> <p:message id="equiPerMobMsg" for="equiPerMob" showSummary="true"
						showDetail="false" display="icon" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td><p:inputText size="35" maxlength="12"
						value="#{backingBean.managedBean.selectedShareHolder.phoneNo}"
						label="#{lbl['lbl.sm.phoneno']}" id="equiPerPhnNo"
						validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
					</p:inputText> <p:message id="equiPerPhnNoMsg" for="equiPerPhnNo"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
				<td><p:inputText size="35" maxlength="12"
						validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}"
						value="#{backingBean.managedBean.selectedShareHolder.faxNo}"
						label="#{lbl['lbl.sm.faxno']}" id="equiPerFaxNo">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
					</p:inputText> <p:message id="equiPerFaxNoMsg" for="equiPerFaxNo"
						showSummary="true" showDetail="false" display="icon" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.bumi']}"
						title="For Malaysian Only" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedShareHolder.bumiFlg}">
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel value=" #{lbl['lbl.sm.person.religion']}"
						title="For Malaysian Only" /></td>
				<td colspan="3"><p:selectOneRadio
						value="#{backingBean.managedBean.selectedShareHolder.muslimFlg}">
						<f:selectItem itemLabel="Islam" itemValue="1" />
						<f:selectItem itemLabel="Non-Islam" itemValue="0" />
					</p:selectOneRadio></td>

			</tr>

		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.person.shrPrvHdr']}" toggleable="true"
		id="shrPrivPanel"
		rendered="#{backingBean.managedBean.validSmUserLimit or backingBean.managedBean.userWithRole}">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.isAuth']}" /></td>
				<td><p:selectOneRadio
						disabled="#{backingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_ADMIN'}"
						value="#{backingBean.managedBean.selectedShareHolder.authorizedFlg}">
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
						<p:ajax event="change" update="shrPrivPanel"
							listener="#{backingBean.assignShareHolderPrivilege}" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.eprole']}" /></td>
				<td><p:selectOneMenu id="smPersnEpRole"
						label="#{lbl['lbl.sm.userprofile.eprole']}"
						value="#{backingBean.managedBean.selectedShareHolder.epRole}"
						disabled="#{backingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_ADMIN'}"
						style="width: 207px;margin: 5px 0px 5px 0px;">
						<f:selectItem itemLabel="-- Select --" itemValue="" />
						<f:selectItems value="#{backingBean.managedBean.ePRoleList}" />
						<p:ajax event="change" update="shrPrivPanel"
							listener="#{backingBean.assignShareHolderPrivilegeByEpRole}" />
					</p:selectOneMenu> <p:message id="smPersnEpRoleMsg" for="smPersnEpRole"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.isSoftCert']}"
						rendered="#{backingBean.managedBean.selectedShareHolder.authorizedFlg eq '1' and backingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_USER'}" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedShareHolder.softcertFlg}"
						disabled="#{backingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_ADMIN'}"
						rendered="#{backingBean.managedBean.selectedShareHolder.authorizedFlg eq '1' and backingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_USER'}">
						<f:selectItem itemLabel="Yes" itemValue="2" />
						<f:selectItem itemLabel="No" itemValue="0" />
						<p:ajax event="change" update="shrPrivPanel"
							listener="#{backingBean.assignShareHolderPrivilege}" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.isContrSign']}"
						rendered="#{backingBean.managedBean.selectedShareHolder.authorizedFlg eq '1' and backingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_USER' and backingBean.managedBean.selectedShareHolder.softcertFlg eq '2'}" /></td>
				<td><p:selectOneRadio
						value="#{backingBean.managedBean.selectedShareHolder.contractSignerFlg}"
						rendered="#{backingBean.managedBean.selectedShareHolder.authorizedFlg eq '1' and backingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_USER' and backingBean.managedBean.selectedShareHolder.softcertFlg eq '2'}">
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
					</p:selectOneRadio></td>
			</tr>
		</table>

	</p:panel>

	<p:panel header="#{lbl['lbl.sm.person.shrDtls']}" toggleable="true"
		id="shareAmtPanel"
		rendered="#{backingBean.managedBean.selectedShareHolder.equityOwner}">
		<table style="width: 100%">
			<tr>
				<td style="width: 13%;"><p:outputLabel
						value="#{lbl['lbl.sm.person.shrAmt']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td style="padding-right: 42px;"><p:inputText
						label="#{lbl['lbl.sm.person.shrAmt']}" id="equiShrDetAmt"
						value="#{backingBean.managedBean.selectedShareHolder.shareAmt}"
						size="35">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax event="blur" update="shareAmtPanel"
							listener="#{backingBean.calculateShareHolderPercent}" />
					</p:inputText> <p:message id="equiShrDetAmtMsg" for="equiShrDetAmt"
						showSummary="true" showDetail="false" display="icon" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.shrPerc']}" /></td>
				<td><p:inputText title="Auto Populated Value"
						value="#{backingBean.managedBean.selectedShareHolder.sharePercentage}"
						size="10" readonly="true" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>

			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.person.addrDtls']} " toggleable="true"
		id="shareHolderAddrDialog">
		<ui:include
			src="/xhtml/sm/shared/mofRegistration/shareHolderAddressInfoPopUpForm.xhtml" />
	</p:panel>

	<p:panel header="Job Function" toggleable="true" id="equiShrHldrJbFnc">
		<p:dataTable id="shrJfdt" widgetVar="suppPrsnJobFunDtWidVar"
			value="#{backingBean.managedBean.selectedShareHolder.smStaffExperiences}"
			var="jf"
			selection="#{backingBean.managedBean.selectedShrHldrJobFunctions}"
			rowIndexVar="rowIndex" rowKey="#{jf}">
			<ac:paginator for="shrJfdt" />
			<p:column selectionMode="multiple" style="width:2%" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="Company" />
				</f:facet>
				<h:outputText value="#{jf.companyName}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Designation" />
				</f:facet>
				<h:outputText value="#{jf.designation}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Year From" />
				</f:facet>
				<h:outputText value="#{jf.fromYear}" maxlength="4" label="Year From" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Year To" />
				</f:facet>
				<h:outputText value="#{jf.toYear}" maxlength="4" label="Year To" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.label.action']}">
				<p:commandLink update=":form:tt:equiJobFunctionInfo"
					action="#{backingBean.assignSelShrHldrJobFunc(jf)}"
					partialSubmit="true" process="@this">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png"
						style="margin-right:2px;" />
				</p:commandLink>

			</p:column>

		</p:dataTable>
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="Add"
				action="#{backingBean.addShrHldrJobFunction()}"
				update=":form:tt:equiJobFunctionInfo" partialSubmit="true"
				process="@this" />
			<p:commandButton value="Delete"
				action="#{backingBean.deleteSelectedShrHldrJobFunction()}"
				update=":form:tt:shrJfdt" partialSubmit="true"
				process="equiShrHldrJbFnc" />
		</div>
	</p:panel>
	<p:dialog width="500px" height="200px" header="Job Function Details "
		id="equiJobFunctionInfo" widgetVar="equiJobFunctionInfo"
		closable="false" resizable="false" showEffect="fade" hideEffect="fade"
		modal="true">
		<p:messages id="equiJobFunctionInfoMsg" showSummary="false"
			showDetail="true" autoUpdate="true" closable="true" />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value=" Company" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="35"
						required="#{backingBean.managedBean.valueReqd}" label="Company"
						id="equiJbFnInfCmpName" maxlength="100"
						value="#{backingBean.managedBean.selectedJobFunction.companyName}" />
					<p:message id="equiJbFnInfCmpNameMsg"
						for=":form:tt:equiJbFnInfCmpName" showSummary="true"
						showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value=" Designation" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="35" maxlength="250"
						required="#{backingBean.managedBean.valueReqd}"
						label="Designation" id="equiJbFnInfDesg"
						value="#{backingBean.managedBean.selectedJobFunction.designation}" />
					<p:message id="equiJbFnInfDesgMsg" for=":form:tt:equiJbFnInfDesg"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value=" Year From" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText style="margin-bottom : 5px;" size="35"
						required="#{backingBean.managedBean.valueReqd}"
