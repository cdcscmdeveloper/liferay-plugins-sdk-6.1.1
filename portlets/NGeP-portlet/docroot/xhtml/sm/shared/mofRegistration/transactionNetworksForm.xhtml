<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Transaction Network" toggleable="true">
		<table style="width: 250px">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By PO: "
						title="For PO to highlight the verified section " /></td>

			</tr>
			<tr>
				<td width="10px"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By Approver: "
						title="For Approver to highlight the verified section " /></td>
			</tr>
		</table>
		<br />
		<table style="width: 100%">

			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
						value="#{backingBean.managedBean.smAppl.withFederal}" /></td>
				<td valign="middle"><h:outputText value=" Fedral Govt " /></td>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
						value="#{backingBean.managedBean.smAppl.withState}" /></td>
				<td valign="middle"><h:outputText value=" State Govt " /></td>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
						value="#{backingBean.managedBean.smAppl.withFederal}" /></td>
				<td valign="middle"><h:outputText value=" Statutory Bodies " /></td>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
						value="#{backingBean.managedBean.smAppl.withStatutory}" /></td>
				<td valign="middle"><h:outputText value=" Others " /></td>
			</tr>
		</table>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
