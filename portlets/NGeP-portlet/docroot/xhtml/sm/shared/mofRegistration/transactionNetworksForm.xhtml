<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.busNtw.panHdr']}" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.trnsNetworkVerified}"
							id="poTrxVer">
							<p:ajax update=":form:tt:trxInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:trxInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.trnsNetworkVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.trnsNetworkVerified}"
							id="apprTrxVer">
							<p:ajax update=":form:tt:trxInfPan,:form:revPanHdr"
								event="change" process="@this,:form:tt:trxInfPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.trnsNetworkVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="trxInfPan">
			<p:blockUI block=":form:tt:trxInfPan" widgetVar="buiPoTrx"
				id="poTrxBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.trnsNetworkVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.trnsNetworkVerified : false)}" />

			<table style="width: 100%">

				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.withFederal}"
							disabled="#{backingBean.managedBean.smAppl.supplierType
						eq SupplierManagementConst.STYPE_CONTRACTOR}" /></td>
					<td valign="middle" width="150px;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.fdrGov']}" /></td>

					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.withState}" /></td>
					<td valign="middle" width="150px;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.stateGov']}" /></td>

					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.withStatutory}" /></td>
					<td valign="middle" width="150px;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.statBody']}" /></td>

					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.withGlc}" /></td>
					<td valign="middle" width="170px;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.glc']}" /></td>

					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.withOthers}" /></td>
					<td valign="middle"><h:outputText
							value="#{lbl['lbl.sm.busNtw.others']}" /></td>
				</tr>
			</table>
			<br />
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.trnsNetworkRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{backingBean.managedBean.poSecReview.trnsNetworkRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{backingBean.managedBean.apprvrSecReview.trnsNetworkRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
</ui:composition>
