<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.panHdr.comBasic']}" toggleable="true"
		id="basHdPan">
		<table style="width: 350px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.basicVerified}"
							id="poBasVer">
							<p:ajax update=":form:tt:basHdPan,:form:revPanHdr" event="change"
								process=":form:tt:basHdPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.basicVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.basicVerified}"
							id="apprBasVer">
							<p:ajax update=":form:tt:basHdPan,:form:revPanHdr" event="change"
								process=":form:tt:basHdPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.basicVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<p:outputPanel id="bsInfPan" layout="block">
			<p:blockUI block=":form:tt:bsInfPan" widgetVar="buiPoBas"
				id="poBasBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.basicVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.basicVerified : false)}" />

			<table style="width: 100%">
				<tr>

					<td><p:outputLabel value="#{lbl['lbl.sm.companyname']}" /></td>
					<td><p:inputText
							disabled="#{backingBean.managedBean.disabledCompanyName}"
							readonly="#{backingBean.managedBean.disabledCompanyName}"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.companyName}"
							size="35" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.application.no']}" /></td>
					<td><p:inputText disabled="true" readonly="true"
							value="#{backingBean.managedBean.smAppl.applNo}" size="35"
							rendered="#{backingBean.managedBean.smAppl.activeAppl or backingBean.managedBean.smAppl.resubmit}" />
						<p:inputText disabled="true" readonly="true" size="35"
							rendered="#{! backingBean.managedBean.smAppl.activeAppl and ! backingBean.managedBean.smAppl.resubmit}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.regtype']}" /></td>
					<td style="word-wrap: break-word"><p:outputLabel
							rendered="#{backingBean.managedBean.disabledBusinessType}"
							styleClass="outputLabel-view"
							value="#{backingBean.getParameterDesc(SupplierManagementConst.supplierBusinessType,backingBean.managedBean.smSupplier.businessType)}" />
						<p:selectOneMenu id="smBusTypeId" required="true"
							label="#{lbl['lbl.sm.regtype']}"
							value="#{backingBean.managedBean.smSupplier.businessType}"
							rendered="#{!backingBean.managedBean.disabledBusinessType}"
							style="width:310px">
							<f:selectItems value="#{backingBean.managedBean.businessTypeLs}" />
						</p:selectOneMenu> <p:message id="smBusTypeIdMsg" for="smBusTypeId"
							showSummary="true" showDetail="false" display="icon" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.rocNo']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.smSupplier.regNo}"
							disabled="true" readonly="true" size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.taxRefNo']}" /></td>
					<td><p:inputText label="#{lbl['lbl.sm.taxRefNo']}"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.incomeTaxNo}"
							id="smIncTaxNum" size="35" maxlength="20" />
						<ac:smFieldChangeAlert 
								isShow="#{backingBean.managedBean.showFieldChanges}"
								oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.incomeTaxNo}" 
								currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.incomeTaxNo}" 
								alertValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.incomeTaxNo}"/>
						<p:message
							id="smIncTaxNumMsg" for="smIncTaxNum" showSummary="true"
							showDetail="false" display="icon" />
					</td>
					<td><p:outputLabel value="#{lbl['lbl.sm.estdate']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.smSupplier.establishDate}"
							readonly="true" size="35">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.epNo']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.smSupplier.epNo}" id="smEpNum"
							size="35" maxlength="20" readonly="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.mofNo']}" /></td>
					<td><p:inputText value="#{backingBean.managedBean.mofNumber}"
							readonly="true" size="35">
						</p:inputText></td>
				</tr>
				<tr>
					<td style="vertical-align: top;"><p:outputLabel
							value="#{lbl['lbl.sm.companyaddress']}" style="padding-top :5px;" />
						<p:outputLabel value="*" styleClass="mandatory"
							style="padding-top :5px;" /></td>
					<td>
						<table style="width: 100%">
							<tr>
								<td><p:inputText size="35" required="true" id="smSupAddr1"
										maxlength="35" label="#{lbl['lbl.sm.companyaddress']}"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}" />
									<ac:smFieldChangeAlert 
										isShow="#{backingBean.managedBean.showFieldChanges}"
										oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}" 
										currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}" 
										alertValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}"/>
									<p:message id="smSupAddr1Msg" for="smSupAddr1"
										showSummary="true" showDetail="false" display="icon" /></td>
							</tr>
							<tr>
								<td><p:inputText size="35" maxlength="35" id="smSupAddr2"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}" />
									<ac:smFieldChangeAlert 
										isShow="#{backingBean.managedBean.showFieldChanges}"
										oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}" 
										currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}" 
										alertValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}"/>
								</td>
							</tr>
							<tr>
								<td><p:inputText size="35" maxlength="35" id="smSupAddr3"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}" />
									<ac:smFieldChangeAlert 
										isShow="#{backingBean.managedBean.showFieldChanges}"
										oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}" 
										currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}" 
										alertValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}"/>
								</td>
							</tr>
							<tr>
								<td><p:inputText size="35" maxlength="35" id="smSupAddr4"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address4}" />
									<ac:smFieldChangeAlert 
										isShow="#{backingBean.managedBean.showFieldChanges}"
										oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address4}" 
										currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address4}" 
										alertValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address4}"/>
								</td>
							</tr>
						</table>
					</td>
					<td>
						<TABLE style="width: 100%; height: 100px;">
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
							</tr>
							<tr>

								<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
							</tr>
						</TABLE>
					</td>
					<td>
						<TABLE style="width: 100%">
							<tr>
								<td><p:selectOneMenu label="#{lbl['lbl.sm.country']}"
										style="width: 207px;margin-bottom: 5px;" required="true"
										id="smSupCont"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.countryId}">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="" />
										<f:selectItems var="basicCountry"
											value="#{backingBean.managedBean.countryItems}" />
										<p:ajax event="change" process="@this"
											listener="#{backingBean.onChangeCountry(backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress,SupplierManagementConst.SM_BASIC_INFO_PANEL)}"
											update="basicComState,basicCompDist,basicCompCity,postCodeCompPanelId" />
									</p:selectOneMenu> 
									<ac:smFieldChangeAlert 
										isShow="#{backingBean.managedBean.showFieldChanges}"
										oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCountry.countryId}" 
										currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCountry.countryId}" 
										alertValue="#{(not empty backingBean.managedBean.latestAppl and not empty backingBean.managedBean.latestAppl.smCompanyBasic) ?
											backingBean.getCountryLabelById(backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCountry.countryId)
											: lbl['lbl.txt.na']}"/>
									<p:message id="smSupContMsg" for="smSupCont"
										showSummary="true" showDetail="false" display="icon" /></td>
							</tr>
							<tr>

								<td>
								<p:selectOneMenu
										style="width: 207px;margin-bottom: 5px;" id="basicComState"
										required="true" label="#{lbl['lbl.sm.state']}"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.stateId}">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="" />
										<f:selectItems var="basicState"
											value="#{backingBean.managedBean.basicCompanyStates}" />
										<p:ajax event="change" process="@this"
											listener="#{backingBean.onChangeState(backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress, 
											SupplierManagementConst.SM_BASIC_INFO_PANEL)}"
											update="basicCompDist,basicCompCity" />
									</p:selectOneMenu> 
									<ac:smFieldChangeAlert 
										isShow="#{backingBean.managedBean.showFieldChanges}"
										oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateId}" 
										currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateId}" 
										alertValue="#{(not empty backingBean.managedBean.latestAppl and not empty backingBean.managedBean.latestAppl.smCompanyBasic) ?
											backingBean.getStateLabelById(backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateId)
											: lbl['lbl.txt.na']}"/>
									<p:message id="basicComStateMsg" for="basicComState"
										showSummary="true" showDetail="false" display="icon" /></td>
							</tr>
							<tr>
								<td><p:selectOneMenu
										style="width: 207px;margin-bottom: 5px;" id="basicCompDist"
										required="true" label="#{lbl['lbl.sm.district']}"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.districtId}">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="" />
										<f:selectItems var="dist"
											value="#{backingBean.managedBean.basicCompanyDistricts}" />
										<p:ajax event="change" process="@this"
											listener="#{backingBean.onChangeDistrict(backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress,
											SupplierManagementConst.SM_BASIC_INFO_PANEL)}"
											update="basicCompCity" />
									</p:selectOneMenu> 
									<ac:smFieldChangeAlert 
										isShow="#{backingBean.managedBean.showFieldChanges}"
										oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict.districtId}" 
										currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict.districtId}" 
										alertValue="#{(not empty backingBean.managedBean.latestAppl and not empty backingBean.managedBean.latestAppl.smCompanyBasic) ?
											backingBean.getDistrictLabelById(backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict.districtId)
											: lbl['lbl.txt.na']}"/>
									<p:message id="basicCompDistMsg" for="basicCompDist"
										showSummary="true" showDetail="false" display="icon" /></td>

							</tr>
							<tr>
								<td><p:selectOneMenu
										style="width: 207px;margin-bottom: 5px;" id="basicCompCity"
										required="true" label="#{lbl['lbl.sm.towncity']}"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.cityId}">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="" />
										<f:selectItems var="city"
											value="#{backingBean.managedBean.basicCompanyCities}" />
										<p:ajax event="change" process="@this"
											listener="#{backingBean.onChangeCity(backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress,
											SupplierManagementConst.SM_BASIC_INFO_PANEL)}"
											update="basicCompCity" />
									</p:selectOneMenu> 
									<ac:smFieldChangeAlert 
										isShow="#{backingBean.managedBean.showFieldChanges}"
										oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity.cityId}" 
										currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity.cityId}" 
										alertValue="#{(not empty backingBean.managedBean.latestAppl and not empty backingBean.managedBean.latestAppl.smCompanyBasic) ?
											backingBean.getCityLabelById(backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity.cityId)
											: lbl['lbl.txt.na']}"/>
									<p:message id="basicCompCityMsg" for="basicCompCity"
										showSummary="true" showDetail="false" display="icon" />
										
								</td>
							</tr>
						</TABLE>
					</td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:outputPanel id="postCodeCompPanelId">
							<p:outputPanel
								rendered="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.countryId==backingBean.managedBean.myCountryId}">
								<p:inputText maxlength="5" required="true"
									label="#{lbl['lbl.sm.postcode']}" id="smSupPostCodeMy"
									value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}"
									validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
									size="35">
									<f:validator validatorId="postcodeValidator" />
								</p:inputText>
								<ac:smFieldChangeAlert 
										isShow="#{backingBean.managedBean.showFieldChanges}"
										oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}" 
										currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}" 
										alertValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}"/>
								<p:message id="smSupPostCodeMyMsg" for="smSupPostCodeMy"
									showSummary="true" showDetail="false" display="icon" />
							</p:outputPanel>
							<p:outputPanel
								rendered="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.countryId!=backingBean.managedBean.myCountryId}">
								<p:inputText maxlength="10" required="true"
									label="#{lbl['lbl.sm.postcode']}" id="smSupPostCodeForeign"
									value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}"
									size="35">
								</p:inputText>
								<ac:smFieldChangeAlert 
										isShow="#{backingBean.managedBean.showFieldChanges}"
										oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}" 
										currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}" 
										alertValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}"/>
								<p:message id="smSupPostCodeForeignMsg"
									for="smSupPostCodeForeign" showSummary="true"
									showDetail="false" display="icon" />
							</p:outputPanel>
						</p:outputPanel></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.annualRev']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							label="#{lbl['lbl.sm.annualRev']}" required="true"
							id="smSupAnnRev"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.annualRevenue}">
							<f:selectItems value="#{backingBean.getDropdownValues('SAR')}" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges}"
							oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.annualRevenue}" 
							currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.annualRevenue}" 
							alertValue="#{backingBean.getAnnualRevById(backingBean.managedBean.latestAppl.smCompanyBasic.annualRevenue)}"/>
						<p:message id="smSupAnnRevMsg" for="smSupAnnRev"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td>
						<ac:phone id="basPhnNum" isMobile="false" label="#{lbl['lbl.sm.phoneno']}"
						countryCode="#{backingBean.managedBean.smAppl.smCompanyBasic.phoneCountry}" 
						areaCode="#{backingBean.managedBean.smAppl.smCompanyBasic.phoneArea}" 
						number="#{backingBean.managedBean.smAppl.smCompanyBasic.phoneNo}"  
						validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" />
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges}"
							oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.phoneNo}" 
							currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.phoneNo}" 
							alertValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.phoneNo}"/>
					</td>
					<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
					<td>
						<ac:phone id="basFaxNum" isMobile="false" label="#{lbl['lbl.sm.faxno']}"
						countryCode="#{backingBean.managedBean.smAppl.smCompanyBasic.faxCountry}" 
						areaCode="#{backingBean.managedBean.smAppl.smCompanyBasic.faxArea}" 
						number="#{backingBean.managedBean.smAppl.smCompanyBasic.faxNo}"  
						validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}" /> 
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges}"
							oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.faxNo}" 
							currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.faxNo}" 
							alertValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.faxNo}"/>
					</td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.website']}" /></td>
					<td colspan="3"><p:outputLabel value="http://"
							style="float: left;padding: 5px 0 0 0;" /> <p:inputText
							size="50"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.website}" />
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges}"
							oriValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.website}" 
							currValue="#{backingBean.managedBean.smAppl.smCompanyBasic.website}" 
							alertValue="#{backingBean.managedBean.latestAppl.smCompanyBasic.website}"/>
					</td>
					<td>
						<p:outputPanel id="localAuthLabelOutPanelId" 
							rendered="#{backingBean.managedBean.smSupplier.businessType eq 'D' or backingBean.managedBean.smSupplier.businessType eq 'E'
								or backingBean.managedBean.smSupplier.businessType eq 'G' or backingBean.managedBean.smSupplier.businessType eq 'H'}">
							<p:outputLabel value="#{lbl['lbl.sm.local.authority']}" />
							<p:outputLabel value="*" styleClass="mandatory" />
						</p:outputPanel>
					</td>
					<td>
						<p:outputPanel id="localAuthInputOutPanelId" 
							rendered="#{backingBean.managedBean.smSupplier.businessType eq 'D' or backingBean.managedBean.smSupplier.businessType eq 'E'
								or backingBean.managedBean.smSupplier.businessType eq 'G' or backingBean.managedBean.smSupplier.businessType eq 'H'}">
							<ac:smLocalAuthoritySelectItems backingBean="#{backingBean}" 
								smSupplier="#{backingBean.managedBean.smSupplier}" required="true"/>
						</p:outputPanel>
					</td>
				</tr>
