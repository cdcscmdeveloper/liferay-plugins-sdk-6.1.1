<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Company Information" toggleable="true" id="basHdPan">
		<table style="width: 250px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.basicVerified}"
							id="poBasVer">
							<p:ajax update=":form:tt:bsInfPan,:form:revPanHdr" event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.basicVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.basicVerified}"
							id="apprBasVer">
							<p:ajax update=":form:tt:bsInfPan,:form:revPanHdr" event="change"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.basicVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />

		<p:panel id="bsInfPan">
			<p:blockUI block=":form:tt:bsInfPan" widgetVar="buiPoBas"
				id="poBasBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.basicVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.basicVerified : false)}" />



			<table style="width: 100%">
				<tr>

					<td><p:outputLabel value="#{lbl['lbl.sm.companyname']}" /></td>
					<td><p:inputText disabled="true" readonly="true"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.companyName}"
							size="35" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.application.no']}" /></td>
					<td><p:inputText disabled="true" readonly="true"
							value="#{backingBean.managedBean.smAppl.applNo}" size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="* #{lbl['lbl.sm.regtype']}" /></td>
					<td><p:inputText disabled="true" readonly="true"
							value="#{backingBean.managedBean.smSupplier.businessType}"
							size="35" /> <!-- rendered="#{backingBean.managedBean.smSupplier.businessType == 1}" />
					<p:inputText disabled="true" readonly="true" value="ROC - BERHAD"
						rendered="#{backingBean.managedBean.smSupplier.businessType == 2}" />
					<p:inputText disabled="true" readonly="true"
						value="ROS - PERKONGSIAN"
						rendered="#{backingBean.managedBean.smSupplier.businessType == 3}" /> -->
					</td>
					<td><p:outputLabel value="* #{lbl['lbl.sm.rocNo']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.smSupplier.regNo}"
							disabled="true" readonly="true" size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.sm.taxRefNo']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.smSupplier.incomeTaxNo}"
							disabled="true" readonly="true" size="35" /></td>
					<td><p:outputLabel
							value="* #{lbl['lbl.sm.estdate']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.smSupplier.establishDate}"
							readonly="true" size="35">
							<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
						</p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.companyaddress']}" /></td>
					<td><p:inputText size="35" colspan="3" /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText size="35" colspan="3" /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText size="35" colspan="3" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.sm.country']}" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
							<!-- <f:selectItem itemLabel="Select " itemValue="" /> -->
							<f:selectItem itemLabel="Malaysia" itemValue="MY" />
						</p:selectOneMenu></td>
					<td></td>
					<td></td>
				</tr>
				<tr>

					<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItem itemLabel="SELANGOR" itemValue="SEL" />
							<f:selectItem itemLabel="WILAYAH PERSEKUTUAN (K.L)"
								itemValue="KL" />
							<f:selectItem itemLabel="PULAU PINANG" itemValue="PG" />
						</p:selectOneMenu></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItem itemLabel="NABAWAN" itemValue="SEL" />
							<f:selectItem itemLabel="PADANG TERAP" itemValue="KL" />
							<f:selectItem itemLabel="PAKAN" itemValue="PG" />
						</p:selectOneMenu></td>

				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItem itemLabel="CYBERJAYA" itemValue="SEL" />
							<f:selectItem itemLabel="SEPANG" itemValue="KL" />
							<f:selectItem itemLabel="NILAI" itemValue="PG" />
							<f:selectItem itemLabel="KUALA KUBU BARU" itemValue="PG" />
						</p:selectOneMenu></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:inputText size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /></td>
					<td><p:inputText size="35" /></td>
					<td><p:outputLabel value="Fax No." /></td>
					<td><p:inputText size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.website']}" /></td>
					<td colspan="3">http://<p:inputText size="30"
							value="www.StarMarketing.com" /> <!-- #{backingBean.managedBean.smSupplier.webSite} --></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* #{lbl['lbl.sm.annualRev']}" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItem itemLabel="Kuarang Daripada RM 100,000"
								itemValue="1" />
							<f:selectItem itemLabel="Kuarang Daripada RM 500,000"
								itemValue="2" />
							<f:selectItem itemLabel="Kuarang Daripada RM 1,000,000"
								itemValue="3" />
							<f:selectItem itemLabel="Lebih Daripada RM 1,000,000"
								itemValue="4" />
						</p:selectOneMenu></td>
					<td></td>
					<td></td>
				</tr>
				<p:outputPanel rendered="#{backingBean.managedBean.poUser}">

					<tr>
						<td><p:outputLabel value="PO Remarks" /></td>
						<td colspan="3"><p:inputTextarea autoResize="true" cols="41" /></td>
					</tr>

				</p:outputPanel>
				<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" /></td>

					</tr>

				</p:outputPanel>
			</table>
		</p:panel>

	</p:panel>
</ui:composition>
