<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.panHdr.comBasic']}" toggleable="true"
		id="basHdPan">
		<table style="width: 350px">
			<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.poSecReview.basicVerified}"
							id="poBasVer">
							<p:ajax update=":form:tt:basHdPan,:form:revPanHdr" event="change"
								process=":form:tt:basHdPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.basicVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.apprvrSecReview.basicVerified}"
							id="apprBasVer">
							<p:ajax update=":form:tt:basHdPan,:form:revPanHdr" event="change"
								process=":form:tt:basHdPan"
								listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.basicVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<p:outputPanel id="bsInfPan" layout="block">
			<p:blockUI block=":form:tt:bsInfPan" widgetVar="buiPoBas"
				id="poBasBlc"
				blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.basicVerified : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.basicVerified : false)}" />

			<table style="width: 100%">
				<tr>

					<td><p:outputLabel value="#{lbl['lbl.sm.companyname']}" /></td>
					<td><p:inputText
							disabled="#{backingBean.managedBean.disabledCompanyName}"
							readonly="#{backingBean.managedBean.disabledCompanyName}"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.companyName}"
							size="35" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.application.no']}" /></td>
					<td><p:inputText disabled="true" readonly="true"
							value="#{backingBean.managedBean.smAppl.applNo}" size="35"
							rendered="#{backingBean.managedBean.smAppl.activeAppl or backingBean.managedBean.smAppl.resubmit}" />
						<p:inputText disabled="true" readonly="true" size="35"
							rendered="#{! backingBean.managedBean.smAppl.activeAppl and ! backingBean.managedBean.smAppl.resubmit}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.regtype']}" /></td>
					<td style="word-wrap: break-word"><p:outputLabel
							rendered="#{backingBean.managedBean.disabledBusinessType}"
							styleClass="outputLabel-view"
							value="#{backingBean.getParameterDesc(SupplierManagementConst.supplierBusinessType,backingBean.managedBean.smSupplier.businessType)}" />
						<p:selectOneMenu id="smBusTypeId" required="true"
							label="#{lbl['lbl.sm.regtype']}"
							value="#{backingBean.managedBean.smSupplier.businessType}"
							rendered="#{!backingBean.managedBean.disabledBusinessType}"
							style="width:310px">
							<f:selectItems value="#{backingBean.managedBean.businessTypeLs}" />
						</p:selectOneMenu> <p:message id="smBusTypeIdMsg" for="smBusTypeId"
							showSummary="true" showDetail="false" display="icon" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.rocNo']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.smSupplier.regNo}"
							disabled="true" readonly="true" size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.taxRefNo']}" /></td>
					<td><p:inputText label="#{lbl['lbl.sm.taxRefNo']}"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.incomeTaxNo}"
							id="smIncTaxNum" size="35" maxlength="20" /> <p:message
							id="smIncTaxNumMsg" for="smIncTaxNum" showSummary="true"
							showDetail="false" display="icon" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.estdate']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.smSupplier.establishDate}"
							readonly="true" size="35">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.epNo']}" /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.smSupplier.epNo}" id="smEpNum"
							size="35" maxlength="20" readonly="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.mofNo']}" /></td>
					<td><p:inputText value="#{backingBean.managedBean.mofNumber}"
							readonly="true" size="35">
						</p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.gstNo']}" /></td>
					<td><c:choose>
							<c:when test="#{backingBean.managedBean.supplierUser}">
								<p:inputText label="#{lbl['lbl.sm.gstNo']}"
									value="#{backingBean.managedBean.smAppl.smCompanyBasic.gstRegistrationNo}"
									id="smGstRegistrationNo" size="35" maxlength="12"
									validatorMessage="#{lbl['lbl.sm.gstNo']} - #{lbl['lbl.sm.invalidNo']}">
									<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
								</p:inputText>
								<p:message id="smgstRegistrationNoMsg" for="smGstRegistrationNo"
									showSummary="true" showDetail="false" display="icon" />
							</c:when>
							<c:otherwise>
								<p:inputText label="#{lbl['lbl.sm.gstNo']}"
									value="#{backingBean.managedBean.smAppl.smCompanyBasic.gstRegistrationNo}"
									id="smGstRegistrationNoRdOnly" size="35" maxlength="12"
									readonly="true" disabled="true" />
							</c:otherwise>
						</c:choose></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.gstDate']}" /></td>
					<td><c:choose>
							<c:when test="#{backingBean.managedBean.supplierUser}">
								<p:calendar id="gstRegDate" showOn="button" navigator="true"
									display="inline" label="#{lbl['lbl.sm.gstDate']}"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									yearRange="-99:+0" readonlyInput="true"
									maxdate="#{CommonConstants.CURRENT_DATE}"
									value="#{backingBean.managedBean.smAppl.smCompanyBasic.gstRegistrationDate}" />
							</c:when>
							<c:otherwise>
								<p:inputText
									value="#{backingBean.managedBean.smAppl.smCompanyBasic.gstRegistrationDate}"
									readonly="true" size="35">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</p:inputText>
							</c:otherwise>

						</c:choose></td>
				</tr>
				<tr>
					<td style="vertical-align: top;"><p:outputLabel
							value="#{lbl['lbl.sm.companyaddress']}" style="padding-top :5px;" />
						<p:outputLabel value="*" styleClass="mandatory"
							style="padding-top :5px;" /></td>
					<td>
						<table style="width: 100%">
							<tr>
								<td><p:inputText size="35" required="true" id="smSupAddr1"
										maxlength="35" label="#{lbl['lbl.sm.companyaddress']}"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}" />
									<p:message id="smSupAddr1Msg" for="smSupAddr1"
										showSummary="true" showDetail="false" display="icon" /></td>
							</tr>
							<tr>
								<td><p:inputText size="35" maxlength="35"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}" /></td>
							</tr>
							<tr>
								<td><p:inputText size="35" maxlength="35"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}" /></td>
							</tr>
							<tr>
								<td><p:inputText size="35" maxlength="35"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address4}" /></td>
							</tr>
						</table>
					</td>
					<td>
						<TABLE style="width: 100%; height: 100px;">
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
							</tr>
							<tr>

								<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
							</tr>
						</TABLE>
					</td>
					<td>
						<TABLE style="width: 100%">
							<tr>
								<td><p:selectOneMenu label="#{lbl['lbl.sm.country']}"
										style="width: 207px;margin-bottom: 5px;" required="true"
										id="smSupCont"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCountry.countryId}">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="" />
										<f:selectItems var="basicCountry"
											value="#{backingBean.managedBean.countryLs}"
											itemValue="#{basicCountry.countryId}"
											itemLabel="#{basicCountry.countryName}" />
										<p:ajax event="change" process="@this"
											listener="#{backingBean.populateStatesByCountry(backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCountry.countryId,SupplierManagementConst.SM_BASIC_INFO_PANEL,backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState,backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict,backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity)}"
											update="basicComState,basicCompDist,basicCompCity,postCodeCompPanelId" />
									</p:selectOneMenu> <p:message id="smSupContMsg" for="smSupCont"
										showSummary="true" showDetail="false" display="icon" /></td>
							</tr>
							<tr>

								<td><p:selectOneMenu
										style="width: 207px;margin-bottom: 5px;" id="basicComState"
										required="true" label="#{lbl['lbl.sm.state']}"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateId}">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="" />
										<f:selectItems var="basicState"
											value="#{backingBean.managedBean.basicCompanyStates}"
											itemValue="#{basicState.stateId}"
											itemLabel="#{basicState.stateName}" />
										<p:ajax event="change" process="@this"
											listener="#{backingBean.populateDistrictsByState(backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateId, 
											SupplierManagementConst.SM_BASIC_INFO_PANEL,
											backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict,
											backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity)}"
											update="basicCompDist,basicCompCity" />
									</p:selectOneMenu> <p:message id="basicComStateMsg" for="basicComState"
										showSummary="true" showDetail="false" display="icon" /></td>
							</tr>
							<tr>
								<td><p:selectOneMenu
										style="width: 207px;margin-bottom: 5px;" id="basicCompDist"
										required="true" label="#{lbl['lbl.sm.district']}"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict.districtId}">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="" />
										<f:selectItems var="dist"
											value="#{backingBean.managedBean.basicCompanyDistricts}"
											itemValue="#{dist.districtId}"
											itemLabel="#{dist.districtName}" />
										<p:ajax event="change" process="@this"
											listener="#{backingBean.populateCitiesByDistrict(backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict.districtId,
								SupplierManagementConst.SM_BASIC_INFO_PANEL,
								backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity)}"
											update="basicCompCity" />
									</p:selectOneMenu> <p:message id="basicCompDistMsg" for="basicCompDist"
										showSummary="true" showDetail="false" display="icon" /></td>

							</tr>
							<tr>
								<td><p:selectOneMenu
										style="width: 207px;margin-bottom: 5px;" id="basicCompCity"
										required="true" label="#{lbl['lbl.sm.towncity']}"
										value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity.cityId}">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="" />
										<f:selectItems var="city"
											value="#{backingBean.managedBean.basicCompanyCities}"
											itemValue="#{city.cityId}" itemLabel="#{city.cityName}" />
									</p:selectOneMenu> <p:message id="basicCompCityMsg" for="basicCompCity"
										showSummary="true" showDetail="false" display="icon" /></td>
							</tr>
						</TABLE>
					</td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:outputPanel id="postCodeCompPanelId">
							<p:outputPanel
								rendered="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCountry.countryId==backingBean.managedBean.myCountryId}">
								<p:inputText maxlength="5" required="true"
									label="#{lbl['lbl.sm.postcode']}" id="smSupPostCodeMy"
									value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}"
									validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
									size="35">
									<f:validator validatorId="postcodeValidator" />
								</p:inputText>
								<p:message id="smSupPostCodeMyMsg" for="smSupPostCodeMy"
									showSummary="true" showDetail="false" display="icon" />
							</p:outputPanel>
							<p:outputPanel
								rendered="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCountry.countryId!=backingBean.managedBean.myCountryId}">
								<p:inputText maxlength="10" required="true"
									label="#{lbl['lbl.sm.postcode']}" id="smSupPostCodeForeign"
									value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}"
									size="35">
								</p:inputText>
								<p:message id="smSupPostCodeForeignMsg"
									for="smSupPostCodeForeign" showSummary="true"
									showDetail="false" display="icon" />
							</p:outputPanel>
						</p:outputPanel></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.annualRev']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							label="#{lbl['lbl.sm.annualRev']}" required="true"
							id="smSupAnnRev"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.annualRevenue}">
							<f:selectItems value="#{backingBean.getDropdownValues('SAR')}" />
						</p:selectOneMenu> <p:message id="smSupAnnRevMsg" for="smSupAnnRev"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td><p:inputText size="35" id="basPhnNum"
							label="#{lbl['lbl.sm.phoneno']}"
							validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.phoneNo}"
							maxlength="12">
							<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						</p:inputText> <p:message id="basPhnNumMsg" for="basPhnNum" showSummary="true"
							showDetail="false" display="icon" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
					<td><p:inputText size="35" id="basFaxNum"
							label="#{lbl['lbl.sm.faxno']}"
							validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.faxNo}"
							maxlength="12">
							<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						</p:inputText> <p:message id="basFaxNumMsg" for="basFaxNum" showSummary="true"
							showDetail="false" display="icon" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.website']}" /></td>
					<td colspan="3"><p:outputLabel value="http://"
							style="float: left;padding: 5px 0 0 0;" /> <p:inputText
							size="50"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.website}" />
					</td>
				</tr>
				<p:outputPanel rendered="#{backingBean.managedBean.poUser}">

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td colspan="3"><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="poCompBasicRmrk"
								validatorMessage="#{lbl['lbl.sm.panHdr.comBasic']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.basicRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="poCompBasicRmrkMsg" for="poCompBasicRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>

				</p:outputPanel>
				<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" readonly="true"
								id="poCompBasicRemarkRd" disabled="true" cols="41"
								maxlength="200"
								validatorMessage="#{lbl['lbl.sm.panHdr.comBasic']} - #{lbl['lbl.sm.poRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.poSecReview.basicRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="poCompBasicRemarkRdMsg" for="poCompBasicRemarkRd"
								showSummary="true" showDetail="false" display="icon" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="false" cols="41"
								maxlength="200" id="apprvrCompBasicRmrk"
								validatorMessage="#{lbl['lbl.sm.panHdr.comBasic']} - #{lbl['lbl.sm.apprvrRemarks.length.validMsg']}"
								value="#{backingBean.managedBean.apprvrSecReview.basicRemark}">
								<f:validateLength maximum="200" />
							</p:inputTextarea> <p:message id="apprvrCompBasicRmrkMsg" for="apprvrCompBasicRmrk"
								showSummary="true" showDetail="false" display="icon" /></td>

					</tr>

				</p:outputPanel>
			</table>
		</p:outputPanel>

	</p:panel>
</ui:composition>
