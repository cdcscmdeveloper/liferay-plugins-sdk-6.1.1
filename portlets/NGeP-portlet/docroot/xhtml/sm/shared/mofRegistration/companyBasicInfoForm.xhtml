<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel
		header="Company Information  ( Auto displayed info - Non editable for SSM registered companies)"
		toggleable="true">
		<table style="width: 250px">
			<tr>
				<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By PO: "
						title="For PO to highlight the verified section " /></td>

			</tr>
			<tr>
				<td width="10px"><p:selectBooleanCheckbox /></td>
				<td><h:outputText value=" Section Verified By Approver: "
						title="For Approver to highlight the verified section " /></td>
			</tr>
		</table>
		<br />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="Company Name *" /></td>
				<td colspan="3"><p:inputText disabled="true" readonly="true"
						value="#{backingBean.managedBean.smAppl.smSupplier.supplierName}"
						size="100" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Registration Type *" /></td>
				<td><p:inputText disabled="true" readonly="true"
						value="ROB - PERSATUAN"
						rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType == 1}" />
					<p:inputText disabled="true" readonly="true" value="ROC - BERHAD"
						rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType == 2}" />
					<p:inputText disabled="true" readonly="true"
						value="ROS - PERKONGSIAN"
						rendered="#{backingBean.managedBean.smAppl.smSupplier.businessType == 3}" />
				</td>
				<td><p:outputLabel value="ROC/ROB/ROS No. *" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.smAppl.smSupplier.regNo}"
						disabled="true" readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Income Tax Ref No. *" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.smAppl.smSupplier.incomeTaxNo}"
						disabled="true" readonly="true" /></td>
				<td><p:outputLabel value="Established Date *" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.smAppl.smSupplier.establishDate}"
						readonly="true">
						<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Annual Income *" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="Kuarang Daripada RM 100,000"
							itemValue="1" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="Country *" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.smAppl.smAddress.pmCountry.countryCode}">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="Malaysia" itemValue="MY" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.companyaddress']}" /></td>
				<td><p:inputText size="50" colspan="3"
						value="#{backingBean.managedBean.smAppl.smAddress.address1}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText size="50" colspan="3"
						value="#{backingBean.managedBean.smAppl.smAddress.address1}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText size="50" colspan="3"
						value="#{backingBean.managedBean.smAppl.smAddress.address1}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.smAppl.smAddress.postcode}" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.smAppl.smAddress.pmState.stateCode}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.smAppl.smAddress.pmDistrict.districtCode}" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.smAppl.smAddress.pmCity.cityCode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Phone No." /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.smAppl.smAddress.phoneNo}" /></td>
				<td><p:outputLabel value="Fax No." /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.smAppl.smAddress.faxNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Website" /></td>
				<td colspan="3"><p:inputText size="100"
						value="#{backingBean.managedBean.smAppl.smSupplier.webSite}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>

	</p:panel>
</ui:composition>
