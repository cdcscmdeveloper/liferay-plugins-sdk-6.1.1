<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc" 
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.account.info']}" toggleable="true">
		<table class="customTbl">
			<c:if test="#{backingBean.managedBean.smAppl.applType == SupplierManagementConst.ACC_MOF}">
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.mofsuppliertype']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<!-- 16052019 - SSM INTEGRATION CR - Fahmi-->
					<td class="tdContent">
							<p:selectOneMenu id="suppTypeId" required="#{!empty param['disableValidation']}"
							value="#{backingBean.managedBean.smAppl.supplierType}"
							label="#{lbl['lbl.sm.mofsuppliertype']}" style="width:200px"
							disabled="true">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}"
								itemValue="#{SupplierManagementConst.STYPE_CONTRACTOR}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}"
								itemValue="#{SupplierManagementConst.STYPE_CONSULTANT}" />
							<p:ajax event="change" update="" process="@form" />
						</p:selectOneMenu>
						 &#160; <p:graphicImage id="mofsupp"
						value="/css/images/design/tooltips.png" /> <p:tooltip style="width:25%;"
						id="mofsupplier" for="mofsupp">
						<p:outputLabel escape="false"
							value="#{lbl['tt.sm.registration.business.mof.supplier.type']}" />
					</p:tooltip>&#160;
						<p:message id="suppTypeIdMsg" for="suppTypeId" display="icon" />						
						</td>						
					<td class="tdTitle"></td>
					<td class="tdContent"></td>
				</tr>
			</c:if>
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.businesscomptype']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<!-- 16052019 - SSM INTEGRATION CR - Fahmi-->
				<!-- Disable for UPS 32008 - START -->
				<td style="word-wrap: break-word">
					<p:outputLabel
							rendered="#{empty backingBean.managedBean.businessTypeLs}"
							styleClass="outputLabel-view"
							value="#{backingBean.getParameterDesc(backingBean.managedBean.businessTypeParamCode,backingBean.managedBean.smSupplier.businessType)}" />
						<p:selectOneMenu id="smBusTypeId" required="true"
							label="#{lbl['lbl.sm.regtype']}"
							rendered="#{not empty backingBean.managedBean.businessTypeLs}"
							value="#{backingBean.managedBean.smSupplier.businessType}"
							style="width:310px"
							disabled="#{backingBean.managedBean.upsCannotEdit}">
							<f:selectItems value="#{backingBean.managedBean.businessTypeLs}" />
							<p:ajax event="change" process="@this" update="@this" partialSubmit="true" listener="#{backingBean.onChangeBussType}"/>
						</p:selectOneMenu> <p:message id="smBusTypeIdMsg" for="smBusTypeId"
							showSummary="true" showDetail="false" display="icon" /></td>
					
				
						<td class="tdTitle"></td>
						<td class="tdContent"></td>
					
			 </tr>
			 
			 <tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.businessregno']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				
				<td class="tdContent">
					<p:outputPanel id="regNoPanelId">
					<!--  #16052019 - SSM INTEGRATION CR - Fahmi  -->
						<p:inputText id="regNo" required="#{!empty param['disableValidation']}" maxlength="20"
							value="#{backingBean.managedBean.smSupplier.regNo}" converter="toUpperCaseConverter"
							disabled="true"
							size="40" label="#{lbl['lbl.sm.businessregno']}" >
							<p:ajax event="blur" update="" listener="#{registrationBackingBean.removeRegNoWhiteSpace}" />
							<f:validator validatorId="busRegNoValidator" />
							</p:inputText>
						&#160;
						<p:graphicImage id="regNoti" value="/css/images/design/tooltips.png" rendered="#{not empty backingBean.managedBean.smSupplier.businessType}"/>
						<ui:param name="lblRegNoTlTip" value="tt.sm.business.type.#{backingBean.managedBean.smSupplier.businessType}" />
						<p:tooltip id="regNott" for="regNoti" rendered="#{not empty backingBean.managedBean.smSupplier.businessType}" >
							<p:outputLabel escape="false" value="#{lbl[lblRegNoTlTip]}"  />
						</p:tooltip>&#160;
						<p:message id="regNoMsg" for="regNo" display="icon" />
					</p:outputPanel>
				</td>
			</tr>
			
			<!-- #24819 -->
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.new.business.regNo']}" /></td>
				
				<td class="tdContent">
					<p:outputPanel id="newRegNoPanelId">
						<p:inputText id="newregNo1" required="#{!empty param['disableValidation']}" maxlength="30"
							value="#{backingBean.managedBean.smSupplier.ssmNewRegNo}"  
							rendered="#{not empty backingBean.managedBean.smSupplier.ssmNewRegNo}" 
							converter="toUpperCaseConverter"
							disabled="#{backingBean.managedBean.smSupplier.brandNew || !backingBean.managedBean.smSupplier.brandNew 
							|| backingBean.managedBean.smAppl.applValidWithSsm || backingBean.managedBean.activeDisicplinaryAction 
							|| backingBean.managedBean.upsCannotEdit}"
							size="40" label="#{lbl['lbl.sm.new.business.regNo']}" >
						</p:inputText>	
						<p:inputText id="newregNo2" required="#{!empty param['disableValidation']}" maxlength="30"
							value="#{lbl['lbl.sm.no.available']}"  
							rendered="#{empty backingBean.managedBean.smSupplier.ssmNewRegNo}" 
							converter="toUpperCaseConverter"
							disabled="#{backingBean.managedBean.smSupplier.brandNew || !backingBean.managedBean.smSupplier.brandNew 
							|| backingBean.managedBean.smAppl.applValidWithSsm || backingBean.managedBean.activeDisicplinaryAction 
							|| backingBean.managedBean.upsCannotEdit}"
							size="40" label="#{lbl['lbl.sm.new.business.regNo']}" >
						</p:inputText>
						&#160;
						<p:graphicImage id="newRegNoti" value="/css/images/design/tooltips.png" rendered="#{not empty backingBean.managedBean.smSupplier.businessType and backingBean.managedBean.smSupplier.businessType != SupplierManagementConst.INDIVIDUAL_FLAG}"/>
						<ui:param name="lblnewRegNoTlTip" value="tt.sm.business.type.#{backingBean.managedBean.smSupplier.businessType}" />
						<p:tooltip id="newRegNott" for="newRegNoti" rendered="#{not empty backingBean.managedBean.smSupplier.businessType and backingBean.managedBean.smSupplier.businessType != SupplierManagementConst.INDIVIDUAL_FLAG}" >
							<p:outputLabel escape="false" value="#{lbl['tt.sm.new.business.regNo']}"  />
						</p:tooltip>&#160;
					<p:message id="newRegNoMsg" for="regNo" display="icon" />	
				</p:outputPanel></td>
			
			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class = "tdContent">
					<ac:instructionText value="#{lbl['lbl.sm.new.business.regNo.notes']}" 
						disabled="#{backingBean.managedBean.upsCannotEdit}" /><!-- Disable for UPS 32008 - END -->
				</td>
			</tr>
		<!-- #24819 -->
		</table>
	</p:panel>
</ui:composition>
