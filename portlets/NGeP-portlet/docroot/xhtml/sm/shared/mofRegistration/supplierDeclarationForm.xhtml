<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.declaration']}" toggleable="true">
		<table style="width: 100%;">
			<tr>
				<td><h:outputText escape="false" value="#{lbl['lbl.sm.declaration.msg']}"/></td>
				<td style="vertical-align: baseline;">
					<div align="right">
						<p:commandLink>
							<p:fileDownload value="#{backingBean.printDeclaration()}" />
							<p:graphicImage value="/css/images/design/print.png"
								style="margin-right:2px;" title="#{lbl['lbl.sm.print.declaration.form']}"/>
						</p:commandLink>
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
