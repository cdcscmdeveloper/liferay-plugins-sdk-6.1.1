<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<script>
		$('.blinkClass').each(function() {
		    var elem = $(this);
		    setInterval(function() {
		        if (elem.css('visibility') == 'hidden') {
		            elem.css('visibility', 'visible');
		        } else {
		            elem.css('visibility', 'hidden');
		        }    
		    }, 1000);
		});
	</script>
	
	<p:panel header="#{lbl['lbl.sm.declaration']}" toggleable="true">
		<table style="width: 100%;">
			<tr>
				<!-- #28741 BPKU:#27565 - start-->
				<c:choose>
					<c:when test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForBumi}">
					<td><h:outputText escape="false" value="#{lbl['lbl.sm.declaration.bumi']}"/></td>
					</c:when>
					
					<c:otherwise>
					<td><h:outputText escape="false" value="#{lbl['lbl.sm.declaration.msg']}"/></td>
					</c:otherwise>
				</c:choose>
				<!-- #28741 BPKU:#27565 - end-->
				<td style="vertical-align: baseline;">
					<div align="right">
						<p:commandLink ajax="false">
							<p:fileDownload value="#{backingBean.printDeclarationForm()}" />
							<p:graphicImage value="/css/images/design/print.png"
								style="margin-right:2px;" title="#{lbl['lbl.sm.print.declaration.form']}"/>
						</p:commandLink>
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
