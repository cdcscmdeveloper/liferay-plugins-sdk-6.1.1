<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sm.manufacture.diaHdr']}">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.manufacture.prdType']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedManufacturer.goodsType}"
						size="35" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.brand']}" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedManufacturer.brand}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.manufacture.prodCap']}" /></td>
				<td>
					<table>
						<tr>
							<td style="padding-right: 5px;"><p:inputText
									value="#{backingBean.managedBean.selectedManufacturer.productionCapacity}"
									size="15" /></td>
							<td valign="top"><h:outputText value="#{lbl['lbl.sm.manufacture.month']}" /></td>
						</tr>
					</table>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.sm.manufacture.mesUnit']}" /></td>
				<td valign="top"><p:selectOneMenu
						value="#{backingBean.managedBean.selectedManufacturer.pmUom.uomCode}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.manufacture.mesUnit.unit']} " itemValue="Unit" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.manufacture.mesUnit.volume']}" itemValue="Volume" />
					</p:selectOneMenu></td>
				<!-- <td>
						<table>
							<tr>
								<td style="padding-right: 20px;"><p:inputText /></td>

							</tr>
						</table>
					</td> -->
			</tr>

		</table>
	</p:panel>
	<br />
	<div align="right">
		<p:commandButton value="#{lbl['lbl.sm.button.save']}"
			action="#{backingBean.saveSelectedCategory}"
			oncomplete="regCatDialog.hide();" type="submit" partialSubmit="true"
			process="regCatDialog" update=":form:tt:catDt" />
		<p:commandButton value="#{lbl['lbl.sm.button.cancel']}" onclick="regCatDialog.hide();" />
	</div>
</ui:composition>
