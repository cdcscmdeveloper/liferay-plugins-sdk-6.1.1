<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="Manufacturing / Assembly Information">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Product Type" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedManufacturer.goodsType}"
						size="35" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Brand" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedManufacturer.brand}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Production Capacity" /></td>
				<td>
					<table>
						<tr>
							<td style="padding-right: 5px;"><p:inputText
									value="#{backingBean.managedBean.selectedManufacturer.productionCapacity}"
									size="15" /></td>
							<td valign="top"><h:outputText value=" per Month" /></td>
						</tr>
					</table>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="* Measurement" /></td>
				<td valign="top"><p:selectOneMenu
						value="#{backingBean.managedBean.selectedManufacturer.pmUom.uomCode}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select --" itemValue="" />
						<f:selectItem itemLabel="Unit " itemValue="Unit" />
						<f:selectItem itemLabel="Volume" itemValue="Volume" />
					</p:selectOneMenu></td>
				<!-- <td>
						<table>
							<tr>
								<td style="padding-right: 20px;"><p:inputText /></td>

							</tr>
						</table>
					</td> -->
			</tr>

		</table>
	</p:panel>
	<br />
	<div align="right">
		<p:commandButton value="Save"
			action="#{backingBean.saveSelectedCategory}"
			oncomplete="regCatDialog.hide();" type="submit" partialSubmit="true"
			process="regCatDialog" update=":form:tt:catDt" />
		<p:commandButton value="Cancel" onclick="regCatDialog.hide();" />
	</div>
</ui:composition>
