<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<c:if test="#{backingBean.managedBean.smAppl.supplierType eq 'J' and backingBean.getAppVersionDetailsWithRedmineNo()}">
		<ui:include src="consultantProjectsExperienceInfoForm.xhtml" />
	</c:if>
	<c:if test="#{backingBean.managedBean.smAppl.supplierType eq 'K' and backingBean.getAppVersionDetailsWithRedmineNo()}">
		<ui:include src="contractorProjectsExperienceInfoForm.xhtml" />
	</c:if>
	<c:if test="#{!backingBean.getAppVersionDetailsWithRedmineNo()}">
		<p:panel header="#{lbl['lbl.sm.projDtls.panHdr']}" toggleable="true">
			<h:outputText value="#{backingBean.getCompanyExperienceLabel()}" />
		</p:panel>
	</c:if>
</ui:composition>
