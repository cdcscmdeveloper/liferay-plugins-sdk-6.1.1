<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Company Experience Project" toggleable="true">
		<div>
			<p:outputLabel value=" Section Verified : "
				title="For PO / Approver highlight the verified section " />
			<p:selectBooleanCheckbox />
		</div>
		<br />
		<p:dataTable var="utilBean"
			value="#{mofRegistrationBackingBean.utilList}"
			selection="#{mofRegistrationBackingBean.managedBean.selectedUtilList}"
			rowKey="#{utilBean.seqNo}" rowIndexVar="index">

			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="NO.">
				<p:outputLabel value="1" />
			</p:column>

			<p:column headerText="Project Title">
				<p:commandLink value="Next-Gen eP" onclick="projDialog.show();" />
			</p:column>

			<p:column headerText="Project Value">
				<p:outputLabel value="RM.1,000.00" />
			</p:column>

			<p:column headerText="Procurement Date">
				<p:outputLabel value="15-Jan-2012" />
			</p:column>

			<p:column headerText="Result / Progress">
				<p:outputLabel value="In Progress" />
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="Add Project" onclick="projDialog.show();" />
			<p:commandButton value="Delete Project(s)" />

		</div>
		<table style="width: 100%">


			<tr>
				<td><p:outputLabel value="PO Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
				<td><p:outputLabel value="Approver Remarks" /></td>
				<td><p:inputTextarea autoResize="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog header="Company Project Page" widgetVar="projDialog"
		resizable="false" showEffect="fade" hideEffect="fade" modal="true">
		<table style="width: 100%">
			<tr>
				<td valign="top"><p:panel
						header="Project Details - For Consultant">

						<table style="width: 100%">
							<tr>
								<td><p:outputLabel value=" Project Name *" /></td>
								<td><p:inputText /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="Project Ref No. *" /></td>
								<td><p:inputText /></td>
							</tr>
							<tr>
								<td><p:outputLabel value=" Project Location *" /></td>
								<td><p:inputText /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="Client's Name *" /></td>
								<td><p:inputText /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="Appointment Date *" /></td>
								<td><p:calendar showOn="button" /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="Project Cost *" /></td>
								<td><p:panelGrid columns="2"
										styleClass="noBorders tr,noBorders td">
										<p:column>
											<p:inputText></p:inputText>
										</p:column>
										<p:column>
											<p:selectOneMenu>
												<f:selectItem itemLabel="MYR" itemValue="1"></f:selectItem>
											</p:selectOneMenu>
										</p:column>
									</p:panelGrid></td>
							</tr>
							<tr>
								<td><p:outputLabel value="Service Provided *" /></td>
								<td><p:selectOneMenu>
										<f:selectItem itemLabel="-- Select One--" itemValue="1" />
										<f:selectItem itemLabel="Tender" itemValue="1" />
										<f:selectItem itemLabel="eBidding" itemValue="1" />
										<f:selectItem itemLabel="SebutHarga" itemValue="1" />
									</p:selectOneMenu></td>
							</tr>
							<tr>
								<td><p:outputLabel value="Work Progress *" /></td>
								<td><p:inputText /> <p:outputLabel value="%" /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="Consultant Fee *" /></td>
								<td><p:panelGrid columns="2"
										styleClass="noBorders tr,noBorders td">
										<p:column>
											<p:inputText></p:inputText>
										</p:column>
										<p:column>
											<p:selectOneMenu>
												<f:selectItem itemLabel="MYR" itemValue="1"></f:selectItem>
											</p:selectOneMenu>
										</p:column>
									</p:panelGrid></td>
							</tr>
						</table>

					</p:panel></td>
				<td valign="top"><p:panel
						header="Project Details - For Contractor">

						<table style="width: 100%">
							<tr>
								<td><p:outputLabel value=" Title *" /></td>
								<td><p:inputText /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="Procurement Date *" /></td>
								<td><p:calendar showOn="button" /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="Contract Value *" /></td>

								<td><p:panelGrid columns="2"
										styleClass="noBorders tr,noBorders td">
										<p:column>
											<p:inputText></p:inputText>
										</p:column>
										<p:column>
											<p:selectOneMenu>
												<f:selectItem itemLabel="MYR" itemValue="1"></f:selectItem>
											</p:selectOneMenu>
										</p:column>
									</p:panelGrid></td>
							</tr>
							<tr>
								<td><p:outputLabel value="Procurement Mode *" /></td>
								<td><p:panelGrid columns="2"
										styleClass="noBorders tr,noBorders td">
										<p:column>
											<p:inputText></p:inputText>
										</p:column>
										<p:column>
											<p:selectOneMenu>
												<f:selectItem itemLabel="-- Select One--" itemValue="1" />
												<f:selectItem itemLabel="Tender" itemValue="1" />
												<f:selectItem itemLabel="eBidding" itemValue="1" />
												<f:selectItem itemLabel="SebutHarga" itemValue="1" />
											</p:selectOneMenu>
										</p:column>
									</p:panelGrid></td>
							</tr>
							<tr>
								<td><p:outputLabel value="Project Ref No. *" /></td>
								<td><p:selectOneRadio>
										<f:selectItem itemLabel="In Progress" itemValue="1" />
										<f:selectItem itemLabel="Complete" itemValue="2" />
										<f:selectItem itemLabel="Fail" itemValue="3" />
									</p:selectOneRadio></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="Ministry/Statutory Body/Private *" /></td>
								<td><p:inputTextarea /></td>
							</tr>

						</table>
					</p:panel></td>
			</tr>
		</table>
		<br />

		<div align="center">
			<p:commandButton value="Save" onclick="projDialog.hide();" />
			<p:commandButton value="Cancel" onclick="projDialog.hide();" />
		</div>

	</p:dialog>
</ui:composition>
