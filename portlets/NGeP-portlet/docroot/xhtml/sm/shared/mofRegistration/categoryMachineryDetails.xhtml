<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="Machinery / Equipment Information">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Machinery Type" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedMachine.machineType}"
						size="35" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Brand" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedMachine.brandName}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Funtion" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedMachine.machineFunction}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Quantity" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedMachine.qty}" size="35" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="* Value (RM.)" /></td>
				<td>
					<table>
						<tr>
							<td style="padding-right: 5px;"><p:inputText
									value="#{backingBean.managedBean.selectedMachine.value}"
									size="20" /></td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Purchase Method" /></td>
				<td><p:selectOneMenu
						value="#{backingBean.managedBean.selectedMachine.purchaseMethod}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select --" itemValue="" />
						<f:selectItem itemLabel="Cash" itemValue="1" />
						<f:selectItem itemLabel="Credit Card" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Guarantor Name" /></td>
				<td><p:inputText
						value="#{backingBean.managedBean.selectedMachine.guarantorName}"
						size="35" /></td>
			</tr>

		</table>
	</p:panel>
	<br />
	<div align="right">
		<p:commandButton value="Save"
			action="#{backingBean.saveSelectedCategory}"
			oncomplete="regCatDialog.hide();" type="submit" partialSubmit="true"
			process="regCatDialog" update=":form:tt:catDt" />
		<p:commandButton value="Cancel" onclick="regCatDialog.hide();" />
	</div>

</ui:composition>
