<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<table style="width: 100%">
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.branch.branchName']}" />
				<p:outputLabel value="*" styleClass="mandatory" /></td>
			<td><p:inputText required="#{backingBean.managedBean.valueReqd}"
					label=" #{lbl['lbl.sm.branch.branchName']}" id="supBranchName"
					maxlength="100"
					value="#{backingBean.managedBean.selectedBranch.branchName}"
					size="35" /> <p:message id="supBranchNameMsg" for="supBranchName"
					showSummary="true" showDetail="false" display="icon" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.companyaddress']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:inputText required="#{backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.companyaddress']}" id="supBrnAddr"
					maxlength="35"
					value="#{backingBean.managedBean.selectedBranch.smAddress.address1}"
					size="35" /> <p:message id="supBrnAddrMsg" for="supBrnAddr"
					showSummary="true" showDetail="false" display="icon" /></td>
		</tr>

		<tr>
			<td></td>
			<td><p:inputText maxlength="35"
					value="#{backingBean.managedBean.selectedBranch.smAddress.address2}"
					size="35" /></td>
		</tr>
		<tr>
			<td></td>
			<td><p:inputText maxlength="35"
					value="#{backingBean.managedBean.selectedBranch.smAddress.address3}"
					size="35" /></td>
		</tr>
		<tr>
			<td></td>
			<td><p:inputText maxlength="35"
					value="#{backingBean.managedBean.selectedBranch.smAddress.address4}"
					size="35" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:selectOneMenu
					required="#{backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.country']}" id="supBrnCntry"
					value="#{backingBean.managedBean.selectedBranch.smAddress.pmCountry.countryId}"
					style="width: 207px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems var="branchCountry"
						value="#{backingBean.managedBean.countryLs}"
						itemValue="#{branchCountry.countryId}"
						itemLabel="#{branchCountry.countryName}" />
					<p:ajax event="change"
						listener="#{backingBean.populateStatesByCountry(backingBean.managedBean.selectedBranch.smAddress.pmCountry.countryId, 
								SupplierManagementConst.SM_BRANCH_PANEL,
								backingBean.managedBean.selectedBranch.smAddress.pmState,
								backingBean.managedBean.selectedBranch.smAddress.pmDistrict,
								backingBean.managedBean.selectedBranch.smAddress.pmCity)}"
						update="branchState,branchDist,branchCity" />
				</p:selectOneMenu> <p:message id="supBrnCntryMsg" for="supBrnCntry" showSummary="true"
					showDetail="false" display="icon" /></td>
		</tr>

		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
					required="#{backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.state']}"
					value="#{backingBean.managedBean.selectedBranch.smAddress.pmState.stateId}"
					id="branchState">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems var="brnState"
						value="#{backingBean.managedBean.branchCompanyStates}"
						itemValue="#{brnState.stateId}" itemLabel="#{brnState.stateName}" />
					<p:ajax event="change"
						listener="#{backingBean.populateDistrictsByState(backingBean.managedBean.selectedBranch.smAddress.pmState.stateId, 
								SupplierManagementConst.SM_BRANCH_PANEL,
								backingBean.managedBean.selectedBranch.smAddress.pmDistrict,
								backingBean.managedBean.selectedBranch.smAddress.pmCity)}"
						update="branchDist,branchCity" />

				</p:selectOneMenu> <p:message id="branchStateMsg" for="branchState" showSummary="true"
					showDetail="false" display="icon" /></td>
		</tr>

		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
					id="branchDist" required="#{backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.district']}"
					value="#{backingBean.managedBean.selectedBranch.smAddress.pmDistrict.districtId}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems var="brnDist"
						value="#{backingBean.managedBean.branchCompanyDistricts}"
						itemValue="#{brnDist.districtId}"
						itemLabel="#{brnDist.districtName}" />
					<p:ajax event="change"
						listener="#{backingBean.populateCitiesByDistrict(backingBean.managedBean.selectedBranch.smAddress.pmDistrict.districtId, 
								SupplierManagementConst.SM_BRANCH_PANEL,
								backingBean.managedBean.selectedBranch.smAddress.pmCity)}"
						update="branchCity" />
				</p:selectOneMenu> <p:message id="branchDistMsg" for="branchDist" showSummary="true"
					showDetail="false" display="icon" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
					id="branchCity" required="#{backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.towncity']}"
					value="#{backingBean.managedBean.selectedBranch.smAddress.pmCity.cityId}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems var="branchCity"
						value="#{backingBean.managedBean.branchCompanyCities}"
						itemValue="#{branchCity.cityId}"
						itemLabel="#{branchCity.cityName}" />
				</p:selectOneMenu> <p:message id="branchCityMsg" for="branchCity" showSummary="true"
					showDetail="false" display="icon" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:inputText id="branchPostCode"
					required="#{backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.postcode']}"
					value="#{backingBean.managedBean.selectedBranch.smAddress.postcode}"
					size="35" maxlength="10" /> <p:message id="branchPostCodeMsg"
					for="branchPostCode" showSummary="true" showDetail="false"
					display="icon" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
			<td><p:inputText label="#{lbl['lbl.sm.phoneno']}"
					id="branchPhoneNo"
					validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}"
					value="#{backingBean.managedBean.selectedBranch.phoneNo}" size="35"
					maxlength="12">
					<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
				</p:inputText> <p:message id="branchPhoneNoMsg" for="branchPhoneNo"
					showSummary="true" showDetail="false" display="icon" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
			<td><p:inputText label="#{lbl['lbl.sm.faxno']}" id="branchFaxNo"
					validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}"
					value="#{backingBean.managedBean.selectedBranch.faxNo}" size="35"
					maxlength="12">
					<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
				</p:inputText> <p:message id="branchFaxNoMsg" for="branchFaxNo" showSummary="true"
					showDetail="false" display="icon" /></td>
		</tr>

	</table>
</ui:composition>
