<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<table style="width: 100%">
		<tr>
		<!--  SSM INTEGRATION -->
			<td><p:outputLabel value="#{lbl['lbl.sm.branch.branchName']}" />
				<p:outputLabel value="*" styleClass="mandatory" /></td>
			<!-- Disable for UPS 32008 - START -->
			<td><p:inputText label=" #{lbl['lbl.sm.branch.branchName']}" id="supBranchName"
					maxlength="100" required="#{backingBean.managedBean.valueReqd}"
					value="#{backingBean.managedBean.selectedBranch.branchName}"
					disabled="#{backingBean.managedBean.upsCannotEdit or backingBean.disableFieldSSm(backingBean.managedBean.selectedBranch.ssmData,backingBean.managedBean.smAppl.applValidWithSsm,false)}"
					size="35" >
						<p:ajax process="@this" partialSubmit="true"/>
					</p:inputText> 
					<!-- 35194 -->
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
						oriValue="#{backingBean.managedBean.latestBranch.branchName}" 
						currValue="#{backingBean.managedBean.selectedBranch.branchName}" 
						alertValue="#{backingBean.managedBean.latestBranch.branchName}"/>
					<p:message id="supBranchNameMsg" for="supBranchName"
					showSummary="true" showDetail="false" display="icon" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.branch.address']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td>
			<!-- #34135 START -->
			<p:inputText required="#{backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.branch.address']}" id="supBrnAddr"
					maxlength="100"
					value="#{backingBean.managedBean.selectedBranch.smAddress.address1}"
					disabled="#{backingBean.managedBean.upsCannotEdit or backingBean.disableFieldSSm(backingBean.managedBean.selectedBranch.ssmData,backingBean.managedBean.smAppl.applValidWithSsm,backingBean.managedBean.selectedBranch.smAddress.addressSsmNull)}"
					size="35" >
					<p:ajax process="@this" partialSubmit="true"/>
					</p:inputText> 
			<!-- #34135 END -->
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
						oriValue="#{backingBean.managedBean.latestBranch.smAddress.address1}" 
						currValue="#{backingBean.managedBean.selectedBranch.smAddress.address1}" 
						alertValue="#{backingBean.managedBean.latestBranch.smAddress.address1}"/>
					<p:message id="supBrnAddrMsg" for="supBrnAddr"
					showSummary="true" showDetail="false" display="icon" /></td>
		</tr>

		<tr>
			<td></td>
			<td><p:inputText maxlength="100"
					value="#{backingBean.managedBean.selectedBranch.smAddress.address2}"
					disabled="#{backingBean.managedBean.upsCannotEdit or backingBean.disableFieldSSm(backingBean.managedBean.selectedBranch.ssmData,backingBean.managedBean.smAppl.applValidWithSsm,backingBean.managedBean.selectedBranch.smAddress.addressSsmNull)}"					
					size="35" >
					<p:ajax process="@this" partialSubmit="true"/>
					</p:inputText>
					<ac:smFieldChangeAlert 
						isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
						oriValue="#{backingBean.managedBean.latestBranch.smAddress.address2}" 
						currValue="#{backingBean.managedBean.selectedBranch.smAddress.address2}" 
						alertValue="#{backingBean.managedBean.latestBranch.smAddress.address2}"/>
			</td>
		</tr>
		<tr>
			<td></td>
			<td><p:inputText maxlength="100"
					value="#{backingBean.managedBean.selectedBranch.smAddress.address3}"
					disabled="#{backingBean.managedBean.upsCannotEdit or backingBean.disableFieldSSm(backingBean.managedBean.selectedBranch.ssmData,backingBean.managedBean.smAppl.applValidWithSsm,backingBean.managedBean.selectedBranch.smAddress.addressSsmNull)}"					
					size="35" >
					<p:ajax process="@this" partialSubmit="true"/>
					</p:inputText>
				<ac:smFieldChangeAlert 
					isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
					oriValue="#{backingBean.managedBean.latestBranch.smAddress.address3}" 
					currValue="#{backingBean.managedBean.selectedBranch.smAddress.address3}" 
					alertValue="#{backingBean.managedBean.latestBranch.smAddress.address3}"/>
			</td>
		</tr>
		<!-- #36718 - START - add panel for refresh address -->
		<p:panel id="supBrnAddrPanelId" style="border: none;">
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td>
			<!-- #34159 - START - edit required condition -->
			    <p:selectOneMenu
					required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
					label="#{lbl['lbl.sm.country']}" id="supBrnCntry"
					value="#{backingBean.managedBean.selectedBranch.smAddress.countryId}"
					disabled="#{backingBean.managedBean.upsCannotEdit or backingBean.disableFieldSSm(backingBean.managedBean.selectedBranch.ssmData,backingBean.managedBean.smAppl.applValidWithSsm,backingBean.managedBean.selectedBranch.smAddress.stateSsmNull)}"
					style="width: 207px;margin-bottom: 5px;background-color:white;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems var="branchCountry"
						value="#{backingBean.managedBean.countryItems}" />
					<!-- #34135 START -->	
					<!-- #36718 - process panel when change address dropdown -->
					<p:ajax event="change" process="@this @([id$=supBrnAddrPanelId])"
						listener="#{backingBean.onChangeCountry(backingBean.managedBean.selectedBranch.smAddress,SupplierManagementConst.SM_BRANCH_PANEL)}"
						update="supBrnCntry,branchState,branchDivision,branchDist,branchCity,postCodeBranchPanelId,
						divisionBranchTbleLabelPanelId,divisionBranchTbleDropdownPanelId" />
					<!-- #34135 END -->
				</p:selectOneMenu> 
			<!-- #34159 - END -->
				<ac:smFieldChangeAlert 
					isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
					oriValue="#{backingBean.managedBean.latestBranch.smAddress.pmCountry.countryId}" 
					currValue="#{backingBean.managedBean.selectedBranch.smAddress.pmCountry.countryId}" 
					alertValue="#{(not empty backingBean.managedBean.latestBranch and 
					 	not empty backingBean.managedBean.latestBranch.smAddress) ?
						backingBean.getCountryLabelById(backingBean.managedBean.latestBranch.smAddress.pmCountry.countryId)
						: lbl['lbl.txt.na']}"/>
				<p:message id="supBrnCntryMsg" for="supBrnCntry" showSummary="true"
					showDetail="false" display="icon" /></td>
		</tr>
		<!-- #34135 START -->
		<p:outputPanel rendered="#{backingBean.managedBean.selectedBranch.smAddress.stateId eq null}">
			#{backingBean.onChangeCountry(backingBean.managedBean.selectedBranch.smAddress,SupplierManagementConst.SM_BRANCH_PANEL)}
		</p:outputPanel>
		<!-- #34135 END -->
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td>
			<!-- #34159 - START - edit required condition -->
			    <p:selectOneMenu style="width: 207px;margin-bottom: 5px;background-color:white;"
					required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
					label="#{lbl['lbl.sm.state']}"
					value="#{backingBean.managedBean.selectedBranch.smAddress.stateId}"
					disabled="#{backingBean.managedBean.upsCannotEdit or backingBean.disableFieldSSm(backingBean.managedBean.selectedBranch.ssmData,backingBean.managedBean.smAppl.applValidWithSsm,backingBean.managedBean.selectedBranch.smAddress.stateSsmNull)}"	
					id="branchState">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems var="brnState"
						value="#{backingBean.managedBean.branchCompanyStates}" />
					<!-- #36718 - process panel when change address dropdown -->
					<p:ajax event="change" process="@this @([id$=supBrnAddrPanelId])"
						listener="#{backingBean.onChangeState(backingBean.managedBean.selectedBranch.smAddress,SupplierManagementConst.SM_BRANCH_PANEL)}"
						update="branchState,divisionBranchTbleLabelPanelId,divisionBranchTbleDropdownPanelId,branchDist,branchCity,postCodeBranchPanelId" />
				</p:selectOneMenu> 
			<!-- #34159 - END -->
				<ac:smFieldChangeAlert 
					isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
					oriValue="#{backingBean.managedBean.latestBranch.smAddress.pmState.stateId}" 
					currValue="#{backingBean.managedBean.selectedBranch.smAddress.pmState.stateId}" 
					alertValue="#{(not empty backingBean.managedBean.latestBranch and 
					 	not empty backingBean.managedBean.latestBranch.smAddress) ?
						backingBean.getStateLabelById(backingBean.managedBean.latestBranch.smAddress.pmState.stateId)
						: lbl['lbl.txt.na']}"/>
				<p:message id="branchStateMsg" for="branchState" showSummary="true"
					showDetail="false" display="icon" /></td>
		</tr>
		<!-- 13320 -->
		
			<tr>
			<td  class="tdTitle">
				<p:outputPanel id="divisionBranchTbleLabelPanelId" >
					<ui:fragment rendered="#{backingBean.managedBean.selectedBranch.smAddress.pmState.adoptDivision}">
						<p:outputLabel value="#{lbl['lbl.sm.division']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
						</ui:fragment>
					</p:outputPanel>
					</td>
					<td>
				<p:outputPanel id="divisionBranchTbleDropdownPanelId">
				<ui:fragment rendered="#{backingBean.managedBean.selectedBranch.smAddress.pmState.adoptDivision}">
			<!-- #34135 START -->	
				<!-- #34159 - START - edit required condition -->
				<p:selectOneMenu style="width: 207px;margin-bottom: 5px;background-color:white;"
					required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
					label="#{lbl['lbl.sm.division']}"
					value="#{backingBean.managedBean.selectedBranch.smAddress.divisionId}"
					disabled="#{backingBean.managedBean.upsCannotEdit}"
					id="branchDivision">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems var="brnDivision"
						value="#{backingBean.managedBean.branchCompanyDivisions}" />
					<!-- #36718 - process panel when change address dropdown -->
					<p:ajax event="change" process="@this @([id$=supBrnAddrPanelId])"
					listener="#{backingBean.onChangeDistrictByDivision(backingBean.managedBean.selectedBranch.smAddress,SupplierManagementConst.SM_BRANCH_PANEL)}"
						update="branchDist,branchCity,postCodeBranchPanelId" />
				</p:selectOneMenu>
				<!-- #34159 - END -->
				<!-- #35086 -->
				<ac:smFieldChangeAlert 
					isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
					oriValue="#{backingBean.managedBean.latestBranch.smAddress.pmDivision.divisionId}" 
					currValue="#{backingBean.managedBean.selectedBranch.smAddress.pmDivision.divisionId}" 
					alertValue="#{(not empty backingBean.managedBean.latestBranch and 
					 	not empty backingBean.managedBean.latestBranch.smAddress) ?
						backingBean.getDivisionLabelById(backingBean.managedBean.latestBranch.smAddress.pmDivision.divisionId)
						: lbl['lbl.txt.na']}"/>
				</ui:fragment>
				</p:outputPanel>
				<p:message id="branchDivisionMsg" for="branchDivision" showSummary="true"
					showDetail="false" display="icon" />
			<!-- #34135 END -->		
				</td>
		</tr>
		

		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td>
			<!-- #34159 - START - edit required condition -->
				<p:selectOneMenu style="width: 207px;margin-bottom: 5px;background-color:white;"
					id="branchDist" required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
					label="#{lbl['lbl.sm.district']}"
					value="#{backingBean.managedBean.selectedBranch.smAddress.districtId}" disabled="#{backingBean.managedBean.upsCannotEdit}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems var="brnDist" 
						value="#{backingBean.managedBean.branchCompanyDistricts}" />
					<!-- #36718 - process panel when change address dropdown -->
					<p:ajax event="change" process="@this @([id$=supBrnAddrPanelId])"
						listener="#{backingBean.onChangeDistrict(backingBean.managedBean.selectedBranch.smAddress,SupplierManagementConst.SM_BRANCH_PANEL)}"
						update="branchDist,branchCity,postCodeBranchPanelId" />
				</p:selectOneMenu> 
			<!-- #34159 - END -->
				<ac:smFieldChangeAlert 
					isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
					oriValue="#{backingBean.managedBean.latestBranch.smAddress.pmDistrict.districtId}" 
					currValue="#{backingBean.managedBean.selectedBranch.smAddress.pmDistrict.districtId}" 
					alertValue="#{(not empty backingBean.managedBean.latestBranch and 
					 	not empty backingBean.managedBean.latestBranch.smAddress) ?
						backingBean.getDistrictLabelById(backingBean.managedBean.latestBranch.smAddress.pmDistrict.districtId)
						: lbl['lbl.txt.na']}"/>
				<p:message id="branchDistMsg" for="branchDist" showSummary="true"
					showDetail="false" display="icon" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td>
			<!-- #34159 - START - edit required condition -->
				<p:selectOneMenu style="width: 207px;margin-bottom: 5px;background-color:white;"
					id="branchCity" required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
					label="#{lbl['lbl.sm.towncity']}"
					value="#{backingBean.managedBean.selectedBranch.smAddress.cityId}" disabled="#{backingBean.managedBean.upsCannotEdit}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems var="branchCity"
						value="#{backingBean.managedBean.branchCompanyCities}" />
					<!-- #36718 - process panel when change address dropdown -->
					<p:ajax event="change" process="@this @([id$=supBrnAddrPanelId])"
						listener="#{backingBean.onChangeCity(backingBean.managedBean.selectedBranch.smAddress,SupplierManagementConst.SM_BRANCH_PANEL)}"
						update="branchCity,postCodeBranchPanelId" />
				</p:selectOneMenu> 
				<ac:smFieldChangeAlert 
					isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
					oriValue="#{backingBean.managedBean.latestBranch.smAddress.pmCity.cityId}" 
					currValue="#{backingBean.managedBean.selectedBranch.smAddress.pmCity.cityId}" 
					alertValue="#{(not empty backingBean.managedBean.latestBranch and 
					 	not empty backingBean.managedBean.latestBranch.smAddress) ?
						backingBean.getCityLabelById(backingBean.managedBean.latestBranch.smAddress.pmCity.cityId)
						: lbl['lbl.txt.na']}"/>
				<p:message id="branchCityMsg" for="branchCity" showSummary="true"
					showDetail="false" display="icon" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:outputPanel id="postCodeBranchPanelId">
					<p:outputPanel
						rendered="#{backingBean.managedBean.selectedBranch.smAddress.pmCountry.countryId==backingBean.managedBean.myCountryId}">
						<!-- #36718 - change required condition -->
						<p:inputText maxlength="5"
							required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
							label="#{lbl['lbl.sm.postcode']}" id="branchPostCodeMy"
							value="#{backingBean.managedBean.selectedBranch.smAddress.postcode}"
							disabled="#{backingBean.managedBean.upsCannotEdit
 or backingBean.disableFieldSSm(backingBean.managedBean.selectedBranch.ssmData,backingBean.managedBean.smAppl.applValidWithSsm,backingBean.managedBean.selectedBranch.smAddress.postcodeSsmNull)}"
							validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
							size="35">
							<f:validator validatorId="postcodeValidator" />
							<p:ajax process="@this" partialSubmit="true"/>
						</p:inputText>
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
							oriValue="#{backingBean.managedBean.latestBranch.smAddress.postcode}" 
							currValue="#{backingBean.managedBean.selectedBranch.smAddress.postcode}" 
							alertValue="#{backingBean.managedBean.latestBranch.smAddress.postcode}"
							
							/>
						<p:message id="branchPostCodeMyMsg" for="branchPostCodeMy"
							showSummary="true" showDetail="false" display="icon" />
					</p:outputPanel>
					<p:outputPanel
						rendered="#{backingBean.managedBean.selectedBranch.smAddress.pmCountry.countryId!=backingBean.managedBean.myCountryId}">
						<!-- #36718 - change required condition -->
						<p:inputText maxlength="10"
							required="#{backingBean.managedBean.valueReqd and !empty param['disableValidation']}"
							label="#{lbl['lbl.sm.postcode']}" id="branchPostCodeForeign"
							value="#{backingBean.managedBean.selectedBranch.smAddress.postcode}"
							size="35">
							<p:ajax process="@this" partialSubmit="true"/>
						</p:inputText>
						<ac:smFieldChangeAlert 
							isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
							oriValue="#{backingBean.managedBean.latestBranch.smAddress.postcode}" 
							currValue="#{backingBean.managedBean.selectedBranch.smAddress.postcode}" 
							alertValue="#{backingBean.managedBean.latestBranch.smAddress.postcode}"/>
						<p:message id="branchPostCodeForeignMsg"
							for="branchPostCodeForeign" showSummary="true" showDetail="false"
							display="icon" />
					</p:outputPanel>
				</p:outputPanel></td>
		</tr>
		</p:panel>
		<!-- #36718 - END -->
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
			<td>
				<ac:phone id="branchPhoneNo" isMobile="false" label="#{lbl['lbl.sm.phoneno']}"
				countryCode="#{backingBean.managedBean.selectedBranch.phoneCountry}" 
				areaCode="#{backingBean.managedBean.selectedBranch.phoneArea}" 
				number="#{backingBean.managedBean.selectedBranch.phoneNo}"  
				validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" disabled="#{backingBean.managedBean.upsCannotEdit}" />
				<ac:smFieldChangeAlert 
					isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
					oriValue="#{backingBean.managedBean.latestBranch.phoneNo}" 
					currValue="#{backingBean.managedBean.selectedBranch.phoneNo}" 
					alertValue="#{backingBean.managedBean.latestBranch.phoneNo}"/>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
			<td>
				<ac:phone id="branchFaxNo" isMobile="false" label="#{lbl['lbl.sm.faxno']}"
				countryCode="#{backingBean.managedBean.selectedBranch.faxCountry}" 
				areaCode="#{backingBean.managedBean.selectedBranch.faxArea}" 
				number="#{backingBean.managedBean.selectedBranch.faxNo}"  
				validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}" disabled="#{backingBean.managedBean.upsCannotEdit}"/>
				<ac:smFieldChangeAlert 
					isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
					oriValue="#{backingBean.managedBean.latestBranch.faxNo}" 
					currValue="#{backingBean.managedBean.selectedBranch.faxNo}" 
					alertValue="#{backingBean.managedBean.latestBranch.faxNo}"/>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.sm.person.composition.poc']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;background-color:white;"
					required="#{backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.person.composition.poc']}" id="brnPerVal"
					value="#{backingBean.managedBean.selectedBranch.smPersonnel.personnelId}" disabled="#{backingBean.managedBean.upsCannotEdit}">
					<!-- Disable for UPS 32008 - END -->
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems
						value="#{backingBean.managedBean.smAppl.smPersonnels}"
						var="brPerBean" itemLabel="#{brPerBean.name}"
						itemValue="#{brPerBean.personnelId}" />
					<p:ajax process="@this" partialSubmit="true"/>
				</p:selectOneMenu> 
				<ac:smFieldChangeAlert 
					isShow="#{backingBean.managedBean.showFieldChanges
							and not empty backingBean.managedBean.selectedBranch.supplierBranchId}"
					oriValue="#{backingBean.managedBean.latestBranch.smPersonnel.identificationNo}" 
					currValue="#{backingBean.managedBean.selectedBranch.smPersonnel.identificationNo}" 
					alertValue="#{backingBean.managedBean.latestBranch.smPersonnel.name}"/>
				<p:message id="brnPerValMsg" for="brnPerVal" showSummary="true"
					showDetail="false" display="icon" /></td>
		</tr>

	</table>
</ui:composition>
