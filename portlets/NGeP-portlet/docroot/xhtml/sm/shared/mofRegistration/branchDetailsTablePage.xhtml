<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<table style="width: 100%">
		<tr>
			<td><p:outputLabel value="* Branch Name" /></td>
			<td><p:inputText
					value="#{backingBean.managedBean.selectedBranch.branchName}"
					size="35" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="* Address" /></td>
			<td><p:inputText
					value="#{backingBean.managedBean.selectedBranch.smAddress.address1}"
					size="35" /></td>
		</tr>

		<tr>
			<td></td>
			<td><p:inputText
					value="#{backingBean.managedBean.selectedBranch.smAddress.address2}"
					size="35" /></td>
		</tr>
		<tr>
			<td></td>
			<td><p:inputText
					value="#{backingBean.managedBean.selectedBranch.smAddress.address3}"
					size="35" /></td>
		</tr>
		<tr>
			<td></td>
			<td><p:inputText
					value="#{backingBean.managedBean.selectedBranch.smAddress.address4}"
					size="35" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="*#{lbl['lbl.sm.country']}" /></td>
			<td><p:selectOneMenu
					value="#{backingBean.managedBean.selectedBranch.smAddress.pmCountry.countryId}"
					style="width: 207px;margin-bottom: 5px;">
					<f:selectItem itemLabel="---Select---" itemValue="" />
					<f:selectItems var="branchCountry"
						value="#{backingBean.managedBean.countryLs}"
						itemValue="#{branchCountry.countryId}"
						itemLabel="#{branchCountry.countryName}" />
					<p:ajax event="change"
						listener="#{backingBean.populateStatesByCountry(backingBean.managedBean.selectedBranch.smAddress.pmCountry.countryId, 
								SupplierManagementConst.SM_BRANCH_PANEL,
								backingBean.managedBean.selectedBranch.smAddress.pmState,
								backingBean.managedBean.selectedBranch.smAddress.pmDistrict,
								backingBean.managedBean.selectedBranch.smAddress.pmCity)}"
						update="branchState,branchDist,branchCity" />
				</p:selectOneMenu></td>
		</tr>

		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
			<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
					value="#{backingBean.managedBean.selectedBranch.smAddress.pmState.stateId}"
					id="branchState">
					<f:selectItem itemLabel="---Select---" itemValue="" />
					<f:selectItems var="brnState"
						value="#{backingBean.managedBean.branchCompanyStates}"
						itemValue="#{brnState.stateId}" itemLabel="#{brnState.stateName}" />
					<p:ajax event="change"
						listener="#{backingBean.populateDistrictsByState(backingBean.managedBean.selectedBranch.smAddress.pmState.stateId, 
								SupplierManagementConst.SM_BRANCH_PANEL,
								backingBean.managedBean.selectedBranch.smAddress.pmDistrict,
								backingBean.managedBean.selectedBranch.smAddress.pmCity)}"
						update="branchDist,branchCity" />

				</p:selectOneMenu></td>
		</tr>

		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
			<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
					id="branchDist"
					value="#{backingBean.managedBean.selectedBranch.smAddress.pmDistrict.districtId}">
					<f:selectItem itemLabel="---Select---" itemValue="" />
					<f:selectItems var="brnDist"
						value="#{backingBean.managedBean.branchCompanyDistricts}"
						itemValue="#{brnDist.districtId}"
						itemLabel="#{brnDist.districtName}" />
					<p:ajax event="change"
						listener="#{backingBean.populateCitiesByDistrict(backingBean.managedBean.selectedBranch.smAddress.pmDistrict.districtId, 
								SupplierManagementConst.SM_BRANCH_PANEL,
								backingBean.managedBean.selectedBranch.smAddress.pmCity)}"
						update="branchCity" />
				</p:selectOneMenu></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
			<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
					id="branchCity"
					value="#{backingBean.managedBean.selectedBranch.smAddress.pmCity.cityId}">
					<f:selectItem itemLabel="---Select---" itemValue="" />
					<f:selectItems var="branchCity"
						value="#{backingBean.managedBean.branchCompanyCities}"
						itemValue="#{branchCity.cityId}"
						itemLabel="#{branchCity.cityName}" />
				</p:selectOneMenu></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
			<td><p:inputText
					value="#{backingBean.managedBean.selectedBranch.smAddress.postcode}"
					size="35" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="Phone NO." /></td>
			<td><p:inputText
					value="#{backingBean.managedBean.selectedBranch.phoneNo}" size="35" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="Fax NO." /></td>
			<td><p:inputText
					value="#{backingBean.managedBean.selectedBranch.faxNo}" size="35" /></td>
		</tr>

	</table>
</ui:composition>
