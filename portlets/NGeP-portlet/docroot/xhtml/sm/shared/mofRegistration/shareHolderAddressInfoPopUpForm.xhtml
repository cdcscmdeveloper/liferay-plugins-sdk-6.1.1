<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<table style="width: 100%">
		<tr>
			<td><p:outputPanel id="permAddrPan"
					layout="block">
					
					<ac:smShareholderAddress bBean="#{backingBean}" 
					addressTitle="#{backingBean.managedBean.selectedShareHolder.identificationType.parameterCode == SupplierManagementConst.NEW_IC 
						? lbl['lbl.sm.ic.address'] : lbl['lbl.sm.person.permAddr']}" 
					addrObj="#{backingBean.managedBean.shareHolderPermAddr}" 
					latestAddrObj="#{backingBean.managedBean.latestPermAddr}" 
					addrPanelId="permAddrPan" addrId="equiPersPermAddrLine" 
					stateItems="#{backingBean.managedBean.shrHldrPermStates}"
					districtItems="#{backingBean.managedBean.shrHldrPermDistricts}"
					cityItems="#{backingBean.managedBean.shrHldrPermCities}"
					countryId="equiPersPermCntry" stateId="shrPermState" 
					districtId="shrPermDist" cityId="shrPermCity" 
					postCodeId="equiPersPermAddrPostCode"
					addressType="#{SupplierManagementConst.SM_SHRHLDR_PERM_ADDR_PANEL}"/>
					
				</p:outputPanel></td>
			<td><p:outputPanel id="mailAddrPan"
					rendered="#{backingBean.managedBean.selectedShareHolder.authorizedFlg eq '1'}"
					layout="block">
					
					<ac:smShareholderAddress bBean="#{backingBean}" 
					addressTitle="#{lbl['lbl.sm.person.mailAddr']}" 
					addrObj="#{backingBean.managedBean.shareHolderMailAddr}" 
					latestAddrObj="#{backingBean.managedBean.latestMailAddr}" 
					addrPanelId="mailAddrPan" addrId="equiPersMailAddrLine" 
					stateItems="#{backingBean.managedBean.shrHldrMailStates}"
					districtItems="#{backingBean.managedBean.shrHldrMailDistricts}"
					cityItems="#{backingBean.managedBean.shrHldrMailCities}"
					countryId="equiPerMailCntry" stateId="shrMailState" 
					districtId="shrMailDist" cityId="shrMailCity" 
					postCodeId="equiPersMailAddrPostCode" showTick="true"
					tickLabel="#{lbl['lbl.sm.person.duplicateAddr']}"
					addressType="#{SupplierManagementConst.SM_SHRHLDR_MAIL_ADDR_PANEL}"/>
					
				</p:outputPanel></td>
		</tr>
		<tr>
			<td><p:outputPanel id="resiAddrPan"
					layout="block"
					rendered="#{backingBean.managedBean.selectedShareHolder.equityOwner or backingBean.managedBean.selectedShareHolder.higherManagement or backingBean.managedBean.selectedShareHolder.director}">
					
					<ac:smShareholderAddress bBean="#{backingBean}" 
					addressTitle="#{lbl['lbl.sm.person.resiAddr']}" 
					addrObj="#{backingBean.managedBean.shareHolderResdAddr}" 
					latestAddrObj="#{backingBean.managedBean.latestResdAddr}" 
					addrPanelId="resiAddrPan" addrId="equiPersResiAddrLine" 
					stateItems="#{backingBean.managedBean.shrHldrResdStates}"
					districtItems="#{backingBean.managedBean.shrHldrResdDistricts}"
					cityItems="#{backingBean.managedBean.shrHldrResdCities}"
					countryId="equiPersResiCntry" stateId="shrResState" 
					districtId="shrResDist" cityId="shrResCity" 
					postCodeId="equiPersResdAddrPostCode" showTick="true" 
					tickLabel="#{lbl['lbl.sm.person.duplicateAddr']}" 
					addressType="#{SupplierManagementConst.SM_SHRHLDR_RESD_ADDR_PANEL}"/>
					
				</p:outputPanel></td>
			<td><p:outputPanel id="offcAddrPan" layout="block"
					rendered="#{backingBean.managedBean.selectedShareHolder.equityOwner or backingBean.managedBean.selectedShareHolder.higherManagement or backingBean.managedBean.selectedShareHolder.director}">
					
					<ac:smShareholderAddress bBean="#{backingBean}" 
					addressTitle="#{lbl['lbl.sm.person.offAddr']}" 
					addrObj="#{backingBean.managedBean.shareHolderOffAddr}" 
					latestAddrObj="#{backingBean.managedBean.latestOffAddr}" 
					addrPanelId="offcAddrPan" addrId="equiPersOffcAddrLine" 
					stateItems="#{backingBean.managedBean.shrHldrOffStates}"
					districtItems="#{backingBean.managedBean.shrHldrOffDistricts}"
					cityItems="#{backingBean.managedBean.shrHldrOffCities}"
					countryId="equiPersOffcCntry" stateId="shrOffState" 
					districtId="shrOffDist" cityId="shrOffCity" 
					postCodeId="equiPersOffcAddrPostCode" showTick="true"
					tickLabel="#{lbl['lbl.sm.person.duplicateCmpnyAddr']}"
					addressType="#{SupplierManagementConst.SM_SHRHLDR_OFF_ADDR_PANEL}"/>
					
				</p:outputPanel></td>
		</tr>
	</table>
	
	
</ui:composition>
