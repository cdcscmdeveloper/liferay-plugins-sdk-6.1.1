<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="tncDialog" header="#{lbl['lbl.sm.forcereplaceadmin.tnc']}"
		widgetVar="tncDialog" modal="true" width="400px" height="300px">
		<p:outputPanel id="dPanel">
			<table style="width: 100%">
				<tr>
					<td>
						<h:outputText value="#{lbl['lbl.sm.forcereplaceadmin.tnc.declaration']}" 
							style="float: left;white-space: normal;" escape="false"/>
					</td>
				</tr>
			</table>
		</p:outputPanel>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.declare']}" id="btnYes" onclick="tncDialog.hide();" 
				action="#{forceReplaceSuppAdminBackingBean.replaceWithExistingUser}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" action="#{forceReplaceSuppAdminBackingBean.cancelTncPopup}"  
				update="@form" process="@this"/>
		</div>
	</p:dialog>

</ui:composition>
