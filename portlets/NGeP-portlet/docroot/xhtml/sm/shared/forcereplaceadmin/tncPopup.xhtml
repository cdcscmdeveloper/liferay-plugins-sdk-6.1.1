<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="tncDialog" header="#{lbl['lbl.sm.forcereplaceadmin.headerpanel.tnc']}"
		widgetVar="tncDialog" modal="true" width="400" height="100">
		<p:outputPanel id="dPanel">
			<table>
				<tr>
					<td>
						<p:selectBooleanCheckbox id="chkTcId" value="#{forceReplaceSuppAdminBackingBean.managedBean.agreeTnc}">
							<p:ajax update="btnYes" partialSubmit="true" process="@this" />
						</p:selectBooleanCheckbox>
					</td>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.forcereplaceadmin.tnc.msg.agreed']}" styleClass="outputLabel-view" />
						<h:commandLink
							action="#{forceReplaceSuppAdminBackingBean.viewTnc}" target="_blank"
							process="@this" partialSubmit="true" >
							<p:outputLabel value="#{lbl['lbl.sm.forcereplaceadmin.tnc.msg.tnc']}" styleClass="outputLabel-view" />
						</h:commandLink>
					</td>
				</tr>
				<tr>
					<td colspan="2">
						<div align="center">
							<p:commandButton value="#{lbl['lbl.btn.yes']}" id="btnYes" onclick="tncDialog.hide();" 
								action="#{forceReplaceSuppAdminBackingBean.replaceWithExistingUser}" 
								disabled="#{!forceReplaceSuppAdminBackingBean.managedBean.agreeTnc}"
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
							<p:commandButton value="#{lbl['lbl.btn.no']}" action="#{forceReplaceSuppAdminBackingBean.cancelTncPopup}"  />
						</div>
					</td>
				</tr>
			</table>
		</p:outputPanel>
	</p:dialog>

</ui:composition>
