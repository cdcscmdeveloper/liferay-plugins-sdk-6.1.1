<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.branch.panHdr']}" toggleable="true" id="branchGstInfoPanelId">
		<p:dataTable var="br" id="branchDt"
			value="#{smUpdateGstInfoBackingBean.managedBean.branches}"
			rowIndexVar="index">

			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
				style="width : 5%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.branch']}">
			
				<table style="width: 50%;table-layout:fixed">
					<tr>
						<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.branch.branchName']}" /></td>
						<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view" value="#{br.branch.branchName}" /></td>
					</tr>
					<tr>
						<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.companyaddress']}" /></td>
						<td style="border-style: none !important;white-space: normal;"><p:outputLabel styleClass="outputLabel-view" value="#{smUpdateGstInfoBackingBean.getFullAddress(br.branch.smAddress)}" /></td>
					</tr>
				 </table>
				 <br />
				 
				 <ac:smGstMainFields smGstSupplier="#{br.gst}" 
					isGstEmpty="#{empty br.gst or empty br.gst.gstSupplierId}" />
				
				 <div align="right">
					<p:commandButton value="#{lbl['lbl.sm.button.add']}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						partialSubmit="true" process="@this" disabled="#{not empty br.gst}"
						update="@([id$=branchGstInfoPanelId])" action="#{smUpdateGstInfoBackingBean.addBranchGst(br)}">
					</p:commandButton>
					<p:commandButton value="#{lbl['lbl.sm.button.save']}"
						partialSubmit="true" process="@this" disabled="#{empty br.gst}"
						oncomplete="confirmAddHqDialog.show();" action="#{smUpdateGstInfoBackingBean.onSaveBranchGst(br)}">
					</p:commandButton>
					<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
						partialSubmit="true" process="@this" 
						disabled="#{empty br.gst or empty br.gst.gstSupplierId}"
						oncomplete="confirmDeleteHqDialog.show();" action="#{smUpdateGstInfoBackingBean.onDeleteBranchGst(br)}">
					</p:commandButton>
				</div>
				
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<p:confirmDialog id="confirmDeleteBranchDialog"
		message="#{lbl['lbl.sm.gst.delete.confirm.msg']}"
		header="#{lbl['lbl.sm.userprofile.confirmation']}"
		widgetVar="confirmDeleteBranchDialog">
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDeleteBranchDialog.hide();" 
				action="#{smUpdateGstInfoBackingBean.deleteBranchGst}" update="@form"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
			<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDeleteBranchDialog.hide();" />
		</div>
	</p:confirmDialog>
	
	<p:confirmDialog id="confirmAddBranchDialog"
		message="#{smUpdateGstInfoBackingBean.managedBean.saveBranchGstConfirmMsg}"
		header="#{lbl['lbl.sm.userprofile.confirmation']}"
		widgetVar="confirmAddBranchDialog">
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmAddBranchDialog.hide();" 
				action="#{smUpdateGstInfoBackingBean.saveBranchGst}" update="@form"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
			<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmAddBranchDialog.hide();" />
		</div>
	</p:confirmDialog>
</ui:composition>
