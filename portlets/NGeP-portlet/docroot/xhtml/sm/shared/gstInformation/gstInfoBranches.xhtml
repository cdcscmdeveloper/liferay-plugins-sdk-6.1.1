<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.branch.panHdr']}" toggleable="true" id="branchGstInfoPanelId">
		<p:dataTable var="br" id="branchDt"
			value="#{smUpdateGstInfoBackingBean.managedBean.branches}"
			rowIndexVar="index">

			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
				style="width : 5%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.branch']}">
			
				<table style="width: 50%;table-layout:fixed">
					<tr>
						<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.branch.branchName']}" /></td>
						<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view" value="#{br.branch.branchName}" /></td>
					</tr>
					<tr>
						<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.companyaddress']}" /></td>
						<td style="border-style: none !important;white-space: normal;"><p:outputLabel styleClass="outputLabel-view" value="#{smUpdateGstInfoBackingBean.getFullAddress(br.branch.smAddress)}" /></td>
					</tr>
				 </table>
				 <br />
				 
				 <p:outputPanel rendered="#{not empty br.gst and br.gst.isCurrent}">
					 <table style="width: 50%;table-layout:fixed">
						<tr>
							<td style="border-style: none !important;float: right !important;">
								<p:selectBooleanCheckbox value="#{br.sameWithHq}">
									<p:ajax update="@([id$=branchGstInfoPanelId])" event="change"
										process="@this"
										listener="#{smUpdateGstInfoBackingBean.copyHqGstToBranch(br)}" />
								</p:selectBooleanCheckbox>
							</td>
							<td valign="top" style="border-style: none !important;">
								<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.brnch.gstSame']}" />
							</td>
						</tr>
					</table>
				  </p:outputPanel>
				 
				 <p:outputPanel rendered="#{!br.sameWithHq}">
				 	<ac:smGstMainFields smGstSupplier="#{br.gst}" isGstEmpty="#{empty br.gst or !br.gst.isCurrent}" />
				 </p:outputPanel>
				 
				 <p:outputPanel rendered="#{br.sameWithHq}">
				 	<ui:include src="/xhtml/sm/shared/gstInformation/gstDisableFields.xhtml" />
				 </p:outputPanel>
				
				 <br />
				 <p:dataTable var="table" id="hqSuppDocDtId"
					value="#{br.gst.smGstSupplierDocs}" rendered="#{not empty br.gst and br.gst.isCurrent and !br.sameWithHq}"
					rowIndexVar="index">
		
					<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
						style="width : 5%;">
						<p:outputLabel value="#{index + 1}"
							style="float: left;white-space: normal;" />
					</p:column>
		
					<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
						style="width : 55%;">
						<h:outputText value="#{table.pmDocument.docName}"
							style="float: left;white-space: normal;" />
					</p:column>
		
					<p:column headerText="#{lbl['lbl.btn.upload.doc']}"
						style="width : 20%;">
		
						<p:commandLink oncomplete="branchUploadDialog.show();return false;"
							rendered="#{!table.pmDocument.hardCopyReq}"
							update="@([id$=branchUploadDialog])"
							action="#{smUpdateGstInfoBackingBean.assignSelectedBranchSupportDoc(br,table)}">
							<p:graphicImage value="/css/images/design/upload.png"
								style="margin-right:2px;" />
						</p:commandLink>
		
					</p:column>
					<p:column headerText="#{lbl['lbl.pm.document.name']}"
						style="width : 20%;">
						<h:outputText value="#{table.fileName}" 
							style="float: left;white-space: normal;" />
					</p:column>
				</p:dataTable>
				
				 <div align="right">
					<p:commandButton value="#{lbl['lbl.sm.button.add']}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						partialSubmit="true" process="@this" 
						disabled="#{smUpdateGstInfoBackingBean.managedBean.gstEmpty or (not empty br.gst and br.gst.isCurrent) 
							or br.sameWithHq}"
						update="@([id$=branchGstInfoPanelId])" action="#{smUpdateGstInfoBackingBean.addBranchGst(br)}">
					</p:commandButton>
					<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
						partialSubmit="true" process="@this" 
						disabled="#{empty br.gst or !br.gst.isCurrent}"
						action="#{smUpdateGstInfoBackingBean.deleteBranchGst(br)}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						update="@form">
					</p:commandButton>
				</div>
				
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<p:dialog id="branchUploadDialog" widgetVar="branchUploadDialog" modal="true"
		dynamic="true" resizable="false" width="700px" height="200"
		styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:fileUpload allowTypes="/(\.|\/)(pdf|doc|docx)$/"
			sizeLimit="1000000"
			invalidFileMessage="#{lbl['lbl.sm.upload.format.errmsg']}"
			invalidSizeMessage="#{lbl['lbl.sm.upload.fileSize.exceed1Mb']}"
			fileUploadListener="#{smUpdateGstInfoBackingBean.handleBranchSupDocFileAttachment}"
			update="@form" oncomplete="branchUploadDialog.hide();" />
	</p:dialog>
</ui:composition>
