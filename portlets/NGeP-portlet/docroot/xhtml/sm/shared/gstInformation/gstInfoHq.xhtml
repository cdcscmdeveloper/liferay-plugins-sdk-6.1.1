<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.companyinfo']}" toggleable="true" id="hqGstInfoPanelId">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.updategst.note']}"/><br />
		<table style="width: 100%;table-layout:fixed">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.companyname']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{smUpdateGstInfoBackingBean.managedBean.companyBasic.companyName}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.rocNo']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{smUpdateGstInfoBackingBean.managedBean.smSupplier.regNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.regtype']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{smUpdateGstInfoBackingBean.getParameterDesc(SupplierManagementConst.supplierBusinessType,smUpdateGstInfoBackingBean.managedBean.smSupplier.businessType)}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mof.no']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" rendered="#{empty smUpdateGstInfoBackingBean.managedBean.mofAccount.mofNo}"/>
					<p:outputLabel styleClass="outputLabel-view" value="#{smUpdateGstInfoBackingBean.managedBean.mofAccount.mofNo}" rendered="#{not empty smUpdateGstInfoBackingBean.managedBean.mofAccount.mofNo}"/>
				</td>
			</tr>
		</table>
		<br />
		
		<p:outputPanel id="hqGstNotEmptyPanelId" rendered="#{!smUpdateGstInfoBackingBean.managedBean.gstEmpty}">
			<table style="width: 50%;table-layout:fixed">
				<tr>
					<td style="border-style: none !important;">
						<p:outputLabel value="#{lbl['lbl.sm.gst.regno']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td style="border-style: none !important;"><p:inputText id="hqGstRegNo"  maxlength="12" 
						value="#{smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.gstRegNo}" required="true"
						size="35" label="#{lbl['lbl.sm.gst.regno']}" 
						validatorMessage="#{lbl['lbl.sm.gstNo']} - #{lbl['lbl.sm.invalidNo']}">
						<p:ajax event="blur" process="@this" update="@form" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						</p:inputText>
						<p:message id="hqGstRegNoMsg"
							for="hqGstRegNo" showSummary="true" showDetail="false"
							display="icon" />
					</td>
				</tr>
				<tr>
					<td style="border-style: none !important;">
						<p:outputLabel value="#{lbl['lbl.sm.gst.effdate']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td style="border-style: none !important;"><p:calendar id="hqGstRegDateCalId"
							navigator="true" 
							required="#{not empty smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.gstRegNo}" 
							label="#{lbl['lbl.sm.gst.effdate']}" 
							value="#{smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.gstEffDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
							readonlyInput="true" size="30" showOn="button" yearRange="-99:+0" 
							mindate="#{CommonConstants.GST_LAUNCH_DATE}">
							<p:ajax event="dateSelect"  update="@form" process="@this"/>
						</p:calendar>
						<p:message id="hqGstRegDateCalIdMsg"
							for="hqGstRegDateCalId" showSummary="true" showDetail="false"
							display="icon" />
					</td>
				</tr>
				<tr>
					<td style="border-style: none !important;"><p:outputLabel value="#{lbl['lbl.sm.gst.eff.end.date']}" /></td>
					<td style="border-style: none !important;"><p:calendar id="hqGstEffEndDateCalId"
							navigator="true" 
							label="#{lbl['lbl.sm.gst.eff.end.date']}"
							value="#{smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.gstEndDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
							readonlyInput="true" size="30" showOn="button" yearRange="-99:+10" 
							mindate="#{CommonConstants.GST_LAUNCH_DATE}">
							<p:ajax event="dateSelect"  update="hqGstNotEmptyPanelId" process="@this"/>
						</p:calendar>
						<p:message id="hqGstEffEndDateCalIdMsg"
							for="hqGstEffEndDateCalId" showSummary="true" showDetail="false"
							display="icon" />
					</td>
				</tr>
			</table>
	  	</p:outputPanel>
	  	<p:outputPanel id="hqGstEmptyPanelId" rendered="#{smUpdateGstInfoBackingBean.managedBean.gstEmpty}">
	  		<table style="width: 50%;table-layout:fixed">
		  		<tr>
					<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.gst.regno']}" /></td>
					<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" /></td>
				</tr>
				<tr>
					<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.gst.effdate']}" /></td>
					<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" /></td>
				</tr>
				<tr>
					<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.gst.eff.end.date']}" /></td>
					<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" /></td>
				</tr>
			</table>
	  	</p:outputPanel>
		
		<br />
		<p:dataTable var="table" id="hqSuppDocDtId" rendered="#{!smUpdateGstInfoBackingBean.managedBean.gstEmpty}"
			value="#{smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.smGstSupplierDocs}" 
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" 
			rowIndexVar="index">

			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
				style="width : 5%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
				style="width : 55%;">
				<h:outputText value="#{table.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.btn.upload.doc']}"
				style="width : 20%;">
				<p:outputPanel rendered="#{not empty smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.gstRegNo 
					and not empty smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.gstEffDate and !table.pmDocument.hardCopyReq}">
					<p:commandLink oncomplete="hqUploadDialog.show();return false;"
						update="@([id$=hqUploadDialog])"
						action="#{smUpdateGstInfoBackingBean.assignSelectedHqSupportDoc(table)}">
						<p:graphicImage value="/css/images/design/upload.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:outputPanel>

			</p:column>
			<p:column headerText="#{lbl['lbl.pm.document.name']}"
				style="width : 20%;">
				<h:outputText value="#{table.fileName}" rendered="#{not empty table.fileName}"
					style="float: left;white-space: normal;" />
				<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty table.fileName}" />
			</p:column>
		</p:dataTable>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				partialSubmit="true" process="@this" disabled="#{!smUpdateGstInfoBackingBean.managedBean.gstEmpty}"
				update="@form" action="#{smUpdateGstInfoBackingBean.addHqGst}">
			</p:commandButton>
			<p:commandButton value="#{lbl['lbl.sm.button.delete']}"
				partialSubmit="true" process="@this" update="@form"
				disabled="#{empty smUpdateGstInfoBackingBean.managedBean.hqGstSupplier 
					or smUpdateGstInfoBackingBean.managedBean.gstEmpty}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				action="#{smUpdateGstInfoBackingBean.deleteHqGst}">
			</p:commandButton>
		</div>
	</p:panel>
	
	<p:dialog id="hqUploadDialog" widgetVar="hqUploadDialog" modal="true"
		dynamic="true" resizable="false" width="700px" height="200"
		styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:fileUpload allowTypes="/(\.|\/)(pdf|doc|docx)$/"
			sizeLimit="1000000"
			invalidFileMessage="#{lbl['lbl.sm.upload.format.errmsg']}"
			invalidSizeMessage="#{lbl['lbl.sm.upload.fileSize.exceed1Mb']}"
			fileUploadListener="#{smUpdateGstInfoBackingBean.handleHqSupDocFileAttachment}"
			update="@form" oncomplete="hqUploadDialog.hide();" />
	</p:dialog>
	
</ui:composition>
