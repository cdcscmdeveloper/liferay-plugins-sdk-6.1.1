<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel id="gstEditInfoPanelId" rendered="#{not empty smUpdateGstInfoBackingBean.managedBean.hqGstSupplier}">
		<table style="width: 50%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.gst.regno']}" /></td>
				<td><p:inputText id="gstRegNo"  maxlength="12" 
					value="#{smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.gstRegNo}" 
					size="40" label="#{lbl['lbl.sm.gst.regno']}" >
					<p:ajax event="blur" update="gstEffDatePanelId" />
					</p:inputText>
				</td>
			</tr>
			<p:outputPanel id="gstEffDatePanelId">
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.gst.effdate']}" />
						<p:outputLabel value="*" styleClass="mandatory" rendered="#{not empty smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.gstRegNo}"/>
					</td>
					<td><p:calendar id="gstRegDateCalId"
							navigator="true" 
							required="#{not empty smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.gstRegNo}" 
							label="#{lbl['lbl.sm.gst.effdate']}"
							value="#{smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.gstEffDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
							readonlyInput="true" size="30" showOn="button" yearRange="-99:+0" maxdate="#{CommonConstants.CURRENT_DATE}">
						</p:calendar></td>
				</tr>
			</p:outputPanel>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.gst.eff.end.date']}" /></td>
				<td><p:calendar id="gstEffEndDateCalId"
						navigator="true" 
						required="#{not empty smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.gstEndDate}" 
						label="#{lbl['lbl.sm.gst.eff.end.date']}"
						value="#{smUpdateGstInfoBackingBean.managedBean.hqGstSupplier.gstEndDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
						readonlyInput="true" size="30" showOn="button" yearRange="-99:+0" mindate="#{CommonConstants.CURRENT_DATE}">
					</p:calendar></td>
			</tr>
		</table>
	</p:outputPanel>
</ui:composition>
