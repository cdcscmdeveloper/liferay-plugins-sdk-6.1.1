<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.complainant.details']}" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.complainant.name']}" /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplainant.name}"
						size="40" /></td>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.nationality']}" /></td>
				<td class="tdContent"><p:selectOneMenu
						value="#{complaintBackingBean.managedBean.smComplainant.nationality.countryId}">
						<f:selectItems  value="#{complaintBackingBean.getCountryDropDown()}" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.identificationtype']}" /></td>
				<td class="tdContent"><p:selectOneMenu value="#{complaintBackingBean.managedBean.smComplainant.identificationType.parameterId}">
						<f:selectItems value="#{complaintBackingBean.getDropdownValues(ParameterTypeConst.identificationTypes)}"/> />
					</p:selectOneMenu></td>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.person.composition.idenNum']}" /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplainant.identificationNo}" /></td>
			</tr>

			<tr>
				
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.address']}" /></td>
				<td class="tdContent"><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplainant.smAddress.address1}" /></td>
						
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.country']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="complainantCountryId"
						value="#{complaintBackingBean.managedBean.smComplainant.smAddress.pmCountry.countryId}">
						<f:selectItems  value="#{complaintBackingBean.getCountryDropDown()}" />
						<p:ajax event="change" update="complainantStateId" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplainant.smAddress.address2}" /></td>
						
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.state']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="complainantStateId"
						value="#{complaintBackingBean.managedBean.smComplainant.smAddress.pmState.stateId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="state"
							value="#{complaintBackingBean.getStateDropDownByCountry(complaintBackingBean.managedBean.smComplainant.smAddress.pmCountry.countryId)}"
							itemValue="#{state.stateId}"
							itemLabel="#{state.stateName}">
						</f:selectItems>
						<p:ajax event="change" update="complainantDistrictId" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplainant.smAddress.address3}" /></td>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.district']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="complainantDistrictId" value="#{complaintBackingBean.managedBean.smComplainant.smAddress.pmDistrict.districtId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="district"
							value="#{complaintBackingBean.getDistrictDropDownByState(complaintBackingBean.managedBean.smComplainant.smAddress.pmState.stateId)}"
							itemValue="#{district.districtId}"
							itemLabel="#{district.districtName}">
						</f:selectItems>
						<p:ajax event="change" update="complainantCityId" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplainant.smAddress.address4}" /></td>
						
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.towncity']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="complainantCityId" value="#{complaintBackingBean.managedBean.smComplainant.smAddress.pmCity.cityId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="city"
							value="#{complaintBackingBean.getCityDropDownByDistrict(complaintBackingBean.managedBean.smComplainant.smAddress.pmDistrict.districtId)}"
							itemLabel="#{city.cityName}" itemValue="#{city.cityId}" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.postcode']}" /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplainant.smAddress.postcode}"
						size="40" /></td>
				
				
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td class="tdContent">
					<ac:phone id="txtPhoneNoId" isMobile="false" label="#{lbl['lbl.sm.phoneno']}"
						countryCode="#{complaintBackingBean.managedBean.smComplainant.phoneCountry}" 
						areaCode="#{complaintBackingBean.managedBean.smComplainant.phoneArea}" 
						number="#{complaintBackingBean.managedBean.smComplainant.phoneNo}"  
						validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" />
				</td>
				
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.faxno']}" /></td>
				<td class="tdContent">
					<ac:phone id="txtFaxNoId" isMobile="false" label="#{lbl['lbl.sm.faxno']}"
						countryCode="#{complaintBackingBean.managedBean.smComplainant.faxCountry}" 
						areaCode="#{complaintBackingBean.managedBean.smComplainant.faxArea}" 
						number="#{complaintBackingBean.managedBean.smComplainant.faxNo}"  
						validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}" />
				</td>
			</tr>
			
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.mobilenumber']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<ac:phone id="txtMobileNoId" label="#{lbl['lbl.sm.mobilenumber']}"
						countryCode="#{complaintBackingBean.managedBean.smComplainant.mobileCountry}" 
						areaCode="#{complaintBackingBean.managedBean.smComplainant.mobileArea}" 
						number="#{complaintBackingBean.managedBean.smComplainant.mobileNo}" 
						isMobile="true" 
						validatorMessage="#{lbl['lbl.sm.mobilenumber']} - #{lbl['lbl.sm.invalidNo']}"
						telcoId="#{complaintBackingBean.managedBean.smComplainant.mobileTelcoId}" /></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.email']}" /></td>
				<td class="tdContent"><p:inputText size="40" id="usrEmail" value="#{complaintBackingBean.managedBean.smComplainant.email}" /></td>
			</tr>

			<c:if test="#{complaintBackingBean.managedBean.smComplaint.brandNew}">
				<tr>
					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.confirmemail']}" /></td>
					<td class="tdContent"><p:inputText size="40" id="conEmail" /></td>
				</tr>
			</c:if>
		</table>

	</p:panel>
</ui:composition>
