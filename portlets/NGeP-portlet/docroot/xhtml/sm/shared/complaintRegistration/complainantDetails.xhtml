<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="#{lbl['lbl.sm.complainant.details']}" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.complainant.name']}" /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplainant.name}"
						size="40" /></td>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.nationality']}" /></td>
				<td class="tdContent"><p:selectOneMenu
						value="#{complaintBackingBean.managedBean.smComplainant.nationalityId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.nationality.malaysian']}" itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.nationality.nonmalaysian']}" itemValue="0" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.identificationtype']}" /></td>
				<td class="tdContent"><p:selectOneMenu
						value="#{complaintBackingBean.managedBean.smComplainant.identificationTypeId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.identificationtype.ic']}" itemValue="I" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.identificationtype.passport']}" itemValue="P" />
					</p:selectOneMenu></td>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.person.composition.idenNum']}" /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplainant.identificationNo}" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.country']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="countryId"
						style="width: 150px !important;"
						value="#{complaintBackingBean.managedBean.smComplainant.pmCountry.countryId}">
						<f:selectItems var="counLs"
							value="#{complaintBackingBean.managedBean.countryLs}"
							itemLabel="#{counLs.countryName}" itemValue="#{counLs.countryId}" />
						<p:ajax event="change"
							listener="#{complaintBackingBean.retrievePmStateList}"
							update="stateId" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.address']}" /></td>
				<td class="tdContent"><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplainant.address1}" /></td>
			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplainant.address2}" /></td>
			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplainant.address3}" /></td>
			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplainant.address4}" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.postcode']}" /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplainant.postcode}"
						size="40" /></td>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.state']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="stateId"
						value="#{complaintBackingBean.managedBean.smComplainant.pmState.stateId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="state"
							value="#{complaintBackingBean.managedBean.stateLs}"
							itemLabel="#{state.stateName}" itemValue="#{state.stateId}" />
						<p:ajax event="change"
							listener="#{complaintBackingBean.retrievePmDistrictList}"
							update="districtId" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.district']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="districtId">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="district"
							value="#{complaintBackingBean.managedBean.districtLs}"
							itemValue="#{district.districtId}"
							itemLabel="#{district.districtName}"></f:selectItems>
					</p:selectOneMenu></td>

				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.towncity']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="cityId">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="city"
							value="#{complaintBackingBean.managedBean.cityLs}"
							itemLabel="#{city.cityName}" itemValue="#{city.cityId}" />
					</p:selectOneMenu></td>
			</tr>

			<c:if
				test="#{!complaintBackingBean.managedBean.smComplaint.brandNew}">
				<tr>
					<td class="tdTitle">#{lbl['lbl.sm.complainant.myidentity.status']}</td>
					<td class="tdContent"><p:commandLink value="#{lbl['lbl.sm.sitevist.link.click.here']}"
							onclick="myIdentDlg.show()" /></td>
					<td class="tdTitle">&#160;</td>
					<td class="tdContent">&#160;</td>
				</tr>
			</c:if>
		</table>

		<p:dialog id="myIdentityDlg" header="#{lbl['lbl.sm.complainant.myidentity.status']}"
			widgetVar="myIdentDlg" modal="true" height="300" width="400">
			<table class="customTbl">
				<tr>
					<td><b>New I/C No</b></td>

				</tr>

				<tr>

					<td>Mohammad Bin Muthu</td>
				</tr>

				<tr>
					<td><b>DOB</b></td>
					<td>12-11-1984</td>
				</tr>

				<tr>
					<td><b>Resident status</b></td>
					<td>Malaysian</td>
				</tr>

				<tr>
					<td><b>Permenant Address</b></td>
					<td>2A, Jalan Damai Perdana 5/12D</td>
				</tr>

				<tr>
					<td></td>
					<td>Bandar Damai Perdana</td>
				</tr>

				<tr>
					<td></td>
					<td>Cheras</td>
				</tr>

				<tr>
					<td></td>
					<td>56000, Kuala Lumpur</td>
				</tr>

				<tr>
					<td><b>Race</b></td>
					<td>Malay</td>
				</tr>

				<tr>
					<td><b>Religion</b></td>
					<td>Islam</td>
				</tr>

				<tr>
					<td><b>Gender</b></td>
					<td>Male</td>
				</tr>
			</table>
		</p:dialog>

		<!-- 				<td class="tdContent"><p:inputText -->
		<!-- 						value="#{complaintBackingBean.managedBean.smComplainant.phoneNo}" -->
		<!-- 						size="40" /></td> -->

		<!-- 						value="#{complaintBackingBean.managedBean.smComplainant.email}" -->
		<!-- 						size="40" /></td> -->
		<!-- 			</tr> -->

	</p:panel>
</ui:composition>
