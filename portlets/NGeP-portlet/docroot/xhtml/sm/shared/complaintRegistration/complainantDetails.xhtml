<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Complainant Details"
		toggleTitle="( Details in this section auto - populated for users with login / for general public will have to fill manually)"
		toggleable="true">
		<br />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="Name*" /></td>
				<td><p:inputText /></td>
				<td><p:outputLabel value="Address 1*" /></td>
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Race*" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="Melayu" itemValue="1" />
						<f:selectItem itemLabel="Cina" itemValue="2" />
						<f:selectItem itemLabel="Lain-lain" itemValue="3" />
					</p:selectOneMenu></td>
				<td></td>
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Nationality*" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="Malaysia" itemValue="1" />
						<f:selectItem itemLabel="China" itemValue="2" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="Country*" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="Malaysia" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Old IC/Passport No.*" /></td>
				<td><p:inputText /></td>
				<td><p:outputLabel value="Postcode*" /></td>
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="New IC/Passport No.*" /></td>
				<td><p:inputText /></td>
				<td><p:outputLabel value="State*" /></td>
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Email*" /></td>
				<td><p:inputText /></td>
				<td><p:outputLabel value="District*" /></td>
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Telephone* " /></td>
				<td><p:inputText /></td>
				<td><p:outputLabel value="City*" /></td>
				<td><p:inputText /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
