<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Complainant Details" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="* Name" /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplainant.name}"
						size="40" /></td>
				<td class="tdTitle"><p:outputLabel value="* Nationality" /></td>
				<td class="tdContent"><p:selectOneMenu
						value="#{complaintBackingBean.managedBean.smComplainant.nationalityId}">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItem itemLabel="Malaysian" itemValue="1" />
						<f:selectItem itemLabel="Non Malaysian" itemValue="0" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* Identification Type" /></td>
				<td class="tdContent"><p:selectOneMenu
						value="#{complaintBackingBean.managedBean.smComplainant.identificationTypeId}">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItem itemLabel="I/C" itemValue="I" />
						<f:selectItem itemLabel="Passport" itemValue="P" />
					</p:selectOneMenu></td>
				<td class="tdTitle"><p:outputLabel value="* Identification No." /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplainant.identificationNo}" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* Country" /></td>
				<td class="tdContent"><p:selectOneMenu id="countryId"
						value="#{complaintBackingBean.managedBean.smComplainant.pmCountry.countryId}">
						<f:selectItems var="counLs"
							value="#{complaintBackingBean.managedBean.countryLs}"
							itemLabel="#{counLs.countryName}" itemValue="#{counLs.countryId}" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* Address" /></td>
				<td class="tdContent"><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplainant.address1}" /></td>
			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplainant.address2}" /></td>
			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplainant.address3}" /></td>
			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent"><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplainant.address4}" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* Postcode" /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplainant.postcode}"
						size="40" /></td>
				<td class="tdTitle"><p:outputLabel value="* State" /></td>
				<td class="tdContent"><p:selectOneMenu id="stateId"
						value="#{complaintBackingBean.managedBean.smComplainant.pmState.stateId}">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="state"
							value="#{complaintBackingBean.managedBean.stateLs}"
							itemLabel="#{state.stateName}" itemValue="#{state.stateId}" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* District" /></td>
				<td class="tdContent"><p:selectOneMenu id="districtId">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
					</p:selectOneMenu></td>

				<td class="tdTitle"><p:outputLabel value="* City" /></td>
				<td class="tdContent"><p:selectOneMenu id="cityId"
						value="#{complaintBackingBean.managedBean.smComplainant.pmCity.cityId}">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="city"
							value="#{complaintBackingBean.managedBean.cityLs}"
							itemLabel="#{city.cityName}" itemValue="#{city.cityId}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="* Telephone" /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplainant.phoneNo}"
						size="40" /></td>

				<td class="tdTitle"><p:outputLabel value="* Email" /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplainant.email}"
						size="40" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
