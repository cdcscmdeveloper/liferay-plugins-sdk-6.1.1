<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Complainant Details" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* Name" /></td>
				<td><p:inputText value="#{complaintBackingBean.managedBean.smComplaint.smComplainant.name}"/></td>

				<td><p:outputLabel value="* Nationality" /></td>
				<td><p:selectOneMenu value="#{complaintBackingBean.managedBean.smComplaint.smComplainant.nationalityId}">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItem itemLabel="Malaysian" itemValue="1" />
						<f:selectItem itemLabel="Non Malaysian" itemValue="0" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><p:outputLabel value="* Identification Type" /></td>
				<td><p:selectOneMenu
						value="#{complaintBackingBean.managedBean.smComplaint.smComplainant.identificationTypeId}">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItem itemLabel="I/C" itemValue="I" />
						<f:selectItem itemLabel="Passport" itemValue="P" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="* Identification No." /></td>
				<td><p:inputText
						value="#{complaintBackingBean.managedBean.smComplaint.smComplainant.identificationNo}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="* Country" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItem itemLabel="Malaysia" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><p:outputLabel value="* Address" /></td>
				<td><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplaint.smComplainant.address1}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplaint.smComplainant.address2}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplaint.smComplainant.address3}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText size="50" colspan="3"
						value="#{complaintBackingBean.managedBean.smComplaint.smComplainant.address4}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="* Postcode" /></td>
				<td><p:inputText
						value="#{complaintBackingBean.managedBean.smComplaint.smComplainant.postcode}" /></td>
				<td><p:outputLabel value="* State" /></td>
				<!-- <td><p:inputText value="#{complaintBackingBean.managedBean.pmState.stateId}" /></td> -->
				<td><p:inputText /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="* District" /></td>
				<td><p:inputText /></td>

				<td><p:outputLabel value="* City" /></td>
				<!-- <td><p:inputText  value="#{complaintBackingBean.managedBean.pmCity.cityId}" /></td>-->
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Telephone" /></td>
				<td><p:inputText
						value="#{complaintBackingBean.managedBean.smComplaint.smComplainant.phoneNo}" /></td>

				<td><p:outputLabel value="* Email" /></td>
				<td><p:inputText
						value="#{complaintBackingBean.managedBean.smComplaint.smComplainant.email}" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
