<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
<!-- 	<p:panel header="Investigation Report" toggleable="true"> -->
	
<!-- 	</p:panel> -->
	<p:panel header="#{lbl['lbl.sm.complaint.tracking']}" toggleable="true">
	      <p:dataTable var="table" value="#{mofRegistrationBackingBean.dataList}">
			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">  
                   #{table.no}  
      		    </p:column>
			<p:column headerText="#{lbl['lbl.sm.complaint.action.performed']}">
				#{table.actionPerformed} 
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.complaint.date.action.performed']}">
				#{table.dateActionPerformed} 
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.complaint.remarks.any']}">
				<p:outputLabel />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
