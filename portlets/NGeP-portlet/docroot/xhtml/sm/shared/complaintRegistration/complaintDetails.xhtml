<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.complaint.details']}" toggleable="true" id="complDtl">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.complaint.against.supplier']} * " /></td>
				<td class="tdContent"><ac:lov id="supplier" lovId="SM_SUPPLIER"
						headerText="#{lbl['lbl.sm.supplov']}"
						saveObject="complaintBackingBean.managedBean.smComplaint.smSupplier"
						value="#{complaintBackingBean.managedBean.smComplaint.smSupplier.companyName}"
						conditionField="recordStatus^1">
					</ac:lov></td>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.businessregno']}" /></td>
				<td class="tdContent"><p:inputText  readonly="true" /></td>
				<td>&#160;</td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.mofno']}" /></td>
				<td class="tdContent"><p:inputText readonly="true" /></td>
				
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.epno']}" /></td>
				<td class="tdContent"><p:inputText  readonly="true" /></td>
			</tr>

			<c:if
				test="#{!complaintBackingBean.managedBean.smComplaint.brandNew}">
				<tr>
					<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.complaint.type']} * " /></td>
					<td class="tdContent" colspan="3"><p:selectManyCheckbox id="grid"
							layout="grid" columns="3">
							<f:selectItems
								value="#{complaintBackingBean.managedBean.complType.entrySet()}"
								var="ctype" itemVlue="#{ctype.key}" itemLabel="#{ctype.value}" />
						</p:selectManyCheckbox></td>
				</tr>
			</c:if>

			<tr>
				<td class="tdTitle" valign="top"><p:outputLabel
						value="#{lbl['lbl.sm.complaint.details']} * " /></td>
				<td class="tdContent" colspan="3"><p:inputTextarea
						value="#{complaintBackingBean.managedBean.smComplaint.complaintDesc}"
						rows="8" cols="100" /></td>
			</tr>

			<tr>
				<c:choose>
					<c:when
						test="#{complaintBackingBean.managedBean.smComplaint.brandNew}">
						<td class="tdTitle"><p:outputLabel
								value="#{lbl['lbl.sm.complaint.upload.docproof']}" /></td>
						<td class="tdContent" colspan="3"><p:fileUpload mode="simple" /></td>
					</c:when>

					<c:otherwise>
						<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.complaint.document']}" /></td>
						<td class="tdContent" colspan="3"><p:commandLink>sampleUploadedDoc
							</p:commandLink></td>
					</c:otherwise>
				</c:choose>

				<!-- 				<td class="tdTitle"></td> -->
				<!-- 				<td class="tdContent"></td> -->
			</tr>
		</table>
	</p:panel>

</ui:composition>
