<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Complaint Details" toggleable="true" id="complDtl">
		<table class="customTbl">
			<tr>
				<td><p:outputLabel value="Complaint Against Supplier* " /></td>
				<td><ac:lov id="supplier" lovId="SM_SUPPLIER"
						headerText="Supplier Lov"
						saveObject="complaintBackingBean.managedBean.smComplaint.smSupplier"
						value="#{complaintBackingBean.managedBean.smComplaint.smSupplier.companyName}"
						conditionField="recordStatus^1">
					</ac:lov></td>
			</tr>

			<c:if
				test="#{!complaintBackingBean.managedBean.smComplaint.brandNew}">
				<tr>
					<td><p:outputLabel value="Complaint Type* " /></td>
					<td><p:selectManyCheckbox id="grid" layout="grid" columns="2">
							<f:selectItems
								value="#{complaintBackingBean.managedBean.complType.entrySet()}"
								var="ctype" itemVlue="#{ctype.key}" itemLabel="#{ctype.value}" />
						</p:selectManyCheckbox></td>
				</tr>
			</c:if>

			<tr>
				<td valign="top"><p:outputLabel value="Complaint Details* " /></td>
				<td colspan="3"><p:inputTextarea
						value="#{complaintBackingBean.managedBean.smComplaint.complaintDesc}"
						rows="8" cols="100" /></td>
			</tr>

			<tr>
				<c:choose>
					<c:when
						test="#{complaintBackingBean.managedBean.smComplaint.brandNew}">
						<td><p:outputLabel
								value="Upload Complaint / Proof Doc (If Any) " /></td>
						<td colspan="3"><p:fileUpload mode="simple" /></td>
					</c:when>

					<c:otherwise>
						<td><p:outputLabel
								value="Document" /></td>
						<td colspan="3"><p:commandLink>sampleUploadedDoc
							</p:commandLink></td>
					</c:otherwise>
				</c:choose>
				
<!-- 				<td class="tdTitle"></td> -->
<!-- 				<td class="tdContent"></td> -->
			</tr>
		</table>
	</p:panel>

</ui:composition>
