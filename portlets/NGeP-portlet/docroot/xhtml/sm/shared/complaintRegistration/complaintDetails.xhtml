<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Complaint Details" toggleable="true">
		<div align="center">
			<p:panelGrid columns="2">
				<f:facet name="header">Suppliers Search Block</f:facet>
				<p:outputLabel value="Supplier Name :" />
				<p:inputText
					value="#{complaintBackingBean.managedBean.searchSupName}" />
				<p:outputLabel value="Supplier NO. : " />
				<p:inputText
					value="#{complaintBackingBean.managedBean.searchSupRegNo}" />

				<h:outputLabel />
				<p:commandButton value="Search" />
			</p:panelGrid>
		</div>
		<br />

		<p:dataTable var="compBean" id="dt"
			value="#{complaintBackingBean.managedBean.suppliersList}"
			selection="#{complaintBackingBean.managedBean.selectedSupplier}"
			rowKey="#{compBean.supplierId}" rowIndexVar="index">

			<p:column selectionMode="single" width="5%" />
			<p:column headerText="NO.">
				<h:outputText value="#{index+1}" />
			</p:column>

			<p:column headerText="Supplier Name">
				<h:outputText value="#{compBean.supplierName}" />
			</p:column>
			<p:column headerText="Supplier No.">
				<h:outputText value="#{compBean.regNo}" />
			</p:column>
		</p:dataTable>


		<p:commandButton value="Add/Select Supplier" style="float:right;"
			actionListener="#{complaintBackingBean.onSupplierSelection}"
			update=":form:tt:compSupName"></p:commandButton>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="Complaint Against Supplier* " /></td>
				<td><p:inputText id="compSupName" readonly="true"
						value="#{complaintBackingBean.managedBean.selectedSupplier.supplierName}"
						size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Complaint Type* " /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="Type1" itemValue="1" />
						<f:selectItem itemLabel="Type2" itemValue="2" />
						<f:selectItem itemLabel="Type3" itemValue="3" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Complaint Details* " /></td>
				<td><p:inputTextarea rows="4" cols="33" /></td>
			</tr>
			<tr style="text-align: center;">
				<td><p:outputLabel
						value="Upload Complaint / Proof Doc (If Any) " /></td>
				<td><p:fileUpload mode="simple" /></td>
			</tr>
		</table>
		<br />
		<div align="center">
			<p:commandButton value="Lodge Complaint" />
			<p:commandButton value="Cancel" />
		</div>
	</p:panel>
</ui:composition>
