<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	
	<p:panel header="#{lbl['lbl.sm.complaint.pnl.company.details']}" toggleable="true" id="complCompDtl">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.complaint.against.supplier']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td class="tdContent"><ac:lov id="supplier" lovId="SM_SUPPLIER" 
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.complaint.against.supplier']}"
						headerText="#{lbl['lbl.sm.supplov']}" readonly="#{complDtlViewFLag}"
						saveObject="complaintBackingBean.managedBean.smComplaint.smSupplier"
						value="#{complaintBackingBean.managedBean.smComplaint.smSupplier.companyName}"
						conditionField="recordStatus^1" update=":#{p:component('complCompDtl')}">
					</ac:lov>
					<p:message id="businessRegNoMsg" for="businessRegNo" display="icon" />
				</td>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.businessregno']}" /></td>
				<td class="tdContent"><p:inputText  readonly="true" id="businessRegNo" value="#{complaintBackingBean.managedBean.smComplaint.smSupplier.regNo}" /></td>
				<td>&#160;</td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.mofno']}" /></td>
				<td class="tdContent"><p:inputText readonly="true" 
				value="#{complaintBackingBean.retrieveMOFAccountInfo(complaintBackingBean.managedBean.smComplaint.smSupplier.supplierId)}"/></td>
				
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.epno']}" /></td>
				<td class="tdContent"><p:inputText  readonly="true" value="#{complaintBackingBean.managedBean.smComplaint.smSupplier.epNo}" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.complaint.details']}" toggleable="true" id="complDtl">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.complaint.instruction.before']}" escape="false"/>
		<table class="customTbl">
			<c:if
				test="#{!complaintBackingBean.managedBean.smComplaint.brandNew}">
				<tr>
					<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.complaint.type']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td class="tdContent" colspan="3">
						<p:selectManyCheckbox id="offense" value="#{complaintBackingBean.managedBean.selectedOffenses}" 
						disabled="#{complaintBackingBean.managedBean.smComplaint.pmStatus != null and 
						complaintBackingBean.managedBean.smComplaint.pmStatus.statusId != DisciplinaryActionConst.newComplaint}" 
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.complaint.type']}">
							<f:selectItems value="#{complaintBackingBean.getRadioButtonValues(ParameterTypeConst.complaintType)}" />
						</p:selectManyCheckbox>
						<p:message id="offenseMsg" for="offense" display="icon" />
					</td>
				</tr>
			</c:if>

			<tr>
				<td width="5%"></td>
				<td class="tdContent" colspan="3"><p:inputTextarea required="#{!empty param['disableValidation']}" 
						label="#{lbl['lbl.sm.complaint.details']}" autoResize="false" maxlength="2500" 
						value="#{complaintBackingBean.managedBean.smComplaint.complaintDesc}"
						readonly="#{complDtlViewFLag}" id="complDetails"
						rows="10" cols="100">
							<f:validateLength maximum="2500" />
						</p:inputTextarea>
					<p:message id="complDetailsMsg" for="complDetails" display="icon" />		
				</td>
			</tr>
		</table>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.complaint.instruction.after']}" escape="false"/>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.complaint.upload.docproof']}" id="pnlComplDoc" toggleable="true">
		<p:dataTable value="#{complaintBackingBean.managedBean.complaintDocs}" var="complDoc">
			<p:column headerText="#{lbl['lbl.sm.complainant.document.name']}">
				
				<p:commandLink value="#{complDoc.fileName}" update=":form" ajax="false">
					<p:fileDownload value="#{complaintBackingBean.commonDownload(complDoc.filePath, complDoc.fileName, complDoc.fileName)}" />
				</p:commandLink>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.action']}">
				<p:commandLink oncomplete="attachmentDeleteDlg.show()" action="#{complaintBackingBean.showDeleteDialog(complDoc)}" 
						update="@([id$=attachmentDeleteDlg])" rendered="#{complaintBackingBean.managedBean.smComplaint.brandNew}">
							<p:graphicImage value="/css/images/design/delete.png" title="#{lbl['lbl.btn.delete']}" />
						</p:commandLink>
						
				<p:commandLink action="#{complaintBackingBean.attachmentDownload(complDoc)}" ajax="false"
						 rendered="#{!complaintBackingBean.managedBean.smComplaint.brandNew}">
							<p:graphicImage value="/css/images/design/download.png" title="#{lbl['lbl.btn.download']}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.upload']}" onclick="uploadDlg.show();" rendered="#{complaintBackingBean.managedBean.smComplaint.brandNew}" />
		</div>
	</p:panel>
	
	<p:dialog id="uploadDlg" widgetVar="uploadDlg" appendToBody="false" resizable="false" width="700px"
		height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:fileUpload style="display:inline;" multiple="true" fileUploadListener="#{complaintBackingBean.docUpload}"
			mode="basic" id="upload" sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" 
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" update="pnlComplDoc" 
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			oncomplete="uploadDlg.hide();return false;"
			uploadLabel="#{lbl['lbl.btn.upload']}" 
	       label="#{lbl['lbl.btn.choose']}" 
	       cancelLabel="#{lbl['lbl.btn.cancel']}">
		</p:fileUpload>
	</p:dialog>
	
	<p:dialog widgetVar="attachmentDeleteDlg" id="attachmentDeleteDlg" modal="true" height="100" width="500">
   			#{complaintBackingBean.managedBean.attachmentDeleteMsg}
   			<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" oncomplete="attachmentDeleteDlg.hide()"
				action="#{complaintBackingBean.removeAttachment}" update="@([id$=pnlComplDoc])"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="attachmentDeleteDlg.hide();"></p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
