<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Supplier Search" toggleable="true">
		<table class="customTbl">
			<tr>
				<td><p:outputLabel value="* Search By" /></td>
				<td><p:selectOneMenu>
						<f:selectItem itemLabel= "MOF No." itemValue="1"></f:selectItem>
						<f:selectItem itemLabel= "eP No." itemValue="2"></f:selectItem>
						<f:selectItem itemLabel= "Company Registration No." itemValue="3"></f:selectItem>
						<f:selectItem itemLabel= "Company Name" itemValue="4"></f:selectItem>
					</p:selectOneMenu></td>

				<td><p:outputLabel value="* Value" /></td>
				<td><p:inputText /></td>
			</tr>
		</table>

		<div align="right">
			<p:commandButton value="Search"
				action="#{complaintBackingBean.searchSupplier}"
				update="suppSearchRes" />
		</div>
	</p:panel>

	<p:panel header="Search Result" toggleable="true" id="suppSearchRes">
		<p:dataTable var="supp"
			value="#{complaintBackingBean.managedBean.smSupplierLs}"
			selection="#{complaintBackingBean.managedBean.selectedSupplier}"
			rowKey="#{supp.supplierId}" selectionMode="single">
			<p:ajax event="rowSelect"
				listener="#{complaintBackingBean.onSupplierRowSelect}"
				update=":form:complDtl" />
			<p:column headerText="Supplier Name">
				#{supp.supplierName}
			</p:column>
			<p:column headerText="EP No.">
				#{supp.epNo}
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:panel header="Complaint Details" toggleable="true" id="complDtl">
		<table class="customTbl">
			<tr>
				<td><p:outputLabel value="Complaint Against Supplier* " /></td>
				<td><p:inputText readonly="true"
						value="#{complaintBackingBean.managedBean.smComplaint.smSupplier.supplierName}"
						size="50" /></td>

				<td><p:outputLabel value="Complaint Type* " /></td>
				<td><p:selectOneMenu
						value="#{complaintBackingBean.managedBean.smComplaint.complaintCategory}">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="Breach the obligation of registration" itemValue="R" />
						<f:selectItem itemLabel="Breach the obligation of Tender/ Contract" itemValue="T" />
						<f:selectItem itemLabel="Criminal or Civil Offenses" itemValue="O" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Complaint Details* " /></td>
				<td colspan="3"><p:inputTextarea
						value="#{complaintBackingBean.managedBean.smComplaint.complaintDesc}"
						rows="8" cols="100" /></td>
			</tr>

			<tr>
				<td><br /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="Upload Complaint / Proof Doc (If Any) " /></td>
				<td><p:fileUpload mode="simple" /></td>
			</tr>
		</table>
	</p:panel>

	<div align="right">
		<p:commandButton value="Submit"
			action="#{complaintBackingBean.lodgeComplaint}"></p:commandButton>
	</div>


</ui:composition>
