<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.complaint.show.cause.letter.response']}" toggleable="true" id="pnlLetterResp">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.complaint.response.received']}" />
				<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td class="tdContent">
					<p:calendar showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" 
					maxdate="#{CommonConstants.CURRENT_DATE}" readonlyInput="true" 
					mindate="#{complaintBackingBean.managedBean.smComplReview.changedDate}" 
					label="#{lbl['lbl.sm.complaint.response.received']}" required="#{!empty param['disableValidation']}"
					value="#{complaintBackingBean.managedBean.smComplReview.smComplaintResponse.supplierResponseDate}" 
					disabled="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId != DisciplinaryActionConst.waitingSuppScResp}" />
				</td>
				<td class="tdTitle"></td>
				<td class="tdContent"></td>
			</tr>
		</table>

		<p:dataTable value="#{complaintBackingBean.managedBean.showCauseResponseDocs}" 
		var="scResp" id="dtlSCResponse">
			<p:column headerText="Document Name">
				#{scResp.fileName}
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.action']}">
				<p:commandLink oncomplete="scRespDeleteDlg.show()" action="#{complaintBackingBean.showDeleteDialog(scResp)}" 
						update="@([id$=scRespDeleteDlg])" 
						rendered="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.waitingSuppScResp}">
							<p:graphicImage value="/css/images/design/delete.png" title="#{lbl['lbl.btn.delete']}" />
						</p:commandLink>
						
				<p:commandLink action="#{complaintBackingBean.attachmentDownload(scResp)}" ajax="false"
						update="@([id$=scRespDeleteDlg])" 
						rendered="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId != DisciplinaryActionConst.waitingSuppScResp}">
							<p:graphicImage value="/css/images/design/download.png" title="#{lbl['lbl.btn.download']}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.upload']}" onclick="scRespDlg.show();" 
			rendered="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.waitingSuppScResp}" />
		</div>
	</p:panel>
	
	<p:dialog id="scRespDlg" widgetVar="scRespDlg" appendToBody="false" resizable="false" width="700px"
		height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:fileUpload style="display:inline;" multiple="true" fileUploadListener="#{complaintBackingBean.docUpload}"
			mode="basic" id="scRespUpload" sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" 
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" update="pnlLetterResp" 
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			oncomplete="scRespDlg.hide();return false;">
		</p:fileUpload>
	</p:dialog>
	
	<p:dialog widgetVar="scRespDeleteDlg" id="scRespDeleteDlg" modal="true" height="100" width="500">
   			#{complaintBackingBean.managedBean.attachmentDeleteMsg}
   			<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" oncomplete="scRespDeleteDlg.hide()"
				action="#{complaintBackingBean.removeAttachment}" update="@([id$=pnlLetterResp])"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="scRespDeleteDlg.hide();"></p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
