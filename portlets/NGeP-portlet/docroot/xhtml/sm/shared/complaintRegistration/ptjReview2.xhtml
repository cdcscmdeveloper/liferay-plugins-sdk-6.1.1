<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:param name="lblPTJDecision" 
	value="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.reviewByPtpk ? 
	'lbl.sm.complaint.first.ptk.decision' : 'lbl.sm.complaint.second.ptk.decision'}" />
	
	<p:panel header="#{lbl[lblPTJDecision]}" toggleable="true" id="pnlSecondDecision">
		<table style="width: 100%">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.complaint.actual.meeting.date']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td class="tdContent"><p:calendar showOn="button" id="secondMeetingDt2" required="#{!empty param['disableValidation']}"
						mindate="#{complaintBackingBean.managedBean.smComplaint.changedDate}" label="#{lbl['lbl.sm.complaint.actual.meeting.date']}"
						maxdate="#{CommonConstants.CURRENT_DATE}" disabled="#{secondPtpkViewFLag}"
						value="#{complaintBackingBean.managedBean.secondReview.actualConveneDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.complaint.minute.ref.no']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td class="tdContent"><p:inputText required="#{!empty param['disableValidation']}" disabled="#{secondPtpkViewFLag}"
						label="#{lbl['lbl.sm.complaint.minute.ref.no']}"
						value="#{complaintBackingBean.managedBean.secondReview.minutesRefNo}" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.remarks']}" />
				<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td class="tdContent" colspan="3"><p:inputTextarea disabled="#{secondPtpkViewFLag}" label="#{lbl['lbl.sm.remarks']}"
						value="#{complaintBackingBean.managedBean.secondReview.decisionRemark}"
						rows="8" cols="100" maxlength="200" required="#{!empty param['disableValidation']}"/></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.decision']}" />
				<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td class="tdContent"><p:selectOneMenu required="#{!empty param['disableValidation']}" disabled="#{secondPtpkViewFLag}"
						value="#{complaintBackingBean.managedBean.secondReview.decisionTaken}" label="#{lbl['lbl.sm.decision']}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.decision.valid']}" itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.decision.invalid']}" itemValue="0" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.complaint.decision.report']}" id="pnlSecondDecisionReportDoc">
		<p:dataTable value="#{complaintBackingBean.managedBean.secondPtpkDecisionDocs}" var="secondPtpkDecisionDocs">
			<p:column headerText="#{lbl['lbl.sm.complainant.document.name']}">
				#{secondPtpkDecisionDocs.fileName}
			</p:column>
			
			<p:column headerText="Action">
				<p:commandLink oncomplete="secondPtpkDocDeleteDlg.show()" action="#{complaintBackingBean.showDeleteDialog(secondPtpkDecisionDocs)}" 
						update="@([id$=secondPtpkDocDeleteDlg2])" rendered="#{complaintBackingBean.managedBean.secondReview.brandNew}">
							<p:graphicImage value="/css/images/design/delete.png" title="#{lbl['lbl.btn.delete']}" />
						</p:commandLink>
						
				<p:commandLink action="#{complaintBackingBean.attachmentDownload(secondPtpkDecisionDocs)}" ajax="false"
						 rendered="#{!complaintBackingBean.managedBean.secondReview.brandNew}">
							<p:graphicImage value="/css/images/design/download.png" title="#{lbl['lbl.btn.download']}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.upload']}" onclick="secondPtpkDlg.show();" rendered="#{complaintBackingBean.managedBean.secondReview.brandNew}" />
		</div>
	</p:panel>
	
	<p:dialog id="secondPtpkDlg" widgetVar="secondPtpkDlg" appendToBody="false" resizable="false" width="700px"
		height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:fileUpload style="display:inline;" multiple="true" fileUploadListener="#{complaintBackingBean.docUpload}"
			mode="basic" id="secondPtpkUpload" sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" 
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" update="pnlSecondDecisionReportDoc" 
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			oncomplete="secondPtpkDlg.hide();return false;">
		</p:fileUpload>
	</p:dialog>
	
	<p:dialog widgetVar="secondPtpkDocDeleteDlg" id="secondPtpkDocDeleteDlg" modal="true" height="100" width="500">
   			#{complaintBackingBean.managedBean.attachmentDeleteMsg}
   			<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" oncomplete="secondPtpkDocDeleteDlg.hide()"
				action="#{complaintBackingBean.removeAttachment}" update="@([id$=pnlSecondDecisionReportDoc])"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="secondPtpkDocDeleteDlg.hide();"></p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
