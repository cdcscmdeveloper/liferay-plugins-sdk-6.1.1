<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.contactinfo']}" toggleable="true"
		id="pnlContactInfo">
		<table class="customTbl">
			<c:if test="#{complaintBackingBean.managedBean.smComplaint.brandNew}">
				<tr>
					<td class="tdTitle">&#160;</td>
					<td class="tdContent"><p:selectBooleanCheckbox id="chkAddMode" value="#{complaintBackingBean.managedBean.sameAddress}">
							<p:ajax event="change" update="pnlContactInfo" />
						</p:selectBooleanCheckbox> <h:outputText value="#{lbl['lbl.sm.sameasabove']}"></h:outputText></td>
					<!-- 					Same as Permenant Address -->
				</tr>
			</c:if>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.country']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="contCountry" style="width: 100px !important;">
						<f:selectItems var="counLs"
							value="#{complaintBackingBean.managedBean.countryLs}"
							itemLabel="#{counLs.countryName}" itemValue="#{counLs.countryId}" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.correspondenceadd']}" /></td>
				<td class="tdContent" colspan="2"><p:inputText size="40"
						id="conAddress1" /></td>
			</tr>

			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent" colspan="2"><p:inputText size="40"
						id="conAddress2" /></td>
			</tr>

			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent" colspan="2"><p:inputText size="40"
						id="conAddress3" /></td>
			</tr>

			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent" colspan="2"><p:inputText size="40"
						id="conAddress4" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.postcode']}" /></td>
				<td class="tdContent"><p:inputText size="40" id="conPostCode" /></td>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.state']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbResState">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems />
						<p:ajax event="change" update="cmbResDistrict" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.district']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbResDistrict">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems />
					</p:selectOneMenu></td>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.towncity']}" /></td>
				<td class="tdContent"><p:selectOneMenu id="cmbResCity">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td class="tdContent"><p:inputText size="40" /></td>

				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
				<td class="tdContent"><p:inputText size="40" id="txtFaxNo" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.mobilenumber']}" /></td>
				<td class="tdContent"><p:inputText size="40" value="#{complaintBackingBean.managedBean.smComplainant.phoneNo}"/></td>
			</tr>
<!-- 			<tr> -->
<!-- 				<td class="tdTitle"><p:outputLabel value="* Telephone" /></td> -->
<!-- 				<td class="tdContent"><p:inputText -->
<!-- 						value="#{complaintBackingBean.managedBean.smComplainant.phoneNo}" -->
<!-- 						size="40" /></td> -->

<!-- 				<td class="tdTitle"><p:outputLabel value="* Email" /></td> -->
<!-- 				<td class="tdContent"><p:inputText -->
<!-- 						value="#{complaintBackingBean.managedBean.smComplainant.email}" -->
<!-- 						size="40" /></td> -->
<!-- 			</tr> -->
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.email']}" /></td>
				<td class="tdContent"><p:inputText size="40" id="usrEmail" value="#{complaintBackingBean.managedBean.smComplainant.email}" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.confirmemail']}" /></td>
				<td class="tdContent"><p:inputText size="40" id="conEmail" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
