<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.complaint.first.ptk.decision']}" toggleable="true" id="pnlPtpkDecision">
		<table style="width: 100%">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.complaint.actual.meeting.date']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td class="tdContent"><p:calendar showOn="button" id="secondMeetingDt" required="#{!empty param['disableValidation']}"
						mindate="#{complaintBackingBean.managedBean.smComplaint.createdDate}" label="#{lbl['lbl.sm.complaint.actual.meeting.date']}"
						maxdate="#{CommonConstants.CURRENT_DATE}" disabled="#{ptpkViewFLag}"
						value="#{complaintBackingBean.managedBean.smComplReview.actualConveneDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.complaint.minute.ref.no']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td class="tdContent"><p:inputText required="#{!empty param['disableValidation']}" disabled="#{ptpkViewFLag}"
						label="#{lbl['lbl.sm.complaint.minute.ref.no']}"
						value="#{complaintBackingBean.managedBean.smComplReview.minutesRefNo}" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.remarks']}" />
				<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td class="tdContent" colspan="3"><p:inputTextarea disabled="#{ptpkViewFLag}" label="#{lbl['lbl.sm.remarks']}"
						value="#{complaintBackingBean.managedBean.smComplReview.decisionRemark}"
						rows="8" cols="100" maxlength="200" required="#{!empty param['disableValidation']}"/></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.decision']}" />
				<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td class="tdContent"><p:selectOneMenu required="#{!empty param['disableValidation']}" disabled="#{ptpkViewFLag}"
						value="#{complaintBackingBean.managedBean.smComplReview.decisionTaken}" label="#{lbl['lbl.sm.decision']}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.decision.valid']}" itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.decision.invalid']}" itemValue="0" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.complaint.decision.report']}" id="pnlDecisionReportDoc">
		<p:dataTable value="#{complaintBackingBean.managedBean.ptpkDecisionDocs}" var="ptpkDecisionDoc">
			<p:column headerText="#{lbl['lbl.sm.complainant.document.name']}">
				#{ptpkDecisionDoc.fileName}
			</p:column>
			
			<p:column headerText="Action">
				<p:commandLink oncomplete="ptpkDocDeleteDlg.show()" action="#{complaintBackingBean.showDeleteDialog(ptpkDecisionDoc)}" 
						update="@([id$=ptpkDocDeleteDlg])" rendered="#{complaintBackingBean.managedBean.smComplReview.brandNew}">
							<p:graphicImage value="/css/images/design/delete.png" title="#{lbl['lbl.btn.delete']}" />
						</p:commandLink>
						
				<p:commandLink action="#{complaintBackingBean.attachmentDownload(ptpkDecisionDoc)}" ajax="false"
						 rendered="#{!complaintBackingBean.managedBean.smComplReview.brandNew}">
							<p:graphicImage value="/css/images/design/download.png" title="#{lbl['lbl.btn.download']}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.upload']}" onclick="ptpkDlg.show();" rendered="#{complaintBackingBean.managedBean.smComplReview.brandNew}" />
		</div>
	</p:panel>
	
	<p:dialog id="ptpkDlg" widgetVar="ptpkDlg" appendToBody="false" resizable="false" width="700px"
		height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:fileUpload style="display:inline;" multiple="true" fileUploadListener="#{complaintBackingBean.docUpload}"
			mode="basic" id="ptpkUpload" sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" 
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" update="pnlDecisionReportDoc" 
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			oncomplete="ptpkDlg.hide();return false;"
			uploadLabel="#{lbl['lbl.btn.upload']}" 
	       label="#{lbl['lbl.btn.choose']}" 
	       cancelLabel="#{lbl['lbl.btn.cancel']}">
		</p:fileUpload>
	</p:dialog>
	
	<p:dialog widgetVar="ptpkDocDeleteDlg" id="ptpkDocDeleteDlg" modal="true" height="100" width="500">
   			#{complaintBackingBean.managedBean.attachmentDeleteMsg}
   			<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" oncomplete="ptpkDocDeleteDlg.hide()"
				action="#{complaintBackingBean.removeAttachment}" update="@([id$=pnlDecisionReportDoc])"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="ptpkDocDeleteDlg.hide();"></p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
