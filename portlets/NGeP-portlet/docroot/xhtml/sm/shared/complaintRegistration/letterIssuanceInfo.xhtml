<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.complaint.show.cause.letter']}" toggleable="true" id="pnlShowCauseLetter">
		<p:dataTable value="#{complaintBackingBean.managedBean.showCauseLetters}" var="scLetter">
			<p:column headerText="Document Name">
				#{scLetter.fileName}
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.action']}">
				<p:commandLink oncomplete="scLetterDeleteDlg.show()" action="#{complaintBackingBean.showDeleteDialog(scLetter)}" 
						update="@([id$=scLetterDeleteDlg])" 
						rendered="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.prepareScLetter}">
							<p:graphicImage value="/css/images/design/delete.png" title="#{lbl['lbl.btn.delete']}" />
						</p:commandLink>
						
				<p:commandLink action="#{complaintBackingBean.attachmentDownload(scLetter)}" ajax="false"
						update="@([id$=scLetterDeleteDlg])" 
						rendered="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId != DisciplinaryActionConst.prepareScLetter}">
							<p:graphicImage value="/css/images/design/download.png" title="#{lbl['lbl.btn.download']}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.upload']}" onclick="scLetterDlg.show();" 
			rendered="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.prepareScLetter}" 
			disabled="#{not empty complaintBackingBean.managedBean.showCauseLetters}"/>
		</div>
		
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.complaint.date.issuance']}" />
				<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td class="tdContent">
				<p:calendar showOn="button" required="#{!empty param['disableValidation']}"
						readonlyInput="true" disabled="#{scLetterViewFlag}" label="#{lbl['lbl.sm.complaint.date.issuance']}"
						value="#{complaintBackingBean.managedBean.smComplReview.letterIssuedDate}"
						mindate="#{complaintBackingBean.managedBean.smComplReview.createdDate}"
						maxdate="#{CommonConstants.CURRENT_DATE}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</td>

				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.complaint.courier.trckng.no']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<p:inputText required="#{!empty param['disableValidation']}" maxlength="30"
					readonly="#{scLetterViewFlag}" label="#{lbl['lbl.sm.complaint.courier.trckng.no']}"
					value="#{complaintBackingBean.managedBean.smComplReview.trackingNo}" /></td>
			</tr>
			
			<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId gt DisciplinaryActionConst.prepareScLetter}">
				<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId ne DisciplinaryActionConst.prepareScLetter and 
				complaintBackingBean.managedBean.smComplaint.pmStatus.statusId ne DisciplinaryActionConst.prepareAcLetter}">
					<tr>
						<td class="tdTitle">
							<p:outputLabel value="#{lbl['lbl.sm.complaint.received.by.supp']}" />
							<p:outputLabel value="*" styleClass="mandatory" />
						</td>
						
						<td class="tdContent">
							<p:calendar showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" 
							mindate="#{complaintBackingBean.managedBean.smComplaint.changedDate}"
							maxdate="#{CommonConstants.CURRENT_DATE}" readonlyInput="true"
							disabled="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId ne DisciplinaryActionConst.updateScReceiveDate}"
							value="#{complaintBackingBean.managedBean.smComplReview.smComplaintResponse.supplierReceivedDate}" />
						</td>
					</tr>
				</c:if>
			</c:if>
		</table>
	</p:panel>
	
	<p:dialog id="scLetterDlg" widgetVar="scLetterDlg" appendToBody="false" resizable="false" width="700px"
		height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:fileUpload style="display:inline;" multiple="false" fileUploadListener="#{complaintBackingBean.docUpload}"
			mode="basic" id="scLetterUpload" sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" 
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" update="pnlShowCauseLetter" 
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			oncomplete="scLetterDlg.hide();return false;"
			uploadLabel="#{lbl['lbl.btn.upload']}" 
	       label="#{lbl['lbl.btn.choose']}" 
	       cancelLabel="#{lbl['lbl.btn.cancel']}">
		</p:fileUpload>
	</p:dialog>
	
	<p:dialog widgetVar="scLetterDeleteDlg" id="scLetterDeleteDlg" modal="true" height="100" width="500">
   			#{complaintBackingBean.managedBean.attachmentDeleteMsg}
   			<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" oncomplete="scLetterDeleteDlg.hide()"
				action="#{complaintBackingBean.removeAttachment}" update="@([id$=pnlShowCauseLetter])"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="scLetterDeleteDlg.hide();"></p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
