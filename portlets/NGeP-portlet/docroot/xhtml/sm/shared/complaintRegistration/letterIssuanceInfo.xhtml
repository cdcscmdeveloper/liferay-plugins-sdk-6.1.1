<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
	<p:panel header="Letter Info" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* Letter" /></td>
				<td class="tdContent"><p:fileUpload mode="simple" /></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.complaint.date.issuance']}" /></td>
				<td class="tdContent">
				<p:calendar showOn="button" 
						value="#{complaintBackingBean.managedBean.smComplReview.letterIssuedDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</td>

				<td class="tdTitle">
					<p:outputLabel value="* #{lbl['lbl.sm.complaint.courier.trckng.no']}" />
				</td>
				<td class="tdContent">
					<p:inputText value="#{complaintBackingBean.managedBean.smComplReview.trackingNo}" /></td>
			</tr>
			
			<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId gt DisciplinaryActionStatusConst.prepareSlLetter}">
				<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId ne DisciplinaryActionStatusConst.prepareSlLetter and 
				complaintBackingBean.managedBean.smComplaint.pmStatus.statusId ne DisciplinaryActionStatusConst.prepareAcLetter}">
					<tr>
						<td class="tdTitle">
							<p:outputLabel value="* #{lbl['lbl.sm.complaint.received.by.supp']}" />
						</td>
						
						<td class="tdContent">
							<p:calendar showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" 
							value="#{complaintBackingBean.managedBean.smComplReview.smComplaintResponse.supplierReceivedDate}" />
						</td>
					</tr>
				</c:if>
			</c:if>
		</table>
	</p:panel>
</ui:composition>
