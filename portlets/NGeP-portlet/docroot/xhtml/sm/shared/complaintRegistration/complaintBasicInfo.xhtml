<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.complaint.info']}" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.regno']}" /></td>
				<td class="tdContent"><p:inputText readonly="true"
						disabled="true"
						value="#{complaintBackingBean.managedBean.smComplaint.smSupplier.regNo}"
						id="regNoId" /></td>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.mofno']}" /></td>
				<td class="tdContent"><p:inputText readonly="true"
						disabled="true" id="complMofNo" /></td>

			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.suppname']}" /></td>
				<td class="tdContent"><p:inputText readonly="true"
						disabled="true"
						value="#{complaintBackingBean.managedBean.smComplaint.smSupplier.companyName}"
						id="companyNameId" /></td>
				<!-- 				<td class="tdTitle"><p:outputLabel value="Complaint Type" /></td> -->
				<!-- 				<td class="tdContent"><p:inputText readonly="true" -->
				<!-- 						disabled="true" value="Read Only" id="complTypeId" /></td> -->
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.complainant.name']}" /></td>
				<td class="tdContent"><p:inputText disabled="true" /></td>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.person.composition.idenNum']}" /></td>
				<td class="tdContent"><p:inputText disabled="true" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.complaint.type']}" /></td>
				<td class="tdContent" colspan="3"><p:selectManyCheckbox
						id="basicComplType" layout="grid" columns="2" readonly="true">
						<f:selectItems
							value="#{complaintBackingBean.managedBean.complType.entrySet()}"
							var="ctype" itemVlue="#{ctype.key}" itemLabel="#{ctype.value}" />
					</p:selectManyCheckbox></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.complaint.lodge.on']}" /></td>
				<td class="tdContent"><p:inputText readonly="true"
						disabled="true"
						value="#{complaintBackingBean.managedBean.smComplaint.createdDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</p:inputText></td>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.complaint.stagestatus']}" /></td>
				<td class="tdContent"><p:inputText readonly="true"
						disabled="true" value="#{lbl['lbl.sm.complaint.readonly']}" /></td>
			</tr>
			<tr>
				<td class="tdTitle" valign="top"><p:outputLabel
						value="#{lbl['lbl.sm.complaint.details']}" /></td>
				<td colspan="3" class="tdContent"><p:inputTextarea
						readonly="true" rows="8" cols="100" disabled="true"
						id="complDetailId"
						value="#{complaintBackingBean.managedBean.smComplaint.complaintDesc}" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
