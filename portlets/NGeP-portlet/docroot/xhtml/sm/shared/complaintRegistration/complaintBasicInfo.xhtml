<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<table style="width: 100%">
		<tr>
			<td id="tdTitle"><p:outputLabel value="Supplier Name" /></td>
			<td id="tdContent"><p:inputText readonly="true" disabled="true"
					value="#{complaintBackingBean.managedBean.smComplaint.smComplainant.name}" /></td>
			<td id="tdTitle"><p:outputLabel value="Complaint Type" /></td>
			<td id="tdContent"><p:inputText readonly="true" disabled="true"
					value="-- Read Only --" /></td>
		</tr>
		<tr>
			<td id="tdTitle"><p:outputLabel value="Lodged On" /></td>
			<td id="tdContent"><p:inputText readonly="true" disabled="true"
					value="#{complaintBackingBean.managedBean.smComplaint.createdDate}" /></td>
			<td id="tdTitle"><p:outputLabel value="Complaint Stage /Status" /></td>
			<td id="tdContent"><p:inputText readonly="true" disabled="true"
					value="-- Read Only --" /></td>
		</tr>
		<tr>
			<td id="tdTitle"><p:outputLabel value="Complaint Details" /></td>
			<td colspan="3" id="tdContent"><p:inputTextarea readonly="true" rows="8" cols="100" 
					disabled="true" value="#{complaintBackingBean.managedBean.smComplaint.complaintDesc}" /></td>
		</tr>
	</table>
</ui:composition>
