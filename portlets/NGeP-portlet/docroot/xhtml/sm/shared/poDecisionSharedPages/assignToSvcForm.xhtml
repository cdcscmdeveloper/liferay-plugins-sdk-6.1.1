<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<br />
	<p:messages id="applicationRecSiteMsg" showSummary="false"
		showDetail="true" autoUpdate="true" closable="true" />
	<table>

		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.sm.sitevist.to.be.performed']} *" /></td>
			<td><p:selectOneMenu
					value="#{backingBean.managedBean.poSiteVisitType}"
					style="width: 207px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="X" />
					<f:selectItem
						itemLabel="#{lbl['lbl.sm.sitevist.to.be.performed.before.approval']}"
						itemValue="B" />
					<f:selectItem
						itemLabel="#{lbl['lbl.sm.sitevist.to.be.performed.after.approval']}"
						itemValue="A" />
					<p:ajax update=":form:tt:svcButPan" event="change" />
				</p:selectOneMenu></td>

		</tr>

	</table>

	<br />
	<ui:remove>
		<p:panel header="#{lbl['lbl.sm.assocCmpny.panHdr']}" toggleable="true">
			<p:dataTable var="assocBean"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.smAppl.smAssociateCompanies}"
				selection="#{backingBean.managedBean.selectedAssocCompanies}"
				rowKey="#{assocBean}" rowIndexVar="index" id="svdHeadOff">
				<ac:paginator for="svdHeadOff" />
				<p:column selectionMode="multiple" width="5%" />
	
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.assocCmpny.head.office.name']}">
					<h:outputText value="#{assocBean.companyName}" />
				</p:column>
	
				<p:column headerText="#{lbl['lbl.sm.address']}"
					style="width: 60%;white-space: normal;">
					<h:outputText
						value="#{backingBean.getFullAddress(assocBean.smAddress)}" />
				</p:column>
	
			</p:dataTable>
		</p:panel>
		<br />
	</ui:remove>
	
	<ui:remove>
		<p:panel header="#{lbl['lbl.sm.branch.panHdr']}" toggleable="true">
			<p:dataTable var="branchBean" id="svcBrDt"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.smAppl.smSupplierBranches}"
				selection="#{backingBean.managedBean.selectedBranches}"
				rowKey="#{branchBean}" rowIndexVar="index">
				<ac:paginator for="svcBrDt" />
				<p:column selectionMode="multiple" width="5%" />
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">
					<h:outputText value="#{index+1}" />
				</p:column>
	
				<p:column headerText="#{lbl['lbl.sm.branch.branchName']}">
					<h:outputText value="#{branchBean.branchName}" />
				</p:column>
	
				<p:column headerText="#{lbl['lbl.sm.address']}"
					style="width: 60%;white-space: normal;">
					<h:outputText
						value="#{backingBean.getFullAddress(branchBean.smAddress)}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<br />
	</ui:remove>
	
	<ui:include src="/xhtml/sm/shared/mofRegistration/siteVisitFacilityInfo.xhtml" />
	
	<ui:remove>
		<p:panel header="#{lbl['lbl.sm.facilities']}" toggleable="true">
			<p:dataTable var="fac"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.smAppl.smFacilities}"
				selection="#{backingBean.managedBean.selectedFactoryFacilities}"
				rowKey="#{fac}" rowIndexVar="index" id="svcFacDt">
				<p:ajax event="rowSelect" listener="#{backingBean.autoTickedHq}"
					update="@([id$=svcFacDt])"></p:ajax>
				<p:ajax event="rowUnselect"
					listener="#{backingBean.autoTickedHq}"
					update="@([id$=svcFacDt])"></p:ajax>
				<p:ajax event="rowSelectCheckbox"
					listener="#{backingBean.autoTickedHq}"
					update="@([id$=svcFacDt])"></p:ajax>
				<p:ajax event="rowUnselectCheckbox"
					listener="#{backingBean.autoTickedHq}"
					update="@([id$=svcFacDt])"></p:ajax>
				<p:ajax event="rowDblselect"
					listener="#{backingBean.autoTickedHq}"
					update="@([id$=svcFacDt])"></p:ajax>
				<ac:paginator for="svcFacDt" />
				<p:column selectionMode="multiple" width="5%" disabledSelection="#{fac.booleanValue}"/>
	
				<p:column headerText="#{lbl['lbl.sm.facility.name']}" disabledSelection="#{fac.booleanValue}">
					<h:outputText value="#{fac.facilityName}" />
				</p:column>
	
				<p:column style="width: 60%;white-space: normal;" disabledSelection="#{fac.booleanValue}"
					headerText="#{lbl['lbl.sm.facility.workshop.dockyard.factory.address']}">
					<h:outputText value="#{backingBean.getFullAddress(fac.smAddress)}" />
				</p:column>
	
			</p:dataTable>
		</p:panel>
	</ui:remove>
	<br />
	
	<ui:remove>
		<p:panel header="#{lbl['lbl.sm.category.categories']}"
			toggleable="true">
			<p:dataTable var="catBean"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.splCategoryList}"
				selection="#{backingBean.managedBean.selectedCategories}"
				rowKey="#{catBean}" rowIndexVar="index" id="svcCatDt">
				<ac:paginator for="svcCatDt" />
				<p:columnGroup type="header">
	
	
					<p:row>
						<p:column selectionMode="multiple" width="5%" />
						<p:column headerText="#{lbl['lbl.sm.category']}" />
						<p:column headerText="#{lbl['lbl.sm.category.type']}" />
						<p:column headerText="#{lbl['lbl.sm.category.firstRecomm']}" />
					</p:row>
				</p:columnGroup>
				<p:column selectionMode="multiple" width="5%" />
				<p:column>
					<h:outputText
						value="#{catBean.pmCategoryL1.categoryL1Code} -  #{catBean.pmCategoryL1.categoryName}" />
					<br />
					<h:outputText
						value="#{catBean.pmCategoryL2.categoryL2Code} -  #{catBean.pmCategoryL2.categoryName}" />
					<br />
					<h:outputText
						value="#{catBean.pmCategoryL3.categoryL3Code} -  #{catBean.pmCategoryL3.categoryName}" />
				</p:column>
				<p:column>
					<h:outputText value="#{lbl['lbl.sm.category.type.normal']}"
						rendered="#{!catBean.specialCategory}" />
					<h:outputText value="#{lbl['lbl.sm.category.type.special']}"
						rendered="#{catBean.specialCategory}" />
				</p:column>
				<p:column>
					<h:outputText value="#{lbl['lbl.sm.catCodes.apprv']}"
						rendered="#{catBean.poDecFlg eq 1}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.reject']}"
						rendered="#{catBean.poDecFlg eq 0}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<br />
	</ui:remove>
	
	<table style="width: 100%">

		<tr>
			<td style="width: 30%; word-wrap: break-word"><p:outputLabel
					value="#{lbl['lbl.sm.remarks.svc']}" /></td>
			<td><p:inputTextarea cols="70"
					style="margin-bottom:5px;width : auto;" maxlength="200"
					id="poRemarksToSvc" rows="10"
					validatorMessage="#{lbl['lbl.sm.po.svc.Remarks']}"
					value="#{backingBean.managedBean.poSecReview.sitevisitRemark}">
					<f:validateLength maximum="200" />
				</p:inputTextarea> <p:message id="poRemarksToSvcMsg" for="poRemarksToSvc"
					showSummary="true" showDetail="false" display="icon" /></td>
		</tr>
	</table>

	<br />
	<p:outputPanel id="svcButPan">
		<p:panel rendered="#{backingBean.managedBean.poSiteVisitType eq 'A'}">
			<table style="width: 100%">
				<tr>
					<td style="width: 30%; word-wrap: break-word"><p:outputLabel
							value="#{lbl['lbl.sm.remarks.approver']}" /></td>
					<td><p:inputTextarea cols="70"
							style="margin-bottom:5px;width : auto;" maxlength="200"
							id="apprRemarks" rows="10"
							validatorMessage="#{lbl['lbl.sm.remarks.recommendAppr']}"
							value="#{backingBean.managedBean.poSecReview.remarkToApprover}">
							<f:validateLength maximum="200" />
						</p:inputTextarea> <p:message id="appRemarksMsg" for="apprRemarks"
							showSummary="true" showDetail="false" display="icon" /></td>

				</tr>
				<tr>
					<td style="width: 30%; word-wrap: break-word"><p:outputLabel
							value="#{lbl['lbl.sm.recommendation.approver']}" /></td>
					<td><p:selectOneRadio id="rentedFacTypeId"
							value="#{backingBean.managedBean.poSecReview.recommendation}"
							required="true" label="#{lbl['lbl.sm.recommendation.approver']}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.recommendation.approve']}"
								itemValue="#{lbl['lbl.sm.recommendation.approve']}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.recommendation.reject']}"
								itemValue="#{lbl['lbl.sm.recommendation.reject']}" />
						</p:selectOneRadio></td>
				</tr>

			</table>
		</p:panel>
		<div align="right">
			<c:choose>
				<c:when test="#{backingBean.managedBean.poSiteVisitType eq 'B'}">
					<p:commandButton value="#{lbl['lbl.btn.submit']}"
						partialSubmit="true" process="svcDialog"
						action="#{backingBean.submitPODescisionForSiteVisit('svcDialog','SITE_VISIT')}" />
				</c:when>
				<c:when test="#{backingBean.managedBean.poSiteVisitType eq 'A'}">
					<p:commandButton value="#{lbl['lbl.btn.submit']}"
						partialSubmit="true" process="svcDialog"
						action="#{backingBean.submitPODescisionForSiteVisit('svcDialog','SITE_VISIT_AFTER_APPROVE')}" />
				</c:when>
				<c:otherwise>
					<p:commandButton value="#{lbl['lbl.btn.submit']}" disabled="true" />
				</c:otherwise>
			</c:choose>
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
				action="#{backingBean.cancelSiteVisitAction('svcDialog')}"
				partialSubmit="true" process="@this" />
		</div>
	</p:outputPanel>

</ui:composition>
