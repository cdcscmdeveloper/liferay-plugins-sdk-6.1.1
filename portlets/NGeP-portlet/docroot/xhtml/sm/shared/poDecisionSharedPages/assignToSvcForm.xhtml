<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<br />
	<table>

		<tr>
			<td><p:outputLabel value="Site Visit To Be Peformed *" /></td>
			<td><p:selectOneMenu
					value="#{backingBean.managedBean.poSiteVisitType}"
					style="width: 207px;margin-bottom: 5px;">
					<f:selectItem itemLabel="-- Select Value --" itemValue="X" />
					<f:selectItem itemLabel="Before Approval" itemValue="B" />
					<f:selectItem itemLabel="After Approval" itemValue="A" />
					<p:ajax update=":form:tt:svcButPan" event="change" />
				</p:selectOneMenu></td>

		</tr>

	</table>

	<br />
	<p:dataTable var="assocBean"
		value="#{backingBean.managedBean.smAppl.smAssociateCompanies}"
		selection="#{backingBean.managedBean.selectedAssocCompanies}"
		rowKey="#{assocBean.associateCompanyId}" rowIndexVar="index"
		id="svdHeadOff">
		<ac:paginator for="svdHeadOff" />
		<p:column selectionMode="multiple" width="5%" />

		<p:column headerText="NO.">
			<h:outputText value="#{index+1}" />
		</p:column>
		<p:column headerText="Head Office Name">
			<h:outputText value="#{assocBean.companyName}" />
		</p:column>

		<p:column headerText="Address">
			<h:outputText
				value="#{assocBean.smAddress.address1},#{assocBean.smAddress.address2}" />
		</p:column>

	</p:dataTable>
	<br />
	<p:dataTable var="branchBean" id="svcBrDt"
		value="#{backingBean.managedBean.smAppl.smSupplierBranches}"
		selection="#{backingBean.managedBean.selectedBranches}"
		rowKey="#{branchBean.supplierBranchId}" rowIndexVar="index">
		<ac:paginator for="svcBrDt" />
		<p:column selectionMode="multiple" width="5%" />
		<p:column headerText="NO.">
			<h:outputText value="#{index+1}" />
		</p:column>

		<p:column headerText="Branch Name">
			<h:outputText value="#{branchBean.branchName}" />
		</p:column>

		<p:column headerText="Address">
			<h:outputText
				value="#{branchBean.smAddress.address1},#{branchBean.smAddress.address2}" />
		</p:column>
	</p:dataTable>
	<br />
	<p:dataTable var="fac"
		value="#{backingBean.managedBean.smAppl.smFacilities}"
		selection="#{backingBean.managedBean.selectedFactoryFacilities}"
		rowKey="#{fac.facilityId}" rowIndexVar="index" id="svcFacDt">
		<ac:paginator for="svcFacDt" />
		<p:column selectionMode="multiple" width="5%" />

		<p:column headerText="NO.">
			<h:outputText value="#{index+1}" />
		</p:column>

		<p:column headerText="Factory Name">
			<p:commandLink value="#{fac.smAddress.address1}"
				oncomplete="factoryDialog.show();"
				action="#{backingBean.assignSelFactory(fac)}"
				update=":form:tt:factoryDialog" />
		</p:column>

		<p:column headerText="Factory/ Workshop/Dockyard Address">
			<h:outputText
				value="#{fac.smAddress.address2},#{fac.smAddress.address3},#{fac.smAddress.address4}" />
		</p:column>

	</p:dataTable>

	<br />
	<p:separator />
	<p:dataTable var="catBean"
		value="#{backingBean.managedBean.smAppl.smSupplierCategories}"
		selection="#{backingBean.managedBean.selectedCategories}"
		rowKey="#{catBean.supplierCategoryId}" rowIndexVar="index"
		id="svcCatDt">
		<ac:paginator for="svcCatDt" />
		<p:columnGroup type="header">
			<!-- <p:row>
				<p:column rowspan="2" selectionMode="multiple" width="5%" />
				<p:column rowspan="2" headerText="No." />
				<p:column rowspan="2" headerText="Code" />
				<p:column colspan="3" headerText="Category" />
				<p:column rowspan="2" headerText="Business Type" />
				<p:column rowspan="2" headerText="Category Type" />
				<p:column rowspan="2" headerText="PO Action" />
			</p:row> -->

			<p:row>
				<p:column selectionMode="multiple" width="5%" />
				<p:column headerText="No." />
				<p:column headerText="Code" />
				<p:column headerText="Parent" />
				<p:column headerText="Child" />
				<p:column headerText="Sub-Child" />
				<p:column headerText="Business Type" />
				<p:column headerText="Category Type" />
				<p:column headerText="PO Action" />
			</p:row>
		</p:columnGroup>
		<p:column selectionMode="multiple" width="5%" />
		<p:column>
			<h:outputText value="#{index+1}" />
		</p:column>
		<p:column>
			<h:outputText
				value="#{catBean.pmCategoryL1.cateogryL1Code}#{catBean.pmCategoryL2.cateogryL2Code}#{catBean.pmCategoryL3.cateogryL3Code}" />
		</p:column>
		<p:column>
			<h:outputText
				value="#{catBean.pmCategoryL1.cateogryL1Code} -  #{catBean.pmCategoryL1.categoryName}" />
		</p:column>
		<p:column>
			<h:outputText
				value="#{catBean.pmCategoryL2.cateogryL2Code} -  #{catBean.pmCategoryL2.categoryName}" />
		</p:column>
		<p:column>
			<h:outputText
				value="#{catBean.pmCategoryL3.cateogryL3Code} -  #{catBean.pmCategoryL3.categoryName}" />
		</p:column>
		<p:column>
			<h:outputText value=" -- TBC -- " />
		</p:column>
		<p:column>
			<!-- <p:outputLabel value="#{catBean.categoryType}" /> -->
			<h:outputText value="Normal"
				rendered="#{catBean.categoryType eq 'N'}" />
			<h:outputText value="Special"
				rendered="#{catBean.categoryType eq 'S'}" />
		</p:column>
		<p:column>
			<p:selectOneRadio>
				<f:selectItem itemLabel="Approve" itemValue="1" />
				<f:selectItem itemLabel="Reject" itemValue="2" />
			</p:selectOneRadio>
		</p:column>
	</p:dataTable>
	<br />
	<p:separator />
	<p:dataTable var="template"
		value="#{backingBean.managedBean.templateList}"
		selection="#{backingBean.managedBean.selectedTemplateList}"
		rowKey="#{template.templateSeq}" rowIndexVar="index" id="svcTemId">
		<ac:paginator for="svcTemId" />
		<p:column selectionMode="multiple" width="5%" />
		<p:column headerText="No.">  
                   #{template.templateSeq}  
      		    </p:column>
		<p:column headerText="Category">  
		            #{template.templateName}
		        </p:column>

	</p:dataTable>
	<br />
	<table style="width: 100%">

		<tr>
			<td><p:outputLabel value="Remarks For SVC" /></td>
			<td><p:inputTextarea cols="70" style="margin-bottom:5px;" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="Remarks For Approver" /></td>
			<td><p:inputTextarea cols="70" style="margin-bottom:5px;" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="Recommendation For Approver" /></td>
			<td><p:selectOneRadio>
					<f:selectItem itemLabel="Approve" />
					<f:selectItem itemLabel="Reject" />
				</p:selectOneRadio></td>
		</tr>

	</table>
	<br />
	<p:outputPanel id="svcButPan">
		<div align="right">
			<c:choose>
				<c:when test="#{backingBean.managedBean.poSiteVisitType eq 'B'}">
					<p:commandButton value="Submit" onclick="svcDialog.hide();"
						action="#{backingBean.submitPOorApproverReviewToBPM('SITE_VISIT')}" />
				</c:when>
				<c:when test="#{backingBean.managedBean.poSiteVisitType eq 'A'}">
					<p:commandButton value="Submit" onclick="svcDialog.hide();"
						action="#{backingBean.submitPOorApproverReviewToBPM('SITE_VISIT_AFTER_APPROVE')}" />
				</c:when>
				<c:otherwise>
					<p:commandButton value="Submit" disabled="true" />
				</c:otherwise>
			</c:choose>
			<p:commandButton value="Cancel" onclick="svcDialog.hide();" />
		</div>
	</p:outputPanel>

</ui:composition>
