<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<br />
	<table>

		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.to.be.performed']} *" /></td>
			<td><p:selectOneMenu
					value="#{backingBean.managedBean.poSiteVisitType}"
					style="width: 207px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="X" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.sitevist.to.be.performed.before.approval']}" itemValue="B" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.sitevist.to.be.performed.after.approval']}" itemValue="A" />
					<p:ajax update=":form:tt:svcButPan" event="change" />
				</p:selectOneMenu></td>

		</tr>

	</table>

	<br />
	<p:panel header="#{lbl['lbl.sm.assocCmpny.panHdr']}" toggleable="true">
		<p:dataTable var="assocBean"
			value="#{backingBean.managedBean.smAppl.smAssociateCompanies}"
			selection="#{backingBean.managedBean.selectedAssocCompanies}"
			rowKey="#{assocBean}" rowIndexVar="index" id="svdHeadOff">
			<ac:paginator for="svdHeadOff" />
			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">
				<h:outputText value="#{index+1}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.assocCmpny.head.office.name']}">
				<h:outputText value="#{assocBean.companyName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.address']}">
				<h:outputText
					value="#{assocBean.smAddress.address1},#{assocBean.smAddress.address2}" />
			</p:column>

		</p:dataTable>
	</p:panel>
	<br />
	<p:panel header="#{lbl['lbl.sm.branch.panHdr']}" toggleable="true">
		<p:dataTable var="branchBean" id="svcBrDt"
			value="#{backingBean.managedBean.smAppl.smSupplierBranches}"
			selection="#{backingBean.managedBean.selectedBranches}"
			rowKey="#{branchBean}" rowIndexVar="index">
			<ac:paginator for="svcBrDt" />
			<p:column selectionMode="multiple" width="5%" />
			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">
				<h:outputText value="#{index+1}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.branch.branchName']}">
				<h:outputText value="#{branchBean.branchName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.address']}">
				<h:outputText
					value="#{branchBean.smAddress.address1},#{branchBean.smAddress.address2}" />
			</p:column>
		</p:dataTable>
	</p:panel>
	<br />
	<p:panel header="#{lbl['lbl.sm.facilities']}" toggleable="true">
		<p:dataTable var="fac"
			value="#{backingBean.managedBean.smAppl.smFacilities}"
			selection="#{backingBean.managedBean.selectedFactoryFacilities}"
			rowKey="#{fac}" rowIndexVar="index" id="svcFacDt">
			<ac:paginator for="svcFacDt" />
			<p:column selectionMode="multiple" width="5%" />


			<p:column headerText="#{lbl['lbl.sm.factory.name']}">
				<h:outputText value="#{fac.facilityName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.facility.workshop.dockyard.factory.address']}">
				<h:outputText
					value="#{fac.smAddress.address1},#{fac.smAddress.address2},#{fac.smAddress.address3}" />
			</p:column>

		</p:dataTable>
	</p:panel>
	<br />
	<p:panel header="#{lbl['lbl.sm.category.categories']}" toggleable="true">
		<p:dataTable var="catBean"
			value="#{backingBean.managedBean.smAppl.smSupplierCategories}"
			selection="#{backingBean.managedBean.selectedCategories}"
			rowKey="#{catBean}" rowIndexVar="index" id="svcCatDt">
			<ac:paginator for="svcCatDt" />
			<p:columnGroup type="header">


				<p:row>
					<p:column selectionMode="multiple" width="5%" />
					<p:column headerText="#{lbl['lbl.sm.category']}" />
					<p:column headerText="#{lbl['lbl.sm.category.type']}" />
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="multiple" width="5%" />
			<p:column>
				<h:outputText
					value="#{catBean.pmCategoryL1.categoryL1Code} -  #{catBean.pmCategoryL1.categoryName}" />
				<br />
				<h:outputText
					value="#{catBean.pmCategoryL2.categoryL2Code} -  #{catBean.pmCategoryL2.categoryName}" />
				<br />
				<h:outputText
					value="#{catBean.pmCategoryL3.categoryL3Code} -  #{catBean.pmCategoryL3.categoryName}" />
			</p:column>
			<p:column>
				<h:outputText value="#{lbl['lbl.sm.category.type.normal']}" rendered="#{catBean.specialCategory}" />
				<h:outputText value="#{lbl['lbl.sm.category.type.special']}" rendered="#{!catBean.specialCategory}" />
			</p:column>
		</p:dataTable>
	</p:panel>
	<br />
	<table style="width: 100%">

		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.remarks.svc']}" /></td>
			<td><p:inputTextarea cols="70" style="margin-bottom:5px;"
					value="#{backingBean.managedBean.poSecReview.sitevisitRemark}" /></td>
		</tr>
	</table>

	<br />
	<p:outputPanel id="svcButPan">
		<p:panel rendered="#{backingBean.managedBean.poSiteVisitType eq 'A'}">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.remarks.approver']}" /></td>
					<td><p:inputTextarea cols="70" style="margin-bottom:5px;" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.recommendation.approver']}" /></td>
					<td><p:selectOneRadio>
							<f:selectItem itemLabel="#{lbl['lbl.sm.recommendation.approver']}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.recommendation.reject']}" />
						</p:selectOneRadio></td>
				</tr>

			</table>
		</p:panel>
		<div align="right">
			<c:choose>
				<c:when test="#{backingBean.managedBean.poSiteVisitType eq 'B'}">
					<p:commandButton value="#{lbl['lbl.btn.submit']}" onclick="svcDialog.hide();"
						update=":form"
						action="#{backingBean.submitPOorApproverReviewToBPM('SITE_VISIT')}" />
				</c:when>
				<c:when test="#{backingBean.managedBean.poSiteVisitType eq 'A'}">
					<p:commandButton value="#{lbl['lbl.btn.submit']}" onclick="svcDialog.hide();"
						update=":form"
						action="#{backingBean.submitPOorApproverReviewToBPM('SITE_VISIT_AFTER_APPROVE')}" />
				</c:when>
				<c:otherwise>
					<p:commandButton value="#{lbl['lbl.btn.submit']}" disabled="true" />
				</c:otherwise>
			</c:choose>
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}" onclick="svcDialog.hide();"
				immediate="true" />
		</div>
	</p:outputPanel>

</ui:composition>
