<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<br />
	<table style="width: 100%">
		<tr>
			<td><p:outputLabel value="* Registration Status" /></td>

			<td><p:selectManyMenu showCheckbox="true"
					value="backingBean.managedBean.smAppl.pmStatus.statusId}"
					style="height:200px;width:400px;">
					<f:selectItems value="#{backingBean.managedBean.regStatusDescList}"
						var="reg" itemLabel="#{reg.statusDesc}"
						itemValue="#{reg.pmStatus.statusId}" />
				</p:selectManyMenu></td>

		</tr>
		<tr>
			<td><p:outputLabel value="Remarks For Approval*" /></td>
			<td style="padding-top: 5px;"><p:inputTextarea cols="90" /></td>
		</tr>
	</table>

</ui:composition>
