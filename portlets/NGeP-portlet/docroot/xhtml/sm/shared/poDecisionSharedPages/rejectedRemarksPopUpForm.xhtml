<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<br />
	<table style="width: 100%">
		<tr>
			<c:if test="#{backingBean.managedBean.smAppl.applType ne 'C'}">
				<td><p:outputLabel value="Rejection Reason(s)" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>

				<td><p:selectManyMenu showCheckbox="true"
						value="#{backingBean.managedBean.reasonId}"
						style="height:200px;width:400px;">
						<f:selectItems value="#{backingBean.managedBean.reasonDescList}"
							var="res" itemLabel="#{res.reasonDesc}"
							itemValue="#{res.pmReason.reasonId}" />
					</p:selectManyMenu></td>
			</c:if>
		</tr>
		<tr>
			<td><p:outputLabel value="Remarks For Rejection" />
				<p:outputLabel value="*" styleClass="mandatory" /></td>
			<td style="padding-top: 5px;"><p:inputTextarea cols="90" /></td>
		</tr>
	</table>

</ui:composition>
