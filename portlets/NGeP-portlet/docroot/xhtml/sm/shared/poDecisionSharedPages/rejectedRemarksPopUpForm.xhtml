<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<br />
	<p:messages id="applicationRejectedRemarksMsg" showSummary="false"
		showDetail="true" autoUpdate="true" closable="true" />

	<table style="width: 100%">
		<tr>
			<c:if test="#{backingBean.managedBean.smAppl.applType ne 'C'}">
				<td style="vertical-align: top; width: 15%"><p:outputLabel
						value="#{lbl['lbl.sm.rejection.reasons']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>

				<td><p:selectManyMenu showCheckbox="true" id="applRejectSelBox"
						required="#{backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.rejection.reasons']}"
						value="#{backingBean.managedBean.reasonId}"
						style="height:200px;width:750px;">
						<f:selectItems value="#{backingBean.managedBean.reasonDescList}"
							var="res" itemLabel="#{res.reasonDesc}"
							itemValue="#{res.pmReason.reasonId}" />
						<p:ajax update=":form:tt:rejRemarksPanelTst" event="change"
							process="applRejectSelBox"
							listener="#{backingBean.verifySelectedRejectReasons()}" />
					</p:selectManyMenu> <p:message id="applRejectSelBoxMsg" for="applRejectSelBox"
						showSummary="true" showDetail="false" display="icon" /></td>
			</c:if>
		</tr>
	</table>
	<p:outputPanel id="rejRemarksPanelTst">
		<table style="width: 100%">
			<tr>
				<td style="vertical-align: top; width: 15%"><p:outputLabel
						value="#{lbl['lbl.sm.remarks.rejection']}" id="rejReasonLbl"
						rendered="#{backingBean.managedBean.rejectReasonReqd}" /> <p:outputLabel
						value="*" styleClass="mandatory" id="rejReasonLblMndty"
						rendered="#{backingBean.managedBean.rejectReasonReqd}" /></td>
				<td style="padding-top: 5px;"><p:inputTextarea cols="100"
						style="width : auto;"
						rendered="#{backingBean.managedBean.rejectReasonReqd}"
						value="#{backingBean.managedBean.applnRejectionRemarks}"
						id="rmrksForRejectTxtArea" rows="5"
						validatorMessage="#{lbl['lbl.sm.remarks.rejection']} #{lbl['lbl.sm.rmrkLength.thsndCharLimit']}"
						label="#{lbl['lbl.sm.remarks.rejection']}"
						required="#{backingBean.managedBean.valueReqd and backingBean.managedBean.rejectReasonReqd}"
						maxlength="2500">
						<f:validateLength maximum="2500" />
					</p:inputTextarea> <p:message id="rmrksForRejectTxtAreaMsg"
						for="rmrksForRejectTxtArea" showSummary="true" showDetail="false"
						display="icon" /></td>
			</tr>
		</table>
	</p:outputPanel>

</ui:composition>
