<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<br />
	<p:messages id="applicationRejectedRemarksMsg" showSummary="false"
		showDetail="true" autoUpdate="true" closable="true" />
	<table style="width: 100%">
		<tr>
			<c:if test="#{backingBean.managedBean.smAppl.applType ne 'C'}">
				<td><p:outputLabel value="#{lbl['lbl.sm.rejection.reasons']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>

				<td><p:selectManyMenu showCheckbox="true" id="applRejectSelBox"
						required="#{backingBean.managedBean.valueReqd}"
						label="Rejection Reason(s)"
						value="#{backingBean.managedBean.reasonId}"
						style="height:200px;width:400px;">
						<f:selectItems value="#{backingBean.managedBean.reasonDescList}"
							var="res" itemLabel="#{res.reasonDesc}"
							itemValue="#{res.pmReason.reasonId}" />
					</p:selectManyMenu> <p:message id="applRejectSelBoxMsg" for="applRejectSelBox"
						showSummary="true" showDetail="false" display="icon" /></td>
			</c:if>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.remarks.rejection']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td style="padding-top: 5px;"><p:inputTextarea cols="90"
					id="rmrksForRejectTxtArea" label="#{lbl['lbl.sm.remarks.rejection']}"
					required="#{backingBean.managedBean.valueReqd}" /> <p:message
					id="rmrksForRejectTxtAreaMsg" for="rmrksForRejectTxtArea"
					showSummary="true" showDetail="false" display="icon" /></td>
		</tr>
	</table>

</ui:composition>
