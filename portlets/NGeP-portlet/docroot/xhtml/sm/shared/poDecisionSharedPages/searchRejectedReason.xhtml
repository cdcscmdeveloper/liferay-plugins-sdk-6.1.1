<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<c:if test="#{backingBean.managedBean.smAppl.applType ne 'C'}">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.rejection.reasons']}" /></td>
				<td>
					<p:inputText id="rejectReasonSearchId"
						label="#{lbl['lbl.sm.rejection.reasons']}"
						value="#{backingBean.managedBean.searchRejectReason}"
						size="35" />
				</td>
			</tr>
			<tr>
				<td colspan="2">
					<div style="text-align: right;">
						<p:commandButton value="#{lbl['lbl.btn.search']}" 
							action="#{backingBean.searchRejectedReason}"
							update=":#{p:component('poRejectBlockPanel')}" 
							onstart="poRejectBlockWidget.show()" oncomplete="poRejectBlockWidget.hide()">
						</p:commandButton>
						<p:commandButton value="#{lbl['lbl.btn.reset']}" 
							action="#{backingBean.resetSearchRejectedReason}"
							update=":#{p:component('poRejectBlockPanel')}">
						</p:commandButton>
					</div>
				</td>
			</tr>
		</table>
		
		<p:panel header="#{lbl['lbl.sm.results']}" toggleable="true" id="resultRejectedReasonPanelId">
			<p:dataTable var="reason" widgetVar="reasonWidgetVar"
				editable="false" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{backingBean.managedBean.reasonDescList}"
				selection="#{backingBean.managedBean.selectedReasonDescs}"
				rowKey="#{reason}" rowIndexVar="index" id="reasonDtId">
				
				<ac:paginator for="reasonDtId" />
				<p:ajax event="rowSelect" listener="#{backingBean.onTickOrUnTickReason}"
					update=":#{p:component('poRejectBlockPanel')}"></p:ajax>
				<p:ajax event="rowUnselect"
					listener="#{backingBean.onTickOrUnTickReason}"
					update=":#{p:component('poRejectBlockPanel')}"></p:ajax>
				<p:ajax event="rowSelectCheckbox"
					listener="#{backingBean.onTickOrUnTickReason}"
					update=":#{p:component('poRejectBlockPanel')}"></p:ajax>
				<p:ajax event="rowUnselectCheckbox"
					listener="#{backingBean.onTickOrUnTickReason}"
					update=":#{p:component('poRejectBlockPanel')}"></p:ajax>
				<p:ajax event="rowDblselect"
					listener="#{backingBean.onTickOrUnTickReason}"
					update=":#{p:component('poRejectBlockPanel')}"></p:ajax>
				
				<p:column selectionMode="multiple" width="1%" />
				
				<p:column headerText="#{lbl['lbl.sm.rejection.reasons']}">
					<h:outputText value="#{reason.reasonDesc}" />
				</p:column>
				
			</p:dataTable>
			
		</p:panel>
	
	</c:if>
	
</ui:composition>
