<ui:composition xmlns="http://www.w3.org/1999/xhtml"

	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<br />

		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.remarks.approval']}" />

			<td style="padding-top: 5px;"><p:inputTextarea cols="90"
					value="#{backingBean.managedBean.applnRejectionRemarks}"

					label="#{lbl['lbl.sm.remarks.rejection']}" maxlength="1000" /> <p:message
					id="rmrksForCanApprovalTxtAreaMsg" for="rmrksForCanApprovalTxtArea"
					showSummary="true" showDetail="false" display="icon" /></td>
		</tr>
	</table>
