<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<br />
	<table style="width: 100%">
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.rpt.rgstStatus']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>

			<td><p:selectOneMenu label="#{lbl['lbl.rpt.rgstStatus']}"
					id="poRecommendStatusId" required="#{backingBean.managedBean.valueReqd}"
					value="#{backingBean.managedBean.poRecommendStatusId}"
					style="width: 240px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems value="#{backingBean.managedBean.recommendRegStatusDescList}" var="reg"
						itemLabel="#{reg.statusName}" itemValue="#{reg.pmStatus.statusId}" />
					<p:ajax event="change" process="@this" update="@this" />
				</p:selectOneMenu> 
				<p:message id="poRecommendStatusIdMsg" for="poRecommendStatusId"
					showSummary="true" showDetail="false" display="icon" />
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sm.remarks.approver']}" /></td>
			<td><p:inputTextarea cols="70" rows="10" style="width : auto;"
					value="#{backingBean.managedBean.poSecReview.remarkToApprover}"
					maxlength="200" id="apprRemarkIdd"
					validatorMessage="#{lbl['lbl.sm.remarks.recommendAppr']}">
					<f:validateLength maximum="200" />
				</p:inputTextarea> <p:message id="apprRemarkIddMsg" for="apprRemarkIdd"
					showSummary="true" showDetail="false" display="icon" /></td>
		</tr>

	</table>
</ui:composition>
