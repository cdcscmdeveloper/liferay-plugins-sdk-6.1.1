<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.workshop.details']}" toggleable="true"
		id="smWorkShopDtPanel">

		<p:dataTable var="work" widgetVar="smWorkShopDtWidVar"
			value="#{viewSmApplBackingBean.managedBean.applWorkShopFacilities}"
			rowKey="#{work}" rowIndexVar="index" id="workDt">
			<ac:paginator for="workDt" />
			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="#{lbl['lbl.sm.workshop.name']}">
				<h:outputText value="#{work.facilityName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.workshop.address']}">
				<h:outputText
					value="#{work.smAddress.address1},#{work.smAddress.address2},#{work.smAddress.address3}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.action']}">
				<p:commandLink partialSubmit="true" process="@this"
					action="#{viewSmApplBackingBean.assignSelWorkshop(work)}" oncomplete="workShopDialog.show()"
					update=":form:tt:workShopDialog" style="padding-right:5px">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</p:panel>
	
	<p:dialog width="500px" height="500px" header="#{lbl['lbl.sm.workshop.information']}"
		widgetVar="workShopDialog" resizable="false" showEffect="fade"
		closable="true" hideEffect="fade" modal="true" id="workShopDialog">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.facilityType']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.facilityType}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.name']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.facilityName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.address']} :" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.address1}" /></td>
			</tr>

			<tr>
				<td></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.address2}" /></td>
			</tr>
			<tr>
				<td></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.address3}" /></td>
			</tr>
			<tr>
				<td></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.address4}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.country']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmCountry.countryName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmState.stateName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmDistrict.districtName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmCity.cityName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.postcode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.phoneNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxno']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.faxNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.area.feat']} :" /></td>
				<td style="float:left;">
					<ac:labelAmount value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.areaSquareFeet}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.ownerType']} :" /></td>
				<td style="float:left;">
					<p:outputLabel value="#{lbl['lbl.sm.facility.own']}" rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O'}" />
					<p:outputLabel value="#{lbl['lbl.sm.facility.rent']}" rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}" />
				</td>
			</tr>
			<tr>
				<td><p:outputPanel id="workPanLbl">
						<p:outputLabel value="#{lbl['lbl.cm.price']}"
							rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O'}" />
						<p:outputLabel value="#{lbl['lbl.sm.facility.rent.rm']}"
							rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}" />
					</p:outputPanel></td>
				<td><p:outputPanel id="workPan">
						<ui:fragment
							rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O'}">
							<ac:labelAmount value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.purchasePrice}" />
						</ui:fragment>
						<ui:fragment
							rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}">
							<ac:labelAmount value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.rentalRate}" />
						</ui:fragment>
					</p:outputPanel>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.ownerName']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownerName}" /></td>
			</tr>

		</table>
	</p:dialog>
</ui:composition>
