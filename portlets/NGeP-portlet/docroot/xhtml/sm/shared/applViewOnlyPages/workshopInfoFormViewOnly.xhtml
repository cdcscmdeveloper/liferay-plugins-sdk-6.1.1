<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Workshop Details" toggleable="true"
		id="smWorkShopDtPanel">

		<p:dataTable var="work" widgetVar="smWorkShopDtWidVar"
			value="#{viewSmApplBackingBean.managedBean.applWorkShopFacilities}"
			rowKey="#{work}" rowIndexVar="index" id="workDt">
			<ac:paginator for="workDt" />
			<p:column selectionMode="multiple" width="5%" />

			<p:column headerText="Workshop Name">
				<h:outputText value="#{work.facilityName}" />
			</p:column>

			<p:column headerText="Workshop Address">
				<h:outputText
					value="#{work.smAddress.address1},#{work.smAddress.address2},#{work.smAddress.address3}" />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink partialSubmit="true" process="@this"
					action="#{viewSmApplBackingBean.assignSelWorkshop(work)}" oncomplete="workShopDialog.show()"
					update=":form:tt:workShopDialog" style="padding-right:5px">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</p:panel>
	
	<p:dialog width="500px" height="500px" header="Workshop Information"
		widgetVar="workShopDialog" resizable="false" showEffect="fade"
		closable="true" hideEffect="fade" modal="true" id="workShopDialog">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="Facility Type" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.facilityType}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Name" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.facilityName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Address" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.address1}" /></td>
			</tr>

			<tr>
				<td></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.address2}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.address3}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.address4}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmCountry.countryName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmState.stateName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmDistrict.districtName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmCity.cityName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.postcode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.phoneNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.faxNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Area(Sq Ft)" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.areaSquareFeet}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:outputLabel>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="Ownership Type" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td>
					<p:outputLabel value="Own" rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O'}" />
					<p:outputLabel value="Rent" rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}" />
				</td>
			</tr>
			<tr>
				<td><p:outputPanel id="workPanLbl">
						<p:outputLabel value="Price (RM.)"
							rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O'}" />
						<p:outputLabel value="Rent (RM.)"
							rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}" />
					</p:outputPanel></td>
				<td><p:outputPanel id="workPan">
						<ui:fragment
							rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O'}">
							<p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.purchasePrice}">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:outputLabel>
						</ui:fragment>
						<ui:fragment
							rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}">
							<p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.rentalRate}">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:outputLabel>
						</ui:fragment>
					</p:outputPanel>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="Owner Name" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownerName}" /></td>
			</tr>

		</table>
	</p:dialog>
</ui:composition>
