<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
		
		<p:outputPanel>
			<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.at.least.one.optional.criteria']}" escape="false"/><br /><br />
		</p:outputPanel>

		<table style="width: 100%">
			<p:outputPanel>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.companyname']}" />
					</td>
					<td>
						<p:inputText label="#{lbl['lbl.sm.companyname']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.companyName}"
							size="40" />
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.rocNo']}" />
					</td>
					<td>
						<p:inputText label="#{lbl['lbl.sm.rocNo']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.regNo}"
							size="35" />
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.ep.no']}" />
					</td>
					<td>
						<p:inputText label="#{lbl['lbl.sm.ep.no']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.epNo}"
							size="35" />
					</td>
				</tr>
				
				<tr>
					<td colspan="2">
						<div style="text-align: right;">
							<p:commandButton value="#{lbl['lbl.btn.search']}" 
								action="#{viewSuppProfileBackingBean.search}"
								update="@form" 
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
							</p:commandButton>
							<p:commandButton value="#{lbl['lbl.btn.reset']}" 
								action="#{viewSuppProfileBackingBean.resetSearch}"
								update="searchSupplierProfilePanelId">
							</p:commandButton>
						</div>
					</td>
				</tr>
			</p:outputPanel>
		</table>
		
		<br />
	
</ui:composition>
