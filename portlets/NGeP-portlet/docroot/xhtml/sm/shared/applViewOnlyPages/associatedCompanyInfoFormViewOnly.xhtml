<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.assocCmpny.panHdr']}" toggleable="true"
		id="assocPanel">
		<p:outputPanel id="assocInfPan" layout="block">
			<p:dataTable var="assocBean" widgetVar="assocDtWidVar" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smAssociateCompanies}"
				rowKey="#{assocBean}" rowIndexVar="index" id="asoc">
				<ac:paginator for="asoc" />

				<p:column headerText="#{lbl['lbl.sm.assocCmpny.companyName']}">
					<h:outputText value="#{assocBean.companyName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.companyaddress']}" style="width: 60%;white-space: normal;">
					<h:outputText
						value="#{viewSmApplBackingBean.getFullAddress(assocBean.smAddress)}"
						style="float : left" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink update=":form:tt:asDisp" onstart="blockWidget.show()"
						action="#{viewSmApplBackingBean.assignSelAssoc(assocBean)}" oncomplete="assocDialog.show()" 
						partialSubmit="true" process="@this">
						<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}"
							style="margin-right:2px;" />
					</p:commandLink>
					<!-- #32008 -->
					<ac:smFieldChangeTableAlertView object="#{assocBean}" />
				</p:column>
			</p:dataTable>
			
			<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
						poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.associateRemark}" 
						approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.associateRemark}" />
		</p:outputPanel>
	</p:panel>
	<p:dialog style="max-height:350px;width:500px" 
		header="#{lbl['lbl.sm.assocCmpny.assocDiaHdr']}" id="asDisp"
		widgetVar="assocDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		
		<p:scrollPanel mode="native" style="max-height:300px;width:450px;border:none">
			<table style="width: 100%;table-layout:fixed">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.assocCmpny.companyName']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.companyName}"/>
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.companyName}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.companyName}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.companyName}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.assocCmpny.regNo']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.regNo}"/> 
					<!-- #37771 - Start -->
						<ac:smFieldChangeAlertView
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
							and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.regNo}"
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.regNo}"
							alertValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.regNo}" /> 
							<!-- #37771 - End -->
							</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mofNo']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" 
							value="#{empty viewSmApplBackingBean.managedBean.selectedAssocCompany.mofNo?lbl['lbl.sm.no.available']:
								viewSmApplBackingBean.managedBean.selectedAssocCompany.mofNo}"/> 
						<!-- #37771 - Start -->
						<ac:smFieldChangeAlertView
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
							and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.mofNo}"
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.mofNo}"
							alertValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.mofNo}" /> 
						<!-- #37771 - End --></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.companyaddress']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.address1}"/>
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.address1}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.address1}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.address1}"/></td>
				</tr>
	
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.address2}"/>
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.address2}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.address2}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.address2}"/></td>
				</tr>
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.address3}"/>
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.address3}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.address3}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.address3}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmCountry.countryName}"/>
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
							and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.pmCountry.countryId}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmCountry.countryId}" 
							alertValue="#{(not empty viewSmApplBackingBean.managedBean.latestAssocCompany and 
								not empty viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress) ?
								viewSmApplBackingBean.getCountryLabelById(viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.pmCountry.countryId)
								: lbl['lbl.txt.na']}"/></td>
				</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmState.stateName}"/>
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.pmState.stateId}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmState.stateId}" 
							alertValue="#{(not empty viewSmApplBackingBean.managedBean.latestAssocCompany and 
							 	not empty viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress) ?
								viewSmApplBackingBean.getStateLabelById(viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.pmState.stateId)
								: lbl['lbl.txt.na']}"/></td>
				</tr>
				
				<!-- 13320 -->
				
				<tr>
					<!-- #13320 - render division-->
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.division']}" 
										rendered="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmState.adoptDivision}"/></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmDivision.divisionName}"
										rendered="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmState.adoptDivision}"/>
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmState.adoptDivision
								and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.pmDivision.divisionId}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmDivision.divisionId}" 
							alertValue="#{(not empty viewSmApplBackingBean.managedBean.latestAssocCompany and 
							 	not empty viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress) ?
								viewSmApplBackingBean.getDivisionLabelById(viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.pmDivision.divisionId)
								: lbl['lbl.txt.na']}"/></td>
					<!-- #13320 - render division - end-->
				</tr>
	
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmDistrict.districtName}"/>
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.pmDistrict.districtId}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmDistrict.districtId}" 
							alertValue="#{(not empty viewSmApplBackingBean.managedBean.latestAssocCompany and 
								not empty viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress) ?
								viewSmApplBackingBean.getDistrictLabelById(viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.pmDistrict.districtId)
								: lbl['lbl.txt.na']}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmCity.cityName}"/>
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.pmCity.cityId}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmCity.cityId}" 
							alertValue="#{(not empty viewSmApplBackingBean.managedBean.latestAssocCompany and 
								not empty viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress) ?
								viewSmApplBackingBean.getCityLabelById(viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.pmCity.cityId) 
								: lbl['lbl.txt.na']}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.postcode}"/>
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.postcode}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.postcode}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.smAddress.postcode}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.phoneFull}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.phoneNo}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.phoneNo}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.phoneNo}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.faxno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.faxFull}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestAssocCompany.associateCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.faxNo}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.faxNo}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestAssocCompany.faxNo}"/></td>
				</tr>
			</table>
		</p:scrollPanel>
	</p:dialog>
</ui:composition>
