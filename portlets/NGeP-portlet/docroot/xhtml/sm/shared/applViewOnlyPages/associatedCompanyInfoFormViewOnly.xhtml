<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.assocCmpny.panHdr']}" toggleable="true"
		id="assocPanel">
		<p:panel id="assocInfPan">
			<p:dataTable var="assocBean" widgetVar="assocDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smAssociateCompanies}"
				rowKey="#{assocBean}" rowIndexVar="index" id="asoc">
				<ac:paginator for="asoc" />

				<p:column headerText="#{lbl['lbl.sm.assocCmpny.companyName']}">
					<h:outputText value="#{assocBean.companyName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.companyaddress']}">
					<h:outputText
						value="#{assocBean.smAddress.address1},#{assocBean.smAddress.address2}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink update=":form:tt:asDisp"
						action="#{viewSmApplBackingBean.assignSelAssoc(assocBean)}" oncomplete="assocDialog.show()" 
						partialSubmit="true" process="@this">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png"
							style="margin-right:2px;" />
					</p:commandLink>

				</p:column>


			</p:dataTable>
		</p:panel>
	</p:panel>
	<p:dialog header="#{lbl['lbl.sm.assocCmpny.assocDiaHdr']}" id="asDisp"
		widgetVar="assocDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.assocCmpny.companyName']} " /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.companyName}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.assocCmpny.regNo']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.regNo}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.assocCmpny.shrHolding']} " /></td>
				<td><p:selectOneRadio value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.isShareholding}" disabled="true">
						<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.companyaddress']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.address1}"/></td>
			</tr>

			<tr>
				<td></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.address2}"/></td>
			</tr>
			<tr>
				<td></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.address3}"/></td>
			</tr>
			<tr>
				<td></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.address4}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmCountry.countryName}"/></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmState.stateName}"/></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmDistrict.districtName}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.pmCity.cityName}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.smAddress.postcode}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.phoneNo}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocCompany.faxNo}"/></td>
			</tr>

		</table>
	</p:dialog>
</ui:composition>
