<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel header="#{lbl['lbl.sm.projDtls.panHdr']}" toggleable="true">
		<p:outputPanel id="consInfPan" layout="block">
			<p:dataTable var="consBean" widgetVar="suppCnstlExpDtWidVar" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyExperiences}"
				rowKey="#{consBean}" rowIndexVar="index" id="consDt">
				<ac:paginator for="consDt" />

				<p:column headerText="#{lbl['lbl.sm.projDtls.projTitle']}" style="width : 40%;white-space: normal;">
					<h:outputText value="#{consBean.title}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.projVal']}">
					<ac:labelAmount value="#{consBean.contractValue}" styleClass="outputLabel-view"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.procDate']}">
					<ac:labelDate value="#{consBean.procurementDate}" styleClass="outputLabel-view"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.workProgress']}">
					<h:outputText value="#{lbl['lbl.sm.projDtls.inProgress']}"
						rendered="#{consBean.progressStatus eq 'P'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.success']}"
						rendered="#{consBean.progressStatus eq 'S'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.fail']}"
						rendered="#{consBean.progressStatus eq 'F'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.kiv']}" 
						rendered="#{consBean.progressStatus eq 'K'}"/>
					<h:outputText value="#{lbl['lbl.sm.projDtls.repeal']}" 
						rendered="#{consBean.progressStatus eq 'R'}"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink onstart="blockWidget.show()"
						action="#{viewSmApplBackingBean.assignSelCompanyExperience(consBean)}" oncomplete="consDialog.show()"
						update=":form:tt:consDialog" partialSubmit="true" process="@this">
						<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
					</p:commandLink>
					<!-- #32008 -->
					<ac:smFieldChangeTableAlertView object="#{consBean}" />
				</p:column>

			</p:dataTable>
		</p:outputPanel>
		
		<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
						poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.experienceRemark}" 
						approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.experienceRemark}" />
	</p:panel>
	
	<p:dialog style="max-height:550px;width:700px" 
		header="#{lbl['lbl.sm.projDtls.projDiaHdr']}"
		widgetVar="consDialog" id="consDialog" resizable="false"
		showEffect="fade" hideEffect="fade" modal="true">
		
		<p:scrollPanel mode="native" style="max-height:300px;width:450px;border:none">
			<table style="width: 100%;table-layout:fixed">
				<tr>
					<td valign="top">
	
						<table style="width: 100%;table-layout:fixed">
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.projDtls.projTitle']}" /></td>
								<td><!-- #32008 --><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.title}"/>
									<ac:smFieldChangeAlertView 
										isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
											and not empty viewSmApplBackingBean.managedBean.latestCompanyExperience.companyExperienceId}"
										oriValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.title}" 
										currValue="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.title}" 
										alertValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.title}"/></td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.projDtls.clientName']}" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.clientName}"/>
									<!-- #32008 -->
									<ac:smFieldChangeAlertView 
										isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
											and not empty viewSmApplBackingBean.managedBean.latestCompanyExperience.companyExperienceId}"
										oriValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.clientName}" 
										currValue="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.clientName}" 
										alertValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.clientName}"/></td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.projDtls.projCost']}" /></td>
								<td>
									<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.contractValue}" />
									<!-- #32008 -->
									<ac:smFieldChangeAlertView 
										isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
											and not empty viewSmApplBackingBean.managedBean.latestCompanyExperience.companyExperienceId}"
										oriValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.contractValue}" 
										currValue="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.contractValue}" 
										alertValue="#{viewSmApplBackingBean.getPriceAmountFormat(viewSmApplBackingBean.managedBean.latestCompanyExperience.contractValue)}"/>
								</td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.projDtls.doneFor']}" /></td>
								<td>
									<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.busNtw.fdrGov']}" rendered="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.clientType eq 'F'}"/>
									<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.busNtw.others']}" rendered="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.clientType eq 'O'}"/>
									<!-- #32008 -->
									<ac:smFieldChangeAlertView 
										isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
											and not empty viewSmApplBackingBean.managedBean.latestCompanyExperience.companyExperienceId}"
										oriValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.clientType}" 
										currValue="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.clientType}" 
										alertValue="#{empty viewSmApplBackingBean.managedBean.latestCompanyExperience.clientType ?  lbl['lbl.sm.no.available'] :
											(viewSmApplBackingBean.managedBean.latestCompanyExperience.clientType eq 'F' 
											? lbl['lbl.sm.busNtw.fdrGov'] : lbl['lbl.sm.busNtw.nonfdrGov'])}"/>
								</td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value=" #{lbl['lbl.sm.projDtls.refNo']}" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.refNo}"/>
									<!-- #32008 -->
									<ac:smFieldChangeAlertView 
										isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
											and not empty viewSmApplBackingBean.managedBean.latestCompanyExperience.companyExperienceId}"
										oriValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.refNo}" 
										currValue="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.refNo}" 
										alertValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.refNo}"/></td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value=" #{lbl['lbl.sm.projDtls.projLoc']}" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.projectLocation}"/>
									<!-- #32008 -->
									<ac:smFieldChangeAlertView 
										isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
											and not empty viewSmApplBackingBean.managedBean.latestCompanyExperience.companyExperienceId}"
										oriValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.projectLocation}" 
										currValue="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.projectLocation}" 
										alertValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.projectLocation}"/></td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value=" #{lbl['lbl.sm.projDtls.serviceProvide']}" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.workServiceDesc}" cols="36" style="margin-bottom:5px;" />
									<!-- #32008 -->
									<ac:smFieldChangeAlertView 
										isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
											and not empty viewSmApplBackingBean.managedBean.latestCompanyExperience.companyExperienceId}"
										oriValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.workServiceDesc}" 
										currValue="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.workServiceDesc}" 
										alertValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.workServiceDesc}"/></td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.projDtls.workProgress']}" /></td>
								<td>
									<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.projDtls.inProgress']}" rendered="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.progressStatus eq 'P'}"/>
									<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.projDtls.success']}" rendered="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.progressStatus eq 'S'}"/>
									<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.projDtls.fail']}" rendered="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.progressStatus eq 'F'}"/>
									<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.projDtls.kiv']}" rendered="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.progressStatus eq 'K'}"/>
									<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.projDtls.repeal']}" rendered="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.progressStatus eq 'R'}"/>
									<!-- #32008 -->
									<ac:smFieldChangeAlertView 
										isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
											and not empty viewSmApplBackingBean.managedBean.latestCompanyExperience.companyExperienceId}"
										oriValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.progressStatus}" 
										currValue="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.progressStatus}" 
										alertValue="#{empty viewSmApplBackingBean.managedBean.latestCompanyExperience.progressStatus ? lbl['lbl.sm.no.available'] :
											(viewSmApplBackingBean.managedBean.latestCompanyExperience.progressStatus eq 'P' 
											? lbl['lbl.sm.projDtls.inProgress'] : (
											viewSmApplBackingBean.managedBean.latestCompanyExperience.progressStatus eq 'P' ? lbl['lbl.sm.projDtls.success'] 
											: lbl['lbl.sm.projDtls.fail']))}"/>
								</td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value=" #{lbl['lbl.sm.projDtls.consultFee']}" /></td>
								<td>
									<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.consultantFee}" />
									<!-- #32008 -->
									<ac:smFieldChangeAlertView 
										isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
											and not empty viewSmApplBackingBean.managedBean.latestCompanyExperience.companyExperienceId}"
										oriValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.consultantFee}" 
										currValue="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.consultantFee}" 
										alertValue="#{viewSmApplBackingBean.getPriceAmountFormat(viewSmApplBackingBean.managedBean.latestCompanyExperience.consultantFee)}"/>
								</td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.projDtls.apptDate']}" /></td>
								<td>
									<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.procurementDate}" />
									<!-- #32008 -->
									<ac:smFieldChangeAlertView 
										isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
											and not empty viewSmApplBackingBean.managedBean.latestCompanyExperience.companyExperienceId}"
										oriValue="#{viewSmApplBackingBean.managedBean.latestCompanyExperience.procurementDate}" 
										currValue="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.procurementDate}" 
										alertValue="#{viewSmApplBackingBean.getDateFormat(viewSmApplBackingBean.managedBean.latestCompanyExperience.procurementDate)}"/>
								</td>
							</tr>
							 
						</table>
						
						<p:outputPanel rendered="#{not empty viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
						<br /><br />
						<TABLE>
							<tr><td colspan="2">
								<p:dataTable var="consExpCat" widgetVar="consExpCatWidVar"
									value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}"
									rowKey="#{consExpCat}" rowIndexVar="index"
									id="consExpCatDt">
									
									<ac:paginator for="contExpCatDt" />
									
									<!-- #28175 - start -->
									<c:choose>
									<c:when test="#{viewSmApplBackingBean.isLatestCatCodeDesc(
												fn:containsIgnoreCase(requestScope['javax.servlet.forward.request_uri'], 'supplier-profile'))}">
										<p:column headerText="#{lbl['lbl.sm.projDtls.mainCat']}">
											<h:outputText value="#{consExpCat.pmCategoryL1.categoryL1Code} - #{consExpCat.pmCategoryL1.categoryName}" style="float: left;white-space: normal;"/>
										</p:column>
										<p:column headerText="#{lbl['lbl.sm.projDtls.subCat']}">
											<h:outputText value="#{consExpCat.pmCategoryL2.categoryL2Code} - #{consExpCat.pmCategoryL2.categoryName}" style="float: left;white-space: normal;"/>
										</p:column>
										<p:column headerText="#{lbl['lbl.sm.projDtls.subCatDiv']}">
											<h:outputText value="#{consExpCat.pmCategoryL3.categoryL3Code} - #{consExpCat.pmCategoryL3.categoryName}" style="float: left;white-space: normal;"/>
											<ac:smFieldChangeTableAlertView object="#{consExpCat}" />
										</p:column>
									</c:when>
									<c:otherwise>
										<p:column headerText="#{lbl['lbl.sm.projDtls.mainCat']}">
											<h:outputText value="#{consExpCat.pmCategoryL1.categoryL1Code} - #{consExpCat.categoryL1Name}" style="float: left;white-space: normal;"/>
										</p:column>
										<p:column headerText="#{lbl['lbl.sm.projDtls.subCat']}">
											<h:outputText value="#{consExpCat.pmCategoryL2.categoryL2Code} - #{consExpCat.categoryL2Name}" style="float: left;white-space: normal;"/>
										</p:column>
										<p:column headerText="#{lbl['lbl.sm.projDtls.subCatDiv']}">
											<h:outputText value="#{consExpCat.pmCategoryL3.categoryL3Code} - #{consExpCat.categoryL3Name}" style="float: left;white-space: normal;"/>
											<!-- #32008 -->
											<ac:smFieldChangeTableAlertView object="#{consExpCat}" />
										</p:column>
									</c:otherwise>
									</c:choose>
									<!-- #28175 - end -->
								 </p:dataTable>
								 <br />
							 </td></tr>
						</TABLE>
						</p:outputPanel>
	
					</td>
	
				</tr>
			</table>
		</p:scrollPanel>
	</p:dialog>
</ui:composition>
