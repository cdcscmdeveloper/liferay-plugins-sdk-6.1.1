<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.projDtls.panHdr']}" toggleable="true">
		<p:panel id="consInfPan">
			<p:dataTable var="consBean" widgetVar="suppCnstlExpDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyExperiences}"
				rowKey="#{consBean}" rowIndexVar="index" id="consDt">
				<ac:paginator for="consDt" />

				<p:column headerText="#{lbl['lbl.sm.projDtls.projTitle']}">
					<h:outputText value="#{consBean.title}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.projVal']}">
					<h:outputText value="#{consBean.contractValue}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.procDate']}">
					<h:outputText value="#{consBean.procurementDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.workProgress']}">
					<h:outputText value="#{lbl['lbl.sm.projDtls.inProgress']}"
						rendered="#{consBean.progressStatus eq 'P'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.success']}"
						rendered="#{consBean.progressStatus eq 'S'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.fail']}"
						rendered="#{consBean.progressStatus eq 'F'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink
						action="#{viewSmApplBackingBean.assignSelCompanyExperience(consBean)}" oncomplete="consDialog.show()"
						update=":form:tt:consDialog" partialSubmit="true" process="@this">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			
			<br />
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
						<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.experienceRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
						<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.experienceRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']} :" /></td>
						<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.apprvrSecReview.experienceRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog header="#{lbl['lbl.sm.projDtls.projDiaHdr']}"
		widgetVar="consDialog" id="consDialog" resizable="false"
		showEffect="fade" hideEffect="fade" modal="true"
		width="550px" height="500px">
		<table style="width: 100%">
			<tr>
				<td valign="top">

					<table style="width: 100%">
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.projTitle']}" /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.title}"/></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.clientName']}" /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.clientName}"/></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.projCost']}" /></td>
							<td style="font-size: 12px;font-weight: normal;font-family: Arial">
								<h:outputText value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.contractValue}">
									<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.doneFor']}" /></td>
							<td><p:selectOneRadio value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.clientType}" disabled="true">
									<f:selectItem itemLabel="#{lbl['lbl.sm.busNtw.fdrGov']}" itemValue="F" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.busNtw.others']}" itemValue="O" />
								</p:selectOneRadio></td>
						</tr>
						<tr>
							<td><p:outputLabel value=" #{lbl['lbl.sm.projDtls.refNo']}" /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.refNo}"/></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value=" #{lbl['lbl.sm.projDtls.projLoc']}" /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.projectLocation}"/></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value=" #{lbl['lbl.sm.projDtls.serviceProvide']} " /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.workServiceDesc}" cols="36" style="margin-bottom:5px;" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.workProgress']}" /></td>
							<td><p:selectOneRadio value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.progressStatus}" disabled="true">
									<f:selectItem itemLabel="#{lbl['lbl.sm.projDtls.inProgress']}" itemValue="P" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.projDtls.success']}" itemValue="S" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.projDtls.fail']}" itemValue="F" />
								</p:selectOneRadio></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value=" #{lbl['lbl.sm.projDtls.consultFee']}" /></td>
							<td style="font-size: 12px;font-weight: normal;font-family: Arial">
								<h:outputText value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.consultantFee}">
									<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.apptDate']}" /></td>
							<td style="font-size: 12px;font-weight: normal;font-family: Arial">
								<h:outputText value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.procurementDate}" >
									<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.mainCat']}" /></td>
							<td style="float:left;">
								<c:if test="#{not empty viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
									<table width="100%">
									<ui:repeat var="exp" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
										<c:if test="#{not empty exp.pmCategoryL1}">
											<tr><td><p:outputLabel value="#{exp.pmCategoryL1.categoryName}"/></td></tr>
										</c:if>
									</ui:repeat>
									</table>
								</c:if>
							</td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.subCat']}" /></td>
							<td style="float:left;">
								<c:if test="#{not empty viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
									<table width="100%">
									<ui:repeat var="exp" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
										<c:if test="#{not empty exp.pmCategoryL2}">
											<tr><td><p:outputLabel value="#{exp.pmCategoryL2.categoryName}"/></td></tr>
										</c:if>
									</ui:repeat>
									</table>
								</c:if>
							</td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.subCatDiv']}" /></td>
							<td style="float:left;">
								<c:if test="#{not empty viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
									<table width="100%">
									<ui:repeat var="exp" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
										<c:if test="#{not empty exp.pmCategoryL3}">
											<tr><td><p:outputLabel value="#{exp.pmCategoryL3.categoryName}"/></td></tr>
										</c:if>
									</ui:repeat>
									</table>
								</c:if>
							</td>
						</tr>
					</table>

				</td>

			</tr>
		</table>
	</p:dialog>
</ui:composition>
