<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.projDtls.panHdr']}" toggleable="true">
		<p:panel id="consInfPan">
			<p:dataTable var="consBean" widgetVar="suppCnstlExpDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyExperiences}"
				rowKey="#{consBean}" rowIndexVar="index" id="consDt">
				<ac:paginator for="consDt" />

				<p:column headerText="#{lbl['lbl.sm.projDtls.projTitle']}">
					<h:outputText value="#{consBean.title}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.projVal']}">
					<h:outputText value="#{consBean.contractValue}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.procDate']}">
					<h:outputText value="#{consBean.procurementDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.workProgress']}">
					<h:outputText value="#{lbl['lbl.sm.projDtls.inProgress']}"
						rendered="#{consBean.progressStatus eq 'P'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.success']}"
						rendered="#{consBean.progressStatus eq 'S'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.fail']}"
						rendered="#{consBean.progressStatus eq 'F'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink
						action="#{viewSmApplBackingBean.assignSelCompanyExperience(consBean)}"
						update=":form:tt:consDialog" partialSubmit="true" process="@this">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
		</p:panel>
	</p:panel>
	<p:dialog header="#{lbl['lbl.sm.projDtls.projDiaHdr']}"
		widgetVar="consDialog" id="consDialog" resizable="false"
		closable="false" showEffect="fade" hideEffect="fade" modal="true"
		width="550px" height="500px">
		<table style="width: 100%">
			<tr>
				<td valign="top">

					<table style="width: 100%">
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.projTitle']}" /></td>
							<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.title}"/></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.clientName']}" /></td>
							<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.clientName}"/></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.projCost']}" /></td>
							<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.contractValue}"/></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value=" #{lbl['lbl.sm.projDtls.doneFor']}" /></td>
							<td><p:selectOneRadio value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.clientType}" disabled="true">
									<f:selectItem itemLabel="Federal Govt" itemValue="F" />
									<f:selectItem itemLabel="Others" itemValue="O" />
								</p:selectOneRadio></td>
						</tr>
						<tr>
							<td><p:outputLabel value=" #{lbl['lbl.sm.projDtls.refNo']}" /></td>
							<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.refNo}"/></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value=" #{lbl['lbl.sm.projDtls.projLoc']}" /></td>
							<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.projectLocation}"/></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value=" #{lbl['lbl.sm.projDtls.serviceProvide']} " /></td>
							<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.workServiceDesc}" cols="36" style="margin-bottom:5px;" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.workProgress']}" /></td>
							<td><p:selectOneRadio value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.progressStatus}" disabled="true">
									<f:selectItem itemLabel="In Progress" itemValue="P" />
									<f:selectItem itemLabel="Success" itemValue="S" />
									<f:selectItem itemLabel="Fail" itemValue="F" />
								</p:selectOneRadio></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value=" #{lbl['lbl.sm.projDtls.consultFee']}" /></td>
							<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.consultantFee}"/></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.apptDate']}" /></td>
							<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.procurementDate}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.mainCat']}" /></td>
							<td><p:selectOneMenu id="consultProjParCatCode" disabled="true"
									value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL1.categoryL1Id}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select  -- " itemValue="" />
									<f:selectItems
										value="#{viewSmApplBackingBean.managedBean.supplierParentCatList}"
										var="parent" itemLabel="#{parent.categoryName}"
										itemValue="#{parent.categoryL1Id}" />
									<p:ajax event="change"
										listener="#{viewSmApplBackingBean.populateChildCategoryByParent(viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL1.categoryL1Id,
								viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL2,
								viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL3)}"
										update="conslChild,conslSubChild" />
								</p:selectOneMenu></td>


						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.subCat']}" /></td>
							<td><p:selectOneMenu value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL2.categoryL2Id}" disabled="true"
									id="conslChild" style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel=" -- Select  -- " itemValue="" />
									<f:selectItems
										value="#{viewSmApplBackingBean.managedBean.supplierChildCatList}"
										var="conslChild" itemLabel="#{conslChild.categoryName}"
										itemValue="#{conslChild.categoryL2Id}" />
									<p:ajax event="change"
										listener="#{viewSmApplBackingBean.populateSubChildCategoryByChild(viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL2.categoryL2Id,viewSmApplBackingBean.managedBean.selectedCategory.pmCategoryL3)}"
										update="conslSubChild" />
								</p:selectOneMenu> <p:message id="conslChildMsg" for="conslChild"
									showSummary="true" showDetail="false" display="icon" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.projDtls.subCatDiv']}" /></td>
							<td><p:selectOneMenu value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats[0].pmCategoryL3.categoryL3Id}" disabled="true"
									id="conslSubChild" style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel=" -- Select  --  " itemValue="" />
									<f:selectItems
										value="#{viewSmApplBackingBean.managedBean.supplierSubChildCatList}"
										var="conslSubChild" itemLabel="#{conslSubChild.categoryName}"
										itemValue="#{conslSubChild.categoryL3Id}" />
								</p:selectOneMenu></td>
						</tr>
					</table>

				</td>

			</tr>
		</table>
	</p:dialog>
</ui:composition>
