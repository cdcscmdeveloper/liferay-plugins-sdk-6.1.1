<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel header="#{lbl['lbl.sm.factory.details']}" toggleable="true"
		id="smFacilityFactoryDtPanel">
		
		<p:outputPanel rendered="#{empty viewSmApplBackingBean.managedBean.factoryFacilitiesVOList}">
			<h:outputText value="#{lbl['lbl.sm.factory.notApplicable']}" />
		</p:outputPanel>
		<!-- #28175 -->
		<ui:param name="isSuppProfile" 
			value="#{fn:containsIgnoreCase(requestScope['javax.servlet.forward.request_uri'], 'supplier-profile')}"/>
		
		<ui:repeat var="factoryCatVar" value="#{viewSmApplBackingBean.managedBean.factoryFacilitiesVOList}" varStatus="factoryCatVarStatus">
			<table style="width: 100%;">
				<tr>
					<td>
					    <!-- #28175 -->
					    <p:outputLabel value="#{factoryCatVarStatus.index + 1}. #{factoryCatVar.fullCatcode} 
					    	(#{viewSmApplBackingBean.getSupplierCategoryName(factoryCatVar, isSuppProfile, true)})" 
					    	style="word-wrap:break-word; float:left !important; text-align:left !important;"/>
					</td>
				</tr>
				<!-- 29380 - Site Visit Grouping Enhancement -28775 - start -->
				<tr>
					<td style="white-space: nowrap; float: left;">
						<p:outputLabel value="#{viewSmApplBackingBean.getCategoryCodeOtherDesc(factoryCatVar)}" 
							style="text-indent: 10px;"/>
					</td>
				</tr>
				<!-- 29380 - Site Visit Grouping Enhancement -28775 - end -->
			</table>
			<br />
			
			<p:dataTable var="fac" widgetVar="smFacilityFactorDtWidVar"
				value="#{factoryCatVar.facilityList}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{fac}" rowIndexVar="index" id="facDt">
				<ac:paginator for="facDt" />

				<p:column headerText="#{lbl['lbl.sm.facility.factory.name']}">
					<p:outputPanel rendered="#{not empty fac.smSupplierCategoryFacilities and fac.smSupplierCategoryFacilities.size() gt 1}">
						<p:graphicImage value="/css/images/design/ico-same-with.png" 
							title="#{lbl['lbl.sm.facility.address.attach.more.than.one.category']}" />&#160;
					</p:outputPanel>
					<h:outputText value="#{fac.facilityName}" />
				</p:column>
				
				<ui:remove>
					<p:column headerText="#{lbl['lbl.sm.category']}">
						<h:outputText value="#{factoryCatVar.fullCatcode} (#{factoryCatVar.categoryName})" />
					</p:column>
				</ui:remove>
				
				<p:column headerText="#{lbl['lbl.sm.factory.address']}"
					style="width :60%;white-space : normal">
					<h:outputText value="#{viewSmApplBackingBean.getFullAddress(fac.smAddress)}"
						style="float : left" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.action']}" style="text-align: center  !important;">
					<p:commandLink action="#{viewSmApplBackingBean.assignSelFactory(fac)}" onstart="blockWidget.show()"
						partialSubmit="true" process="@this" oncomplete="factoryDialog.show()"
						update=":form:tt:factoryDialog" style="padding-right:5px">
						<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
					</p:commandLink>
				</p:column>

			</p:dataTable><br />
			
		</ui:repeat>
						
	</p:panel>
	<p:dialog style="max-height:450px;width:500px" header="#{lbl['lbl.sm.factory.information']}"
		widgetVar="factoryDialog" resizable="false" showEffect="fade"
		closable="true" hideEffect="fade" modal="true" id="factoryDialog">
		
		<p:scrollPanel mode="native" style="max-height:400px;width:450px;border:none">
			<table style="width: 100%;table-layout:fixed">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.facilityType']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.facilityType}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.name']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.facilityName}" /></td>
				</tr>
				<tr>
					<td style="vertical-align: baseline;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.category']}" /></td>
					<td>
						<ui:repeat var="catFac" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smSupplierCategoryFacilities}">
							<p:outputLabel value="#{catFac.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}
										#{catFac.pmCategoryL3.pmCategoryL2.categoryL2Code}
										#{catFac.pmCategoryL3.categoryL3Code}
									 	(#{viewSmApplBackingBean.getSupplierCategoryName(catFac.pmCategoryL3, isSuppProfile, false)})" 
								styleClass="outputLabel-view" /><br />	<!-- #28175, 29380 - Site Visit Grouping Enhancement -28775 -->
						</ui:repeat>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.address']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.address1}" /></td>
				</tr>
	
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.address2}" /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.address3}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.pmCountry.countryName}" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.pmState.stateName}" /></td>
				</tr>
				<!-- 13320 -->
				<tr>
					<!-- #13320 - render division-->
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.division']}" 
										rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.pmState.adoptDivision}"/></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.pmDivision.divisionName}" 
										rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.pmState.adoptDivision}"/></td>
					<!-- #13320 - render division - end-->
				</tr>
	
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.pmDistrict.districtName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.pmCity.cityName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.postcode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.phoneFull}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.faxno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.faxFull}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sc.spec.area.feat']}" /></td>
					<td>
						<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.areaSquareFeet}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.ownerType']}" /></td>
					<td>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.own']}"
								rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}"/>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.rent']}"
							rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputPanel id="facPanLbl">
							<p:outputLabel value="#{lbl['lbl.cm.price']}" styleClass="outputLabel-view-label"
								rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}"
								id="oid" />
							<p:outputLabel value="#{lbl['lbl.sm.facility.rent.rm']}" styleClass="outputLabel-view-label"
								rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}"
								id="rid" />
						</p:outputPanel></td>
					<td><p:outputPanel id="facPan">
							<ui:fragment
								rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}">
								<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.purchasePrice}" />
							</ui:fragment>
							<ui:fragment
								rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}">
								<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.rentalRate}" />
							</ui:fragment>
						</p:outputPanel></td>
				</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.ownername']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownerName}" /></td>
				</tr>
	
			</table>
		</p:scrollPanel>
	</p:dialog>
</ui:composition>
