<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Factory Details" toggleable="true"
		id="smFacilityFactoryDtPanel">

		<p:dataTable var="fac" widgetVar="smFacilityFactorDtWidVar"
			value="#{viewSmApplBackingBean.managedBean.applFactoryFacilities}"
			rowKey="#{fac}" rowIndexVar="index" id="facDt">
			<ac:paginator for="facDt" />

			<p:column headerText="Factory Name">
				<h:outputText value="#{fac.facilityName}" />
			</p:column>

			<p:column headerText="Factory Address">
				<h:outputText
					value="#{fac.smAddress.address1},#{fac.smAddress.address2},#{fac.smAddress.address3}" />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink action="#{viewSmApplBackingBean.assignSelFactory(fac)}"
					partialSubmit="true" process="@this" oncomplete="factoryDialog.show()"
					update=":form:tt:factoryDialog" style="padding-right:5px">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		<br />
	</p:panel>
	<p:dialog width="500px" height="500px" header="Factory Information"
		widgetVar="factoryDialog" resizable="false" showEffect="fade"
		closable="true" hideEffect="fade" modal="true" id="factoryDialog">
		
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="Facility Type" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.facilityType}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Name" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.facilityName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Address" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.address1}" /></td>
			</tr>

			<tr>
				<td></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.address2}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.address3}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.address4}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.pmCountry.countryName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.pmState.stateName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.pmDistrict.districtName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.pmCity.cityName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.smAddress.postcode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.phoneNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.faxNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Area(Sq Ft)" /></td>
				<td>
					<p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.areaSquareFeet}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:outputLabel>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="Ownership Type" /></td>
				<td>
					<p:outputLabel value="Own"
							rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}"/>
					<p:outputLabel value="Rent"
						rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputPanel id="facPanLbl">
						<p:outputLabel value="Price (RM.)"
							rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}"
							id="oid" />
						<p:outputLabel value="Rent (RM.)"
							rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}"
							id="rid" />
					</p:outputPanel></td>
				<td><p:outputPanel id="facPan">
						<ui:fragment
							rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownershipType eq 'O'}">
							<p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.purchasePrice}" >
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:outputLabel>
						</ui:fragment>
						<ui:fragment
							rendered="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownershipType eq 'R'}">
							<p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.rentalRate}">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:outputLabel>
						</ui:fragment>
					</p:outputPanel></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Owner Name" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedFactoryFacility.ownerName}" /></td>
			</tr>

		</table>
	</p:dialog>
</ui:composition>
