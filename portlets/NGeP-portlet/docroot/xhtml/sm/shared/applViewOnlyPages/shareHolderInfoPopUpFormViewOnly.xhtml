<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"

	<p:panel header="#{lbl['lbl.sm.person.panHdr']}" toggleable="true"
		id="equiPerDtlPan">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.name']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.name}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.nationality']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.pmCountry.countryName}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.identificationtype']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.identificationTypeId}" /></td>
				<td>
					<p:outputPanel id="equiPerDtlIdenTypeLblPan">
						<p:outputLabel value="#{lbl['lbl.sm.shrHldrInfo.idNo']} :" id="equiPerIcNumLbl" />
					</p:outputPanel>
				</td>
				<td style="float:left;"><p:outputPanel id="equiPerDtlIdenTypePan"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.identificationNo}"/></p:outputPanel></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.dob']} :" /></td>
				<td style="font-size: 12px;font-weight: normal;font-family: Arial">
					<h:outputText value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.birthDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.designation']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.designation}"/></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.epfNo']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.epfNo}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.exp']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.workExperienceYear}"/></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.email']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.email}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.mobileNo']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.mobileNo}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.phoneNo}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxno']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.faxNo}"/></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.bumi']} :" /></td>
				<td style="float:left;">
					<p:outputLabel value="#{lbl['lbl.txt.yes']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.bumiFlg eq '1'}" />
					<p:outputLabel value="#{lbl['lbl.txt.no']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.bumiFlg eq '0'}" />
				</td>
				<td><p:outputLabel value=" #{lbl['lbl.sm.person.religion']} :" /></td>
				<td style="float:left;">
					<p:outputLabel value="Islam" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.muslimFlg eq '1'}" />
					<p:outputLabel value="Non-Islam" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.muslimFlg eq '0'}" />
				</td>
			</tr>

		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.user.roles']}" toggleable="true" id="shrRolesPanel">
		<ui:include src="personnelRolesPanelViewOnly.xhtml" />
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.person.shrPrvHdr']}" toggleable="true"
		id="shrPrivPanel"
		rendered="#{viewSmApplBackingBean.managedBean.userWithRole}">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.isAuth']} :" /></td>
				<td style="float:left;">
					<p:outputLabel value="#{lbl['lbl.txt.yes']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '1'}" />
					<p:outputLabel value="#{lbl['lbl.txt.no']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '0'}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.eprole']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.epRole}"/></td>
			</tr>
			<c:if test="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '1' 
							and viewSmApplBackingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_USER'}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.person.isSoftCert']} :" /></td>
						<td style="float:left;">
							<p:outputLabel value="#{lbl['lbl.txt.yes']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.softcertFlg eq '2'}" />
							<p:outputLabel value="#{lbl['lbl.txt.no']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.softcertFlg eq '0'}" />
						</td>
					</tr>
			</c:if>
			<c:if test="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '1' 
							and viewSmApplBackingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_USER' 
							and viewSmApplBackingBean.managedBean.selectedShareHolder.softcertFlg eq '2'}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.person.isSoftCert']} :" /></td>
						<td style="float:left;">
							<p:outputLabel value="#{lbl['lbl.txt.yes']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.contractSignerFlg eq '1'}" />
							<p:outputLabel value="#{lbl['lbl.txt.no']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.contractSignerFlg eq '0'}" />
						</td>
					</tr>
			</c:if>
		</table>

	</p:panel>
	<p:panel header="#{lbl['lbl.sm.person.shrDtls']}" toggleable="true"
		id="shareAmtPanel"
		rendered="#{viewSmApplBackingBean.managedBean.currentPageType eq SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUITY}">
		<table style="width: 100%">
			<tr>
				<td style="width: 13%;"><p:outputLabel value="#{lbl['lbl.sm.person.shrAmt']}" /></td>
				<td style="padding-right: 42px;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.shareAmt}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.shrPerc']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.sharePercentage}" /></td>

			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.person.addrDtls']}" toggleable="true"
		id="shareHolderAddrDialog">
		<ui:include
			src="/xhtml/sm/shared/applViewOnlyPages/shareHolderAddressInfoPopUpFormViewOnly.xhtml" />
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.job.function']}" toggleable="true" id="equiShrHldrJbFnc">
		<p:dataTable id="shrJfdt" widgetVar="suppPrsnJobFunDtWidVar"
			value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.smStaffExperiences}"
			var="jf"
			rowIndexVar="rowIndex" rowKey="#{jf}">
			<ac:paginator for="shrJfdt" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.companyname']}" />
				</f:facet>
				<h:outputText value="#{jf.companyName}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.designation']}" />
				</f:facet>
				<h:outputText value="#{jf.designation}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.year.from']}" />
				</f:facet>
				<h:outputText value="#{jf.fromYear}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.year.to']}" />
				</f:facet>
				<h:outputText value="#{jf.toYear}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.label.action']}">
				<p:commandLink update=":form:tt:equiJobFunctionInfo"
					action="#{viewSmApplBackingBean.assignSelShrHldrJobFunc(jf)}" oncomplete="equiJobFunctionInfo.show()" 
					partialSubmit="true" process="@this">
					<p:graphicImage library="ep/images/design" name="document.png"
						value="/resources/ep/images/design/document.png"
						style="margin-right:2px;" />
				</p:commandLink>

			</p:column>

		</p:dataTable>
	</p:panel>
	<p:dialog width="500px" height="200px" header="#{lbl['lbl.sm.job.function.details']}"
		id="equiJobFunctionInfo" widgetVar="equiJobFunctionInfo" resizable="false" showEffect="fade" hideEffect="fade"
		modal="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.assocCmpny.companyName']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedJobFunction.companyName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.designation']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedJobFunction.designation}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.year.from']} :" /></td>
				<td><p:outputLabel style="float:left; margin-bottom : 5px;" value="#{viewSmApplBackingBean.managedBean.selectedJobFunction.fromYear}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.year.to']} :" /></td>
				<td><p:outputLabel style="float:left;" value="#{viewSmApplBackingBean.managedBean.selectedJobFunction.toYear}"/></td>
			</tr>
		</table>
	</p:dialog>
	<p:panel header="#{lbl['lbl.sm.related.company.details']}" toggleable="true"
		id="equiShrHldrRelComp">

		<p:dataTable id="shrRelCom"
			value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.smRelatedCompanies}"
			var="relCom" widgetVar="suppPrsnRelComDtWidVar"
			rowIndexVar="rowIndex" rowKey="#{relCom}">
			<ac:paginator for="shrRelCom" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.assocCmpny.companyName']}" />
				</f:facet>
				<h:outputText value="#{relCom.companyName}" />
			</p:column>
			<p:column>
				<f:facet name="header">

				<h:outputText value="#{relCom.regNo}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.shareholding.total.rm']}" />
				</f:facet>
				<h:outputText value="#{relCom.shareAmt}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.mof.reg.no']}" />

				<h:outputText value="#{relCom.mofNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.label.action']}">
				<p:commandLink update=":form:tt:equiRelCompInfo"
					action="#{viewSmApplBackingBean.assignSelShrHldrRelatedCompany(relCom)}" oncomplete="equiRelCompInfo.show()"
					partialSubmit="true" process="@this">
					<p:graphicImage library="ep/images/design" name="document.png"
						value="/resources/ep/images/design/document.png"
						style="margin-right:2px;" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:dialog width="500px" height="300px" header="#{lbl['lbl.sm.related.company.details']}" id="equiRelCompInfo"
		widgetVar="equiRelCompInfo" resizable="false" showEffect="fade"	hideEffect="fade" modal="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.assocCmpny.companyName']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedRelatedCompany.companyName}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.reg.no']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedRelatedCompany.regNo}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.designation']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedRelatedCompany.designation}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.equiComp.shrAmt']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedRelatedCompany.shareAmt}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.equiComp.shrPerc']} :" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.mof.reg.no']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedRelatedCompany.mofNo}"/></td>
			</tr>
		</table>
	</p:dialog>
	<p:panel header="#{lbl['lbl.sm.profBody.profBody']}" toggleable="true"
		id="equiShrPfBdyPan">
		<p:dataTable var="profBean" widgetVar="suppPrsnProfBdyDtWidVar"
			value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.smAssociationBodies}"
			rowKey="#{profBean}" rowIndexVar="index" id="shrProfDt">
			<ac:paginator for="shrProfDt" />
			<p:column headerText="#{lbl['lbl.sm.profBody.profBody']}">
				<h:outputText value="#{profBean.pmCertBody.bodyName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.profBody.regNo']}">
				<h:outputText value="#{profBean.regNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.prof.enddate']}">
				<h:outputText value="#{profBean.expDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.label.action']}">
				<p:commandLink update=":form:tt:equiShrProfBeanInfo"
					action="#{viewSmApplBackingBean.assignSelShrHldrProfBody(profBean)}"
					partialSubmit="true" process="@this" oncomplete="equiShrProfBeanInfo.show()">
					<p:graphicImage library="ep/images/design" name="document.png"
						value="/resources/ep/images/design/document.png"
						style="margin-right:2px;" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</p:panel>
	<p:dialog width="500px" height="300px" header="#{lbl['lbl.sm.profBody.panHdr']}" id="equiShrProfBeanInfo"
		widgetVar="equiShrProfBeanInfo" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.profBody.profBody']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStfPrfBdy.pmCertBody.bodyName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.profBody.regNo']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStfPrfBdy.regNo}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.prof.enddate']} :" /></td>
				<td><h:outputText value="#{viewSmApplBackingBean.managedBean.selectedStfPrfBdy.expDate}">

			</tr>

		</table>

	<p:panel header="#{lbl['lbl.sm.academic.qualification']}" toggleable="true"
		id="equiShrHldrAcadPan">

		<p:dataTable id="shrAqdt"
			value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.smStaffAcademics}"
			var="aq" widgetVar="suppPrsnAcadDtWidVar"
			rowIndexVar="rowIndex" rowKey="#{aq}">
			<ac:paginator for="shrAqdt" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.spec.contrat.year']}" />
				</f:facet>
				<h:outputText value="#{aq.year}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.institute']}" />
				</f:facet>
				<h:outputText value="#{aq.instituteName}" />
			</p:column>

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.education.field']}" />
				</f:facet>
				<h:outputText value="#{aq.pmEduField.fieldName}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.major.in']}" />
				</f:facet>
				<h:outputText value="#{aq.fieldMajor}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.label.action']}">
				<p:commandLink update=":form:tt:equiAcadInfo"
					action="#{viewSmApplBackingBean.assignSelShrHldrAcademics(aq)}"
					partialSubmit="true" process="@this" oncomplete="equiAcadInfo.show()">
					<p:graphicImage library="ep/images/design" name="document.png"
						value="/resources/ep/images/design/document.png"
						style="margin-right:2px;" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:dialog width="450px" height="300px" header="#{lbl['lbl.sm.staff.academic.details']}" id="equiAcadInfo"
		widgetVar="equiAcadInfo" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.contrat.year']} :" /></td>
				<td><p:outputLabel style="float:left; margin-bottom : 5px;" value="#{viewSmApplBackingBean.managedBean.selectedStaffAcademic.year}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.institute']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStaffAcademic.instituteName}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.qualification.level']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStaffAcademic.qualificationLevelId}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.education.field']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStaffAcademic.pmEduField.fieldName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.major.in']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStaffAcademic.fieldMajor}"/></td>
			</tr>
		</table>
	</p:dialog>


</ui:composition>
