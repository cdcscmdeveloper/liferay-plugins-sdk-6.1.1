	<p:panel header="#{lbl['lbl.sm.person.shrPrvHdr']}" toggleable="true"
		id="shrPrivPanel"
		rendered="#{viewSmApplBackingBean.managedBean.userWithRole}">
		<table style="width:50%;table-layout:fixed">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.isAuth']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.yes']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '1'}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.no']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '0'}" />
				</td>
			</tr>
			<c:if test="#{not empty viewSmApplBackingBean.managedBean.selectedShareHolder.epRole}">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.userprofile.eprole']}" /></td>
					<td>
						<ac:smRoleDesc backingBean="#{viewSmApplBackingBean}" roleCode="#{viewSmApplBackingBean.managedBean.selectedShareHolder.epRole}"/>
					</td>
				</tr>
			</c:if>
			<c:if test="#{not empty viewSmApplBackingBean.managedBean.selectedShareHolder.addnlPersonnelJustification}">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.justification']}" /></td>
					<td style="word-wrap: break-word">
						<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.addnlPersonnelJustification}" />
					</td>
				</tr>
			</c:if>
			
			<p:outputPanel
				rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.STYPE_CONTRACTOR 
							and (viewSmApplBackingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_ADMIN' or backingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_USER' or backingBean.managedBean.selectedShareHolder.epRole eq 'FL_USER')}">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.composition.certStatus']}" /></td>
					<td><ac:smSoftcertStatus personnel="#{viewSmApplBackingBean.managedBean.selectedShareHolder}"  /></td>
				</tr>
			</p:outputPanel>
			
			<c:if test="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '1' and viewSmApplBackingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_USER' and 
				(viewSmApplBackingBean.managedBean.selectedShareHolder.softcertFlg eq '2' or viewSmApplBackingBean.managedBean.selectedShareHolder.softcertFlg eq '1')}">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.isContrSign']}"/></td>
					<td>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.yes']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.contractSignerFlg eq '1'}" />
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.no']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.contractSignerFlg eq '0'}" />
					</td>
				</tr>
			</c:if>
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '1' and not empty viewSmApplBackingBean.managedBean.selectedShareHolder.epRole}">

					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.activation.status']}"/></td>

				</tr>
			</p:outputPanel>
