<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.person.panHdr']}" toggleable="true"
		id="equiPerDtlPan">
		<table style="width: 100%;table-layout:fixed">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.name']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.name}"/>
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.name}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.name}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.name}"/></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.nationality']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.pmCountry.countryName}"/>
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.pmCountry.countryId}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.pmCountry.countryId}" 
							alertValue="#{(not empty viewSmApplBackingBean.managedBean.latestPersonnel and 
							 not empty viewSmApplBackingBean.managedBean.latestPersonnel.pmCountry) ?
							 viewSmApplBackingBean.getCountryLabelById(viewSmApplBackingBean.managedBean.latestPersonnel.pmCountry.countryId) 
							 : lbl['lbl.txt.na']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.salutation']}" styleClass="outputLabel-view-label"/></td>
				<td><p:outputLabel styleClass="outputLabel-view" rendered="#{not empty viewSmApplBackingBean.managedBean.selectedShareHolder.title}"
						value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.title.salutationName}" />
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.title.salutationId}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.title.salutationId}" 
							alertValue="#{(not empty viewSmApplBackingBean.managedBean.latestPersonnel and 
							 not empty viewSmApplBackingBean.managedBean.latestPersonnel.title) ?
							 viewSmApplBackingBean.managedBean.latestPersonnel.title.salutationName
							 : lbl['lbl.txt.na']}"/></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.race']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" rendered="#{not empty viewSmApplBackingBean.managedBean.selectedShareHolder.pmRace}"
						value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.pmRace.raceName}" />
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.pmRace.raceId}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.pmRace.raceId}" 
							alertValue="#{viewSmApplBackingBean.getRaceLabel(viewSmApplBackingBean.managedBean.latestPersonnel.pmRace.raceId)}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.identificationtype']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareholderIdentificationType}" /></td>
				<td>
					<p:outputPanel id="equiPerDtlIdenTypeLblPan">
						<p:outputLabel styleClass="outputLabel-view-label" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.identificationType.parameterCode eq SupplierManagementConst.NEW_IC?lbl['lbl.sm.individual.newicno']:lbl['lbl.sm.userprofile.idno']}" id="equiPerIcNumLbl" />
					</p:outputPanel>
				</td>
				<td><p:outputPanel id="equiPerDtlIdenTypePan"><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.identificationNo}"/></p:outputPanel></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.dob']}" /></td>
				<td>
					<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.birthDate}" />
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.birthDate}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.birthDate}" 
							alertValue="#{viewSmApplBackingBean.getDateFormat(viewSmApplBackingBean.managedBean.latestPersonnel.birthDate)}"/>
				</td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.designation']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.designation}"/>
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.designation}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.designation}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.designation}"/></td>
			</tr>

			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.epfNo']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.epfNo}"/>
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.epfNo}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.epfNo}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.epfNo}"/></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.exp']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.workExperienceYear}"/>
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.workExperienceYear}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.workExperienceYear}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.workExperienceYear}"/></td>

			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.email']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.email}"/>
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.email}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.email}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.email}"/></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mobileNo']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.mobileFull}" />
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.mobileNo}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.mobileNo}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.mobileNo}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.phoneFull}" />
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.phoneNo}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.phoneNo}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.phoneNo}"/></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.faxno']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.faxFull}" />
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.faxNo}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.faxNo}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.faxNo}"/></td>
			</tr>

			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.bumi']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.yes']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.bumiFlg eq '1'}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.no']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.bumiFlg eq '0'}" />
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel and not empty viewSmApplBackingBean.managedBean.selectedShareHolder.pmCountry 
								and viewSmApplBackingBean.managedBean.selectedShareHolder.pmCountry.countryCode eq 'MY'}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.bumiFlg}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.bumiFlg}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.bumiFlg eq '1' ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}"/>
				</td>
			<!-- #29856 - Start -->		
			<c:if test="#{viewSmApplBackingBean.managedBean.selectedShareHolder.pmCountry.countryCode == SupplierManagementConst.COUNTRY_MALAYSIA_CODE}">
				<td><p:outputLabel styleClass="outputLabel-view-label" value=" #{lbl['lbl.sm.person.religion']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.religion.muslim']}" 
					rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.muslimFlg eq '1'}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.religion.non.muslim']}"
					 rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.muslimFlg eq '0'}" />
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestPersonnel and not empty viewSmApplBackingBean.managedBean.selectedShareHolder.pmCountry 
								and viewSmApplBackingBean.managedBean.selectedShareHolder.pmCountry.countryCode eq 'MY'}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.muslimFlg}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.muslimFlg}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.muslimFlg eq '1' ? 
								lbl['lbl.sm.person.religion.muslim'] : lbl['lbl.sm.person.religion.non.muslim']}"/>
				</td>
			</c:if>
			<!-- #29856 - End -->
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.user.roles']}" toggleable="true" id="shrRolesPanel" rendered="#{!viewSmApplBackingBean.managedBean.updatePersonnelPage}">
		<ui:include src="personnelRolesPanelViewOnly.xhtml" />
	</p:panel>
	<!-- #28979 -->
	<p:panel header="#{lbl['lbl.sm.person.shrPrvHdr']}" toggleable="true"
		id="shrPrivPanel"
		rendered="#{viewSmApplBackingBean.managedBean.userWithRole or viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '1'}">
		
		<table style="width:50%;table-layout:fixed">
			<c:choose>
				<c:when test="#{viewSmApplBackingBean.managedBean.updatePersonnelPage}" >
					<tr>
						<td colspan="2">
							<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.disabled.role.msg']}" 
								rendered="#{viewSmApplBackingBean.managedBean.disableRoleSelection}"/>
							<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.validSmUserLimit}">
								<br /><h:outputText styleClass="instruction" value="#{lbl['lbl.sm.authorized.personnel.reach.limit.msg']}"
									 escape="false"/><br />
							</p:outputPanel>
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.person.isAuth']}" /></td>
						<td><p:selectOneRadio value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg}" 
								disabled="#{viewSmApplBackingBean.managedBean.disableAuthorizedRadio}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
								<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
								<p:ajax event="change" process="@this" onstart="blockWidget.show()" 
									oncomplete="blockWidget.hide()" update="@form"
									listener="#{viewSmApplBackingBean.assignShareHolderPrivilege}" partialSubmit="true"/>
							</p:selectOneRadio></td>
					</tr>
					<p:outputPanel rendered="#{not empty viewSmApplBackingBean.managedBean.ePRoleList}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.eprole']}" /></td>
							<td><p:selectOneMenu id="smPersnEpRole"
									disabled="#{viewSmApplBackingBean.managedBean.disableRoleSelection}"
									label="#{lbl['lbl.sm.userprofile.eprole']}"
									value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.epRole}"
									style="width: 207px;margin: 5px 0px 5px 0px;">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
									<f:selectItems value="#{viewSmApplBackingBean.managedBean.ePRoleList}" />
									<p:ajax event="change" update="@form" process="@this" 
										listener="#{viewSmApplBackingBean.assignShareHolderPrivilegeByEpRole}" 
										partialSubmit="true"/>
								</p:selectOneMenu>
								<p:message id="smPersnEpRoleMsg" for="smPersnEpRole"
								showSummary="true" showDetail="false" display="icon" /></td>
						</tr>
					</p:outputPanel>
				</c:when>
				<c:otherwise>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.isAuth']}" /></td>
						<td>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.yes']}" 
								rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '1'}" />
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.no']}" 
								rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '0'}" />
							<!-- #32008 -->
							<ac:smFieldChangeAlertView 
								isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
									and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
								oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.authorizedFlg}" 
								currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg}" 
								alertValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.authorizedFlg eq '1' ? 
									lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}"/>
						</td>
					</tr>
					<c:if test="#{not empty viewSmApplBackingBean.managedBean.selectedShareHolder.epRole}">
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.userprofile.eprole']}" /></td>
							<td>
								<ac:smRoleDesc backingBean="#{viewSmApplBackingBean}" roleCode="#{viewSmApplBackingBean.managedBean.selectedShareHolder.epRole}"/>
								<!-- #32008 -->
								<ac:smFieldChangeAlertView 
									isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
										and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
									oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.epRole}" 
									currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.epRole}" 
									alertValue="#{viewSmApplBackingBean.getEpRoleDescByRoleCode(viewSmApplBackingBean.managedBean.latestPersonnel.epRole)}"/>
							</td>
						</tr>
					</c:if>
				</c:otherwise>
			</c:choose>
			
			<p:outputPanel
				rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.STYPE_CONTRACTOR and viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withFederal
							and (viewSmApplBackingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_ADMIN' or viewSmApplBackingBean.managedBean.selectedShareHolder.epRole eq 'MOF_SUPPLIER_USER' or viewSmApplBackingBean.managedBean.selectedShareHolder.epRole eq 'FL_USER')}">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.composition.certStatus']}" /></td>
					<td><ac:smSoftcertStatus personnel="#{viewSmApplBackingBean.managedBean.selectedShareHolder}"  /></td>
				</tr>
			</p:outputPanel>
			<!-- #34197 START -->
			<c:choose>
				<c:when test="#{viewSmApplBackingBean.managedBean.updatePersonnelPage}" >
					<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.STYPE_CONTRACTOR
												and viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withFederal 
												and viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '1'}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.person.isContrSign']}"/></td>
							<td>
								<p:selectOneRadio value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.contractSignerFlg}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
									<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
								</p:selectOneRadio>
							</td>
						</tr>
					</p:outputPanel>
				</c:when>
				<c:otherwise>
					<c:if test="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '1' 
								 and viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withFederal}">
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.isContrSign']}"/></td>
							<td>
								<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.yes']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.contractSignerFlg eq '1'}" />
								<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.no']}" rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.contractSignerFlg eq '0'}" />
								<!-- #32008 -->
								<ac:smFieldChangeAlertView 
									isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
										and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
									oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.contractSignerFlg}" 
									currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.contractSignerFlg}" 
									alertValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.contractSignerFlg eq '1' 
										? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}"/>
							</td>
						</tr>
					</c:if>
				</c:otherwise>
			</c:choose>
			<!-- #34197 END -->
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.selectedShareHolder.authorizedFlg eq '1' and not empty viewSmApplBackingBean.managedBean.selectedShareHolder.epRole}">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.activation.status']}"/></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.getPersonnelActivationStatus(viewSmApplBackingBean.managedBean.selectedShareHolder,viewSmApplBackingBean.managedBean.smSupplier)}" /></td>
				</tr>
			</p:outputPanel>
		</table>

	</p:panel>
	<p:panel header="#{lbl['lbl.sm.person.shrDtls']}" toggleable="true"
		id="shareAmtPanel"
		rendered="#{viewSmApplBackingBean.managedBean.currentPageType eq SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUITY}">
		<table style="width: 100%;table-layout:fixed">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.shrAmt']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.shareAmt}"/>
					<!-- #32008 -->
					<ac:smFieldChangeAlertView 
						isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
							and not empty viewSmApplBackingBean.managedBean.latestPersonnel}"
						oriValue="#{viewSmApplBackingBean.managedBean.latestPersonnel.shareAmt}" 
						currValue="#{viewSmApplBackingBean.managedBean.selectedShareHolder.shareAmt}" 
						alertValue="#{viewSmApplBackingBean.getPriceAmountFormat(viewSmApplBackingBean.managedBean.latestPersonnel.shareAmt)}"/></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.shrPerc']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedShareHolder.sharePercentage}" /></td>

			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.person.addrDtls']}" toggleable="true"
		id="shareHolderAddrDialog" rendered="#{!viewSmApplBackingBean.managedBean.updatePersonnelPage}">
