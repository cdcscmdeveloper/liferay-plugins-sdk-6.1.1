<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.dockyard.details']}" toggleable="true" id="smDocDtPanel">

		<p:dataTable var="doc" widgetVar="smFacilityDockDtWidVar"
			value="#{viewSmApplBackingBean.managedBean.applDockyardFacilities}"
			rowKey="#{doc}" rowIndexVar="index" id="docDt">
			<ac:paginator for="docDt" />

			<p:column headerText="#{lbl['lbl.sm.dockyard.name']}">
				<h:outputText value="#{doc.facilityName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.dockyard.address']}">
				<h:outputText
					value="#{doc.smAddress.address1},#{doc.smAddress.address2},#{doc.smAddress.address3}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.action']}">
				<p:commandLink action="#{viewSmApplBackingBean.assignSelDockyard(doc)}" oncomplete="dockYardDialog.show()"
					process="@this" partialSubmit="true"
					update=":form:tt:dockYardDialog" style="padding-right:5px">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</p:panel>
	
	<p:dialog style="max-height:350px;width:500px" header="#{lbl['lbl.sm.dockyard.information']}"
		widgetVar="dockYardDialog" resizable="false" showEffect="fade"
		closable="true" hideEffect="fade" modal="true" id="dockYardDialog">
		
		<p:scrollPanel mode="native" style="max-height:300px;width:450px;border:none">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.facility.facilityType']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.facilityType}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.facility.name']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.facilityName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.address']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.smAddress.address1}" /></td>
				</tr>
	
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.smAddress.address2}" /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.smAddress.address3}" /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.smAddress.address4}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.country']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.smAddress.pmCountry.countryName}" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.state']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.smAddress.pmState.stateName}" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.district']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.smAddress.pmDistrict.districtName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.towncity']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.smAddress.pmCity.cityName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.smAddress.postcode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.phoneNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.faxno']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.faxNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.spec.area.feat']} :" /></td>
					<td>
						<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.areaSquareFeet}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.facility.ownerType']} :" /></td>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.facility.own']}" styleClass="outputLabel-view"
								rendered="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.ownershipType eq 'O'}" />
						<p:outputLabel value="#{lbl['lbl.sm.facility.rent']}" styleClass="outputLabel-view"
							rendered="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.ownershipType eq 'R'}" />
					</td>
				</tr>
				<tr>
					<td>
						<p:outputPanel id="docPanLbl">
							<p:outputLabel value="#{lbl['lbl.cm.price']}"
								rendered="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.ownershipType eq 'O'}" />
							<p:outputLabel value="#{lbl['lbl.sm.facility.rent.rm']}"
								rendered="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.ownershipType eq 'R'}" />
						</p:outputPanel></td>
					<td>
						<p:outputPanel id="docPan">
							<ui:fragment
								rendered="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.ownershipType eq 'O'}">
								<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.purchasePrice}" />
							</ui:fragment>
							<ui:fragment
								rendered="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.ownershipType eq 'R'}">
								<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.rentalRate}" />
							</ui:fragment>
						</p:outputPanel>
					</td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.ownername']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedDockyardFacility.ownerName}" /></td>
				</tr>
	
			</table>
		</p:scrollPanel>
	</p:dialog>
</ui:composition>
