<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.manufacture.panHdr']}" toggleable="true">
		<table style="width: 250px">
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.poUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{viewSmApplBackingBean.managedBean.poSecReview.manufacturingVerified}"
							id="poManuVer">
							<p:ajax update=":form:tt:manuInfPan,:form:revPanHdr"
								event="change"
								listener="#{viewSmApplBackingBean.changeVerifySection(viewSmApplBackingBean.managedBean.poSecReview.manufacturingVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionPoVerf']}"
							title="For PO to highlight the verified section " /></td>

				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
				<tr>
					<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
							value="#{viewSmApplBackingBean.managedBean.apprvrSecReview.manufacturingVerified}"
							id="apprManuVer">
							<p:ajax update=":form:tt:manuInfPan,:form:revPanHdr"
								event="change"
								listener="#{viewSmApplBackingBean.changeVerifySection(viewSmApplBackingBean.managedBean.apprvrSecReview.manufacturingVerified)}" />
						</p:selectBooleanCheckbox></td>
					<td valign="top"><h:outputText
							value="#{lbl['lbl.sm.sectionApprVerf']}"
							title="For Approver to highlight the verified section " /></td>
				</tr>
			</p:outputPanel>
		</table>
		<br />
		<p:panel id="manuInfPan">
			<p:blockUI block=":form:tt:manuInfPan" widgetVar="buiPoManu"
				id="poManuBlc"
				blocked="#{viewSmApplBackingBean.managedBean.poUser ? viewSmApplBackingBean.managedBean.poSecReview.manufacturingVerified : (viewSmApplBackingBean.managedBean.approverUser ? viewSmApplBackingBean.managedBean.apprvrSecReview.manufacturingVerified : false)}" />

			<p:dataTable var="manBean" widgetVar="smManuDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smManufacturingDtls}" 
				rowKey="#{manBean}" rowIndexVar="index" id="manDt">
				<ac:paginator for="manDt" />
				<p:column headerText="#{lbl['lbl.sm.manufacture.prdType']}">
					<h:outputText value="#{manBean.goodsType}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.manufacture.brand']}">
					<h:outputText value="#{manBean.brand}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.sm.manufacture.prodCap']} / #{lbl['lbl.sm.manufacture.month']}">
					<h:outputText value="#{manBean.productionCapacity}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.manufacture.mesUnit']}">
					<h:outputText value="#{manBean.pmUom.uomName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink update=":form:tt:manufactorDialog" process="@this" oncomplete="manufactorDialog.show()"
						partialSubmit="true"
						action="#{viewSmApplBackingBean.assignSelManufacturer(manBean)}"
						style="padding-right:5px">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			<br />
			
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41" 
								value="#{viewSmApplBackingBean.managedBean.poSecReview.manufacturingRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" readonly="true"
								disabled="true" cols="41"
								value="#{viewSmApplBackingBean.managedBean.poSecReview.manufacturingRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td><p:inputTextarea autoResize="true" cols="41"
								value="#{viewSmApplBackingBean.managedBean.apprvrSecReview.manufacturingRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="600px" height="350px"
		header="#{lbl['lbl.sm.manufacture.diaHdr']}"
		widgetVar="manufactorDialog" resizable="false" showEffect="fade"
		closable="true" hideEffect="fade" modal="true" id="manufactorDialog">
		
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.prdType']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedManufacturer.goodsType}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.brand']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedManufacturer.brand}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.prodCap']}" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedManufacturer.productionCapacity}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.mesUnit']}" /></td>
				<td valign="top"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedManufacturer.pmUom.uomName}" /></td>
			</tr>

		</table>
	</p:dialog>
</ui:composition>
