<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<!-- 28237 - start -->
	<p:panel header="#{lbl['lbl.sm.disciplinary.action.info.headerlbl']}" toggleable="true" id="discActionPanelId" 
		rendered="#{viewApplHistoryBackingBean.managedBean.disciplinaryAction}">
		<p:outputPanel>
			<h:outputText value="#{lbl['lbl.sm.disciplinary.click']}" escape="false"/>
			<p:commandLink onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				action="#{viewApplHistoryBackingBean.onViewDisciplinaryAction}"
				process="@this" partialSubmit="true" update=":form">
					<u><h:outputText value="#{lbl['lbl.sm.disciplinary.here']}" style="color:blue;" escape="false"/></u>
			</p:commandLink><p:spacer width="2"/>
			<h:outputText value="#{lbl['lbl.sm.disciplinary.to.view.history.disciplinary.action']}" escape="false"/><br />
			<p:spacer height="2"/>
		</p:outputPanel>
	
		<table style="width: 50%;table-layout:fixed">
			<tr>
				<td style="vertical-align: top;">
					<p:outputLabel value="#{lbl['lbl.sm.disciplinary.jktt.punishment.type']}" styleClass="outputLabel-view-label"/>
				</td>
				<td style="vertical-align: top;">
					<p:outputLabel rendered="#{viewApplHistoryBackingBean.managedBean.noDisciplinary}"
						value="#{lbl['lbl.sm.no.available']}" styleClass="outputLabel-view"/>
					<p:outputLabel rendered="#{viewApplHistoryBackingBean.managedBean.warning}" styleClass="outputLabel-view">
						<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.warning']}"/>
						<h:outputText value="," rendered="#{viewApplHistoryBackingBean.managedBean.warning and (viewApplHistoryBackingBean.managedBean.cancelCategoryCode || 
						viewApplHistoryBackingBean.managedBean.suspendRegistration || viewApplHistoryBackingBean.managedBean.cancelRegistration || viewApplHistoryBackingBean.managedBean.blacklistOwnerOrDirector ||
						viewApplHistoryBackingBean.managedBean.bumiputeraStatusCancel || viewApplHistoryBackingBean.managedBean.manufacturerStatusCancel)}"/>
					</p:outputLabel>
					
					<p:outputLabel rendered="#{viewApplHistoryBackingBean.managedBean.cancelCategoryCode}" styleClass="outputLabel-view">
						<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.cancel.cat.code']}"/>
						<h:outputText value="," rendered="#{viewApplHistoryBackingBean.managedBean.cancelCategoryCode and (viewApplHistoryBackingBean.managedBean.suspendRegistration || viewApplHistoryBackingBean.managedBean.cancelRegistration 
						|| viewApplHistoryBackingBean.managedBean.blacklistOwnerOrDirector ||
						viewApplHistoryBackingBean.managedBean.bumiputeraStatusCancel || viewApplHistoryBackingBean.managedBean.manufacturerStatusCancel)}"/>
					</p:outputLabel>
					
					<p:outputLabel rendered="#{viewApplHistoryBackingBean.managedBean.suspendRegistration}" styleClass="outputLabel-view">
						<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.suspend.registration']}"/>
						<h:outputText value="," rendered="#{viewApplHistoryBackingBean.managedBean.suspendRegistration and (viewApplHistoryBackingBean.managedBean.cancelRegistration || viewApplHistoryBackingBean.managedBean.blacklistOwnerOrDirector ||
						viewApplHistoryBackingBean.managedBean.bumiputeraStatusCancel || viewApplHistoryBackingBean.managedBean.manufacturerStatusCancel)}"/>
					</p:outputLabel>
					
					<p:outputLabel rendered="#{viewApplHistoryBackingBean.managedBean.cancelRegistration}" styleClass="outputLabel-view">
						<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.cancel.registration']}"/>
						<h:outputText value="," rendered="#{viewApplHistoryBackingBean.managedBean.cancelRegistration and (viewApplHistoryBackingBean.managedBean.blacklistOwnerOrDirector ||
						viewApplHistoryBackingBean.managedBean.bumiputeraStatusCancel || viewApplHistoryBackingBean.managedBean.manufacturerStatusCancel)}"/>
					</p:outputLabel>
					
					<p:outputLabel rendered="#{viewApplHistoryBackingBean.managedBean.blacklistOwnerOrDirector}" styleClass="outputLabel-view">
						<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.blacklist.owner']}"/>
						<h:outputText value="," rendered="#{viewApplHistoryBackingBean.managedBean.blacklistOwnerOrDirector and (viewApplHistoryBackingBean.managedBean.bumiputeraStatusCancel 
						|| viewApplHistoryBackingBean.managedBean.manufacturerStatusCancel)}"/>
					</p:outputLabel>
					
					<p:outputLabel rendered="#{viewApplHistoryBackingBean.managedBean.bumiputeraStatusCancel}" styleClass="outputLabel-view">
						<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.cancel.of.bumiputera']}"/>
						<h:outputText value="," rendered="#{viewApplHistoryBackingBean.managedBean.bumiputeraStatusCancel and viewApplHistoryBackingBean.managedBean.manufacturerStatusCancel}"/>
					</p:outputLabel>
					
					<p:outputLabel rendered="#{viewApplHistoryBackingBean.managedBean.manufacturerStatusCancel}" styleClass="outputLabel-view">
						<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.cancel.of.manufacturer']}"/>
					</p:outputLabel>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.disciplinary.jktt.start.date']}" styleClass="outputLabel-view-label"/>
				</td>
				<td>
					<p:outputLabel rendered="#{viewApplHistoryBackingBean.managedBean.noDisciplinary}"
						value="#{lbl['lbl.sm.no.available']}" styleClass="outputLabel-view"/>
					<p:outputLabel rendered="#{!viewApplHistoryBackingBean.managedBean.noDisciplinary}"
						value="#{viewApplHistoryBackingBean.managedBean.startDate}" styleClass="outputLabel-view"/>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.disciplinary.jktt.end.date']}" styleClass="outputLabel-view-label"/>
				</td>
				<td>
					<p:outputLabel rendered="#{viewApplHistoryBackingBean.managedBean.noDisciplinary}"
						value="#{lbl['lbl.sm.no.available']}" styleClass="outputLabel-view"/>
					<p:outputLabel rendered="#{!viewApplHistoryBackingBean.managedBean.noDisciplinary}"
						value="#{viewApplHistoryBackingBean.managedBean.endDate}" styleClass="outputLabel-view"/>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.disciplinary.jktt.remarks']}" styleClass="outputLabel-view-label"/>
				</td>
				<td>
					<p:outputLabel rendered="#{viewApplHistoryBackingBean.managedBean.noDisciplinary}"
						value="#{lbl['lbl.sm.no.available']}" styleClass="outputLabel-view"/>
					<p:outputLabel rendered="#{!viewApplHistoryBackingBean.managedBean.noDisciplinary}"
						value="#{viewApplHistoryBackingBean.managedBean.remarks}" styleClass="outputLabel-view"/>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.disciplinary.list.cancel.category.code']}" styleClass="outputLabel-view-label"/>
				</td>
				<td>
					<p:outputLabel rendered="#{empty viewApplHistoryBackingBean.managedBean.categoryCodeList}"
						value="#{lbl['lbl.sm.no.available']}" styleClass="outputLabel-view"/>
					<p:outputLabel rendered="#{not empty viewApplHistoryBackingBean.managedBean.categoryCodeList}" styleClass="outputLabel-view">
						<h:dataTable value="#{viewApplHistoryBackingBean.managedBean.categoryCodeList}"
							var="categoryCodeList" style="border: none !important;">
								<p:column style="border: none !important;">
									<h:outputText value="#{categoryCodeList.categoryCode}"/>
								</p:column>
						</h:dataTable>
					</p:outputLabel>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.disciplinary.list.of.ic.no.blacklist']}" styleClass="outputLabel-view-label"/>
				</td>
				<td>
					<p:outputLabel rendered="#{empty viewApplHistoryBackingBean.managedBean.blacklistownerDirectorList}"
						value="#{lbl['lbl.sm.no.available']}" styleClass="outputLabel-view"/>
					<p:outputLabel rendered="#{not empty viewApplHistoryBackingBean.managedBean.blacklistownerDirectorList}" styleClass="outputLabel-view">
						<h:dataTable value="#{viewApplHistoryBackingBean.managedBean.blacklistownerDirectorList}"
							var="blacklist" style="border: none !important;">
								<p:column style="border: none !important;">
									<h:outputText value="#{blacklist.icNo}"/>
								</p:column>
						</h:dataTable>
					</p:outputLabel>
				</td>
			</tr>
		</table>
	</p:panel>
	<ac:disciplinaryActionHistory voList="#{viewApplHistoryBackingBean.managedBean.disciplineVOs}" /> 
	<!-- 28237 - end -->
</ui:composition>
