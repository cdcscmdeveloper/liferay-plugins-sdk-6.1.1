<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.profBody.panHdr']}" toggleable="true">
		<p:panel id="profInfPan">
			<p:dataTable var="profBean" widgetVar="suppProfBodyDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smAssociationBodies}"
				rowKey="#{profBean}" rowIndexVar="index" id="profDt">
				
				<ac:paginator for="profDt" />
				
				<p:column headerText="#{lbl['lbl.sm.profBody.profBody']}">
					<h:outputText
						value="#{profBean.pmCertBody.certBodyId} - #{profBean.regNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.profBody.expDate']}">
					<ac:labelDate value="#{profBean.expDate}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink action="#{viewSmApplBackingBean.assignSelAssocBody(profBean)}" 
						oncomplete="profDialog.show()" partialSubmit="true" process="@this" update=":form:tt:profPop">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
				
		</p:panel>
		
		<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
				poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.assocBodyRemark}" 
				approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.assocBodyRemark}" />
				
	</p:panel>
	<p:dialog style="max-height:350px;width:500px"
		header="#{lbl['lbl.sm.profBody.profBodDiaHdr']}"
		widgetVar="profDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="profPop" closable="true">
		
		<p:scrollPanel mode="native" style="max-height:300px;width:450px;border:none">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.profBody.profBody']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocBody.pmCertBody.bodyName}" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.profBody.others']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocBody.otherAssociation}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.profBody.regNo']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocBody.regNo}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.profBody.expDate']}" /></td>
					<td>
						<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedAssocBody.expDate}" />
					</td>
				</tr>
			</table>
		</p:scrollPanel>
	</p:dialog>
</ui:composition>
