<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.profBody.panHdr']}" toggleable="true">
		<p:panel id="profInfPan">
			<p:dataTable var="profBean" widgetVar="suppProfBodyDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smAssociationBodies}"
				rowKey="#{profBean}" rowIndexVar="index" id="profDt">
				
				<ac:paginator for="profDt" />
				
				<p:column headerText="#{lbl['lbl.sm.profBody.profBody']}">
					<h:outputText
						value="#{profBean.pmCertBody.certBodyId} - #{profBean.regNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.profBody.expDate']}">
					<h:outputText value="#{profBean.expDate}">
						<f:convertDateTime type="date"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink action="#{viewSmApplBackingBean.assignSelAssocBody(profBean)}" 
						oncomplete="profDialog.show()" partialSubmit="true" process="@this" update=":form:tt:profPop">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		
			<br />
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
						<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.assocBodyRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
						<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.assocBodyRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']} :" /></td>
						<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.apprvrSecReview.assocBodyRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="390px"
		header="#{lbl['lbl.sm.profBody.profBodDiaHdr']}"
		widgetVar="profDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="profPop" closable="true">
		
		<table style="width: 100%">


			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.profBody.profBody']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocBody.pmCertBody.bodyName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.profBody.others']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocBody.otherAssociation}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.profBody.regNo']}" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedAssocBody.regNo}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.profBody.expDate']}" /></td>
				<td style="font-size: 12px;font-weight: normal;font-family: Arial">
					<h:outputText value="#{viewSmApplBackingBean.managedBean.selectedAssocBody.expDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</td>
			</tr>

		</table>
	</p:dialog>
</ui:composition>
