<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.store.details']}" toggleable="true" id="smStrDtPanel">

		<p:dataTable var="stor" widgetVar="smFacStoreDtWidVar"
			value="#{viewSmApplBackingBean.managedBean.applStoreFacilities}" rowKey="#{stor}" rowIndexVar="index" id="storeDt">
			<ac:paginator for="storeDt" />
			<p:column headerText="#{lbl['lbl.sm.store.name']}">
				<h:outputText value="#{stor.facilityName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.store.address']}">
				<h:outputText
					value="#{stor.smAddress.address1},#{stor.smAddress.address2},#{stor.smAddress.address3}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.action']}">
				<p:commandLink process="@this" partialSubmit="true"
					action="#{viewSmApplBackingBean.assignSelStore(stor)}" oncomplete="storeDialog.show()"
					update=":form:tt:storeDialog" style="padding-right:5px">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		<br />
	</p:panel>
	<p:dialog width="500px" height="500px" header="#{lbl['lbl.sm.store.information']}"
		widgetVar="storeDialog" resizable="false" showEffect="fade"
		closable="true" hideEffect="fade" modal="true" id="storeDialog">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.facilityType']} :" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.facilityType}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.name']} :" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.facilityName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.address']} :" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.address1}" /></td>
			</tr>

			<tr>
				<td></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.address2}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.address3}" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.address4}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.country']} :" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.pmCountry.countryName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.state']} :" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.pmState.stateName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.district']} :" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.pmDistrict.districtName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.towncity']} :" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.pmCity.cityName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.postcode']} :" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.postcode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']} :" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.phoneNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.faxno']} :" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.faxNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.area.feat']} :" /></td>
				<td>
					<ac:labelAmount value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.areaSquareFeet}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.facility.ownerType']} :" /></td>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.facility.own']}"
							rendered="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownershipType eq 'O'}" />
					<p:outputLabel value="#{lbl['lbl.sm.facility.rent']}"
						rendered="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownershipType eq 'R'}" />
				</td>
			</tr>
			<tr>
				<td><p:outputPanel id="storPanLbl">
						<p:outputLabel value="#{lbl['lbl.cm.price']}"
							rendered="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownershipType eq 'O'}" />
						<p:outputLabel value="#{lbl['lbl.sm.facility.rent.rm']}"
							rendered="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownershipType eq 'R'}" />
					</p:outputPanel></td>
				<td><p:outputPanel id="storPan">
						<ui:fragment
							rendered="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownershipType eq 'O'}">
							<ac:labelAmount value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.purchasePrice}" />
						</ui:fragment>
						<ui:fragment
							rendered="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownershipType eq 'R'}">
							<ac:labelAmount value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.rentalRate}" />
						</ui:fragment>
					</p:outputPanel></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.ownername']} :" /></td>
				<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownerName}" /></td>
			</tr>

		</table>
	</p:dialog>
</ui:composition>
