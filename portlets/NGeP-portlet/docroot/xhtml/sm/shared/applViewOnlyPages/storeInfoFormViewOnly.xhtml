<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.store.details']}" toggleable="true" id="smStrDtPanel">

		<p:dataTable var="stor" widgetVar="smFacStoreDtWidVar" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{viewSmApplBackingBean.managedBean.applStoreFacilities}" rowKey="#{stor}" rowIndexVar="index" id="storeDt">
			<ac:paginator for="storeDt" />
			<p:column headerText="#{lbl['lbl.sm.store.name']}">
				<h:outputText value="#{stor.facilityName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.category']}">
				<ui:repeat var="catFac" value="#{stor.smSupplierCategoryFacilities}">
					<h:outputText value="#{catFac.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}
								#{catFac.pmCategoryL3.pmCategoryL2.categoryL2Code}
								#{catFac.pmCategoryL3.categoryL3Code}
							 	(#{catFac.pmCategoryL3.categoryName})" 
						style="float: left;white-space: normal;" /><br />
				</ui:repeat>
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.store.address']}" style="width :60%;white-space : normal">
				<h:outputText value="#{viewSmApplBackingBean.getFullAddress(stor.smAddress)}"
					style="float : left" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.action']}" style="text-align: center  !important;">
				<p:commandLink process="@this" partialSubmit="true" onstart="blockWidget.show()"
					action="#{viewSmApplBackingBean.assignSelStore(stor)}" oncomplete="storeDialog.show()"
					update=":form:tt:storeDialog" style="padding-right:5px">
					<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		
	</p:panel>
	<p:dialog style="max-height:450px;width:500px" header="#{lbl['lbl.sm.store.information']}"
		widgetVar="storeDialog" resizable="false" showEffect="fade"
		closable="true" hideEffect="fade" modal="true" id="storeDialog">
		
		<p:scrollPanel mode="native" style="max-height:400px;width:450px;border:none">
			<table style="width: 100%;table-layout:fixed">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.facilityType']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.facilityType}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.name']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.facilityName}" /></td>
				</tr>
				<tr>
					<td style="vertical-align: baseline;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.category']}" /></td>
					<td>
						<ui:repeat var="catFac" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smSupplierCategoryFacilities}">
							<p:outputLabel value="#{catFac.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}
										#{catFac.pmCategoryL3.pmCategoryL2.categoryL2Code}
										#{catFac.pmCategoryL3.categoryL3Code}
									 	(#{catFac.pmCategoryL3.categoryName})" 
								styleClass="outputLabel-view" /><br />
						</ui:repeat>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.address']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.address1}" /></td>
				</tr>
	
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.address2}" /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.address3}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.pmCountry.countryName}" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.pmState.stateName}" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.pmDistrict.districtName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.pmCity.cityName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.smAddress.postcode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.phoneFull}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.faxno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.faxFull}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sc.spec.area.feat']}" /></td>
					<td>
						<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.areaSquareFeet}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.ownerType']}" /></td>
					<td>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.own']}"
								rendered="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownershipType eq 'O'}" />
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.rent']}"
							rendered="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownershipType eq 'R'}" />
					</td>
				</tr>
				<tr>
					<td><p:outputPanel id="storPanLbl">
							<p:outputLabel value="#{lbl['lbl.cm.price']}" styleClass="outputLabel-view-label"
								rendered="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownershipType eq 'O'}" />
							<p:outputLabel value="#{lbl['lbl.sm.facility.rent.rm']}" styleClass="outputLabel-view-label"
								rendered="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownershipType eq 'R'}" />
						</p:outputPanel></td>
					<td><p:outputPanel id="storPan">
							<ui:fragment
								rendered="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownershipType eq 'O'}">
								<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.purchasePrice}" />
							</ui:fragment>
							<ui:fragment
								rendered="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownershipType eq 'R'}">
								<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.rentalRate}" />
							</ui:fragment>
						</p:outputPanel></td>
				</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.ownername']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedStoreFacility.ownerName}" /></td>
				</tr>
	
			</table>
		</p:scrollPanel>
	</p:dialog>
</ui:composition>
