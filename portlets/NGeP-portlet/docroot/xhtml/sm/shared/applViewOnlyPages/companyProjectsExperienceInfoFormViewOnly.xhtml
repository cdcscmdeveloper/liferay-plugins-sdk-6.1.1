<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:fragment
		rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq 'J' and viewSmApplBackingBean.getAppVersionDetailsWithRedmineNo()}">
		<ui:include src="consultantProjectsExperienceInfoFormViewOnly.xhtml" />
	</ui:fragment>
	<ui:fragment
		rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq 'K' and viewSmApplBackingBean.getAppVersionDetailsWithRedmineNo()}">
		<ui:include src="contractorProjectsExperienceInfoFormViewOnly.xhtml" />
	</ui:fragment>
	<c:if
		test="#{fn:containsIgnoreCase(requestScope['javax.servlet.forward.request_uri'], 'supplier-profile')}">
		<ui:fragment
			rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq 'J' and !viewSmApplBackingBean.getAppVersionDetailsWithRedmineNo()}">
			<ui:include
				src="consultantProjectsExperienceInfoFormNewVersionViewOnly.xhtml" />
		</ui:fragment>
		<ui:fragment
			rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq 'K' and !viewSmApplBackingBean.getAppVersionDetailsWithRedmineNo()}">
			<ui:include
				src="contractorProjectsExperienceInfoFormNewVersionViewOnly.xhtml" />
		</ui:fragment>
	</c:if>
	<c:if
		test="#{fn:containsIgnoreCase(requestScope['javax.servlet.forward.request_uri'], 'application-history')}">
		<p:panel header="#{lbl['lbl.sm.projDtls.panHdr']}" toggleable="true">
			<h:outputText
				rendered="#{viewSmApplBackingBean.managedBean.supplierUser}"
				value="#{lbl['lbl.sm.comp.exp.new.version.application.status.supplier']}" />
			<h:outputText
				rendered="#{viewSmApplBackingBean.managedBean.approverUser or viewSmApplBackingBean.managedBean.poUser}"
				value="#{lbl['lbl.sm.comp.exp.new.version.application.status.ups']}" />
		</p:panel>
	</c:if>
</ui:composition>
