<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.panHdr.offFacility']}" id="ofp"
		toggleable="true">
		<p:panel id="offInfPan">
			<table style="width: 100%">

				<tr>
					<td width="134px;"><p:outputLabel value="#{lbl['lbl.sm.facility.ownerType']} :" /></td>
					<td style="float:left;">
						<p:outputLabel value="#{lbl['lbl.sm.facility.own']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownershipType eq 'O'}"/>
						<p:outputLabel value="#{lbl['lbl.sm.facility.rent']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownershipType eq 'R'}"/>
					</td>
				</tr>
				<c:if test="#{backingBean.managedBean.basicCompanyFacility.ownershipType eq 'R'}">
					<tr>
						<td width="134px;">
							<p:outputLabel value="#{lbl['lbl.sm.facility.facilityType']} :" />
						</td>
						<td style="float:left;">
							<p:outputLabel value="#{lbl['lbl.sm.facility.facilityType.home.office']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.facilityType eq 'H'}"/>
							<p:outputLabel value="#{lbl['lbl.sm.facility.facilityType.business.office']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.facilityType eq 'B'}" />
						</td>
					</tr>
					<tr>
						<td style="width: 14%">
							<p:outputLabel value="#{lbl['lbl.sm.facility.landLordName']} :" /> 
						</td>
						<td style="float:left;">
							<p:outputLabel value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownerName}" />
						</td>
						<td>
							<p:outputLabel value="#{lbl['lbl.sm.facility.monthRent']} :" />
						</td>
						<td style="font-size: 12px;font-weight: normal;font-family: Arial">
						    <ac:labelAmount value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.rentalRate}" />
						</td>
					</tr>
					<tr>
						<td style="vertical-align: top;">
							<p:outputLabel	value="#{lbl['lbl.sm.companyaddress']}"	style="padding-top :5px;" />
						</td>
						<td>
							<table style="width: 100%">
								<tr>
									<td style="float:left;">
										<p:outputLabel value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.address1}" />
									</td>
								</tr>
								<tr>
									<td style="float:left;">
										<p:outputLabel value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.address2}" />
									</td>
								</tr>
								<tr>
									<td style="float:left;">
										<p:outputLabel value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.address3}" />
									</td>
								</tr>
								<tr>
									<td style="float:left;">
										<p:outputLabel value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.address4}" />
									</td>
								</tr>
							</table>
						</td>
						<td>
							<TABLE style="width: 100%; height: 100px;">
								<tr>
									<td>
										<p:outputLabel value="#{lbl['lbl.sm.country']} :" />
									</td>
								</tr>
								<tr>

									<td>
										<p:outputLabel value="#{lbl['lbl.sm.state']} :" />
									</td>
								</tr>
								<tr>
									<td>
										<p:outputLabel value="#{lbl['lbl.sm.district']} :" />
									</td>
								</tr>
								<tr>
									<td>
										<p:outputLabel value="#{lbl['lbl.sm.towncity']} :" />
									</td>
								</tr>
							</TABLE>
						</td>
						<td>
							<TABLE style="width: 100%">
								<tr>
									<td style="float:left;">
										<p:outputLabel value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.pmCountry.countryName}"/>
									</td>
								</tr>
								<tr>

									<td style="float:left;">
										<p:outputLabel value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.pmState.stateName}"/>
									</td>
								</tr>
								<tr>
									<td style="float:left;">
										<p:outputLabel value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.pmDistrict.districtName}"/>
									</td>

								</tr>
								<tr>
									<td style="float:left;">
										<p:outputLabel value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.pmCity.cityName}"/>
									</td>
								</tr>
							</TABLE>
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.postcode']} :" /></td>
						<td style="float:left;">
							<p:outputLabel value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.postcode}" />
						</td>
					</tr>
					</c:if>
					
					<c:if test="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownershipType eq 'O'}">
					<tr>
						<td width="134px;"><p:outputLabel value="#{lbl['lbl.sm.facility.facilityType']} :" /></td>
						<td style="float:left;">
							<p:outputLabel value="#{lbl['lbl.sm.facility.facilityType.home.office']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.facilityType eq 'H'}"/>
							<p:outputLabel value="#{lbl['lbl.sm.facility.facilityType.business.office']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.facilityType eq 'B'}" />
						</td>

					</tr>
					<tr>
						<td width="134px;"><p:outputLabel value="#{lbl['lbl.sm.facility.ownerName']} :" /></td>
						<td style="float:left;">
							<p:outputLabel value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownerName}"/>
						</td>
					</tr>
					<tr>
						<td width="134px;"><p:outputLabel value="#{lbl['lbl.sm.facility.purchaseDate']} :" /></td>
						<td style="font-size: 12px;font-weight: normal;font-family: Arial">
							<ac:labelDate value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.purchaseDate}" />
						</td>
					</tr>
					<tr>
						<td width="134px;"><p:outputLabel value="#{lbl['lbl.sm.facility.purchasePrice']} :" /></td>
						<td style="font-size: 12px;font-weight: normal;font-family: Arial">
							<ac:labelAmount value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.purchasePrice}" />
						</td>
					</tr>
					</c:if>
					
					<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.poUser}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.officeFacilityRemark}" /></td>
						</tr>
					</p:outputPanel>
					<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.officeFacilityRemark}" /></td>
							<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']} :" /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.apprvrSecReview.officeFacilityRemark}" /></td>
						</tr>
					</p:outputPanel>
				</table>
		</p:panel>
	</p:panel>
</ui:composition>
