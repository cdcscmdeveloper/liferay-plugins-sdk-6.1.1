	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"

	<p:panel header="#{lbl['lbl.sm.panHdr.offFacility']}" id="ofp"
		toggleable="true">
		<p:outputPanel id="offInfPan" layout="block">
			<table style="width: 100%;table-layout:fixed">

				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.ownerType']}" /></td>
					<td>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.own']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownershipType eq 'O'}"/>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.rent']}" rendered="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownershipType eq 'R'}"/>
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAppl.hqFacility.ownershipType}" 
							currValue="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownershipType}"

								oriValue="#{viewSmApplBackingBean.managedBean.latestAppl.hqFacility.ownerName}" 
								currValue="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.ownerName}"

								isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges}"

								alertValue="#{viewSmApplBackingBean.getCityLabelById(viewSmApplBackingBean.managedBean.latestAppl.hqFacility.smAddress.pmCity.cityId)}"/></td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.smAddress.postcode}" />

								isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges}"

					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.purchaseDate']}" /></td>
						<td><ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.purchaseDate}" />
							<ac:smFieldChangeAlertView 
									isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges}"
									oriValue="#{viewSmApplBackingBean.managedBean.latestAppl.hqFacility.purchaseDate}" 
									currValue="#{viewSmApplBackingBean.managedBean.basicCompanyFacility.purchaseDate}" 
									alertValue="#{viewSmApplBackingBean.getDateFormat(viewSmApplBackingBean.managedBean.latestAppl.hqFacility.purchaseDate)}"/></td>
