<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<h:panelGroup id="idvPanGrp">
	<p:panel header="#{lbl['lbl.sm.ind.reg.info.hdr']}" toggleable="true"
		id="idvHdPan">
		<p:outputPanel id="idvInfPan" layout="block">
			<table style="width: 100%;table-layout:fixed">
				<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.viewSupplierProfile}">
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.ep.no']}" /></td>
						<td>
							<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smSupplier.epNo}" />
						</td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.created.date']}" /></td>
						<td>
							<p:outputPanel>
								<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smSupplier.createdDate}" />
							</p:outputPanel>
						</td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.sap.vendor.code']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.sapVendorCode}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.company.type']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.supplierBusinessTypeVal}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.individual.service']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.serviceCodeName}" /></td>
						<td></td>
						<td></td>
					</tr>
				</p:outputPanel>				
			</table>				
		</p:outputPanel>
	</p:panel>	
	<p:panel header="#{lbl['lbl.sm.bank.info.hdr']}" toggleable="true"
		id="bankInfHdPan">
		<p:outputPanel id="bankInfPan" layout="block">
				<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.viewSupplierProfile}">
					<p:dataTable var="bankBean" widgetVar="suppBankInfoDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smSupplierBankList}"
				rowKey="#{bankBean}" rowIndexVar="index" id="bankDt">
				<ac:paginator for="bankDt" />
				<p:column headerText="#{lbl['lbl.sm.bankDtls.bankName']}">
					<h:outputText value="#{bankBean.pmFinancialOrg.finOrgName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.bank.account.no']}">
					<h:outputText value="#{bankBean.accountNo}" />
				</p:column>				
				<p:column headerText="#{lbl['lbl.sm.bank.status']}">
				<h:outputText value="#{bankBean.recordStatus ? lbl['lbl.txt.active'] : lbl['lbl.txt.inactive']}" />				
				</p:column>
				</p:dataTable>
				</p:outputPanel>			
		</p:outputPanel>
	</p:panel>
	<p:panel header="#{lbl['lbl.sm.supp.admin.info.hdr']}" toggleable="true"
		id="suppAdmInfHdPan">
		<p:outputPanel id="suppAdmInfPan" layout="block">
			<table style="width: 100%;table-layout:fixed">
				<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.viewSupplierProfile}">
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.ind.full.name']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{!viewSmApplBackingBean.managedBean.smAppl.smPersonnels.isEmpty() ? 
						viewSmApplBackingBean.managedBean.smAppl.smPersonnels.get(0).name : ''}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.individual.newicno']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{!viewSmApplBackingBean.managedBean.smAppl.smPersonnels.isEmpty() ? 
						viewSmApplBackingBean.managedBean.smAppl.smPersonnels.get(0).identificationNo : ''}" /></td>
					</tr>
					<tr>	
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.religion']}" /></td>
						<td>
						<p:outputLabel styleClass="outputLabel-view" value="#{!viewSmApplBackingBean.managedBean.smAppl.smPersonnels.isEmpty() ? 
						(viewSmApplBackingBean.managedBean.smAppl.smPersonnels.get(0).isMuslim().booleanValue() ? lbl['lbl.sm.person.religion.muslim'] : 
						lbl['lbl.sm.person.religion.non.muslim']) : ''}" />
						</td>	
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.dob']}" /></td>
						<td>
							<p:outputPanel>
								<ac:labelDate styleClass="outputLabel-view" value="#{!viewSmApplBackingBean.managedBean.smAppl.smPersonnels.isEmpty() ? 
								viewSmApplBackingBean.managedBean.smAppl.smPersonnels.get(0).birthDate : ''}" />
							</p:outputPanel>
						</td>						
					</tr>
					<tr>						
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.bumi']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{!viewSmApplBackingBean.managedBean.smAppl.smPersonnels.isEmpty() ? 
						(viewSmApplBackingBean.managedBean.smAppl.smPersonnels.get(0).isBumi().booleanValue() ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']) 
						: ''}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.telno']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{!viewSmApplBackingBean.managedBean.smAppl.smPersonnels.isEmpty() ? 
						viewSmApplBackingBean.managedBean.smAppl.smPersonnels.get(0).phoneFull : ''}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.email']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{!viewSmApplBackingBean.managedBean.smAppl.smPersonnels.isEmpty() ? 
						viewSmApplBackingBean.managedBean.smAppl.smPersonnels.get(0).email : ''}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mobilenumber']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{!viewSmApplBackingBean.managedBean.smAppl.smPersonnels.isEmpty() ? 
						viewSmApplBackingBean.managedBean.smAppl.smPersonnels.get(0).mobileFull : ''}" /></td>
					</tr>
				</p:outputPanel>
			</table>				
		</p:outputPanel>
	</p:panel>
	<ui:include src="authorizedPersonnelFormViewOnly.xhtml" />
	<ui:include src="personnelAddressFormViewOnly.xhtml" />
	</h:panelGroup>
</ui:composition>
