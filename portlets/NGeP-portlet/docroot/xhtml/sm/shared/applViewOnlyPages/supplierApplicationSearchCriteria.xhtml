<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<table style="width: 100%">
			<p:outputPanel rendered="#{viewSuppProfileBackingBean.managedBean.supplierUser}">
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.companyname']}" />
					</td>
					<td>
						<p:inputText label="#{lbl['lbl.sm.companyname']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.companyName}"
							size="40" disabled="true"/>
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.rocNo']}" />
					</td>
					<td>
						<p:inputText label="#{lbl['lbl.sm.rocNo']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.regNo}"
							size="35" disabled="true"/>
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.ep.no']}" />
					</td>
					<td>
						<p:inputText label="#{lbl['lbl.sm.ep.no']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.epNo}"
							size="35" disabled="true"/>
					</td>
				</tr>
			</p:outputPanel>
			<p:outputPanel rendered="#{!viewSuppProfileBackingBean.managedBean.supplierUser}">
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.complaint.search.by']}" /> 
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td>
						<p:selectOneRadio id="searchById" required="false"
							value="#{viewSuppProfileBackingBean.managedBean.searchBy}" >
							<f:selectItem itemLabel="#{lbl['lbl.sm.companyname']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.rocNo']}" itemValue="2" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.ep.no']}" itemValue="3" />
							<p:ajax update="searchSupplierProfilePanelId" event="change" process="@this" listener="#{viewSuppProfileBackingBean.onChangeSearchBy}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
						</p:selectOneRadio>
					</td>
				</tr>
				<p:outputPanel rendered="#{viewSuppProfileBackingBean.managedBean.searchBy eq 1}">
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.sm.companyname']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</td>
						<td>
							<p:inputText id="companyNameId"
								label="#{lbl['lbl.sm.companyname']}"
								value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.companyName}"
								size="40" maxlength="100" required="true"  />
							<p:message id="companyNameIdMsg" for="companyNameId"
								showSummary="true" showDetail="false" display="icon" />
						</td>
					</tr>
				</p:outputPanel>
				<p:outputPanel rendered="#{viewSuppProfileBackingBean.managedBean.searchBy eq 2}">
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.sm.rocNo']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</td>
						<td>
							<p:inputText id="regNoId"
								label="#{lbl['lbl.sm.rocNo']}"
								value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.regNo}"
								size="35" maxlength="20" required="true"  />
							<p:message id="regNoIdMsg" for="regNoId"
								showSummary="true" showDetail="false" display="icon" />
						</td>
					</tr>
				</p:outputPanel>
				<p:outputPanel rendered="#{viewSuppProfileBackingBean.managedBean.searchBy eq 3}">
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.sm.ep.no']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</td>
						<td>
							<p:inputText id="epNoId"
								label="#{lbl['lbl.sm.ep.no']}"
								value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.epNo}"
								size="35" maxlength="12" required="true"  />
							<p:message id="epNoIdMsg" for="epNoId"
								showSummary="true" showDetail="false" display="icon" />
						</td>
					</tr>
				</p:outputPanel>
				<p:outputPanel rendered="#{viewSuppProfileBackingBean.managedBean.searchBy eq 1 
							or viewSuppProfileBackingBean.managedBean.searchBy eq 2 or viewSuppProfileBackingBean.managedBean.searchBy eq 3}">
					<tr>
						<td colspan="2">
							<div style="text-align: right;">
								<p:commandButton value="#{lbl['lbl.btn.search']}" 
									action="#{viewSuppProfileBackingBean.managedBean.searchSupplier}"
									update="searchSupplierProfilePanelId" 
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
								</p:commandButton>
								<p:commandButton value="#{lbl['lbl.btn.reset']}" 
									action="#{viewSuppProfileBackingBean.resetSearch}"
									update="searchSupplierProfilePanelId">
								</p:commandButton>
							</div>
						</td>
					</tr>
				</p:outputPanel>
			</p:outputPanel>
		</table>
		
		<br />
	
</ui:composition>
