<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<table style="width: 100%">
			<tr>
				<td style="text-align: left;">
					<p:commandButton value="#{lbl['lbl.btn.back']}" rendered="#{viewSmApplBackingBean.managedBean.renderedBackButton}"
						action="#{viewSmApplBackingBean.backToSearch}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
					</p:commandButton>
				</td>
				<td style="text-align: right;">
					<h:outputLink value="#{viewSmApplBackingBean.managedBean.portletUrl}" target="_blank" >
						<p:outputLabel value="#{viewSmApplBackingBean.managedBean.portletUrlLabel}" />
						<f:param name="supplierId" value="#{viewSmApplBackingBean.managedBean.supplierIdParam}"/>
					</h:outputLink>
				</td>
			</tr>
		</table>
		<br />
	
</ui:composition>
