<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<table style="width: 100%">
			<tr>
				<td style="text-align: left;">
					<p:commandButton value="#{lbl['lbl.btn.back']}" rendered="#{viewSmApplBackingBean.managedBean.renderedBackButton}"
						action="#{viewSmApplBackingBean.backToSearch}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
					</p:commandButton>
				</td>
			<td style="text-align: right;">
			<!-- #31248 - SupplierMgmtConst.pmStatusDeletePendingApplContractor -->
				<!-- #28212 --> <p:outputPanel
					rendered="#{not empty viewSmApplBackingBean.managedBean.resubmitUrl 
					and viewSmApplBackingBean.managedBean.supplierUser 
					and viewSmApplBackingBean.managedBean.displayResubmitButton}"> <!-- #32628 -->
					<!-- START 29823 -->
					<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.smAppl.applType eq 'N'}">
					<!-- START - 31270 -->
					<p:commandLink onclick="blockWidget.show()" rendered="#{viewSmApplBackingBean.isApplPORejectedAfterApprovelSV()}"
							action="#{viewSmApplBackingBean.reminderToResubmit()}"
							process="@this" update=":form"
							value="#{lbl['lbl.sm.resubmit']}" />&#160;&#160;
				</p:outputPanel>
				<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.smAppl.applType ne 'N'}">
					<p:commandLink onclick="blockWidget.show()" rendered="#{viewSmApplBackingBean.isApplPORejectedAfterApprovelSV()}"
							action="#{viewSmApplBackingBean.reminderToResubmit()}"
							process="@this" update=":form"
							value="#{lbl['lbl.sm.resubmit']}" />&#160;&#160;
				</p:outputPanel>
				<!-- END - 31270 -->			
				<!-- END 29823 -->
					</p:outputPanel> 
				<!-- 31269 - start -->
				<p:commandLink value="#{lbl['lbl.sm.view.ssm.infomation']}"
					rendered="#{!viewSmApplBackingBean.managedBean.supplierUser
							and viewSmApplBackingBean.managedBean.viewApplicationHistory
							and viewSmApplBackingBean.renderViewSSMInfo()}"
					action="#{backingBean.redirectToViewSSMInfo(viewSmApplBackingBean.managedBean.smAppl)}"	
					update=":form" process="@this"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />&#160;&#160;
				<!-- 31269 - end -->
				<p:commandLink onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					rendered="#{viewSmApplBackingBean.managedBean.smSupplier.smAppl.supplierType eq 'J' 
						or viewSmApplBackingBean.managedBean.smSupplier.smAppl.supplierType eq 'K'}"
					action="#{viewSmApplBackingBean.redirectToSupplierProfileOrHistoryPage()}"
					process="@this" partialSubmit="true" update=":form"
					value="#{viewSmApplBackingBean.managedBean.portletUrlLabel}" />&#160;&#160;
				<p:commandLink value="#{lbl['lbl.btn.print']}" ajax="false">
					<p:fileDownload
						value="#{viewSmApplBackingBean.printSupplierProfile()}" />
				</p:commandLink>
			</td>
		</tr>
		</table>
		
		<p:confirmDialog id="confirmDialog" closable="true"
			message="#{lbl['lbl.sm.resubmit.url.expired.inprogress.msg']}"
			header="#{lbl['lbl.sm.resubmit.url.expired.inprogress.header']}" severity="alert"
			widgetVar="confirmDialog">
			<div align="right"> <!-- # 29956 Start -->
				<p:commandButton value="#{lbl['lbl.btn.ok']}" onclick="confirmDialog.hide();" update="@form"
					action="#{viewSmApplBackingBean.redirectToReapplyNewAppl(false)}" process="@this" partialSubmit="true"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" onclick="confirmDialog.hide();" />
			</div><!-- # 29956 Start -->
	
		</p:confirmDialog>
		<!-- START - 31270 -->
		<p:confirmDialog id="reminderConfirmDialog" closable="false"
		header="#{lbl['lbl.sm.resubmit.reminder.header']}" severity="alert"
		widgetVar="reminderConfirmDialog">
		
		<f:facet name="message">
			    	<h:outputText value="#{lbl['lbl.sm.resubmit.reminder.msg']}" escape="false"/>
		    </f:facet>
	    
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.yes']}"
				onclick="reminderConfirmDialog.hide()"
				onstart="blockWidget.show()"
				oncomplete="blockWidget.hide()"
				partialSubmit="true"
				process="@this" action="#{viewSmApplBackingBean.redirectToResubmit()}"
				update="@form"/>
			<p:commandButton value="#{lbl['lbl.btn.no']}"
				onclick="reminderConfirmDialog.hide()" type="button" />
		</div>
		</p:confirmDialog>
		<!-- END - 31270 -->
		<!-- START 27951 -->
		<ac:smOwnerSsmPopup bBean="#{viewSmApplBackingBean}" title="#{lbl['lbl.sm.term.and.condition.header']}" dialogId="ownerChecking" 
				btnOkLabel="#{lbl['lbl.btn.change']}" 
				btnCancelLabel="#{lbl['lbl.btn.cancel']}"/>
		<!-- END 27951 -->
		<!-- #31269 -->
		<ac:viewSsmInformation bBean="#{backingBean}" dialogId="viewssminfoDlg" />
	
</ui:composition>
