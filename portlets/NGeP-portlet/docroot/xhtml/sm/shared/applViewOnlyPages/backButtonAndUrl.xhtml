<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<table style="width: 100%">
			<tr>
				<td style="text-align: left;">
					<p:commandButton value="#{lbl['lbl.btn.back']}" rendered="#{viewSmApplBackingBean.managedBean.renderedBackButton}"
						action="#{viewSmApplBackingBean.backToSearch}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
					</p:commandButton>
				</td>
				<td style="text-align: right;">
					<p:outputPanel rendered="#{not empty viewSmApplBackingBean.managedBean.resubmitUrl and viewSmApplBackingBean.managedBean.supplierUser}">
						<p:commandLink onclick="blockWidget.show()"
							action="#{viewSmApplBackingBean.redirectToResubmit()}" 
							process="@this" partialSubmit="true" update=":form" 
							value="#{lbl['lbl.sm.resubmit']}"/>&#160;&#160;
					</p:outputPanel>
					<p:commandLink onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
						action="#{viewSmApplBackingBean.redirectToSupplierProfileOrHistoryPage()}" 
						process="@this" partialSubmit="true" update=":form" 
						value="#{viewSmApplBackingBean.managedBean.portletUrlLabel}"/>&#160;&#160;
					<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.viewApplicationHistory}">
						<p:commandLink onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
							action="#{viewSmApplBackingBean.redirectToTrackingDiary()}" 
							process="@this" partialSubmit="true" update=":form" 
							value="#{lbl['lbl.td.tracking.diary']}"/>&#160;&#160;
					</p:outputPanel>
					<p:commandLink value="#{lbl['lbl.btn.print']}" ajax="false">
						<p:fileDownload value="#{viewSmApplBackingBean.printSupplierProfile()}" />
					</p:commandLink>
				</td>
			</tr>
		</table>
	
</ui:composition>
