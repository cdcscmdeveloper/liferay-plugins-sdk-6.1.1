<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.catCodes.panHdr']}" toggleable="true">
		<p:outputPanel id="catCodeInfPan" layout="block">
			<p:dataTable var="catBean" widgetVar="smCatCodesNonRenewApplDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.activeCategoryList}"
				rowKey="#{catBean}" rowIndexVar="index" id="catDt"
				rendered="#{viewSmApplBackingBean.managedBean.smAppl.applType ne 'R'}">
				<ac:paginator for="catDt" />
				
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 2%;">
					<p:outputLabel value="#{index + 1}"
						style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.cate']}" style="width : 40%;">
					<p:outputPanel rendered="#{not empty catBean.pmCategoryL1}">
						<h:outputText value="#{catBean.pmCategoryL1.categoryL1Code} -  #{empty catBean.categoryL1Name ? catBean.pmCategoryL1.categoryName : catBean.categoryL1Name}" 
							style="float: left;white-space: normal;" /><br />
					</p:outputPanel>
					<p:outputPanel rendered="#{not empty catBean.pmCategoryL2}">
						<h:outputText value="#{catBean.pmCategoryL2.categoryL2Code} -  #{empty catBean.categoryL2Name ? catBean.pmCategoryL2.categoryName : catBean.categoryL2Name}" 
							style="float: left;white-space: normal;" /><br />
					</p:outputPanel>
					<p:outputPanel rendered="#{not empty catBean.pmCategoryL3}">
						<h:outputText value="#{catBean.pmCategoryL3.categoryL3Code} -  #{empty catBean.categoryL3Name ? catBean.pmCategoryL3.categoryName : catBean.categoryL3Name}" style="float: left;white-space: normal;" />
					</p:outputPanel>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}" >
					<h:outputText value="#{catBean.otherDesc}" rendered="#{catBean.pmCategoryL3.categoryL3Code eq 99}" style="float: left;white-space: normal;"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}">
					<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
						rendered="#{!catBean.specialCategory}" style="float: left;white-space: normal;" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
						rendered="#{catBean.specialCategory}" style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.status']}" rendered="#{!viewSmApplBackingBean.managedBean.previousApproved}">
					<h:outputText value="#{lbl['lbl.sm.catCodes.pendingDec']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}" style="float: left;white-space: normal;" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" style="float: left;white-space: normal;" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.catCodes.poAct']}"
					rendered="#{viewSmApplBackingBean.managedBean.previousApproved}">

					<p:selectOneRadio layout="pageDirection" id="catPoAppr"
						value="#{catBean.poDecFlg}" disabled="true"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
					</p:selectOneRadio>
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBean.poDecFlg eq 1}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.rejected']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBean.poDecFlg eq 0}" />
				</p:column> 
				
				<p:column headerText="#{lbl['lbl.sm.catCodes.remark']}" style="width : 25%;word-break:break-all;" rendered="#{viewSmApplBackingBean.managedBean.previousApproved}">
					<h:outputText value="#{catBean.poRemarks}" style="float: left;white-space: normal;"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.appAct']}" rendered="#{viewSmApplBackingBean.managedBean.previousApproved}">
					<p:selectOneRadio layout="pageDirection" id="catApprvrAppr"
						value="#{catBean.apprvrDecFlg}" disabled="true"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
					</p:selectOneRadio>
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.remark']}" style="width : 25%;word-break:break-all;" rendered="#{viewSmApplBackingBean.managedBean.previousApproved}">
					<h:outputText value="#{catBean.approverRemarks}" style="float: left;white-space: normal;"/>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			
			
			<p:dataTable var="catBeanR" widgetVar="smCatCodesRenewApplDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.activeCategoryList}"
				rowKey="#{catBeanR}" rowIndexVar="index" id="catDtR"
				rendered="#{viewSmApplBackingBean.managedBean.smAppl.applType eq 'R'}">
				<ac:paginator for="catDtR" />
				
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 2%;">
					<p:outputLabel value="#{index + 1}"
						style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.cate']}" style="width : 40%;">
					<p:outputPanel rendered="#{not empty catBeanR.pmCategoryL1}">
						<h:outputText value="#{catBeanR.pmCategoryL1.categoryL1Code} -  #{empty catBeanR.categoryL1Name ? catBeanR.pmCategoryL1.categoryName : catBeanR.categoryL1Name}" 
							style="float: left;white-space: normal;"/><br />
					</p:outputPanel>
					<p:outputPanel rendered="#{not empty catBeanR.pmCategoryL2}">
						<h:outputText value="#{catBeanR.pmCategoryL2.categoryL2Code} -  #{empty catBeanR.categoryL2Name ? catBeanR.pmCategoryL2.categoryName : catBeanR.categoryL2Name}" 
							style="float: left;white-space: normal;"/><br />
					</p:outputPanel>
					<p:outputPanel rendered="#{not empty catBeanR.pmCategoryL3}">
						<h:outputText value="#{catBeanR.pmCategoryL3.categoryL3Code} -  #{empty catBeanR.categoryL3Name ? catBeanR.pmCategoryL3.categoryName : catBeanR.categoryL3Name}" 
							style="float: left;white-space: normal;"/>
					</p:outputPanel>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}">
					<h:outputText value="#{catBeanR.otherDesc}"
						rendered="#{catBeanR.pmCategoryL3.categoryL3Code eq 99}" style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}" >
					<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
						rendered="#{!catBeanR.specialCategory}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
						rendered="#{catBeanR.specialCategory}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.status']}"
					rendered="#{!viewSmApplBackingBean.managedBean.previousApproved}">
					<h:outputText value="#{lbl['lbl.sm.catCodes.pendingDec']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.catCodes.poAct']}"
					rendered="#{viewSmApplBackingBean.managedBean.previousApproved}">
					<p:selectOneRadio layout="pageDirection" id="catPoApprR"
						value="#{catBeanR.poDecFlg}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
					</p:selectOneRadio>
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBeanR.poDecFlg eq 1}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.rejected']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBeanR.poDecFlg eq 0}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.catCodes.remark']}" style="width : 25%;word-break:break-all;" rendered="#{viewSmApplBackingBean.managedBean.poUser}">
					<h:outputText value="#{catBeanR.poRemarks}" style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.appAct']}" rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
					<p:selectOneRadio layout="pageDirection" id="catApprvrAppr"
						value="#{catBeanR.apprvrDecFlg}" disabled="true"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
					</p:selectOneRadio>
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.catCodes.remark']}" style="width : 25%;word-break:break-all;" rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
					<h:outputText value="#{catBeanR.approverRemarks}" style="float: left;white-space: normal;" />
				</p:column>
			</p:dataTable>
			
		</p:outputPanel>
		
		<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
						poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.categoryRemark}" 
						approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.categoryRemark}" />
						
	</p:panel>
	
</ui:composition>
