<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.catCodes.panHdr']}" toggleable="true">
		<p:panel id="catCodeInfPan">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.catCodes.catType']} :" /></td>
					<td>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.catCodes.norm']}" rendered="#{viewSmApplBackingBean.managedBean.smAppl.applCategoryType eq 'N'}"/>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.catCodes.spl']}" rendered="#{viewSmApplBackingBean.managedBean.smAppl.applCategoryType eq 'S'}"/>
					</td>
				</tr>
			</table>
			<p:spacer height="2px;" />
			<table>
				<tr>
					<td align="left" colspan="2"><h:outputText
							value="#{viewSmApplBackingBean.managedBean.catTypeConfirm}"
							rendered="#{viewSmApplBackingBean.managedBean.smAppl.applCategoryType != null}"
							style="color: blue; font-weight: bold;" /></td>

				</tr>
			</table>

			<br />
				
			<p:dataTable var="catBean" widgetVar="smCatCodesNonRenewApplDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplierCategories}"
				rowKey="#{catBean}" rowIndexVar="index" id="catDt"
				rendered="#{!(viewSmApplBackingBean.managedBean.smAppl.applType == 'R')}">
				<ac:paginator for="catDt" />
				<p:columnGroup type="header">
					<p:row>
						<p:column headerText="#{lbl['lbl.sm.catCodes.cate']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}" />
						<p:column headerText="#{lbl['lbl.sm.status']}"
							rendered="#{!viewSmApplBackingBean.managedBean.poUser and !viewSmApplBackingBean.managedBean.approverUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.poAct']}"
							rendered="#{viewSmApplBackingBean.managedBean.poUser or viewSmApplBackingBean.managedBean.approverUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.appAct']}"
							rendered="#{viewSmApplBackingBean.managedBean.approverUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.remark']}"
							rendered="#{viewSmApplBackingBean.managedBean.poUser or viewSmApplBackingBean.managedBean.approverUser}" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText
						value="#{catBean.pmCategoryL1.categoryL1Code} -  #{catBean.pmCategoryL1.categoryName}" />
					<br />
					<h:outputText
						value="#{catBean.pmCategoryL2.categoryL2Code} -  #{catBean.pmCategoryL2.categoryName}" />
					<br />
					<h:outputText
						value="#{catBean.pmCategoryL3.categoryL3Code} -  #{catBean.pmCategoryL3.categoryName}" />
				</p:column>
				<p:column>
					<p:outputLabel value="#{catBean.otherDesc}" rendered="#{catBean.pmCategoryL3.categoryL3Code eq 99}" />
				</p:column>
				<p:column>
					<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
						rendered="#{!catBean.specialCategory}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
						rendered="#{catBean.specialCategory}" />
				</p:column>
				<p:column
					rendered="#{!viewSmApplBackingBean.managedBean.poUser and !viewSmApplBackingBean.managedBean.approverUser}">
					<h:outputText value="#{lbl['lbl.sm.catCodes.pendingDec']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:column>
				<p:column
					rendered="#{viewSmApplBackingBean.managedBean.poUser or viewSmApplBackingBean.managedBean.approverUser}">

					<p:selectOneRadio layout="pageDirection" id="catPoAppr"
						value="#{catBean.poDecFlg}" disabled="true"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and viewSmApplBackingBean.managedBean.poUser}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
					</p:selectOneRadio>
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS and viewSmApplBackingBean.managedBean.poUser}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS and viewSmApplBackingBean.managedBean.approverUser}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBean.poDecFlg eq 1 and viewSmApplBackingBean.managedBean.approverUser}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.rejected']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBean.poDecFlg eq 0 and viewSmApplBackingBean.managedBean.approverUser}" />
				</p:column>
				<p:column rendered="#{viewSmApplBackingBean.managedBean.poUser}">
					<p:outputLabel value="#{catBean.poRemarks}" />
				</p:column>
				<p:column rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
					<p:selectOneRadio layout="pageDirection" id="catApprvrAppr"
						value="#{catBean.apprvrDecFlg}" disabled="true"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
					</p:selectOneRadio>
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:column>
				<p:column rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
					<p:outputLabel value="#{catBean.approverRemarks}" />
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			
			
			<p:dataTable var="catBeanR" widgetVar="smCatCodesRenewApplDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplierCategories}"
				rowKey="#{catBeanR}" rowIndexVar="index" id="catDtR"
				rendered="#{viewSmApplBackingBean.managedBean.smAppl.applType eq 'R'}">
				<ac:paginator for="catDtR" />
				<p:columnGroup type="header">

					<p:row>
						<p:column headerText="#{lbl['lbl.sm.catCodes.cate']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}" />
						<p:column headerText="#{lbl['lbl.sm.status']}"
							rendered="#{!viewSmApplBackingBean.managedBean.poUser and !viewSmApplBackingBean.managedBean.approverUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.poAct']}"
							rendered="#{viewSmApplBackingBean.managedBean.poUser or viewSmApplBackingBean.managedBean.approverUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.appAct']}"
							rendered="#{viewSmApplBackingBean.managedBean.approverUser}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.remark']}"
							rendered="#{viewSmApplBackingBean.managedBean.poUser or viewSmApplBackingBean.managedBean.approverUser}" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText
						value="#{catBeanR.pmCategoryL1.categoryL1Code} -  #{catBeanR.pmCategoryL1.categoryName}" />
					<br />
					<h:outputText
						value="#{catBeanR.pmCategoryL2.categoryL2Code} -  #{catBeanR.pmCategoryL2.categoryName}" />
					<br />
					<h:outputText
						value="#{catBeanR.pmCategoryL3.categoryL3Code} -  #{catBeanR.pmCategoryL3.categoryName}" />
				</p:column>
				<p:column>
					<p:outputLabel value="#{catBeanR.otherDesc}"
						rendered="#{catBeanR.pmCategoryL3.categoryL3Code eq 99}" />
				</p:column>
				<p:column>
					<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
						rendered="#{!catBeanR.specialCategory}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
						rendered="#{catBeanR.specialCategory}" />
				</p:column>
				<p:column
					rendered="#{!viewSmApplBackingBean.managedBean.poUser and !viewSmApplBackingBean.managedBean.approverUser}">
					<h:outputText value="#{lbl['lbl.sm.catCodes.pendingDec']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:column>
				<p:column
					rendered="#{viewSmApplBackingBean.managedBean.poUser or viewSmApplBackingBean.managedBean.approverUser}">
					<p:selectOneRadio layout="pageDirection" id="catPoApprR"
						value="#{catBeanR.poDecFlg}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and viewSmApplBackingBean.managedBean.poUser}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
					</p:selectOneRadio>
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS and viewSmApplBackingBean.managedBean.poUser}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS and viewSmApplBackingBean.managedBean.approverUser}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBeanR.poDecFlg eq 1 and viewSmApplBackingBean.managedBean.approverUser}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.rejected']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS and catBeanR.poDecFlg eq 0 and viewSmApplBackingBean.managedBean.approverUser}" />

				</p:column>
				<p:column rendered="#{viewSmApplBackingBean.managedBean.poUser}">
					<p:outputLabel value="#{catBeanR.poRemarks}" />
				</p:column>
				<p:column rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
					<p:selectOneRadio layout="pageDirection" id="catApprvrAppr"
						value="#{catBeanR.apprvrDecFlg}" disabled="true"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
							itemValue="0" />
					</p:selectOneRadio>
					<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
						rendered="#{catBeanR.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" />
				</p:column>
				<p:column rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
					<p:outputLabel value="#{catBeanR.approverRemarks}" />
				</p:column>
			</p:dataTable>
			
		</p:panel>
		
		<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
						poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.categoryRemark}" 
						approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.categoryRemark}" />
						
	</p:panel>
	
</ui:composition>
