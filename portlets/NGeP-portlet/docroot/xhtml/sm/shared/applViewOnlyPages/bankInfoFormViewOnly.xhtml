<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.bankDtls.panHdr']}" toggleable="true">
		<p:panel id="bankInfPan">
			<p:dataTable var="bankBean" widgetVar="suppBankInfoDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplierBanks}"
				rowKey="#{bankBean}" rowIndexVar="index" id="bankDt">
				<ac:paginator for="bankDt" />

				<p:column headerText="#{lbl['lbl.sm.bankDtls.acctNo']}">
					<h:outputText value="#{bankBean.accountNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.bankDtls.bankName']}">
					<h:outputText value="#{bankBean.pmFinancialOrg.finOrgName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.bankDtls.acctPurpose']}"
					style="text-align: center;width: 15%">
					<h:outputText value="#{lbl['lbl.sm.paymentLbl']}"
						rendered="#{bankBean.accountPurpose eq 'P'}" />
					<h:outputText value="#{lbl['lbl.sm.bankDtls.registration']}"
						rendered="#{bankBean.accountPurpose eq 'R'}" />
					<h:outputText value="#{lbl['lbl.sm.bankDtls.both.regandpay']}"
						rendered="#{bankBean.accountPurpose eq 'B'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink action="#{viewSmApplBackingBean.viewSignatories(bankBean)}"
						partialSubmit="true" process="@this" update=":form:tt:sfieldset"
						style="padding-right :5px;">
						<p:graphicImage library="ep/images/design"
							name="seller_detail.png"
							value="/resources/ep/images/design/seller_detail.png"
							title="View Signatories" />
					</p:commandLink>
					<p:commandLink partialSubmit="true" process="@this"
						action="#{viewSmApplBackingBean.assignSelBank(bankBean)}" oncomplete="bankDialog.show()"
						update=":form:tt:bankDialog" style="padding-right :5px;">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			
			<p:panel id="sfieldset"
				header="#{lbl['lbl.sm.bankDtls.cheSignPanHdr']} 
			#{viewSmApplBackingBean.managedBean.selectedSignatoryBankAcct.accountNo}">
				<p:dataTable id="signatory" var="auth"
					value="#{viewSmApplBackingBean.managedBean.selectedSignatoryBankAcct.smChequeSignatories}"
					rowKey="#{auth}" rowIndexVar="index">
					<ac:paginator for="signatory" />

					<p:column headerText="#{lbl['lbl.sm.bankDtls.signName']}">
						<h:outputText value="#{auth.smPersonnel.name}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.bankDtls.signId']}">
						<h:outputText value="#{auth.smPersonnel.identificationNo}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.bankDtls.signIsBumi']}">
						<h:outputText value="#{lbl['lbl.txt.no']}"
							rendered="#{auth.smPersonnel.bumiFlg eq 0}" />
						<h:outputText value="#{lbl['lbl.txt.yes']}"
							rendered="#{auth.smPersonnel.bumiFlg eq 1}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.bankDtls.signPos']}">
						<h:outputText value="#{auth.smPersonnel.designation}" />
					</p:column>
				</p:dataTable>
			</p:panel>
			
			<br />
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
						<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.bankRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
						<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.bankRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']} :" /></td>
						<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.apprvrSecReview.bankRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog style = "height:50%; top:25%; bottom:30%; left:30%;"
		header="#{lbl['lbl.sm.bankDtls.bankDiaHdr']}" widgetVar="bankDialog"
		resizable="false" showEffect="fade" closable="true" hideEffect="fade"
		modal="true" id="bankDialog">
		<p:panel id="bankDetailsPanel">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.acctNo']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBank.accountNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.bankName']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBank.pmFinancialOrg.finOrgName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.acctPurpose']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBankAccountPurpose}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.bankDtls.bankBranch']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBank.bankBranch}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.address']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.address1}" /></td>
				</tr>

				<tr>
					<td></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.address2}" /></td>
				</tr>
				<tr>
					<td></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.address3}" /></td>
				</tr>
				<tr>
					<td></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.address4}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.country']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.pmCountry.countryName}" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.state']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.pmState.stateName}" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.district']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.pmDistrict.districtName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.towncity']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.pmCity.cityName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.postcode}" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.isDesBank']} :" /></td>
					<td style="float:left;">
						<p:outputLabel value="#{lbl['lbl.txt.yes']}" rendered="#{viewSmApplBackingBean.managedBean.selectedBank.defaultAccount}"/>
						<p:outputLabel value="#{lbl['lbl.txt.no']}" rendered="#{!viewSmApplBackingBean.managedBean.selectedBank.defaultAccount}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.assocBran']} :"
							id="banBranchLbl"
							rendered="#{viewSmApplBackingBean.managedBean.selectedBank.accountPurpose eq 'P' or viewSmApplBackingBean.managedBean.selectedBank.accountPurpose eq 'B'}" />
					</td>
					<td style="float:left;"><h:outputText rendered="#{viewSmApplBackingBean.managedBean.selectedBank.accountPurpose eq 'P' or viewSmApplBackingBean.managedBean.selectedBank.accountPurpose eq 'B'}"
							value="#{viewSmApplBackingBean.managedBean.selBankBranchName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.cheSigns']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.chequeSignPersonnelName}" /></td>
				</tr>
			</table>
		</p:panel>
	</p:dialog>
</ui:composition>
