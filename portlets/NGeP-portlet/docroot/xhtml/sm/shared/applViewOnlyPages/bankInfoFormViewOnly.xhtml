<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.bankDtls.panHdr']}" toggleable="true">
		<p:panel id="bankInfPan">
			<p:dataTable var="bankBean" widgetVar="suppBankInfoDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplierBanks}"
				rowKey="#{bankBean}" rowIndexVar="index" id="bankDt">
				<ac:paginator for="bankDt" />

				<p:column headerText="#{lbl['lbl.sm.bankDtls.acctNo']}">
					<h:outputText value="#{bankBean.accountNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.bankDtls.bankName']}">
					<h:outputText value="#{bankBean.pmFinancialOrg.finOrgName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.bankDtls.acctPurpose']}"
					style="text-align: center;width: 15%">
					<h:outputText value="#{lbl['lbl.sm.paymentLbl']}"
						rendered="#{bankBean.accountPurpose eq 'P'}" />
					<h:outputText value="#{lbl['lbl.sm.bankDtls.registration']}"
						rendered="#{bankBean.accountPurpose eq 'R'}" />
					<h:outputText value="#{lbl['lbl.sm.bankDtls.both.regandpay']}"
						rendered="#{bankBean.accountPurpose eq 'B'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink action="#{viewSmApplBackingBean.viewSignatories(bankBean)}"
						partialSubmit="true" process="@this" update=":form:tt:sfieldset"
						style="padding-right :5px;">
						<p:graphicImage library="ep/images/design"
							name="seller_detail.png"
							value="/resources/ep/images/design/seller_detail.png"
							title="View Signatories" />
					</p:commandLink>
					<p:commandLink partialSubmit="true" process="@this"
						action="#{viewSmApplBackingBean.assignSelBank(bankBean)}" oncomplete="bankDialog.show()"
						update=":form:tt:bankDialog" style="padding-right :5px;">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			
			<p:panel id="sfieldset"
				header="#{lbl['lbl.sm.bankDtls.cheSignPanHdr']} 
			#{viewSmApplBackingBean.managedBean.selectedSignatoryBankAcct.accountNo}">
				<p:dataTable id="signatory" var="auth"
					value="#{viewSmApplBackingBean.managedBean.selectedSignatoryBankAcct.smChequeSignatories}"
					rowKey="#{auth}" rowIndexVar="index">
					<ac:paginator for="signatory" />

					<p:column headerText="#{lbl['lbl.sm.bankDtls.signName']}">
						<h:outputText value="#{auth.smPersonnel.name}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.bankDtls.signId']}">
						<h:outputText value="#{auth.smPersonnel.identificationNo}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.bankDtls.signIsBumi']}">
						<h:outputText value="#{lbl['lbl.txt.no']}"
							rendered="#{auth.smPersonnel.bumiFlg eq 0}" />
						<h:outputText value="#{lbl['lbl.txt.yes']}"
							rendered="#{auth.smPersonnel.bumiFlg eq 1}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.bankDtls.signPos']}">
						<h:outputText value="#{auth.smPersonnel.designation}" />
					</p:column>
				</p:dataTable>
			</p:panel>
			
			<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
						poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.bankRemark}" 
						approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.bankRemark}" />
		</p:panel>
	</p:panel>
	
	<p:dialog style="max-height:350px;width:500px"
		header="#{lbl['lbl.sm.bankDtls.bankDiaHdr']}" widgetVar="bankDialog"
		resizable="false" showEffect="fade" closable="true" hideEffect="fade"
		modal="true" id="bankDialog" >
		
		<p:scrollPanel mode="native" style="max-height:300px;width:450px;border:none">
			<p:panel id="bankDetailsPanel">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.acctNo']} :" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.accountNo}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.bankName']} :" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.pmFinancialOrg.finOrgName}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.acctPurpose']} :" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBankAccountPurpose}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.bankBranch']} :" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.bankBranch}"/></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.address']} :" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.address1}" /></td>
					</tr>
	
					<tr>
						<td></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.address2}" /></td>
					</tr>
					<tr>
						<td></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.address3}" /></td>
					</tr>
					<tr>
						<td></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.address4}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.country']} :" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.pmCountry.countryName}" /></td>
					</tr>
	
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.state']} :" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.pmState.stateName}" /></td>
					</tr>
	
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.district']} :" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.pmDistrict.districtName}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.towncity']} :" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.pmCity.cityName}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.postcode']} :" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.smAddress.postcode}" /></td>
					</tr>
	
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.isDesBank']} :" /></td>
						<td>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.yes']}" rendered="#{viewSmApplBackingBean.managedBean.selectedBank.defaultAccount}"/>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.no']}" rendered="#{!viewSmApplBackingBean.managedBean.selectedBank.defaultAccount}"/>
						</td>
					</tr>
					<c:if test="#{viewSmApplBackingBean.managedBean.selectedBank.accountPurpose eq 'P' or viewSmApplBackingBean.managedBean.selectedBank.accountPurpose eq 'B'}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.assocBran']} :" id="banBranchLbl" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedBank.bankBranch}" /></td>
						</tr>
					</c:if>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.bankDtls.cheSigns']} :" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.chequeSignPersonnelName}" escape="false" /></td>
					</tr>
				</table>
			</p:panel>
		</p:scrollPanel>
	</p:dialog>
	
</ui:composition>
