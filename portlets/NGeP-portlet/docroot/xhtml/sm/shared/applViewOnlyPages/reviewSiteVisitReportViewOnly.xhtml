<!-- #28175 start -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:ui="http://java.sun.com/jsf/facelets" 
	xmlns:p="http://primefaces.org/ui" 
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
<!-- #28175 end -->	

	<p:panel header="#{lbl['lbl.sm.svo.sitevisit.report']}">

		<ui:param name="viewFlag" value="true" />
		<p:dataTable var="svTask"
			value="#{svoSiteVisitBackingBean.managedBean.smAppl.smSvTasks}">
			<h:inputText value="svTask.pmCategoryL3" />
			<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}">
				<h:outputText rendered="#{!empty svTask.pmCategoryL3}"
					value="#{svoSiteVisitBackingBean.getParameterDesc(ParameterTypeConst.categoryType,svTask.pmCategoryL3.categoryTypeCode.parameterCode)}" />
				<h:outputText rendered="#{empty svTask.pmCategoryL3}"
					value="#{lbl['lbl.sm.sitevisit.category.categorycode_BP']}" />
			</p:column>

			<!-- #28175 start -->
			<p:column headerText="#{lbl['lbl.sm.catCodes.catcode']} testt" style="white-space: normal; width:30%;">
				<!-- 28775 - Site Visit Grouping Enhancement - 28775 - start -->
				<h:outputText rendered="#{!empty svTask.pmCategoryL3}"
					value="#{svTask.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}#{svTask.pmCategoryL3.pmCategoryL2.categoryL2Code}#{svTask.pmCategoryL3.categoryL3Code} - 
					#{svTask.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName} / #{svTask.pmCategoryL3.pmCategoryL2.categoryName} / #{svTask.pmCategoryL3.categoryName}"/>
				<h:outputText rendered="#{svTask.smSvTemplate.suppCategory.otherDesc != null}"
					value=" (#{svTask.smSvTemplate.suppCategory.otherDesc})"/>
				<ui:repeat var="taskGroup" value="#{svTask.smSvTaskGroups}">
					<br/>
					<h:outputText rendered="#{!taskGroup.redundant}"
						value="#{taskGroup.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}#{taskGroup.pmCategoryL3.pmCategoryL2.categoryL2Code}#{taskGroup.pmCategoryL3.categoryL3Code} - 
						#{taskGroup.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName} / #{taskGroup.pmCategoryL3.pmCategoryL2.categoryName} / #{taskGroup.pmCategoryL3.categoryName}"/>
					<h:outputText rendered="#{!taskGroup.redundant and taskGroup.smSvTemplate.suppCategory.otherDesc != null}"
						value=" (#{taskGroup.smSvTemplate.suppCategory.otherDesc})"/>
				</ui:repeat>
				<!-- 28775 - Site Visit Grouping Enhancement - 28775 - end -->
			</p:column>
			<!-- #28175 end -->

			<p:column headerText="#{lbl['lbl.sm.address']}"
				style="white-space: pre;">
				<h:outputText
					value="#{svoSiteVisitBackingBean.getSMFullAddress(svTask.smSvAddress.address)}"
					escape="false" style="float : left" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.action']}">
				<!-- 28775 - Site Visit Grouping Enhancement - 28775 - start -->
				<p:commandButton value="#{lbl['lbl.btn.view']}"
					oncomplete="blockWidget.hide();poReportDlg.show();"
					update=":#{p:component('poReportDlgId')}"
					onclick="blockWidget.show();"
					action="#{svoSiteVisitBackingBean.selectReportTask(svTask,true)}">
				<!-- 28775 - Site Visit Grouping Enhancement - 28775 - end -->
				</p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.download']}"
					action="#{svoSiteVisitBackingBean.downloadPOApprovalSiteVisitReport(svTask)}"
				    ajax="false">
					<p:fileDownload value="#{svoSiteVisitBackingBean.file}" />
				</p:commandButton>
			</p:column>
		</p:dataTable>

		<p:dialog widgetVar="poReportDlg" modal="true" height="600"
			width="1000" id="poReportDlgId" resizable="false">
			<p:outputPanel id="reportPanel"
				rendered="#{!empty svoSiteVisitBackingBean.managedBean.smSvTask}">
				<!-- 28775 - Site Visit Grouping Enhancement - 28775 -->
				<ui:include src="/xhtml/sm/shared/sitevisit/group/siteVisitReportPOReview.xhtml" />
			</p:outputPanel>
		</p:dialog>

	</p:panel>

</ui:composition>
