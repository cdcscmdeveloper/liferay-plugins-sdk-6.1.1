<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
		
		<p:outputPanel rendered="#{!viewSuppProfileBackingBean.managedBean.supplierUser}">
			<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.search.criteria.mandatory']}" escape="false"/><br /><br />
		</p:outputPanel>

		<table style="width: 100%">
			<p:outputPanel rendered="#{viewSuppProfileBackingBean.managedBean.supplierUser}">
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.companyname']}" rendered="#{!viewSuppProfileBackingBean.managedBean.isG2GSupplierAdmin()}"/>
						<p:outputLabel value="#{lbl['lbl.sm.agency.name']}" rendered="#{viewSuppProfileBackingBean.managedBean.isG2GSupplierAdmin()}"/>
					</td>
					<td>
						<p:inputText label="#{lbl['lbl.sm.companyname']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.companyName}"
							size="40" disabled="true" rendered="#{!viewSuppProfileBackingBean.managedBean.isG2GSupplierAdmin()}"/>
						<p:inputText label="#{lbl['lbl.sm.agency.name']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.companyName}"
							size="40" disabled="true" rendered="#{viewSuppProfileBackingBean.managedBean.isG2GSupplierAdmin()}"/>
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.rocNo']}" rendered="#{!viewSuppProfileBackingBean.managedBean.isG2GSupplierAdmin()}"/>
						<p:outputLabel value="#{lbl['lbl.sm.agency.type']}" rendered="#{viewSuppProfileBackingBean.managedBean.isG2GSupplierAdmin()}"/>
					</td>
					<td>
						<p:inputText label="#{lbl['lbl.sm.rocNo']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.regNo}"
							size="35" disabled="true" rendered="#{!viewSuppProfileBackingBean.managedBean.isG2GSupplierAdmin()}"/>
						<p:inputText label="#{lbl['lbl.sm.agency.type']}"
							value="#{viewSuppProfileBackingBean.managedBean.agencyTypeName}"
							size="35" disabled="true" rendered="#{viewSuppProfileBackingBean.managedBean.isG2GSupplierAdmin()}"/>
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.ep.no']}" />
					</td>
					<td>
						<p:inputText label="#{lbl['lbl.sm.ep.no']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.epNo}"
							size="35" disabled="true"/>
					</td>
				</tr>
				
				<!-- #28771 START -->
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.supportingDocumentMode']}" />
					
					</td>
					<td>
						<p:selectOneMenu 
						value="#{viewSuppProfileBackingBean.managedBean.supportingDocMode}" > 
						   <f:selectItem itemLabel="#{lbl['lbl.cm.selectOne']}" itemValue=""/>
							<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.online']}"
							 itemValue="#{SupplierManagementConst.SUPPORTING_DOC_ONLINE}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.offline']}" 
							itemValue="#{SupplierManagementConst.SUPPORTING_DOC_OFFLINE}"/>
							<p:ajax event="change" update="@form" 
							 process="@this" partialSubmit="true" listener="#{viewSuppProfileBackingBean.onChangeSupportingDocumentMode()}"
							 onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />	
						</p:selectOneMenu>
					</td>
				</tr>
					<!-- #28771 END -->	
			</p:outputPanel>
			
			<p:outputPanel rendered="#{!viewSuppProfileBackingBean.managedBean.supplierUser}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.account.type']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
						<td>
							<p:selectOneMenu label="#{lbl['lbl.sm.account.type']}" required="true"
								id="accountTypeId" value="#{viewSuppProfileBackingBean.managedBean.searchAccountType}"
								style="width: 207px;margin-bottom: 5px;" valueChangeListener="#{viewSuppProfileBackingBean.resetInputOnChangeAccountType()}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.please.select']}" itemValue="" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.account.type.basic']}" itemValue="#{SupplierManagementConst.SUPP_TYPE_BASIC}" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.account.type.g2g']}" itemValue="#{SupplierManagementConst.SUPP_TYPE_GOVT_TO_GOVT}"/>
								<f:selectItem itemLabel="#{lbl['lbl.sm.account.type.mof']}" itemValue="M" />
								<p:ajax event="change" process="@this" 
								update=":form" />
							</p:selectOneMenu>
							<p:message id="accountTypeIdMsg" for="accountTypeId" display="icon" />
						</td>
					</tr>
					<p:outputPanel id="g2gOnly" rendered="#{viewSuppProfileBackingBean.managedBean.searchAccountType eq SupplierManagementConst.SUPP_TYPE_GOVT_TO_GOVT}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.agency.type']}" /><p:outputLabel value="*" styleClass="mandatory" id="agencyTypeLbl" /></td>
						<td><p:selectOneMenu required="true" label="#{lbl['lbl.sm.agency.type']}"
								value="#{viewSuppProfileBackingBean.managedBean.agencyType}" id="agencyTypeId">
								<f:selectItems value="#{viewSuppProfileBackingBean.getAgencyTypeDropdownValues()}" />
							</p:selectOneMenu>
							<p:message id="agencyTypeIdMsg" for="agencyTypeId" display="icon" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.agency.name']}" /></td>
						<td>
							<p:inputText id="agencyNameId"
								label="#{lbl['lbl.sm.agency.name']}"
								value="#{viewSuppProfileBackingBean.managedBean.agencyName}"
								size="35" maxlength="255" />&#160; 
							<p:graphicImage id="agencyNameImg" value="/css/images/design/tooltips.png" /> 
							<p:tooltip id="agencyNameTt" for="agencyNameImg">
								<p:outputLabel escape="false" value="#{lbl['lbl.search.agency.prefix.three.char']}" />
							</p:tooltip>
						</td>
					</tr>
					</p:outputPanel>
					<p:outputPanel id="mofOnly" rendered="#{viewSuppProfileBackingBean.managedBean.searchAccountType eq 'M'}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.pm.supplier.zone']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
						<td>
							<p:selectOneMenu label="#{lbl['lbl.pm.supplier.zone']}" required="true"
								id="zoneId" value="#{viewSuppProfileBackingBean.managedBean.searchPmZoneId}"
								style="width: 207px;margin-bottom: 5px;" disabled="#{viewSuppProfileBackingBean.managedBean.loginUserZone.zoneCode != null and viewSuppProfileBackingBean.managedBean.viewSupplierMaintenancePage and viewSuppProfileBackingBean.managedBean.loginUserZone.zoneCode ne '1'}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{viewSuppProfileBackingBean.managedBean.zoneList}" var="zone"
									itemLabel="#{zone.zoneName}"
									itemValue="#{zone.zoneId}" />
							</p:selectOneMenu>
							<p:message id="zoneIdMsg" for="zoneId" display="icon" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><p:selectOneMenu required="true" id="searchSuppTypeId" label="#{lbl['lbl.rpt.supplierType']}"
								value="#{viewSuppProfileBackingBean.managedBean.searchSuppType}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}" itemValue="K" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}" itemValue="J"/>
								<p:ajax event="change" process="@this"
									listener="#{viewSuppProfileBackingBean.onChangeSupplierType()}"
									update="approveSelBox" />
							</p:selectOneMenu>
							<p:message id="searchSuppTypeIdMsg" for="searchSuppTypeId" display="icon" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.rgstStatus']}" /></td>
						<td><p:selectOneMenu label="#{lbl['lbl.rpt.rgstStatus']}"
								id="approveSelBox" value="#{viewSuppProfileBackingBean.managedBean.searchPmRegStatusId}"
								style="width: 207px;margin-bottom: 5px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{viewSuppProfileBackingBean.managedBean.regStatusDescList}" var="reg"
									itemLabel="#{reg.statusName}"
									itemValue="#{reg.pmStatus.pmRegStatus.regStatusId}" /></p:selectOneMenu>
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.mofno']}" /></td>
						<td>
							<p:inputText id="mofNoId"
								label="#{lbl['lbl.sm.mofno']}"
								value="#{viewSuppProfileBackingBean.managedBean.searchMofNo}"
								size="35" maxlength="14" />
						</td>
					</tr>
					</p:outputPanel>	
					<p:outputPanel rendered="#{viewSuppProfileBackingBean.managedBean.searchAccountType != null and viewSuppProfileBackingBean.managedBean.searchAccountType.trim() ne ''}">		
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.epno']}" /></td>
						<td>
							<p:inputText id="epNoId"
								label="#{lbl['lbl.sm.epno']}"
								value="#{viewSuppProfileBackingBean.managedBean.searchEpNo}"
								size="35" maxlength="14" />
						</td>
					</tr>

					</p:outputPanel>
					
					
					<p:outputPanel  id="mofOrBasicOnly" 
					rendered="#{viewSuppProfileBackingBean.managedBean.searchAccountType eq SupplierManagementConst.SUPP_TYPE_BASIC
					 or viewSuppProfileBackingBean.managedBean.searchAccountType eq 'M'}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.companyname']}" /></td>
						<td>
							<p:inputText id="companyNameId"
								label="#{lbl['lbl.sm.companyname']}"
								value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.companyName}"
								size="40" maxlength="100" />&#160; 
							<p:graphicImage id="compNameImg" value="/css/images/design/tooltips.png" /> 
							<p:tooltip id="compNameTt" for="compNameImg">
								<p:outputLabel escape="false" value="#{lbl['tt.search.prefix.three.char']}" />
							</p:tooltip>
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.rocNo']}" /></td>
						<td>
							<p:inputText id="regNoId"
								label="#{lbl['lbl.sm.rocNo']}"
								value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.regNo}"
								size="35" maxlength="20" />
						</td>
					</tr>

					<p:outputPanel rendered="#{viewSuppProfileBackingBean.managedBean.viewApplicationHistory}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.applicationtype']}" /></td>
							<td><p:selectOneMenu id="searchApplTypeId" label="#{lbl['lbl.sm.applicationtype']}"
									value="#{viewSuppProfileBackingBean.managedBean.searchApplType}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
									<f:selectItems value="#{viewSuppProfileBackingBean.managedBean.applTypeItems}" />
								</p:selectOneMenu>
								<p:message id="searchApplTypeIdMsg" for="searchApplTypeId" display="icon" />
							</td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.application.no']}" /></td>
							<td>
								<p:inputText id="applNoId"
									label="#{lbl['lbl.sm.application.no']}"
									value="#{viewSuppProfileBackingBean.managedBean.searchApplNo}"
									size="35" maxlength="20" />
								<p:message id="applNoIdMsg" for="applNoId" display="icon" />
							</td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.applicationstatus']}" /></td>
							<td><p:selectOneMenu id="searchApplStatusId" label="#{lbl['lbl.sm.applicationstatus']}"
									value="#{viewSuppProfileBackingBean.managedBean.searchApplStatusId}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
									<f:selectItems value="#{viewSuppProfileBackingBean.managedBean.applStatusItems}" />
								</p:selectOneMenu>
								<p:message id="searchApplStatusIdMsg" for="searchApplStatusId" display="icon" />
							</td>
						</tr>
						
				
					</p:outputPanel>
					<!-- #28771 START -->
						<tr>
							<td>
								<p:outputLabel value="#{lbl['lbl.sm.supportingDocumentMode']}" />
					
							</td>
							<td>
								<p:selectOneMenu value="#{viewSuppProfileBackingBean.managedBean.supportingDocMode}" > 
						   			<f:selectItem itemLabel="#{lbl['lbl.cm.selectOne']}" itemValue=""/>
									<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.online']}" itemValue="#{SupplierManagementConst.SUPPORTING_DOC_ONLINE}" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.offline']}" itemValue="#{SupplierManagementConst.SUPPORTING_DOC_OFFLINE}"/>
							</p:selectOneMenu>
							</td>
						</tr>
				<!-- #28771 END -->
					</p:outputPanel>				
					<tr>
						<td colspan="2">
							<div style="text-align: right;">
								<p:commandButton value="#{lbl['lbl.btn.search']}" 
									action="#{viewSuppProfileBackingBean.search}"
									update="@form" 
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
								</p:commandButton>
								<p:commandButton value="#{lbl['lbl.btn.reset']}" 
									action="#{viewSuppProfileBackingBean.resetSearch}"
									update="searchSupplierProfilePanelId">
								</p:commandButton>
							</div>
						</td>
					</tr>
			</p:outputPanel>
		</table>
		
		<br />
</ui:composition>
