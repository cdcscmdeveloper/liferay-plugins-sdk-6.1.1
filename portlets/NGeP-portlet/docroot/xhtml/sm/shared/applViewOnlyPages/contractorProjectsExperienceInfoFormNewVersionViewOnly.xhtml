<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.projDtls.panHdr']}" toggleable="true">
		<p:outputPanel id="contrInfNewVersionPan" layout="block">
			<p:dataTable
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					id="masterAllDataModel" lazy="true" rowIndexVar="index" rows="10"
					value="#{viewSmApplBackingBean.managedBean.masterAllDataModel}" var="masterAll">
					<ac:paginator for="masterAllDataModel" />
					<p:columnGroup type="header">
						<p:row>
							<p:column
								headerText="#{lbl['lbl.sm.comp.exp.draft.table.title']}"
								style="text-align: center !important;" />
							<p:column
								headerText="#{lbl['lbl.sm.comp.exp.update.file.ref.no']}"
								style="text-align: center !important;" />
							<p:column
								headerText="#{lbl['lbl.sm.comp.exp.draft.table.eff.date']}"
								style="text-align: center !important;" />
							<p:column
								headerText="#{lbl['lbl.sm.comp.exp.draft.table.value']}"
								style="text-align: center !important;" />
							<p:column
								headerText="#{lbl['lbl.sm.comp.exp.master.list.cat.code']}"
								style="text-align: center !important;" />
							<p:column
								headerText="#{lbl['lbl.sm.comp.exp.draft.table.action']}"
								style="text-align: center !important;" />
						</p:row>
					</p:columnGroup>
					<p:column
						style="word-wrap: break-word;overflow-wrap: break-word;white-space: normal;">
						<h:outputText value="#{masterAll.title}" />
					</p:column>
					<p:column
						style="word-wrap: break-word;overflow-wrap: break-word;white-space: normal;">
						<h:outputText value="#{masterAll.fileReferenceNo}" />
					</p:column>
					<p:column>
						<h:outputText value="#{masterAll.contractEffDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column>
						<h:outputText value="#{masterAll.contractValue}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column>
						<ui:repeat var="catCode" value="#{masterAll.compExpMasterCats}">
							<h:outputText
								value="#{catCode.categoryL1.categoryL1Code}#{catCode.categoryL2.categoryL2Code}#{catCode.categoryL3.categoryL3Code}" />
							<br />
						</ui:repeat>
					</p:column>
					<p:column>
						<p:commandLink action="#{smCompExpBB.initViewPopupSuppProfile(masterAll)}"
							oncomplete="blockWidget.hide(),compExpSuppProfViewPopupWV.show()"
							onstart="blockWidget.show()" partialSubmit="true" process="@this"
							update=":form">
							<p:graphicImage id="actionViewId"
								value="/css/images/design/ico-view.png" />
							<p:tooltip for="actionViewId"
								value="#{lbl['lbl.sm.comp.exp.master.list.source.type']} #{smCompExpBB.getParameterDesc(ParameterTypeConst.compExpSourceType,masterAll.sourceType.parameterCode)}" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
		</p:outputPanel>
	</p:panel>
	<ac:compExpSuppProfViewPopup mBean="#{smCompExpMB}" bBean="#{smCompExpBB}" />
</ui:composition>
