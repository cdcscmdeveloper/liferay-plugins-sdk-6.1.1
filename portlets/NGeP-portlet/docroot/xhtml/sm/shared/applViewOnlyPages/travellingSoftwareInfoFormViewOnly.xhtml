<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.travelling.system']}" toggleable="true">
		<p:outputPanel id="systemInfPan" layout="block">
			<p:dataTable var="systemBean" widgetVar="smSystemDtWidVar" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplierSystems}"
				rowKey="#{systemBean}" rowIndexVar="index" id="systemDt">
				<ac:paginator for="systemDt" />

				<p:column headerText="#{lbl['lbl.sm.travelling.system.name']}">
					<h:outputText value="#{systemBean.system.machineDesc}" rendered="#{empty systemBean.systemName}"/>
					<h:outputText value="#{systemBean.systemName}" rendered="#{not empty systemBean.systemName}"/>
				</p:column>

			</p:dataTable>
		</p:outputPanel>
		
		<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
			poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.supplierSystemRemark}" 
			approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.supplierSystemRemark}" />
			
	</p:panel>
</ui:composition>
