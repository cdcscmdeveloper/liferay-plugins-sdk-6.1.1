<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.machine.panHdr']}" toggleable="true">
		<p:panel id="machInfPan">
			<p:dataTable var="macBean" widgetVar="smMachDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smMachineDtls}"
				rowKey="#{macBean}" rowIndexVar="index" id="macDt">
				<ac:paginator for="macDt" />

				<p:column headerText="#{lbl['lbl.sm.machine.equiType']}">
					<h:outputText value="#{macBean.machineType}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.brand']}">
					<h:outputText value="#{macBean.brandName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.machine.function']}">
					<h:outputText value="#{macBean.machineFunction}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.quantity']}">
					<h:outputText value="#{macBean.qty}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.value']}">
					<h:outputText value="#{macBean.value}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink partialSubmit="true" process="@this"
						action="#{viewSmApplBackingBean.assignSelMachinery(macBean)}" oncomplete="equipmentDialog.show()" 
						update=":form:tt:equipmentDialog" style="padding-right:5px">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			<br />
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.poUser}">
				<table style="width: 50%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.machineryRemark}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.machineryRemark}" /></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
						<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.apprvrSecReview.machineryRemark}" /></td>

					</tr>
				</table>
			</p:outputPanel>
		</p:panel>
	</p:panel>
	<p:dialog width="600px" height="350px"
		header="#{lbl['lbl.sm.machine.diaHdr']}" widgetVar="equipmentDialog"
		resizable="false" showEffect="fade" closable="true" hideEffect="fade"
		modal="true" id="equipmentDialog">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.equiType']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedMachine.machineType}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.brand']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedMachine.brandName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.function']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedMachine.machineFunction}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.quantity']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedMachine.qty}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.value']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedMachine.value}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:outputLabel>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.purMthd']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedMachineryPurchaseMethod}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.guarnName']} :" /></td>
				<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedMachine.guarantorName}"/></td>
			</tr>


		</table>
	</p:dialog>
</ui:composition>
