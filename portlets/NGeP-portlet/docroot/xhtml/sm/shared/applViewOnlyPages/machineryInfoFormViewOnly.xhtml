<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.machine.panHdr']}" toggleable="true">
		<p:outputPanel id="machInfPan" layout="block">
			<p:dataTable var="macBean" widgetVar="smMachDtWidVar" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smMachineDtls}"
				rowKey="#{macBean}" rowIndexVar="index" id="macDt">
				<ac:paginator for="macDt" />

				<p:column headerText="#{lbl['lbl.sm.machine.category']}">
					<h:outputText value="#{viewSmApplBackingBean.getMachineCategoryType(macBean)}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.machine.categorycode']}" style="width : 25%;white-space: normal;">
					<h:outputText value="#{macBean.categoryCode.categoryL3Code} - #{macBean.categoryCode.categoryName}" 
						rendered="#{not empty macBean.categoryCode}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.machine.equiType']}" style="width : 25%;white-space: normal;">
					<h:outputText value="#{macBean.machineType}" rendered="#{not empty macBean.machineType}"/>
					<h:outputText value="#{macBean.machine.machineDesc}" rendered="#{empty macBean.machineType}"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.brand']}">
					<h:outputText value="#{macBean.brandName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.machine.function']}">
					<h:outputText value="#{macBean.machineFunction}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.quantity']}">
					<h:outputText value="#{macBean.qty}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.value']}">
					<ac:labelAmount styleClass="outputLabel-view" value="#{macBean.value}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink partialSubmit="true" process="@this" onstart="blockWidget.show()"
						action="#{viewSmApplBackingBean.assignSelMachinery(macBean)}" oncomplete="equipmentDialog.show()" 
						update=":form:tt:equipmentDialog" style="padding-right:5px">
						<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
		</p:outputPanel>
		
		<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
						poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.machineryRemark}" 
						approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.machineryRemark}" />
	</p:panel>
	<p:dialog style="max-height:350px;width:500px"
		header="#{lbl['lbl.sm.machine.diaHdr']}" widgetVar="equipmentDialog"
		resizable="false" showEffect="fade" closable="true" hideEffect="fade"
		modal="true" id="equipmentDialog">
		
		<p:scrollPanel mode="native" style="max-height:300px;width:450px;border:none">
			<table style="width: 100%;table-layout:fixed">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.machine.category']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.getMachineCategoryType(viewSmApplBackingBean.managedBean.selectedMachine)}" /></td>
				</tr>
				<p:outputPanel rendered="#{not empty viewSmApplBackingBean.managedBean.selectedMachine.categoryCode}">
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.machine.categorycode']}" /></td>
						<td>
							<p:outputLabel styleClass="outputLabel-view"
								 value="#{viewSmApplBackingBean.managedBean.selectedMachine.categoryCode.categoryL3Code} - 
								 		#{viewSmApplBackingBean.managedBean.selectedMachine.categoryCode.categoryName}" />
						</td>
					</tr>
				</p:outputPanel>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.machine.equiType']}" /></td>
					<td>
						<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.machineType}" 
							rendered="#{not empty viewSmApplBackingBean.managedBean.selectedMachine.machineType}"/>
						<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.machine.machineDesc}" 
							rendered="#{empty viewSmApplBackingBean.managedBean.selectedMachine.machineType}"/>
					</td>
				</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.machine.brand']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.brandName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.machine.function']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.machineFunction}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.machine.quantity']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.qty}" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.machine.value']}" /></td>
					<td>
						<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.value}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.machine.purMthd']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachineryPurchaseMethod}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.machine.guarnName']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.guarantorName}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.machine.purchase.year']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.purchaseYear}"/></td>
				</tr>
			</table>
		</p:scrollPanel>
	</p:dialog>
</ui:composition>
