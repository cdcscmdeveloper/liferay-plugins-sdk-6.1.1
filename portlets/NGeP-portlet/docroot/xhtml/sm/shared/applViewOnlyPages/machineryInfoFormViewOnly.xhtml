<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.machine.panHdr']}" toggleable="true">
		<p:panel id="machInfPan">
			<p:dataTable var="macBean" widgetVar="smMachDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smMachineDtls}"
				rowKey="#{macBean}" rowIndexVar="index" id="macDt">
				<ac:paginator for="macDt" />

				<p:column headerText="#{lbl['lbl.sm.machine.equiType']}">
					<h:outputText value="#{macBean.machineType}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.brand']}">
					<h:outputText value="#{macBean.brandName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.machine.function']}">
					<h:outputText value="#{macBean.machineFunction}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.quantity']}">
					<h:outputText value="#{macBean.qty}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.machine.value']}">
					<h:outputText value="#{macBean.value}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink partialSubmit="true" process="@this"
						action="#{viewSmApplBackingBean.assignSelMachinery(macBean)}" oncomplete="equipmentDialog.show()" 
						update=":form:tt:equipmentDialog" style="padding-right:5px">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
		</p:panel>
		
		<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
						poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.machineryRemark}" 
						approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.machineryRemark}" />
	</p:panel>
	<p:dialog style="max-height:350px;width:500px"
		header="#{lbl['lbl.sm.machine.diaHdr']}" widgetVar="equipmentDialog"
		resizable="false" showEffect="fade" closable="true" hideEffect="fade"
		modal="true" id="equipmentDialog">
		
		<p:scrollPanel mode="native" style="max-height:300px;width:450px;border:none">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.equiType']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.machineType}" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.brand']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.brandName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.function']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.machineFunction}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.quantity']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.qty}" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.value']} :" /></td>
					<td>
						<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.value}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.purMthd']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachineryPurchaseMethod}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.machine.guarnName']} :" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedMachine.guarantorName}"/></td>
				</tr>
			</table>
		</p:scrollPanel>
	</p:dialog>
</ui:composition>
