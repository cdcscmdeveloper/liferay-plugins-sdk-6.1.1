<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.panHdr.certInfo']}" toggleable="true"
		id="certPanHead">
		<p:panel id="certInfPan">
			<p:dataTable var="certBean" editable="true"
				widgetVar="suppCertDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplierCerts}"
				rowKey="#{certBean}" rowIndexVar="index" id="certDt">
				<ac:paginator for="certDt" />

				<p:column headerText="#{lbl['lbl.sm.cert.certName']}">
					<h:outputText value="#{certBean.certName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.strtDate']}">
					<h:outputText value="#{certBean.certStartDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.expDate']}">
					<h:outputText value="#{certBean.certEndDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>

				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink action="#{viewSmApplBackingBean.assignSelCert(certBean)}"
						update=":form:tt:certPop" partialSubmit="true" process="@this">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</p:panel>
	</p:panel>
	<p:dialog width="500px" height="275px"
		header="#{lbl['lbl.sm.cert.certDiaHdrMsg']}" widgetVar="certDialog"
		resizable="false" showEffect="fade" hideEffect="fade" modal="true"
		id="certPop" closable="false">
		<p:messages id="suppCertInfoMsg" showSummary="false" showDetail="true"
			autoUpdate="true" closable="true" />


		<table style="width: 100%">
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.cert.certType']}" />
				</td>
				<td>
					<p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						value="#{viewSmApplBackingBean.managedBean.selectedCert.certTypeId}"
						disabled="true">
						<f:selectItems value="#{viewSmApplBackingBean.getDropdownValues('CRT')}" />
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.cert.certBody']}" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
						value="#{viewSmApplBackingBean.managedBean.selectedCert.pmCertBody.certBodyId}">
						<f:selectItem itemLabel="-- Select  -- " itemValue="" />
						<f:selectItems var="certBody"
							value="#{viewSmApplBackingBean.managedBean.certBodyLs}"
							itemValue="#{certBody.certBodyId}"
							itemLabel="#{certBody.bodyName}" />
					</p:selectOneMenu>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.cert.certName']}" /></td>
				<td>
					<p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCert.certName}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.cert.strtDate']}" /></td>
				<td>
					<p:calendar value="#{viewSmApplBackingBean.managedBean.selectedCert.certStartDate}" disabled="true"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.cert.expDate']}" /></td>
				<td>
					<p:calendar value="#{viewSmApplBackingBean.managedBean.selectedCert.certEndDate}" disabled="true"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.cert.rating']}" /></td>
				<td>
					<p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCert.certScore}"/>
				</td>
			</tr>

		</table>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"/>
		</div>

	</p:dialog>
</ui:composition>
