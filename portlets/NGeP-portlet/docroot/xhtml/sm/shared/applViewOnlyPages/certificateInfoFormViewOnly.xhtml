<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.panHdr.certInfo']}" toggleable="true"
		id="certPanHead">
		<p:panel id="certInfPan">
			<p:dataTable var="certBean" editable="true"
				widgetVar="suppCertDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplierCerts}"
				rowKey="#{certBean}" rowIndexVar="index" id="certDt">
				<ac:paginator for="certDt" />

				<p:column headerText="#{lbl['lbl.sm.cert.certName']}">
					<h:outputText value="#{certBean.certName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.strtDate']}">
					<h:outputText value="#{certBean.certStartDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.expDate']}">
					<h:outputText value="#{certBean.certEndDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>

				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink action="#{viewSmApplBackingBean.assignSelCert(certBean)}"
						update=":form:tt:certPop" partialSubmit="true" process="@this" oncomplete="certDialog.show()">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</p:panel>
	</p:panel>
	<p:dialog width="350px" height="150px"
		header="#{lbl['lbl.sm.cert.certDiaHdrMsg']}" widgetVar="certDialog"
		resizable="false" showEffect="fade" hideEffect="fade" modal="true"
		id="certPop" closable="true">
		
		<p:panel id="certificateDetailsPanel">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.cert.certType']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCertType}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.cert.certBody']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCert.pmCertBody.bodyName}" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.cert.certName']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCert.certName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.cert.strtDate']} :" /></td>
					<td style="font-size: 12px;font-weight: normal;font-family: Arial">
						<h:outputText value="#{viewSmApplBackingBean.managedBean.selectedCert.certStartDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.cert.expDate']} :" /></td>
					<td style="font-size: 12px;font-weight: normal;font-family: Arial">
						<h:outputText value="#{viewSmApplBackingBean.managedBean.selectedCert.certEndDate}" >
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.cert.rating']} :" /></td>
					<td style="float:left;">
						<p:outputLabel value="#{viewSmApplBackingBean.managedBean.selectedCert.certScore}"/>
					</td>
				</tr>
	
			</table>
		</p:panel>

	</p:dialog>
</ui:composition>
