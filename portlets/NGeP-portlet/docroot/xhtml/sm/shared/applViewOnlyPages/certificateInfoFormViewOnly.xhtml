<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.panHdr.certInfo']}" toggleable="true"
		id="certPanHead">
		<p:panel id="certInfPan">
			<p:dataTable var="certBean" editable="true"
				widgetVar="suppCertDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplierCerts}"
				rowKey="#{certBean}" rowIndexVar="index" id="certDt">
				<ac:paginator for="certDt" />

				<p:column headerText="#{lbl['lbl.sm.cert.certName']}">
					<h:outputText value="#{certBean.certName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.strtDate']}">
					<ac:labelDate value="#{certBean.certStartDate}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.cert.expDate']}">
					<ac:labelDate value="#{certBean.certEndDate}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink action="#{viewSmApplBackingBean.assignSelCert(certBean)}"
						update=":form:tt:certPop" partialSubmit="true" process="@this" oncomplete="certDialog.show()">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png"
							style="margin-right:2px;" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			
			<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
				poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.certRemark}" 
				approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.certRemark}" />
				
		</p:panel>
		
	</p:panel>
	<p:dialog style="max-height:350px;width:500px"
		header="#{lbl['lbl.sm.cert.certDiaHdrMsg']}" widgetVar="certDialog"
		resizable="false" showEffect="fade" hideEffect="fade" modal="true"
		id="certPop" closable="true">
		
		<p:scrollPanel mode="native" style="max-height:300px;width:450px;border:none">
			<p:outputPanel id="certificateDetailsPanel">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.cert.certType']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCertType}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.cert.certBody']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCert.pmCertBody.bodyName}" /></td>
					</tr>
		
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.cert.certName']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCert.certName}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.cert.strtDate']}" /></td>
						<td>
							<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCert.certStartDate}" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.cert.expDate']}" /></td>
						<td>
							<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCert.certEndDate}" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.cert.rating']}" /></td>
						<td>
							<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCert.certScore}"/>
						</td>
					</tr>
				</table>
			</p:outputPanel>
		</p:scrollPanel>
	</p:dialog>
</ui:composition>
