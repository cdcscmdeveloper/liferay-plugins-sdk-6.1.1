<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.catCodes.panHdr']}" toggleable="true">
		<p:dataTable var="aprvdCatBean"
			widgetVar="smApprvdCatCodesNonRenewApplDtWidVar"
			value="#{viewSmApplBackingBean.managedBean.suppProfileOrHistoryCategoryList}"
			rowKey="#{aprvdCatBean}" rowIndexVar="index" id="catApprDt"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<ac:paginator for="catApprDt" />
			<p:columnGroup type="header">
				<p:row>
					<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
						style="width : 2%;" />
					<p:column style="width :350px;white-space : normal"
						headerText="#{lbl['lbl.sm.catCodes.cate']}" />
					<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}" />
					<p:column headerText="#{lbl['lbl.sm.status']}" />
					<p:column headerText="#{lbl['lbl.sm.remark']}" />
				</p:row>
			</p:columnGroup>
			<p:column style="width : 2%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>
			<p:column style="width :350px;white-space : normal">
				<h:outputText
					value="#{aprvdCatBean.pmCategoryL1.categoryL1Code} -  #{aprvdCatBean.pmCategoryL1.categoryName}" />
				<br />
				<h:outputText
					value="#{aprvdCatBean.pmCategoryL2.categoryL2Code} -  #{aprvdCatBean.pmCategoryL2.categoryName}" />
				<br />
				<h:outputText
					value="#{aprvdCatBean.pmCategoryL3.categoryL3Code} -  #{aprvdCatBean.pmCategoryL3.categoryName}" />
			</p:column>

			<p:column>
				<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
					rendered="#{!aprvdCatBean.specialCategory}" />
				<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
					rendered="#{aprvdCatBean.specialCategory}" />
			</p:column>
			<p:column>
				<table style="width: 100%; border: none !important; table-layout: fixed !important;">
					<tr>
						<td style="border: none !important; white-space: normal;"><b><h:outputText value="#{lbl['lbl.sm.po']} :" /></b></td>
						<td style="border: none !important; white-space: normal; word-wrap: break-word !important;">
							<p:outputPanel rendered="#{not empty aprvdCatBean.poDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}" rendered="#{aprvdCatBean.poDecFlg eq 1}" />
								<h:outputText value="#{lbl['lbl.sm.catCodes.rejected']}" rendered="#{aprvdCatBean.poDecFlg eq 0}" />
							</p:outputPanel>
							<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty aprvdCatBean.poDecFlg}" />
						</td>
					</tr>
					<tr>
						<td style="border: none !important; white-space: normal;"><b><h:outputText value="#{lbl['lb.sm.approver']} :" /></b></td>
						<td style="border: none !important; white-space: normal; word-wrap: break-word !important;">
							<p:outputPanel rendered="#{not empty aprvdCatBean.apprvrDecFlg}">
								<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}" rendered="#{aprvdCatBean.apprvrDecFlg eq 1}" />
								<h:outputText value="#{lbl['lbl.sm.catCodes.rejected']}" rendered="#{aprvdCatBean.apprvrDecFlg eq 0}" />
							</p:outputPanel>
							<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty aprvdCatBean.apprvrDecFlg}" />
						</td>
					</tr>
				</table>
			</p:column>
			<p:column>
				<table style="width: 100%; border: none !important; table-layout: fixed !important;">
					<tr>
						<td style="border: none !important; white-space: normal;"><b><h:outputText value="#{lbl['lbl.sm.po']} :" /></b></td>
						<td style="border: none !important; white-space: normal; word-wrap: break-word !important;">
							<h:outputText value="#{aprvdCatBean.poRemarks}" rendered="#{not empty aprvdCatBean.poDecFlg}" />
							<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty aprvdCatBean.poDecFlg}" />
						</td>
					</tr>
					<tr>
						<td style="border: none !important; white-space: normal;"><b><h:outputText value="#{lbl['lb.sm.approver']} :" /></b></td>
						<td style="border: none !important; white-space: normal; word-wrap: break-word !important;">
							<h:outputText value="#{aprvdCatBean.approverRemarks}" rendered="#{not empty aprvdCatBean.apprvrDecFlg}"/>
							<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty aprvdCatBean.apprvrDecFlg}" />
						</td>
					</tr>
				</table>
			</p:column>
		</p:dataTable>
	</p:panel>

</ui:composition>
