<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:outputPanel id="shareHolderDialog" layout="block">
	<div align="left">
				<p:commandLink
					action="#{viewSmApplBackingBean.backFromPersonnelPage}"
					process="@this" partialSubmit="true" update=":form"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					style="padding-right:5px;">
					<p:commandButton type="button" value="#{lbl['lbl.btn.back']}" />
				</p:commandLink>
	</div>
	<p:panel header="#{lbl['lbl.sm.person.info.hdr']}" toggleable="true"
		id="personDtlInfHdPan">
		<p:outputPanel id="personDtlInfPan" layout="block">
			<table style="width: 100%;table-layout:fixed">
				<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.viewSupplierProfile}">
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.shrHldrInfo.name']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.name}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.nationality']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.pmCountry.countryName}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.identificationtype']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.identificationType.pmParameterDescs.get(0).getCodeName()}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.individual.newicno']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.identificationNo}" /></td>
					</tr>
					<tr>							
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.dob']}" /></td>
						<td><p:outputPanel>
								<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.birthDate}" />
							</p:outputPanel>
						</td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.designation']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.designation}" /></td>							
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.bumi']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.isBumi().booleanValue() ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.religion']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.isMuslim().booleanValue() ? lbl['lbl.sm.person.religion.muslim'] : lbl['lbl.sm.person.religion.non.muslim']}" /></td>
					</tr>
	
					<tr>						
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.pm.profiles.userdetails.salutation']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.title.salutationName}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.email']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.email}" /></td>
					</tr>
					<!-- #13208 - START -->
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.department']}"/></td>
						<td><p:outputLabel style="white-space:normal;word-break:break-all;" styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.department}"/></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.unit']}"/></td>
						<td><p:outputLabel style="white-space:normal;word-break:break-all;" styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.sectionUnit}"/></td>
					</tr>
					<!-- #13208 - END -->
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.telno']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.phoneFull}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mobilenumber']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedPersonnel.mobileFull}" /></td>
					</tr>
					
				</p:outputPanel>
			</table>				
		</p:outputPanel>
	</p:panel>
	<ui:include src="authorizedPersonnelFormViewOnly.xhtml" />
	<ui:include src="personnelAddressFormViewOnly.xhtml" />
	</p:outputPanel>
</ui:composition>
