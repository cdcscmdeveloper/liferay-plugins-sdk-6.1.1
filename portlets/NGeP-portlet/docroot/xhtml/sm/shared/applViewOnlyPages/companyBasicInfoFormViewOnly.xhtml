<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.panHdr.comBasic']}" toggleable="true"
		id="basHdPan">
		<p:panel id="bsInfPan">
			<table style="width: 100%">
				<tr>

					<td><p:outputLabel value="#{lbl['lbl.sm.companyname']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.companyName}" /></td>
					
					<td><p:outputLabel value="#{lbl['lbl.sm.application.no']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.applNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.regtype']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.supplierBusinessTypeVal}" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.rocNo']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smSupplier.regNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.taxRefNo']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.incomeTaxNo}" /></td>
					
					<td><p:outputLabel value="#{lbl['lbl.sm.estdate']} :" /></td>
					<td style="font-size: 12px;font-weight: normal;font-family: Arial">
						<h:outputText value="#{viewSmApplBackingBean.managedBean.smSupplier.establishDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.companyaddress']} :" /></td>
					<td style="float:left"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.country']} :" /></td>
					<td style="float:left"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCountry.countryName}"/></td>
				</tr>
				<tr>
					<td></td>
					<td style="float:left"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.state']} :" /></td>
					<td style="float:left"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateName}"/></td>
				</tr>
				<tr>
					<td></td>
					<td style="float:left"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.district']} :" /></td>
					<td style="float:left"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict.districtName}"/></td>
				</tr>
				<tr>
					<td></td>
					<td style="float:left"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address4}" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.towncity']} :" /></td>
					<td style="float:left"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity.cityName}"/></td>
				</tr>
						

				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.postcode']} :" />
					</td>
					<td style="float:left;">
						<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}" /> 
					</td>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.annualRev']} :" />
					</td>
					<td style="float:left;">
						<p:outputLabel value="#{lbl['lbl.sm.annualRev.less.than.100k']}" 
							rendered="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.annualRevenue eq '1'}"/>
						<p:outputLabel value="#{lbl['lbl.sm.annualRev.less.than.500k']}" 
							rendered="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.annualRevenue eq '2'}"/>
						<p:outputLabel value="#{lbl['lbl.sm.annualRev.less.than.1m']}" 
							rendered="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.annualRevenue eq '3'}"/>
						<p:outputLabel value="#{lbl['lbl.sm.annualRev.more.than.1m']}" 
							rendered="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.annualRevenue eq '4'}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']} :" /></td>
					<td style="float:left;">
						<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.phoneNo}"/>
					</td>
					
					<td><p:outputLabel value="#{lbl['lbl.sm.faxno']} :" /></td>
					<td style="float:left;">
						<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.faxNo}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.website']} :" /></td>
					<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.website}" />
					</td>
				</tr>
			</table>
		</p:panel>

	</p:panel>
</ui:composition>
