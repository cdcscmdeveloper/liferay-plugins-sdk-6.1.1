<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.panHdr.comBasic']}" toggleable="true"
		id="basHdPan">
		<p:panel id="bsInfPan">
			<table style="width: 100%">
				<tr>

					<td><p:outputLabel value="#{lbl['lbl.sm.companyname']}" /></td>
					<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.companyName}" /></td>
					
					<td><p:outputLabel value="#{lbl['lbl.sm.application.no']}" /></td>
					<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.applNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.regtype']}" /></td>
					<td><p:selectOneMenu
							value="#{viewSmApplBackingBean.managedBean.smSupplier.businessType}"
							disabled="true">
							<f:selectItems value="#{viewSmApplBackingBean.managedBean.businessTypeLs}"/>
						</p:selectOneMenu>
					</td>
					<td><p:outputLabel value="#{lbl['lbl.sm.rocNo']}" /></td>
					<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smSupplier.regNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.taxRefNo']}" /></td>
					<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.incomeTaxNo}" /></td>
					
					<td><p:outputLabel value="#{lbl['lbl.sm.estdate']}" /></td>
					<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smSupplier.establishDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:outputLabel></td>
				</tr>
				<tr>
					<td style="vertical-align: top;"><p:outputLabel
							value="#{lbl['lbl.sm.companyaddress']}" style="padding-top :5px;" />
						</td>
					<td>
						<table style="width: 100%">
							<tr>
								<td>
									<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}" />
								</td>
							</tr>
							<tr>
								<td>
									<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}" />
								</td>
							</tr>
							<tr>
								<td>
									<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}" />
								</td>
							</tr>
							<tr>
								<td>
									<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address4}" />
								</td>
							</tr>
						</table>
					</td>
					<td>
						<TABLE style="width: 100%; height: 100px;">
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /></td>
							</tr>
						</TABLE>
					</td>
					<td>
						<TABLE style="width: 100%">
							<tr>
								<td>
									<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCountry.countryName}"/>
								</td>
							</tr>
							<tr>

								<td>
									<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateName}"/>
								</td>
							</tr>
							<tr>
								<td>
									<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict.districtName}"/>
								</td>

							</tr>,
							<tr>
								<td>
									<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity.cityName}"/>
								</td>
							</tr>
						</TABLE>
					</td>
				</tr>

				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.postcode']}" />
					</td>
					<td>
						<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}" /> 
					</td>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.annualRev']}" />
					</td>
					<td>
						<p:outputLabel value="Kurang Daripada RM 100,000" 
							rendered="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.annualRevenue eq '1'}"/>
						<p:outputLabel value="Kurang Daripada RM 500,000" 
							rendered="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.annualRevenue eq '2'}"/>
						<p:outputLabel value="Kurang Daripada RM 1,000,000" 
							rendered="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.annualRevenue eq '3'}"/>
						<p:outputLabel value="Lebih Daripada RM 1,000,000" 
							rendered="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.annualRevenue eq '4'}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td>
						<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.phoneNo}"/>
					</td>
					
					<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" /></td>
					<td>
						<p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.faxNo}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.website']}" /></td>
					<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.website}" />
					</td>
				</tr>
			</table>
		</p:panel>

	</p:panel>
</ui:composition>
