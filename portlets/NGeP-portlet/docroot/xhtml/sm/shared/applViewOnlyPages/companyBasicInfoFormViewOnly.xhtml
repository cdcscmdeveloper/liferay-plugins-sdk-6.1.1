					<p:outputPanel

							<td><p:outputLabel styleClass="outputLabel-view"

									value="#{lbl['lbl.sm.sme.status.type.manmicro']}"

								<p:outputLabel styleClass="outputLabel-view"
									value="#{lbl['lbl.sm.sme.status.type.mansmall']}"
									rendered="#{viewSmApplBackingBean.managedBean.smeSupplier.smeStatusType eq 'MANSMALL'}" />
								<p:outputLabel styleClass="outputLabel-view"
									value="#{lbl['lbl.sm.sme.status.type.manmed']}"
									rendered="#{viewSmApplBackingBean.managedBean.smeSupplier.smeStatusType eq 'MANMED'}" />

									value="#{lbl['lbl.sm.sme.status.type.sersmall']}"
									rendered="#{viewSmApplBackingBean.managedBean.smeSupplier.smeStatusType eq 'SERSMALL'}" />

									value="#{lbl['lbl.sm.sme.txt.no']}"

										<f:convertDateTime pattern="dd/MM/yyyy" />
									</h:outputLabel></td>
