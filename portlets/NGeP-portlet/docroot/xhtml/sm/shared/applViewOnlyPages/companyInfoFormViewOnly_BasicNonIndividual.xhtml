<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<h:panelGroup id="compInfoPanGrp">
	<p:panel header="#{lbl['lbl.sm.comp.info.hdr']}" toggleable="true"
		id="compInfoHdPan">
		<p:outputPanel id="compInfoPan" layout="block">
			<table style="width: 100%;table-layout:fixed">
				<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.viewSupplierProfile}">
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.epno']}" /></td>
						<td>
							<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smSupplier.epNo}" />
						</td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.created.date']}" /></td>
						<td>
							<p:outputPanel>
								<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smSupplier.createdDate}" />
							</p:outputPanel>
						</td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.sap.vendor.code']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.sapVendorCode}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.businessregno']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smSupplier.regNo}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.supplier.name']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smSupplier.companyName}" /></td>
						<!-- #24819 - start -->
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.new.business.regNo']}" /></td>
						<td>
							<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplier.ssmNewRegNo}" 
								rendered="#{not empty viewSmApplBackingBean.managedBean.smAppl.smSupplier.ssmNewRegNo}"/>
								&#160;
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
								rendered="#{empty viewSmApplBackingBean.managedBean.smAppl.smSupplier.ssmNewRegNo}"/>
						</td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.company.type']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.supplierBusinessTypeVal}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.estdate']}" /></td>
						<td><p:outputPanel>
								<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smSupplier.establishDate}" />
							</p:outputPanel>
						</td>
						<!-- #24819 - end -->
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.taxRefNo']}" /></td>
						<td>
						<c:if test="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.incomeTaxNo != null}">
						<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.incomeTaxNo}" />
						</c:if>
						<c:if test="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.incomeTaxNo == null}">
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" />
						</c:if>
						</td>
					<c:if test="#{not empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses}">
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCountry.countryName}"/></td>
					</c:if>
					</tr>
					<c:if test="#{not empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses}">
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.companyaddress']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateName}"/></td>
					</tr>
					<!-- 13320 -->
					<tr>
					<td></td>
					<td></td>
						<!-- #13320 - render division-->
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.division']}" 
											rendered="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.adoptDivision}"/></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDivision.divisionName}" 
											rendered="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.adoptDivision}"/></td>
						<!-- #13320 - render division - end-->
					</tr>
					<tr>						
						<c:choose>
						<c:when test="#{empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2.trim()
						and empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3.trim()}">
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}" /></td>
						</c:when>
						<c:when test="#{empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2.trim()
						and not empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3.trim()}">
						<td></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}" /></td>
						</c:when>
						<c:otherwise>
						<td></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}" /></td>
						</c:otherwise>
						</c:choose>						
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict.districtName}" /></td>
					</tr>
					<tr>
						<c:choose>
						<c:when test="#{empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2.trim()
						and empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3.trim()}">
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.telno']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.phoneFull}" /></td>
						</c:when>
						<c:when test="#{not empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2.trim()
						and empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3.trim()}">
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}" /></td>
						</c:when>
						<c:otherwise>
						<td></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}" /></td>
						</c:otherwise>
						</c:choose>						
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity.cityName}" /></td>
					</tr>
					<tr>
						<c:choose>
						<c:when test="#{empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2.trim()
						and empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3.trim()}">
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.coordinate']}" /></td>
						<td>
						<c:choose>
						<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.mapLatitude != null 
						and viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.mapLongitude != null}">
						<p:outputLabel styleClass="outputLabel-view" value=
						"X: #{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.mapLatitude} 
						Y: #{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.mapLongitude}" />
						</c:when>
						<c:otherwise>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" />
						</c:otherwise>
						</c:choose>					
						</td>
						</c:when>
						<c:when test="#{empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2.trim()
						or empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3.trim()}">
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.telno']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.phoneFull}" /></td>
						</c:when>
						<c:otherwise>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}" /></td>
						</c:otherwise>
						</c:choose>						
						<td></td>
					</tr>
					</c:if>
					<tr>
						<c:choose>
						<c:when test="#{not empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses}">
						<c:choose>
						<c:when test="#{(empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2.trim()
						and not empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3.trim())
						or (not empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2.trim()
						and empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3.trim())}">
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.coordinate']}" /></td>
						<td>
						<c:choose>
						<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.mapLatitude != null 
						and viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.mapLongitude != null}">
						<p:outputLabel styleClass="outputLabel-view" value=
						"X: #{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.mapLatitude} 
						Y: #{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.mapLongitude}" />
						</c:when>
						<c:otherwise>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" />
						</c:otherwise>
						</c:choose>						
						</td>
						</c:when>
						<c:when test="#{empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2.trim()
						and empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3.trim()}">
						<td colspan="2"></td>
						</c:when>
						<c:otherwise>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.telno']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.phoneFull}" /></td>
						</c:otherwise>
						</c:choose>		
						</c:when>
						<c:otherwise>
						<td colspan="2"></td>
						</c:otherwise>
						</c:choose>				
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.faxno']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.faxFull}" /></td>
					</tr>
					<tr>
						<c:choose>
						<c:when test="#{not empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses}">
						<c:choose>
						<c:when test="#{not empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2.trim()
						and not empty viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3.trim()}">
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.coordinate']}" /></td>
						<td>
						<c:choose>
						<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.mapLatitude != null 
						and viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.mapLongitude != null}">
							<p:outputLabel styleClass="outputLabel-view" value=
							"X: #{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.mapLatitude} 
							Y: #{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.mapLongitude}" />
						</c:when>
						<c:otherwise>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" />
						</c:otherwise>
						</c:choose>	
						</td>
						</c:when>
						<c:otherwise>
						<td colspan="2"></td>
						</c:otherwise>
						</c:choose>
						</c:when>
						<c:otherwise>
						<td colspan="2"></td>
						</c:otherwise>	
						</c:choose>						
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.local.authority']}" /></td>
						<td>
						<c:choose>
						<c:when test="#{viewSmApplBackingBean.managedBean.localAuthority != null}">
						<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.localAuthority}" />
						</c:when>
						<c:otherwise>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" />
						</c:otherwise>						
						</c:choose>
						</td>							
					</tr>					
				</p:outputPanel>				
			</table>				
		</p:outputPanel>
	</p:panel>	
	<p:panel header="#{lbl['lbl.sm.comp.owner.info.hdr']}" toggleable="true"
		id="ownDirHdPan">
		<p:outputPanel id="ownDirInfPan" layout="block">
			<table style="width: 100%;table-layout:fixed">
				<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.viewSupplierProfile}">
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.owner.name']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplier.smSupplierOwners.get(0).getOwnerName()}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.nationality']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplier.smSupplierOwners.get(0).getNationality().getCountryName()}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.individual.newicno']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplier.smSupplierOwners.get(0).getIdentificationNo()}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.identificationtype']}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smSupplier.smSupplierOwners.get(0).getIdentificationType().getPmParameterDescs().get(0).getCodeName()}" /></td>
					</tr>
				</p:outputPanel>
			</table>				
		</p:outputPanel>
	</p:panel>
	</h:panelGroup>
</ui:composition>
