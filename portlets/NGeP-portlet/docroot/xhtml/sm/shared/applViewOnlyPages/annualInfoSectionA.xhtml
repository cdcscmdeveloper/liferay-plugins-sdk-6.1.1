<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	

	<p:panel toggleable="true" id="partCompPanel">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sm.partCompany.panHdr']}" />
		</f:facet>
		
		<h:panelGrid  columns="2" layout="grid">
				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.addressOffice']} :"></h:outputLabel>
				<h:outputText 
					value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.registerAdressSSM}" escape="false"></h:outputText>
					
				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.natureofbusiness']} :"></h:outputLabel>
				<h:outputText
					value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.businessDesc}"></h:outputText>
			</h:panelGrid>
	</p:panel>
	
	<p:panel toggleable="true" id="partShareHoldPanel">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sm.partShareHold.panHdr']}" />
		</f:facet>	
		
		<h:panelGrid  columns="2" layout="grid">
				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.paidUpCapital']} :"></h:outputLabel>
				<h:outputText
					value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.paidUpCapital}"></h:outputText>
					
		</h:panelGrid>
	</p:panel>
	
	<p:panel toggleable="true" id="partIndebtPanel">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sm.partIndebt.panHdr']}" />
		</f:facet>
		
		<h:panelGrid  columns="2" layout="grid">
				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.nameofChargee']} :"></h:outputLabel>
				<h:outputText
					value="#{viewSmApplBackingBean.managedBean.smAppl.smApplIndebtedness.chargeeName}"></h:outputText>
					
					<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.dateofRgistration']} :"></h:outputLabel>
				<h:outputText
					value="#{viewSmApplBackingBean.managedBean.smAppl.smApplIndebtedness.dateOfRegistration}"></h:outputText>
					
					<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.chargeAmount']} :"></h:outputLabel>
				<h:outputText
					value="#{viewSmApplBackingBean.managedBean.smAppl.smApplIndebtedness.chargeAmount}"></h:outputText>
					
		</h:panelGrid>
	</p:panel>
</ui:composition>
