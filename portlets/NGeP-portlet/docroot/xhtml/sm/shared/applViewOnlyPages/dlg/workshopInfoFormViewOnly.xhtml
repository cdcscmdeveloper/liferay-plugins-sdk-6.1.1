<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.workshop.details']}" toggleable="true"
		id="smWorkShopDtPanel">
		
		<p:outputPanel rendered="#{empty viewSmApplBackingBean.managedBean.workshopFacilitiesVOList}">
			<h:outputText value="#{lbl['lbl.sm.workShop.notApplicable']}" />
		</p:outputPanel>
		
		<ui:repeat var="workshopCatVar" value="#{viewSmApplBackingBean.managedBean.workshopFacilitiesVOList}" varStatus="workshopCatVarStatus">
			<table style="width: 100%;">
					<tr>
						<td>
						<!-- 29380 - Site Visit Grouping Enhancement -28775 -->
					    <p:outputLabel value="#{workshopCatVarStatus.index + 1}. #{workshopCatVar.fullCatcode} 
					    	(#{viewSmApplBackingBean.getSupplierCategoryName(workshopCatVar, false, true)})" 
					    	style="word-wrap:break-word; float:left !important; text-align:left !important;"/>
						</td>
					</tr>
			</table>
			<br />
			
			<p:dataTable var="work" widgetVar="smWorkShopDtWidVar"
				value="#{workshopCatVar.facilityList}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{work}" rowIndexVar="index" id="workDt">
				<ac:paginator for="workDt" />

				<p:column headerText="#{lbl['lbl.sm.facility.workshop.name']}">
					<p:outputPanel rendered="#{not empty work.smSupplierCategoryFacilities and work.smSupplierCategoryFacilities.size() gt 1}">
						<p:graphicImage value="/css/images/design/ico-same-with.png" 
							title="#{lbl['lbl.sm.facility.address.attach.more.than.one.category']}" />&#160;
					</p:outputPanel>
					<h:outputText value="#{work.facilityName}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.workshop.address']}"
					style="width :60%;white-space : normal">
					<h:outputText value="#{viewSmApplBackingBean.getFullAddress(work.smAddress)}"
						style="float : left" />
						
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.action']}" style="text-align: center  !important;">
					<p:commandLink partialSubmit="true" process="@this" onstart="blockWidget.show()"
						action="#{viewSmApplBackingBean.assignSelWorkshop(work)}" oncomplete="viewWorkShopDialog.show()"
						update=":#{p:component('viewWorkShopDialog')}" style="padding-right:5px">
						<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
					</p:commandLink>
				</p:column>

			</p:dataTable><br />
		</ui:repeat>
						
	</p:panel>
	
	<!-- 29379 - Site Visit Grouping Enhancement -28775 -->
	<p:dialog style="max-height:450px;width:900px;" header="#{lbl['lbl.sm.workshop.information']}"
		widgetVar="viewWorkShopDialog" resizable="false" showEffect="fade"
		closable="true" hideEffect="fade" id="viewWorkShopDialog">
		
		<p:scrollPanel mode="native" style="max-height:400px;width:900px;border:none">
			<table style="width: 100%;table-layout:fixed">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.facilityType']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.facilityType}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.name']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.facilityName}" /></td>
				</tr>
				<tr>
					<td style="vertical-align: baseline;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.category']}" /></td>
					<td>
						<ui:repeat var="catFac" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smSupplierCategoryFacilities}">
							<p:outputLabel value="#{catFac.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}
										#{catFac.pmCategoryL3.pmCategoryL2.categoryL2Code}
										#{catFac.pmCategoryL3.categoryL3Code}
									 	(#{catFac.pmCategoryL3.categoryName})" 
								styleClass="outputLabel-view" /><br />
						</ui:repeat>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.address']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.address1}" /></td>
				</tr>
	
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.address2}" /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.address3}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmCountry.countryName}" /></td>
				</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmState.stateName}" /></td>
				</tr>
				
				<tr><!-- #13320 - added division -->
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.division']}" 
										rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmState.adoptDivision}"/></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmDivision.divisionName}" 
										rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmState.adoptDivision}"/></td>
				</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmDistrict.districtName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.pmCity.cityName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smAddress.postcode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.phoneFull}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.faxno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.faxFull}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sc.spec.area.feat']}" /></td>
					<td>
						<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.areaSquareFeet}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.ownerType']}" /></td>
					<td>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.own']}" rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O'}" />
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.facility.rent']}" rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}" />
					</td>
				</tr>
				<tr>
					<td><p:outputPanel id="workPanLbl">
							<p:outputLabel value="#{lbl['lbl.cm.price']}" styleClass="outputLabel-view-label"
								rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O'}" />
							<p:outputLabel value="#{lbl['lbl.sm.facility.rent.rm']}" styleClass="outputLabel-view-label"
								rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}" />
						</p:outputPanel></td>
					<td><p:outputPanel id="workPan">
							<ui:fragment
								rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'O'}">
								<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.purchasePrice}" />
							</ui:fragment>
							<ui:fragment
								rendered="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownershipType eq 'R'}">
								<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.rentalRate}" />
							</ui:fragment>
						</p:outputPanel>
					</td>
				</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.facility.ownerName']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.ownerName}" /></td>
				</tr>
	
			</table>
			<!-- 29379 - Site Visit Grouping Enhancement - 28775 - start -->
			<p:panel header="#{lbl['lbl.sm.employee.info']}" toggleable="true">
				<p:dataTable var="empInfo" id="empInfoId" rowKey="#{empInfo}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{viewSmApplBackingBean.managedBean.selectedWorkShopFacility.smSvWorkers}">

					<p:column headerText="#{lbl['lbl.sm.employee.name']}">
						<p:outputLabel value="#{empInfo.name}"/>
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.employee.idtype']}">
						<p:outputLabel value="#{viewSmApplBackingBean.getParamDescByParameterId(empInfo.identificationTypeId)}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.employee.icno']}">
						<p:outputLabel value="#{empInfo.identificationNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.employee.specialization']}" style="white-space:normal;">
						<p:outputLabel value="#{empInfo.expertise}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.employee.experience']}">
						<p:outputLabel value="#{empInfo.workExpYear}" />
					</p:column>
				</p:dataTable>
			</p:panel>
			<!-- 29379 - Site Visit Grouping Enhancement - 28775 - end -->
		</p:scrollPanel>
	</p:dialog>
</ui:composition>
