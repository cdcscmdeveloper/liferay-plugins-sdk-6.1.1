<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- #33783 -->
	<p:panel header="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.companyTypeSSM 
		== SupplierManagementConst.COMPANY_TYPE_CLBG ? 
		lbl['lbl.sm.equiComp.panHdr.clbg'] : lbl['lbl.sm.equiComp.panHdr']}" toggleable="true">
		
		<p:outputPanel id="equiInfPan" layout="block">
			
			<p:dataTable var="equiBean" widgetVar="suppEquiCompDtWidVar" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smEquityCompanies}"
				rowKey="#{equiBean}" rowIndexVar="index" id="eqiComDt">
				<ac:paginator for="eqiComDt" />

				<p:column headerText="#{lbl['lbl.sm.equiComp.compName']}" style="white-space: break-spaces;">
					<h:outputText value="#{equiBean.companyName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.equiComp.addr']}" style="white-space:normal;word-break:break-word;">
					<h:outputText
						value="#{viewSmApplBackingBean.getFullAddress(equiBean.smAddress)}"
						style="float : left" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.equiComp.shrAmt']}">
					<ac:labelAmount value="#{equiBean.shareAmt}" styleClass="outputLabel-view"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.equiComp.shrPerc']}">
					<ac:labelEquityAmount value="#{equiBean.sharePercentage}" styleClass="outputLabel-view"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink update=":form:tt:eqiCompDialog" partialSubmit="true"
						process="@this" oncomplete="eqiCompDialog.show()"
						action="#{viewSmApplBackingBean.assignSelEquiCompany(equiBean)}">
						<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}"
						style="margin-right:2px;" />
					</p:commandLink>
					<!-- #32008 -->
					<ac:smFieldChangeTableAlertView object="#{equiBean}" />
				</p:column>
			</p:dataTable>
		</p:outputPanel>
		
		<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
						poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.equityCompRemark}" 
						approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.equityCompRemark}" />
						
	</p:panel>
	<p:dialog style="max-height:350px;width:500px"
		header="#{lbl['lbl.sm.equiComp.dialHdr']}" id="eqiCompDialog"
		widgetVar="eqiCompDialog" resizable="false" closable="true"
		showEffect="fade" hideEffect="fade" modal="true">
		
		<p:scrollPanel mode="native" style="max-height:300px;width:450px;border:none">
			<table style="width: 100%;table-layout:fixed">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiComp.compName']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.companyName}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.companyName}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.companyName}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.companyName}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiComp.regNo']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.regNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiComp.shrAmt']}" /></td>
					<td>
						<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.shareAmt}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges 
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.shareAmt}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.shareAmt}" 
							alertValue="#{viewSmApplBackingBean.getPriceAmountFormat(viewSmApplBackingBean.managedBean.latestEquityCompany.shareAmt)}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiComp.shrPerc']}" /></td>
					<td>
						<ac:labelEquityAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.sharePercentage}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.sharePercentage}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.sharePercentage}" 
							alertValue="#{viewSmApplBackingBean.getPriceAmountFormat(viewSmApplBackingBean.managedBean.latestEquityCompany.sharePercentage)}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiComp.addr']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.address1}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.address1}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.address1}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.address1}"/></td>
				</tr>
	
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.address2}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.address2}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.address2}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.address2}"/></td>
				</tr>
				<tr>
					<td></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.address3}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.address3}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.address3}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.address3}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmCountry.countryName}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.pmCountry.countryId}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmCountry.countryId}" 
							alertValue="#{(not empty viewSmApplBackingBean.managedBean.latestEquityCompany and 
							 	not empty viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress) ?
								viewSmApplBackingBean.getCountryLabelById(viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.pmCountry.countryId)
								: lbl['lbl.txt.na']}"/></td>
				</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmState.stateName}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.pmState.stateId}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmState.stateId}" 
							alertValue="#{(not empty viewSmApplBackingBean.managedBean.latestEquityCompany and 
							 	not empty viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress) ?
								viewSmApplBackingBean.getStateLabelById(viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.pmState.stateId)
								: lbl['lbl.txt.na']}"/></td>
				</tr>
				<!-- 13320 -->
					<tr>
						<!-- #13320 - render division -->
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.division']}" 
											rendered="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmState.adoptDivision}" /></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmDivision.divisionName}" 
											rendered="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmState.adoptDivision}" />
							<!-- #32008 -->
							<ac:smFieldChangeAlertView 
								isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
									and viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmState.adoptDivision
									and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
								oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.pmDivision.divisionId}" 
								currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmDivision.divisionId}" 
								alertValue="#{(not empty viewSmApplBackingBean.managedBean.latestEquityCompany and 
								 	not empty viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress) ?
									viewSmApplBackingBean.getDivisionLabelById(viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.pmDivision.divisionId)
									: lbl['lbl.txt.na']}"/></td>
						<!-- #13320 - render division - end-->
					</tr>
	
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmDistrict.districtName}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.pmDistrict.districtId}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmDistrict.districtId}" 
							alertValue="#{(not empty viewSmApplBackingBean.managedBean.latestEquityCompany and 
							 	not empty viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress) ?
								viewSmApplBackingBean.getDistrictLabelById(viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.pmDistrict.districtId)
								: lbl['lbl.txt.na']}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmCity.cityName}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.pmCity.cityId}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.pmCity.cityId}" 
							alertValue="#{(not empty viewSmApplBackingBean.managedBean.latestEquityCompany and 
							 	not empty viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress) ?
								viewSmApplBackingBean.getCityLabelById(viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.pmCity.cityId)
								: lbl['lbl.txt.na']}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.postcode}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.postcode}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.smAddress.postcode}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.smAddress.postcode}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.phoneFull}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.phoneNo}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.phoneNo}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.phoneNo}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.faxno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.faxFull}" />
						<!-- #32008 -->
						<ac:smFieldChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges
								and not empty viewSmApplBackingBean.managedBean.latestEquityCompany.equityCompanyId}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.faxNo}" 
							currValue="#{viewSmApplBackingBean.managedBean.selectedEquityCompany.faxNo}" 
							alertValue="#{viewSmApplBackingBean.managedBean.latestEquityCompany.faxNo}"/></td>
				</tr>
	
			</table>
		</p:scrollPanel>
	</p:dialog>
</ui:composition>
