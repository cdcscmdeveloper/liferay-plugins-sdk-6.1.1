<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	
	<p:panel header="#{lbl['lbl.sm.po.approver.decision.header']}">
		<table style="width: 75%;table-layout: fixed;">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.curr.regstatus']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.currRegStatus}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.overlap.category.remark']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.poApprOverlappedRemark}"
						rendered="#{not empty viewSmApplBackingBean.managedBean.poApprOverlappedRemark}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.poApprOverlappedRemark}" />
				</td>  
			</tr>
			
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.po.decision.header']}">
		<table style="width: 75%;table-layout: fixed;">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.name']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.poUserName}" 
						rendered="#{not empty viewSmApplBackingBean.managedBean.poUserName}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.poUserName}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.remark']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.poRemark}" 
						rendered="#{not empty viewSmApplBackingBean.managedBean.poRemark}" />
				    <p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.poRemark}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.remark.date']}" /></td>
				<td><c:if test="#{not empty viewSmApplBackingBean.managedBean.poRemarkCreatedDate}" >
					<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.poRemarkCreatedDate}" />
					</c:if>
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.poRemarkCreatedDate}" />
				</td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.approver.decision.header']}">
		<table style="width: 75%;table-layout: fixed;">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.name']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.approverUserName}" 
						rendered="#{not empty viewSmApplBackingBean.managedBean.approverUserName}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.approverUserName}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.remark']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.approverRemark}" 
						rendered="#{not empty viewSmApplBackingBean.managedBean.approverRemark}"/>
				    <p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.approverRemark}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.remark.date']}" /></td>
				<td><c:if test="#{not empty viewSmApplBackingBean.managedBean.approverRemarkCreatedDate}" >
						<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.approverRemarkCreatedDate}" />
					</c:if>
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.approverRemarkCreatedDate}" />
				</td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.approver.decision.cancel.header']}">
		<table style="width: 75%; table-layout: fixed">
			<tr height="10">
				<td colspan="2"></td>
			</tr>			
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.approver.decision.cancelMofAccount']}" /></td>
				<td><c:choose>
						<c:when test="#{fn:containsIgnoreCase(viewSmApplBackingBean.managedBean.currentStatus, 'APPROVED')}">
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.catCodes.apprByApr']}"/>
						</c:when>
						<c:when test="#{fn:containsIgnoreCase(viewSmApplBackingBean.managedBean.currentStatus, 'REJECTED')}">
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.catCodes.rejByApr']}"/>
						</c:when>
						<c:otherwise>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}"/>
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.dateSubmitted']}" /></td>
				<td><c:choose>
						<c:when test="#{fn:containsIgnoreCase(viewSmApplBackingBean.managedBean.currentStatus, 'APPROVED')}">
							<ac:labelDate styleClass="outputLabel-view"
								value="#{viewSmApplBackingBean.managedBean.smAppl.applSubmitDate}" />
						</c:when>
						<c:when test="#{fn:containsIgnoreCase(viewSmApplBackingBean.managedBean.currentStatus, 'REJECTED')}">
							<ac:labelDate styleClass="outputLabel-view"
								value="#{viewSmApplBackingBean.managedBean.smAppl.applSubmitDate}" />
						</c:when>
						<c:otherwise>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}"/>
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.reason.supplier']}" /></td>
				<td><c:choose>
						<c:when test="#{fn:containsIgnoreCase(viewSmApplBackingBean.managedBean.currentStatus, 'APPROVED')}">
							<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.supplierRemarks}"/>
						</c:when>
						<c:when test="#{fn:containsIgnoreCase(viewSmApplBackingBean.managedBean.currentStatus, 'REJECTED')}">
							<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.supplierRemarks}"/>
						</c:when>
						<c:otherwise>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}"/>
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.supportingdoc.panel.supportingdoc']}"
						styleClass="outputLabel-view-label" /></td>
				<td><p:commandButton value="#{lbl['lbl.btn.download']}"
						style="float: left;"
						disabled="#{empty viewSmApplBackingBean.managedBean.cancellationAttachment.fileName}"
						action="#{viewSmApplBackingBean.downloadSelectedSuppDoc(viewSmApplBackingBean.managedBean.cancellationAttachment.fileName,viewSmApplBackingBean.managedBean.cancellationAttachment.filePath)}"
						update=":form" ajax="false">
						<p:fileDownload value="#{viewSmApplBackingBean.file}" />
					</p:commandButton> 
					
					<p:outputLabel
						value="#{viewSmApplBackingBean.managedBean.cancellationAttachment.fileName}"
						style="float: left;padding: 12px 0px 0px 10px;font-weight: normal !important;"
						rendered="#{viewSmApplBackingBean.managedBean.cancellationAttachment.fileName ne null}" />
						
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						style="float: left;padding: 12px 0px 0px 10px;font-weight: normal !important;"
						rendered="#{empty viewSmApplBackingBean.managedBean.cancellationAttachment.fileName}"/>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
