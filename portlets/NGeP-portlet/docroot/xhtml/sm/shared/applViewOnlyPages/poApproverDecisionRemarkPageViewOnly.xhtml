<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	
	<p:panel header="#{lbl['lbl.sm.po.approver.decision.header']}">
		<table style="width: 78%;table-layout: fixed;">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.curr.regstatus']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.currRegStatus}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.overlap.category.remark']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.poApprOverlappedRemark}"
						rendered="#{not empty viewSmApplBackingBean.managedBean.poApprOverlappedRemark}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.poApprOverlappedRemark}" />
				</td>  
			</tr>
			
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.po.decision.header']}">
		<table style="width: 78%;table-layout: fixed;">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.name']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.poUserName}" 
						rendered="#{not empty viewSmApplBackingBean.managedBean.poUserName}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.poUserName}" />
				</td>
			</tr>
			<!-- #15629 start -->
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.rejection.reasons.bulk']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" escape="false" value="#{viewSmApplBackingBean.managedBean.rejectReasonByPO}" 
						rendered="#{not empty viewSmApplBackingBean.managedBean.rejectReasonByPO}" />
				    <p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.rejectReasonByPO}" />
				</td>
			</tr>
			<!-- #15629 end -->
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.remark']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.poRemark}" 
						rendered="#{not empty viewSmApplBackingBean.managedBean.poRemark}" />
				    <p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.poRemark}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.remark.date']}" /></td>
				<td><c:if test="#{not empty viewSmApplBackingBean.managedBean.poRemarkCreatedDate}" >
					<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.poRemarkCreatedDate}" />
					</c:if>
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.poRemarkCreatedDate}" />
				</td>
			</tr>
			<!-- #29664 start -->
			<p:column rendered="#{not empty viewSmApplBackingBean.managedBean.poRemarkAfterSiteVisit}">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.name']}" 
						rendered="#{not empty viewSmApplBackingBean.managedBean.secondPoUserName}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.secondPoUserName}" 
						rendered="#{not empty viewSmApplBackingBean.managedBean.secondPoUserName}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.remark']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.poRemarkAfterSiteVisit}" 
						rendered="#{not empty viewSmApplBackingBean.managedBean.poRemarkAfterSiteVisit}" />
				    <p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.poRemarkAfterSiteVisit}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.remark.date']}" /></td>
				<td><c:if test="#{not empty viewSmApplBackingBean.managedBean.poRemarkCreatedDate}" >
					<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.poRemarkAfterSiteVisitCreatedDate}" />
					</c:if>
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.poRemarkAfterSiteVisitCreatedDate}" />
				</td>
			</tr>
			</p:column>			
			<!-- #29664 end -->
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.approver.decision.header']}">
		<table style="width: 78%;table-layout: fixed;">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.name']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.approverUserName}" 
						rendered="#{not empty viewSmApplBackingBean.managedBean.approverUserName}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.approverUserName}" />
				</td>
			</tr>
			<!-- #30974 start -->
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.remark']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.approverRemark}" 
						rendered="#{viewSmApplBackingBean.managedBean.approverRemark ne 'N/A'}"/>
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{viewSmApplBackingBean.managedBean.approverRemark eq 'N/A'}" />
				    <p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.approverRemark}"/>
				</td>
			</tr>
			<!-- #30974 end -->
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.po.approver.decision.remark.date']}" /></td>
				<td><c:if test="#{not empty viewSmApplBackingBean.managedBean.approverRemarkCreatedDate}" >
						<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.approverRemarkCreatedDate}" />
					</c:if>
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.approverRemarkCreatedDate}" />
				</td>
			</tr>
			<!-- #12483 - START -->
			<tr>
				<td style="vertical-align:top !important;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.revise.reason']}" /></td>
				<td>
					<c:if test="#{not empty viewSmApplBackingBean.managedBean.smAppl.smApplRevises}" >
						<ui:repeat var="rev" value="#{viewSmApplBackingBean.managedBean.smAppl.smApplRevises}" varStatus="revStatus">
							<h:outputText value="#{revStatus.index+1}. #{DateUtils.dateToString(CommonConstants.DEFAULT_DATE_FORMAT,rev.createdDate)}" /> : <h:outputText value="#{rev.reviseReason}"/>
							<br />
						</ui:repeat>
					</c:if>
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.revise.notavailable']}" 
						rendered="#{empty viewSmApplBackingBean.managedBean.smAppl.smApplRevises}" />
				</td>
			</tr>
			<!-- #12483 - END -->
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.approver.decision.cancel.header']}">
		<table style="width: 78%; table-layout: fixed">
			<tr height="10">
				<td colspan="2"></td>
			</tr>			
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" style="text-align:right"
						value="#{lbl['lbl.sm.approver.decision.cancelMofAccount']}" /></td>
				<td>
					<c:choose>
						<c:when test="#{(fn:containsIgnoreCase(viewSmApplBackingBean.managedBean.currentStatus, 'REGISTERED')
						or fn:containsIgnoreCase(viewSmApplBackingBean.managedBean.currentStatus, 'BERDAFTAR'))
						and viewSmApplBackingBean.managedBean.smAppl.applType eq 'C'}">
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.approved']}"/>
						</c:when>
						<c:when test="#{(fn:containsIgnoreCase(viewSmApplBackingBean.managedBean.currentStatus, 'REJECTED')
						or fn:containsIgnoreCase(viewSmApplBackingBean.managedBean.currentStatus, 'DITOLAK'))
						and viewSmApplBackingBean.managedBean.smAppl.applType eq 'C'}">
							<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.currentStatus}"/>
						</c:when>
						<c:otherwise>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}"/>
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.dateSubmitted']}" /></td>
				<td>
					<c:choose>
						<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.applType eq 'C'}">
							<ac:labelDateTime 
								value="#{viewSmApplBackingBean.managedBean.smAppl.applSubmitDate}" />
						</c:when>
						<c:otherwise>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}"/>
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.reason.supplier']}" /></td>
				<td>
					<c:choose>
						<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.applType eq 'C'}">
							<p:outputLabel styleClass="outputLabel-view"
								value="#{viewSmApplBackingBean.managedBean.supplierRemarks}" />	
						</c:when>
						<c:otherwise>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}"/>
						</c:otherwise>	
					</c:choose>								
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.supportingdoc.panel.supportingdoc']}"
						styleClass="outputLabel-view-label" /></td>
				<td>
					<c:choose>
						<c:when test="#{viewSmApplBackingBean.managedBean.smAppl.applType eq 'C'}">					
							<p:commandButton value="#{lbl['lbl.btn.download']}" style="float: left;" ajax="false">
								<p:fileDownload value="#{viewSmApplBackingBean.commonDownload(viewSmApplBackingBean.managedBean.cancelRemarkVO.attch.filePath,
									viewSmApplBackingBean.managedBean.cancelRemarkVO.attch.fileName,viewSmApplBackingBean.managedBean.cancelRemarkVO.attch.fileName)}" />
							</p:commandButton> 
					
							<p:outputLabel
								value="#{viewSmApplBackingBean.managedBean.cancelRemarkVO.attch.fileName}"
								style="float: left;padding: 12px 0px 0px 10px;font-weight: normal !important;"
								rendered="#{viewSmApplBackingBean.managedBean.cancelRemarkVO.attch.fileName ne null}" />
								
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" 
								style="float: left;padding: 12px 0px 0px 10px;font-weight: normal !important;"
								rendered="#{empty viewSmApplBackingBean.managedBean.cancelRemarkVO.attch.fileName}"/>
					
						</c:when>
						<c:otherwise>
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}"/>
						</c:otherwise>	
					</c:choose>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
