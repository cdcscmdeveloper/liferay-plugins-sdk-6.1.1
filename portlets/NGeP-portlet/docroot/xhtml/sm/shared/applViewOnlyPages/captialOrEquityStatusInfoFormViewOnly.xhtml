<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.equiStatus.panHdr']}" toggleable="true">
		<p:outputPanel id="capInfPan" layout="block">

			<table style="width: 100%;table-layout:fixed">
				<c:if
					test="#{viewSmApplBackingBean.managedBean.businessTypeVal eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROB_INDIVIDUAL_DEFAULT or 
					viewSmApplBackingBean.managedBean.businessTypeVal eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROB_PARTNER_DEFAULT}">
					
					<tr>
						<td colspan="4">
							<table style="width: 50%;table-layout:fixed">
								<tr>
									<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiStatus.accumCap']}" /></td>
									<td>
										<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.paidUpCapital}" />
									</td>
								</tr>
							</table>
						</td>
					</tr>
				</c:if>
				<c:if
					test="#{viewSmApplBackingBean.managedBean.businessTypeVal eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_DEFAULT or 
					viewSmApplBackingBean.managedBean.businessTypeVal eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_LLP_DEFAULT}">
					
					<tr>
						<td colspan="4">
							<table style="width: 50%;table-layout:fixed">
								<tr>
									<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiStatus.authCap']}" /></td>
									<td>
										<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.authorizedCapital}" />
									</td>
								</tr>
								<tr>
									<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiStatus.paidUpCap']}" /></td>
									<td>
										<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.paidUpCapital}" />
									</td>
								</tr>
							</table>
						</td>
					</tr>
				</c:if>
				<c:if
					test="#{viewSmApplBackingBean.managedBean.businessTypeVal eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROS_DEFAULT}">
					
					<tr>
						<td colspan="4">
							<table style="width: 50%;table-layout:fixed">
								<tr>
									<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiStatus.ttlShare']}" /></td>
									<td>
										<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.totalShare}" />
									</td>
								</tr>
								<tr>
									<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiStatus.accumShr']}" /></td>
									<td>
										<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.paidUpCapital}" />
									</td>
								</tr>
							</table>
						</td>
					</tr>
					
					<tr>
						<td colspan="4">
							<table style="width: 50%;table-layout:fixed">
								<tr>
									<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.equiStatus.members']}" /></td>
									<td>
										<p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.totalMember}" />
									</td>
								</tr>
							</table>
						</td>
					</tr>
				</c:if>
				
				<tr height="10"><td></td></tr>
			</table>
			
			<div align="center">
				<table class="ui-panelgrid ui-widget tablePanel" role="grid" style="width: 100%">
					<tbody>
						<tr class="ui-widget-content" role="row">
							<td class="tableheaderrow" role="gridcell"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.equiStatus.compTabHdr']}" /></td>
							<td class="tableheaderrow" role="gridcell"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.equiStatus.valTabHdr']}" /></td>
							<td class="tableheaderrow" role="gridcell"><p:outputLabel styleClass="outputLabel-view" value="%" /></td>
						</tr>
						<tr class="ui-widget-content" role="row">
							<td class="tableheaderrow" role="gridcell"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.equiStatus.bumi']}" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.bumiEquity}" styleClass="outputLabel-view" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.bumiPercent}" styleClass="outputLabel-view" /></td>
						</tr>
						<tr class="ui-widget-content" role="row">
							<td class="tableheaderrow" role="gridcell"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.equiStatus.nonBumi']}" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.nonBumiEquity}" styleClass="outputLabel-view" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.nonBumiPercent}" styleClass="outputLabel-view" /></td>
						</tr>
						<tr class="ui-widget-content" role="row">
							<td class="tableheaderrow" role="gridcell"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.equiStatus.nonMy']}" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.foreignerEquity}" styleClass="outputLabel-view" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.foriegnerPercent}" styleClass="outputLabel-view" /></td>
						</tr>
						
						<tr class="ui-widget-content" role="row">
							<td class="tableheaderrow" role="gridcell"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.equiStatus.utAgency']}" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.govtUnitrustEquity}" styleClass="outputLabel-view" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.govtUTPercent}" styleClass="outputLabel-view" /></td>
						</tr>
						<tr class="ui-widget-content" role="row">
							<td class="tableheaderrow" role="gridcell"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.equiStatus.govtEquity']}" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.govtEquity}" styleClass="outputLabel-view" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.govtEquityPercent}" styleClass="outputLabel-view" /></td>
						</tr>
						<tr class="ui-widget-content" role="row">
							<td class="tableheaderrow" role="gridcell"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.equiStatus.frgComp']}" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.foreignCompanyEquity}" styleClass="outputLabel-view" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.foriegnCompPercent}" styleClass="outputLabel-view" /></td>
						</tr>
						<tr class="ui-widget-content" role="row">
							<td class="tableheaderrow" role="gridcell"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.equiStatus.lclComp']}" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.localCompanyEquity}" styleClass="outputLabel-view" /></td>
							<td class="tableheaderrow" role="gridcell"><ac:labelAmount value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.localCompPercent}" styleClass="outputLabel-view" /></td>
						</tr>
					</tbody>
				</table>
			</div>
			
			<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
						poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.capitalRemark}" 
						approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.capitalRemark}" />
		</p:outputPanel>
	</p:panel>
</ui:composition>
