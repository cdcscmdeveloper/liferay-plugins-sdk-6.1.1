<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<h:panelGroup id="bankInfPanGrp">
	<p:panel header="#{lbl['lbl.sm.bankDtls.bankDiaHdr']}" toggleable="true" id="bankInfHdPan">
		<p:outputPanel id="bankInfPan" layout="block">
			<p:dataTable var="bankBean" widgetVar="suppBankInfoDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smSupplierBankList}"
				rowKey="#{bankBean}" rowIndexVar="index" id="bankDt">
				
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.row.total']}: #{viewSmApplBackingBean.managedBean.smSupplierBankList.size()}" />
				</f:facet>
				
				<ac:paginator for="bankDt" />

				<p:column headerText="#{lbl['lbl.sm.row.no']}">
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.bankDtls.bankName']}">
					<h:outputText value="#{bankBean.pmFinancialOrg.finOrgName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.bank.account.no']}">
					<h:outputText value="#{bankBean.accountNo}" />
				</p:column>		
				<c:if test="#{viewSmApplBackingBean.managedBean.accountType eq SupplierManagementConst.SUPP_TYPE_GOVT_TO_GOVT}">
				<p:column headerText="#{lbl['lbl.sm.for.hq']}">
					<h:outputText value="#{lbl['lbl.txt.yes']}" rendered="#{bankBean.forHqFlg == 1}" />
					<h:outputText value="#{lbl['lbl.txt.no']}" rendered="#{bankBean.forHqFlg == 0}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.for.branch']}">
				<ui:repeat var="bankBranchBean" value="#{bankBean.smSupplierBranchBanks}" varStatus="status">
					<h:outputText value="#{status.index+1}) " />
					<h:outputText value="#{bankBranchBean.smSupplierBranch.branchName}" /><br />
				</ui:repeat>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.bank.purpose']}">
					<h:outputText value="#{lbl['lbl.sm.paymentLbl']}"
						rendered="#{bankBean.accountPurpose eq 'P' or bankBean.accountPurpose eq 'B'}" /><br />
					<h:outputText value="#{lbl['lbl.sm.bankDtls.registration']}"
						rendered="#{bankBean.accountPurpose eq 'R' or bankBean.accountPurpose eq 'B'}" />
				</p:column>
				</c:if>				
				<p:column headerText="#{lbl['lbl.sm.bank.status']}">
					<h:outputText
						value="#{bankBean.recordStatusFlg == 1 ? lbl['lbl.txt.active'] : lbl['lbl.txt.inactive']}"/>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />			
		</p:outputPanel>
	</p:panel>	
	</h:panelGroup>
</ui:composition>
