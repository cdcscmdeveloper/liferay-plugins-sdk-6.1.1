<!-- #28895_35501 - AUDIT TRAIL SM -->
<ui:component
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:tp="http://java.sun.com/jsf/composite/ep"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.audit.panel.view']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td>
					<div align="right" style="vertical-align: top; width: 100%">
						<p:commandLink value="#{lbl['lbl.txt.print.audit.all']}"
							ajax="false">
							<p:fileDownload
								value="#{auditSupplierManagementDocumentBackingBean.generateRptPdfForAuditTrailDetailsAll(AuditSupplierManagementViewBackingBean.managedBean.auSmSearchBean)}" />
						</p:commandLink>
						&#160;
						<p:commandLink value="#{lbl['lbl.txt.file.audit.download.all']}"
							ajax="false">
							<p:fileDownload
								value="#{auditSupplierManagementDocumentBackingBean.generateRptExcelForAuditTrailDetailsAll(AuditSupplierManagementViewBackingBean.managedBean.auSmSearchBean)}" />
						</p:commandLink>
						&#160;
					</div>
				</td>
			</tr>
			<tr>
				<td><p:tabView id="tabViewCommon"
						activeIndex="#{AuditSupplierManagementViewBackingBean.managedBean.activeIndex}">
						<p:ajax event="tabChange"
							listener="#{AuditSupplierManagementViewBackingBean.onAuditTabChange}"
							update=":form" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()" />
						<c:choose>
							<c:when
								test="#{AuditSupplierManagementViewBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.SUPP_TYPE_BASIC}">
								<p:tab id="#{SupplierManagementConst.auTabIdBankInfo}"
									title="#{lbl['lbl.audit.tab.approve.bank.information']}" />
								<p:tab id="#{SupplierManagementConst.auTabIdUserInfo}"
									title="#{lbl['lbl.audit.tab.user.profile']}" />
								<p:tab id="#{SupplierManagementConst.auTabIdAdminInfo}"
									title="#{lbl['lbl.audit.tab.deactive.replace.sup.admin']}" />
							</c:when>
							<c:when
								test="#{AuditSupplierManagementViewBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.SUPP_TYPE_GOVT_TO_GOVT}">
								<p:tab id="#{SupplierManagementConst.auTabIdBankInfo}"
									title="#{lbl['lbl.audit.tab.approve.bank.information']}" />
								<p:tab id="#{SupplierManagementConst.auTabIdUserInfo}"
									title="#{lbl['lbl.audit.tab.user.profile']}" />
								<p:tab id="#{SupplierManagementConst.auTabIdAdminInfo}"
									title="#{lbl['lbl.audit.tab.deactive.replace.sup.admin']}" />
							</c:when>
							<c:when
								test="#{AuditSupplierManagementViewBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.SUPP_TYPE_CONSULTANT or 
									AuditSupplierManagementViewBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.SUPP_TYPE_CONTRACTOR}">
								<p:tab id="#{SupplierManagementConst.auTabIdCategoryCodeInfo}"
									title="#{lbl['lbl.audit.tab.cancel.registered.category']}" />
								<p:tab id="#{SupplierManagementConst.auTabIdSupplierInfo}"
									title="#{lbl['lbl.audit.tab.supplier.information']}" />
								<p:tab
									id="#{SupplierManagementConst.auTabIdApprovedCategoryCodeInfo}"
									title="#{lbl['lbl.audit.tab.approve.category.codes']}" />
								<p:tab
									id="#{SupplierManagementConst.auTabIdOverlappingRemarkInfo}"
									title="#{lbl['lbl.audit.tab.overlapping.category']}" />
								<p:tab id="#{SupplierManagementConst.auTabIdApproverRemarkInfo}"
									title="#{lbl['lbl.audit.tab.approver.remark']}" />
								<p:tab id="#{SupplierManagementConst.auTabIdUserInfo}"
									title="#{lbl['lbl.audit.tab.user.profile']}" />
								<p:tab id="#{SupplierManagementConst.auTabIdAdminInfo}"
									title="#{lbl['lbl.audit.tab.deactive.replace.sup.admin']}" />
							</c:when>
						</c:choose>
					</p:tabView></td>
			</tr>
			<tr>
				<td>
					<div align="right" style="width: 100%">
						<p:commandLink value="#{lbl['lbl.btn.print']}" ajax="false">
							<p:fileDownload
								value="#{auditSupplierManagementDocumentBackingBean.generateRptPdfForAuditTrailDetails(AuditSupplierManagementViewBackingBean.managedBean.auSmSearchBean)}" />
						</p:commandLink>
						&#160;
						<p:commandLink value="#{lbl['lbl.btn.download']}" ajax="false">
							<p:fileDownload
								value="#{auditSupplierManagementDocumentBackingBean.generateRptExcelForAuditTrailDetails(AuditSupplierManagementViewBackingBean.managedBean.auSmSearchBean)}" />
						</p:commandLink>
						&#160;
					</div>
				</td>
			</tr>
			<tr>
				<ui:remove>#35501_Reopen#65 Start</ui:remove>
				<td><p:dataTable id="searchAuSmId" var="obj" rows="10" 
						width="100%" tableStyle="width:100%"
						value="#{AuditSupplierManagementViewBackingBean.managedBean.searchAuSm}" 
						rowIndexVar="index" lazy="true" 
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"> 
						<ac:paginator for="searchAuSmId"></ac:paginator> 
						<p:column headerText="#{lbl['lbl.audit.header.action.date']}" 
							style="white-space: normal!important; vertical-align: top; width:8%;">
							<h:outputText value="#{obj.actionDate}"> 
								<f:convertDateTime 
									pattern="#{CommonConstants.getDefault12hrDatetimesecondFormat()}" /> 
							</h:outputText> 
						</p:column> 
						<p:column headerText="#{lbl['lbl.audit.header.action.type']}" 
							style="white-space: normal!important;vertical-align: top; width:6%;">
							<h:outputText value="#{obj.actionType}" /> 
						</p:column> 
						<p:column headerText="#{lbl['lbl.audit.header.action.by']}" 
							style="white-space: normal!important;vertical-align: top; width:8%;">
							<h:outputText value="#{obj.actionBy}" /> 
						</p:column> 
						<p:column headerText="#{lbl['lbl.audit.header.org.name']}" 
							style="white-space: normal!important;vertical-align: top; width:10%;">
							<h:outputText value="#{obj.org}" escape="false" /> 
						</p:column> 
						<p:column headerText="#{lbl['lbl.audit.header.role']}" 
							style="white-space: normal!important;vertical-align: top; width:8%;">
							<h:outputText value="#{obj.role}" /> 
						</p:column> 
						<p:column headerText="#{lbl['lbl.audit.header.docType']}" 
							style="white-space: normal!important;vertical-align: top; width:8%;">
							<h:outputText value="#{obj.docType}" /> 
						</p:column> 
						<p:column headerText="#{lbl['lbl.audit.header.docNo']}" 
							style="white-space: normal!important;vertical-align: top; width:8%;">
							<h:outputText value="#{obj.docNo}" /> 
						</p:column> 
						<p:column headerText="#{lbl['lbl.audit.header.fieldName']}" 
							style="white-space: normal!important;vertical-align: top; width:8%;">
							<h:outputText value="#{obj.fieldName}" /> 
						</p:column> 
						<p:column headerText="#{lbl['lbl.audit.header.oldValue']}" 
							style="white-space: pre-wrap!important;vertical-align: top; width:18%;">
							<h:outputText value="#{obj.oldValue}" /> 
						</p:column> 
						<p:column headerText="#{lbl['lbl.audit.header.newValue']}" 
							style="white-space: pre-wrap!important;vertical-align: top; width:18%;">
							<h:outputText value="#{obj.newValue}" /> 
						</p:column> 
					</p:dataTable></td> 
				<ui:remove>#35501_Reopen#65 End</ui:remove>
			</tr>
		</table>
	</p:panel>
</ui:component>
