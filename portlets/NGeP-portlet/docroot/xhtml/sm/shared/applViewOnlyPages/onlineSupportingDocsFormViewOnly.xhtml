<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel
		header="#{lbl['lbl.sm.suppDoc.online.checklist.application.no']} #{viewSmApplBackingBean.managedBean.smAppl.applNo}"
		toggleable="true" id="onSupTblPan">
		<table style="width: 30%">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.submissionType']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.suppDoc.online']}" /></td>
			</tr>
		</table>
		
		<br />
		<c:if test="#{not empty viewSmApplBackingBean.managedBean.bumiRecommendationNote}">
			<table style="width: 100%;">
				<tr>
					<td><h:outputText value="#{viewSmApplBackingBean.managedBean.bumiRecommendationNote}" 
							style="color: green;font-weight: bold;float:left;"/></td>
				</tr>
			</table>
		</c:if>
		
		<p:spacer height="10px" />
		<p:dataTable var="table" id="onSdList"
			value="#{viewSmApplBackingBean.managedBean.smAppl.smApplSupportDocs}" rowIndexVar="index">
			<ac:paginator for="onSdList" />
			
			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 5%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" style="width : 65%;">
				<h:outputText value="#{table.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.document.name']}" style="width : 20%;">
				<p:outputLabel value="#{table.smApplDocFiles[0].fileName}"
					style="float: left;white-space: normal;" rendered="#{not empty table.smApplDocFiles[0].fileName}"/>
				<p:outputLabel value="#{lbl['lbl.sm.suppDoc.online.hardcopy']}"
					style="float: left;white-space: normal;" rendered="#{empty table.smApplDocFiles[0].fileName}"/>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.qt.nb.downloadDoc']}" style="width : 10%;text-align: center  !important;">
				<p:commandLink rendered="#{not empty table.smApplDocFiles[0].fileName}"
					action="#{viewSmApplBackingBean.downloadSelectedSuppDoc(table.smApplDocFiles[0].fileName,table.smApplDocFiles[0].filePath)}"
					update=":form" ajax="false">
					<p:fileDownload value="#{viewSmApplBackingBean.file}" />
					<p:graphicImage value="/css/images/design/download.png"
						style="margin-right:2px;" />
				</p:commandLink>
			</p:column>
		</p:dataTable>

	</p:panel>

</ui:composition>
