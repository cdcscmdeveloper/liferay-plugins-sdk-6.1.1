<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	
		<p:panel header="#{lbl['lbl.sm.req.new.item.code.hdr']}" toggleable="true">
		<p:dataTable id="reqNewItemID" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		value="#{viewSmApplBackingBean.managedBean.requestCodeList}" rows="10" style="width:100%;"
		rowIndexVar="rowIndex" var="reqNewItem">		
		
		<ac:paginator for="reqNewItemID"></ac:paginator>
		<p:column width="3%">
			<f:facet name="header">
				#{lbl['lbl.sm.catalogue.req.no']}
			</f:facet>
			<h:outputText value="#{reqNewItem.docNo}" style="white-space: normal" />
		</p:column>
		
		<p:column width="20%" style="white-space: normal;">
			<f:facet name="header">
				#{lbl['lbl.cm.item.name']}
			</f:facet>
			<h:outputText value="#{reqNewItem.itemName}" style="white-space: normal"/>
		</p:column>
		
		<p:column width="20%" style="white-space: normal;">
			<f:facet name="header">
				#{lbl['lbl.sm.catalogue.status']}
			</f:facet>
			<h:outputText value="#{reqNewItem.cmWorkflowStatus.pmStatus.pmStatusDescs.get(0).statusName}" style="white-space: normal"/>
			</p:column>
	</p:dataTable>
	</p:panel>

</ui:composition>
