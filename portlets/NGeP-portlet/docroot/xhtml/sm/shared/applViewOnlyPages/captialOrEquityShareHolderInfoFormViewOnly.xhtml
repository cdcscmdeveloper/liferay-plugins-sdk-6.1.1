<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="shrHolderPanGroup">
		<p:panel header="#{lbl['lbl.sm.shrHldrInfo.panHdr']}"
			toggleable="true">
			
			<p:panel id="shrInfPan">
				
				<p:dataTable var="shareBean" widgetVar="suppCapShrHldrDtWidVar"
					value="#{viewSmApplBackingBean.managedBean.smapplShareHolders}"
					rowKey="#{shareBean}" rowIndexVar="index" id="shrPerDt">
					<ac:paginator for="shrPerDt" />
					<p:column headerText="#{lbl['lbl.sm.shrHldrInfo.name']}">
						<h:outputText value="#{shareBean.name}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.shrHldrInfo.idNo']}">
						<h:outputText value="#{shareBean.identificationNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.shrHldrInfo.shrPerc']}">
						<ac:labelAmount value="#{shareBean.sharePercentage}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.shrHldrInfo.shrVal']}">
						<ac:labelAmount value="#{shareBean.shareAmt}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.shrHldrInfo.equiOwnr']}">
						<h:outputText value="#{lbl['lbl.txt.yes']}" />
					</p:column>
				</p:dataTable>
				
				<br />
				<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.poUser}">
					<table style="width: 50%">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.shareholderRemark}" /></td>
						</tr>
					</table>
				</p:outputPanel>
				<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.approverUser}">
					<table style="width: 100%">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.poSecReview.shareholderRemark}" /></td>
							<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']} :" /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.apprvrSecReview.shareholderRemark}" /></td>
						</tr>
					</table>
				</p:outputPanel>
			
			</p:panel>
		</p:panel>
	</h:panelGroup>



</ui:composition>
