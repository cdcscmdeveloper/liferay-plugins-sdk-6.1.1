<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.busNtw.panHdr']}" toggleable="true">
		<p:outputPanel id="trxInfPan" layout="block">
			<table style="width: 100%">

				<tr>
					<td><p:selectBooleanCheckbox disabled="true"
							value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withFederal}" /></td>
					<td style="valign:middle; float:left;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.fdrGov']}" />
						<ac:smCheckBoxChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAppl.smCompanyBasic.withFederal}" 
							currValue="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withFederal}" /></td>

					<td><p:selectBooleanCheckbox disabled="true" 
							value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withState}" /></td>
					<td style="valign:middle; float:left;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.stateGov']}" />
						<ac:smCheckBoxChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAppl.smCompanyBasic.withState}" 
							currValue="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withState}" /></td>

					<td><p:selectBooleanCheckbox disabled="true"
							value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withStatutory}" /></td>
					<td style="valign:middle; float:left;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.statBody']}" />
						<ac:smCheckBoxChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAppl.smCompanyBasic.withStatutory}" 
							currValue="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withStatutory}" /></td>

					<td><p:selectBooleanCheckbox disabled="true"
							value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withGlc}" /></td>
					<td style="valign:middle; float:left;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.glc']}" />
						<ac:smCheckBoxChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAppl.smCompanyBasic.withGlc}" 
							currValue="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withGlc}" /></td>

					<td><p:selectBooleanCheckbox disabled="true"
							value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withOthers}" /></td>
					<td style="valign:middle; float:left;"><h:outputText
							value="#{lbl['lbl.sm.busNtw.others']}" />
						<ac:smCheckBoxChangeAlertView 
							isShow="#{viewSmApplBackingBean.managedBean.showFieldChanges}"
							oriValue="#{viewSmApplBackingBean.managedBean.latestAppl.smCompanyBasic.withOthers}" 
							currValue="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withOthers}" /></td>
				</tr>
				
			</table>
				
		</p:outputPanel>
		
		<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
				poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.trnsNetworkRemark}" 
				approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.trnsNetworkRemark}" />
	
	</p:panel>
</ui:composition>
