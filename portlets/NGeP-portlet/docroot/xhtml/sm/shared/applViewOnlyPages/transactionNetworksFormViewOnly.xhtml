<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.busNtw.panHdr']}" toggleable="true">
		<p:panel id="trxInfPan">
			<table style="width: 100%">

				<tr>
					<td><p:selectBooleanCheckbox disabled="true"
							value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withFederal}" /></td>
					<td style="valign:middle; float:left;"><p:outputLabel
							value="#{lbl['lbl.sm.busNtw.fdrGov']}" /></td>

					<td><p:selectBooleanCheckbox disabled="true" 
							value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withState}" /></td>
					<td style="valign:middle; float:left;"><p:outputLabel
							value="#{lbl['lbl.sm.busNtw.stateGov']}" /></td>

					<td><p:selectBooleanCheckbox disabled="true"
							value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withStatutory}" /></td>
					<td style="valign:middle; float:left;"><p:outputLabel
							value="#{lbl['lbl.sm.busNtw.statBody']}" /></td>

					<td><p:selectBooleanCheckbox disabled="true"
							value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withGlc}" /></td>
					<td style="valign:middle; float:left;"><p:outputLabel
							value="#{lbl['lbl.sm.busNtw.glc']}" /></td>

					<td><p:selectBooleanCheckbox disabled="true"
							value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.withOthers}" /></td>
					<td style="valign:middle; float:left;"><p:outputLabel
							value="#{lbl['lbl.sm.busNtw.others']}" /></td>
				</tr>
			</table>
		</p:panel>
	</p:panel>
</ui:composition>
