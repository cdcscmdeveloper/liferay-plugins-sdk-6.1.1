<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:outputScript library="jquery/slides" name="jquery.slides.js" />
	
	<script>
		function clearInvalidFileMsg() {

			importDevicesWidget.uploadContent.find("tr.ui-state-error")
					.remove();

		}
		
	</script>
	<p:messages id="catalogDetMsgId" showDetail="true" autoUpdate="true"
		closable="true" showSummary="false"></p:messages>

	<p:outputPanel id="itemDetailPanelId">
	<div align="left">
				<p:commandButton value="#{lbl['lbl.cm.back']}"
					action="#{viewSmApplBackingBean.redirectToCatalogueInfoPage}"
					process="@this" partialSubmit="true" update=":form"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					style="padding-right:5px;">
				</p:commandButton>
		</div>
		
		<p:panel header="#{lbl['lbl.sm.item.details.hdr']}" toggleable="true">
		
			<table style="width: 100%; margin-top: 10px;">
				<tr style="height: 30px;">
					<td rowspan="7"><h:panelGroup id="refereshImageId">

							<h:panelGroup
								rendered="#{fn:length(viewSmApplBackingBean.managedBean.selectedSupplierItem.cmImages) == 0 }">
								<div
									style="display: block; width: 120px; padding: 60px; text-align: center; vertical-align: middle; border: 1px solid rgb(204, 204, 204);">#{lbl['lbl.cm.no.image.available']}</div>
							</h:panelGroup>

							<h:panelGroup
								rendered="#{fn:length(viewSmApplBackingBean.managedBean.selectedSupplierItem.cmImages) == 1 }">

								<div style="width: 250px; height: 150px;">
									<ui:repeat var="cmImage"
										value="#{viewSmApplBackingBean.managedBean.selectedSupplierItem.cmImages}">
										<p:graphicImage styleClass="catImageStyle"
											value="/image?imageName=#{viewSmApplBackingBean.managedBean.selectedSupplierItem.smSupplier.epNo}/#{cmImage.imageName}" />

									</ui:repeat>


								</div>
							</h:panelGroup>

							<h:panelGroup
								rendered="#{fn:length(viewSmApplBackingBean.managedBean.selectedSupplierItem.cmImages) > 1 }">

								<script>
			$(function() {
				$('#slides').slidesjs({
					width : 940,
					height : 528,
					navigation : {
						effect : "fade"
					},
					pagination : {
						effect : "fade"
					},
					effect : {
						fade : {
							speed : 400
						}
					}
				});
			});
		</script>
								<div id="slides" style="width: 250px;">
									<ui:repeat var="cmImage"
										value="#{viewSmApplBackingBean.managedBean.selectedSupplierItem.cmImages}">
										<p:graphicImage styleClass="catImageStyle"
											value="/image?imageName=#{viewSmApplBackingBean.managedBean.selectedSupplierItem.smSupplier.epNo}/#{cmImage.imageName}" />

									</ui:repeat>
								</div>
							</h:panelGroup>
						</h:panelGroup></td> 
					<td><p:outputLabel styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.cm.item.code']}" /></td>
					<td colspan="2"><p:inputText size="35" maxlength="50" styleClass="outputLabel-view"
							value="#{viewSmApplBackingBean.managedBean.selectedSupplierItem.cmItem.extensionCode}" 
							disabled="true"></p:inputText></td>
					<td><p:outputLabel styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.cm.item.name']}" /></td>
					<td style="overflow-wrap: break-word; width: 25%;"><p:inputTextarea
							styleClass="outputLabel-view"
							value="#{viewSmApplBackingBean.managedBean.selectedSupplierItem.cmItem.itemName}"
							disabled="true" style="width:92.5%;background-color:#F4F4F4"></p:inputTextarea></td>
				</tr>
				<tr style="height: 30px;">
					<td><p:outputLabel styleClass="outputLabel-view-label2"
					 value="#{lbl['lbl.cm.item.table.uom']}" />
						</td>
					<td>							
					<p:autoComplete panelStyleClass="uomAuto" id="uomDetId" scrollHeight="250" size="30" var="pmUom" converter="PmUomConverter"
							itemLabel="#{viewSmApplBackingBean.retriveUomCodeDesc(pmUom)}"
							itemValue="#{pmUom}" 
							value="#{viewSmApplBackingBean.managedBean.selectedSupplierItem.pmUom}"
							disabled="true"/>							
					</td>
					<td><p:graphicImage value="/css/images/design/search.png" /></td>
					<td style="word-wrap: break-word; width: 25%;"><p:outputLabel styleClass="outputLabel-view-label2"
					 value="#{lbl['lbl.cm.sku']}" /></td>
					<td colspan="2"><p:inputText size="35" maxlength="50"
							value="#{viewSmApplBackingBean.managedBean.selectedSupplierItem.skuNumber}"
							disabled="true"></p:inputText></td>
				</tr>
				<tr style="height: 30px;">
					<td><p:outputLabel styleClass="outputLabel-view-label2" 
					value="#{lbl['lbl.cm.manufacturing.part.no']}" /></td>
					<td colspan="2"><p:inputText size="35" maxlength="100"
							value="#{viewSmApplBackingBean.managedBean.selectedSupplierItem.manufacturer}"
							disabled="true"></p:inputText></td>
					<td><p:outputLabel styleClass="outputLabel-view-label2" 
					value="#{lbl['lbl.cm.model']}" /></td>
					<td colspan="2"><p:inputText size="35" maxlength="20"
							value="#{viewSmApplBackingBean.managedBean.selectedSupplierItem.modelNumber}"
							disabled="true"></p:inputText></td>
				</tr>
				<tr style="height: 30px;">
					<td><p:outputLabel styleClass="outputLabel-view-label2" 
					value="#{lbl['lbl.cm.min.order']}" /></td>
					<td colspan="2"><p:inputText size="35" label="#{lbl['lbl.cm.min.order']}"
							maxlength="6"
							value="#{viewSmApplBackingBean.managedBean.selectedSupplierItem.minOrder}"
							disabled="true"></p:inputText></td>
					<td><p:outputLabel styleClass="outputLabel-view-label2" 
					value="#{lbl['lbl.cm.delivery.term']}" /></td>
					<td colspan="2"><p:inputText size="26" maxlength="6"
							value="#{viewSmApplBackingBean.managedBean.selectedSupplierItem.leadTime}"
							converterMessage="#{lbl['lbl.cm.error.delivery.term']}"
							disabled="true" />
						<p:inputText style="margin-left: 2px;" size="3"
							value="#{lbl['lbl.cm.days']}" disabled="true" /></td>
				</tr>
				<tr style="height: 30px;">
					<td style="word-wrap: break-word; width: 25%;"><p:outputLabel styleClass="outputLabel-view-label2" 
					value="#{lbl['lbl.cm.basic.item.spec']}" /></td> <!-- #30457 change label -->
					<td colspan="5"><p:inputTextarea maxlength="2000"
							style="width:80% !important;height:100px;overflow:scroll;background-color:#F4F4F4"
							value="#{viewSmApplBackingBean.managedBean.selectedSupplierItem.itemDesc}"
							disabled="true" /></td>

				</tr>
			</table>
		</p:panel>

		<p:tabView id="pricingTabID" orientation="left"
			style="margin-top: 10px;"
			activeIndex="#{viewSmApplBackingBean.managedBean.supplierItemDetailTabActiveIndex}">
			
			<p:tab id="pricing1" title="#{lbl['lbl.cm.pricing']}">
				<p:tabView id="headerTabId"
					activeIndex="#{viewSmApplBackingBean.managedBean.pricingTypeGroupTabActiveIndex}">
					<p:ajax event="tabChange" listener="#{viewSmApplBackingBean.onChangePricingTypeGroupTab}"
					update="normalId,tierId,zonalId,zonalTierId"/>
					<p:tab title="#{lbl['lbl.cm.normal']}">
						<p:tabView id="normalId"
							activeIndex="#{viewSmApplBackingBean.managedBean.pricingTypeTabActiveIndex}">
							<p:tab title="#{lbl['lbl.cm.standard']}">
								<ui:include src="standardPricingTabViewOnly.xhtml" /> 
							</p:tab>
							<p:tab title="#{lbl['lbl.cm.promotion']}">
								<ui:include src="promotionPricingTabViewOnly.xhtml" />
							</p:tab>
						</p:tabView>
					</p:tab>
					<p:tab title="#{lbl['lbl.cm.tier']}">
						<p:tabView id="tierId"
							activeIndex="#{viewSmApplBackingBean.managedBean.pricingTypeTabActiveIndex}">
							<p:ajax event="tabChange"
								update=":form:tt:pricingTabID:headerTabId:tierId:pricingPromotionTierID" />
							<p:tab title="#{lbl['lbl.cm.standard']}">
								<ui:include src="tierStandardPricingTabViewOnly.xhtml" />
							</p:tab>
							<p:tab title="#{lbl['lbl.cm.promotion']}">
								<ui:include src="tierPromotionPricingTabViewOnly.xhtml" />
							</p:tab>
						</p:tabView>
					</p:tab>
					<p:tab title="#{lbl['lbl.cm.zonal']}">

						<p:tabView id="zonalId"
							activeIndex="#{viewSmApplBackingBean.managedBean.pricingTypeTabActiveIndex}">
							<p:tab title="#{lbl['lbl.cm.standard']}">
								<ui:include src="zonalStandardPricingTabViewOnly.xhtml" />
							</p:tab>
							<p:tab title="#{lbl['lbl.cm.promotion']}">
								<ui:include src="zonalPromotionPricingTabViewOnly.xhtml" />
							</p:tab>
						</p:tabView>
					</p:tab>
					<p:tab title="#{lbl['lbl.cm.zonal.tier']}">

						<p:tabView id="zonalTierId"
							activeIndex="#{viewSmApplBackingBean.managedBean.pricingTypeTabActiveIndex}">
							<p:ajax event="tabChange"
								update=":form:tt:pricingTabID:headerTabId:zonalTierId:cmZonalPromotionTierPricingsId" />
							<p:tab title="#{lbl['lbl.cm.standard']}">
								<ui:include src="zonalTierStandardPricingTabViewOnly.xhtml" />
							</p:tab>
							<p:tab title="#{lbl['lbl.cm.promotion']}">
								<ui:include src="zonalTierPromotionPricingTabViewOnly.xhtml" />
							</p:tab>
						</p:tabView>
					</p:tab>
				</p:tabView>
			</p:tab>
		</p:tabView>
	</p:outputPanel>
</ui:composition>
