<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.poDecisionLbl']}">
		<table>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.suppname']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.companyName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.dateSubmitted']}" /></td>
				<td>
					<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.smAppl.applSubmitDate}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.status']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.currentStatus}" /></td>
			</tr>
			<tr>
				<c:if test="#{viewSmApplBackingBean.managedBean.smAppl.applType eq 'C'}">
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.remark.cancellation']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.supplierRemarks}" /></td>
				</c:if>
			</tr>
		</table>
		
		<br />
		<table style="width: 100%">
			<tr>
				<td>
					<c:choose>
						<c:when
							test="#{viewSmApplBackingBean.managedBean.personCalc.halfBumiStatus and viewSmApplBackingBean.managedBean.smAppl.applType ne 'C'}">
							<p:outputLabel
								value="#{lbl['lbl.sm.recommendation.halfBumi']}"
								style="color: green;font-weight: bold;float:left;" />
						</c:when>
						<c:when
							test="#{viewSmApplBackingBean.managedBean.personCalc.fullBumiStatus and viewSmApplBackingBean.managedBean.smAppl.applType ne 'C'}">
							<p:outputLabel
								value="#{lbl['lbl.sm.recommendation.fullBumi']}"
								style="color: green;font-weight: bold;float:left;" />
						</c:when>
						<c:otherwise>
							<p:outputLabel value="#{lbl['lbl.sm.recommendation.noBumi']}"
								style="color: green;font-weight: bold;float:left;" />
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
		 </table>
		 <br />
		
		<p:separator />
		<div>
			<p:outputLabel value="#{lbl['lbl.sm.po.splNotes']}" style="float :left;" escape="false" />
		</div>

	</p:panel>
</ui:composition>
