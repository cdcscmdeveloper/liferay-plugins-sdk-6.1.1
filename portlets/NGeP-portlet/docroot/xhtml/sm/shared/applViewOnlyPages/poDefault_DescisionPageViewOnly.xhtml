<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd">
				<c:if test="#{viewSmApplBackingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForMof}">
					<ui:include src="/xhtml/sm/revisionSmApplView/newMofApplicationView/smViewMofApplnSideMenuItem.xhtml" />
				</c:if> 
				<c:if test="#{viewSmApplBackingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForBumi}">
					<ui:include src="/xhtml/sm/revisionSmApplView/bumiputeraApplicationView/smViewBumiApplnSideMenuItem.xhtml" />
				</c:if> 
				<c:if test="#{viewSmApplBackingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
					<ui:include src="/xhtml/sm/revisionSmApplView/renewMofApplicationView/smViewRenewApplnSideMenuItem.xhtml" />
				</c:if> 
				<c:if test="#{viewSmApplBackingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForApplcatcodes}">
					<ui:include src="/xhtml/sm/revisionSmApplView/addAdditionalCategoryCodesView/smViewAddtnlCatApplnSideMenuItem.xhtml" />
				</c:if> 
				<c:if test="#{viewSmApplBackingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForUpdate}">
					<ui:include src="/xhtml/sm/revisionSmApplView/updateMofDetailsView/smViewUpdateMofApplnSideMenuItem.xhtml" />
				</c:if>
			</td>
			<td>
				<p:panel header="#{lbl['lbl.sm.poDecisionLbl']}">
					<table>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.suppname']} :" /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyBasic.companyName}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.dateSubmitted']} :" /></td>
							<td style="font-size: 12px;font-weight: normal;font-family: Arial">
								<h:outputText value="#{viewSmApplBackingBean.managedBean.smAppl.applSubmitDate}">
									<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.status']} :" /></td>
							<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.currentStatus}" /></td>
						</tr>
						<tr>
							<c:if test="#{viewSmApplBackingBean.managedBean.smAppl.applType eq 'C'}">
								<td><p:outputLabel value="#{lbl['lbl.sm.remark.cancellation']} :" /></td>
								<td style="float:left;"><p:outputLabel value="#{viewSmApplBackingBean.managedBean.supplierRemarks}" /></td>
							</c:if>
						</tr>
					</table>
					<table style="width: 100%">
						<tr>
							<td>
								<c:choose>
									<c:when
										test="#{viewSmApplBackingBean.managedBean.personCalc.halfBumiStatus and viewSmApplBackingBean.managedBean.smAppl.applType ne 'C'}">
										<p:outputLabel
											value="#{lbl['lbl.sm.recommendation.halfBumi']}"
											style="color: green;font-weight: bold;float:left;" />
									</c:when>
									<c:when
										test="#{viewSmApplBackingBean.managedBean.personCalc.fullBumiStatus and viewSmApplBackingBean.managedBean.smAppl.applType ne 'C'}">
										<p:outputLabel
											value="#{lbl['lbl.sm.recommendation.fullBumi']}"
											style="color: green;font-weight: bold;float:left;" />
									</c:when>
									<c:otherwise>
										<p:outputLabel value="#{lbl['lbl.sm.recommendation.noBumi']}"
											style="color: green;font-weight: bold;float:left;" />
									</c:otherwise>
								</c:choose>
							</td>
						</tr>
					 </table>

					<p:separator />
					<div>
						<p:outputLabel value="#{lbl['lbl.sm.po.splNotes']}" style="float :left;" escape="false" />
					</div>

				</p:panel>
			</td>
		</tr>
	</table>
</ui:composition>
