<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel
		header=" Supporting Document Offline Check List - Application No. - #{viewSmApplBackingBean.managedBean.smAppl.applNo}"
		toggleable="true">
		<table style="width: 30%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.submissionType']}" /></td>
				<td><p:selectOneRadio id="offLnSuppDocs"
						value="#{viewSmApplBackingBean.managedBean.smAppl.supportingDocMode}">
						<f:selectItem itemLabel="Offline" itemValue="F" />
						<f:selectItem itemLabel="Online" itemValue="O" />
						<p:ajax update="supDocPan" event="change" />
					</p:selectOneRadio></td>
			</tr>

		</table>
		<br />
		<table style="width: 100%">
			<tr>
				<td><c:choose>
						<c:when
							test="#{viewSmApplBackingBean.managedBean.personCalc.halfBumiStatus and viewSmApplBackingBean.managedBean.smAppl.applType ne 'C'}">
							<p:outputLabel value="#{lbl['lbl.sm.recommendation.halfBumi']}"
								style="color: green;font-weight: bold;float:left;" />
						</c:when>
						<c:when
							test="#{viewSmApplBackingBean.managedBean.personCalc.fullBumiStatus and viewSmApplBackingBean.managedBean.smAppl.applType ne 'C'}">
							<p:outputLabel value="#{lbl['lbl.sm.recommendation.fullBumi']}"
								style="color: green;font-weight: bold;float:left;" />
						</c:when>
						<c:otherwise>
							<p:outputLabel value="#{lbl['lbl.sm.recommendation.noBumi']}"
								style="color: green;font-weight: bold;float:left;" />
						</c:otherwise>
					</c:choose></td>
			</tr>

		</table>
		<br />
		<table style="width: 100%;">

			<tr>
				<td><p:outputLabel style="float:left"
						value="#{lbl['lbl.sm.suppDoc.offline.note1']}" /> <br /> <p:outputLabel
						style="float:left" value="#{lbl['lbl.sm.suppDoc.offline.note2']}" />
					<br /> <p:outputLabel style="float:left"
						value="#{lbl['lbl.sm.suppDoc.offline.note3']}" /> <br /></td>

			</tr>

		</table>
		<p:spacer height="10px" />
		<table style="width: 100%;">
			<tr>
				<td style="width: 33%">
					<table>
						<tr>
							<td><p:outputLabel style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.peninAddr1']}"
									escape="false" /></td>
						</tr>
						<tr>
							<td style="padding-top: 10px;"><p:outputLabel
									style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.peninAddr2']}"
									escape="false" /></td>
						</tr>
					</table>
				</td>

				<td style="width: 33%"><table>
						<tr>
							<td><p:outputLabel style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr1']}"
									escape="false" /></td>
						</tr>
						<tr>
							<td style="padding-top: 10px;"><p:outputLabel
									style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr2']}"
									escape="false" /></td>
						</tr>
					</table></td>
				<td style="width: 33%"><table>
						<tr>
							<td><p:outputLabel style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr1']}"
									escape="false" /></td>
						</tr>
						<tr>
							<td style="padding-top: 10px;"><p:outputLabel
									style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr2']}"
									escape="false" /></td>
						</tr>
					</table></td>
			</tr>
		</table>
		<p:spacer height="10px" />


		<p:dataTable var="table" id="offSdList"
			value="#{viewSmApplBackingBean.managedBean.smAppl.smApplSupportDocs}">
			<ac:paginator for="offSdList" />

			<p:column headerText="Document Description">
				<p:outputLabel value="#{table.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>


		</p:dataTable>

		<br />
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.printList']}">
				<p:printer target=":form:tt:supDocPan" />
			</p:commandButton>
		</div>

	</p:panel>
</ui:composition>
