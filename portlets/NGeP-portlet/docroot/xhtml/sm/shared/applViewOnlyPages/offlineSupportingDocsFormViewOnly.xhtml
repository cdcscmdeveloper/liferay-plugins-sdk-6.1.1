<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:dialog id="docCheckListDlg" widgetVar="docCheckListDlg" modal="true"
		dynamic="true" resizable="false" width="900px"
		height="700px" styleClass="pop_up_top" 
		header="#{lbl['lbl.sm.printchecklist.header']}">
		<p:media value="#{viewSmApplBackingBean.getOfflineSuppDocCheckList()}" 
			width="100%" height="700px" player="pdf" />
		<p:panelGrid styleClass="noBorders tr,noBorders td" >
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.btn.close']}"
						onclick="docCheckListDlg.hide()" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>
	
	<p:panel
		header="#{lbl['lbl.sm.suppDoc.offline.checklist.application.no']} #{viewSmApplBackingBean.managedBean.smAppl.applNo}"
		toggleable="true">
		
		<c:if test="#{not empty viewSmApplBackingBean.managedBean.bumiRecommendationNote}">
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel value="#{viewSmApplBackingBean.managedBean.bumiRecommendationNote}" 
							style="color: green;font-weight: bold;float:left;"/></td>
				</tr>
			</table>
		</c:if>
		<br />
		
		<table style="width: 100%;">

			<tr>
				<td>
					<h:outputText style="float:left"
						value="#{lbl['lbl.sm.suppDoc.offline.note1']}" /> <br /> 
					<h:outputText style="float:left"
						value="#{lbl['lbl.sm.suppDoc.offline.note3']}" /> <br />
				</td>
				<td>
					<div align="right">
						<p:commandLink action="#{viewSmApplBackingBean.printDocCheckList}" update="@form"
						   onstart="blockWidget.show()" oncomplete="blockWidget.hide()" process="@this">
							<p:graphicImage value="/css/images/design/print.png"
										style="margin-right:2px;" title="#{lbl['lbl.sm.printList']}"/>
						</p:commandLink>
					</div>
				</td>

			</tr>

		</table>
		<p:spacer height="10px" />
		<table style="width: 100%;">
			<tr>
				<td style="width: 33%">
					<table>
						<tr>
							<td><p:outputLabel style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.peninAddr1']}"
									escape="false" /></td>
						</tr>
						<tr>
							<td style="padding-top: 10px;"><p:outputLabel
									style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.peninAddr2']}"
									escape="false" /></td>
						</tr>
					</table>
				</td>

				<td style="width: 33%"><table>
						<tr>
							<td><p:outputLabel style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr1']}"
									escape="false" /></td>
						</tr>
						<tr>
							<td style="padding-top: 10px;"><p:outputLabel
									style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.sabahAddr2']}"
									escape="false" /></td>
						</tr>
					</table></td>
				<td style="width: 33%"><table>
						<tr>
							<td><p:outputLabel style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr1']}"
									escape="false" /></td>
						</tr>
						<tr>
							<td style="padding-top: 10px;"><p:outputLabel
									style="float:left"
									value="#{lbl['lbl.sm.suppDoc.offline.sarawakAddr2']}"
									escape="false" /></td>
						</tr>
					</table></td>
			</tr>
		</table>
		<p:spacer height="10px" />


		<p:dataTable var="table" id="offSdList"
			value="#{viewSmApplBackingBean.managedBean.smAppl.smApplSupportDocs}" rowIndexVar="index">
			
			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 5%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" style="width : 95%;">
				<h:outputText value="#{table.pmDocument.docName}"
					style="float: left;white-space: normal;" />
			</p:column>

		</p:dataTable>

		<br />
		<p:spacer height="2px;" />

	</p:panel>
</ui:composition>
