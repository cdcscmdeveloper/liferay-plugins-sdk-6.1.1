	<script>
		function printDiv() {
			newWin = window.open();

			var divToPrint = document.getElementById('printArea');
			newWin.document.write(divToPrint.innerHTML);

			var style = newWin.document.createElement('style');
			style.type = 'text/css';
			style.innerHTML = '.ui-panel-title{font-family: Arial;margin: 0 0 0 5px !important;border: 0px !important;border-radius: 0px !important;background: none !important;color: #5BA218;font-size: 12px !important;font-weight: bold;}.ui-panel-titlebar{padding: 2px 0 3px 5px !important;background: none !important;height: 19px !important;border-radius: 0px;text-transform: uppercase;}.ui-outputlabel{display: inline-block;text-align: left !important;font-size: 12px;vertical-align: middle;padding: 0 10px 0 0;font-family: Arial;}table {border-collapse: collapse;border-spacing: 0;font-family: Tahoma;font-size: 11px;overflow: hidden;}.ui-datatable{font-family: Arial;color: #333333 !important;text-decoration: none;}.ui-datatable-tablewrapper{overflow: auto;}.ui-widget .ui-widget{font-size: 12px;}.ui-datatable th.ui-state-default{font-family: Arial;font-weight: bold !important;text-decoration: none;background: #F0EFEF;}thead>tr>th.ui-state-default{color: #555555 !important;font-size: 12px !important;text-align: left;}.ui-datatable thead th, .ui-datatable tbody td, .ui-datatable tfoot td{border: 1px solid #DDDDDD !important;}.ui-datatable thead th, .ui-datatable tbody td, .ui-datatable tfoot td{padding: 4px 10px;overflow: hidden;white-space: nowrap;border-width: 1px;border-style: solid;}.ui-state-default{text-shadow: none !important;box-shadow: none !important;}';
			newWin.document.getElementsByTagName('head')[0].appendChild(style);

			newWin.print();
			newWin.close();
		}
	</script>
