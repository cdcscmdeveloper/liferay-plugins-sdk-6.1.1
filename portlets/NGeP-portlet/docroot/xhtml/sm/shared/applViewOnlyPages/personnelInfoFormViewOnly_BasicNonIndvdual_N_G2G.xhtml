<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="personInfPanGrp">	
		<c:choose>
		<c:when test="#{viewSmApplBackingBean.managedBean.redirectToPersonPage}">
			<ui:include src="personDetailsInfoFormViewOnly.xhtml" />
		</c:when>
		<c:otherwise>
			<p:panel header="#{lbl['lbl.sm.person.info.hdr']}" toggleable="true" id="personInfHdPan">
				<p:outputPanel id="personInfPan" layout="block">

				<p:dataTable var="personBean" widgetVar="personDtWidVar"
					value="#{viewSmApplBackingBean.managedBean.smAppl.smPersonnels}"
					rowKey="#{personBean}" rowIndexVar="index" id="personDtlTbl">
					
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.row.total']}: #{viewSmApplBackingBean.managedBean.smAppl.smPersonnels.size()}" />
					</f:facet>
					
					<ac:paginator for="personDtlTbl" />
					<p:column headerText="#{lbl['lbl.sm.shrHldrInfo.name']}">
						<h:outputText value="#{personBean.name}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.shrHldrInfo.idNo']}">
						<h:outputText value="#{personBean.identificationNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.identificationtype']}">
						<h:outputText value="#{personBean.identificationType.pmParameterDescs.get(0).getCodeName()}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.nationality']}">
						<h:outputText value="#{personBean.pmCountry.countryName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.person.composition.eprole']}">
						<h:outputText value="#{personBean.epRole}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.contract.signer']}">
						<h:outputText value="#{personBean.contractSigner ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.activation.status']}">
						<h:outputText value="#{lbl['lbl.sm.ind.personnnel.status.inactive']}" rendered="#{personBean.recordStatusFlg == 0}" />
						<h:outputText value="#{lbl['lbl.sm.ind.personnnel.status.active']}" rendered="#{personBean.recordStatusFlg == 1}" />
						<h:outputText value="#{lbl['lbl.sm.ind.personnnel.status.pending']}" rendered="#{personBean.recordStatusFlg == 8}" />
						<h:outputText value="#{lbl['lbl.sm.ind.personnnel.status.delete']}" rendered="#{personBean.recordStatusFlg == 9}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.digital.cert.status']}">
						<h:outputText value="#{lbl['lbl.sm.softcert.flg.issued']}" rendered="#{personBean.softcertFlg == 1}" />
						<h:outputText value="#{lbl['lbl.sm.softcert.flg.requested']}" rendered="#{personBean.softcertFlg == 2}" />
						<h:outputText value="#{lbl['lbl.sm.softcert.flg.processing']}" rendered="#{personBean.softcertFlg == 3}" />
						<h:outputText value="#{personBean.epRole ne 'Catalogue User' and personBean.epRole ne 'Pengguna Katalog' ? lbl['lbl.sm.softcert.flg.pending'] : lbl['lbl.txt.na']}" rendered="#{personBean.softcertFlg == 4}" />
						<h:outputText value="#{lbl['lbl.sm.softcert.flg.revoked']}" rendered="#{personBean.softcertFlg == 5}" />
						<h:outputText value="#{lbl['lbl.sm.softcert.flg.rejected']}" rendered="#{personBean.softcertFlg == 6}" />
						<h:outputText value="#{lbl['lbl.sm.softcert.flg.renew']}" rendered="#{personBean.softcertFlg == 7}"/>
						<h:outputText value="#{lbl['lbl.sm.softcert.flg.failed']}" rendered="#{personBean.softcertFlg == 9}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.label.action']}"
						style="text-align: center  !important;">
						<p:commandLink
							action="#{viewSmApplBackingBean.assignSelectedPersonnel(personBean)}"
							process="@this" partialSubmit="true" update=":form"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							style="padding-right:5px;">
							<p:graphicImage value="/css/images/design/ico-view.png"
								title="#{lbl['lbl.sm.view']}" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</p:outputPanel>
		</p:panel>
		</c:otherwise>
		</c:choose>
	</h:panelGroup>
</ui:composition>
