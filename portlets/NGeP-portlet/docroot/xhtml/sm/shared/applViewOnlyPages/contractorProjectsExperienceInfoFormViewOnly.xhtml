<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.projDtls.panHdr']}" toggleable="true">
		<p:panel id="contrInfPan">
			<p:dataTable var="contrBean" widgetVar="suppContrExpDtWidVar"
				value="#{viewSmApplBackingBean.managedBean.smAppl.smCompanyExperiences}"
				rowKey="#{contrBean}" rowIndexVar="index" id="contDt">
				<ac:paginator for="contDt" />

				<p:column headerText="#{lbl['lbl.sm.projDtls.projTitle']}">
					<h:outputText value="#{contrBean.title}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.contrVal']}">
					<ac:labelAmount value="#{contrBean.contractValue}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.procDate']}">
					<ac:labelDate value="#{contrBean.procurementDate}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.projDtls.workProgress']}">
					<h:outputText value="#{lbl['lbl.sm.projDtls.inProgress']} "
						rendered="#{contrBean.progressStatus eq 'P'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.success']}"
						rendered="#{contrBean.progressStatus eq 'S'}" />
					<h:outputText value="#{lbl['lbl.sm.projDtls.fail']}"
						rendered="#{contrBean.progressStatus eq 'F'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink partialSubmit="true" process="@this"
						action="#{viewSmApplBackingBean.assignSelCompanyExperience(contrBean)}" oncomplete="contDialog.show()"
						update=":form:tt:contDialog">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</p:panel>
		
		<ac:smRevisionRemark backingBean="#{viewSmApplBackingBean}" 
						poRemark="#{viewSmApplBackingBean.managedBean.poSecReview.experienceRemark}" 
						approverRemark="#{viewSmApplBackingBean.managedBean.apprvrSecReview.experienceRemark}" />
	</p:panel>
	<p:dialog style="max-height:350px;width:500px" 
		header="#{lbl['lbl.sm.projDtls.projDiaHdr']}"
		widgetVar="contDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" id="contDialog">
		
		<p:scrollPanel mode="native" style="max-height:300px;width:450px;border:none">
			<table style="width: 100%">
				<tr>
					<td valign="top">
	
						<table style="width: 100%">
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.projTitle']}" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.title}"/></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.contrVal']}" /></td>
								<td>
									<ac:labelAmount styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.contractValue}" />
								</td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.procMode']}" /></td>
								<td><p:selectOneMenu value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.procurementModeId}"
										style="width: 207px;margin-bottom: 5px;" disabled="true">
										<f:selectItems value="#{viewSmApplBackingBean.getDropdownValues('PM')}" />
									</p:selectOneMenu>
								</td>
							</tr>
							<tr>
								<td><p:outputLabel value=" #{lbl['lbl.sm.projDtls.doneFor']}" /></td>
								<td><p:selectOneRadio disabled="true"
										value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.clientType}">
										<f:selectItem itemLabel="#{lbl['lbl.sm.busNtw.fdrGov']}" itemValue="F" />
										<f:selectItem itemLabel="#{lbl['lbl.sm.busNtw.others']}" itemValue="O" />
									</p:selectOneRadio></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.statBody']}" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.clientName}"/></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.workProgress']}" /></td>
								<td><p:selectOneRadio disabled="true" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.progressStatus}">
										<f:selectItem itemLabel="#{lbl['lbl.sm.projDtls.inProgress']}" itemValue="P" />
										<f:selectItem itemLabel="#{lbl['lbl.sm.projDtls.success']}" itemValue="S" />
										<f:selectItem itemLabel="#{lbl['lbl.sm.projDtls.fail']}" itemValue="F" />
									</p:selectOneRadio></td>
							</tr>
							<tr>
							
								<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.apptDate']}" /></td>
								<td>
									<ac:labelDate styleClass="outputLabel-view" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.procurementDate}" />
								</td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.mainCat']}" /></td>
								<td>
									<c:if test="#{not empty viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
										<table width="100%">
										<ui:repeat var="exp" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
											<c:if test="#{not empty exp.pmCategoryL1}">
												<tr><td><p:outputLabel styleClass="outputLabel-view" value="#{exp.pmCategoryL1.categoryName}"/></td></tr>
											</c:if>
										</ui:repeat>
										</table>
									</c:if>
								</td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.subCat']}" /></td>
								<td>
									<c:if test="#{not empty viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
										<table width="100%">
										<ui:repeat var="exp" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
											<c:if test="#{not empty exp.pmCategoryL2}">
												<tr><td><p:outputLabel styleClass="outputLabel-view" value="#{exp.pmCategoryL2.categoryName}"/></td></tr>
											</c:if>
										</ui:repeat>
										</table>
									</c:if>
								</td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.projDtls.subCatDiv']}" /></td>
								<td>
									<c:if test="#{not empty viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
										<table width="100%">
										<ui:repeat var="exp" value="#{viewSmApplBackingBean.managedBean.selectedCompanyExperience.smCompanyExperienceCats}">
											<c:if test="#{not empty exp.pmCategoryL3}">
												<tr><td><p:outputLabel styleClass="outputLabel-view" value="#{exp.pmCategoryL3.categoryName}"/></td></tr>
											</c:if>
										</ui:repeat>
										</table>
									</c:if>
								</td>
							</tr>
	
						</table>
					</td>
				</tr>
			</table>
		</p:scrollPanel>
	</p:dialog>
</ui:composition>
