<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_smCancelMofBySupplier_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.appltype.cancelmof']}");
		</script>
	</ui:define>


	<ui:define name="contentSection">
		<ui:param name="backingBean" value="#{supplierDataMaintenanceBackingBean}" />
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<ui:include src="/xhtml/sm/shared/supplierDataMaintenance/approvalInfoHeaderPage.xhtml" />
		
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.back']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
						action="#{backingBean.backToSearchCancelMof}" update="@form"/>
				</td>
				<td style="white-space: nowrap; float: right;">
				    <p:commandButton value="#{lbl['lbl.btn.submit']}" 
				    	style="float:right;" id="submitBtnId" update="@form"
				    	disabled="#{!supplierDataMaintenanceBackingBean.managedBean.allowedToDoMaintenance}"
				    	onstart="blockWidget.show()" oncomplete="blockWidget.hide()" action="#{backingBean.showConfirmDialog()}"/>
				</td>
			</tr>
		</table>
		
		<br /><h:outputText styleClass="instruction" value="#{lbl['lbl.sm.cancelmof.bysupp.instruction.disallowed']}" /><br />

		<ui:include src="/xhtml/sm/approverDecisionPages/approverCompanyInfo.xhtml" />
		<ui:include src="/xhtml/sm/approverDecisionPages/approverContactInfo.xhtml" />


		<p:dialog width="800px" height="250px" closable="false"
			header="#{lbl['lbl.sm.cancelmof.bysupp.confirm.dialog.header']}"
			widgetVar="confirmDialog" resizable="false" showEffect="fade"
			hideEffect="fade" modal="true">

			<p:messages id="applicationApprovedRemarksMsg" showSummary="false"
				showDetail="true" autoUpdate="true" closable="true" />
			<table style="width: 100%">
				<tr>
					<td colspan="2"><h:outputText styleClass="instruction" value="#{lbl['lbl.sm.cancelmof.bysupp.instruction.confirm']}" /></td>
				</tr>
				<tr height="10"><td height="10"></td></tr>
				<tr>
					<td style="vertical-align: top"><p:outputLabel
							value="#{lbl['lbl.sm.remarks']}" /></td>
					<td style="padding-top: 5px;"><p:inputTextarea cols="90"
							style="width : auto;" rows="10"
							value="#{backingBean.managedBean.applnApprovalRemarks}"
							id="rmrksForApprTxtArea" label="#{lbl['lbl.sm.remarks.approval']}"
							validatorMessage="#{lbl['lbl.sm.remarks']} #{lbl['lbl.sm.rmrkLength.thsndCharLimit']}"
							maxlength="2500">
							<f:validateLength maximum="2500" />
						</p:inputTextarea> <p:message id="rmrksForApprTxtAreaMsg" for="rmrksForApprTxtArea"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
			</table>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.submit']}" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					onclick="confirmDialog.hide();"
					action="#{backingBean.submitToCancelMof}" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					update="@form" action="#{backingBean.hideConfirmDialog()}" />
			</div>
		</p:dialog>
	</ui:define>
</ui:composition>
