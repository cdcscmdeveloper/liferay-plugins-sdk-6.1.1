<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:messages id="defCancelMofApplMsgs" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<p:panel id="cancelMofTncPanelId" header="#{lbl['lbl.sm.term.and.condition.header']}">
			
			<p:scrollPanel style="height:150px;border:0;" mode="native">
				<br /><p><h:outputText escape="false" value="#{lbl['lbl.sm.mof.reg.cancel.reason.suppdocs']}" style="white-space : normal !important"/></p>
			</p:scrollPanel>
			
			<table>
				<tr>
					<td width="10px" style="padding: 4px 2px 0px 8px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.termsAccepted}">
							<p:ajax event="change" update=":form:canApplCmdBtn" />
						</p:selectBooleanCheckbox></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.termsConditions']}" /></td>
				</tr>
			</table>
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.proceed']}" id="canApplCmdBtn"
					action="#{backingBean.proceedToApplication('C')}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					disabled="#{!backingBean.managedBean.termsAccepted}" />
			</div>
		</p:panel>
	</ui:define>
</ui:composition>
