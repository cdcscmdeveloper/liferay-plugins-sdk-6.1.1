<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<ui:define name="contentSection">
	<p:messages id="messages" showDetail="true" showSummary="false"
				autoUpdate="true"
				closable="true" escape="false" />
		<p:panel
			header="#{lbl['lbl.sm.mof.reg.cancel']} - #{backingBean.managedBean.smAppl.applNo}">

			<!-- 	<div>

				<h4
					style="color: blue; text-decoration: underline; text-align: center;">
					<h:outputText value="#{lbl['lbl.sm.applnTypeLbl']}" />
					<h:outputText value="Cancel Registration With Mof" />
					<h:outputText value=" - #{backingBean.managedBean.smAppl.applNo}" />

				</h4>
			</div> -->
			<br />
			<table style="width: 100%; float: center">

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.mof.reg.reason.delete']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputTextarea cols="60" style="margin-bottom:8px;"
							id="cancelReson" label="#{lbl['lbl.sm.mof.reg.reason.delete']}"
							value="#{backingBean.managedBean.supplierRemarks}"
							required="true" /> 
							<p:message id="cancelResonMsg" for="cancelReson" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.suppdoc.attach']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:fileUpload mode="simple" required="true" id="attachment" label="#{lbl['lbl.sm.suppdoc.attach']}"/>
						<p:message id="attachmentMsg" for="attachment" display="icon" />
					</td>
				</tr>
			</table>
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.submit']}" action="#{backingBean.onDisplayConfirm}" partialSubmit="true" update="@([id$=Msg])"/>
			</div>
		</p:panel>

		<p:confirmDialog id="canRegConfirm" width="350px"
			message="#{lbl['lbl.sm.mof.reg.cancel.confirm']}"
			header="#{lbl['lbl.sm.mof.reg.cancel']}" severity="alert"
			widgetVar="canRegConfirm">
			<div align="center">
				<p:commandButton id="confCanDel" value="#{lbl['lbl.btn.yes']}"
					onclick="canRegConfirm.hide()" partialSubmit="true" process="@form"
					action="#{backingBean.submitCancelMofApplToBpm}" />
				<p:commandButton id="declineCancDel" value="#{lbl['lbl.btn.no']}"
					onclick="canRegConfirm.hide()" type="button" />
			</div>
		</p:confirmDialog>
	</ui:define>
</ui:composition>
