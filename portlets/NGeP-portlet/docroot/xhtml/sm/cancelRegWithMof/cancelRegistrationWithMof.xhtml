<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="sideMenu">
		<ui:include src="/xhtml/sm/shared/sidemenu/smMainPageSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<p:panel header="Cancel Registration With MOF">
			<table style="width: 100%; float: center">

				<tr>
					<td><p:outputLabel value="Reason for delete MOF-Registered" /></td>
					<td><p:inputTextarea cols="60" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="Attach Supporting Doc (If any)" /></td>
					<td><p:fileUpload mode="simple" /></td>

				</tr>
			</table>
			<div align="center">
				<p:commandButton value="Submit" onclick="confirmation.show();" />

			</div>
		</p:panel>
		<p:confirmDialog width="300px" id="confirmDialog"
			message="The MOF account will be de-activated / removed once approved by
				Approver and you can only you the basic account.Do you still
				want to proceed with the cancellation process?"
			header="Are you sure?" severity="alert" widgetVar="confirmation">
			<div align="center">
				<p:commandButton value="Yes" type="button"
					onclick="confirmation.hide();" />
				<p:commandButton value="No" type="button"
					onclick="confirmation.hide();" />
			</div>

		</p:confirmDialog>
	</ui:define>
</ui:composition>
