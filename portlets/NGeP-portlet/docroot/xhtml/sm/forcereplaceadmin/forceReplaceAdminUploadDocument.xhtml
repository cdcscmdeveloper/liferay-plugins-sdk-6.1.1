<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel id="uploadDocPanelId">	
		<table style="width: 100%;">
				<tr>
					<td valign="top" width="50%">
						<p:panel id="uploadDoc" style="border: none;">
							<p:dataTable id="tableUpload" var="upload" rowIndexVar="index" widgetVar="tableUploadWidget"
							value="#{forceReplaceSuppAdminBackingBean.managedBean.smReplaceSupplierAdminDocs}" rowKey="#{rowKeyObj}">
							<ac:paginator for="tableUpload" />
								<p:column style="width : 5%;white-space: normal !important;">
									<f:facet name="header">
										<h:outputText value="#{lbl['lbl.sm.row.no']}" />
									</f:facet>
									<h:outputText value="1" />
								</p:column>
								<p:column style="width : 50%;white-space: normal !important;">
									<f:facet name="header">
										<h:outputText value="#{lbl['lbl.sm.doc.desc']}" />
									</f:facet>
								<h:outputText value="#{upload.pmDocument.docName}" />
								</p:column>
								<p:column style="width : 20%;white-space: normal !important; align:left">
									<f:facet name="header">
										<!-- #28765 -->
										<h:outputText value="*" styleClass="mandatory" /><h:outputText value="#{lbl['lbl.sm.doc.upload']}" />
										<!--
										<p:outputLabel value="*" styleClass="mandatory" /><p:outputLabel style="font-weight:bold" value="#{lbl['lbl.sm.gst.upload.doc']}" />
										-->
									</f:facet>
								
								
								<p:commandLink oncomplete="uploadDialog.show();return false;" update=":form:uploadDialog">
										<p:graphicImage value="/css/images/design/upload.png" style="margin-right:2px;" />
										
									</p:commandLink>
									
									
								</p:column>
								<p:column style="width : 25%;white-space: normal !important;">
									<f:facet name="header">
										<h:outputText value="#{lbl['lbl.sm.gst.document.name']}" />
									</f:facet>
										<h:commandLink
											title="#{upload.smReplacesupplieradminDocFiles[0].fileName}"
											value="#{upload.smReplacesupplieradminDocFiles[0].fileName}"						
											style="float:left;" styleClass="blue_font"
											action="#{forceReplaceSuppAdminBackingBean.commonDownload.commonDownload(upload.smReplacesupplieradminDocFiles[0], upload.smReplacesupplieradminDocFiles[0].fileName)}" >
											 <f:ajax execute="@form" render="@form" />
											</h:commandLink>
										<p:commandLink style="float:left;" rendered="#{upload.smReplacesupplieradminDocFiles[0].fileName != ''}"
						   					process="@this" partialSubmit="true"  onsuccess="confirmDeleteSupDocDialog.show();">
				   							<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
				 						</p:commandLink>
								</p:column>
							</p:dataTable>
						</p:panel>
					</td>
				</tr>
		</table>
	</p:panel>
	
	<p:dialog id="uploadDialog" widgetVar="uploadDialog" modal="true"
			dynamic="true" resizable="false" width="700px" height="200"
			styleClass="pop_up_top" header="#{lbl['lbl.pm.profiles.authorisation.choose.file']}"
			onShow="singleUploadListener(uploadWV);">
			<p:fileUpload
				allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
				sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
				id="upload"
				invalidFileMessage="#{lbl['lbl.sm.upload.softcert.format.errmsg']}"
				invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}"  
				fileUploadListener="#{forceReplaceSuppAdminBackingBean.handleSupDocFileAttachment}"
				update=":form" oncomplete="uploadDialog.hide();" 
				uploadLabel="#{lbl['lbl.btn.upload']}"  
				label="#{lbl['lbl.btn.choose']}" 
				cancelLabel="#{lbl['lbl.btn.cancel']}"
				showButtons="false" 
				widgetVar="uploadWV" />
		</p:dialog>
		
		<p:confirmDialog id="confirmDeleteSupDocDialog" closable="true"
			message="#{lbl['lbl.sm.upload.delete.message']}"
			header="#{lbl['lbl.sm.upload.delete.confirm.header']}"
			severity="alert" widgetVar="confirmDeleteSupDocDialog">
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.delete']}" 
					action="#{forceReplaceSuppAdminBackingBean.deleteSupDocFileAttachment}" update="@form"
					partialSubmit="true" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()" process="@this" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="confirmDeleteSupDocDialog.hide();" />
			</div>
		</p:confirmDialog>
</ui:composition>
