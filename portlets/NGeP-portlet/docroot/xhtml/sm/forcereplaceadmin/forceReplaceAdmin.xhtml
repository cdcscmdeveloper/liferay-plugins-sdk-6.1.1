<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" 
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_forceReplaceSupplierAdmin_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.force.replace.suppadmin']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	
	<ui:remove>
	<ac:httpsRedirectScript />
	</ui:remove>
	<p:outputPanel id="verificationPanel">
		<p:messages id="messages" showDetail="true" showSummary="false"
					autoUpdate="true"
					closable="true" escape="false" />
		<table>
			<tr>
				<td colspan="2"><h:outputText styleClass="instruction" value="#{lbl['lbl.sm.select.acc.type']}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.account.type.header']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneRadio label="#{lbl['lbl.sm.account.type.header']}" required="true"
						value="#{forceReplaceSuppAdminBackingBean.managedBean.accType}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.basic']}" itemValue="#{SupplierManagementConst.ACC_BASIC}" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.mof']}" itemValue="#{SupplierManagementConst.ACC_MOF}" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.govt']}" itemValue="#{SupplierManagementConst.ACC_GOVT_SELLER}" />					
						<p:ajax event="change" update="@form" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
							listener="#{forceReplaceSuppAdminBackingBean.onChangeAccType}" partialSubmit="true"/>
					</p:selectOneRadio></td>
			</tr>
			<tr><td colspan="2" height="15">&#160;</td></tr>
			
			<p:outputPanel rendered="#{not empty forceReplaceSuppAdminBackingBean.managedBean.accType}">
				<tr>
					<td colspan="2"><h:outputText styleClass="instruction" value="#{lbl['lbl.sm.key.in.info.during.register']} " /><br /><h:outputText styleClass="instruction" rendered="#{forceReplaceSuppAdminBackingBean.managedBean.accType eq SupplierManagementConst.ACC_BASIC}" value="(#{lbl['lbl.sm.key.in.info.during.register.individual.note']})." /></td>
				</tr>
			</p:outputPanel>
			
			<p:outputPanel rendered="#{forceReplaceSuppAdminBackingBean.managedBean.accType eq SupplierManagementConst.ACC_MOF}" >
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu required="true" id="suppTypeId" label="#{lbl['lbl.rpt.supplierType']}"
							value="#{forceReplaceSuppAdminBackingBean.managedBean.reactivateBasic.suppType}" >
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}" itemValue="K" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}" itemValue="J"/>
						</p:selectOneMenu>
						<p:message id="suppTypeIdMsg" for="suppTypeId" display="icon" />
					</td>
				</tr>
			</p:outputPanel>
			
			<p:outputPanel rendered="#{forceReplaceSuppAdminBackingBean.managedBean.accType eq SupplierManagementConst.ACC_BASIC or  
				forceReplaceSuppAdminBackingBean.managedBean.accType eq SupplierManagementConst.ACC_MOF}">
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.businessregno']}" /> 
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td>
						<p:inputText id="businessRegNo"
							label="#{lbl['lbl.sm.businessregno']}"
							value="#{forceReplaceSuppAdminBackingBean.managedBean.reactivateBasic.regNo}"
							size="35" maxlength="20" required="true"  />
						<p:message id="businessRegNoMsg" for="businessRegNo"
							showSummary="true" showDetail="false" display="icon" />
					</td>
				</tr>
				
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.estdate']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td><p:calendar showOn="button" navigator="true"
							display="inline" required="true" readonlyInput="true"
							label="#{lbl['lbl.sm.estdate']}" id="estDate"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							yearRange="#{lbl['lbl.calendar.year.range']}" maxdate="#{forceReplaceSuppAdminBackingBean.getCurrDate()}"
							value="#{forceReplaceSuppAdminBackingBean.managedBean.reactivateBasic.establishDate}" />
						<p:message id="estDateMsg" for="estDate"
								showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
			</p:outputPanel>
			
			<p:outputPanel rendered="#{forceReplaceSuppAdminBackingBean.managedBean.accType eq SupplierManagementConst.ACC_GOVT_SELLER}">
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.agency.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<p:inputText id="agencyName"
							label="#{lbl['lbl.sm.companyname']}"
							required="true"
							value="#{forceReplaceSuppAdminBackingBean.managedBean.reactivateBasic.agencyName}"
							size="35"  />
					</td>
				</tr>
			</p:outputPanel>
			
			<p:outputPanel rendered="#{not empty forceReplaceSuppAdminBackingBean.managedBean.accType}">
				<tr>
					<td><p:outputLabel value="#{forceReplaceSuppAdminBackingBean.managedBean.accType eq SupplierManagementConst.ACC_MOF ? 
					lbl['lbl.sm.person.composition.suppAdmin.idno'] : lbl['lbl.sm.person.composition.suppAdmin.icno']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td>
						<p:inputText
							label="#{forceReplaceSuppAdminBackingBean.managedBean.accType eq SupplierManagementConst.ACC_MOF ? 
					lbl['lbl.sm.person.composition.suppAdmin.idno'] : lbl['lbl.sm.person.composition.suppAdmin.icno']}"
							required="true" id="idNo" 
							value="#{forceReplaceSuppAdminBackingBean.managedBean.reactivateBasic.identificationNo}"
							size="35" maxlength="15">
						</p:inputText>
						<p:message id="idNoMsg" for="idNo"
								showSummary="true" showDetail="false" display="icon" />
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.forcereplaceadmin.newAdmin.idtype']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td>
						<p:selectOneMenu id="newAdminIdTypeId" required="true"
							label="#{lbl['lbl.sm.forcereplaceadmin.newAdmin.idtype']}"
							disabled="#{forceReplaceSuppAdminBackingBean.managedBean.accType ne SupplierManagementConst.ACC_MOF}"
							value="#{forceReplaceSuppAdminBackingBean.managedBean.reactivateBasic.newIdentificationType}"
							style="width:200px">
							<f:selectItems
								value="#{forceReplaceSuppAdminBackingBean.managedBean.identificationTypes}" />
							<p:ajax event="change" partialSubmit="true" process="@this"
								listener="#{forceReplaceSuppAdminBackingBean.assignIdentificationType}"
								update="newAdminIdNoPanelId" />
						</p:selectOneMenu>
						<p:message id="newAdminIdTypeIdMsg" for="newAdminIdTypeId"
							showSummary="true" showDetail="false" display="icon" />
					</td>
				</tr>
				
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.forcereplaceadmin.newAdmin.idno']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td>
						<p:outputPanel id="newAdminIdNoPanelId">
							<!-- #32445 start -->
							<p:inputText
								label="#{lbl['lbl.sm.forcereplaceadmin.newAdmin.idno']}"
								required="true" id="newAdminIcNo"
								rendered="#{forceReplaceSuppAdminBackingBean.managedBean.identificationType.parameterCode eq 'I'}"
								value="#{forceReplaceSuppAdminBackingBean.managedBean.reactivateBasic.newIdentificationNo}"
								size="35" maxlength="12"
								validatorMessage="#{lbl['lbl.sm.person.icNum']} - #{lbl['lbl.sm.invalidNo']}">
								<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
								<p:ajax event="blur" process="@this" partialSubmit="true"/>
							</p:inputText>
							<!-- #32445 end -->
							<p:message id="newAdminIcNoMsg" for="newAdminIcNo"
									showSummary="true" showDetail="false" display="icon" />
							<!-- #32445 start -->
							<p:inputText
								label="#{lbl['lbl.sm.userprofile.idno']}"
								required="true" id="newAdminPasptNo"
								rendered="#{forceReplaceSuppAdminBackingBean.managedBean.identificationType.parameterCode eq 'P'}"
								value="#{forceReplaceSuppAdminBackingBean.managedBean.reactivateBasic.newIdentificationNo}"
								size="35" maxlength="15">
								<p:ajax event="blur" process="@this" partialSubmit="true"/>
							</p:inputText>
							<!-- #32445 end -->
							<p:message id="newAdminPasptNoMsg" for="newAdminPasptNo"
								showSummary="true" showDetail="false" display="icon" />
						</p:outputPanel>
					</td>
				</tr>
			</p:outputPanel>
		</table>
		<div align="right">
			
									
			<p:commandButton value="#{lbl['lbl.btn.proceed']}"  process="verificationPanel" update="@form"
				action="#{forceReplaceSuppAdminBackingBean.submit}" onclick="blockWidget.show()" oncomplete="blockWidget.hide()" />
		</div>
	</p:outputPanel>
	
	<p:confirmDialog id="replaceNewAdminConfirm" closable="true"
		message="#{lbl['lbl.sm.forcereplaceadmin.newAdmin.nonexist.confirm.msg']}"
		header="#{lbl['lbl.sm.forcereplaceadmin.newAdmin.nonexist.confirm.header']}" severity="alert"
		widgetVar="replaceNewAdminConfirm">
		
		<div align="right">
			<p:commandButton id="yes" value="#{lbl['lbl.btn.yes']}" onclick="replaceNewAdminConfirm.hide()" update="@form"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()" action="#{forceReplaceSuppAdminBackingBean.redirectToNonExistNewAdminPage}"/>
			<p:commandButton id="no" value="#{lbl['lbl.btn.no']}" onclick="replaceNewAdminConfirm.hide()" />
		</div>

	</p:confirmDialog>
	
	<ui:remove>
		<ui:include src="/xhtml/sm/shared/forcereplaceadmin/tncPopup.xhtml" />
	</ui:remove>
		<!-- #28765 Start -->
	<p:dialog id="uploadDialog" widgetVar="uploadDialog" modal="true"
			dynamic="true" resizable="false" width="700px" height="200"
			styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}"
			onShow="singleUploadListener(uploadWV);">
			<p:fileUpload
				allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
				sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
				id="upload"
				invalidFileMessage="#{lbl['lbl.sm.upload.softcert.format.errmsg']}"
				invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}"  
				fileUploadListener="#{forceReplaceSuppAdminBackingBean.handleSupDocFileAttachment}"
				update=":form" oncomplete="uploadDialog.hide();" 
				uploadLabel="#{lbl['lbl.btn.upload']}"  
				label="#{lbl['lbl.btn.choose']}" 
				cancelLabel="#{lbl['lbl.btn.cancel']}"
				showButtons="false" 
				widgetVar="uploadWV" />
		</p:dialog>
		
			<p:confirmDialog id="confirmDeleteSupDocDialog" closable="true"
			message="#{lbl['lbl.sm.upload.delete.message']}"
			header="#{lbl['lbl.sm.upload.delete.confirm.header']}"
			severity="alert" widgetVar="confirmDeleteSupDocDialog">
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.delete']}" 
					action="#{forceReplaceSuppAdminBackingBean.deleteSupDocFileAttachment}" update="@form"
					partialSubmit="true" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()" process="@this" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="confirmDeleteSupDocDialog.hide();" />
			</div>
		</p:confirmDialog>
		<!-- #28765 Start -->
		<!-- #33589 Start, #34400 -->
		<ac:confirmationPopup id="declareDeletePopUpBeforeId"
			widget="declareDeletePopUpBeforeId"
			okAction="#{forceReplaceSuppAdminBackingBean.declare()}" width="400"
			height="150" title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{forceReplaceSuppAdminBackingBean.managedBean.displayMessageReplaceTrans}"
			update=":form" />
		<p:confirmDialog id="declareAlertPopUpBeforeId"
			widgetVar="declareAlertPopUpBefore" closable="true"
			header="#{lbl['lbl.txt.alert']}" styleClass="splNotesFontBank">
			<div class="ppLeftBtn">
				<f:facet name="message">
					<h:outputText value="TEST" styleClass="" escape="false" />
				</f:facet>
			</div>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
					onclick="declareAlertPopUpBefore.hide();" type="button" />
			</div>
		</p:confirmDialog>
		<!-- #33589 End -->
	</ui:define>


</ui:composition>
