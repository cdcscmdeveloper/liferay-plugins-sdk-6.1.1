<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_forceReplaceSupplierAdmin_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.force.replace.suppadmin']}");
		</script>
	</ui:define>


	<ui:define name="contentSection">
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
	
		<p:messages id="defBumiApplPageMsgs" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<p:panel id="forceReplaceTncPanelId" header="#{lbl['lbl.sm.term.and.condition.header']}">
			<p:scrollPanel style="height:100px;border:0;" mode="native">
				<table style="width: 100%">
					<tr>
						<td style="padding-left: 4px;">
							<p:outputPanel><p><h:outputText value="#{lbl['lbl.sm.forcereplaceadmin.tnc.declaration']}" escape="false" /></p></p:outputPanel>
						</td>
					</tr>
				</table>
			</p:scrollPanel>
			
			<br />
			
			<p:panel id="newAdminDetailsPanelId" header="#{lbl['lbl.sm.forcereplaceadmin.newAdmin.details']}">
				<table>
					<p:outputPanel rendered="#{forceReplaceSuppAdminBackingBean.managedBean.reactivateBasic.showEmailInput}">
						<tr>
							<td colspan="2">
								<h:outputText value="#{lbl['lbl.sm.forcereplaceadmin.newAdmin.email.msg']}" styleClass="instruction" />
							</td>
						</tr>
					</p:outputPanel>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.name']}" styleClass="outputLabel-view-label"/></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{forceReplaceSuppAdminBackingBean.managedBean.newAdmin.name}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.person.composition.idenNum']}" styleClass="outputLabel-view-label"/></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{forceReplaceSuppAdminBackingBean.managedBean.newAdmin.identificationNo}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.designation']}" styleClass="outputLabel-view-label"/></td>
						<td><p:outputLabel styleClass="outputLabel-view" value="#{forceReplaceSuppAdminBackingBean.managedBean.newAdmin.designation}" /></td>
					</tr>
					<p:outputPanel rendered="#{!forceReplaceSuppAdminBackingBean.managedBean.reactivateBasic.showEmailInput}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.email']}" styleClass="outputLabel-view-label"/></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{forceReplaceSuppAdminBackingBean.managedBean.newAdmin.email}" /></td>
						</tr>
					</p:outputPanel>
					<p:outputPanel rendered="#{forceReplaceSuppAdminBackingBean.managedBean.reactivateBasic.showEmailInput}">
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.email']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:inputText id="newAdminEmail"
									label="#{lbl['lbl.sm.email']}"
									value="#{forceReplaceSuppAdminBackingBean.managedBean.newAdmin.email}"
									size="40" required="true">
									<f:validateRegex pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
									<p:ajax event="blur" process="@this" partialSubmit="true"/>
									</p:inputText>
								<p:message id="newAdminEmailMsg" for="newAdminEmail"
									showSummary="true" showDetail="false" display="icon" /></td>
						</tr>
					</p:outputPanel>
				 </table>
			 </p:panel>
			
			<br />
				<table>
					<tr>
		
						<td width="10px" style="padding: 4px 2px 0px 4px;"><p:selectBooleanCheckbox
								value="#{forceReplaceSuppAdminBackingBean.managedBean.agreeTnc}">
								<p:ajax event="change" update="declareBtnId"
									partialSubmit="true" process="@this" />
							</p:selectBooleanCheckbox></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.termsConditions']}" /></td>
					</tr>
				</table>
			<br />
			
			<table style="width: 100%;">
				<tr>
					<td>
						<p:commandButton value="#{lbl['lbl.btn.back']}" process="@this"
							immediate="true" action="#{forceReplaceSuppAdminBackingBean.back}" 
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
					</td>
					<td style="white-space: nowrap; float: right;">
						<p:commandButton value="#{lbl['lbl.sm.declare']}" id="declareBtnId"
							action="#{forceReplaceSuppAdminBackingBean.replaceWithExistingUser}"
							disabled="#{!forceReplaceSuppAdminBackingBean.managedBean.agreeTnc}" 
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
					</td>
				</tr>
			</table>
			
		</p:panel>
	</ui:define>
</ui:composition>
