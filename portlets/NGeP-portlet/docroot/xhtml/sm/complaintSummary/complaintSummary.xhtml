<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="contentSection">
	<style>
	      .dashboarTable {
	             color: #000 !important;
	             font-family: Arial,Helvetica,sans-serif;
	              font-size: 12px;
	              border-color: #ddd;
	              border-width:1px;
	              padding-left: 5px;
	              border-style:solid;
	      }
	      
	     .tableWidth80{
	          width:80%;
	     }
	     
	      .tableWidth20{
	          width:20%;
	          text-align: center;
	     }
    </style>
	
		<table style="width:100%;">
			<ui:repeat var="complaint" value="#{complaintBackingBean.retriveComplaintSummary()}">
				<tr>
					<td class="tableWidth80 dashboarTable">
						#{complaint.statusName}
					</td>
					<td  class="tableWidth20 dashboarTable">
						#{complaint.totalRecord}
					</td>
				</tr>
			</ui:repeat>
			 <tr><td colspan="3" style="text-align:right;padding-right: 8%;" class="dashboarTable">
	              <p:commandLink value="#{lbl['lbl.sm.complaint.summary.more']}"  styleClass="blue_font" 
	                    action="#{complaintBackingBean.navigateToComplaintSearch}" >
					</p:commandLink>
				</td></tr>
		</table>
	</ui:define>
</ui:composition>
