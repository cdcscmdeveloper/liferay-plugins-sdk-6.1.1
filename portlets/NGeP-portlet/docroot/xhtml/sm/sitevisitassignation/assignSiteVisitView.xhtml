<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="sideMenu">

	</ui:define>

	<ui:define name="content">
		<h:outputLabel value="Site Visit Assignation"
			style="font-weight:bold;font-size:15px;" />
		<p:dataTable>
			<p:column headerText="No.">
				<p:outputLabel value="#{svList.taskNo}" />
			</p:column>
			<p:column headerText="Date of Creation">
				<p:outputLabel value="#{svList.dateOfCreation}" />
			</p:column>

			<p:column headerText="Application No.">
				<p:outputLabel value="#{svList.appNo}" />
			</p:column>
			<p:column headerText="Company Name">
				<p:outputLabel value="#{svList.companyName}" />
			</p:column>

			<p:column headerText="Status">
				<p:outputLabel value="#{svList.status}" />
			</p:column>

			<p:column headerText="MOF No.">
				<p:outputLabel value="#{svList.mofNo}" />
			</p:column>

			<p:column headerText="Action">
				<p:commandButton value="View" action="assignSiteVisitDetails.xhtml" />
			</p:column>
		</p:dataTable>
	</ui:define>
</ui:composition>
