<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<h:panelGroup id="smResubmitApplQuestionPanel">
			<f:event listener="#{backingBean.prerenderResubmissionQuestionaire}"
				type="preRenderView" />
		</h:panelGroup>


		<h:panelGroup rendered="#{!backingBean.managedBean.validResubmit}">
			<p:outputLabel value="#{lbl['lbl.sm.resubmission.invalid']}"
				style="float : left" />
		</h:panelGroup>
		<h:panelGroup
			rendered="#{!backingBean.managedBean.resubmitWithActiveDraft}">
			<p:outputLabel value="#{lbl['lbl.sm.activeDrftExist']}"
				style="float : left" />
		</h:panelGroup>

	</ui:define>


</ui:composition>
