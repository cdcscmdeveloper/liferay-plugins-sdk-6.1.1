<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:param name="bb" value="#{testSpkiBackingBean}" />
	<ui:define name="resourceSection" />
	<!-- refer:
		- My Softcert - 3 buttons (mySoftcertPage.xhtml)
		- Apply Softcert - spki dialog 2 buttons (spkiPopup.xhtml)
	 -->
	<ui:define name="sideMenu" />

	<ui:define name="content">
	<p:panel header="Test SPKI" style="width:500" id="testSpkiPnl">
		<p:messages id="msgTestSpki" for="spki" showDetail="true" autoUpdate="true" closable="true"/>
		<h:panelGrid columns="3" cellpadding="5" id="pnlGrid" >
			<p:outputLabel value=""/>
			<p:selectOneRadio value="#{bb.cert}" id="certRadio">
				<f:selectItem itemLabel="Trustgate" itemValue="TG" />
				<f:selectItem itemLabel="Digicert" itemValue="DG" />
				<p:ajax event="change" update="@form" partialSubmit="true"/>
			</p:selectOneRadio>
			<p:outputLabel value=""/>
			
			<p:outputLabel value="ID No." for="idNo" id="idLbl" styleClass="required" />
			<p:inputText value="#{bb.idNo}" id="idNo" />
			<p:outputLabel value=""/>
			
			<p:outputLabel value="eP No." for="epNo" id="epLbl" styleClass="required" />
			<p:inputText value="#{bb.epNo}" id="epNo" />
			<p:outputLabel value=""/>
			
			<p:outputLabel value="Email" for="email" id="emailLbl" />
			<p:inputText value="#{bb.email}" id="email" />
			<p:outputLabel value="Mandatory for Digicert - Reset PIN"/>
		</h:panelGrid>
		
		<h:commandLink action="#{bb.requestChallRespUpdate()}" target="_blank" >
			<p:commandButton value="#{lbl['lbl.sm.button.update.chalresponse']}" />
		</h:commandLink>
		<h:commandLink action="#{bb.requestChangePIN()}" target="_blank" >
			<p:commandButton value="#{lbl['lbl.sm.button.change.pin']}" />
		</h:commandLink>
		<h:commandLink action="#{bb.requestResetPIN()}" target="_blank" >
			<p:commandButton value="#{lbl['lbl.sm.button.reset.pin']}" />
		</h:commandLink>
		
		<p:commandButton action="#{bb.submit()}" value="#{lbl['lbl.btn.sign']}" update="@form"/>
		
		<p:commandButton action="#{bb.reset()}" value="#{lbl['lbl.btn.reset']}" update="@form"/>
	</p:panel>
	
	<p:panel header="Test Sign" style="width:500" id="submitPnl" rendered="#{not empty bb.challengeQues1}">
		<h:panelGrid columns="2" cellpadding="5" id="pnlSubmit" >
			<p:outputLabel value="#{bb.challengeQues1}" for="answer" id="quesLbl" styleClass="required"/>
			<p:inputText value="#{bb.challengeAns1}" id="answer" />
			
			<p:outputLabel value="#{lbl['lbl.cc.spki.pin']}" for="password" id="pinLbl" styleClass="required"/>
			<p:inputText value="#{bb.password}" id="password" />
			
			<p:outputLabel value="Data for Signing" for="signBeforeText" id="dataLbl" styleClass="required"/>
			<p:inputText value="#{bb.dataForSigning}" id="signBeforeText" />
		</h:panelGrid>
		
		<p:commandButton value="#{lbl['lbl.btn.sign']}" action="#{bb.sign()}" update="@form"/>
		
		<p:commandButton value="#{lbl['lbl.btn.change.question']}" action="#{bb.changeChallengeQuestions}" update="@form"/>
	</p:panel>
	</ui:define>
</ui:composition>
