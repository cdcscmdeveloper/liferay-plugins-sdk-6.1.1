<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_updatePersonnelInformation_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.update.personnel.details']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false"/>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<ui:param name="backingBean" value="#{updatePersonnelBackingBean}" />
		
		<p:outputPanel id="cc" layout="block">
			<p:outputPanel id="prsnlSecApprvrRmrk" layout="block"></p:outputPanel>
			<p:outputPanel id="persInfPan" layout="block"></p:outputPanel>
			<p:outputPanel id="smPersonnelParentPan" layout="block"></p:outputPanel>
			<p:outputPanel id="stfSummaryPan" layout="block"></p:outputPanel>
			
			<p:outputPanel id="personnelTableOutPanelId" rendered="#{!backingBean.managedBean.redirectToPersonPage}">
				<p:panel header="#{lbl['lbl.sm.update.personnel.list']}" toggleable="true">
					<p:outputPanel rendered="#{backingBean.managedBean.disAllowOwnerEdit}">
						<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.update.personel.disallowed.edit']}" />
					</p:outputPanel><br />
					<ui:include src="/xhtml/sm/shared/mofRegistration/personnelTableList.xhtml" />
				</p:panel>
			</p:outputPanel>
			<p:outputPanel id="personnelMainOutPanelId" rendered="#{backingBean.managedBean.redirectToPersonPage}">
				<ui:include src="/xhtml/sm/shared/mofRegistration/captialShareHolderInfoRedirectForm.xhtml" />
			</p:outputPanel>
		</p:outputPanel>
		
	</ui:define>
		
</ui:composition>
