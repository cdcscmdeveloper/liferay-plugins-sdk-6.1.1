<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_updatePersonnelInformation_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.update.personnel.supplier.profile.maintenance']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false"/>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<ui:param name="viewSmApplBackingBean" value="#{updatePersonnelBackingBean}" />
			
		<p:outputPanel id="personnelTableOutPanelId" rendered="#{!viewSmApplBackingBean.managedBean.redirectToPersonPage}">
			<p:outputPanel rendered="#{viewSmApplBackingBean.managedBean.disAllowOwnerEdit}">
				<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.update.personel.disallowed.edit']}" /><br />
			</p:outputPanel>
			<ui:include src="personnelList.xhtml" />
		</p:outputPanel>
		<p:outputPanel id="personnelMainOutPanelId" rendered="#{viewSmApplBackingBean.managedBean.redirectToPersonPage}">
			<ui:include src="/xhtml/sm/shared/applViewOnlyPages/captialShareHolderInfoRedirectFormViewOnly.xhtml" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.save']}" update="@form"
						action="#{viewSmApplBackingBean.save}" onclick="blockWidget.show()" 
						oncomplete="blockWidget.hide()" />
			</div>
		</p:outputPanel>
		
	</ui:define>
		
</ui:composition>
