<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.userprofile.authorized.personnels']}" id="authPersonnelPanelId" >
		<p:dataTable var="authPerson" widgetVar="authPersonnelDtWidVar"
			editable="false"
			value="#{viewSmApplBackingBean.managedBean.authorizedPersonnels}"
			rowKey="#{authPerson}" rowIndexVar="index" id="authPersonDt">
			<ac:paginator for="authPersonDt" />

			<p:column headerText="#{lbl['lbl.sm.person.composition.name']}">
				<h:outputText value="#{authPerson.name}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.person.composition.idenNum']}">
				<h:outputText value="#{authPerson.identificationNo}" />
			</p:column>
			<p:column rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.STYPE_CONTRACTOR}"
				headerText="#{lbl['lbl.sm.person.composition.certStatus']}" 
				style="white-space: normal !important;width : 10% !important;">
				<ac:smSoftcertStatus personnel="#{authPerson}"  />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.person.composition.role']}" style="white-space: normal !important;width : 20% !important;">
				<h:outputText value="#{authPerson.roleName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.person.composition.eprole']}" style="white-space: normal !important;width : 15% !important;">
				<ac:smRoleDesc backingBean="#{viewSmApplBackingBean}" roleCode="#{authPerson.epRole}" />
				<h:outputText value=" (#{lbl['lbl.sm.contract.signer']})"
					rendered="#{authPerson.contractSignerFlg eq 1 and viewSmApplBackingBean.managedBean.smAppl.supplierType ne 'J'}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;width : 5% !important;">
				<p:commandLink onstart="blockWidget.show()"
					disabled="#{viewSmApplBackingBean.managedBean.disAllowOwnerEdit}"
					oncomplete="blockWidget.hide()"
					action="#{viewSmApplBackingBean.assignSelShareHolder(authPerson)}"
					process="@this"
					partialSubmit="true" update="@form" style="padding-right:5px;">
					<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</p:panel>
	
	<br />
	
	<p:panel header="#{lbl['lbl.sm.userprofile.unauthorized.personnels']}" id="unauthPersonnelPanelId" >
		<p:dataTable var="unauthPerson" widgetVar="unauthPersonnelDtWidVar"
			editable="false"
			value="#{viewSmApplBackingBean.managedBean.normalPersonnels}"
			rowKey="#{unauthPerson}" rowIndexVar="index" id="unauthPersonDt">
			<ac:paginator for="unauthPersonDt" />

			<p:column headerText="#{lbl['lbl.sm.person.composition.name']}">
				<h:outputText value="#{unauthPerson.name}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.person.composition.idenNum']}">
				<h:outputText value="#{unauthPerson.identificationNo}" />
			</p:column>
			<p:column rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq SupplierManagementConst.STYPE_CONTRACTOR}"
				headerText="#{lbl['lbl.sm.person.composition.certStatus']}" 
				style="white-space: normal !important;width : 10% !important;">
				<ac:smSoftcertStatus personnel="#{unauthPerson}"  />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.person.composition.role']}" style="white-space: normal !important;width : 20% !important;">
				<h:outputText value="#{unauthPerson.roleName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.person.composition.eprole']}" style="white-space: normal !important;width : 15% !important;">
				<ac:smRoleDesc backingBean="#{viewSmApplBackingBean}" roleCode="#{unauthPerson.epRole}" />
				<h:outputText value=" (#{lbl['lbl.sm.contract.signer']})"
					rendered="#{unauthPerson.contractSignerFlg eq 1 and viewSmApplBackingBean.managedBean.smAppl.supplierType ne 'J'}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;width : 5% !important;">
				<p:commandLink onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					disabled="#{viewSmApplBackingBean.managedBean.disAllowOwnerEdit}"
					action="#{viewSmApplBackingBean.assignSelShareHolder(unauthPerson)}"
					process="@this"
					partialSubmit="true" update="@form" style="padding-right:5px;">
					<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</p:panel>

</ui:composition>
