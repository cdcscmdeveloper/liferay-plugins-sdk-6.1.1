<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:panel header="Acoount Type">
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sm.regtype']}" /></td>
					<td><p:selectOneRadio
							value="#{registrationBackingBean.managedBean.applType}">
							<f:selectItem itemLabel="Register Online Account" itemValue="O" />
							<f:selectItem itemLabel="MOF Registeration" itemValue="N" />
							<p:ajax event="change" update="agreementId" />
						</p:selectOneRadio></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="Agreement" id="agreementId">
			<p:scrollPanel style="height:300px;" mode="native">
				<c:choose>
					<c:when
						test="${registrationBackingBean.managedBean.applType == 'N'}">
						aaaaa
					</c:when>

					<c:otherwise>
						bbbbb
					</c:otherwise>
				</c:choose>
			</p:scrollPanel>
		</p:panel>

		<div align="right">
			<p:commandButton value="Next"
				action="#{registrationBackingBean.onlineAccountAgreement}" />
		</div>
	</ui:define>
</ui:composition>
