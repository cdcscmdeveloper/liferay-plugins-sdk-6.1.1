<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	
		<script type='text/javascript'>
			//var $jq = jQuery.noConflict(true);
		</script>
	
	</ui:define>

	<ui:define name="contentSection">
<!-- 	<p:messages id="messages"  autoUpdate="true" /> -->
<!-- 	<p:inputText id="textInt" value="" required="true" /> -->
<!-- 	<p:message id="textMsg" for="textInt" display="icon"  /> -->
	
<!-- 		<p:inputText id="textInt1" value="" required="true" /> -->
<!-- 	<p:message id="testtextMsg" for="textInt1" display="icon"  update="@([id$=Msg])" /> -->
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>		

		<p:panel header="#{lbl['lbl.sm.account.type.header']}">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.regtype']}" /></td>
					<td><p:selectOneRadio
							value="#{registrationBackingBean.managedBean.applType}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.basic']}" itemValue="#{SupplierManagementConst.ACC_BASIC}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.mof']}" itemValue="#{SupplierManagementConst.ACC_MOF}" />
							<p:ajax event="change" update="agreementId,btnProceed" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
						</p:selectOneRadio></td>
						<td>&#160;
						<p:graphicImage id="regType" library="ep/images/design" name="tooltips.png" />
						<p:tooltip id="regiType" for="regType">
							<p:outputLabel escape="false" value="#{lbl['tt.sm.registration.type']}"  />
						</p:tooltip>&#160;						
						</td>
				</tr>
			</table>
		</p:panel>

		<p:panel id="agreementId">
			<p:scrollPanel style="height:300px;" mode="native">
				<c:choose>
					<c:when
						test="${registrationBackingBean.managedBean.applType == SupplierManagementConst.ACC_MOF}">
						<b>#{lbl['lbl.sm.basic.account.mof']}</b>
						<br />
						<p><h:outputText escape="false" value="#{lbl['lbl.sm.basic.account.mofdesc']}" /></p>
						<br />
						<p><h:outputText escape="false" value="#{lbl['lbl.sm.mofReg.descData']}" /></p>
					</c:when>

					<c:otherwise>
						<b>#{lbl['lbl.sm.basic.account.basic']}</b>
						<br />
						<p><h:outputText escape="false" value="#{lbl['lbl.sm.basic.account.basicdesc']}" /></p>
					</c:otherwise>
				</c:choose>
			</p:scrollPanel>
			<br />
			<p:scrollPanel style="height:300px;" mode="native">
				<c:choose>
					<c:when
						test="${registrationBackingBean.managedBean.applType == SupplierManagementConst.ACC_MOF}">
						<b>#{lbl['lbl.sm.basic.mof.tnc.header']}</b>
						<br />
						<p><h:outputText escape="false" value="#{lbl['lbl.sm.basic.account.mof.tnc']}" /></p>
					</c:when>

					<c:otherwise>
						<b>#{lbl['lbl.sm.basic.basic.tnc.header']}</b>
						<br />
						<p><h:outputText escape="false" value="#{lbl['lbl.sm.basic.account.basic.tnc']}" /></p>
					</c:otherwise>
				</c:choose>
			</p:scrollPanel>
			<br />
			<p:selectBooleanCheckbox id="chkTcId" value="#{registrationBackingBean.managedBean.agreeTC}" 
				disabled="#{empty registrationBackingBean.managedBean.applType}">
				<p:ajax update="btnProceed" partialSubmit="true" process="@this" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
			</p:selectBooleanCheckbox>
			#{lbl['lbl.sm.have.agreed']} #{lbl['lbl.sm.term.and.condition']}
		</p:panel>
		<div align="right">
			<p:commandButton id="btnProceed" value="#{lbl['lbl.sm.next']}" 
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			disabled="#{(!registrationBackingBean.managedBean.agreeTC || registrationBackingBean.managedBean.applType == null)}"
				action="#{registrationBackingBean.proceedToCompanyInfo}" />
		</div>
		
	</ui:define>
</ui:composition>
