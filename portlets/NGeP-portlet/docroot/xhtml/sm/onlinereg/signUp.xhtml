<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	
		<script type='text/javascript'>
			//var $jq = jQuery.noConflict(true);
		</script>
	
	</ui:define>

	<ui:define name="contentSection">
<!-- 	<p:messages id="messages"  autoUpdate="true" /> -->
<!-- 	<p:inputText id="textInt" value="" required="true" /> -->
<!-- 	<p:message id="textMsg" for="textInt" display="icon"  /> -->
	
<!-- 		<p:inputText id="textInt1" value="" required="true" /> -->
<!-- 	<p:message id="testtextMsg" for="textInt1" display="icon"  update="@([id$=Msg])" /> -->
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>		

		<p:panel header="#{lbl['lbl.sm.header.new.registration']}">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.account.type.header']}" /></td>
					<td><p:selectOneRadio
							value="#{registrationBackingBean.managedBean.applType}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.basic']}" itemValue="#{SupplierManagementConst.ACC_BASIC}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.mof']}" itemValue="#{SupplierManagementConst.ACC_MOF}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.govt']}" itemValue="#{SupplierManagementConst.ACC_GOVT_SELLER}" />
							
							<p:ajax event="change" update="btnProceed"/>
						</p:selectOneRadio></td>
				</tr>
			</table>
		</p:panel>

		<p:panel id="agreementId" header="#{lbl['lbl.sm.basic.account.supplier.acc.intro']}">
			<p:scrollPanel style="height:300px;border:0;" mode="native">
				<p><h:outputText escape="false" value="#{lbl['lbl.sm.basic.account.default']}" /></p>
			</p:scrollPanel>
			<br />
		</p:panel>
		<div align="right">
			<p:commandButton id="btnProceed" value="#{lbl['lbl.sm.next']}" 
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			disabled="#{registrationBackingBean.managedBean.applType == null}"
				action="#{registrationBackingBean.proceedToTermAndCondition}" />
		</div>
		
	</ui:define>
</ui:composition>
