<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<script type="application/javascript">
			$(document).ready(function(e){
				  $("input[id$=txtPermAdd1]").keydown(function(e){
					if(e.which==9 || e.keycode==9){
						$("input[id$=txtPermAdd2]").focus();
						e.preventDefault();
					}
				  });
				  $("input[id$=txtPermAdd2]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=txtPermAdd3]").focus();
						e.preventDefault();
					} 
				  });
				  $("input[id$=txtPermAdd3]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=cmbPermCounrty_focus]").focus();
						e.preventDefault();
					} 
				  });
				 
				  $("input[id$=cmbPermCounrty_focus]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=cmbPermState_focus]").focus();
						e.preventDefault();
					} 
				  });
				  $("input[id$=cmbPermState_focus]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=cmbPermDistrict_focus]").focus();
						e.preventDefault();
					} 
				  });
				  $("input[id$=cmbPermDistrict_focus]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=cmbPermCity_focus]").focus();
						e.preventDefault();
					} 
				  });
				  $("input[id$=cmbPermCity_focus]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=txtPermPostcodeMy]").focus();
						e.preventDefault();
					} 
				  });
				 
			});
	</script>
	
	<script type="application/javascript">
			$(document).ready(function(){
			  $("input[id$=usrEmail]").bind("cut copy paste",function(e) {
		          e.preventDefault();
		      });
			  
			  $("input[id$=conEmail]").bind("cut copy paste",function(e) {
		          e.preventDefault();
		      });
		    });
	</script>
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false"  escape="false" />
	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.submit']}" id="btnSubmit" update="firstUserTncDialog" onstart="submissionDialog.show();" oncomplete="submissionDialog.hide();"
				action="#{registrationBackingBean.onCallFirstUserTncDialog}">
				<f:param name="disableValidation" value="true" />
		</p:commandButton>
	</div>

		<p:dialog widgetVar="submissionDialog" modal="true" draggable="false"
			closable="false" resizable="false" showHeader="false">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:dialog>
		
		<p:dialog id="firstUserTncDialog" header="#{lbl['lbl.sm.suppadmin.appointment.header']}"
			widgetVar="firstUserTncDialog" modal="true" width="600px" height="500px">
			<p:panel id="firstUserTncPanelId" header="#{lbl['lbl.sm.term.and.condition.header']}">
				
				<p:scrollPanel style="height:350px;border:0;" mode="native">
					<h:outputText escape="false" value="#{lbl['lbl.sm.suppadmin.appointment.msg']}" style="white-space : normal !important"/>
				</p:scrollPanel>
	
				<table>
					<tr>
						<td width="10px" style="padding: 4px 2px 0px 4px;"><p:selectBooleanCheckbox
								value="#{registrationBackingBean.managedBean.aggreeDeclareAdmin}">
								<p:ajax event="change" update=":form:basCmdBtn" />
							</p:selectBooleanCheckbox></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.termsConditions']}" /></td>
					</tr>
				</table>
				
				<div align="right">
					<p:commandButton value="#{lbl['lbl.sm.proceed']}" id="basCmdBtn"
						action="#{registrationBackingBean.submitRegistration}" 
						update="@form" onclick="firstUserTncDialog.hide();"
						disabled="#{!registrationBackingBean.managedBean.aggreeDeclareAdmin}" 
						onstart="submissionDialog.show()" oncomplete="submissionDialog.hide()" />
					<p:commandButton value="#{lbl['lbl.btn.cancel']}" onclick="firstUserTncDialog.hide();" />
				</div>
			</p:panel>
		</p:dialog>

		<!-- 	<p:messages id="messages" showDetail="true" autoUpdate="true" />   -->
		<p:panel header="#{lbl['lbl.sm.userinfo']}" toggleable="true" id="pnlUsrInfo">
			<table class="customTbl">
				<tr>
					<td colspan="4"><p:selectBooleanCheckbox
							value="#{registrationBackingBean.managedBean.sameAsOwner}">
							<p:ajax event="change" update="@([id$=pnlUsrInfo])" listener="#{registrationBackingBean.sameAsOwnerOnChange}"
								partialSubmit="true" 
								process="@form" />
						</p:selectBooleanCheckbox><h:outputText value="#{lbl['lbl.sm.userreg.admin.same.as.owner']}"></h:outputText></td>
				</tr>
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.fullname']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
					<c:if test="#{registrationBackingBean.managedBean.companyValidWithSSM}">
						<p:inputText size="40"  rendered="#{!registrationBackingBean.managedBean.sameAsOwner}" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.fullname']}"
							id="fullName" maxlength="80"  readonly="#{registrationBackingBean.managedBean.sameAsOwner}" 
							disabled="#{registrationBackingBean.managedBean.sameAsOwner}"
							value="#{registrationBackingBean.managedBean.smPersonnel.name}" >
							<p:ajax event="change" partialSubmit="true"></p:ajax>
							</p:inputText>
						<p:selectOneMenu id="selectName"  rendered="#{registrationBackingBean.managedBean.sameAsOwner}" value="#{registrationBackingBean.managedBean.smPersonnelSelected.identificationNo}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				   			<f:selectItems value="#{registrationBackingBean.managedBean.selectItemsSmPersonnelOwners}"  />
				   		
				   			<p:ajax event="change" listener="#{registrationBackingBean.nameOnchange()}" process="@form"
							partialSubmit="true"  update="@([id$=pnlUsrInfo])" />
				   		</p:selectOneMenu>	
					</c:if>
					<c:if test="#{!registrationBackingBean.managedBean.companyValidWithSSM}">
						<p:inputText size="40" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.fullname']}"
							id="fullName" maxlength="80"  readonly="#{registrationBackingBean.managedBean.sameAsOwner}" 
							disabled="#{registrationBackingBean.managedBean.sameAsOwner}"
							value="#{registrationBackingBean.managedBean.smPersonnel.name}" >
							<p:ajax event="change" partialSubmit="true"></p:ajax>
							</p:inputText>
					</c:if>
						
						
												
						&#160;
						<p:graphicImage id="fNmti" value="/css/images/design/tooltips.png" />
						<p:tooltip id="fNmtt" for="fNmti">
							<p:outputLabel escape="false" value="#{lbl['tt.sm.user.full.name']}"  />
						</p:tooltip>
						<p:message id="fullNameMsg" for="fullName" display="icon" />
					</td>
					
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.nationality']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<!-- #27878 disable when choose applType = SupplierManagementConst.ACC_BASIC-->
					<td class="tdContent"><p:selectOneMenu id="nationalityId"
							required="#{!empty param['disableValidation']}"
							label="#{lbl['lbl.sm.nationality']}"
							value="#{registrationBackingBean.managedBean.smPersonnel.pmCountry.countryId}"
							style="width:80%"
							disabled="#{registrationBackingBean.managedBean.sameAsOwner or registrationBackingBean.managedBean.smAppl.applType==SupplierManagementConst.ACC_BASIC}"

								value="#{registrationBackingBean.getUnknownCountry()}" />
							<f:selectItem itemValue="" itemLabel="#{lbl['lbl.txt.select']}" />
							<f:selectItems var="counLs"
								value="#{registrationBackingBean.managedBean.countryLs}"
								itemLabel="#{counLs.countryName}"
								itemValue="#{counLs.countryId}" />
							<f:selectItem itemValue="#{unknownCountry.countryId}"
								itemLabel="#{unknownCountry.countryName}" />
							<p:ajax event="change"
								listener="#{registrationBackingBean.personnelNationalityOnChange}"
								process="@form"
								update="cmbUsrIdenType,txtIdNumber,pnlFirstUserIdenType,pnlPersonnelAddress,pnlUsrInfo" />
						</p:selectOneMenu> <p:message id="nationalityIdMsg" for="nationalityId" display="icon" />
						
						<h:outputText value="#{registrationBackingBean.managedBean.smPersonnel.pmCountry.countryName}" 
							rendered="#{registrationBackingBean.managedBean.sameAsOwner}"/>
						
					</td>
				</tr>
				<p:outputPanel id="pnlFirstUserIdenType">
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.identificationtype']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
						<h:outputText id="cmbUsrIdenType" 
							value="#{registrationBackingBean.getParamDescByParameterId(registrationBackingBean.managedBean.smPersonnel.identificationTypeId)}"/>
					</td>

					<td class="tdTitle">
						
						<c:choose>
							<c:when test="#{registrationBackingBean.managedBean.smPersonnel.identificationType.parameterCode == SupplierManagementConst.NEW_IC}">
								<p:outputLabel value="#{lbl['lbl.sm.individual.newicno']}" />
							</c:when>
							<c:otherwise>
								<p:outputLabel value="#{lbl['lbl.sm.identificationno']}" />
							</c:otherwise>
						</c:choose>
						
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
						<c:choose>
						<c:when test="#{registrationBackingBean.managedBean.smPersonnel.identificationType.parameterCode == SupplierManagementConst.NEW_IC}">
							<p:inputText id="txtIdNumber" required="#{!empty param['disableValidation']}"
								requiredMessage="#{lbl['lbl.sm.icNo.required']}"
								label="#{lbl['lbl.sm.identificationno']}" disabled="#{registrationBackingBean.managedBean.sameAsOwner}"
								value="#{registrationBackingBean.managedBean.smPersonnel.identificationNo}"
								size="30" maxlength="12" validatorMessage="#{lbl['lbl.sm.invalidIcNo']}">
								<f:validateRegex pattern="^-?\d*(\.\d+)?$" disabled="#{empty param['disableValidation']}"/>

							</p:inputText>
						</c:when>
						
						<c:otherwise>
							<p:inputText id="txtIdNumber" required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.sm.identificationno']}" disabled="#{registrationBackingBean.managedBean.sameAsOwner}"
								value="#{registrationBackingBean.managedBean.smPersonnel.identificationNo}"
								size="30" maxlength="15">
								<p:ajax process="@this" partialSubmit="true" update="@this" listener="#{registrationBackingBean.trimPersonnelPassportValue}"/>
							</p:inputText>
						</c:otherwise>
						</c:choose>
						&#160;
						<p:graphicImage id="uidti" value="/css/images/design/tooltips.png" />
						<p:tooltip id="uidtt" for="uidti">
							<c:choose>
								<c:when test="#{registrationBackingBean.managedBean.smPersonnel.pmCountry.countryCode == ParameterConst.countryUnknownCode}">
									<p:outputLabel escape="false" value="#{lbl['tt.sm.mykas']}"  />
								</c:when>
								
								<c:otherwise>
									<c:choose>
										<c:when test="#{registrationBackingBean.managedBean.smPersonnel.identificationType.parameterCode == SupplierManagementConst.NEW_IC}">
											<p:outputLabel escape="false" value="#{lbl['tt.sm.owner.identification.ic']}" />
										</c:when>
										
										<c:otherwise>
											<p:outputLabel escape="false" value="#{lbl['tt.sm.owner.identification.passport']}"  />
										</c:otherwise>
									</c:choose>
								</c:otherwise>
							</c:choose>
						</p:tooltip>
						<p:message id="txtIdNumberMsg" for="txtIdNumber" display="icon" />
					</td>
				</tr>
				</p:outputPanel>
				<tr>
					
				<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.salutation']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
						<p:selectOneMenu id="salutationId" required="#{!empty param['disableValidation']}"  
							label="#{lbl['lbl.pm.profiles.userdetails.salutation']}" value="#{registrationBackingBean.managedBean.smPersonnel.title.salutationId}" 
							style="width: 150px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems value="#{registrationBackingBean.managedBean.salutationItems}" />
							<p:ajax event="change" partialSubmit="true"></p:ajax>
						</p:selectOneMenu>
						<p:message id="salutationIdMsg" for="salutationId" display="icon" />
					</td>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.userprofile.dob']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
					<p:calendar id="dobCalId"
							navigator="true" required="#{!empty param['disableValidation']}" 							
							label="#{lbl['lbl.sm.userprofile.dob']}" value="#{registrationBackingBean.managedBean.smPersonnel.birthDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
							readonlyInput="true" size="30" showOn="button" yearRange="-99"  maxdate="#{CommonConstants.CURRENT_DATE}"
							rendered="#{!registrationBackingBean.disableFieldSSm(registrationBackingBean.managedBean.smPersonnel.ssmData,registrationBackingBean.managedBean.smAppl.applValidWithSsm,registrationBackingBean.managedBean.smPersonnel.birthDateSsmNull)}"
							>
							<p:ajax event="blur" partialSubmit="true"></p:ajax>
						</p:calendar>
						<p:calendar id="dobCalId2"
							navigator="true" required="#{!empty param['disableValidation']}" 
							label="#{lbl['lbl.sm.userprofile.dob']}" value="#{registrationBackingBean.managedBean.smPersonnel.birthDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
							readonlyInput="true" size="30"  yearRange="-99"  maxdate="#{CommonConstants.CURRENT_DATE}"							
							rendered="#{registrationBackingBean.disableFieldSSm(registrationBackingBean.managedBean.smPersonnel.ssmData,registrationBackingBean.managedBean.smAppl.applValidWithSsm,registrationBackingBean.managedBean.smPersonnel.birthDateSsmNull)}"
							disabled="#{!registrationBackingBean.managedBean.smPersonnel.birthDateSsmNull}"
							>
							<p:ajax event="blur" partialSubmit="true"></p:ajax>
						</p:calendar>
					</td>
				</tr>
				
				
				
				
				<p:outputPanel id="pnlBumiIslam"

						<p:outputLabel value="#{lbl['lbl.sm.person.bumi']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					
					<td class="tdContent">

							<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />

					<td class="tdTitle">

						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					
					<td class="tdContent">
						<p:selectOneRadio id="religionId" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.person.religion']}"
							value="#{registrationBackingBean.managedBean.userMuslimFlg}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.person.religion.muslim']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.person.religion.non.muslim']}" itemValue="0" />
							<p:ajax event="change" partialSubmit="true"></p:ajax>
						</p:selectOneRadio>
						<p:message id="religionIdMsg" for="religionId" showSummary="true" showDetail="false" display="icon" />
					</td>
				</tr>
				</p:outputPanel>

							value="#{registrationBackingBean.managedBean.smPermenantAdd.address1}"
							id="txtPermAdd1" ><p:ajax event="blur" partialSubmit="true"></p:ajax></p:inputText>
							&#160; <p:graphicImage id="addti"
							value="/css/images/design/tooltips.png" /> <p:tooltip
							id="addtt" for="addti">
							<p:outputLabel escape="false"
								value="#{lbl['tt.sm.user.address']}" />
						</p:tooltip> <p:message id="txtPermAdd1Msg" for="txtPermAdd1" display="icon" />
					</td>

					<td id="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.country']}" />
						<p:outputLabel value="*" styleClass="mandatory" />	
					</td>

					<td id="tdContent"><p:selectOneMenu required="#{!empty param['disableValidation']}"

							id="cmbPermCounrty" style="width:80%">
							<f:selectItem itemValue="" itemLabel="#{lbl['lbl.txt.select']}" />
							<f:selectItems var="counLs"

						<!-- #34159 - END -->
						<p:message id="cmbPermCounrtyMsg" for="cmbPermCounrty"
							display="icon" /></td>
				</tr>

				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent"><p:inputText size="40" value="#{registrationBackingBean.managedBean.smPermenantAdd.address2}"
							 id="txtPermAdd2" maxlength="100" ><p:ajax event="blur" partialSubmit="true"></p:ajax></p:inputText>
							 </td>
							
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.state']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<!--#30936-START-->
					<td class="tdContent"><p:selectOneMenu id="cmbPermState" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.state']}"

							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="state"
								value="#{registrationBackingBean.managedBean.permenantStateLs}"
								itemValue="#{state.stateId}" itemLabel="#{state.stateName}" />

						</p:selectOneMenu>
						<p:message id="cmbPermStateMsg" for="cmbPermState" display="icon" /></td>

				</tr>
				<!-- 13320 -->
				<!--#30936-START-->
            <tr id="divTrId">
				<td></td>
				<td></td>
				<td class="tdTitle">
				<p:outputPanel id="divisionRegLabelPanelId">	
					<ui:fragment rendered="#{registrationBackingBean.managedBean.smPermenantAdd.pmState.adoptDivision}">
						<p:outputLabel value="#{lbl['lbl.sm.division']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</ui:fragment>
				</p:outputPanel>
				</td>
				<td class="tdContent">
				<p:outputPanel id="divisionRegDropdownPanelId">
					<ui:fragment rendered="#{registrationBackingBean.managedBean.smPermenantAdd.pmState.adoptDivision}">
						<!-- #34159 - START -->
						<p:selectOneMenu id="cmbPermDivision" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.sm.division']}"
						value="#{registrationBackingBean.managedBean.smPermenantAdd.pmDivision.divisionId}"

						<f:selectItem itemValue="" itemLabel="#{lbl['lbl.txt.select']}" />

							itemValue="#{division.divisionId}"
							itemLabel="#{division.divisionName}" />

							listener="#{registrationBackingBean.populateDivisionByAddType('permenant', true)}"
							update="cmbPermDistrict,cmbPermCity" />
					</p:selectOneMenu>
					<p:message id="cmbPermDivisionMsg" for="cmbPermDivision" display="icon" />

					</ui:fragment>
				</p:outputPanel>

            </tr>

				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent"><p:inputText size="40" value="#{registrationBackingBean.managedBean.smPermenantAdd.address3}"
							id="txtPermAdd3" maxlength="100" ><p:ajax event="blur" partialSubmit="true"></p:ajax></p:inputText>
							</td>
							
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.district']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
