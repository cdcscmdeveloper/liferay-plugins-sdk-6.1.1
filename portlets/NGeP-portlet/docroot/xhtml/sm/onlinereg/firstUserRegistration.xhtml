<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<ui:define name="contentSection">
		<p:panel header="User Information" toggleable="true" id="pnlUsrInfo">
			<table class="customTbl">
				<tr>
					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.fullname']}" /></td>
					<td class="tdContent" colspan="3"><p:inputText size="40" id="fullName"
							value="#{registrationBackingBean.managedBean.smPersonnel.name}" />
					</td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.nationality']}" /></td>
					<td class="tdContent"><p:selectOneMenu id="nationalityId">
							<f:selectItem itemLabel="Select" itemValue="" />
							<f:selectItem itemLabel="Malaysian" itemValue="0" />
							<f:selectItem itemLabel="Non Malaysian" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.identificationtype']}" /></td>
					<td class="tdContent"><p:selectOneMenu id="cmbUsrIdenType"
							value="#{registrationBackingBean.managedBean.smPersonnel.identificationTypeId}">
							<f:selectItem itemLabel="Select" itemValue="" />
							<f:selectItem itemLabel="New NRIC" itemValue="I" />
							<f:selectItem itemLabel="Passport" itemValue="P" />
						</p:selectOneMenu></td>

					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.identificationno']}" /></td>
					<td class="tdContent"><p:inputText id="txtIdNumber"
							value="#{registrationBackingBean.managedBean.smPersonnel.identificationNo}"
							size="40" /></td>
				</tr>

				<tr>
					<td id="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.country']}" /></td>
					<td id="tdContent"><p:selectOneMenu
							value="#{registrationBackingBean.managedBean.smPermenantAdd.pmCountry.countryId}" id="cmbPermCounrty">
							<f:selectItem itemValue="0" itemLabel="---Select---" />
							<f:selectItems var="counLs"
								value="#{registrationBackingBean.managedBean.countryLs}"
								itemLabel="#{counLs.countryName}"
								itemValue="#{counLs.countryId}" />
							<p:ajax event="change"
								listener="#{registrationBackingBean.populateAddressByAddType('permenant')}"
								update="cmbPermState" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.permenantaddress']}" /></td>
					<td class="tdContent" colspan="2"><p:inputText size="40"
							id="txtPermAdd1" /></td>
				</tr>

				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent" colspan="2"><p:inputText size="40"
							id="txtPermAdd2" /></td>
				</tr>

				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent" colspan="2"><p:inputText size="40"
							id="txtPermAdd3" /></td>
				</tr>

				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent" colspan="2"><p:inputText size="40"
							id="txtPermAdd4" /></td>
				</tr>
				<tr>
					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.postcode']}" /></td>
					<td class="tdContent"><p:inputText size="40" id="txtPermPostcode" /></td>
					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.state']}" /></td>
					<td class="tdContent"><p:selectOneMenu id="cmbPermState"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.pmState.stateId}">
							<f:selectItems var="state"
								value="#{registrationBackingBean.managedBean.permenantStateLs}"
								itemValue="#{state.stateId}" itemLabel="#{state.stateName}" />
							<p:ajax event="change"
								listener="#{registrationBackingBean.populateDistrictByAddType('permenant')}"
								update="cmbPermDistrict" />
						</p:selectOneMenu></td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.district']}" /></td>
					<td class="tdContent"><p:selectOneMenu id="cmbPermDistrict"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.pmDistrict.districtId}">
							<f:selectItems var="dist"
								value="#{registrationBackingBean.managedBean.permenantDistrictLs}"
								itemValue="#{dist.districtId}" itemLabel="#{dist.districtName}" />
							<p:ajax event="change"
								listener="#{registrationBackingBean.populateCityByAddType('permenant')}"
								update="cmbPermCity" />
						</p:selectOneMenu></td>
					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.towncity']}" /></td>
					<td class="tdContent"><p:selectOneMenu id="cmbPermCity"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.pmCity.cityId}">
							<f:selectItems var="pcity"
								value="#{registrationBackingBean.managedBean.permenantCityLs}"
								itemValue="#{pcity.cityId}" itemLabel="#{pcity.cityName}" />
						</p:selectOneMenu></td>
				</tr>


				<tr>
					<td class="tdTitle"><p:outputLabel
							value="#{lbl['lbl.sm.positionincomp']}" /></td>
					<td class="tdContent"><p:selectOneMenu id="positionId"
							value="#{registrationBackingBean.managedBean.smPersonnel.personnelType}">
							<f:selectItem itemLabel="BOD" itemValue="B" />
							<f:selectItem itemLabel="Management Staff" itemValue="M" />
							<f:selectItem itemLabel="Normal Staff" itemValue="N" />
							<f:selectItem itemLabel="Professional Staff" itemValue="P" />
							<f:selectItem itemLabel="Semi-Professional Staff" itemValue="S" />
							<f:selectItem itemLabel="Clerical Staff" itemValue="C" />
						</p:selectOneMenu></td>
				</tr>

			</table>
		</p:panel>
		<ui:include src="/xhtml/sm/shared/onlinereg/contactInfo.xhtml" />

		<div align="right">
			<p:commandButton value="Submit" id="btnSubmit"
				action="#{registrationBackingBean.submitRegistration}" />
		</div>
	</ui:define>

</ui:composition>
