<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<ui:define name="contentSection">
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.submit']}" id="btnSubmit" update="@([id$=Msg])" onstart="submissionDialog.show();" oncomplete="submissionDialog.hide();"
				action="#{registrationBackingBean.submitRegistration}" />
	</div>

		<p:dialog widgetVar="submissionDialog" modal="true" draggable="false"
			closable="false" resizable="false" showHeader="false">
			<p:graphicImage library="ep/images/" name="ajax-loader.gif" />
		</p:dialog>

		<!-- 	<p:messages id="messages" showDetail="true" autoUpdate="true" />   -->
		<p:panel header="#{lbl['lbl.sm.userinfo']}" toggleable="true" id="pnlUsrInfo">
			<table class="customTbl">
				<tr>
					<td class="tdTitle"><p:outputLabel
							value="#{lbl['lbl.sm.fullname']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td class="tdContent" colspan="3">
						<p:inputText size="40" required="true" label="#{lbl['lbl.sm.fullname']}"
							id="fullName"
							value="#{registrationBackingBean.managedBean.smPersonnel.name}" />
						&#160;
						<p:graphicImage id="fNmti" library="ep/images/design" name="tooltips.png" />
						<p:tooltip id="fNmtt" for="fNmti">
							<p:outputLabel escape="false" value="#{lbl['tt.sm.user.full.name']}"  />
						</p:tooltip>
						<p:message id="fullNameMsg" for="fullName" display="icon" />
					</td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel
							value="#{lbl['lbl.sm.nationality']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td class="tdContent">
						<p:selectOneMenu id="nationalityId" required="true" label="#{lbl['lbl.sm.nationality']}"
							value="#{registrationBackingBean.managedBean.smPersonnel.pmCountry.countryId}">
							<f:selectItem itemValue="" itemLabel="---Select---" />
							<f:selectItems var="counLs"
								value="#{registrationBackingBean.managedBean.countryLs}"
								itemLabel="#{counLs.countryName}"
								itemValue="#{counLs.countryId}" />
						</p:selectOneMenu>
						<p:message id="nationalityIdMsg" for="nationalityId" display="icon" /></td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel
							value="#{lbl['lbl.sm.identificationtype']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td class="tdContent">
					<p:selectOneMenu id="cmbUsrIdenType" required="true" label="#{lbl['lbl.sm.identificationtype']}"
							value="#{registrationBackingBean.managedBean.smPersonnel.identificationTypeId}">
							<f:selectItems value="#{registrationBackingBean.pmIdTypeDropdownValues()}" />
							<p:ajax event="change" update="txtIdNumber"
								listener="#{registrationBackingBean.personnelIdTypeChange}" />
						</p:selectOneMenu>
						<p:message id="cmbUsrIdenTypeMsg" for="cmbUsrIdenType" display="icon" /></td>

					<td class="tdTitle"><p:outputLabel
							value="#{lbl['lbl.sm.identificationno']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td class="tdContent">
						<p:inputText id="txtIdNumber" required="true" label="#{lbl['lbl.sm.identificationno']}"
							value="#{registrationBackingBean.managedBean.smPersonnel.identificationNo}"
							size="40" maxlength="15">
						</p:inputText>
						&#160;
						<p:graphicImage id="uidti" library="ep/images/design" name="tooltips.png" />
						<p:tooltip id="uidtt" for="uidti">
							<p:outputLabel escape="false" value="#{lbl['tt.sm.user.id.no']}"  />
						</p:tooltip>
						<p:message id="txtIdNumberMsg" for="txtIdNumber" display="icon" />
					</td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel
							value="#{lbl['lbl.sm.permenantaddress']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td class="tdContent"><p:inputText size="40"
							required="true" label="#{lbl['lbl.sm.permenantaddress']}"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.address1}"
							id="txtPermAdd1" /> &#160; <p:graphicImage id="addti"
							library="ep/images/design" name="tooltips.png" /> <p:tooltip
							id="addtt" for="addti">
							<p:outputLabel escape="false"
								value="#{lbl['tt.sm.user.address']}" />
						</p:tooltip> <p:message id="txtPermAdd1Msg" for="txtPermAdd1" display="icon" />
					</td>

					<td id="tdTitle"><p:outputLabel
							value="#{lbl['lbl.sm.country']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td id="tdContent"><p:selectOneMenu required="true"
							label="#{lbl['lbl.sm.country']}"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.pmCountry.countryId}"
							id="cmbPermCounrty">
							<f:selectItem itemValue="" itemLabel="---Select---" />
							<f:selectItems var="counLs"
								value="#{registrationBackingBean.managedBean.countryLs}"
								itemLabel="#{counLs.countryName}"
								itemValue="#{counLs.countryId}" />
							<p:ajax event="change"
								listener="#{registrationBackingBean.populateStateByAddType('permenant')}"
								update="cmbPermState" />
						</p:selectOneMenu> <p:message id="cmbPermCounrtyMsg" for="cmbPermCounrty"
							display="icon" /></td>
				</tr>

				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent"><p:inputText size="40" value="#{registrationBackingBean.managedBean.smPermenantAdd.address2}"
							id="txtPermAdd2" /></td>
							
					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.state']}" /></td>
					<td class="tdContent"><p:selectOneMenu id="cmbPermState" required="true" label="#{lbl['lbl.sm.state']}"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.pmState.stateId}">
							<f:selectItem itemLabel="---Select---" itemValue="" />
							<f:selectItems var="state"
								value="#{registrationBackingBean.managedBean.permenantStateLs}"
								itemValue="#{state.stateId}" itemLabel="#{state.stateName}" />
							<p:ajax event="change"
								listener="#{registrationBackingBean.populateDistrictByAddType('permenant')}"
								update="cmbPermDistrict cmbPermCity" />
						</p:selectOneMenu>
						<p:message id="cmbPermStateMsg" for="cmbPermState" display="icon" /></td>
				</tr>

				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent"><p:inputText size="40" value="#{registrationBackingBean.managedBean.smPermenantAdd.address3}"
							id="txtPermAdd3" /></td>
							
					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.district']}" /></td>
					<td class="tdContent"><p:selectOneMenu id="cmbPermDistrict" required="true" label="#{lbl['lbl.sm.district']}"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.pmDistrict.districtId}">
							<f:selectItem itemLabel="---Select---" itemValue="" />
							<f:selectItems var="dist"
								value="#{registrationBackingBean.managedBean.permenantDistrictLs}"
								itemValue="#{dist.districtId}" itemLabel="#{dist.districtName}" />
							<p:ajax event="change"
								listener="#{registrationBackingBean.populateCityByAddType('permenant')}"
								update="cmbPermCity" />
						</p:selectOneMenu>
						<p:message id="cmbPermDistrictMsg" for="cmbPermDistrict" display="icon" /></td>
				</tr>

				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent"><p:inputText size="40" value="#{registrationBackingBean.managedBean.smPermenantAdd.address4}"
							id="txtPermAdd4" /></td>
					<td class="tdTitle"><p:outputLabel
							value="* #{lbl['lbl.sm.towncity']}" /></td>
					<td class="tdContent"><p:selectOneMenu id="cmbPermCity" required="true" label="#{lbl['lbl.sm.towncity']}"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.pmCity.cityId}">
							<f:selectItem itemLabel="---Select---" itemValue="" />
							<f:selectItems var="pcity"
								value="#{registrationBackingBean.managedBean.permenantCityLs}"
								itemValue="#{pcity.cityId}" itemLabel="#{pcity.cityName}" />
						</p:selectOneMenu>
						<p:message id="cmbPermCityMsg" for="cmbPermCity" display="icon" />
						</td>
				</tr>
				<tr>
					<td class="tdTitle"><p:outputLabel
							value="#{lbl['lbl.sm.postcode']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td class="tdContent"><p:inputText size="40" required="true" label="#{lbl['lbl.sm.postcode']}"
					value="#{registrationBackingBean.managedBean.smPermenantAdd.postcode}" id="txtPermPostcode" /></td>
				</tr>


				<tr>
					<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.designation']}" /></td>
					<td class="tdContent"><p:inputText value="#{registrationBackingBean.managedBean.smPersonnel.designation}"/></td>
				</tr>

			</table>
		</p:panel>
		
<!-- 		<ui:include src="/xhtml/sm/shared/onlinereg/identityUpload.xhtml" /> -->
		
		<ui:include src="/xhtml/sm/shared/onlinereg/contactInfo.xhtml" />

		<div align="left">
			<p:commandButton value="#{lbl['lbl.sm.prev']}"
				action="#{registrationBackingBean.returnToCompanyInfo}" immediate="false" />
		</div>
	</ui:define>

</ui:composition>
