<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection">
		<script type="application/javascript">
			$(document).ready(function(e){
				  $("input[id$=txtPermAdd1]").keydown(function(e){
					if(e.which==9 || e.keycode==9){
						$("input[id$=txtPermAdd2]").focus();
						e.preventDefault();
					}
				  });
				  $("input[id$=txtPermAdd2]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=txtPermAdd3]").focus();
						e.preventDefault();
					} 
				  });
				  $("input[id$=txtPermAdd3]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=txtPermAdd4]").focus();
						e.preventDefault();
					} 
				  });
				  $("input[id$=txtPermAdd4]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=cmbPermCounrty_focus]").focus();
						e.preventDefault();
					} 
				  });
				  $("input[id$=cmbPermCounrty_focus]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=cmbPermState_focus]").focus();
						e.preventDefault();
					} 
				  });
				  $("input[id$=cmbPermState_focus]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=cmbPermDistrict_focus]").focus();
						e.preventDefault();
					} 
				  });
				  $("input[id$=cmbPermDistrict_focus]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=cmbPermCity_focus]").focus();
						e.preventDefault();
					} 
				  });
				  $("input[id$=cmbPermCity_focus]").keydown(function(e){
					 if(e.which==9 || e.keycode==9){
						$("input[id$=txtPermPostcodeMy]").focus();
						e.preventDefault();
					} 
				  });
				  
				  $("input[id$=usrEmail]").bind("cut copy paste",function(e) {
			          e.preventDefault();
			      });
				  
				  $("input[id$=conEmail]").bind("cut copy paste",function(e) {
			          e.preventDefault();
			      });
			});
	</script>
	</ui:define>
	
	<ui:define name="contentSection">
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.submit']}" id="btnSubmit" update="firstUserTncDialog" onstart="submissionDialog.show();" oncomplete="submissionDialog.hide();"
				action="#{registrationBackingBean.onCallFirstUserTncDialog}">
				<f:param name="disableValidation" value="true" />
		</p:commandButton>
	</div>

		<p:dialog widgetVar="submissionDialog" modal="true" draggable="false"
			closable="false" resizable="false" showHeader="false">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:dialog>
		
		<p:dialog id="firstUserTncDialog" header="#{lbl['lbl.sm.suppadmin.appointment.header']}"
			widgetVar="firstUserTncDialog" modal="true" width="600px" height="500px">
			<p:panel id="firstUserTncPanelId" header="#{lbl['lbl.sm.term.and.condition.header']}">
				
				<p:scrollPanel style="height:350px;border:0;" mode="native">
					<h:outputText escape="false" value="#{lbl['lbl.sm.suppadmin.appointment.msg']}" style="white-space : normal !important"/>
				</p:scrollPanel>
	
				<table>
					<tr>
						<td width="10px" style="padding: 4px 2px 0px 4px;"><p:selectBooleanCheckbox
								value="#{registrationBackingBean.managedBean.aggreeDeclareAdmin}">
								<p:ajax event="change" update=":form:basCmdBtn" />
							</p:selectBooleanCheckbox></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.termsConditions']}" /></td>
					</tr>
				</table>
				
				<div align="right">
					<p:commandButton value="#{lbl['lbl.sm.proceed']}" id="basCmdBtn"
						action="#{registrationBackingBean.submitRegistration}" 
						update="@form" onclick="firstUserTncDialog.hide();"
						disabled="#{!registrationBackingBean.managedBean.aggreeDeclareAdmin}" 
						onstart="submissionDialog.show()" oncomplete="submissionDialog.hide()" />
					<p:commandButton value="#{lbl['lbl.btn.cancel']}" onclick="firstUserTncDialog.hide();" />
				</div>
			</p:panel>
		</p:dialog>

		<!-- 	<p:messages id="messages" showDetail="true" autoUpdate="true" />   -->
		<p:panel header="#{lbl['lbl.sm.userinfo']}" toggleable="true" id="pnlUsrInfo">
			<table class="customTbl">
				<tr>
					<td colspan="4"><p:selectBooleanCheckbox
							value="#{registrationBackingBean.managedBean.sameAsOwner}">
							<p:ajax event="change" update="@([id$=pnlUsrInfo])"
								partialSubmit="true"
								process="@this" />
						</p:selectBooleanCheckbox><h:outputText value="#{lbl['lbl.sm.userreg.admin.same.as.owner']}"></h:outputText></td>
				</tr>
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.fullname']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
						<p:inputText size="40" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.fullname']}"
							id="fullName" maxlength="80" rendered="#{!registrationBackingBean.managedBean.sameAsOwner}"
							value="#{registrationBackingBean.managedBean.smPersonnel.name}" />
						<p:inputText readonly="true" disabled="true" value="" size="35" 
							rendered="#{registrationBackingBean.managedBean.sameAsOwner}"/>
						&#160;
						<p:graphicImage id="fNmti" value="/css/images/design/tooltips.png" />
						<p:tooltip id="fNmtt" for="fNmti">
							<p:outputLabel escape="false" value="#{lbl['tt.sm.user.full.name']}"  />
						</p:tooltip>
						<p:message id="fullNameMsg" for="fullName" display="icon" />
					</td>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.salutation']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
						<p:selectOneMenu id="salutationId" required="#{!empty param['disableValidation']}"  
							label="#{lbl['lbl.pm.profiles.userdetails.salutation']}" value="#{registrationBackingBean.managedBean.smPersonnel.title.salutationId}" 
							style="width: 150px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems value="#{registrationBackingBean.managedBean.salutationItems}" />
						</p:selectOneMenu>
						<p:message id="salutationIdMsg" for="salutationId" display="icon" />
					</td>
				</tr>

				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.nationality']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
						<p:selectOneMenu id="nationalityId" required="#{!empty param['disableValidation']}"  
							label="#{lbl['lbl.sm.nationality']}" value="#{registrationBackingBean.managedBean.smPersonnel.pmCountry.countryId}" 
							rendered="#{!registrationBackingBean.managedBean.sameAsOwner}" style="width:80%">
							<f:selectItem itemValue="" itemLabel="#{lbl['lbl.txt.select']}" />
							<f:selectItems var="counLs"
								value="#{registrationBackingBean.managedBean.countryLs}"
								itemLabel="#{counLs.countryName}"
								itemValue="#{counLs.countryId}" />
							<p:ajax event="change" listener="#{registrationBackingBean.personnelNationalityOnChange}" 
							update="cmbUsrIdenType,txtIdNumber,pnlFirstUserIdenType,pnlPersonnelAddress" />
						</p:selectOneMenu>
						<p:selectOneMenu disabled="true" value="" rendered="#{registrationBackingBean.managedBean.sameAsOwner}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						</p:selectOneMenu> 
						<p:message id="nationalityIdMsg" for="nationalityId" display="icon" /></td>
				
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.userprofile.dob']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
						<p:calendar id="dobCalId"
							navigator="true" required="#{!empty param['disableValidation']}" 
							label="#{lbl['lbl.sm.userprofile.dob']}" value="#{registrationBackingBean.managedBean.smPersonnel.birthDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
							readonlyInput="true" size="30" showOn="button" yearRange="-99"  maxdate="#{CommonConstants.CURRENT_DATE}">
						</p:calendar>
					</td>
				</tr>
				
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.person.bumi']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					
					<td class="tdContent">
						<p:selectOneRadio id="bumiId" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.person.bumi']}"
							value="#{registrationBackingBean.managedBean.userBumiFlg}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
						</p:selectOneRadio>
						<p:message id="bumiIdMsg" for="bumiId" showSummary="true" showDetail="false" display="icon" />
					</td>
					
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.person.religion']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					
					<td class="tdContent">
						<p:selectOneRadio id="religionId" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.person.religion']}"
							value="#{registrationBackingBean.managedBean.userMuslimFlg}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.person.religion.muslim']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.person.religion.non.muslim']}" itemValue="0" />
						</p:selectOneRadio>
						<p:message id="religionIdMsg" for="religionId" showSummary="true" showDetail="false" display="icon" />
					</td>
				</tr>
				

				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.identificationtype']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
						<p:selectOneMenu id="cmbUsrIdenType" required="#{!empty param['disableValidation']}" rendered="#{!registrationBackingBean.managedBean.sameAsOwner}"
								label="#{lbl['lbl.sm.identificationtype']}" value="#{registrationBackingBean.managedBean.smPersonnel.identificationTypeId}" 
								disabled="true">
								<f:selectItems value="#{registrationBackingBean.pmIdTypeDropdownValues()}" />
								<p:ajax event="change" update="txtIdNumber,pnlFirstUserIdenType"
									listener="#{registrationBackingBean.personnelIdTypeChange}" />
						</p:selectOneMenu>
						<p:message id="cmbUsrIdenTypeMsg" for="cmbUsrIdenType" display="icon" />
						<p:selectOneMenu disabled="true" value="" rendered="#{registrationBackingBean.managedBean.sameAsOwner}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						</p:selectOneMenu>
					</td>

					<td class="tdTitle">
						<p:outputPanel id="pnlFirstUserIdenType">
						<c:choose>
							<c:when test="#{registrationBackingBean.managedBean.smPersonnel.identificationType.parameterCode == SupplierManagementConst.NEW_IC}">
								<p:outputLabel value="#{lbl['lbl.sm.individual.newicno']}" />
							</c:when>
							<c:otherwise>
								<p:outputLabel value="#{lbl['lbl.sm.identificationno']}" />
							</c:otherwise>
						</c:choose>
						</p:outputPanel>
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
						<c:choose>
						<c:when test="#{registrationBackingBean.managedBean.smPersonnel.identificationType.parameterCode == SupplierManagementConst.NEW_IC}">
							<p:inputText id="txtIdNumber" required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.sm.identificationno']}" rendered="#{!registrationBackingBean.managedBean.sameAsOwner}"
								value="#{registrationBackingBean.managedBean.smPersonnel.identificationNo}"
								size="30" maxlength="12" validatorMessage="#{lbl['lbl.sm.individual.newicno']} - #{lbl['lbl.sm.invalidIcNo']}">
								<f:validateRegex pattern="^-?\d*(\.\d+)?$" disabled="#{empty param['disableValidation']}"/>
							</p:inputText>
						</c:when>
						
						<c:otherwise>
							<p:inputText id="txtIdNumber" required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.sm.identificationno']}" rendered="#{!registrationBackingBean.managedBean.sameAsOwner}"
								value="#{registrationBackingBean.managedBean.smPersonnel.identificationNo}"
								size="30" maxlength="15">
								<p:ajax process="@this" partialSubmit="true" update="@this" listener="#{registrationBackingBean.trimPersonnelPassportValue}"/>
							</p:inputText>
						</c:otherwise>
					</c:choose>
						<p:inputText readonly="true" disabled="true" value="" size="35" rendered="#{registrationBackingBean.managedBean.sameAsOwner}"/>
						&#160;
						<p:graphicImage id="uidti" value="/css/images/design/tooltips.png" />
						<p:tooltip id="uidtt" for="uidti">
							<p:outputLabel escape="false" value="#{lbl['tt.sm.registration.identification.no']}"  />
						</p:tooltip>
						<p:message id="txtIdNumberMsg" for="txtIdNumber" display="icon" />
						
						
					</td>
				</tr>

				<tr>
					<td class="tdTitle">
						<p:outputPanel id="pnlPersonnelAddress">
						<c:choose>
							<c:when test="#{registrationBackingBean.managedBean.smPersonnel.identificationType.parameterCode == SupplierManagementConst.NEW_IC}">
								<p:outputLabel value="#{lbl['lbl.sm.ic.address']}" />
							</c:when>
							<c:otherwise>
								<p:outputLabel value="#{lbl['lbl.sm.permenantaddress']}" />
							</c:otherwise>
						</c:choose>
						</p:outputPanel>
						
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent"><p:inputText size="40" maxlength="35"
							required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.permenantaddress']}"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.address1}"
							id="txtPermAdd1" /> &#160; <p:graphicImage id="addti"
							value="/css/images/design/tooltips.png" /> <p:tooltip
							id="addtt" for="addti">
							<p:outputLabel escape="false"
								value="#{lbl['tt.sm.user.address']}" />
						</p:tooltip> <p:message id="txtPermAdd1Msg" for="txtPermAdd1" display="icon" />
					</td>

					<td id="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.country']}" />
						<p:outputLabel value="*" styleClass="mandatory" />	
					</td>
					<td id="tdContent"><p:selectOneMenu required="#{!empty param['disableValidation']}"
							label="#{lbl['lbl.sm.country']}"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.pmCountry.countryId}"
							id="cmbPermCounrty" style="width:80%">
							<f:selectItem itemValue="" itemLabel="#{lbl['lbl.txt.select']}" />
							<f:selectItems var="counLs"
								value="#{registrationBackingBean.managedBean.countryLs}"
								itemLabel="#{counLs.countryName}"
								itemValue="#{counLs.countryId}" />
							<p:ajax event="change"
								listener="#{registrationBackingBean.populateStateByAddType('permenant',false)}"
								update="cmbPermState,cmbPermDistrict,cmbPermCity,txtPermPostcodePanelId" />
						</p:selectOneMenu> <p:message id="cmbPermCounrtyMsg" for="cmbPermCounrty"
							display="icon" /></td>
				</tr>

				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent"><p:inputText size="40" value="#{registrationBackingBean.managedBean.smPermenantAdd.address2}"
							id="txtPermAdd2" maxlength="35" /></td>
							
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.state']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent"><p:selectOneMenu id="cmbPermState" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.state']}"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.pmState.stateId}" style="width:80%">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="state"
								value="#{registrationBackingBean.managedBean.permenantStateLs}"
								itemValue="#{state.stateId}" itemLabel="#{state.stateName}" />
							<p:ajax event="change"
								listener="#{registrationBackingBean.populateDistrictByAddType('permenant',false)}"
								update="cmbPermDistrict,cmbPermCity" />
						</p:selectOneMenu>
						<p:message id="cmbPermStateMsg" for="cmbPermState" display="icon" /></td>
				</tr>

				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent"><p:inputText size="40" value="#{registrationBackingBean.managedBean.smPermenantAdd.address3}"
							id="txtPermAdd3" maxlength="35" /></td>
							
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.district']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent"><p:selectOneMenu id="cmbPermDistrict" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.district']}"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.pmDistrict.districtId}" style="width:80%">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="dist"
								value="#{registrationBackingBean.managedBean.permenantDistrictLs}"
								itemValue="#{dist.districtId}" itemLabel="#{dist.districtName}" />
							<p:ajax event="change"
								listener="#{registrationBackingBean.populateCityByAddType('permenant', false)}"
								update="cmbPermCity" />
						</p:selectOneMenu>
						<p:message id="cmbPermDistrictMsg" for="cmbPermDistrict" display="icon" /></td>
				</tr>

				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent"><p:inputText size="40" value="#{registrationBackingBean.managedBean.smPermenantAdd.address4}"
							id="txtPermAdd4" maxlength="35" /></td>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.sm.towncity']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent"><p:selectOneMenu id="cmbPermCity" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.towncity']}"
							value="#{registrationBackingBean.managedBean.smPermenantAdd.pmCity.cityId}" style="width:80%">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="pcity"
								value="#{registrationBackingBean.managedBean.permenantCityLs}"
								itemValue="#{pcity.cityId}" itemLabel="#{pcity.cityName}" />
						</p:selectOneMenu>
						<p:message id="cmbPermCityMsg" for="cmbPermCity" display="icon" />
						</td>
				</tr>
				<tr>
					<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td class="tdContent">
						<p:outputPanel id="txtPermPostcodePanelId">
							<p:outputPanel
								rendered="#{registrationBackingBean.managedBean.smPermenantAdd.pmCountry.countryId==registrationBackingBean.managedBean.myCountryId}">
								<p:inputText maxlength="5" required="#{!empty param['disableValidation']}"
									label="#{lbl['lbl.sm.postcode']}" id="txtPermPostcodeMy"
									value="#{registrationBackingBean.managedBean.smPermenantAdd.postcode}"
									validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
									size="40">
									<f:validator validatorId="postcodeValidator" />
								</p:inputText>
								<p:message id="txtPermPostcodeMyMsg" for="txtPermPostcodeMy"
									showSummary="true" showDetail="false" display="icon" />
							</p:outputPanel>
							<p:outputPanel
								rendered="#{registrationBackingBean.managedBean.smPermenantAdd.pmCountry.countryId!=registrationBackingBean.managedBean.myCountryId}">
								<p:inputText maxlength="10" required="#{!empty param['disableValidation']}"
									label="#{lbl['lbl.sm.postcode']}" id="txtPermPostcodeForeign"
									value="#{registrationBackingBean.managedBean.smPermenantAdd.postcode}"
									size="35">
								</p:inputText>
								<p:message id="txtPermPostcodeForeignMsg"
									for="txtPermPostcodeForeign" showSummary="true"
									showDetail="false" display="icon" />
							</p:outputPanel>
						</p:outputPanel>
					</td>
				</tr>


				<tr>
					<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.designation']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td class="tdContent"><p:inputText value="#{registrationBackingBean.managedBean.smPersonnel.designation}" required="#{!empty param['disableValidation']}" maxlength="30" label="#{lbl['lbl.sm.designation']}" /></td>
				</tr>
				
							<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.phoneno']}" /></td>
				<td class="tdContent">
					<ac:phone id="txtPhoneNoId" isMobile="false" label="#{lbl['lbl.sm.phoneno']}"
						countryCode="#{registrationBackingBean.managedBean.smPersonnel.phoneCountry}" 
						areaCode="#{registrationBackingBean.managedBean.smPersonnel.phoneArea}" 
						number="#{registrationBackingBean.managedBean.smPersonnel.phoneNo}"  
						validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" />
				</td>


				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.mobilenumber']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<ac:phone id="txtMobileNoId" label="#{lbl['lbl.sm.mobilenumber']}"
						countryCode="#{registrationBackingBean.managedBean.smPersonnel.mobileCountry}" 
						areaCode="#{registrationBackingBean.managedBean.smPersonnel.mobileArea}" 
						number="#{registrationBackingBean.managedBean.smPersonnel.mobileNo}" 
						isMobile="true" required="#{!empty param['disableValidation']}"
						validatorMessage="#{lbl['lbl.sm.mobilenumber']} - #{lbl['lbl.sm.invalidNo']}"
						telcoId="#{registrationBackingBean.managedBean.smPersonnel.mobileTelcoId}" /></td>
			</tr>

			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.email']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
