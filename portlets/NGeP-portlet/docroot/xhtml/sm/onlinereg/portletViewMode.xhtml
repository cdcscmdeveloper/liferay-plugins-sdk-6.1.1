<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<style type="text/css">
.test {
	
}

table.test {
	width: 100%;
}

.test td {
	padding: 5px;
}

#tdContent {
	text-align: left;
}

#tdTitle {
	width: 20%;
	text-align: right;
}
</style>
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/sm/shared/sidemenu/registrationSideMenu.xhtml"></ui:include>
	</ui:define>

	<ui:define name="content">
		<h:outputLabel value="Sign Up New Account"
			style="font-weight:bold;font-size:15px;" />
		<ui:include src="/xhtml/sm/shared/onlinereg/accountInfo.xhtml" />

		<c:choose>
			<c:when
				test="${registrationBackingBean.managedBean.businessType == 'Ind'}">
				<ui:include src="/xhtml/sm/shared/onlinereg/individualregform.xhtml" />
			</c:when>

			<c:otherwise>
				<ui:include src="/xhtml/sm/shared/onlinereg/corporateregform.xhtml" />
			</c:otherwise>
		</c:choose>

		<div align="right">
			<p:commandButton value="Next"
				action="#{registrationBackingBean.proceedToCompanyInfo}" />
		</div>
	</ui:define>
</ui:composition>
