<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
			<p:blockUI block=":form" widgetVar="blockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>	
	
			<p:panel header="#{lbl['lbl.sm.term.and.condition.header']}">
			<p:scrollPanel style="height:300px;border:0;" mode="native">
				<c:choose>
					<c:when
						test="${registrationBackingBean.managedBean.applType == SupplierManagementConst.ACC_MOF}">
						<b>#{lbl['lbl.sm.basic.mof.tnc.header']}</b>
						<br />
						<p><h:outputText escape="false" value="#{lbl['lbl.sm.basic.account.mof.tnc']}" /></p>
					</c:when>

					<c:otherwise>
						<b>#{lbl['lbl.sm.basic.basic.tnc.header']}</b>
						<br />
						<p><h:outputText escape="false" value="#{lbl['lbl.sm.basic.account.basic.tnc']}" /></p>
					</c:otherwise>
				</c:choose>
			</p:scrollPanel>
			</p:panel>
			<br />
			<p:panel id="captchaPanel">
				<table>
					<tr>
						<td width="250px">
							<p:inputText value="#{registrationBackingBean.managedBean.captchaAnswer}" 
								validator="#{registrationBackingBean.validateCaptcha}"
								size="10" />
							<p:graphicImage id="captchaText" value="#{registrationBackingBean.captchaTextImage}" />
							&#160;
							<p:commandLink update="captchaText" >
								<p:graphicImage value="/css/images/design/ico-refresh.png" />
							</p:commandLink>
						</td>
						<td>
							<p:messages id="messages" showDetail="true" autoUpdate="true"
								closable="true" showSummary="false"/>
						</td>
					</tr>
				</table>
			</p:panel>
			<br />
			<p:selectBooleanCheckbox id="chkTcId" value="#{registrationBackingBean.managedBean.agreeTC}" 
				disabled="#{empty registrationBackingBean.managedBean.applType}">
				<p:ajax update="btnProceed" partialSubmit="true" process="@this" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
			</p:selectBooleanCheckbox>
			#{lbl['lbl.sm.have.agreed']} #{lbl['lbl.sm.term.and.condition']}
			
			<div align="right">
			
			</div>
			
			<div class="nav-wrapper" align="justify">
				<p:commandButton id="btnProceed" value="#{lbl['lbl.sm.next']}"  style="float:right;"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				disabled="#{!registrationBackingBean.managedBean.agreeTC}" action="#{registrationBackingBean.proceedToCompanyInfo}"
				update="captchaPanel" />
				
				<p:commandButton value="#{lbl['lbl.sm.prev']}" style="left;"
					action="#{registrationBackingBean.returnToSignUp}">
				</p:commandButton>
			</div>
			<div style="clear: both;"></div>
			
	</ui:define>

</ui:composition>
