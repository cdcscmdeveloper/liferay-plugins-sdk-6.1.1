<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:panel header="#{lbl['lbl.sm.addnlCat.headerLbl']}">
			<div align="left" style="margin: 10px;">
				<p:outputPanel>
					<p>
						<h:outputText value="#{lbl['lbl.sm.addnlCat.ackDesc1']}"
						escape="false" />

						<h:outputText value="#{backingBean.managedBean.smAppl.applNo}"
							style="color: blue; font-weight: bold;" />
						<h:outputText value="#{lbl['lbl.sm.addnlCat.ackDesc2']}"
							escape="false" />

					</p>

				</p:outputPanel>
			</div>
			<div align="center">
				<p:commandButton value="#{lbl['lbl.sm.ok']}"
					action="/xhtml/sm/homeScreen/defaultVirtualCertPage.xhtml" />
			</div>
		</p:panel>
		<div align="center"></div>
	</ui:define>
</ui:composition>
