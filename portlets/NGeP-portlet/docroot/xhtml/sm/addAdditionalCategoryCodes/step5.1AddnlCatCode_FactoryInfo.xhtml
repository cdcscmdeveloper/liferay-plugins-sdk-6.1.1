<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
					src="smAddtnlCatApplnSideMenuItem.xhtml" /></td>
			<td><p:outputPanel
					rendered="#{backingBean.managedBean.supplierUser}">
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(ParameterConst.newSmApplnForApplcatcodes,backingBean.managedBean.currentPageType)}"
							update=":form" icon="ui-icon-save" style="margin-bottom:5px;" />
					</div>
				</p:outputPanel>
				<table style="width: 250px">
					<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
						<tr>
							<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox /></td>
							<td valign="top"><h:outputText
									value=" Section Verified By PO: "
									title="For PO to highlight the verified section " /></td>

						</tr>
					</p:outputPanel>
					<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
						<tr>
							<td width="10px"><p:selectBooleanCheckbox /></td>
							<td valign="top"><h:outputText
									value=" Section Verified By Approver: "
									title="For Approver to highlight the verified section " /></td>
						</tr>
					</p:outputPanel>
				</table> <br /> <h:inputHidden
					value="#{backingBean.managedBean.smAppl.applCategoryType}" /> <ui:include
					src="/xhtml/sm/shared/mofRegistration/factoryOrWorkshopInfoForm.xhtml" />
				<ui:include
					src="/xhtml/sm/shared/mofRegistration/workshopInfoForm.xhtml" /> <ui:include
					src="/xhtml/sm/shared/mofRegistration/dockyardInfoForm.xhtml" /> <ui:include
					src="/xhtml/sm/shared/mofRegistration/storeInfoForm.xhtml" /> <p:outputPanel
					rendered="#{backingBean.managedBean.poUser}">
					<table style="width: 50%">
						<tr>
							<td><p:outputLabel value="PO Remarks" /></td>
							<td><p:inputTextarea autoResize="true" cols="41" /></td>
						</tr>
					</table>
				</p:outputPanel> <p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
					<table style="width: 100%">
						<tr>
							<td><p:outputLabel value="PO Remarks" /></td>
							<td><p:inputTextarea autoResize="true" readonly="true"
									disabled="true" cols="41" /></td>
							<td><p:outputLabel value="Approver Remarks" /></td>
							<td><p:inputTextarea autoResize="true" cols="41" /></td>

						</tr>
					</table>
				</p:outputPanel>
				<div class="nav-wrapper">
					<table style="width: 100%">
						<tr>
							<td><div align="left" style="width: 100%">
									<p:commandButton value="#{lbl['lbl.sm.prev']}"
										actionListener="#{backingBean.setTabValue('5','4')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForApplcatcodes,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
										update=":form" icon="ui-icon-prev" />
								</div></td>
							<td><div align="right" style="width: 100%">
									<p:commandButton value="#{lbl['lbl.sm.next']}"
										actionListener="#{backingBean.setTabValue('5','6')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForApplcatcodes,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
										update=":form" icon="ui-icon-next" iconPos="right" />
								</div></td>
						</tr>
					</table>
				</div></td>
		</tr>
	</table>
</ui:composition>
