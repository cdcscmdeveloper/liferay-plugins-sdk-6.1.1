<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
					src="smAddtnlCatApplnSideMenuItem.xhtml" /></td>
			<td><p:outputPanel id="addCatStep2OnlySuppPan"
					rendered="#{backingBean.managedBean.supplierUser}">
					<div align="right" style="width: 99%" class="button-wrapper">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/deleteApplicationCommonPage.xhtml" />
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}" onclick="this.disabled=true;"
							onstart="blockWidget.show()" oncomplete="this.disabled=false;blockWidget.hide();" 
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(ParameterConst.newSmApplnForApplcatcodes,backingBean.managedBean.currentPageType)}"
							update=":form" style="margin-bottom:5px;" />
					</div>
				</p:outputPanel> <ui:include
					src="/xhtml/sm/shared/mofRegistration/associatedCompanyInfoForm.xhtml" />

				<ui:include
					src="/xhtml/sm/shared/mofRegistration/companyProjectsExperienceInfoForm.xhtml" />
				<div class="nav-wrapper">
					<table style="width: 100%">
						<tr>
							<td><div align="left" style="width: 100%">
									<p:commandButton value="#{lbl['lbl.sm.prev.section']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
										actionListener="#{backingBean.setTabValue('1','0')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForApplcatcodes,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH,SupplierManagementConst.SM_APPL_PAGE_TYPE_BASIC)}"
										update=":form" />
								</div></td>
							<td><div align="right" style="width: 100%">
									<p:commandButton value="#{lbl['lbl.sm.next.section']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
										actionListener="#{backingBean.setTabValue('1','2')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForApplcatcodes,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH,SupplierManagementConst.SM_APPL_PAGE_TYPE_PERSONNEL)}"
										update=":form" />
								</div></td>
						</tr>
					</table>
				</div></td>
		</tr>
	</table>
</ui:composition>
