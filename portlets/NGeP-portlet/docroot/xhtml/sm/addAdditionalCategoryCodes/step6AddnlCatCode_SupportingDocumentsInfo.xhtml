<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
					src="smAddtnlCatApplnSideMenuItem.xhtml" /></td>
			<td><p:outputPanel id="addCatStep6OnlySuppPan"
					rendered="#{backingBean.managedBean.supplierUser}">
					<div align="right" style="width: 99%" class="button-wrapper">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/deleteApplicationCommonPage.xhtml" />
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							onclick="this.disabled=true;"
							onstart="blockWidget.show()" oncomplete="this.disabled=false;blockWidget.hide();"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(ParameterConst.newSmApplnForApplcatcodes,backingBean.managedBean.currentPageType)}"
							update=":form" style="margin-bottom:5px;" />
						
						<ui:include src="/xhtml/sm/shared/mofRegistration/declareButtonWithoutSpki.xhtml" />
						
						<ui:remove>
							<c:choose>
								<c:when
									test="#{backingBean.managedBean.overLappedCategoryExists}">
									<p:commandButton value="#{lbl['lbl.sm.declare']}"
										action="#{backingBean.onDisplaySpkiPopForSubmitAppl}"
										update="spkiOutPanel,@([id$=Msg])" />
									<p:outputPanel id="spkiOutPanel">
										<ac:spkiPopup id="spkiPopup"
											password="#{backingBean.managedBean.spkiBackingBean.password}"
											challengeAns1="#{backingBean.managedBean.spkiBackingBean.challengeAns1}"
											challengeQues1="#{backingBean.managedBean.spkiBackingBean.challengeQues1}"
											postSignAction="#{backingBean.submitSmApplToBpm(spkiBackingBean.pmDigiSign, backingBean.managedBean.smAppl.applType)}" />
									</p:outputPanel>
								</c:when>
								<c:otherwise>
									<p:commandButton value="#{lbl['lbl.sm.declare']}"
										style="margin-bottom:5px;" onstart="blockWidget.show()"
										oncomplete="blockWidget.hide()"
										action="#{backingBean.submitSmApplToBpm(ParameterConst.newSmApplnForApplcatcodes)}" />
								</c:otherwise>
							</c:choose>
						</ui:remove>
					</div>
				</p:outputPanel> <p:outputPanel id="supDocPan">
					<h:inputHidden
						value="#{backingBean.managedBean.smAppl.applCategoryType}" />
					<h:inputHidden
						value="#{backingBean.managedBean.smAppl.supportingDocMode}" />
					<ui:fragment
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq SupplierManagementConst.SUPPORTING_DOC_OFFLINE}">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/offlineSupportingDocsForm.xhtml" />

					</ui:fragment>
					<ui:fragment
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq SupplierManagementConst.SUPPORTING_DOC_ONLINE}">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/onlineSupportingDocsForm.xhtml" />

					</ui:fragment>
					<ui:fragment
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq SupplierManagementConst.SUPPORTING_DOC_ONLINE or backingBean.managedBean.smAppl.supportingDocMode eq SupplierManagementConst.SUPPORTING_DOC_OFFLINE}">
						<c:choose>
							<c:when
								test="#{backingBean.managedBean.smAppl.applCategoryType eq 'S'}">

								<table>
									<tr>
										<td><p:commandButton
												value="#{lbl['lbl.sm.prev.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
												actionListener="#{backingBean.setTabValue('7','6')}"
												action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForApplcatcodes,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
												update=":form" /></td>

									</tr>
								</table>
							</c:when>
							<c:otherwise>
								<table>
									<tr>
										<td><p:commandButton
												value="#{lbl['lbl.sm.prev.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
												actionListener="#{backingBean.setTabValue('5','4')}"
												action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForApplcatcodes,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
												update=":form" /></td>

									</tr>
								</table>
							</c:otherwise>
						</c:choose>
					</ui:fragment>
				</p:outputPanel></td>
		</tr>
	</table>

</ui:composition>
