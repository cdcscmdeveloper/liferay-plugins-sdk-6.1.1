<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
					src="smAddtnlCatApplnSideMenuItem.xhtml" /></td>
			<td><p:outputPanel id="addCatStep6OnlySuppPan"
					rendered="#{backingBean.managedBean.supplierUser}">
					<table style="width: 98%">
						<tr>
							<td class="smLastSubmitLabel"><h:outputText
									value="#{lbl['lbl.sm.lastSubmitDate']}" /></td>
							<td class="smLastSubmitDateVal"><h:outputText
									value="#{backingBean.managedBean.smAppl.draftExpiryDate}">
									<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
								</h:outputText></td>
						</tr>
					</table>
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(ParameterConst.newSmApplnForApplcatcodes,backingBean.managedBean.currentPageType)}"
							update=":form" icon="ui-icon-save" style="margin-bottom:5px;" />
						<p:commandButton value="Submit Application"
							style="margin-bottom:5px;"
							action="#{backingBean.submitSmApplToBpm(ParameterConst.newSmApplnForApplcatcodes)}" />
					</div>
				</p:outputPanel> <p:outputPanel id="supDocPan">
					<h:inputHidden
						value="#{backingBean.managedBean.smAppl.applCategoryType}" />
					<h:inputHidden
						value="#{backingBean.managedBean.smAppl.supportingDocMode}" />
					<ui:fragment
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'F'}">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/offlineSupportingDocsForm.xhtml" />

					</ui:fragment>
					<ui:fragment
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'O'}">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/onlineSupportingDocsForm.xhtml" />

					</ui:fragment>
					<ui:fragment
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'O' or backingBean.managedBean.smAppl.supportingDocMode eq 'F'}">
						<c:choose>
							<c:when
								test="#{backingBean.managedBean.smAppl.applCategoryType eq 'S'}">

								<table>
									<tr>
										<td><p:commandButton value="#{lbl['lbl.sm.prev']}"
												actionListener="#{backingBean.setTabValue('7','6')}"
												action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForApplcatcodes,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
												update=":form" icon="ui-icon-prev" /></td>

									</tr>
								</table>
							</c:when>
							<c:otherwise>
								<table>
									<tr>
										<td><p:commandButton value="#{lbl['lbl.sm.prev']}"
												actionListener="#{backingBean.setTabValue('5','4')}"
												action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForApplcatcodes,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
												update=":form" icon="ui-icon-prev" /></td>

									</tr>
								</table>
							</c:otherwise>
						</c:choose>
					</ui:fragment>
				</p:outputPanel></td>
		</tr>
	</table>

</ui:composition>
