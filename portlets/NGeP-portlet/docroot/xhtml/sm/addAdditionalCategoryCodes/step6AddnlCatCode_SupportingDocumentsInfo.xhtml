<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 25%">

		<tr>
			<td><h:outputText value="Submission Type " /></td>
			<td><p:selectOneRadio id="suppDocs"
					value="#{backingBean.managedBean.smAppl.supportingDocMode}">
					<f:selectItem itemLabel="Offline" itemValue="F" />
					<f:selectItem itemLabel="Online" itemValue="O" />
					<p:ajax update="supDocPan" event="change" />
				</p:selectOneRadio></td>
		</tr>
	</table>
	<p:outputPanel id="supDocPan">
		<ui:fragment
			rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'F'}">
			<ui:include
				src="/xhtml/sm/shared/mofRegistration/offlineSupportingDocsForm.xhtml" />

		</ui:fragment>
		<ui:fragment
			rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'O'}">
			<ui:include
				src="/xhtml/sm/shared/mofRegistration/onlineSupportingDocsForm.xhtml" />

		</ui:fragment>
		<ui:fragment
			rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'O' or backingBean.managedBean.smAppl.supportingDocMode eq 'F'}">
			<c:choose>
				<c:when
					test="#{backingBean.managedBean.smAppl.applCategoryType == 'S'}">

					<table>
						<tr>
							<td><p:commandButton value="#{lbl['lbl.sm.prev']}"
									actionListener="#{backingBean.setTabValue('7','6')}"
									action="#{backingBean.updateSmAppl}" update=":form"
									icon="ui-icon-prev" /></td>
							<td><p:commandButton value="Print List">
									<p:printer target="supDocPan" />
								</p:commandButton></td>
							<td><p:commandButton value="Submit Application"
									action="#{backingBean.submitAddnlCategoryApplToBpm}" /></td>
						</tr>
					</table>
				</c:when>
				<c:otherwise>
					<table>
						<tr>
							<td><p:commandButton value="#{lbl['lbl.sm.prev']}"
									actionListener="#{backingBean.setTabValue('5','4')}"
									action="#{backingBean.updateSmAppl}" update=":form"
									icon="ui-icon-prev" /></td>
							<td><p:commandButton value="Print List">
									<p:printer target="supDocPan" />
								</p:commandButton></td>
							<td><p:commandButton value="Submit Application"
									action="#{backingBean.submitAddnlCategoryApplToBpm}" /></td>
						</tr>
					</table>
				</c:otherwise>
			</c:choose>
		</ui:fragment>
	</p:outputPanel>

</ui:composition>
