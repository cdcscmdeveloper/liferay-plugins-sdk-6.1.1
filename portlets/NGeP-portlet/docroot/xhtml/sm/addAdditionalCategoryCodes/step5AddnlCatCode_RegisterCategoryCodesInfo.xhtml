<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel rendered="#{backingBean.managedBean.supplierUser}">
		<div align="right" style="width: 99%" class="button-wrapper">
			<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
				icon="ui-icon-save" style="margin-bottom:5px;" />
		</div>
	</p:outputPanel>
	<ui:include
		src="/xhtml/sm/shared/mofRegistration/regCatCodesForm.xhtml" />
	<div class="nav-wrapper">
		<table style="width: 100%">
			<tr>
				<td><div align="left" style="width: 100%">
						<p:commandButton value="#{lbl['lbl.sm.prev']}"
							actionListener="#{backingBean.setTabValue('4','3')}"
							action="#{backingBean.updateSmAppl}" update=":form"
							icon="ui-icon-prev" />
					</div></td>
				<td><div align="right" style="width: 100%">
						<p:commandButton value="#{lbl['lbl.sm.next']}"
							actionListener="#{backingBean.setTabValue('4','5')}"
							action="#{backingBean.updateSmAppl}" update=":form"
							icon="ui-icon-next" iconPos="right" />
					</div></td>
			</tr>
		</table>
	</div>

</ui:composition>
