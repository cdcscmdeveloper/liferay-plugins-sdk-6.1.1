<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Response of Accusation Letter" toggleable="true">
		<table  class="customTbl">
			<tr>
				<td class="tdTitle"><h:outputText
						value="* Response Received" /></td>
				<td class="tdContent"><p:calendar showOn="button" /></td>
			</tr>
			<tr>
				<td class="tdTitle"><h:outputText value="* Expected Next Convene" /></td>
				<td class="tdContent"><p:calendar showOn="button" /></td>
			</tr>
			<tr>
				<td class="tdTitle"><h:outputText
						value="* Upload Accusation Letter Response" /></td>
				<td class="tdContent"><p:fileUpload mode="simple" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
