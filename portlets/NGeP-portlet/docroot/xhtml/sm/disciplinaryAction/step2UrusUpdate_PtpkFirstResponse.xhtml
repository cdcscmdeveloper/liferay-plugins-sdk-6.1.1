<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<f:event listener="#{complaintBackingBean.retrieveComplaintInfo}"
			type="preRenderView"></f:event>

		<p:panel
			header="Update Complaint Details - Update PTPK Intial Review Response"
			toggleable="true">
			<ui:include
				src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" />
		</p:panel>

		<p:panel header="Received Initial Review Report From PTPK"
			toggleable="true">
			<table style="width: 100%">
				<tr>
					<td id="tdTitle"><p:outputLabel value="* Actual Meeting Date" /></td>
					<td id="tdContent"><p:calendar showOn="button" value="#{complaintBackingBean.managedBean.smComplReview.actualConveneDate}"/></td>
					<td id="tdTitle"><p:outputLabel
							value="* Meeting Minutes Ref NO." /></td>
					<td id="tdContent"><p:inputText value="#{complaintBackingBean.managedBean.smComplReview.minutesRefNo}" /></td>
				</tr>
				<tr>
					<td id="tdTitle"><p:outputLabel
							value="* Date Round 1 Report Received" /></td>
					<td id="tdContent"><p:calendar showOn="button" /></td>
					<td id="tdTitle"><p:outputLabel value="* Decesion Taken" /></td>
					<td id="tdContent"><p:selectOneMenu>
							<f:selectItem itemLabel="-- Select One--" itemValue="1" />
							<f:selectItem itemLabel="Issue Showcause Letter to Supplier"
								itemValue="1" />
							<f:selectItem itemLabel="Close Case" itemValue="2" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td id="tdTitle"><p:outputLabel
							value="* Date Closed / Issued ShowCause Letter" /></td>
					<td id="tdContent"><p:calendar showOn="button" /></td>
					<td id="tdTitle"><p:outputLabel
							value="* Remarks For Closed Case" /></td>
					<td id="tdContent"><p:inputTextarea /></td>
				</tr>
				<tr>
					<td id="tdTitle"><p:outputLabel
							value="* Upload Decision Signed By PTPK"></p:outputLabel></td>
					<td id="tdContent"><p:fileUpload mode="simple" /></td>
					<td colspan="2"><p:commandLink value="Click Here" /> <h:outputText
							value="To download Show Cause Letter Template" /></td>
				</tr>
			</table>
		</p:panel>

		<ui:include
			src="/xhtml/sm/shared/complaintRegistration/complaintTracking.xhtml" />
		<div align="center">
			<p:commandButton value="Update" action="#{complaintBackingBean.updatePtpkInitialResponse}"/>
		</div>
	</ui:define>
</ui:composition>
