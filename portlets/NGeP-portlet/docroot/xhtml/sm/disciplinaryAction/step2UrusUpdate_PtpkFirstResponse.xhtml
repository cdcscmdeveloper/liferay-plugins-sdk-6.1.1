<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/sm/shared/sidemenu/smMainPageSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<p:panel
			header="Update Complaint Details - Update PTPK Intial Review Response">
			<ui:include
				src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" />
			<p:panel header="Received Initial Review Report From PTPK"
				toggleable="true">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value=" Actual Meeting Date *" /></td>
						<td><p:calendar showOn="button" /></td>
						<td><p:outputLabel value="Meeting Minutes Ref NO.*" /></td>
						<td><p:inputText /></td>
					</tr>
					<tr>
						<td><p:outputLabel value=" Date Round 1 Report Received *" /></td>
						<td><p:calendar showOn="button" /></td>
						<td><p:outputLabel value="Decesion Taken *" /></td>
						<td><p:selectOneMenu>
								<f:selectItem itemLabel="-- Select One--" itemValue="1" />
								<f:selectItem itemLabel="Issue Showcause Letter to Supplier"
									itemValue="1" />
								<f:selectItem itemLabel="Close Case" itemValue="1" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel
								value=" Date Closed / Issued ShowCause Letter *" /></td>
						<td><p:calendar showOn="button" /></td>
						<td><p:outputLabel value="Remarks For Closed Case *" /></td>
						<td><p:inputTextarea /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="Upload Decision Signed By PTPK*"></p:outputLabel></td>
						<td><p:fileUpload mode="simple" /></td>
						<td><p:commandLink value="Click Here" /></td>
						<td><p:outputLabel
								value="To download Show Cause Letter Template"></p:outputLabel>
						</td>
					</tr>
				</table>
			</p:panel>
			<ui:include
				src="/xhtml/sm/shared/complaintRegistration/complaintTracking.xhtml" />
			<div align="center">
				<p:commandButton value="Update" />
				<p:commandButton value="Cancel"
					action="/xhtml/sm/homeScreen/defaultVirtualCertPage.xhtml" />
			</div>
		</p:panel>
	</ui:define>
</ui:composition>
