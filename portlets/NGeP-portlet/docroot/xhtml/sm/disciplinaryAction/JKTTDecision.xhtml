<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.submit']}"
			action="#{complaintBackingBean.updateComplaint}" />
	</div>
	<!-- 	<p:panel header="Complaint Details"> -->
	<!-- 		<ui:include -->
	<!-- 			src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" /> -->
	<!-- 	</p:panel> -->
	<ac:smPanel id="p5">
		<ui:include
			src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" />
	</ac:smPanel>

	<p:panel header="JKTT Decision" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* Actual Meeting Date" /></td>
				<td class="tdContent"><p:calendar showOn="button"
						value="#{complaintBackingBean.managedBean.smComplReview.actualConveneDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>
				<td class="tdTitle"><p:outputLabel
						value="* Meeting Minutes Ref No." /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplReview.minutesRefNo}" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* Report Received" /></td>
				<td class="tdContent"><p:calendar showOn="button"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* Decision" /></td>
				<td class="tdContent"><p:selectOneMenu id="decisionId"
						value="#{complaintBackingBean.managedBean.smComplReview.decisionTaken}">
						<f:selectItem itemLabel="-- Select --" itemValue="" />
						<f:selectItem itemLabel="Suspend" itemValue="S" />
						<f:selectItem itemLabel="Terminate Account" itemValue="T" />
						<f:selectItem itemLabel="Close Case" itemValue="C" />
						<p:ajax event="change" update="@form" />
					</p:selectOneMenu></td>
			</tr>
		</table>
			
		<p:outputPanel id="pnlSuspendDT" rendered="#{complaintBackingBean.managedBean.smComplReview.decisionTaken == 'S'}">
			<table class="customTbl">
				<tr>
					<td class="tdTitle"><p:outputLabel value="* Start Date" /></td>
					<td class="tdContent"><p:calendar showOn="button"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>

					<td class="tdTitle"><p:outputLabel value="* End Date" /></td>
					<td class="tdContent"><p:calendar showOn="button"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>
				</tr>
			</table>
		</p:outputPanel>
		<table class="customTbl">
			<tr>
				<td class="tdTitle" valign="top"><p:outputLabel
						value="* Remarks" /></td>
				<td class="tdContent" colspan="3"><p:inputTextarea
						value="#{complaintBackingBean.managedBean.smComplReview.decisionRemark}"
						rows="8" cols="100" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* Report Upload"></p:outputLabel></td>
				<td class="tdContent"><p:fileUpload mode="simple" /></td>
				
				<td class="tdTitle">&#160;</td>
				<td class="tdContent">&#160;</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
