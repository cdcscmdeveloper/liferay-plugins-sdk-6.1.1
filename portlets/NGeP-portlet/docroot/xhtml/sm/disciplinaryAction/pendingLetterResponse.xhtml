<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:panel header="Search" toggleable="true" id="pnlSearch">
			<div align="center">
				<table style="width: 80%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.complaint.search.by']}" /></td>
						<td><p:selectOneMenu>
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.complaint.show.cause']}" itemValue="S" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.complaint.accusation']}" itemValue="A" />
							</p:selectOneMenu></td>

						<td><p:outputLabel value="#{lbl['lbl.sm.complaint.ref.no']}" /></td>
						<td><p:inputText /></td>

						<td><p:outputLabel value="#{lbl['lbl.sm.status']}" /></td>
						<td><p:selectOneMenu>
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.status.pending']}" itemValue="P" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.status.expired']}" itemValue="E" />
							</p:selectOneMenu></td>
						<td><p:commandButton value="#{lbl['lbl.sm.button.search']}" /></td>
					</tr>
				</table>
			</div>
		</p:panel>

		<p:panel  toggleable="true" id="pnlCompList">
			<p:dataTable var="pendingRes" id="complaintDt">
				<p:column headerText="#{lbl['lbl.sm.complaint.no']}">
					#{pendingRes.complaintNo}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.complaint.date']}">
					#{pendingRes.createdDate}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.complaint.date.issuance']}">
					#{pendingRes.smSupplier.companyName}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.complaint.ref.no']}">
					#{pendingRes.smSupplier.regNo}
				</p:column>
			</p:dataTable>
		</p:panel>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.back']}" action="/xhtml/sm/disciplinaryAction/complaintView.xhtml"></p:commandButton>
		</div>
	</ui:define>
</ui:composition>
