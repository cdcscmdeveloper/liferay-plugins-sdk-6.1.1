<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Update Complaint Details - Update JKTT FINAL DECISION">
		<ui:include
			src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" />
		<p:panel header=" Received Final Decision Report From JKTT"
			toggleable="true">
			<table style="width: 100%">
				<tr>
					<td width="200px;"><h:outputText
							value=" Actual Meeting Date *" /></td>
					<td width="200px;"><p:calendar showOn="button" /></td>
					<td width="200px;"><p:outputLabel
							value="Meeting Minutes Ref NO.*" /></td>
					<td width="200px;"><p:inputText /></td>
				</tr>
				<tr>
					<td width="200px;"><h:outputText
							value=" Date Final Report Received *" /></td>
					<td width="200px;"><p:calendar showOn="button" /></td>
					<td width="200px;"><p:outputLabel value="Decesion Taken *" /></td>
					<td width="200px;"><p:selectOneMenu>
							<f:selectItem itemLabel="-- Select One--" itemValue="1" />
							<f:selectItem itemLabel="Suspend" itemValue="1" />
							<f:selectItem itemLabel="Terminate Account" itemValue="1" />
							<f:selectItem itemLabel="Close Case" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td width="200px;"><h:outputText
							value="Upload JKTT Final Decision*" /></td>
					<td width="200px;"><p:fileUpload mode="simple" /></td>
					<td width="200px;"><p:outputLabel
							value="Remarks *"
							title="Remarks For Closed Case/Disciplinary Action taken " /></td>
					<td width="200px;"><p:inputTextarea /></td>
				</tr>
			</table>
		</p:panel>
		<ui:include
			src="/xhtml/sm/shared/complaintRegistration/complaintTracking.xhtml" />
		<div align="center">
			<p:commandButton value="Update" />
			<p:commandButton value="Cancel"
				action="/xhtml/sm/homeScreen/defaultVirtualCertPage.xhtml" />
		</div>
	</p:panel>
</ui:composition>
