<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel
		header="Update Complaint Details - Update PTPK Round2 Review Response">
		<ui:include
			src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" />
		<p:panel header=" Received Round2 Review Report From PTPK"
			toggleable="true">
			<table style="width: 100%">
				<tr>
					<td width="200px;"><h:outputText
							value=" Actual Meeting Date *" /></td>
					<td width="200px;"><p:calendar showOn="button" /></td>
					<td width="200px;"><p:outputLabel
							value="Meeting Minutes Ref NO.*" /></td>
					<td width="200px;"><p:inputText /></td>
				</tr>
				<tr>
					<td width="200px;"><h:outputText
							value=" Date Round 2 Report Received *" /></td>
					<td width="200px;"><p:calendar showOn="button" /></td>
					<td width="200px;"><p:outputLabel value="Decesion Taken *" /></td>
					<td width="200px;"><p:selectOneMenu>
							<f:selectItem itemLabel="-- Select One--" itemValue="1" />
							<f:selectItem itemLabel="Issue Acquisition Letter to Supplier"
								itemValue="1" />
							<f:selectItem itemLabel="Close Case" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td width="200px;"><h:outputText
							value=" Date Closed / Issued Acquisition Letter *" /></td>
					<td width="200px;"><p:calendar showOn="button" /></td>
					<td width="200px;"><p:outputLabel
							value="Remarks For Closed Case *" /></td>
					<td width="200px;"><p:inputTextarea /></td>
				</tr>
				<tr>
					<td width="200px;"><h:outputText
							value="Upload Decision Signed By PTPK*" /></td>
					<td width="200px;"><p:fileUpload mode="simple" /></td>
					<td colspan="2" width="400px;" style="padding-left: 5px;"><p:commandLink
							value="Click Here" /> <h:outputText
							value="To download Acquisition Letter Template" /></td>
				</tr>
			</table>
		</p:panel>
		<ui:include
			src="/xhtml/sm/shared/complaintRegistration/complaintTracking.xhtml" />
		<div align="center">
			<p:commandButton value="Update" />
			<p:commandButton value="Cancel"
				action="/xhtml/sm/homeScreen/defaultVirtualCertPage.xhtml" />
		</div>
	</p:panel>
</ui:composition>
