<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<f:event listener="#{complaintBackingBean.retrieveComplaintInfo}"
			type="preRenderView"></f:event>
		<p:panel
			header="Complaint Details"
			toggleable="true">
			<ui:include
				src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" />
		</p:panel>

		<p:panel header=" Send To PTPK For Review -1 " toggleable="true">
			<table style="width: 100%">
				<tr>
					<td id="tdTitle"><p:outputLabel value="Report Sent to PTPK *" /></td>
					<td id="tdContent"><p:calendar showOn="button" /></td>
					<td id="tdTitle"><p:outputLabel value="Expected Conven Date *" /></td>
					<td id="tdContent"><p:calendar showOn="button"
							value="#{complaintBackingBean.managedBean.smComplReview.conveneDate}" /></td>
				</tr>
				<tr>
					<td id="tdTitle"><p:outputLabel
							value="Initial Invesitgation Report*"></p:outputLabel></td>
					<td id="tdContent"><p:fileUpload mode="simple" /></td>
					<td colspan="2"><p:commandLink value="Click Here" /> <h:outputText
							value="To download investigation report template" /></td>
				</tr>
				<!-- 
				<tr>
					<td id="tdTitle"><p:outputLabel value="Supplier MOF NO. *"></p:outputLabel></td>
					<td id="tdContent"><p:inputText /></td>
				</tr> -->

			</table>
		</p:panel>

		<div align="center">
			<p:commandButton value="Update"
				action="#{complaintBackingBean.sendForPtpkInitialReview}" />

		</div>
	</ui:define>
</ui:composition>
