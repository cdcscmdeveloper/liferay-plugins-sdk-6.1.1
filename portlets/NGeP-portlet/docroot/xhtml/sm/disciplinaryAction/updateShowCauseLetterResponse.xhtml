<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.complaint.show.cause.letter.response']}" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.complaint.response.received']}" /></td>
				<td class="tdContent">
					<p:calendar showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" 
					value="#{complaintBackingBean.managedBean.smComplReview.smComplaintResponse.supplierResponseDate}" />
				</td>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.complaint.upload.response']}" /></td>
				<td class="tdContent"><p:fileUpload mode="simple" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
