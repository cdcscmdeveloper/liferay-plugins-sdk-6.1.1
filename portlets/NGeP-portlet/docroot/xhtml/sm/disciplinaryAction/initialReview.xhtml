<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.submit']}"
			action="#{complaintBackingBean.updateComplaint}"></p:commandButton>
	</div>
	
	<ui:include
		src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
	<ui:include
		src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />

	<p:panel header="#{lbl['lbl.sm.complaint.urus.setia.decision']}" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.decision']}" /></td>
				<td class="tdContent"><p:selectOneMenu>
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.decision.valid']}" itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.decision.invalid']}" itemValue="0" />
					</p:selectOneMenu></td>
				<td class="tdTitle"></td>
				<td class="tdContent"></td>
			</tr>
		</table>
	</p:panel>



</ui:composition>
