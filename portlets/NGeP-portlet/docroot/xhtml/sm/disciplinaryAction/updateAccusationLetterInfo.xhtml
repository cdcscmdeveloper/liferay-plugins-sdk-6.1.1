<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<div align="right">
		<p:commandButton value="Accusation Letter" onclick="dlg2.show();"></p:commandButton>
		<p:commandButton value="Update" />
		<p:commandButton value="Submit" action="#{complaintBackingBean.updateComplaint}" />
	</div>
		<ac:smPanel id="p4">
		<ui:include
			src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" />
	</ac:smPanel>
	

	<p:panel header="Accusation Letter" toggleable="true">
		<table  class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="* Date of Issuance" /></td>
				<td class="tdContent"><p:calendar showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="* Ref No" /></td>
				<td class="tdContent"><p:inputText /></td>
			</tr>

			<tr>
				<td class="tdTitle"><h:outputText
						value="* Date of Supplier Received" /></td>
				<td class="tdContent"><p:calendar showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
