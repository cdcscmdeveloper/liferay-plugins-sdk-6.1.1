<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
		<ui:include
			src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" />
		<ui:include
			src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			
		<ui:include
			src="/xhtml/sm/shared/complaintRegistration/letterIssuanceInfo.xhtml" />



	<ui:remove>
	<p:panel header="#{lbl['lbl.sm.complaint.accusation.letter']}" toggleable="true">
		<table class="customTbl">

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.complaint.date.issuance']}" /></td>
				<td class="tdContent"><p:calendar showOn="button"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.complaint.ref.no']}" /></td>
				<td class="tdContent"><p:inputText /></td>
			</tr>

			<tr>
				<td class="tdTitle"><h:outputText
						value="* #{lbl['lbl.sm.complaint.accusation.letter.upload']}" /></td>
				<td class="tdContent"><p:fileUpload mode="simple" /></td>
			</tr>
			
			<tr>
				<td class="tdTitle"><h:outputText
						value="* #{lbl['lbl.sm.complaint.date.supplier.received']}" /></td>
				<td class="tdContent"><p:calendar showOn="button"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>
			</tr>
		</table>
	</p:panel>
	</ui:remove>

</ui:composition>
