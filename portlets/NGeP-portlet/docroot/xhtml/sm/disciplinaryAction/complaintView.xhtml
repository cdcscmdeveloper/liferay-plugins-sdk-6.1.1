<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<f:event listener="#{complaintBackingBean.retrieveAllActiveComplaint}"
			type="preRenderView" />
		<div align="right">
			<p:commandLink value="Pending Show Cause/ Accusation Response" style="color:blue;" action="#{complaintBackingBean.pendingResponseLetterView}"></p:commandLink>
		</div>
		<p:panel header="Search" toggleable="true" id="pnlSearch">
			<div align="center">
				<table style="width: 80%;">
					<tr>
						<td><p:outputLabel value="Search by" /></td>
						<td><p:selectOneMenu>
								<f:selectItem itemLabel="---Select---" itemValue="" />
								<f:selectItem itemLabel="EP-No" itemValue="E" />
								<f:selectItem itemLabel="Company Name" itemValue="CA" />
								<f:selectItem itemLabel="Complaint No." itemValue="CO" />
								<f:selectItem itemLabel="MOF No." itemValue="M" />
								<f:selectItem itemLabel="Registration No." itemValue="R" />
							</p:selectOneMenu></td>
						<td><p:outputLabel value="Keyword" /></td>
						<td><p:inputText /></td>

						<td><p:outputLabel value="Status" /></td>
						<td><p:selectOneMenu>
								<f:selectItem itemLabel="---Select---" itemValue="" />
								<f:selectItem itemLabel="Open" itemValue="O" />
								<f:selectItem itemLabel="In Progress" itemValue="P" />
								<f:selectItem itemLabel="Closed" itemValue="C" />
							</p:selectOneMenu></td>
						<td><p:commandButton value="Search" /></td>
					</tr>
				</table>
			</div>
		</p:panel>
		<p:remoteCommand name="viewComplaint"
			action="#{complaintBackingBean.onComplaintRowSelect}" />
		<p:panel header="Complaint" toggleable="true" id="pnlCompList">
			<p:dataTable value="#{complaintBackingBean.managedBean.smComplLs}"
				var="compl" id="complaintDt"
				selection="#{complaintBackingBean.managedBean.selectedComplaint}"
				rowKey="#{compl.complaintId}" selectionMode="single">
				<ac:paginator for="complaintDt" />

				<p:ajax event="rowSelect" oncomplete="viewComplaint();" />
				<p:column headerText="Complaint No">
					#{compl.complaintNo}
				</p:column>

				<p:column headerText="Complaint Date">
					#{compl.createdDate}
				</p:column>

				<!-- 				<p:column headerText="Complaint Type"> -->
				<!-- 					#{compl.complaintCategory} -->
				<!-- 				</p:column> -->

				<!-- 				<p:column headerText="MOF No"> -->
				<!-- 					#{compl.supplierMofNo} -->
				<!-- 				</p:column> -->
				<p:column headerText="Supplier Name">
					#{compl.smSupplier.companyName}
				</p:column>

				<p:column headerText="Registration No.">
					#{compl.smSupplier.regNo}
				</p:column>

				<p:column headerText="Status">
				</p:column>

				<p:column selectionMode="multiple" style="width:2%" />
			</p:dataTable>
		</p:panel>

		<div align="right">
			<p:commandButton value="Generate Excel"></p:commandButton>
		</div>
	</ui:define>
</ui:composition>
