<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:panel header="#{lbl['lbl.sm.complaint.search']}" toggleable="true" id="pnlSearch">
			<div align="center">
				<table style="width: 80%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.complaint.search.by']}" /></td>
						<td><p:selectOneMenu value="#{complaintBackingBean.managedBean.complaintSearchBean.searchBy}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.complaint.ep.no']}" itemValue="E" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.companyname']}" itemValue="S" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.complaint.no']}" itemValue="C" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.mofno']}" itemValue="M" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.regno']}" itemValue="R" />
							</p:selectOneMenu></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.complaint.keyword']}" /></td>
						<td><p:inputText value="#{complaintBackingBean.managedBean.complaintSearchBean.keyword}" /></td>

						<td><p:outputLabel value="#{lbl['lbl.sm.status']}" /></td>
						<td><p:selectOneMenu value="#{complaintBackingBean.managedBean.complaintSearchBean.status}">
								<f:selectItems value="#{complaintBackingBean.getDAStatusDropDown()}" />
							</p:selectOneMenu></td>
						<td><p:commandButton value="#{lbl['lbl.sm.button.search']}" action="#{complaintBackingBean.retrieveComplaint()}" 
						update="complaintSR" /></td>
					</tr>
				</table>
			</div>
		</p:panel>
		


		<p:panel header="#{lbl['lbl.sm.complaint.header']}" toggleable="true" id="pnlCompList">
			<p:dataTable id="complaintSR"
					value="#{complaintBackingBean.managedBean.complaintDataModel}"
					rows="10" var="compl" rowIndexVar="index" lazy="true">
				<ac:paginator for="complaintSR" />
				<p:column headerText="#{lbl['lbl.sm.complaint.no']}">
					#{compl.complaintNo}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.complaint.date']}">
					<h:outputText value="#{compl.createdDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.suppname']}">
					#{compl.smSupplier.companyName}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.epNo']}">
					#{compl.smSupplier.epNo}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.regno']}">
					#{compl.smSupplier.regNo}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.status']}">
					#{complaintBackingBean.getStatusDescById(compl.pmStatus.statusId)}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.action']}">
					<p:commandLink id="complEditBtn" 
						action="#{complaintBackingBean.onComplaintRowSelect(compl.complaintId)}">
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" >
						</p:graphicImage>
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</p:panel>

	</ui:define>
</ui:composition>
