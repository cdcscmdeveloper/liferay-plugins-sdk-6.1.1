<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<f:event listener="#{complaintBackingBean.retrieveAllActiveComplaint}"
			type="preRenderView" />
		<div align="right">
			<p:commandLink value="#{lbl['lbl.sm.complaint.pending.shwcause.accstnresp']}"
				style="color:blue;"
				action="#{complaintBackingBean.pendingResponseLetterView}"></p:commandLink>
		</div>
		<p:panel header="#{lbl['lbl.sm.complaint.search']}" toggleable="true" id="pnlSearch">
			<div align="center">
				<table style="width: 80%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.complaint.search.by']}" /></td>
						<td><p:selectOneMenu>
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.complaint.ep.no']}" itemValue="E" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.companyname']}" itemValue="CA" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.complaint.no']}" itemValue="CO" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.mofno']}" itemValue="M" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.regno']}" itemValue="R" />
							</p:selectOneMenu></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.complaint.keyword']}" /></td>
						<td><p:inputText /></td>

						<td><p:outputLabel value="#{lbl['lbl.sm.status']}" /></td>
						<td><p:selectOneMenu>
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.status.open']}" itemValue="O" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.status.in.progress']}" itemValue="P" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.status.closed']}" itemValue="C" />
							</p:selectOneMenu></td>
						<td><p:commandButton value="#{lbl['lbl.sm.button.search']}" /></td>
					</tr>
				</table>
			</div>
		</p:panel>

		<p:panel header="#{lbl['lbl.sm.complaint.header']}" toggleable="true" id="pnlCompList">
			<p:dataTable value="#{complaintBackingBean.managedBean.smComplLs}"
				var="compl" id="complaintDt"
				selection="#{complaintBackingBean.managedBean.selectedComplaint}" rowKey="#{compl}">

				<ac:paginator for="complaintDt" />
				<p:column headerText="#{lbl['lbl.sm.complaint.no']}">
					#{compl.complaintNo}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.complaint.date']}">
					<h:outputText value="#{compl.createdDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<!-- 				<p:column headerText="Complaint Type"> -->
				<!-- 					#{compl.complaintCategory} -->
				<!-- 				</p:column> -->

				<!-- 				<p:column headerText="MOF No"> -->
				<!-- 					#{compl.supplierMofNo} -->
				<!-- 				</p:column> -->
				<p:column headerText="#{lbl['lbl.sm.suppname']}">
					#{compl.smSupplier.companyName}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.regno']}">
					#{compl.smSupplier.regNo}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.status']}">
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.action']}">
					<p:commandLink
						action="#{complaintBackingBean.onComplaintRowSelect(compl.complaintId)}">
						<p:graphicImage value="/resources/ep/images/design/edit.png"></p:graphicImage>
					</p:commandLink>
				</p:column>
				
				<p:column selectionMode="multiple" style="width:2%" />
			</p:dataTable>
		</p:panel>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.generate.excel']}"></p:commandButton>
		</div>
	</ui:define>
</ui:composition>
