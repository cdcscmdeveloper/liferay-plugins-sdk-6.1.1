<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
	
	<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintHeader.xhtml" />
	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.submit']}"
			action="#{complaintBackingBean.updateComplaint}"></p:commandButton>
	</div>
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />	
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionStatusConst.newComplaint}">
			<ui:include src="initialReview.xhtml"  />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionStatusConst.reviewByPtpk}">
			<ui:include src="complaintFirstReviewInfo.xhtml" />
			<ui:include src="updateComplaintFirstReview.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionStatusConst.prepareSlLetter}">
			<ui:include src="issueShowCauseLetter.xhtml" />
<!-- 			<ui:include src="updateShowCauseLetterResponse.xhtml" /> -->
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionStatusConst.updateSlReceiveDate}">
			<ui:include src="issueShowCauseLetter.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionStatusConst.waitingSuppSlResp}">
			<ui:include src="issueShowCauseLetter.xhtml" />
			<ui:include src="updateShowCauseLetterResponse.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionStatusConst.reviewSuppResp}">
				<ui:include src="complaintSecondReviewInfo.xhtml" />
				<ui:include src="updateComplaintSecondReview.xhtml" />
		</c:if>

		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionStatusConst.prepareAcLetter}">
				<ui:include src="updateAccusationLetterInfo.xhtml" />
<!-- 					<ui:include src="updateAccusationLetterResponse.xhtml" /> -->
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionStatusConst.updateAcReceiveDate}">
				<ui:include src="updateAccusationLetterInfo.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionStatusConst.waitingSuppAcResp}">
				<ui:include src="updateAccusationLetterInfo.xhtml" />
				<ui:include src="updateAccusationLetterResponse.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionStatusConst.pendingReviewRespFromJktt}">
			<ui:include src="JKTTDecision.xhtml" />
		</c:if>
		
		
<!-- 		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionStatusConst.reviewSuppResp}">
				<ui:include src="JKTTDecision.xhtml" />
		</c:if> -->
		
	</ui:define>
</ui:composition>
