<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:tabView id="tabComplaint" dynamic="true" orientation="left">
			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 1 }">
				<p:tab title="First Review Info">
					<ui:include src="complaintFirstReviewInfo.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 2 }">
				<p:tab title="First Review Update">
					<ui:include src="updateComplaintFirstReview.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 3 }">
				<p:tab title="Issue Show Cause Letter">
					<ui:include src="updateShowCauseLetterInfo.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 4 }">
				<p:tab title="Response of Show Cause Letter">
					<ui:include src="updateShowCauseLetterResponse.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 5 }">
				<p:tab title="Second Review Info">
					<ui:include src="complaintSecondReviewInfo.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 6 }">
				<p:tab title="Second Review Update">
					<ui:include src="updateComplaintSecondReview.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 7 }">
				<p:tab title="Accusation Letter Info">
					<ui:include src="updateAccusationLetterInfo.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 8 }">
				<p:tab title="Response of Accusation Letter">
					<ui:include src="updateAccusationLetterResponse.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 9 }">
				<p:tab title="JKTT Decision">
					<ui:include src="JKTTDecision.xhtml" />
				</p:tab>
			</c:if>
		</p:tabView>
	</ui:define>
</ui:composition>
