<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">


		<!--  <p:commandButton value="Download Investigation Report"></p:commandButton>-->
		<p:tabView id="tabComplaint" dynamic="true" orientation="left">
			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 0 }">
				<p:tab title="#{lbl['lbl.sm.complaint.initial.review']}">
					<ui:include src="initialReview.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 1 }">
				<p:tab title="#{lbl['lbl.sm.complaint.first.ptk.decision']}">
					<ui:include src="complaintFirstReviewInfo.xhtml" />
					<ui:include src="updateComplaintFirstReview.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 2 }">
				<p:tab title="#{lbl['lbl.sm.complaint.show.cause.letter']}">
					<ui:include src="updateShowCauseLetterInfo.xhtml" />
					<ui:include src="updateShowCauseLetterResponse.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 3 }">

				<p:tab title="#{lbl['lbl.sm.complaint.second.ptk.decision']}">
					<ui:include src="complaintSecondReviewInfo.xhtml" />
					<ui:include src="updateComplaintSecondReview.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 4 }">
				<p:tab title="#{lbl['lbl.sm.complaint.accusation.letter.info']}">
					<ui:include src="updateAccusationLetterInfo.xhtml" />
					<ui:include src="updateAccusationLetterResponse.xhtml" />
				</p:tab>
			</c:if>

			<c:if
				test="#{complaintBackingBean.managedBean.smComplaint.statusId >= 5 }">
				<p:tab title="#{lbl['lbl.sm.complaint.jktt.decision']}">
					<ui:include src="JKTTDecision.xhtml" />
				</p:tab>
			</c:if>
			<p:tab title="#{lbl['lbl.sm.complaint.tracking']}">
				<ui:include
					src="/xhtml/sm/shared/complaintRegistration/complaintTracking.xhtml" />
			</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
