<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
	
	<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintHeader.xhtml" />
	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.submit']}" 
			rendered="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId != DisciplinaryActionConst.newComplaintReject and 
			complaintBackingBean.managedBean.smComplaint.pmStatus.statusId != DisciplinaryActionConst.reviewByPtpkReject and 
			complaintBackingBean.managedBean.smComplaint.pmStatus.statusId != DisciplinaryActionConst.reviewSuppRespReject}"
			action="#{complaintBackingBean.updateComplaint}">
			<f:param name="disableValidation" value="true" />	
		</p:commandButton>
	</div>
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />	
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.newComplaint}">
			<ui:include src="initialReview.xhtml"  />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.newComplaintReject}">
			<ui:include src="initialReview.xhtml"  />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.reviewByPtpk}">
<!-- 			<ui:include src="complaintFirstReviewInfo.xhtml" /> -->
<!-- 			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" /> -->
			<ui:param name="complainantDtlViewFLag" value="true" />
			<ui:param name="complDtlViewFLag" value="true" />
			<ui:param name="ptpkViewFLag" value="false" />

			<ui:include src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/ptjReview.xhtml" />
<!-- 			<ui:include src="updateComplaintFirstReview.xhtml" /> -->
		</c:if>
		
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.reviewByPtpkReject}">
<!-- 			<ui:include src="complaintFirstReviewInfo.xhtml" /> -->
<!-- 			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" /> -->
			<ui:param name="complainantDtlViewFLag" value="true" />
			<ui:param name="complDtlViewFLag" value="true" />
			<ui:param name="ptpkViewFLag" value="false" />

			<ui:include src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/ptjReview.xhtml" />
<!-- 			<ui:include src="updateComplaintFirstReview.xhtml" /> -->
		</c:if>
		
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.prepareScLetter}">
			<ui:param name="complainantDtlViewFLag" value="true" />
			<ui:param name="complDtlViewFLag" value="true" />

			<ui:include src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/letterIssuanceInfo.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.updateScReceiveDate}">
			<ui:param name="complainantDtlViewFLag" value="true" />
			<ui:param name="complDtlViewFLag" value="true" />
			<ui:param name="scLetterViewFlag" value="true" />
			
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/letterIssuanceInfo.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.waitingSuppScResp}">
			<ui:param name="complainantDtlViewFLag" value="true" />
			<ui:param name="complDtlViewFLag" value="true" />
			<ui:param name="scLetterViewFlag" value="true" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/letterIssuanceInfo.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/updateShowCauseLetterResponse.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.reviewSuppResp}">
			<ui:param name="complainantDtlViewFLag" value="true" />
			<ui:param name="complDtlViewFLag" value="true" />
			<ui:param name="scLetterViewFlag" value="true" />
		
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/letterIssuanceInfo.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/updateShowCauseLetterResponse.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/ptjReview2.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.reviewSuppRespReject}">
			<ui:param name="complainantDtlViewFLag" value="true" />
			<ui:param name="complDtlViewFLag" value="true" />
			<ui:param name="scLetterViewFlag" value="true" />
			<ui:param name="secondPtpkViewFLag" value="true" />
		
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/letterIssuanceInfo.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/updateShowCauseLetterResponse.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/ptjReview2.xhtml" />
		</c:if>

		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.prepareAcLetter}">
<!-- 				<ui:include src="updateAccusationLetterInfo.xhtml" /> -->
			<ui:param name="complainantDtlViewFLag" value="true" />
			<ui:param name="complDtlViewFLag" value="true" />
			<ui:param name="secondPtpkViewFLag" value="true" />
						
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/ptjReview2.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/accusationLetterIssuance.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.updateAcReceiveDate}">
			<ui:param name="complainantDtlViewFLag" value="true" />
			<ui:param name="complDtlViewFLag" value="true" />
			<ui:param name="secondPtpkViewFLag" value="true" />
			<ui:param name="acLetterViewFlag" value="true" />
						
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/ptjReview2.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/accusationLetterIssuance.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.waitingSuppAcResp}">
			<ui:param name="complainantDtlViewFLag" value="true" />
			<ui:param name="complDtlViewFLag" value="true" />
			<ui:param name="secondPtpkViewFLag" value="true" />
			<ui:param name="acLetterViewFlag" value="true" />
						
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/ptjReview2.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/accusationLetterIssuance.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/updateAccusationLetterResponse.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.pendingReviewRespFromJktt}">
			<ui:param name="complainantDtlViewFLag" value="true" />
			<ui:param name="complDtlViewFLag" value="true" />
			<ui:param name="secondPtpkViewFLag" value="true" />
			<ui:param name="acLetterViewFlag" value="true" />
			
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/ptjReview2.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/accusationLetterIssuance.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/updateAccusationLetterResponse.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/jkttDecision.xhtml" />
		</c:if>
		
		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.complaintCompleted}">
			<ui:param name="complainantDtlViewFLag" value="true" />
			<ui:param name="complDtlViewFLag" value="true" />
			<ui:param name="secondPtpkViewFLag" value="true" />
			<ui:param name="acLetterViewFlag" value="true" />
			<ui:param name="jkTTViewFLag" value="true" />
			
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/ptjReview2.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/accusationLetterIssuance.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/updateAccusationLetterResponse.xhtml" />
			<ui:include src="/xhtml/sm/shared/complaintRegistration/jkttDecision.xhtml" />
		</c:if>
		
<!-- 		<c:if test="#{complaintBackingBean.managedBean.smComplaint.pmStatus.statusId == DisciplinaryActionConst.reviewSuppResp}">
				<ui:include src="JKTTDecision.xhtml" />
		</c:if> -->
		
	</ui:define>
</ui:composition>
