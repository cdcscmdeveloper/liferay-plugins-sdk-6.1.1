<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/sm/shared/sidemenu/smMainPageSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<p:panel
			header="Update Complaint Details - Send to JKTT For Final Decesion">
			<ui:include
				src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" />
			<p:panel header=" Received Supplier Response For Accusation Letter"
				toggleable="true">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel
								value="  Date Acquisition Received By Supplier*" /></td>
						<td><p:calendar showOn="button" /></td>
						<td><p:outputLabel
								value="  Date Acquisition Letter Response Received *" /></td>
						<td><p:calendar showOn="button" /></td>

					</tr>
					<tr>
						<td><p:outputLabel
								value="  Expected Convene Date For JKTT Final *" /></td>
						<td><p:calendar showOn="button" /></td>
						<td><p:outputLabel
								value="Upload Acquisition Letter Response*"></p:outputLabel></td>
						<td><p:fileUpload mode="simple" /></td>
					</tr>
				</table>
			</p:panel>
			<ui:include
				src="/xhtml/sm/shared/complaintRegistration/complaintTracking.xhtml" />
			<div align="center">
				<p:commandButton value="Update" />
				<p:commandButton value="Cancel"
					action="/xhtml/sm/homeScreen/defaultVirtualCertPage.xhtml" />
			</div>
		</p:panel>
	</ui:define>
</ui:composition>
