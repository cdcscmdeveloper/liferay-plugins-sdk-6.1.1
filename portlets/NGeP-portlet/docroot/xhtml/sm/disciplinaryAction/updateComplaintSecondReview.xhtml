<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.complaint.second.ptk.decision']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.complaint.actual.meeting.date']}" /></td>
				<td class="tdContent"><p:calendar showOn="button"
						value="#{complaintBackingBean.managedBean.smComplReview.actualConveneDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.complaint.minute.ref.no']}" /></td>
				<td class="tdContent"><p:inputText
						value="#{complaintBackingBean.managedBean.smComplReview.minutesRefNo}" /></td>
			</tr>

<!-- 			<tr> -->
<!-- 				<td class="tdTitle"><p:outputLabel value="* Report Received" /></td> -->
<!-- 				<td class="tdContent"><p:calendar showOn="button" -->
<!-- 						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td> -->

<!-- 			</tr> -->

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.remarks']}" /></td>
				<td class="tdContent" colspan="3"><p:inputTextarea
						value="#{complaintBackingBean.managedBean.smComplReview.decisionRemark}"
						rows="8" cols="100" /></td>
			</tr>

			<!--  
				<tr>
					<td id="tdTitle"><p:outputLabel
							value="* Date Closed / Issued ShowCause Letter" /></td>
					<td id="tdContent"><p:calendar showOn="button" /></td>
					<td id="tdTitle"><p:outputLabel
							value="* Remarks For Closed Case" /></td>
					<td id="tdContent"><p:inputTextarea /></td>
				</tr>
				-->
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="* #{lbl['lbl.sm.complaint.upload.dcsn.rpt']}"></p:outputLabel></td>
				<td class="tdContent"><p:fileUpload mode="simple" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="* #{lbl['lbl.sm.decision']}" /></td>
				<td class="tdContent"><p:selectOneMenu
						value="#{complaintBackingBean.managedBean.smComplReview.decisionTaken}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.decision.valid']}" itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.decision.invalid']}" itemValue="0" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
