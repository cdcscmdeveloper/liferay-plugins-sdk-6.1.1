<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/sm/shared/sidemenu/smMainPageSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<p:panel
			header="Update Complaint Details - Send Report For Initial Review By PTPK">
			<ui:include
				src="/xhtml/sm/shared/complaintRegistration/complaintBasicInfo.xhtml" />
			<p:panel header=" Send To PTPK For Review -1 " toggleable="true">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel
								value="Report Sent For Initial PTPK Validation *" /></td>
						<td><p:calendar showOn="button" /></td>
						<td><p:outputLabel value="Expected Conven Date *" /></td>
						<td><p:calendar showOn="button" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="Initial Invesitgation Report*"></p:outputLabel></td>
						<td><p:fileUpload mode="simple" /></td>
						<td><p:commandLink value="Click Here" /></td>
						<td><p:outputLabel
								value="To download investigation report template"></p:outputLabel>
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="Supplier MOF NO. *"></p:outputLabel></td>
						<td><p:inputText /></td>
					</tr>

				</table>
			</p:panel>
			<ui:include
				src="/xhtml/sm/shared/complaintRegistration/complaintTracking.xhtml" />
			<div align="center">
				<p:commandButton value="Update" />
				<p:commandButton value="Cancel"
					action="/xhtml/sm/homeScreen/defaultVirtualCertPage.xhtml" />
			</div>
		</p:panel>
	</ui:define>
</ui:composition>
