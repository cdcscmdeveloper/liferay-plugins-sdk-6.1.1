<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		
	</ui:define>
	
	<ui:define name="contentSection">
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	
	<p:panel header="#{lbl['lbl.sm.term.and.condition.header']}" toggleable="true">
	
		<p:scrollPanel style="height:300px;border:0;" mode="native">
			<b>#{lbl['lbl.sm.basic.govt.tnc.header']}</b>
			<br />
			<p><h:outputText escape="false" value="#{lbl['lbl.sm.basic.account.govt.tnc']}" /></p>
		</p:scrollPanel>
		
		<br />
		<p:panel id="captchaPanel">
			<table>
				<tr>
					<td width="250px">
						<p:inputText value="#{govtSellerBackingBean.managedBean.captchaAnswer}" 
							validator="#{govtSellerBackingBean.validateCaptcha}" id="captchaAnswerId"
							size="10" />
						<p:graphicImage id="captchaText" value="#{govtSellerBackingBean.captchaTextImage}" />
						&#160;
						<p:commandLink update="captchaText" >
							<p:graphicImage value="/css/images/design/ico-refresh.png" />
						</p:commandLink>
					</td>
					<td>
						<p:messages id="messages" showDetail="true" autoUpdate="true"
								closable="true" showSummary="false"/>
					</td>
				</tr>
			</table>
		</p:panel>
		<br />
		
		<p:selectBooleanCheckbox id="chkTcId" value="#{govtSellerBackingBean.managedBean.agreeTC}" >
			<p:ajax update="btnProceed" partialSubmit="true" process="@this" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
		</p:selectBooleanCheckbox>
		#{lbl['lbl.sm.have.agreed']} #{lbl['lbl.sm.term.and.condition']}
		
		<div class="nav-wrapper" align="justify">
			<p:commandButton id="btnProceed" value="#{lbl['lbl.sm.next']}"  style="float:right;"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form"
			disabled="#{!govtSellerBackingBean.managedBean.agreeTC}" action="#{govtSellerBackingBean.navigateToSearchPage}" />
			
			<p:commandButton value="#{lbl['lbl.sm.prev']}" style="left;"
				action="#{govtSellerBackingBean.returnToSignUp}">
				<f:param name="skipValidator" value="true"/>
			</p:commandButton>
		</div>
		<div style="clear: both;"></div>
	     
	</p:panel>
	
	</ui:define>

</ui:composition>
