<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		
	<p:panel header="#{lbl['lbl.sm.search.agency']}" toggleable="true" id="searchGovtSellerPanelId">
		<table style="width: 100%">
		
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.agency.type']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu label="#{lbl['lbl.sm.agency.type']}"
						id="orgTypeCodeSearchId" value="#{bb.managedBean.orgTypeCode}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems
							value="#{bb.managedBean.agencyTypeItems}" /></p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.agency.name']}" />
				</td>
				<td>
					<p:inputText label="#{lbl['lbl.sm.agency.name']}"
						value="#{bb.managedBean.agencyName}"
						size="40" maxlength="100"/>
				</td>
			</tr>
			<tr>
				<td colspan="2">
					<div class="nav-wrapper" align="justify">
						<p:commandButton value="#{lbl['lbl.btn.search']}" 
							action="#{bb.managedBean.search}"
							update="@form" style="float:right;" 
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
						
						<p:commandButton value="#{lbl['lbl.sm.prev']}" style="left;"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form"
							action="#{bb.returnToTnc}">
						</p:commandButton>
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.results']}" toggleable="true" id="resultGovtSellerPanelId">
			
		<p:dataTable var="orgProfile" widgetVar="orgProfileWidgetVar"
			editable="false" lazy="true" rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{bb.managedBean.orgProfileDataModel}"
			rowKey="#{orgProfile}" rowIndexVar="index" id="orgProfileDtId">
			<ac:paginator for="orgProfileDtId" />
			
			<p:column headerText="#{lbl['lbl.sm.agency.type']}">
				<h:outputText value="#{orgProfile[1]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.agency.code']}">
				<h:outputText value="#{orgProfile[3]}" />
			</p:column>
	
			<p:column headerText="#{lbl['lbl.sm.agency.name']}">
				<h:outputText value="#{orgProfile[2]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
				<p:commandLink onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{bb.initOrgProfile(orgProfile[0])}"
					process="@this" partialSubmit="true" update="@form"
					style="padding-right:5px;">
					<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
				</p:commandLink>
			</p:column>
			
		</p:dataTable>
		
	</p:panel>

</ui:composition>
