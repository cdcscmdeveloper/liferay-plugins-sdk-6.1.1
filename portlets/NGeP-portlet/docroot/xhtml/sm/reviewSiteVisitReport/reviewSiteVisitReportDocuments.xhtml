<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForMof}">
					<ui:include
						src="/xhtml/sm/NewMofApplication/smMofApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForBumi}">
					<ui:include
						src="/xhtml/sm/updateMofDetails/smUpdateMofApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
					<ui:include
						src="/xhtml/sm/renewMofApplication/smRenewApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForApplcatcodes}">
					<ui:include
						src="/xhtml/sm/renewMofApplication/smRenewApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForUpdate}">
					<ui:include
						src="/xhtml/sm/updateMofDetails/smUpdateMofApplnSideMenuItem.xhtml" />
				</c:if></td>
			<td><h:inputHidden
					value="#{backingBean.managedBean.smAppl.applCategoryType}" /> <br />
				<ui:include src="/xhtml/sm/svositevisit/reviewSiteVisitReport.xhtml" />

				<br /> <br />

				<table style="width: 100%">
					<tr>
						<td><div align="left" style="width: 100%">
								<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.assignReviewSupportingNav('prev')}"
									icon="ui-icon-prev"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SITEVISITREV,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
									update=":form" />
							</div></td>
						<td><c:if test="#{backingBean.managedBean.approverUser}">
								<div align="right" style="width: 100%">
									<p:commandButton value="#{lbl['lbl.sm.next.section']}"
										onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
										icon="ui-icon-next" iconPos="right"
										actionListener="#{backingBean.assignReviewSupportingNav('next')}"
										action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SITEVISITREV,SupplierManagementConst.SM_APPL_PAGE_TYPE_APPRDEC)}"
										update=":form" />
								</div>
							</c:if> <c:if test="#{backingBean.managedBean.poUser}">
								<div align="right" style="width: 100%">
									<p:commandButton value="#{lbl['lbl.sm.next.section']}"
										onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
										icon="ui-icon-next" iconPos="right"
										actionListener="#{backingBean.assignReviewSupportingNav('next')}"
										action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SITEVISITREV,SupplierManagementConst.SM_APPL_PAGE_TYPE_PODEC)}"
										update=":form" />
								</div>
							</c:if></td>
					</tr>
				</table></td>
		</tr>
	</table>

</ui:composition>
