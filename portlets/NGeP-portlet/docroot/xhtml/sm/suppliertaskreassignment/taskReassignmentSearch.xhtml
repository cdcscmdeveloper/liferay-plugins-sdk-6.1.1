<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:param name="isSysOrgType" value="#{ParameterConst.orgTypeSys eq supplierTaskReassignmentBackingBean.managedBean.currentActiveOrg.orgTypeCode.parameterCode}" />
	<p:outputPanel id="opBackBttn" rendered="#{not empty supplierTaskReassignmentBackingBean.managedBean.backURL}">		
			<table style="width: 100%">
				<tr>
					<td>
						<ac:title value="#{lbl['lbl.pm.ta.task.reassigment']}" />
					</td>
				</tr>
				<tr>
					<td>
						<div align="left" style="width: 100%">
			  				<p:commandButton value="#{lbl['lbl.btn.back']}" 
			  					action="#{supplierTaskReassignmentBackingBean.redirectToPmUserPage}" 
			  					immediate="true"
			  				    id="cbBackProfileId" />
			 			</div>
					 </td>
			
				</tr>
			</table>
		</p:outputPanel>
	<p:panel id="pTaskAssignSearch" header="#{lbl['lbl.pm.ta.search']}"
		toggleable="true">
		
		<!-- 29822 start -->
		<p:blockUI block="pTaskAssignSearch" widgetVar="taskReassignconfirmPopupBlockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<!-- 29822 end -->
		
		<table class="ppTwoTable">
			<tr>
				<th width="15%"><p:outputLabel value="#{lbl['lbl.sm.companyname']}" /> </th>
				<td width="60%">
						<p:inputText styleClass="ppDisplayTextL" readonly="true"
							value="#{supplierTaskReassignmentBackingBean.managedBean.smSupplier.companyName}"
							size="60" >
						</p:inputText></td>
				<td width="25%"></td>
			</tr>
			<tr>
				<th width="15%"><p:outputLabel
						value="#{lbl['lbl.pm.ta.username']}" /> <p:outputLabel value="*" styleClass="mandatory" /></th>
				<td width="60%">
					<!-- 29822 - start - reendorse reopen cosmetic -->
						<p:outputPanel id="opUserLov">
						<ac:lov id="lovUser" lovId="SM_PERSONNEL_LOV"
						size="80"
						update=":form:pTaskAssignSearch,:form:dtTaskAssignResult,:form:dtGroupTaskAssignResult,:form:pUserTaskAssignResult,:form:pGroupTaskAssignResult,:form:pOthersTaskAssignResult" readonly="true"
						headerText="#{lbl['lbl.pm.ta.user.lov']}"
						value="#{supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.user.name}"
						saveObject="supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.user"
						conditionField="#{supplierTaskReassignmentBackingBean.constructUserConditionFields()}"
						postUpdateListener="supplierTaskReassignmentBackingBean.onChangeUser" />
						</p:outputPanel></td>

					<!-- 29822 - end - reendorse reopen cosmetic -->

				<td width="25%"></td>
			</tr>
			<tr>
				<th width="15%"><p:outputLabel
						value="#{lbl['lbl.sm.worker.icno']}" rendered="#{supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.user!=null}"/> </th>
				<td width="60%">
						<p:inputText styleClass="ppDisplayTextL" rendered="#{supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.user!=null}"
							readonly="true" value="#{supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.user.identificationNo}"
							size="60" >
						</p:inputText></td>

				<td width="25%"></td>
			</tr>
			<tr>
				<th width="15%"><p:outputLabel
						value="#{lbl['lbl.sm.bankDtls.signPos']}" rendered="#{supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.user!=null}"/> </th>
				<td width="60%">
						<p:inputText  styleClass="ppDisplayTextL" rendered="#{supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.user!=null}"
							readonly="true" value="#{supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.user.designation}"
							size="60" >
						</p:inputText></td>

				<td width="25%"></td>
			</tr>
			<tr>
				<th width="15%"><p:outputLabel
						value="#{lbl['lbl.sm.person.composition.eprole']}" rendered="#{supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.user!=null}"/> </th>
				<td width="60%">
						<p:inputText  styleClass="ppDisplayTextL" rendered="#{supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.user!=null}"
							readonly="true" value="#{supplierTaskReassignmentBackingBean.getRoleDescByRoleCode(supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.user.epRole)}"
							size="60" >
						</p:inputText></td>

				<td width="25%"></td>
			</tr>
			<tr>
				<th width="15%">
					<p:outputLabel value="#{lbl['lbl.txt.docType']}"/>
				</th>
				<td width="60%">
					<p:outputPanel >
						<p:selectOneMenu id="trDocTypeDD" style="width:205px"
							value="#{supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.docType}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems
								value="#{supplierTaskReassignmentBackingBean.retrieveParameterDesc()}"
								var="parameter" itemLabel="#{parameter.codeName}"
								itemValue="#{parameter.pmParameter.parameterCode}" />
								<p:ajax event="change" process="@this" partialSubmit="true" update="@this,:form:pTaskAssignSearch,:form:dtTaskAssignResult,:form:dtGroupTaskAssignResult,:form:dtOthersTaskAssignResult"
								listener="#{supplierTaskReassignmentBackingBean.onChangeDocType}"></p:ajax>
						</p:selectOneMenu>	
						</p:outputPanel>
				</td>
				
				<td width="25%">
					
				</td>
			</tr>
				<tr>
				<th width="15%">
					<p:outputLabel value="#{lbl['lbl.pm.ta.doc.no']}"/>
				</th>
				<td width="60%">
					<p:inputText id="docNo"  styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.ta.doc.no']}" maxlength="20"
							value="#{supplierTaskReassignmentBackingBean.managedBean.taskAssignmentSearchBean.docNo}"
							size="37" >
						<p:ajax event="blur" listener="#{supplierTaskReassignmentBackingBean.onChangeUser(null)}" 
				     		update=":form:pTaskAssignSearch,:form:dtTaskAssignResult,:form:dtGroupTaskAssignResult,:form:dtOthersTaskAssignResult"/> 
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.pm.ta.docno.tooltips']}" />
				</td>
				
				<td width="25%">
					
				</td>
			</tr>
			<!-- 29822 start -->
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" 
							id="cbSearchTask" widgetVar="cbSearchTask"
							process="pTaskAssignSearch" action="#{supplierTaskReassignmentBackingBean.searchTaskAssign}"
							update=":form:dtTaskAssignResult,:form:dtGroupTaskAssignResult,
							:form:dtOthersTaskAssignResult,:form:deleteGroupTasks,:form:deleteOthersTasks,
							:form:pGroupTaskAssignResult,:form:pOthersTaskAssignResult" 
							onclick="cbSearchTask.disable();cbResetTask.disable()"  
							onstart="taskReassignconfirmPopupBlockWidget.show()"
			  				oncomplete="cbSearchTask.enable();cbResetTask.enable();taskReassignconfirmPopupBlockWidget.hide();"
							/>
						<p:commandButton id="cbResetTask" widgetVar="cbResetTask"
							onclick="cbSearchTask.disable();cbResetTask.disable()"  
							onstart="taskReassignconfirmPopupBlockWidget.show()"
			  				oncomplete="cbSearchTask.enable();cbResetTask.enable();taskReassignconfirmPopupBlockWidget.hide();"
							value="#{lbl['lbl.btn.reset']}" 
							action="#{supplierTaskReassignmentBackingBean.resetTaskAssignSearchBean}"
							update="pTaskAssignSearch,:form:userTaskListID,:form:groupTaskListID,
							:form:othersTaskListID,:form:deleteGroupTasks,:form:deleteOthersTasks,
							:form:pGroupTaskAssignResult,:form:pOthersTaskAssignResult" 
							/> 
					</div>
				</td>
			</tr>
			<!-- 29822 end -->
		</table>
		
		
	</p:panel>

</ui:composition>
