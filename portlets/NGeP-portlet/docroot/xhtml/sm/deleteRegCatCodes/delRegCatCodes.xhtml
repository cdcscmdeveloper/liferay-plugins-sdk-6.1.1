<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/sm/shared/sidemenu/smMainPageSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content">
	<p:panel header="Cancel / Delete Registered Category Code(s)" toggleable="true">
			<p:dataTable var="table"
				value="#{mofRegistrationBackingBean.dataList}">
				<p:column headerText="No.">  
                   #{table.no}  
      		    </p:column>
      		    <p:column headerText="Code">  
                   #{table.code}  
      		    </p:column>
      		    <p:column headerText="Parent Category">  
                   #{table.parentCategory}  
      		    </p:column>
      		    <p:column headerText="Child Category">  
                   #{table.childCategory}    
      		    </p:column>
				<p:column headerText="Sub Child Category">  
		            #{table.subChildCategory}  
		        </p:column>
				<p:column headerText="Business Nature">  
		            #{table.businessNature} 
		        </p:column>
				<p:column headerText="Type">
					#{table.type}
				</p:column>
				<p:column headerText="Action">
					 <p:selectBooleanCheckbox value="#{table.action}" /> 
				</p:column>
				<p:column headerText="Remarks">
					<p:inputText readonly="true" disabled="true" value="" />
				</p:column>
					</p:dataTable>
					<br />
				</p:panel>
	</ui:define>
</ui:composition>
