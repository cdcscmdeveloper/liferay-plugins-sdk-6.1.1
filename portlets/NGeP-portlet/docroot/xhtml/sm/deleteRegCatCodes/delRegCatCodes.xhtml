<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" showSummary="false"
			escape="false" autoUpdate="true" closable="true" />
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:panel header="#{lbl['lbl.sm.catcode.delete.cancel.header']}"
			toggleable="true" id="catDelPan">
			<p:dataTable var="catBean" id="delCatDT"
				value="#{deleteCategoryCodeBB.managedBean.activeCategoryList}"
				selection="#{deleteCategoryCodeBB.managedBean.selectedCategories}"
				rowKey="#{catBean}" rowIndexVar="index"
				sortBy="#{catBean.approvedDate}">
				<p:ajax event="toggleSelect"
					listener="#{deleteCategoryCodeBB.onToggleSelect}"
					update=":form:catDelPan,:form:catDelConfirm" />
				<p:ajax event="rowSelect"
					listener="#{deleteCategoryCodeBB.onRowSelect}"
					update=":form:catDelPan,:form:catDelConfirm" />
				<p:ajax event="rowUnselectCheckbox"
					listener="#{deleteCategoryCodeBB.onRowUnSelect}"
					update=":form:catDelPan,:form:catDelConfirm" />
				<p:ajax event="rowSelectCheckbox"
					listener="#{deleteCategoryCodeBB.onRowSelect}"
					update=":form:catDelPan,:form:catDelConfirm" />
				<p:ajax event="rowUnselect"
					listener="#{deleteCategoryCodeBB.onRowUnSelect}"
					update=":form:catDelPan,:form:catDelConfirm" />
				<p:columnGroup type="header">
					<p:row>
						<p:column width="5%" />
						<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.dateReg']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.cate']}" />
						<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}" />
						<p:column headerText="#{lbl['lbl.sm.category.type']}" />
						<p:column headerText="#{lbl['lbl.sm.remarks']}" />
					</p:row>
				</p:columnGroup>
				<p:column selectionMode="multiple" rowspan="2" width="5%" />
				<p:column>
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column>
					<h:outputText value="#{catBean.approvedDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText
						value="#{catBean.pmCategoryL1.categoryL1Code} -  #{catBean.pmCategoryL1.categoryName}" />
					<br />
					<h:outputText
						value="#{catBean.pmCategoryL2.categoryL2Code} -  #{catBean.pmCategoryL2.categoryName}" />
					<br />
					<h:outputText
						value="#{catBean.pmCategoryL3.categoryL3Code} -  #{catBean.pmCategoryL3.categoryName}" />
				</p:column>

				<p:column>
					<h:outputText value="#{catBean.otherDesc}" />
				</p:column>

				<p:column>
					<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
						rendered="#{!catBean.specialCategory}" />
					<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
						rendered="#{catBean.specialCategory}" />
				</p:column>
				<p:column>
					<p:inputTextarea cols="30" rendered="#{catBean.selected}"
						id="delRmrks" value="#{catBean.remarks}" >
						<p:ajax process="@this" update="@this" partialSubmit="true" event="blur" />
					</p:inputTextarea>
					<p:message id="delRmrksMsg" for="delRmrks" showSummary="true"
						showDetail="false" display="icon" />
				</p:column>
			</p:dataTable>
			<br />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.catCodes.delete']}"
					disabled="true" readonly="true"
					rendered="#{empty deleteCategoryCodeBB.managedBean.selectedCategories}" />
				<p:commandButton value="#{lbl['lbl.sm.catCodes.delete']}" action="#{deleteCategoryCodeBB.onDeleteSelectedCatCodes}"
					rendered="#{not empty deleteCategoryCodeBB.managedBean.selectedCategories}"
					process="@this" update="@form"/>
			</div>
		</p:panel>
		<p:confirmDialog id="catDelConfirm"
			message="#{lbl['lbl.sm.delete.sure']} #{deleteCategoryCodeBB.managedBean.selectedCategories.size()} #{lbl['lbl.sm.records.sure']}"
			header="#{lbl['lbl.sm.catcode.delete.header']}" severity="alert"
			widgetVar="confirmation">
			
			<div align="right">
				<p:commandButton id="confCatDel" value="#{lbl['lbl.btn.yes']}"
					update="@form" onclick="confirmation.hide()"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					action="#{deleteCategoryCodeBB.deleteSelectedCatCodes}" />
				<p:commandButton id="decline" value="#{lbl['lbl.btn.no']}"
					onclick="confirmation.hide()" type="button" />
			</div>

		</p:confirmDialog>
	</ui:define>
</ui:composition>
