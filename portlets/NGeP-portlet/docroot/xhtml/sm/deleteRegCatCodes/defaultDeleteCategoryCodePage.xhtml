<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="defDelCatCodesApplMsgs" showDetail="true"
			autoUpdate="true" closable="true" showSummary="false" />
		<table style="width: 100%">
			<tr>
				<td><p:outputPanel><p:outputLabel value="#{lbl['lbl.sm.catcode.delete.msg']}" escape="false" /></p:outputPanel></td>
			</tr>
		</table>
		<p:separator />
		<table>
			<tr>

				<td width="10px" style="padding: 4px 2px 0px 8px;"><p:selectBooleanCheckbox
						value="#{deleteCategoryCodeBB.managedBean.termsAccepted}">
						<p:ajax event="change" update=":form:delCatCmdBtn" />
					</p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.termsConditions']}" /></td>
			</tr>

		</table>
		<div align="right">
			<p:commandButton value="Proceed" id="delCatCmdBtn"
				action="#{deleteCategoryCodeBB.getRegCategoryCodes}"
				disabled="#{!deleteCategoryCodeBB.managedBean.termsAccepted}" />
			<!-- <p:commandButton value="Cancel"
				action="/xhtml/sm/homeScreen/defaultVirtualCertPage.xhtml" /> -->
		</div>
	</ui:define>
</ui:composition>
