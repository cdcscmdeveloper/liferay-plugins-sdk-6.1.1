<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="defDelCatCodesApplMsgs" showDetail="true"
			autoUpdate="true" closable="true" showSummary="false"></p:messages>
			
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:panel id="deleteCatCodeTncPanelId" header="#{lbl['lbl.sm.term.and.condition.header']}">
			
			<p:scrollPanel style="height:30px;border:0;" mode="native">
				<h:outputText escape="false" value="#{lbl['lbl.sm.catcode.delete.msg']}" style="white-space : normal !important"/>
			</p:scrollPanel>

			<table>
				<tr>
					<td width="10px" style="padding: 4px 2px 0px 8px;"><p:selectBooleanCheckbox
							value="#{deleteCategoryCodeBB.managedBean.termsAccepted}">
							<p:ajax event="change" update=":form:delCatCmdBtn" />
						</p:selectBooleanCheckbox></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.termsConditions']}" /></td>
				</tr>
			</table>
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.proceed']}"
					id="delCatCmdBtn" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
					action="#{deleteCategoryCodeBB.getRegCategoryCodes}" update=":form"
					disabled="#{!deleteCategoryCodeBB.managedBean.termsAccepted}" />
			</div>
		</p:panel>
	</ui:define>
</ui:composition>
