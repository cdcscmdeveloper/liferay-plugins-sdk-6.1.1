<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
	<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>	
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<ui:include
			src="/xhtml/sm/shared/complaintRegistration/complainantDetails.xhtml" />
<!-- 		<ui:include -->
<!-- 			src="/xhtml/sm/shared/complaintRegistration/complainantContact.xhtml" /> -->

		<ui:include
			src="/xhtml/sm/shared/complaintRegistration/complaintDetails.xhtml" />
		<ac:lovPopup />
		<br />
		
		<div align="left">
			<p:selectBooleanCheckbox value="#{complaintBackingBean.managedBean.complaintTerm}">
				<p:ajax event="change" update="btnSubmitCompl" />
			</p:selectBooleanCheckbox>
			<h:outputText value="#{lbl['lbl.sm.complaint.lodge.have.agreed']}"></h:outputText>
			<p:commandLink style="color:blue;" value="#{lbl['lbl.sm.term.and.condition.header']}" onclick="dlg2.show();" />
		</div>
		
		<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.submit']}" update="@([id$=Msg])" id="btnSubmitCompl" 
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			disabled="#{!complaintBackingBean.managedBean.complaintTerm}" action="#{complaintBackingBean.lodgeComplaint}">
				<f:param name="disableValidation" value="true" />
		</p:commandButton>
		</div>

		<br />
		<hr />
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.complaint.instruction.bottom']}" escape="false"/>

		<p:dialog id="modalDialog" header="#{lbl['lbl.sm.term.and.condition.header']}"
			widgetVar="dlg2" modal="true" height="200" width="600">
			<h:outputText value="#{lbl['lbl.sm.complaint.lodge.complaint.termscond.note']}" escape="false" />
		</p:dialog>
	</ui:define>
</ui:composition>
