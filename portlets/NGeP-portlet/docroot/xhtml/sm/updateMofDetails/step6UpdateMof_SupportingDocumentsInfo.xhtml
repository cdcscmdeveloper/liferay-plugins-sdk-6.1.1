<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: top;" class="sidemenutd"><ui:include
					src="smUpdateMofApplnSideMenuItem.xhtml" /></td>
			<td style="vertical-align: top;"><p:outputPanel
					id="updtMofStep6OnlySuppPan"
					rendered="#{backingBean.managedBean.supplierUser}">
					<div align="right" style="width: 99%" class="button-wrapper">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/deleteApplicationCommonPage.xhtml" />
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							onclick="this.disabled=true;"
							onstart="blockWidget.show()" oncomplete="this.disabled=false;blockWidget.hide();"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType)}"
							update=":form" style="margin-bottom:5px;" />
						
						<ui:include src="/xhtml/sm/shared/mofRegistration/declareButtonWithoutSpki.xhtml" />
						
						<!-- disable spki for now -->
						<ui:remove>
							<c:choose>
								<c:when
									test="#{backingBean.managedBean.smAppl.applType ne ParameterConst.newSmApplnForUpdate}">
									<ui:include src="/xhtml/sm/shared/mofRegistration/declareButtonWithoutSpki.xhtml" />
								</c:when>
								<c:otherwise>
									<ui:include src="/xhtml/sm/shared/mofRegistration/declareButtonWithSpki.xhtml" />
								</c:otherwise>
							</c:choose>
						</ui:remove>



					</div>
				</p:outputPanel> <p:outputPanel id="supDocPan">
					<ui:fragment
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq SupplierManagementConst.SUPPORTING_DOC_OFFLINE}">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/offlineSupportingDocsForm.xhtml" />

						<div class="nav-wrapper">
							<table>
								<tr>
									<td><p:commandButton value="#{lbl['lbl.sm.prev.section']}"
											onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
											actionListener="#{backingBean.setTabValue('5','4')}"
											action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
											update=":form" /></td>
								</tr>
							</table>
						</div>
					</ui:fragment>
					<ui:fragment
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq SupplierManagementConst.SUPPORTING_DOC_ONLINE}">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/onlineSupportingDocsForm.xhtml" />
						<div class="nav-wrapper">
							<table>
								<tr>
									<td><p:commandButton value="#{lbl['lbl.sm.prev.section']}"
											onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
											actionListener="#{backingBean.setTabValue('5','4')}"
											action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
											update=":form" /></td>
								</tr>
							</table>
						</div>
					</ui:fragment>

				</p:outputPanel></td>
		</tr>
	</table>
</ui:composition>
