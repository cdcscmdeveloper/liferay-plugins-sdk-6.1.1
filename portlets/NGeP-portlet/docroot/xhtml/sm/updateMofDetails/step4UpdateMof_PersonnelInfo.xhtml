<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
		<tr>
			<td><h4
					style="color: blue; text-decoration: underline; text-align: center;">
					<h:outputText value="#{lbl['lbl.sm.applnTypeLbl']}" />
					<h:outputText
						value="Update MOF Account Details - Application NO. - #{backingBean.managedBean.smAppl.applNo}" />
				</h4></td>
		</tr>
		<tr>
			<td>
				<h6 style="color: blue;">
					<h:outputText value="Step4 :" />
					<h:outputText value=" Personnel(s) Information Page" />
				</h6>
			</td>
			<td align="right"><p:commandButton
					value="#{lbl['lbl.sm.saveAsDraft']}" /></td>
		</tr>
	</table>
	<ui:include
		src="/xhtml/sm/shared/mofRegistration/personnelInfoForm.xhtml" />
	<table style="width: 100%">
		<tr>
			<td align="left"><p:commandButton value="#{lbl['lbl.sm.prev']}"
					actionListener="#{backingBean.setTabValue('3','2')}"
					action="#{backingBean.updateSmAppl}" update=":form:tt" /></td>
			<td align="right"><p:commandButton value="#{lbl['lbl.sm.next']}"
					actionListener="#{backingBean.setTabValue('3','4')}"
					action="#{backingBean.updateSmAppl}" update=":form:tt" /></td>
		</tr>
	</table>

</ui:composition>
