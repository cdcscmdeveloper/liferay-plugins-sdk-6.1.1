<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
					src="smUpdateMofApplnSideMenuItem.xhtml" /></td>
			<td><p:outputPanel id="updtMofStep1OnlySuppPan"
					rendered="#{backingBean.managedBean.supplierUser}">
					<table style="width: 98%">
						<tr>
							<td class="smLastSubmitLabel"><h:outputText
									value="#{lbl['lbl.sm.lastSubmitDate']}" /></td>
							<td class="smLastSubmitDateVal"><h:outputText
									value="#{backingBean.managedBean.smAppl.draftExpiryDate}">
									<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
								</h:outputText></td>
						</tr>
					</table>
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(ParameterConst.newSmApplnForUpdate,backingBean.managedBean.currentPageType)}"
							update=":form" icon="ui-icon-save" style="margin-bottom:5px;" />
					</div>
				</p:outputPanel> <ui:include
					src="/xhtml/sm/shared/mofRegistration/companyBasicInfoForm.xhtml" />
				<ui:include
					src="/xhtml/sm/shared/mofRegistration/staffInfoForm.xhtml" /> <ui:include
					src="/xhtml/sm/shared/mofRegistration/officeFacilityTypeForm.xhtml" />
				<ui:include
					src="/xhtml/sm/shared/mofRegistration/certifacteInfoForm.xhtml" />
				<ui:fragment
					rendered="#{backingBean.managedBean.smAppl.supplierType eq '2'}">
					<ui:include
						src="/xhtml/sm/shared/mofRegistration/proffesionalBodyInfoForm.xhtml" />
				</ui:fragment> <ui:include
					src="/xhtml/sm/shared/mofRegistration/transactionNetworksForm.xhtml" />
				<div class="nav-wrapper">
					<table style="width: 100%">
						<tr>
							<td></td>
							<td><div align="right" style="width: 100%">
									<p:commandButton value="#{lbl['lbl.sm.next']}"
										actionListener="#{backingBean.setTabValue('0','1')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForUpdate,SupplierManagementConst.SM_APPL_PAGE_TYPE_BASIC,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH)}"
										update=":form" icon="ui-icon-next" iconPos="right" />
								</div></td>
						</tr>
					</table>
				</div></td>
		</tr>

	</table>
</ui:composition>
