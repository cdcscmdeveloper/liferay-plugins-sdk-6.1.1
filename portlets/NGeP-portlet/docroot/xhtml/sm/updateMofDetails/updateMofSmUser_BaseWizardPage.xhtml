<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">

	</ui:define>


	<ui:define name="contentSection">
		<ac:smPanel id="tt">
			<table style="width: 100%">
				<tr>
					<td><div class="navDiv" id="menuDiv" align="center">
							<ul class="menu-text">
								<li><h:outputText
										value="#{lbl['lbl.sm.wizard.companyStepLbl']}"
										rendered="#{backingBean.managedBean.tabActiveIndex eq 0}" />
									<p:commandLink value="#{lbl['lbl.sm.wizard.companyStepLbl']}"
										actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'0')}"
										action="#{backingBean.updateSmAppl}" update=":form"
										rendered="#{backingBean.managedBean.tabActiveIndex gt 0}" /></li>

								<li><h:outputText
										value="#{lbl['lbl.sm.wizard.branchStepLbl']}"
										rendered="#{backingBean.managedBean.tabActiveIndex le 1}" />
									<p:commandLink value="#{lbl['lbl.sm.wizard.branchStepLbl']}"
										actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'1')}"
										action="#{backingBean.updateSmAppl}" update=":form"
										rendered="#{backingBean.managedBean.tabActiveIndex gt 1}" /></li>

								<li><h:outputText
										value="#{lbl['lbl.sm.wizard.capitalStepLbl']}"
										rendered="#{backingBean.managedBean.tabActiveIndex le 2}" />
									<p:commandLink value="#{lbl['lbl.sm.wizard.capitalStepLbl']}"
										actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'2')}"
										action="#{backingBean.updateSmAppl}" update=":form"
										rendered="#{backingBean.managedBean.tabActiveIndex gt 2}" /></li>

								<li><h:outputText
										value="#{lbl['lbl.sm.wizard.personStepLbl']}"
										rendered="#{backingBean.managedBean.tabActiveIndex le 3}" />
									<p:commandLink value="#{lbl['lbl.sm.wizard.personStepLbl']}"
										actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'3')}"
										action="#{backingBean.updateSmAppl}" update=":form"
										rendered="#{backingBean.managedBean.tabActiveIndex gt 3}" /></li>

								<li><h:outputText
										value="#{lbl['lbl.sm.wizard.bankStepLbl']}"
										rendered="#{backingBean.managedBean.tabActiveIndex le 4}" />
									<p:commandLink value="#{lbl['lbl.sm.wizard.bankStepLbl']}"
										actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'4')}"
										action="#{backingBean.updateSmAppl}" update=":form"
										rendered="#{backingBean.managedBean.tabActiveIndex gt 4}" /></li>


								<li><h:outputText
										value="#{lbl['lbl.sm.wizard.supDocStepLbl']}"
										rendered="#{backingBean.managedBean.tabActiveIndex le 5}" />
									<p:commandLink value="#{lbl['lbl.sm.wizard.supDocStepLbl']}"
										actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'5')}"
										action="#{backingBean.updateSmAppl}" update=":form"
										rendered="#{backingBean.managedBean.tabActiveIndex gt 5}" /></li>

							</ul>
							<ul id="tripMeter" class="menu-line">
								<c:choose>
									<c:when test="#{backingBean.managedBean.tabActiveIndex eq 0}">
										<li class="space red-dot"></li>
									</c:when>
									<c:otherwise>
										<li class="space green-dot"></li>
									</c:otherwise>
								</c:choose>
								<c:choose>
									<c:when test="#{backingBean.managedBean.tabActiveIndex lt 1}">
										<li class="space black-dot"></li>
									</c:when>
									<c:when test="#{backingBean.managedBean.tabActiveIndex gt 1}">
										<li class="space green-dot"></li>
									</c:when>
									<c:otherwise>
										<li class="space red-dot"></li>
									</c:otherwise>
								</c:choose>
								<c:choose>
									<c:when test="#{backingBean.managedBean.tabActiveIndex lt 2}">
										<li class="space black-dot"></li>
									</c:when>
									<c:when test="#{backingBean.managedBean.tabActiveIndex gt 2}">
										<li class="space green-dot"></li>
									</c:when>
									<c:otherwise>
										<li class="space red-dot"></li>
									</c:otherwise>
								</c:choose>
								<c:choose>
									<c:when test="#{backingBean.managedBean.tabActiveIndex lt 3}">
										<li class="space black-dot"></li>
									</c:when>
									<c:when test="#{backingBean.managedBean.tabActiveIndex gt 3}">
										<li class="space green-dot"></li>
									</c:when>
									<c:otherwise>
										<li class="space red-dot"></li>
									</c:otherwise>
								</c:choose>
								<c:choose>
									<c:when test="#{backingBean.managedBean.tabActiveIndex lt 4}">
										<li class="space black-dot"></li>
									</c:when>
									<c:when test="#{backingBean.managedBean.tabActiveIndex gt 4}">
										<li class="space green-dot"></li>
									</c:when>
									<c:otherwise>
										<li class="space red-dot"></li>
									</c:otherwise>
								</c:choose>
								<c:choose>
									<c:when test="#{backingBean.managedBean.tabActiveIndex lt 5}">
										<li class="black-dot"></li>
									</c:when>
									<c:otherwise>
										<li class="red-dot"></li>
									</c:otherwise>
								</c:choose>

							</ul>
						</div></td>
					<td><div align="right" style="width: 99%">
							<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
								icon="ui-icon-save" style="margin-bottom:5px;" />
						</div></td>
				</tr>
			</table>

			<p:messages id="messages" showDetail="true" autoUpdate="true"
				closable="true" />

			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 0}">
				<ui:include src="step1UpdateMof_CompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 1}">
				<ui:include src="step2UpdateMof_BranchCompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 2}">
				<ui:include src="step3UpdateMof_CaptialAndEquityStatusInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 3}">
				<ui:include src="step4UpdateMof_PersonnelInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 4}">
				<ui:include src="step5UpdateMof_BankInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 5}">
				<ui:include src="step6UpdateMof_SupportingDocumentsInfo.xhtml" />
			</c:if>
		</ac:smPanel>
	</ui:define>
</ui:composition>
