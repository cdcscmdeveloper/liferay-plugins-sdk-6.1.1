<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<c:choose>
		<c:when test="#{backingBean.managedBean.redirectToPersonPage}">
			<table style="width: 100%">
				<tr>
					<td><ui:include
							src="/xhtml/sm/shared/mofRegistration/captialShareHolderInfoRedirectForm.xhtml" />

					</td>
				</tr>

			</table>
		</c:when>
		<c:otherwise>
			<table style="width: 100%">
				<tr>
					<td style="width: 20%; vertical-align: top;" class="sidemenutd"><ui:include
							src="smUpdateMofApplnSideMenuItem.xhtml" /></td>
					<td style="vertical-align: top;"><p:outputPanel
							id="updtMofStep3OnlySuppPan"
							rendered="#{backingBean.managedBean.supplierUser}">
							<div align="right" style="width: 99%" class="button-wrapper">
								<ui:include
									src="/xhtml/sm/shared/mofRegistration/deleteApplicationCommonPage.xhtml" />
								<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
									onclick="this.disabled=true;"
									onstart="blockWidget.show()" oncomplete="this.disabled=false;blockWidget.hide();"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
									action="#{backingBean.saveApplicationAsDraft(ParameterConst.newSmApplnForUpdate,backingBean.managedBean.currentPageType)}"
									update=":form" style="margin-bottom:5px;" />
							</div>
						</p:outputPanel> <ui:include
							src="/xhtml/sm/shared/mofRegistration/captialOrEquityStatusInfoForm.xhtml" />
						<c:if
							test="#{backingBean.managedBean.businessTypeVal ne SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROS_DEFAULT}">
							<ui:include
								src="/xhtml/sm/shared/mofRegistration/captialOrEquityShareHolderInfoForm.xhtml" />
							<c:if
								test="#{backingBean.managedBean.businessTypeVal eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_DEFAULT or 
										backingBean.managedBean.businessTypeVal eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_LLP_DEFAULT}">
								<ui:include
									src="/xhtml/sm/shared/mofRegistration/captialOrEquityShareHoldingCompanyInfoForm.xhtml" />
							</c:if>
						</c:if>
						<div class="nav-wrapper">
							<table style="width: 100%">
								<tr>
									<td><div align="left" style="width: 100%">
											<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
												actionListener="#{backingBean.setTabValue('3','2')}"
												action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForUpdate,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUITY,SupplierManagementConst.SM_APPL_PAGE_TYPE_PERSONNEL)}"
												update=":form" />
										</div></td>
									<td><div align="right" style="width: 100%">
											<p:commandButton value="#{lbl['lbl.sm.next.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
												actionListener="#{backingBean.setTabValue('3','4')}"
												action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForUpdate,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUITY,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
												update=":form" />
										</div></td>
								</tr>
							</table>
						</div></td>
				</tr>

			</table>
		</c:otherwise>
	</c:choose>
</ui:composition>
