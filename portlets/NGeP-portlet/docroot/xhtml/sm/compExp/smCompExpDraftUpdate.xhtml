<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_compExp_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{compExpMB.headerTitle}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<div align="left">
			<p:commandButton action="#{compExpBB.redirectToDraft}"
				onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
				partialSubmit="true" process="@this" update=":form"
				value="#{lbl['lbl.sm.comp.exp.draft.btn.back']}"></p:commandButton>
		</div>
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sm.comp.exp.update.instruction']}" />
		<div align="center">
			<table style="table-layout: fixed; width: 100%">
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.project.for']}" /></td>
					<td style="width: 66%"><p:selectOneRadio id="clientType"
							label="#{lbl['lbl.sm.comp.exp.update.project.for']}"
							value="#{compExpMB.selectedDraft.clientType}"
							disabled="#{compExpMB.disableClienType}">
							<p:ajax event="change" update=":form"
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								listener="#{compExpBB.clientTypeChange}" process="@this"
								partialSubmit="true" />
							<f:selectItem
								itemLabel="#{lbl['lbl.sm.comp.exp.update.client.type.federal']}"
								itemValue="#{ParameterConst.clientTypeFederal}"></f:selectItem>
							<f:selectItem
								itemLabel="#{lbl['lbl.sm.comp.exp.update.client.type.other']}"
								itemValue="#{ParameterConst.clientTypeNonFederal}"></f:selectItem>
						</p:selectOneRadio></td>
				</tr>
				<p:outputPanel
					rendered="#{compExpMB.selectedDraft.clientType == ParameterConst.clientTypeFederal}">
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2 mandatory"
								value="#{lbl['lbl.sm.comp.exp.update.ori.agency.name']}" /></td>
						<td style="width: 66%"><p:outputLabel
								styleClass="outputLabel-view mandatory"
								value="#{compExpMB.selectedDraft.oriAgencyName}" /> <p:graphicImage
								id="oriAgencyNameToolTipsId"
								value="/css/images/design/tooltips.png" /> <p:tooltip
								for="oriAgencyNameToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.ori.agency.name.tooltip']}" /></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.update.agency.name']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td style="width: 66%"><p:inputText size="60" id="agencyName"
								value="#{compExpMB.selectedDraft.agencyName}" readonly="true" />
							<p:commandLink partialSubmit="true" process="@this"
								update=":form" action="#{smPtjPopupBB.initPopup}"
								onclick="blockWidget.show()"
								oncomplete="blockWidget.hide(),smPtjPopupWV.show()">
								<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
							</p:commandLink> <p:graphicImage id="agencyNameToolTipsId"
								value="/css/images/design/tooltips.png" /> <p:tooltip
								for="agencyNameToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.agency.name.tooltip']}" /></td>
					</tr>
				</p:outputPanel>
				<p:outputPanel
					rendered="#{compExpMB.selectedDraft.clientType == ParameterConst.clientTypeNonFederal}">
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.update.agency.name']}" /></td>
						<td style="width: 66%"><p:outputLabel
								rendered="#{not empty compExpMB.selectedDraft.agencyName}"
								styleClass="outputLabel-view"
								value="#{compExpMB.selectedDraft.agencyName}" /> <p:inputText
								rendered="#{empty compExpMB.selectedDraft.agencyName}"
								value="#{compExpMB.selectedDraft.agencyName}" /></td>
					</tr>
				</p:outputPanel>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.file.ref.no']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td style="width: 66%"><p:inputText id="fileReferenceNo"
							value="#{compExpMB.selectedDraft.fileReferenceNo}"
							required="true"
							label="#{lbl['lbl.sm.comp.exp.update.file.ref.no']}">
							<p:ajax event="blur" update="fileReferenceNo"
								listener="#{compExpBB.trimFileReferenceNo}"
								process="fileReferenceNo" partialSubmit="true" />
						</p:inputText> <p:spacer width="3px" /> <p:inputText id="fileExtensionNo"
							value="#{compExpMB.selectedDraft.fileExtensionNo}"
							required="true" size="3" maxlength="3"
							label="#{lbl['lbl.sm.comp.exp.update.file.ref.no']}">
							<p:ajax event="blur" update="fileExtensionNo"
								listener="#{compExpBB.trimFileExtensionNo}"
								process="fileExtensionNo" partialSubmit="true" />
						</p:inputText> <p:graphicImage id="fileReferenceNoToolTipsId"
							value="/css/images/design/tooltips.png" /> <p:tooltip
							for="fileReferenceNoToolTipsId">
							<img
								src="/NGeP-portlet/images/suratSetujuTerima_fileReference_tooltip.jpeg" />
						</p:tooltip></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.loa.no']}" /></td>
					<td style="width: 66%"><p:inputText
							value="#{compExpMB.selectedDraft.loaNo}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.project.title']}" /></td>
					<td style="width: 66%"><p:outputLabel
							style="word-wrap: break-word;overflow-wrap: break-word;white-space: normal;"
							styleClass="outputLabel-view"
							value="#{compExpMB.selectedDraft.title}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.contract.value']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{compExpMB.selectedDraft.contractValue}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.payment.method']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{compExpBB.getParameterDesc(compExpMB.selectedDraft.paymentMethod)}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.procument.method']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{compExpBB.getParameterDesc(compExpMB.selectedDraft.procumentMode)}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.contract.eff.date']}" /></td>
					<td style="width: 66%"><h:outputText
							rendered="#{compExpMB.selectedDraft.contractEffDate ne null}"
							styleClass="outputLabel-view"
							value="#{compExpMB.selectedDraft.contractEffDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText> <p:calendar id="contractEffDate"
							label="#{lbl['lbl.sm.comp.exp.update.contract.eff.date']}"
							maxdate="#{compExpMB.maxEffDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							readonlyInput="true"
							rendered="#{compExpMB.selectedDraft.contractEffDate eq null}"
							required="true" showOn="button"
							value="#{compExpMB.contractEffDateTemp}">
							<p:ajax event="dateSelect" update=":form"
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								listener="#{compExpBB.dateChange}" process="@this"
								partialSubmit="true" />
						</p:calendar></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.contract.exp.date']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td style="width: 66%"><p:calendar id="contractExpDate"
							label="#{lbl['lbl.sm.comp.exp.update.contract.exp.date']}"
							mindate="#{compExpMB.minExpDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							readonlyInput="true" required="true" showOn="button"
							value="#{compExpMB.selectedDraft.contractExpDate}">
							<p:ajax event="dateSelect" update=":form"
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								listener="#{compExpBB.dateChange}" process="@this"
								partialSubmit="true" />
						</p:calendar></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.contract.status']}" /></td>
					<td style="width: 66%"><c:if
							test="#{compExpMB.selectedDraft.contractStatus == ParameterConst.contractStatusInactive}">
							<p:outputLabel styleClass="outputLabel-view"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.inactive']}" />
							<p:graphicImage id="contractStatusInactiveToolTipsId"
								value="/css/images/design/tooltips.png" />
							<p:tooltip for="contractStatusInactiveToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.inactive.toolptip']}" />
						</c:if> <c:if
							test="#{compExpMB.selectedDraft.contractStatus == ParameterConst.contractStatusEffective}">
							<p:outputLabel styleClass="outputLabel-view"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.effective']}" />
							<p:graphicImage id="contractStatusEffectiveToolTipsId"
								value="/css/images/design/tooltips.png" />
							<p:tooltip for="contractStatusEffectiveToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.effective.toolptip']}" />
						</c:if> <c:if
							test="#{compExpMB.selectedDraft.contractStatus == ParameterConst.contractStatusExpired}">
							<p:outputLabel styleClass="outputLabel-view"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.expired']}" />
							<p:graphicImage id="contractStatusExpiredToolTipsId"
								value="/css/images/design/tooltips.png" />
							<p:tooltip for="contractStatusExpiredToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.expired.toolptip']}" />
						</c:if></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.supp.doc']}" /></td>
					<td><p:commandLink
							oncomplete="compExpSuppDocUploadDialogWV.show();return false;"
							process="@this" partialSubmit="true" update=":form">
							<p:graphicImage value="/css/images/design/upload.png"
								style="margin-right:2px;" />
						</p:commandLink> <p:graphicImage id="suppDocToolTipsId"
							value="/css/images/design/tooltips.png" /> <p:tooltip
							for="suppDocToolTipsId">
							<img
								src="/NGeP-portlet/images/suratSetujuTerima_suppDoc_tooltip.jpeg" />
						</p:tooltip> <p:outputPanel id="compExpSuppDocListPanelId">
							<ui:repeat value="#{compExpMB.compExpDocList}" var="doc">
								<br />
								<h:commandLink id="file"
									value="#{compExpBB.getShortFileName(doc.fileName)}">
									<p:fileDownload
										value="#{compExpBB.commonDownload(doc.filePath,doc.fileName)}" />
									<f:ajax partialSubmit="true" process="@this" update=":form"
										onclick="blockWidget.show()" oncomplete="blockWidget.hide()" />
								</h:commandLink>
								<p:tooltip for="file" value="#{doc.fileName}" position="top" />
								<p:spacer width="10" />
								<p:commandLink partialSubmit="true" process="@this"
									update=":form"
									action="#{compExpBB.onDeleteSupDocFileAttachment(doc)}"
									onclick="blockWidget.show()" oncomplete="blockWidget.hide()">
									<p:graphicImage value="/css/images/design/trash.png" />
								</p:commandLink>
							</ui:repeat>
						</p:outputPanel></td>
				</tr>
			</table>
		</div>
		<p:panel header="#{lbl['lbl.sm.comp.exp.update.project.cat.code']}"
			toggleable="true">
			<p:dataTable id="compExpCatCodesId" rows="10" rowIndexVar="index"
				value="#{compExpMB.compExpCatCodeList}" var="compExpCatCode"
				widgetVar="compExpCatCodesWV">
				<ac:paginator for="compExpCatCodesId" />
				<p:column style="width:2%">
					<f:facet name="header">
						<p:selectBooleanCheckbox
							disabled="#{not compExpMB.compExpCatCodeListEmpty}"
							value="#{compExpMB.selectedAll}">
							<p:ajax listener="#{compExpBB.selectAllCatCodes}"
								partialSubmit="true" process="@this"
								update=":#{p:component('compExpCatCodesId')}" />
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{compExpMB.selected}"
						disabled="#{not compExpMB.compExpCatCodeListEmpty}">
						<p:ajax listener="#{compExpBB.selectCatCode(index)}"
							partialSubmit="true" process="@this"
							update=":#{p:component('compExpCatCodesId')}" />
					</p:selectBooleanCheckbox>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.projDtls.mainCat']}">
					<h:outputText styleClass="mandatory"
						rendered="#{compExpMB.compExpCatCodeListEmpty}" value="*" />
					<p:selectOneMenu
						disabled="#{not compExpMB.compExpCatCodeListEmpty}"
						label="#{lbl['lbl.sm.projDtls.mainCat']}" required="true"
						value="#{compExpCatCode.categoryL1.categoryL1Id}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems itemLabel="#{main.categoryName}"
							itemValue="#{main.categoryL1Id}"
							value="#{compExpMB.supplierMainCatList}" var="main" />
						<p:ajax event="change" update="@this" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()"
							listener="#{compExpBB.getSupplierSubCatList()}" process="@this"
							partialSubmit="true" />
					</p:selectOneMenu>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.projDtls.subCat']}">
					<h:outputText styleClass="mandatory"
						rendered="#{compExpMB.compExpCatCodeListEmpty}" value="*" />
					<p:selectOneMenu
						disabled="#{not compExpMB.compExpCatCodeListEmpty}"
						label="#{lbl['lbl.sm.projDtls.subCat']}" required="true"
						value="#{compExpCatCode.categoryL1.categoryL1Id}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems itemLabel="#{sub.categoryName}"
							itemValue="#{sub.categoryL2Id}"
							value="#{compExpMB.supplierSubCatList}" var="sub" />
						<p:ajax event="change" update="@this" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()"
							listener="#{compExpBB.getSupplierSubDivCatList()}"
							process="@this" partialSubmit="true" />
					</p:selectOneMenu>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px;" />
			<div align="right">
				<p:commandButton action="#{compExpBB.addCompExpCat()}"
					disabled="#{compExpMB.catCodeNotComplete}"
					onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
					partialSubmit="true" process="@this"
					rendered="#{compExpMB.compExpCatCodeListEmpty}" update=":form"
					value="#{lbl['lbl.sm.button.add']}">
				</p:commandButton>
				<p:commandButton action="#{compExpBB.delCompExpCat()}"
					disabled="#{empty compExpMB.selectedCompExpCatCode}"
					onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
					partialSubmit="true" process="@this"
					rendered="#{compExpMB.compExpCatCodeListEmpty}" update=":form"
					value="#{lbl['lbl.sm.button.delete']}">
				</p:commandButton>
			</div>
		</p:panel>
		<ac:smPtjPopup okAction="compExpBB.selectAgencyAction" />
		<p:dialog dynamic="true" header="#{lbl['lbl.bpm.choose.file']}"
			height="200" id="compExpSuppDocUploadDialogId" modal="true"
			onShow="singleUploadListener(uploadWV);"
			onHide="uploadWV.buttonBar.find('input[type=file]').get(0).disabled=false;"
			styleClass="pop_up_top" resizable="false"
			widgetVar="compExpSuppDocUploadDialogWV" width="700px">
			<p:fileUpload allowTypes="/(\.|\/)(pdf)$/"
				cancelLabel="#{lbl['lbl.btn.cancel']}"
				fileUploadListener="#{compExpBB.handleSupDocFileAttachment}"
				invalidFileMessage="#{lbl['lbl.sm.comp.exp.update.supp.doc.format.errmsg']}"
				invalidSizeMessage="#{lbl['lbl.sm.upload.fileSize.exceed20Mb']}"
				label="#{lbl['lbl.btn.addfile']}" multiple="true"
				showButtons="false"
				sizeLimit="#{SupplierManagementConst.SM_SUPPORTDOCS_FILE_SIZE_LIMIT}"
				update=":#{p:component('compExpSuppDocListPanelId')}"
				uploadLabel="#{lbl['lbl.btn.upload']}" widgetVar="uploadWV" />
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.comp.exp.update.supp.doc.instruction']}"
				escape="false" />
		</p:dialog>
		<p:confirmDialog closable="true"
			header="#{lbl['lbl.sm.upload.delete.confirm.header']}"
			id="confirmDelSuppDocDialogId"
			message="#{lbl['lbl.sm.upload.delete.message']}" severity="alert"
			widgetVar="confirmDelSuppDocDialogWV">
			<div align="right">
				<p:commandButton action="#{compExpBB.delSuppDocFileAttachment}"
					onclick="confirmDelSuppDocDialogWV.hide();"
					oncomplete="blockWidget.hide()" onstart="blockWidget.show()"
					partialSubmit="true" process="@this"
					update=":#{p:component('compExpSuppDocListPanelId')}"
					value="#{lbl['lbl.btn.delete']}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="confirmDelSuppDocDialogWV.hide();" />
			</div>
		</p:confirmDialog>
	</ui:define>
</ui:composition>
