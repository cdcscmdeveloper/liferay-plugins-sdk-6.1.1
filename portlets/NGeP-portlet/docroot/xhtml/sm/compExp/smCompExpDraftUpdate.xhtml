<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_smCompExp_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{smCompExpMB.headerTitle}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<p:messages autoUpdate="true" closable="true" id="messages"
			showDetail="true" showSummary="false" />
		<div align="left">
			<p:commandButton action="#{smCompExpBB.redirectToDraft}"
				onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
				value="#{lbl['lbl.sm.comp.exp.draft.btn.back']}" />
		</div>
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sm.comp.exp.update.instruction']}" />
		<div align="center">
			<table style="table-layout: fixed; width: 100%">
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.project.for']}" /> <p:outputLabel
							rendered="#{!smCompExpMB.disableClienType}"
							styleClass="mandatory" value="*" /></td>
					<td style="width: 66%"><p:selectOneRadio
							disabled="#{smCompExpMB.disableClienType}" id="clientType"
							label="#{lbl['lbl.sm.comp.exp.update.project.for']}"
							value="#{smCompExpMB.selectedDraft.clientType}">
							<p:ajax event="change" listener="#{smCompExpBB.clientTypeChange}"
								oncomplete="blockWidget.hide()" onstart="blockWidget.show()"
								update=":form" process="@form" />
							<f:selectItems value="#{smCompExpMB.clientTypeItems}"></f:selectItems>
						</p:selectOneRadio></td>
				</tr>
				<p:outputPanel
					rendered="#{smCompExpMB.selectedDraft.clientType eq ParameterConst.clientTypeFederal
					and smCompExpMB.selectedDraft.sourceType.parameterId ne ParameterConst.sourceTypeIdCt}">
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2 mandatory"
								value="#{lbl['lbl.sm.comp.exp.update.ori.agency.name']}" /></td>
						<td style="width: 66%"><p:outputLabel
								styleClass="outputLabel-view mandatory"
								value="#{smCompExpMB.selectedDraft.oriAgencyName}" /> <p:graphicImage
								id="oriAgencyNameToolTipsId"
								value="/css/images/design/tooltips.png" /> <p:tooltip
								for="oriAgencyNameToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.ori.agency.name.tooltip']}" /></td>
					</tr>
				</p:outputPanel>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.agency.name']}" /> <p:outputLabel
							styleClass="mandatory" value="*"
							rendered="#{smCompExpMB.selectedDraft.sourceType.parameterId ne ParameterConst.sourceTypeIdCt}" /></td>
					<td style="width: 66%"><p:inputText id="agencyName"
							readonly="#{smCompExpMB.selectedDraft.clientType eq null or smCompExpMB.selectedDraft.agencyName ne null
							or smCompExpMB.selectedDraft.clientType eq ParameterConst.clientTypeFederal}"
							size="60" value="#{smCompExpMB.selectedDraft.agencyName}" /> <p:outputPanel
							rendered="#{smCompExpMB.selectedDraft.clientType eq ParameterConst.clientTypeFederal
							and smCompExpMB.selectedDraft.sourceType.parameterId ne ParameterConst.sourceTypeIdCt}">
							<p:commandLink action="#{smPtjPopupBB.initPtjPopup}"
								oncomplete="blockWidget.hide(),smPtjPopupWV.show()"
								onclick="blockWidget.show()" update=":form" process="@form">
								<p:graphicImage value="/css/images/design/search.png" />
								<p:graphicImage id="agencyNameToolTipsId"
									value="/css/images/design/tooltips.png" />
								<p:tooltip for="agencyNameToolTipsId"
									value="#{lbl['lbl.sm.comp.exp.update.agency.name.tooltip']}" />
							</p:commandLink>
						</p:outputPanel></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.file.ref.no']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td style="width: 66%"><p:inputText id="fileReferenceNo"
							label="#{lbl['lbl.sm.comp.exp.update.file.ref.no']}"
							value="#{smCompExpMB.selectedDraft.fileReferenceNo}">
							<p:ajax event="blur"
								listener="#{smCompExpBB.trimFileReferenceNo}"
								update="fileReferenceNo" />
						</p:inputText> <p:spacer width="3px" /> <p:inputText id="fileExtensionNo"
							label="#{lbl['lbl.sm.comp.exp.update.file.ref.no']}"
							maxlength="3" size="3"
							value="#{smCompExpMB.selectedDraft.fileExtensionNo}">
							<p:ajax event="blur"
								listener="#{smCompExpBB.trimFileExtensionNo}"
								update="fileExtensionNo" />
						</p:inputText> <p:graphicImage id="fileReferenceNoToolTipsId"
							value="/css/images/design/tooltips.png" /> <p:tooltip
							for="fileReferenceNoToolTipsId">
							<img
								src="/NGeP-portlet/images/suratSetujuTerima_fileReference_tooltip.jpeg" />
						</p:tooltip></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.loa.no']}" /></td>
					<td style="width: 66%"><p:inputText
							readonly="#{smCompExpMB.selectedDraft.sourceType.parameterId eq ParameterConst.sourceTypeIdCt
							and smCompExpMB.selectedDraft.loaNo ne null}"
							value="#{smCompExpMB.selectedDraft.loaNo}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.draft.table.title']}" /></td>
					<td style="width: 66%"><p:outputLabel
							style="word-wrap: break-word;overflow-wrap: break-word;white-space: normal;"
							styleClass="outputLabel-view"
							value="#{smCompExpMB.selectedDraft.title}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.draft.table.value']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{smCompExpMB.selectedDraft.contractValue}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.payment.method']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{smCompExpBB.getParameterDesc(smCompExpMB.selectedDraft.paymentMethod)}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.procument.method']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{smCompExpBB.getParameterDesc(smCompExpMB.selectedDraft.procumentMode)}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.draft.table.eff.date']}" /> <p:outputLabel
							rendered="#{smCompExpMB.selectedDraft.contractEffDate eq null}"
							value="*" styleClass="mandatory" /></td>
					<td style="width: 66%"><h:outputText
							rendered="#{smCompExpMB.selectedDraft.contractEffDate ne null}"
							styleClass="outputLabel-view"
							value="#{smCompExpMB.selectedDraft.contractEffDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText> <p:calendar id="contractEffDate"
							label="#{lbl['lbl.sm.comp.exp.draft.table.eff.date']}"
							maxdate="#{smCompExpMB.maxEffDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							readonlyInput="true"
							rendered="#{smCompExpMB.selectedDraft.contractEffDate eq null}"
							showOn="button" value="#{smCompExpMB.contractEffDateTemp}">
							<p:ajax event="dateSelect" listener="#{smCompExpBB.dateChange}"
								oncomplete="blockWidget.hide()" onstart="blockWidget.show()"
								process="@form" update=":form" />
						</p:calendar></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.contract.exp.date']}" /> <p:outputLabel
							value="*" styleClass="mandatory"
							rendered="#{smCompExpMB.selectedDraft.sourceType.parameterId ne ParameterConst.sourceTypeIdCt}" /></td>
					<td style="width: 66%"><h:outputText
							rendered="#{smCompExpMB.selectedDraft.sourceType.parameterId eq ParameterConst.sourceTypeIdCt}"
							styleClass="outputLabel-view"
							value="#{smCompExpMB.selectedDraft.contractExpDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText> <p:calendar id="contractExpDate"
							label="#{lbl['lbl.sm.comp.exp.update.contract.exp.date']}"
							mindate="#{smCompExpMB.minExpDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							readonlyInput="true" showOn="button"
							value="#{smCompExpMB.selectedDraft.contractExpDate}"
							rendered="#{smCompExpMB.selectedDraft.sourceType.parameterId ne ParameterConst.sourceTypeIdCt}">
							<p:ajax event="dateSelect" listener="#{smCompExpBB.dateChange}"
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								process="@form" update=":form" />
						</p:calendar></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.contract.status']}" /></td>
					<td style="width: 66%"><c:if
							test="#{smCompExpMB.selectedDraft.contractStatus eq ParameterConst.contractStatusInactive}">
							<p:outputLabel styleClass="outputLabel-view"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.inactive']}" />
							<p:graphicImage id="contractStatusInactiveToolTipsId"
								value="/css/images/design/tooltips.png" />
							<p:tooltip for="contractStatusInactiveToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.inactive.toolptip']}" />
						</c:if> <c:if
							test="#{smCompExpMB.selectedDraft.contractStatus eq ParameterConst.contractStatusEffective}">
							<p:outputLabel styleClass="outputLabel-view"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.effective']}" />
							<p:graphicImage id="contractStatusEffectiveToolTipsId"
								value="/css/images/design/tooltips.png" />
							<p:tooltip for="contractStatusEffectiveToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.effective.toolptip']}" />
						</c:if> <c:if
							test="#{smCompExpMB.selectedDraft.contractStatus eq ParameterConst.contractStatusExpired}">
							<p:outputLabel styleClass="outputLabel-view"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.expired']}" />
							<p:graphicImage id="contractStatusExpiredToolTipsId"
								value="/css/images/design/tooltips.png" />
							<p:tooltip for="contractStatusExpiredToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.expired.toolptip']}" />
						</c:if> <c:if
							test="#{smCompExpMB.selectedDraft.contractStatus eq ParameterConst.contractStatusTerminated}">
							<p:outputLabel styleClass="outputLabel-view"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.terminated']}" />
						</c:if></td>
				</tr>
				<p:outputPanel
					rendered="#{smCompExpMB.selectedDraft.sourceType.parameterId ne ParameterConst.sourceTypeIdCt}">
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.update.supp.doc']}" /></td>
						<td><p:commandLink id="suppDoc" onclick="blockWidget.show()"
								oncomplete="smCompExpSuppDocUploadDialogWV.show();return false;blockWidget.hide()"
								process="@form" update=":form">
								<p:graphicImage value="/css/images/design/upload.png"
									style="margin-right:2px;" />
							</p:commandLink> <p:graphicImage id="suppDocToolTipsId"
								value="/css/images/design/tooltips.png" /> <p:tooltip
								for="suppDocToolTipsId">
								<img
									src="/NGeP-portlet/images/suratSetujuTerima_suppDoc_tooltip.jpeg" />
							</p:tooltip> <p:outputPanel id="smCompExpSuppDocListPanelId">
								<ui:repeat value="#{smCompExpMB.smCompExpDocList}" var="doc">
									<br />
									<h:commandLink id="file"
										value="#{smCompExpBB.getShortFileName(doc.fileName)}">
										<p:fileDownload
											value="#{smCompExpBB.commonDownload(doc.filePath,doc.fileName)}" />
										<f:ajax process="@form" update=":form"
											onclick="blockWidget.show()" oncomplete="blockWidget.hide()" />
									</h:commandLink>
									<p:tooltip for="file" value="#{doc.fileName}" position="top" />
									<p:spacer width="10" />
									<p:commandLink process="@form" update=":form"
										action="#{smCompExpBB.onDeleteSupDocFileAttachment(doc)}"
										onclick="blockWidget.show()" oncomplete="blockWidget.hide()">
										<p:graphicImage value="/css/images/design/trash.png" />
									</p:commandLink>
								</ui:repeat>
							</p:outputPanel></td>
					</tr>
				</p:outputPanel>
			</table>
			<p:panel header="#{lbl['lbl.sm.comp.exp.update.project.cat.code']}"
				toggleable="true">
				<p:dataTable id="smCompExpCatCodes" rows="10" rowIndexVar="index"
					value="#{smCompExpMB.smCompExpCatDraftList}" var="smCompExpCatCode"
					widgetVar="smCompExpCatCodesWV">
					<ac:paginator for="smCompExpCatCodes" />
					<c:if test="#{smCompExpMB.smCompExpCatDraftListEmpty}">
						<p:column style="width:2%">
							<f:facet name="header">
								<p:selectBooleanCheckbox value="#{smCompExpMB.selectedAll}">
									<p:ajax listener="#{smCompExpBB.selectAllDraftCatCodes}"
										update=":#{p:component('smCompExpCatCodes')}, :#{p:component('delCatBtn')}" />
								</p:selectBooleanCheckbox>
							</f:facet>
							<p:selectBooleanCheckbox value="#{smCompExpCatCode.selected}">
								<p:ajax listener="#{smCompExpBB.selectDraftCatCode(index)}"
									update=":#{p:component('smCompExpCatCodes')}, :#{p:component('delCatBtn')}" />
							</p:selectBooleanCheckbox>
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.projDtls.mainCat']}">
							<h:outputText styleClass="mandatory" value="*" />
							<p:selectOneMenu id="mainDDId"
								label="#{lbl['lbl.sm.projDtls.mainCat']}"
								value="#{smCompExpCatCode.categoryL1.categoryL1Id}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems itemLabel="#{main.categoryName}"
									itemValue="#{main.categoryL1Id}"
									value="#{smCompExpMB.supplierMainCatList}" var="main" />
								<p:ajax event="change" update="subDDId,subDivDDId"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									listener="#{smCompExpBB.getSupplierSubCatList(smCompExpCatCode.categoryL1.categoryL1Id, index)}" />
							</p:selectOneMenu>
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.projDtls.subCat']}">
							<h:outputText styleClass="mandatory" value="*" />
							<p:selectOneMenu id="subDDId"
								label="#{lbl['lbl.sm.projDtls.subCat']}"
								value="#{smCompExpCatCode.categoryL2.categoryL2Id}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems itemLabel="#{sub.categoryName}"
									itemValue="#{sub.categoryL2Id}"
									value="#{smCompExpMB.supplierSubCatList}" var="sub" />
								<p:ajax event="change" update="subDivDDId"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									listener="#{smCompExpBB.getSupplierSubDivCatList(smCompExpCatCode.categoryL2.categoryL2Id, index)}" />
							</p:selectOneMenu>
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.projDtls.subCatDiv']}">
							<h:outputText styleClass="mandatory" value="*" />
							<p:selectOneMenu id="subDivDDId"
								label="#{lbl['lbl.sm.projDtls.subCatDiv']}"
								value="#{smCompExpCatCode.categoryL3.categoryL3Id}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems itemLabel="#{subDiv.categoryName}"
									itemValue="#{subDiv.categoryL3Id}"
									value="#{smCompExpMB.supplierSubDivCatList}" var="subDiv" />
								<p:ajax event="change"
									update=":#{p:component('smCompExpCatCodes')}, :#{p:component('addCatBtn')}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									listener="#{smCompExpBB.checkDuplicateDraftCatCode(smCompExpCatCode.categoryL3.categoryL3Id, index)}" />
							</p:selectOneMenu>
						</p:column>
					</c:if>
					<c:if test="#{!smCompExpMB.smCompExpCatDraftListEmpty}">
						<p:column headerText="#{lbl['lbl.sm.projDtls.mainCat']}">
							<h:outputText value="#{smCompExpCatCode.categoryL1Name}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.projDtls.subCat']}">
							<h:outputText value="#{smCompExpCatCode.categoryL2Name}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.projDtls.subCatDiv']}">
							<h:outputText value="#{smCompExpCatCode.categoryL3Name}" />
						</p:column>
					</c:if>
				</p:dataTable>
				<div align="right">
					<p:commandButton id="addCatBtn"
						action="#{smCompExpBB.addSmCompExpCatDraft}"
						disabled="#{smCompExpMB.smCompExpCatDrafNotComplete}"
						onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
						rendered="#{smCompExpMB.smCompExpCatDraftListEmpty}"
						update=":#{p:component('smCompExpCatCodes')}, @this"
						value="#{lbl['lbl.sm.button.add']}">
					</p:commandButton>
					<p:commandButton id="delCatBtn"
						disabled="#{empty smCompExpMB.selectedSmCompExpCatDraft}"
						onclick="confirmDelSelectedCatDialogWV.show()" process="@this"
						rendered="#{smCompExpMB.smCompExpCatDraftListEmpty}"
						value="#{lbl['lbl.sm.button.delete']}">
					</p:commandButton>
				</div>
			</p:panel>
		</div>
		<table>
			<tr>
				<td><p:selectBooleanCheckbox
						value="#{smCompExpMB.agreeDeclare}">
						<p:ajax update="btnDeclare" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()" />
					</p:selectBooleanCheckbox></td>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.comp.exp.update.agree']}" /></td>
			</tr>
		</table>
		<div align="right">
			<p:commandButton id="btnDelete"
				value="#{lbl['lbl.sm.comp.exp.update.delete.btn']}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				action="#{smCompExpBB.onDeleteDraft}"
				rendered="#{smCompExpMB.selectedDraft.sourceType.parameterId ne ParameterConst.sourceTypeIdCt}" />
			<p:commandButton id="btnDeclare"
				value="#{lbl['lbl.sm.comp.exp.update.declare.btn']}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				partialSubmit="true" disabled="#{!smCompExpMB.agreeDeclare}"
				update="@form" action="#{smCompExpBB.onDeclareDraft}" />
		</div>
		<ac:smPtjPopup okAction="smCompExpBB.selectAgencyAction" />
		<p:dialog dynamic="true" header="#{lbl['lbl.bpm.choose.file']}"
			height="200" id="smCompExpSuppDocUploadDialogId" modal="true"
			onShow="singleUploadListener(uploadWV);"
			onHide="uploadWV.buttonBar.find('input[type=file]').get(0).disabled=false;"
			styleClass="pop_up_top" resizable="false"
			widgetVar="smCompExpSuppDocUploadDialogWV" width="700px">
			<p:fileUpload allowTypes="/(\.|\/)(pdf)$/"
				cancelLabel="#{lbl['lbl.btn.cancel']}"
				fileUploadListener="#{smCompExpBB.handleSupDocFileAttachment}"
				invalidFileMessage="#{lbl['lbl.sm.comp.exp.update.supp.doc.format.errmsg']}"
				invalidSizeMessage="#{lbl['lbl.sm.upload.fileSize.exceed20Mb']}"
				label="#{lbl['lbl.btn.addfile']}" multiple="true"
				showButtons="false"
				sizeLimit="#{SupplierManagementConst.SM_SUPPORTDOCS_FILE_SIZE_LIMIT}"
				update=":#{p:component('smCompExpSuppDocListPanelId')}"
				uploadLabel="#{lbl['lbl.btn.upload']}" widgetVar="uploadWV" />
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.comp.exp.update.supp.doc.instruction']}"
				escape="false" />
		</p:dialog>
		<p:confirmDialog closable="true"
			header="#{lbl['lbl.sm.upload.delete.confirm.header']}"
			id="confirmDelSuppDocDialogId"
			message="#{lbl['lbl.sm.upload.delete.message']}" severity="alert"
			widgetVar="confirmDelSuppDocDialogWV">
			<div align="right">
				<p:commandButton action="#{smCompExpBB.delSuppDocFileAttachment}"
					onclick="confirmDelSuppDocDialogWV.hide();"
					oncomplete="blockWidget.hide()" onstart="blockWidget.show()"
					update=":#{p:component('smCompExpSuppDocListPanelId')}"
					value="#{lbl['lbl.sm.comp.exp.yes.btn']}" />
				<p:commandButton value="#{lbl['lbl.sm.comp.exp.no.btn']}"
					onclick="confirmDelSuppDocDialogWV.hide();" />
			</div>
		</p:confirmDialog>
		<p:confirmDialog closable="true"
			header="#{lbl['lbl.sm.upload.delete.confirm.header']}"
			id="confirmDelSelectedCatId"
			message="#{lbl['lbl.sm.upload.delete.message']}" severity="alert"
			widgetVar="confirmDelSelectedCatDialogWV">
			<div align="right">
				<p:commandButton action="#{smCompExpBB.delSmCompExpCatDraft}"
