				invalidSizeMessage="#{lbl['lbl.sm.upload.fileSize.exceed20Mb']}"
				label="#{lbl['lbl.btn.addfile']}" multiple="true"

				sizeLimit="#{SupplierManagementConst.SM_SUPPORTDOCS_FILE_SIZE_LIMIT}"

					onclick="confirmDelSuppDocDialogWV.hide();" />
