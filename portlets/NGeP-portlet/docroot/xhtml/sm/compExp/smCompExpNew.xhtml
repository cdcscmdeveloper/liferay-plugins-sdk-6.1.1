<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_smCompExp_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{smCompExpMB.headerTitle}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<p:messages autoUpdate="true" closable="true" id="messages"
			showDetail="true" showSummary="false" />
		<div align="left">
			<p:commandButton action="#{smCompExpBB.proceedAfterTnC}"
				onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
				value="#{lbl['lbl.sm.comp.exp.draft.btn.back']}" />
		</div>
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sm.comp.exp.add.new.instruction']}" escape="false" />
		<div align="center">
			<table style="table-layout: fixed; width: 100%">
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.project.for']}" /> <p:outputLabel
							styleClass="mandatory" value="*" /></td>
					<td style="width: 66%"><p:selectOneRadio id="clientType"
							label="#{lbl['lbl.sm.comp.exp.update.project.for']}"
							value="#{smCompExpMB.newMaster.clientType}">
							<p:ajax event="change" oncomplete="blockWidget.hide()"
								listener="#{smCompExpBB.clientTypeChange}"
								onstart="blockWidget.show()" update=":form" process="@form" />
							<f:selectItems value="#{smCompExpMB.clientTypeItems}"></f:selectItems>
						</p:selectOneRadio> <p:graphicImage
							rendered="#{smCompExpMB.newMaster.clientType ne null}"
							id="projectForToolTipsId" value="/css/images/design/tooltips.png" />
						<p:tooltip for="projectForToolTipsId">
							<p:outputLabel escape="false"
								style="text-align: left !important;"
								rendered="#{smCompExpMB.newMaster.clientType eq ParameterConst.clientTypeFederal}"
								value="#{lbl['lbl.sm.comp.exp.add.new.fed.tooltip']}" />
							<p:outputLabel escape="false"
								style="text-align: left !important;"
								rendered="#{smCompExpMB.newMaster.clientType eq ParameterConst.clientTypeNonFederal}"
								value="#{lbl['lbl.sm.comp.exp.add.new.non.fed.tooltip']}" />
						</p:tooltip></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.agency.name']}" /> <p:outputLabel
							styleClass="mandatory" value="*" /></td>
					<td style="width: 66%"><p:inputText id="agencyName" size="60"
							readonly="#{smCompExpMB.newMaster.clientType eq null or smCompExpMB.newMaster.clientType eq ParameterConst.clientTypeFederal}"
							value="#{smCompExpMB.newMaster.agencyName}" /> <p:outputPanel
							rendered="#{smCompExpMB.newMaster.clientType eq ParameterConst.clientTypeFederal}">
							<p:commandLink action="#{smPtjPopupBB.initPtjPopup}"
								oncomplete="blockWidget.hide(),smPtjPopupWV.show()"
								onclick="blockWidget.show()" update=":form" process="@form">
								<p:graphicImage value="/css/images/design/search.png" />
							</p:commandLink>
						</p:outputPanel> <p:graphicImage
							rendered="#{smCompExpMB.newMaster.clientType ne null}"
							id="agencyNameToolTipsId" value="/css/images/design/tooltips.png" />
						<p:tooltip for="agencyNameToolTipsId">
							<p:outputLabel escape="false"
								style="text-align: left !important;"
								rendered="#{smCompExpMB.newMaster.clientType eq ParameterConst.clientTypeFederal}"
								value="#{lbl['lbl.sm.comp.exp.add.new.agency.name.fed.tooltip']}" />
							<p:outputLabel escape="false"
								style="text-align: left !important;"
								rendered="#{smCompExpMB.newMaster.clientType eq ParameterConst.clientTypeNonFederal}"
								value="#{lbl['lbl.sm.comp.exp.add.new.agency.name.non.fed.tooltip']}" />
						</p:tooltip></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.file.ref.no']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td style="width: 66%"><p:inputText id="fileReferenceNo"
							label="#{lbl['lbl.sm.comp.exp.update.file.ref.no']}"
							value="#{smCompExpMB.newMaster.fileReferenceNo}">
							<p:ajax event="blur"
								listener="#{smCompExpBB.trimFileReferenceNo}"
								update="fileReferenceNo" />
						</p:inputText> <p:spacer width="3px" /> <p:inputText id="fileExtensionNo"
							label="#{lbl['lbl.sm.comp.exp.update.file.ref.no']}"
							maxlength="3" size="3"
							value="#{smCompExpMB.newMaster.fileExtensionNo}">
							<p:ajax event="blur"
								listener="#{smCompExpBB.trimFileExtensionNo}"
								update="fileExtensionNo" />
						</p:inputText> <p:graphicImage id="fileReferenceNoToolTipsId"
							value="/css/images/design/tooltips.png" /> <p:tooltip
							for="fileReferenceNoToolTipsId">
							<img
								src="/NGeP-portlet/images/suratSetujuTerima_fileReference_tooltip.jpeg" />
						</p:tooltip></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.loa.no']}" /></td>
					<td style="width: 66%"><p:inputText maxlength="20" size="20"
							value="#{smCompExpMB.newMaster.loaNo}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.draft.table.title']}" /> <p:outputLabel
							styleClass="mandatory" value="*" /></td>
					<td style="width: 66%"><p:inputTextarea cols="100"
							maxlength="1000" value="#{smCompExpMB.newMaster.title}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.draft.table.value']}" /> <p:outputLabel
							styleClass="mandatory" value="*" /></td>
					<td style="width: 66%"><p:inputText
							value="#{smCompExpMB.newMaster.contractValue}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.payment.method']}" /></td>
					<td style="width: 66%"><p:selectOneMenu
							value="#{smCompExpMB.newMaster.paymentMethod.parameterId}">
							<f:selectItems
								value="#{smCompExpBB.getDropdownValues(ParameterConst.paramTypePaymentMethod)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.procument.method']}" /> <p:outputLabel
							styleClass="mandatory" value="*" /></td>
					<td style="width: 66%"><p:selectOneMenu
							value="#{smCompExpMB.newMaster.procumentMode.parameterId}">
							<f:selectItems
								value="#{smCompExpBB.getDropdownValues(ParameterConst.paramTypeProcurementMode)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.draft.table.eff.date']}" /> <p:outputLabel
							styleClass="mandatory" value="*" /></td>
					<td style="width: 66%"><p:calendar id="contractEffDate"
							label="#{lbl['lbl.sm.comp.exp.draft.table.eff.date']}"
							maxdate="#{smCompExpMB.maxEffDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							readonlyInput="true" showOn="button"
							value="#{smCompExpMB.newMaster.contractEffDate}">
							<p:ajax event="dateSelect" listener="#{smCompExpBB.dateChange}"
								oncomplete="blockWidget.hide()" onstart="blockWidget.show()"
								process="@form" update=":form" />
						</p:calendar></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.contract.exp.date']}" /> <p:outputLabel
							styleClass="mandatory" value="*" /></td>
					<td style="width: 66%"><p:calendar id="contractExpDate"
							label="#{lbl['lbl.sm.comp.exp.update.contract.exp.date']}"
							mindate="#{smCompExpMB.minExpDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							readonlyInput="true" showOn="button"
							value="#{smCompExpMB.newMaster.contractExpDate}">
							<p:ajax event="dateSelect" listener="#{smCompExpBB.dateChange}"
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								process="@form" update=":form" />
						</p:calendar></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.contract.status']}" /></td>
					<td style="width: 66%"><c:if
							test="#{smCompExpMB.newMaster.contractStatus eq ParameterConst.contractStatusInactive}">
							<p:outputLabel styleClass="outputLabel-view"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.inactive']}" />
							<p:graphicImage id="contractStatusInactiveToolTipsId"
								value="/css/images/design/tooltips.png" />
							<p:tooltip for="contractStatusInactiveToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.inactive.tooltip']}" />
						</c:if> <c:if
							test="#{smCompExpMB.newMaster.contractStatus eq ParameterConst.contractStatusEffective}">
							<p:outputLabel styleClass="outputLabel-view"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.effective']}" />
							<p:graphicImage id="contractStatusEffectiveToolTipsId"
								value="/css/images/design/tooltips.png" />
							<p:tooltip for="contractStatusEffectiveToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.effective.tooltip']}" />
						</c:if> <c:if
							test="#{smCompExpMB.newMaster.contractStatus eq ParameterConst.contractStatusExpired}">
							<p:outputLabel styleClass="outputLabel-view"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.expired']}" />
							<p:graphicImage id="contractStatusExpiredToolTipsId"
								value="/css/images/design/tooltips.png" />
							<p:tooltip for="contractStatusExpiredToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.contract.status.expired.tooltip']}" />
						</c:if></td>
				</tr>
				<p:outputPanel rendered="#{smCompExpMB.consultant}">
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.update.proj.loc']}" /> <p:outputLabel
								styleClass="mandatory" value="*" /></td>
						<td style="width: 66%"><p:inputText
								styleClass="outputLabel-view"
								value="#{smCompExpMB.newMaster.projectLoc}" /></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.update.serv.provide']}" /> <p:outputLabel
								styleClass="mandatory" value="*" /></td>
						<td style="width: 66%"><p:inputText
								styleClass="outputLabel-view"
								value="#{smCompExpMB.newMaster.workServDesc}" /></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.update.consultant.fee']}" /> <p:outputLabel
								styleClass="mandatory" value="*" /></td>
						<td style="width: 66%"><p:inputText
								value="#{smCompExpMB.newMaster.consultanFee}">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>
					</tr>
				</p:outputPanel>
			</table>
		</div>
		<p:panel header="#{lbl['lbl.sm.comp.exp.update.project.cat.code']}"
			toggleable="true">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.comp.exp.add.new.cat.code.instruction']}" />
			<p:dataTable id="smCompExpCatCodes" rows="10" rowIndexVar="index"
				value="#{smCompExpMB.newMaster.compExpMasterCats}"
				var="smCompExpCatCode" widgetVar="smCompExpCatCodesWV">
				<p:column style="width:2%">
					<f:facet name="header">
						<p:selectBooleanCheckbox value="#{smCompExpMB.selectedAll}">
							<p:ajax listener="#{smCompExpBB.selectAllMasterCatCodes}"
								update=":#{p:component('smCompExpCatCodes')}, :#{p:component('delCatBtn')}" />
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{smCompExpCatCode.selected}">
						<p:ajax listener="#{smCompExpBB.selectMasterCatCode(index)}"
							update=":#{p:component('smCompExpCatCodes')}, :#{p:component('delCatBtn')}" />
					</p:selectBooleanCheckbox>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.projDtls.mainCat']}">
					<h:outputText styleClass="mandatory" value="*" />
					<p:selectOneMenu id="mainDDId"
						label="#{lbl['lbl.sm.projDtls.mainCat']}"
						value="#{smCompExpCatCode.categoryL1.categoryL1Id}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems itemLabel="#{main.categoryName}"
							itemValue="#{main.categoryL1Id}"
							value="#{smCompExpMB.supplierMainCatList}" var="main" />
						<p:ajax event="change" update="subDDId,subDivDDId"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							listener="#{smCompExpBB.getSupplierSubCatList(smCompExpCatCode.categoryL1.categoryL1Id, index)}" />
					</p:selectOneMenu>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.projDtls.subCat']}">
					<h:outputText styleClass="mandatory" value="*" />
					<p:selectOneMenu id="subDDId"
						label="#{lbl['lbl.sm.projDtls.subCat']}"
						value="#{smCompExpCatCode.categoryL2.categoryL2Id}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems itemLabel="#{sub.categoryName}"
							itemValue="#{sub.categoryL2Id}"
							value="#{smCompExpMB.supplierSubCatList}" var="sub" />
						<p:ajax event="change" update="subDivDDId"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							listener="#{smCompExpBB.getSupplierSubDivCatList(smCompExpCatCode.categoryL2.categoryL2Id, index)}" />
					</p:selectOneMenu>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.projDtls.subCatDiv']}">
					<h:outputText styleClass="mandatory" value="*" />
					<p:selectOneMenu id="subDivDDId"
						label="#{lbl['lbl.sm.projDtls.subCatDiv']}"
						value="#{smCompExpCatCode.categoryL3.categoryL3Id}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems itemLabel="#{subDiv.categoryName}"
							itemValue="#{subDiv.categoryL3Id}"
							value="#{smCompExpMB.supplierSubDivCatList}" var="subDiv" />
						<p:ajax event="change"
							update=":#{p:component('smCompExpCatCodes')}, :#{p:component('addCatBtn')}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							listener="#{smCompExpBB.checkDuplicateMasterCatCode(smCompExpCatCode.categoryL3.categoryL3Id, index)}" />
					</p:selectOneMenu>
				</p:column>
			</p:dataTable>
			<div align="right">
				<p:commandButton id="addCatBtn"
					action="#{smCompExpBB.addSmCompExpCatMaster}"
					disabled="#{smCompExpMB.smCompExpCatMasterNotComplete}"
					onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
					update=":#{p:component('smCompExpCatCodes')}, @this"
					value="#{lbl['lbl.sm.button.add']}">
				</p:commandButton>
				<p:commandButton id="delCatBtn"
					disabled="#{empty smCompExpMB.selectedSmCompExpCatMaster}"
					onclick="confirmDelSelectedCatDialogWV.show()" process="@this"
					value="#{lbl['lbl.sm.button.delete']}">
				</p:commandButton>
			</div>
		</p:panel>
		<table style="table-layout: fixed; width: 100%">
			<td style="width: 34%"><p:outputLabel
					styleClass="outputLabel-view-label2"
					value="#{lbl['lbl.sm.comp.exp.update.supp.doc']}" /> <p:outputLabel
					styleClass="mandatory" value="*" /></td>
			<td style="width: 66%"></td>
		</table>
		<div align="right">
			<p:commandButton action="#{smCompExpBB.proceedAfterTnC}"
				onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
				value="#{lbl['lbl.sm.comp.exp.add.new.cancel']}" />
		</div>
		<ac:smPtjPopup okAction="smCompExpBB.selectAgencyAction" />
	</ui:define>
</ui:composition>
