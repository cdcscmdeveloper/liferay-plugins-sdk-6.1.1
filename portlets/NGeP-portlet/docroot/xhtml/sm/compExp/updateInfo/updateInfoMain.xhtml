<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_smCompExp_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.sm.comp.exp.screen.name']}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<p:outputPanel rendered="#{smCompExpMB.draftExist}">
			<p:graphicImage value="/css/images/priority.png" />
			<p:spacer width="3" />
			<h:outputText style="color:blue;"
				value="#{lbl['lbl.sm.comp.exp.update.draft.link.part.one']}" />
			<p:commandLink action="#{smCompExpBB.redirectToDraft}"
				oncomplete="blockWidget.hide()" onstart="blockWidget.show()"
				partialSubmit="true" process="@this" update=":form">
				<u><h:outputText style="color:blue;"
						value="#{lbl['lbl.sm.comp.exp.update.draft.link.part.two']}" /></u>
			</p:commandLink>
		</p:outputPanel>
	</ui:define>
</ui:composition>
