<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:f="http://java.sun.com/jsf/core">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_smCompExp_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.sm.comp.exp.update.draft.screen.name']}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<div align="left">
			<p:commandButton action="#{smCompExpBB.proceedAfterUpdateTnC}"
				onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
				value="#{lbl['lbl.sm.comp.exp.update.back']}" />
		</div>
		<p:panel header="#{lbl['lbl.sm.comp.exp.update.draft.sm.header']}"
			toggleable="true">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.comp.exp.update.draft.sm.instruction']}" />
			<p:dataTable
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				id="draftSmDataTable" lazy="true" rowIndexVar="index" rows="10"
				value="#{smCompExpMB.draftSmDataModel}" var="draftSm">
				<ac:paginator for="draftSmDataTable" />
				<p:columnGroup type="header">
					<p:row>
						<p:column headerText="#{lbl['lbl.sm.comp.exp.update.no']}"
							style="text-align: center !important;" />
						<p:column headerText="#{lbl['lbl.sm.comp.exp.update.title']}"
							style="text-align: center !important;" />
						<p:column headerText="#{lbl['lbl.sm.comp.exp.update.value']}"
							style="text-align: center !important;" />
						<p:column headerText="#{lbl['lbl.sm.comp.exp.update.eff.date']}"
							style="text-align: center !important;" />
						<p:column headerText="#{lbl['lbl.sm.comp.exp.update.action']}"
							style="text-align: center !important;" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column
					style="word-wrap: break-word;overflow-wrap: break-word;white-space: normal;">
					<h:outputText value="#{draftSm.title}" />
				</p:column>
				<p:column>
					<h:outputText value="#{draftSm.contractValue}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText value="#{draftSm.contractEffDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<p:commandLink
						action="#{smCompExpBB.redirectToDraftEdit(draftSm)}"
						oncomplete="blockWidget.hide()" onstart="blockWidget.show()"
						partialSubmit="true" process="@this" update=":form">
						<p:graphicImage value="/css/images/design/edit.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
