<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_smCompExp_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{smCompExpMB.editHeader}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<p:messages autoUpdate="true" closable="true" id="messages"
			showDetail="true" showSummary="false" />
		<div align="left">
			<p:commandButton action="#{smCompExpBB.redirectToDraftMain}"
				onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
				value="#{lbl['lbl.sm.comp.exp.update.back']}" />
		</div>
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sm.comp.exp.update.draft.edit.instruction']}" />
		<div align="center">
			<table style="table-layout: fixed; width: 100%">
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.project.done']}" /> <p:outputLabel
							styleClass="mandatory" value="*" /></td>
					<td style="width: 66%"><p:selectOneRadio
							disabled="#{smCompExpMB.disableClienType}"
							value="#{smCompExpMB.draft.clientType}">
							<f:selectItems value="#{smCompExpMB.clientTypeItems}"></f:selectItems>
							<p:ajax event="change" listener="#{smCompExpBB.clientTypeChange}"
								oncomplete="blockWidget.hide()" onstart="blockWidget.show()"
								update=":form" process="@form" />
						</p:selectOneRadio></td>
				</tr>
				<p:outputPanel id="oriAgencyPanel"
					rendered="#{smCompExpMB.draft.clientType eq ParameterConst.clientTypeFederal and smCompExpMB.draft.oriAgencyName ne null}">
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2 mandatory"
								value="#{lbl['lbl.sm.comp.exp.update.ori.agency.name']}" /></td>
						<td style="width: 66%"><p:outputLabel
								styleClass="outputLabel-view mandatory"
								value="#{smCompExpMB.draft.oriAgencyName}" /> <p:graphicImage
								id="oriAgencyNameToolTipsId"
								value="/css/images/design/tooltips.png" /> <p:tooltip
								for="oriAgencyNameToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.ori.agency.name.tooltips']}" /></td>
					</tr>
				</p:outputPanel>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label2"
							value="#{lbl['lbl.sm.comp.exp.update.agency.name']}" /></td>
					<td style="width: 66%"><p:inputText id="agencyName"
							readonly="#{smCompExpMB.draft.clientType eq null or smCompExpMB.draft.agencyName ne null
							or smCompExpMB.draft.clientType eq ParameterConst.clientTypeFederal}"
							size="60" value="#{smCompExpMB.draft.agencyName}" />
							<p:outputPanel rendered="#{smCompExpMB.draft.clientType eq ParameterConst.clientTypeFederal}">
							<p:commandLink action="#{smPtjPopupBB.initPtjPopup}"
								oncomplete="blockWidget.hide(),smPtjPopupWV.show()"
								onclick="blockWidget.show()" update=":form" process="@form">
								<p:graphicImage value="/css/images/design/search.png" />
								<p:graphicImage id="agencyNameToolTipsId"
									value="/css/images/design/tooltips.png" />
								<p:tooltip for="agencyNameToolTipsId"
									value="#{lbl['lbl.sm.comp.exp.update.agency.name.tooltip']}" />
							</p:commandLink>
						</p:outputPanel>
							</td>
				</tr>
			</table>
		</div>
	</ui:define>
</ui:composition>
