<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_smCompExp_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.sm.comp.exp.screen.name']}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:panel header="#{lbl['lbl.sm.comp.exp.tnc.header']}">
			<h:outputText escape="false"
				value="#{lbl['lbl.sm.comp.exp.tnc.msg']}" />
		</p:panel>
		<table>
			<tr>
				<td><p:selectBooleanCheckbox value="#{smCompExpMB.agreeTnC}">
						<p:ajax oncomplete="blockWidget.hide()"
							onstart="blockWidget.show()" partialSubmit="true" process="@this"
							update="btnProceed" />
					</p:selectBooleanCheckbox></td>
				<td><p:outputLabel value="#{lbl['lbl.sm.comp.exp.tnc.agree']}" /></td>
			</tr>
		</table>
		<div align="right">
			<p:commandButton action="#{smCompExpBB.proceedAfterTnC}"
				disabled="#{!smCompExpMB.agreeTnC}" id="btnProceed"
				oncomplete="blockWidget.hide()" onstart="blockWidget.show()"
				value="#{lbl['lbl.sm.comp.exp.tnc.btn.proceed']}" />
		</div>
	</ui:define>
</ui:composition>
