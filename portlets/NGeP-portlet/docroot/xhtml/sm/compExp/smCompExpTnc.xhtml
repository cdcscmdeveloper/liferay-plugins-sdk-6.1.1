<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_smCompExp_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.sm.comp.exp.screen.name']}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:panel header="#{lbl['lbl.sm.comp.exp.tnc.header']}">
		<p:scrollPanel style="height:100px;border:0;" mode="native">
			<h:outputText escape="false"
				value="#{lbl['lbl.sm.comp.exp.tnc.msg']}" />
		</p:scrollPanel>
		<!-- 9299 - 40476  -->
		<table  style="width:100%;margin-top:12px">
			<tr>
				<td><div style="display:inline-flex; align-items:center;">
				<p:selectBooleanCheckbox value="#{smCompExpMB.agreeTnC}">
						<p:ajax event="change"
                        	process="@this"
							update="btnProceed" />
					</p:selectBooleanCheckbox>
					
					<span style="margin-left:8px;">
						<h:outputText value="#{lbl['lbl.sm.comp.exp.tnc.agree']}" />
					</span>
				</div>
			</td>
			<td style="text-align:right; white-space:nowrap;">

			<p:commandButton action="#{smCompExpBB.proceedAfterTnC}"
				disabled="#{!smCompExpMB.agreeTnC}" id="btnProceed"
				oncomplete="blockWidget.hide()" onstart="blockWidget.show()"
				value="#{lbl['lbl.sm.comp.exp.tnc.btn.proceed']}" />
			</td>
			</tr>
		</table>
		</p:panel>
	</ui:define>
</ui:composition>
