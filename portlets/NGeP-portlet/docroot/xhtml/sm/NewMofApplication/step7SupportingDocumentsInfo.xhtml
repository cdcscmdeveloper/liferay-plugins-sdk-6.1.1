<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	
	<p:outputPanel id="supDocPan">
		<ui:fragment
			rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'F'}">
			
			<ui:include
				src="/xhtml/sm/shared/mofRegistration/offlineSupportingDocsForm.xhtml" />
			<c:choose>
				<c:when
					test="#{backingBean.managedBean.smAppl.applCategoryType == 'S'}">

					<table style="width: 100%">
						<tr>
							<td><div align="left" style="width: 99%">
									<p:commandButton value="#{lbl['lbl.sm.prev']}"
										actionListener="#{backingBean.setTabValue('8','7')}"
										action="#{backingBean.updateSmAppl}" update=":form"
										icon="ui-icon-prev" />
								</div></td>

							<td><div align="right" style="width: 99%">
									<p:commandButton value="#{lbl['lbl.sm.next']}"
										icon="ui-icon-next"
										actionListener="#{backingBean.setTabValue('8','9')}"
										action="#{backingBean.updateSmAppl}" update=":form" />
								</div></td>
						</tr>
					</table>
				</c:when>
				<c:otherwise>
					<table style="width: 100%">
						<tr>
							<td><div align="left" style="width: 99%">
									<p:commandButton value="#{lbl['lbl.sm.prev']}"
										actionListener="#{backingBean.setTabValue('6','5')}"
										action="#{backingBean.updateSmAppl}" update=":form"
										icon="ui-icon-prev" />
								</div></td>

							<td><div align="right" style="width: 99%">
									<p:commandButton value="#{lbl['lbl.sm.next']}"
										icon="ui-icon-next"
										actionListener="#{backingBean.setTabValue('6','7')}"
										action="#{backingBean.updateSmAppl}" update=":form" />
								</div></td>
						</tr>
					</table>
				</c:otherwise>
			</c:choose>
		</ui:fragment>
		<ui:fragment
			rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'O'}">
			<ui:include
				src="/xhtml/sm/shared/mofRegistration/onlineSupportingDocsForm.xhtml" />
			<c:choose>
				<c:when
					test="#{backingBean.managedBean.smAppl.applCategoryType == 'S'}">

					<table style="width: 100%">
						<tr>
							<td><div align="left" style="width: 99%">
									<p:commandButton value="#{lbl['lbl.sm.prev']}"
										actionListener="#{backingBean.setTabValue('8','7')}"
										action="#{backingBean.updateSmAppl}" update=":form"
										icon="ui-icon-prev" />
								</div></td>
							<td><div align="right" style="width: 99%">
									<p:commandButton value="#{lbl['lbl.sm.next']}"
										icon="ui-icon-next"
										actionListener="#{backingBean.setTabValue('8','9')}"
										action="#{backingBean.updateSmAppl}" update=":form" />
								</div></td>
						</tr>
					</table>
				</c:when>
				<c:otherwise>
					<table style="width: 100%">
						<tr>
							<td><div align="left" style="width: 99%">
									<p:commandButton value="#{lbl['lbl.sm.prev']}"
										actionListener="#{backingBean.setTabValue('6','5')}"
										action="#{backingBean.updateSmAppl}" update=":form"
										icon="ui-icon-prev" />
								</div></td>
							<td><div align="right" style="width: 99%">
									<p:commandButton value="#{lbl['lbl.sm.next']}"
										icon="ui-icon-next"
										actionListener="#{backingBean.setTabValue('6','7')}"
										action="#{backingBean.updateSmAppl}" update=":form" />
								</div></td>
						</tr>
					</table>
				</c:otherwise>
			</c:choose>
		</ui:fragment>

	</p:outputPanel>
</ui:composition>
