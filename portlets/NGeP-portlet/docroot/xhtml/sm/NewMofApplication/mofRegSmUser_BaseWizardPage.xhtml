								<li><h:outputText value="Branch / Assocs"

								<li><h:outputText value="Captial Info"

								<li><h:outputText value="Category Codes"

								<li><h:outputText value="Factory"

								<li><h:outputText value="Supporting Docs"
										rendered="#{backingBean.managedBean.tabActiveIndex le 7}" />

										rendered="#{backingBean.managedBean.tabActiveIndex gt 7}" /></li>
								<li><h:outputText value="Payment" /></li>

							<ul id="tripMeter" class="menu-line">
								<c:choose>
									<c:when test="#{backingBean.managedBean.tabActiveIndex eq 0}">
										<li class="space red-dot"></li>
									</c:when>
									<c:otherwise>
										<li class="space green-dot"></li>
									</c:otherwise>
								</c:choose>
								<c:choose>
									<c:when test="#{backingBean.managedBean.tabActiveIndex lt 1}">
										<li class="space black-dot"></li>
									</c:when>
									<c:when test="#{backingBean.managedBean.tabActiveIndex gt 1}">
										<li class="space green-dot"></li>

										<li class="space red-dot"></li>

										<li class="space black-dot"></li>
									</c:when>
									<c:when test="#{backingBean.managedBean.tabActiveIndex gt 6}">
										<li class="space green-dot"></li>
									</c:when>
									<c:otherwise>
										<li class="space red-dot"></li>
									</c:otherwise>
								</c:choose>
								<c:choose>

								</c:choose>

									<c:when test="#{backingBean.managedBean.tabActiveIndex lt 8}">

									</c:when>
									<c:otherwise>
										<li class="red-dot"></li>
									</c:otherwise>
								</c:choose>

							</ul>

			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 0}">
				<ui:include src="step1CompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 1}">
				<ui:include src="step2BranchCompanyInfo.xhtml" />

			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 2}">
