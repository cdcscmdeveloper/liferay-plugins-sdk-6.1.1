<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">

	</ui:define>


	<ui:define name="contentSection">

		<ui:param name="mandatoryflg" value="true" />
		<ac:smPanel id="tt">
			<c:if test="#{!backingBean.managedBean.redirectToPersonPage}">
				<table style="width: 100%" id="wizardMofRegParentTable">
					<tr>
						<td><div class="navDiv" id="menuDiv" align="center">
								<ul class="menu-text">
									<li>
										<!-- <h:outputText
										value="#{lbl['lbl.sm.wizard.companyStepLbl']}"
										rendered="#{backingBean.managedBean.smAppl.currentActiveTab eq 0}" /> -->
										<p:commandLink value="#{lbl['lbl.sm.wizard.companyStepLbl']}"
											actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'0')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_BASIC)}"
											update=":form"
											rendered="#{backingBean.managedBean.smAppl.currentActiveTab ge 0}"
											styleClass="#{backingBean.managedBean.tabActiveIndex eq 0 ? 'currentStep' : ''}" />
									</li>

									<li><h:outputText
											value="#{lbl['lbl.sm.wizard.branchStepLbl']}"
											rendered="#{backingBean.managedBean.smAppl.currentActiveTab lt 1}" />
										<p:commandLink value="#{lbl['lbl.sm.wizard.branchStepLbl']}"
											actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'1')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH)}"
											update=":form"
											rendered="#{backingBean.managedBean.smAppl.currentActiveTab ge 1}"
											styleClass="#{backingBean.managedBean.tabActiveIndex eq 1 ? 'currentStep' : ''}" />
									</li>

									<li><h:outputText
											value="#{lbl['lbl.sm.wizard.capitalStepLbl']}"
											rendered="#{backingBean.managedBean.smAppl.currentActiveTab lt 2}" />
										<p:commandLink value="#{lbl['lbl.sm.wizard.capitalStepLbl']}"
											actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'2')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUITY)}"
											update=":form"
											rendered="#{backingBean.managedBean.smAppl.currentActiveTab ge 2}"
											styleClass="#{backingBean.managedBean.tabActiveIndex eq 2 ? 'currentStep' : ''}" /></li>

									<li><h:outputText
											value="#{lbl['lbl.sm.wizard.personStepLbl']}"
											rendered="#{backingBean.managedBean.smAppl.currentActiveTab lt 3}" />
										<p:commandLink value="#{lbl['lbl.sm.wizard.personStepLbl']}"
											actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'3')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_PERSONNEL)}"
											update=":form"
											rendered="#{backingBean.managedBean.smAppl.currentActiveTab ge 3}"
											styleClass="#{backingBean.managedBean.tabActiveIndex eq 3 ? 'currentStep' : ''}" /></li>

									<li><h:outputText
											value="#{lbl['lbl.sm.wizard.bankStepLbl']}"
											rendered="#{backingBean.managedBean.smAppl.currentActiveTab lt 4}" />
										<p:commandLink value="#{lbl['lbl.sm.wizard.bankStepLbl']}"
											actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'4')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
											update=":form"
											rendered="#{backingBean.managedBean.smAppl.currentActiveTab ge 4}"
											styleClass="#{backingBean.managedBean.tabActiveIndex eq 4 ? 'currentStep' : ''}" /></li>

									<li><h:outputText
											value="#{lbl['lbl.sm.wizard.catCodeStepLbl']}"
											rendered="#{backingBean.managedBean.smAppl.currentActiveTab lt 5}" />
										<p:commandLink value="#{lbl['lbl.sm.wizard.catCodeStepLbl']}"
											actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'5')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
											update=":form"
											rendered="#{backingBean.managedBean.smAppl.currentActiveTab ge 5}"
											styleClass="#{backingBean.managedBean.tabActiveIndex eq 5 ? 'currentStep' : ''}" /></li>

									<c:choose>
										<c:when
											test="#{backingBean.managedBean.smAppl.applCategoryType == 'S'}">
											<li><h:outputText
													value="#{lbl['lbl.sm.factoryStepLbl']}"
													rendered="#{backingBean.managedBean.smAppl.currentActiveTab lt 6}" />
												<p:commandLink value="#{lbl['lbl.sm.factoryStepLbl']}"
													actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'6')}"
													action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY)}"
													update=":form"
													rendered="#{backingBean.managedBean.smAppl.currentActiveTab ge 6}"
													styleClass="#{backingBean.managedBean.tabActiveIndex eq 6 ? 'currentStep' : ''}" /></li>
											<li><h:outputText
													value="#{lbl['lbl.sm.equipmentStepLbl']}"
													rendered="#{backingBean.managedBean.smAppl.currentActiveTab lt 7}" />
												<p:commandLink value="#{lbl['lbl.sm.equipmentStepLbl']}"
													actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'7')}"
													action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
													update=":form"
													rendered="#{backingBean.managedBean.smAppl.currentActiveTab ge 7}"
													styleClass="#{backingBean.managedBean.tabActiveIndex eq 7 ? 'currentStep' : ''}" /></li>
											<li><h:outputText
													value="#{lbl['lbl.sm.wizard.supDocStepLbl']}"
													rendered="#{backingBean.managedBean.smAppl.currentActiveTab lt 8}" />
												<p:commandLink value="#{lbl['lbl.sm.wizard.supDocStepLbl']}"
													actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'8')}"
													action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
													update=":form"
													rendered="#{backingBean.managedBean.smAppl.currentActiveTab ge 8}"
													styleClass="#{backingBean.managedBean.tabActiveIndex eq 8 ? 'currentStep' : ''}" /></li>

										</c:when>
										<c:otherwise>
											<li><h:outputText
													value="#{lbl['lbl.sm.wizard.supDocStepLbl']}"
													rendered="#{backingBean.managedBean.smAppl.currentActiveTab lt 6}" />
												<p:commandLink value="#{lbl['lbl.sm.wizard.supDocStepLbl']}"
													actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'6')}"
													action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
													update=":form"
													rendered="#{backingBean.managedBean.smAppl.currentActiveTab ge 6}"
													styleClass="#{backingBean.managedBean.tabActiveIndex eq 6 ? 'currentStep' : ''}" /></li>

										</c:otherwise>
									</c:choose>



								</ul>
								<ul id="tripMeter" class="menu-line">
									<li
										class="#{backingBean.managedBean.tabActiveIndex eq 0 ? 'space red-dot' : 'space green-dot'}" />
									<li
										class="#{backingBean.managedBean.tabActiveIndex eq 1 ? 'space red-dot' :  (backingBean.managedBean.smAppl.currentActiveTab ge 1 ? 'space green-dot':'space black-dot')}" />
									<li
										class="#{backingBean.managedBean.tabActiveIndex eq 2 ? 'space red-dot' :  (backingBean.managedBean.smAppl.currentActiveTab ge 2 ? 'space green-dot':'space black-dot')}" />
									<li
										class="#{backingBean.managedBean.tabActiveIndex eq 3 ? 'space red-dot' :  (backingBean.managedBean.smAppl.currentActiveTab ge 3 ? 'space green-dot':'space black-dot')}" />
									<li
										class="#{backingBean.managedBean.tabActiveIndex eq 4 ? 'space red-dot' :  (backingBean.managedBean.smAppl.currentActiveTab ge 4 ? 'space green-dot':'space black-dot')}" />
									<li
										class="#{backingBean.managedBean.tabActiveIndex eq 5 ? 'space red-dot' :  (backingBean.managedBean.smAppl.currentActiveTab ge 5 ? 'space green-dot':'space black-dot')}" />
									<c:choose>
										<c:when
											test="#{backingBean.managedBean.smAppl.applCategoryType == 'S'}">
											<li
												class="#{backingBean.managedBean.tabActiveIndex eq 6 ? 'space red-dot' :  (backingBean.managedBean.smAppl.currentActiveTab ge 6 ? 'space green-dot':'space black-dot')}" />
											<li
												class="#{backingBean.managedBean.tabActiveIndex eq 7 ? 'space red-dot' :  (backingBean.managedBean.smAppl.currentActiveTab ge 7 ? 'space green-dot':'space black-dot')}" />
											<li
												class="#{backingBean.managedBean.tabActiveIndex eq 8 ? 'red-dot' :  (backingBean.managedBean.smAppl.currentActiveTab ge 8 ? 'green-dot':'black-dot')}" />



										</c:when>
										<c:otherwise>
											<li
												class="#{backingBean.managedBean.tabActiveIndex eq 6 ? 'red-dot' :  (backingBean.managedBean.smAppl.currentActiveTab ge 6 ? 'green-dot':'black-dot')}" />

										</c:otherwise>
									</c:choose>


								</ul>
							</div></td>
						<td></td>
					</tr>
				</table>
				<table style="width: 98%">
					<tr>
						<td class="smLastSubmitLabel"><h:outputText
								value="#{lbl['lbl.sm.lastSubmitDate']}" /></td>
						<td class="smLastSubmitDateVal"><h:outputText
								value="#{backingBean.managedBean.smAppl.draftExpiryDate}">
								<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
							</h:outputText></td>
					</tr>
				</table>
				<c:choose>
					<c:when
						test="#{(backingBean.managedBean.smAppl.applCategoryType eq 'S' and backingBean.managedBean.tabActiveIndex lt 9)}">
						<table style="width: 100%">
							<p:outputPanel rendered="#{backingBean.managedBean.supplierUser}">
								<tr>
									<td></td>
									<td>
										<div align="right" style="width: 99%" class="button-wrapper">
											<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
												actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
												action="#{backingBean.saveApplicationAsDraft(ParameterConst.newSmApplnForMof,backingBean.managedBean.currentPageType)}"
												update=":form" icon="ui-icon-save"
												style="margin-bottom:5px;" />
											<c:if test="#{backingBean.managedBean.tabActiveIndex eq 8}">
												<p:commandButton value="Submit For Payment"
													action="#{backingBean.submitSmApplToBpm(ParameterConst.newSmApplnForMof)}"
													style="margin-bottom:5px;" />
											</c:if>
										</div>
									</td>
								</tr>
							</p:outputPanel>
						</table>
					</c:when>
					<c:otherwise>

						<c:if test="#{backingBean.managedBean.tabActiveIndex lt 7}">
							<table style="width: 100%">
								<p:outputPanel
									rendered="#{backingBean.managedBean.supplierUser}">
									<tr>
										<td></td>
										<td>
											<div align="right" style="width: 99%" class="button-wrapper">
												<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
													actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
													action="#{backingBean.saveApplicationAsDraft(ParameterConst.newSmApplnForMof,backingBean.managedBean.currentPageType)}"
													update=":form" icon="ui-icon-save"
													style="margin-bottom:5px;" />
												<c:if test="#{backingBean.managedBean.tabActiveIndex eq 6}">
													<p:commandButton value="Submit For Payment"
														action="#{backingBean.submitSmApplToBpm(ParameterConst.newSmApplnForMof)}"
														style="margin-bottom:5px;" />

												</c:if>
											</div>
										</td>
									</tr>
								</p:outputPanel>
							</table>
						</c:if>
					</c:otherwise>
				</c:choose>
			</c:if>
			<p:messages id="messages" showDetail="true" showSummary="false"
				autoUpdate="#{backingBean.managedBean.showParentMsg}"
				closable="true" escape="false" />

			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 0}">
				<ui:include src="step1CompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 1}">
				<ui:include src="step2BranchCompanyInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 2}">
				<ui:include src="step3CaptialAndEquityStatusInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 3}">
				<ui:include src="step4PersonnelInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 4}">
				<ui:include src="step5BankInfo.xhtml" />
			</c:if>
			<c:if test="#{backingBean.managedBean.tabActiveIndex eq 5}">
				<ui:include src="step6RegisterCategoryCodesInfo.xhtml" />
			</c:if>
			<c:choose>
				<c:when
					test="#{backingBean.managedBean.smAppl.applCategoryType == 'S'}">

					<c:if test="#{backingBean.managedBean.tabActiveIndex eq 6}">
						<ui:include src="step6.1FactoryInfo.xhtml" />
					</c:if>
					<c:if test="#{backingBean.managedBean.tabActiveIndex eq 7}">
						<ui:include src="step6.2EquipmentInfo.xhtml" />
					</c:if>
					<c:if test="#{backingBean.managedBean.tabActiveIndex eq 8}">
						<ui:include src="step7SupportingDocumentsInfo.xhtml" />
					</c:if>

				</c:when>
				<c:otherwise>
					<c:if test="#{backingBean.managedBean.tabActiveIndex eq 6}">
						<ui:include src="step7SupportingDocumentsInfo.xhtml" />
					</c:if>

				</c:otherwise>
			</c:choose>
			<p:dialog id="attachDlg1" widgetVar="attachDlg1" modal="true"
				dynamic="true" resizable="false" width="700px" height="200"
				styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
				<p:fileUpload
					allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|pdf|doc|docx)$/"
					invalidFileMessage="Only JPG, GIF, PNG, BMP, PDF, DOC files are accepted"
					fileUploadListener="#{backingBean.handleSupDocFileAttachment}"
					update=":form:tt:onSdList" oncomplete="attachDlg1.hide();" />
			</p:dialog>
		</ac:smPanel>
	</ui:define>
</ui:composition>
