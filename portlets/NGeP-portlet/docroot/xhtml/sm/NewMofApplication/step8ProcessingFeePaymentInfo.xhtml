<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
		<p:outputPanel rendered="#{backingBean.managedBean.supplierUser}">
			<tr>
				<td></td>
				<td>
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="#{lbl['lbl.sm.submitPayment']}"
							action="#{backingBean.submitSmApplToBpm(ParameterConst.newSmApplnForMof)}"
							style="margin-bottom:5px;" />
					</div>
				</td>
			</tr>
		</p:outputPanel>
	</table>

	<p:panel header="#{lbl['lbl.sm.processFee.Header']}">
		<ui:include
			src="/xhtml/sm/shared/paymentProcess/makePaymentForm.xhtml" />

		<c:choose>
			<c:when
				test="#{backingBean.managedBean.smAppl.applCategoryType == 'S'}">
				<div class="nav-wrapper">
					<table>
						<tr>
							<td><div align="left" style="width: 99%">
									<p:commandButton value="#{lbl['lbl.sm.prev']}"
										actionListener="#{backingBean.setTabValue('9','8')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_PAYMENT,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
										update=":form" icon="ui-icon-prev" />
								</div></td>

						</tr>
					</table>
				</div>
			</c:when>
			<c:otherwise>
				<div class="nav-wrapper">
					<table>
						<tr>
							<td><div align="left" style="width: 99%">
									<p:commandButton value="#{lbl['lbl.sm.prev']}"
										actionListener="#{backingBean.setTabValue('7','6')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_PAYMENT,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
										update=":form" icon="ui-icon-prev" />
								</div></td>


						</tr>
					</table>
				</div>
			</c:otherwise>
		</c:choose>
	</p:panel>
</ui:composition>
