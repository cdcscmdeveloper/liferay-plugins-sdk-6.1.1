<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	
	<ui:define name="contentSection">
		<p:messages id="defNewMofApplMsgs" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
			
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:panel id="gstTncPanelId" header="#{lbl['lbl.sm.term.and.condition.header']}">
			<p:scrollPanel style="height:300px;border:0;" mode="native">
				<b>#{lbl['lbl.sm.gst.tnc.header']}</b>
				<br />
				<p><h:outputText escape="false" value="#{lbl['lbl.sm.gst.tnc.withoutgst.msg']}" /></p>
				<br /><br />
				<p><h:outputText value="#{lbl['lbl.sm.mofReg.descData']}" escape="false" /></p>
				<ui:remove>
					<br />
					<table style="width: 33%">
						<tr>
							<td><p:outputLabel value="* #{lbl['lbl.sm.mofsuppliertype']}" /></td>
							<td><p:selectOneMenu
									value="#{backingBean.managedBean.newSupplierType}">
									<f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}" itemValue="K" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}" itemValue="J" />
								</p:selectOneMenu></td>
						</tr>
					</table>
				</ui:remove>
			</p:scrollPanel>
			<br/>
			<table>
				<tr>

					<td width="10px" style="padding: 4px 2px 0px 4px;"><p:selectBooleanCheckbox
							value="#{backingBean.managedBean.termsAccepted}">
							<p:ajax event="change" update=":form:basCmdBtn" />
						</p:selectBooleanCheckbox></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.termsConditions']}" /></td>
				</tr>

			</table>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.proceed']}" id="basCmdBtn"
					action="#{backingBean.proceedToApplication('N')}" 
					update="defNewMofApplMsgs" 
					disabled="#{!backingBean.managedBean.termsAccepted}" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
			</div>
		</p:panel>
	</ui:define>
</ui:composition>
