<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"

	<table style="width: 100%">
		<tr>
			<td><h4
					style="color: blue; text-decoration: underline; text-align: center;">

				</h4></td>
		</tr>
		<tr>
			<td><h6 style="color: blue;">

			<td align="right"><p:commandButton
					value="#{lbl['lbl.sm.saveAsDraft']}" /></td>
		</tr>
	</table>
	<ui:include

		src="/xhtml/sm/shared/mofRegistration/companyProjectsExperienceInfoForm.xhtml" />
	<table style="width: 100%">
		<tr>
			<td align="left"><p:commandButton value="#{lbl['lbl.sm.prev']}"

			<td align="right"><p:commandButton value="#{lbl['lbl.sm.next']}"
