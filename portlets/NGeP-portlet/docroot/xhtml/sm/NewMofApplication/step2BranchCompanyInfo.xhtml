<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<c:if
		test="#{backingBean.managedBean.approverUser or backingBean.managedBean.poUser}">
		<table style="width: 100%">
			<tr>
				<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
						src="smMofApplnSideMenuItem.xhtml" /></td>
				<td><ui:include
						src="/xhtml/sm/shared/mofRegistration/branchCompanyInfoForm.xhtml" />
					<ui:include
						src="/xhtml/sm/shared/mofRegistration/associatedCompanyInfoForm.xhtml" />
					<ui:include
						src="/xhtml/sm/shared/mofRegistration/companyProjectsExperienceInfoForm.xhtml" />
					<div class="nav-wrapper">
						<table style="width: 100%">
							<tr>
								<td><div align="left" style="width: 99%">
										<p:commandButton value="#{lbl['lbl.sm.prev']}"
											actionListener="#{backingBean.setTabValue('1','0')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH,SupplierManagementConst.SM_APPL_PAGE_TYPE_BASIC)}"
											icon="ui-icon-prev" update=":form" />
									</div></td>
								<td><div align="right" style="width: 99%">
										<p:commandButton value="#{lbl['lbl.sm.next']}"
											actionListener="#{backingBean.setTabValue('1','2')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH,SupplierManagementConst.SM_APPL_PAGE_TYPE_PERSONNEL)}"
											icon="ui-icon-next" iconPos="right" update=":form" />
									</div></td>
							</tr>
						</table>
					</div></td>
			</tr>

		</table>
	</c:if>

	<c:if test="#{backingBean.managedBean.supplierUser}">
		<ui:include
			src="/xhtml/sm/shared/mofRegistration/branchCompanyInfoForm.xhtml" />
		<ui:include
			src="/xhtml/sm/shared/mofRegistration/associatedCompanyInfoForm.xhtml" />
		<ui:include
			src="/xhtml/sm/shared/mofRegistration/companyProjectsExperienceInfoForm.xhtml" />
		<div class="nav-wrapper">
			<table style="width: 100%">
				<tr>
					<td><div align="left" style="width: 99%">
							<p:commandButton value="#{lbl['lbl.sm.prev']}"
								actionListener="#{backingBean.setTabValue('1','0')}"
								action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH,SupplierManagementConst.SM_APPL_PAGE_TYPE_BASIC)}"
								icon="ui-icon-prev" update=":form" />
						</div></td>
					<td><div align="right" style="width: 99%">
							<p:commandButton value="#{lbl['lbl.sm.next']}"
								actionListener="#{backingBean.setTabValue('1','2')}"
								action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH,SupplierManagementConst.SM_APPL_PAGE_TYPE_PERSONNEL)}"
								icon="ui-icon-next" iconPos="right" update=":form" />
						</div></td>
				</tr>
			</table>
		</div>
	</c:if>
</ui:composition>
