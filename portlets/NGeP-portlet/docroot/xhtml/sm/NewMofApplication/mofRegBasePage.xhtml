<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_MOFApplication_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.review.application']}");
		</script>
	</ui:define>


	<ui:define name="contentSection">
	
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"/>
		<p:outputPanel
			rendered="#{backingBean.managedBean.approverUser or backingBean.managedBean.poUser}"
			id="revPanHdr">
			<ui:include
				src="/xhtml/sm/shared/mofRegistration/applicationReviewHeaderPage.xhtml" />
		</p:outputPanel>
		<p:remoteCommand name="updateBlockUI" update="@(.ui-panel)" />
		<p:tabView id="tt" widgetVar="tt" orientation="left"
			activeIndex="#{backingBean.managedBean.tabActiveIndex}"
			onTabShow="updateBlockUI();" dynamic="true">
			<p:tab title="#{lbl['lbl.sm.companyStepLbl']}">
				<ui:include src="step1CompanyInfo.xhtml" />
			</p:tab>
			<p:tab title="#{lbl['lbl.sm.branchStepLbl']}">
				<ui:include src="step2BranchCompanyInfo.xhtml" />
			</p:tab>
			<p:tab title="#{lbl['lbl.sm.capitalStepLbl']}">
				<ui:include src="step3CaptialAndEquityStatusInfo.xhtml" />
			</p:tab>
			<p:tab title="#{lbl['lbl.sm.personStepLbl']}">
				<ui:include src="step4PersonnelInfo.xhtml" />
			</p:tab>
			<p:tab title="#{lbl['lbl.sm.bankStepLbl']}">
				<ui:include src="step5BankInfo.xhtml" />
			</p:tab>
			<p:tab title="#{lbl['lbl.sm.catCodeStepLbl']}">
				<ui:include src="step6RegisterCategoryCodesInfo.xhtml" />
			</p:tab>
			<c:if
				test="#{backingBean.managedBean.smAppl.applCategoryType eq 'S'}">
				<p:tab title="#{lbl['lbl.sm.factoryStepLbl']}">
					<ui:include src="step6.1FactoryInfo.xhtml" />
				</p:tab>
				<p:tab title="#{lbl['lbl.sm.equipmentStepLbl']}">
					<ui:include src="step6.2EquipmentInfo.xhtml" />
				</p:tab>
			</c:if>
			<c:if test="#{backingBean.managedBean.poUser}">
				<p:tab title="#{lbl['lbl.sm.docsReviewLbl']}">
					<ui:include
						src="/xhtml/sm/poDecisionPages/poReviewSupportingDocuments.xhtml" />
				</p:tab>
				<p:tab title="#{lbl['lbl.sm.review.sitevisit']}">
					<ui:include
						src="/xhtml/sm/reviewSiteVisitReport/reviewSiteVisitReportDocuments.xhtml" />
				</p:tab>
				<p:tab title="#{lbl['lbl.sm.poDecisionLbl']}">
					<ui:include
						src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
				</p:tab>
			</c:if>
			<c:if test="#{backingBean.managedBean.approverUser}">
				<p:tab title="#{lbl['lbl.sm.docsReviewLbl']}">
					<ui:include
						src="/xhtml/sm/approverDecisionPages/approverReviewSupportingDocuments.xhtml" />
				</p:tab>
				<p:tab title="#{lbl['lbl.sm.aprvrDecisionLbl']}">
					<ui:include
						src="/xhtml/sm/approverDecisionPages/approverDefault_DescisionPage.xhtml" />
				</p:tab>
			</c:if>
		</p:tabView>
	</ui:define>
</ui:composition>
