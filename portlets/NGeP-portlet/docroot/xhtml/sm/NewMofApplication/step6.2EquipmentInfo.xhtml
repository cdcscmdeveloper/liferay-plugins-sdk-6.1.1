<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<c:if
		test="#{backingBean.managedBean.approverUser or backingBean.managedBean.poUser}">
		<table style="width: 100%">
			<tr>
				<td style="width: 20%; vertical-align: top;" class="sidemenutd"><ui:include
						src="smMofApplnSideMenuItem.xhtml" /></td>
				<td style="vertical-align: top;"><h:inputHidden
						value="#{backingBean.managedBean.smAppl.applCategoryType}" /> 
					
					<ui:remove>
						<ui:include src="/xhtml/sm/shared/mofRegistration/manufacturingOrAssmblyInfoForm.xhtml" />
					</ui:remove>
					
					<ui:include src="/xhtml/sm/shared/mofRegistration/machineryInfoForm.xhtml" />
						
					<ui:include src="/xhtml/sm/shared/mofRegistration/travellingSoftwareInfoForm.xhtml" />

					<div class="nav-wrapper">
						<table style="width: 100%">
							<tr>
								<td><div align="left" style="width: 99%">
										<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
											onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
											actionListener="#{backingBean.setTabValue('7','6')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY)}"
											update=":form" />
									</div></td>
								<td><div align="right" style="width: 99%">
										<p:commandButton value="#{lbl['lbl.sm.next.section']}"
											onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
											actionListener="#{backingBean.setTabValue('7','8')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
											update=":form" />
									</div></td>
							</tr>
						</table>
					</div></td>
			</tr>

		</table>
	</c:if>


	<c:if test="#{backingBean.managedBean.supplierUser}">

		<h:inputHidden value="#{backingBean.managedBean.smAppl.applCategoryType}" />
		
		<ui:remove>
			<ui:include src="/xhtml/sm/shared/mofRegistration/manufacturingOrAssmblyInfoForm.xhtml" />
		</ui:remove>
		
		<ui:include src="/xhtml/sm/shared/mofRegistration/machineryInfoForm.xhtml" />
		
		<ui:include src="/xhtml/sm/shared/mofRegistration/travellingSoftwareInfoForm.xhtml" />

		<div class="nav-wrapper">
			<table style="width: 100%">
				<tr>
					<td><div align="left" style="width: 99%">
							<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
								onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
								actionListener="#{backingBean.setTabValue('7','6')}"
								action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY)}"
								update=":form" />
						</div></td>
					<td><div align="right" style="width: 99%">
							<p:commandButton value="#{lbl['lbl.sm.next.section']}"
								onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
								actionListener="#{backingBean.setTabValue('7','8')}"
								action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
								update=":form" />
						</div></td>
				</tr>
			</table>
		</div>
	</c:if>
</ui:composition>
