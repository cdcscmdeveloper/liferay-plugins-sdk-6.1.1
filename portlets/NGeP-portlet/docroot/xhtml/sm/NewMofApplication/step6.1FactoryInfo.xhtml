<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<c:if
		test="#{backingBean.managedBean.approverUser or backingBean.managedBean.poUser}">
		<table style="width: 100%">
			<tr>
				<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
						src="smMofApplnSideMenuItem.xhtml" /></td>
				<td><br />
					<table style="width: 250px">
						<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
							<tr>
								<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
										value="#{backingBean.managedBean.poSecReview.factoryVerify}"
										id="poFacVer">
										<p:ajax update=":form:tt:facInfPan,:form:revPanHdr"
											event="change"
											listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.factoryVerify)}" />
									</p:selectBooleanCheckbox></td>
								<td valign="top"><h:outputText
										value="#{lbl['lbl.sm.sectionPoVerf']}"
										title="For PO to highlight the verified section " /></td>

							</tr>
						</p:outputPanel>
						<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
							<tr>
								<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
										value="#{backingBean.managedBean.apprvrSecReview.factoryVerify}"
										id="apprFacVer">
										<p:ajax update=":form:tt:facInfPan,:form:revPanHdr"
											event="change"
											listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.factoryVerify)}" />
									</p:selectBooleanCheckbox></td>
								<td valign="top"><h:outputText
										value="#{lbl['lbl.sm.sectionApprVerf']}"
										title="For Approver to highlight the verified section " /></td>
							</tr>
						</p:outputPanel>
					</table> <br /> <p:panel id="facInfPan">
						<p:blockUI block=":form:tt:facInfPan" widgetVar="buiPoFac"
							id="poFacBlc"
							blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.factoryVerify : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.factoryVerify : false)}" />

						<h:inputHidden
							value="#{backingBean.managedBean.smAppl.applCategoryType}" />
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/factoryOrWorkshopInfoForm.xhtml" />
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/dockyardInfoForm.xhtml" />
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/workshopInfoForm.xhtml" />

						<ui:include
							src="/xhtml/sm/shared/mofRegistration/storeInfoForm.xhtml" />
						<br />
						<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
							<table style="width: 50%">
								<tr>
									<td style="padding-left: 38px;"><p:outputLabel
											value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
									<td><p:inputTextarea autoResize="true" cols="41"
											value="#{backingBean.managedBean.poSecReview.factoryRemark}" /></td>
								</tr>
							</table>
						</p:outputPanel>
						<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
							<table style="width: 100%">
								<tr>
									<td style="padding-left: 38px;"><p:outputLabel
											value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
									<td><p:inputTextarea autoResize="true" readonly="true"
											disabled="true" cols="41"
											value="#{backingBean.managedBean.poSecReview.factoryRemark}" /></td>
									<td style="padding-left: 22px;"><p:outputLabel
											value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
									<td><p:inputTextarea autoResize="true" cols="41"
											value="#{backingBean.managedBean.apprvrSecReview.factoryRemark}" /></td>

								</tr>
							</table>
						</p:outputPanel>
					</p:panel>


					<div class="nav-wrapper">
						<table style="width: 100%">
							<tr>
								<td><div align="left" style="width: 99%">
										<p:commandButton value="#{lbl['lbl.sm.prev']}"
											actionListener="#{backingBean.setTabValue('6','5')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
											update=":form" icon="ui-icon-prev" />
									</div></td>
								<td><div align="right" style="width: 99%">
										<p:commandButton value="#{lbl['lbl.sm.next']}"
											actionListener="#{backingBean.setTabValue('6','7')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
											update=":form" icon="ui-icon-next" iconPos="right" />
									</div></td>
							</tr>
						</table>
					</div></td>
			</tr>

		</table>
	</c:if>


	<c:if test="#{backingBean.managedBean.supplierUser}">

		<h:inputHidden
			value="#{backingBean.managedBean.smAppl.applCategoryType}" />
		<ui:include
			src="/xhtml/sm/shared/mofRegistration/factoryOrWorkshopInfoForm.xhtml" />
		<ui:include
			src="/xhtml/sm/shared/mofRegistration/dockyardInfoForm.xhtml" />
		<ui:include
			src="/xhtml/sm/shared/mofRegistration/workshopInfoForm.xhtml" />

		<ui:include src="/xhtml/sm/shared/mofRegistration/storeInfoForm.xhtml" />
		<div class="nav-wrapper">
			<table style="width: 100%">
				<tr>
					<td><div align="left" style="width: 99%">
							<p:commandButton value="#{lbl['lbl.sm.prev']}"
								actionListener="#{backingBean.setTabValue('6','5')}"
								action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
								update=":form" icon="ui-icon-prev" />
						</div></td>
					<td><div align="right" style="width: 99%">
							<p:commandButton value="#{lbl['lbl.sm.next']}"
								actionListener="#{backingBean.setTabValue('6','7')}"
								action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
								update=":form" icon="ui-icon-next" iconPos="right" />
						</div></td>
				</tr>
			</table>
		</div>
	</c:if>

</ui:composition>
