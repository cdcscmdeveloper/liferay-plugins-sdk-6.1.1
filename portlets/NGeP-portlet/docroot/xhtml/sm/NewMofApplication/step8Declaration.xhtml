<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:include src="/xhtml/sm/shared/paymentProcess/makePaymentForm.xhtml" /><br />
	<ui:include src="/xhtml/sm/shared/mofRegistration/supplierDeclarationForm.xhtml" />

	<c:choose>
		<c:when
			test="#{backingBean.managedBean.smAppl.applCategoryType == 'S'}">
			
			<c:choose>
				<c:when test="#{backingBean.managedBean.showMachineryEquipmentPanel or backingBean.managedBean.showTravelSoftwarePanel}">
					<div class="nav-wrapper">
						<table style="width: 100%">
							<tr>
								<td><div align="left" style="width: 99%">
										<p:commandButton value="#{lbl['lbl.sm.prev.section']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
											actionListener="#{backingBean.setTabValue('9','8')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_DECLARATION,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
											update=":form" />
									</div></td>
	
							</tr>
						</table>
					</div>
				</c:when>
				<c:otherwise>
					<div class="nav-wrapper">
						<table style="width: 100%">
							<tr>
								<td><div align="left" style="width: 99%">
										<p:commandButton value="#{lbl['lbl.sm.prev.section']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
											actionListener="#{backingBean.setTabValue('8','7')}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_DECLARATION,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
											update=":form" />
									</div></td>
	
							</tr>
						</table>
					</div>
				</c:otherwise>
			</c:choose>
			
		</c:when>
		<c:otherwise>
			<div class="nav-wrapper">
				<table style="width: 100%">
					<tr>
						<td><div align="left" style="width: 99%">
								<p:commandButton value="#{lbl['lbl.sm.prev.section']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
									actionListener="#{backingBean.setTabValue('7','6')}"
									action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_DECLARATION,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
									update=":form" />
							</div></td>
					</tr>
				</table>
			</div>
		</c:otherwise>
	</c:choose>
</ui:composition>
