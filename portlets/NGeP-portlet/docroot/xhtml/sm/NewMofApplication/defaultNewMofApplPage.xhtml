<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<div class="screen-title">
			<h:outputText value="MOF Registration Application" />
		</div>

		<div>
			<p:panel header="#{lbl['lbl.sm.mofReg.headerLbl']}">
				<table style="width: 100%">
					<tr>
						<td><p:outputPanel>
								<p>
									<h:outputText value="#{lbl['lbl.sm.mofReg.descData']}"
										escape="false" />
								</p>
								<p:separator />
								<p>Note : Before proceed please select the Supplier Type</p>
								<br />

								<table style="width: 23%">
									<tr>
										<td><p:outputLabel
												value="* #{lbl['lbl.sm.mofsuppliertype']}" /></td>
										<td><p:selectOneMenu
												value="#{backingBean.managedBean.newSupplierType}">
												<f:selectItem itemLabel="Contractor " itemValue="1" />
												<f:selectItem itemLabel="Consultant" itemValue="2" />
											</p:selectOneMenu></td>
									</tr>
								</table>
							</p:outputPanel></td>

					</tr>
				</table>
				<table>
					<tr>

						<td width="10px" style="padding: 4px 2px 0px 8px;"><p:selectBooleanCheckbox
								value="#{backingBean.managedBean.termsAccepted}">
								<p:ajax event="change" update=":form:basCmdBtn" />
							</p:selectBooleanCheckbox></td>
						<td><p:outputLabel value="#{lbl['lbl.sm.termsConditions']}" /></td>
					</tr>

				</table>
			</p:panel>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.proceed']}" id="basCmdBtn"
					action="#{backingBean.proceedToApplication('N')}"
					disabled="#{!backingBean.managedBean.termsAccepted}" />
				<!-- <p:commandButton value="Cancel" /> -->
			</div>
		</div>
	</ui:define>
</ui:composition>
