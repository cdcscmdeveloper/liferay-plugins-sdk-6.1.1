<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<c:if
		test="#{backingBean.managedBean.approverUser or backingBean.managedBean.poUser}">
		<table style="width: 100%">
			<tr>
				<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
						src="smMofApplnSideMenuItem.xhtml" /></td>
				<td> <ui:include
						src="/xhtml/sm/shared/mofRegistration/companyBasicInfoForm.xhtml" />
					<ui:include
						src="/xhtml/sm/shared/mofRegistration/staffInfoForm.xhtml" /> <ui:include
						src="/xhtml/sm/shared/mofRegistration/officeFacilityTypeForm.xhtml" />
					<ui:include
						src="/xhtml/sm/shared/mofRegistration/certifacteInfoForm.xhtml" />
					<ui:fragment
						rendered="#{backingBean.managedBean.smAppl.supplierType eq 'J'}">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/proffesionalBodyInfoForm.xhtml" />
					</ui:fragment> <ui:include
						src="/xhtml/sm/shared/mofRegistration/transactionNetworksForm.xhtml" />
					<div class="nav-wrapper">
						<table style="width: 100%">
							<tr>
								<td></td>
								<td>
									<div align="right" style="width: 99%" class="button-wrapper">
										<p:commandButton value="#{lbl['lbl.sm.next.section']}"
											icon="ui-icon-next" iconPos="right"
											actionListener="#{backingBean.setTabValue(0,1)}"
											action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_BASIC,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH)}"
											update=":form" />
									</div>
								</td>
							</tr>
						</table>
					</div></td>
			</tr>

		</table>
	</c:if>

	<c:if test="#{backingBean.managedBean.supplierUser}">
		<ui:include
			src="/xhtml/sm/shared/mofRegistration/companyBasicInfoForm.xhtml" />
		<ui:include src="/xhtml/sm/shared/mofRegistration/staffInfoForm.xhtml" />
		<ui:include
			src="/xhtml/sm/shared/mofRegistration/officeFacilityTypeForm.xhtml" />
		<ui:include
			src="/xhtml/sm/shared/mofRegistration/certifacteInfoForm.xhtml" />
		<ui:fragment
			rendered="#{backingBean.managedBean.smAppl.supplierType eq 'J'}">
			<ui:include
				src="/xhtml/sm/shared/mofRegistration/proffesionalBodyInfoForm.xhtml" />
		</ui:fragment>
		<ui:include
			src="/xhtml/sm/shared/mofRegistration/transactionNetworksForm.xhtml" />
		<div class="nav-wrapper">
			<table style="width: 100%">
				<tr>
					<td></td>
					<td>
						<div align="right" style="width: 99%" class="button-wrapper">
							<p:commandButton value="#{lbl['lbl.sm.next.section']}"
								icon="ui-icon-next" iconPos="right"
								actionListener="#{backingBean.setTabValue(0,1)}"
								action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_BASIC,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH)}"
								update=":form" />
						</div>
					</td>
				</tr>
			</table>
		</div>
	</c:if>
</ui:composition>
