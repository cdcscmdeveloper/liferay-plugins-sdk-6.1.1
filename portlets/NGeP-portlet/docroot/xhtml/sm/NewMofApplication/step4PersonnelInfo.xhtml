<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<c:if
		test="#{backingBean.managedBean.approverUser or backingBean.managedBean.poUser}">
		<c:choose>
			<c:when test="#{backingBean.managedBean.redirectToPersonPage}">
				<table style="width: 100%">
					<tr>

						<td><ui:include
								src="/xhtml/sm/shared/mofRegistration/captialShareHolderInfoRedirectForm.xhtml" />

						</td>
					</tr>

				</table>
			</c:when>
			<c:otherwise>
				<table style="width: 100%">
					<tr>
						<td style="width: 20%; vertical-align: top;" class="sidemenutd"><ui:include
								src="smMofApplnSideMenuItem.xhtml" /></td>
						<td style="vertical-align: top;"><ui:include
								src="/xhtml/sm/shared/mofRegistration/personnelInfoForm.xhtml" />
							<div class="nav-wrapper">
								<table style="width: 100%">
									<tr>
										<td><div align="left" style="width: 99%">
												<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
													onstart="blockWidget.show()"
													oncomplete="blockWidget.hide();scrollToTop();"
													actionListener="#{backingBean.setTabValue('2','1')}"
													action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_PERSONNEL,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH)}"
													update=":form" />
											</div></td>
										<td><div align="right" style="width: 99%">
												<p:commandButton value="#{lbl['lbl.sm.next.section']}"
													onstart="blockWidget.show()"
													oncomplete="blockWidget.hide();scrollToTop();"
													actionListener="#{backingBean.setTabValue('2','3')}"
													action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_PERSONNEL,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUITY)}"
													update=":form" />
											</div></td>
									</tr>
								</table>
							</div></td>
					</tr>

				</table>
			</c:otherwise>
		</c:choose>
	</c:if>


	<c:if test="#{backingBean.managedBean.supplierUser}">
		<c:choose>
			<c:when test="#{backingBean.managedBean.redirectToPersonPage}">
				<ui:include
					src="/xhtml/sm/shared/mofRegistration/captialShareHolderInfoRedirectForm.xhtml" />
			</c:when>
			<c:otherwise>
				<ui:include
					src="/xhtml/sm/shared/mofRegistration/personnelInfoForm.xhtml" />
				<div class="nav-wrapper">
					<table style="width: 100%">
						<tr>
							<td><div align="left" style="width: 99%">
									<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
										onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
										actionListener="#{backingBean.setTabValue('2','1')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_PERSONNEL,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH)}"
										update=":form" />
								</div></td>
							<td><div align="right" style="width: 99%">
									<p:commandButton value="#{lbl['lbl.sm.next.section']}"
										onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
										actionListener="#{backingBean.setTabValue('2','3')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForMof,SupplierManagementConst.SM_APPL_PAGE_TYPE_PERSONNEL,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUITY)}"
										update=":form" />
								</div></td>
						</tr>
					</table>
				</div>
			</c:otherwise>
		</c:choose>
	</c:if>
</ui:composition>
