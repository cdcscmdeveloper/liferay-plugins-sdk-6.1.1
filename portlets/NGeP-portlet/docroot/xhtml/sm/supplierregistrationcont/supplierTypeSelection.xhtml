<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:panel header="#{lbl['lbl.sm.account.type.header']}">
			<table>
				<tr>
					<td>#{lbl['lbl.sm.account.type.header']}</td>
					<td>
						<p:selectOneRadio value="#{postSupplierRegBB.managedBean.smSupplier.smAppl.supplierType}" required="true">
				            <f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}" itemValue="#{SupplierManagementConst.STYPE_CONTRACTOR}" />
				            <f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}" itemValue="#{SupplierManagementConst.STYPE_CONSULTANT}" />
				            <p:ajax event="change" update="outPnlSuppTypeId"></p:ajax>
						</p:selectOneRadio>
					</td>
				</tr>
			</table>
		</p:panel>
		
		<p:outputPanel id="outPnlSuppTypeId" >
			<p:panel header="Supplier Type" rendered="#{postSupplierRegBB.managedBean.smSupplier.smAppl.supplierType == SupplierManagementConst.STYPE_CONTRACTOR}">
				<p:selectOneMenu required="true" value="#{postSupplierRegBB.managedBean.smSupplier.smAppl.applType}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.basic']}" itemValue="#{SupplierManagementConst.ACC_BASIC}" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.mof']}" itemValue="#{SupplierManagementConst.ACC_MOF}" />
				</p:selectOneMenu>
			</p:panel>
		</p:outputPanel>
		
	
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.next']}" action="#{postSupplierRegBB.saveSupplierAccountType}">
			</p:commandButton>
		</div>
	</ui:define>
</ui:composition>
