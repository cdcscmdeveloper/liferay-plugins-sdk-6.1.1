<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<p:panel header="#{lbl['lbl.sm.account.type.header']}">
			<table>
				<tr>
					<td width="100px">Supplier Type</td>
					<td>
						<p:selectOneRadio value="#{postSupplierRegBB.managedBean.smSupplier.smAppl.supplierType}" required="true" 
						label="#{lbl['lbl.sm.account.type.header']}">
				            <f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}" itemValue="#{SupplierManagementConst.STYPE_CONTRACTOR}" />
				            <f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}" itemValue="#{SupplierManagementConst.STYPE_CONSULTANT}" 
				            itemDisabled="#{postSupplierRegBB.managedBean.smSupplier.businessType eq SupplierManagementConst.INDIVIDUAL_FLAG}" />
				            <p:ajax event="change" update="outPnlSuppTypeId"></p:ajax>
						</p:selectOneRadio>
					</td>
				</tr>
			</table>
			<p:outputPanel id="outPnlSuppTypeId" >
				<p:outputPanel rendered="#{postSupplierRegBB.managedBean.smSupplier.smAppl.supplierType == SupplierManagementConst.STYPE_CONTRACTOR}">
				<table>	
					<tr>
						<td width="100px">
							#{lbl['lbl.sm.account.type.header']}
						</td>
						<td>							
							<p:selectOneRadio 
								required="true" 
								value="#{postSupplierRegBB.managedBean.smSupplier.smAppl.applType}" 
								label="Supplier Type">
								<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.basic']}" itemValue="#{SupplierManagementConst.ACC_BASIC}" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.mof']}" itemValue="#{SupplierManagementConst.ACC_MOF}" />
							</p:selectOneRadio>
							
						</td>
					</tr>
				</table>
				</p:outputPanel>
			</p:outputPanel>
	</p:panel>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.next']}" action="#{postSupplierRegBB.saveSupplierAccountType}">
			</p:commandButton>
		</div>
	</ui:define>
</ui:composition>
