<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.search.blacklist.director']}" toggleable="true" id="searchDirectorPanelId">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.complaint.search.by']}" /></td>
				<td><p:selectOneRadio id="searchModeId" required="false"
						value="#{bb.managedBean.searchBy}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.businesscomptype']}" itemValue="#{bb.SEARCH_BY_COMPANY}" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.director.owner']}" itemValue="#{bb.SEARCH_BY_DIRECTOR}" />
						<p:ajax update="searchMainPanelId" event="change" process="@this" 
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
					</p:selectOneRadio></td>
			</tr>
			<p:outputPanel rendered="#{bb.managedBean.searchBy eq bb.SEARCH_BY_COMPANY}">
				<ui:include src="searchCompany.xhtml" />
			</p:outputPanel>
			<p:outputPanel rendered="#{bb.managedBean.searchBy eq bb.SEARCH_BY_DIRECTOR}">
				<ui:include src="searchDirector.xhtml" />
			</p:outputPanel>
		</table>
	</p:panel>
	
	<p:outputPanel rendered="#{bb.managedBean.searchBy eq bb.SEARCH_BY_COMPANY}">
		<ui:include src="resultCompany.xhtml" />
	</p:outputPanel>
	
	<p:outputPanel rendered="#{bb.managedBean.searchBy eq bb.SEARCH_BY_DIRECTOR}">
		<ui:include src="resultDirector.xhtml" />
	</p:outputPanel>
	
</ui:composition>
