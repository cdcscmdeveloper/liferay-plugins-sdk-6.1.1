<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.results']}" toggleable="true" id="companyListPanelId">	
		<p:dataTable var="smSupp" widgetVar="smSuppWidgetVar"
			editable="false" lazy="true" rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{bb.managedBean.supplierDataModel}"
			rowKey="#{smSupp}" rowIndexVar="index" id="companyDtId">
			<ac:paginator for="companyDtId" />
			
			<p:column headerText="#{lbl['lbl.sm.companyname']}" style="width :25%;white-space : normal" >
				<h:outputText value="#{smSupp[1]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.rocNo']}" >
				<h:outputText value="#{smSupp[2]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.mofno']}" >
				<h:outputText value="#{smSupp[4]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.epNo']}" >
				<h:outputText value="#{smSupp[3]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.rpt.supplierType']}">
				<h:outputText value="#{lbl['lbl.sm.contractor']}" rendered="#{smAppl[5] eq 'K'}"/>
				<h:outputText value="#{lbl['lbl.sm.consultant']}" rendered="#{smAppl[5] eq 'J'}"/>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
				<p:commandLink onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{bb.viewCompany(smSupp[6])}"
					process="@this" partialSubmit="true" update="@form"
					style="padding-right:5px;">
					<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
				</p:commandLink>
			</p:column>
			
		</p:dataTable>
	</p:panel>
	
</ui:composition>
