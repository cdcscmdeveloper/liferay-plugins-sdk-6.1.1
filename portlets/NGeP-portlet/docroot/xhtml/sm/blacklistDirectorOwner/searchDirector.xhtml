<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<tr>
		<td><p:outputLabel value="#{lbl['lbl.sm.blacklist.director.search.by']}" /></td>
		<td><p:selectOneRadio id="directorSearchModeId" required="false"
				value="#{bb.managedBean.directorSearchBy}">
				<f:selectItem itemLabel="#{lbl['lbl.sm.shrHldrInfo.idNo']}" itemValue="#{bb.DIRECTOR_SEARCH_BY_IDNO}" />
				<f:selectItem itemLabel="#{lbl['lbl.sm.shrHldrInfo.name']}" itemValue="#{bb.DIRECTOR_SEARCH_BY_NAME}" />
				<p:ajax update="searchMainPanelId" event="change" process="@this" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
			</p:selectOneRadio></td>
	</tr>
	
	<p:outputPanel rendered="#{bb.managedBean.directorSearchBy eq bb.DIRECTOR_SEARCH_BY_NAME}">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sm.shrHldrInfo.name']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:inputText label="#{lbl['lbl.sm.shrHldrInfo.name']}" required="true"
					value="#{bb.managedBean.name}"
					size="40" />
			</td>
		</tr>
	</p:outputPanel>
	<p:outputPanel rendered="#{bb.managedBean.directorSearchBy eq bb.DIRECTOR_SEARCH_BY_IDNO}">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sm.shrHldrInfo.idNo']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:inputText label="#{lbl['lbl.sm.shrHldrInfo.idNo']}" required="true"
					value="#{bb.managedBean.identificationNo}"
					size="35"/>
			</td>
		</tr>
	</p:outputPanel>
	<tr>
		<td colspan="2">
			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.btn.search']}" 
					action="#{bb.searchDirector}"
					update="@form" 
					disabled="#{empty bb.managedBean.directorSearchBy}"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
				</p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.reset']}" 
					action="#{bb.resetDirectorSearch}"
					disabled="#{empty bb.managedBean.directorSearchBy}"
					update="searchMainPanelId">
				</p:commandButton>
			</div>
		</td>
	</tr>
	
</ui:composition>
