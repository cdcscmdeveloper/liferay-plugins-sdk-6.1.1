<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<tr>
		<td><p:outputLabel value="#{lbl['lbl.sm.complaint.search.by']}" /></td>
		<td><p:selectOneRadio id="companySearchModeId" required="false"
				value="#{bb.managedBean.companySearchBy}">
				<f:selectItem itemLabel="#{lbl['lbl.sm.ep.no']}" itemValue="#{bb.COMPANY_SEARCH_BY_EPNO}" />
				<f:selectItem itemLabel="#{lbl['lbl.sm.rocNo']}" itemValue="#{bb.COMPANY_SEARCH_BY_REGNO}" />
				<f:selectItem itemLabel="#{lbl['lbl.sm.companyname']}" itemValue="#{bb.COMPANY_SEARCH_BY_NAME}" />
				<p:ajax update="searchMainPanelId" event="change" process="@this" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
			</p:selectOneRadio></td>
	</tr>
	
	<p:outputPanel rendered="#{bb.managedBean.companySearchBy eq bb.COMPANY_SEARCH_BY_NAME}">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sm.companyname']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:inputText label="#{lbl['lbl.sm.companyname']}" required="true"
					value="#{bb.managedBean.companyName}"
					size="40" />
			</td>
		</tr>
	</p:outputPanel>
	<p:outputPanel rendered="#{bb.managedBean.companySearchBy eq bb.COMPANY_SEARCH_BY_REGNO}">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sm.rocNo']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:inputText label="#{lbl['lbl.sm.rocNo']}" required="true"
					value="#{bb.managedBean.bussRegNo}"
					size="35"/>
			</td>
		</tr>
	</p:outputPanel>
	<p:outputPanel rendered="#{bb.managedBean.companySearchBy eq bb.COMPANY_SEARCH_BY_EPNO}">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sm.ep.no']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:inputText label="#{lbl['lbl.sm.ep.no']}" required="true"
					value="#{bb.managedBean.epNo}"
					size="35"/>
			</td>
		</tr>
	</p:outputPanel>
	<tr>
		<td colspan="2">
			<div style="text-align: right;">
				<p:commandButton value="#{lbl['lbl.btn.search']}" 
					action="#{bb.searchCompany}"
					update="@form" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
				</p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.reset']}" 
					action="#{bb.resetCompanySearch}"
					update="searchMainPanelId">
				</p:commandButton>
			</div>
		</td>
	</tr>
	
</ui:composition>
