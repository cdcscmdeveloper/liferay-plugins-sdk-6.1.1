<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.results']}" toggleable="true" id="directorListPanelId">	
		<p:dataTable var="director" widgetVar="directorWidgetVar"
			editable="false" lazy="true" rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{bb.managedBean.ownerDirectorDataModel}"
			rowKey="#{director}" rowIndexVar="index" id="directorDtId">
			<ac:paginator for="directorDtId" />
			
			<p:column headerText="#{lbl['lbl.sm.shrHldrInfo.name']}" style="width :25%;white-space : normal" >
				<h:outputText value="#{director[1]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.shrHldrInfo.idNo']}" >
				<h:outputText value="#{director[0]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
				<p:commandLink onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{bb.viewDirector(director[2],director[0],director[1])}"
					process="@this" partialSubmit="true" update="@form"
					style="padding-right:5px;">
					<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
				</p:commandLink>
			</p:column>
			
		</p:dataTable>
	</p:panel>
	
</ui:composition>
