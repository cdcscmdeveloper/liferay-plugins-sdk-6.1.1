<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_updateSmeInfo_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					"#{lbl['lbl.sm.sme.update.info']}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" closable="true"
			showSummary="false" escape="false" />
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:outputPanel>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.sme.view.history']}"
					partialSubmit="true" update="@this" process="@this"
					action="#{smUpdateSmeInfoBackingBean.redirectToHistoryPage}"
					onclick="blockWidget.show()" oncomplete="blockWidget.hide()"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.sm.sme.action.declare']}"
					partialSubmit="true" update="@form"
					action="#{smUpdateSmeInfoBackingBean.onDeclareSme}"
					onclick="blockWidget.show()" oncomplete="blockWidget.hide()"></p:commandButton>
			</div>
		</p:outputPanel>
		<p:panel toggleable="true" id="SmeInfoPanelId">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sm.sme.company.info']}"
					style="white-space: nowrap !important; float: left !important;" />
			</f:facet>
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.sme.note.applicable']}" />
			<br />
			<table style="width: 100%; table-layout: fixed">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.sme.company.name']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{smUpdateSmeInfoBackingBean.managedBean.companyBasic.companyName}" />
					</td>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.sme.roc.no']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{smUpdateSmeInfoBackingBean.managedBean.smSupplier.regNo}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.sme.reg.type']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{smUpdateSmeInfoBackingBean.getParameterDesc(
							SupplierManagementConst.supplierBusinessType,smUpdateSmeInfoBackingBean.managedBean.smSupplier.businessType)}" />
					</td>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.sme.ep.no']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{smUpdateSmeInfoBackingBean.managedBean.smSupplier.epNo}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.sme.status.type']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="statusType"
							label="#{lbl['lbl.sm.sme.status.type']}"
							value="#{smUpdateSmeInfoBackingBean.managedBean.smeSupplier.smeStatusType}"
							required="true">
							<f:selectItem itemLabel="#{lbl['lbl.sm.sme.txt.select']}"
								itemValue=""></f:selectItem>
							<f:selectItems
								value="#{smUpdateSmeInfoBackingBean.managedBean.statusTypeList}" />
						</p:selectOneMenu> <p:commandLink
							action="#{smUpdateSmeInfoBackingBean.onClickTooltips('smeDefinitionWidget')}"
							update="smeDefinitionWidget" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()" process="@this">
							<p:graphicImage value="/css/images/design/tooltips.png" />
						</p:commandLink> <p:message id="statusTypeMsg" for="statusType" display="icon"
							showDetail="false" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.sme.reg.status']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneRadio id="regStatus"
							label="#{lbl['lbl.sm.sme.reg.status.input']}"
							value="#{smUpdateSmeInfoBackingBean.managedBean.smeCorpRegisteredTrans}"
							required="true">
							<f:selectItem itemLabel="#{lbl['lbl.sm.sme.txt.yes']}"
								itemValue="1"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.sm.sme.txt.no']}"
								itemValue="0"></f:selectItem>
							<p:ajax update="smeRegPanel" partialSubmit="true"
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
						</p:selectOneRadio> <p:message id="regStatusMsg" for="regStatus" display="icon"
							showDetail="false" /></td>
				</tr>
			</table>
			<p:outputPanel id="smeRegPanel">
				<p:outputPanel
					rendered="#{smUpdateSmeInfoBackingBean.managedBean.smeCorpRegisteredTrans eq '1'}">
					<table style="width: 50%; table-layout: fixed">
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label"
									value="#{lbl['lbl.sm.sme.ref.no']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:inputText id="smeRefNo"
									label="#{lbl['lbl.sm.sme.ref.no']}"
									value="#{smUpdateSmeInfoBackingBean.managedBean.smeSupplier.smeRefNo}"
									required="true" /> <p:commandLink
									action="#{smUpdateSmeInfoBackingBean.onClickTooltips('smeCertWidget')}"
									update="smeCertWidget" onstart="blockWidget.show()"
									oncomplete="blockWidget.hide()" process="@this">
									<p:graphicImage value="/css/images/design/tooltips.png" />
								</p:commandLink> <p:message id="smeRefNoMsg" for="smeRefNo" display="icon"
									showDetail="false" /></td>
						</tr>
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label"
									value="#{lbl['lbl.sm.sme.valid.start']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:calendar id="calDtStart"
									label="#{lbl['lbl.sm.sme.valid.start']}" showOn="button"
									navigator="true" display="inline" readonlyInput="true"
									value="#{smUpdateSmeInfoBackingBean.managedBean.smeSupplier.smeValidStartDate}"
									required="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"></p:calendar>
								<p:message id="calDtStartMsg" for="calDtStart" display="icon"
									showDetail="false" /></td>
						</tr>
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label"
									value="#{lbl['lbl.sm.sme.valid.end']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:calendar id="calDtEnd"
									label="#{lbl['lbl.sm.sme.valid.end']}" showOn="button"
									navigator="true" display="inline" readonlyInput="true"
									value="#{smUpdateSmeInfoBackingBean.managedBean.smeSupplier.smeValidEndDate}"
									required="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"></p:calendar>
								<p:message id="calDtEndMsg" for="calDtEnd" display="icon"
									showDetail="false" /></td>
						</tr>
					</table>
					<br />
					<p:dataTable var="doc" id="smeSuppDocDtId"
						rendered="#{smUpdateSmeInfoBackingBean.managedBean.smeCorpRegisteredTrans eq '1'}"
						value="#{smUpdateSmeInfoBackingBean.managedBean.smeSupplier.smSmeSupplierDocs}"
						emptyMessage="#{lbl['lbl.sm.sme.msg.no.records.found']}"
						rowIndexVar="index">
						<p:column headerText="#{lbl['lbl.sm.sme.txt.num']}"
							style="width : 5%;">
							<p:outputLabel value="#{index + 1}"
								style="float: left;white-space: normal;" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.sme.supp.doc.desc']}"
							style="width : 55%;">
							<h:outputText value="#{doc.pmDocument.docName}"
								style="float: left;white-space: normal;" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.sme.supp.doc.upload']}"
							style="width : 20%;">
							<p:commandLink oncomplete="uploadDialog.show();return false;"
								update="@([id$=uploadDialog])" process="@this"
								action="#{smUpdateSmeInfoBackingBean.assignSmeSupportDoc(doc)}">
								<p:graphicImage value="/css/images/design/upload.png"
									style="margin-right:2px;" />
							</p:commandLink>
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.sme.supp.doc.name']}"
							style="width : 20% !important;">
							<p:commandLink ajax="false" value="#{doc.fileName}"
								rendered="#{not empty doc.fileName}">
								<p:fileDownload
									value="#{smUpdateSmeInfoBackingBean.commonDownload(table.filePath,table.fileName,table.fileName)}" />
							</p:commandLink>
							<h:outputText value="#{lbl['lbl.sm.sme.txt.no.available']}"
								rendered="#{empty doc.fileName}" />
							<p:commandLink id="deleteAttId"
								style="white-space: normal !important;" partialSubmit="true"
								rendered="#{not empty doc.fileName}" process="@this"
								action="#{smUpdateSmeInfoBackingBean.onDeleteAttachment(doc)}"
								update="@form" onstart="blockWidget.show()"
								oncomplete="blockWidget.hide()">&#160;<p:graphicImage
									value="/css/images/design/icon_trash.png"
									title="#{lbl['lbl.sm.sme.action.delete.attachment']}" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</p:outputPanel>
			</p:outputPanel>
		</p:panel>
		<p:outputPanel>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.sme.action.delete']}"
					partialSubmit="true" update="@this" process="@this"
					action="#{smUpdateSmeInfoBackingBean.onDeleteSme}"
					onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
					disabled="#{smUpdateSmeInfoBackingBean.managedBean.smSupplier.smeRegisteredFlag eq '0' or smUpdateSmeInfoBackingBean.managedBean.smSupplier.smeRegisteredFlag eq '9'}"></p:commandButton>
			</div>
		</p:outputPanel>
		<p:confirmDialog id="confirmDeclareDialog" closable="true"
			message="#{lbl['lbl.sm.sme.declare.confirm.msg']}"
			header="#{lbl['lbl.sm.sme.confirm.declare.header']}" severity="alert"
			widgetVar="confirmDeclareDialog">
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.sme.txt.yes']}"
					onclick="confirmDeclareDialog.hide();"
					action="#{smUpdateSmeInfoBackingBean.declareSme}" update="@form"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.sm.sme.txt.no']}"
					onclick="confirmDeclareDialog.hide();" />
			</div>
		</p:confirmDialog>
		<p:confirmDialog id="confirmUploadDeleteDialog" closable="true"
			message="#{lbl['lbl.sm.sme.upload.delete.message']}"
			header="#{lbl['lbl.sm.sme.upload.delete.confirm.header']}"
			severity="alert" widgetVar="confirmUploadDeleteDialog">
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.sme.txt.yes']}"
					onclick="confirmUploadDeleteDialog.hide();"
					action="#{smUpdateSmeInfoBackingBean.deleteAttachment}"
					update="@form" partialSubmit="true" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()" process="@this" />
				<p:commandButton value="#{lbl['lbl.sm.sme.txt.no']}"
					onclick="confirmUploadDeleteDialog.hide();" />
			</div>
		</p:confirmDialog>
		<p:confirmDialog id="confirmDeleteDialog" closable="true"
			message="#{lbl['lbl.sm.sme.delete.confirm.msg']}"
			header="#{lbl['lbl.sm.sme.confirm.delete.header']}" severity="alert"
			widgetVar="confirmDeleteDialog">
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.sme.txt.yes']}"
					partialSubmit="true" update="@this" process="@this"
					action="#{smUpdateSmeInfoBackingBean.deleteSme}"
					onclick="confirmDeleteDialog.hide();"
					oncomplete="blockWidget.hide()"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.sm.sme.txt.no']}"
					onclick="confirmDeleteDialog.hide();" />
			</div>
		</p:confirmDialog>
		<p:dialog id="uploadDialog" widgetVar="uploadDialog" modal="true"
			dynamic="true" resizable="false" width="700px" height="200"
			styleClass="pop_up_top"
			header="#{lbl['lbl.sm.sme.upload.choose.file']}"
			onShow="singleUploadListener(uploadWV);">
			<p:fileUpload widgetVar="uploadWV"
				allowTypes="/(\.|\/)(pdf|doc|docx)$/" sizeLimit="20000000"
				invalidFileMessage="#{lbl['lbl.sm.sme.upload.suppDoc.format.errmsg']}"
				invalidSizeMessage="#{lbl['lbl.sm.sme.upload.fileSize.exceed20Mb']}"
				fileUploadListener="#{smUpdateSmeInfoBackingBean.handleSupDocFileAttachment}"
				update="smeSuppDocDtId" oncomplete="uploadDialog.hide();"
				uploadLabel="#{lbl['lbl.sm.sme.action.upload']}"
				label="#{lbl['lbl.sm.sme.action.choose']}"
				cancelLabel="#{lbl['lbl.sm.sme.action.cancel']}" multiple="false"
				showButtons="false" />
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.sme.upload.suppDoc.note.1']}" />
			<br />
			<br />
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.sme.upload.suppDoc.note.2']}" />
			<br />
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.sme.upload.suppDoc.note.3']}" />
		</p:dialog>
		<p:dialog id="smeDefinitionWidget" widgetVar="smeDefinitionWidget"
			modal="true" dynamic="true" resizable="false" width="900px"
			height="700px" styleClass="pop_up_top"
			header="#{lbl['lbl.sm.sme.definition']}">
			<p:media
				value="#{smUpdateSmeInfoBackingBean.getMedia('smeDefinition')}"
				width="100%" height="700px" player="pdf" />
			<p:panelGrid styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="100%" style="text-align:right">
						<p:commandButton value="#{lbl['lbl.sm.sme.action.close']}"
							onclick="#{cc.attrs.dialogWidget}.hide()" />
					</p:column>
				</p:row>
			</p:panelGrid>
		</p:dialog>
		<p:dialog id="smeCertWidget" widgetVar="smeCertWidget" modal="true"
			dynamic="true" resizable="false" width="900px" height="700px"
			styleClass="pop_up_top" header="#{lbl['lbl.sm.sme.regCert']}">
			<p:media value="#{smUpdateSmeInfoBackingBean.getMedia('smeCert')}"
				width="100%" height="700px" player="pdf" />
			<p:panelGrid styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="100%" style="text-align:right">
						<p:commandButton value="#{lbl['lbl.sm.sme.action.close']}"
							onclick="#{cc.attrs.dialogWidget}.hide()" />
					</p:column>
				</p:row>
			</p:panelGrid>
		</p:dialog>
	</ui:define>
</ui:composition>
