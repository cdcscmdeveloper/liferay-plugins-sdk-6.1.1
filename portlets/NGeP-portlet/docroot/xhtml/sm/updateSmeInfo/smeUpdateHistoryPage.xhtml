<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_updateSmeInfo_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					"#{lbl['lbl.sm.sme.update.info']}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" closable="true"
			showSummary="false" escape="false" />
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:outputPanel>
			<div align="left">
				<p:commandButton value="#{lbl['lbl.sm.sme.action.back']}"
					partialSubmit="true" update="@this" process="@this"
					action="#{smUpdateSmeInfoBackingBean.proceedAfterAcceptTnC}"
					onclick="blockWidget.show()" oncomplete="blockWidget.hide()"></p:commandButton>
			</div>
		</p:outputPanel>
		<p:panel toggleable="true" id="SmeHistoryPanelId">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sm.sme.info.history']}"
					style="white-space: nowrap !important; float: left !important;" />
			</f:facet>
			<p:dataTable var="sme" id="smeUpdateHistoryList"
				value="#{smUpdateSmeInfoBackingBean.managedBean.supplierSmeList}"
				emptyMessage="#{lbl['lbl.sm.sme.msg.no.records.found']}"
				rowIndexVar="index">
				<p:column headerText="#{lbl['lbl.sm.sme.app.no']}"
					style="width : 55%;">
					<h:outputText value="#{sme.applNo}"
						style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.sme.status.type']}"
					style="width : 55%;">
					<h:outputText value="#{lbl['lbl.sm.sme.status.type.manmicro']}"
						rendered="#{sme.smeStatusType eq 'MANMICRO'}"
						style="float: left;white-space: normal;" />
					<h:outputText value="#{lbl['lbl.sm.sme.status.type.mansmall']}"
						rendered="#{sme.smeStatusType eq 'MANSMALL'}"
						style="float: left;white-space: normal;" />
					<h:outputText value="#{lbl['lbl.sm.sme.status.type.manmed']}"
						rendered="#{sme.smeStatusType eq 'MANMED'}"
						style="float: left;white-space: normal;" />
					<h:outputText value="#{lbl['lbl.sm.sme.status.type.sermicro']}"
						rendered="#{sme.smeStatusType eq 'SERMICRO'}"
						style="float: left;white-space: normal;" />
					<h:outputText value="#{lbl['lbl.sm.sme.status.type.sersmall']}"
						rendered="#{sme.smeStatusType eq 'SERSMALL'}"
						style="float: left;white-space: normal;" />
					<h:outputText value="#{lbl['lbl.sm.sme.status.type.sermed']}"
						rendered="#{sme.smeStatusType eq 'SERMED'}"
						style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.sme.reg.status']}"
					style="width : 55%;">
					<h:outputText value="#{lbl['lbl.sm.sme.txt.yes']}"
						rendered="#{sme.smeCorpRegistered}"
						style="float: left;white-space: normal;" />
					<h:outputText value="#{lbl['lbl.sm.sme.txt.no']}"
						rendered="#{not sme.smeCorpRegistered}"
						style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.sme.ref.no']}"
					style="width : 55%;">
					<h:outputText value="#{sme.smeRefNo}"
						rendered="#{not empty sme.smeRefNo}"
						style="float: left;white-space: normal;" />
					<h:outputText value="#{lbl['lbl.sm.sme.txt.no.available']}"
						rendered="#{empty sme.smeRefNo}"
						style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.sme.valid.start']}"
					style="width : 55%;">
					<h:outputText value="#{sme.smeValidStartDate}"
						rendered="#{not empty sme.smeValidStartDate}"
						style="float: left;white-space: normal;">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
					<h:outputText value="#{lbl['lbl.sm.sme.txt.no.available']}"
						rendered="#{empty sme.smeValidStartDate}"
						style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.sme.valid.end']}"
					style="width : 55%;">
					<h:outputText value="#{sme.smeValidEndDate}"
						rendered="#{not empty sme.smeValidEndDate}"
						style="float: left;white-space: normal;">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
					<h:outputText value="#{lbl['lbl.sm.sme.txt.no.available']}"
						rendered="#{empty sme.smeValidEndDate}"
						style="float: left;white-space: normal;" />
				</p:column>
				<!-- #29617 Start - add table column -->
				<p:column headerText="#{lbl['lbl.sm.sme.declared.date']}"
					style="width : 55%;">
					<h:outputText value="#{sme.smeDeclaredDate}"
						rendered="#{not empty sme.smeDeclaredDate}"
						style="float: left;white-space: normal;">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
					<h:outputText value="#{lbl['lbl.sm.sme.txt.no.available']}"
						rendered="#{empty sme.smeDeclaredDate}"
						style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.sme.deleted.date']}"
					style="width : 55%;">
					<h:outputText value="#{sme.smeDeletedDate}"
						rendered="#{not empty sme.smeDeletedDate}"
						style="float: left;white-space: normal;">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
					<h:outputText value="#{lbl['lbl.sm.sme.txt.no.available']}"
						rendered="#{empty sme.smeDeletedDate}"
						style="float: left;white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.sme.action.by']}"
					style="width : 55%;">
					<h:outputText value="#{sme.actionedBy}"
						rendered="#{not empty sme.actionedBy}"
						style="float: left;white-space: normal;">
					</h:outputText>
					<h:outputText value="#{lbl['lbl.sm.sme.txt.no.available']}"
						rendered="#{empty sme.actionedBy}"
						style="float: left;white-space: normal;" />
				</p:column>
				<!-- #29617 End -->
				<p:column headerText="#{lbl['lbl.sm.sme.supp.doc']}"
					style="width : 55%;">
					<p:commandLink ajax="false"
						rendered="#{not empty sme.smSmeSupplierDocs[0].fileName}">
						<p:graphicImage value="/css/images/design/download.png"
							style="margin-right:2px;" />
						<p:fileDownload
							value="#{smUpdateSmeInfoBackingBean.commonDownload(sme.smSmeSupplierDocs[0].filePath,sme.smSmeSupplierDocs[0].fileName,sme.smSmeSupplierDocs[0].fileName)}" />
					</p:commandLink>
					<h:outputText value="#{lbl['lbl.sm.sme.txt.no.available']}"
						rendered="#{empty sme.smSmeSupplierDocs[0].fileName}"
						style="float: left;white-space: normal;" />
				</p:column>
			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
