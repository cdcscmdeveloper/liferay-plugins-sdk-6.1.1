<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
<p:panel header="#{lbl['lbl.sm.equiComp.panHdr']}" toggleable="true">
			<p:dataTable var="equiBean" widgetVar="suppEquiCompDtWidVar"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{cc.attrs.bBean.managedBean.smEquityCompaniesSsm}"
				rowKey="#{equiBean}" rowIndexVar="index" id="eqiComDt">
				<ac:paginator for="eqiComDt" />

				<p:column headerText="#{lbl['lbl.sm.equiComp.compName']}">
					<h:outputText value="#{equiBean.companyName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.equiComp.addr']}">
					<h:outputText
						value="#{cc.attrs.bBean.getFullAddress(equiBean.smAddress)}"
						style="float : left" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.equiComp.shrAmt.roc']}">
					<h:outputText value="#{equiBean.shareAmtSsm}"><!-- #31403 -->
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.equiComp.shrPerc']}">
					<h:outputText value="#{equiBean.sharePercentage}" >
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE_EQUITY)}" />
					</h:outputText>
				</p:column>
				
			</p:dataTable>			
		
	</p:panel>
	</ui:composition>
