<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<!-- 
		<script>
			$('#portlet_MOFApplication_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					"#{lbl['lbl.sm.view.ssm.infomation']}");
		</script>
		-->
		<p:panel header="#{lbl['lbl.sm.panHdr.comBasic']}" toggleable="true"
			toggleSpeed="500">

			<h:panelGrid columns="2" layout="grid">
				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.companyname']} :"></h:outputLabel>
				<h:outputText
					value="#{backingBean.managedBean.smAppl.smCompanyBasic.companyName}"></h:outputText>

				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.regtype']} :"></h:outputLabel>
				<h:outputText
					value="#{backingBean.getParameterDesc(backingBean.managedBean.businessTypeParamCode,backingBean.managedBean.smSupplier.businessType)}"></h:outputText>

				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.txt.business.reg.no']} :"></h:outputLabel>
				<h:outputText value="#{backingBean.managedBean.smSupplier.regNo}"></h:outputText>
				
				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.new.business.regNo']} :"></h:outputLabel>
				<h:outputText value="#{backingBean.managedBean.smSupplier.ssmNewRegNo}" rendered="#{!empty backingBean.managedBean.smSupplier.ssmNewRegNo}"></h:outputText>
				<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty backingBean.managedBean.smSupplier.ssmNewRegNo}"></h:outputText>
				
				<!-- #33783 - start -->
				<c:if test="#{backingBean.managedBean.smAppl.smCompanyBasic.businessType == 'I'
							or backingBean.managedBean.smAppl.smCompanyBasic.businessType == 'J'}">
				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.clbg']} :" />
				<h:outputText value="#{backingBean.managedBean.smAppl.smCompanyBasic.companyTypeSSM == SupplierManagementConst.COMPANY_TYPE_CLBG ?
							lbl['lbl.btn.yes'] : lbl['lbl.btn.no']}" />
				</c:if>
				<!-- #33783 - end -->
				
				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.estdate']} :"></h:outputLabel>
				<h:outputText
					value="#{backingBean.managedBean.smAppl.smCompanyBasic.establishDate}">
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>

				<c:if
					test="#{backingBean.managedBean.smSupplier.businessType == SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROB_PERKONGSIAN_SEMENANJUNG or backingBean.managedBean.smSupplier.businessType == SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROB_PERSEORANGAN_SEMENANJUNG}"> <!-- #31403 -->
					<h:outputLabel style="font-weight:bold"
						value="#{lbl['lbl.sm.account.rob.expire']} :"></h:outputLabel>
					<h:outputText 
						value="${backingBean.managedBean.smAppl.smCompanyBasic.robExpiryDate}">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</c:if>

				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.status']} :"></h:outputLabel>
				<h:outputText
					value="#{backingBean.setStatusMessageFromSSM(backingBean.managedBean.smAppl.smCompanyBasic.companySsmStatus)}"></h:outputText>

				<h:outputLabel
					style="font-weight:bold;display: inline-block; vertical-align: top;"
					value="#{lbl['lbl.sm.companyaddress']} :"></h:outputLabel>
				<h:outputText
					value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1} &lt;br/&gt;#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2} &lt;br/&gt;#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}"
					escape="false"></h:outputText>

				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.state']} :"></h:outputLabel>
				<h:outputText
					value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateName}"></h:outputText>

				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.postcode']} :"></h:outputLabel>
				<h:outputText
					value="#{backingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}"></h:outputText>
	
				<c:if test="#{backingBean.managedBean.smSupplier.businessType == SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_SDN_BHD or backingBean.managedBean.smSupplier.businessType == SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_BHD}">
				<h:outputLabel style="font-weight:bold" 
					value="#{lbl['lbl.sm.annualRev']} :"></h:outputLabel>
					<h:panelGrid columns="3" layout="grid"> 
						<h:outputText value="#{backingBean.managedBean.smAppl.smCompanyBasic.annualRevenueSSM}" rendered="#{!backingBean.managedBean.smAppl.smCompanyBasic.revenueSsmNull}">
							<f:convertNumber groupingUsed="true" maxFractionDigits="3" minFractionDigits="3" />
						</h:outputText>
						<h:outputText>&#160;&#160;</h:outputText>
						<p:selectOneMenu rendered="#{!backingBean.managedBean.smAppl.smCompanyBasic.revenueSsmNull}" style="width: 207px;margin-bottom: 5px;"
							label="#{lbl['lbl.sm.annualRev']}" required="true"
							id="smSupAnnRev"
							disabled="true"
							value="#{backingBean.managedBean.smAppl.smCompanyBasic.annualRevenue}">
							<f:selectItems value="#{backingBean.getDropdownValues('SAR')}" />
						</p:selectOneMenu>
					</h:panelGrid>

					<h:outputLabel style="font-weight:bold"
						value="#{lbl['lbl.sm.totalIssued']} :"></h:outputLabel>
					<h:outputText
						value="#{backingBean.managedBean.smAppl.smCompanyBasic.paidUpCapitalSSM}">
						<f:convertNumber groupingUsed="true" maxFractionDigits="3"
							minFractionDigits="3" />
					</h:outputText>

				</c:if>
				<!-- <h:outputText
					value="#{backingBean.getParameterDesc('SAR',backingBean.managedBean.smAppl.smCompanyBasic.annualRevenue)}"></h:outputText> -->
			</h:panelGrid>
		</p:panel>

		<c:if
			test="#{backingBean.managedBean.smSupplier.businessType == SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROB_PERKONGSIAN_SEMENANJUNG or backingBean.managedBean.smSupplier.businessType == SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROB_PERSEORANGAN_SEMENANJUNG}"> <!-- #31403 -->
			<ui:include
				src="/xhtml/sm/renewMofApplication/viewSsmInformationBranch.xhtml" />
		</c:if>

		<ui:include
			src="/xhtml/sm/renewMofApplication/viewSsmInformationOwnerDirector.xhtml" />
		
		<c:if test="#{backingBean.managedBean.smSupplier.businessType eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_BHD or backingBean.managedBean.smSupplier.businessType eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_SDN_BHD}"><!-- #31403 -->
			<ui:include
				src="/xhtml/sm/renewMofApplication/viewSsmInformationCompanyEquity.xhtml" />
		</c:if><!-- #31403 -->

		<ui:include
			src="/xhtml/sm/renewMofApplication/viewSsmInformationPersonnel.xhtml" />

		<ui:include
			src="/xhtml/sm/renewMofApplication/viewSsmInformationNatureBusiness.xhtml" />
			
			
	</ui:define>
</ui:composition>
