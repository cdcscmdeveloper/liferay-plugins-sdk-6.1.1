<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: top;" class="sidemenutd"><ui:include
					src="smRenewApplnSideMenuItem.xhtml" /></td>
			
			<c:choose>
				<c:when test="#{backingBean.managedBean.editVO.disciplinary}">
					<td style="vertical-align: top; float: left;">
						<p:outputLabel style="color:red;" 
							value="#{lbl['lbl.sm.not.allow.to.update.this.section']}"/>
					</td>
				</c:when>
				<c:otherwise>
					<td style="vertical-align: top;">
						<p:outputPanel
								id="renewStep1OnlySuppPan"
								rendered="#{backingBean.managedBean.supplierUser}">
								
							<table style="width: 100%!important">
								<tr>
									<td>
										
									</td>
									<td>
										<div align="right" style="width: 99%" class="button-wrapper">
											<ui:include
												src="/xhtml/sm/shared/mofRegistration/deleteApplicationCommonPage.xhtml" />
											<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
												onclick="this.disabled=true;"
												onstart="blockWidget.show()" oncomplete="this.disabled=false;blockWidget.hide();"
												actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
												action="#{backingBean.saveApplicationAsDraft(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType)}"
												update=":form" style="margin-bottom:5px;" />
										</div>
									</td>
								</tr>
							</table>
						</p:outputPanel> 
						<!-- #28741 BPKU:#27565 - start-->
						<c:choose>
							<c:when test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForBumi}">
							<ui:include src="/xhtml/sm/shared/applViewOnlyPages/companyBasicInfoFormViewOnly.xhtml" />
							<ui:include src="/xhtml/sm/shared/applViewOnlyPages/staffInfoFormViewOnly.xhtml" />
							<ui:include src="/xhtml/sm/shared/applViewOnlyPages/officeFacilityTypeFormViewOnly.xhtml" />
							<ui:include src="/xhtml/sm/shared/applViewOnlyPages/certificateInfoFormViewOnly.xhtml" />
							<ui:fragment rendered="#{viewSmApplBackingBean.managedBean.smAppl.supplierType eq 'J'}">
								<ui:include src="/xhtml/sm/shared/applViewOnlyPages/proffesionalBodyInfoFormViewOnly.xhtml" />
							</ui:fragment>
							<ui:fragment rendered="#{backingBean.managedBean.smAppl.supplierType ne 'J'}">
								<ui:include src="/xhtml/sm/shared/applViewOnlyPages/transactionNetworksFormViewOnly.xhtml" />
							</ui:fragment>
							</c:when>
							
							<c:otherwise>
							<ui:include src="/xhtml/sm/shared/mofRegistration/AccountInfoDetail.xhtml" />
							<ui:include src="/xhtml/sm/shared/mofRegistration/companyBasicInfoForm.xhtml" />
							<ui:include src="/xhtml/sm/shared/mofRegistration/staffInfoForm.xhtml" />
							<ui:include src="/xhtml/sm/shared/mofRegistration/officeFacilityTypeForm.xhtml" />
							<ui:include src="/xhtml/sm/shared/mofRegistration/certifacteInfoForm.xhtml" />
							<ui:fragment rendered="#{backingBean.managedBean.smAppl.supplierType eq 'J'}">
								<ui:include src="/xhtml/sm/shared/mofRegistration/proffesionalBodyInfoForm.xhtml" />
							</ui:fragment>
							<ui:fragment rendered="#{backingBean.managedBean.smAppl.supplierType ne 'J'}">
								<ui:include src="/xhtml/sm/shared/mofRegistration/transactionNetworksForm.xhtml" />
							</ui:fragment>
							
							</c:otherwise>
						</c:choose>
						<!-- #28741 BPKU:#27565 - end -->
						<div class="nav-wrapper">
							<table style="width: 100%">
								<tr>
									<td></td>
									<td>
										<div align="right" style="width: 100%">
											<p:commandButton value="#{lbl['lbl.sm.next.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
												actionListener="#{backingBean.setTabValue('0','1')}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_BASIC,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH)}"
												update=":form" iconPos="right" />
										</div>
									</td>
								</tr>
							</table>
						</div></td>
				</c:otherwise>
			</c:choose>
			
		</tr>

	</table>
</ui:composition>
