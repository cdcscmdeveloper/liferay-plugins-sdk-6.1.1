<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sm.person.panHdr']}" id="personnelInfo"
		toggleable="true">
		
		<p:dataTable var="person" widgetVar="suppPersonnelInfoDtWidVar"
			editable="false"
			value="#{cc.attrs.bBean.managedBean.personnelsSsm}"
			rowKey="#{person}" rowIndexVar="index" id="personDt" rows="5" sortBy="#{person.name}">
			<ac:paginator for="personDt" />
			
			<p:column style="width:3%" styleClass="column-align-center" headerText="#{lbl['lbl.sm.no']}">
				<h:outputText value="#{index + 1}" />
			</p:column>
			
			<p:column styleClass="column-align-center" headerText="#{lbl['lbl.sm.worker.name']}">
				<h:outputText value="#{person.name}" />
			</p:column>

			<p:column styleClass="column-align-center" headerText="#{lbl['lbl.sm.identificationtype.ic']} / #{lbl['lbl.sm.identificationtype.passport']}">
				<h:outputText value="#{person.identificationNo}" />
			</p:column>
			
			<p:column styleClass="column-align-center" headerText="#{lbl['lbl.sm.address']}">
				<h:outputText
					rendered="#{not empty person.smPersonnelAddresses[0].smAddress.address1}"
					value="#{person.smPersonnelAddresses[0].smAddress.address1}"
					converter="toUpperCaseConverter" />
				<h:outputText
					rendered="#{not empty person.smPersonnelAddresses[0].smAddress.address2}"
					value="&lt;br/&gt; #{person.smPersonnelAddresses[0].smAddress.address2}"
					escape="false" converter="toUpperCaseConverter" />
				<h:outputText
					rendered="#{not empty person.smPersonnelAddresses[0].smAddress.address3}"
					value="&lt;br/&gt; #{person.smPersonnelAddresses[0].smAddress.address3}"
					escape="false" converter="toUpperCaseConverter" />
				<h:outputText
					rendered="#{not empty person.smPersonnelAddresses[0].smAddress.postcode}"
					value="&lt;br/&gt; #{person.smPersonnelAddresses[0].smAddress.postcode}"
					escape="false" converter="toUpperCaseConverter" />
				<h:outputText
					rendered="#{not empty person.smPersonnelAddresses[0].smAddress.pmState.stateName}"
					value="&lt;br/&gt; #{person.smPersonnelAddresses[0].smAddress.pmState.stateName}"
					escape="false" converter="toUpperCaseConverter" />
			</p:column>
			
			<p:column styleClass="column-align-center" headerText="#{lbl['lbl.sm.userprofile.designation']}">
				<h:outputText rendered="#{not empty person.designation}" value="#{person.designation}" />
			</p:column>
			
		</p:dataTable>
	</p:panel>
</ui:composition>
