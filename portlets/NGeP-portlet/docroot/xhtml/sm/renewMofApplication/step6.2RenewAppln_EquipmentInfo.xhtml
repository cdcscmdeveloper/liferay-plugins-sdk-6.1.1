<ui:composition xmlns="http://www.w3.org/1999/xhtml"

	xmlns:h="http://java.sun.com/jsf/html"

	<table style="width: 100%">

							<td><div align="right" style="width: 99%">

										action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
