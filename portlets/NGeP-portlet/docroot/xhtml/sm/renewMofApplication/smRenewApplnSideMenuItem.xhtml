<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:tabMenu activeIndex="#{backingBean.managedBean.tabActiveIndex}"
		styleClass="sidemenu">

		<p:menuitem value="#{lbl['lbl.sm.companyStepLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_BASIC)}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'0')}"
			action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_BASIC)}"
			update=":form" />
		<p:menuitem value="#{lbl['lbl.sm.branchStepLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH)}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'1')}"
			action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH)}"
			update=":form" />
		<p:menuitem value="#{lbl['lbl.sm.personStepLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_PERSONNEL)}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'2')}"
			action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_PERSONNEL)}"
			update=":form" />
		<p:menuitem value="#{lbl['lbl.sm.capitalStepLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUITY)}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'3')}"
			action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUITY)}"
			update=":form" />
		<p:menuitem value="#{lbl['lbl.sm.bankStepLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'4')}"
			action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
			update=":form" />
		<p:menuitem value="#{lbl['lbl.sm.catCodeStepLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'5',SupplierManagementConst.SM_APPL_BUTTON_TYPE_SAME)}"
			action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
			update=":form" />
		<c:choose>
			<c:when
				test="#{backingBean.managedBean.smAppl.applCategoryType eq 'S'}">

				<p:menuitem value="#{lbl['lbl.sm.factoryStepLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY)}"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'6')}"
					action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY)}"
					update=":form" />

				<p:menuitem value="#{lbl['lbl.sm.equipmentStepLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'7')}"
					action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
					update=":form" />

				<c:choose>
					<c:when test="#{backingBean.managedBean.supplierUser }">
						<p:menuitem value="#{lbl['lbl.sm.supDocStepLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'8')}"
							action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
							update=":form" />

					</c:when>
					<c:when test="#{backingBean.managedBean.poUser}">

						<p:menuitem value="#{lbl['lbl.sm.docsReviewLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'8')}"
							action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
							update=":form" />
						<c:choose>
							<c:when test="#{backingBean.managedBean.reviewSiteVisit}">
								<p:menuitem value="#{lbl['lbl.sm.siteReviewLbl']}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'9')}"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SITEVISITREV)}"
									update=":form" />
								<p:menuitem value="#{lbl['lbl.sm.poDecisionLbl']}"
									style="white-space: normal;" onstart="blockWidget.show()"
									oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'10')}"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_PODEC)}"
									update=":form" />
							</c:when>
							<c:otherwise>
								<p:menuitem value="#{lbl['lbl.sm.poDecisionLbl']}"
									style="white-space: normal;" onstart="blockWidget.show()"
									oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'9')}"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_PODEC)}"
									update=":form" />
							</c:otherwise>
						</c:choose>

					</c:when>
					<c:when test="#{backingBean.managedBean.approverUser}">
						<p:menuitem value="#{lbl['lbl.sm.docsReviewLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'8')}"
							action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
							update=":form" />
						<c:choose>
							<c:when test="#{backingBean.managedBean.reviewSiteVisit}">
								<p:menuitem value="#{lbl['lbl.sm.siteReviewLbl']}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'9')}"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SITEVISITREV)}"
									update=":form" />
								<p:menuitem value="#{lbl['lbl.sm.aprvrDecisionLbl']}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'10')}"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_APPRDEC)}"
									update=":form" />
							</c:when>
							<c:otherwise>
								<p:menuitem value="#{lbl['lbl.sm.aprvrDecisionLbl']}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'9')}"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_APPRDEC)}"
									update=":form" />
							</c:otherwise>
						</c:choose>

					</c:when>
					<c:otherwise>
					</c:otherwise>
				</c:choose>

			</c:when>
			<c:otherwise>
				<c:choose>
					<c:when test="#{backingBean.managedBean.supplierUser }">
						<p:menuitem value="#{lbl['lbl.sm.supDocStepLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'6')}"
							action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
							update=":form" />

					</c:when>
					<c:when test="#{backingBean.managedBean.poUser}">

						<p:menuitem value="#{lbl['lbl.sm.docsReviewLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'6')}"
							action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
							update=":form" />
						<c:choose>
							<c:when test="#{backingBean.managedBean.reviewSiteVisit}">
								<p:menuitem value="#{lbl['lbl.sm.siteReviewLbl']}" 
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'7')}"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SITEVISITREV)}"
									update=":form" />
								<p:menuitem value="#{lbl['lbl.sm.poDecisionLbl']}"
									style="white-space: normal;" onstart="blockWidget.show()"
									oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'8')}"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_PODEC)}"
									update=":form" />
							</c:when>
							<c:otherwise>
								<p:menuitem value="#{lbl['lbl.sm.poDecisionLbl']}"
									style="white-space: normal;" onstart="blockWidget.show()"
									oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'7')}"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_PODEC)}"
									update=":form" />
							</c:otherwise>
						</c:choose>

					</c:when>
					<c:when test="#{backingBean.managedBean.approverUser}">
						<p:menuitem value="#{lbl['lbl.sm.docsReviewLbl']}" icon="#{backingBean.getStepIcon(SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'6')}"
							action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
							update=":form" />
						<c:choose>
							<c:when test="#{backingBean.managedBean.reviewSiteVisit}">
								<p:menuitem value="#{lbl['lbl.sm.siteReviewLbl']}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'7')}"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SITEVISITREV)}"
									update=":form" />
								<p:menuitem value="#{lbl['lbl.sm.aprvrDecisionLbl']}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'8')}"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_APPRDEC)}"
									update=":form" />
							</c:when>
							<c:otherwise>
								<p:menuitem value="#{lbl['lbl.sm.aprvrDecisionLbl']}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,'7')}"
									action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType,SupplierManagementConst.SM_APPL_PAGE_TYPE_APPRDEC)}"
									update=":form" />
							</c:otherwise>
						</c:choose>

					</c:when>
					<c:otherwise>
					</c:otherwise>
				</c:choose>
			</c:otherwise>
		</c:choose>
	</p:tabMenu>

</ui:composition>
