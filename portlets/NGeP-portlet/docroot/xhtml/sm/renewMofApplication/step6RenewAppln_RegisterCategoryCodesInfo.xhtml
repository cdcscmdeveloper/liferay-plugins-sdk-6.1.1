<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: top;" class="sidemenutd"><ui:include
					src="smRenewApplnSideMenuItem.xhtml" /></td>
			<td style="vertical-align: top;">
			<!-- #12483 - START, #34892 -->
			<ac:smReviseReason bBean="#{backingBean}"/><br/>
			<!-- #12483 - END -->
			<p:outputPanel
					id="renewStep6OnlySuppPan"
					rendered="#{backingBean.managedBean.supplierUser}">
					<div align="right" style="width: 99%" class="button-wrapper">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/deleteApplicationCommonPage.xhtml" />
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							onclick="this.disabled=true;"
							onstart="blockWidget.show()" oncomplete="this.disabled=false;blockWidget.hide();"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType)}"
							update=":form" style="margin-bottom:5px;" />
					</div>
				</p:outputPanel> 
					<c:if test="#{backingBean.managedBean.smAppl.applType ne 'R'}">
						<ui:include src="/xhtml/sm/shared/mofRegistration/regCatCodesForm.xhtml" />
					</c:if>
					<c:if test="#{backingBean.managedBean.smAppl.applType eq 'R'}">
						<ui:include src="/xhtml/sm/shared/mofRegistration/regCatcodesExistingRenewalInfoForm.xhtml" />
					</c:if>
				<div class="nav-wrapper">
					<c:choose>
						<!-- #26671 - Site Visit Grouping Enhancement - 28775 -->
						<c:when test="#{backingBean.managedBean.smAppl.applCategoryType eq 'S' or backingBean.managedBean.specialCategoryRechecked}">
							<c:choose>
							<c:when test="#{backingBean.managedBean.smAppl.applValidWithSsm and backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
							<table style="width: 100%">
								<tr>
									<td><div align="left" style="width: 100%">
											<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
												actionListener="#{backingBean.setTabValue('6','5',SupplierManagementConst.SM_APPL_BUTTON_TYPE_PREV)}"
												rendered="#{backingBean.managedBean.smSupplier.businessType eq 'I' or backingBean.managedBean.smSupplier.businessType eq 'J'}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
												update=":form" />
										</div></td>
									<td><div align="right" style="width: 100%">
											<p:commandButton value="#{lbl['lbl.sm.next.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
												actionListener="#{backingBean.setTabValue('6','7')}"
												rendered="#{backingBean.managedBean.smSupplier.businessType eq 'I' or backingBean.managedBean.smSupplier.businessType eq 'J'}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY)}"
												update=":form" />
										</div></td>
								</tr>
							</table>
							</c:when>
							<c:otherwise>
							<table style="width: 100%">
								<tr>
									<td><div align="left" style="width: 100%">
											<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
												actionListener="#{backingBean.setTabValue('5','4',SupplierManagementConst.SM_APPL_BUTTON_TYPE_PREV)}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
												update=":form" />
										</div></td>
									<td><div align="right" style="width: 100%">
											<p:commandButton value="#{lbl['lbl.sm.next.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
												actionListener="#{backingBean.setTabValue('5','6')}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY)}"
												update=":form" />
										</div></td>
								</tr>
							</table>
							</c:otherwise>
							</c:choose>
						</c:when>
						<c:otherwise>
							<table style="width: 100%">
								<tr>
								<td><div align="left" style="width: 100%">	
								<c:choose> 
									<c:when test="#{backingBean.managedBean.smAppl.applValidWithSsm and backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
									<c:choose>
									 <c:when test="#{backingBean.managedBean.smSupplier.businessType eq 'I' or backingBean.managedBean.smSupplier.businessType eq 'J'}">
											<p:commandButton value="#{lbl['lbl.sm.prev.section']}" 
												onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
												actionListener="#{backingBean.setTabValue('6','5',SupplierManagementConst.SM_APPL_BUTTON_TYPE_PREV)}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
												update=":form" />
									</c:when>
									<c:otherwise>
												<p:commandButton value="#{lbl['lbl.sm.prev.section']}" 
												onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
												actionListener="#{backingBean.setTabValue('5','4',SupplierManagementConst.SM_APPL_BUTTON_TYPE_PREV)}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
												update=":form" />
									</c:otherwise>
									</c:choose>
									</c:when>
									<c:otherwise>
											<p:commandButton value="#{lbl['lbl.sm.prev.section']}" rendered="#{!backingBean.managedBean.editVO.disciplinary}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
												actionListener="#{backingBean.setTabValue('5','4',SupplierManagementConst.SM_APPL_BUTTON_TYPE_PREV)}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
												update=":form" />
									</c:otherwise>
								</c:choose>
								</div></td>
								
									<td><div align="right" style="width: 100%">
									<c:choose> 
									<c:when test="#{backingBean.managedBean.smAppl.applValidWithSsm and backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
									<c:choose>
									<c:when test="#{backingBean.managedBean.smSupplier.businessType eq 'I' or backingBean.managedBean.smSupplier.businessType eq 'J'}">		
											<p:commandButton value="#{lbl['lbl.sm.next.section']}" rendered="#{backingBean.managedBean.smAppl.applValidWithSsm}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
												actionListener="#{backingBean.setTabValue('6','7')}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
												update=":form" />
									</c:when>
									<c:otherwise>
											<p:commandButton value="#{lbl['lbl.sm.next.section']}" rendered="#{backingBean.managedBean.smAppl.applValidWithSsm}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
												actionListener="#{backingBean.setTabValue('5','6')}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
												update=":form" />
									</c:otherwise>	
									</c:choose>
									</c:when>
									<c:otherwise>
											<p:commandButton value="#{lbl['lbl.sm.next.section']}" rendered="#{!backingBean.managedBean.editVO.disciplinary}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide();scrollToTop();"
												actionListener="#{backingBean.setTabValue('5','6')}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
												update=":form" />
									</c:otherwise>	
									</c:choose>
										</div></td>
								</tr>
							</table>
						</c:otherwise>
					</c:choose>
				</div></td>
		</tr>

	</table>
</ui:composition>
