<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: top;" class="sidemenutd"><ui:include
					src="smRenewApplnSideMenuItem.xhtml" /></td>
			<td style="vertical-align: top;"><p:outputPanel
					id="renewStep6OnlySuppPan"
					rendered="#{backingBean.managedBean.supplierUser}">
					<div align="right" style="width: 99%" class="button-wrapper">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/deleteApplicationCommonPage.xhtml" />
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							onclick="this.disabled=true;"
							onstart="blockWidget.show()" oncomplete="this.disabled=false;blockWidget.hide();"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType)}"
							update=":form" style="margin-bottom:5px;" />
					</div>
				</p:outputPanel> <ui:include
					src="/xhtml/sm/shared/mofRegistration/regCatCodesForm.xhtml" />
				<div class="nav-wrapper">
					<c:choose>
						<c:when
							test="#{backingBean.managedBean.smAppl.applCategoryType eq 'S'}">
							<table style="width: 100%">
								<tr>
									<td><div align="left" style="width: 100%">
											<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
												actionListener="#{backingBean.setTabValue('5','4',SupplierManagementConst.SM_APPL_BUTTON_TYPE_PREV)}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
												update=":form" />
										</div></td>
									<td><div align="right" style="width: 100%">
											<p:commandButton value="#{lbl['lbl.sm.next.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
												actionListener="#{backingBean.setTabValue('5','6')}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY)}"
												update=":form" />
										</div></td>
								</tr>
							</table>
						</c:when>
						<c:otherwise>
							<table style="width: 100%">
								<tr>
									<td><div align="left" style="width: 100%">
											<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
												actionListener="#{backingBean.setTabValue('5','4',SupplierManagementConst.SM_APPL_BUTTON_TYPE_PREV)}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
												update=":form" />
										</div></td>
									<td><div align="right" style="width: 100%">
											<p:commandButton value="#{lbl['lbl.sm.next.section']}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
												actionListener="#{backingBean.setTabValue('5','6')}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
												update=":form" />
										</div></td>
								</tr>
							</table>
						</c:otherwise>
					</c:choose>
				</div></td>
		</tr>

	</table>
</ui:composition>
