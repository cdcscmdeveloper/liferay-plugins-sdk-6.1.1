<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- Owner Information -->
	<p:panel header="#{lbl['lbl.sm.ownerinfo']}" id="ownerBusiness"
		toggleable="true">

		<p:dataTable id="tableOwner" var="varOwner" rowIndexVar="index"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			render="#{cc.attrs.bBean.managedBean.personnelsOwnerSsm != null and cc.attrs.bBean.managedBean.personnelsOwnerSsm.size() >0}"
			value="#{cc.attrs.bBean.managedBean.personnelsOwnerSsm}"
			rowKey="#{varOwner}"
			sortBy="#{varOwner.name}">
			<ac:paginator for="tableOwner" />

			<p:column style="width:3%" styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.no']}" />
				</f:facet>
				<h:outputText value="#{index + 1}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<c:if
						test="#{cc.attrs.bBean.managedBean.smAppl.smSupplier.businessType == SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROS_PERTUBUHAN}">
						<h:outputText value="#{lbl['lbl.sm.directorname']}" />
					</c:if>
					<c:if
						test="#{cc.attrs.bBean.managedBean.smAppl.smSupplier.businessType != SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROS_PERTUBUHAN}">
						<h:outputText value="#{lbl['lbl.sm.ownername']}" />
					</c:if>
				</f:facet>
				<h:outputText value="#{varOwner.name}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<c:if
						test="#{not empty varOwner.pmCountry and varOwner.pmCountry.countryCode != 'MY'}">
						<h:outputText value="#{lbl['lbl.sm.individual.passport']}" />
					</c:if>
					<c:if
						test="#{empty varOwner.pmCountry or varOwner.pmCountry.countryCode eq 'MY'}">
						<h:outputText value="#{lbl['lbl.sm.individual.newicno']}" />
					</c:if>
				</f:facet>
				<h:outputText value="#{varOwner.identificationNo}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.identificationtype']}" />
				</f:facet>
				<h:outputText
					value="#{cc.attrs.bBean.getParameterDesc(varOwner.identificationType)}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.nationality']}" />
				</f:facet>
				<!-- #31269 -->
				<h:outputText value="#{varOwner.pmCountry.countryName}" rendered="#{!varOwner.nationalitySsmNull}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.race']}" />
				</f:facet>
				<!-- #31269 -->
				<h:outputText value="#{varOwner.pmRace.raceName}" rendered="#{!varOwner.raceSsmNull}" />
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.address']}" />
				</f:facet>
				<!-- #31269 - start -->
				<h:outputText
					rendered="#{not empty varOwner.smPersonnelAddresses[0].smAddress.address1
								and not varOwner.smPersonnelAddresses[0].smAddress.addressSsmNull}"
					value="#{varOwner.smPersonnelAddresses[0].smAddress.address1}"
					converter="toUpperCaseConverter" />
				<h:outputText
					rendered="#{not empty varOwner.smPersonnelAddresses[0].smAddress.address2
								and not varOwner.smPersonnelAddresses[0].smAddress.addressSsmNull}"
					value="&lt;br/&gt; #{varOwner.smPersonnelAddresses[0].smAddress.address2}"
					escape="false" converter="toUpperCaseConverter" />
				<h:outputText
					rendered="#{not empty varOwner.smPersonnelAddresses[0].smAddress.address3
								and not varOwner.smPersonnelAddresses[0].smAddress.addressSsmNull}"
					value="&lt;br/&gt; #{varOwner.smPersonnelAddresses[0].smAddress.address3}"
					escape="false" converter="toUpperCaseConverter" />
				<h:outputText
					rendered="#{not empty varOwner.smPersonnelAddresses[0].smAddress.postcode} and
								not varOwner.smPersonnelAddresses[0].smAddress.postcodeSsmNull"
					value="&lt;br/&gt; #{varOwner.smPersonnelAddresses[0].smAddress.postcode}"
					escape="false" converter="toUpperCaseConverter" />
				<h:outputText
					rendered="#{not empty varOwner.smPersonnelAddresses[0].smAddress.pmState.stateName}
								and not varOwner.smPersonnelAddresses[0].smAddress.stateSsmNull}"
					value="&lt;br/&gt; #{varOwner.smPersonnelAddresses[0].smAddress.pmState.stateName}"
					escape="false" converter="toUpperCaseConverter" />
				<!-- #31269 - end -->
			</p:column>

			<p:column styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.person.dob']}" />
				</f:facet>
				<!-- #31269 -->
				<h:outputText value="#{varOwner.birthDate}" rendered="#{!varOwner.birthDateSsmNull}">
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>
			</p:column>
			
			<p:column styleClass="column-align-center" rendered="#{cc.attrs.bBean.managedBean.smSupplier.businessType eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_BHD or cc.attrs.bBean.managedBean.smSupplier.businessType eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_SDN_BHD}"> <!-- #31403 -->
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sm.equiComp.shrAmt.roc']}" />
					</f:facet>
				<h:outputText value="#{varOwner.shareAmtSsm}"><!-- #31403 -->
					<f:convertNumber groupingUsed="true" maxFractionDigits="2" minFractionDigits="2" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>

	<!-- Director Information -->
	<c:if test="#{cc.attrs.bBean.managedBean.smSupplier.businessType eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_BHD or cc.attrs.bBean.managedBean.smSupplier.businessType eq SupplierManagementConst.SM_SUPPLIER_BUSINESS_TYPE_ROC_SDN_BHD}"> <!-- #31403 -->
		<p:panel header="#{lbl['lbl.sm.directorinfo']}" id="directorBusiness"
			toggleable="true">

			<p:dataTable id="tableDirector" var="varDirector" rowIndexVar="index"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				render="#{cc.attrs.bBean.managedBean.smPersonnelDirectorSsm != null and cc.attrs.bBean.managedBean.smPersonnelDirectorSsm.size() >0}"
				value="#{cc.attrs.bBean.managedBean.smPersonnelDirectorSsm}"
				rowKey="#{varDirector}"
				sortBy="#{varDirector.name}">
				<ac:paginator for="tableDirector" />

				<p:column style="width:3%" styleClass="column-align-center">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.no']}" />
					</f:facet>
					<h:outputText value="#{index + 1}" />
				</p:column>

				<p:column styleClass="column-align-center">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.directorname']}" />
					</f:facet>
					<h:outputText value="#{varDirector.name}" />
				</p:column>

				<p:column styleClass="column-align-center">
					<f:facet name="header">
						<c:if
							test="#{not empty varDirector.pmCountry and varOwner.pmCountry.countryCode != 'MY'}">
							<h:outputText value="#{lbl['lbl.sm.individual.passport']}" />
						</c:if>
						<c:if
							test="#{empty varDirector.pmCountry or varOwner.pmCountry.countryCode eq 'MY'}">
							<h:outputText value="#{lbl['lbl.sm.individual.newicno']}" />
						</c:if>
					</f:facet>
					<h:outputText value="#{varDirector.identificationNo}" />
				</p:column>

				<p:column styleClass="column-align-center">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.identificationtype']}" />
					</f:facet>
					<h:outputText
						value="#{cc.attrs.bBean.getParameterDesc(varDirector.identificationType)}" />
				</p:column>

				<p:column styleClass="column-align-center">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.nationality']}" />
					</f:facet>
					<!-- #31269 -->
					<h:outputText value="#{varDirector.pmCountry.countryName}" rendered="#{!varDirector.nationalitySsmNull}" />
				</p:column>

				<p:column styleClass="column-align-center">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.person.race']}" />
					</f:facet>
					<!-- #31269 -->
					<h:outputText value="#{varDirector.pmRace.raceName}" rendered="#{!varDirector.raceSsmNull}" />
				</p:column>

				<p:column styleClass="column-align-center">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.address']}" />
					</f:facet>
					<!-- #31269 - start -->
					<h:outputText
						rendered="#{not empty varDirector.smPersonnelAddresses[0].smAddress.address1
									and not varDirector.smPersonnelAddresses[0].smAddress.addressSsmNull}"
						value="#{varDirector.smPersonnelAddresses[0].smAddress.address1}"
						converter="toUpperCaseConverter" />
					<h:outputText
						rendered="#{not empty varDirector.smPersonnelAddresses[0].smAddress.address2
									and not varDirector.smPersonnelAddresses[0].smAddress.addressSsmNull}"
						value="&lt;br/&gt; #{varDirector.smPersonnelAddresses[0].smAddress.address2}"
						escape="false" converter="toUpperCaseConverter" />
					<h:outputText
						rendered="#{not empty varDirector.smPersonnelAddresses[0].smAddress.address3
									and not varDirector.smPersonnelAddresses[0].smAddress.addressSsmNull}"
						value="&lt;br/&gt; #{varDirector.smPersonnelAddresses[0].smAddress.address3}"
						escape="false" converter="toUpperCaseConverter" />
					<h:outputText
						rendered="#{not empty varDirector.smPersonnelAddresses[0].smAddress.postcode and 
									not varDirector.smPersonnelAddresses[0].smAddress.postcodeSsmNull}"
						value="&lt;br/&gt; #{varDirector.smPersonnelAddresses[0].smAddress.postcode}"
						escape="false" converter="toUpperCaseConverter" />
					<h:outputText
						rendered="#{not empty varDirector.smPersonnelAddresses[0].smAddress.pmState.stateName
									and not varDirector.smPersonnelAddresses[0].smAddress.stateSsmNull}"
						value="&lt;br/&gt; #{varDirector.smPersonnelAddresses[0].smAddress.pmState.stateName}"
						escape="false" converter="toUpperCaseConverter" />
					<!-- #31269 - end -->
				</p:column>

				<p:column styleClass="column-align-center">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.person.dob']}" />
					</f:facet>
					<!-- #31269 -->
					<h:outputText value="#{varDirector.birthDate}" rendered="#{!varDirector.birthDateSsmNull}">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</p:column>

				<p:column styleClass="column-align-center">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.equiComp.shrAmt.roc']}" />
					</f:facet>
					<h:outputText value="#{varDirector.shareAmtSsm}"> <!-- #31403 -->
						<f:convertNumber groupingUsed="true" maxFractionDigits="2"
							minFractionDigits="2" />
					</h:outputText>
				</p:column>

			</p:dataTable>
		</p:panel>
	</c:if>
</ui:composition>
