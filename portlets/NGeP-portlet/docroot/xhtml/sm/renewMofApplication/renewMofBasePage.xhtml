<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" />
		<p:tabView id="tt" orientation="left" widgetVar="tt"
			activeIndex="#{backingBean.managedBean.tabActiveIndex}">

			<p:tab title="Company Basic Information">
				<ui:include src="step1RenewAppln_CompanyInfo.xhtml" />
			</p:tab>
			<p:tab title="Branch /Assoc Company">
				<ui:include src="step2RenewAppln_BranchCompanyInfo.xhtml" />
			</p:tab>
			<p:tab title="Capital / Equity Status">
				<ui:include src="step3RenewAppln_CaptialAndEquityStatusInfo.xhtml" />
			</p:tab>
			<p:tab title="Personnel Info">
				<ui:include src="step4RenewAppln_PersonnelInfo.xhtml" />
			</p:tab>
			<p:tab title="Bank Information">
				<ui:include src="step5RenewAppln_BankInfo.xhtml" />
			</p:tab>
			<p:tab title="Register Category Code(s)">
				<ui:include src="step6RenewAppln_RegisterCategoryCodesInfo.xhtml" />
			</p:tab>
			<p:tab title="Factory / Equipment Details">
				<ui:include src="step6.1RenewAppln_FactoryInfo.xhtml" />
			</p:tab>
			<p:tab title="Support Document(s)"
				rendered="#{backingBean.managedBean.supplierUser}">
				<ui:include src="step7RenewAppln_SupportingDocumentsInfo.xhtml" />
			</p:tab>
			<p:tab title="Processing Fee Payment"
				rendered="#{backingBean.managedBean.supplierUser}">
				<ui:include src="step8RenewAppln_ProcessingFeePaymentInfo.xhtml" />
			</p:tab>
			<p:tab title="Support Document(s) Review"
				rendered="#{backingBean.managedBean.poUser}">
				<ui:include
					src="/xhtml/sm/poDecisionPages/poReviewSupportingDocuments.xhtml" />
			</p:tab>
			<p:tab title="PO Decision"
				rendered="#{backingBean.managedBean.poUser}">
				<ui:include
					src="/xhtml/sm/poDecisionPages/poDefault_DescisionPage.xhtml" />
			</p:tab>
			<p:tab title="Support Document(s) Review"
				rendered="#{backingBean.managedBean.approverUser}">
				<ui:include
					src="/xhtml/sm/approverDecisionPages/approverReviewSupportingDocuments.xhtml" />
			</p:tab>
			<p:tab title="Approver Decision"
				rendered="#{backingBean.managedBean.approverUser}">
				<ui:include
					src="/xhtml/sm/approverDecisionPages/approverDefault_DescisionPage.xhtml" />
			</p:tab>

		</p:tabView>
	</ui:define>
</ui:composition>
