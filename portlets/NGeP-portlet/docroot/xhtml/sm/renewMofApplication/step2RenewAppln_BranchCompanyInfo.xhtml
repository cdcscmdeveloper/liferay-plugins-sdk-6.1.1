<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
					src="smRenewApplnSideMenuItem.xhtml" /></td>
			<td><p:outputPanel id="renewStep2OnlySuppPan"
					rendered="#{backingBean.managedBean.supplierUser}">
					<table style="width: 98%">
						<tr>
							<td class="smLastSubmitLabel"><h:outputText
									value="#{lbl['lbl.sm.lastSubmitDate']}" /></td>
							<td class="smLastSubmitDateVal"><h:outputText
									value="#{backingBean.managedBean.smAppl.draftExpiryDate}">
									<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
								</h:outputText></td>
						</tr>
					</table>
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(ParameterConst.newSmApplnForRenew,backingBean.managedBean.currentPageType)}"
							update=":form" icon="ui-icon-save" style="margin-bottom:5px;" />
					</div>
				</p:outputPanel> <ui:include
					src="/xhtml/sm/shared/mofRegistration/branchCompanyInfoForm.xhtml" />
				<ui:include
					src="/xhtml/sm/shared/mofRegistration/associatedCompanyInfoForm.xhtml" />

				<ui:include
					src="/xhtml/sm/shared/mofRegistration/companyProjectsExperienceInfoForm.xhtml" />
				<div class="nav-wrapper">
					<table style="width: 100%">
						<tr>
							<td><div align="left" style="width: 100%">
									<p:commandButton value="#{lbl['lbl.sm.prev']}"
										actionListener="#{backingBean.setTabValue('1','0')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForRenew,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH,SupplierManagementConst.SM_APPL_PAGE_TYPE_BASIC)}"
										update=":form" icon="ui-icon-prev" />
								</div></td>
							<td><div align="right" style="width: 100%">
									<p:commandButton value="#{lbl['lbl.sm.next']}"
										actionListener="#{backingBean.setTabValue('1','2')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForRenew,SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH,SupplierManagementConst.SM_APPL_PAGE_TYPE_PERSONNEL)}"
										update=":form" icon="ui-icon-next" iconPos="right" />
								</div></td>
						</tr>
					</table>
				</div></td>
		</tr>

	</table>
</ui:composition>
