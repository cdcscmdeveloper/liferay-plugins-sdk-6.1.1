<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: top;" class="sidemenutd"><ui:include
					src="smRenewApplnSideMenuItem.xhtml" /></td>
			<td style="vertical-align: top;"><p:outputPanel
					rendered="#{backingBean.managedBean.supplierUser}">
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							onclick="this.disabled=true;"
							onstart="blockWidget.show()" oncomplete="this.disabled=false;blockWidget.hide();"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType)}"
							update=":form" style="margin-bottom:5px;" />
						<p:commandButton value="#{lbl['lbl.sm.submitPayment']}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							action="#{backingBean.submitSmApplToBpm(backingBean.managedBean.smAppl.applType)}"
							style="margin-bottom:5px;" />
					</div>
				</p:outputPanel> <p:panel header="#{lbl['lbl.sm.processFee.Header']}">
					<ui:include
						src="/xhtml/sm/shared/paymentProcess/makePaymentForm.xhtml" />

					<c:choose>
						<c:when
							test="#{backingBean.managedBean.smAppl.applCategoryType == 'S'}">
							<div class="nav-wrapper">
								<table>
									<tr>
										<td><div align="left" style="width: 99%">
												<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
													onstart="blockWidget.show()"
													oncomplete="blockWidget.hide()"
													actionListener="#{backingBean.setTabValue('9','8')}"
													action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_PAYMENT,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
													update=":form" />
											</div></td>

									</tr>
								</table>
							</div>
						</c:when>
						<c:otherwise>
							<div class="nav-wrapper">
								<table>
									<tr>
										<td><div align="left" style="width: 99%">
												<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
													onstart="blockWidget.show()"
													oncomplete="blockWidget.hide()"
													actionListener="#{backingBean.setTabValue('7','6')}"
													action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_PAYMENT,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
													update=":form" />
											</div></td>


									</tr>
								</table>
							</div>
						</c:otherwise>
					</c:choose>
				</p:panel></td>
		</tr>
	</table>
</ui:composition>
