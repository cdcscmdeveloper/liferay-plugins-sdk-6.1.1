<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<br />
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
					src="smRenewApplnSideMenuItem.xhtml" /></td>
			<td><p:outputPanel id="renewStep61OnlySuppPan"
					rendered="#{backingBean.managedBean.supplierUser}">
					<table style="width: 98%">
						<tr>
							<td class="smLastSubmitLabel"><h:outputText
									value="#{lbl['lbl.sm.lastSubmitDate']}" /></td>
							<td class="smLastSubmitDateVal"><h:outputText
									value="#{backingBean.managedBean.smAppl.draftExpiryDate}">
									<f:convertDateTime type="date" pattern="dd-MMM-yyyy" />
								</h:outputText></td>
						</tr>
					</table>
					<div align="right" style="width: 99%" class="button-wrapper">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/deleteApplicationCommonPage.xhtml" />
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(ParameterConst.newSmApplnForRenew,backingBean.managedBean.currentPageType)}"
							update=":form" style="margin-bottom:5px;" />
					</div>
				</p:outputPanel>
				<table style="width: 350px">
					<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
						<tr>
							<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
									value="#{backingBean.managedBean.poSecReview.factoryVerify}"
									id="poFacVer">
									<p:ajax update=":form:tt:facInfPan,:form:revPanHdr"
										event="change" process="@this,:form:tt:facInfPan"
										listener="#{backingBean.changeVerifySection(backingBean.managedBean.poSecReview.factoryVerify)}" />
								</p:selectBooleanCheckbox></td>
							<td valign="top"><h:outputText
									value="#{lbl['lbl.sm.sectionPoVerf']}"
									title="For PO to highlight the verified section " /></td>

						</tr>
					</p:outputPanel>
					<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
						<tr>
							<td width="10px" style="padding-right: 2px;"><p:selectBooleanCheckbox
									value="#{backingBean.managedBean.apprvrSecReview.factoryVerify}"
									id="apprFacVer">
									<p:ajax update=":form:tt:facInfPan,:form:revPanHdr"
										event="change" process="@this,:form:tt:facInfPan"
										listener="#{backingBean.changeVerifySection(backingBean.managedBean.apprvrSecReview.factoryVerify)}" />
								</p:selectBooleanCheckbox></td>
							<td valign="top"><h:outputText
									value="#{lbl['lbl.sm.sectionApprVerf']}"
									title="For Approver to highlight the verified section " /></td>
						</tr>
					</p:outputPanel>
				</table> <br /> <p:panel id="facInfPan">
					<p:blockUI block=":form:tt:facInfPan" widgetVar="buiPoFac"
						id="poFacBlc"
						blocked="#{backingBean.managedBean.poUser ? backingBean.managedBean.poSecReview.factoryVerify : (backingBean.managedBean.approverUser ? backingBean.managedBean.apprvrSecReview.factoryVerify : false)}" />
					<h:inputHidden
						value="#{backingBean.managedBean.smAppl.applCategoryType}" />
					<ui:include
						src="/xhtml/sm/shared/mofRegistration/factoryOrWorkshopInfoForm.xhtml" />
					<ui:include
						src="/xhtml/sm/shared/mofRegistration/workshopInfoForm.xhtml" />
					<ui:include
						src="/xhtml/sm/shared/mofRegistration/dockyardInfoForm.xhtml" />
					<ui:include
						src="/xhtml/sm/shared/mofRegistration/storeInfoForm.xhtml" />
					<p:outputPanel rendered="#{backingBean.managedBean.poUser}">
						<table style="width: 50%">
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
								<td><p:inputTextarea autoResize="true" cols="41"
										maxlength="200"
										value="#{backingBean.managedBean.poSecReview.factoryRemark}" /></td>
							</tr>
						</table>
					</p:outputPanel>
					<p:outputPanel rendered="#{backingBean.managedBean.approverUser}">
						<table style="width: 100%">
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
								<td><p:inputTextarea autoResize="true" readonly="true"
										disabled="true" cols="41" maxlength="200"
										value="#{backingBean.managedBean.poSecReview.factoryRemark}" /></td>
								<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
								<td><p:inputTextarea autoResize="true" cols="41"
										maxlength="200"
										value="#{backingBean.managedBean.apprvrSecReview.factoryRemark}" /></td>

							</tr>
						</table>
					</p:outputPanel>
				</p:panel>
				<div class="nav-wrapper">
					<table style="width: 100%">
						<tr>
							<td><div align="left" style="width: 100%">
									<p:commandButton value="#{lbl['lbl.sm.prev.section']}"
										actionListener="#{backingBean.setTabValue('6','5')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForRenew,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
										update=":form" />
								</div></td>
							<td><div align="right" style="width: 100%">
									<p:commandButton value="#{lbl['lbl.sm.next.section']}"
										actionListener="#{backingBean.setTabValue('6','7')}"
										action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForRenew,SupplierManagementConst.SM_APPL_PAGE_TYPE_FACTORY,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
										update=":form" />
								</div></td>
						</tr>
					</table>
				</div></td>
		</tr>

	</table>

</ui:composition>
