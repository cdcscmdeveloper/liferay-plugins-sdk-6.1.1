
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><ui:include
					src="smRenewApplnSideMenuItem.xhtml" /></td>
			<td><p:outputPanel
					rendered="#{backingBean.managedBean.supplierUser}">
					<div align="right" style="width: 99%" class="button-wrapper">
						<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
							actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
							action="#{backingBean.saveApplicationAsDraft(ParameterConst.newSmApplnForRenew,backingBean.managedBean.currentPageType)}"
							update=":form" icon="ui-icon-save" style="margin-bottom:5px;" />
					</div>
				</p:outputPanel> <p:outputPanel id="supDocPan">
					<h:panelGroup
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'F'}">

						<ui:include
							src="/xhtml/sm/shared/mofRegistration/offlineSupportingDocsForm.xhtml" />
						<c:choose>
							<c:when
								test="#{backingBean.managedBean.smAppl.applCategoryType eq 'S'}">
								<div class="nav-wrapper">
									<table style="width: 100%">
										<tr>
											<td><div align="left" style="width: 99%">
													<p:commandButton value="#{lbl['lbl.sm.prev']}"
														actionListener="#{backingBean.setTabValue('8','7')}"
														action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForRenew,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
														update=":form" icon="ui-icon-prev" />
												</div></td>

											<td><div align="right" style="width: 99%">
													<p:commandButton value="#{lbl['lbl.sm.next']}"
														icon="ui-icon-next" iconPos="right"
														actionListener="#{backingBean.setTabValue('8','9')}"
														action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForRenew,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_PAYMENT)}"
														update=":form" />
												</div></td>
										</tr>
									</table>
								</div>
							</c:when>
							<c:otherwise>
								<div class="nav-wrapper">
									<table style="width: 100%">
										<tr>
											<td><div align="left" style="width: 99%">
													<p:commandButton value="#{lbl['lbl.sm.prev']}"
														actionListener="#{backingBean.setTabValue('6','5')}"
														action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForRenew,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
														update=":form" icon="ui-icon-prev" />
												</div></td>

											<td><div align="right" style="width: 99%">
													<p:commandButton value="#{lbl['lbl.sm.next']}"
														icon="ui-icon-next" iconPos="right"
														actionListener="#{backingBean.setTabValue('6','7')}"
														action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForRenew,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_PAYMENT)}"
														update=":form" />
												</div></td>
										</tr>
									</table>
								</div>
							</c:otherwise>
						</c:choose>
					</h:panelGroup>
					<h:panelGroup id="onSupGroup"
						rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'O'}">
						<ui:include
							src="/xhtml/sm/shared/mofRegistration/onlineSupportingDocsForm.xhtml" />
						<c:choose>
							<c:when
								test="#{backingBean.managedBean.smAppl.applCategoryType == 'S'}">
								<div class="nav-wrapper">
									<table style="width: 100%">
										<tr>
											<td><div align="left" style="width: 99%">
													<p:commandButton value="#{lbl['lbl.sm.prev']}"
														actionListener="#{backingBean.setTabValue('8','7')}"
														action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForRenew,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
														update=":form" icon="ui-icon-prev" />
												</div></td>
											<td><div align="right" style="width: 99%">
													<p:commandButton value="#{lbl['lbl.sm.next']}"
														icon="ui-icon-next" iconPos="right"
														actionListener="#{backingBean.setTabValue('8','9')}"
														action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForRenew,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_PAYMENT)}"
														update=":form" />
												</div></td>
										</tr>
									</table>
								</div>
							</c:when>
							<c:otherwise>
								<div class="nav-wrapper">
									<table style="width: 100%">
										<tr>
											<td><div align="left" style="width: 99%">
													<p:commandButton value="#{lbl['lbl.sm.prev']}"
														actionListener="#{backingBean.setTabValue('6','5')}"
														action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForRenew,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
														update=":form" icon="ui-icon-prev" />
												</div></td>
											<td><div align="right" style="width: 99%">
													<p:commandButton value="#{lbl['lbl.sm.next']}"
														icon="ui-icon-next" iconPos="right"
														actionListener="#{backingBean.setTabValue('6','7')}"
														action="#{backingBean.updateSmAppl(ParameterConst.newSmApplnForRenew,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_PAYMENT)}"
														update=":form" />
												</div></td>
										</tr>
									</table>
								</div>
							</c:otherwise>
						</c:choose>
					</h:panelGroup>

				</p:outputPanel></td>
		</tr>
	</table>
</ui:composition>
