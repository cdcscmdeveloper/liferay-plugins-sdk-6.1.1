<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
		<tr>
			<td width="100%"><h4
					style="color: blue; text-decoration: underline; text-align: center;">
					<h:outputText value="#{lbl['lbl.sm.applnTypeLbl']}" />
					<h:outputText value="Renew MOF Account" />
					<h:outputText value=" - #{backingBean.managedBean.smAppl.applNo}" />
				</h4></td>
		</tr>
		<tr>
			<td>
				<h6 style="color: blue;">
					<h:outputText value="Step7 :" />
					<h:outputText value=" Supporting Documents Page" />
				</h6>
			</td>
			<td><div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}" />
				</div></td>
		</tr>
	</table>
	<table>
		<tr>
			<td width="150px;"><h:outputText value="Submission Type " /></td>
			<td><p:selectOneRadio id="suppDocs"
					value="#{backingBean.managedBean.smAppl.supportingDocMode}">
					<f:selectItem itemLabel="Offline" itemValue="F" />
					<f:selectItem itemLabel="Online" itemValue="O" />
					<p:ajax update="supDocPan" event="change" />
				</p:selectOneRadio></td>
		</tr>
	</table>
	<p:outputPanel id="supDocPan">
		<ui:fragment
			rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'F'}">
			<ui:include
				src="/xhtml/sm/shared/mofRegistration/offlineSupportingDocsForm.xhtml" />
			<table>
				<tr>
					<td><p:commandButton value="Previous"
							actionListener="#{backingBean.setTabValue('7','6')}"
							action="#{backingBean.updateSmAppl}" update=":form:tt" /></td>
					<td><p:commandButton value="Print List">
							<p:printer target="supDocPan" />
						</p:commandButton></td>
					<td><p:commandButton value="Declare Renewal Application"
							actionListener="#{backingBean.setTabValue('7','8')}"
							action="#{backingBean.updateSmAppl}" update=":form:tt" /></td>
				</tr>
			</table>
		</ui:fragment>
		<ui:fragment
			rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'O'}">
			<ui:include
				src="/xhtml/sm/shared/mofRegistration/onlineSupportingDocsForm.xhtml" />
			<table>
				<tr>
					<td><p:commandButton value="Previous"
							actionListener="#{backingBean.setTabValue('7','6')}"
							action="#{backingBean.updateSmAppl}" update=":form:tt" /></td>
					<td><p:commandButton value="Print List">
							<p:printer target="supDocPan" />
						</p:commandButton></td>
					<td><p:commandButton value="Declare Renewal Application"
							actionListener="#{backingBean.setTabValue('7','8')}"
							action="#{backingBean.updateSmAppl}" update=":form:tt" /></td>
				</tr>
			</table>
		</ui:fragment>

	</p:outputPanel>
</ui:composition>
