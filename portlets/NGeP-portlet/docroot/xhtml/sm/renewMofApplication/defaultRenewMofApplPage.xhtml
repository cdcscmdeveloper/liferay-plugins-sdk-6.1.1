<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:panel header="#{lbl['lbl.sm.renewMof.headerLbl']}">
			<table style="width: 100%">
				<tr>
					<td><p:outputPanel>
							<p>
								<h:outputText value="#{lbl['lbl.sm.renewMof.descData']}"
									escape="false" />
							</p>
						</p:outputPanel></td>
				</tr>
			</table>
		</p:panel>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.proceed']}"
				action="#{backingBean.proceedToApplication('R')}" />
			<!-- <p:commandButton value="Cancel" /> -->
		</div>
	</ui:define>
</ui:composition>
