<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: top;" class="sidemenutd"><ui:include
					src="smRenewApplnSideMenuItem.xhtml" /></td>
			<td style="vertical-align: top;">
				<div align="right" style="width: 99%" class="button-wrapper">
					<ui:include
						src="/xhtml/sm/shared/mofRegistration/deleteApplicationCommonPage.xhtml" />
					<p:commandButton value="#{lbl['lbl.sm.saveAsDraft']}"
						onclick="this.disabled=true;"
						onstart="blockWidget.show()" oncomplete="this.disabled=false;blockWidget.hide();"
						actionListener="#{backingBean.setTabValue(backingBean.managedBean.tabActiveIndex,backingBean.managedBean.tabActiveIndex)}"
						action="#{backingBean.saveApplicationAsDraft(backingBean.managedBean.smAppl.applType,backingBean.managedBean.currentPageType)}"
						update=":form" style="margin-bottom:5px;" />
					
					<ui:include src="/xhtml/sm/shared/mofRegistration/declareButtonWithoutSpki.xhtml" />
				</div>
				<ui:include src="/xhtml/sm/shared/paymentProcess/makePaymentForm.xhtml" />
				<br />
				<ui:include
					src="/xhtml/sm/shared/mofRegistration/supplierDeclarationForm.xhtml" />
			
				<c:choose>
					<!-- #26671 - Site Visit Grouping Enhancement - 28775 - START -->
					<c:when
						test="#{backingBean.managedBean.smAppl.applCategoryType == 'S' or backingBean.managedBean.showFacilityMachine}">
					<!-- #26671 - Site Visit Grouping Enhancement - 28775 - END -->
						<c:choose>
							<c:when
								test="#{backingBean.managedBean.smAppl.applCategoryType == 'S'}">
								<div class="nav-wrapper">
									<table style="width: 100%">
										<tr>
											<td><div align="left" style="width: 99%">
											<c:choose> 
											<c:when test="#{backingBean.managedBean.smAppl.applValidWithSsm  and backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
													<c:choose>
									 				<c:when test="#{backingBean.managedBean.smSupplier.businessType eq 'I' or backingBean.managedBean.smSupplier.businessType eq 'J'}">
														<p:commandButton value="#{lbl['lbl.sm.prev.section']}" rendered="#{!backingBean.managedBean.editVO.disciplinary}"
														onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
														actionListener="#{backingBean.setTabValue('10','9')}"
														action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_DECLARATION,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
														update=":form" />
													</c:when>
													<c:otherwise>
														<p:commandButton value="#{lbl['lbl.sm.prev.section']}" rendered="#{!backingBean.managedBean.editVO.disciplinary}"
														onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
														actionListener="#{backingBean.setTabValue('9','8')}"
														action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_DECLARATION,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
														update=":form" />
													</c:otherwise>
													</c:choose>
											</c:when>
											<c:otherwise>
														<p:commandButton value="#{lbl['lbl.sm.prev.section']}" rendered="#{!backingBean.managedBean.editVO.disciplinary}"
														onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
														actionListener="#{backingBean.setTabValue('9','8')}"
														action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_DECLARATION,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
														update=":form" />
											</c:otherwise>
											</c:choose>
												</div></td>
				
										</tr>
									</table>
								</div>
							</c:when>
							<c:otherwise>
								<div class="nav-wrapper">
									<table style="width: 100%">
										<tr>
											<td><div align="left" style="width: 99%">
											<c:choose> 
											<c:when test="#{backingBean.managedBean.showMachineryEquipmentPanel or backingBean.managedBean.showTravelSoftwarePanel}">
													<c:choose>
									 				<c:when test="#{backingBean.managedBean.smSupplier.businessType eq 'I' or backingBean.managedBean.smSupplier.businessType eq 'J'}">	
														<p:commandButton value="#{lbl['lbl.sm.prev.section']}" rendered="#{backingBean.managedBean.smAppl.applValidWithSsm  and backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}"
														onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
														actionListener="#{backingBean.setTabValue('9','8')}"
														action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_DECLARATION,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
														update=":form" />
													</c:when>
													<c:otherwise>
														<p:commandButton value="#{lbl['lbl.sm.prev.section']}" rendered="#{!backingBean.managedBean.editVO.disciplinary}"
														onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
														actionListener="#{backingBean.setTabValue('8','7')}"
														action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_DECLARATION,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
														update=":form" />
													</c:otherwise>
													</c:choose>
											</c:when>
											<c:otherwise>
														<p:commandButton value="#{lbl['lbl.sm.prev.section']}" rendered="#{!backingBean.managedBean.editVO.disciplinary}"
														onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
														actionListener="#{backingBean.setTabValue('8','7')}"
														action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_DECLARATION,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
														update=":form" />
											</c:otherwise>
											</c:choose>
												</div></td>
				
										</tr>
									</table>
								</div>
							</c:otherwise>
						</c:choose>
			
					</c:when>
					<c:otherwise>
						<div class="nav-wrapper">
							<table style="width: 100%">
								<tr>
									<td><div align="left" style="width: 99%">
										<c:choose> 
											<c:when test="#{backingBean.managedBean.smAppl.applValidWithSsm  and backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
											<c:choose>
									 		<c:when test="#{backingBean.managedBean.smSupplier.businessType eq 'I' or backingBean.managedBean.smSupplier.businessType eq 'J'}">													
											<p:commandButton value="#{lbl['lbl.sm.prev.section']}" 
												onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
												actionListener="#{backingBean.setTabValue('8','7')}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_DECLARATION,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
												update=":form" />
												</c:when>
												<c:otherwise>
												<p:commandButton value="#{lbl['lbl.sm.prev.section']}" 
												onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
												actionListener="#{backingBean.setTabValue('7','6')}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_DECLARATION,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
												update=":form" />
												</c:otherwise>
												</c:choose>
												</c:when>
											<c:otherwise>
											<p:commandButton value="#{lbl['lbl.sm.prev.section']}" rendered="#{!backingBean.managedBean.editVO.disciplinary}"
												onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
												actionListener="#{backingBean.setTabValue('7','6')}"
												action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_DECLARATION,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS)}"
												update=":form" />
											</c:otherwise>
										</c:choose>
										</div></td>
								</tr>
							</table>
						</div>
					</c:otherwise>
				</c:choose>
			</td>
		</tr>
	</table>
	<!-- 32304 - start -->
	<p:dialog id="chgBussTypeAlert" closable="true" widgetVar="chgBussTypeAlert"
		header="#{lbl['lbl.sm.buss.type.changed.alert.header']}" 
		visible="#{backingBean.managedBean.smAppl.smCompanyBasic.businessType
				!= backingBean.managedBean.latestAppl.smCompanyBasic.businessType
				and backingBean.managedBean.pendingBumiAppl != null
				and backingBean.managedBean.pendingBumiAppl.applNo != null}">
		
		<h:outputText value="#{lbl['lbl.sm.buss.type.changed.alert.msg1']}"/><br/>
		<h:outputText value="#{lbl['lbl.sm.buss.type.changed.alert.msg2']} 
			(#{backingBean.managedBean.pendingBumiAppl.applNo}) #{lbl['lbl.sm.buss.type.changed.alert.msg3']}"/><br/>
		<h:outputText value="#{lbl['lbl.sm.buss.type.changed.alert.msg4']}"/>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" action="#{backingBean.changeBussTypeAlertYes()}"
				onclick="chgBussTypeAlert.hide()" partialSubmit="true"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
			
			<p:commandButton value="#{lbl['lbl.btn.no']}" action="#{backingBean.changeBussTypeAlertNo()}" 
				onclick="chgBussTypeAlert.hide()" partialSubmit="true"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"  />
		</div>
	</p:dialog>
	<!-- 32304 - end -->
</ui:composition>
