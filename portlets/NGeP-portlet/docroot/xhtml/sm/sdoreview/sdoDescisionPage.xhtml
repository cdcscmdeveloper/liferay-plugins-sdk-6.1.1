<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="sideMenu">
		<ui:include src="/xhtml/sm/shared/sidemenu/sdoReviewSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<p:panel header="#{lbl['lbl.sm.sdo.decision']}">

			<h:outputText value="lbl.sm.sdo.dcsnNotes" escape="false"/>
			<p:separator />
			<div align="center">
				<p:splitButton value="#{lbl['lbl.sm.decision.select']}">
					<p:menuitem value="#{lbl['lbl.sm.submit.po']}" />
					<p:menuitem value="#{lbl['lbl.sm.send.enquiry']}" onclick="sendEnqDialog.show();" />
				</p:splitButton>
			</div>
		</p:panel>
		<p:dialog width="850px" height="500px" header="Send Enquiry"
			widgetVar="sendEnqDialog" resizable="false" showEffect="fade"
			hideEffect="fade" modal="true">

			<!-- <ui:include
				src="/xhtml/sm/shared/poDecisionSharedPages/assignToSvcForm.xhtml" /> -->

			<ui:include
				src="/xhtml/sm/shared/mofSdoSharedPages/sdoSendEnquiry.xhtml" />

			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.submit']}" onclick="sendEnqDialog.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" onclick="sendEnqDialog.hide();" />
			</div>
		</p:dialog>
	</ui:define>
</ui:composition>
