<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<div align="right">
			<ui:repeat value="#{sdoReviewBackingBean.managedBean.bpmAction}"
				var="item">
				<p:commandButton
					action="#{sdoReviewBackingBean.submitSDOReviewAction(item)}"
					value="#{item}" />
			</ui:repeat>
		</div>
	
		<p:panel header="Company Information" toggleable="true"
			id="pnlCompInfo">
			<table class="customTbl">
				<tr>
					<td class="tdTitle"><p:outputLabel value="Supplier Name" /></td>
					<td class="tdContent"><p:inputText
							value="#{sdoReviewBackingBean.managedBean.smAppl.smSupplier.companyName}"
							disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel value="Business Type" /></td>
					<td class="tdContent"><p:inputText
							value="ROB Perkongsian Semenanjung" disabled="true" size="40" /></td>
						<!-- 					<td class="tdContent"><p:inputText --> <!-- 							value="#{sdoReviewBackingBean.managedBean.smAppl.smSupplier.businessType}" -->
						<!-- 							disabled="true" size="40" /></td> -->
					<td class="tdTitle"><p:outputLabel value="No. ROC/ROB/ROS" /></td>
					<td class="tdContent"><p:inputText
							value="#{sdoReviewBackingBean.managedBean.smAppl.smSupplier.regNo}"
							disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel value="Income Tax No." /></td>
					<td class="tdContent"><p:inputText
							value="#{sdoReviewBackingBean.managedBean.smAppl.smSupplier.incomeTaxNo}"
							disabled="true" size="40" /></td>

					<td class="tdTitle"><p:outputLabel value="Established Date" /></td>
					<td class="tdContent"><p:inputText
							value="#{sdoReviewBackingBean.managedBean.smAppl.smSupplier.establishDate}"
							disabled="true" size="40">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
						</p:inputText></td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel value="Total Staff" /></td>
					<td class="tdContent"><p:inputText disabled="true" size="40" value="10" /></td>

					<td class="tdTitle"><p:outputLabel value="Yearly Income" /></td>
					<td class="tdContent"><p:inputText value="100,000"
							disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel value="Address" /></td>
					<td class="tdContent"><p:inputText
							value="44, Jalan Universiti 10/15" disabled="true" size="40" /></td>

					<td class="tdTitle"><p:outputLabel value="Postcode" /></td>
					<td class="tdContent"><p:inputText value="a" disabled="true"
							size="40" /></td>
				</tr>

				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent"><p:inputText value="Taman Universiti"
							disabled="true" size="40" /></td>
				</tr>
				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent"><p:inputText disabled="true" size="40" /></td>
				</tr>
				<tr>
					<td class="tdTitle"></td>
					<td class="tdContent"><p:inputText disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel value="City" /></td>
					<td class="tdContent"><p:inputText value="Petaling Jaya"
							disabled="true" size="40" /></td>

					<td class="tdTitle"><p:outputLabel value="State" /></td>
					<td class="tdContent"><p:inputText value="Selangor"
							disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel value="District" /></td>
					<td class="tdContent"><p:inputText disabled="true" size="40" /></td>

					<td class="tdTitle"><p:outputLabel value="Country" /></td>
					<td class="tdContent"><p:inputText value="Malaysia"
							disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel value="Phone No." /></td>
					<td class="tdContent"><p:inputText value="03-79001200" disabled="true"
							size="40" /></td>

					<td class="tdTitle"><p:outputLabel value="Fax No." /></td>
					<td class="tdContent"><p:inputText value="03-79001201" disabled="true"
							size="40" /></td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel value="Website" /></td>
					<td class="tdContent"><p:inputText  disabled="true" size="40" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="Contact Info" toggleable="true" id="pnlContInfo">
			<table class="customTbl">
				<tr>
					<td class="tdTitle"><p:outputLabel value="Contact Person" /></td>
					<td class="tdContent"><p:inputText
							value="KU MOHD KAMAL BIN KU SHAARI" disabled="true" size="40" /></td>

					<td class="tdTitle"><p:outputLabel value="Position" /></td>
					<td class="tdContent"><p:inputText value="MANAGER"
							disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td class="tdTitle"><p:outputLabel value="Phone No." /></td>
					<td class="tdContent"><p:inputText value="012-4013352"
							disabled="true" size="40" /></td>

					<td class="tdTitle"><p:outputLabel value="Email" /></td>
					<td class="tdContent"><p:inputText value="mantoyz@hotmail.com"
							disabled="true" size="40" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel id="pnlSuppDoc" header="Supporting Document"
			toggleable="true">
			<p:dataTable var="table"
				value="#{mofRegistrationBackingBean.dataList}">
				<p:column headerText="No.">  
                   #{table.no}  
      		    </p:column>

				<p:column headerText="Document Name">  
		            #{table.documentName} 
		        </p:column>

				<p:column headerText="Document Description">  
		            #{table.documentdescription} 
		        </p:column>

				<p:column headerText="Receive Date">
					<p:calendar id="receiveDate" showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</p:column>

				<p:column headerText="Is Valid?">
					<p:selectBooleanCheckbox value="#{table.docSent}" />
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel header="Remark">
			<table>
				<tr>
					<td class="tdTitle"><p:outputLabel value="Remarks" /></td>
					<td class="tdContent"><p:inputTextarea rows="6" cols="80" /></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
