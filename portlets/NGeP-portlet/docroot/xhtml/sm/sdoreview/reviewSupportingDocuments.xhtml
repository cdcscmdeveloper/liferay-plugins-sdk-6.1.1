<ui:composition

		<p:panel header="Maklumat Asas Syarikat">
			<table class="customTbl">

					<td id="tdContent"><p:inputText value="Belum Bayar"

					<td id="tdTitle">Supplier Name</td>

							disabled="true" /></td>
				</tr>

				<tr>
					<td id="tdTitle">Jenis Pendaftaran</td>

					<td id="tdContent"><p:inputText

				<tr>

					<td id="tdContent"><p:inputText
							value="#{sdoReviewBackingBean.managedBean.smAppl.smSupplier.establishDate}"

		<p:panel header="">

				<tr>
