<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<f:event listener="#{sdoReviewBackingBean.viewSupportingDocument}"
			type="preRenderView"></f:event>
		<p:panel header="Company Information" toggleable="true"
			id="pnlCompInfo">
			<table class="rptTbl">
				<tr>
					<td><p:outputLabel value="Supplier Name" /></td>
					<td><p:inputText
							value="#{sdoReviewBackingBean.managedBean.smAppl.smSupplier.supplierName}"
							disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Business Type" /></td>
					<td><p:inputText
							value="#{sdoReviewBackingBean.managedBean.smAppl.smSupplier.businessType}"
							disabled="true" size="40" /></td>

					<td><p:outputLabel value="No. ROC/ROB/ROS" /></td>
					<td><p:inputText
							value="#{sdoReviewBackingBean.managedBean.smAppl.smSupplier.regNo}"
							disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Income Tax No." /></td>
					<td><p:inputText
							value="#{sdoReviewBackingBean.managedBean.smAppl.smSupplier.incomeTaxNo}"
							disabled="true" size="40" /></td>

					<td><p:outputLabel value="Established Date" /></td>
					<td><p:inputText
							value="#{sdoReviewBackingBean.managedBean.smAppl.smSupplier.establishDate}"
							disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Total Staff" /></td>
					<td><p:inputText value="Bumiputera 3orang" disabled="true"
							size="40" /></td>

					<td><p:outputLabel value="Yearly Income" /></td>
					<td><p:inputText value="a" disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Address" /></td>
					<td><p:inputText value="a" disabled="true" size="40" /></td>

					<td><p:outputLabel value="Postcode" /></td>
					<td><p:inputText value="a" disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="City" /></td>
					<td><p:inputText value="a" disabled="true" size="40" /></td>

					<td><p:outputLabel value="State" /></td>
					<td><p:inputText value="a" disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="District" /></td>
					<td><p:inputText value="a" disabled="true" size="40" /></td>

					<td><p:outputLabel value="Country" /></td>
					<td><p:inputText value="a" disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Phone No." /></td>
					<td><p:inputText value="a" disabled="true" size="40" /></td>

					<td><p:outputLabel value="Fax No." /></td>
					<td><p:inputText value="a" disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Website" /></td>
					<td><p:inputText value="a" disabled="true" size="40" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="Contact Info" toggleable="true" id="pnlContInfo">
			<table class="rptTbl">
				<tr>
					<td><p:outputLabel value="Contact Person" /></td>
					<td><p:inputText value="KU MOHD KAMAL BIN KU SHAARI"
							disabled="true" size="40" /></td>

					<td><p:outputLabel value="Position" /></td>
					<td><p:inputText value="MANAGER" disabled="true" size="40" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Phone No." /></td>
					<td><p:inputText value="012-4013352" disabled="true" size="40" /></td>

					<td><p:outputLabel value="Email" /></td>
					<td><p:inputText value="mantoyz@hotmail.com" disabled="true"
							size="40" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel id="pnlSuppDoc" header="Supporting Document" toggleable="true">
			<!-- <c:if
				test="#{sdoReviewBackingBean.managedBean.smAppl.supportingDocMode == 'H'}"> -->
			<ui:include
				src="/xhtml/sm/shared/mofSdoSharedPages/offlineSupportingDocsForm.xhtml" />
			<!-- </c:if> -->

			<!--  <c:if
				test="#{sdoReviewBackingBean.managedBean.smAppl.supportingDocMode == 'S'}">
				<ui:include
					src="/xhtml/sm/shared/mofSdoSharedPages/onlineSupportingDocsForm.xhtml" />
			</c:if>-->
		</p:panel>

		<div align="right">
			<ui:repeat value="#{sdoReviewBackingBean.managedBean.bpmAction}"
				var="item">
				<p:commandButton
					action="#{sdoReviewBackingBean.submitSDOReviewAction(item)}"
					value="#{item}" />
			</ui:repeat>
		</div>
	</ui:define>
</ui:composition>
