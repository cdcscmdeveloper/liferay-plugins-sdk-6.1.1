<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="sideMenu">
	</ui:define>

	<ui:define name="content">
		<p:panel header="Account Details" toggleable="true">
			<table class="test">
				<tr>
					<td id="tdTitle"><p:outputLabel value="Supplier Name" /></td>
					<td id="tdContent"><p:inputText /></td>

					<td id="tdTitle"><p:outputLabel value="Expected Date of Visit" /></td>
					<td id="tdContent"><p:inputText /></td>
				</tr>

				<tr>
					<td id="tdTitle"><p:outputLabel value="Assigned by(SVC)" /></td>
					<td id="tdContent"><p:inputText /></td>

					<td id="tdTitle"><p:outputLabel value="Date Assigned" /></td>
					<td id="tdContent"><p:inputText /></td>
				</tr>

				<tr>
					<td id="tdTitle"><p:outputLabel value="Current Stage" /></td>
					<td id="tdContent"><p:inputText /></td>

					<!-- <td id="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.companyaddress']}" /></td>
				<td id="tdContent"><p:inputText /></td> -->
				</tr>

				<tr>
					<td id="tdTitle"><p:outputLabel value="Site Address" /></td>
					<td id="tdContent" colspan="3"><p:inputText size="50" /></td>
				</tr>

				<tr>
					<td id="tdTitle"></td>
					<td id="tdContent" colspan="3" ><p:inputText size="50" /></td>
				</tr>

				<tr>
					<td id="tdTitle"></td>
					<td id="tdContent" colspan="3"><p:inputText size="50" /></td>
				</tr>

				<tr>
					<td id="tdTitle"><p:outputLabel value="Country" /></td>
					<td id="tdContent"><p:inputText /></td>

					<td id="tdTitle"><p:outputLabel value="Post Code" /></td>
					<td id="tdContent"><p:inputText /></td>
				</tr>

				<tr>
					<td id="tdTitle"><p:outputLabel value="State" /></td>
					<td id="tdContent"><p:inputText /></td>

					<td id="tdTitle"><p:outputLabel value="City" /></td>
					<td id="tdContent"><p:inputText /></td>
				</tr>

				<tr>
					<td id="tdTitle"><p:outputLabel value="District" /></td>
					<td id="tdContent"><p:inputText /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="Site Visit Tracking" toggleable="true">
			<p:dataTable>
				<p:column headerText="Action Performed"></p:column>
				<p:column headerText="Date Action Performed"></p:column>
				<p:column headerText="Remarks(If any)"></p:column>
			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
