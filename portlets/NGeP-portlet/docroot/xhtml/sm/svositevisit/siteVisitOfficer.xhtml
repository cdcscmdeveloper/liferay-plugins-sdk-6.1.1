<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	
	<p:panel header="#{lbl['lbl.sm.site.visit.officer']}" toggleable="true" id="pnlSiteVisitOffer">
		<table class="customTbl">
			<tr valign="top">
				<td class="tdTitle"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.visiting.officer']}" /></td>
				<td class="tdContent">
					<ui:repeat var="svOfficer" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOfficers}" varStatus="svOfficerVarStatus">
						<h:outputText styleClass="outputLabel-view" value="#{svOfficerVarStatus.index + 1}. #{svOfficer.pmUser.userName}" /><br />
					</ui:repeat>
				</td>
				<td></td>
				<td></td>
			</tr>
			<tr >
				<td class="tdTitle">
					<p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.sv.templ.assisting.officer']}" />
					<!-- #28774 - Start -->
					<p:outputLabel value="*" styleClass="mandatory" />
					<!-- #28774 - End -->
					
				</td>
				<td class="tdContent">
					<!-- #28774 - Start -->
					<p:inputText id="test" readonly="#{viewFlag}" size="40" maxlength="50" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvAssistantOfficer.name}" disabled="#{svoSiteVisitBackingBean.checkUserRole()}" required="true" requiredMessage="#{lbl['lbl.sm.sv.visiting.officer.required']}"/>
					<!-- #28774 - End -->
					<!--
					#28774 - Start
					<p:commandButton value="#{lbl['lbl.btn.delete']}" update="" id="deleteSVOBtnId"/> -->
					<!-- #28774 - End -->
					<p:spacer width="5" />
					<p:graphicImage style="vertical-align:top !important;" rendered="#{fn:length(svoSiteVisitBackingBean.managedBean.smSvTask.smSvAssistantOfficer.name) > 1}" value="/css/images/design/ico-edit.png" title="#{lbl['lbl.sm.edit']}" />
					<p:spacer width="5" />
					<ac:smFieldChangeAlert 
							isShow="#{svoSiteVisitBackingBean.showEditAssistant(svoSiteVisitBackingBean.managedBean.smSvTask.smSvAssistantOfficer)}"
							oriValue="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvAssistantOfficer.nameEnterBySvo}" 
							currValue="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvAssistantOfficer.name}" 
							alertValue="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvAssistantOfficer.nameEnterBySvo}"/>							
				</td>
			</tr>
		</table>
		<!-- 
		#28774 - Start
		<p:outputPanel>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.add']}"/>
			</div>
		</p:outputPanel> 
		#28774 - End
		-->
	</p:panel>
</ui:composition>
