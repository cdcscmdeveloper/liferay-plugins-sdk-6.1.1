<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	
	<p:panel header="#{lbl['lbl.sm.site.visit.officer']}" toggleable="true" id="pnlSiteVisitOffer">
		<!-- #28774 - Start -->
		<style>
			.assistant-officer-tbl thead{
    			display:none;
			}
			.assistant-officer-tbl tbody,
		 	.assistant-officer-pnlGrid.ui-panelgrid tr,
		 	.assistant-officer-pnlGrid.ui-panelgrid td{
				border-style: hidden !important
			}
			.assistant-officer-tbl td:nth-child(1){
				width: 20%;
			}
		</style>
	
		#{svoSiteVisitBackingBean.checkEmptyAssistantOfficers()}
		<p:dataTable styleClass="assistant-officer-tbl" id="assistingOfficerId" var="assistingOfficer" value="#{svoSiteVisitBackingBean.managedBean.smSvTask}">
		    <p:column>
		        <p:panelGrid styleClass="assistant-officer-pnlGrid">
		            <p:row>
		                <p:column style="vertical-align:top !important;">
		                	<p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.visiting.officer']}" />
		                </p:column>
		                <p:column>
		                	<ui:repeat var="svOfficer" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOfficers}" varStatus="svOfficerVarStatus">
								<h:outputText styleClass="outputLabel-view" value="#{svOfficerVarStatus.index + 1}. #{svOfficer.pmUser.userName}" /><br />
							</ui:repeat>
						</p:column>
		            </p:row>
		            <p:row>
		                <p:column style="vertical-align:top !important;">
		                	<p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.sv.templ.assisting.officer']}" />
							<p:outputLabel value="*" styleClass="mandatory" />
						</p:column>
						<p:column>
							<ui:repeat var="svAOfficer" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvAssistantOfficers}">
								<p:inputText id="svAOfficerName" value="#{svAOfficer.name}" readonly="#{viewFlag}" size="40" maxlength="50" disabled="#{svoSiteVisitBackingBean.checkUserRole()}" required="true" requiredMessage="#{lbl['lbl.sm.sv.visiting.officer.required']}">
									<p:ajax event="keyup" update="deleteSvAObtnId" />
								</p:inputText>
								<p:commandButton rendered="#{svoSiteVisitBackingBean.checkUserRole() eq false}" value="#{lbl['lbl.btn.delete']}" update="@this" id="deleteSvAObtnId" action="#{svoSiteVisitBackingBean.selectSvAssistantOfficer(svAOfficer)}" disabled="#{svAOfficer.name eq null}"/>
								<!-- #24964 - start -->
								<ac:smFieldChangeAlert 
									isShow="#{svoSiteVisitBackingBean.showEditAssistant(svAOfficer)}"
									oriValue="#{svAOfficer.nameEnterBySvo}" 
									currValue="#{svAOfficer.name}" 
									alertValue="#{svAOfficer.nameEnterBySvo}"/>
								<!-- #24964 - end -->
								<br/>
							</ui:repeat>
						</p:column>
		            </p:row>
		        </p:panelGrid>
		    </p:column>
		</p:dataTable>
		
		<p:outputPanel>
			<div align="right">
				<p:commandButton rendered="#{svoSiteVisitBackingBean.checkUserRole() eq false}" id="addSvAObtnId" value="#{lbl['lbl.btn.add']}" partialSubmit="true" process="@this,assistingOfficerId"
					action="#{svoSiteVisitBackingBean.addSvAsistantOfficer}" update="assistingOfficerId,@this" />
			</div>
		</p:outputPanel> 
	</p:panel>
	
	<ac:confirmationPopup id="assistingOfficerDeletePopUpId"
		widget="assistingOfficerDeletePopUp"
		okAction="svoSiteVisitBackingBean.removeSvAssistantOfficer()"
		width="400" height="100"
		title="#{lbl['lbl.txt.delete']}"
		content="#{lbl['lbl.sm.sv.visiting.officer.delete']}" 
		update=":#{p:component('pnlSiteVisitOffer')}"/>
	<!-- #28774 - End-->
</ui:composition>
