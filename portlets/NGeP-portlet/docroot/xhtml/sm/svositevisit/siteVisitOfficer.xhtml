<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	
	<p:panel header="#{lbl['lbl.sm.site.visit.officer']}" toggleable="true" id="pnlSiteVisitOffer">
		<table class="customTbl">
			<tr valign="top">
				<td class="tdTitle"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.visiting.officer']}" /></td>
				<td class="tdContent">
					<ui:repeat var="svOfficer" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOfficers}" varStatus="svOfficerVarStatus">
						<h:outputText styleClass="outputLabel-view" value="#{svOfficerVarStatus.index + 1}. #{svOfficer.pmUser.userName}" /><br />
					</ui:repeat>
				</td>
				<td></td>
				<td></td>
			</tr>
			<tr >
				<td class="tdTitle">
					<p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.sv.templ.assisting.officer']}" />
				</td>
				<td class="tdContent">
					<p:inputText id="test" readonly="#{viewFlag}" size="40" maxlength="50" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvAssistantOfficer.name}" />
					<p:spacer width="5" />
					<p:graphicImage rendered="#{fn:length(svoSiteVisitBackingBean.managedBean.smSvTask.smSvAssistantOfficer.name) > 1}" value="/css/images/design/ico-edit.png" title="#{lbl['lbl.sm.edit']}" />
					<p:spacer width="5" />
					<p:graphicImage rendered="#{fn:length(svoSiteVisitBackingBean.managedBean.smSvTask.smSvAssistantOfficer.name) > 1}" value="/css/images/design/icon_alert.png" />					
				</td>
			</tr>
			
		</table>
	</p:panel>
</ui:composition>
