<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.sitevist.sites']}" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.sitevist.site']}" /></td>
				<td class="tdContent"><p:selectOneMenu>
						<f:selectItems
							value="#{svoSiteVisitBackingBean.managedBean.smApplSv.smSiteVisitAddresses}"
							var="c" itemLabel="#{c.smAddress.address1}"
							itemValue="#{c.smAddress.address1}" />
					</p:selectOneMenu></td>
				<td class="tdTitle">&#160;</td>
				<td class="tdContent">&#160;</td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.sitevist.report.submission']}" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.sitevist.report.submitmethod']}" /></td>
				<td class="tdContent"><p:selectOneRadio id="rptMethod"
						value="#{svoSiteVisitBackingBean.managedBean.rptSubsMethod}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.sitevist.report.upload']}" itemValue="Upload" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.sitevist.online.submit']}" itemValue="Online" />
						<p:ajax event="change" update="svRptPanel" />
					</p:selectOneRadio></td>

				<td class="tdTitle">&#160;</td>
				<td class="tdContent">&#160;</td>
			</tr>
		</table>
	</p:panel>

	<p:outputPanel id="svRptPanel" toggleable="true">
		<h:panelGroup rendered="#{svoSiteVisitBackingBean.managedBean.rptSubsMethod == 'Upload'}">
				<p:panel header="Report">
					<table class="customTbl">
						<tr>
							<td class="tdTitle"><p:outputLabel value="#{lbl['lbl.sm.file']}" /></td>
							<td class="tdContent" colspan="2"><p:fileUpload
									mode="simple" /> <p:commandButton value="#{lbl['lbl.btn.upload']}"
									action="#{svoSiteVisitBackingBean.uploadSiteVisitReport}" /></td>
						</tr>

						<tr>
							<td class="tdTitle">&#160;</td>
							<td class="tdContent">&#160;</td>

							<td class="tdTitle">&#160;</td>
							<td class="tdContent">&#160;</td>
						</tr>
					</table>
				</p:panel>
			</h:panelGroup>

			<h:panelGroup rendered="#{svoSiteVisitBackingBean.managedBean.rptSubsMethod == 'Online'}">
				<p:panel header="Report">
					<div align="right">
						<p:commandButton value="#{lbl['lbl.sm.button.save']}" />
					</div>
					<ui:include src="/xhtml/sm/svositevisit/siteVisitReportTab.xhtml"></ui:include>
				</p:panel>
			</h:panelGroup>
	</p:outputPanel>



</ui:composition>
