<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Site(s)" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="Site" /></td>
				<td class="tdContent"><p:selectOneMenu>
						<f:selectItems
							value="#{svoSiteVisitBackingBean.managedBean.smApplSv.smSiteVisitAddresses}"
							var="c" itemLabel="#{c.smAddress.address1}"
							itemValue="#{c.smAddress.address1}" />
					</p:selectOneMenu></td>
				<td class="tdTitle"></td>
				<td class="tdContent"></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="Report Submission" toggleable="true">
		<table class="customTbl">
			<tr>
				<td id="tdTitle"><p:outputLabel value="Report Submit" /></td>
				<td id="tdContent"><p:selectOneRadio id="rptMethod"
						value="#{svoSiteVisitBackingBean.managedBean.rptSubsMethod}">
						<f:selectItem itemLabel="Report Upload" itemValue="Upload" />
						<f:selectItem itemLabel="Online Submit" itemValue="Online" />
						<p:ajax event="change" update="svRptPanel"
							listener="#{svoSiteVisitBackingBean.changeRptSubsMethod}" />
					</p:selectOneRadio></td>

				<td id="tdTitle"></td>
				<td id="tdContent"></td>
			</tr>
		</table>
	</p:panel>

	<p:outputPanel id="svRptPanel" toggleable="true">

		<c:if
			test="#{svoSiteVisitBackingBean.managedBean.rptSubsMethod == 'Upload'}">
			<p:panel header="Report">
				<table class="customTbl">
					<tr>
						<td class="tdTitle"><p:fileUpload mode="simple" /></td>
						<td class="tdContent"><p:commandButton value="Upload"
								action="#{svoSiteVisitBackingBean.uploadSiteVisitReport}" /></td>
					</tr>
				</table>
			</p:panel>
		</c:if>



		<c:if
			test="#{svoSiteVisitBackingBean.managedBean.rptSubsMethod == 'Online'}">
			<p:panel header="Report">
				<div align="right">
					<p:commandButton value="Save" />
				</div>
				<ui:include src="/xhtml/sm/svositevisit/siteVisitReportTab.xhtml"></ui:include>
			</p:panel>
		</c:if>
	</p:outputPanel>



</ui:composition>
