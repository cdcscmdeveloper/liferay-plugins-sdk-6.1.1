<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:panel header="Report Submission">
			<table>
				<tr>
					<td><p:outputLabel value="Report Submit" /></td>
					<td><p:selectOneRadio id="rdoMethod"
							value="#{svoSiteVisitBackingBean.managedBean.rptSubsMethod}">
							<f:selectItem itemLabel="Report Upload" itemValue="Upload" />
							<f:selectItem itemLabel="Online Submit" itemValue="Online" />
						</p:selectOneRadio></td>

					<td><p:commandButton value="Submit"
							action="#{svoSiteVisitBackingBean.rptSubmitMethod}"
							update="@form" /></td>

				</tr>
			</table>
		</p:panel>


		<p:panel header="Report Upload" id="pnlUpload"
			rendered="#{svoSiteVisitBackingBean.managedBean.rptSubsMethod == 'Upload'}">
			<p:fileUpload mode="simple" />
			<p:commandButton value="Upload"
				action="#{svoSiteVisitBackingBean.uploadSiteVisitReport}" />
		</p:panel>


		<!--  <table>
		
			<tr class="test">
				<td><p:outputLabel value="Report Submit" /></td>
				<td><p:selectOneRadio>
						<f:selectItem itemLabel="Report Upload" itemValue="Upload" />
						<f:selectItem itemLabel="Online Submit" itemValue="Online" />
					</p:selectOneRadio></td>
				<td><p:commandButton value="Submit" /></td>
			</tr>
		</table>-->

	</ui:define>
</ui:composition>
