<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.sitevist.report']}" toggleable="true">
		<p:dataTable var="svo"
			value="#{svoSiteVisitBackingBean.managedBean.smApplSv.smSiteVisitAddresses}">

			<p:column headerText="#{lbl['lbl.sm.address']}">
							#{svo.smAddress.address1}<br />
							#{svo.smAddress.address2}<br />
							#{svo.smAddress.address3}
						</p:column>

			<p:column headerText="#{lbl['lbl.sm.postcode']}">
						#{svo.smAddress.postcode}
						</p:column>

			<p:column headerText="#{lbl['lbl.sm.towncity']}">
			</p:column>


			<p:column headerText="#{lbl['lbl.sm.district']}">
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.state']}">
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.country']}">
						#{svo.smAddress.pmCountry.countryName}
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.sitevist.report.status']}">
				<p:commandLink id="rptPreview" value="preview"
					onclick="dlg2.show();" />
			</p:column>
		</p:dataTable>

		<p:dialog id="modalDialog" header="#{lbl['lbl.sm.sitevist.report.preview']}"
			widgetVar="dlg2" modal="true" height="500" width="800">
			<ac:smPanel id="tt">
				<ui:include src="/xhtml/sm/svositevisit/siteVisitReportTab.xhtml"></ui:include>
			</ac:smPanel>
		</p:dialog>

	</p:panel>

	<div align="right">
		<div align="right">
			<ui:repeat value="#{svoSiteVisitBackingBean.managedBean.bpmAction}"
				var="item">
				<p:commandButton
					action="#{svoSiteVisitBackingBean.submitSiteVisitReport(item)}"
					value="#{item}" />
			</ui:repeat>
		</div>
	</div>
</ui:composition>
