<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">	
	
	<p:panel header="#{lbl['lbl.sm.officeloc']}" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.officeloc.ownership']}" /></td>
				<td>
				<p:outputLabel value="#{lbl['lbl.sm.facility.own']}" 
				rendered="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.ownershipType eq 'O'}" style="float : left"/>
				<p:outputLabel value="#{lbl['lbl.sm.facility.rent']}" 
				rendered="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.ownershipType eq 'R'}" style="float : left"/>
				</td>
			</tr>

			<tr>
			<p:outputPanel rendered="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.ownershipType eq 'O'}">
				<td><p:outputLabel value="#{lbl['lbl.sm.officeloc.prvt.prchs.price']}" /></td>
				<td><p:inputText value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.purchasePrice}" readonly="true">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText></td>
			</p:outputPanel> 
			<p:outputPanel rendered="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.ownershipType eq 'R'}">
				<td><p:outputLabel value="#{lbl['lbl.sm.officeloc.rent.mnthly.rate']}" /></td>
				<td><p:inputText value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.rentalRate}" readonly="true">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText></td>
			</p:outputPanel>
			</tr>

			<!-- #9583  - Site Visit Grouping Enhancement - 28775
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.officeloc.sign.board']}" /></td>
				<td>
					<p:selectBooleanCheckbox value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.signboardValid}" readonly="#{viewFlag}">
	
					</p:selectBooleanCheckbox>
				</td>

				<td><p:outputLabel value="#{lbl['lbl.sm.officeloc.share.with']}" /></td>
				
				<td><p:selectBooleanCheckbox value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.share}" readonly="#{viewFlag}">
					</p:selectBooleanCheckbox>
				</td>
			</tr> -->
			
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sm.officeloc.sign.board']}" /></td>
				<!-- 9583  - Site Visit Grouping Enhancement - 28775 -->
				<td><p:inputTextarea rows="5" cols="50"  autoResize="false" maxlength="10000" id="txtSignBoardRmk" readonly="#{viewFlag}"
					value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.signboardRemark}" /></td>
				<!-- #24964 - START -->
				<td>
					<ac:smFieldChangeAlertSVO 
						isShow="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO ne null}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvOffice.signboardRemark}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.signboardRemark}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvOffice.signboardRemark}"  />
				</td>	
				<!-- #24964 - END -->
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sm.officeloc.share.with']}" /></td>
				<!-- #9583 -->
				<td><p:inputTextarea rows="5" cols="50"  autoResize="false" maxlength="10000" id="txtShareWithRmk" readonly="#{viewFlag}"
					value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.shareWithRemark}" /></td>
				<!-- #24964 - START -->
				<td>
					<ac:smFieldChangeAlertSVO 
						isShow="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO ne null}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvOffice.shareWithRemark}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.shareWithRemark}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvOffice.shareWithRemark}"  />
				</td>	
				<!-- #24964 - END -->
			</tr>
			
			<tr><td>&#160;</td></tr>
			
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sm.officeloc.office.arrngmnt']}" /></td>
				<td><!-- #9583 -->
				<p:inputTextarea rows="5" cols="50"  autoResize="false" maxlength="10000" label="#{lbl['lbl.sm.officeloc.office.arrngmnt']}"
				value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.officeArrangement}" readonly="#{viewFlag}">
					<f:validateLength maximum="10000" />
				</p:inputTextarea>
				<!-- #24964 - START -->
				<ac:smFieldChangeAlertSVO 
					isShow="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO ne null}"
					oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvOffice.officeArrangement}" 
					currValue="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.officeArrangement}" 
					alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.smSvOffice.officeArrangement}"  />
				</td>	
				<!-- #24964 - END -->
			</tr>
		</table>
		<!-- 28775 - Site Visit Grouping Enhancement - 28775 - start -->
		<c:if test="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.siteVisitGroup}">
			<ui:param name="param" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3.categoryTypeCode.parameterCode}" />
			<c:if test="#{param == SupplierManagementConst.CAT_TYPE_WORKSHOP
						or param == SupplierManagementConst.CAT_TYPE_DOCKYARD}">
				<ui:include src="/xhtml/sm/shared/sitevisit/group/premiseLocation.xhtml" />
			</c:if>
			<c:if test="#{param == SupplierManagementConst.CAT_TYPE_MANUFACTURING}">
				<ui:include src="/xhtml/sm/shared/sitevisit/manufacturingComment.xhtml" />
			</c:if>
			<c:if test="#{param == SupplierManagementConst.CAT_TYPE_PRINTING}">
				<ui:include src="/xhtml/sm/shared/sitevisit/group/printing_premiseLocation.xhtml" />
			</c:if>
		</c:if>
		<!-- 28775 - Site Visit Grouping Enhancement - 28775 - end -->
	</p:panel>
</ui:composition>
