<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">	
	
	<p:panel header="#{lbl['lbl.sm.officeloc']}" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.officeloc.ownership']}" /></td>
				<td>
				<p:outputLabel value="#{lbl['lbl.sm.facility.own']}" 
				rendered="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.ownershipType eq 'O'}" style="float : left"/>
				<p:outputLabel value="#{lbl['lbl.sm.facility.rent']}" 
				rendered="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.ownershipType eq 'R'}" style="float : left"/>
				</td>
			</tr>

			<tr>
			<p:outputPanel rendered="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.ownershipType eq 'O'}">
				<td><p:outputLabel value="#{lbl['lbl.sm.officeloc.prvt.prchs.price']}" /></td>
				<td><p:inputText value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.purchasePrice}" readonly="true">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText></td>
			</p:outputPanel> 
			<p:outputPanel rendered="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.ownershipType eq 'R'}">
				<td><p:outputLabel value="#{lbl['lbl.sm.officeloc.rent.mnthly.rate']}" /></td>
				<td><p:inputText value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.smFacility.rentalRate}" readonly="true">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText></td>
			</p:outputPanel>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.officeloc.sign.board']}" /></td>
				<td>
					<p:selectBooleanCheckbox value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.signboardValid}" disabled="#{viewFlag}" />
				</td>
				<td><p:outputLabel value="#{lbl['lbl.sm.officeloc.share.with']}" /></td>
				<td><p:selectBooleanCheckbox value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.share}" disabled="#{viewFlag}" />
				</td>
			</tr>
			
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
				<!-- 9583 - Site Visit Grouping Enhancement - 28775 -->
				<!-- #34166 - Start  -->
				<td><p:inputTextarea rows="5" cols="50"  autoResize="false" maxlength="4000" label="#{lbl['lbl.sm.officeloc.sign.board']}" 
					id="txtSignBoardRmk" readonly="#{viewFlag}"
					onblur="console.log('Text Length: ' + this.value.length);"
					value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.signboardRemark}" validator="#{svoSiteVisitBackingBean.validateText}">
					<f:attribute name="param" value="#{lbl['lbl.sm.officeloc.sign.board']}" />
					<f:ajax event="blur" execute="@this" />
					<f:validateLength maximum="4000" />
					</p:inputTextarea>
				</td>
				<!-- #34166 - End  -->	
				<td valign="top"><p:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
				<!-- #34166 - Start  -->
				<td><p:inputTextarea rows="5" cols="50"  autoResize="false" maxlength="4000" label="#{lbl['lbl.sm.officeloc.share.with']}"
					id="txtShareWithRmk" disabled="#{viewFlag}"
					onblur="console.log('Text Length: ' + this.value.length);"
					value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.shareWithRemark}" validator="#{svoSiteVisitBackingBean.validateText}" >
					<f:attribute name="param" value="#{lbl['lbl.txt.remarks']}" />
					<f:ajax event="blur" execute="@this" />
					<f:validateLength maximum="4000" />
					</p:inputTextarea>
				</td>
				<!-- #34166 - End  -->
			</tr>
			
			<tr><td>&#160;</td></tr>
			
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sm.officeloc.office.arrngmnt']}" /></td>
				<td><!-- 9583 - Site Visit Grouping Enhancement - 28775 -->
				<!-- #34166 - Start  -->
				<p:inputTextarea rows="5" cols="50"  autoResize="false" maxlength="4000" label="#{lbl['lbl.sm.officeloc.office.arrngmnt']}"
				onblur="console.log('Text Length: ' + this.value.length);"
				value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvOffice.officeArrangement}" disabled="#{viewFlag}" validator="#{svoSiteVisitBackingBean.validateText}">
					<f:attribute name="param" value="#{lbl['lbl.sm.officeloc.office.arrngmnt']}" />
					<f:ajax event="blur" execute="@this" />
					<f:validateLength maximum="4000" />
				</p:inputTextarea>
				<!-- #34166 - End  -->
				</td>
			</tr>
		</table>
		<!-- 28775 - Site Visit Grouping Enhancement - 28775 - start -->
		<c:if test="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.siteVisitGroup}">
			<ui:param name="param" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.pmCategoryL3.categoryTypeCode.parameterCode}" />
			<c:if test="#{param == SupplierManagementConst.CAT_TYPE_WORKSHOP
						or param == SupplierManagementConst.CAT_TYPE_DOCKYARD}">
				<ui:include src="/xhtml/sm/shared/sitevisit/group/premiseLocation.xhtml" />
			</c:if>
			<c:if test="#{param == SupplierManagementConst.CAT_TYPE_MANUFACTURING}">
				<ui:include src="/xhtml/sm/shared/sitevisit/manufacturingComment.xhtml" />
			</c:if>
			<c:if test="#{param == SupplierManagementConst.CAT_TYPE_PRINTING}">
				<ui:include src="/xhtml/sm/shared/sitevisit/group/printing_premiseLocation.xhtml" />
			</c:if>
		</c:if>
		<!-- 28775 - Site Visit Grouping Enhancement - 28775 - end -->
	</p:panel>
</ui:composition>
