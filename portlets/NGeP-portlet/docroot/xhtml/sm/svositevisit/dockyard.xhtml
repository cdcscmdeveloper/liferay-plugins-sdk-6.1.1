<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<h:outputText value="Dockyard" styleClass="screen-title" />
	
	<p:tabView>
		<p:tab title="Site Info">
			<c:choose>
				<c:when test="#{!viewFlag}">
					<ui:include src="/xhtml/sm/shared/sitevisit/addressRepresentatives.xhtml" />
				</c:when>
				
				<c:otherwise>
					<ui:include src="/xhtml/sm/shared/sitevisit/view_addressRepresentatives.xhtml" />
				</c:otherwise>
			</c:choose>
			
			<ui:include src="/xhtml/sm/shared/sitevisit/licenseInsurance.xhtml" />
		</p:tab>
		
		<p:tab title="Tool/ Equipment/ Machine">
			<ui:include src="/xhtml/sm/shared/sitevisit/equipment.xhtml" />
			<c:choose>
				<c:when test="#{!viewFlag}">
					<ui:include src="/xhtml/sm/shared/sitevisit/machine.xhtml" />
				</c:when>
				
				<c:otherwise>
					<ui:include src="/xhtml/sm/shared/sitevisit/view_machine.xhtml" />
				</c:otherwise>
			</c:choose>
			
		</p:tab>
		
		<p:tab title="Comment &#38; Recommendation">
			<ui:include src="/xhtml/sm/shared/sitevisit/premiseLocation.xhtml" />
			<ui:include src="/xhtml/sm/shared/sitevisit/commentRecommendation.xhtml" />
		</p:tab>
	</p:tabView>
</ui:composition>
