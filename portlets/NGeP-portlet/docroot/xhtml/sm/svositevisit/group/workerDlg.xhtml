<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="workerDlg" header="#{lbl['lbl.sm.worker.employee']}" widgetVar="workerDlg" 
		modal="true" width="600" dynamic="true" cache="false">
		<p:messages id="workDlgMessages" showDetail="true" autoUpdate="#{!empty param['disableMsgAutoUpdate']}" 
			closable="true" showSummary="false" />
		<ui:param name="svWorker" value="#{svoSiteVisitBackingBean.managedBean.selectedSmSvWorker}" />
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.worker.specialization']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:inputText value="#{svWorker.expertise}" disabled="#{viewFlag}" label="#{lbl['lbl.sm.worker.specialization']}" 
						maxlength="2000" required="#{!empty param['disableMsgAutoUpdate']}"  />
					<ac:smFieldChangeAlert 
						isShow="true"
						oriValue="#{svWorker.oldExpertise}" 
						currValue="#{svWorker.expertise}" 
						alertValue="#{svWorker.oldExpertise}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.worker.name']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:inputText value="#{svWorker.name}" label="#{lbl['lbl.sm.worker.name']}" maxlength="80" 
						required="#{!empty param['disableMsgAutoUpdate']}"/>
					<ac:smFieldChangeAlert 
						isShow="true"
						oriValue="#{svWorker.oldName}" 
						currValue="#{svWorker.name}" 
						alertValue="#{svWorker.oldName}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.employee.idtype']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneMenu id="empIdTypeId" size="45" label="#{lbl['lbl.sm.employee.idtype']}"
						rendered="#{svWorker != null}"
						required="#{!empty param['disableMsgAutoUpdate']}" value="#{svWorker.identificationTypeId}"
						style="width: 100%;margin-bottom: 5px;background-color:white;">
						<f:selectItems value="#{svoSiteVisitBackingBean.managedBean.identificationTypes}" />
						<p:ajax event="change" process="@this" update="@this,pnlIdentType"/>
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.worker.icno']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:outputPanel id="pnlIdentType">
	                	<p:inputText id="empIcId" value="#{svWorker.identificationNo}"
							label="#{lbl['lbl.sm.worker.icno']}"
							rendered="#{svWorker ne null and svWorker.identificationTypeId eq '115'}"
							required="#{!empty param['disableMsgAutoUpdate']}"
							maxlength="12" size="30" style="width: 80% !important;"
							validatorMessage="#{lbl['lbl.sm.worker.icno']} - #{lbl['lbl.sm.invalidNo']}">
							<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
							<p:ajax process="@this" partialSubmit="true" update="@this,empIcIdMsg" />
						</p:inputText>
						<p:message id="empIcIdMsg" for="empIcId"
										showSummary="true" showDetail="false" display="icon" />	
										
						<p:inputText id="empPassId" value="#{svWorker.identificationNo}"
							label="#{lbl['lbl.sm.worker.icno']}"
							rendered="#{svWorker ne null and svWorker.identificationTypeId ne '115'}"
							required="#{!empty param['disableMsgAutoUpdate']}"
							maxlength="15" size="30" style="width: 80% !important;">
						</p:inputText>
						<p:message id="empPassIdMsg" for="empPassId"
										showSummary="true" showDetail="false" display="icon" />
						<ac:smFieldChangeAlert 
							isShow="true"
							oriValue="#{svWorker.oldIdentificationNo}" 
							currValue="#{svWorker.identificationNo}" 
							alertValue="#{svWorker.oldIdentificationNo}"/>
					</p:outputPanel>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.worker.experience']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:inputText value="#{svWorker.workExpYear}" label="#{lbl['lbl.sm.worker.experience']}"
						maxlength="2" required="#{!empty param['disableMsgAutoUpdate']}" 
						style="width: 55px !important;"><!-- #38205 -->
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</p:inputText>
					<ac:smFieldChangeAlert 
						isShow="true"
						oriValue="#{svWorker.oldWorkExpYear}" 
						currValue="#{svWorker.workExpYear}" 
						alertValue="#{svWorker.oldWorkExpYear}"/>
				</td>
			</tr>
		</table>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.save']}" 
				update="@([id$=workTbl])" process="workerDlg"
				action="#{svoSiteVisitBackingBean.saveSmSvWorker}">
				<f:param name="disableMsgAutoUpdate" value="true" />
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
