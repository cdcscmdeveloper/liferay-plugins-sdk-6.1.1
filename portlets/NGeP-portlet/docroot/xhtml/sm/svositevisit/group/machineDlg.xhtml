<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="machineDlg" header="#{lbl['lbl.sm.manufacturing.equipmnt.mchne']}" widgetVar="macDlg" 
		modal="true" width="600" dynamic="true" cache="false">
		<p:messages id="macDlgMessages" showDetail="true" autoUpdate="#{!empty param['disableMsgAutoUpdate2']}" 
			closable="true" showSummary="false" />
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacturing.type.machine']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.machineType}" 
						style="float: left;white-space: normal;" 
						rendered="#{empty svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.machine}" />
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.machine.machineDesc}" 
						style="float: left;white-space: normal;" 
						rendered="#{!empty svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.machine}" />
				</td>
			</tr>
			
			<tr>	
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.brand']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<!-- 14686 - Site Visit Grouping Enhancement -28775 -->
				<td><p:inputText maxlength="250" size="50" label="#{lbl['lbl.sm.machine.brand']}" 
					required="#{!empty param['disableMsgAutoUpdate2']}" 
					value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.brandName}" />
				</td>
			</tr>
			
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sm.machine.function']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<!-- 14686 - Site Visit Grouping Enhancement -28775 -->
				<td><p:inputTextarea  maxlength="250" style="width:75;" label="#{lbl['lbl.sm.machine.function']}" 
						required="#{!empty param['disableMsgAutoUpdate2']}" 
						value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.machineFunction}">
					<f:validateLength maximum="250" />
				</p:inputTextarea>
				</td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.quantity']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:inputText maxlength="8" size="50" label="#{lbl['lbl.sm.machine.quantity']}" 
						required="#{!empty param['disableMsgAutoUpdate2']}" 
						value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.qty}">
						<f:validateLongRange minimum="1" maximum="99999999" />
					</p:inputText>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.value']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="14" size="50" label="#{lbl['lbl.sm.machine.value']}" 
						required="#{!empty param['disableMsgAutoUpdate2']}" 
						value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.value}">
						<f:validateDoubleRange minimum="#{SupplierManagementConst.MIN_AMT_RANGE}" 
						maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" disabled="#{empty param['disableMsgAutoUpdate']}"/>
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax process="@this" partialSubmit="true" update="@this" />
						<f:param name="disableMsgAutoUpdate" value="true" />
					</p:inputText>
				</td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.purMthd']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="macPurchaseMethodId" label="#{lbl['lbl.sm.machine.purMthd']}"  
					rendered="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine != null}"
					value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.purchaseMethod}" 
					required="#{!empty param['disableMsgAutoUpdate2']}">
						<f:selectItems value="#{svoSiteVisitBackingBean.getDropdownCodeValues(ParameterTypeConst.purchasingMethod)}" />
					</p:selectOneMenu>
					</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.guarnName']}" /></td>
					<!-- 14686 - Site Visit Grouping Enhancement -28775 -->
				<td><p:inputText maxlength="250" size="50" label="#{lbl['lbl.sm.machine.guarnName']}" 
						value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.guarantorName}" />
				</td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.purchase.year']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu label="#{lbl['lbl.sm.machine.purchase.year']}"  
						rendered="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine != null}"
						value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.purchaseYear}" 
						required="#{!empty param['disableMsgAutoUpdate2']}">
					<f:selectItems value="#{svoSiteVisitBackingBean.getYearDropDown()}" />
				</p:selectOneMenu>
				</td>
			</tr>
		</table>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.save']}" update="@([id$=categoryTypeGroupPanel])" 
				 action="#{svoSiteVisitBackingBean.saveSmSvMachine}">
				<f:param name="disableMsgAutoUpdate2" value="true" />
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
