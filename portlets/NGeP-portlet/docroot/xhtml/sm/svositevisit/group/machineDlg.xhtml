<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="machineDlg" header="#{lbl['lbl.sm.manufacturing.equipmnt.mchne']}" widgetVar="macDlg" 
		modal="true" width="600" dynamic="true" cache="false">
		<p:messages id="macDlgMessages" showDetail="true" autoUpdate="#{!empty param['disableMsgAutoUpdate2']}" closable="true" showSummary="false" />
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacturing.type.machine']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.machineType}" style="float: left;white-space: normal;" 
					rendered="#{empty svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.machine}"></h:outputText>
					<h:outputText value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.machine.machineDesc}" style="float: left;white-space: normal;" 
					rendered="#{!empty svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.machine}"></h:outputText>
				</td>
			</tr>
			
			<tr>	
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.brand']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="50" size="50" label="#{lbl['lbl.sm.machine.brand']}" required="#{!empty param['disableMsgAutoUpdate2']}" 
				value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.brandName}" />
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.brandName}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.brandName}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.brandName}"/>
				</td>
			</tr>
			
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sm.machine.function']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputTextarea  maxlength="100" style="width:75;" label="#{lbl['lbl.sm.machine.function']}" 
				required="#{!empty param['disableMsgAutoUpdate2']}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.machineFunction}">
					<f:validateLength maximum="100" />
				</p:inputTextarea>
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.machineFunction}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.machineFunction}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.machineFunction}"/>
				</td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.quantity']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:inputText maxlength="8" size="50" label="#{lbl['lbl.sm.machine.quantity']}" required="#{!empty param['disableMsgAutoUpdate2']}" 
					value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.qty}">
						<f:validateLongRange minimum="1" maximum="99999999"></f:validateLongRange>
					</p:inputText>
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.qty}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.qty}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.qty}"/>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.value']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText maxlength="14" size="50" label="#{lbl['lbl.sm.machine.value']}" required="#{!empty param['disableMsgAutoUpdate2']}" 
						value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.value}">
						<f:validateDoubleRange minimum="#{SupplierManagementConst.MIN_AMT_RANGE}" 
						maximum="#{SupplierManagementConst.MAX_AMT_RANGE}" disabled="#{empty param['disableMsgAutoUpdate']}"/>
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax process="@this" partialSubmit="true" update="@this" />
						<f:param name="disableMsgAutoUpdate" value="true" />
					</p:inputText>
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.value}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.value}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.value}"/>
				</td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.purMthd']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="macPurchaseMethodId" label="#{lbl['lbl.sm.machine.purMthd']}"  rendered="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine != null}"
					value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.purchaseMethod}" required="#{!empty param['disableMsgAutoUpdate2']}">
						<f:selectItems value="#{svoSiteVisitBackingBean.getDropdownCodeValues(ParameterTypeConst.purchasingMethod)}" />
					</p:selectOneMenu>
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.purchaseMethod}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.purchaseMethod}" 
						alertValue="#{svoSiteVisitBackingBean.getParameterDesc(ParameterTypeConst.purchasingMethod,svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.purchaseMethod)}"/>
					</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.guarnName']}" /></td>
				<td><p:inputText maxlength="50" size="50" label="#{lbl['lbl.sm.machine.guarnName']}" value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.guarantorName}" />
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.guarantorName and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.guarantorName}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.guarantorName}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.guarantorName}"/>
				</td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.machine.purchase.year']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu label="#{lbl['lbl.sm.machine.purchase.year']}"  rendered="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine != null}"
					value="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.purchaseYear}" required="#{!empty param['disableMsgAutoUpdate2']}">
					<f:selectItems value="#{svoSiteVisitBackingBean.getYearDropDown()}" />
				</p:selectOneMenu>
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.purchaseYear}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.selectedSvMachine.smMachineDtl.purchaseYear}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.latestSvMachine.smMachineDtl.purchaseYear}"/>
				</td>
			</tr>
		</table>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.save']}" update="@([id$=categoryTypeGroupPanel])" 
				 action="#{svoSiteVisitBackingBean.saveSmSvMachine}">
				<f:param name="disableMsgAutoUpdate2" value="true" />
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
