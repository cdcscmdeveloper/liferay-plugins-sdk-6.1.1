<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="manufacturingDlg" header="#{lbl['lbl.sm.manufacture.diaHdr']}"
		widgetVar="manufacturingDialog" modal="true" width="500px" closable="true"
		dynamic="true" cache="false">

		<p:messages id="manufacturingDialogMsg" showDetail="true"
			autoUpdate="#{!empty param['disableMsgAutoUpdateMac']}"
			closable="true" showSummary="false" />

		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.prdType']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.manufacture.prdType']}"
						id="smManuDtlProdType" size="35" maxlength="50"
						required="#{!empty param['disableMsgAutoUpdateMac']}"
						value="#{svoSiteVisitBackingBean.managedBean.selectedManufacturer.goodsType}" />
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedManufacturer and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.latestManufacturer.goodsType}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.selectedManufacturer.goodsType}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.latestManufacturer.goodsType}"/>
					<p:message id="smManuDtlProdTypeMsg" for="smManuDtlProdType"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.brand']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.manufacture.brand']}"
						id="smManuDtlBrdType" size="35" maxlength="50"
						required="#{!empty param['disableMsgAutoUpdateMac']}"
						value="#{svoSiteVisitBackingBean.managedBean.selectedManufacturer.brand}" />
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedManufacturer and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.latestManufacturer.brand}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.selectedManufacturer.brand}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.latestManufacturer.brand}"/>
					<p:message id="smManuDtlBrdTypeMsg" for="smManuDtlBrdType"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sm.manufacture.prodCapMonth']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText label="#{lbl['lbl.sm.manufacture.prodCap']}"
						id="smManuDtlProdCap" size="35" maxlength="6"
						required="#{!empty param['disableMsgAutoUpdateMac']}"
						value="#{svoSiteVisitBackingBean.managedBean.selectedManufacturer.productionCapacity}" />
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedManufacturer and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.latestManufacturer.productionCapacity}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.selectedManufacturer.productionCapacity}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.latestManufacturer.productionCapacity}"/>
					<p:message id="smManuDtlProdCapMsg" for="smManuDtlProdCap"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.manufacture.mesUnit']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td valign="top"><p:inputText
						label="#{lbl['lbl.sm.manufacture.mesUnit']}" id="smManuDtlMesUnit"
						maxlength="20"
						required="#{!empty param['disableMsgAutoUpdateMac']}"
						value="#{svoSiteVisitBackingBean.managedBean.selectedManufacturer.uom}" />
					<!-- #24964 -->
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.selectedManufacturer and not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.latestManufacturer.uom}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.selectedManufacturer.uom}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.latestManufacturer.uom}"/>
					<p:message id="smManuDtlMesUnitMsg" for="smManuDtlMesUnit"
						showSummary="true" showDetail="false" display="icon" /></td>
			</tr>
		</table>

		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.save']}"
				update="@([id$=categoryTypeGroupPanel])"
				action="#{svoSiteVisitBackingBean.saveSmManufacturingDtl}">
				<f:param name="disableMsgAutoUpdateMac" value="true" />
			</p:commandButton>

		</div>

	</p:dialog>

	<ac:confirmationPopup id="additionalManufacturingDeletePopUpId"
		widget="additionalManufacturingDeletePopUp"
		okAction="svoSiteVisitBackingBean.removeAdditionalManufacturingDtl()"
		width="400" height="100"
		title="#{lbl['lbl.msg.confirm.delete.header']}"
		content="#{lbl['lbl.msg.confirm.delete']}"
		update="@parent" />
</ui:composition>
