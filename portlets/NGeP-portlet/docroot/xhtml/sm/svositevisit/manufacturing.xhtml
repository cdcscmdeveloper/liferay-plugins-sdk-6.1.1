<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<h:outputText value="#{lbl['lbl.sm.sitevisit.category.manufacturing']}" styleClass="screen-title" />
	<p:tabView>
		<p:tab title="#{lbl['lbl.sm.manufacturing.siteinfo']}">
			<c:choose>
				<c:when test="#{!viewFlag}">
					<ui:include src="/xhtml/sm/shared/sitevisit/addressRepresentatives.xhtml" />
				</c:when>
				
				<c:otherwise>
					<ui:include src="/xhtml/sm/shared/sitevisit/view_addressRepresentatives.xhtml" />
				</c:otherwise>
			</c:choose>
			<ui:include src="/xhtml/sm/shared/sitevisit/financialDoc.xhtml" />
		</p:tab>

		<p:tab title="#{lbl['lbl.sm.manufacturing.equipmnt.mchne']}">
			<c:choose>
				<c:when test="#{!viewFlag}">
					<ui:include src="/xhtml/sm/shared/sitevisit/machine.xhtml" />
				</c:when>
				
				<c:otherwise>
					<ui:include src="/xhtml/sm/shared/sitevisit/view_machine.xhtml" />
				</c:otherwise>
			</c:choose>
		</p:tab>
		
		<p:tab title="#{lbl['lbl.sm.manufacturing.comment.and.recommndtn']}">
			<ui:include src="/xhtml/sm/shared/sitevisit/manufacturingComment.xhtml" />
			<ui:include src="/xhtml/sm/shared/sitevisit/commentRecommendation.xhtml" />
		</p:tab>
	</p:tabView>
</ui:composition>
