<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<div class="container" style="width: auto;">
		<div id="leftcolumn" style="width: auto; float: left;">
			<p:menu>
				<p:submenu label="Site Visit Report">
					<p:menuitem value="Check List"
						onclick="rmtCall([{name:'name1',value:'checkList'}]);"
						id="mnCheckList" />
					<p:menuitem value="Preparation Details"
						onclick="rmtCall([{name:'name1',value:'preDetails'}]);" />
					<p:menuitem value="Company Information"
						onclick="rmtCall([{name:'name1',value:'compInfo'}]);" />
					<p:menuitem value="Section A"
						onclick="rmtCall([{name:'name1',value:'sectionA'}]);" />
					<p:menuitem value="Section B"
						onclick="rmtCall([{name:'name1',value:'sectionB'}]);" />
					<p:menuitem value="Section C"
						onclick="rmtCall([{name:'name1',value:'sectionC'}]);" />
					<p:menuitem value="Section D"
						onclick="rmtCall([{name:'name1',value:'sectionD'}]);" />
					<p:menuitem value="Section E"
						onclick="rmtCall([{name:'name1',value:'sectionE'}]);" />
				</p:submenu>
			</p:menu>

			<p:remoteCommand name="rmtCall" update="pnlSideVisitReview"
				action="#{siteVisitViewBackingBean.siteVisitReviewNavi}" />
		</div>

		<div id="content" style="float: left; width: auto;">
			<p:panel id="pnlSideVisitReview">
				<c:if
					test="#{siteVisitViewBackingBean.managedBean.svReviewNavi == 'checkList'}">
					<ui:include
						src="/xhtml/sm/shared/sitevisit/templateCheckList/siteVisitCheckList.xhtml" />
				</c:if>

				<c:if
					test="#{siteVisitViewBackingBean.managedBean.svReviewNavi == 'preDetails'}">
					<ui:include
						src="/xhtml/sm/shared/sitevisit/templateCheckList/preparationDetails.xhtml" />
				</c:if>

				<c:if
					test="#{siteVisitViewBackingBean.managedBean.svReviewNavi == 'compInfo'}">
					<ui:include
						src="/xhtml/sm/shared/sitevisit/templateCheckList/companyInformation.xhtml" />
				</c:if>

				<c:if
					test="#{siteVisitViewBackingBean.managedBean.svReviewNavi == 'sectionA'}">
					<ui:include
						src="/xhtml/sm/shared/sitevisit/templateCheckList/sectionA.xhtml" />
				</c:if>

				<c:if
					test="#{siteVisitViewBackingBean.managedBean.svReviewNavi == 'sectionB'}">
					<ui:include
						src="/xhtml/sm/shared/sitevisit/templateCheckList/sectionB.xhtml" />
				</c:if>
				
				<c:if
					test="#{siteVisitViewBackingBean.managedBean.svReviewNavi == 'sectionC'}">
					<ui:include
						src="/xhtml/sm/shared/sitevisit/templateCheckList/formSection/manufacturing.xhtml" />
				</c:if>
				
				<c:if
					test="#{siteVisitViewBackingBean.managedBean.svReviewNavi == 'sectionD'}">
					<ui:include
						src="/xhtml/sm/shared/sitevisit/templateCheckList/categoryApplicable.xhtml" />
				</c:if>
				
				<c:if
					test="#{siteVisitViewBackingBean.managedBean.svReviewNavi == 'sectionE'}">
					<ui:include
						src="/xhtml/sm/shared/sitevisit/templateCheckList/formSection/updatesAndRecommendation.xhtml" />
				</c:if>
			</p:panel>
		</div>
		<div style="clear: both" />
	</div>
</ui:composition>
