<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.sitevist.svo.category.applicable']}" id="pnlCategoryApplicable" toggleable="true">
		<p:dataTable
			value="#{svoSiteVisitBackingBean.managedBean.categoryApplicable}"
			var="catApp">
			<ui:param name="catCode" value="#{catApp.pmCategoryL1.categoryL1Code}#{catApp.pmCategoryL2.categoryL2Code}#{catApp.pmCategoryL3.categoryL3Code}" />
			<p:column headerText="#{lbl['lbl.sm.catCodes.catcode']}">
					#{catCode}
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.category.description']}">
						#{catApp.pmCategoryL3.categoryName}
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.sitevist.svo.first.recommendation']}">
				#{lbl['lbl.sm.catCodes.approved']}
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
