<!-- #28175 start -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
<!-- #28175 end -->

	<p:panel header="#{lbl['lbl.sm.sitevisit.section.d']}" id="pnlCategoryApplicable" toggleable="true">
		<p:dataTable emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{svoSiteVisitBackingBean.managedBean.categoryApplicable}"
			var="catApp" rowIndexVar="index">
			<ui:param name="catCode" value="#{catApp.pmCategoryL1.categoryL1Code}#{catApp.pmCategoryL2.categoryL2Code}#{catApp.pmCategoryL3.categoryL3Code}" />
			
			<p:column headerText="No.">
				#{index + 1}
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.catCodes.catcode']}">
					#{catCode}
			</p:column>
			<!-- #28175 start -->
			<c:choose>
				<!-- #28175 Reopen #94, #141 Start -->
				<c:when test="#{not svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.activeAppl}">
		        <!-- #28175 Reopen #94 End -->
					<p:column headerText="#{lbl['lbl.sm.category.description']}">
						#{catApp.categoryL3Name} 
					</p:column>
				</c:when>
				<c:otherwise>
					<p:column headerText="#{lbl['lbl.sm.category.description']}">
								#{catApp.pmCategoryL3.categoryName}
					</p:column>
				</c:otherwise>
			</c:choose>
			<!-- #28175 end -->
			
			<p:column headerText="#{lbl['lbl.sm.sitevist.svo.first.recommendation']}">
				#{lbl['lbl.sm.catCodes.approved']}
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
