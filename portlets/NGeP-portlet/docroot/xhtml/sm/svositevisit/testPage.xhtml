<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="sideMenu">
		<p:menu>
			<p:submenu label="Site Visit Report">
				<p:menuitem value="Check List"
					onclick="#{siteVisitViewBackingBean.siteVisitReviewNavi('checkList')}"
					update="pnlSideVisitReview" />
				<p:menuitem value="Preparation Details"
					onclick="#{siteVisitViewBackingBean.siteVisitReviewNavi('preDetails')}"
					update="pnlSideVisitReview" />
				<p:menuitem value="Company Information"
					onclick="#{siteVisitViewBackingBean.siteVisitReviewNavi('compInfo')}"
					update="pnlSideVisitReview" />
					
				<!--<p:menuitem value="Check List"
					onclick="rmtCall({param:'checkList'})" id="mnCheckList"/>  -->
			</p:submenu>
		</p:menu>
	</ui:define>


	<p:remoteCommand name="rmtCall" update="pnlSideVisitReview" action="#{siteVisitViewBackingBean.siteVisitReviewNavi}" />


	<ui:define name="content">
		<p:panel id="pnlSideVisitReview">
			<c:if
				test="#{siteVisitViewBackingBean.managedBean.svReviewNavi == 'checkList'}">
				<ui:include
					src="/xhtml/sm/shared/sitevisit/templateCheckList/siteVisitCheckList.xhtml" />
			</c:if>

			<c:if
				test="#{siteVisitViewBackingBean.managedBean.svReviewNavi == 'preDetails'}">
				<ui:include
					src="/xhtml/sm/shared/sitevisit/templateCheckList/preparationDetails.xhtml" />
			</c:if>

			<c:if
				test="#{siteVisitViewBackingBean.managedBean.svReviewNavi == 'compInfo'}">
				<ui:include
					src="/xhtml/sm/shared/sitevisit/templateCheckList/companyInformation.xhtml" />
			</c:if>
		</p:panel>
		<!--
		<p:panel header="Site Visit Checklist" toggleable="true"
			collapsed="true">
			<ui:include
				src="/xhtml/sm/shared/sitevisit/templateCheckList/companyInformation.xhtml" />
		</p:panel>

		<p:panel header="Preparation Details" toggleable="true"
			collapsed="true">
			<ui:include
				src="/xhtml/sm/shared/sitevisit/templateCheckList/preparationDetails.xhtml" />
		</p:panel>

		<p:panel header="Company Information" toggleable="true"
			collapsed="true">
			<ui:include
				src="/xhtml/sm/shared/sitevisit/templateCheckList/companyInformation.xhtml" />
		</p:panel>
	-->
	</ui:define>
</ui:composition>
