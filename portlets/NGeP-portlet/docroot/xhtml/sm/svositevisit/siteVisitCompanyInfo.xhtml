<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<c:set var="svTask" value="#{svoSiteVisitBackingBean.managedBean.smSvTask}" />
	<p:panel header="#{lbl['lbl.sm.sitevist.capital.equity.details']}" toggleable="true" id="pnlCapital">
		<table class="customTbl">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.equiStatus.authCap']}" /></td>
				<td><p:inputText readonly="true" id="authoCapitalId"
						value="#{svTask.smAppl.smCompanyBasic.authorizedCapital}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.equiStatus.paidUpCap']}" /></td>
				<td><p:inputText readonly="true" id="paidUpCapitalId" value="#{svTask.smAppl.smCompanyBasic.paidUpCapital}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText></td>
				<td></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.sitevist.equity']}" toggleable="true" id="pnlEquity">
		<table class="customTbl">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.total.owner']}" /></td>
				<td><p:inputText readonly="true" id="ttlOwnerId" value="#{fn:length(svTask.smAppl.smSupplier.smSupplierOwners)}"/>person(s)</td>
			</tr>
			
			<ui:repeat varStatus="equityStat" var="owner" value="#{svTask.smAppl.smSupplier.smSupplierOwners}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.ownername']}" rendered="#{equityStat.index == 0}" />
					<p:outputLabel value="&#160;" rendered="#{equityStat.index != 0}" /></td>
					<td><p:inputText readonly="true" value="#{owner.ownerName}" /></td>
					<td>&#160;</td>
				</tr>
			</ui:repeat>
<!-- 			<tr> -->
<!-- 				<td><p:outputLabel value="Owner Name 1." /></td> -->
<!-- 				<td><p:inputText /></td> -->
<!-- 			</tr> -->

<!-- 			<tr> -->
<!-- 				<td><p:outputLabel value="2." /></td> -->
<!-- 				<td><p:inputText /></td> -->
<!-- 			</tr> -->

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.assocCmpny.companyName']}" /></td>
				<td><p:inputText readonly="true" id="eqCompanyNameId" value="#{svTask.smAppl.smCompanyBasic.companyName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.bumiamount']}" /></td>
				<td><p:inputText readonly="true" id="eqBumiputeraId"
						value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.smCompanyBasic.bumiEquity}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td><p:inputText readonly="true" value="#{svoSiteVisitBackingBean.calculateEquityPercentage(svTask.smAppl.smCompanyBasic.bumiEquity)}"/>%</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.nonbumiamount']}" /></td>
				<td><p:inputText readonly="true" id="eqNonBumiputeraId"
						value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.smCompanyBasic.nonBumiEquity}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td><p:inputText readonly="true" value="#{svoSiteVisitBackingBean.calculateEquityPercentage(svTask.smAppl.smCompanyBasic.nonBumiEquity)}" />%</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.nonmalaysianamount']}" /></td>
				<td><p:inputText readonly="true" id="eqNonMalaysianId"
						value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.smCompanyBasic.foreignerEquity}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td><p:inputText readonly="true" value="#{svoSiteVisitBackingBean.calculateEquityPercentage(svTask.smAppl.smCompanyBasic.foreignerEquity)}" />%</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.gov.agency.equity']}" /><br /><p:outputLabel
						value="#{lbl['lbl.sm.sitevist.unit.trust.agncy.amount']}" /></td>
				<td><p:inputText readonly="true" id="eqUnitTrustId"
						value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.smCompanyBasic.govtUnitrustEquity}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td><p:inputText readonly="true" value="#{svoSiteVisitBackingBean.calculateEquityPercentage(svTask.smAppl.smCompanyBasic.govtUnitrustEquity)}" />%</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.gov.equity.amount']}" /></td>
				<td><p:inputText readonly="true" id="eqGovttId"
						value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.smCompanyBasic.govtEquity}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td><p:inputText readonly="true" value="#{svoSiteVisitBackingBean.calculateEquityPercentage(svTask.smAppl.smCompanyBasic.govtEquity)}" />%</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.local.cmpny.amount']}" /></td>
				<td><p:inputText readonly="true" id="eqLocalCompanyId"
						value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.smCompanyBasic.localCompanyEquity}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td><p:inputText readonly="true" value="#{svoSiteVisitBackingBean.calculateEquityPercentage(svTask.smAppl.smCompanyBasic.localCompanyEquity)}" />%</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.foreign.cmpny.amount']}" /></td>
				<td><p:inputText readonly="true" id="eqForeignCompanyId"
						value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.smCompanyBasic.foreignCompanyEquity}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td><p:inputText readonly="true" value="#{svoSiteVisitBackingBean.calculateEquityPercentage(svTask.smAppl.smCompanyBasic.foreignCompanyEquity)}" />%</td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.sitevist.board.directors']}" toggleable="true" id="pnlBOD">
		<table class="customTbl">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.total']}" /></td>
				<td><p:inputText id="ttlBODId" readonly="true" value="#{svoSiteVisitBackingBean.managedBean.totalBOD}" />person(s)</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.bumi']}" /></td>
				<td><p:inputText id="bodBumiId" readonly="true" value="#{svoSiteVisitBackingBean.managedBean.dirBumi}"/>person(s)</td>
				<td><p:inputText id="bodBumiPercId" readonly="true" value="#{svoSiteVisitBackingBean.calculateDirectorPercentage(svoSiteVisitBackingBean.managedBean.dirBumi)}"/>%</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.composition.nonBumi']}" /></td>
				<td><p:inputText id="bodNonBumiId" readonly="true" value="#{svoSiteVisitBackingBean.managedBean.dirNonBumi}"/>person(s)</td>
				<td><p:inputText id="bodNonBumiPercId" readonly="true" value="#{svoSiteVisitBackingBean.calculateDirectorPercentage(svoSiteVisitBackingBean.managedBean.dirNonBumi)}"/>%</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.composition.Frg']}" /></td>
				<td><p:inputText id="bodNonMalaysianId" readonly="true" value="#{svoSiteVisitBackingBean.managedBean.dirNonMalaysian}" />person(s)</td>
				<td><p:inputText id="bodNonMalaysianPercId" readonly="true" value="#{svoSiteVisitBackingBean.calculateDirectorPercentage(svoSiteVisitBackingBean.managedBean.dirNonMalaysian)}"/>%</td>
			</tr>
			<ui:repeat varStatus="status" var="bod"
				value="#{svoSiteVisitBackingBean.managedBean.bodLs}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.director.name']}" rendered="#{status.index == 0}" />
					<p:outputLabel value="&#160;" rendered="#{status.index != 0}" /></td>
					<td><p:inputText readonly="true" value="#{bod.name}" /></td>
					<td>&#160;</td>
				</tr>
			</ui:repeat>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.person.composition.mngt']}" toggleable="true" id="pnlMgmt">
		<table class="customTbl">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.total']}" /></td>
				<td><p:inputText id="ttlMgmtId" readonly="true" value="#{svoSiteVisitBackingBean.managedBean.totalMgmt}" />person(s)</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.bumi']}" /></td>
				<td><p:inputText id="mgmtBumiId" readonly="true" value="#{svoSiteVisitBackingBean.managedBean.mgmtBumi}" />person(s)</td>
				<td><p:inputText id="mgmtBumiPercId" readonly="true" value="#{svoSiteVisitBackingBean.calculateMgmtPercentage(svoSiteVisitBackingBean.managedBean.mgmtBumi)}"/>%</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.composition.nonBumi']}" /></td>
				<td><p:inputText id="mgmtNonBumiId" readonly="true" value="#{svoSiteVisitBackingBean.managedBean.mgmtNonBumi}"/>person(s)</td>
				<td><p:inputText id="mgmtNonBumiPercId" readonly="true" value="#{svoSiteVisitBackingBean.calculateMgmtPercentage(svoSiteVisitBackingBean.managedBean.mgmtNonBumi)}"/>%</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.composition.Frg']}" /></td>
				<td><p:inputText id="mgmtNonMalaysianId" readonly="true" value="#{svoSiteVisitBackingBean.managedBean.mgmtNonMalaysian}" />person(s)</td>
				<td><p:inputText id="mgmtNonMalaysianPercId" readonly="true" value="#{svoSiteVisitBackingBean.calculateMgmtPercentage(svoSiteVisitBackingBean.managedBean.mgmtNonMalaysian)}"/>%</td>
			</tr>

<!-- 			<tr> -->
<!-- 				<td><p:outputLabel value="CEO Name" /></td> -->
<!-- 				<td><p:inputText /></td> -->
<!-- 			</tr> -->
			
			<ui:repeat varStatus="mgmtStatus" var="mgmt" value="#{svoSiteVisitBackingBean.managedBean.bodLs}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.sitevist.manager.name']}" rendered="#{mgmtStatus.index == 0}" />
					<p:outputLabel value="&#160;" rendered="#{mgmtStatus.index != 0}" /></td>
					<td><p:inputText readonly="true" value="#{mgmt.name}" /></td>
				</tr>
			</ui:repeat>
<!-- 			<tr> -->
<!-- 				<td><p:outputLabel value="Manager Name" /></td> -->
<!-- 				<td><p:inputText /></td> -->
<!-- 			</tr> -->
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.sitevist.workers']}" toggleable="true" id="pnlWorker">
		<table class="customTbl">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.total']}" /></td>
				<td><p:inputText id="ttlWrkId" readonly="true" value="#{svoSiteVisitBackingBean.managedBean.totalWorker}" />person(s)</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.bumi']}" /></td>
				<td><p:inputText id="wrkBumiId" readonly="true" value="#{svoSiteVisitBackingBean.managedBean.wrkBumi}" />person(s)</td>
				<td><p:inputText id="wrkBumiPercId" readonly="true" value="#{svoSiteVisitBackingBean.calculateWorkerPercentage(svoSiteVisitBackingBean.managedBean.wrkBumi)}"/>%</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.composition.nonBumi']}" /></td>
				<td><p:inputText id="wrkNonBumiId" readonly="true" value="#{svoSiteVisitBackingBean.managedBean.wrkNonBumi}" />person(s)</td>
				<td><p:inputText id="wrkNonBumiPercId" readonly="true" value="#{svoSiteVisitBackingBean.calculateWorkerPercentage(svoSiteVisitBackingBean.managedBean.wrkNonBumi)}"/>%</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.composition.Frg']}" /></td>
				<td><p:inputText id="wrkNonMalaysianId" readonly="true" value="#{svoSiteVisitBackingBean.managedBean.wrkNonMalaysian}" />person(s)</td>
				<td><p:inputText id="wrkNonMalaysianPercId" readonly="true" value="#{svoSiteVisitBackingBean.calculateWorkerPercentage(svoSiteVisitBackingBean.managedBean.wrkNonMalaysian)}"/>%</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
