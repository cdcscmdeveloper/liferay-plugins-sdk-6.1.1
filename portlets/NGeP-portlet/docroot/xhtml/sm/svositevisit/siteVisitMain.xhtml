<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_MOFApplication_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.site.visit']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		<!-- Please do not remove, it's used to solve the primefaces's fileupload JS problem -->
		<p:panel visible="false">
			<p:fileUpload></p:fileUpload>
		</p:panel>
		<ui:param name="supplierName" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.smSupplier.companyName}" />
		<ui:param name="applNo" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.applNo}" />
		<ui:param name="applType" value="#{svoSiteVisitBackingBean.getsupplierApplTypeDesc(svoSiteVisitBackingBean.managedBean.smSvTask.smAppl.applType)}" />
<!-- 		<ui:include src="/xhtml/sm/svositevisit/siteVisitHeader.xhtml" /> -->
		<ui:include src="/xhtml/sm/shared/common/commonHeader.xhtml" />
		<!-- 		<ui:include src="/xhtml/sm/shared/sidemenu/svoSideMenu.xhtml" /> -->
		<ui:param name="viewFlag" value="false" />
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<table class="customTbl">
			<tr valign="top">
				<td class="sidemenutd" style="width:20%"><ui:include
						src="/xhtml/sm/shared/sidemenu/svoSideMenu.xhtml" /></td>

				<td  style="width:80%" align="left"><p:outputPanel id="pnlDisplay">
					<p:messages id="messages" showDetail="true" autoUpdate="#{empty param['disableMsgAutoUpdate']}" closable="true" showSummary="false" />
					<div align="right">
						<p:commandButton value="#{lbl['lbl.btn.save']}" action="#{svoSiteVisitBackingBean.saveSiteVisitReport('')}" 
						disabled="#{!svoSiteVisitBackingBean.managedBean.claimTask}">
						</p:commandButton>

						<p:commandButton value="#{lbl['lbl.btn.submit']}" id="btnBpmSubmit" action="#{svoSiteVisitBackingBean.submitDialogShow}" 
							rendered="#{svoSiteVisitBackingBean.managedBean.activeIndex == svoSiteVisitBackingBean.managedBean.lastIndex}" 
							disabled="#{!svoSiteVisitBackingBean.managedBean.claimTask}">
							<f:param name="disableValidation" value="true" />
						</p:commandButton>
						
						<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}" action="#{svoSiteVisitBackingBean.onClickClaimButton}" update="@form" process="@this"
							rendered="#{!svoSiteVisitBackingBean.managedBean.claimTask}" onclick="blockWidget.show()" oncomplete="blockWidget.hide()">
							<f:param name="taskId" value="#{svoSiteVisitBackingBean.managedBean.taskId}" />
						</p:commandButton>
						
					</div>
					<ui:param name="template" value="#{svoSiteVisitBackingBean.managedBean.indexPageMap[svoSiteVisitBackingBean.managedBean.activeIndex]}" />
						<c:if test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 0}">
							<ui:include src="/xhtml/sm/svositevisit/siteVisitCommonInfo.xhtml" />
						</c:if>

						<c:if test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 1}">
							<ui:include src="/xhtml/sm/svositevisit/commonFinancialInfo.xhtml" />
						</c:if>

						<c:if test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 2}">
							<ui:include src="/xhtml/sm/svositevisit/categoryApplicable.xhtml" />
						</c:if>

						<c:if test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 3}">
							<ui:include src="/xhtml/sm/svositevisit/officeLocation.xhtml" />
						</c:if>

						<c:if test="#{template.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_TRANSPORTATION}">
							<ui:include src="/xhtml/sm/svositevisit/transportation.xhtml" />
						</c:if>

						<c:if test="#{template.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_WORKSHOP}">
							<ui:include src="/xhtml/sm/svositevisit/workshop.xhtml" />
						</c:if>

						<c:if test="#{template.pmParameter.parameterCode  == SupplierManagementConst.CAT_TYPE_INSURANCE}">
							<ui:include src="/xhtml/sm/svositevisit/insurance.xhtml" />
						</c:if>

						<c:if test="#{template.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_DOCKYARD}">
							<ui:include src="/xhtml/sm/svositevisit/dockyard.xhtml" />
						</c:if>

						<c:if test="#{template.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_MANUFACTURING}">
							<ui:include src="/xhtml/sm/svositevisit/manufacturing.xhtml" />
						</c:if>

						<c:if test="#{template.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_PRINTING}">
							<ui:include src="/xhtml/sm/svositevisit/printing.xhtml" />
						</c:if>

						<c:if test="#{template.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_TRAVEL}">
							<ui:include src="/xhtml/sm/svositevisit/travel.xhtml" />
						</c:if>
						
						<c:if test="#{template.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_BUMIPUTERA}">
							<ui:include src="/xhtml/sm/svositevisit/bumiputera.xhtml" />
						</c:if>

						<c:if test="#{template.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_READING_MATERIAL_FROM_OVERSEA}">
							<ui:include src="/xhtml/sm/svositevisit/overseaReadingMaterial.xhtml" />
						</c:if>
						
						<c:if test="#{svoSiteVisitBackingBean.managedBean.activeIndex == svoSiteVisitBackingBean.managedBean.lastIndex}">
							<ui:include src="/xhtml/sm/svositevisit/reportPreview.xhtml" />
						</c:if>
						
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
