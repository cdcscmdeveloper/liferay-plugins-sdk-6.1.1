<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<f:event listener="#{svoSiteVisitBackingBean.preRenderView}" type="preRenderView" />
		<ui:include src="/xhtml/sm/svositevisit/siteVisitHeader.xhtml" />
		<!-- 		<ui:include src="/xhtml/sm/shared/sidemenu/svoSideMenu.xhtml" /> -->


		<table class="customTbl">
			<tr valign="top">
				<td style="width:20%"><ui:include
						src="/xhtml/sm/shared/sidemenu/svoSideMenu.xhtml" /></td>

				<td  style="width:80%"><p:outputPanel id="pnlDisplay">
						<c:if
							test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 0}">
							<ui:include src="/xhtml/sm/svositevisit/siteVisitCommonInfo.xhtml" />
						</c:if>

<!-- 						<c:if -->
<!-- 							test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 1}"> -->
<!-- 							<ui:include src="/xhtml/sm/svositevisit/siteVisitRptCommon.xhtml" /> -->
<!-- 						</c:if> -->

						<c:if
							test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 1}">
							<ui:include src="/xhtml/sm/svositevisit/commonFinancialInfo.xhtml" />
						</c:if>

						<c:if
							test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 2}">
							<ui:include src="/xhtml/sm/svositevisit/categoryApplicable.xhtml" />
						</c:if>

						<c:if
							test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 3}">
							<ui:include src="/xhtml/sm/svositevisit/commentRecommendation.xhtml" />
						</c:if>

						<c:if
							test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 11}">
							<ui:include src="/xhtml/sm/svositevisit/transportation.xhtml" />
						</c:if>

						<c:if
							test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 12}">
							<ui:include src="/xhtml/sm/svositevisit/workshop.xhtml" />
						</c:if>


						<c:if
							test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 13}">
							<ui:include src="/xhtml/sm/svositevisit/insurance.xhtml" />
						</c:if>

						<c:if
							test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 14}">
							<ui:include src="/xhtml/sm/svositevisit/dockyard.xhtml" />
						</c:if>

						<c:if
							test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 15}">
							<ui:include src="/xhtml/sm/svositevisit/manufacturing.xhtml" />
						</c:if>

						<c:if
							test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 16}">
							<ui:include src="/xhtml/sm/svositevisit/printing.xhtml" />
						</c:if>

						<c:if
							test="#{svoSiteVisitBackingBean.managedBean.activeIndex == 17}">
							<ui:include src="/xhtml/sm/svositevisit/travel.xhtml" />
						</c:if>
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
