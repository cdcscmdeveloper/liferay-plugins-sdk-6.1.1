<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Supplier Info" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="MOF Registration No." /></td>
				<td class="tdContent"><p:inputText value="Demo" disabled="true"
						size="40" /></td>

				<td class="tdTitle"><p:outputLabel value="Supplier Name" /></td>
				<td class="tdContent"><p:inputText
						value="#{svoSiteVisitBackingBean.managedBean.smApplSv.smAppl.smSupplier.companyName}"
						disabled="true" size="40" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="Application No." /></td>
				<td class="tdContent"><p:inputText value="Demo" disabled="true"
						size="40" /></td>

				<td class="tdTitle"><p:outputLabel value="Application Type" /></td>
				<td class="tdContent"><p:inputText value="Demo" disabled="true"
						size="40" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="Area" /></td>
				<td class="tdContent"><p:inputText value="Lembah Klang"
						disabled="true" size="40" /></td>

				<td class="tdTitle"><p:outputLabel value="Processing Officer" /></td>
				<td class="tdContent"><p:inputText value="Demo" disabled="true"
						size="40" /></td>
			</tr>
		</table>
	</p:panel>

	<!-- 	<p:panel header="Site(s)" toggleable="true"> -->
	<!-- 		<table align="left"> -->

	<!-- 		</table> -->
	<!-- 	</p:panel> -->

	<p:panel header="Site Visit Details" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="Site" /></td>
				<td class="tdContent" colspan="3"><p:selectOneMenu>
						<f:selectItems
							value="#{svoSiteVisitBackingBean.managedBean.smApplSv.smSiteVisitAddresses}"
							var="c" itemLabel="#{c.smAddress.address1}"
							itemValue="#{c.smAddress.address1}" />
					</p:selectOneMenu>
					<p:commandButton value="Download Template" /></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="Address" /></td>
				<td class="tdContent" colspan="3"><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent" colspan="3"><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent" colspan="3"><p:inputText disabled="true" size="50" /></td>

			</tr>
			<tr>
				<td class="tdTitle"></td>
				<td class="tdContent" colspan="3"><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel value="Postcode" /></td>
				<td class="tdContent" ><p:inputText disabled="true" size="40" /></td>

				<td class="tdTitle"><p:outputLabel value="City" /></td>
				<td class="tdContent"><p:inputText disabled="true" size="40" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="District" /></td>
				<td class="tdContent"><p:inputText disabled="true" size="40" /></td>

				<td class="tdTitle"><p:outputLabel value="State" /></td>
				<td class="tdContent"><p:inputText disabled="true" size="40" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="County" /></td>
				<td class="tdContent" colspan="3"><p:inputText disabled="true" size="40" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
