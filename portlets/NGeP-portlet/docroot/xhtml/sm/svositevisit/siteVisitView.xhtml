<!-- #28175 start -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:ui="http://java.sun.com/jsf/facelets" 
	xmlns:p="http://primefaces.org/ui" 
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc" 
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
<!-- #28175 end -->

	<ui:include src="/xhtml/sm/svositevisit/siteVisitOfficer.xhtml"></ui:include>

	<p:panel header="#{lbl['lbl.sm.sitevisit.visiting.category']}" toggleable="true">
		<p:dataTable var="cTask"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}">
				<ui:param name="lblCategoryDesc"
					value="lbl.sm.sitevisit.category.categorycode_#{cTask.smSvTemplate.pmParameter.parameterCode}" />
				#{lbl[lblCategoryDesc]}
			</p:column>


			<p:column headerText="#{lbl['lbl.sm.rptpreview.template']}">
				<!-- 32963 -->
				<!-- #34166 - Start -->
				<p:commandButton style="display:none;" id="buttonToClick" binding="#{button}" value="#{lbl['lbl.btn.download']}" ajax="false"
					action="#{svoSiteVisitBackingBean.downloadSiteVisitTemplate(cTask,true)}">
					<p:fileDownload value="#{svoSiteVisitBackingBean.file}" />
				</p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.download']}" action="#{svoSiteVisitBackingBean.validateBeforeDownloadSVReport(button.clientId, cTask, false)}" ajax="true" process="@this" update="buttonToClick"/>
				<!-- #34166 - End  -->
			</p:column>

		</p:dataTable>

		<br />
		<!-- 28775 - Site Visit Grouping Enhancement - 28775 - start -->
		<p:dataTable var="tmp" value="#{svoSiteVisitBackingBean.managedBean.templates}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<!-- #37605 -->
			<p:column headerText="#{lbl['lbl.sm.category.description']}" style="white-space: normal; width: 88%;">
				<!-- #28175 start -->
				<h:outputText value="#{svoSiteVisitBackingBean.getTemplateCategoryCode(tmp)}" />
				<!-- #28175 end -->
				<h:outputText value="  (#{tmp.suppCategory.otherDesc})" rendered="#{tmp.suppCategory.otherDesc != null}" />
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.rptpreview.actual.site.visit.date']}">
		<table class="customTbl">
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.rptpreview.actual.site.visit.date']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<p:calendar showOn="button" id="actualSvDate" required="true"
						label="#{lbl['lbl.sm.rptpreview.actual.site.visit.date']}"
						maxdate="#{CommonConstants.CURRENT_DATE}" readonlyInput="true"
						value="#{svoSiteVisitBackingBean.managedBean.smSvTask.actualVisitDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" 
						disabled="#{viewFlag}"/>
				</td>
				<td class="tdTitle" /><td class="tdContent" />
			</tr>
		</table>
	</p:panel>
	<!-- 28775 - Site Visit Grouping Enhancement - 28775 - end -->
	
	<p:panel header="#{lbl['lbl.sm.sitevist.address']}" toggleable="true">
		<script>
			function getAddress(addr1, addr2, addr3, cityName,
					districtName, stateName, countryName) {

				var address = addr1 + ',' + addr2 + ',' + addr3 + ',' + cityName + ','
						+ districtName + ',' + stateName + ',' + countryName;

				return address;
			}
		</script>
		<!-- 28775 - Site Visit Grouping Enhancement - 28775 - start -->
		<p:dataTable var="task"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			
			<p:column headerText="#{lbl['lbl.sm.facility.facilityType']}">
				<h:outputText 
				value="#{task.smSvAddress.facilityType}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.address']}">
				<h:outputText value="#{svoSiteVisitBackingBean.getSMFullAddress(task.smSvAddress.address)}"
					escape="false" style="float : left" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.latitude.longitude']}">			
				<ac:gmap id="gmap" disabled="#{viewFlag}"
					locationName="#{task.smAppl.smCompanyBasic.companyName}"
					latitude="#{task.smSvAddress.address.mapLatitude}" 
					longitude="#{task.smSvAddress.address.mapLongitude}" 
					address="getAddress('#{task.smSvAddress.address.address1}','#{task.smSvAddress.address.address2}','#{task.smSvAddress.address.address3}',
					'#{task.smSvAddress.address.pmCity.cityName}','#{task.smSvAddress.address.pmDistrict.districtName}','#{task.smSvAddress.address.pmState.stateName}',
					'#{task.smSvAddress.address.pmCountry.countryName}')" />
			</p:column>
			
			<p:column
				headerText="#{lbl['lbl.sm.siteassign.expected.visiting.date']}">
				<h:outputText value="#{task.scheduleDate}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		<!-- 28775 - Site Visit Grouping Enhancement - 28775 - end -->
		<c:choose>
			<c:when test="#{!viewFlag}">
				<ui:include src="/xhtml/sm/shared/sitevisit/addressRepresentatives.xhtml" />
			</c:when>
				
			<c:otherwise>
				<ui:include src="/xhtml/sm/shared/sitevisit/view_addressRepresentatives.xhtml" />
			</c:otherwise>
		</c:choose>
	</p:panel>
</ui:composition>
