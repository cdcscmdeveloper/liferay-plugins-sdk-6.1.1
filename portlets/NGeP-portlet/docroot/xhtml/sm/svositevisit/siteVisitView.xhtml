<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel header="#{lbl['lbl.sm.category']}" toggleable="true">
		<p:dataTable var="cTask"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}">
				<ui:param name="lblCategoryDesc"
					value="lbl.sm.sitevisit.category.categorycode_#{cTask.smSvTemplate.pmParameter.parameterCode}" />
				#{lbl[lblCategoryDesc]}
			</p:column>


			<p:column headerText="#{lbl['lbl.sm.rptpreview.template']}">
				<p:commandButton value="#{lbl['lbl.btn.download']}" ajax="false"
					action="#{svoSiteVisitBackingBean.downloadSiteVisitTemplate(cTask,false)}">
					<p:fileDownload value="#{svoSiteVisitBackingBean.file}" />
				</p:commandButton>
			</p:column>

		</p:dataTable>

		<br />
		<p:dataTable var="cat"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvCategories}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:column headerText="#{lbl['lbl.sm.category.description']}">
				#{cat.pmCategoryL1.categoryL1Code}#{cat.pmCategoryL2.categoryL2Code}#{cat.pmCategoryL3.categoryL3Code}
				:
				#{cat.pmCategoryL3.categoryName}
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.sitevist.address']}" toggleable="true">
		<p:dataTable var="svTask"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			
			<p:column headerText="#{lbl['lbl.sm.facility.facilityType']}">
				<h:outputText  value="#{svoSiteVisitBackingBean.getParameterDesc(ParameterTypeConst.supplierFacilityType, svTask.smSvAddress.smAddress.smFacilities[0].facilityType)}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.address']}"
				style="width: 50%;white-space: normal;">
				<h:outputText
					value="#{svoSiteVisitBackingBean.getSMFullAddress(svTask.smSvAddress.smAddress)}"
					escape="false" style="float : left" />
			</p:column>


			<p:column
				headerText="#{lbl['lbl.sm.siteassign.expected.visiting.date']}">
				<h:outputText value="#{svTask.scheduleDate}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>

		</p:dataTable>
	</p:panel>
</ui:composition>
