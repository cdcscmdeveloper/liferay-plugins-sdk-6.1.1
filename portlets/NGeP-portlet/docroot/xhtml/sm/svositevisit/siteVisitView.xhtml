<!-- #28175 start -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:ui="http://java.sun.com/jsf/facelets" 
	xmlns:p="http://primefaces.org/ui" 
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc" 
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
<!-- #28175 end -->

	<ui:include src="/xhtml/sm/svositevisit/siteVisitOfficer.xhtml"></ui:include>

	<p:panel header="#{lbl['lbl.sm.sitevisit.visiting.category']}" toggleable="true">
		<p:dataTable var="cTask"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}">
				<ui:param name="lblCategoryDesc"
					value="lbl.sm.sitevisit.category.categorycode_#{cTask.smSvTemplate.pmParameter.parameterCode}" />
				#{lbl[lblCategoryDesc]}
			</p:column>


			<p:column headerText="#{lbl['lbl.sm.rptpreview.template']}">
				<p:commandButton value="#{lbl['lbl.btn.download']}" ajax="false"
					action="#{svoSiteVisitBackingBean.downloadSiteVisitTemplate(cTask,true)}">
					<p:fileDownload value="#{svoSiteVisitBackingBean.file}" />
				</p:commandButton>
			</p:column>

		</p:dataTable>

		<br />
		<!-- 28775 - Site Visit Grouping Enhancement - 28775 - start -->
		<p:dataTable var="tmp" value="#{svoSiteVisitBackingBean.managedBean.templates}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			<!-- #28175 start -->
			<c:choose>
				<c:when
					test="#{fn:containsIgnoreCase(requestScope['javax.servlet.forward.request_uri'], 'application-history') or 
					fn:containsIgnoreCase(requestScope['javax.servlet.forward.request_uri'], 'supplier-application-search')}">
					<p:column headerText="#{lbl['lbl.sm.category.description']}">
						<h:outputText value="#{tmp.suppCategory.pmCategoryL1.categoryL1Code}#{tmp.suppCategory.pmCategoryL2.categoryL2Code}#{tmp.suppCategory.pmCategoryL3.categoryL3Code}
				 			- #{tmp.suppCategory.categoryL1Name} / #{tmp.suppCategory.categoryL2Name}"/><br/>
						<h:outputText value="/ #{tmp.suppCategory.categoryL3Name}"/>
						<h:outputText value="  (#{tmp.suppCategory.otherDesc})" rendered="#{tmp.suppCategory.otherDesc != null}"/>
					</p:column>
				</c:when>
				<c:otherwise>
					<p:column headerText="#{lbl['lbl.sm.category.description']}">
						<h:outputText value="#{tmp.suppCategory.pmCategoryL1.categoryL1Code}#{tmp.suppCategory.pmCategoryL2.categoryL2Code}#{tmp.suppCategory.pmCategoryL3.categoryL3Code}
				 			- #{tmp.suppCategory.categoryL1Name} / #{tmp.suppCategory.categoryL2Name}"/><br/>
						<h:outputText value="/ #{tmp.suppCategory.categoryL3Name}"/>
						<h:outputText value="  (#{tmp.suppCategory.otherDesc})" rendered="#{tmp.suppCategory.otherDesc != null}"/>
					</p:column>
				</c:otherwise>
			</c:choose>
			<!-- #28175 end -->
		</p:dataTable>
	</p:panel>

	<p:panel header="#{lbl['lbl.sm.rptpreview.actual.site.visit.date']}">
		<table class="customTbl">
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.sm.rptpreview.actual.site.visit.date']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<p:calendar showOn="button" id="actualSvDate" required="true"
						label="#{lbl['lbl.sm.rptpreview.actual.site.visit.date']}"
						maxdate="#{CommonConstants.CURRENT_DATE}" readonlyInput="true"
						value="#{svoSiteVisitBackingBean.managedBean.smSvTask.actualVisitDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" 
						disabled="#{viewFlag}"/>
					<ac:smFieldChangeAlertSVO
						isShow="#{not empty svoSiteVisitBackingBean.managedBean.smSvtaskSVO}"
						oriValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.actualVisitDate}" 
						currValue="#{svoSiteVisitBackingBean.managedBean.smSvTask.actualVisitDate}" 
						alertValue="#{svoSiteVisitBackingBean.managedBean.smSvtaskSVO.actualVisitDate}"/>
				</td>
				<td class="tdTitle" /><td class="tdContent" />
			</tr>
		</table>
	</p:panel>
	<!-- 28775 - Site Visit Grouping Enhancement - 28775 - end -->
	
	<p:panel header="#{lbl['lbl.sm.sitevist.address']}" toggleable="true">
		<script>
			function getAddress(addr1, addr2, addr3, cityName,
					districtName, stateName, countryName) {

				var address = addr1 + ',' + addr2 + ',' + addr3 + ',' + cityName + ','
						+ districtName + ',' + stateName + ',' + countryName;

				return address;
			}
		</script>
	
		<p:dataTable var="svTask"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			
			<p:column headerText="#{lbl['lbl.sm.facility.facilityType']}">
				<h:outputText 
				value="#{svTask.smSvAddress.facilityType}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.address']}">
				<h:outputText value="#{svoSiteVisitBackingBean.getSMFullAddress(svTask.smSvAddress.address)}"
					escape="false" style="float : left" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.latitude.longitude']}">
				<ui:remove><table>
					<tr>
						<td style="border-style: none !important;"><p:outputLabel value="#{lbl['lbl.sm.latitude']}" style="float:left"
							styleClass="outputLabel-view-label" /></td>
						<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view" style="float:left"
							value="#{svTask.smSvAddress.address.mapLatitude}" /></td>
					</tr>
		
					<tr>
						<td style="border-style: none !important;"><p:outputLabel value="#{lbl['lbl.sm.longitude']}" style="float:left"
							styleClass="outputLabel-view-label" /></td>
						<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view" style="float:left"
							value="#{svTask.smSvAddress.address.mapLongitude}" /></td>
					</tr>
				</table>
				</ui:remove>
			
				<ac:gmap id="gmap" disabled="#{viewFlag}"
					locationName="#{svTask.smAppl.smCompanyBasic.companyName}"
					latitude="#{svTask.smSvAddress.address.mapLatitude}" 
					longitude="#{svTask.smSvAddress.address.mapLongitude}" 
					address="getAddress('#{svTask.smSvAddress.address.address1}','#{svTask.smSvAddress.address.address2}','#{svTask.smSvAddress.address.address3}',
					'#{svTask.smSvAddress.address.pmCity.cityName}','#{svTask.smSvAddress.address.pmDistrict.districtName}','#{svTask.smSvAddress.address.pmState.stateName}',
					'#{svTask.smSvAddress.address.pmCountry.countryName}')" />
			</p:column>
			
			<p:column
				headerText="#{lbl['lbl.sm.siteassign.expected.visiting.date']}">
				<h:outputText value="#{svTask.scheduleDate}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		
		<c:choose>
			<c:when test="#{!viewFlag}">
				<ui:include src="/xhtml/sm/shared/sitevisit/addressRepresentatives.xhtml" />
			</c:when>
				
			<c:otherwise>
				<ui:include src="/xhtml/sm/shared/sitevisit/view_addressRepresentatives.xhtml" />
			</c:otherwise>
		</c:choose>
	</p:panel>
</ui:composition>
