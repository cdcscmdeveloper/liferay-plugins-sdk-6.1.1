<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="content">
		<h:outputLabel value="Approval Decision"
			style="font-weight:bold;font-size:15px;" />
		<p:panel header="Application Information">
			<table class="test">
				<tr>
					<td id="tdTitle"><p:outputLabel value="Supplier Name" /></td>
					<td id="tdContent"><p:inputText /></td>
					<td id="tdTitle"><p:outputLabel value="Date Applied" /></td>
					<td id="tdContent"><p:inputText /></td>
				</tr>

				<tr>
					<td id="tdTitle"><p:outputLabel
							value="Site Visit Performed By" /></td>
					<td id="tdContent"><p:inputText /></td>
					<td id="tdTitle"><p:outputLabel value="Current Status" /></td>
					<td id="tdContent"><p:inputText /></td>
				</tr>

				<tr>
					<td id="tdTitle"><p:outputLabel value="Submitted by PO on" /></td>
					<td id="tdContent"><p:inputText /></td>
					<td id="tdTitle"><p:outputLabel value="PO Recommendation" /></td>
					<td id="tdContent"><p:selectOneMenu>
							<f:selectItem itemLabel="Select" itemValue="" />
							<f:selectItem itemLabel="Approve" itemValue="apv" />
							<f:selectItem itemLabel="Reject" itemValue="rjt" />
						</p:selectOneMenu></td>
				</tr>


				<tr>
					<td id="tdTitle"><p:outputLabel value="PO Remarks" /></td>
					<td id="tdContent" colspan="3"><p:inputTextarea rows="5"
							cols="100" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="Site Visit Report">
			<p:dataTable var="svrLs"
				value="#{svoSiteVisitBackingBean.managedBean.svReportList}">

				<p:column headerText="Site ID">
					<p:outputLabel value="#{svrLs.siteID}" />
				</p:column>
				<p:column headerText="Category">
					<p:outputLabel value="#{svrLs.category}" />
				</p:column>
				<p:column headerText="Status">
					<p:outputLabel value="#{svrLs.currStatus}" />
				</p:column>

				<p:column headerText="Upload Date">
					<p:outputLabel value="#{svrLs.uploadDate}" />
				</p:column>
				<p:column headerText="Action">
					<p:commandButton id="modalDialogButton" value="View Report"
						onclick="dlg2.show();" type="button" />
					<p:dialog id="modalDialog" header="Site Visit Report"
						widgetVar="dlg2" modal="true" height="500" width="1000">
						<ui:include
							src="/xhtml/sm/svositevisit/siteVisitReportReview.xhtml" />
					</p:dialog>
				</p:column>
			</p:dataTable>
		</p:panel>

		<!-- 
		<p:lightBox minHeight="500">
			<h:outputLink value="#">
				<h:outputText value="Open Lightbox Popup (using inline)" />
			</h:outputLink>
			<f:facet name="inline">
				<ui:include src="/xhtml/sm/svositevisit/siteVisitReportReview.xhtml" />
			</f:facet>
			<h:outputLink />
		</p:lightBox> -->

		<!-- <p:commandButton id="modalDialogButton" value="View Report"
			onclick="dlg2.show();" type="button" />
		<p:dialog id="modalDialog" header="Site Visit Report" widgetVar="dlg2"
			modal="true" height="500" width="1000">
			<ui:include src="/xhtml/sm/svositevisit/siteVisitReportReview.xhtml" />
		</p:dialog> -->

		<p:panel header="Decision">
			<table class="test">
				<!-- 
				<tr>
					<td id="tdTitle"><p:outputLabel value="Decision" /></td>
					<td id="tdContent"><p:selectOneMenu>
							<f:selectItem itemLabel="Select" itemValue="" />
							<f:selectItem itemLabel="Approve" itemValue="apv" />
							<f:selectItem itemLabel="Reject" itemValue="rjt" />
						</p:selectOneMenu></td>
				</tr> -->

				<tr>
					<td id="tdTitle"><p:outputLabel value="Remarks" /></td>
					<td id="tdContent" colspan="3"><p:inputTextarea rows="5"
							cols="100" /></td>
				</tr>
			</table>
		</p:panel>
		<div align="right">
			<p:splitButton value="Select">
				<p:menuitem value="Approve" />
				<p:menuitem value="Reject" />
			</p:splitButton>
		</div>
	</ui:define>

</ui:composition>
