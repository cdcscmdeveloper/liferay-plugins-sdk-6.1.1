<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Site Visit Info" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel value="MOF Registration No." /></td>
				<td class="tdContent"><p:inputText value="Demo" disabled="true"
						size="40" /></td>

				<td class="tdTitle"><p:outputLabel value="Supplier Name" /></td>
				<td class="tdContent"><p:inputText
						value="#{svoSiteVisitBackingBean.managedBean.smApplSv.smAppl.smSupplier.companyName}"
						disabled="true" size="40" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="Application No." /></td>
				<td class="tdContent"><p:inputText value="Demo" disabled="true"
						size="40" /></td>

				<td class="tdTitle"><p:outputLabel value="Application Type" /></td>
				<td class="tdContent"><p:inputText value="Demo" disabled="true"
						size="40" /></td>
			</tr>

			<tr>
				<td class="tdTitle"><p:outputLabel value="Area" /></td>
				<td class="tdContent"><p:inputText value="Lembah Klang"
						disabled="true" size="40" /></td>

				<td class="tdTitle"><p:outputLabel value="Processing Officer" /></td>
				<td class="tdContent"><p:inputText value="Demo" disabled="true"
						size="40" /></td>
			</tr>
		</table>
		<p:separator />
	</p:panel>
</ui:composition>
