<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:remove>
	<div align="right">
		<p:commandButton value="Test" action="#{svoSiteVisitBackingBean.test}" />
	</div>
	</ui:remove>
	
	<p:panel header="Financial" toggleable="true">
		<table class="rptTbl">
			<tr>
				<td><p:outputLabel value="Cheque Signatories" /></td>
				<td><p:inputText disabled="true" value="#{svoSiteVisitBackingBean.managedBean.totalCheqSign}" /> person(s)</td>
			</tr>

			<tr>
				<td><p:outputLabel value="Bumiputera" /></td>
				<td><p:inputText disabled="true" value="#{svoSiteVisitBackingBean.managedBean.cheqBumi}" /></td>
				<td><p:inputText disabled="true" value="#{svoSiteVisitBackingBean.calculatChequeSignatoryPercentage(svoSiteVisitBackingBean.managedBean.cheqBumi)}" /> %</td>
			</tr>

			<tr>
				<td><p:outputLabel value="Non-Bumiputera" /></td>
				<td><p:inputText disabled="true" value="#{svoSiteVisitBackingBean.managedBean.cheqNonBumi}" /></td>
				<td><p:inputText disabled="true" value="#{svoSiteVisitBackingBean.calculatChequeSignatoryPercentage(svoSiteVisitBackingBean.managedBean.cheqNonBumi)}" /> %</td>
			</tr>

			<tr>
				<td><p:outputLabel value="Non-Malaysian" /></td>
				<td><p:inputText disabled="true" value="#{svoSiteVisitBackingBean.managedBean.cheqNonMalaysian}" /></td>
				<td><p:inputText disabled="true" value="#{svoSiteVisitBackingBean.calculatChequeSignatoryPercentage(svoSiteVisitBackingBean.managedBean.cheqNonMalaysian)}" /> %</td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="Bank Information" toggleable="true">
		<p:dataTable var="bankInfo" value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvBankInfos}" style="width:80%">
			<p:column>
				<f:facet name="header">Bank Name</f:facet>
				#{bankInfo.smSupplierBank.pmFinancialOrg.finOrgName}
			</p:column>

			<p:column>
				<f:facet name="header">Account No.</f:facet>
				#{bankInfo.smSupplierBank.accountNo}
			</p:column>

			<p:column>
				<f:facet name="header">Cheque Signatory Name</f:facet>
				<ui:repeat var="cheqSign" value="#{bankInfo.smSupplierBank.smChequeSignatories}" >
					#{cheqSign.smPersonnel.name}<br/>
				</ui:repeat>
			</p:column>

			<p:column>
				<f:facet name="header">Terms and Conditions</f:facet>
				<p:inputTextarea rows="4" cols="35" autoResize="false" value="#{bankInfo.smSupplierBank.signatureInstruction}" readonly="true"/>
			</p:column>
			
			<p:column>
				<f:facet name="header">Verify</f:facet>
				<p:selectBooleanCheckbox value="#{bankInfo.valid}" disabled="#{viewFlag}"></p:selectBooleanCheckbox>
			</p:column>
		</p:dataTable>
	</p:panel>
	
	
	
<!-- this.getManagedBean().getSmSvTask().getSmAppl().getSmSupplierBanks().get(0).getPmFinancialOrg().getFinOrgName() -->


	<p:panel header="Check List" toggleable="true">
		<p:dataTable var="finLsItem"
			value="#{svoSiteVisitBackingBean.managedBean.smSvTask.smSvFinChecklists}"
			rowIndexVar="rowIndex" style="width:80%">

			<p:column headerText="Items">
				#{finLsItem.pmParameter.pmParameterDescs[0].codeName}
			</p:column>

			<p:column headerText="Available">
				<p:selectBooleanCheckbox value="#{finLsItem.valid}" disabled="#{viewFlag}">

				</p:selectBooleanCheckbox>
			</p:column>

			<p:column headerText="Remark">
				<p:inputTextarea rows="2" cols="40" autoResize="false" disabled="#{viewFlag}"
					value="#{svoSiteVisitBackingBean.managedBean.remarkMap[finLsItem.pmParameter.parameterId].remark}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
