<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:param name="viewFlag" value="true" />
	
	<p:dialog widgetVar="submissionConfirmDlg" modal="true" height="100" width="500">
   			 #{lbl['lbl.sm.rptpreview.want.proceed.qmark']}	
   			<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.yes']}"
				action="#{svoSiteVisitBackingBean.saveSiteVisitReport(SupplierManagementConst.BPM_SUBMIT)}"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="submissionConfirmDlg.hide();"></p:commandButton>
		</div>
	</p:dialog>
	
	<p:dialog widgetVar="attachmentDeleteDlg" id="attachmentDeleteDlg" modal="true" height="100" width="500">
   			 #{svoSiteVisitBackingBean.managedBean.attachmentDeleteMsg}
   			<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" oncomplete="attachmentDeleteDlg.hide()"
				action="#{svoSiteVisitBackingBean.removeUploadedSvFile}" update="@([id$=dtlTemplate])"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="attachmentDeleteDlg.hide();"></p:commandButton>
		</div>
	</p:dialog>
	
	
<!-- 	<ui:include src="/xhtml/sm/svositevisit/categoryApplicable.xhtml" /> -->
	<p:panel header="#{lbl['lbl.sm.rptpreview.by.category']}" toggleable="true">
		<p:dataTable emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" id="dtlTemplate"
		value="#{svoSiteVisitBackingBean.managedBean.smSvTask}" var="svTask">
			<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}">
				#{svoSiteVisitBackingBean.getParameterDesc(svTask.smSvTemplate.pmParameter)}
			</p:column>
	
			<p:column headerText="#{lbl['lbl.sm.rptpreview.template']}">
				<p:commandButton value="#{lbl['lbl.sm.button.preview']}" update=":form:rptDialogId" oncomplete="rptDlg.show();" id="btnPreview" action="#{svoSiteVisitBackingBean.rptPreview(svTask.smSvTemplate)}" />
			</p:column>
			
			<ui:remove>
			<p:column>
				<p:commandButton value="#{lbl['lbl.btn.upload']}" onclick="uploadDlg.show();" actionListener="#{svoSiteVisitBackingBean.setReportUploadTemplate(template)}"></p:commandButton>
			</p:column>
			
			<p:column>
				<table>
					<ui:repeat var="attch" value="#{svoSiteVisitBackingBean.managedBean.smSvTemplateMap[template.pmParameter.parameterCode].smAttachments}">
					<p:outputPanel rendered="#{attch.recordStatusFlg == svoSiteVisitBackingBean.getRecordStatusActive()}">
					<tr>
						<td><h:outputText value="#{attch.fileName}" /></td>
						<td><p:commandLink oncomplete="attachmentDeleteDlg.show()" action="#{svoSiteVisitBackingBean.showDeleteDialog(template.pmParameter.parameterCode,attch)}" 
						update="@([id$=attachmentDeleteDlg])">
							<p:graphicImage value="/css/images/design/delete.png" title="#{lbl['lbl.btn.delete']}" />
						</p:commandLink></td>
					</tr>
					</p:outputPanel>
					</ui:repeat>
				</table>
			</p:column>
			</ui:remove>
		</p:dataTable>
	</p:panel>
	
	<p:dialog id="uploadDlg" widgetVar="uploadDlg" appendToBody="false" resizable="false" width="700px"
		height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:fileUpload style="display:inline;" multiple="true" fileUploadListener="#{svoSiteVisitBackingBean.siteVisiteReportUpload}"
			mode="basic" id="upload" sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" 
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" update="dtlTemplate" 
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			oncomplete="uploadDlg.hide();return false;">
		</p:fileUpload>
	</p:dialog>
	
	<p:dialog id="rptDialogId"  header="#{lbl['lbl.sm.rptpreview']}" widgetVar="rptDlg" modal="true" width="1158" height="500">
		<c:if test="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_DOCKYARD}">
			<ui:include src="/xhtml/sm/svositevisit/dockyard.xhtml" />
		</c:if>
		
		<c:if test="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_MANUFACTURING}">
			<ui:include src="/xhtml/sm/svositevisit/manufacturing.xhtml" />
		</c:if>
		
		<c:if test="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_WORKSHOP}">
			<ui:include src="/xhtml/sm/svositevisit/workshop.xhtml" />
		</c:if>
		
		<c:if test="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_PRINTING}">
			<ui:include src="/xhtml/sm/svositevisit/printing.xhtml" />
		</c:if>

		<c:if test="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_INSURANCE}">
			<ui:include src="/xhtml/sm/svositevisit/insurance.xhtml" />
		</c:if>
		
		<c:if test="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_TRAVEL}">
			<ui:include src="/xhtml/sm/svositevisit/travel.xhtml" />
		</c:if>
		
		<c:if test="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_BUMIPUTERA}">
			<ui:include src="/xhtml/sm/svositevisit/bumiputera.xhtml" />
		</c:if>
		
		<c:if test="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_READING_MATERIAL_FROM_OVERSEA}">
			<ui:include src="/xhtml/sm/svositevisit/overseaReadingMaterial.xhtml" />
		</c:if>
		
		<c:if test="#{svoSiteVisitBackingBean.managedBean.selectedSvTemplate.pmParameter.parameterCode == SupplierManagementConst.CAT_TYPE_TRANSPORTATION }">
			<ui:include src="/xhtml/sm/svositevisit/transportation.xhtml" />
		</c:if>							
	</p:dialog>
	
	<p:panel header="#{lbl['lbl.sm.rptpreview.actual.site.visit.date']}">
		<table class="customTbl">
				<tr>
					<td class="tdTitle">
						<p:outputLabel
							value="#{lbl['lbl.sm.rptpreview.actual.site.visit.date']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="tdContent">
						<p:calendar showOn="button" id="actualSvDate" required="#{!empty param['disableValidation']}"
							mindate="#{svoSiteVisitBackingBean.managedBean.smSvTask.createdDate}" label="#{lbl['lbl.sm.rptpreview.actual.site.visit.date']}"
							maxdate="#{CommonConstants.CURRENT_DATE}" readonlyInput="true"
							value="#{svoSiteVisitBackingBean.managedBean.smSvTask.actualVisitDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</td>
					
					<td class="tdTitle">
					</td>
					
					<td class="tdContent">
					</td>
				</tr>
		</table>
	</p:panel>
	
	<ui:include src="/xhtml/sm/shared/sitevisit/recommendation.xhtml" />
	
</ui:composition>
