<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:param name="viewFlag" value="true" />
	<p:dataTable value="#{svoSiteVisitBackingBean.managedBean.templateTaskMap.keySet().toArray()}" var="keyTemplate">
		<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}">
		<h:outputText 
			value="#{svoSiteVisitBackingBean.getParameterDesc(ParameterTypeConst.categoryType,keyTemplate)}" />
		</p:column>
	
		<p:column headerText="#{lbl['lbl.sm.address']}" style="white-space: normal;">
			<table>
				<ui:repeat var="svTask" value="#{svoSiteVisitBackingBean.managedBean.templateTaskMap[keyTemplate]}">
					<tr>
						<td><h:outputText
							value="#{svoSiteVisitBackingBean.getSMFullAddress(svTask.smSvAddress.smAddress)}"
							escape="false" style="float : left" />
						</td>
						<td>
							<p:commandButton value="view" action="#{svoSiteVisitBackingBean.selectReportTask(svTask)}" 
							update=":#{p:component('reportPanel')}" oncomplete="reportDlg.show()">
							
							</p:commandButton>
						</td>
					</tr>
				</ui:repeat>
			</table>
		</p:column>
	</p:dataTable>

	<p:dialog widgetVar="reportDlg" modal="true" height="400" width="1000">
		<p:outputPanel id="reportPanel">
			<ui:include src="/xhtml/sm/shared/sitevisit/siteVisitReportPOReview.xhtml" />
		</p:outputPanel>
	</p:dialog>


</ui:composition>
