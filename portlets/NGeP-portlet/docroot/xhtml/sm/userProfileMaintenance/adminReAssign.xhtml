<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_smDeactivateAdmin_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.userprofile.deactivate.admin']}");
		</script>
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" escape="false" severity="error"
				autoUpdate="true" closable="true" showSummary="false" />
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<p:panel id="adminVerifySection" header="#{lbl['lbl.sm.userprofile.deactivate.admin']}"
			styleClass="noBorders tr,noBorders td">
			
			<c:if test="#{not empty smPersonnelBackingBean.managedBean.noSupplierUserMsg}">
				<h:outputText styleClass="instruction" value="#{smPersonnelBackingBean.managedBean.noSupplierUserMsg}"/>
			</c:if>
			
			<p:dataTable id="smPersonnelAuthorizedNonAdminId" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{smPersonnelBackingBean.managedBean.smPersonnelList}" selection="#{smPersonnelBackingBean.managedBean.selectedPersonnelToReassign}"
				var="personnel" rowKey="#{personnel}" rowIndexVar="index" rows="10">
				<ac:paginator for="smPersonnelDataModelId" />
				
				<p:column selectionMode="single" disabledSelection="#{personnel.epRole eq 'CM_USER' or (personnel.softcertFlg ne 0 and personnel.softcertFlg ne 1)}" />

				<p:column headerText="#{lbl['lbl.sm.userprofile.name']}">
					<p:outputPanel rendered="#{personnel.epRole eq 'CM_USER'}">
						&#160;<p:graphicImage id="uidti" value="/css/images/design/tooltips.png"  />
						<p:tooltip id="uidtt" for="uidti">
							<p:outputLabel escape="false"
								value="#{lbl['tt.sm.deactivateadmin.catalogueuser.upgrade']}" />
						</p:tooltip>&#160;
					</p:outputPanel>
					<p:outputPanel rendered="#{personnel.epRole ne 'CM_USER' and (personnel.softcertFlg ne 0 and personnel.softcertFlg ne 1)}">
						&#160;<p:graphicImage id="uid2ti" value="/css/images/design/tooltips.png"  />
						<p:tooltip id="uid2tt" for="uid2ti">
							<p:outputLabel escape="false"
								value="#{lbl['tt.sm.deactivateadmin.sofcertnotissued.upgrade']}" />
						</p:tooltip>&#160;
					</p:outputPanel>
					<h:outputText value="#{personnel.name}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.userprofile.rolesincompany']}">
					<h:outputText value="#{personnel.roleName}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.userprofile.detailsicno']}">
					<h:outputText value="#{personnel.identificationNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.userprofile.nationality']}">
					<h:outputText value="#{personnel.pmCountry.countryName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.userprofile.isauthorized']}">
					<h:outputText value="#{lbl['lbl.txt.yes']}" rendered="#{personnel.authorizedFlg eq '1'}" />
					<h:outputText value="#{lbl['lbl.txt.no']}" rendered="#{personnel.authorizedFlg ne '1'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.userprofile.accountstatus']}">
					<h:outputText value="#{lbl['lbl.sm.activation.status.activated']}" rendered="#{personnel.recordStatusFlg eq '1'}" />
					<h:outputText value="#{lbl['lbl.sm.activation.status.pending']}" rendered="#{personnel.recordStatusFlg eq '8'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.userprofile.eprole']}">
					<ac:smRoleDesc backingBean="#{smPersonnelBackingBean}" roleCode="#{personnel.epRole}" />
					<h:outputText value=" (#{lbl['lbl.sm.contract.signer']})"
						rendered="#{personnel.contractSigner}" />
				</p:column>

			</p:dataTable>
			
			<p:outputPanel rendered="#{not empty smPersonnelBackingBean.managedBean.smPersonnelList and not empty smPersonnelBackingBean.managedBean.updateSmPersonnel}">
				<table style="width: 100%">
					<tr height="20"><td></td><td></td></tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.reason']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><p:inputTextarea autoResize="false" cols="41" id="reassignReasonId"
								maxlength="200" required="true" label="#{lbl['lbl.sm.reason']}"
								value="#{smPersonnelBackingBean.managedBean.updateSmPersonnel.addnlPersonnelJustification}" />
							<p:message id="reassignReasonMsg"
							for="reassignReasonId" showSummary="true" showDetail="false"
							display="icon" />
						</td>
					</tr>
				</table>
			</p:outputPanel>
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.proceed']}" action="#{smPersonnelBackingBean.confirmDeactivateAdmin}" update="@form" 
					disabled="#{not empty smPersonnelBackingBean.managedBean.noSupplierUserMsg}" />
			</div>
		</p:panel>
		
		<p:confirmDialog id="confirmDialog" closable="true"
			message="#{lbl['lbl.sm.userprofile.deactivate.confirmation']}"
			header="#{lbl['lbl.sm.userprofile.confirmation']}" severity="alert"
			widgetVar="confirmDialog">
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDialog.hide();" update="@form"
					action="#{smPersonnelBackingBean.deactivateAdmin()}" process="@this" partialSubmit="true"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDialog.hide();" />
			</div>
	
		</p:confirmDialog>
		
		<ac:smDeactivationPopup />
			
	</ui:define>
</ui:composition>
