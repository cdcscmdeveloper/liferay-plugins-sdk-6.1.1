<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<p:panel id="adminVerifySection" header="#{lbl['lbl.sm.userprofile.deactivate.admin']}"
			styleClass="noBorders tr,noBorders td">
			<table>
				<tr>
					<td style="width: 10%;"><p:outputLabel
							value="#{lbl['lbl.sm.userprofile.search.username']}" /></td>
					<td><p:selectOneMenu id="newAdminList"
							value="#{smPersonnelBackingBean.managedBean.assignAdminPersonnelId}"
							style="width: 207px; margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{smPersonnelBackingBean.managedBean.assignList}" />
						</p:selectOneMenu></td>
				</tr>
			</table>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.proceed']}" oncomplete="confirmDialog.show();" />
			</div>
		</p:panel>

		<p:dialog id="confirmDialog" header="#{lbl['lbl.sm.userprofile.confirmation']}"
			widgetVar="confirmDialog" modal="true" width="500" height="100">
			<p:panel id="dPanel" style="width:100%">
				<table>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.deactivate.confirmation']}" /></td>
					</tr>
					<tr>
						<td>
							<div align="center">
								<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDialog.hide();" action="#{smPersonnelBackingBean.deactivateAdmin()}"/>
								<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDialog.hide();" />
							</div>
						</td>
					</tr>
				</table>
			</p:panel>
		</p:dialog>
	</ui:define>
</ui:composition>
