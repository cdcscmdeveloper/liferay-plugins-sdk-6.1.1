<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:define name="contentSection">

	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" />  

	<p:panel styleClass="noBorders tr,noBorders td" style="width:100%">
		<div align="right">
			<p:commandButton value="Save" ajax="false" icon="ui-icon-save" action="#{smPersonnelBackingBean.update(smPersonnelBackingBean.managedBean.editSmPersonnel)}"/>
		</div>		
	</p:panel>

	<p:panel id="pwdUpdate" styleClass="noBorders tr,noBorders td" style="width:100%;">
		<div align="right">
			<p:commandButton value="Change Password" ajax="false" action="passwordChange.xhtml"/>
		</div>
	</p:panel>	

	<p:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
	<p:panel id="UserProfile" header="Update User" styleClass="noBorders tr,noBorders td" style="width:100%;">
		<table>
			 	<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Name" /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnel.name}" readonly="true" disabled="true" size="35" /></td>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="eP Role : " /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnel.epRole}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Nationality" /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnel.pmCountry.countryName}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>		
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Old IC/Passport No." /></td>
					<td><p:inputText readonly="true" disabled="true" size="35" /></td>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* New IC/Passport No." /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnel.identificationNo}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="DOB" /></td>
					<td><p:calendar value="#{smPersonnelBackingBean.managedBean.editSmPersonnel.birthDate}" showOn="button" id="dobDate" pattern="MM/dd/yyyy"/></td>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Designation" /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnel.designation}" size="35" /></td>
				</tr>		
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Email" /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnel.email}" size="40" /></td>

					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Phn No." /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnel.phoneNo}" size="35" /></td>
				</tr>
		</table>	
	</p:panel>
	<p:panel>
		<p:graphicImage id="imageId" height="150" width="150"/>
		<div align="center">
			<p:commandButton value="#{lbl['lbl.cm.upload']}" icon="ui-icon-upload" onclick="imageDialog.show()" />
		</div>	
	</p:panel>
	</p:panelGrid>
	<p:panel id="AddressInfo" header="Address Info" styleClass="noBorders tr,noBorders td">
	<p:panelGrid columns="2" header="Address Info" styleClass="noBorders tr,noBorders td">
		<p:panel id="PermanentAddressInfo" header="Permanent Address" styleClass="noBorders tr,noBorders td">
			<table>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Address" /></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelPermanentAddress.address1}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelPermanentAddress.address2}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelPermanentAddress.address3}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelPermanentAddress.address4}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Country" /></td>
					<td class="tdContent"><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelPermanentAddress.pmCountry.countryName}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="State" /></td>
					<td class="tdContent"><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelPermanentAddress.pmState.stateName}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="District" /></td>
					<td class="tdContent"><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelPermanentAddress.pmDistrict.districtName}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="City" /></td>
					<td class="tdContent"><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelPermanentAddress.pmCity.cityName}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Postcode" /></td>
					<td class="tdContent" ><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelPermanentAddress.postcode}" readonly="true" disabled="true" size="20" /></td>
				</tr>
			</table>
		</p:panel>
		
		<p:panel id="MailingAddressInfo" header="Mailing Address" styleClass="noBorders tr,noBorders td" style="width:100%;">
			<table>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Address" /></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelMailingAddress.address1}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelMailingAddress.address2}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelMailingAddress.address3}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelMailingAddress.address4}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Country" /></td>
					<td class="tdContent"><p:selectOneMenu value="#{smPersonnelBackingBean.managedBean.editSmPersonnelMailingAddress.pmCountry.countryId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.countryList}" />
							<p:ajax event="change" update="mailAddStateList, mailAddDistrictList, mailAddCityList"
							listener="#{smPersonnelBackingBean.updateLists(smPersonnelBackingBean.managedBean.editSmPersonnelMailingAddress.pmCountry.countryId,null,null)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="State" /></td>
					<td class="tdContent"><p:selectOneMenu id="mailAddStateList" value="#{smPersonnelBackingBean.managedBean.editSmPersonnelMailingAddress.pmState.stateId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.stateList}" />
							<p:ajax event="change" update="mailAddDistrictList, mailAddCityList"
							listener="#{smPersonnelBackingBean.updateLists(null,smPersonnelBackingBean.managedBean.editSmPersonnelMailingAddress.pmState.stateId,null)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="District" /></td>
					<td class="tdContent"><p:selectOneMenu id="mailAddDistrictList" value="#{smPersonnelBackingBean.managedBean.editSmPersonnelMailingAddress.pmDistrict.districtId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.districtList}" />
							<p:ajax event="change" update="mailAddCityList"
							listener="#{smPersonnelBackingBean.updateLists(null,null,smPersonnelBackingBean.managedBean.editSmPersonnelMailingAddress.pmDistrict.districtId)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="City" /></td>
					<td class="tdContent"><p:selectOneMenu id="mailAddCityList" value="#{smPersonnelBackingBean.managedBean.editSmPersonnelMailingAddress.pmCity.cityId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.cityList}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Postcode" /></td>
					<td class="tdContent" ><p:inputText value="#{smPersonnelBackingBean.managedBean.editSmPersonnelMailingAddress.postcode}" size="20" /></td>
				</tr>
			</table>
		</p:panel>
	</p:panelGrid>
	</p:panel>
	<p:panel styleClass="noBorders tr,noBorders td" style="width:100%">
		<div align="right">
			<p:commandButton value="Cancel" ajax="false" icon="ui-icon-cancel" action="#{smPersonnelBackingBean.cancel}"/>
		</div>		
	</p:panel>
	
	<p:dialog id="imageDialog" widgetVar="imageDialog" modal="true"
			width="700px" resizable="false" styleClass="pop_up_top">
		<p:fileUpload
			oncomplete="refresh();" mode="advanced" id="upload"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"/>
	</p:dialog>
</ui:define>	
</ui:composition>
