<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:define name="contentSection">

	<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />  

	<p:panel styleClass="noBorders tr,noBorders td" style="width:100%">
		<div align="right">
			<p:commandButton value="Save" ajax="false" icon="ui-icon-save" action="#{smPersonnelBackingBean.update(smPersonnelBackingBean.managedBean.updateSmPersonnel)}"/>
		</div>		
	</p:panel>

	<p:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
	<p:panel id="UserProfile" header="Update User" styleClass="noBorders tr,noBorders td" style="width:100%;">
		<table>
			 	<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Name" /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnel.name}" readonly="true" disabled="true" size="35" /></td>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="eP Role : " /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnel.epRole}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Nationality" /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnel.pmCountry.countryName}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>		
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Old IC/Passport No." /></td>
					<td><p:inputText readonly="true" disabled="true" size="35" /></td>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* New IC/Passport No." /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnel.identificationNo}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="DOB" /></td>
					<td><p:calendar value="#{smPersonnelBackingBean.managedBean.updateSmPersonnel.birthDate}" showOn="button" id="dobDate" pattern="MM/dd/yyyy"/></td>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Designation" /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnel.designation}" size="35" /></td>
				</tr>		
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Email" /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnel.email}" size="40" /></td>

					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Phn No." /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnel.phoneNo}" size="35" /></td>
				</tr>
		</table>	
	</p:panel>
	</p:panelGrid>
	<p:panel id="AddressInfo" header="Address Info" styleClass="noBorders tr,noBorders td">
	<p:panelGrid columns="2" header="Address Info" styleClass="noBorders tr,noBorders td">
		<p:panel id="PermanentAddressInfo" header="Permanent Address" styleClass="noBorders tr,noBorders td">
			<table>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Address" /></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelPermanentAddress.address1}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelPermanentAddress.address2}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelPermanentAddress.address3}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelPermanentAddress.address4}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Country" /></td>
					<td class="tdContent"><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelPermanentAddress.pmCountry.countryName}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="State" /></td>
					<td class="tdContent"><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelPermanentAddress.pmState.stateName}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="District" /></td>
					<td class="tdContent"><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelPermanentAddress.pmDistrict.districtName}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="City" /></td>
					<td class="tdContent"><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelPermanentAddress.pmCity.cityName}" readonly="true" disabled="true" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Postcode" /></td>
					<td class="tdContent" ><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelPermanentAddress.postcode}" readonly="true" disabled="true" size="20" /></td>
				</tr>
			</table>
		</p:panel>
		
		<p:panel id="MailingAddressInfo" header="Mailing Address" styleClass="noBorders tr,noBorders td" style="width:100%;">
			<table>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Address" /></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelMailingAddress.address1}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelMailingAddress.address2}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelMailingAddress.address3}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelMailingAddress.address4}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Country" /></td>
					<td class="tdContent"><p:selectOneMenu value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelMailingAddress.pmCountry.countryId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.countryList}" />
							<p:ajax event="change" update="mailAddStateList, mailAddDistrictList, mailAddCityList"
							listener="#{smPersonnelBackingBean.updateULists(smPersonnelBackingBean.managedBean.updateSmPersonnelMailingAddress.pmCountry.countryId,null,null)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="State" /></td>
					<td class="tdContent"><p:selectOneMenu id="mailAddStateList" value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelMailingAddress.pmState.stateId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.stateList}" />
							<p:ajax event="change" update="mailAddDistrictList, mailAddCityList"
							listener="#{smPersonnelBackingBean.updateULists(null,smPersonnelBackingBean.managedBean.updateSmPersonnelMailingAddress.pmState.stateId,null)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="District" /></td>
					<td class="tdContent"><p:selectOneMenu id="mailAddDistrictList" value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelMailingAddress.pmDistrict.districtId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.districtList}" />
							<p:ajax event="change" update="mailAddCityList"
							listener="#{smPersonnelBackingBean.updateULists(null,null,smPersonnelBackingBean.managedBean.updateSmPersonnelMailingAddress.pmDistrict.districtId)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="City" /></td>
					<td class="tdContent"><p:selectOneMenu id="mailAddCityList" value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelMailingAddress.pmCity.cityId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.cityList}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Postcode" /></td>
					<td class="tdContent" ><p:inputText value="#{smPersonnelBackingBean.managedBean.updateSmPersonnelMailingAddress.postcode}" size="20" /></td>
				</tr>
			</table>
		</p:panel>
	</p:panelGrid>
	</p:panel>
	
</ui:define>	
</ui:composition>
