<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" escape="false"/>
	
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<h:panelGrid id="search" style="width:100%;">

			<p:panel header="#{lbl['lbl.sm.userprofile.authorized.personnels']}" toggleable="true">

				<p:dataTable id="smPersonnelDataModelId" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{smPersonnelBackingBean.managedBean.smPersonnelList}"
					var="personnel" rowKey="#{personnel}" rowIndexVar="index">
					<ac:paginator for="smPersonnelDataModelId" />
					<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">
						<h:outputText value="#{index+1}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.name']}">
						<h:outputText value="#{personnel.name}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.nationality']}">
						<h:outputText value="#{personnel.pmCountry.countryName}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.isauthorized']}">
						<h:outputText value="#{lbl['lbl.txt.yes']}" rendered="#{personnel.authorizedFlg eq '1'}" />
						<h:outputText value="#{lbl['lbl.txt.no']}" rendered="#{personnel.authorizedFlg ne '1'}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.accountstatus']}">
						<h:outputText value="#{lbl['lbl.sm.accountstatus.active']}" rendered="#{personnel.recordStatusFlg eq '1' and not empty personnel.epRole}" />
						<h:outputText value="#{lbl['lbl.sm.accountstatus.deactivate']}" rendered="#{personnel.recordStatusFlg eq '1' and empty personnel.epRole}" />
						<h:outputText value="#{lbl['lbl.sm.accountstatus.pendingactivation']}" rendered="#{personnel.recordStatusFlg ne '1'}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.eprole']}">
						<h:outputText value="#{lbl['lbl.sm.person.composition.suppAdmin']}"
							rendered="#{personnel.prevEpRole eq 'BASIC_SUPPLIER_ADMIN'}" />
						<h:outputText value="#{lbl['lbl.sm.person.composition.suppUser']}"
							rendered="#{personnel.prevEpRole eq 'BASIC_SUPPLIER_USER'}" />
						<h:outputText value="#{lbl['lbl.sm.person.composition.catUser']}"
							rendered="#{personnel.prevEpRole eq 'CM_USER'}" />
						<h:outputText value=" (#{lbl['lbl.sm.contract.signer']})"
							rendered="#{personnel.contractSigner}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.action']}" style="text-align: center  !important;">
						<p:commandLink title="#{lbl['lbl.sm.userprofile.edit']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							action="#{smPersonnelBackingBean.navigateToUpdateUserPage(personnel.personnelId)}" update="@form">
							<p:graphicImage value="/css/images/design/edit.png" rendered="#{personnel.recordStatusFlg eq 1}" title="#{lbl['lbl.sm.edit']}"></p:graphicImage>
							<p:graphicImage value="/css/images/design/ico-view.png" rendered="#{personnel.recordStatusFlg eq 8}" title="#{lbl['lbl.sm.view']}"/>
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</p:panel>

			<p:panel style="border: none;">
				<table style="width: 100%;">
					<tr>
						<td><p:commandButton value="#{lbl['lbl.sm.userprofile.add.new']}"
								oncomplete="confirmDialog.show();" style="float:right;"
								disabled="#{smPersonnelBackingBean.managedBean.disableAddNewUser}">
							</p:commandButton></td>
						<td style="width: 20px"><p:graphicImage id="uidti"
								value="/css/images/design/tooltips.png"  />
							<p:tooltip id="uidtt" for="uidti">
								<p:outputLabel escape="false"
									value="#{lbl['lbl.sm.userprofile.search.userlimit']}" />
							</p:tooltip></td>
					</tr>
				</table>
			</p:panel>
		</h:panelGrid>
		
		<p:confirmDialog id="confirmDialog" closable="true"
			message="#{lbl['lbl.sm.userprofile.search.userscount']}"
			header="#{lbl['lbl.sm.userprofile.confirmation']}" severity="alert"
			widgetVar="confirmDialog">
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDialog.hide();"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					action="#{smPersonnelBackingBean.navigateToAddNewUserPage}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDialog.hide();" />
			</div>
	
		</p:confirmDialog>

	</ui:define>
</ui:composition>
