<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="contentSection">


		<p:panel id="searchSmUserProfile" header="#{lbl['lbl.sm.userprofile.search.users']}"
			styleClass="noBorders tr,noBorders td">
			<table style="width: 100%;">
				<tr>
					<td style="width: 10%;"><p:outputLabel
							value="#{lbl['lbl.sm.userprofile.search.username']}" /></td>
					<td><p:inputText id="username"
							value="#{smPersonnelBackingBean.managedBean.searchUsername}"
							size="35" /></td>
				</tr>
				<tr>
					<td style="width: 10%;"><p:outputLabel
							value="#{lbl['lbl.sm.userprofile.search.userrole']}" /></td>
					<td><p:selectOneMenu id="userEPRole"
							value="#{smPersonnelBackingBean.managedBean.searchEPRole}"
							style="width: 207px; margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.sm.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{smPersonnelBackingBean.managedBean.searchRoleList}" />
						</p:selectOneMenu></td>
				</tr>
				<!-- <tr>
				<td style="width: 350px;"/>
				<td style="float: left; padding-top: 5px;"><p:outputLabel value="Company Role" /></td>
				<td style="width: 500px;"><p:selectOneMenu id="companyRole" value="#{smPersonnelBackingBean.managedBean.searchCompanyRole}" style="width: 207px; margin-bottom: 5px;">
						<f:selectItem itemLabel="- Select One -" itemValue="" />
					</p:selectOneMenu></td>
			</tr> -->
			</table>

			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{smPersonnelBackingBean.managedBean.searchSmPersonnel}"
					update="smPersonnelDataModelId" icon="ui-icon-search" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					icon="ui-icon-reset"
					action="#{smPersonnelBackingBean.resetSmPersonnelSearch}"
					update="searchSmUserProfile" />
			</div>

		</p:panel>

		<h:panelGrid id="search" style="width:100%;">

			<p:panel header="#{lbl['lbl.sm.userprofile.results']}" toggleable="true">

				<p:dataTable id="smPersonnelDataModelId" lazy="true"
					value="#{smPersonnelBackingBean.managedBean.smPersonnelDataModel2}"
					var="personnel" rowKey="#{personnel}" rowIndexVar="index">
					<ac:paginator for="smPersonnelDataModelId" />
					<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">
						<h:outputText value="#{index+1}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.name']}">
						<h:outputText value="#{personnel.name}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.nationality']}">
						<h:outputText value="#{personnel.pmCountry.countryName}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.isauthorized']}">
						<h:outputText value="#{lbl['lbl.txt.yes']}" rendered="#{personnel.authorized}" />
						<h:outputText value="#{lbl['lbl.txt.no']}" rendered="!#{personnel.authorized}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.accountstatus']}">
						<h:outputText value="#{lbl['lbl.sm.userprofile.active']}" rendered="#{personnel.recordStatus}" />
						<h:outputText value="#{lbl['lbl.sm.userprofile.inactive']}"
							rendered="!#{personnel.recordStatus}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.eprole']}">
						<h:outputText value="#{lbl['lbl.sm.person.composition.suppAdmin']}"
							rendered="#{personnel.epRole eq 'BASIC_SUPPLIER_ADMIN'}" />
						<h:outputText value="#{lbl['lbl.sm.person.composition.suppUser']}"
							rendered="#{personnel.epRole eq 'BASIC_SUPPLIER_USER'}" />
						<h:outputText value="#{lbl['lbl.sm.person.composition.catUser']}"
							rendered="#{personnel.epRole eq 'CM_USER'}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.action']}">
						<p:commandLink title="#{lbl['lbl.sm.userprofile.edit']}" ajax="false"
							action="#{smPersonnelBackingBean.navigateToUpdateUserPage(personnel.personnelId)}">
							<p:graphicImage value="/css/images/design/edit.png"></p:graphicImage>
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</p:panel>

			<p:panel>
				<table style="width: 100%">
					<tr>
						<td><p:commandButton value="#{lbl['lbl.sm.userprofile.add.new']}"
								oncomplete="confirmDialog.show();" style="float:right;"
								icon="ui-icon-add"
								disabled="#{smPersonnelBackingBean.managedBean.disableAddNewUser}">
							</p:commandButton></td>
						<td style="width: 20px"><p:graphicImage id="uidti"
								value="/css/images/design/tooltips.png"  />
							<p:tooltip id="uidtt" for="uidti">
								<p:outputLabel escape="false"
									value="#{lbl['lbl.sm.userprofile.search.userlimit']}" />
							</p:tooltip></td>
					</tr>
				</table>



			</p:panel>
		</h:panelGrid>

		<p:dialog id="confirmDialog" header="#{lbl['lbl.sm.userprofile.confirmation']}"
			widgetVar="confirmDialog" modal="true" width="500" height="100">
			<p:panel id="dPanel" style="width:100%">
				<table>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.search.userscount']}" /></td>
					</tr>
					<tr>
						<td>
							<div align="center">
								<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDialog.hide();"
									action="#{smPersonnelBackingBean.navigateToAddNewUserPage}" />
								<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDialog.hide();" />
							</div>
						</td>
					</tr>
				</table>
			</p:panel>
		</p:dialog>

	</ui:define>
</ui:composition>
