<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<p:panel id="adminVerifySection"
			header="#{lbl['lbl.sm.userprofile.deactivate.admin']}"
			styleClass="noBorders tr,noBorders td">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.identificationtype']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="verifyIdType" required="true"
							label="#{lbl['lbl.sm.identificationtype']}"
							value="#{smPersonnelBackingBean.managedBean.adminVerifyIdType.parameterId}"
							style="width:200px">
							<f:selectItems
								value="#{smPersonnelBackingBean.managedBean.idTypes}" />
							<p:ajax event="change" partialSubmit="true" process="@this"
								listener="#{smPersonnelBackingBean.assignVerifyIdentType}"
								update="verifyIdTypePan,verifyIdTypeLblPan" />
						</p:selectOneMenu>
						<p:message id="verifyIdTypeMsg" for="verifyIdType"
							showSummary="true" showDetail="false" display="icon" /></td>

					<td><p:outputPanel
							id="verifyIdTypeLblPan">
							<p:outputLabel
								value="#{lbl['lbl.sm.userprofile.idno']}"
								id="verifyIcNumLbl" />
							<p:outputLabel value="*" styleClass="mandatory" />
						</p:outputPanel></td>

					<td><p:outputPanel id="verifyIdTypePan">
							<p:inputText label="#{lbl['lbl.sm.userprofile.idno']}"
								required="true" id="verifyIcNum"
								value="#{smPersonnelBackingBean.managedBean.adminVerifyICNo}"
								size="35" maxlength="12"
								validatorMessage="#{lbl['lbl.sm.person.icNum']} - #{lbl['lbl.sm.invalidNo']}">
								<f:validateRegex pattern="^-?\d*(\.\d+)?$" disabled="#{smPersonnelBackingBean.managedBean.adminVerifyIdType.parameterCode ne 'I'}"/>
							</p:inputText>
							<p:message id="verifyIcNumMsg" for="verifyIcNum"
								showSummary="true" showDetail="false" display="icon" />
						</p:outputPanel></td>
				</tr>
			</table>
		</p:panel>

		<p:panel>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.proceed']}"
					action="#{smPersonnelBackingBean.navigateToDeactivateAdminPage}" />
			</div>
		</p:panel>

	</ui:define>
</ui:composition>
