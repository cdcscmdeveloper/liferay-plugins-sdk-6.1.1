<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="sideMenu">
		<ui:include src="/xhtml/sm/shared/sidemenu/smMainPageSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<p:panel header="Update Password">
			<table style="width: 100%">
				<tr> 
					<td><p:outputLabel value="Enter Old Password *" /></td>
					<td><p:inputText/></td>
				</tr>
				<tr> 
					<td><p:outputLabel value=" Enter New Password *" /></td>
					<td><p:inputText/></td>
				</tr>
			    <tr> 
					<td><p:outputLabel value="Confirm Password *" /></td>
					<td><p:inputText/></td>
				</tr>
				<tr>
			<td><p:outputLabel value="Question *" /></td>
			<td><p:selectOneMenu>
				<f:selectItem itemLabel="-- Select One -- " itemValue="" />
				<f:selectItem itemLabel="Question one" itemValue="1" />
				<f:selectItem itemLabel="Question two" itemValue="1" />
				<f:selectItem itemLabel="Question three" itemValue="1" />
				</p:selectOneMenu>
			</td>
		</tr>
		    <tr> 
		      <td><p:outputLabel value="Answer *" /></td>
			  <td><p:inputText/></td>
			</tr>
			</table>
		</p:panel>
		<div align="center">
			<p:commandButton value="Save" />
			<p:commandButton value="Cancel"
				action="/xhtml/sm/homeScreen/defaultVirtualCertPage.xhtml" />
		</div>
	</ui:define>
</ui:composition>
