<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}"
						immediate="true"
						action="#{smPersonnelBackingBean.cancelUserMOFUpdate}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" /></td>
				<!-- 34810 - start  -->
				<!-- #34159 - START - add param disableValidation -->
				<td style="white-space: nowrap; float: right;">
					<p:commandButton
						value="#{lbl['lbl.sm.button.save']}" update=":form"
						action="#{smPersonnelBackingBean.checkingBeforeSave()}"
						onclick="blockWidget.show()" oncomplete="blockWidget.hide()" >
						<f:param name="disableValidation" value="true" />
					</p:commandButton>
				</td>
				<!-- #34159 - END -->
				<!-- 34810 - end  -->
			</tr>
		</table>


		<p:panel id="UserProfile" toggleable="true">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sm.userprofile.add.new']}"
					rendered="#{!smPersonnelBackingBean.managedBean.editMode}" />
				<h:outputText value="#{lbl['lbl.sm.person.info.hdr']}"
					rendered="#{smPersonnelBackingBean.managedBean.editMode}" />
			</f:facet>
			<table style="width: 100%">

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.name']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="basicBUName"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.name}"
							size="35" required="true" maxlength="80"
							label="#{lbl['lbl.sm.userprofile.name']}"
							disabled="#{smPersonnelBackingBean.managedBean.editMode}" /> <p:message
							id="basicBUNameMsg" for="basicBUName" showSummary="true" 
							showDetail="false" display="icon" /></td>

					<td><p:outputLabel value="#{lbl['lbl.sm.person.nationality.origin']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="basicBUCountry"
							label="#{lbl['lbl.sm.person.nationality.origin']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.pmCountry.countryId}"
							style="width: 207px;margin-bottom: 5px;" required="true"
							disabled="true">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{smPersonnelBackingBean.managedBean.countryList}" />
						</p:selectOneMenu> <p:message id="basicBUCountryMsg" for="basicBUCountry"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.pm.profiles.userdetails.salutation']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="basicBUSalutation"
							label="#{lbl['lbl.pm.profiles.userdetails.salutation']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.title.salutationId}"
							style="width: 207px;margin-bottom: 5px;" required="true"
							disabled="true">
							<f:selectItems
								value="#{smPersonnelBackingBean.managedBean.salutationItems}" />
						</p:selectOneMenu> <p:message id="basicBUSalutationMsg" for="basicBUSalutation"
							showSummary="true" showDetail="false" display="icon" /></td>

					<td><p:outputLabel value="#{lbl['lbl.sm.person.race']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="basicBURace"
							label="#{lbl['lbl.sm.person.race']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.pmRace.raceId}"
							rendered = "#{smPersonnelBackingBean.managedBean.basicSmPersonnel.pmRace ne null}"
							style="width: 207px;margin-bottom: 5px;" required="true"
							disabled="#{!smPersonnelBackingBean.managedBean.basicSmPersonnel.otherRaceSsm}"> <!-- #35145 -->
							<f:selectItems
								value="#{smPersonnelBackingBean.managedBean.raceSelectItems}" />
						</p:selectOneMenu> 
						<p:selectOneMenu id="basicBURaceNull"
							label="#{lbl['lbl.sm.person.race']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.pmRace.raceId}"
							rendered = "#{smPersonnelBackingBean.managedBean.basicSmPersonnel.pmRace eq null}"
							style="width: 207px;margin-bottom: 5px;" required="true"
							disabled="true">
							<f:selectItem itemLabel="#{lbl['lbl.sm.person.epRoleStatus.unavailable']}"  itemValue="#{null}" />
						</p:selectOneMenu>
						
						<p:message id="basicBURaceMsg" for="basicBURace"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.identificationtype']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="basicBUIdType"
							label="#{lbl['lbl.sm.identificationtype']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationTypeId}"
							style="width: 207px;margin-bottom: 5px;" required="true"
							disabled="true">
							<f:selectItems
								value="#{smPersonnelBackingBean.getPmIdTypeDropdownValues()}" />
						</p:selectOneMenu> <p:message id="basicBUIdTypeMsg" for="basicBUIdType"
							showSummary="true" showDetail="false" display="icon" /></td>

					<td><p:outputPanel id="basicBUIdTypeLblPan">
							<p:outputLabel
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq SupplierManagementConst.NEW_IC?lbl['lbl.sm.person.icNum']:lbl['lbl.sm.userprofile.idno']}"
								id="equiPerIcNumLbl" />
							<p:outputLabel value="*" styleClass="mandatory" />
						</p:outputPanel></td>

					<td><p:outputPanel id="basicBUIdTypePan">
							<p:inputText label="#{lbl['lbl.sm.userprofile.idno']}"
								required="true" id="basicBUIcNum"
								requiredMessage="#{lbl['lbl.sm.icNo.required']}"
								rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'I'}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationNo}"
								size="35" maxlength="12"
								validatorMessage="#{lbl['lbl.sm.userprofile.idno']} - #{lbl['lbl.sm.invalidNo']}"
								disabled="#{smPersonnelBackingBean.managedBean.editMode}">
								<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
							</p:inputText>
							<p:inputText label="#{lbl['lbl.sm.userprofile.idno']}"
								required="true" id="basicBUPasptNum"
								rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode ne 'I'}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationNo}"
								size="35" maxlength="15"
								disabled="#{smPersonnelBackingBean.managedBean.editMode}">
							</p:inputText>
							<p:message id="basicBUIcNumMsg" for="basicBUIcNum"
								showSummary="true" showDetail="false" display="icon" />
							<p:message id="basicBUPasptNumMsg" for="basicBUPasptNum"
								showSummary="true" showDetail="false" display="icon" />
						</p:outputPanel></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.dob']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:calendar showOn="button" navigator="true"
							display="inline" required="true" readonlyInput="true"
							label="#{lbl['lbl.sm.person.dob']}" id="dobDate"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							yearRange="-99:+0"
							maxdate="#{smPersonnelBackingBean.managedBean.currDate}"
							disabled="#{smPersonnelBackingBean.managedBean.editMode}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.birthDate}" />
						<p:message id="dobDateMsg" for="dobDate" showSummary="true"
							showDetail="false" display="icon" /></td>


					<td><p:outputLabel
							value="#{lbl['lbl.sm.person.designation']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="basicBUDes"
							label="#{lbl['lbl.sm.userprofile.designation']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.designation}"
							size="35" required="true"
							disabled="#{smPersonnelBackingBean.managedBean.editMode}" /> <p:message
							id="basicBUDesMsg" for="basicBUDes" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.person.epfNo']}" /> </td>
					<td><p:inputText id="basicBUEpf"
							label="#{lbl['lbl.sm.person.epfNo']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.epfNo}"
							size="35" 
							disabled="#{smPersonnelBackingBean.managedBean.editMode}" /> <p:message
							id="basicBUEpfMsg" for="basicBUEpf" showSummary="true"
							showDetail="false" display="icon" /></td>

					<td><p:outputLabel value="#{lbl['lbl.sm.person.exp']}" /> </td>
					<td><p:inputText id="basicBUWrk"
							label="#{lbl['lbl.sm.person.exp']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.workExperienceYear}"
							size="35" 
							disabled="#{smPersonnelBackingBean.managedBean.editMode}" /> <p:message
							id="basicBUWrkMsg" for="basicBUWrk" showSummary="true"
							showDetail="false" display="icon" /></td>
				</tr>

				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.maintenance.person.email']}" />
						<p:outputLabel value="*" id="mandatoryEmail" styleClass="mandatory"/>			
					</td>
					<td>
						<p:inputText id="basicBUEmail" label="#{lbl['lbl.sm.userprofile.email']}" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.email}"
						validatorMessage="#{lbl['lbl.sm.userprofile.email']} - #{lbl['lbl.sm.invalidEmail']}" size="40" required="true">	
						<f:validateRegex pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
						<p:ajax event="change" process="@this"  update="basicBUEmail"/> 
						</p:inputText>
							
						<p:message id="basicBUEmailMsg" for="basicBUEmail" showSummary="true" showDetail="false" display="icon" />
					</td>
					<td><p:outputLabel value="#{lbl['lbl.sm.mobileNo']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><ac:phone id="basicBUMobile"
							label="#{lbl['lbl.sm.mobileNo']}"
							countryCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileCountry}"
							areaCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileArea}"
							number="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileNo}"
							isMobile="true" required="true"
							validatorMessage="#{lbl['lbl.sm.mobileNo']} - #{lbl['lbl.sm.invalidNo']}"
							telcoId="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileTelcoId}"
							disabled="#{smPersonnelBackingBean.managedBean.editMode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.phoneno']}" /></td>
					<td><ac:phone id="basicBUPhone" isMobile="false"
							label="#{lbl['lbl.sm.phoneno']}"
							countryCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.phoneCountry}"
							areaCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.phoneArea}"
							number="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.phoneNo}"
							validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}"
							disabled="#{smPersonnelBackingBean.managedBean.editMode}" /></td>

					<td><p:outputLabel value="#{lbl['lbl.sm.faxno']}" />
					</td>
					<td class="tdContent"><ac:phone id="faxNoId" isMobile="false"
							label="#{lbl['lbl.sm.faxno']}"
							countryCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.faxCountry}"
							areaCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.faxArea}"
							number="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.faxNo}"
							validatorMessage="#{lbl['lbl.sm.faxno']} - #{lbl['lbl.sm.invalidNo']}"
							disabled="#{smPersonnelBackingBean.managedBean.editMode}" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.person.bumi']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneRadio disabled="true"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.bumiFlg}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
						</p:selectOneRadio></td>

					<td><p:outputLabel value=" #{lbl['lbl.sm.person.religion']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneRadio disabled="true"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.muslimFlg}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.person.religion.muslim']}"
								itemValue="1" />

							<f:selectItem
								itemLabel="#{lbl['lbl.sm.person.religion.non.muslim']}"
								itemValue="0" />
						</p:selectOneRadio></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="#{lbl['lbl.sm.person.composition.isAuth']}"
			toggleable="true" id="perPrivPanel">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sm.person.shrPrvHdr']}" />
			&#160;
			<p:graphicImage id="codeti" value="/css/images/design/tooltips.png" />
				<p:tooltip id="codett" for="codeti">
					<h:outputText escape="false"
						value="#{lbl['tt.sm.registration.equity.owner.authorized.personal']}" />
				</p:tooltip>
			</f:facet>

			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.person.isAuth']}" /></td>
					<td><p:outputPanel id="authOutPanelId">
							<p:selectOneRadio disabled="true"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.authorizedFlg}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
								<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
							</p:selectOneRadio>
						</p:outputPanel></td>
				</tr>
				<p:outputPanel	rendered="#{not empty smPersonnelBackingBean.managedBean.roleList}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.eprole']}" /></td>
						<td><p:selectOneMenu id="basicBURole" disabled="#{smPersonnelBackingBean.managedBean.disableRoleSelection}"
								label="#{lbl['lbl.sm.userprofile.eprole']}"
								value="#{smPersonnelBackingBean.managedBean.epRoleTrans}"
								style="width: 207px;margin-bottom: 5px;">
								<c:if test = "#{smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq null}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								</c:if>
								<f:selectItems
									value="#{smPersonnelBackingBean.managedBean.roleList}" />
								<!-- 9569 -->	
								<c:if test= "#{smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole ne null}">
									<f:selectItem itemLabel="#{lbl['lbl.sm.maintenance.delete.role']}" itemValue="#{SupplierManagementConst.EPROLE_DELETED}" />
								</c:if>
								<p:ajax event="change" partialSubmit="true" process="@this"
									update="perPrivPanel" onstart="blockWidget.show()"
									oncomplete="blockWidget.hide()" />
							</p:selectOneMenu> 
							<!-- As 4/8/2021  -->
							<p:message id="basicBURoleMsg" for="basicBURole" showSummary="true" showDetail="false" display="icon" />
								</td>
						<td><h:outputText style="float:initial" value=" &#160; #{lbl['lbl.sm.personnel.history']} " escape="false" /> 
								<p:commandLink
								onclick="personnelRoleHistoryInfo.show()"
								value="#{lbl['lbl.sm.personnel.history1']} "
								style="float: inherit" /> 
								<h:outputText style="float:initial" value="#{lbl['lbl.sm.personnel.history2']} " escape="false" /></td>
					</tr>
					<p:outputPanel
						rendered="#{smPersonnelBackingBean.managedBean.epRoleTrans eq 'MOF_SUPPLIER_USER' 
						or smPersonnelBackingBean.managedBean.epRoleTrans eq 'FL_USER'}">
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.person.composition.certStatus']} :" /></td>
							<td><h:outputText
									value="#{lbl['lbl.txt.na']}"
									rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '0' or empty smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg }" />
									<h:outputText
									value="#{lbl['lbl.sm.person.composition.request.failed']}"
									rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '9'}" />
									<h:outputText
									value="#{lbl['lbl.sm.person.composition.ready.renewal']}"
									rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '7'}" />
									<h:outputText
									value="#{lbl['lbl.sm.person.composition.rejected']}"
									rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '6'}" />
									<h:outputText
									value="#{lbl['lbl.sm.person.composition.pending.request']}"
									rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '4'}" />
									<h:outputText
									value="#{lbl['lbl.sm.person.composition.processing']}"
									rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '3'}" />
									<h:outputText
									value="#{lbl['lbl.sm.person.composition.requested']}"
									rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '2'}" />
									<h:outputText
									value="#{lbl['lbl.sm.person.composition.issued']}"
									rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '1'}" />
							</td>
						</tr>
					</p:outputPanel>
					<p:outputPanel
						rendered="#{smPersonnelBackingBean.managedBean.epRoleTrans eq 'MOF_SUPPLIER_USER'}">
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.person.isContrSign']}" /></td>
							<td><p:selectOneRadio
									disabled="#{smPersonnelBackingBean.managedBean.contractSignerCount gt 9
										and smPersonnelBackingBean.managedBean.basicSmPersonnel.contractSignerFlg eq 0}"
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.contractSignerFlg}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
									<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
								</p:selectOneRadio></td>

							<td><p:graphicImage id="tooltip5"
									value="/css/images/design/tooltips.png"
									style="padding-bottom : 7px;" /> <p:tooltip id="toolinfo5"
									for="tooltip5">
									<p:outputLabel escape="false"
										value="#{lbl['tt.sm.registration.equity.owner.authorized.contract.sign']}" />
								</p:tooltip></td>
						</tr>
					</p:outputPanel>
					<p:outputPanel
						rendered="#{smPersonnelBackingBean.managedBean.epRoleTrans eq 'MOF_SUPPLIER_USER'
						or smPersonnelBackingBean.managedBean.epRoleTrans eq 'CM_USER'
						or smPersonnelBackingBean.managedBean.epRoleTrans eq 'FL_USER'}">
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.person.userAccountStatus']} :" /></td>
							<td><p:column
									headerText="#{lbl['lbl.sm.activation.status']}">
									<h:outputText
										value="#{lbl['lbl.sm.activation.status.activated']}"
										rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.recordStatusFlg eq '1'}" />
									<h:outputText
										value="#{lbl['lbl.sm.activation.status.pending']}"
										rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.recordStatusFlg eq '8'}" />
								</p:column></td>
						</tr>
					</p:outputPanel>

				</p:outputPanel>
			</table>

		</p:panel>

		<p:panel toggleable="true" id="addressInfoPanelId"
			header="#{lbl['lbl.sm.userprofile.addr.info']}">

			<table style="width: 100%;">
				<tr>
					<td valign="top" width="50%"><p:panel
							id="PermanentAddressInfo" style="border: none;">
							<!--                                                                                                                                                       PERMANENT ADDRESS  -->
							<table style="width: 100%;">

								<tr>
									<td><u><b><h:outputText
													value="#{lbl['lbl.sm.ic.address']} " /></b></u></td>
								</tr>

								<tr>
									<td><p:outputLabel value="#{lbl['lbl.sm.address']}" /> <p:outputLabel
											value="*" styleClass="mandatory" /></td>
									<td><p:inputText maxlength="100" required="true"
											id="permAdd1" label="#{lbl['lbl.sm.address']}"
											value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address1}"
											size="35"
											disabled="#{smPersonnelBackingBean.managedBean.editMode}">
											<p:ajax process="@this" partialSubmit="true"
												update="@this,permAdd1Msg" />
										</p:inputText> <p:message id="permAdd1Msg" for="permAdd1" showSummary="true"
											showDetail="false" display="icon" /></td>
								</tr>
								<tr>
									<td></td>
									<td><p:inputText maxlength="100"
											value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address2}"
											size="35"
											disabled="#{smPersonnelBackingBean.managedBean.editMode}">
											<p:ajax process="@this" partialSubmit="true" update="@this" />
										</p:inputText></td>

									<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /> <p:outputLabel
											value="*" styleClass="mandatory" /></td>
									<td><p:outputPanel id="basicOffAddPostCodePanelId">
											<p:outputPanel
												rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnelOfficeAddress.smAddress.pmCountry.countryId==smPersonnelBackingBean.managedBean.myCountryId}">
												<p:inputText maxlength="5"
													required="#{!smPersonnelBackingBean.managedBean.basicSmPersonnelOfficeAddress.sameAsPerm}"
													label="#{lbl['lbl.sm.postcode']}"
													id="basicOffAddPostCodeMy"
													value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelOfficeAddress.smAddress.postcode}"
													validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
													readonly="#{smPersonnelBackingBean.managedBean.basicSmPersonnelOfficeAddress.sameAsPerm}"
													disabled="#{smPersonnelBackingBean.managedBean.basicSmPersonnelOfficeAddress.sameAsPerm
																or smPersonnelBackingBean.managedBean.editMode}"
													size="35">
													<f:validator validatorId="postcodeValidator" />
												</p:inputText>
												<p:message id="basicOffAddPostCodeMyMsg"
													for="basicOffAddPostCodeMy" showSummary="true"
													showDetail="false" display="icon" />
											</p:outputPanel>
											<p:outputPanel
												rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnelOfficeAddress.smAddress.pmCountry.countryId!=smPersonnelBackingBean.managedBean.myCountryId}">
												<p:inputText maxlength="10"
													required="#{!smPersonnelBackingBean.managedBean.basicSmPersonnelOfficeAddress.sameAsPerm}"
													label="#{lbl['lbl.sm.postcode']}"
													id="basicOffAddPostCodeForeign"
													value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelOfficeAddress.smAddress.postcode}"
													readonly="#{smPersonnelBackingBean.managedBean.basicSmPersonnelOfficeAddress.sameAsPerm}"
													disabled="#{smPersonnelBackingBean.managedBean.basicSmPersonnelOfficeAddress.sameAsPerm or smPersonnelBackingBean.managedBean.editMode}"
													size="35">
												</p:inputText>
												<p:message id="basicOffAddPostCodeForeignMsg"
													for="basicOffAddPostCodeForeign" showSummary="true"
													showDetail="false" display="icon" />
											</p:outputPanel>
										</p:outputPanel></td>
								</tr>
							</table>
					 </p:panel></td>
				</tr>
			</table>	
			<!-- #9569 - Start (for history popup)-->
			<p:dialog id="personnelRoleHistory" header="#{lbl['lbl.sm.personnel.history.panel']}"  widgetVar="personnelRoleHistoryInfo" closable="true" modal="true" resizable="false" style="display: static;" height="350" width="600">
			<p:outputPanel layout="block" id="personnelRoleHistoryInfoBlockPanel">
				<p:dataTable id="personnelHistoryListId"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{smPersonnelBackingBean.managedBean.personnelHistoryList}"
					var="history" rowKey="#{history}" rowIndexVar="index" rows="10">
					<ac:paginator for="personnelHistoryListId" />
					
					<!-- No.  -->
					<p:column headerText="#{lbl['lbl.sm.personnel.history.column']}">
						<h:outputText value="#{index+1}" />
					</p:column>
					
					<!-- Current eP Role  -->
					<p:column headerText="#{lbl['lbl.sm.userprofile.eprole']}">
						<ac:smRoleDesc roleCode="#{history.pmRole.roleCode}"
							backingBean="#{smPersonnelBackingBean}" />
					</p:column>

					<!-- Action Date  -->
					<p:column headerText="#{lbl['lbl.sm.personnel.history.column2']}">
						<h:outputText value="#{history.changedDateFormat}"  rendered="#{history.changedDateFormat ne null }"/>
						<h:outputText value="#{lbl['lbl.sm.person.epRoleStatus.unavailable']}"  rendered="#{history.changedDateFormat eq null }"/>
					</p:column>
					
					<!-- Change By Name  -->
					<p:column headerText="#{lbl['lbl.sm.personnel.history.column3']}">
						<h:outputText value="#{history.changedByUserName}"  rendered="#{history.changedByUserName ne null}"/>
						<h:outputText value= "#{lbl['lbl.sm.person.epRoleStatus.unavailable']}"  rendered="#{history.changedByUserName eq null }"/>
					</p:column>
					
					<!-- Status  -->
					<p:column headerText="#{lbl['lbl.sm.personnel.history.column4']}">
						<h:outputText value= "#{lbl['lbl.sm.personnel.history.column4.active']}"  rendered="#{history.recordStatusFlg eq '1'}"/>
						<h:outputText value= "#{lbl['lbl.sm.personnel.history.column4.inactive']}"  rendered="#{history.recordStatusFlg eq '0'}"/>
						<h:outputText value= "#{lbl['lbl.sm.personnel.history.column4.deleted']}"  rendered="#{history.recordStatusFlg eq '9'}"/>
					</p:column>
				</p:dataTable>

			</p:outputPanel>
		</p:dialog>
		</p:panel>
		
	</ui:define>
</ui:composition>
