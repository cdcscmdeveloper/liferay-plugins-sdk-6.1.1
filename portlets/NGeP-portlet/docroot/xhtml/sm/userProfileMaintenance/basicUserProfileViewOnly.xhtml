<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<table style="width: 100%;table-layout:fixed">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" 
					action="#{smPersonnelBackingBean.cancel}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
				</td>
			</tr>
		</table>


		<p:panel id="UserProfile" style="border: none;width:100%;"
			toggleable="true">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sm.userprofile.add.new']}" rendered="#{!smPersonnelBackingBean.managedBean.editMode}"/>
				<h:outputText value="#{lbl['lbl.sm.userprofile.edit']}" rendered="#{smPersonnelBackingBean.managedBean.editMode}"/>
			</f:facet>
			<table style="width: 100%;table-layout:fixed">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.accountstatus']}" styleClass="outputLabel-view-label"/></td>
					<td>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.accountstatus.active']}" rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.recordStatusFlg eq 1}"/>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.accountstatus.deactivate']}" rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.recordStatusFlg eq 9}"/>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.accountstatus.pendingactivation']}" rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.recordStatusFlg eq 8}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.name']}" styleClass="outputLabel-view-label"/></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.name}" /></td>
					<td></td>
					<td></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.salutation']}" styleClass="outputLabel-view-label"/></td>
					<td><p:outputLabel styleClass="outputLabel-view" rendered="#{not empty smPersonnelBackingBean.managedBean.basicSmPersonnel.title}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.title.salutationName}" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.nationality']}" styleClass="outputLabel-view-label" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.pmCountry.countryName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.identificationtype']}" styleClass="outputLabel-view-label"/></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.selectedPersonnelIdentificationType}" /></td>
					<td><p:outputLabel value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq SupplierManagementConst.NEW_IC?lbl['lbl.sm.individual.newicno']:lbl['lbl.sm.userprofile.idno']}" styleClass="outputLabel-view-label" id="equiPerIcNumLbl" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.email']}" styleClass="outputLabel-view-label" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.email}"/></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.designation']}" styleClass="outputLabel-view-label"/></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.designation}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.phone']}" styleClass="outputLabel-view-label" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.phoneFull}" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.mobile']}" styleClass="outputLabel-view-label" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileFull}" /></td>
				</tr>	
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.eprole']}" styleClass="outputLabel-view-label" /></td>
					<td><ac:smRoleDesc roleCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole}" backingBean="#{smPersonnelBackingBean}" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.dob']}" styleClass="outputLabel-view-label"/></td>
					<td><ac:labelDate styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.birthDate}" /></td>		
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.person.isSoftCert']}" styleClass="outputLabel-view-label"/></td>
					<td>
						<p:outputLabel value="#{lbl['lbl.txt.yes']}" styleClass="outputLabel-view" rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg ne '0'}"/>
						<p:outputLabel value="#{lbl['lbl.txt.no']}" styleClass="outputLabel-view" rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '0'}"/>
					</td>
				</tr>
				<p:outputPanel rendered="#{(smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'BASIC_SUPPLIER_ADMIN') 
							or (smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'BASIC_SUPPLIER_USER') 
							or (smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'MOF_SUPPLIER_USER')}">
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.isContrSign']}"  rendered="#{(smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'BASIC_SUPPLIER_ADMIN') or (smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'BASIC_SUPPLIER_USER')}"/></td>		
						<td>
							<p:outputLabel value="#{lbl['lbl.txt.yes']}" styleClass="outputLabel-view" rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.contractSignerFlg eq 1}"/>
							<p:outputLabel value="#{lbl['lbl.txt.no']}" styleClass="outputLabel-view" rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.contractSignerFlg eq 0}"/>
						</td>
					</tr>
				</p:outputPanel>
			</table>
		</p:panel>

		
		<p:panel toggleable="true">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sm.userprofile.addr.info']}"/>
			</f:facet>
		
			<table style="width: 100%;table-layout:fixed">
			<tr>
				<td valign="top" width="50%"><p:panel id="permAddrPan" style="border: none;">
						<table style="width: 100%;table-layout:fixed">
							<tr>
								<td style="font-size: 12px;font-weight: bold;font-family: Arial;text-decoration: underline;float:right;"><h:outputText value="#{lbl['lbl.sm.person.permAddr']} " /></td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.address']}" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address1}" /></td>
							</tr>
	
							<tr>
								<td></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address2}" /></td>
							</tr>
							<tr>
								<td></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address3}" /></td>
							</tr>
							<tr>
								<td></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address4}" /></td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmCountry.countryName}"/></td>
							</tr>
	
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmState.stateName}"/></td>
							</tr>
	
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmDistrict.districtName}"/></td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmCity.cityName}"/></td>
							</tr>
							<tr>
								<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.postcode}"/></td>
							</tr>
						</table>
					</p:panel></td>
					<td valign="top"><p:panel id="mailAddrPan" style="border: none;">
							<table style="width: 100%;table-layout:fixed">
								<tr>
									<td style="font-size: 12px;font-weight: bold;font-family: Arial;text-decoration: underline;float:right;"><h:outputText value="#{lbl['lbl.sm.person.mailAddr']} " /></td>
								</tr>
								<tr>
									<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.address']}" /></td>
									<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.address1}"/></td>
								</tr>
		
								<tr>
									<td></td>
									<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.address2}" /></td>
								</tr>
								<tr>
									<td></td>
									<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.address3}" /></td>
								</tr>
								<tr>
									<td></td>
									<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.address4}" /></td>
								</tr>
								<tr>
									<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
									<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.pmCountry.countryName}"/></td>
								</tr>
		
								<tr>
									<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
									<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.pmState.stateName}"/></td>
								</tr>
		
								<tr>
									<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
									<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.pmDistrict.districtName}"/></td>
								</tr>
								<tr>
									<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
									<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.pmCity.cityName}"/></td>
								</tr>
								<tr>
									<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
									<td><p:outputLabel styleClass="outputLabel-view" value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.postcode}"/></td>
								</tr>
							</table>
						</p:panel></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
