<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.back']}"
						immediate="true" action="#{smPersonnelBackingBean.cancel}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
				</td>
				<td style="white-space: nowrap; float: right;">
					<p:commandButton value="#{lbl['lbl.sm.button.save']}" update=":form"
						action="#{smPersonnelBackingBean.save}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				</td>
			</tr>
		</table>


		<p:panel id="UserProfile" toggleable="true">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sm.userprofile.add.new']}" rendered="#{!smPersonnelBackingBean.managedBean.editMode}"/>
				<h:outputText value="#{lbl['lbl.sm.userprofile.edit']}" rendered="#{smPersonnelBackingBean.managedBean.editMode}"/>
			</f:facet>
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel rendered="#{smPersonnelBackingBean.managedBean.editMode}"
							value="#{lbl['lbl.sm.userprofile.accountstatus']}" /></td>
					<td><p:selectOneRadio id="accountstatus" required="false"
							value="#{smPersonnelBackingBean.managedBean.accountStatus}" disabled="#{smPersonnelBackingBean.managedBean.disabledActivateAndDeactivate}"
							rendered="#{smPersonnelBackingBean.managedBean.editMode}">
							<f:selectItem itemLabel="#{smPersonnelBackingBean.managedBean.deactivatePersonnel?lbl['lbl.sm.accountstatus.reactivate']:lbl['lbl.sm.accountstatus.active']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.accountstatus.deactivate']}" itemValue="0" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.accountstatus.terminate']}" itemValue="9" />
							<p:ajax update="UserProfile" event="change" process="@this" listener="#{smPersonnelBackingBean.onChangeAccntStatus}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
						</p:selectOneRadio></td>
					<td></td>
					<td></td>
				</tr>
				<p:outputPanel rendered="#{smPersonnelBackingBean.managedBean.accountStatus eq 9}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.reason.termination']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><p:inputTextarea autoResize="false" cols="41" id="terminateReasonId"
								maxlength="200" required="true" label="#{lbl['lbl.sm.reason.termination']}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.terminationReason}" />
							<p:message id="terminateReasonMsg"
							for="terminateReasonId" showSummary="true" showDetail="false"
							display="icon" />
						</td>
						<td></td>
						<td></td>
					</tr>
				</p:outputPanel>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.userprofile.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="basicBUName"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.name}"
							size="35" required="true"
							label="#{lbl['lbl.sm.userprofile.name']}" disabled="#{smPersonnelBackingBean.managedBean.editMode}"/>
							<p:message id="basicBUNameMsg" for="basicBUName"
							showSummary="true" showDetail="false" display="icon" /></td>

					<td></td>
					<td></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.pm.profiles.userdetails.salutation']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="basicBUSalutation"
							label="#{lbl['lbl.pm.profiles.userdetails.salutation']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.title.salutationId}"
							style="width: 207px;margin-bottom: 5px;" required="true">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{smPersonnelBackingBean.managedBean.salutationItems}" />
						</p:selectOneMenu>
						<p:message id="basicBUSalutationMsg" for="basicBUSalutation"
							showSummary="true" showDetail="false" display="icon" /></td>

					<td><p:outputLabel
							value="#{lbl['lbl.sm.userprofile.nationality']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="basicBUCountry"
							label="#{lbl['lbl.sm.userprofile.nationality']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.pmCountry.countryId}"
							style="width: 207px;margin-bottom: 5px;" required="true"
							disabled="#{smPersonnelBackingBean.managedBean.editMode}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{smPersonnelBackingBean.managedBean.countryList}" />
						</p:selectOneMenu>
						<p:message id="basicBUCountryMsg" for="basicBUCountry"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.identificationtype']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="basicBUIdType" required="true"
							label="#{lbl['lbl.sm.identificationtype']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationTypeId}"
							style="width:200px" disabled="#{smPersonnelBackingBean.managedBean.editMode}">
							<f:selectItems
								value="#{smPersonnelBackingBean.managedBean.idTypes}" />
							<p:ajax event="change" partialSubmit="true" process="@this"
								listener="#{smPersonnelBackingBean.assignPersonIdentType}"
								update="basicBUIdTypePan,basicBUIdTypeLblPan" />
						</p:selectOneMenu>
						<p:message id="basicBUIdTypeMsg" for="basicBUIdType"
							showSummary="true" showDetail="false" display="icon" /></td>

					<td><p:outputPanel
							id="basicBUIdTypeLblPan">
							<p:outputLabel
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq SupplierManagementConst.NEW_IC?lbl['lbl.sm.individual.newicno']:lbl['lbl.sm.userprofile.idno']}"
								id="equiPerIcNumLbl" />
							<p:outputLabel value="*" styleClass="mandatory" />
						</p:outputPanel></td>

					<td><p:outputPanel id="basicBUIdTypePan">
							<p:inputText label="#{lbl['lbl.sm.userprofile.idno']}"
								required="true" id="basicBUIcNum"
								rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'I'}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationNo}"
								size="35" maxlength="12"
								validatorMessage="#{lbl['lbl.sm.userprofile.idno']} - #{lbl['lbl.sm.invalidNo']}"
								disabled="#{smPersonnelBackingBean.managedBean.editMode}">
								<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
							</p:inputText>
							<p:inputText
								label="#{lbl['lbl.sm.userprofile.idno']}"
								required="true" id="basicBUPasptNum"
								rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode ne 'I'}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationNo}"
								size="35" maxlength="15"
								disabled="#{smPersonnelBackingBean.managedBean.editMode}">
							</p:inputText>
							<p:message id="basicBUIcNumMsg" for="basicBUIcNum"
								showSummary="true" showDetail="false" display="icon" />
							<p:message id="basicBUPasptNumMsg" for="basicBUPasptNum"
								showSummary="true" showDetail="false" display="icon" />
						</p:outputPanel></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.userprofile.email']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="basicBUEmail"
							label="#{lbl['lbl.sm.userprofile.email']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.email}" 
							validatorMessage="#{lbl['lbl.sm.userprofile.email']} - #{lbl['lbl.sm.invalidEmail']}"
							size="40" required="true" disabled="#{smPersonnelBackingBean.managedBean.editMode}">
							<f:validateRegex
						pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
							</p:inputText>
						<p:message id="basicBUEmailMsg" for="basicBUEmail"
							showSummary="true" showDetail="false" display="icon" /></td>

					<td><p:outputLabel
							value="#{lbl['lbl.sm.userprofile.designation']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="basicBUDes"
							label="#{lbl['lbl.sm.userprofile.designation']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.designation}"
							size="35" required="true" />
							<p:message id="basicBUDesMsg" for="basicBUDes"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.userprofile.phone']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<ac:phone id="basicBUPhone" isMobile="false" label="#{lbl['lbl.sm.userprofile.phone']}"
							countryCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.phoneCountry}" 
							areaCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.phoneArea}" 
							number="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.phoneNo}"  
							validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" 
							required="true"/>
					</td>

					<td><p:outputLabel
							value="#{lbl['lbl.sm.userprofile.mobile']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<ac:phone id="basicBUMobile" label="#{lbl['lbl.sm.userprofile.mobile']}"
							countryCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileCountry}" 
							areaCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileArea}" 
							number="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileNo}" 
							isMobile="true" required="true"
							validatorMessage="#{lbl['lbl.sm.mobileNo']} - #{lbl['lbl.sm.invalidNo']}"
							telcoId="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileTelcoId}" />
					</td>
				</tr>
				
				<tr>
					<td><p:outputLabel id="basicBURoleLabel"
							value="#{lbl['lbl.sm.userprofile.eprole']}" /> <p:outputLabel id="basicBURoleMandatory"
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="basicBURole" 
							label="#{lbl['lbl.sm.userprofile.eprole']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole}"
							style="width: 207px;margin-bottom: 5px;" required="true" 
							disabled="#{(smPersonnelBackingBean.managedBean.editMode 
							and (smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'BASIC_SUPPLIER_ADMIN' or smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'G2G_SUPPLIER_ADMIN'
							or smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'BASIC_SUPPLIER_USER' or smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'G2G_SUPPLIER_USER')) 
							or smPersonnelBackingBean.managedBean.deactivatePersonnel}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.roleList}"/>
							<p:ajax event="change" partialSubmit="true" process="basicBURole" update="softCertId, contrSignId, contrSignSelDropDownId" />
						</p:selectOneMenu>
						<p:message id="basicBURoleMsg" for="basicBURole"
							showSummary="true" showDetail="false" display="icon" /></td>
							
					<td><p:outputLabel
							value="#{lbl['lbl.sm.userprofile.dob']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:calendar showOn="button" navigator="true"
							display="inline" required="true" readonlyInput="true"
							label="#{lbl['lbl.sm.person.dob']}" id="dobDate"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							yearRange="-99:+0" maxdate="#{smPersonnelBackingBean.managedBean.currDate}"
							disabled="#{smPersonnelBackingBean.managedBean.editMode}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.birthDate}" />
						<p:message id="dobDateMsg" for="dobDate"
								showSummary="true" showDetail="false" display="icon" /></td>		
				</tr>
				
				<p:outputPanel rendered="#{empty smPersonnelBackingBean.managedBean.basicSmPersonnel.smAppl or smPersonnelBackingBean.managedBean.basicSmPersonnel.smAppl.supplierType ne 'J'}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.person.isSoftCert']}" /></td>
						<td style="float: left;">
							<p:outputPanel id="softCertId">
								<p:outputLabel value="#{lbl['lbl.txt.yes']}" rendered="#{!smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'CM_USER'}"/>
								<p:outputLabel value="#{lbl['lbl.txt.no']}" rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'CM_USER'}"/>
							</p:outputPanel>
						</td>
					</tr>
					<tr>
						<td><p:outputPanel id="contrSignId">
								<p:outputLabel value="#{lbl['lbl.sm.person.isContrSign']}" 
									rendered="#{!smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'CM_USER'}"/>
							</p:outputPanel>
						</td>		
						<td><p:outputPanel id="contrSignSelDropDownId">
								<p:selectOneRadio value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.contractSignerFlg}"
									rendered="#{!smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'CM_USER'}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
									<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
								</p:selectOneRadio>
							</p:outputPanel>
						</td>
					</tr>
				</p:outputPanel>
			</table>
		</p:panel>

		
		<p:panel toggleable="true" id="addressInfoPanelId" header="#{lbl['lbl.sm.userprofile.addr.info']}">
			
			<table style="width: 100%;">
				<tr>
					<td valign="top" width="50%">
						<p:panel id="PermanentAddressInfo" style="border: none;">
							<table style="width: 100%;">
								<tr>
									<td><u><b><h:outputText
												value="#{lbl['lbl.sm.person.permAddr']} " /></b></u></td>
								</tr>
								<tr>
									<td><p:outputLabel
											value="#{lbl['lbl.sm.address']}" /> <p:outputLabel value="*"
											styleClass="mandatory" /></td>
									<td ><p:inputText
											maxlength="35" required="true" id="permAdd1"
											label="#{lbl['lbl.sm.address']}"
											value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address1}"
											size="35" />
										<p:message id="permAdd1Msg" for="permAdd1"
											showSummary="true" showDetail="false" display="icon" /></td>
								</tr>
								<tr>
									<td></td>
									<td ><p:inputText
											maxlength="35"
											value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address2}"
											size="35" /></td>
								</tr>
								<tr>
									<td></td>
									<td ><p:inputText
											maxlength="35"
											value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address3}"
											size="35" /></td>
								</tr>
								<tr>
									<td></td>
									<td ><p:inputText
											maxlength="35"
											value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address4}"
											size="35" /></td>
								</tr>
								<tr>
									<td><p:outputLabel
											value="#{lbl['lbl.sm.country']}" /> <p:outputLabel value="*"
											styleClass="mandatory" /></td>
									<td ><p:selectOneMenu required="true"
											id="basicPermAddCountryList" label="#{lbl['lbl.sm.country']}"
											value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmCountry.countryId}"
											style="width: 207px;margin-bottom: 5px;">
											<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
											<f:selectItems
												value="#{smPersonnelBackingBean.managedBean.permAddCountryList}" />
											<p:ajax event="change"
												update="basicPermAddStateList, basicPermAddDistrictList, basicPermAddCityList,basicPermAddPostCodePanelId"
												listener="#{smPersonnelBackingBean.updatePermAddLists(smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmCountry.countryId,null,null)}" />
										</p:selectOneMenu>
										<p:message id="basicPermAddCountryListMsg"
											for="basicPermAddCountryList" showSummary="true"
											showDetail="false" display="icon" /></td>
								</tr>
								<tr>
									<td><p:outputLabel
											value="#{lbl['lbl.sm.state']}" /> <p:outputLabel value="*"
											styleClass="mandatory" /></td>
									<td ><p:selectOneMenu required="true"
											label="#{lbl['lbl.sm.state']}" id="basicPermAddStateList"
											value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmState.stateId}"
											style="width: 207px;margin-bottom: 5px;">
											<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
											<f:selectItems
												value="#{smPersonnelBackingBean.managedBean.permAddStateList}" />
											<p:ajax event="change"
												update="basicPermAddDistrictList, basicPermAddCityList"
												listener="#{smPersonnelBackingBean.updatePermAddLists(null,smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmState.stateId,null)}" />
										</p:selectOneMenu>
										<p:message id="basicPermAddStateListMsg"
											for="basicPermAddStateList" showSummary="true"
											showDetail="false" display="icon" /></td>
								</tr>
								<tr>
									<td><p:outputLabel
											value="#{lbl['lbl.sm.district']}" /> <p:outputLabel value="*"
											styleClass="mandatory" /></td>
									<td ><p:selectOneMenu required="true"
											label="#{lbl['lbl.sm.district']}" id="basicPermAddDistrictList"
											value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmDistrict.districtId}"
											style="width: 207px;margin-bottom: 5px;">
											<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
											<f:selectItems
												value="#{smPersonnelBackingBean.managedBean.permAddDistrictList}" />
											<p:ajax event="change" update="basicPermAddCityList"
												listener="#{smPersonnelBackingBean.updatePermAddLists(null,null,smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmDistrict.districtId)}" />
										</p:selectOneMenu>
										<p:message id="basicPermAddDistrictListMsg"
											for="basicPermAddDistrictList" showSummary="true"
											showDetail="false" display="icon" /></td>
								</tr>
								<tr>
									<td><p:outputLabel
											value="#{lbl['lbl.sm.towncity']}" /> <p:outputLabel value="*"
											styleClass="mandatory" /></td>
									<td ><p:selectOneMenu required="true"
											label="#{lbl['lbl.sm.towncity']}" id="basicPermAddCityList"
											value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmCity.cityId}"
											style="width: 207px;margin-bottom: 5px;">
											<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
											<f:selectItems
												value="#{smPersonnelBackingBean.managedBean.permAddCityList}" />
										</p:selectOneMenu>
										<p:message id="basicPermAddCityListMsg"
											for="basicPermAddCityList" showSummary="true"
											showDetail="false" display="icon" /></td>
								</tr>
								<tr>
									<td><p:outputLabel
											value="#{lbl['lbl.sm.postcode']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
									<td>
										<p:outputPanel id="basicPermAddPostCodePanelId">
											<p:outputPanel
												rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmCountry.countryId==smPersonnelBackingBean.managedBean.myCountryId}">
												<p:inputText maxlength="5" required="true"
													label="#{lbl['lbl.sm.postcode']}" id="basicPermAddPostCodeMy"
													value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.postcode}"
													validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
													size="35">
													<f:validator validatorId="postcodeValidator" />
												</p:inputText>
												<p:message id="basicPermAddPostCodeMyMsg" for="basicPermAddPostCodeMy"
													showSummary="true" showDetail="false" display="icon" />
											</p:outputPanel>
											<p:outputPanel
												rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmCountry.countryId!=smPersonnelBackingBean.managedBean.myCountryId}">
												<p:inputText maxlength="10" required="true"
													label="#{lbl['lbl.sm.postcode']}" id="basicPermAddPostCodeForeign"
													value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.postcode}"
													size="35">
												</p:inputText>
												<p:message id="basicPermAddPostCodeForeignMsg"
													for="basicPermAddPostCodeForeign" showSummary="true"
													showDetail="false" display="icon" />
											</p:outputPanel>
										</p:outputPanel>
									</td>
								</tr>
							</table>
						</p:panel>
					</td>
					<td valign="top">
						<p:panel id="MailingAddressInfo" style="border: none;">
							<table style="width: 100%;">
