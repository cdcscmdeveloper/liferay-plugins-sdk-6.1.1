<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<p:panel styleClass="noBorders tr,noBorders td" style="width:100%">
			<div align="right">
				<p:commandButton value="Save" ajax="false" icon="ui-icon-save"
					action="#{smPersonnelBackingBean.save}" />
				<p:commandButton value="Cancel" ajax="false" icon="ui-icon-cancel" immediate="true"
					action="#{smPersonnelBackingBean.cancel}" />
			</div>
		</p:panel>


		<p:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
			<p:panel id="UserProfile" header="Add New User"
				styleClass="noBorders tr,noBorders td" style="width:100%;"
				toggleable="true">
				<table style="width: 100%">
					<tr>
						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="*#{lbl['lbl.sm.userprofile.name']}" /></td>
						<td><p:inputText id="basicBUName"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.name}"
								size="35" required="true"
								label="#{lbl['lbl.sm.userprofile.name']}" /></td>
						<td><p:message id="basicBUNameMsg" for="basicBUName"
								showSummary="true" showDetail="false" display="icon" /></td>

						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="*#{lbl['lbl.sm.userprofile.eprole']}" /></td>
						<td><p:selectOneMenu id="basicBURole" label="#{lbl['lbl.sm.userprofile.eprole']}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole}"
								style="width: 207px;margin-bottom: 5px;" required="true">
								<f:selectItem itemLabel="-- Select One --" itemValue="" />
								<f:selectItem itemLabel="Supplier User"
									itemValue="A"
									itemDisabled="#{smPersonnelBackingBean.managedBean.disableRole}" />
								<f:selectItem itemLabel="Catalog User" itemValue="A" />
							</p:selectOneMenu></td>
						<td><p:message id="basicBURoleMsg" for="basicBURole"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					<tr>
						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="*#{lbl['lbl.sm.userprofile.nationality']}" /></td>
						<td><p:selectOneMenu id="basicBUCountry" label="#{lbl['lbl.sm.userprofile.nationality']}"
								style="width: 207px;margin-bottom: 5px;" required="true">
								<f:selectItem itemLabel="-- Select One--" itemValue="" />
								<f:selectItems
									value="#{smPersonnelBackingBean.managedBean.countryList}" />
							</p:selectOneMenu></td>
						<td><p:message id="basicBUCountryMsg" for="basicBUCountry"
								showSummary="true" showDetail="false" display="icon" /></td>

						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="#{lbl['lbl.sm.userprofile.accountstatus']}" /></td>
						<td><p:selectOneRadio id="accountstatus" required="false"
								value="1" disabled="false">
								<f:selectItem itemLabel="Active" itemValue="1" />
								<f:selectItem itemLabel="Inactive" itemValue="0" />
							</p:selectOneRadio></td>
					</tr>
					<tr>
						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="#{lbl['lbl.sm.userprofile.oldicno']}" /></td>
						<td><p:inputText size="35" /></td>
						<td></td>

						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="*#{lbl['lbl.sm.userprofile.newicno']}" /></td>
						<td><p:inputText id="basicBUNewIC" label="#{lbl['lbl.sm.userprofile.newicno']}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationNo}"
								size="35" required="true" /></td>
						<td><p:message id="basicBUNewICMsg" for="basicBUNewIC"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					<tr>
						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="#{lbl['lbl.sm.userprofile.dob']}" /></td>
						<td><p:calendar
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.birthDate}"
								showOn="button" id="dobDate" pattern="MM/dd/yyyy" /></td>
						<td></td>

						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="*#{lbl['lbl.sm.userprofile.designation']}" /></td>
						<td><p:inputText id="basicBUDes" label="#{lbl['lbl.sm.userprofile.designation']}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.designation}"
								size="35" required="true" /></td>
						<td><p:message id="basicBUDesMsg" for="basicBUDes"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					<tr>
						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="*#{lbl['lbl.sm.userprofile.email']}" /></td>
						<td><p:inputText id="basicBUEmail" label="#{lbl['lbl.sm.userprofile.email']}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.email}"
								size="40" required="true" /></td>
						<td><p:message id="basicBUEmailMsg" for="basicBUEmail"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					<tr>
						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="*#{lbl['lbl.sm.userprofile.phone']}" /></td>
						<td><p:inputText id="basicBUPhone" label="#{lbl['lbl.sm.userprofile.phone']}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.phoneNo}"
								size="35" required="true" /></td>
						<td><p:message id="basicBUPhoneMsg" for="basicBUPhone"
								showSummary="true" showDetail="false" display="icon" /></td>

						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="*#{lbl['lbl.sm.userprofile.mobile']}" /></td>
						<td><p:inputText size="35" label="#{lbl['lbl.sm.userprofile.mobile']}"/></td>
					</tr>
				</table>
			</p:panel>
		</p:panelGrid>
		<p:panel id="AddressInfo" header="Address Info"
			styleClass="noBorders tr,noBorders td" toggleable="true">
			<p:panelGrid columns="2" header="Address Info"
				styleClass="noBorders tr,noBorders td">
				<p:panel id="PermanentAddressInfo" header="Permanent Address"
					styleClass="noBorders tr,noBorders td">
					<table>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="Address" /></td>
							<td class="tdContent" colspan="3"><p:inputText
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address1}"
									size="35" /></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"></td>
							<td class="tdContent" colspan="3"><p:inputText
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address2}"
									size="35" /></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"></td>
							<td class="tdContent" colspan="3"><p:inputText
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address3}"
									size="35" /></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"></td>
							<td class="tdContent" colspan="3"><p:inputText
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.address4}"
									size="35" /></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="*#{lbl['lbl.sm.country']}" /></td>
							<td class="tdContent"><p:selectOneMenu
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmCountry.countryId}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select One --" itemValue="" />
									<f:selectItems
										value="#{smPersonnelBackingBean.managedBean.permAddCountryList}" />
									<p:ajax event="change"
										update="basicPermAddStateList, basicPermAddDistrictList, basicPermAddCityList"
										listener="#{smPersonnelBackingBean.updatePermAddLists(smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmCountry.countryId,null,null)}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="#{lbl['lbl.sm.state']}" /></td>
							<td class="tdContent"><p:selectOneMenu
									id="basicPermAddStateList"
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmState.stateId}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select One --" itemValue="" />
									<f:selectItems
										value="#{smPersonnelBackingBean.managedBean.permAddStateList}" />
									<p:ajax event="change"
										update="basicPermAddDistrictList, basicPermAddCityList"
										listener="#{smPersonnelBackingBean.updatePermAddLists(null,smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmState.stateId,null)}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="#{lbl['lbl.sm.district']}" /></td>
							<td class="tdContent"><p:selectOneMenu
									id="basicPermAddDistrictList"
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmDistrict.districtId}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select One --" itemValue="" />
									<f:selectItems
										value="#{smPersonnelBackingBean.managedBean.permAddDistrictList}" />
									<p:ajax event="change" update="basicPermAddCityList"
										listener="#{smPersonnelBackingBean.updatePermAddLists(null,null,smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmDistrict.districtId)}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="#{lbl['lbl.sm.towncity']}" /></td>
							<td class="tdContent"><p:selectOneMenu
									id="basicPermAddCityList"
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.pmCity.cityId}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select One --" itemValue="" />
									<f:selectItems
										value="#{smPersonnelBackingBean.managedBean.permAddCityList}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="#{lbl['lbl.sm.postcode']}" /></td>
							<td class="tdContent"><p:inputText size="20"
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelPermanentAddress.smAddress.postcode}" /></td>
						</tr>
					</table>
				</p:panel>

				<p:panel id="MailingAddressInfo" header="Mailing Address"
					styleClass="noBorders tr,noBorders td">
					<table>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:selectBooleanCheckbox />
								<p:outputLabel value="Same as permanent address" /></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="Address" /></td>
							<td class="tdContent" colspan="3"><p:inputText
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.address1}"
									size="35" /></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"></td>
							<td class="tdContent" colspan="3"><p:inputText
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.address2}"
									size="35" /></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"></td>
							<td class="tdContent" colspan="3"><p:inputText
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.address3}"
									size="35" /></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"></td>
							<td class="tdContent" colspan="3"><p:inputText
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.address4}"
									size="35" /></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="*#{lbl['lbl.sm.country']}" /></td>
							<td class="tdContent"><p:selectOneMenu
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.pmCountry.countryId}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select One --" itemValue="" />
									<f:selectItems
										value="#{smPersonnelBackingBean.managedBean.mailAddCountryList}" />
									<p:ajax event="change"
										update="basicMailAddStateList, basicMailAddDistrictList, basicMailAddCityList"
										listener="#{smPersonnelBackingBean.updateMailAddLists(smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.pmCountry.countryId,null,null)}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="#{lbl['lbl.sm.state']}" /></td>
							<td class="tdContent"><p:selectOneMenu
									id="basicMailAddStateList"
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.pmState.stateId}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select One --" itemValue="" />
									<f:selectItems
										value="#{smPersonnelBackingBean.managedBean.mailAddStateList}" />
									<p:ajax event="change"
										update="basicMailAddDistrictList, basicMailAddCityList"
										listener="#{smPersonnelBackingBean.updateMailAddLists(null,smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.pmState.stateId,null)}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="#{lbl['lbl.sm.district']}" /></td>
							<td class="tdContent"><p:selectOneMenu
									id="basicMailAddDistrictList"
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.pmDistrict.districtId}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select One --" itemValue="" />
									<f:selectItems
										value="#{smPersonnelBackingBean.managedBean.mailAddDistrictList}" />
									<p:ajax event="change" update="basicMailAddCityList"
										listener="#{smPersonnelBackingBean.updateMailAddLists(null,null,smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.pmDistrict.districtId)}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="#{lbl['lbl.sm.towncity']}" /></td>
							<td class="tdContent"><p:selectOneMenu
									id="basicMailAddCityList"
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.pmCity.cityId}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="-- Select One --" itemValue="" />
									<f:selectItems
										value="#{smPersonnelBackingBean.managedBean.mailAddCityList}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="#{lbl['lbl.sm.postcode']}" /></td>
							<td class="tdContent"><p:inputText size="20"
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.postcode}" /></td>
						</tr>
					</table>
				</p:panel>
			</p:panelGrid>
		</p:panel>

		<p:panel header="Account Privileges"
			styleClass="noBorders tr,noBorders td" style="width:100%;"
			toggleable="true" id="accountPrivilegesPanel">
			<table>
				<tr>
					<td><p:outputLabel value="Is this an authorized personnel ? " /></td>
					<td><p:selectOneRadio
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.authorizedFlg}">
							<f:selectItem itemLabel="Yes" itemValue="1" />
							<f:selectItem itemLabel="No" itemValue="0" />
							<p:ajax event="change" update="accountPrivilegesPanel"
								listener="#{smPersonnelBackingBean.assignAccountPrivilege}" />
						</p:selectOneRadio></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="Issue soft cert to this personnel ? "
							rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.authorizedFlg eq '1'}" /></td>
					<td><p:selectOneRadio
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg}"
							rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.authorizedFlg eq '1'}">
							<f:selectItem itemLabel="Yes" itemValue="2" />
							<f:selectItem itemLabel="No" itemValue="0" />
							<p:ajax event="change" update="accountPrivilegesPanel"
								listener="#{smPersonnelBackingBean.assignAccountPrivilege}" />
						</p:selectOneRadio></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="Is this personnel a contract signer ? "
							rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '2'}" /></td>
					<td><p:selectOneRadio
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.contractSignerFlg}"
							rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '2'}">
							<f:selectItem itemLabel="Yes" itemValue="1" />
							<f:selectItem itemLabel="No" itemValue="0" />
						</p:selectOneRadio></td>
				</tr>
			</table>
		</p:panel>

	</ui:define>
</ui:composition>
