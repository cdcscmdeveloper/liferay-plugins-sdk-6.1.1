<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:define name="contentSection">
	<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"/>  

	<p:panel styleClass="noBorders tr,noBorders td" style="width:100%">
		<div align="right">
			<p:commandButton value="Save" ajax="false" icon="ui-icon-save" action="#{smPersonnelBackingBean.saveNewUser(smPersonnelBackingBean.managedBean.newSmPersonnel)}"/>
		</div>		
	</p:panel>

	<p:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
	<p:panel id="UserProfile" header="Add New User" styleClass="noBorders tr,noBorders td" style="width:100%;">
		<table>
			 	<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Name" /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnel.name}" size="35" /></td>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="eP Role : " /></td>
					<td><p:selectOneMenu value="#{smPersonnelBackingBean.managedBean.newSmPersonnel.epRole}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItem itemLabel="Supplier Admin" itemValue="A" />
							<f:selectItem itemLabel="Supplier User" itemValue="U" />
							<f:selectItem itemLabel="Catalog User" itemValue="C" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Nationality" /></td>
					<td><p:selectOneMenu style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One--" itemValue="" />
						<f:selectItems value="#{smPersonnelBackingBean.managedBean.countryList}" />
					</p:selectOneMenu></td>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Account Status" /></td>
					<td>
						<p:selectOneRadio  id="accountstatus" required="false" value="1" disabled="false">
							<f:selectItem itemLabel="Active" itemValue="1" />
							<f:selectItem itemLabel="Inactive" itemValue="0" />
						</p:selectOneRadio>	
					</td>
				</tr>
				<tr>		
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Old IC/Passport No." /></td>
					<td><p:inputText size="35" /></td>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* New IC/Passport No." /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnel.identificationNo}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="DOB" /></td>
					<td><p:calendar value="#{smPersonnelBackingBean.managedBean.newSmPersonnel.birthDate}" showOn="button" id="dobDate" pattern="MM/dd/yyyy"/></td>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Designation" /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnel.designation}" size="35" /></td>
				</tr>		
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Email" /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnel.email}" size="40" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Phn No." /></td>
					<td><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnel.phoneNo}" size="35" /></td>
					
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="* Mobile No." /></td>
					<td><p:inputText size="35" /></td>
				</tr>
		</table>	
	</p:panel>
	</p:panelGrid>
	<p:panel id="AddressInfo" header="Address Info" styleClass="noBorders tr,noBorders td">
	<p:panelGrid columns="2" header="Address Info" styleClass="noBorders tr,noBorders td">
		<p:panel id="PermanentAddressInfo" header="Permanent Address" styleClass="noBorders tr,noBorders td">
			<table>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Address" /></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnelPermanentAddress.address1}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnelPermanentAddress.address2}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnelPermanentAddress.address3}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnelPermanentAddress.address4}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Country" /></td>
					<td class="tdContent"><p:selectOneMenu value="#{smPersonnelBackingBean.managedBean.newSmPersonnelPermanentAddress.pmCountry.countryId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.permAddCountryList}" />
							<p:ajax event="change" update="newPermAddStateList, newPermAddDistrictList, newPermAddCityList"
							listener="#{smPersonnelBackingBean.updatePermAddLists(smPersonnelBackingBean.managedBean.newSmPersonnelPermanentAddress.pmCountry.countryId,null,null)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="State" /></td>
					<td class="tdContent"><p:selectOneMenu id="newPermAddStateList" value="#{smPersonnelBackingBean.managedBean.newSmPersonnelPermanentAddress.pmState.stateId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.permAddStateList}" />
							<p:ajax event="change" update="newPermAddDistrictList, newPermAddCityList"
							listener="#{smPersonnelBackingBean.updatePermAddLists(null,smPersonnelBackingBean.managedBean.newSmPersonnelPermanentAddress.pmState.stateId,null)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="District" /></td>
					<td class="tdContent"><p:selectOneMenu id="newPermAddDistrictList" value="#{smPersonnelBackingBean.managedBean.newSmPersonnelPermanentAddress.pmDistrict.districtId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.permAddDistrictList}" />
							<p:ajax event="change" update="newPermAddCityList"
							listener="#{smPersonnelBackingBean.updatePermAddLists(null,null,smPersonnelBackingBean.managedBean.newSmPersonnelPermanentAddress.pmDistrict.districtId)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="City" /></td>
					<td class="tdContent"><p:selectOneMenu id="newPermAddCityList" value="#{smPersonnelBackingBean.managedBean.newSmPersonnelPermanentAddress.pmCity.cityId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.permAddCityList}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Postcode" /></td>
					<td class="tdContent" ><p:inputText size="20" value="#{smPersonnelBackingBean.managedBean.newSmPersonnelPermanentAddress.postcode}"/></td>
				</tr>
			</table>
		</p:panel>
		
		<p:panel id="MailingAddressInfo" header="Mailing Address" styleClass="noBorders tr,noBorders td">
			<table>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:selectBooleanCheckbox /><p:outputLabel value="Same as permanent address" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Address" /></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnelMailingAddress.address1}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnelMailingAddress.address2}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnelMailingAddress.address3}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"></td>
					<td class="tdContent" colspan="3"><p:inputText value="#{smPersonnelBackingBean.managedBean.newSmPersonnelMailingAddress.address4}" size="35" /></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Country" /></td>
					<td class="tdContent"><p:selectOneMenu value="#{smPersonnelBackingBean.managedBean.newSmPersonnelMailingAddress.pmCountry.countryId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.mailAddCountryList}" />
							<p:ajax event="change" update="newMailAddStateList, newMailAddDistrictList, newMailAddCityList"
							listener="#{smPersonnelBackingBean.updateMailAddLists(smPersonnelBackingBean.managedBean.newSmPersonnelMailingAddress.pmCountry.countryId,null,null)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="State" /></td>
					<td class="tdContent"><p:selectOneMenu id="newMailAddStateList" value="#{smPersonnelBackingBean.managedBean.newSmPersonnelMailingAddress.pmState.stateId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.mailAddStateList}" />
							<p:ajax event="change" update="newMailAddDistrictList, newMailAddCityList"
							listener="#{smPersonnelBackingBean.updateMailAddLists(null,smPersonnelBackingBean.managedBean.newSmPersonnelMailingAddress.pmState.stateId,null)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="District" /></td>
					<td class="tdContent"><p:selectOneMenu id="newMailAddDistrictList" value="#{smPersonnelBackingBean.managedBean.newSmPersonnelMailingAddress.pmDistrict.districtId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.mailAddDistrictList}" />
							<p:ajax event="change" update="newMailAddCityList"
							listener="#{smPersonnelBackingBean.updateMailAddLists(null,null,smPersonnelBackingBean.managedBean.newSmPersonnelMailingAddress.pmDistrict.districtId)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="City" /></td>
					<td class="tdContent"><p:selectOneMenu id="newMailAddCityList" value="#{smPersonnelBackingBean.managedBean.newSmPersonnelMailingAddress.pmCity.cityId}" style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select One --" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.mailAddCityList}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="white-space:nowrap; float:left;"><p:outputLabel value="Postcode" /></td>
					<td class="tdContent" ><p:inputText size="20" value="#{smPersonnelBackingBean.managedBean.newSmPersonnelMailingAddress.postcode}"/></td>
				</tr>
			</table>
		</p:panel>
	</p:panelGrid>
	</p:panel>
	<p:panel id="AccountPrivileges" header="Account Privileges" styleClass="noBorders tr,noBorders td" style="width:100%;">
		<table>
			<tr>
				<td style="white-space:nowrap; float:left;"><p:outputLabel value="Is Authorized?" /></td>
				<td class="tdContent">
					<p:selectOneRadio  id="isauthorized" required="false" value="A"
									disabled="false">
						<f:selectItem itemLabel="Yes" itemValue="V" />
						<f:selectItem itemLabel="No" itemValue="A" />
					</p:selectOneRadio>	
				</td>
			</tr>
			<tr>
				<td style="white-space:nowrap; float:left;"><p:outputLabel value="Issue soft cert?" /></td>
				<td class="tdContent">
					<p:selectOneRadio  id="issuesoftcert" required="false" value="A"
									disabled="false">
						<f:selectItem itemLabel="Yes" itemValue="V" />
						<f:selectItem itemLabel="No" itemValue="A" />
					</p:selectOneRadio>	
				</td>
			</tr>
			<tr>
				<td style="white-space:nowrap; float:left;"><p:outputLabel value="Is Contract Signer?" /></td>
				<td class="tdContent">
					<p:selectOneRadio  id="iscontractsigner" required="false" value="A"
									disabled="false">
						<f:selectItem itemLabel="Yes" itemValue="V" />
						<f:selectItem itemLabel="No" itemValue="A" />
					</p:selectOneRadio>	
				</td>
			</tr>
		</table>
	</p:panel>		
	
	<p:panel styleClass="noBorders tr,noBorders td" style="width:100%">
		<div align="center">
			<p:commandButton value="Update" ajax="false" icon="ui-icon-save" />
			<p:commandButton value="Cancel" ajax="false" icon="ui-icon-cancel" action="#{smPersonnelBackingBean.cancel}"/>
		</div>	
	</p:panel>
	
</ui:define>	
</ui:composition>
