<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<p:panel styleClass="noBorders tr,noBorders td" style="width:100%">
			<div align="right">
				<p:commandButton value="Save" ajax="false" icon="ui-icon-save"
					action="#{smPersonnelBackingBean.save}" />
				<p:commandButton value="Cancel" ajax="false" icon="ui-icon-cancel"
					immediate="true" action="#{smPersonnelBackingBean.cancel}" />
			</div>
		</p:panel>


		<p:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
			<p:panel id="UserProfile" header="Add New User"
				styleClass="noBorders tr,noBorders td" style="width:100%;"
				toggleable="true">
				<table style="width: 100%">
					<tr>
						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="#{lbl['lbl.sm.userprofile.name']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:inputText id="basicBUName"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.name}"
								size="35" required="true"
								label="#{lbl['lbl.sm.userprofile.name']}" /></td>
						<td><p:message id="basicBUNameMsg" for="basicBUName"
								showSummary="true" showDetail="false" display="icon" /></td>

						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="#{lbl['lbl.sm.userprofile.eprole']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:selectOneMenu id="basicBURole"
								label="#{lbl['lbl.sm.userprofile.eprole']}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole}"
								style="width: 207px;margin-bottom: 5px;" required="true">
								<f:selectItem itemLabel="- Select One -" itemValue="" />
								<f:selectItem itemLabel="Supplier User" itemValue="U"
									itemDisabled="#{smPersonnelBackingBean.managedBean.disableRole}" />
								<f:selectItem itemLabel="Catalog User" itemValue="C" />
								<p:ajax event="change" partialSubmit="true" process="@this"
									listener="#{smPersonnelBackingBean.displayPrivileges}"
									update=":form:accountPrivilegesPanel" />
							</p:selectOneMenu></td>
						<td><p:message id="basicBURoleMsg" for="basicBURole"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					<tr>
						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="#{lbl['lbl.sm.userprofile.nationality']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:selectOneMenu id="basicBUCountry"
								label="#{lbl['lbl.sm.userprofile.nationality']}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.pmCountry.countryId}"
								style="width: 207px;margin-bottom: 5px;" required="true">
								<f:selectItem itemLabel="- Select One -" itemValue="" />
								<f:selectItems
									value="#{smPersonnelBackingBean.managedBean.countryList}" />
							</p:selectOneMenu></td>
						<td><p:message id="basicBUCountryMsg" for="basicBUCountry"
								showSummary="true" showDetail="false" display="icon" /></td>

						<!-- <td style="white-space: nowrap; float: left;"><p:outputLabel
								value="#{lbl['lbl.sm.userprofile.accountstatus']}" /></td>
						<td><p:selectOneRadio id="accountstatus" required="false"
								value="1" disabled="false">
								<f:selectItem itemLabel="Active" itemValue="1" />
								<f:selectItem itemLabel="Inactive" itemValue="0" />
							</p:selectOneRadio></td> -->
					</tr>
					<tr>
						<!-- <td style="white-space: nowrap; float: left;"><p:outputLabel
								value="#{lbl['lbl.sm.userprofile.oldicno']}" /></td>
						<td><p:inputText size="35" /></td>
						<td></td> -->

						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="#{lbl['lbl.sm.identificationtype']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:selectOneMenu id="basicBUIdType" required="true"
								label="#{lbl['lbl.sm.identificationtype']}"

									value="#{smPersonnelBackingBean.getDropdownValues('ID')}" />
								<p:ajax event="change" partialSubmit="true" process="@this"
									listener="#{smPersonnelBackingBean.assignPersonIdentType}"
									update="basicBUIdTypePan,basicBUIdTypeLblPan" />
							</p:selectOneMenu></td>
						<td><p:message id="basicBUIdTypeMsg" for="basicBUIdType"
								showSummary="true" showDetail="false" display="icon" /></td>

								id="basicBUIdTypeLblPan">
								<p:outputLabel
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'P' ? lbl['lbl.sm.person.psptNum'] : (smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'I' ? lbl['lbl.sm.person.icNum'] : lbl['lbl.sm.person.armyNum'])}"
									id="equiPerIcNumLbl"
									rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'I' or smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'A' or smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'P'}" />
								<p:outputLabel value="*" styleClass="mandatory"
									rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'I' or smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'A' or smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'P'}" />
							</p:outputPanel></td>

						<td><p:outputPanel id="basicBUIdTypePan">
								<p:inputText label="#{lbl['lbl.sm.person.icNum']}"
									required="true" id="basicBUIcNum"
									rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'I'}"
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationNo}"
									size="35" maxlength="12"
									validatorMessage="#{lbl['lbl.sm.person.icNum']} - #{lbl['lbl.sm.invalidNo']}">
									<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
								</p:inputText>
								<p:inputText
									label="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'P' ? lbl['lbl.sm.person.psptNum'] : lbl['lbl.sm.person.armyNum']}"
									required="true" id="basicBUPasptNum"
									rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'P' or smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'A'}"
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationNo}"
									size="35" maxlength="12">
								</p:inputText>
								<p:message id="basicBUIcNumMsg" for="basicBUIcNum"
									showSummary="true" showDetail="false" display="icon" />
								<p:message id="basicBUPasptNumMsg" for="basicBUPasptNum"
									showSummary="true" showDetail="false" display="icon" />
							</p:outputPanel></td>
						<td></td>


						<!-- <td style="white-space: nowrap; float: left;"><p:outputLabel
								value="*#{lbl['lbl.sm.userprofile.newicno']}" /></td>
						<td><p:inputText id="basicBUNewIC" label="#{lbl['lbl.sm.userprofile.newicno']}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationNo}"
								size="35" required="true" /></td>
						<td><p:message id="basicBUNewICMsg" for="basicBUNewIC"
								showSummary="true" showDetail="false" display="icon" /></td> -->
					</tr>
					<tr>
						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="#{lbl['lbl.sm.userprofile.dob']}" /></td>
						<td><p:calendar
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.birthDate}"
								showOn="button" id="dobDate" pattern="MM/dd/yyyy" /></td>
						<td></td>

						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="#{lbl['lbl.sm.userprofile.designation']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:inputText id="basicBUDes"
								label="#{lbl['lbl.sm.userprofile.designation']}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.designation}"
								size="35" required="true" /></td>
						<td><p:message id="basicBUDesMsg" for="basicBUDes"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					<tr>
						<td style="white-space: nowrap; float: left;"><p:outputLabel

								value="*" styleClass="mandatory" /></td>
						<td><p:inputText id="basicBUEmail"
								label="#{lbl['lbl.sm.userprofile.email']}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.email}"
								size="40" required="true" /></td>
						<td><p:message id="basicBUEmailMsg" for="basicBUEmail"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					<tr>

						<td><p:message id="basicBUPhoneMsg" for="basicBUPhone"
								showSummary="true" showDetail="false" display="icon" /></td>

						<td style="white-space: nowrap; float: left;"><p:outputLabel
								value="#{lbl['lbl.sm.userprofile.mobile']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:inputText id="basicBUMobile"
								label="#{lbl['lbl.sm.userprofile.mobile']}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileNo}"
								size="35" required="true" /></td>
						<td><p:message id="basicBUMobileMsg" for="basicBUMobile"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
				</table>
			</p:panel>
		</p:panelGrid>
		<p:panel id="AddressInfo" header="Address Info"

						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="#{lbl['lbl.sm.towncity']}" /> <p:outputLabel value="*"
									styleClass="mandatory" /></td>
							<td class="tdContent"><p:selectOneMenu required="true"
									disabled="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.sameAsPerm}"
									id="basicMailAddCityList" label="#{lbl['lbl.sm.towncity']}"
									value="#{smPersonnelBackingBean.managedBean.basicSmPersonnelMailingAddress.smAddress.pmCity.cityId}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="- Select One -" itemValue="" />
									<f:selectItems
										value="#{smPersonnelBackingBean.managedBean.mailAddCityList}" />
								</p:selectOneMenu> <p:message id="basicMailAddCityListMsg"
									for="basicMailAddCityList" showSummary="true"
									showDetail="false" display="icon" /></td>
						</tr>
						<tr>
							<td style="white-space: nowrap; float: left;"><p:outputLabel
									value="#{lbl['lbl.sm.postcode']}" /></td>
							<td class="tdContent"><p:inputText size="10" maxlength="10"

					</table>

			</p:panelGrid>
		</p:panel>
		<p:outputPanel id="accountPrivilegesPanel">
			<p:panel header="Account Privileges"
				rendered="#{smPersonnelBackingBean.managedBean.renderPrivilegesPanel}"
				styleClass="noBorders tr,noBorders td" style="width:100%;"
				toggleable="true">

				<table>
					<tr>
						<td><p:outputLabel value="Is this an authorized personnel ? " /></td>
						<td><p:selectOneRadio
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.authorizedFlg}">
								<f:selectItem itemLabel="Yes" itemValue="1" />
								<f:selectItem itemLabel="No" itemValue="0" />
								<p:ajax event="change" update="accountPrivilegesPanel"
									listener="#{smPersonnelBackingBean.assignAccountPrivilege}" />
							</p:selectOneRadio></td>
					</tr>
					<tr>
						<td><p:outputLabel
								value="Issue soft cert to this personnel ? "
								rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.authorizedFlg eq '1'}" /></td>
						<td><p:selectOneRadio
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg}"
								rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.authorizedFlg eq '1'}">
								<f:selectItem itemLabel="Yes" itemValue="2" />
								<f:selectItem itemLabel="No" itemValue="0" />
								<p:ajax event="change" update="accountPrivilegesPanel"
									listener="#{smPersonnelBackingBean.assignAccountPrivilege}" />
							</p:selectOneRadio></td>
					</tr>
					<tr>
						<td><p:outputLabel
								value="Is this personnel a contract signer ? "
								rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '2'}" /></td>
						<td><p:selectOneRadio
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.contractSignerFlg}"
								rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq '2'}">
								<f:selectItem itemLabel="Yes" itemValue="1" />
								<f:selectItem itemLabel="No" itemValue="0" />
							</p:selectOneRadio></td>
					</tr>
				</table>
			</p:panel>
		</p:outputPanel>
	</ui:define>
