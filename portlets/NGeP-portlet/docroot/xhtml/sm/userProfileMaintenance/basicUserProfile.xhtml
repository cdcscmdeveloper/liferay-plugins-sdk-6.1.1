<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		
		<p:blockUI block=":form" widgetVar="blockWidget">

		<table style="width: 100%;">
			<tr>
				<td>

				<td style="white-space: nowrap; float: right;">
				<!-- #34159 - START - add param disablevalidation -->
					<p:commandButton value="#{lbl['lbl.sm.button.save']}" update=":form"
						action="#{smPersonnelBackingBean.save}" onclick="blockWidget.show()" oncomplete="blockWidget.hide()" >
						<f:param name="disableValidation" value="true" />
					</p:commandButton>
				<!-- #34159 - END -->
				</td>
			</tr>
		</table>

				<h:outputText value="#{lbl['lbl.sm.userprofile.edit']}" rendered="#{smPersonnelBackingBean.managedBean.editMode}"/>

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel rendered="#{smPersonnelBackingBean.managedBean.editMode}"
							value="#{lbl['lbl.sm.userprofile.accountstatus']}" /></td>
					<td><p:selectOneRadio id="accountstatus" required="false"
							value="#{smPersonnelBackingBean.managedBean.accountStatus}" disabled="#{smPersonnelBackingBean.managedBean.disabledActivateAndDeactivate}"
							rendered="#{smPersonnelBackingBean.managedBean.editMode}">
							<f:selectItem itemLabel="#{smPersonnelBackingBean.managedBean.deactivatePersonnel?lbl['lbl.sm.accountstatus.reactivate']:lbl['lbl.sm.accountstatus.active']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.accountstatus.deactivate']}" itemValue="0" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.accountstatus.terminate']}" itemValue="9" 
								itemDisabled="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq 3}"/>

					<td></td>

							<p:message id="terminateReasonMsg"
							for="terminateReasonId" showSummary="true" showDetail="false"
							display="icon" />
						</td>
						<td></td>
						<td></td>
					</tr>
				</p:outputPanel>
				<tr>

							value="#{lbl['lbl.sm.userprofile.name']}" /> <p:outputLabel

							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.name}"
							size="35" required="true" maxlength="80"
							label="#{lbl['lbl.sm.userprofile.name']}" disabled="#{smPersonnelBackingBean.managedBean.editMode}"/>

							showSummary="true" showDetail="false" display="icon" /></td>

					<td></td>
					<td></td>
				</tr>
				<tr>

							label="#{lbl['lbl.pm.profiles.userdetails.salutation']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.title.salutationId}"
							style="width: 207px;margin-bottom: 5px;" required="true">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{smPersonnelBackingBean.managedBean.salutationItems}" />

						<p:message id="basicBUSalutationMsg" for="basicBUSalutation"
							showSummary="true" showDetail="false" display="icon" /></td>

					<td><p:outputLabel

							disabled="true">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{smPersonnelBackingBean.managedBean.countryList}" />
						</p:selectOneMenu>
						<p:message id="basicBUCountryMsg" for="basicBUCountry"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>

							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationTypeId}"
							style="width:200px" disabled="true">
							<f:selectItems
								value="#{smPersonnelBackingBean.managedBean.idTypes}" />
							<p:ajax event="change" partialSubmit="true" process="@this"
								listener="#{smPersonnelBackingBean.assignPersonIdentType}"
								update="basicBUIdTypePan,basicBUIdTypeLblPan" />

						<p:message id="basicBUIdTypeMsg" for="basicBUIdType"

					<td><p:outputPanel
							id="basicBUIdTypeLblPan">

								id="equiPerIcNumLbl" />
							<p:outputLabel value="*" styleClass="mandatory" />
						</p:outputPanel></td>

					<td><p:outputPanel id="basicBUIdTypePan">
							<p:inputText label="#{lbl['lbl.sm.userprofile.idno']}"
								required="true" id="basicBUIcNum"
								requiredMessage="#{lbl['lbl.sm.icNo.required']}"
								rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode eq 'I'}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationNo}"
								size="35" maxlength="12"
								validatorMessage="#{lbl['lbl.sm.userprofile.idno']} - #{lbl['lbl.sm.invalidNo']}"
								disabled="#{smPersonnelBackingBean.managedBean.editMode}">
								<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
							</p:inputText>
							<p:inputText
								label="#{lbl['lbl.sm.userprofile.idno']}"
								required="true" id="basicBUPasptNum"
								rendered="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationType.parameterCode ne 'I'}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.identificationNo}"

								showSummary="true" showDetail="false" display="icon" />

<!-- #13208 - START -->
				<tr>

							showSummary="true" showDetail="false" display="icon" />
					</td>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.userprofile.unit']}"/>
						<p:outputLabel value="*" styleClass="mandatory" />

						showSummary="true" showDetail="false" display="icon"/>
					</td>
				</tr>

				<!-- #35178 - Start : Remove disabled for email -->

							label="#{lbl['lbl.sm.userprofile.email']}"

							validatorMessage="#{lbl['lbl.sm.userprofile.email']} - #{lbl['lbl.sm.invalidEmail']}"
							size="40" required="true">
							<f:validateRegex
						pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
							</p:inputText>
						<p:message id="basicBUEmailMsg" for="basicBUEmail"
							showSummary="true" showDetail="false" display="icon" /></td>

					<td><p:outputLabel
							value="#{lbl['lbl.sm.userprofile.designation']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>

							label="#{lbl['lbl.sm.userprofile.designation']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.designation}"

							showSummary="true" showDetail="false" display="icon" /></td>

				<!-- #35178 - END -->

						<ac:phone id="basicBUPhone" isMobile="false" label="#{lbl['lbl.sm.phoneno']}"
							countryCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.phoneCountry}" 
							areaCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.phoneArea}" 
							number="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.phoneNo}"  
							validatorMessage="#{lbl['lbl.sm.phoneno']} - #{lbl['lbl.sm.invalidNo']}" />
					</td>

					<td><p:outputLabel
							value="#{lbl['lbl.sm.mobileNo']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<ac:phone id="basicBUMobile" label="#{lbl['lbl.sm.mobileNo']}"
							countryCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileCountry}" 
							areaCode="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileArea}" 
							number="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileNo}" 
							isMobile="true" required="true"
							validatorMessage="#{lbl['lbl.sm.mobileNo']} - #{lbl['lbl.sm.invalidNo']}"
							telcoId="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.mobileTelcoId}" />
					</td>
				</tr>
				
				<tr>
					<td><p:outputLabel id="basicBURoleLabel"
							value="#{lbl['lbl.sm.userprofile.eprole']}" /> <p:outputLabel id="basicBURoleMandatory"
							value="*" styleClass="mandatory" />
					</td>
					<td><p:selectOneMenu id="basicBURole" 
							label="#{lbl['lbl.sm.userprofile.eprole']}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole}"
							style="width: 207px;margin-bottom: 5px;" required="true" 
							disabled="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'BASIC_SUPPLIER_ADMIN' 
								or smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'G2G_ADMIN'
								or smPersonnelBackingBean.managedBean.basicSmPersonnel.softcertFlg eq 3
								or smPersonnelBackingBean.managedBean.deactivatePersonnel}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems value="#{smPersonnelBackingBean.managedBean.roleList}"/>
							<p:ajax event="change" partialSubmit="true" process="@this" listener="#{smPersonnelBackingBean.onChangeRole}"
								update="softCertOutPanelId,:#{p:component('contractOutPanelId')}" 
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
						</p:selectOneMenu>
						<p:message id="basicBURoleMsg" for="basicBURole"
							showSummary="true" showDetail="false" display="icon" /></td>
							
					<td><p:outputLabel
							value="#{lbl['lbl.sm.userprofile.dob']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:calendar showOn="button" navigator="true"
							display="inline" required="true" readonlyInput="true"
							label="#{lbl['lbl.sm.person.dob']}" id="dobDate"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							yearRange="-99:+0" maxdate="#{smPersonnelBackingBean.managedBean.currDate}"
							disabled="#{smPersonnelBackingBean.managedBean.editMode}"
							value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.birthDate}" />
						<p:message id="dobDateMsg" for="dobDate"
								showSummary="true" showDetail="false" display="icon" /></td>		
				</tr>
				
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.person.composition.certStatus']} :" />
					</td>
					<td>
						<p:outputPanel id="softCertOutPanelId">
							<ac:smSoftcertStatus personnel="#{smPersonnelBackingBean.managedBean.basicSmPersonnel}" />
						</p:outputPanel>
					</td>
				</tr>
				
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.person.isContrSign']}" /></td>		
					<td>
						<p:outputPanel id="contractOutPanelId">
							<p:selectOneRadio disabled="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'CM_USER' 
								or empty smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole 
								or smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'BASIC_SUPPLIER_ADMIN' 
								or smPersonnelBackingBean.managedBean.basicSmPersonnel.epRole eq 'G2G_ADMIN'}"
								value="#{smPersonnelBackingBean.managedBean.basicSmPersonnel.contractSignerFlg}" >
								<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1" />
								<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0" />
							</p:selectOneRadio>
						</p:outputPanel>
					</td>
				</tr>
			</table>
		</p:panel>
