<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" escape="false" />

		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<h:panelGrid id="search" style="width:100%;">
			<p:panel header="#{lbl['lbl.sm.userprofile.authorized.personnels']}"
				toggleable="true">
				<p:outputPanel id="smPersonnelUserMaintenance">
					<table>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.person.name']}" /></td>
							<td><p:inputText id="mofspName"
									value="#{smPersonnelBackingBean.managedBean.spName}" size="35"
									maxlength="80" label="{#lbl['lbl.sm.userprofile.name']}"></p:inputText></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.nationality']}" /></td>
							<td><p:selectOneMenu id="mofspCountry"
									label="#{lbl['lbl.sm.person.nationality.origin']}"
									value="#{smPersonnelBackingBean.managedBean.spCountryId}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
									<f:selectItems
										value="#{smPersonnelBackingBean.managedBean.countryList}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.activation.status']}" /></td>
							<td><p:selectOneMenu id="mofspRecordStatus"
									value="#{smPersonnelBackingBean.managedBean.spRecordStatus}">
									<f:selectItem itemLabel="#{lbl['lbl.cm.selectOne']}"
										itemValue="0" />
									<f:selectItem
										itemLabel="#{lbl['lbl.sm.activation.status.activated']}"
										itemValue="1" />
									<f:selectItem
										itemLabel="#{lbl['lbl.sm.activation.status.pending']}"
										itemValue="8" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.person.composition.certStatus']}" /></td>
							<td><p:selectOneMenu id="mofspSoftcert"
									value="#{smPersonnelBackingBean.managedBean.spSoftcertFlg}">
									<f:selectItem itemLabel="#{lbl['lbl.cm.selectOne']}"
										itemValue="0" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.softcert.flg.pending']}"
										itemValue="4" />
									<f:selectItem
										itemLabel="#{lbl['lbl.sm.softcert.flg.requested']}"
										itemValue="2" />
									<f:selectItem
										itemLabel="#{lbl['lbl.sm.softcert.flg.processing']}"
										itemValue="3" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.softcert.flg.issued']}"
										itemValue="1" />
									<f:selectItem
										itemLabel="#{lbl['lbl.sm.softcert.flg.rejected']}"
										itemValue="6" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.softcert.flg.failed']}"
										itemValue="9" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.softcert.flg.revoked']}"
										itemValue="5" />
									<f:selectItem itemLabel="#{lbl['lbl.sm.softcert.flg.renew']}"
										itemValue="7" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sm.userprofile.eprole']}" /></td>
							<td><p:selectOneMenu id="mofspEpRole"
									label="#{lbl['lbl.sm.userprofile.eprole']}"
									value="#{smPersonnelBackingBean.managedBean.spEpRole}"
									style="width: 207px;margin-bottom: 5px;">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
									<f:selectItems
										value="#{smPersonnelBackingBean.managedBean.roleList}" />
								</p:selectOneMenu></td>
						</tr>
						<tr width="100">
							<td colspan="2">
								<div style="text-align: right;">
									<p:commandButton value="#{lbl['lbl.btn.search']}"
										action="#{smPersonnelBackingBean.searchMOFSmPersonnel}"
										update="@form" onstart="blockWidget.show()"
										oncomplete="blockWidget.hide()" />
									<p:commandButton value="#{lbl['lbl.btn.reset']}"
										process="@this" update="@form"
										action="#{smPersonnelBackingBean.resetMOFSmPersonnel}" />
								</div>
							</td>
						</tr>
					</table>
				</p:outputPanel>
				<p:dataTable id="smPersonnelListId"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{smPersonnelBackingBean.managedBean.smPersonnelList}"
					var="personnel" rowKey="#{personnel}" rowIndexVar="index" rows="10">
					<ac:paginator for="smPersonnelListId" />
					<p:column headerText="#{lbl['lbl.sm.userprofile.num']}">
						<h:outputText value="#{index+1}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.userprofile.name']}">
						<h:outputText value="#{personnel.name}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.nationality']}">
						<h:outputText value="#{personnel.pmCountry.countryName}" />
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sm.person.composition.certStatus']}">
						<ac:smSoftcertStatus personnel="#{personnel}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.userprofile.accountstatus']}">
						<h:outputText value="#{lbl['lbl.sm.accountstatus.active']}"
							rendered="#{personnel.recordStatusFlg eq '1' and not empty personnel.epRole}" />
						<h:outputText value="#{lbl['lbl.sm.accountstatus.deactivate']}"
							rendered="#{personnel.recordStatusFlg eq '1' and empty personnel.epRole}" />
						<h:outputText
							value="#{lbl['lbl.sm.accountstatus.pendingactivation']}"
							rendered="#{personnel.recordStatusFlg ne '1'}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.userprofile.eprole']}">
						<ac:smRoleDesc roleCode="#{personnel.epRole}"
							backingBean="#{smPersonnelBackingBean}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.userprofile.action']}"
						style="text-align: center  !important;">
						<p:commandLink title="#{lbl['lbl.sm.userprofile.edit']}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							action="#{smPersonnelBackingBean.navigateToUpdateMOFUserPage(personnel.personnelId)}"
							update="@form">
							<p:graphicImage value="/css/images/design/edit.png"
								title="#{lbl['lbl.sm.edit']}"></p:graphicImage>
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</p:panel>
		</h:panelGrid>
	</ui:define>
</ui:composition>
