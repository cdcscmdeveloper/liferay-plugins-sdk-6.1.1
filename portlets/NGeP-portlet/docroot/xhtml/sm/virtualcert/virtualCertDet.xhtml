<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" showSummary="false" autoUpdate="true" escape="false" closable="false"/> 
		<p:panel header="#{lbl['lbl.sm.virtual.cert']}">
			<p:dataTable id="vcDt" rowIndexVar="index"
				value="#{virtualCertBackingBean.managedBean.mofCertLs}"
				var="mofCert"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<p:column headerText="No.">
					#{index +1}
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.mofno']}">
					#{mofCert.smMofAccount.mofNo}
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.certno']}">
					#{mofCert.certSerialNo}
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.virtual.cert.release.date']}">
					<h:outputText value="#{mofCert.createdDate}">
						<f:convertDateTime 
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.virtual.cert.appl.type']}">
					#{lbl[virtualCertBackingBean.getsupplierApplTypeDesc(mofCert.smAppl.applType)]}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.virtual.cert.type']}">
					<h:outputText
						rendered="#{mofCert.smMofAccount.supplierType eq SupplierManagementConst.STYPE_CONSULTANT}"
						value="#{lbl['lbl.sm.consultant']}" />

					<h:outputText
						rendered="#{mofCert.smMofAccount.supplierType eq SupplierManagementConst.STYPE_CONTRACTOR}"
						value="#{lbl['lbl.sm.contractor']}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.virtual.cert.download']}">
					<div align="center">
					<p:commandButton
						value="#{lbl['lbl.sc.view.recent.price.view.btn']}"
						ajax="false">
						<p:fileDownload value="#{virtualCertBackingBean.printVirtualCert(mofCert)}" />
					</p:commandButton>
					</div>
				</p:column>
			</p:dataTable>
			
		</p:panel>
	</ui:define>
</ui:composition>
