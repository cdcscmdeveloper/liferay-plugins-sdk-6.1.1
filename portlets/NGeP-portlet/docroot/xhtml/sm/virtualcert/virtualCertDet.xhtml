<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="contentSection">
		<p:panel header="Virtual Certificate">
			<p:dataTable value="#{virtualCertBackingBean.managedBean.mofAccountLs}"
				var="mofAcc">
				<p:column headerText="MOF No">
					#{mofAcc.mofNo}
				</p:column>

				<p:column headerText="Type">
						<p:outputPanel rendered="#{mofAcc.supplierType == SupplierManagementConst.STYPE_CONSULTANT}">
						#{lbl['lbl.sm.consultant']}
						</p:outputPanel>
						
						<p:outputPanel rendered="#{mofAcc.supplierType == SupplierManagementConst.STYPE_CONTRACTOR}}">
						#{lbl['lbl.sm.contractor']}
						</p:outputPanel>
				</p:column>
				
				<p:column headerText="Serial No">
					#{mofAcc.smMofCerts[0].certSerialNo}
				</p:column>
				
				<p:column headerText="Download">
					<p:commandButton value="Download"
						action="#{virtualCertBackingBean.generatePdf(mofAcc.mofNo)}" ajax="false"></p:commandButton>
				</p:column>
			</p:dataTable>
			
		</p:panel>
	</ui:define>
</ui:composition>
