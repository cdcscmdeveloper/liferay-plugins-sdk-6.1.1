<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="contentSection">
		<p:panel header="#{lbl['lbl.sm.virtual.cert']}">
			<p:dataTable id="vcDt" 
				value="#{virtualCertBackingBean.managedBean.mofCertLs}"
				var="mofCert"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<p:column headerText="#{lbl['lbl.sm.mofno']}">
					#{mofCert.smMofAccount.mofNo}
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.certno']}">
					#{mofCert.certSerialNo}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.virtual.cert.type']}">
					<h:outputText
						rendered="#{mofCert.smMofAccount.supplierType eq SupplierManagementConst.STYPE_CONSULTANT}"
						value="#{lbl['lbl.sm.consultant']}" />

					<h:outputText
						rendered="#{mofCert.smMofAccount.supplierType eq SupplierManagementConst.STYPE_CONTRACTOR}"
						value="#{lbl['lbl.sm.contractor']}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.virtual.cert.download']}">
					<ui:remove>
					<p:commandButton value="#{lbl['lbl.btn.download']}"
						action="#{virtualCertBackingBean.generatePdf(mofCert.smMofAccount)}" ajax="false" rendered="#{!mofCert.bumiCert}" />
					<p:commandButton value="#{lbl['lbl.btn.download']}"
						action="#{virtualCertBackingBean.generateBumiPdf(mofCert.smMofAccount)}" ajax="false" rendered="#{mofCert.bumiCert}" />
					</ui:remove>
										
					<p:commandButton
						value="#{lbl['lbl.sc.view.recent.price.view.btn']}"
						icon="ui-icon-search"
						ajax="false"
						rendered="#{!mofCert.bumiCert}">
						<p:fileDownload value="#{virtualCertBackingBean.printMofCertificate(mofCert.certSerialNo)}" />
					</p:commandButton>
					
					<p:commandButton
						value="#{lbl['lbl.sc.view.recent.price.view.btn']}"
						icon="ui-icon-search"
						ajax="false"
						rendered="#{mofCert.bumiCert}">
						<p:fileDownload value="#{virtualCertBackingBean.printBumiCertificate(mofCert.certSerialNo)}" />
					</p:commandButton>
					
				</p:column>
			</p:dataTable>
			
		</p:panel>
	</ui:define>
</ui:composition>
