<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="contentSection">
		<p:panel header="Virtual Certificate">
			<p:dataTable value="#{virtualCertBackingBean.managedBean.mofAccountLs}"
				var="mofAcc">
				<p:column headerText="MOF No">
					#{mofAcc.mofNo}
				</p:column>

				<p:column headerText="Type">
					<h:outputText
						rendered="#{mofAcc.supplierType eq SupplierManagementConst.STYPE_CONSULTANT}"
						value="#{lbl['lbl.sm.consultant']}" />

					<h:outputText
						rendered="#{mofAcc.supplierType eq SupplierManagementConst.STYPE_CONTRACTOR}"
						value="#{lbl['lbl.sm.contractor']}" />
				</p:column>
				
				<p:column headerText="Download">
					<p:commandButton value="Download"
						action="#{virtualCertBackingBean.generatePdf(mofAcc)}" ajax="false"></p:commandButton>
				</p:column>
			</p:dataTable>
			
		</p:panel>
	</ui:define>
</ui:composition>
