<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="contentSection">
		<p:panel header="#{lbl['lbl.sm.virtual.cert']}">
			<p:dataTable value="#{virtualCertBackingBean.managedBean.mofCertLs}"
				var="mofCert">
				<p:column headerText="#{lbl['lbl.sm.mofno']}">
					#{mofCert.smMofAccount.mofNo}
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.mofno']}">
					#{mofCert.certSerialNo}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.virtual.cert.type']}">
					<h:outputText
						rendered="#{mofCert.smMofAccount.supplierType eq SupplierManagementConst.STYPE_CONSULTANT}"
						value="#{lbl['lbl.sm.consultant']}" />

					<h:outputText
						rendered="#{mofCert.smMofAccount.supplierType eq SupplierManagementConst.STYPE_CONTRACTOR}"
						value="#{lbl['lbl.sm.contractor']}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.virtual.cert.download']}">
					<p:commandButton value="#{lbl['lbl.btn.download']}"
						action="#{virtualCertBackingBean.generatePdf(mofCert.smMofAccount)}" ajax="false"></p:commandButton>
				</p:column>
			</p:dataTable>
			
		</p:panel>
	</ui:define>
</ui:composition>
