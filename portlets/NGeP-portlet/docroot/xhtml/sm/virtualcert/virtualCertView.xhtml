<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="contentSection">
	<f:event listener="#{virtualCertBackingBean.viewVirtualCert}" type="preRenderView"></f:event>
		<p:panel header="Virtual Certificate">
			<p:dataTable value="#{virtualCertBackingBean.managedBean.mofAccountLs}"
				var="mofAcc">
				<p:column headerText="Cert Type">
					#{mofAcc.mofNo}
				</p:column>

				<p:column headerText="Serial No">
					#{mofAcc.mofNo}
				</p:column>
				
				<p:column headerText="Download">
					<p:commandButton value="Download"
						action="#{virtualCertBackingBean.testHttp}" ajax="false"></p:commandButton>
				</p:column>
			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
