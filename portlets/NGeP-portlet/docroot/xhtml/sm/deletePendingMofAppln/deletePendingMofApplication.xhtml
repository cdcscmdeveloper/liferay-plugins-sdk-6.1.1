<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<ui:define name="contentSection">
		<p:messages id="delPendApplRootMsg" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true" escape="false" />
		<p:panel
			header="#{lbl['lbl.sm.pending.mof.delete']} - #{backingBean.managedBean.smAppl.applNo}">

			<!-- <div>

				<h4
					style="color: blue; text-decoration: underline; text-align: center;">
					<h:outputText value="#{lbl['lbl.sm.applnTypeLbl']}" />
					<h:outputText value="Delete Pending MOF Application" />
					<h:outputText value=" " />

				</h4>
			</div> -->
			<br />
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.application.no']} : " /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.smAppl.applNo}" readonly="true"
							disabled="true" size="35" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.applicationtype']} : " /></td>
					<td><p:inputText value="#{lbl['lbl.sm.mofReg.headerLbl']}"
							readonly="true" disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'N'}"
							size="35" /> <p:inputText
							value="#{lbl['lbl.sm.renewMof.headerLbl']}" readonly="true"
							disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'R'}"
							size="35" /> <p:inputText
							value="#{lbl['lbl.sm.updateMof.headerLbl']}" readonly="true"
							disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'U'}"
							size="35" /> <p:inputText
							value="#{lbl['lbl.sm.bumi.headerLbl']}" readonly="true"
							disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'B'}"
							size="35" /> <p:inputText
							value="#{lbl['lbl.sm.addnlCat.headerLbl']}" readonly="true"
							disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'A'}"
							size="35" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.dateSubmitted']} : " /></td>
					<td><p:inputText readonly="true"
							value="#{backingBean.managedBean.smAppl.applSubmitDate}"
							disabled="true" size="35">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.current.status']} : " /></td>
					<td><p:inputText readonly="true"
							value="#{backingBean.managedBean.currentStatus}" disabled="true"
							size="35" /></td>

				</tr>
				<tr>
					<td style="vertical-align: top"><p:outputLabel
							value="#{lbl['lbl.sm.rejection.reasons']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>

					<td><p:selectManyMenu showCheckbox="true"
							id="applRejectSelBox" required="true"
							label="#{lbl['lbl.sm.rejection.reasons']}"
							value="#{backingBean.managedBean.reasonId}"
							style="height:200px;width:750px;">
							<f:selectItems value="#{backingBean.managedBean.reasonDescList}"
								var="res" itemLabel="#{res.reasonDesc}"
								itemValue="#{res.pmReason.reasonId}" />
							<p:ajax update="delPendRejRemarksPanelTst" event="change"
								process="applRejectSelBox"
								listener="#{backingBean.verifySelectedRejectReasons()}" />
						</p:selectManyMenu> <p:message id="applRejectSelBoxMsg" for="applRejectSelBox"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
			</table>
			<p:outputPanel id="delPendRejRemarksPanelTst">
				<table style="width: 100%; margin-top: 10px;">
					<tr>
						<td style="width: 15.3%;"><p:outputLabel
								value="#{lbl['lbl.sm.reason']} : "
								rendered="#{backingBean.managedBean.rejectReasonReqd}" /> <p:outputLabel
								value="*" styleClass="mandatory"
								rendered="#{backingBean.managedBean.rejectReasonReqd}" /></td>
						<td><p:inputTextarea cols="122" style="margin-bottom : 5px;"
								rows="5" required="#{backingBean.managedBean.rejectReasonReqd}"
								id="delPendResn" label="#{lbl['lbl.sm.reason']}"
								rendered="#{backingBean.managedBean.rejectReasonReqd}"
								value="#{backingBean.managedBean.supplierRemarks}"
								maxlength="2500"
								validatorMessage="#{lbl['lbl.sm.reason']} #{lbl['lbl.sm.rmrkLength.thsndCharLimit']}">
								<f:validateLength maximum="2500" />
							</p:inputTextarea> <p:message id="delPendResnMsg" for="delPendResn" display="icon" /></td>

					</tr>
				</table>
			</p:outputPanel>
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					action="#{backingBean.onDisplayConfirmDelPending}"
					partialSubmit="true" update="@([id$=Msg])" />

			</div>
		</p:panel>

		<p:confirmDialog id="delPenRegConfirm" width="550px"
			message="#{lbl['lbl.sm.delete.pending.mofAppl.confirm']}"
			header="#{lbl['lbl.sm.delete.pending.mofAppl']}" severity="alert"
			widgetVar="delPenRegConfirm">
			<div align="center">
				<p:commandButton id="confDelPen" value="#{lbl['lbl.btn.yes']}"
					onclick="canRegConfirm.hide()"
					action="#{backingBean.submitDeletePendingMofApplToBpm}" />
				<p:commandButton id="declineDelPen" value="#{lbl['lbl.btn.no']}"
					onclick="canRegConfirm.hide()" type="button" />
			</div>
		</p:confirmDialog>
	</ui:define>
</ui:composition>
