<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<ui:define name="contentSection">
		<p:panel
			header="#{lbl['lbl.sm.pending.mof.delete']} - #{backingBean.managedBean.smAppl.applNo}">

			<!-- <div>

				<h4
					style="color: blue; text-decoration: underline; text-align: center;">
					<h:outputText value="#{lbl['lbl.sm.applnTypeLbl']}" />
					<h:outputText value="Delete Pending MOF Application" />
					<h:outputText value=" " />

				</h4>
			</div> -->
			<br />
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.application.no']} : " /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.smAppl.applNo}" readonly="true"
							disabled="true" size="35" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.applicationtype']} : " /></td>
					<td><p:inputText value="#{lbl['lbl.sm.mofReg.headerLbl']}" readonly="true"
							disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'N'}"
							size="35" /> <p:inputText value="#{lbl['lbl.sm.renewMof.headerLbl']}"
							readonly="true" disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'R'}"
							size="35" /> <p:inputText
							value="#{lbl['lbl.sm.updateMof.headerLbl']}" readonly="true"
							disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'U'}"
							size="35" /> <p:inputText
							value="#{lbl['lbl.sm.bumi.headerLbl']}" readonly="true"
							disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'B'}"
							size="35" /> <p:inputText
							value="#{lbl['lbl.sm.addnlCat.headerLbl']}" readonly="true"
							disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'A'}"
							size="35" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.dateSubmitted']} : " /></td>
					<td><p:inputText readonly="true"
							value="#{backingBean.managedBean.smAppl.applSubmitDate}"
							disabled="true" size="35">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.current.status']} : " /></td>
					<td><p:inputText readonly="true"
							value="#{backingBean.managedBean.currentStatus}" disabled="true"
							size="35" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.reason']} : " /></td>
					<td><p:inputTextarea cols="45" style="margin-bottom : 5px;"
							value="#{backingBean.managedBean.supplierRemarks}" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.supportingdoc.if.any']}" /></td>
					<td><p:fileUpload mode="simple" /></td>

				</tr>
			</table>
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.submit']}" onclick="delPenRegConfirm.show();" />

			</div>
		</p:panel>

		<p:confirmDialog id="delPenRegConfirm" width="350px"
			message="#{lbl['lbl.sm.cancel.mof.confirm']}"
			header="#{lbl['lbl.sm.cancel.mof']}" severity="alert"
			widgetVar="delPenRegConfirm">
			<div align="center">
				<p:commandButton id="confDelPen" value="#{lbl['lbl.btn.yes']}"
					onclick="canRegConfirm.hide()"
					action="#{backingBean.submitDeletePendingMofApplToBpm}" />
				<p:commandButton id="declineDelPen" value="#{lbl['lbl.btn.no']}"
					onclick="canRegConfirm.hide()" type="button" />
			</div>
		</p:confirmDialog>
	</ui:define>
</ui:composition>
