<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<ui:define name="contentSection">
		<p:panel
			header="Delete Pending MOF Application - #{backingBean.managedBean.smAppl.applNo}">

			<!-- <div>

				<h4
					style="color: blue; text-decoration: underline; text-align: center;">
					<h:outputText value="#{lbl['lbl.sm.applnTypeLbl']}" />
					<h:outputText value="Delete Pending MOF Application" />
					<h:outputText value=" " />

				</h4>
			</div> -->
			<br />
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel value="Application No : " /></td>
					<td><p:inputText
							value="#{backingBean.managedBean.smAppl.applNo}" readonly="true"
							disabled="true" size="35" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="Application Type : " /></td>
					<td><p:inputText value="New Mof Application " readonly="true"
							disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'N'}"
							size="35" /> <p:inputText value=" Renew Mof Application "
							readonly="true" disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'R'}"
							size="35" /> <p:inputText
							value=" Update Mof Profile Application " readonly="true"
							disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'U'}"
							size="35" /> <p:inputText
							value="Application For Bumiputera Status" readonly="true"
							disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'B'}"
							size="35" /> <p:inputText
							value="Application For Additional Category Codes" readonly="true"
							disabled="true"
							rendered="#{backingBean.managedBean.smAppl.applType eq 'A'}"
							size="35" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="Submitted On : " /></td>
					<td><p:inputText readonly="true"
							value="#{backingBean.managedBean.smAppl.applSubmitDate}"
							disabled="true" size="35">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText></td>

				</tr>
				<tr>
					<td><p:outputLabel value="Current Status : " /></td>
					<td><p:inputText readonly="true"
							value="#{backingBean.managedBean.currentStatus}" disabled="true"
							size="35" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="Reason : " /></td>
					<td><p:inputTextarea cols="45" style="margin-bottom : 5px;"
							value="#{backingBean.managedBean.supplierRemarks}" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="Supporting Doc (If any)" /></td>
					<td><p:fileUpload mode="simple" /></td>

				</tr>
			</table>
			<div align="center">
				<p:commandButton value="Submit" onclick="delPenRegConfirm.show();" />

			</div>
		</p:panel>

		<p:confirmDialog id="delPenRegConfirm" width="350px"
			message="Are you sure to proceed with the cancellation process?"
			header="Cancel Reg With MOF" severity="alert"
			widgetVar="delPenRegConfirm">
			<div align="center">
				<p:commandButton id="confDelPen" value="Yes"
					onclick="canRegConfirm.hide()"
					action="#{backingBean.submitDeletePendingMofApplToBpm}" />
				<p:commandButton id="declineDelPen" value="No"
					onclick="canRegConfirm.hide()" type="button" />
			</div>
		</p:confirmDialog>
	</ui:define>
</ui:composition>
