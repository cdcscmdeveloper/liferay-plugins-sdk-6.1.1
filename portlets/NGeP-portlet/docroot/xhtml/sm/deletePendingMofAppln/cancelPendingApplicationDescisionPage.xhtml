<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true"
			autoUpdate="#{backingBean.managedBean.showParentMsg}" closable="true"
			showSummary="false" />

		<ui:include
			src="/xhtml/sm/approverDecisionPages/approverCompanyInfo.xhtml" />
		<ui:include
			src="/xhtml/sm/approverDecisionPages/approverContactInfo.xhtml" />

		<p:panel header="#{lbl['lbl.sm.pending.app.desc.header']}">
			<table style="width: 50%; table-layout: fixed">
				<tr height="10">
					<td colspan="2"></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.application.no']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{backingBean.managedBean.smAppl.applNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.dateSubmitted']}" /></td>
					<td><ac:labelDateTime styleClass="outputLabel-view"
							value="#{backingBean.managedBean.smAppl.applSubmitDate}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.current.status']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{backingBean.managedBean.currentStatus}" /></td>
				</tr>
				<tr>
					<td style="vertical-align: baseline;"><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.reason.supplier']}" /></td>
					<td style="word-wrap: break-word"><p:outputLabel
							styleClass="outputLabel-view" escape="false"
							value="#{backingBean.managedBean.supplierRemarks}" /></td>
				</tr>
				<tr height="10">
					<td colspan="2"></td>
				</tr>
			</table>
			<p:separator />
			<div>
				<p>
					<h:outputText
						value="#{lbl['lbl.sm.delete.pending.finished.review.notes']}"
						escape="false" />
				</p>
			</div>
			<p:separator />

			<div style="width: 100%" align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.approve']}"
					onclick="approveAppCanDialog.show();" />
				<p:commandButton value="#{lbl['lbl.sm.button.reject']}"
					update="rejectAppCanDialog" partialSubmit="true" process="@this"
					action="#{backingBean.approveOrRejectMofCancellation('rejectAppCanDialog')}" />

			</div>
		</p:panel>


		<p:dialog width="800px" height="200px;"
			header="#{lbl['lbl.sm.approve.application']}" closable="false"
			widgetVar="approveAppCanDialog" resizable="false" showEffect="fade"
			hideEffect="fade" modal="true">

			<ui:include
				src="/xhtml/sm/shared/poDecisionSharedPages/approveDelPendingApplPopUpForm.xhtml" />
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					onclick="approveAppCanDialog.hide();"
					action="#{backingBean.approveOrRejectPendingApplicationCancellation('APPROVE')}" />
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}"
					onclick="approveAppCanDialog.hide();" />
			</div>
		</p:dialog>
		<p:dialog width="800px" height="200px;"
			header="#{lbl['lbl.sm.reject.application']}" id="rejectAppCanDialog"
			widgetVar="rejectAppCanDialog" resizable="false" showEffect="fade"
			closable="false" hideEffect="fade" modal="true">

			<ui:include
				src="/xhtml/sm/shared/poDecisionSharedPages/rejectedDelPendingApplPopUpForm.xhtml" />
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					partialSubmit="true" process="rejectAppCanDialog"
					action="#{backingBean.finalDecisionDeletePendingAppln('rejectAppCanDialog','REJECT')}" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					action="#{backingBean.resetMofCancellationFinalApproveOrReject('rejectAppCanDialog')}"
					partialSubmit="true" process="@this" />
			</div>
		</p:dialog>
	</ui:define>
</ui:composition>
