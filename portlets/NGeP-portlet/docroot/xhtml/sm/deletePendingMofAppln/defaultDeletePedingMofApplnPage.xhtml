<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:panel header="Delete Pending MOF Application">
			<table style="width: 100%">
				<tr>
					<td><p:outputPanel>
							<p>Please provide a valid reason and attach supporting
								documents (if any) for deleting the pending MOF application.</p>
							<br />
								NOTE : The MOF application with status upto pending Supporting documents
								 are deleted immediately, <br />but applications after this status need to go through the approval process.
						</p:outputPanel></td>
				</tr>
			</table>
		</p:panel>
		<div align="right">
			<p:commandButton value="Proceed"
				action="#{backingBean.deletePendingMofApplication}" />
			<!-- <p:commandButton value="Cancel"
				action="/xhtml/sm/homeScreen/defaultVirtualCertPage.xhtml" /> -->
		</div>
	</ui:define>
</ui:composition>
