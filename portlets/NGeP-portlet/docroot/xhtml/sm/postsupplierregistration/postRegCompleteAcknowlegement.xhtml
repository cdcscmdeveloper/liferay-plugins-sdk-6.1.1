<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui" >
	
    <ui:define name="contentSection">
			<p:messages id="ackMsg" showDetail="true" autoUpdate="true" escape="false"/>
			<div align="right">
				<p:commandButton onclick="httpGetLogout();" value="#{lbl['lbl.sm.basic.finish']}" ajax="false"
				rendered="#{postSupplierRegBB.roleChangeSuccess}"></p:commandButton>
				
<script>

function httpGetLogout()
{
    var xmlHttp = new XMLHttpRequest();
    xmlHttp.open( "GET", "/c/portal/logout", false ); // false for synchronous request
    xmlHttp.send( null );
    return xmlHttp.responseText;
}

</script>
				
				
			</div>
	</ui:define>
</ui:composition>
