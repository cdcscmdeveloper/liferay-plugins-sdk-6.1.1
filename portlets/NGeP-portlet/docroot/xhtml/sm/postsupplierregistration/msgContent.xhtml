<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<ui:define name="contentSection">
		<p:outputPanel rendered="#{postSupplierRegBB.validMofUser()}" id="mofPanelId">
			<c:forEach items="#{postSupplierRegBB.managedBean.mofUserMap}" var="entry">
				#{entry.key}
				<p:commandLink  value="- click here to continue" action="#{postSupplierRegBB.pageRedirect(entry.value)}"></p:commandLink><br />
			</c:forEach>
		</p:outputPanel>
		
		<p:outputPanel rendered="#{!postSupplierRegBB.validMofUser()}"  id="basicPanelId">
			<h:outputText value="Congratulations!!" style="font-size:30;" /><br />
			<h:outputText value="You have successfully activated the eP account." /><br />
			<h:outputText value="Please proceed to the following step to complete the registration." /><br />
			<br />
			<h:outputText value="#{postSupplierRegBB.managedBean.statusDesc}" /> 
			<p:commandLink  value="- click here to continue"  rendered="#{postSupplierRegBB.managedBean.hyperlink}" action="#{postSupplierRegBB.pageNavigate}"></p:commandLink>
		</p:outputPanel>
		<br /><br />
		
	</ui:define>

</ui:composition>
