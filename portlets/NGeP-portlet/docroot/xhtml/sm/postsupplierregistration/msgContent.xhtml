<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<ui:define name="contentSection">
		<p:outputPanel rendered="#{postSupplierRegBB.validMofUser() or postSupplierRegBB.validBasicSupplier()}" id="mofPanelId">
			<c:forEach items="#{postSupplierRegBB.managedBean.userActionMap}" var="entry">
				<ui:remove>
				<h:outputText value="#{entry.key}" />
				<h:outputText value=" - " />
				<p:commandLink  value="#{lbl['lbl.sm.basic.click.to.continue']}" action="#{postSupplierRegBB.pageRedirect(entry.value)}"></p:commandLink><br />
				</ui:remove>
				<p:commandLink  action="#{postSupplierRegBB.pageRedirect(entry.value)}">
				<p:graphicImage value="#{entry.key}"></p:graphicImage>
				</p:commandLink><br />
			</c:forEach>
		</p:outputPanel>
		
		<p:outputPanel rendered="#{postSupplierRegBB.validSupplierTemp()}"  id="basicPanelId">
			<p:commandLink  action="#{postSupplierRegBB.pageNavigate}" rendered="#{postSupplierRegBB.managedBean.bannerImage}">
				<p:graphicImage value="#{postSupplierRegBB.managedBean.statusDesc}"></p:graphicImage>
			</p:commandLink>
		
			<p:outputPanel rendered="#{!postSupplierRegBB.managedBean.bannerImage}">
				<h:outputText value="#{postSupplierRegBB.managedBean.statusDesc}" /> 
				<h:outputText value=" - " rendered="#{postSupplierRegBB.managedBean.hyperlink}"/> 
				<p:commandLink  value="#{lbl['lbl.sm.basic.click.to.continue']}"  rendered="#{postSupplierRegBB.managedBean.hyperlink}" action="#{postSupplierRegBB.pageNavigate}"></p:commandLink>
			</p:outputPanel>
		</p:outputPanel>
		<br /><br />
	</ui:define>

</ui:composition>
