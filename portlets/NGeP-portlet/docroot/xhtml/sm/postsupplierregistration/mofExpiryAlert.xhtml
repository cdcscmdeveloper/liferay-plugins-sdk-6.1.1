<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<script>
		function blink() {
		    var e = document.getElementById('blinkId');
		    setInterval(function() {
		    	if (e.style.display == 'block' || e.style.display=='') e.style.display = 'none';
			    else e.style.display = 'block';   
		    }, 1000);
		};
		window.onload = blink;
	</script>
	
	<p:outputPanel rendered="#{not empty postSupplierRegBB.managedBean.mofExpDateMsg}">
		<br />
		<table>
			<tr>
				<td style="color: blue; font-weight: bold; text-align: left;font-size: 16px;">
					<h:outputText value="#{lbl['lbl.sm.suppalert.mofexpiry.msg']}" />
				</td>
				<td style="color: blue; font-weight: bold; text-align: left;font-size: 16px;">
					<div id="blinkId">&#160;&#160;<h:outputText value="#{postSupplierRegBB.managedBean.mofExpDateMsg}" /></div>
				</td>
			</tr>
			<tr>
				<td style="text-align: left;font-size: 13px;font-weight: bold;" colspan="2">
					<p:commandLink  action="#{postSupplierRegBB.pageRedirect('renew-mof-account')}"  value="#{lbl['lbl.sm.suppalert.mofexpiry.renew']}"/>
				</td>
			</tr>
		</table>
	</p:outputPanel>
</ui:composition>
