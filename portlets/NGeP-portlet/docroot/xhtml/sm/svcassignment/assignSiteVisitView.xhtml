<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<f:event listener="#{svcSiteAssignBackingBean.retrieveSiteAssignInfo}"
			type="preRenderView"></f:event>

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="Application No." /></td>
				<td><p:inputText
						value="#{svcSiteAssignBackingBean.managedBean.smApplSv.smAppl.applNo}"
						disabled="true" /></td>

				<td><p:outputLabel value="Application Type" /></td>
				<td><p:inputText
						value="#{svcSiteAssignBackingBean.managedBean.smApplSv.smAppl.applType}"
						disabled="true" /></td>

				<td><p:outputLabel value="MOF No." /></td>
				<td><p:inputText
						value="#{svcSiteAssignBackingBean.managedBean.smApplSv.smAppl.smSupplier}"
						disabled="true" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Company Name" /></td>
				<td><p:inputText
						value="#{svcSiteAssignBackingBean.managedBean.smApplSv.smAppl.smSupplier.companyName}"
						disabled="true" /></td>

				<td><p:outputLabel value="Status" /></td>
				<td><p:inputText disabled="true" /></td>

				<td><p:outputLabel value="Date of Creation" /></td>
				<td><p:calendar disabled="true"
						value="#{svcSiteAssignBackingBean.managedBean.smApplSv.smAppl.createdDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>
			</tr>
		</table>

		<div align="right">
				<p:commandButton
					action="#{svcSiteAssignBackingBean.submitSiteVisitTest}"
					value="Submit" />
		</div>
		
		<p:panel header="Site Visit Assignment">
			<p:dataTable var="svc"
				value="#{svcSiteAssignBackingBean.managedBean.smApplSv.smSiteVisitAddresses}"
				rowIndexVar="rowIndex">
				<p:column headerText="No">
				#{rowIndex+1}
				</p:column>

				<p:column headerText="Address">
					#{svc.smAddress.address1}<br />
					#{svc.smAddress.address2}<br />
					#{svc.smAddress.address3}<br />
					#{svc.smAddress.address4}
				</p:column>

				<p:column headerText="Post Code">
				#{svc.smAddress.postcode}
				</p:column>

				<p:column headerText="City">
				#{svc.smAddress.pmCity.cityName}
				</p:column>


				<p:column headerText="District">
				#{svc.smAddress.pmDistrict.districtName}
				</p:column>

				<p:column headerText="State">
				#{svc.smAddress.pmState.stateName}
				</p:column>

				<p:column headerText="Country">
				#{svc.smAddress.pmCountry.countryName}
			</p:column>
			</p:dataTable>

			<p:separator id="customSeparator" />
			<table class="rptTbl">
				<tr>
					<td><p:outputLabel value="Expected Date" /></td>
					<td><p:calendar id="popupButtonCal" showOn="button" mindate="08/04/2014"
							value="#{svcSiteAssignBackingBean.managedBean.smApplSv.expectedDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></td>

					<td></td>
					<td></td>
				</tr>
				<tr>
					<td valign="top"><p:outputLabel value="Remark" /></td>
					<td colspan="3"><p:inputTextarea rows="5" cols="60"
							autoResize="false" id="Remark" /></td>
					<td></td>
					<td></td>
				</tr>
				<tr>
					<td><br /></td>
				</tr>
				<tr>
					<td valign="top"><p:outputLabel
							value="Site Visit Officer(Mins 2)" /></td>
					<td colspan="3"><p:pickList id="pickList"
							value="#{svcSiteAssignBackingBean.managedBean.svoUserList}"
							var="off" itemLabel="#{off.userName}" itemValue="#{off}" /></td>
				</tr>
			</table>
			<br />
		</p:panel>

	</ui:define>
</ui:composition>
