<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_SiteVisit_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.sitevist.header']}");
		</script>
	</ui:define>

	<ui:define name="contentSection">
		<ui:remove><f:event listener="#{svcSiteAssignBackingBean.preRenderView}" type="preRenderView" /></ui:remove>
		<ui:param name="supplierName"
			value="#{svcSiteAssignBackingBean.managedBean.smAppl.smSupplier.companyName}" />
		<ui:param name="applNo"
			value="#{svcSiteAssignBackingBean.managedBean.smAppl.applNo}" />
		<ui:param name="applType"
			value="#{svcSiteAssignBackingBean.getsupplierApplTypeDesc(svcSiteAssignBackingBean.managedBean.smAppl.applType)}" />
		<ui:include src="/xhtml/sm/shared/common/commonHeader.xhtml" />

		<p:dialog widgetVar="submissionConfirmDlg" modal="true" height="100" width="500">
   			 #{lbl['lbl.sm.sitevisit.want.proceed.qmark']}	
   			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					action="#{svcSiteAssignBackingBean.submitSiteVisitAssignment(SupplierManagementConst.BPM_SUBMIT)}"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="submissionConfirmDlg.hide();"></p:commandButton>
			</div>
		</p:dialog>

		<p:messages id="svoMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		<div align="right">
			<p:commandButton id="btnSubmit" value="#{lbl['lbl.btn.submit']}"
				action="#{svcSiteAssignBackingBean.validateForm}" />
		</div>
		
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.siteassign.processing.officer']}" /></td>
				<td><h:outputText value="#{svcSiteAssignBackingBean.managedBean.processingOfficerName}" /></td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.siteassign.business.company.regno']}" /></td>
				<td><h:outputText value="#{svcSiteAssignBackingBean.managedBean.smAppl.smSupplier.regNo}" /></td>
			</tr>
			
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sm.siteassign.company.address']}" /></td>
				<td>
				<h:outputText escape="false"
				value="#{svcSiteAssignBackingBean.getSMFullAddress(svcSiteAssignBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress)}" />
				</td>
			</tr>
		
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.siteassign.site.visit.status']}" /></td>
				<td><h:outputText value="#{svcSiteAssignBackingBean.managedBean.siteVisitStatus}" /></td>
			</tr>
		</table>
		
		<p:panel header="#{lbl['lbl.sm.siteassign.catcode.req.site.visit']}">
			<p:dataTable value="#{svcSiteAssignBackingBean.managedBean.categoryLs}" var="catApp" rowIndexVar="index">
				<ui:param name="catCode" value="#{catApp.pmCategoryL1.categoryL1Code}#{catApp.pmCategoryL2.categoryL2Code}#{catApp.pmCategoryL3.categoryL3Code}" />
				<p:column headerText="No.">
					#{index + 1}
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.catCodes.catcode']}">
					#{catCode}
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.category.description']}">
					#{catApp.pmCategoryL3.categoryName}
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel header="#{lbl['lbl.sm.siteassign.pnl.siteassign']}">
			<p:dataTable var="svc"
				value="#{svcSiteAssignBackingBean.managedBean.svcTaskVOLs}" rowIndexVar="rowIndex">
				
				<p:column headerText="#{lbl['lbl.sm.facility.type']}">
					#{svcSiteAssignBackingBean.getParameterDesc(ParameterTypeConst.supplierFacilityType, svc.smSvTask.smSvAddress.facilityType)}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.facility.name']}"
					style="width: 15%;white-space: normal;">
 					#{svc.smSvTask.smSvAddress.facilityName}
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.address']}"
					style="width: 40%;white-space: normal;">
					<h:outputText
						value="#{svcSiteAssignBackingBean.getSMFullAddress(svc.smSvTask.smSvAddress.smAddress)}"
						escape="false" style="float : left" />
				</p:column>
				
				<p:column headerText="Site Visit Officer(s)">
					<h:outputText value="#{lbl['lbl.sm.siteassign.expected.visiting.date']}" />
					<h:outputText value="*"
						styleClass="mandatory" />&#160;&#160;
					<p:calendar id="scheduleDateId" navigator="true" required="true"
						label="#{lbl['lbl.sm.siteassign.expected.visiting.date']}"
						value="#{svc.smSvTask.scheduleDate}"
						mindate="#{CommonConstants.CURRENT_DATE}" readonlyInput="true"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
						size="30" showOn="button" /><br />
					<p:pickList id="pickList"
							value="#{svc.svoUserList}"
							var="off" itemLabel="#{off.userName}" itemValue="#{off}"
							converter="svoListConverter" />
				</p:column>
				<p:column width="30%">
						<p:inputTextarea rows="8" style="width:75%;"
										maxlength="500" autoResize="false" id="Remark" label="#{lbl['lbl.sm.svc.remark']}"
										value="#{svc.smSvTask.smRemark.remark}">
										<f:validateLength maximum="500" />
						</p:inputTextarea>
				</p:column>
			</p:dataTable>
			<p:separator id="customSeparator" />

		</p:panel>

	</ui:define>
</ui:composition>
