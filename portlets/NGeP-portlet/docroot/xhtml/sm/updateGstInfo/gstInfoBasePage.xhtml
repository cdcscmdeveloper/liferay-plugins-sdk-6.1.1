<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_updateGstInfo_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.gst.update.info']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false"/>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:outputPanel>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.declare']}" 
					partialSubmit="true" update="@form" 
					action="#{smUpdateGstInfoBackingBean.onDeclareGst}"
					disabled="#{smUpdateGstInfoBackingBean.isDisableDeclareButton()}"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
				</p:commandButton>
			</div>
		</p:outputPanel>
		
		<ui:include src="/xhtml/sm/shared/gstInformation/gstInfoHq.xhtml" />
		<ui:include src="/xhtml/sm/shared/gstInformation/gstInfoBranches.xhtml" />
		
		<p:confirmDialog id="confirmDeclareDialog" closable="true"
			message="#{lbl['lbl.sm.gst.declare.confirm.msg']}"
			header="#{lbl['lbl.sm.softcert.admin.declaration']}" severity="alert"
			widgetVar="confirmDeclareDialog">
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDeclareDialog.hide();" 
					action="#{smUpdateGstInfoBackingBean.declareGst}" update="@form"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDeclareDialog.hide();" />
			</div>
		</p:confirmDialog>
		
	</ui:define>
		
</ui:composition>
