<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_updateGstInfo_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.gst.update.info']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" closable="false" showSummary="false" escape="false"/>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.declare']}" update="@form"
				partialSubmit="true" process="@this" 
				disabled="#{smUpdateGstInfoBackingBean.managedBean.gstEmpty or empty smUpdateGstInfoBackingBean.managedBean.hqGstSupplier}"
				oncomplete="confirmDeclareDialog.show();">
			</p:commandButton>
		</div>
		
		<ui:include src="/xhtml/sm/shared/gstInformation/gstInfoHq.xhtml" />
		<ui:include src="/xhtml/sm/shared/gstInformation/gstInfoBranches.xhtml" />
		
		<p:confirmDialog id="confirmDeclareDialog"
			message="#{lbl['lbl.sm.gst.declare.confirm.msg']}"
			header="#{lbl['lbl.sm.userprofile.confirmation']}"
			widgetVar="confirmDeclareDialog">
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDeclareDialog.hide();" 
					action="#{smUpdateGstInfoBackingBean.declareGst}"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDeclareDialog.hide();" />
			</div>
		</p:confirmDialog>
	</ui:define>
		
</ui:composition>
