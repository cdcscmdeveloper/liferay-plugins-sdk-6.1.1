<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_updateGstInfo_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.gst.update.info']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false"/>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.declare']}" 
				partialSubmit="true" update="@form" 
				action="#{smUpdateGstInfoBackingBean.onDeclareGst}"
				disabled="#{smUpdateGstInfoBackingBean.isDisableDeclareButton()}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
			</p:commandButton>
		</div>
		
		<ui:include src="/xhtml/sm/shared/gstInformation/gstInfoHq.xhtml" />
		<ui:include src="/xhtml/sm/shared/gstInformation/gstInfoBranches.xhtml" />
		
		<p:dialog id="confirmDeclareDialog" header="#{lbl['lbl.sm.gst.tnc.header']}"
			widgetVar="confirmDeclareDialog" modal="true" width="500px" height="300px">
			<table style="width: 100%">
				<tr>
					<td>
						<h:outputText value="#{lbl['lbl.sm.gst.tnc.msg']}" 
							style="float: left;white-space: normal;" escape="false"/>
					</td>
				</tr>
			</table>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.accept']}" onclick="confirmDeclareDialog.hide();" 
					action="#{smUpdateGstInfoBackingBean.declareGst}" update="@form"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" onclick="confirmDeclareDialog.hide();" />
			</div>
		</p:dialog>
		
	</ui:define>
		
</ui:composition>
