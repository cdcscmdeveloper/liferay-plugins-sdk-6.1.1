<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_smBulkApplication_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.bulk.submission']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false"/>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton action="#{bulkApplicationBackingBean.refreshTaskList}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						value="#{lbl['lbl.bpm.refresh']}" update="claimTaskListId" />
				</td>
				<td style="white-space: nowrap; float: right;">
				    <p:commandButton value="#{lbl['lbl.sm.button.approve']}" style="float:right;" 
				    	id="approveBtnId" update="@form"
				    	onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
				    	action="#{bulkApplicationBackingBean.approveBulkApplication}"/>
				</td>
			</tr>
			<tr height="10"><td height="10"></td></tr>
		</table>
		
		<p:panel header="#{lbl['lbl.sm.bulk.application.list.group']}" toggleable="true" id="unClaimPanelId">
			<p:dataTable id="unClaimTaskListId" rowKey="#{unclaim}" lazy="true" rows="10" 
				emptyMessage="#{lbl['lbl.pp.no.record.found']}" var="unclaim" 
				rowIndexVar="index" value="#{bulkApplicationBackingBean.managedBean.unClaimTaskListDataModel}">
				<ac:paginator for="unClaimTaskListId"></ac:paginator>
		
				<p:column style="white-space:normal !important;" headerText="#{lbl['lbl.bpm.doc.no']}">
					<h:outputText value="#{unclaim.item.docNumber}" />
				</p:column>
	
				<p:column style="width : 25%;white-space:normal;" headerText="#{lbl['lbl.bpm.description']}">
					<h:outputText value="#{unclaim.item.title}" />
				</p:column>
				
				<p:column style="white-space:normal;" headerText="#{lbl['lbl.bpm.created.date']}">
					<h:outputText value="#{unclaim.item.createDate.time}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>
				
				<p:column style="white-space:normal;" headerText="#{lbl['lbl.bpm.due.date']}">
					<h:outputText value="#{unclaim.item.expirationDate.time}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.cm.action']}">
					<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						action="#{bulkApplicationBackingBean.onClaimBpmTask}" update="@form">
						<f:param name="taskId" value="#{unclaim.item.taskId}" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
		</p:panel>
		
		<p:panel header="#{lbl['lbl.sm.bulk.application.list']}" toggleable="true" id="resultPanelId">
		
			<p:dataTable id="claimTaskListId" rowKey="#{tasks}" lazy="true" rows="10" 
				emptyMessage="#{lbl['lbl.pp.no.record.found']}"
				rowIndexVar="index" value="#{bulkApplicationBackingBean.managedBean.claimTaskListDataModel}"
				var="tasks" selection="#{bulkApplicationBackingBean.managedBean.selectedTasks}">
				<ac:paginator for="claimTaskListId" />
					
				<p:column selectionMode="multiple" style="width:2% !important;" />
	
				<p:column style="width : 10% !important;white-space:normal !important;" headerText="#{lbl['lbl.bpm.doc.no']}">
					<h:outputText value="#{tasks.item.docNumber}" />
				</p:column>
	
				<p:column style="width : 30% !important;white-space:normal !important;" headerText="#{lbl['lbl.bpm.description']}">
					<h:outputText value="#{tasks.item.title}" />
				</p:column>
				
				<p:column style="white-space:normal;" headerText="#{lbl['lbl.bpm.created.date']}">
					<h:outputText value="#{tasks.item.createDate.time}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>
				
				<p:column style="white-space:normal;" headerText="#{lbl['lbl.bpm.due.date']}">
					<h:outputText value="#{tasks.item.expirationDate.time}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>
				
				<p:column style="width : 30% !important;white-space:normal !important;" headerText="#{lbl['lbl.sm.decision']}">
					
					<ac:smApplApproveDecisionForm smAppl="#{tasks.appl}" currRegStatus="#{tasks.currRegStatus}" 
						facilityType="#{tasks.hqFacility.facilityType}" changeCurrRegStatus="#{tasks.changeCurrRegStatus}" 
						approvedStatusId="#{tasks.approvedStatusId}" regStatusDescList="#{tasks.regStatusDescList}"
						approvalRemarks="#{tasks.approvalRemarks}" overLapRemarks="#{tasks.overlapRemarks}" valueReqd="true" 
						overLappedCategoryExists="#{tasks.overlappedCategory}" changeRegStatusUpdateId="claimTaskListId" border="false"/>
					
				</p:column>
				<p:column style="width : 5% !important;" headerText="#{lbl['lbl.cm.action']}">
					<p:commandButton value="#{lbl['lbl.bpm.btn.release']}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						action="#{bulkApplicationBackingBean.onReleaseBpmTask}" update="@form">
						<f:param name="taskId" value="#{tasks.item.taskId}" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
			
		</p:panel>
		
	</ui:define>
		
</ui:composition>
