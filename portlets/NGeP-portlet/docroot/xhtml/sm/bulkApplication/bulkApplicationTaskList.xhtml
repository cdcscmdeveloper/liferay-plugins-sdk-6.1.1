<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_smBulkApplication_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					"#{lbl['lbl.sm.bulk.submission']}");
			
			$(function(){
			    // Self-executing recursive animation
			    (function pulse(){
			        $('#blinkId3').delay(1000).fadeOut('slow').delay(50).fadeIn('slow',pulse);
			    })();
			});
			
		</script>
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" closable="true"
			showSummary="false" escape="false" />
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<table style="width: 100%;">
			<tr>
				<td><p:commandButton
						action="#{bulkApplicationBackingBean.refreshTaskList}" process="@this"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						value="#{lbl['lbl.bpm.refresh']}" update="@form" /></td>
				<td style="white-space: nowrap; float: right;"><p:commandButton
						value="#{lbl['lbl.sm.button.approve']}" style="float:right;"
						id="approveBtnId" update="@form" onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						disabled="#{empty bulkApplicationBackingBean.managedBean.selectedTasks}"
						action="#{bulkApplicationBackingBean.approveBulkApplication}" /></td>
			</tr>
			<tr height="10">
				<td height="10"></td>
			</tr>
		</table>

		<p:panel header="#{lbl['lbl.sm.bulk.application.list.group']}"
			toggleable="true" id="unClaimPanelId">
			<p:dataTable id="unClaimTaskListId" rowKey="#{unclaim}" lazy="true"
				rows="10" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
				var="unclaim" rowIndexVar="index"
				value="#{bulkApplicationBackingBean.managedBean.unClaimTaskListDataModel}">
				<ac:paginator for="unClaimTaskListId"></ac:paginator>
				
				<p:column style="white-space:normal;"
					headerText="#{lbl['lbl.sm.date.received']}">
					<h:outputText value="#{unclaim.receivedDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.application.no']}">
					<h:outputText value="#{unclaim.appl.applNo}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.applicationtype']}"
					style="width :25%;white-space : normal">
					<h:outputText value="#{lbl['lbl.sm.appltype.newmof']}"
						rendered="#{unclaim.appl.applType eq 'N'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.bumiputera']}"
						rendered="#{unclaim.appl.applType eq 'B'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.categorycode']}"
						rendered="#{unclaim.appl.applType eq 'A'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.updateprofile']}"
						rendered="#{unclaim.appl.applType eq 'U'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.cancelmof']}"
						rendered="#{unclaim.appl.applType eq 'C'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.renewmof']}"
						rendered="#{unclaim.appl.applType eq 'R'}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.companyname']}">
					<h:outputText value="#{unclaim.appl.smSupplier.companyName}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.siteassign.processing.officer']}">
					<h:outputText value="#{unclaim.po.userName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.cm.action']}">
					<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						action="#{bulkApplicationBackingBean.onClaimBpmTask}"
						update="@form" process="@this">
						<f:param name="taskId" value="#{unclaim.taskId}" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
		</p:panel>
		
		<br />

		<p:panel header="#{lbl['lbl.sm.bulk.application.list']}"
			toggleable="true" id="resultPanelId">
			
			<p:dataTable id="claimTaskListId" rowKey="#{tasks}" lazy="true"
				rows="10" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
				rowIndexVar="indexMain" var="tasks"
				value="#{bulkApplicationBackingBean.managedBean.claimTaskListDataModel}"
				selection="#{bulkApplicationBackingBean.managedBean.selectedTasks}">
				<ac:paginator for="claimTaskListId" />

				<p:ajax event="toggleSelect" update=":#{p:component('resultPanelId')},@([id$=approveBtnId])"  
					listener="#{bulkApplicationBackingBean.onCheckSelectedAppl}" process="@this"/>
				<p:ajax event="rowSelect" update=":#{p:component('resultPanelId')},@([id$=approveBtnId])" 
					listener="#{bulkApplicationBackingBean.onCheckSelectedAppl}" process="@this" />
				<p:ajax event="rowSelectCheckbox" update=":#{p:component('resultPanelId')},@([id$=approveBtnId])" 
					listener="#{bulkApplicationBackingBean.onCheckSelectedAppl}" process="@this" />
				<p:ajax event="rowUnselectCheckbox" update=":#{p:component('resultPanelId')},@([id$=approveBtnId])" 
					listener="#{bulkApplicationBackingBean.onCheckSelectedAppl}" process="@this" />
				<p:ajax event="rowUnselect" update=":#{p:component('resultPanelId')},@([id$=approveBtnId])" 
					listener="#{bulkApplicationBackingBean.onCheckSelectedAppl}" process="@this" />
					
				<p:column selectionMode="multiple" style="width:2% !important;" disabledSelection="#{tasks.notAllowedToTick}"/>
				
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 2%;">
					<h:outputText value="#{indexMain + 1}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.application.no']} (#{lbl['lbl.sm.companyname']})" disabledSelection="#{tasks.notAllowedToTick}">
					<br /><p:outputLabel value="#{tasks.appl.applNo} (#{tasks.appl.smSupplier.companyName})" /><br />
					
					<p:dataTable var="catBean" widgetVar="catBeanWidVar" value="#{tasks.pendingApproveCategories}"
						rowKey="#{catBean}" rowIndexVar="index" id="catBeanDtId"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
						<ac:paginator for="catBeanDtId" />
						
						<p:columnGroup type="header">
							<p:row>
								<p:column headerText="#{lbl['lbl.sm.addtnl.catCodes.panHdr']}" 
									colspan="6" style="text-align: center !important;"/>
							</p:row>
							<p:row>
								<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" />
								<p:column headerText="#{lbl['lbl.sm.catCodes.cate']}" />
								<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}" />
								<p:column headerText="#{lbl['lbl.sm.po.recommend']}" />
								<p:column headerText="#{lbl['lbl.sm.catCodes.appAct']}" />
								<p:column headerText="#{lbl['lbl.sm.catCodes.remark']}" />
							</p:row>
						</p:columnGroup>
						
						<p:column style="width : 2%;">
							<p:outputLabel value="#{index + 1}"
								style="float: left;white-space: normal;" />
						</p:column>
						<p:column style="white-space : normal">
							<h:outputText
								value="#{catBean.pmCategoryL1.categoryL1Code} -  #{empty catBean.categoryL1Name ? catBean.pmCategoryL1.categoryName : catBean.categoryL1Name}" />
							<br />
							<h:outputText
								value="#{catBean.pmCategoryL2.categoryL2Code} -  #{empty catBean.categoryL2Name ? catBean.pmCategoryL2.categoryName : catBean.categoryL2Name}" />
							<br />
							<h:outputText
								value="#{catBean.pmCategoryL3.categoryL3Code} -  #{empty catBean.categoryL3Name ? catBean.pmCategoryL3.categoryName : catBean.categoryL3Name}" />
						</p:column>
						<p:column style="width : 15%;white-space : normal">
							<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
								rendered="#{!catBean.specialCategory}" />
							<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
								rendered="#{catBean.specialCategory}" />
						</p:column>
						<p:column style="width : 10%;white-space : normal">
							<h:outputText value="#{lbl['lbl.sm.approved']}"
								rendered="#{catBean.approvedByPo}" />
							<h:outputText value="#{lbl['lbl.sm.rejected']}"
								rendered="#{!catBean.approvedByPo}" />
						</p:column>
						<p:column style="width : 10%;white-space : normal">
							<p:selectOneRadio layout="pageDirection" id="catApprvrAppr"
								value="#{catBean.apprvrDecFlg}"
								label="#{lbl['lbl.sm.catCodes.appAct']} #{lbl['lbl.sm.catCodes.forCatCode']} 
										#{catBean.pmCategoryL1.categoryL1Code} #{catBean.pmCategoryL2.categoryL2Code} 
										#{catBean.pmCategoryL3.categoryL3Code} "
								rendered="#{catBean.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}">
								<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.apprv']}"
									itemValue="1" />
								<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.reject']}"
									itemValue="0" />
								<p:ajax event="change" process="@this"
									update="apprvrCatDecisionRmrk" partialSubmit="true"
									listener="#{bulkApplicationBackingBean.assignCategoryApproveOrRejectDate(catBean)}" />
							</p:selectOneRadio>
						</p:column>
						<p:column style="width : 10%;white-space : normal">
							<p:inputTextarea value="#{catBean.approverRemarks}" maxlength="200"
								style="width : auto;" rows="5" cols="20"
								label="#{lbl['lbl.sm.catCodes.rejRemarks']} #{catBean.pmCategoryL1.categoryL1Code} 
										#{catBean.pmCategoryL2.categoryL2Code} #{catBean.pmCategoryL3.categoryL3Code} "
								id="apprvrCatDecisionRmrk">
								<p:ajax process="@this" update=":#{p:component('resultPanelId')},@([id$=Msg])" />
								<f:validateLength maximum="200" />
							</p:inputTextarea>
						</p:column>
					</p:dataTable><br />
				</p:column>
			
			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
