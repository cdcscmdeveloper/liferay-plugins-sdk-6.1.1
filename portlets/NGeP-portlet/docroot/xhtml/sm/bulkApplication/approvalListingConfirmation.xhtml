<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false" />
	
	<p:panel header="#{lbl['lbl.sm.bulk.application.list']}"
			toggleable="true" id="resultPanelId">
			
			<h:outputText styleClass="instruction" value="#{bulkApplicationBackingBean.managedBean.maxBulkApprovalMsg}"/>
			
			<p:dataTable id="claimTaskListId" rowKey="#{tasks}" 
				emptyMessage="#{lbl['lbl.pp.no.record.found']}"
				rowIndexVar="indexMain" var="tasks"
				value="#{bulkApplicationBackingBean.managedBean.claimTasks}"
				selection="#{bulkApplicationBackingBean.managedBean.selectedTasks}">
				<ac:paginator for="claimTaskListId" />

				<p:ajax event="toggleSelect" 
					update=":#{p:component('resultPanelId')},@([id$=approveBtnId]),:#{p:component('cancelBtnId')},:#{p:component('rejectBtnId')}"  
					process="@this"/>
				<p:ajax event="rowSelect" 
					update=":#{p:component('resultPanelId')},@([id$=approveBtnId]),:#{p:component('cancelBtnId')},:#{p:component('rejectBtnId')}" 
					process="@this" />
				<p:ajax event="rowSelectCheckbox" 
					update=":#{p:component('resultPanelId')},@([id$=approveBtnId]),:#{p:component('cancelBtnId')},:#{p:component('rejectBtnId')}" 
					process="@this" />
				<p:ajax event="rowUnselectCheckbox" 
					update=":#{p:component('resultPanelId')},@([id$=approveBtnId]),:#{p:component('cancelBtnId')},:#{p:component('rejectBtnId')}" 
					process="@this" />
				<p:ajax event="rowUnselect" 
					update=":#{p:component('resultPanelId')},@([id$=approveBtnId]),:#{p:component('cancelBtnId')},:#{p:component('rejectBtnId')}" 
					process="@this" />
					
				<p:column selectionMode="multiple" style="width:2% !important;" disabledSelection="#{tasks.notAllowedToTick}"/>
				
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 2%;">
					<h:outputText value="#{indexMain + 1}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.application.no']} (#{lbl['lbl.sm.companyname']})" disabledSelection="#{tasks.notAllowedToTick}">
					
					<br />
					<p:outputPanel rendered="#{tasks.overlappedCategory}">
						<font color="red">&#x26A0;</font>&#160;
						<h:outputText styleClass="warning" value="#{lbl['lbl.txt.alert']}" />&#160;
					</p:outputPanel>
					
					<b><h:outputText value="#{tasks.appl.applNo} (#{tasks.appl.smSupplier.companyName})" /></b><br />
					
					<p:outputPanel rendered="#{tasks.overlappedCategory}">
						<br /><h:outputText styleClass="warning" value="#{lbl['lbl.sm.overlapped.category.msg.main']}" escape="false"/>
						<br /><h:outputText styleClass="warning" value="#{lbl['lbl.sm.overlapped.category.msg.please.click']}" escape="false"/>
						<p:commandLink onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()"
							action="#{bulkApplicationBackingBean.onViewOverlapCategory(tasks)}"
							process="@this"
							partialSubmit="true" update=":form">
								&#160;<h:outputText styleClass="warning" value="#{lbl['lbl.sm.overlapped.category.msg.here']}" escape="false"/>
						</p:commandLink>
						&#160;<h:outputText styleClass="warning" value="#{lbl['lbl.sm.overlapped.category.msg.to.view.details']}" escape="false"/>
						
						<br /><br />
						<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.overlapped.category.remarks.instruction']}"/><br />
						<h:outputText value="*" styleClass="mandatory" />&#160;&#160;
						<p:inputTextarea cols="120" style="width : auto;" rows="5"
							maxlength="2500" value="#{tasks.overlapRemarks}"
							label="#{lbl['lbl.sm.remarks.overLapping']}"
							validatorMessage="#{lbl['lbl.sm.remarks.overLapping']} 
							#{lbl['lbl.sm.rmrkLength.thsndCharLimit']}" />
						<br /><br />
					</p:outputPanel>
					
					<p:outputPanel rendered="#{not empty tasks.pendingApproveCategories}">
						<ui:include src="appliedCategoryTable.xhtml" />
					</p:outputPanel>
					<p:outputPanel rendered="#{empty tasks.pendingApproveCategories}">
						<ui:include src="approvedCategoryTable.xhtml" />
					</p:outputPanel>
					
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.po.recommend']}">
					<h:outputText value="#{tasks.poRecommendation}" />
				</p:column>
			</p:dataTable>

		</p:panel>
		
		<br />
		<div align="right" >
			<p:commandButton
				value="#{lbl['lbl.btn.approve']}"
				id="approveBtnId" update="@form" onstart="blockWidget.show()"
				oncomplete="blockWidget.hide()" process="@this"
				disabled="#{empty bulkApplicationBackingBean.managedBean.selectedTasks}"
				action="#{bulkApplicationBackingBean.approveBulkApplication}" />
				&#160;
			<p:commandButton
				value="#{lbl['lbl.btn.reject']}"
				id="rejectBtnId" update="@form" onstart="blockWidget.show()"
				oncomplete="blockWidget.hide()" process="@this"
				disabled="#{empty bulkApplicationBackingBean.managedBean.selectedTasks}"
				action="#{bulkApplicationBackingBean.rejectBulkApplication}" />
			&#160;
			<p:commandButton
				disabled="#{empty bulkApplicationBackingBean.managedBean.selectedTasks}"
				action="#{bulkApplicationBackingBean.onReleaseBpmTask}" process="@this"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
				value="#{lbl['lbl.btn.cancel']}" update="@form" id="cancelBtnId"/>
		</div>
		
		<ac:smOverlapCategoryDialog 
			voList="#{bulkApplicationBackingBean.managedBean.selectedOverlapCategoryVOList}" />
		
		<ac:confirmationPopup id="approveConfirmPopup" width="400" height="100"
			widget="approveConfirmPopup" update="@form"
			okAction="bulkApplicationBackingBean.submitApprove()"
			title="#{lbl['lbl.sm.overlapped.category.approval.confirmation.title']}"
			content="#{lbl['lbl.sm.overlapped.category.approval.confirmation.msg']}" />
	
</ui:composition>
