<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false" />
	
	<p:panel header="#{bulkApplicationBackingBean.managedBean.applStatus eq bulkApplicationBackingBean.managedBean.RECOMMEND_REJECT ? 
		lbl['lbl.sm.bulk.application.rejection.list.confirm'] : lbl['lbl.sm.bulk.application.approval.list.confirm']}" toggleable="true" id="resultPanelId">
			
			<h:outputText rendered="#{not empty bulkApplicationBackingBean.managedBean.applStatus and 
				bulkApplicationBackingBean.managedBean.applStatus eq bulkApplicationBackingBean.managedBean.RECOMMEND_APPROVE}"
				styleClass="instruction" value="#{bulkApplicationBackingBean.managedBean.maxBulkApprovalMsg}"/>
			
			<p:dataTable id="claimTaskListId" rowKey="#{tasks}" 
				emptyMessage="#{lbl['lbl.pp.no.record.found']}"
				rowIndexVar="indexMain" var="tasks"
				value="#{bulkApplicationBackingBean.managedBean.claimTasks}"
				selection="#{bulkApplicationBackingBean.managedBean.selectedTasks}">
				<ac:paginator for="claimTaskListId" />

				<p:ajax event="toggleSelect" 
					update=":#{p:component('resultPanelId')},@([id$=approveBtnId]),:#{p:component('cancelBtnId')},:#{p:component('rejectBtnId')}"  
					process="@this"/>
				<p:ajax event="rowSelect" 
					update=":#{p:component('resultPanelId')},@([id$=approveBtnId]),:#{p:component('cancelBtnId')},:#{p:component('rejectBtnId')}" 
					process="@this" />
				<p:ajax event="rowSelectCheckbox" 
					update=":#{p:component('resultPanelId')},@([id$=approveBtnId]),:#{p:component('cancelBtnId')},:#{p:component('rejectBtnId')}" 
					process="@this" />
				<p:ajax event="rowUnselectCheckbox" 
					update=":#{p:component('resultPanelId')},@([id$=approveBtnId]),:#{p:component('cancelBtnId')},:#{p:component('rejectBtnId')}" 
					process="@this" />
				<p:ajax event="rowUnselect" 
					update=":#{p:component('resultPanelId')},@([id$=approveBtnId]),:#{p:component('cancelBtnId')},:#{p:component('rejectBtnId')}" 
					process="@this" />
					
				<p:column selectionMode="multiple" style="width:2% !important;" rendered="#{not empty bulkApplicationBackingBean.managedBean.claimTasks}"
						disabledSelection="#{tasks.notAllowedToTick}"/>
				
				<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 2%;">
					<h:outputText value="#{indexMain + 1}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.application.no']} (#{lbl['lbl.sm.companyname']})" disabledSelection="#{tasks.notAllowedToTick}">
					
					<br />
					<p:outputPanel rendered="#{tasks.overlappedCategory}">
						<font color="red">&#x26A0;</font>&#160;
						<h:outputText styleClass="warning" value="#{lbl['lbl.txt.alert']}" />&#160;
					</p:outputPanel>
					
					<table style="width: 100%">
						<tr>
							<td style="text-align: left;border-style: none !important;">
								<b><h:outputText value="#{tasks.appl.applNo} (#{tasks.appl.smSupplier.companyName})" /></b>
							</td>
							<td style="text-align: right;border-style: none !important;">
								<b><h:outputText value="#{lbl['lbl.rpt.rgstStatus']}" />&#160;:</b>
								&#160;&#160;<h:outputText value="#{tasks.poRecommendStatus}" />
							</td>
						</tr>
					</table>
					
					<br />
					
					<p:outputPanel rendered="#{tasks.overlappedCategory}">
						<br /><h:outputText styleClass="warning" value="#{lbl['lbl.sm.overlapped.category.msg.main']}" escape="false"/>
						<br /><h:outputText styleClass="warning" value="#{lbl['lbl.sm.overlapped.category.msg.please.click']}" escape="false"/>
						<p:commandLink onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()"
							action="#{bulkApplicationBackingBean.onViewOverlapCategory(tasks)}"
							process="@this"
							partialSubmit="true" update=":form">
								&#160;<h:outputText styleClass="warning" value="#{lbl['lbl.sm.overlapped.category.msg.here']}" escape="false"/>
						</p:commandLink>
						&#160;<h:outputText styleClass="warning" value="#{lbl['lbl.sm.overlapped.category.msg.to.view.details']}" escape="false"/>
						
						<br /><br />
						<p:inputTextarea cols="120" style="width : auto;" rows="5"
							maxlength="2500" value="#{tasks.overlapRemarks}"
							label="#{lbl['lbl.sm.remarks.overLapping']}"
							validatorMessage="#{lbl['lbl.sm.remarks.overLapping']} 
							#{lbl['lbl.sm.rmrkLength.thsndCharLimit']}" />
						<br /><br />
					</p:outputPanel>
					
					<p:outputPanel rendered="#{not empty tasks.pendingApproveCategories}">
						<ui:include src="appliedCategoryTable.xhtml" />
					</p:outputPanel>
					<p:outputPanel rendered="#{empty tasks.pendingApproveCategories}">
						<ui:include src="approvedCategoryTable.xhtml" />
					</p:outputPanel>
					
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.po.recommend']}" style="white-space: normal;">
				<h:outputText value="#{tasks.poRecommendation}" />
				<br /><br />
				<!-- #15629 - Start -->
				<h:outputText value="#{lbl['lbl.sm.rejection.reasons.bulk']} :&lt;br/&gt;#{tasks.rejectReasons}" escape ="false" rendered="#{not empty tasks.rejectReasons}"/>
				<!-- #15629 - End  -->
				<br />
				</p:column>
			</p:dataTable>

		</p:panel>
		
		<br />
		<div align="right" >
			<p:commandButton
				value="#{lbl['lbl.btn.approve']}"
				rendered="#{bulkApplicationBackingBean.managedBean.applStatus eq 
				bulkApplicationBackingBean.managedBean.RECOMMEND_APPROVE}"
				id="approveBtnId" update="@form" onstart="blockWidget.show()"
				oncomplete="blockWidget.hide()" process="@this,:#{p:component('resultPanelId')}"
				disabled="#{empty bulkApplicationBackingBean.managedBean.selectedTasks}"
				action="#{bulkApplicationBackingBean.approveBulkApplication}" />
				&#160;
			<!-- #15629 start -->
		    <p:commandButton
				value="#{lbl['lbl.btn.reject']}"
				id="rejectBtnId" update="@form" onstart="blockWidget.show()"
				oncomplete="blockWidget.hide()" process="@this,:#{p:component('resultPanelId')}"
				disabled="#{empty bulkApplicationBackingBean.managedBean.selectedTasks}"
				action="#{bulkApplicationBackingBean.rejectBulkApplication}" />
			&#160;
			<!-- #15629 end -->
			<p:commandButton
				disabled="#{empty bulkApplicationBackingBean.managedBean.selectedTasks}"
				action="#{bulkApplicationBackingBean.onReleaseBpmTask}" process="@this"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
				value="#{lbl['lbl.btn.cancel']}" update="@form" id="cancelBtnId"/>
		</div>
		
		<ac:smOverlapCategoryDialog 
			voList="#{bulkApplicationBackingBean.managedBean.selectedOverlapCategoryVOList}" />
		
		<p:confirmDialog id="approveConfirmPopup" closable="true"
			message="#{lbl['lbl.sm.overlapped.category.approval.confirmation.msg']}"
			header="#{lbl['lbl.sm.overlapped.category.approval.confirmation.title']}" severity="alert"
			widgetVar="approveConfirmPopup">
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="approveConfirmPopup.hide();" 
					action="#{bulkApplicationBackingBean.submitApprove}" update="@form" partialSubmit="true"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" process="@this"/>
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="approveConfirmPopup.hide();" />
			</div>
		</p:confirmDialog>
	
</ui:composition>
