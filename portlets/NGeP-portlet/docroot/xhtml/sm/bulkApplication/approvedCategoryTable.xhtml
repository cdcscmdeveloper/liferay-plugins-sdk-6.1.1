<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.catCodes.panHdr']}" toggleable="true">
		<p:dataTable var="apprCat" value="#{tasks.approvedPaginator.model}" rowIndexVar="indexAppr" >
			
			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 2%;">
				<p:outputLabel value="#{indexAppr + 1 + tasks.approvedPaginator.fromIndex}"
					style="float: left;white-space: normal;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.catCodes.cate']}" style="width : 40%;">
				<p:outputPanel rendered="#{not empty apprCat.pmCategoryL1}">
					<!-- #28175 start -->
					<h:outputText value="#{apprCat.pmCategoryL1.categoryL1Code} -  #{apprCat.pmCategoryL1.categoryName}" 
						style="float: left;white-space: normal;" /><br /> 
				</p:outputPanel> 
				<p:outputPanel rendered="#{not empty apprCat.pmCategoryL2}"> 
					<h:outputText value="#{apprCat.pmCategoryL2.categoryL2Code} -  #{apprCat.pmCategoryL2.categoryName}" 
						style="float: left;white-space: normal;" /><br /> 
				</p:outputPanel> 
				<p:outputPanel rendered="#{not empty apprCat.pmCategoryL3}"> 
					<h:outputText value="#{apprCat.pmCategoryL3.categoryL3Code} -  #{apprCat.pmCategoryL3.categoryName}" style="float: left;white-space: normal;" />
					<!-- #28175 end -->
				</p:outputPanel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.catCodes.othDesc']}" >
				<h:outputText value="#{apprCat.otherDesc}" rendered="#{apprCat.pmCategoryL3.categoryL3Code eq 99}" style="float: left;white-space: normal;"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.catCodes.catType']}">
				<h:outputText value="#{lbl['lbl.sm.catCodes.norm']}"
					rendered="#{!apprCat.specialCategory}" style="float: left;white-space: normal;" />
				<h:outputText value="#{lbl['lbl.sm.catCodes.spl']}"
					rendered="#{apprCat.specialCategory}" style="float: left;white-space: normal;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.status']}">
				<h:outputText value="#{lbl['lbl.sm.catCodes.pendingDec']}"
					rendered="#{apprCat.recordStatusFlg eq SupplierManagementConst.PENDING_ACT_STATUS}" style="float: left;white-space: normal;" />
				<h:outputText value="#{lbl['lbl.sm.catCodes.approved']}"
					rendered="#{apprCat.recordStatusFlg eq SupplierManagementConst.APPROVED_RECORD_STATUS}" style="float: left;white-space: normal;" />
			</p:column>
				
		</p:dataTable>
		<br />
		<ac:smBulkPaginator paginator="#{tasks.approvedPaginator}" />
	</p:panel>

</ui:composition>
