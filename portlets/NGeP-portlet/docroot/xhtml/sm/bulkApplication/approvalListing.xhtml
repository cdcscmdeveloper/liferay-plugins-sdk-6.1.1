<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">		
		
		<p:panel header="#{lbl['lbl.sm.bulk.application.list.group']}"
			toggleable="true" id="unClaimPanelId">
			<p:dataTable id="unClaimTaskListId" rowKey="#{unclaim}" 
				emptyMessage="#{lbl['lbl.pp.no.record.found']}"
				var="unclaim" rowIndexVar="index" 
				selection="#{bulkApplicationBackingBean.managedBean.selectedUnclaimTasks}"
				value="#{bulkApplicationBackingBean.managedBean.unClaimTasks}">
				<ac:paginator for="unClaimTaskListId" />
				
				<p:ajax event="toggleSelect" update="@([id$=claimBtnId])" process="@this"/>
				<p:ajax event="rowSelect" update="@([id$=claimBtnId])" process="@this" />
				<p:ajax event="rowSelectCheckbox" update="@([id$=claimBtnId])" process="@this" />
				<p:ajax event="rowUnselectCheckbox" update="@([id$=claimBtnId])" process="@this" />
				<p:ajax event="rowUnselect" update="@([id$=claimBtnId])" process="@this" />
				
				<p:column selectionMode="multiple" style="width:2% !important;" />
				
				<p:column style="white-space:normal;"
					headerText="#{lbl['lbl.sm.date.received']}">
					<h:outputText value="#{unclaim.receivedDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.application.no']}">
					<h:outputText value="#{unclaim.appl.applNo}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.applicationtype']}"
					style="width :25%;white-space : normal">
					<h:outputText value="#{lbl['lbl.sm.appltype.newmof']}"
						rendered="#{unclaim.appl.applType eq 'N'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.bumiputera']}"
						rendered="#{unclaim.appl.applType eq 'B'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.categorycode']}"
						rendered="#{unclaim.appl.applType eq 'A'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.updateprofile']}"
						rendered="#{unclaim.appl.applType eq 'U'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.cancelmof']}"
						rendered="#{unclaim.appl.applType eq 'C'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.renewmof']}"
						rendered="#{unclaim.appl.applType eq 'R'}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.companyname']}">
					<h:outputText value="#{unclaim.appl.smSupplier.companyName}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.siteassign.processing.officer']}">
					<h:outputText value="#{unclaim.po.userName}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		
		<br />
		<div align="right" >
			<p:commandButton
				action="#{bulkApplicationBackingBean.refreshTaskList}" process="@this"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				value="#{lbl['lbl.bpm.refresh']}" update="@form" />
			&#160;
			<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}" id="claimBtnId"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				action="#{bulkApplicationBackingBean.onClaimBpmTask}"
				disabled="#{empty bulkApplicationBackingBean.managedBean.selectedUnclaimTasks}"
				update="@form" process="@this"/>
		</div>
		<br />
		
</ui:composition>
