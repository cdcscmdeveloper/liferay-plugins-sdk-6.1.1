<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:panel header="Payment Item" rendered="#{paymentBackingBean.managedBean.applicationPayment != null}">
			<p:dataTable value="#{paymentBackingBean.managedBean.applicationPayment}" var="billItem">
				<p:column headerText="Application Payment">
					#{billItem.itemDesc}
				</p:column>
				
				<p:column headerText="Price">
					<h:outputText value="#{billItem.itemPrice}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
			</p:dataTable>
		</p:panel>
		
		<p:panel header="Soft Certificate" rendered="#{not empty paymentBackingBean.managedBean.softCertReqPersonnels}">
			<p:dataTable
				value="#{paymentBackingBean.managedBean.softCertReqPersonnels}"
				var="softCertReq"
				selection="#{paymentBackingBean.managedBean.selectedSoftCertLs}"
				id="softCertReqId" rowKey="#{softCertReq.personnelId}">
				
				<p:column selectionMode="multiple" style="width:2%" />
				
				<p:column headerText="Name">
					#{softCertReq.name}
				</p:column>
				
				<p:column headerText="Identification No.">
					#{softCertReq.identificationNo}
				</p:column>
			</p:dataTable>
		</p:panel>
		
		<div align="right">
			<p:commandButton value="Proceed to Payment" action="#{paymentBackingBean.proceedToPaymentSummary}"></p:commandButton>
		</div>
	</ui:define>
</ui:composition>
