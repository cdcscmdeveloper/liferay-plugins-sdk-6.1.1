<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_SoftCertPayment_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.wizard.paymentLbl']}");
			$('#portlet_MOFApplication_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.wizard.paymentLbl']}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:panel header="#{lbl['lbl.sm.payment.item']}" rendered="#{paymentBackingBean.managedBean.applicationPayment != null}">
			<p:dataTable value="#{paymentBackingBean.managedBean.applicationPayment}" var="billItem">
				<p:column headerText="#{lbl['lbl.sm.payment.application']}">
					<h:outputText value="#{paymentBackingBean.getBillItemDescByLanguage(billItem.itemCode)}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.price']}">
					<h:outputText value="#{billItem.itemPrice}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
			</p:dataTable>
		</p:panel>
		
		<p:panel header="#{lbl['lbl.sm.soft.cert']}" rendered="#{not empty paymentBackingBean.managedBean.softCertReqPersonnels}">
			<p:dataTable
				value="#{paymentBackingBean.managedBean.softCertReqPersonnels}"
				var="softCertReq"
				selection="#{paymentBackingBean.managedBean.selectedSoftCertLs}"
				id="softCertReqId" rowKey="#{softCertReq.personnelId}">
				
				<p:ajax event="rowSelect" update="@([id$=proceedBtnId])"></p:ajax>
				<p:ajax event="rowUnselect" update="@([id$=proceedBtnId])"></p:ajax>
				<p:ajax event="rowSelectCheckbox" update="@([id$=proceedBtnId])"></p:ajax>
				<p:ajax event="rowUnselectCheckbox" update="@([id$=proceedBtnId])"></p:ajax>
				<p:ajax event="rowDblselect" update="@([id$=proceedBtnId])"></p:ajax>
				<p:ajax event="toggleSelect" update="@([id$=proceedBtnId])" ></p:ajax>
				
				<p:column selectionMode="multiple" style="width:2%" />
				
				<p:column headerText="#{lbl['lbl.sm.soft.cert.name']}">
					#{softCertReq.name}
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.soft.cert.idno']}">
					#{softCertReq.identificationNo}
				</p:column>
			</p:dataTable>
		</p:panel>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.proceed.to.pymnt']}" id="proceedBtnId" 
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			disabled="#{empty paymentBackingBean.managedBean.selectedSoftCertLs and empty paymentBackingBean.managedBean.applicationPayment}" 
			update="@([id$=paymentSummaryTitleId])"
			action="#{paymentBackingBean.proceedToPaymentSummary}" />
		</div>
	</ui:define>
</ui:composition>
