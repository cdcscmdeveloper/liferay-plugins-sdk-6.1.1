<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
	<p:panel header="Summary">
		<p:dataTable value="#{paymentBackingBean.managedBean.newSmBillDtlLs}" var="itemLs">
			<p:column headerText="Item">
					#{itemLs.itemDesc}
					<h:outputText rendered="#{itemLs.pmParameter.parameterCode eq 'SF'}"  value="- #{itemLs.smPersonnel.name}" />
				</p:column>

			<p:column headerText="Price">
					<h:outputText value="#{itemLs.itemPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>

<!-- 		<table> -->

<!-- 				<th>Item</th> -->
<!-- 				<th>Price</th> -->
<!-- 			</tr> -->
<!-- 			<ui:repeat var="itemLs" value="#{paymentBackingBean.managedBean.newSmBillDtlLs}" varStatus="status"> -->
<!-- 				<tr> -->
<!-- 					<td>#{itemLs.itemDesc} <h:outputText rendered="#{itemLs.pmParameter.parameterCode eq 'SF'}"  value="- #{itemLs.smPersonnel.name}" /></td> -->
<!-- 					<td>#{itemLs.itemPrice}</td> -->
<!-- 				</tr> -->
<!-- 			</ui:repeat> -->
<!-- 		</table> -->

		<div align="right">
			<h3>Total:
			<h:outputText value="#{paymentBackingBean.managedBean.totalAmount}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText></h3>
		</div>


		<p:outputPanel rendered="#{!paymentBackingBean.managedBean.offlinePayment}">
			<p:panel header="Payment Method" id="pnlPaymentMethod">
				<p:selectOneMenu id="paymentMethodid" value="#{paymentBackingBean.managedBean.paymentMode}">
					<f:selectItems value="#{paymentBackingBean.getPaymentModeDropDown()}" />
				</p:selectOneMenu>
			</p:panel>

			<div align="right">
				<p:commandButton value="Proceed" id="btnSubmit" action="#{paymentBackingBean.submitPayment}" />
			</div>
		</p:outputPanel>


	</ui:define>
</ui:composition>
