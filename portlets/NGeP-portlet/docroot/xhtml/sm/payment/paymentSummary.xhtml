<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	<p:panel header="Payment Summary">
		<p:dataTable value="#{paymentBackingBean.managedBean.newSmBillDtlLs}" var="itemLs">
			<p:column headerText="Item">
					#{itemLs.itemDesc}
					<h:outputText rendered="#{itemLs.pmParameter.parameterCode eq 'SF'}"  value="- #{itemLs.smPersonnel.name}" />
				</p:column>

			<p:column headerText="Price">
					<h:outputText value="#{itemLs.itemPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>

		<div align="right">
			<h3>Total:
			<h:outputText value="#{paymentBackingBean.managedBean.totalAmount}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText></h3>
		</div>


			<div align="right">
			<ui:remove>
				<p:commandButton value="Proceed" id="btnSubmit" action="#{paymentBackingBean.tempPaymentSuccess}"></p:commandButton>
			</ui:remove>
				
				<p:commandButton value="Proceed" id="btnSubmit" action="#{paymentBackingBean.submitPayment}" />
				
			</div>



	</ui:define>
</ui:composition>
