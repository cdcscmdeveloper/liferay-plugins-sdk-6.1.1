<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui" >
	
	<ui:define name="resourceSection">
		<p:outputPanel rendered="#{paymentBackingBean.managedBean.paymentType eq 'PF'}">
			<script>
				$('#portlet_MOFApplication_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.payment.receipt.payment.type.proc']}");
			</script>
		</p:outputPanel>
		<p:outputPanel rendered="#{paymentBackingBean.managedBean.paymentType eq 'SF'}">
			<script>
				$('#portlet_MOFApplication_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.rpt.smSoftCertificateFee']}");
			</script>
		</p:outputPanel>
		<p:outputPanel rendered="#{paymentBackingBean.managedBean.paymentType ne 'SF' and paymentBackingBean.managedBean.paymentType ne 'PF'}">
			<script>
				$('#portlet_MOFApplication_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.payment.receipt.payment.type.reg']}");
			</script>
		</p:outputPanel>
	</ui:define>
	
    <ui:define name="contentSection">
    	<ui:param name="lblPaymentBillType"
					value="#{empty paymentAcknowledgeBackingBean.managedBean.billTypeLbl ? 'lbl.sm.payment.process' : paymentAcknowledgeBackingBean.managedBean.billTypeLbl}" />
		<p:panel id="acknowledge" header="#{lbl[lblPaymentBillType]}">
			<p:messages id="ackMsg" showDetail="true" autoUpdate="true" escape="false" />

			<p:outputPanel rendered="#{(paymentAcknowledgeBackingBean.managedBean.paymentId != null) and (paymentAcknowledgeBackingBean.managedBean.paymentStatus)}">
				<h:outputText value="#{lbl['lbl.sm.payment.click']} " />
				<p:commandLink value="#{lbl['lbl.sm.payment.here']} " ajax="false">
					<p:fileDownload value="#{paymentAcknowledgeBackingBean.printReceipt()}" />
				</p:commandLink>
				<h:outputText value=" #{lbl['lbl.sm.payment.to.download.receipt']}" />
			</p:outputPanel>
		</p:panel>
	</ui:define>
		    
</ui:composition>
