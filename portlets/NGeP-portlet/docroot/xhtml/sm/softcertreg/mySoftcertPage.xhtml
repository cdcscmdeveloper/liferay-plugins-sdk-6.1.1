<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" 
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_MySoftCert_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.mysoftcert.panHeader']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	
	<p:panel header="#{lbl['lbl.sm.mysoftcert.info.panHeader']}" toggleable="true"
		id="mySoftcertPanelId">
		
		<table style="width: 100%;table-layout:fixed">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.name']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{softCertBackingBean.managedBean.loginUserPersonnelInfo.name}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mysoftcert.no']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{softCertBackingBean.managedBean.loginUserPersonnelInfo.softcertNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.shrHldrInfo.idNo']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{softCertBackingBean.managedBean.loginUserPersonnelInfo.identificationNo}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mysoftcert.validity']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{softCertBackingBean.managedBean.loginUserPersonnelInfo.softcertValidityDate}" /></td>
			</tr>
			<tr>
				<td></td>
				<td></td>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mysoftcert.status']}" /></td>
				<td>
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.composition.pending.request']}" rendered="#{softCertBackingBean.managedBean.loginUserPersonnelInfo.softcertFlg eq '4'}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.composition.processing']}" rendered="#{softCertBackingBean.managedBean.loginUserPersonnelInfo.softcertFlg eq '3'}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.composition.requested']}" rendered="#{softCertBackingBean.managedBean.loginUserPersonnelInfo.softcertFlg eq '2'}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.composition.issued']}" rendered="#{softCertBackingBean.managedBean.loginUserPersonnelInfo.softcertFlg eq '1'}" />
					<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.composition.notapplied']}" rendered="#{softCertBackingBean.managedBean.loginUserPersonnelInfo.softcertFlg eq '0'}" />
				</td>
			</tr>
		</table>
		
		<p:spacer height="2px;" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.update.chalresponse']}"
				process="@this" partialSubmit="true" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
				disabled="#{softCertBackingBean.managedBean.loginUserPersonnelInfo.softcertFlg ne '1'}"
				action="#{softCertBackingBean.updateChallengeResponse}"
				update="mySoftcertPanelId" />
			<p:commandButton value="#{lbl['lbl.sm.button.change.pin']}"
				process="@this" partialSubmit="true" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				disabled="#{softCertBackingBean.managedBean.loginUserPersonnelInfo.softcertFlg ne '1'}"
				action="#{softCertBackingBean.changePin}"
				update="mySoftcertPanelId" />
			<p:commandButton value="#{lbl['lbl.sm.button.reset.pin']}"
				process="persInfoDtPanel" partialSubmit="true" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				disabled="#{softCertBackingBean.managedBean.loginUserPersonnelInfo.softcertFlg ne '1'}"
				action="#{softCertBackingBean.resetPin}"
				update="mySoftcertPanelId" />
		</div>
	</p:panel>
	
	</ui:define>


</ui:composition>
