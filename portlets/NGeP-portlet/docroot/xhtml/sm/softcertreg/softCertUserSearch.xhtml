<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="contentSection">

		<p:panel styleClass="noBorders tr,noBorders td" style="width:100%">
			<table style="width: 100%;">
				<tr>
					<td>
						<p:commandButton value="#{lbl['lbl.sm.button.proceed']}" oncomplete="confirmDialog.show();"
						style="float:right;" icon="ui-icon-next">
					</p:commandButton>
					</td>
				</tr>
			</table>	
		</p:panel>

		<h:panelGrid id="search" style="width:100%;">

			<p:panel header="#{lbl['lbl.sm.results']}" toggleable="true">
				<p:dataTable id="softCertPageDataModelId" rowKey="#{personnel}"
					rowIndexVar="index" lazy="true"
					value="#{softCertBackingBean.managedBean.softCertPagingDataModel}"
					var="personnel"
					selection="#{softCertBackingBean.managedBean.softCertSelectList}">
					<ac:paginator for="softCertPageDataModelId" />
					<p:column selectionMode="multiple" style="width:2%" />

					<p:column headerText="#{lbl['lbl.sm.userprofile.name']}">
						<h:outputText value="#{personnel.name}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.nationality']}">
						<h:outputText value="#{personnel.pmCountry.countryName}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.isauthorized']}"
						rendered="#{softCertBackingBean.managedBean.loginRoleName eq 'MOF_SUPPLIER_ADMIN'}">
						<h:outputText value="Y" rendered="#{personnel.authorized}" />
						<h:outputText value="N" rendered="!#{personnel.authorized}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sm.userprofile.eprole']}">
						<h:outputText value="#{personnel.epRole}" />
					</p:column>

					<p:column
						headerText="#{lbl['lbl.sm.userprofile.assignedsoftcert']}">
						<h:outputText value="Y" rendered="#{personnel.softcert}" />
						<h:outputText value="N"
							rendered="#{!personnel.softcert || personnel.softcert eq null}" />
					</p:column>

					<p:column
						headerText="#{lbl['lbl.sm.userprofile.softcertexpirationdate']}">
						<h:outputText />
					</p:column>

					<p:column
						headerText="#{lbl['lbl.sm.userprofile.iscontractsigner']}"
						rendered="#{softCertBackingBean.managedBean.loginRoleName eq 'MOF_SUPPLIER_ADMIN'}">
						<h:outputText value="Y" rendered="#{personnel.contractSigner}" />
						<h:outputText value="N" rendered="!#{personnel.contractSigner}" />
					</p:column>
				</p:dataTable>
			</p:panel>

		</h:panelGrid>

		<p:dialog id="confirmDialog" header="Confirmation"
			widgetVar="confirmDialog" modal="true" width="500" height="100">
			<p:panel id="dPanel" style="width:100%">
				<table>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.soft.cert.wishcont.qmark']}" /></td>
					</tr>
					<tr>
						<td>
							<div align="center">
								<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDialog.hide();"
									ajax="false"
									action="#{softCertBackingBean.navigateToPaymentPage}" />
								<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDialog.hide();" />
							</div>
						</td>
					</tr>
				</table>
			</p:panel>
		</p:dialog>

	</ui:define>
</ui:composition>
