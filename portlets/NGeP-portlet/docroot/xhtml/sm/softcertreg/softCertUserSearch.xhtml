<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_SoftCertReg_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.softcert.management']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" escape="false"/>
	
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<table style="width: 100%;">
			<tr>
				<td style="text-align: left;">
					<p:commandButton value="#{lbl['lbl.sm.request.softcert']}" action="#{softCertBackingBean.navigateToPaymentPage}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						style="float:right;" id="proceedBtnId" disabled="#{empty softCertBackingBean.managedBean.softCertSelectList}">
					</p:commandButton>
				</td>
			</tr>
		</table>
		<br />
		
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.softcert.disclaimer']}"/>

		<p:panel header="#{lbl['lbl.sm.softcert.authpersonnel.panheader']}" toggleable="true" id="resultPanelId">
			<p:dataTable id="softCertPageDataModelId" rowKey="#{personnel}"
				rowIndexVar="index" value="#{softCertBackingBean.managedBean.authorizedPersonnels}"
				var="personnel" selection="#{softCertBackingBean.managedBean.softCertSelectList}">
				<ac:paginator for="softCertPageDataModelId" />
				
				<p:ajax event="rowSelect" listener="#{softCertBackingBean.unSelectPersonnel}"
					update=":form:resultPanelId,@([id$=proceedBtnId])"></p:ajax>
				<p:ajax event="rowUnselect"
					listener="#{softCertBackingBean.unSelectPersonnel}"
					update=":form:resultPanelId,@([id$=proceedBtnId])"></p:ajax>
				<p:ajax event="rowSelectCheckbox"
					listener="#{softCertBackingBean.unSelectPersonnel}"
					update=":form:resultPanelId,@([id$=proceedBtnId])"></p:ajax>
				<p:ajax event="rowUnselectCheckbox"
					listener="#{softCertBackingBean.unSelectPersonnel}"
					update=":form:resultPanelId,@([id$=proceedBtnId])"></p:ajax>
				<p:ajax event="rowDblselect"
					listener="#{softCertBackingBean.unSelectPersonnel}"
					update=":form:resultPanelId,@([id$=proceedBtnId])"></p:ajax>
				<p:ajax event="toggleSelect"
					listener="#{softCertBackingBean.unSelectPersonnel}"
					update=":form:resultPanelId,@([id$=proceedBtnId])"></p:ajax>
					
				<p:column selectionMode="multiple" style="width:2%" disabledSelection="#{personnel.disableRowSelection}"/>

				<p:column headerText="#{lbl['lbl.sm.userprofile.name']}" disabledSelection="#{personnel.disableRowSelection}">
					<h:outputText value="#{personnel.name}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.userprofile.nationality']}" disabledSelection="#{personnel.disableRowSelection}">
					<h:outputText value="#{personnel.pmCountry.countryName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.userprofile.eprole']}" disabledSelection="#{personnel.disableRowSelection}">
					<h:outputText value="#{lbl['lbl.sm.person.composition.suppAdmin']}"
						rendered="#{personnel.epRole eq 'MOF_SUPPLIER_ADMIN' or personnel.epRole eq 'BASIC_SUPPLIER_ADMIN' or personnel.epRole eq 'SUPPLIER_TEMP'}" />
					<h:outputText value="#{lbl['lbl.sm.person.composition.suppUser']}"
						rendered="#{personnel.epRole eq 'BASIC_SUPPLIER_USER' or personnel.epRole eq 'MOF_SUPPLIER_USER'}" />
					<h:outputText value="#{lbl['lbl.sm.person.composition.catUser']}"
						rendered="#{personnel.epRole eq 'CM_USER'}" />
					<h:outputText value=" (#{lbl['lbl.sm.contract.signer']})"
						rendered="#{personnel.contractSigner}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.person.composition.certStatus']}" disabledSelection="#{personnel.disableRowSelection}">
					<h:outputText
						value="#{lbl['lbl.sm.person.composition.pending.request']}"
						rendered="#{personnel.softcertFlg eq '4'}" />
					<h:outputText
						value="#{lbl['lbl.sm.person.composition.processing']}"
						rendered="#{personnel.softcertFlg eq '3'}" />
					<h:outputText
						value="#{lbl['lbl.sm.person.composition.requested']}"
						rendered="#{personnel.softcertFlg eq '2'}" />
					<h:outputText value="#{lbl['lbl.sm.person.composition.issued']}"
						rendered="#{personnel.softcertFlg eq '1'}" />
					<h:outputText
						value="#{lbl['lbl.sm.person.composition.notapplied']}"
						rendered="#{personnel.softcertFlg eq '0'}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.userprofile.accountstatus']}" disabledSelection="#{personnel.disableRowSelection}">
					<h:outputText value="#{lbl['lbl.sm.accountstatus.active']}" rendered="#{personnel.recordStatusFlg eq '1'}" />
					<h:outputText value="#{lbl['lbl.sm.accountstatus.pendingactivation']}" rendered="#{personnel.recordStatusFlg eq '8'}" />
				</p:column>
				
				<p:column disabledSelection="#{personnel.disableRowSelection}"
					headerText="#{lbl['lbl.sm.softcert.no']}">
					<h:outputText value="#{personnel.softcertNo}" />
				</p:column>

				<p:column disabledSelection="#{personnel.disableRowSelection}"
					headerText="#{lbl['lbl.sm.userprofile.softcertexpirationdate']}">
					<h:outputText value="#{personnel.softcertValidityDate}" />
				</p:column>
				
				<p:column disabledSelection="#{personnel.disableRowSelection}"
					headerText="#{lbl['lbl.sm.label.action']}">
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{personnel.softcertFlg ne '1'}"/>
					<h:commandLink rendered="#{personnel.softcertFlg eq '1'}"
						action="#{softCertBackingBean.revoke(personnel)}" target="_blank"
						process="@this" partialSubmit="true" update=":form" value="#{lbl['lbl.sm.softcert.revoke']}"/>
				</p:column>

			</p:dataTable>
		</p:panel>

	</ui:define>
</ui:composition>
