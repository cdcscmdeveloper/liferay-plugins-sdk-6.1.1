<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<ui:define name="contentSection">
	
		<p:panel styleClass="noBorders tr,noBorders td" style="width:100%">
			<table style="width: 100%;">
				<tr>
					<td>
						<p:commandButton value="#{lbl['lbl.btn.back']}" ajax="false" icon="ui-icon-back"
							immediate="true" action="#{softCertBackingBean.cancel}" />
					</td>
					<td style="white-space: nowrap; float: right;">
					    <p:commandButton value="#{lbl['lbl.sm.makePayment']}" style="float:right;" icon="ui-icon-next"
					    	action="#{softCertBackingBean.makePayment}"/>
					</td>
				</tr>
			</table>	
		</p:panel>

	<h:panelGrid id="search" style="width:100%;">
	 
	<p:panel header="#{lbl['lbl.sm.payment.selection']}" toggleable="true">
	<p:dataTable id="paymentList" rowKey="#{personnel}" rowIndexVar="index" 
				value="#{softCertBackingBean.managedBean.softCertSelectList}" var="personnel" 
				editable="true" style="word-wrap: break-word;table-layout: fixed;" 
				selection="#{softCertBackingBean.managedBean.softCertPayList}">
 
 		<p:columnGroup type="header">
			<p:row>
				<p:column selectionMode="multiple" style="width:2%" />
				<p:column headerText="#{lbl['lbl.sm.payment.description']}" />
				<p:column headerText="#{lbl['lbl.sm.person.shrAmt']}" />

			</p:row>
		</p:columnGroup>
 
 		<p:ajax event="toggleSelect" listener="#{softCertBackingBean.updateAmount()}" update=":form:paymentList"/>
		<p:ajax event="rowSelect" listener="#{softCertBackingBean.updateAmount()}" update=":form:paymentList"/>
		<p:ajax event="rowSelectCheckbox" listener="#{softCertBackingBean.updateAmount()}" update=":form:paymentList"/>
		<p:ajax event="rowUnselectCheckbox" listener="#{softCertBackingBean.updateAmount()}" update=":form:paymentList"/>
		<p:ajax event="rowUnselect" listener="#{softCertBackingBean.updateAmount()}" update=":form:paymentList"/>
 
		<p:column selectionMode="multiple" style="width:2%"/> 
						
       <p:column>
        <h:outputText value="#{lbl['lbl.sm.soft.cert.payment.for']} #{personnel.name}"/>  
       </p:column>
       
       <p:column>
        <h:outputText value="150.00" />  
       </p:column>
       
       <p:columnGroup type="footer">
			<p:row>
				<p:column footerText=""></p:column>
				<p:column footerText="#{lbl['lbl.sm.total']}"
					style="text-align:left" />
				<p:column footerText="#{softCertBackingBean.managedBean.totalPaymentAmount}" style="text-align:left"/>

			</p:row>
		</p:columnGroup>
       
     </p:dataTable>
	</p:panel>
	
</h:panelGrid>

</ui:define>
</ui:composition>
