<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
	<p:outputPanel>
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.back']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						update="@form" action="#{softCertBackingBean.backToUploadPage}" />
				</td>
				<td style="white-space: nowrap; float: right;">
				    <p:commandButton value="#{lbl['lbl.btn.submit']}" style="float:right;" update="@form"
				    	disabled="#{empty softCertBackingBean.managedBean.softCertPayList}" id="makePaymentBtnId"
				    	action="#{softCertBackingBean.showConfirmDialog}" onclick="blockWidget.show()" oncomplete="blockWidget.hide()"/>
				</td>
			</tr>
		</table>	
	</p:outputPanel>

	<p:panel header="#{lbl['lbl.sm.payment.selection']}" toggleable="true">
	
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.gst.disclaimer']}"/>
		
		<p:dataTable id="paymentList" rowKey="#{personnel}" rowIndexVar="index" 
					value="#{softCertBackingBean.managedBean.softCertSelectList}" var="personnel" 
					editable="true" style="word-wrap: break-word;table-layout: fixed;" 
					selection="#{softCertBackingBean.managedBean.softCertPayList}">
	 
	 		<p:columnGroup type="header">
				<p:row>
					<p:column selectionMode="multiple" style="width:2%" />
					<p:column headerText="#{lbl['lbl.sm.payment.description']}" />
					<p:column headerText="#{lbl['lbl.sm.person.shrAmt']}" />
	
				</p:row>
			</p:columnGroup>
	 
	 		<p:ajax event="toggleSelect" listener="#{softCertBackingBean.updateAmount()}" update=":form:paymentList,@([id$=makePaymentBtnId])"/>
			<p:ajax event="rowSelect" listener="#{softCertBackingBean.updateAmount()}" update=":form:paymentList,@([id$=makePaymentBtnId])"/>
			<p:ajax event="rowSelectCheckbox" listener="#{softCertBackingBean.updateAmount()}" update=":form:paymentList,@([id$=makePaymentBtnId])"/>
			<p:ajax event="rowUnselectCheckbox" listener="#{softCertBackingBean.updateAmount()}" update=":form:paymentList,@([id$=makePaymentBtnId])"/>
			<p:ajax event="rowUnselect" listener="#{softCertBackingBean.updateAmount()}" update=":form:paymentList,@([id$=makePaymentBtnId])"/>
	 
			<p:column selectionMode="multiple" style="width:2%"/> 
							
	       <p:column>
	        <h:outputText value="#{lbl['lbl.sm.soft.cert.payment.for']} #{personnel.name}"/>  
	       </p:column>
	       
	       <p:column>
	        <h:outputText value="#{softCertBackingBean.getPersonnelSoftCertPrice(personnel)}" />  
	       </p:column>
	       
	       <p:columnGroup type="footer">
	       		<p:row>
	       			<p:column footerText=""></p:column>
	                <p:column style="text-align:right" footerText="#{lbl['lbl.sm.gst.total.exclude.gst']} :" />
	                <p:column footerText="#{softCertBackingBean.managedBean.totalAmountBeforeGst}" style="text-align:left"/>
	            </p:row>
	            <p:row>
	            	<p:column footerText=""></p:column>
	                <p:column style="text-align:right" footerText="#{lbl['lbl.sm.add.gst']} :" />
	                <p:column footerText="#{softCertBackingBean.managedBean.totalGstAmount}" style="text-align:left"/>
	            </p:row>
	            <p:row>
	            	<p:column footerText=""></p:column>
	                <p:column style="text-align:right" footerText="#{lbl['lbl.sm.payment.total.payable']} :" />
	                <p:column footerText="#{softCertBackingBean.managedBean.totalPaymentAmount}" style="text-align:left"/>
	            </p:row>
			</p:columnGroup>
			
	     </p:dataTable>
	     
	</p:panel>

	<p:dialog id="confirmDialog" header="#{lbl['lbl.sm.softcert.admin.declaration']}"
		widgetVar="confirmDialog" modal="true" width="500px" height="400px">
		<p:panel id="dPanel" style="border: none;">
			<table style="width: 100%">
				<tr>
					<td>
						<h:outputText value="#{lbl['lbl.sm.softcert.admin.himself.declare']}" 
							rendered="#{!softCertBackingBean.managedBean.applySoftcertForOthers}" 
							style="float: left;white-space: normal;" escape="false"/>
						<h:outputText value="#{lbl['lbl.sm.softcert.admin.others.declare']}" 
							rendered="#{softCertBackingBean.managedBean.applySoftcertForOthers}" 
							style="float: left;white-space: normal;" escape="false"/>
					</td>
				</tr>
			</table>
		</p:panel>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.declare']}" onclick="confirmDialog.hide();" 
				action="#{softCertBackingBean.makePayment}" 
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form" id="btnYes"/>
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" onclick="confirmDialog.hide();" />
		</div>
	</p:dialog>
	
	<p:outputPanel id="spkiOutPanel" autoUpdate="false">
		<ac:spkiPopup id="spkiPopup"
			password="#{softCertBackingBean.managedBean.spkiBackingBean.password}"
			challengeAns1="#{softCertBackingBean.managedBean.spkiBackingBean.challengeAns1}"
			challengeQues1="#{softCertBackingBean.managedBean.spkiBackingBean.challengeQues1}"
			postSignAction="#{softCertBackingBean.onClickSignSpki()}" />
	</p:outputPanel>

</ui:composition>
