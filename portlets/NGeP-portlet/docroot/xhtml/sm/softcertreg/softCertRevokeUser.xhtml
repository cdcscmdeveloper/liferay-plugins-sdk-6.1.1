<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
		
		
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.back']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
						action="#{softCertBackingBean.backToPersonnelListPage}" update="@form"/>
				</td>
				<td style="white-space: nowrap; float: right;">
					<p:commandButton value="#{lbl['lbl.btn.proceed']}" action="#{softCertBackingBean.onDisplaySpkiPopup()}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form"
						style="float:right;" id="proceedRevokeBtnId" disabled="#{empty softCertBackingBean.managedBean.softCertSelectList}">
					</p:commandButton>
				</td>
			</tr>
		</table>
		
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.softcert.revoke.tnc']}" escape="false" 
			rendered="#{softCertBackingBean.managedBean.renderRevokeButton}" />
		
		<p:outputPanel id="spkiRevokeOutPanel">
			<ac:spkiPopup id="spkiRevokePopup"
				password="#{softCertBackingBean.managedBean.spkiBackingBean.password}"
				challengeAns1="#{softCertBackingBean.managedBean.spkiBackingBean.challengeAns1}"
				challengeQues1="#{softCertBackingBean.managedBean.spkiBackingBean.challengeQues1}"
				postSignAction="#{softCertBackingBean.onClickSignSpki(spkiBackingBean.pmDigiSign)}" 
				enableAutoUpdate="#{softCertBackingBean.enableAutoUpdate()}" />
		</p:outputPanel>
		
		<p:panel header="#{lbl['lbl.sm.softcert.authpersonnel.panheader']}" toggleable="true" id="revokePersonnelPanelId">
			<h:outputText escape="false" styleClass="instruction" value="#{softCertBackingBean.managedBean.revokeMessage}" 
				rendered="#{softCertBackingBean.managedBean.renderRevokeButton}"/>
			
			<h:outputText styleClass="warning" value="#{lbl['lbl.sm.softcert.revoke.notallowed.warning']}" 
				rendered="#{!softCertBackingBean.managedBean.renderRevokeButton}"/>
			
			<p:dataTable id="softCertRevokeDtId" rowKey="#{personnel}" 
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowIndexVar="index" value="#{softCertBackingBean.managedBean.revokePersonnelList}"
				var="personnel" selection="#{softCertBackingBean.managedBean.softCertSelect}" >
				<ac:paginator for="softCertRevokeDtId" />
				
				<p:ajax event="rowSelectRadio"
					listener="#{softCertBackingBean.unSelectPersonnel}"
					update=":form:revokePersonnelPanelId,@([id$=proceedRevokeBtnId])"></p:ajax>
					
				<p:column selectionMode="single" style="width:2%" />

				<p:column headerText="#{lbl['lbl.sm.userprofile.name']}" style="width : 30%;white-space : normal" >
					<h:outputText value="#{personnel.name}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.userprofile.nationality']}" >
					<h:outputText value="#{personnel.pmCountry.countryName}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.person.composition.isAuth']}" style="width : 8%;white-space : normal">
					<h:outputText value="#{lbl['lbl.txt.yes']}"
						rendered="#{personnel.authorizedFlg eq '1'}" />
					<h:outputText value="#{lbl['lbl.txt.no']}"
						rendered="#{personnel.authorizedFlg eq '0'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.userprofile.eprole']}">
					<ac:smRoleDesc backingBean="#{softCertBackingBean}" roleCode="#{personnel.epRole}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.person.composition.certStatus']}">
					<ac:smSoftcertStatus personnel="#{personnel}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.userprofile.accountstatus']}">
					<h:outputText value="#{lbl['lbl.sm.accountstatus.active']}" rendered="#{personnel.recordStatusFlg eq '1'}" />
					<h:outputText value="#{lbl['lbl.sm.accountstatus.pendingactivation']}" rendered="#{personnel.recordStatusFlg eq '8'}" />
					<h:outputText value="#{lbl['lbl.sm.accountstatus.inactive']}" rendered="#{personnel.recordStatusFlg eq '9'}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.softcert.no']}">
					<h:outputText value="#{personnel.softcertNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.userprofile.softcertexpirationdate']}">
					<h:outputText value="#{personnel.softcertValidityDate}" />
				</p:column>

			</p:dataTable>
	
		</p:panel>
</ui:composition>
