<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.back']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
						action="#{softCertBackingBean.backToPersonnelListPage}" update="@form"/>
				</td>
				<td style="white-space: nowrap; float: right;">
				    <p:commandButton value="#{lbl['lbl.sm.request.softcert']}" style="float:right;" id="uploadRequestBtnId" update="@form"
				    	onstart="blockWidget.show()" oncomplete="blockWidget.hide()" action="#{softCertBackingBean.navigateToPaymentPage}"/>
				</td>
			</tr>
			<tr height="10"><td height="10"></td></tr>
		</table>

		<p:panel header="#{lbl['lbl.sm.softcert.selected.personnel.panheader']}" toggleable="true" id="uploadPanelId">
			
			<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.softcert.upload.suppdoc.note']}" rendered="#{softCertBackingBean.managedBean.suppDocMode eq 'S'}"/>
			<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.softcert.offline.suppdoc.note']}" rendered="#{softCertBackingBean.managedBean.suppDocMode eq 'H'}"/>
			
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.submissionType']}" /></td>
					<td><p:selectOneRadio id="onLnSuppDocs" disabled="#{empty softCertBackingBean.managedBean.softcertUploadSuppDocList}"
							value="#{softCertBackingBean.managedBean.suppDocMode}">
							<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.offline']}"
								itemValue="H" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.online']}"
								itemValue="S"/>
							<p:ajax update="@([id$=uploadPanelId])" event="change" />
						</p:selectOneRadio></td>
				</tr>
			</table>
			
			<p:dataTable id="softcertUploadDtlId" rowKey="#{upload}" rendered="#{softCertBackingBean.managedBean.suppDocMode eq 'S'}"
				rowIndexVar="index" value="#{softCertBackingBean.managedBean.softcertUploadSuppDocList}"
				var="upload" >
				<ac:paginator for="softcertUploadDtlId" />
				
				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.userprofile.name']}" />
					</f:facet>
					<h:outputText value="#{upload.personnel.name}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.userprofile.nationality']}" />
					</f:facet>
					<h:outputText value="#{upload.personnel.pmCountry.countryName}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.userprofile.eprole']}" />
					</f:facet>
					<ac:smRoleDesc backingBean="#{softCertBackingBean}" roleCode="#{upload.personnel.epRole}" />
				</p:column>
				
				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.userprofile.accountstatus']}" />
					</f:facet>
					<h:outputText value="#{lbl['lbl.sm.accountstatus.active']}" rendered="#{upload.personnel.recordStatusFlg eq '1'}" />
				</p:column>
				
				<p:column>
					<f:facet name="header">
						<h:outputText value="*" styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sm.softcert.suppdoc']}" />
						&#160;
						<p:graphicImage id="codeti" value="/css/images/design/tooltips.png" />
						<p:tooltip id="codett" for="codeti">
							<p:outputLabel escape="false" value="#{lbl['tt.sm.softcert.upload.suppdoc']}" />
						</p:tooltip>
					</f:facet>
					<table width="100%">
						<ui:repeat var="suppDoc" value="#{upload.suppDocList}">
							<tr>
								<td width="40%" style="border-style: none !important;">
									<h:outputText value="#{suppDoc.pmDocument.docName}" style="float: left;white-space: normal;" />
								</td>
								<td width="20%" style="border-style: none !important;">
									<p:commandLink oncomplete="uploadDialog.show();return false;" update="@([id$=uploadDialog])"
										action="#{softCertBackingBean.assignSelectedSupportDoc(upload.personnel,suppDoc)}">
										<p:graphicImage value="/css/images/design/upload.png"
											style="margin-right:2px;" />
									</p:commandLink>
								</td>
								<td width="40%" style="border-style: none !important;">
									<p:commandLink ajax="false" value="#{suppDoc.smSofcertDocFiles[0].fileName}" 
										rendered="#{not empty suppDoc.smSofcertDocFiles and not empty suppDoc.smSofcertDocFiles[0].fileName}">
										<p:fileDownload value="#{softCertBackingBean.commonDownload(suppDoc.smSofcertDocFiles[0].filePath,suppDoc.smSofcertDocFiles[0].fileName,suppDoc.smSofcertDocFiles[0].fileName)}" />
									</p:commandLink>
								</td>
							</tr>
						</ui:repeat>
					</table>
				</p:column>
					
			</p:dataTable>
			
			<p:dataTable id="softcertOfflineDtlId" rowKey="#{offline}" rendered="#{softCertBackingBean.managedBean.suppDocMode eq 'H'}"
				rowIndexVar="index" value="#{softCertBackingBean.managedBean.softcertUploadSuppDocList}"
				var="offline" >
				<ac:paginator for="softcertOfflineDtlId" />
				
				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.userprofile.name']}" />
					</f:facet>
					<h:outputText value="#{offline.personnel.name}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.userprofile.nationality']}" />
					</f:facet>
					<h:outputText value="#{offline.personnel.pmCountry.countryName}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.userprofile.eprole']}" />
					</f:facet>
					<ac:smRoleDesc backingBean="#{softCertBackingBean}" roleCode="#{offline.personnel.epRole}" />
				</p:column>
				
				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.userprofile.accountstatus']}" />
					</f:facet>
					<h:outputText value="#{lbl['lbl.sm.accountstatus.active']}" rendered="#{offline.personnel.recordStatusFlg eq '1'}" />
				</p:column>
				
				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sm.softcert.suppdoc']}" />
					</f:facet>
					<table width="100%">
						<ui:repeat var="suppDoc" value="#{offline.suppDocList}">
							<tr>
								<td width="40%" style="border-style: none !important;">
									<h:outputText value="#{suppDoc.pmDocument.docName}" style="float: left;white-space: normal;" />
								</td>
							</tr>
						</ui:repeat>
					</table>
				</p:column>
					
			</p:dataTable>
		</p:panel>
		
		<p:dialog id="uploadDialog" widgetVar="uploadDialog" modal="true"
			dynamic="true" resizable="false" width="700px" height="200"
			styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
			<p:fileUpload allowTypes="/(\.|\/)(pdf|doc|docx)$/"
				sizeLimit="1000000"
				invalidFileMessage="#{lbl['lbl.sm.upload.format.errmsg']}"
				invalidSizeMessage="#{lbl['lbl.sm.upload.fileSize.exceed1Mb']}"
				fileUploadListener="#{softCertBackingBean.handleSupDocFileAttachment}"
				update=":form" oncomplete="uploadDialog.hide();" 
				uploadLabel="#{lbl['lbl.btn.upload']}"  
				label="#{lbl['lbl.btn.choose']}" 
				cancelLabel="#{lbl['lbl.btn.cancel']}" />
		</p:dialog>

</ui:composition>
