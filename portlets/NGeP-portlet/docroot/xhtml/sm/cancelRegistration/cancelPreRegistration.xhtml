<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_smCancelRegistration_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.cancel.preRegistration']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	
	<p:panel header="#{lbl['lbl.sm.account.details']}" id="accDetailsPanelId">
	
	
		<table>
			<tr>
				<td colspan="2"><h:outputText styleClass="instruction" value="#{lbl['lbl.sm.select.acc.type']}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.account.type.header']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneRadio label="#{lbl['lbl.sm.account.type.header']}" required="true"
						value="#{cancelRegistrationBackingBean.managedBean.accType}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.basic']}" itemValue="#{SupplierManagementConst.STYPE_BASIC}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.mof.contractor']}" itemValue="#{SupplierManagementConst.STYPE_CONTRACTOR}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.mof.consultant']}" itemValue="#{SupplierManagementConst.STYPE_CONSULTANT}" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.govt']}" itemValue="#{SupplierManagementConst.STYPE_GOVT_SELLER}" />					
						<p:ajax event="change" update="@form" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							listener="#{cancelRegistrationBackingBean.onChangeAccType}" partialSubmit="true"/>
					</p:selectOneRadio></td>
			</tr>
			
			
		</table>
		<p:panel id="agreementId" header="#{lbl['lbl.sm.basic.account.termsconditions']}" rendered="#{!empty cancelRegistrationBackingBean.managedBean.accType}">
			<p:scrollPanel style="height:310px;border:0;" mode="native">
				<c:choose>
					<c:when test="#{empty cancelRegistrationBackingBean.managedBean.accType}">
						
					</c:when>
				
					<c:otherwise>
						<c:choose>
							
							<c:when test="#{cancelRegistrationBackingBean.managedBean.accType == SupplierManagementConst.STYPE_BASIC}">
								<b>#{lbl['lbl.sm.basic.account.basic']}</b>
								<br />
								<h:outputText escape="false" value="#{lbl['lbl.sm.basic.account.basicterms']}" style="white-space : normal !important"/>
							</c:when>
						
							<c:when test="#{cancelRegistrationBackingBean.managedBean.accType == SupplierManagementConst.STYPE_CONTRACTOR}">
								<b>#{lbl['lbl.sm.basic.account.mof.contractor']}</b>
								<br />
								<h:outputText escape="false" value="#{lbl['lbl.sm.basic.account.mof.contractor.terms']}" style="white-space : normal !important"/>
							</c:when>
							<c:when test="#{cancelRegistrationBackingBean.managedBean.accType == SupplierManagementConst.STYPE_CONSULTANT}">
								<b>#{lbl['lbl.sm.basic.account.mof.consultant']}</b>
								<br />
								<h:outputText escape="false" value="#{lbl['lbl.sm.basic.account.mof.consultant.terms']}" style="white-space : normal !important"/>
							</c:when>
						
							<c:otherwise>
								<b>#{lbl['lbl.sm.basic.account.govt']}</b>
								<br />
								<h:outputText escape="false" value="#{lbl['lbl.sm.basic.account.govtterms']}" style="white-space : normal !important"/>
							</c:otherwise>
						</c:choose>
					</c:otherwise>
				</c:choose>
			</p:scrollPanel>
			<br />
		</p:panel>
		<p:selectBooleanCheckbox id="chkTcId" value="#{cancelRegistrationBackingBean.agreeTC}" 
		disabled="#{empty cancelRegistrationBackingBean.managedBean.accType}" rendered="#{!empty cancelRegistrationBackingBean.managedBean.accType}">
			<p:ajax update="btnProceed" partialSubmit="true" process="@this" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
		</p:selectBooleanCheckbox>
		
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.have.agreed.termcondition']}" 
		rendered="#{!empty cancelRegistrationBackingBean.managedBean.accType}"/>
		
			<div class="nav-wrapper" align="justify">
			<p:commandButton id="btnProceed" value="#{lbl['lbl.btn.proceed']}" style="float:right;"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form" 
				disabled="#{!cancelRegistrationBackingBean.agreeTC}" 
				rendered="#{!empty cancelRegistrationBackingBean.managedBean.accType}"
				action="#{cancelRegistrationBackingBean.onClickProceed}"/>
		</div>
 <div style="clear: both;"></div>
	</p:panel>
	
	</ui:define>
</ui:composition>
