<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_resendAccountActivationEmail_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.supplier.resendaccountactivationemail']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	
	<p:panel header="#{lbl['lbl.sm.account.details']}" id="accDetailsPanelId">
	
		<table>
			<tr>
				<td colspan="2"><h:outputText styleClass="instruction" value="#{lbl['lbl.sm.select.acc.type']}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.account.type.header']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneRadio label="#{lbl['lbl.sm.account.type.header']}" required="true"
						value="#{resendAccountActivationEmailBackingBean.accType}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.basic']}" itemValue="#{SupplierManagementConst.ACC_BASIC}" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.mof']}" itemValue="#{SupplierManagementConst.ACC_MOF}" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.basic.account.govt']}" itemValue="#{SupplierManagementConst.ACC_GOVT_SELLER}" />					
						<p:ajax event="change" update="@form" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							listener="#{resendAccountActivationEmailBackingBean.onChangeAccType}" partialSubmit="true"/>
					</p:selectOneRadio></td>
			</tr>
			<tr><td colspan="2" height="15">&#160;</td></tr>
			
			<p:outputPanel rendered="#{not empty resendAccountActivationEmailBackingBean.accType}">
				<tr>
					<td colspan="2"><h:outputText styleClass="instruction" value="#{lbl['lbl.sm.key.in.info.during.register']}" /></td>
				</tr>
			</p:outputPanel>
			
			<p:outputPanel rendered="#{resendAccountActivationEmailBackingBean.accType eq SupplierManagementConst.ACC_BASIC or  
				resendAccountActivationEmailBackingBean.accType eq SupplierManagementConst.ACC_MOF}">
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.businessregno']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<p:inputText id="businessRegNo"
							label="#{lbl['lbl.sm.businessregno']}"
							required="true"
							value="#{resendAccountActivationEmailBackingBean.businessRegNo}"
							size="35" maxlength="20"  />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.companyname']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<p:inputText id="companyName"
							label="#{lbl['lbl.sm.companyname']}"
							required="true"
							value="#{resendAccountActivationEmailBackingBean.companyName}"
							size="35"  />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel 
							value="#{lbl['lbl.sm.person.composition.suppAdmin.idno']}" /><p:outputLabel 
							value="*" styleClass="mandatory" /></td>
					<td>
						<p:inputText id="suppAdminIdentificationNo"
							label="#{lbl['lbl.sm.person.composition.suppAdmin.idno']}"
							required="true"
							value="#{resendAccountActivationEmailBackingBean.suppAdminIdentificationNo}"
							size="35" maxlength="15" >
						</p:inputText>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.person.composition.suppAdmin.email']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="suppAdminEmail"
							label="#{lbl['lbl.sm.person.composition.suppAdmin.email']}"
							required="true"
							value="#{resendAccountActivationEmailBackingBean.suppAdminEmail}"
							size="40" >
							<f:validateRegex
							pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
							<p:ajax event="change" process="@this" listener="#{resendAccountActivationEmailBackingBean.onChangeEmail()}" update="suppAdminEmail"/> 
							</p:inputText>
							<p:graphicImage id="toolTipIcon" value="/css/images/design/tooltips.png" /> 
						  	<p:tooltip id="sourceTooltip" for="toolTipIcon">
								<h:outputText id="sourceLabel" escape="false" value="#{lbl['lbl.sm.email.change.tooltip']}" />
							</p:tooltip> 
					</td>
				</tr>
			</p:outputPanel>
			
			<p:outputPanel rendered="#{resendAccountActivationEmailBackingBean.accType eq SupplierManagementConst.ACC_GOVT_SELLER}">
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.agency.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<p:inputText id="agencyName"
							label="#{lbl['lbl.sm.companyname']}"
							required="true"
							value="#{resendAccountActivationEmailBackingBean.companyName}"
							size="35"  />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel 
							value="#{lbl['lbl.sm.person.composition.suppAdmin.idno']}" /><p:outputLabel 
							value="*" styleClass="mandatory" /></td>
					<td>
						<p:inputText id="g2gAdminIdentificationNo"
							label="#{lbl['lbl.sm.person.composition.suppAdmin.idno']}"
							required="true"
							value="#{resendAccountActivationEmailBackingBean.suppAdminIdentificationNo}"
							size="35" maxlength="15" >
						</p:inputText>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel 
							value="#{lbl['lbl.sm.person.composition.suppAdmin.mobile']}" /><p:outputLabel 
							value="*" styleClass="mandatory" /></td>
					<td>
						<ac:phone id="g2gAdminMobileNo" label="#{lbl['lbl.sm.person.composition.suppAdmin.mobile']}"
							countryCode="#{resendAccountActivationEmailBackingBean.suppAdminMobileCountry}" 
							areaCode="#{resendAccountActivationEmailBackingBean.suppAdminMobileArea}" 
							number="#{resendAccountActivationEmailBackingBean.suppAdminMobileNo}" 
							isMobile="true" required="true"
							validatorMessage="#{lbl['lbl.sm.person.composition.suppAdmin.mobile']} - #{lbl['lbl.sm.invalidNo']}"
							telcoId="#{resendAccountActivationEmailBackingBean.suppAdminMobileTelcoId}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sm.person.composition.suppAdmin.email']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="g2gAdminEmail"
							label="#{lbl['lbl.sm.person.composition.suppAdmin.email']}"
							required="true"
							value="#{resendAccountActivationEmailBackingBean.suppAdminEmail}"
							size="40" >
							<f:validateRegex
							pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
							<p:ajax event="change" process="@this" listener="#{resendAccountActivationEmailBackingBean.onChangeEmail()}" update="g2gAdminEmail"/> 
							</p:inputText>
							<p:graphicImage id="govtToolTipIcon" value="/css/images/design/tooltips.png" /> 
						  	<p:tooltip id="govtSourceTooltip" for="govtToolTipIcon">
								<h:outputText id="govtSourceLabel" escape="false" value="#{lbl['lbl.sm.email.change.tooltip']}" />
							</p:tooltip> 
					</td>
				</tr>
			</p:outputPanel>
		</table>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.resend.activation']}" 
				action="#{resendAccountActivationEmailBackingBean.onClickResend}"
				disabled="#{empty resendAccountActivationEmailBackingBean.accType}"
				update=":form" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
		</div>
		
		<p:confirmDialog id="confirmDialog" closable="true"
			message="#{lbl['lbl.sm.req.reactivation.confirmation.msg']}"
			header="#{lbl['lbl.sm.userprofile.confirmation']}" severity="alert"
			widgetVar="confirmDialog">
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDialog.hide();" update="@form"
					action="#{resendAccountActivationEmailBackingBean.resendAccountActivationEmail}"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDialog.hide();" />
			</div>
		</p:confirmDialog>
	<ac:smEmailAlertPopup bBean="#{backingBean}" title="#{lbl['lbl.sm.email.change.header']}" dialogId="emailPopUp" 
				btnOkLabel="#{lbl['lbl.btn.ok']}" />
	</p:panel>
	
	</ui:define>
</ui:composition>
