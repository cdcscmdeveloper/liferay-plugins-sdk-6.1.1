<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_resendAccountActivationEmail_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.supplier.resendaccountactivationemail']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	
	<table>
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.sm.businessregno']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td>
				<p:inputText id="businessRegNo"
					label="#{lbl['lbl.sm.businessregno']}"
					required="true"
					value="#{resendAccountActivationEmailBackingBean.businessRegNo}"
					size="35" maxlength="20"  />
			</td>
		</tr>
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.sm.companyname']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td>
				<p:inputText id="companyName"
					label="#{lbl['lbl.sm.companyname']}"
					required="true"
					value="#{resendAccountActivationEmailBackingBean.companyName}"
					size="35"  />
			</td>
		</tr>
		<tr>
			<td><p:outputLabel 
					value="#{lbl['lbl.sm.person.composition.suppAdmin.idno']}" /><p:outputLabel 
					value="*" styleClass="mandatory" /></td>
			<td>
				<p:inputText id="suppAdminIdentificationNo"
					label="#{lbl['lbl.sm.person.composition.suppAdmin.idno']}"
					required="true"
					value="#{resendAccountActivationEmailBackingBean.suppAdminIdentificationNo}"
					size="35" maxlength="15" >
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.sm.person.composition.suppAdmin.email']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:inputText id="suppAdminEmail"
					label="#{lbl['lbl.sm.person.composition.suppAdmin.email']}"
					required="true"
					value="#{resendAccountActivationEmailBackingBean.suppAdminEmail}"
					size="40" >
					<f:validateRegex
					pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
					</p:inputText>
			</td>
		</tr>
	</table>
	
	<div align="right">
		<p:commandButton value="#{lbl['lbl.sm.button.resend.activation']}" 
					update=":form" onstart="blockWidget.show()" oncomplete="if (!args.validationFailed) confirmDialog.show();" />
	</div>
	<p:confirmDialog id="confirmDialog" closable="true"
		message="#{lbl['lbl.sm.req.reactivation.confirmation.msg']}"
		header="#{lbl['lbl.sm.userprofile.confirmation']}" severity="alert"
		widgetVar="confirmDialog">
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDialog.hide();" update="@form"
				action="#{resendAccountActivationEmailBackingBean.resendAccountActivationEmail}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
			<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDialog.hide();" />
		</div>
	</p:confirmDialog>
	</ui:define>
</ui:composition>
