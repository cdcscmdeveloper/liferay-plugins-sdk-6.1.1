<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_updateCompExpInfo_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					"#{lbl['lbl.sm.update.comp.exp.info']}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:outputPanel>
			<p:graphicImage value="/css/images/priority.png" />
			<p:spacer height="2" />
			<h:outputText
				value="#{lbl['lbl.sm.update.comp.exp.info.draft.alert.part.one']}"
				style="color:blue;" escape="false" />
			<p:spacer height="2" />
			<p:commandLink onstart="blockWidget.show()"
				oncomplete="blockWidget.hide()"
				action="#{updateCompExpInfoBB.redirectToDraftPage}"
				process="@this" partialSubmit="true" update=":form">
				<u><h:outputText
						value="#{lbl['lbl.sm.update.comp.exp.info.draft.alert.part.two']}"
						style="color:blue;" escape="false" /></u>
			</p:commandLink>
			<p:spacer height="2" />
			<h:outputText
				value="#{lbl['lbl.sm.update.comp.exp.info.draft.alert.part.three']}"
				style="color:blue;" escape="false" />
		</p:outputPanel>
	</ui:define>
</ui:composition>
