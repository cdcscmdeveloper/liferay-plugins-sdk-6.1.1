<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_updateCompExp_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					"#{lbl['lbl.sm.update.comp.exp.draft']}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:outputPanel>
			<div align="left">
				<p:commandButton
					value="#{lbl['lbl.sm.update.comp.exp.draft.back.btn']}"
					partialSubmit="true" update="@this" process="@this"
					action="#{updateCompExpBB.proceedAfterAcceptTnC}"
					onclick="blockWidget.show()" oncomplete="blockWidget.hide()"></p:commandButton>
			</div>
		</p:outputPanel>
		<p:panel header="#{lbl['lbl.sm.update.comp.exp.draft.from.sm']}"
			toggleable="true">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.update.comp.exp.draft.from.sm.instruction']}" />
			<br />
			<p:dataTable id="smCompExpDrafId" var="smCompExpDraf" rows="10"
				value="#{updateCompExpBB.managedBean.smCompExpDrafList}"
				rowIndexVar="index"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<ac:paginator for="smCompExpDrafId"></ac:paginator>
				<p:columnGroup type="header">
					<p:row>
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.draft.table.no']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.draft.table.project.title']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.draft.table.contract.value']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.draft.table.contract.eff.date']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.draft.table.action']}"
							style="text-align: center !important;" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText value="#{index + 1}" />
				</p:column>
				<p:column>
					<h:outputText value="#{smCompExpDraf.title}" />
				</p:column>
				<p:column>
					<h:outputText value="#{smCompExpDraf.contractValue}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText value="#{smCompExpDraf.contractStartDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<p:commandLink onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						action="#{updateCompExpBB.onClickEditAction}" process="@this"
						partialSubmit="true" update=":form">
						<p:graphicImage value="/css/images/design/edit.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</p:panel>
		<p:panel header="#{lbl['lbl.sm.update.comp.exp.draft.from.ct']}"
			toggleable="true">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.update.comp.exp.draft.from.ct.instruction']}" />
			<br />
			<p:dataTable id="ctCompExpDrafId" var="ctCompExpDraf" rows="10"
				value="#{updateCompExpBB.managedBean.ctCompExpDrafList}"
				rowIndexVar="index"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<ac:paginator for="ctCompExpDrafId"></ac:paginator>
				<p:columnGroup type="header">
					<p:row>
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.draft.table.no']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.draft.table.project.title']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.draft.table.contract.value']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.draft.table.contract.eff.date']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.draft.table.action']}"
							style="text-align: center !important;" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText value="#{index + 1}" />
				</p:column>
				<p:column>
					<h:outputText value="#{ctCompExpDraf.title}" />
				</p:column>
				<p:column>
					<h:outputText value="#{ctCompExpDraf.contractValue}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText value="#{ctCompExpDraf.contractStartDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<p:commandLink onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						action="#{updateCompExpBB.onClickEditAction}" process="@this"
						partialSubmit="true" update=":form">
						<p:graphicImage value="/css/images/design/edit.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</p:panel>
		<p:commandLink onstart="blockWidget.show()"
			oncomplete="blockWidget.hide()"
			action="#{updateCompExpBB.onClickEditAction}" process="@this"
			partialSubmit="true" update=":form">
			<p:graphicImage value="/css/images/design/edit.png" />
		</p:commandLink>
		<ac:smUpdateCompExpEditPopUp dialogName="updateCompExpEdit" fromSM="true"
			fromCT="false" />
	</ui:define>
</ui:composition>
