<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel>

		<table style="width: 100%">
			<tr>
			<td>
					<div align="left" style="width: 100%">
						<p:commandButton value="#{lbl['lbl.btn.back']}"
							action="#{travellingTicketBB.backToSearch}" style="float:left;"
							process="@this" />
					</div>
				</td>
			<td>
					<div align="right" style="width: 100%">

						<p:commandButton
							value="#{!travellingTicketBB.managedBean.disabledVal? lbl['lbl.btn.save'] : lbl['lbl.btn.update']}"
							update="@([id$=Msg])"
							action="#{travellingTicketBB.saveTravellingTicket}" style="float:right;" />
					</div>
				</td>
			</tr>
		</table>

	</p:outputPanel>
</ui:composition>
