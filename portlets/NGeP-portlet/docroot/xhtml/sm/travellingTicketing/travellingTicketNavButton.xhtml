<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel>

		<table style="width: 100%">
			<tr>
			<td>
					<div align="left" style="width: 100%">
						<p:commandButton value="#{lbl['lbl.btn.back']}"
							action="#{travellingTicketBB.backToSearch}" style="float:left;"
							process="@this" />
					</div>
				</td>
			<td>
					<div align="right" style="width: 100%">
						<!-- 34445 start -->
						<c:choose>
							<c:when test="#{!travellingTicketBB.managedBean.disabledVal}">
								<p:commandButton id="saveBtnId" value="#{lbl['lbl.btn.save']}" oncomplete="saveInfoDlg.show()" style="float:right;"/>
							</c:when>
							<c:otherwise>
								<p:commandButton id="updateBtnId" value="#{lbl['lbl.btn.update']}" oncomplete="updateInfoDlg.show()" style="float:right;"/>
							</c:otherwise>
						</c:choose>
						<!-- 34445 end -->
					</div>
				</td>
			</tr>
		</table>

		<!-- 34445 start -->
		<ac:confirmationPopupSM id="saveInfoDlg" widget="saveInfoDlg"
			okParam="#{travellingTicketBB.saveTravellingTicket()}"
			hasParam="true"
			width="400" height="100"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.save.msg']}"
			update="@([id$=Msg])"/>
			
		<ac:confirmationPopupSM id="updateInfoDlg" widget="updateInfoDlg"
			okAction="travellingTicketBB.saveTravellingTicket"
			width="400" height="100"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.update.msg']}"
			update="@([id$=Msg])"/>			
		<!-- 34445 end -->
	</p:outputPanel>
</ui:composition>
