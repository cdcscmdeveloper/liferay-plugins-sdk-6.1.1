<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>	
			
	<p:panel header="#{lbl['lbl.sm.tt.task.search']}" toggleable="true" id="searchPnl">
		<table class="ppTwoTable">
			<tr>
				<th width="25%"><p:outputLabel value="#{lbl['lbl.sm.travelling.ticketing.system.code']}" /></th>
				<td width="25%"><p:inputText id="code" value="#{travellingTicketBB.managedBean.machineSearchBean.code}" maxlength="20" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			
			<tr>
				<th width="25%"><p:outputLabel
						value="#{lbl['lbl.sm.travelling.ticketing.system.name']}" /></th>
				<td width="25%"><p:inputText id="name" value="#{travellingTicketBB.managedBean.machineSearchBean.name}" maxlength="80" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="25%">
				<p:outputLabel value="#{lbl['lbl.sm.travelling.ticketing.system.category']}" /></th>
				<td width="35%"><p:selectOneMenu
						label="#{lbl['lbl.sm.travelling.ticketing.system.category']}" id="categoryType"
						value="#{travellingTicketBB.managedBean.machineSearchBean.categoryId}"
						style="width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems value="#{travellingTicketBB.getListOfCategories()}" />
					</p:selectOneMenu>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>

			<tr>
				<th width="25%">
				<p:outputLabel value="#{lbl['lbl.sm.travelling.ticketing.system.status']}" /></th>
				<td width="25%">
              		<p:selectOneMenu style="width:205px"
						value="#{travellingTicketBB.managedBean.machineSearchBean.ttStatus}">
						<f:selectItems value="#{travellingTicketBB.getStatusList()}" />
					</p:selectOneMenu>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
		</table>

		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.search']}" action="#{travellingTicketBB.searchMachine}" update=":form:machineResult" />
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{travellingTicketBB.resetMachineSearchBean}"
							process="@this"
							update=":form:searchPnl, :form:machineResult" />
		</div>
		
	</p:panel>
</ui:composition>
