<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.sm.tt.task.search']}" toggleable="true" id="searchPnl">
		<table class="ppTwoTable">
			
			<tr>
					<th><p:outputLabel value="#{lbl['lbl.sm.travelling.ticketing.system.code']}" /></th>
					<td><p:inputText id="code" styleClass="ppDisplayTextM"
							style="text-transform:uppercase" required="true" maxlength="10"
							disabled="true"
							value="#{travellingTicketBB.managedBean.pmMachine.machineCode}"
							validatorMessage="#{lbl['lbl.sm.travelling.ticketing.system.code']} - #{lbl['lbl.pm.uppercase']}"
							label="#{lbl['lbl.sm.travelling.ticketing.system.code']}">

						</p:inputText> <p:message id="specialEqiMsg" for="code" display="icon" />
					</td>
				</tr>
			
			<tr>
				<th width="25%"><p:outputLabel
						value="#{lbl['lbl.sm.travelling.ticketing.system.name']}" /><p:outputLabel
							value="* " styleClass="mandatory" /></th>
				<td width="25%"><p:inputText id="name" value="#{travellingTicketBB.managedBean.pmMachine.machineDesc}" maxlength="80" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			
			<tr>
				<th width="25%">
				<p:outputLabel value="#{lbl['lbl.sm.travelling.ticketing.system.category']}" />
				<p:outputLabel value="* " styleClass="mandatory" /></th>
				<td width="35%"><p:selectOneMenu
						label="#{lbl['lbl.sm.travelling.ticketing.system.category']}" id="categoryType"
						value="#{travellingTicketBB.managedBean.pmMachineSection.categoryType.parameterId}"
						disabled="#{!travellingTicketBB.managedBean.pmMachineSection.brandNew}"						
						style="width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems value="#{travellingTicketBB.getListOfCategories()}" />
					</p:selectOneMenu>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			
			<tr>
					<th><p:outputLabel value="#{lbl['lbl.pm.status']}" /> <p:outputLabel value="*" styleClass="mandatory" /></th>
					<td><p:selectOneMenu styleClass="ppDropDownWidthM"
							label="#{lbl['lbl.pm.status']}" 
							value="#{travellingTicketBB.managedBean.pmMachine.recordStatusFlg}">
							<f:selectItems
								value="#{travellingTicketBB.getStatusList()}" />
						</p:selectOneMenu></td>
				</tr>

		</table>	
	</p:panel>
</ui:composition>
