<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sm.tt.task.search']}" toggleable="true" id="searchPnl">
		<table class="ppTwoTable">
			<tr>
				<th width="25%"><p:outputLabel value="#{lbl['lbl.sm.travelling.ticketing.system.code']}" /></th>
				<td width="25%"><p:inputText id="code" value="#{travellingTicketBB.managedBean.pmMachine.machineCode}" maxlength="20" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			
			<tr>
				<th width="25%"><p:outputLabel
						value="#{lbl['lbl.sm.travelling.ticketing.system.name']}" /></th>
				<td width="25%"><p:inputText id="name" value="#{travellingTicketBB.managedBean.pmMachine.machineDesc}" maxlength="80" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			
			<tr>
				<th width="25%">
				<p:outputLabel value="#{lbl['lbl.sm.travelling.ticketing.system.catogory']}" /></th>
				<td width="35%"><p:selectOneMenu
						label="#{lbl['lbl.sm.travelling.ticketing.system.catogory']}" id="categoryType"
						value="#{travellingTicketBB.managedBean.pmMachineSection.categoryType.parameterId}"
						style="width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems value="#{travellingTicketBB.getListOfCategories()}" />
					</p:selectOneMenu>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			
			<tr>
				<th width="25%">
				<p:outputLabel value="#{lbl['lbl.sm.travelling.ticketing.system.status']}" /></th>
				<td width="25%">
					<p:selectOneMenu style="width:203px"
					 disabled="#{!travellingTicketBB.managedBean.disabledVal}"
					 value="#{travellingTicketBB.managedBean.pmMachine.recordStatusFlg}">  
            			<f:selectItem itemLabel="Select One" itemValue="0" />  
            			<f:selectItem selected="true"  itemLabel="Active" itemValue="1" /> 
            			<f:selectItem itemLabel="Non-Active" itemValue="2" />  
              		</p:selectOneMenu> 
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>

		</table>	
	</p:panel>
</ui:composition>
