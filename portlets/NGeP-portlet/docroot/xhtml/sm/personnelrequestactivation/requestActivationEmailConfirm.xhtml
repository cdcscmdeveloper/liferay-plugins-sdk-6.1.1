<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	
	<table style="width: 100%;">
		<tr>
			<td>
				<p:commandButton value="#{lbl['lbl.btn.back']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
					action="#{bb.navigateToPage('1')}" update="@form"/>
			</td>
			<td style="white-space: nowrap; float: right;">
				<!-- #34400 -->
			    <p:commandButton value="#{lbl['lbl.btn.submit']}" style="float:right;" id="submitBtnId" update="@form"
			    	oncomplete="if (!args.validationFailed) confirmDlg.show()" />
			</td>
		</tr>
		<tr height="10"><td height="10"></td></tr>
	</table>
	<!-- #34400 -->
	<ac:confirmationPopup id="confirmDlg" widget="confirmDlg"
		okAction="bb.resendActivation"
		width="400" height="100"
		title="#{lbl['lbl.btn.dialog.cofirm.header']}"
		content="#{lbl['lbl.sm.confirm.reactivate.email']} #{bb.managedBean.selectedExpiredActivationPersonnel.email}?" 
		update="@form"
		loadingWidget="blockWidget" />
	
	
	<p:panel header="#{lbl['lbl.sm.req.reactivation.confirmation.header']}" toggleable="true" id="emailConfirmPanelId">
	
		<table>
			<tr><td colspan="2"><h:outputText styleClass="instruction" value="#{lbl['lbl.sm.req.reactivation.confirmation.msg']}"/></td></tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.userprofile.name']}" styleClass="outputLabel-view-label"/></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedExpiredActivationPersonnel.name}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.person.composition.idenNum']}" styleClass="outputLabel-view-label"/></td>
				<td><p:outputLabel styleClass="outputLabel-view" value="#{bb.managedBean.selectedExpiredActivationPersonnel.identificationNo}" /></td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sm.userprofile.email']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<p:inputText id="emailConfirmId"
						label="#{lbl['lbl.sm.userprofile.email']}"
						value="#{bb.managedBean.selectedExpiredActivationPersonnel.email}" 
						validatorMessage="#{lbl['lbl.sm.userprofile.email']} - #{lbl['lbl.sm.invalidEmail']}"
						size="40" required="true">
						<f:validateRegex pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
						
						<p:ajax process="@this" partialSubmit="true"/>
							<p:ajax event="change" process="@this" listener="#{bb.onChangeEmail()}" update="emailConfirmId"/> 
						
					</p:inputText>
										&#160;&#160;
					<p:graphicImage id="toolTipIcon" value="/css/images/design/tooltips.png" /> 
				  	<p:tooltip id="sourceTooltip" for="toolTipIcon">
						<h:outputText id="sourceLabel" escape="false" value="#{lbl['lbl.sm.email.change.tooltip']}" />
					</p:tooltip> 
					
					<p:message id="emailConfirmIdMsg" for="emailConfirmId"
						showSummary="true" showDetail="false" display="icon" />
				</td>
			</tr>
		</table>
		<ac:smEmailAlertPopup bBean="#{backingBean}" title="#{lbl['lbl.sm.email.change.header']}" dialogId="emailPopUp" 
		btnOkLabel="#{lbl['lbl.btn.ok']}" />
	</p:panel>

</ui:composition>
