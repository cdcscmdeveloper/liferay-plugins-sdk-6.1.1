<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="contentSection">
		<ui:param name="bb" value="#{smPersonnelRequestActivationBackingBean}" />
		
		<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false"/>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:outputPanel id="personnelListOutPanelId" rendered="#{bb.managedBean.targetPage eq '1'}">
			<ui:include src="requestActivationPersonnelList.xhtml" />
		</p:outputPanel>
		<p:outputPanel id="emailConfirmOutPanelId" rendered="#{bb.managedBean.targetPage eq '2'}">
			<ui:include src="requestActivationEmailConfirm.xhtml" />
		</p:outputPanel>

	</ui:define>
</ui:composition>
