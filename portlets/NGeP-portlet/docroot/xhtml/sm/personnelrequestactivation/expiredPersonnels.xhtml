<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" escape="false"/>
	
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<ui:param name="bb" value="#{smPersonnelRequestActivationBackingBean}" />
		
		<h:panelGrid id="search" style="width:100%;">

			<p:panel header="#{lbl['lbl.sm.req.reactivation.link.expired.personnels']}" toggleable="true">

				<p:dataTable var="person" widgetVar="suppPersonnelInfoDtWidVar"
						editable="false"
						value="#{bb.expiredActivationPersonnels}"
						selection="#{bb.selectedExpiredActivationPersonnels}"
						rowKey="#{person}" rowIndexVar="index" id="personDt">
						<ac:paginator for="personDt" />
						<p:column selectionMode="multiple" width="5%" />

						<p:column headerText="#{lbl['lbl.sm.person.composition.name']}">
							<h:outputText value="#{person.name}" />
						</p:column>

						<p:column headerText="#{lbl['lbl.sm.person.composition.idenNum']}">
							<h:outputText value="#{person.identificationNo}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.person.composition.isAuth']}">
							<h:outputText value="#{lbl['lbl.txt.yes']}"
								rendered="#{person.authorizedFlg eq '1'}" />
							<h:outputText value="#{lbl['lbl.txt.no']}"
								rendered="#{person.authorizedFlg eq '0'}" />
						</p:column>
						<p:column
							headerText="#{lbl['lbl.sm.person.composition.certStatus']}">
							<h:outputText
								value="#{lbl['lbl.sm.person.composition.processing']}"
								rendered="#{person.softcertFlg eq '3' and person.smAppl.supplierType ne 'J'}" />
							<h:outputText
								value="#{lbl['lbl.sm.person.composition.requested']}"
								rendered="#{person.softcertFlg eq '2' and person.smAppl.supplierType ne 'J'}" />
							<h:outputText value="#{lbl['lbl.sm.person.composition.issued']}"
								rendered="#{person.softcertFlg eq '1' and person.smAppl.supplierType ne 'J'}" />
							<h:outputText
								value="#{lbl['lbl.sm.person.composition.notapplied']}"
								rendered="#{person.softcertFlg eq '0' or person.smAppl.supplierType eq 'J'}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.person.composition.eprole']}"
							style="white-space: normal;">
							<h:outputText
								value="#{lbl['lbl.sm.person.composition.suppAdmin']}"
								rendered="#{person.epRole eq 'MOF_SUPPLIER_ADMIN' or person.epRole eq 'BASIC_SUPPLIER_ADMIN'}" />
							<h:outputText
								value="#{lbl['lbl.sm.person.composition.suppUser']}"
								rendered="#{person.epRole eq 'BASIC_SUPPLIER_USER' or person.epRole eq 'MOF_SUPPLIER_USER'}" />
							<h:outputText value="#{lbl['lbl.sm.person.composition.catUser']}"
								rendered="#{person.epRole eq 'CM_USER'}" />
							<h:outputText value=" (#{lbl['lbl.sm.contract.signer']})"
								rendered="#{person.contractSignerFlg eq 1 and person.smAppl.supplierType ne 'J'}" />
						</p:column>
					</p:dataTable>
			</p:panel>

			<p:panel style="border: none;">
				<table style="width: 100%">
					<tr><td><p:commandButton value="#{lbl['lbl.sm.button.resend.activation']}" oncomplete="confirmDialog.show();" 
								style="float:right;" disabled="#{empty bb.expiredActivationPersonnels}"/></td></tr>
				</table>
			</p:panel>
		</h:panelGrid>

		<p:dialog id="confirmDialog" header="#{lbl['lbl.sm.userprofile.confirmation']}"
			widgetVar="confirmDialog" modal="true" width="550px" height="100px" >
			<p:outputPanel id="dPanel">
				<table style="width:100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.req.reactivation.confirmation.msg']}" /></td>
					</tr>
				</table>
			</p:outputPanel>
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDialog.hide();"
					action="#{bb.resendActivation}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDialog.hide();" />
			</div>
		</p:dialog>

	</ui:define>
</ui:composition>
