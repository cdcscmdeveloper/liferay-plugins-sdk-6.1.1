<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	
		<table style="width: 100%">
			<tr>
				<td>
					<p:commandButton id="resendBtnId" value="#{lbl['lbl.btn.next']}" 
						action="#{bb.navigateToPage('2')}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form" 
						style="float:right;" disabled="#{empty bb.managedBean.selectedExpiredActivationPersonnel}"/>
				</td>
			</tr>
		</table>

		<p:panel header="#{lbl['lbl.sm.req.reactivation.link.expired.personnels']}" toggleable="true" id="resultPanelId">

			<p:dataTable var="person" widgetVar="suppPersonnelInfoDtWidVar"
				value="#{bb.managedBean.expiredActivationPersonnels}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				selection="#{bb.managedBean.selectedExpiredActivationPersonnel}"
				rowKey="#{person}" rowIndexVar="index" id="personDt">
				<ac:paginator for="personDt" />
				
				<p:ajax event="rowSelectRadio" update=":form:resultPanelId,@([id$=resendBtnId])"></p:ajax>
				
				<p:column selectionMode="single" width="2%" />

				<p:column headerText="#{lbl['lbl.sm.person.composition.name']}">
					<h:outputText value="#{person.name}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sm.person.composition.idenNum']}">
					<h:outputText value="#{person.identificationNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.person.composition.isAuth']}">
					<h:outputText value="#{lbl['lbl.txt.yes']}"
						rendered="#{person.authorizedFlg eq '1'}" />
					<h:outputText value="#{lbl['lbl.txt.no']}"
						rendered="#{person.authorizedFlg eq '0'}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.sm.person.composition.certStatus']}">
					<ac:smSoftcertStatus personnel="#{person}"  />
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.person.composition.eprole']}"
					style="white-space: normal;">
					<h:outputText
						value="#{lbl['lbl.sm.person.composition.suppAdmin']}"
						rendered="#{person.epRole eq 'MOF_SUPPLIER_ADMIN' or person.epRole eq 'BASIC_SUPPLIER_ADMIN'}" />
					<h:outputText
						value="#{lbl['lbl.sm.person.composition.suppUser']}"
						rendered="#{person.epRole eq 'BASIC_SUPPLIER_USER' or person.epRole eq 'MOF_SUPPLIER_USER'}" />
					<h:outputText value="#{lbl['lbl.sm.person.composition.catUser']}"
						rendered="#{person.epRole eq 'CM_USER'}" />
					<h:outputText value="#{lbl['lbl.sm.person.composition.fluser']}"
						rendered="#{person.epRole eq 'FL_USER'}" />
					<h:outputText value=" (#{lbl['lbl.sm.contract.signer']})"
						rendered="#{person.contractSignerFlg eq 1 and person.smAppl.supplierType ne 'J'}" />
				</p:column>
			</p:dataTable>
		</p:panel>
	
</ui:composition>
