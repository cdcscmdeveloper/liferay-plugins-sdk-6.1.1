<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_gstHistory_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.gst.history.title']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:messages id="messages" showDetail="true" closable="false" showSummary="false" escape="false"/>
		
		<p:panel header="#{lbl['lbl.sm.search.supprofile']}" toggleable="true" id="searchGstHistoryPanelId">
		
			<table style="width: 100%;table-layout:fixed">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.complaint.search.by']}" /></td>
					<td><p:selectOneRadio id="searchBy" required="false" value="#{gstHistoryBackingBean.managedBean.searchBy}" >
							<f:selectItem itemLabel="#{lbl['lbl.sm.epno']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.mofno']}" itemValue="2" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.companyname']}" itemValue="3" />
							<p:ajax update="searchGstHistoryPanelId" event="change" process="@this" 
								listener="#{gstHistoryBackingBean.onSearchBy}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
						</p:selectOneRadio>
					</td>
					<td>&#160;</td>
				</tr>
				<p:outputPanel rendered="#{gstHistoryBackingBean.managedBean.searchBy eq 1}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.epno']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
						<td>
							<p:inputText id="epNoId" required="true"
								label="#{lbl['lbl.sm.epno']}"
								value="#{gstHistoryBackingBean.managedBean.searchSupplier.epNo}"
								size="35" maxlength="20" />
							<p:message id="epNoIdMsg" for="epNoId"
									showSummary="true" showDetail="false" display="icon" />
						</td>
						<td>
							<p:commandButton value="#{lbl['lbl.btn.search']}" 
								action="#{gstHistoryBackingBean.search}"
								update=":form" 
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
							</p:commandButton>
						</td>
					</tr>
				</p:outputPanel>
				<p:outputPanel rendered="#{gstHistoryBackingBean.managedBean.searchBy eq 2}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.mofno']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
						<td>
							<p:inputText id="mofNoId" required="true"
								label="#{lbl['lbl.sm.mofno']}"
								value="#{gstHistoryBackingBean.managedBean.searchMofNo}"
								size="35" maxlength="14" />
							<p:message id="mofNoIdMsg" for="mofNoId"
									showSummary="true" showDetail="false" display="icon" />
						</td>
						<td>
							<p:commandButton value="#{lbl['lbl.btn.search']}" 
								action="#{gstHistoryBackingBean.search}"
								update=":form" 
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
							</p:commandButton>
						</td>
					</tr>
				</p:outputPanel>
				<p:outputPanel rendered="#{gstHistoryBackingBean.managedBean.searchBy eq 3}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.companyname']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
						<td>
							<p:inputText id="companyNameId" required="true"
								label="#{lbl['lbl.sm.companyname']}"
								value="#{gstHistoryBackingBean.managedBean.searchSupplier.companyName}"
								size="40" maxlength="100" />
							<p:message id="companyNameIdMsg" for="companyNameId"
									showSummary="true" showDetail="false" display="icon" />
						</td>
						<td>
							<p:commandButton value="#{lbl['lbl.btn.search']}" 
								action="#{gstHistoryBackingBean.search}"
								update=":form" 
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
							</p:commandButton>
						</td>
					</tr>
				</p:outputPanel>
			</table>
			
			<p:dataTable var="smSupplier" widgetVar="smApplWidgetVar"
				editable="false" lazy="true" rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{gstHistoryBackingBean.managedBean.smGstDataModel}"
				selection="#{gstHistoryBackingBean.managedBean.selectedSupplier}"
				rowKey="#{smSupplier}" rowIndexVar="index" id="searchGstHistoryDtId">
				<ac:paginator for="searchGstHistoryDtId" />
				
				<p:column headerText="#{lbl['lbl.sm.companyname']}" style="width :40%;white-space : normal">
					<h:outputText value="#{smSupplier.companyName}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.businessregno']}" style="width :15%;white-space : normal">
					<h:outputText value="#{smSupplier.regNo}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.epno']}" style="width :15%;white-space : normal">
					<h:outputText value="#{smSupplier.epNo}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.rpt.supplierType']}" style="width :15%;white-space : normal">
					<h:outputText value="#{lbl['lbl.sm.contractor']}" rendered="#{smSupplier.smAppl.supplierType eq 'K'}"/>
					<h:outputText value="#{lbl['lbl.sm.consultant']}" rendered="#{smSupplier.smAppl.supplierType eq 'J'}"/>
					<h:outputText value="#{lbl['lbl.sm.basic.account.basic']}" 
						rendered="#{smSupplier.smAppl.supplierType eq 'B' and smSupplier.businessType ne 'P'}"/>
					<h:outputText value="#{lbl['lbl.pm.sidemenu.general.org.govSeller']}" rendered="#{smSupplier.businessType eq 'P'}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.label.action']}">
					<p:commandLink onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						action="#{gstHistoryBackingBean.viewGst(smSupplier)}"
						process="@this" partialSubmit="true" update="@([id$=searchGstHistoryPanelId])"
						style="padding-right:5px;">
						<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
					</p:commandLink>
				</p:column>
				
			</p:dataTable>
			
		</p:panel>
	</ui:define>
</ui:composition>
