<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_gstHistory_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.gst.history.title']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:messages id="messages" showDetail="true" closable="false" showSummary="false" escape="false"/>
		
		<div align="left">
			<p:commandButton id="btnProceed" value="#{lbl['lbl.btn.back']}" 
				rendered="#{gstHistoryBackingBean.managedBean.renderedBackButton}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				action="#{gstHistoryBackingBean.back}" />
		</div>
		<br />
		
		<p:panel header="#{lbl['lbl.sm.gst.history.hq.panel']}" toggleable="true" id="resultGstHistoryPanelId">
			
			<p:dataTable var="hqGst" widgetVar="smApplWidgetVar"
				editable="false" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{gstHistoryBackingBean.managedBean.hqGstList}"
				rowKey="#{hqGst}" rowIndexVar="index" id="resultGstHistoryDtId">
				<ac:paginator for="resultGstHistoryDtId" />
				
				<p:column headerText="#{lbl['lbl.sm.application.no']}" style="white-space : normal">
					<h:outputText value="#{hqGst.applNo}" rendered="#{not empty hqGst.applNo}" />
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty hqGst.applNo}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.regno']}" style="white-space : normal">
					<h:outputText value="#{hqGst.gstRegNo}" rendered="#{not empty hqGst.gstRegNo}"/>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty hqGst.gstRegNo}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.effdate']}" style="white-space : normal">
					<p:outputPanel rendered="#{not empty hqGst.gstEffDate}">
						<ac:labelDate styleClass="outputLabel-view" value="#{hqGst.gstEffDate}" />
					</p:outputPanel>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty hqGst.gstEffDate}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.eff.end.date']}" style="white-space : normal">
					<p:outputPanel rendered="#{not empty hqGst.gstEndDate}">
						<ac:labelDate styleClass="outputLabel-view" value="#{hqGst.gstEndDate}" />
					</p:outputPanel>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty hqGst.gstEndDate}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.declared.date']}" style="white-space : normal">
					<p:outputPanel rendered="#{not empty hqGst.gstDeclaredDate}">
						<ac:labelDate styleClass="outputLabel-view" value="#{hqGst.gstDeclaredDate}" />
					</p:outputPanel>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty hqGst.gstDeclaredDate}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.modified.date']}" style="white-space : normal">
					<p:outputPanel rendered="#{not empty hqGst.gstModifiedDate}">
						<ac:labelDate styleClass="outputLabel-view" value="#{hqGst.gstModifiedDate}" />
					</p:outputPanel>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty hqGst.gstModifiedDate}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.deleted.date']}" style="white-space : normal">
					<p:outputPanel rendered="#{not empty hqGst.gstDeletedDate}">
						<ac:labelDate styleClass="outputLabel-view" value="#{hqGst.gstDeletedDate}" />
					</p:outputPanel>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty hqGst.gstDeletedDate}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.actionby']}" style="white-space : normal">
					<h:outputText value="#{hqGst.actionedBy}" rendered="#{not empty hqGst.actionedBy}" />
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty hqGst.actionedBy}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.document']}" style="white-space : normal">
					<table width="100%">
						<p:outputPanel rendered="#{not empty hqGst.smGstSupplierDocs}">
							<ui:repeat var="suppDoc" value="#{hqGst.smGstSupplierDocs}">
								<tr>
									<td style="border-style: none !important;">
										<p:commandLink rendered="#{not empty suppDoc.fileName}"
											action="#{gstHistoryBackingBean.downloadSelectedSuppDoc(suppDoc.fileName,suppDoc.filePath)}"
											update="@form" ajax="false">
											<p:fileDownload value="#{gstHistoryBackingBean.file}" />
											<p:graphicImage value="/css/images/design/download.png"
												style="margin-right:2px;" />
										</p:commandLink>
										<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty suppDoc.fileName}"/>
									</td>
								</tr>
							</ui:repeat>
						</p:outputPanel>
						<p:outputPanel rendered="#{empty hqGst.smGstSupplierDocs}">
							<td style="border-style: none !important;">
								<h:outputText value="#{lbl['lbl.sm.no.available']}" />
							</td>
						</p:outputPanel>
					</table>
				</p:column>
				
			</p:dataTable>
			<br />
			
		</p:panel>
		
		<p:panel header="#{lbl['lbl.sm.gst.history.branch.panel']}" toggleable="true" id="resultBranchGstHistoryPanelId">
		
			<p:dataTable var="brGst" widgetVar="smApplWidgetVar"
				editable="false" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{gstHistoryBackingBean.managedBean.branchGstList}"
				rowKey="#{brGst}" rowIndexVar="index" id="resultBranchGstHistoryDtId">
				<ac:paginator for="resultBranchGstHistoryDtId" />
				
				<p:column headerText="#{lbl['lbl.sm.branch.branchName']}" style="white-space : normal">
					<h:outputText value="#{brGst.branchName}" rendered="#{not empty brGst.branchName}" />
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty brGst.branchName}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.application.no']}" style="white-space : normal">
					<h:outputText value="#{brGst.applNo}" rendered="#{not empty brGst.applNo}" />
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty brGst.applNo}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.regno']}" style="white-space : normal">
					<h:outputText value="#{brGst.gstRegNo}" rendered="#{not empty brGst.gstRegNo}"/>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty brGst.gstRegNo}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.effdate']}" style="white-space : normal">
					<p:outputPanel rendered="#{not empty brGst.gstEffDate}">
						<ac:labelDate styleClass="outputLabel-view" value="#{brGst.gstEffDate}" />
					</p:outputPanel>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty brGst.gstEffDate}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.eff.end.date']}" style="white-space : normal">
					<p:outputPanel rendered="#{not empty brGst.gstEndDate}">
						<ac:labelDate styleClass="outputLabel-view" value="#{brGst.gstEndDate}" />
					</p:outputPanel>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty brGst.gstEndDate}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.declared.date']}" style="white-space : normal">
					<p:outputPanel rendered="#{not empty brGst.gstDeclaredDate}">
						<ac:labelDate styleClass="outputLabel-view" value="#{brGst.gstDeclaredDate}" />
					</p:outputPanel>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty brGst.gstDeclaredDate}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.modified.date']}" style="white-space : normal">
					<p:outputPanel rendered="#{not empty brGst.gstModifiedDate}">
						<ac:labelDate styleClass="outputLabel-view" value="#{brGst.gstModifiedDate}" />
					</p:outputPanel>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty brGst.gstModifiedDate}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.deleted.date']}" style="white-space : normal">
					<p:outputPanel rendered="#{not empty brGst.gstDeletedDate}">
						<ac:labelDate styleClass="outputLabel-view" value="#{brGst.gstDeletedDate}" />
					</p:outputPanel>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty brGst.gstDeletedDate}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.actionby']}" style="white-space : normal">
					<h:outputText value="#{brGst.actionedBy}" rendered="#{not empty brGst.actionedBy}" />
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty brGst.actionedBy}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.gst.document']}" style="white-space : normal">
					<table width="100%">
						<p:outputPanel rendered="#{not empty brGst.smGstSupplierDocs}">
							<ui:repeat var="suppDoc" value="#{brGst.smGstSupplierDocs}">
								<tr>
									<td style="border-style: none !important;">
										<p:commandLink rendered="#{not empty suppDoc.fileName}"
											action="#{gstHistoryBackingBean.downloadSelectedSuppDoc(suppDoc.fileName,suppDoc.filePath)}"
											update="@form" ajax="false">
											<p:fileDownload value="#{gstHistoryBackingBean.file}" />
											<p:graphicImage value="/css/images/design/download.png"
												style="margin-right:2px;" />
										</p:commandLink>
										<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty suppDoc.fileName}"/>
									</td>
								</tr>
							</ui:repeat>
						</p:outputPanel>
						<p:outputPanel rendered="#{empty brGst.smGstSupplierDocs}">
							<td style="border-style: none !important;">
								<h:outputText value="#{lbl['lbl.sm.no.available']}" />
							</td>
						</p:outputPanel>
					</table>
				</p:column>
				
			</p:dataTable>
			
		</p:panel>
		
	</ui:define>
</ui:composition>
