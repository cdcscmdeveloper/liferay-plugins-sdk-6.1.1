<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
	<f:event listener="#{questionnaireBackingBean.retrieveQuestionnaire}" type="preRenderView"></f:event>
		<p:panel header="#{lbl['lbl.sm.questionaire.answer.header']}" id="questionPanel">
			<table style="width: 100%">
				<tr>
					<td><h:outputText value="#{lbl['lbl.sm.questionaire.feedback.note1']}" escape="false"/></td>
				</tr>
				<tr>
					<td><p:separator /></td>
				</tr>
				<tr>
					<td><h:outputText value="#{lbl['lbl.sm.questionaire.feedback.note2']}" escape="false"/></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.mofno']}" /></td>
					<td><p:inputText disabled="true" value="#{questionnaireBackingBean.managedBean.smMofAccount.mofNo}" /></td>

					<td><p:outputLabel value="#{lbl['lbl.sm.companyname']}" /></td>
					<td><p:inputText
							value="#{questionnaireBackingBean.managedBean.smSupp.companyName}"
							disabled="true" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.application.ref.no']}" /></td>
					<td><p:inputText disabled="true" value="#{questionnaireBackingBean.managedBean.smSupp.smAppl.applNo}"/></td>

					<td><p:outputLabel value="#{lbl['lbl.sm.questionaire.type.application']}" /></td>
					<td><p:inputText
							value="#{questionnaireBackingBean.managedBean.smSupp.smAppl.applType}"
							disabled="true" /></td>
				</tr>

<!-- 				<tr> -->
<!-- 					<td><p:outputLabel value="Nama Pegawai Pemproses" /></td> -->
<!-- 					<td><p:inputText disabled="true" /></td> -->
<!-- 				</tr> -->


			</table>
		</p:panel>


		<div align="center">
			<p:panel header="">
				<table>
					<ui:repeat varStatus="status"
						value="#{questionnaireBackingBean.managedBean.smSuppAnswerLs}"
						var="ques">
						<tr>
							<td>#{status.index+1}. </td>
							<td>#{ques.smQuestion.questionValue}</td>
						</tr>
						<tr>
							<td></td>
							<td><p:selectOneRadio id="answerId" value="#{ques.smAnswer.answerId}">
									<f:selectItems value="#{questionnaireBackingBean.getAnswerOptions(ques.smQuestion.smAnswerCategory.smAnswers)}" />
								</p:selectOneRadio></td>
						</tr>
						<tr>
							<td><br /></td>
						</tr>
					</ui:repeat>
				</table>
				<!-- <table style="width: 100%">
				<p:dataTable
					value="#{questionnaireBackingBean.managedBean.smSuppAnswerLs}"
					var="ques" rowIndexVar="rowIndex">
					<p:column>
						<tr>
							<td>#{rowIndex+1}.#{ques.smQuestion.questionValue}</td>
						</tr>
						<tr>
							<td><p:selectOneRadio value="#{ques.smAnswer.answerId}">
									<f:selectItems
										value="#{ques.smQuestion.smAnswerCategory.smAnswers}"
										var="ans" itemLabel="#{ans.answerValue}"
										itemValue="#{ans.answerId}">
									</f:selectItems>
								</p:selectOneRadio></td>
						</tr>
						<tr>
							<td></td>
						</tr>
					</p:column>
				</p:dataTable>
			 </table> -->
			</p:panel>
		</div>
		<div align="right">
			<p:commandButton
				action="#{questionnaireBackingBean.submitQuestionnaire}"
				value="#{lbl['lbl.btn.submit']}" />
		</div>
	</ui:define>
</ui:composition>
