<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<table style="width: 100%">
		<tr>
			<td style="text-align: left;">
				<p:commandButton value="#{lbl['lbl.btn.back']}" action="#{smCustomerServiceBackingBean.back}" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form">
				</p:commandButton>
			</td>
		</tr>
	</table>
	
	<c:if test="#{smCustomerServiceBackingBean.managedBean.tabActiveIndex eq 0}">
		<ui:include src="smCustomerServiceCompanySection.xhtml" />
	</c:if>
	<c:if test="#{smCustomerServiceBackingBean.managedBean.tabActiveIndex eq 1}">
		<ui:include src="smCustomerServiceCatalogueSection.xhtml" />
	</c:if>

</ui:composition>
