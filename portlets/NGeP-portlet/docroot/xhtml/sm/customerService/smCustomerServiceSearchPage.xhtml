<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sm.search.supp.appl.history']}" toggleable="true" id="searchSupplierProfilePanelId">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.mofno']}" /></td>
				<td>
					<p:inputText id="mofNoId"
						label="#{lbl['lbl.sm.mofno']}"
						value="#{smCustomerServiceBackingBean.managedBean.searchMofNo}"
						size="35" maxlength="14" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.epno']}" /></td>
				<td>
					<p:inputText id="epNoId"
						label="#{lbl['lbl.sm.epno']}"
						value="#{smCustomerServiceBackingBean.managedBean.searchEpNo}"
						size="35" maxlength="14" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.companyname']}" /></td>
				<td>
					<p:inputText id="companyNameId"
						label="#{lbl['lbl.sm.companyname']}"
						value="#{smCustomerServiceBackingBean.managedBean.searchSupplier.companyName}"
						size="40" maxlength="100" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.application.no']}" /></td>
				<td>
					<p:inputText id="applNoId"
						label="#{lbl['lbl.sm.application.no']}"
						value="#{smCustomerServiceBackingBean.managedBean.searchApplNo}"
						size="35" maxlength="20" />
					<p:message id="applNoIdMsg" for="applNoId" display="icon" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.applicationstatus']}" /></td>
				<td><p:selectOneMenu id="searchApplStatusId" label="#{lbl['lbl.sm.applicationstatus']}"
						value="#{smCustomerServiceBackingBean.managedBean.searchApplStatusId}" 
						style="width:310px">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems value="#{smCustomerServiceBackingBean.managedBean.applStatusItems}" />
					</p:selectOneMenu>
					<p:message id="searchApplStatusIdMsg" for="searchApplStatusId" display="icon" />
				</td>
			</tr>
		
			<tr>
				<td colspan="2">
					<div style="text-align: right;">
						<p:commandButton value="#{lbl['lbl.btn.search']}" 
							action="#{smCustomerServiceBackingBean.search}"
							update="@form" 
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
						</p:commandButton>
						<p:commandButton value="#{lbl['lbl.btn.reset']}" 
							action="#{smCustomerServiceBackingBean.resetSearch}"
							update="searchSupplierProfilePanelId">
						</p:commandButton>
					</div>
				</td>
			</tr>
		</table>
		
		<br />
	</p:panel>
	
</ui:composition>
