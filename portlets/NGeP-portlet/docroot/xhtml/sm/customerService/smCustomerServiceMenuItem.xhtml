<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:tabMenu activeIndex="#{smCustomerServiceBackingBean.managedBean.tabActiveIndex}" styleClass="sidemenu">

		<p:menuitem value="#{lbl['lbl.sm.companyinfo']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{smCustomerServiceBackingBean.setTabValue('0',SupplierManagementConst.SM_APPL_PAGE_TYPE_BASIC)}"
			update="@form" />
		<p:menuitem value="#{lbl['lbl.sm.catalogue.info']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{smCustomerServiceBackingBean.setTabValue('1',SupplierManagementConst.SM_APPL_PAGE_TYPE_BRANCH)}"
			update="@form" />
	</p:tabMenu>

</ui:composition>
