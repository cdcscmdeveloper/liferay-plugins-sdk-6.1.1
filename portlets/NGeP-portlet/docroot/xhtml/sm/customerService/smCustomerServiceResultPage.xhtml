<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sm.results']}" toggleable="true" id="resultSupplierProfilePanelId">
				
		<p:dataTable var="smAppl" widgetVar="smApplWidgetVar"
			editable="false" lazy="true" rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{smCustomerServiceBackingBean.managedBean.smSupplierDataModel}"
			rowKey="#{smAppl}" rowIndexVar="index" id="supplierApplHistoryDtId">
			<ac:paginator for="supplierApplHistoryDtId" />
			
			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" 
				style="width : 5%;text-align: center !important;">
				<h:outputText value="#{index + 1}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.application.no']}">
				<h:outputText value="#{smAppl[0]}" rendered="#{not empty smAppl[0]}"/>
				<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty smAppl[0]}"/>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.applicationtype']}" style="width :25%;white-space : normal">
				<h:outputText value="#{lbl['lbl.sm.appltype.basic']}" rendered="#{smAppl[1] eq 'O'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.newmof']}" rendered="#{smAppl[1] eq 'N'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.bumiputera']}" rendered="#{smAppl[1] eq 'B'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.categorycode']}" rendered="#{smAppl[1] eq 'A'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.updateprofile']}" rendered="#{smAppl[1] eq 'U'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.cancelmof']}" rendered="#{smAppl[1] eq 'C'}" />
				<h:outputText value="#{lbl['lbl.sm.appltype.renewmof']}" rendered="#{smAppl[1] eq 'R'}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.companyname']}" style="width :25%;white-space : normal">
				<h:outputText value="#{smAppl[3]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.mofno']}">
				<h:outputText value="#{smAppl[8]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.epno']}">
				<h:outputText value="#{smAppl[9]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.applicationstatus']}">
				<h:outputText value="#{smAppl[6]}" rendered="#{not empty smAppl[6]}"/>
				<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty smAppl[6]}"/>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
				<p:commandLink onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{smCustomerServiceBackingBean.view(smAppl[10])}"
					process="@this" partialSubmit="true" update="@form"
					style="padding-right:5px;">
					<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
				</p:commandLink>
			</p:column>
			
		</p:dataTable>
		
	</p:panel>
</ui:composition>
