<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_smCustomerService_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.module.applicationHistory']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false"/>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:outputPanel id="searchPanelId" rendered="#{smCustomerServiceBackingBean.managedBean.targetPage eq 1}">
			<ui:include src="/xhtml/sm/customerService/smCustomerServiceSearchPage.xhtml" />
			<ui:include src="/xhtml/sm/customerService/smCustomerServiceResultPage.xhtml" />
		</p:outputPanel>
		<p:outputPanel id="uploadDocPanelId" rendered="#{smCustomerServiceBackingBean.managedBean.targetPage eq '2'}">
			<ui:include src="/xhtml/sm/customerService/smCustomerServiceDetailsPage.xhtml" />
		</p:outputPanel>
	</ui:define>
		
</ui:composition>
