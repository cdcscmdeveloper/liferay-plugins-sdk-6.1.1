<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: top;" class="sidemenutd"><ui:include src="smCustomerServiceMenuItem.xhtml" /></td>
			<td style="vertical-align: top;">
			
				<p:panel header="#{lbl['lbl.sm.panHdr.comBasic']}" toggleable="true" >
	
					<table style="width: 100%;table-layout:fixed">
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mof.no']}" /></td>
							<td>
								<p:outputPanel rendered="#{not empty smCustomerServiceBackingBean.managedBean.mofRegStatus}">
									<p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smMofCert.smMofAccount.mofNo}" 
										rendered="#{not empty smCustomerServiceBackingBean.managedBean.smMofCert}"/>
									<p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smMofAccount.mofNo}" 
										rendered="#{empty smCustomerServiceBackingBean.managedBean.smMofCert}"/>
								</p:outputPanel>
								<p:outputPanel rendered="#{empty smCustomerServiceBackingBean.managedBean.mofRegStatus}">
									<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.na']}" />
								</p:outputPanel>
							</td>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.epno']}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smSupplier.epNo}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.companyname']}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smAppl.smCompanyBasic.companyName}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.rocNo']}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smSupplier.regNo}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mof.endDate']}" /></td>
							<td>
								<p:outputPanel rendered="#{not empty smCustomerServiceBackingBean.managedBean.smMofCert 
									and not empty smCustomerServiceBackingBean.managedBean.mofRegStatus}">
									<ac:labelDate styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smMofCert.expDate}" />
								</p:outputPanel>
								<p:outputPanel rendered="#{empty smCustomerServiceBackingBean.managedBean.smMofCert 
									and not empty smCustomerServiceBackingBean.managedBean.mofRegStatus}">
									<ac:labelDate styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smMofAccount.expDate}" />
								</p:outputPanel>
								<p:outputPanel rendered="#{empty smCustomerServiceBackingBean.managedBean.mofRegStatus}">
									<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.na']}" />
								</p:outputPanel>
							</td>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.mof.regstatus']}" /></td>
							<td>
								<p:outputLabel styleClass="outputLabel-view" 
									value="#{empty smCustomerServiceBackingBean.managedBean.mofRegStatus ? lbl['lbl.txt.na'] : 
										smCustomerServiceBackingBean.managedBean.mofRegStatus}" />
							</td>
						</tr>
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.companyaddress']}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.country']}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCountry.countryName}"/></td>
						</tr>
						<tr>
							<td></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.state']}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateName}"/></td>
						</tr>
						<tr>
							<td></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.district']}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict.districtName}"/></td>
						</tr>
						<tr>
							<td></td>
							<td></td>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.towncity']}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity.cityName}"/></td>
						</tr>
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.postcode']}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}" /></td>
							<td></td>
							<td></td>
						</tr>
					</table>
					
				</p:panel>
				
				<p:panel header="#{lbl['lbl.sm.supplier.administration.info']}" toggleable="true" >
					<table style="width: 100%;table-layout:fixed">
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.name']}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.suppAdmin.name}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.email']}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.suppAdmin.email}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.phoneno']}" /></td>
							<td>
								<p:outputLabel styleClass="outputLabel-view" rendered="#{not empty smCustomerServiceBackingBean.managedBean.suppAdmin.phoneFull}"
									value="#{smCustomerServiceBackingBean.managedBean.suppAdmin.phoneFull}" />
								<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.na']}" 
									rendered="#{empty smCustomerServiceBackingBean.managedBean.suppAdmin.phoneFull}"/>
							</td>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.person.designation']}" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{smCustomerServiceBackingBean.managedBean.suppAdmin.designation}"/></td>
						</tr>
					</table>
				</p:panel>
				
				<p:panel header="#{lbl['lbl.sm.list.category.code']}" toggleable="true">
					<p:dataTable var="aprvdCatBean"
						widgetVar="smApprvdCatCodesNonRenewApplDtWidVar"
						value="#{smCustomerServiceBackingBean.managedBean.smAppl.smSupplierCategories}"
						rowKey="#{aprvdCatBean}" rowIndexVar="index" id="catApprDt"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
						<ac:paginator for="catApprDt" />
						<p:column style="width : 2%;" headerText="#{lbl['lbl.sm.userprofile.num']}">
							<p:outputLabel value="#{index + 1}"
								style="float: left;white-space: normal;" />
						</p:column>
						<p:column style="white-space : normal" headerText="#{lbl['lbl.sm.catCodes.cate']}">
							<h:outputText
								value="#{aprvdCatBean.pmCategoryL1.categoryL1Code} -  #{aprvdCatBean.pmCategoryL1.categoryName}" />
							<br />
							<h:outputText
								value="#{aprvdCatBean.pmCategoryL2.categoryL2Code} -  #{aprvdCatBean.pmCategoryL2.categoryName}" />
							<br />
							<h:outputText
								value="#{aprvdCatBean.pmCategoryL3.categoryL3Code} -  #{aprvdCatBean.pmCategoryL3.categoryName}" />
						</p:column>
			
						<p:column headerText="#{lbl['lbl.sm.status']}" style="width :20%;white-space : normal">
							<h:outputText value="#{lbl['lbl.sm.status.active']}" rendered="#{aprvdCatBean.recordStatusFlg eq 1}" />
							<h:outputText value="#{lbl['lbl.sm.status.pending.approval']}" rendered="#{aprvdCatBean.recordStatusFlg eq 8}" />
							<h:outputText value="#{lbl['lbl.sm.status.deleted']}" rendered="#{aprvdCatBean.recordStatusFlg eq 9}" />
						</p:column>
					</p:dataTable>
				</p:panel>
				
				<p:panel header="#{lbl['lbl.sm.list.user']}" toggleable="true">
					<p:dataTable var="person" widgetVar="suppPersonnelInfoDtWidVar"
						value="#{smCustomerServiceBackingBean.managedBean.smAppl.smPersonnels}"
						rowKey="#{person}" rowIndexVar="index" id="personDt">
						<ac:paginator for="personDt" />
				
						<p:column headerText="#{lbl['lbl.sm.person.composition.name']}">
							<h:outputText value="#{person.name}" />
						</p:column>
				
						<p:column headerText="#{lbl['lbl.sm.person.composition.idenNum']}">
							<h:outputText value="#{person.identificationNo}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.certificate.expDate']}">
							<h:outputText value="#{person.softcertValidityDate}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.person.composition.isAuth']}">
							<h:outputText value="#{lbl['lbl.txt.yes']}"
								rendered="#{person.authorizedFlg eq '1'}" />
							<h:outputText value="#{lbl['lbl.txt.no']}"
								rendered="#{person.authorizedFlg eq '0'}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.status']}">
							<h:outputText value="#{lbl['lbl.sm.status.active']}"
								rendered="#{not empty person.epRole}" />
							<h:outputText value="#{lbl['lbl.sm.status.inactive']}"
								rendered="#{empty person.epRole}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.person.composition.eprole']}">
							<ac:smRoleDesc backingBean="#{smCustomerServiceBackingBean}" roleCode="#{person.epRole}"/>
						</p:column>
					</p:dataTable>
				</p:panel>
			</td>
		</tr>

	</table>

</ui:composition>
