<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		<script>
			function clickLogout() {
				_145_deleteAllCookies();
				$('[id*="yui_patched_v3_11_0_1"]').click();
			}
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" 
			closable="true" showSummary="false" severity="error"/>
			
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:dialog widgetVar="submissionConfirmDlg" modal="true" height="100" width="500">
   			 #{lbl['lbl.sm.basic.msg.account.confirm.deactivate']}
   			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" action="#{registrationBackingBean.updateBasicAccountStatus()}" 
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="submissionConfirmDlg.hide();" />
			</div>
		</p:dialog>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.save']}" action="#{registrationBackingBean.saveBasicAccountStatus()}" >
			</p:commandButton>
		</div>
		
		<p:panel header="Basic Account Status">
		<table>
			<tr>
				<td class="tdTitle"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.accountstatus']}" /></td>
				<td class="tdContent"><p:selectOneRadio value="#{registrationBackingBean.managedBean.smSupp.recordStatusFlg}">
					<f:selectItem itemLabel="#{lbl['lbl.sm.accountstatus.active']}" itemValue="1" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.accountstatus.deactivate']}" itemValue="0" />
					</p:selectOneRadio>
				</td>
			</tr>
		
			<tr>
				<td class="tdTitle"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.epno']}" /></td>
				<td class="tdContent"><p:outputLabel styleClass="outputLabel-view"  value="#{registrationBackingBean.managedBean.smSupp.epNo}" /></td>
			</tr>
			
			<tr>
				<td class="tdTitle"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.companyname']}" /></td>
				<td class="tdContent"><p:outputLabel styleClass="outputLabel-view" value="#{registrationBackingBean.managedBean.smSupp.companyName}" /></td>
				
				<td class="tdTitle"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.businessregno']}" /></td>
				<td class="tdContent"><p:outputLabel styleClass="outputLabel-view"  value="#{registrationBackingBean.managedBean.smSupp.regNo}" /></td>
			</tr>
		</table>
		</p:panel>
		
		<p:dialog id="successDialog" header="#{lbl['lbl.sm.success.dialog.header']}" closable="false"
			widgetVar="successDialog" modal="true" width="400px" height="100px">
			<p:messages id="successDialogMsg" showSummary="false"
				showDetail="true" autoUpdate="true" closable="false" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.ok']}" onclick="clickLogout();" ajax="false" />
			</div>
		</p:dialog>
	</ui:define>
</ui:composition>
