<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">
		<script>
			$('#portlet_updateCompExpInfo_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					"#{lbl['lbl.sm.update.comp.exp.info.draft']}");
		</script>
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:outputPanel>
			<div align="left">
				<p:commandButton
					value="#{lbl['lbl.sm.update.comp.exp.info.draft.back.btn']}"
					partialSubmit="true" update="@this" process="@this"
					action="#{updateCompExpInfoBB.proceedAfterAcceptTnC}"
					onclick="blockWidget.show()" oncomplete="blockWidget.hide()"></p:commandButton>
			</div>
		</p:outputPanel>
		<p:panel header="#{lbl['lbl.sm.update.comp.exp.info.draft.from.sm']}"
			toggleable="true">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.update.comp.exp.info.draft.from.sm.instruction']}" />
			<br />
			<p:dataTable id="smCompExpDrafId" var="smCompExpDraf" rows="10"
				value="#{updateCompExpInfoBB.managedbean.smCompExpDrafList}" rowIndexVar="index"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<ac:paginator for="smCompExpDrafId"></ac:paginator>
				<p:columnGroup type="header">
					<p:row>
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.info.draft.table.no']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.info.draft.table.project.title']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.info.draft.table.contract.value']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.info.draft.table.contract.eff.date']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.info.draft.table.action']}"
							style="text-align: center !important;" />
					</p:row>
				</p:columnGroup>
			</p:dataTable>
		</p:panel>
		<p:panel header="#{lbl['lbl.sm.update.comp.exp.info.draft.from.ct']}"
			toggleable="true">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.update.comp.exp.info.draft.from.ct.instruction']}" />
			<br />
			<p:dataTable id="ctCompExpDrafId" var="ctCompExpDraf" rows="10"
				value="#{updateCompExpInfoBB.managedbean.ctCompExpDrafList}" rowIndexVar="index"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<ac:paginator for="ctCompExpDrafId"></ac:paginator>
				<p:columnGroup type="header">
					<p:row>
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.info.draft.table.no']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.info.draft.table.project.title']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.info.draft.table.contract.value']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.info.draft.table.contract.eff.date']}"
							style="text-align: center !important;" />
						<p:column
							headerText="#{lbl['lbl.sm.update.comp.exp.info.draft.table.action']}"
							style="text-align: center !important;" />
					</p:row>
				</p:columnGroup>
			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
