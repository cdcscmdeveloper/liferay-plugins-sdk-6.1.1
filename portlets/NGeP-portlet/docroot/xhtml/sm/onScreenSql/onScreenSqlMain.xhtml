<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" escape="false"/>
		
		<p:inputTextarea value="#{smOnScreenSQLBackingBean.sqlStmt}" rows="7" cols="100" />
		<p:commandButton id="btnSubmitSQL" value="Submit SQL" action="#{smOnScreenSQLBackingBean.submitSQL()}"
			update="pnlResult" />

		<p:panel header="Result" id="pnlResult">
		1. #{smOnScreenSQLBackingBean.sqlAction eq smOnScreenSQLBackingBean.sqlSelect}><br />
		2. #{smOnScreenSQLBackingBean.sqlAction}
		3. #{smOnScreenSQLBackingBean.sqlSelect}

		
		<table border="1">
				<thead>
					<tr>
						<c:forEach items="#{smOnScreenSQLBackingBean.dataRowLs[0]}"
							var="entry">
							<th>#{entry.key}</th>
						</c:forEach>
					</tr>
				</thead>
				
				<c:forEach items="#{smOnScreenSQLBackingBean.dataRowLs}" var="columns">
			      <tr>
			        <c:forEach items="#{columns}" var="column">
			          <td>#{column.value}</td>
			        </c:forEach>
			      </tr>
		   		</c:forEach>
		</table>
		</p:panel>
	</ui:define>
</ui:composition>
