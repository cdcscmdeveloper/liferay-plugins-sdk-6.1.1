<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: top;" class="sidemenutd">
				<c:if test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForMof}">
					<ui:include src="/xhtml/sm/NewMofApplication/smMofApplnSideMenuItem.xhtml" />
				</c:if> 
				<c:if test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForBumi}">
					<ui:include src="/xhtml/sm/updateMofDetails/smUpdateMofApplnSideMenuItem.xhtml" />
				</c:if> 
				<c:if test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
					<ui:include src="/xhtml/sm/renewMofApplication/smRenewApplnSideMenuItem.xhtml" />
				</c:if> 
				<c:if test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForApplcatcodes}">
					<ui:include src="/xhtml/sm/renewMofApplication/smRenewApplnSideMenuItem.xhtml" />
				</c:if> 
				<c:if test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForUpdate}">
					<ui:include src="/xhtml/sm/updateMofDetails/smUpdateMofApplnSideMenuItem.xhtml" />
				</c:if>
			</td>
			<td>
				<!-- #12483 - START -->
				<h:outputText value="#{lbl['lbl.sm.revise.reason']} : #{backingBean.currentReviseReason()}" rendered="#{backingBean.renderRevisedReason()}" styleClass="splNotesFonts" escape="false" />
				<!-- #12483 - END -->
				<div style="width: 100%" align="right">
					<p:commandButton value="#{lbl['lbl.sm.button.send.enquiry']}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						partialSubmit="true" process="@this"
						action="#{backingBean.assignMissingDocsList(true,'inquiryDialog')}"
						update=":#{p:component('inquiryDialog')}" />
				</div>
				<ui:include src="poInquiryDetails.xhtml" />
			</td>
		</tr>
	</table>
	
	<p:dialog width="1050px" header="#{lbl['lbl.sm.send.enquiry']}"
		id="inquiryDialog" widgetVar="inquiryDialog" resizable="false"
		showEffect="fade" hideEffect="fade" modal="true" closable="false">
					
		<p:outputPanel layout="block" id="inquiryBlockPanel">
			
			<p:messages id="poInquirySecMsg" showSummary="false" showDetail="true" autoUpdate="true" closable="true" />
				
			<p:panel header="#{lbl['lbl.sm.enquiry.supporting.documents.list']}"
				id="inquiryMainSuppDocPanel">
		
				<p:dataTable var="onTable" id="inquiryMainSdList" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{backingBean.managedBean.missinDocs}">
					<ac:paginator for="inquiryMainSdList" />
		
					<p:column headerText="#{lbl['lbl.sm.enquiry.document.description']}"
						style="width : 60%">
						<p:outputLabel value="#{onTable.pmDocument.docName}"
							style="float: left;white-space: normal;" />
					</p:column>
		
					<p:column headerText="#{lbl['lbl.sm.enquiry.document.status']}"
						style="width : 20%">
						<p:outputLabel
							value="#{lbl['lbl.sm.enquiry.document.status.missinginvalid']}"
							style="float: left;white-space: normal;" />
					</p:column>
		
					<p:column headerText="#{lbl['lbl.sm.enquiry.remarks.to.supplier']}"
						style="width : 20%">
						<p:inputTextarea value="#{onTable.poRemarks}" maxlength="100" />
					</p:column>
		
				</p:dataTable>
			</p:panel>
			
			<p:panel header="#{lbl['lbl.sm.other.application.inquiry']}" id="inquiryOtherMainPanelId" 
				rendered="#{backingBean.managedBean.poUser and backingBean.managedBean.poToSupplierInquiry ne null}">
				<h:outputText value="*" styleClass="mandatory" rendered="#{backingBean.managedBean.valueReqd}"/>&#160;
				<p:inputTextarea value="#{backingBean.managedBean.poToSupplierInquiry.inquiryText}" 
					label="#{lbl['lbl.sm.other.application.inquiry']}" id="inquiryOtherMainTxtId"
					maxlength="100" cols="70" rows="10" required="#{backingBean.managedBean.valueReqd}"/>
				<p:message id="inquiryOtherMainTxtIdMsg"
					for="inquiryOtherMainTxtId" showSummary="true" showDetail="false"
					display="icon" />
			</p:panel>
	
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.submit.enquiry']}"
					process="inquiryBlockPanel" update="@([id$=Msg])"
					oncomplete="inquiryDialog.hide();"
					action="#{backingBean.submitPOorApproverReviewToBPM('INQUIRY')}" />
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}" process="@this"
					oncomplete="inquiryDialog.hide();" action="#{backingBean.cancelInquiry}"/>
			</div>
			<p:blockUI block="inquiryBlockPanel" widgetVar="inquiryBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
		</p:outputPanel>
		
	</p:dialog>
</ui:composition>
