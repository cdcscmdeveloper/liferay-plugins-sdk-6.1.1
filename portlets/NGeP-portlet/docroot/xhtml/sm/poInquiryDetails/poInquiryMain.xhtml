<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: top;" class="sidemenutd">
				<c:if test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForMof}">
					<ui:include src="/xhtml/sm/NewMofApplication/smMofApplnSideMenuItem.xhtml" />
				</c:if> 
				<c:if test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForBumi}">
					<ui:include src="/xhtml/sm/updateMofDetails/smUpdateMofApplnSideMenuItem.xhtml" />
				</c:if> 
				<c:if test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
					<ui:include src="/xhtml/sm/renewMofApplication/smRenewApplnSideMenuItem.xhtml" />
				</c:if> 
				<c:if test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForApplcatcodes}">
					<ui:include src="/xhtml/sm/renewMofApplication/smRenewApplnSideMenuItem.xhtml" />
				</c:if> 
				<c:if test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForUpdate}">
					<ui:include src="/xhtml/sm/updateMofDetails/smUpdateMofApplnSideMenuItem.xhtml" />
				</c:if>
			</td>
			<td>
				<!-- #12483 - START, #34892 -->
				<ac:smReviseReason bBean="#{backingBean}"/>
				<!--#34392 Start -->
				<div style="width: 100%" align="right">
				<!-- #12483 - END -->
				<p:commandButton value="#{lbl['lbl.sm.button.send.enquiry']}" rendered="#{backingBean.managedBean.inquirySiteVisitAfter}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						partialSubmit="true" process="@this"
						action="#{backingBean.assignMissingDocsList(true,'sendInqDialog')}"
						update=":#{p:component('sendInqDialog')}"/>
				</div>
				<ui:include src="poInquiryDetails.xhtml" />
			</td>
		</tr>
	</table>
	
	<p:dialog width="1000px" height="450px" header="#{lbl['lbl.sm.send.enquiry']}"
		id="sendInqDialog" widgetVar="sendInqDialog" resizable="false"
		showEffect="fade" hideEffect="fade" modal="true" closable="false">
					
		<p:outputPanel layout="block" id="inquiryBlockPanel">
			
			<p:messages id="poInquirySecMsg" showSummary="false" showDetail="true" autoUpdate="true" closable="true" />
				
			<p:panel header="#{lbl['lbl.sm.enquiry.supporting.documents.list']}"
				id="inquiryMainSuppDocPanel">
				<!-- <p:dataTable var="onTable" id="inquiryMainSdList" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{backingBean.managedBean.missinDocs}">
					<ac:paginator for="inquiryMainSdList" />
		
					<p:column headerText="#{lbl['lbl.sm.enquiry.document.description']}"
						style="width : 60%">
						<p:outputLabel value="#{onTable.pmDocument.docName}"
							style="float: left;white-space: normal;" />
					</p:column>
		
					<p:column headerText="#{lbl['lbl.sm.enquiry.document.status']}"
						style="width : 20%">
						<p:outputLabel
							value="#{lbl['lbl.sm.enquiry.document.status.missinginvalid']}"
							style="float: left;white-space: normal;" />
					</p:column>
		
					<p:column headerText="#{lbl['lbl.sm.enquiry.remarks.to.supplier']}"
						style="width : 20%">
						<p:inputTextarea value="#{onTable.poRemarks}" maxlength="100" />
					</p:column>
		
				</p:dataTable> -->
				<p:dataTable var="table"
					value="#{backingBean.managedBean.missinDocsMandatory}"
					id="onlineMandatoryListMain" rowIndexVar="index"
					rendered="#{not empty backingBean.managedBean.missinDocsMandatory}"
					style="width:1000px !important; table-layout: fixed !important;"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
					<p:columnGroup type="header">
						<p:row>
							<p:column headerText="#{lbl['lbl.sm.mandatory.suppdoc']}"
								colspan="5"
								style="background-color:PeachPuff !important;text-align: center !important;color:black !important" />
						</p:row>
						<p:row>
							<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
								style="width : 3% !important;text-align: center !important;" />
							<p:column
								headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
								style="width : 70% !important;overflow: hidden !important;" />
							<p:column headerText="#{lbl['lbl.sm.remarks']}"
								style="width : 27% !important;overflow: hidden !important;" />
						</p:row>
					</p:columnGroup>
					<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
						style="width : 3% !important;"
						rendered="#{table.pmDocument.mandatory}">
						<h:outputText value="#{sdoReviewBackingBean.mandatoryCounter}"
							style="float: left;white-space: normal;font-weight:bold;" />
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
						style="width : 70% !important;"
						rendered="#{table.pmDocument.mandatory}">
						<h:outputText value="#{table.pmDocument.docName}"
							style="float: left;white-space: normal;" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.remarks']}"
						style="width : 27% !important;"
						rendered="#{table.pmDocument.mandatory}">
						<p:inputTextarea value="#{table.inquiryRemark}"
							style="float: left;white-space: normal;width:97% !important;" maxlength="2500"/>
					</p:column>
				</p:dataTable>
				<!-- datatable for mandatory support doc with no record to display(fix bug in primeface version) -->
				<p:dataTable var="" value="" id="EmptyOnlineMandatoryListMain"
					rendered="#{empty backingBean.managedBean.missinDocsMandatory}"
					rowIndexVar="index"
					style="width:1000px !important; table-layout: fixed !important;"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
					<p:columnGroup type="header">
						<p:row>
							<p:column headerText="#{lbl['lbl.sm.mandatory.suppdoc']}"
								colspan="5"
								style="background-color:PeachPuff !important;text-align: center !important;color:black !important" />
						</p:row>
						<p:row>
							<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
								style="width : 3% !important;text-align: center !important;" />
							<p:column
								headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
								style="width : 70% !important;overflow: hidden !important;" />
							<p:column headerText="#{lbl['lbl.sm.remarks']}"
								style="width : 27% !important;overflow: hidden !important;"/>
						</p:row>
						<p:row>
							<p:column
								headerText="#{lbl['lbl.datatable.msg.no.records.found']}"
								colspan="5"
								style="background-color:white !important; color:black; font-weight:normal !important; text-align:left !important;">

							</p:column>
						</p:row>
					</p:columnGroup>
				</p:dataTable>
				<!-- datatable for non-mandatory support doc with record to display -->
				<p:dataTable var="table"
					value="#{backingBean.managedBean.missinDocsNonMandatory}"
					id="onlineNonMandatoryListMain" rowIndexVar="index"
					rendered="#{not empty backingBean.managedBean.missinDocsNonMandatory}"
					style="width:1000px !important; table-layout: fixed !important;"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">

					<p:columnGroup type="header">
						<p:row>
							<p:column headerText="#{lbl['lbl.sm.nonmandatory.suppdoc']}"
								colspan="5"
								style="background-color:PaleGreen !important;text-align: center !important;color:black !important" />
						</p:row>
						<p:row>
							<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
								style="width : 3% !important;text-align: center !important;" />
							<p:column
								headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
								style="width : 70% !important;overflow: hidden !important;" />
							<p:column headerText="#{lbl['lbl.sm.remarks']}"
								style="width : 27% !important;overflow: hidden !important;" />
						</p:row>
					</p:columnGroup>
					<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
						style="width : 3% !important;"
						rendered="#{!table.pmDocument.mandatory}">
						<h:outputText value="#{sdoReviewBackingBean.nonMandatoryCounter}"
							style="float: left;white-space: normal;font-weight:bold;" />
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
						style="width : 70% !important;"
						rendered="#{!table.pmDocument.mandatory}">
						<h:outputText value="#{table.pmDocument.docName}"
							style="float: left;white-space: normal;" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sm.remarks']}"
						style="width : 27% !important;"
						rendered="#{!table.pmDocument.mandatory}">
						<p:inputTextarea value="#{table.inquiryRemark}"
							style="float: left;white-space: normal;width:97% !important;" maxlength="2500"/>
					</p:column>
				</p:dataTable>
				<!-- datatable for non-mandatory support doc with no record to display(fix bug in primeface version) -->
				<p:dataTable var="" value="" id="EmptyOnlineNonMandatoryListMain"
					rendered="#{empty backingBean.managedBean.missinDocsNonMandatory}"
					rowIndexVar="index"
					style="width:1000px !important; table-layout: fixed !important;"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
					<p:columnGroup type="header">
						<p:row>
							<p:column headerText="#{lbl['lbl.sm.nonmandatory.suppdoc']}"
								colspan="5"
								style="background-color:PaleGreen !important;text-align: center !important;color:black !important" />
						</p:row>
						<p:row>
							<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
								style="width : 3% !important;text-align: center !important;" />
							<p:column
								headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
								style="width : 70% !important;overflow: hidden !important;" />
							<p:column headerText="#{lbl['lbl.sm.remarks']}"
								style="width : 27% !important;overflow: hidden !important;"/>
						</p:row>
						<p:row>
							<p:column
								headerText="#{lbl['lbl.datatable.msg.no.records.found']}"
								colspan="5"
								style="background-color:white !important; color:black; font-weight:normal !important; text-align:left !important;">

							</p:column>
						</p:row>
					</p:columnGroup>
				</p:dataTable>
			</p:panel>
			<!--#34392 End -->
			<p:panel header="#{lbl['lbl.sm.other.application.inquiry']}" id="inquiryOtherMainPanelId" 
				rendered="#{backingBean.managedBean.poUser and backingBean.managedBean.poToSupplierInquiry ne null}">
				<h:outputText value="*" styleClass="mandatory" rendered="#{backingBean.managedBean.valueReqd}"/>&#160;
				<p:inputTextarea value="#{backingBean.managedBean.poToSupplierInquiry.inquiryText}" 
					label="#{lbl['lbl.sm.other.application.inquiry']}" id="inquiryOtherMainTxtId"
					maxlength="100" cols="70" rows="10" required="#{backingBean.managedBean.valueReqd}"/>
				<p:message id="inquiryOtherMainTxtIdMsg"
					for="inquiryOtherMainTxtId" showSummary="true" showDetail="false"
					display="icon" />
			</p:panel>
	
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.submit.enquiry']}"
					process="inquiryBlockPanel" update="@([id$=Msg])"
					oncomplete="sendInqDialog.hide();"
					action="#{backingBean.submitPOorApproverReviewToBPM('INQUIRY')}" />
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}" process="@this"
					oncomplete="sendInqDialog.hide();" action="#{backingBean.cancelInquiry}"/>
			</div>
			<p:blockUI block="inquiryBlockPanel" widgetVar="inquiryBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
		</p:outputPanel>
		
	</p:dialog>
</ui:composition>
