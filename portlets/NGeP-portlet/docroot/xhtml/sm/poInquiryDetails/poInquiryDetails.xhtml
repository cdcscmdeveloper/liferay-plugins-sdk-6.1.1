<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<!-- 14530 START -->
	<p:outputPanel id="inquiryDetails">
	<p:dialog header="#{lbl['lbl.sm.supportingdoc.inquiry']}" widgetVar="inquiryDtls" modal="true" height="300">
	<p:panel header="#{lbl['lbl.sm.enquiry.supporting.document.list']}"
		id="inqDetailsSuppDocPanel" >

		<p:dataTable var="table" id="onSdList" value="#{backingBean.managedBean.poToSupplierInquiry.smApplSupportDocInquiries}" 
			rendered="#{backingBean.managedBean.smAppl.supportingDocMode eq 'S'}">
			<ac:paginator for="onSdList" />

			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" 
				style="width : 60%;">
				<h:outputText value="#{table.pmDocument.docName}" 
					style="float: left;white-space: normal;" /> 
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.sectionPoRmrk']}"
				style="width : 20%;">
				<h:outputText value="#{table.poRemarks}" 
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.suppDoc.added.document.name']}"
				style="width : 10%;">
				<h:outputText value="#{table.smApplInquiryDocFiles[0].fileName}"
					style="float: left;white-space: normal;" />
			</p:column>
		</p:dataTable>
		
		<p:dataTable var="table" id="offSdList" value="#{backingBean.managedBean.poToSupplierInquiry.smApplSupportDocInquiries}" 
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" 
			rendered="#{backingBean.managedBean.smAppl.supportingDocMode ne 'S'}">
			<ac:paginator for="offSdList" />

			<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" style="width : 70%;">
				<h:outputText value="#{table.pmDocument.docName}" style="float: left;white-space: normal;" 
					/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.sectionPoRmrk']}" style="width : 30%;">
				<h:outputText value="#{table.poRemarks}" style="float: left;white-space: normal;" 
					 />
			</p:column>

		</p:dataTable>

	</p:panel>
	
	<p:panel header="#{lbl['lbl.sm.other.application.inquiry']}" id="otherInquiryDetailsPanelId" 
		rendered="#{backingBean.managedBean.poToSupplierInquiry ne null 
		and not empty backingBean.managedBean.poToSupplierInquiry.inquiryText}">
		<table style="width: 100%;table-layout:fixed">
			<tr>
				<td style="white-space : normal;word-break:break-all" >
					<h:outputText value="#{backingBean.managedBean.poToSupplierInquiry.inquiryText}" />
				</td>
			</tr>
		</table>
	</p:panel>
	<!--  
	<p:panel header="#{lbl['lbl.sm.supplier.respond']}" id="responseInquiryDetailsPanelId" 
			rendered="#{backingBean.managedBean.poToSupplierInquiry ne null 
			and not empty backingBean.managedBean.poToSupplierInquiry.responseText}">
		<table style="width: 50%;table-layout:fixed">
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.inquiry.reply.received.date']}" /></td>
				<td><ac:labelDate styleClass="outputLabel-view" value="#{backingBean.managedBean.poToSupplierInquiry.responseDate}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.supplier.respond']}" /></td>
				<td style="white-space : normal" >
					<p:outputLabel styleClass="outputLabel-view" value="#{backingBean.managedBean.poToSupplierInquiry.responseText}" />
				</td>
			</tr>
		</table>
	</p:panel>
	-->
	</p:dialog> 
	</p:outputPanel>
	<!-- 14530 END -->
	
	<p:panel header="#{lbl['lbl.sm.inquiry.list']}" id="inquiryHistoryDetailsPanelId" 
		rendered="#{not empty backingBean.managedBean.poSupplierInquiryHistory}">
			<p:dataTable  id="inqHistDetailsTableId" selection="#{backingBean.managedBean.poToSupplierInquiry}" rowKey="#{inqHistVar}" 
			value="#{backingBean.managedBean.poSupplierInquiryHistory}" var="inqHistVar">
				
				<ac:paginator for="inqHistDetailsTableId" />

				<p:column headerText="#{lbl['lbl.sm.enquiry.inquiry.date']}" style="width : 15%">
					<h:outputText value="#{inqHistVar.inquiryDate}" >
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
	
				<p:column headerText="#{lbl['lbl.sm.enquiry.respond.date']}" style="width : 15%">
					<h:outputText value="#{inqHistVar.responseDate}" >
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
	
				<p:column headerText="#{lbl['lbl.sm.enquiry.po.inquiry']}" style="width : 35%;white-space : normal;word-break: break-all">
					<h:outputText value="#{inqHistVar.inquiryText}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.enquiry.supplier.respond']}" style="width : 35%;white-space : normal">
					<h:outputText value="#{inqHistVar.responseText}" />
				</p:column>
				
				<!-- #14530 - add action column -->
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink 
					action="#{backingBean.POinquiryRowSelect(inqHistVar)}"
					process="@this"
					update=":#{p:component('inquiryDetails')}"
					oncomplete="inquiryDtls.show();">
					<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.sm.view']}" />
					</p:commandLink>
				</p:column>
				
			</p:dataTable>
	</p:panel>
	
</ui:composition>
