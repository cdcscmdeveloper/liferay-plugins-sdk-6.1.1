<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_supplierDataMaintenance_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.supp.data.maintenance']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<ui:param name="viewSuppProfileBackingBean" value="#{changeApplicationFlowBackingBean}" />
		
		<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false"/>
		
		<p:panel header="#{lbl['lbl.sm.search.supprofile']}" toggleable="true" id="searchSupplierProfilePanelId" >
			<table style="width: 100%">
				
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.supplier.zone']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu label="#{lbl['lbl.pm.supplier.zone']}" required="true"
							id="zoneId" value="#{viewSuppProfileBackingBean.managedBean.searchPmZoneId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{viewSuppProfileBackingBean.managedBean.zoneList}" var="zone"
								itemLabel="#{zone.zoneName}"
								itemValue="#{zone.zoneId}" /></p:selectOneMenu>
						<p:message id="zoneIdMsg" for="zoneId" display="icon" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu required="true" id="searchSuppTypeId" label="#{lbl['lbl.rpt.supplierType']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSuppType}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}" itemValue="K" />
							<f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}" itemValue="J" />
						</p:selectOneMenu>
						<p:message id="searchSuppTypeIdMsg" for="searchSuppTypeId" display="icon" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.mofno']}" /></td>
					<td>
						<p:inputText id="mofNoId"
							label="#{lbl['lbl.sm.mofno']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchMofNo}"
							size="35" maxlength="14" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.epno']}" /></td>
					<td>
						<p:inputText id="epNoId"
							label="#{lbl['lbl.sm.epno']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchMofNo}"
							size="35" maxlength="14" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.companyname']}" /></td>
					<td>
						<p:inputText id="companyNameId"
							label="#{lbl['lbl.sm.companyname']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.companyName}"
							size="40" maxlength="100" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.rocNo']}" /></td>
					<td>
						<p:inputText id="regNoId"
							label="#{lbl['lbl.sm.rocNo']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchSupplier.regNo}"
							size="35" maxlength="20" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.applicationtype']}" /></td>
					<td><p:selectOneMenu id="searchApplTypeId" label="#{lbl['lbl.sm.applicationtype']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchApplType}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems value="#{viewSuppProfileBackingBean.managedBean.applTypeItems}" />
						</p:selectOneMenu>
						<p:message id="searchApplTypeIdMsg" for="searchApplTypeId" display="icon" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.application.no']}" /></td>
					<td>
						<p:inputText id="applNoId"
							label="#{lbl['lbl.sm.application.no']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchApplNo}"
							size="35" maxlength="20" />
						<p:message id="applNoIdMsg" for="applNoId" display="icon" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.applicationstatus']}" /></td>
					<td><p:selectOneMenu id="searchApplStatusId" label="#{lbl['lbl.sm.applicationstatus']}"
							value="#{viewSuppProfileBackingBean.managedBean.searchApplStatusId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems value="#{viewSuppProfileBackingBean.managedBean.applStatusItems}" />
						</p:selectOneMenu>
						<p:message id="searchApplStatusIdMsg" for="searchApplStatusId" display="icon" />
					</td>
				</tr>
			
				<tr>
					<td colspan="2">
						<div style="text-align: right;">
							<p:commandButton value="#{lbl['lbl.btn.search']}" 
								action="#{viewSuppProfileBackingBean.managedBean.searchSupplier}"
								update="@form" 
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
							</p:commandButton>
							<p:commandButton value="#{lbl['lbl.btn.reset']}" 
								action="#{viewSuppProfileBackingBean.resetSearch}"
								update="searchSupplierProfilePanelId">
							</p:commandButton>
						</div>
					</td>
				</tr>
			</table>
		</p:panel>
		
		<p:panel header="#{lbl['lbl.sm.results']}" toggleable="true" id="resultSupplierProfilePanelId">
			
			<p:dataTable var="smAppl" widgetVar="smApplWidgetVar"
				editable="false" lazy="true" rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{viewSuppProfileBackingBean.managedBean.smSupplierDataModel}"
				rowKey="#{smAppl}" rowIndexVar="index" id="changeApplFlowDtId">
				<ac:paginator for="changeApplFlowDtId" />
				
				<p:column headerText="#{lbl['lbl.rpt.supplierType']}">
					<h:outputText value="#{lbl['lbl.sm.contractor']}" rendered="#{smAppl[2] eq 'K'}"/>
					<h:outputText value="#{lbl['lbl.sm.consultant']}" rendered="#{smAppl[2] eq 'J'}"/>
					<h:outputText value="#{lbl['lbl.sm.basic']}" rendered="#{smAppl[2] ne 'K' and smAppl[2] ne 'J'}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.companyname']}" style="width :25%;white-space : normal" 
					rendered="#{!viewSuppProfileBackingBean.managedBean.supplierUser}">
					<h:outputText value="#{smAppl[3]}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.mofno']}">
					<h:outputText value="#{smAppl[8]}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.epno']}">
					<h:outputText value="#{smAppl[9]}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.application.no']}">
					<h:outputText value="#{smAppl[0]}" rendered="#{not empty smAppl[0]}"/>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty smAppl[0]}"/>
				</p:column>
		
				<p:column headerText="#{lbl['lbl.sm.applicationtype']}" style="width :25%;white-space : normal">
					<h:outputText value="#{lbl['lbl.sm.appltype.basic']}" rendered="#{smAppl[1] eq 'O'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.newmof']}" rendered="#{smAppl[1] eq 'N'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.bumiputera']}" rendered="#{smAppl[1] eq 'B'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.categorycode']}" rendered="#{smAppl[1] eq 'A'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.updateprofile']}" rendered="#{smAppl[1] eq 'U'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.cancelmof']}" rendered="#{smAppl[1] eq 'C'}" />
					<h:outputText value="#{lbl['lbl.sm.appltype.renewmof']}" rendered="#{smAppl[1] eq 'R'}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.applicationstatus']}">
					<h:outputText value="#{smAppl[6]}" rendered="#{not empty smAppl[6]}"/>
					<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty smAppl[6]}"/>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sm.label.action']}" style="text-align: center  !important;">
					<p:commandLink onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						action="#{viewSuppProfileBackingBean.navigateToChangeApplicationFlow(smAppl[10])}"
						process="@this" partialSubmit="true" update="@form"
						style="padding-right:5px;">
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
					</p:commandLink>
				</p:column>
				
			</p:dataTable>
			
		</p:panel>
	</ui:define>
</ui:composition>
