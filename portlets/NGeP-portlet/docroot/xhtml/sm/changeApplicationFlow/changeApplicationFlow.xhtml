<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		<script>
			$('#portlet_smCancelMofBySupplier_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.change.appl.flow']}");
		</script>
	</ui:define>


	<ui:define name="contentSection">
		<ui:param name="backingBean" value="#{changeApplicationFlowBackingBean}" />
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.back']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
						action="#{backingBean.backToSearchApplFlow}" update="@this" process="@this"/>
				</td>
				<td style="white-space: nowrap; float: right;">
				    <p:commandButton value="#{lbl['lbl.btn.submit']}" 
				    	style="float:right;" id="submitBtnId" update="@form"
				    	disabled="#{backingBean.managedBean.smAppl.pmStatus.statusId eq backingBean.managedBean.selectedStatusId}"
				    	onstart="blockWidget.show()" oncomplete="blockWidget.hide()" action="#{backingBean.showConfirmDialog()}"/>
				</td>
			</tr>
		</table>

		<ui:include src="/xhtml/sm/approverDecisionPages/approverCompanyInfo.xhtml" />
		<ui:include src="/xhtml/sm/approverDecisionPages/approverContactInfo.xhtml" />
		
		<p:panel header="#{lbl['lbl.sm.change.appl.flow.supp.appl.status']}" toggleable="true"
			id="suppApplStatusPanelId">
	
			<table style="width: 100%; table-layout: fixed">
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.applicationtype']}" /></td>
					<td>
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.appltype.basic']}" 
							rendered="#{backingBean.managedBean.smAppl.applType eq 'O'}" />
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.appltype.newmof']}" 
							rendered="#{backingBean.managedBean.smAppl.applType eq 'N'}" />
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.appltype.bumiputera']}" 
							rendered="#{backingBean.managedBean.smAppl.applType eq 'B'}" />
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.appltype.categorycode']}" 
							rendered="#{backingBean.managedBean.smAppl.applType eq 'A'}" />
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.appltype.updateprofile']}" 
							rendered="#{backingBean.managedBean.smAppl.applType eq 'U'}" />
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.appltype.cancelmof']}" 
							rendered="#{backingBean.managedBean.smAppl.applType eq 'C'}" />
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.appltype.renewmof']}" 
							rendered="#{backingBean.managedBean.smAppl.applType eq 'R'}" />
					</td>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.application.no']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{backingBean.managedBean.smAppl.applNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.change.appl.flow.curr.status']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view"
							value="#{backingBean.managedBean.currStatusName}" /></td>
					<td>
						<p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.change.appl.flow.new.status']}" style="vertical-align: baseline;"/> 
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td>
						<p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							id="newStatusId" required="true"
							label="#{lbl['lbl.sm.change.appl.flow.new.status']}"
							value="#{backingBean.managedBean.selectedStatusId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="status" value="#{backingBean.managedBean.statusItems}" />
							<p:ajax event="change" process="@this" update="@([id$=submitBtnId])"/>
						</p:selectOneMenu>
						<p:message id="newStatusIdMsg" for="newStatusId"
							showSummary="true" showDetail="false" display="icon" />
					</td>
				</tr>
			</table>
	
		</p:panel>
		
		<p:confirmDialog id="confirmDialog" closable="true"
			message="#{lbl['lbl.sm.change.appl.flow.confirmation.msg']}"
			header="#{lbl['lbl.sm.change.appl.flow.confirmation.header']}" severity="alert"
			widgetVar="confirmDialog">
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDialog.hide();" 
					action="#{backingBean.submitChangeApplicationFlow}" update="@form" process="@this"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDialog.hide();" />
			</div>
		</p:confirmDialog>


	</ui:define>
</ui:composition>
