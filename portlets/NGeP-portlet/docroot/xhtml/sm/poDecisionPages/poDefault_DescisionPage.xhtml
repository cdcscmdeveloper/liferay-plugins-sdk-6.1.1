<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForMof}">
					<ui:include
						src="/xhtml/sm/NewMofApplication/smMofApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForBumi}">
					<ui:include
						src="/xhtml/sm/bumiPuteraApplication/smBumiApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
					<ui:include
						src="/xhtml/sm/renewMofApplication/smRenewApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForApplcatcodes}">
					<ui:include
						src="/xhtml/sm/addAdditionalCategoryCodes/smAddtnlCatApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForUpdate}">
					<ui:include
						src="/xhtml/sm/updateMofDetails/smUpdateMofApplnSideMenuItem.xhtml" />
				</c:if></td>
			<td><h:inputHidden
					value="#{backingBean.managedBean.smAppl.applCategoryType}" />
				<div style="width: 100%" align="right">

					<p:commandButton value="Approve" update=":form:tt:approveDialog"
						action="#{backingBean.assignFinalApproveOrReject('approveDialog')}" />
					<p:commandButton value="Reject" update=":form:tt:rejectDialog"
						action="#{backingBean.assignFinalApproveOrReject('rejectDialog')}" />
					<c:if test="#{backingBean.managedBean.smAppl.applType ne 'C'}">
						<p:commandButton value="Recommend To Approve"
							action="#{backingBean.submitPOEscalationToApprover('APPROVE')}" />
					</c:if>
					<c:if test="#{backingBean.managedBean.smAppl.applType ne 'C'}">
						<p:commandButton value="Recommend To Reject"
							action="#{backingBean.submitPOEscalationToApprover('REJECT')}" />
					</c:if>
					<c:if test="#{backingBean.managedBean.smAppl.applType ne 'C'}">
						<p:commandButton value="Recommend Site Visit"
							onclick="svcDialog.show();" />
					</c:if>
					<c:if test="#{backingBean.managedBean.smAppl.applType ne 'C'}">
						<p:commandButton value="Send Inquiry"
							action="#{backingBean.assignMissingDocsList}"
							update=":form:tt:sendInqDialog" />
					</c:if>
				</div> <p:panel header="PO Decision">
					<table>

						<tr>
							<td><p:outputLabel value="Supplier Name" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputText readonly="true" size="50"
									value="#{backingBean.managedBean.smAppl.smCompanyBasic.companyName}"
									disabled="true" /></td>

						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.dateSubmitted']}" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputText readonly="true" size="50"
									value="#{backingBean.managedBean.smAppl.applSubmitDate}"
									disabled="true">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</p:inputText></td>

						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.status']}" /></td>
							<td><p:outputLabel value="   : " /></td>
							<td><p:inputText readonly="true" size="50"
									value="#{backingBean.managedBean.currentStatus}"
									disabled="true" /></td>

						</tr>
						<tr>
							<c:if test="#{backingBean.managedBean.smAppl.applType eq 'C'}">
								<td><p:outputLabel value="Remarks for Cancellation" /></td>
								<td><p:outputLabel value="   : " /></td>
								<td><p:inputTextarea readonly="true" cols="60"
										value="#{backingBean.managedBean.supplierRemarks}"
										disabled="true" /></td>
							</c:if>
						</tr>
					</table>
					<table style="width: 100%">
						<tr>
							<td><c:choose>
									<c:when
										test="#{backingBean.managedBean.personCalc.halfBumiStatus and backingBean.managedBean.smAppl.applType ne 'C'}">
										<p:outputLabel
											value="#{lbl['lbl.sm.recommendation.halfBumi']}"
											style="color: green;font-weight: bold;float:left;" />
									</c:when>
									<c:when
										test="#{backingBean.managedBean.personCalc.fullBumiStatus and backingBean.managedBean.smAppl.applType ne 'C'}">
										<p:outputLabel
											value="#{lbl['lbl.sm.recommendation.fullBumi']}"
											style="color: green;font-weight: bold;float:left;" />
									</c:when>
									<c:otherwise>
										<p:outputLabel value="#{lbl['lbl.sm.recommendation.noBumi']}"
											style="color: green;font-weight: bold;float:left;" />
									</c:otherwise>
								</c:choose></td>
						</tr>

					</table>

					<p:separator />
					<div>
						<p:outputLabel value="#{lbl['lbl.sm.po.splNotes']}"
							style="float :left;" escape="false" />
					</div>
					<!-- <div align="center">
			<p:splitButton value=" Select Decision ">
				<p:menuitem value="Approve" onclick="approveDialog.show();" />
				<p:menuitem value="Reject" onclick="rejectDialog.show();" />
				<p:menuitem value="Submit To Approver"
					onclick="submitApprvrDialog.show();" />
				<p:menuitem value="Recommend Site Visit" onclick="svcDialog.show();" />
				<p:menuitem value="Send Enquiry" />
			</p:splitButton>
		</div> -->

				</p:panel></td>
		</tr>
	</table>

	<p:dialog width="1050px" header="Send Inquiry" id="sendInqDialog"
		widgetVar="sendInqDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true" closable="false">

		<ui:include
			src="/xhtml/sm/shared/mofSdoSharedPages/sdoSendEnquiry.xhtml" />
		<div align="right">
			<p:commandButton value="Submit Inquiry"
				disabled="#{backingBean.managedBean.missinDocs.size() == 0}"
				oncomplete="sendInqDialog.hide();"
				action="#{backingBean.submitPOorApproverReviewToBPM('INQUIRY')}" />
			<p:commandButton value="Cancel" onclick="sendInqDialog.hide();" />
		</div>
	</p:dialog>
	<p:dialog width="900px" height="450px" header="Assign Site Visit"
		widgetVar="svcDialog" resizable="false" showEffect="fade"
		hideEffect="fade" modal="true">

		<ui:include
			src="/xhtml/sm/shared/poDecisionSharedPages/assignToSvcForm.xhtml" />

	</p:dialog>
	<p:dialog width="650px" header="Submit To Approver" closable="false"
		id="submitApprvrDialog" widgetVar="submitApprvrDialog"
		resizable="false" showEffect="fade" hideEffect="fade" modal="true">

		<ui:include
			src="/xhtml/sm/shared/poDecisionSharedPages/submitToApproverForm.xhtml" />
		<div align="right">
			<p:commandButton value="Submit"
				oncomplete="submitApprvrDialog.hide();"
				action="#{backingBean.submitPOorApproverReviewToBPM('ESCALATE')}" />
			<p:commandButton value="Cancel"
				action="#{backingBean.cancelPOEscalationToApprover}" />
		</div>
	</p:dialog>
	<p:dialog width="750px" header="Approve Application" closable="false"
		id="approveDialog" widgetVar="approveDialog" resizable="false"
		showEffect="fade" hideEffect="fade" modal="true">

		<ui:include
			src="/xhtml/sm/shared/poDecisionSharedPages/approvedRemarksPopUpForm.xhtml" />
		<div align="right">
			<p:commandButton value="Submit" update="@([id$=Msg])"
				action="#{backingBean.finalDecisionApproveOrRejectAppln('approveDialog','APPROVE')}"
				partialSubmit="true" process="approveDialog" />
			<p:commandButton value="Cancel"
				action="#{backingBean.cancelFinalApproveOrReject('approveDialog')}"
				partialSubmit="true" process="@this" />
		</div>
	</p:dialog>
	<p:dialog width="850px" header="Reject Application" closable="false"
		id="rejectDialog" widgetVar="rejectDialog" resizable="false"
		showEffect="fade" hideEffect="fade" modal="true">

		<ui:include
			src="/xhtml/sm/shared/poDecisionSharedPages/rejectedRemarksPopUpForm.xhtml" />
		<div align="right">
			<p:commandButton value="Submit" partialSubmit="true"
				process="rejectDialog" update="@([id$=Msg])"
				action="#{backingBean.finalDecisionApproveOrRejectAppln('rejectDialog','REJECT')}" />
			<p:commandButton value="Cancel"
				action="#{backingBean.cancelFinalApproveOrReject('rejectDialog')}"
				partialSubmit="true" process="@this" />
		</div>
	</p:dialog>
</ui:composition>
