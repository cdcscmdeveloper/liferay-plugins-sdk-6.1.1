<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%">
		<tr>
			<td style="width: 20%; vertical-align: baseline;" class="sidemenutd"><c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForMof}">
					<ui:include
						src="/xhtml/sm/NewMofApplication/smMofApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForBumi}">
					<ui:include
						src="/xhtml/sm/bumiPuteraApplication/smBumiApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew}">
					<ui:include
						src="/xhtml/sm/renewMofApplication/smRenewApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForApplcatcodes}">
					<ui:include
						src="/xhtml/sm/addAdditionalCategoryCodes/smAddtnlCatApplnSideMenuItem.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForUpdate}">
					<ui:include
						src="/xhtml/sm/updateMofDetails/smUpdateMofApplnSideMenuItem.xhtml" />
				</c:if></td>

			<td><br /> <p:panel>
					<p:outputLabel value="#{lbl['lbl.sm.suppDoc.reviewNote']}"
						style="float :left" escape="false" />
				</p:panel> <h:inputHidden
					value="#{backingBean.managedBean.smAppl.applCategoryType}" /> <c:if
					test="#{backingBean.managedBean.smAppl.supportingDocMode == 'F'}">
					<ui:include
						src="/xhtml/sm/shared/mofSdoSharedPages/offlineSupportingDocsForm.xhtml" />
				</c:if> <c:if
					test="#{backingBean.managedBean.smAppl.supportingDocMode == 'O'}">
					<ui:include
						src="/xhtml/sm/shared/mofSdoSharedPages/onlineSupportingDocsForm.xhtml" />
				</c:if> <c:choose>
					<c:when
						test="#{backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForMof or backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForRenew or backingBean.managedBean.smAppl.applType eq ParameterConst.newSmApplnForApplcatcodes}">
						<c:choose>
							<c:when
								test="#{backingBean.managedBean.smAppl.applCategoryType eq 'S'}">

								<table style="width: 100%">
									<tr>
										<td><div align="left" style="width: 100%">
												<p:commandButton value="#{lbl['lbl.sm.prev']}"
													actionListener="#{backingBean.assignReviewSupportingNav('prev')}"
													icon="ui-icon-prev"
													action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_EQUIP)}"
													update=":form" />
											</div></td>
										<td><div align="right" style="width: 100%">
												<p:commandButton value="#{lbl['lbl.sm.next']}"
													icon="ui-icon-next" iconPos="right"
													actionListener="#{backingBean.assignReviewSupportingNav('next')}"
													action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_PODEC)}"
													update=":form" />
											</div></td>
									</tr>
								</table>
							</c:when>
							<c:otherwise>
								<table style="width: 100%">
									<tr>
										<td><div align="left" style="width: 100%">
												<p:commandButton value="#{lbl['lbl.sm.prev']}"
													actionListener="#{backingBean.assignReviewSupportingNav('prev')}"
													icon="ui-icon-prev"
													action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_CATEGORY)}"
													update=":form" />
											</div></td>
										<td><div align="right" style="width: 100%">
												<p:commandButton value="#{lbl['lbl.sm.next']}"
													icon="ui-icon-next" iconPos="right"
													actionListener="#{backingBean.assignReviewSupportingNav('next')}"
													action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_PODEC)}"
													update=":form" />
											</div></td>
									</tr>
								</table>
							</c:otherwise>
						</c:choose>
					</c:when>
					<c:otherwise>
						<table style="width: 100%">
							<tr>
								<td><div align="left" style="width: 100%">
										<p:commandButton value="#{lbl['lbl.sm.prev']}"
											actionListener="#{backingBean.assignReviewSupportingNav('prev')}"
											icon="ui-icon-prev"
											action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_BANK)}"
											update=":form" />
									</div></td>
								<td><div align="right" style="width: 100%">
										<p:commandButton value="#{lbl['lbl.sm.next']}"
											icon="ui-icon-next" iconPos="right"
											actionListener="#{backingBean.assignReviewSupportingNav('next')}"
											action="#{backingBean.updateSmAppl(backingBean.managedBean.smAppl.applType,SupplierManagementConst.SM_APPL_PAGE_TYPE_SUPPORTDOCS,SupplierManagementConst.SM_APPL_PAGE_TYPE_PODEC)}"
											update=":form" />
									</div></td>
							</tr>
						</table>
					</c:otherwise>
				</c:choose></td>
		</tr>
	</table>
</ui:composition>
