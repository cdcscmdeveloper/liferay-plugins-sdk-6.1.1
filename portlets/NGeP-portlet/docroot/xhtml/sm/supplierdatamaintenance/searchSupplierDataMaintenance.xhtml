<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script>
			$('#portlet_supplierDataMaintenance_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.sm.supp.data.maintenance']}");
		</script>
	</ui:define>
	
	<ui:define name="contentSection">
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<ui:param name="viewSuppProfileBackingBean" value="#{supplierDataMaintenanceBackingBean}" />
		<ui:param name="viewSmApplBackingBean" value="#{supplierDataMaintenanceBackingBean}" />
		
		<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false"/>
		
		<p:outputPanel id="dataMainTenanceMainId">
		
			<p:panel header="#{lbl['lbl.sm.search.supprofile']}" toggleable="true" id="searchSupplierProfilePanelId" 
				rendered="#{supplierDataMaintenanceBackingBean.managedBean.displaySearchPage}">
				<ui:include src="/xhtml/sm/shared/applViewOnlyPages/supplierApplicationSearchCriteria.xhtml" />
			</p:panel>
			
			<p:panel header="#{lbl['lbl.sm.results']}" toggleable="true" id="resultSupplierProfilePanelId" 
				rendered="#{supplierDataMaintenanceBackingBean.managedBean.displaySearchPage}">
			
				<p:dataTable var="smSupplier" widgetVar="smApplWidgetVar"
					editable="false" lazy="true" rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{supplierDataMaintenanceBackingBean.managedBean.smSupplierDataModel}"
					selection="#{supplierDataMaintenanceBackingBean.managedBean.selectedSupplier}"
					rowKey="#{smSupplier}" rowIndexVar="index" id="supplierApplHistoryDtId">
					<ac:paginator for="supplierApplHistoryDtId" />
					
					<p:column headerText="#{lbl['lbl.sm.companyname']}" style="width :25%;white-space : normal"
						rendered="#{!supplierDataMaintenanceBackingBean.managedBean.supplierUser}">
						<h:outputText value="#{smSupplier.companyName}" />
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sm.application.no']}">
						<h:outputText value="#{smSupplier.smAppl.applNo}" />
					</p:column>
		
					<p:column headerText="#{lbl['lbl.sm.applicationtype']}" style="width :25%;white-space : normal">
						<h:outputText value="#{lbl['lbl.sm.appltype.newmof']}" rendered="#{smSupplier.smAppl.applType eq 'N'}" />
						<h:outputText value="#{lbl['lbl.sm.appltype.bumiputera']}" rendered="#{smSupplier.smAppl.applType eq 'B'}" />
						<h:outputText value="#{lbl['lbl.sm.appltype.categorycode']}" rendered="#{smSupplier.smAppl.applType eq 'A'}" />
						<h:outputText value="#{lbl['lbl.sm.appltype.updateprofile']}" rendered="#{smSupplier.smAppl.applType eq 'U'}" />
						<h:outputText value="#{lbl['lbl.sm.appltype.cancelmof']}" rendered="#{smSupplier.smAppl.applType eq 'C'}" />
						<h:outputText value="#{lbl['lbl.sm.appltype.renewmof']}" rendered="#{smSupplier.smAppl.applType eq 'R'}" />
					</p:column>
					
					<p:column headerText="#{lbl['lbl.rpt.supplierType']}">
						<h:outputText value="#{lbl['lbl.sm.contractor']}" rendered="#{smSupplier.smAppl.supplierType eq 'K'}"/>
						<h:outputText value="#{lbl['lbl.sm.consultant']}" rendered="#{smSupplier.smAppl.supplierType eq 'J'}"/>
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sm.regStatus']}">
						<h:outputText value="#{smSupplier.smAppl.pmRegStatus.pmStatus.pmStatusDescs[0].statusName}" rendered="#{not empty smSupplier.smAppl.pmRegStatus}"/>
						<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty smSupplier.smAppl.pmRegStatus}"/>
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sm.label.action']}">
						<p:commandLink onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()"
							action="#{supplierDataMaintenanceBackingBean.navigateToMaintenance(smSupplier.smAppl)}"
							process="@this" partialSubmit="true" update="@form"
							style="padding-right:5px;">
							<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" />
						</p:commandLink>
					</p:column>
					
				</p:dataTable>
				
			</p:panel>
			
			<p:outputPanel rendered="#{!supplierDataMaintenanceBackingBean.managedBean.displaySearchPage}">
			
				<ui:include src="/xhtml/sm/shared/supplierDataMaintenance/approvalInfoHeaderPage.xhtml" />
				
				<table style="width: 100%;">
					<tr>
						<td>
							<p:commandButton value="#{lbl['lbl.btn.back']}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
								action="#{supplierDataMaintenanceBackingBean.backToSearchSupplierMaintenance}" update="@form" process="@this"/>
						</td>
						<td style="white-space: nowrap; float: right;">
						    <p:commandButton value="#{lbl['lbl.btn.submit']}" style="float:right;" id="submitBtnId" update="@form"
						    	onstart="blockWidget.show()" oncomplete="blockWidget.hide()" action="#{supplierDataMaintenanceBackingBean.showConfirmDialog}" 
						    	disabled="#{!supplierDataMaintenanceBackingBean.managedBean.allowedToDoMaintenance}"/>
						</td>
					</tr>
				</table>
				
				<br /><h:outputText styleClass="instruction" value="#{lbl['lbl.sm.supp.data.maintenance.instruction.disallowed']}" /><br />
				
				<ui:include src="/xhtml/sm/shared/supplierDataMaintenance/supplierInfoMaintenance.xhtml" />
				<ui:include src="/xhtml/sm/shared/applViewOnlyPages/companyBasicInfoFormViewOnly.xhtml" />
				<ui:include src="/xhtml/sm/shared/supplierDataMaintenance/regCatCodesMaintenance.xhtml" />
				
				<p:dialog id="confirmDialog" header="#{lbl['lbl.sm.userprofile.confirmation']}"
					widgetVar="confirmDialog" modal="true" width="500px" height="100px">
					<p:panel id="dPanel" style="border: none;">
						<table style="width: 100%">
							<tr>
								<td style="white-space: nowrap;"><p:outputLabel value="#{lbl['lbl.sm.supp.data.maintenance.submitoconfirm.msg']}" style="float:left"/></td>
							</tr>
						</table>
					</p:panel>
					<div align="right">
						<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDialog.hide();" 
							action="#{supplierDataMaintenanceBackingBean.submitSupplierDataMaintenance}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form" />
						<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDialog.hide();" />
					</div>
				</p:dialog>
			</p:outputPanel>
		
		</p:outputPanel>
	</ui:define>
</ui:composition>
