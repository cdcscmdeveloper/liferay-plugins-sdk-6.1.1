<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<h:panelGrid id="orgProfilePanel" border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<p:outputLabel value="#{lbl['lbl.pm.ta.org.type']}" /><p:outputLabel value="*" styleClass="mandatory" />
			</h:column>
			<h:column>
				<p:selectOneMenu 
					value="#{pmTrackingDiaryBackingBean.managedBean.organisationSearchBean.orgType.parameterId}"
					styleClass="ppDropDownWidthM" id="somOrgType" required="true"
					label="#{lbl['lbl.pm.ta.org.type.name']}">
						<p:ajax event="change" partialSubmit="true"
							listener="#{pmTrackingDiaryBackingBean.changeOrgType()}"
							process="@this" update="orgProfilePanel" />
					<f:selectItems
						value="#{pmTrackingDiaryBackingBean.getDropdownValuesBySearchBean(ParameterTypeConst.organisationTypes, pmTrackingDiaryBackingBean.orgTypeSearchBean)}" />
				</p:selectOneMenu>
			</h:column>
			<h:column>
				<p:outputLabel value="#{lbl['lbl.pm.ta.org.name']}"/><p:outputLabel value="*" styleClass="mandatory" />
			</h:column>
			<h:column>
			<p:inputText id="ministry" value="#{pmTrackingDiaryBackingBean.managedBean.organisationSearchBean.orgName}" size="55"  disabled = "#{pmTrackingDiaryBackingBean.managedBean.organisationSearchBean.orgType.parameterId == null}" required="true" label="#{lbl['lbl.pm.ta.org.name']}" />
	
		<!--	<ac:lov id="lovMinistry2" lovId="PM_ORG_PROFILE" size="55"
				   disabled = "#{pmTrackingDiaryBackingBean.managedBean.organisationSearchBean.orgType.parameterId == null or !pmTrackingDiaryBackingBean.managedBean.orgProfileRequired}"
					update="@this" required="true" label="#{lbl['lbl.pm.ta.org.name']}"
					headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
					value="#{pmTrackingDiaryBackingBean.managedBean.organisationSearchBean.orgProfile.pmOrgValidity.orgName}"
					saveObject="pmTrackingDiaryBackingBean.managedBean.organisationSearchBean.orgProfile"
					conditionField="#{pmTrackingDiaryBackingBean.constructConditionFields()}" />
					<p:message id="lovMinistryMsg" for="lovMinistry2" display="icon" />
					
					-->
			</h:column>
		</h:panelGrid>


		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.search']}"
				actionListener="#{pmTrackingDiaryBackingBean.searchUserOrgProfile}" partialSubmit="true" process="orgProfilePanel @this" update=":form:dtOrgProfileResult"/>
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				action="#{pmTrackingDiaryBackingBean.resetOrganisationSearchBean}"
				update=":form" />
		</div>
		

</ui:composition>
