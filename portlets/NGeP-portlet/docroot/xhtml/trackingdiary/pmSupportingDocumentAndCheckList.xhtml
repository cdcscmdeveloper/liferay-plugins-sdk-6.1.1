<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
					<p:outputLabel value="#{lbl['lbl.pm.document.category']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
			</h:column>
			<h:column>	
					<p:selectOneMenu id="somDocCate" label="#{lbl['lbl.pm.document.category']}" styleClass="ppDropDownWidthM" required="true"  
						value="#{pmTrackingDiaryBackingBean.managedBean.supportDocSearchBean.docCategoryParamCode}" >
						<f:selectItems  value="#{pmTrackingDiaryBackingBean.documentCategoryOptions(false)}"/>
						<p:ajax event="change" update="pmDocSearchID" listener="#{pmTrackingDiaryBackingBean.docCategorySearchChange()}"/>
					</p:selectOneMenu>
			</h:column>
			<h:column>
					<p:outputLabel value="#{lbl['lbl.pm.document.name']}"/>
			</h:column>
			<h:column>
					<p:inputTextarea id="itaDocName" value="#{pmTrackingDiaryBackingBean.managedBean.supportDocSearchBean.docName}"
							label="#{lbl['lbl.pm.document.name']}" autoResize="false" />
           </h:column>
			<h:column rendered="#{ParameterConst.documentCategorySupplierDocument eq pmTrackingDiaryBackingBean.managedBean.supportDocSearchBean.docCategoryParamCode}">
					<p:outputLabel value="#{lbl['lbl.pm.supplier.zone']}"/>
			</h:column>
			<h:column rendered="#{ParameterConst.documentCategorySupplierDocument eq pmTrackingDiaryBackingBean.managedBean.supportDocSearchBean.docCategoryParamCode}">
					<p:selectOneMenu id="somSuppZone" styleClass="ppDropDownWidthM" label="#{lbl['lbl.pm.supplier.zone']}"
						value="#{pmTrackingDiaryBackingBean.managedBean.supportDocSearchBean.pmZone}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
						<f:selectItems  value="#{pmTrackingDiaryBackingBean.supplierZoneOptions()}"  
							var="zone" itemValue="#{zone.zoneId}" itemLabel="#{zone.zoneName}" />
					</p:selectOneMenu>
			</h:column>
		</h:panelGrid>


		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.search']}"
				action="#{pmTrackingDiaryBackingBean.searchSupportingDocument()}" partialSubmit="true" process="pmDocSearchID @this"
				update=":form:dtDocResult" />
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				action="#{pmTrackingDiaryBackingBean.resetDocSearchBean}"
				update="pmDocSearchID" />
		</div>


</ui:composition>
