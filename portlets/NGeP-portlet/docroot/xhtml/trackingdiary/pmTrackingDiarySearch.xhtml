<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="pmSearchID">
		<script>
			$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.cm.catalogue.search']}");
		</script>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<p:panel id="searchPanel" header="#{lbl['lbl.pm.search.search']}"
			toggleable="true">

			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
				columns="2" columnClasses="columnWidth20">

				<h:column>

					<p:outputLabel value="#{lbl['lbl.pm.tr.function']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</h:column>
				<h:column>
					<p:selectOneMenu id="searchFunctionType"
						value="#{pmTrackingDiaryBackingBean.managedBean.functionType}"
						style="width: 314px;">
						<f:selectItems
							value="#{pmTrackingDiaryBackingBean.getDropdownCodeValues(ParameterTypeConst.profileManagementFunctionType)}" />
						<p:ajax event="change"
							listener="#{pmTrackingDiaryBackingBean.onFunctionSelect()}"
							partialSubmit="true" process="@this" update="trackingSeachPanel, trackingSeachPanel2" />
					</p:selectOneMenu>
				</h:column>
			</h:panelGrid>
			<h:panelGroup id="trackingSeachPanel">

				<p:panel id="pmUserSearchID"
					rendered="#{pmTrackingDiaryBackingBean.managedBean.functionType == ParameterConst.userProfileParamCode}">
					<ui:include
						src="/xhtml/trackingdiary/pmUserProfileTrackingDiarySearch.xhtml" />
				</p:panel>
				<p:panel id="pmOrgSearchID"
					rendered="#{pmTrackingDiaryBackingBean.managedBean.functionType == ParameterConst.orgProfileParamCode}">
					<ui:include
						src="/xhtml/trackingdiary/pmOrgProfileTrackingDiarySearch.xhtml" />
				</p:panel>
			</h:panelGroup>
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.pm.search.result']}"
			toggleable="true">
			<h:panelGroup id="trackingSeachPanel2">

				<p:panel id="pmUserSearchResultID"
					rendered="#{pmTrackingDiaryBackingBean.managedBean.functionType == ParameterConst.userProfileParamCode}">
					<p:dataTable id="dtUserProfileResult"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						value="#{pmTrackingDiaryBackingBean.managedBean.userDataModel}"
						lazy="true" var="user" width="100%" rows="10">

						<ac:paginator for="dtUserProfileResult" />

						<p:column width="15%">
							<f:facet name="header">
								<h:outputText
									value="#{lbl['lbl.pm.profiles.userdetails.loginid']}" />
							</f:facet>
						#{user.loginId}
				</p:column>
						<p:column width="15%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.pm.profiles.userdetails.idno']}" />
							</f:facet>
					#{user.identificationNo}
				</p:column>
						<p:column width="15%">
							<f:facet name="header">
								<h:outputText
									value="#{lbl['lbl.pm.profiles.userdetails.username']}" />
							</f:facet>
				   	#{user.userName}
				</p:column>
						<p:column width="5%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.td.action']}" />
							</f:facet>
							<p:commandLink
								action="#{pmTrackingDiaryBackingBean.goToUserTrackingDiarySearch(user)}">
								<p:graphicImage value="/css/images/design/ico-view.png"
									title="#{lbl['lbl.ct.view']}" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</p:panel>
				<p:panel id="sysParamSearchResultID"
					rendered="#{pmTrackingDiaryBackingBean.managedBean.functionType == ParameterConst.systemParameterParamCode}">
					<p:panelGrid styleClass="tablePanel">
						<f:facet name="header">
							<p:row>
								<p:column width="80%">
							#{lbl['lbl.pm.ta.parameter.type']}
						</p:column>
								<p:column>
					#{lbl['lbl.td.action']}		
                        </p:column>
							</p:row>
						</f:facet>

						<p:row>
							<p:column width="80%">
								<h:outputText value="#{lbl['lbl.pm.settings.rule.config']}" />
							</p:column>
							<p:column>
								<p:commandLink
									action="#{pmTrackingDiaryBackingBean.goToRuleConfigTrackingDiarySearch()}">
									<p:graphicImage value="/css/images/design/ico-view.png"
										title="#{lbl['lbl.ct.view']}" />
								</p:commandLink>
							</p:column>
						</p:row>
						<p:row>
							<p:column width="80%">
								<h:outputText value="#{lbl['lbl.pm.settings.fee.setting']}" />
							</p:column>
							<p:column>
								<p:commandLink
									action="#{pmTrackingDiaryBackingBean.goToFeeSettTrackingDiarySearch()}">
									<p:graphicImage value="/css/images/design/ico-view.png"
										title="#{lbl['lbl.ct.view']}" />
								</p:commandLink>
							</p:column>
						</p:row>
						<p:row>
							<p:column width="80%">
								<h:outputText
									value="#{lbl['lbl.pm.settings.operational.threshold']}" />
							</p:column>
							<p:column>
								<p:commandLink
									action="#{pmTrackingDiaryBackingBean.goToThresholdTrackingDiarySearch()}">
									<p:graphicImage value="/css/images/design/ico-view.png"
										title="#{lbl['lbl.ct.view']}" />
								</p:commandLink>
							</p:column>
						</p:row>
					</p:panelGrid>

				</p:panel>
				<p:panel id="pmOrgSearchResultID"
					rendered="#{pmTrackingDiaryBackingBean.managedBean.functionType == ParameterConst.orgProfileParamCode}">
					<p:dataTable id="dtOrgProfileResult"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						value="#{pmTrackingDiaryBackingBean.managedBean.userOrgDataModel}"
						lazy="true" var="OrgProfile" width="100%" rows="10">

						<ac:paginator for="dtOrgProfileResult" />
						<p:column width="15%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.pm.ta.org.code']}" />
							</f:facet>
						#{OrgProfile.pmOrgValidity.orgCode}
				</p:column>
						<p:column width="15%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.pm.ta.org.name']}" />
							</f:facet>
				       	#{OrgProfile.pmOrgValidity.orgName}
				</p:column>
						<p:column width="5%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.td.action']}" />
							</f:facet>
							<p:commandLink
								action="#{pmTrackingDiaryBackingBean.goToOrgTrackingDiarySearch(OrgProfile)}">
								<p:graphicImage value="/css/images/design/ico-view.png"
									title="#{lbl['lbl.ct.view']}" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</p:panel>
			</h:panelGroup>
		</p:panel>
	</h:panelGroup>

</ui:composition>
