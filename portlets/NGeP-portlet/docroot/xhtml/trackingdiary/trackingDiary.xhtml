<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:dp="http://openam.com/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">
	</ui:define>
	<h:head>
		<h:outputStylesheet library="ep/css" name="ep.css" />
	</h:head>
	<ui:define name="contentSection">
		<p:panel id="trackingDiary" header="#{lbl['lbl.td.doc.trackingDiary']}" >
				<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" columnClasses="columnWidth20">
				
				<h:column>
					<h:outputLabel value="#{lbl['lbl.td.doc.trackingDiary.function']}" /><p:outputLabel
						value="*" styleClass="mandatory" />
				</h:column>
				<h:column>
					<p:selectOneMenu id="tdModulesDropdown" value="#{trackingDiaryBackingBean.managedBean.moduleSelected}">
						<f:selectItems value="#{trackingDiaryBackingBean.getModulesDropDown()}" />
			        	<p:ajax event="change" onstart="#{trackingDiaryBackingBean.onModuleSelect()}" partialSubmit="true" update="trackingDiary"/>
					</p:selectOneMenu>
				</h:column>
			</h:panelGrid>
					
			<h:panelGroup id="TrackingDiary">
				<c:if test="#{trackingDiaryBackingBean.managedBean.moduleSelected == 'SM'}">
					<ui:include src="/xhtml/trackingdiary/smTrackingDiarySearch.xhtml" />
				</c:if>
				<c:if test="#{trackingDiaryBackingBean.managedBean.moduleSelected == 'PP'}">
					<ui:include src="/xhtml/trackingdiary/ppTrackingDiarySearch.xhtml" />
				</c:if>
				<c:if test="#{trackingDiaryBackingBean.managedBean.moduleSelected == 'CT'}">
					<ui:include src="/xhtml/trackingdiary/ctTrackingDiarySearch.xhtml" />
				</c:if>
				<c:if test="#{trackingDiaryBackingBean.managedBean.moduleSelected == 'FL'}">
					<ui:include src="/xhtml/trackingdiary/flTrackingDiarySearch.xhtml" />
				</c:if>
				<c:if test="#{trackingDiaryBackingBean.managedBean.moduleSelected == 'CM'}">
					<ui:include src="/xhtml/trackingdiary/cmTrackingDiarySearch.xhtml" />
				</c:if>
				<c:if test="#{trackingDiaryBackingBean.managedBean.moduleSelected == 'SC'}">
					<ui:include src="/xhtml/trackingdiary/scTrackingDiarySearch.xhtml" />
				</c:if>
				<c:if test="#{trackingDiaryBackingBean.managedBean.moduleSelected == 'DP'}">
					<ui:include src="/xhtml/trackingdiary/dpTrackingDiarySearch.xhtml" />
				</c:if>
				<c:if test="#{trackingDiaryBackingBean.managedBean.moduleSelected == 'CD'}">
					<ui:include src="/xhtml/trackingdiary/cdTrackingDiarySearch.xhtml" />
				</c:if>
			</h:panelGroup>


			<br />
			<br />
		</p:panel>
	</ui:define>
</ui:composition>
