<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="ctSearchID">
	<script>
	$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.cm.catalogue.search']}"); 
	</script>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
	<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
	<p:panel id="pPlanSearch" header="#{lbl['lbl.pp.search.plan']}" toggleable="true">
		<br/>
		<table class="ppTwoTable">
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pp.plan.type']}" /></th>
					<td>
					<p:selectOneMenu id="somPlanType" label="#{lbl['lbl.pp.plan.type']}" 
						styleClass="ppDropDownWidthM"  value="#{ppTrackingDiaryBackingBean.managedBean.planSearchBean.planType.parameterId}"
						>
						<f:selectItems value="#{ppTrackingDiaryBackingBean.getDropdownValuesBySearchBean(ParameterTypeConst.planType, ppTrackingDiaryBackingBean.planTypeSearchBean)}" />
						<!-- <p:ajax event="change" listener="#{ppTrackingDiaryBackingBean.changePlanTypeSearch(ppTrackingDiaryBackingBean.managedBean.planSearchBean.planType.parameterId)}" 
							update="somVotSearch"/> -->
					</p:selectOneMenu>
					</td>
					<td></td>
				</tr>
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pp.plan.number']}" /></th>
					<td><p:inputText styleClass="ppDisplayTextM"
							value="#{ppTrackingDiaryBackingBean.managedBean.planSearchBean.planNumber}" />
					</td>
				</tr>
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pp.plan.year']}" /></th>
					<td><p:selectOneMenu label="#{lbl['lbl.pp.plan.year']}"
							styleClass="ppDropDownWidthM"
							value="#{ppTrackingDiaryBackingBean.managedBean.planSearchBean.year}">
							<f:selectItems
								value="#{ppTrackingDiaryBackingBean.getExistingPlanYearOptions()}" />
						</p:selectOneMenu></td>
					<th></th>
					<td></td>
				</tr>
				<tr>
					<td colspan="4">
						<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.search']}"
								action="#{ppTrackingDiaryBackingBean.search}"
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								update="resultPanel" />
							<p:commandButton value="#{lbl['lbl.btn.reset']}"
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								action="#{ppTrackingDiaryBackingBean.reset}" update=":form" />
						</div>
					</td>
				</tr>
			</table>
		<ac:lovPopup /> 	
	</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.cm.search.result']}" toggleable="true">
			<p:dataTable id="pPlanResult"
				emptyMessage="#{lbl['lbl.pp.no.record.found']}"
				styleClass="ppTablePlanItem" rows="10" rowIndexVar="rowIndex"
				lazy="true" var="plan"
				value="#{ppTrackingDiaryBackingBean.managedBean.ppDocumentDataModel}">
				<ac:paginator for="pPlanResult" />
				<p:column width="15%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.td.creation.date']}" />
					</f:facet>
					<ac:labelDateTime value="#{plan.createdDate}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.pp.type']}"> 
					<p:outputLabel 
					value="#{ppTrackingDiaryBackingBean.getParameterDesc(plan.planType)}" /> 
	        	</p:column>
				<p:column headerText="#{lbl['lbl.pp.plan.number']}">
					<p:outputLabel 
					value="#{plan.planNo}" />   
	        	</p:column>
				<p:column headerText="#{lbl['lbl.pp.plan.year']}">
					<p:outputLabel 
					value="#{plan.planYear}" />  
	        	</p:column>
				<p:column headerText="#{lbl['lbl.pm.status']}">
					<p:outputLabel 
					value="#{plan.status !=null ? ppTrackingDiaryBackingBean.getStatusDescById(plan.status.statusId) : ppTrackingDiaryBackingBean.getDefaultStatusDesc(plan.planType)}" />  
	        	</p:column>
				<p:column headerText="#{lbl['lbl.pm.action']}">
					<p:commandLink
						action="#{ppTrackingDiaryBackingBean.goToTrackingDiarySearch(plan)}">
						<p:graphicImage
							value="#{!plan.updatable ? '/css/images/design/document.png' : '/css/images/design/edit.png'}" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</p:panel>
	</h:panelGroup>		
</ui:composition>
