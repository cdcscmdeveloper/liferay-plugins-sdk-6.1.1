<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
		<style>
				.column-align-center {
				text-align: center !important;
				}
				
				.highlight-mark:before {
 					color: red;
 					content: "*";
				}
		</style>
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
						<table style="margin-top: 10px; width: 100%;">
							<tr>
								<td width="15%"><p:outputLabel
										value="Plan Title" /></td>
								<td width="35%"><p:inputText size="50"
										value="#{cmTrackingDiaryBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText></td>
							</tr>

							<tr>
								<td width="35%"><p:outputLabel
										value="Plan Type" /></td>
								<td width="65%"><p:inputText size="50"
										value="#{cmTrackingDiaryBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="Ministry" /></td>
								<td width="35%">					
									<p:selectOneMenu value="#{supplierReviewBackingBean.managedBean.qt.qtType}">
										<f:selectItems value="#{cmTrackingDiaryBackingBean.getDropdownCodeValues(PmCodeCatConst.yesNoFlag)}" />
									</p:selectOneMenu>
								</td>						
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="PTJ" /></td>
								<td width="35%">					
									<p:selectOneMenu value="#{supplierReviewBackingBean.managedBean.qt.qtType}">
										<f:selectItems value="#{cmTrackingDiaryBackingBean.getDropdownCodeValues(PmCodeCatConst.yesNoFlag)}" />
									</p:selectOneMenu>
								</td>						
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="Status" /></td>
								<td width="35%">					
									<p:selectOneMenu value="#{supplierReviewBackingBean.managedBean.qt.qtType}">
										<f:selectItems value="#{cmTrackingDiaryBackingBean.getDropdownCodeValues('CT')}" />
									</p:selectOneMenu>
								</td>						
							</tr>
							
						</table>

						<div style="text-align: right;">
							<p:commandButton icon="ui-icon-search" value="#{lbl['lbl.btn.search']}"
								action="#{cmTrackingDiaryBackingBean.search}"
								update="resultPanel">
							</p:commandButton>		
							<p:commandButton value="#{lbl['lbl.btn.reset']}" icon="ui-icon-reset"
								action="#{cmTrackingDiaryBackingBean.reset}"
								update="resultPanel">
							</p:commandButton>
						</div>
					</p:panel>
			
		<p:panel id="resultPanel" header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable id="supplierItemID" lazy="true" value="#{smTrackingDiaryBackingBean.searchDataModel}" var="smSupplier" width="100%" rows="10">

				<ac:paginator for="supplierItemID"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					Creation Date
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Plan No
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Plan Title
					</f:facet>
				#{smSupplier.regNo}
				</p:column>

				<p:column width="15%">
					<f:facet name="header">
					Plan Type
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Ministry
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					PTJ
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column>
					<f:facet name="header">
					Status
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column>
					<f:facet name="header">
					Action
					</f:facet>
					<p:commandLink action="#{smTrackingDiaryBackingBean.goToTrackingDiarySearch(smSupplier)}">
						#{smSupplier.regNo}
					</p:commandLink>
				</p:column>
			</p:dataTable>

			<div class="clear"></div>

		</p:panel>
			
	</ui:define>
</ui:composition>
