<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="ctSearchID">
	<script>
	$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.cm.catalogue.search']}"); 
	</script>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
			
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
						<table style="margin-top: 10px; width: 100%;">
							<tr>
								<td width="15%"><p:outputLabel
										value="#{lbl['lbl.td.plan.title']}" /></td>
								<td width="35%"><p:inputText size="50"
										value="#{ctTrackingDiaryBackingBean.managedBean.searchLoaNo}"></p:inputText></td>
							</tr>

							<tr>
								<td width="35%"><p:outputLabel
										value="#{lbl['lbl.td.plan.type']}" /></td>
								<td width="65%"><p:inputText size="50"
										value="#{ctTrackingDiaryBackingBean.managedBean.searchLoaNo}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="#{lbl['lbl.td.ministry']}" /></td>
								<td width="35%">					
									<p:selectOneMenu value="#{supplierReviewBackingBean.managedBean.qt.qtType}">
										<f:selectItems value="#{cmTrackingDiaryBackingBean.getDropdownCodeValues(PmCodeCatConst.yesNoFlag)}" />
									</p:selectOneMenu>
								</td>						
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="#{lbl['lbl.td.ptj']}" /></td>
								<td width="35%">					
									<p:selectOneMenu value="#{supplierReviewBackingBean.managedBean.qt.qtType}">
										<f:selectItems value="#{cmTrackingDiaryBackingBean.getDropdownCodeValues(PmCodeCatConst.yesNoFlag)}" />
									</p:selectOneMenu>
								</td>						
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="#{lbl['lbl.td.status']}" /></td>
								<td width="35%">					
									<p:selectOneMenu value="#{supplierReviewBackingBean.managedBean.qt.qtType}">
										<f:selectItems value="#{cmTrackingDiaryBackingBean.getDropdownCodeValues('CT')}" />
									</p:selectOneMenu>
								</td>						
							</tr>
							
						</table>
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{flTrackingDiaryBackingBean.search}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							update="resultPanel" />
						<p:commandButton value="#{lbl['lbl.btn.reset']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							action="#{flTrackingDiaryBackingBean.reset}" update=":form" />
					</div>
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable id="supplierItemID" lazy="true" value="#{smTrackingDiaryBackingBean.searchDataModel}" var="smSupplier" width="100%" rows="10">

				<ac:paginator for="supplierItemID"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.creation.date']}"/>
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.plan.number']}"/>
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.plan.title']}"/>
					</f:facet>
				#{smSupplier.regNo}
				</p:column>

				<p:column width="15%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.plan.type']}"/>
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.ministry']}"/>
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.ptj']}"/>
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column>
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.status']}"/>
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column width="5%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.action']}"/>
					</f:facet>
					<p:commandLink action="#{smTrackingDiaryBackingBean.goToTrackingDiarySearch(smSupplier)}">
						#{smSupplier.regNo}
					</p:commandLink>
				</p:column>
			</p:dataTable>

			<div class="clear"></div>

		</p:panel>
	
	</h:panelGroup>		

</ui:composition>
