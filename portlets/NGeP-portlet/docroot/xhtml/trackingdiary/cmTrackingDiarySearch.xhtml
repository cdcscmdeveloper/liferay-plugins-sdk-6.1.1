<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="cmUNSPSCsearchID">
	<script>
	$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.cm.catalogue.search']}"); 
	</script>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
			
		<p:panel style="width: 100%;" header="#{lbl['lbl.cm.define.search']}"
						toggleable="true" id="searchTabId">

						<table style="margin-top: 10px; width: 100%;">
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.cm.supplier.name']}" /></td>
								<td><p:inputText size="50"
										value="#{cmTrackingDiaryBackingBean.supplierNameFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="15%"><p:outputLabel
										value="#{lbl['lbl.cm.item.code']}" /></td>
								<td width="35%"><p:inputText size="50"
										value="#{cmTrackingDiaryBackingBean.itemCodeFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="15%"><p:outputLabel
										value="Item Name" /></td>
								<td width="35%%"><p:inputText size="50"
										value="#{cmTrackingDiaryBackingBean.itemNameFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="15%"><p:outputLabel
										value="#{lbl['lbl.fl.doc.maintain.circular.contract.duration']}" /></td>
								<td width="35%"><p:calendar mode="popup" showOn="button"
										readonlyInput="true"
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
										value="#{ctTrackingDiaryBackingBean.managedBean.searchContractFromDuration}">
									</p:calendar>
									<p:spacer width="5" />
									<p:calendar mode="popup" showOn="button"
										readonlyInput="true"
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
										value="#{ctTrackingDiaryBackingBean.managedBean.searchContractToDuration}">
									</p:calendar></td>
							</tr>
							<tr>
								<td width="15%"><p:outputLabel value="Status" /></td>
								<td width="35%"><p:selectOneMenu style="width: 314px;"
											value="#{ctTrackingDiaryBackingBean.managedBean.searchStatusId}">
											<f:selectItems
												value="#{ctTrackingDiaryBackingBean.searchStatusDesc()}" />
									</p:selectOneMenu></td>
							</tr>
						</table>

						<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.search']}"
								action="#{cmTrackingDiaryBackingBean.search}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
								icon="ui-icon-search" update="resultPanel" />
							<p:commandButton value="#{lbl['lbl.btn.reset']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
								action="#{cmTrackingDiaryBackingBean.reset}" icon="ui-icon-reset" update=":form" />
						</div>
						</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable id="supplierItemID" lazy="true"
				value="#{cmTrackingDiaryBackingBean.searchDataModel}" var="unspscObject"
				width="100%" rows="10">



				<ac:paginator for="supplierItemID"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					Creation Date
					</f:facet>
				#{unspscObject.createdDate}
				</p:column>

				<p:column width="15%">
					<f:facet name="header">
					#{lbl['lbl.cm.unspsc.code']}
				</f:facet>
				#{unspscObject.unspscCode}
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.cm.unspsc.title']}
				</f:facet>
				#{unspscObject.unspscTitle}
			</p:column>
			<p:column>
					<f:facet name="header">
					Action
				</f:facet>
					<p:commandLink
						action="#{cdTrackingDiaryBackingBean.goToTrackingDiarySearch(unspscObject)}">
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/resources/ep/images/design/document.png" />
					</p:commandLink>
			</p:column>
			</p:dataTable>


		</p:panel>


	</h:panelGroup>		

</ui:composition>
