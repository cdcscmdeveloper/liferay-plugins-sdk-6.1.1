<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<h:panelGroup id="smSearchID">
	<script>
	$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.cm.catalogue.search']}"); 
	</script>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
			
		<table style="width: 100%">
			<tr>
				<td><p:panel style="width: 100%;" header="#{lbl['lbl.cm.define.search']}" toggleable="true" id="searchTabId">

						<table style="margin-top: 10px; width: 100%;">
							<tr>
								<td width="25%"><p:outputLabel value="MOF Account No." /></td>
								<td width="25%"><p:inputText size="50" value="#{smTrackingDiaryBackingBean.managedBean.MOFAccountNo}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel value="Supplier Name" /></td>
								<td width="65%"><p:inputText size="50" value="#{smTrackingDiaryBackingBean.managedBean.supplierName}"></p:inputText></td>
							</tr>
							<tr>
								<td width="25%"><p:outputLabel value="Application No." /></td>
								<td width="25%"><p:inputText size="50" value="#{smTrackingDiaryBackingBean.managedBean.applicationNo}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel value="Application Type" /></td>
								<td width="35%">					
									<p:selectOneMenu size="50" value="#{smTrackingDiaryBackingBean.managedBean.applicationType}">
										<f:selectItems value="#{smTrackingDiaryBackingBean.getDropdownCodeValues('AT')}" />
									</p:selectOneMenu>
								</td>						
							</tr>
						</table>

						<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.search']}"
								action="#{smTrackingDiaryBackingBean.search}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
								icon="ui-icon-search" update="resultPanel" />
							<p:commandButton value="#{lbl['lbl.btn.reset']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
								action="#{smTrackingDiaryBackingBean.reset}" icon="ui-icon-reset" update=":form" />
						</div>
				</p:panel></td>
			</tr>
		</table>
			
		<p:panel id="resultPanel" header="#{lbl['lbl.fl.result']}" toggleable="true">


			<p:dataTable id="smSupplierTableID" lazy="true" value="#{smTrackingDiaryBackingBean.managedBean.smDocumentDataModel}" var="smSupplier" width="100%" rows="10">

				<ac:paginator for="smSupplierTableID"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					Creation Date
					</f:facet>
				#{smSupplier.createdDate}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Application No
					</f:facet>
				#{smSupplier.smAppl.applNo}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Application Type
					</f:facet>
				#{smSupplier.smAppl.applType}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					MOF Account No
					</f:facet>
				#{smSupplier.smAppl.applNo}
				</p:column>
				<p:column>
					<f:facet name="header">
					Company Name
					</f:facet>
				#{smSupplier.companyName}
				</p:column>
				<p:column>
					<f:facet name="header">
						Action
					</f:facet>
						<p:commandLink
							action="#{smTrackingDiaryBackingBean.goToTrackingDiarySearch(smSupplier)}">
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/resources/ep/images/design/document.png" />
						</p:commandLink>
				</p:column>
			</p:dataTable>

			<div class="clear"></div>

		</p:panel>
	</h:panelGroup>

</ui:composition>
