<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<h:panelGroup id="smSearchID">
	<script>
	$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.cm.catalogue.search']}"); 
	</script>

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
			
		<table style="width: 100%">
			<tr>
				<td><p:panel style="width: 100%;" header="#{lbl['lbl.cm.define.search']}" toggleable="true" id="searchTabId">

						<table style="margin-top: 10px; width: 100%;">
							<tr>
								<td width="25%"><p:outputLabel value="MOF Account No." /></td>
								<td width="25%"><p:inputText size="50" value="#{smTrackingDiaryBackingBean.MOFAccountFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel value="Supplier Name" /></td>
								<td width="65%"><p:inputText size="50" value="#{smTrackingDiaryBackingBean.supplierNameFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="25%"><p:outputLabel value="Application No." /></td>
								<td width="25%"><p:inputText size="50" value="#{smTrackingDiaryBackingBean.applicationNoFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel value="Application Type" /></td>
								<td width="35%">					
									<p:selectOneMenu size="50" value="#{smTrackingDiaryBackingBean.managedBean.applicationType}">
										<f:selectItems value="#{smTrackingDiaryBackingBean.getDropdownCodeValues('AT')}" />
									</p:selectOneMenu>
								</td>						
							</tr>
						</table>




						<div style="text-align: right;">
							<p:commandButton icon="ui-icon-search" value="#{lbl['lbl.btn.search']}"
								action="#{smTrackingDiaryBackingBean.search}"
								update="smSearchID">
							</p:commandButton>		
							<p:commandButton value="#{lbl['lbl.btn.reset']}" icon="ui-icon-reset"
								action="#{smTrackingDiaryBackingBean.reset}"
								update="smSearchID">
							</p:commandButton>
						</div>
					</p:panel></td>
			</tr>
		</table>
			
			
		<p:panel header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable id="smSupplierTableID" lazy="true" value="#{smTrackingDiaryBackingBean.searchDataModel}" var="smSupplier" width="100%" rows="10">

				<ac:paginator for="smSupplierTableID"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					Creation Date
					</f:facet>
				#{smSupplier.createdDate}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Business Reg. No.
					</f:facet>
				#{smSupplier.regNo}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Company Name
					</f:facet>
				#{smSupplier.companyName}
				</p:column>
				<p:column>
					<f:facet name="header">
					Registration Status
					</f:facet>
				#{smSupplier.smAppls}
				</p:column>
				<p:column>
						<f:facet name="header">
						Action
					</f:facet>
						<p:commandLink
							action="#{SMTrackingDiaryBackingBean.goToTrackingDiarySearch(smSupplier)}">
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/resources/ep/images/design/document.png" />
						</p:commandLink>
				</p:column>
			</p:dataTable>

			<div class="clear"></div>

		</p:panel>
	</h:panelGroup>


</ui:composition>
