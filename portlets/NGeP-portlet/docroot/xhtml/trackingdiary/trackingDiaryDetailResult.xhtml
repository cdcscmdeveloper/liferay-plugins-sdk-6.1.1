<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ac="http://ac.my/jsf/composite/cc">

			
		<p:panel header="#{lbl['lbl.cm.search.result']}" toggleable="true">R

			<p:dataTable id="unspscTableID" lazy="true" value="#{smTrackingDiaryBackingBean.searchDataModel}" var="unspsObj" width="100%" rows="10">

				<ac:paginator for="unspscTableID"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					Creation Timestamp
					</f:facet>
				#{pmtrackingDiary.actionedDate}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Actioned By
					</f:facet>
				#{pmtrackingDiary.actionedBy}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Role
					</f:facet>
				#{pmtrackingDiary.roleCode}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Document No.
					</f:facet>
				#{pmtrackingDiary.docId}
				</p:column>
				<p:column>
					<f:facet name="header">
					Description
					</f:facet>
				#{pmtrackingDiary.actionDesc}
				</p:column>
				<p:column>
					<f:facet name="header">
					Document Status
					</f:facet>
				#{pmtrackingDiary.statusId}
				</p:column>
				<p:column>
					<f:facet name="header">
					Action
					</f:facet>
					<p:commandLink action="#{trackingDiaryBackingBean.goToExtensionSearch(pmtrackingDiary)}">
						#{pmtrackingDiary.docId}
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<div class="clear"></div>

		</p:panel>			
		

</ui:composition>
