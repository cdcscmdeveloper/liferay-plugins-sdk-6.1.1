<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<p:outputLabel value="#{lbl['lbl.pm.ef.fname']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</h:column>
			<h:column>
				<p:inputText size="50" required="true" label="#{lbl['lbl.pm.ef.fname']}"
						value="#{pmTrackingDiaryBackingBean.managedBean.eduFieldName}"></p:inputText>
			</h:column>
			
		</h:panelGrid>


		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.search']}"
				action="#{pmTrackingDiaryBackingBean.searchEducationOfField()}" partialSubmit="true" process="pmEduSearchID @this"
				update=":form:dtEduResult" />
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				action="#{pmTrackingDiaryBackingBean.resetEduSearchBean}"
				update="pmEduSearchID" />
		</div>


</ui:composition>
