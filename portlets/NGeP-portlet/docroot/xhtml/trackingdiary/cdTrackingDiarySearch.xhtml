<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
		<style>
				.column-align-center {
				text-align: center !important;
				}
				
				.highlight-mark:before {
 					color: red;
 					content: "*";
				}
		</style>
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
						<table style="margin-top: 10px; width: 100%;">
							<tr>
								<td width="15%"><p:outputLabel
										value="UNSPSC Code" /></td>
								<td width="35%"><p:inputText size="50"
										value="#{cdTrackingDiaryBackingBean.codeFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="UNSPSC Title" /></td>
								<td width="65%"><p:inputText size="50"
										value="#{cdTrackingDiaryBackingBean.titleFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="Extension Code" /></td>
								<td width="65%"><p:inputText size="50"
										value="#{cdTrackingDiaryBackingBean.extensionCodeFilterBean.searchValue}"></p:inputText></td>
							</tr>
<!-- 							<tr> -->
<!-- 								<td width="35%"><p:outputLabel -->
<!-- 										value="Status" /></td> -->
<!-- 								<td width="35%"><p:selectOneMenu value="#{codificationBackingBean.managedBean.autoCompleteUnspscCode}"> -->
<!-- 										<f:selectItems value="#{cdTrackingDiaryBackingBean.getDropdownCodeValues('CT')}" /> -->
<!-- 									</p:selectOneMenu> -->
<!-- 								</td>						 -->
<!-- 							</tr> -->
						</table>
						<div style="text-align: right;">
							<p:commandButton value="#{lbl['lbl.cm.search']}" icon="ui-icon-search" action="#{cdTrackingDiaryBackingBean.unspscSearch}" update="resultPanel" >
								<f:param name="unspscCode" value="aaaaaaaaaaa" />
							</p:commandButton>
							<p:commandButton value="#{lbl['lbl.btn.reset']}" icon="ui-icon-reset" action="#{cdTrackingDiaryBackingBean.reset}" update="resultPanel">
							</p:commandButton>
						</div>
						</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable id="unspscTableID" lazy="true"
				value="#{cdTrackingDiaryBackingBean.searchDataModel}" var="unspscObject"
				width="100%" rows="10">



				<ac:paginator for="unspscTableID"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					Creation Date
					</f:facet>
				#{unspscObject.createdDate}
				</p:column>

				<p:column width="15%">
					<f:facet name="header">
					#{lbl['lbl.cm.unspsc.code']}
				</f:facet>
				#{unspscObject.unspscCode}
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.cm.unspsc.title']}
				</f:facet>
				#{unspscObject.unspscTitle}
			</p:column>
			<p:column>
					<f:facet name="header">
					Action
				</f:facet>
					<p:commandLink
						action="#{cdTrackingDiaryBackingBean.goToTrackingDiarySearch(unspscObject)}">
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/resources/ep/images/design/document.png" />
					</p:commandLink>
			</p:column>
			</p:dataTable>


		</p:panel>


	</ui:define>
</ui:composition>
