<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<p:outputLabel value="#{lbl['lbl.pm.ug.search.ptjname']}" /><p:outputLabel value="*" styleClass="mandatory" />
			</h:column>
			<h:column>
				<p:inputText size="50" required="true" label="#{lbl['lbl.pm.ug.search.ptjname']}"
						value="#{pmTrackingDiaryBackingBean.managedBean.userGroupSearchBean.ptjName}"></p:inputText>
			</h:column>
			<h:column>
				<p:outputLabel value="#{lbl['lbl.pm.ug.result.groupcode']}" />
			</h:column>
			<h:column>
				<p:inputText size="50"
						value="#{pmTrackingDiaryBackingBean.managedBean.userGroupSearchBean.groupCode}"></p:inputText>
			</h:column>
			<h:column>
				<p:outputLabel value="#{lbl['lbl.pm.ug.result.groupname']}" />
			</h:column>
			<h:column>
				<p:inputText size="50"
						value="#{pmTrackingDiaryBackingBean.managedBean.userGroupSearchBean.groupName}"></p:inputText>
			</h:column>
			
		</h:panelGrid>


		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.search']}"
				action="#{pmTrackingDiaryBackingBean.searchUserGroup()}" partialSubmit="true" process="pmUGSearchID @this"
				update=":form:dtUSGResult" />
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				action="#{pmTrackingDiaryBackingBean.resetUGSearchBean}"
				update="pmUGSearchID" />
		</div>


</ui:composition>
