<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<h:panelGroup id="supplierItemViewID">
	<script>
	$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.cm.catalogue.search']}"); 
	</script>

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
		
		<table style="width: 100%">
			<tr>
				<td><p:panel style="width: 100%;" header="#{lbl['lbl.cm.define.search']}"
						toggleable="true" id="searchTabId">

						<table style="margin-top: 10px; width: 100%;">
							<tr>
								<td width="15%"><p:outputLabel
										value="Item Code" /></td>
								<td width="35%"><p:inputText size="50"
										value="#{catalogueBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText></td>
							</tr>

							<tr>
								<td width="35%"><p:outputLabel
										value="Item Name" /></td>
								<td width="65%"><p:inputText size="50"
										value="#{catalogueBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="Contracted Item?" /></td>
								<td width="65%"><p:inputText size="50"
										value="#{catalogueBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="Status" /></td>
								<td width="65%"><p:inputText size="50"
										value="#{catalogueBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText></td>
							</tr>
							
						</table>




						<div style="text-align: right;">
							<p:commandButton value="#{lbl['lbl.cm.search']}" icon="ui-icon-search" action="#{codificationBackingBean.unspscSearch}" >
								<f:param name="unspscCode" value="aaaaaaaaaaa" />
							</p:commandButton>
							<p:commandButton value="#{lbl['lbl.btn.reset']}" icon="ui-icon-reset" action="#{cdTrackingDiaryBackingBean.reset}">
							</p:commandButton>
						</div>
					</p:panel></td>
			</tr>
		</table>
			
			
			

	<p:panel header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable id="unspscTableID" lazy="true"
				value="#{codificationBackingBean.searchDataModel}" var="unspscObj"
				width="100%" rows="10">



				<ac:paginator for="unspscTableID"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					Creation Date
				</f:facet>
							#{unspscObj.unspscCode}

				</p:column>

				<p:column width="15%">
					<f:facet name="header">
					Document No.
				</f:facet>
					#{unspscObj.unspscCode}

				</p:column>
				<p:column>
					<f:facet name="header">
					Document Title
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>
				<p:column>
					<f:facet name="header">
					Status
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>				
			<p:column>
					<f:facet name="header">
					Action
				</f:facet>
					<p:commandLink
						action="#{cdTrackingDiaryBackingBean.goToTrackingDiarySearch(unspscObj)}">
							<p:graphicImage library="ep/images/design" name="reset.png"
								value="/resources/ep/images/design/reset.png" />
					</p:commandLink>
			</p:column>
			</p:dataTable>


		</p:panel>

	</h:panelGroup>


</ui:composition>
