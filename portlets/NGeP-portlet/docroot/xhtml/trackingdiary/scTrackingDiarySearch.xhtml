<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="ctSearchID">
	<script>
	$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.cm.catalogue.search']}"); 
	</script>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
			
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
						<table style="margin-top: 10px; width: 100%;">
							<tr>
								<td width="35%"><p:outputLabel
										value="Document Type" /></td>
								<td width="35%">					
									<p:selectOneMenu value="#{scTrackingDiaryBackingBean.managedBean.searchDocumentType}">
										<f:selectItems value="#{trackingDiaryBackingBean.getDropdownCodeValues('CT')}" />
									</p:selectOneMenu>
								</td>						
							</tr>
							<tr>
								<td width="15%"><p:outputLabel
										value="Document No." /></td>
								<td width="35%"><p:inputText size="50"
										value="#{scTrackingDiaryBackingBean.managedBean.searchDocumentNo}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="Document Title" /></td>
								<td width="65%"><p:inputText size="50"
										value="#{scTrackingDiaryBackingBean.managedBean.searchDocumentTitle}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="#{lbl['lbl.fl.doc.maintain.circular.contract.duration']}" /></td>
								<td width="35%"><p:calendar mode="popup" showOn="button"
										readonlyInput="true"
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
										value="#{scTrackingDiaryBackingBean.managedBean.searchDocumentFromDuration}">
									</p:calendar>
									<p:spacer width="5" />
									<p:calendar mode="popup" showOn="button"
										readonlyInput="true"
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
										value="#{scTrackingDiaryBackingBean.managedBean.searchDocumentToDuration}">
									</p:calendar></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="Status" /></td>
								<td width="35%">					
									<p:selectOneMenu value="#{smTrackingDiaryBackingBean.managedBean.applicationType}">
										<f:selectItems value="#{trackingDiaryBackingBean.getDropdownCodeValues('CT')}" />
									</p:selectOneMenu>
								</td>						
							</tr>
							
						</table>


						<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.search']}"
								action="#{scTrackingDiaryBackingBean.search}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
								icon="ui-icon-search" update="resultPanel" />
							<p:commandButton value="#{lbl['lbl.btn.reset']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
								action="#{scTrackingDiaryBackingBean.reset}" icon="ui-icon-reset" update=":form" />
						</div>
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable id="unspscTableID" lazy="true"
				value="#{codificationBackingBean.searchDataModel}" var="unspscObj"
				width="100%" rows="10">



				<ac:paginator for="unspscTableID"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					Creation Date
				</f:facet>"C:/Users/User/AppData/Local/Temp/rjlcp2ni.bmp"
							#{unspscObj.unspscCode}

				</p:column>

				<p:column width="15%">
					<f:facet name="header">
					Document No.
				</f:facet>
					#{unspscObj.unspscCode}

				</p:column>
				<p:column>
					<f:facet name="header">
					Document Title
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>
				<p:column>
					<f:facet name="header">
					Status
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>				
			<p:column>
					<f:facet name="header">
					Action
				</f:facet>
					<p:commandLink
						action="#{cdTrackingDiaryBackingBean.goToTrackingDiarySearch(unspscObj)}">
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/resources/ep/images/design/document.png" />
					</p:commandLink>
			</p:column>
			</p:dataTable>


		</p:panel>

	</h:panelGroup>

</ui:composition>
