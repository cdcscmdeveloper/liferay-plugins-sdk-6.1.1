<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
					<p:outputLabel value="#{lbl['lbl.pm.tr.catCode.category.level']}" />
						<p:outputLabel value="* " styleClass="mandatory" />
			</h:column>
			<h:column>

				<p:selectOneMenu  style="width:205px;margin-bottom:5px;"
							value="#{pmTrackingDiaryBackingBean.managedBean.pmCategoryLevel}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="0" />
							<f:selectItem itemLabel="#{lbl['lbl.pm.main.category']}"
								itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.pm.sub.category']}"
								itemValue="2" />
							<f:selectItem itemLabel="#{lbl['lbl.pm.sub.div']}" itemValue="3" />
							<p:ajax event="change"
								listener="#{pmTrackingDiaryBackingBean.updateCategoryLevel()}"
								update="pmCatCodeSearchID"/>
						</p:selectOneMenu>
				
			</h:column>
			<h:column>
					<p:outputLabel value="#{lbl['lbl.pm.tr.catCode.category.code']}" />
			</h:column>
			<h:column>
					<p:inputText 
							value="#{pmTrackingDiaryBackingBean.managedBean.categoryCode}"
							maxlength="2" size="27" />
			</h:column>
			<h:column>
					<p:outputLabel value="#{lbl['lbl.pm.tr.catCode.category.desc']}" />
			</h:column>
			<h:column>
					<p:inputText
							value="#{pmTrackingDiaryBackingBean.managedBean.categoryDesc}" size="50" />
           </h:column>
			
		</h:panelGrid>


		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.search']}"
				action="#{pmTrackingDiaryBackingBean.searchCategoryCode()}" partialSubmit="true" process="pmCatCodeSearchID @this"
				update=":form:dtCatCodeResult" />
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				action="#{pmTrackingDiaryBackingBean.resetCategorySearchBean}"
				update="pmCatCodeSearchID" />
		</div>


</ui:composition>
