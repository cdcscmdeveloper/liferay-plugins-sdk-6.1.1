<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:dp="http://openam.com/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"	
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">
	</ui:define>
	<h:head>
		<h:outputStylesheet library="ep/css" name="ep.css" />
	</h:head>
	<ui:define name="contentSection">
		<p:panel id="Pnl" header="Trackng Diary" toggleable="true">

	<h:panelGroup id="cmUNSPSCsearchID">
	<script>
	$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.cm.catalogue.search']}"); 
	</script>

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
		<div style="text-align: right; min-height: 40px;">	
			<div style="float: left; clear: both;">
				<p:commandButton value="#{lbl['lbl.cm.back']}" icon="ui-icon-back" action="#{cdTrackingDiaryBackingBean.backToPrev}" />
			</div>
		</div>
		<p:panel header="Trackng Diary Details" toggleable="true">

			<p:dataTable id="trackingDiaryTableID" lazy="true" value="#{scTrackingDiaryBackingBean.searchTrackingDiaryDataModel}" var="trackingDiaryObj" width="100%" rows="10">

				<ac:paginator for="trackingDiaryTableID"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					Creation Timestamp
					</f:facet>
				#{trackingDiaryObj.actionedDate}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Actioned By
					</f:facet>
				#{trackingDiaryObj.actionedBy}
				</p:column>
<!-- 				<p:column width="15%"> -->
<!-- 					<f:facet name="header"> -->
<!-- 					Role -->
<!-- 					</f:facet> -->
<!-- 				#{trackingDiaryObj.pmRole.pmRoleDescs.roleName} -->
<!-- 				</p:column> -->
				<p:column width="25%">
					<f:facet name="header">
					Description
					</f:facet>
				#{trackingDiaryObj.actionDesc}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Document Status
					</f:facet>
				#{scTrackingDiaryBackingBean.getStatusDescById(trackingDiaryObj.statusId)}
				</p:column>

			</p:dataTable>

		</p:panel>			

<!-- 		<ui:include src="trackingDiaryDetailResult.xhtml"></ui:include> -->
	</h:panelGroup>		


			<br />
			<br />
		</p:panel>
	</ui:define>
</ui:composition>
