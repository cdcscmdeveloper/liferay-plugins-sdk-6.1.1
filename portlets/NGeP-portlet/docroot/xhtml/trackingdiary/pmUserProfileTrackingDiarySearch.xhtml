<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idno']}" />
			</h:column>
			<h:column>
				<p:inputText size="50"
						value="#{pmTrackingDiaryBackingBean.managedBean.userProfileSearchBean.identificationNo}"></p:inputText>
			</h:column>
			<h:column>
				<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.username']}" />
			</h:column>
			<h:column>
				<p:inputText size="50"
						value="#{pmTrackingDiaryBackingBean.managedBean.userProfileSearchBean.userName}"></p:inputText>
			</h:column>
			
		</h:panelGrid>


		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.search']}"
				action="#{pmTrackingDiaryBackingBean.searchUserProfile()}" partialSubmit="true" process="pmUserSearchID @this"
				update="dtUserProfileResult" />
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				action="#{pmTrackingDiaryBackingBean.resetUserProfilesSearchBean}"
				update="pmUserSearchID" />
		</div>
		<p:panel id="userResultPanel" header="#{lbl['lbl.pm.search.result']}"
			toggleable="true">

			<p:dataTable id="dtUserProfileResult" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{pmTrackingDiaryBackingBean.managedBean.userDataModel}" lazy="true"
				var="user" width="100%" rows="10">
              
                <ac:paginator for="dtUserProfileResult" />

				<p:column width="15%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.pm.profiles.userdetails.loginid']}" />
					</f:facet>
						#{user.loginId}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.pm.profiles.userdetails.idno']}" />
					</f:facet>
					#{user.identificationNo}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.pm.profiles.userdetails.username']}" />
					</f:facet>
				   	#{user.userName}
				</p:column>
				<p:column width="5%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.action']}"/>
					</f:facet>
					<p:commandLink
						action="#{pmTrackingDiaryBackingBean.goToUserTrackingDiarySearch(user)}">
						<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.ct.view']}" />
					</p:commandLink>
			</p:column>
			</p:dataTable>

		</p:panel>


</ui:composition>
