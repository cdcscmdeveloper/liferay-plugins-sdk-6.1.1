<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="flSearchID">
	<script>
	$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.cm.catalogue.search']}"); 
	</script>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
			
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
			<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}"/>
			<table>
			<tr>
				<td style="width: 190px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.order.type']}" /><p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu
						value="#{flTrackingDiaryBackingBean.managedBean.searchOrderType}"
						style="width: 314px;">
						<f:selectItems
							value="#{flTrackingDiaryBackingBean.getDropdownCodeValues(ParameterTypeConst.fulfilmentOrderType)}" />
						<p:ajax event="change" update="searchPanel"
							listener="#{flTrackingDiaryBackingBean.selectedOrderType}" />
					</p:selectOneMenu></td>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.order.no']}" /></td>
				<td><p:inputText size="28" maxlength="17" 
						value="#{flTrackingDiaryBackingBean.managedBean.searchOrderNo}"></p:inputText></td>
			</tr>
			<tr>
			<td style="width: 190px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.doc.type']}"	/></td>
			<td><p:selectOneMenu id="searchDocTypeDD" style="width: 314px;"
						value="#{flTrackingDiaryBackingBean.managedBean.searchDocType}">
						<f:selectItems
							value="#{flTrackingDiaryBackingBean.getDocumentTypeDropDown()}" />
						<p:ajax event="change"
							update="docStatusSearch"
							listener="#{flTrackingDiaryBackingBean.selectedDoctype}" />
					</p:selectOneMenu></td>
			<td><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.circular.doc.no']}" /></td>
			<td><p:inputText size="28"
						value="#{flTrackingDiaryBackingBean.managedBean.searchDocNo}"></p:inputText>	</td>
						</tr>
			</table>
			<h:panelGroup id="docStatusSearch">
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth" >
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.doc.status']}" />
					<p:selectOneMenu id="statusId"
						value="#{flTrackingDiaryBackingBean.managedBean.statusDescId}"
						style="width: 314px;">
						<f:selectItems value="#{flTrackingDiaryBackingBean.getStatusDropdownValues('FL',flTrackingDiaryBackingBean.managedBean.searchDocType)}" />
					</p:selectOneMenu>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docDoStatusSearch">
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel
						value="#{lbl['lbl.fl.doc.maintain.circular.contract.duration']}" />
					<p:calendar mode="popup" showOn="button"
						readonlyInput="true"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						value="#{flTrackingDiaryBackingBean.managedBean.searchOrderFromDuration}">
					</p:calendar>
					<p:spacer width="5" />
					<p:calendar mode="popup" showOn="button"
						readonlyInput="true"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						value="#{flTrackingDiaryBackingBean.managedBean.searchOrderToDuration}">
					</p:calendar>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGrid columns="4" columnClasses="flDocSearchWidth" >
				<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.supp.name']}" />
				<p:inputText size="45"
					value="#{flTrackingDiaryBackingBean.managedBean.searchSuppName}"></p:inputText>
			</h:panelGrid>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{flTrackingDiaryBackingBean.search}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
					icon="ui-icon-search" update="resultPanel" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
					action="#{flTrackingDiaryBackingBean.reset}" icon="ui-icon-reset" update=":form" />
			</div>
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.fl.result']}" toggleable="true">
			<p:dataTable id="flDocListDt"
				value="#{flTrackingDiaryBackingBean.managedBean.flDocumentDataModel}" lazy="true"
				var="flDocument" rowIndexVar="rowIndex" rowKey="#{flDocument.docId}"
				width="100%" rows="10">
				<ac:paginator for="flDocListDt" />

				<p:column width="15%">
					<f:facet name="header">
					Creation Date
				</f:facet>
					#{flDocument.docNo}
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					Document No.
				</f:facet>
				#{flDocument.docNo}
				</p:column>
				<p:column>
					<f:facet name="header">
					Document Title
				</f:facet>
				#{flDocument.title}
				</p:column>
				<p:column>
					<f:facet name="header">
					Document Type
				</f:facet>
				#{flDocument.docType}
				</p:column>
				<p:column>
					<f:facet name="header">
					Status
				</f:facet>
				#{flTrackingDiaryBackingBean.getStatusDescById(flDocument.status.statusId)}
				</p:column>				
				<p:column>
					<f:facet name="header">
					Action
				</f:facet>
					<p:commandLink
						action="#{flTrackingDiaryBackingBean.goToTrackingDiarySearch(flDocument)}">
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/resources/ep/images/design/document.png" />
					</p:commandLink>
			</p:column>
			</p:dataTable>
		</p:panel>
	</h:panelGroup>

</ui:composition>
