						style="width: 314px;">

						<p:ajax event="change" update="searchPanel"

					</p:selectOneMenu></td>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{flTrackingDiaryBackingBean.search}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
					update="resultPanel" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
					action="#{flTrackingDiaryBackingBean.reset}" update=":form" />
			</div>
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.fl.result']}" toggleable="true">
			<p:dataTable id="flDocListDt"
				value="#{flTrackingDiaryBackingBean.managedBean.flDocumentDataModel}" lazy="true"
				var="flDocument" rowIndexVar="rowIndex" rowKey="#{flDocument.docId}"
				width="100%" rows="10">
				<ac:paginator for="flDocListDt" />

				<p:column width="15%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.creation.date']}"/>
					</f:facet>
				<ac:labelDateTime value="#{flDocument.createdDate}" />
				</p:column>
				<p:column width="15%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.doc.no']}"/>
					</f:facet>
				#{flDocument.docNo}
				</p:column>
				<p:column>
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.doc.title']}"/>
					</f:facet>
				#{flDocument.title}
				</p:column>
				<p:column>
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.doc.type']}"/>
					</f:facet>
				#{scTrackingDiaryBackingBean.getParameterDesc("DT",flDocument.docType)}
				</p:column>
				<p:column>
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.status']}"/>
					</f:facet>
				#{flTrackingDiaryBackingBean.getStatusDescById(flDocument.statusId)}
				</p:column>				
				<p:column width="5%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.action']}"/>
					</f:facet>
					<p:commandLink
						action="#{flTrackingDiaryBackingBean.goToTrackingDiarySearch(flDocument)}">
						<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.ct.view']}" />
					</p:commandLink>
			</p:column>
			</p:dataTable>
