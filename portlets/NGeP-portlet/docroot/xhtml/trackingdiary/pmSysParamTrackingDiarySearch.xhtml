<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

  <p:spacer height="50" />
		<p:panelGrid styleClass="tablePanel">
				<f:facet name="header">
					<p:row>
						<p:column width="80%">
							#{lbl['lbl.pm.ta.parameter.type']}
						</p:column>
						<p:column>
					#{lbl['lbl.td.action']}		
                        </p:column>
					</p:row>
				</f:facet>

				<p:row>
					<p:column width="80%">
						<h:outputText value="#{lbl['lbl.pm.settings.rule.config']}" />
					</p:column>
					<p:column>
						<p:commandLink
							action="#{pmTrackingDiaryBackingBean.goToRuleConfigTrackingDiarySearch()}">
							<p:graphicImage value="/css/images/design/ico-view.png"
								title="#{lbl['lbl.ct.view']}" />
						</p:commandLink>
					</p:column>
				</p:row>
				<p:row>
					<p:column width="80%">
						<h:outputText value="#{lbl['lbl.pm.settings.fee.setting']}" />
					</p:column>
					<p:column>
						<p:commandLink
							action="#{pmTrackingDiaryBackingBean.goToFeeSettTrackingDiarySearch()}">
							<p:graphicImage value="/css/images/design/ico-view.png"
								title="#{lbl['lbl.ct.view']}" />
						</p:commandLink>
					</p:column>
				</p:row>
				<p:row>
					<p:column width="80%">
						<h:outputText
							value="#{lbl['lbl.pm.settings.operational.threshold']}" />
					</p:column>
					<p:column>
						<p:commandLink
							action="#{pmTrackingDiaryBackingBean.goToThresholdTrackingDiarySearch()}">
							<p:graphicImage value="/css/images/design/ico-view.png"
								title="#{lbl['lbl.ct.view']}" />
						</p:commandLink>
					</p:column>
				</p:row>
			</p:panelGrid>


</ui:composition>
