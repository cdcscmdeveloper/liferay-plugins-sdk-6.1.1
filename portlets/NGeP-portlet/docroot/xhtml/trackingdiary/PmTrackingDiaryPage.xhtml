<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="pmSearchID">
		<script>
			$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.cm.catalogue.search']}");
		</script>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"></p:messages>

		<p:panel id="searchPanel" header="#{lbl['lbl.pm.search.search']}"
			toggleable="true">


			<table width="100%">
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.pm.tr.transaction.type']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="searchFunctionType"
							value="#{pmTrackingDiaryBackingBean.managedBean.transactionType}"
							style="width: 250px;">
							<f:selectItems
								value="#{pmTrackingDiaryBackingBean.getDropdownCodeValues(ParameterTypeConst.profileManagementFunctionType)}" />
					     <p:ajax event="change" update="searchPanel" />
						</p:selectOneMenu></td>
					<td />
					<td/>
					</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.cal.frmdate']}" />
						</td>
					<td><p:calendar showOn="button" id="fromDateId"
							label="#{lbl['lbl.pm.cal.frmdate']}" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							value="#{pmTrackingDiaryBackingBean.managedBean.fromDate}">
							<p:ajax event="dateSelect" process="@this" />
						</p:calendar></td>
					<td ><p:outputLabel value="#{lbl['lbl.pm.cal.todate']}" />
						</td>
					<td><p:calendar showOn="button" id="toDateId"
							label="#{lbl['lbl.pm.cal.todate']}" readonlyInput="true"
							validatorMessage="To Date should be greater than from Date"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							value="#{pmTrackingDiaryBackingBean.managedBean.toDate}">
							<f:attribute name="startDate"
								value="#{pmTrackingDiaryBackingBean.managedBean.fromDate}" />
							<f:validator validatorId="primeDateRangeValidator" />
							<p:ajax event="dateSelect" process="@this" />
						</p:calendar></td>
						
				</tr>
				</table>
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.search']}"
						action="#{pmTrackingDiaryBackingBean.searchTrackingDiaryByDocType(pmTrackingDiaryBackingBean.managedBean.transactionType)}"
						partialSubmit="true" process="@this" update="searchPanel" />
				</div>

				<ac:trackingDiaryDetail
					action="#{pmTrackingDiaryBackingBean.backToPrev}"
					showBackButton="false"
					dataTable="#{pmTrackingDiaryBackingBean.managedBean.searchTrackingDiaryDataModel}" />

				</p:panel>
				</h:panelGroup>

				</ui:composition>
