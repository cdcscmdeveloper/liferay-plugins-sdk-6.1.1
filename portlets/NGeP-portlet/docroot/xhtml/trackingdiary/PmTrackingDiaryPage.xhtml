<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="pmSearchID">
		<script>
			$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text')
					.html("#{lbl['lbl.cm.catalogue.search']}");
		</script>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"></p:messages>

		<p:panel id="searchPanel" header="#{lbl['lbl.pm.search.search']}"
			toggleable="true">

			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
				columns="4" columnClasses="columnWidth20">

				<h:column>

					<p:outputLabel value="#{lbl['lbl.pm.tr.transaction.type']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</h:column>
				<h:column>
					<p:selectOneMenu id="searchFunctionType"
						value="#{pmTrackingDiaryBackingBean.managedBean.functionType}"
						style="width: 314px;">
						<f:selectItems
							value="#{pmTrackingDiaryBackingBean.getDropdownCodeValues(ParameterTypeConst.profileManagementFunctionType)}" />
						<p:ajax event="change"
							listener="#{pmTrackingDiaryBackingBean.onTransactionTypeSelect()}"
							partialSubmit="true" process="@this"
							update="searchPanel" />
					</p:selectOneMenu>
				</h:column>
	<h:column />
	<h:column />
		<h:column><p:outputLabel value="#{lbl['lbl.pm.cal.frmdate']}" /><p:outputLabel value="*" styleClass="mandatory" /> </h:column>
				<h:column> <p:calendar showOn="button" id="fromDateId"
									label="#{lbl['lbl.pm.cal.frmdate']}" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									value="#{pmTrackingDiaryBackingBean.managedBean.fromDate}">
								</p:calendar></h:column>
						<h:column>
							<p:outputLabel value="#{lbl['lbl.pm.cal.todate']}" /><p:outputLabel value="*" styleClass="mandatory" /></h:column>
							<h:column><p:calendar showOn="button" id="toDateId"
									label="#{lbl['lbl.pm.cal.todate']}" readonlyInput="true"
									validatorMessage="To Date should be greater than from Date"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									value="#{pmTrackingDiaryBackingBean.managedBean.toDate}">
									<f:attribute name="startDate"
										value="#{pmTrackingDiaryBackingBean.managedBean.fromDate}" />
									<f:validator validatorId="primeDateRangeValidator" />
								</p:calendar>	
								</h:column>	
			</h:panelGrid>
				<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.search']}"
				action="#{pmTrackingDiaryBackingBean.searchTrackingDiaryByDocType(pmTrackingDiaryBackingBean.managedBean.functionType)}" partialSubmit="true" process="@this"
				update="searchPanel" />
		</div>
		
             <ac:trackingDiaryDetail action="#{pmTrackingDiaryBackingBean.backToPrev}" showBackButton="false"
					dataTable="#{pmTrackingDiaryBackingBean.managedBean.searchTrackingDiaryDataModel}"  /> 
			
		</p:panel>
	</h:panelGroup>

</ui:composition>
