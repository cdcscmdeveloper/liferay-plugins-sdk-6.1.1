<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"

	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="ctSearchID">
	<script>
	$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.cm.catalogue.search']}"); 
	</script>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false"></p:messages>
			
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
			<table>
				<tr>
					<td width="35%"><p:outputLabel value="#{lbl['lbl.td.transaction.type']}" /><p:outputLabel
						value="*" styleClass="mandatory" /></td>
					<td width="35%"><p:selectOneMenu required="true" label="#{lbl['lbl.td.transaction.type']}"
							value="#{ctTrackingDiaryBackingBean.managedBean.searchTrasactionType}"
							style="width: 314px;">
							<f:selectItems
								value="#{ctTrackingDiaryBackingBean.getContractType()}" />
						</p:selectOneMenu></td>
				</tr>
<!-- 				<tr> -->
<!-- 					<td width="35%"><p:outputLabel value="View Type"	/></td> -->
<!-- 					<td width="35%"><p:selectOneMenu id="searchViewTypeDD" style="width: 314px;" -->

<!-- 									value="#{ctTrackingDiaryBackingBean.getContractViewType()}" /> -->

				<tr>
					<td width="35%"><p:outputLabel value="#{lbl['lbl.td.doc.no']}" /></td>
					<td width="35%"><p:inputText size="28"
							value="#{ctTrackingDiaryBackingBean.managedBean.searchDocNo}"></p:inputText></td>
				</tr>
				<tr>
					<td width="35%"><p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" /></td>
					<td width="35%"><p:inputText size="28"
							value="#{ctTrackingDiaryBackingBean.managedBean.searchPhysContractNo}"></p:inputText>
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phycontr.no']}"/></td>
				</tr>
				<tr>
					<td width="35%"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.loa.no']}" /></td>
					<td width="35%"><p:inputText size="28"
							value="#{ctTrackingDiaryBackingBean.managedBean.searchLoaNo}"></p:inputText>
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.loa']}"/></td>
				</tr>
				<tr>
					<td width="35%"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" /></td>
					<td width="35%"><p:inputText size="28"
							value="#{ctTrackingDiaryBackingBean.managedBean.searchPhysLoaNo}"></p:inputText>
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phyloa']}"/></td>
				</tr>
<!-- 				<tr> -->
<!-- 					<td width="35%"><p:outputLabel -->
<!-- 							value="#{lbl['lbl.fl.doc.maintain.circular.contract.duration']}" /></td> -->
<!-- 					<td width="35%"><p:calendar mode="popup" showOn="button" -->
<!-- 							readonlyInput="true" -->
<!-- 							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" -->
<!-- 							value="#{ctTrackingDiaryBackingBean.managedBean.searchContractFromDuration}"> -->
<!-- 						</p:calendar> -->
<!-- 						<p:spacer width="5" /> -->

<!-- 							readonlyInput="true"  -->

<!-- 							value="#{ctTrackingDiaryBackingBean.managedBean.searchContractToDuration}"> -->

<!-- 				</tr> -->
				<tr>
					<td width="35%"><p:outputLabel value="Status" /></td>
					<td width="35%"><p:selectOneMenu style="width: 314px;"
								value="#{ctTrackingDiaryBackingBean.managedBean.searchStatusId}">
								<f:selectItems
									value="#{ctTrackingDiaryBackingBean.searchStatusDesc()}" />
						</p:selectOneMenu></td>
				</tr>			
			</table>
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{ctTrackingDiaryBackingBean.search}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							update="resultPanel" />
						<p:commandButton value="#{lbl['lbl.btn.reset']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							action="#{ctTrackingDiaryBackingBean.reset}" update=":form" />
					</div>
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.fl.result']}" toggleable="true">
			<p:dataTable id="ctDocListDt"
				value="#{ctTrackingDiaryBackingBean.managedBean.ctDocumentDataModel}" lazy="true"
				var="ctDocument" rowIndexVar="rowIndex" rowKey="#{ctDocument.docId}"
				width="100%" rows="10">
				<ac:paginator for="ctDocListDt" />
				<!--  
				<p:column width="15%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.creation.date']}"/>
					</f:facet>
				<ac:labelDateTime value="#{ctDocument.createdDate}" /> 
				</p:column>
				-->
				<p:column width="15%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.doc.no']}"/>
					</f:facet>
				#{ctDocument.docNo}
				</p:column>
				<p:column>
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.doc.title']}"/>
					</f:facet>
				#{ctDocument.title}
				</p:column>
				<!-- 
				<p:column>
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.doc.type']}"/>
					</f:facet>
				#{ctTrackingDiaryBackingBean.getParameterDesc(ParameterTypeConst.documentTypes, ctDocument.docType)}
				</p:column>
				 -->
				<p:column>
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.td.status']}"/>
					</f:facet>
				#{ctTrackingDiaryBackingBean.getStatusDescById(ctDocument.statusId)}
				</p:column>				
				<p:column width="5%">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.ct.action']}"/>
					</f:facet>
					<p:commandLink
						action="#{ctTrackingDiaryBackingBean.goToTrackingDiarySearch(ctDocument)}">
							<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.ct.view']}" />
						</p:commandLink>

				</p:column>
			</p:dataTable>

		</p:panel>
