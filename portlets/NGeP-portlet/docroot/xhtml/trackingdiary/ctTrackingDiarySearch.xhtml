<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
		<style>
				.column-align-center {
				text-align: center !important;
				}
				
				.highlight-mark:before {
 					color: red;
 					content: "*";
				}
		</style>
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
						<table style="margin-top: 10px; width: 100%;">
							<tr>
								<td width="15%"><p:outputLabel
										value="Document No." /></td>
								<td width="25%"><p:inputText size="30"
										value="#{catalogueBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText></td>
								<td width="15%"><p:outputLabel
										value="Physical Document No." /></td>
								<td width="35%"><p:inputText size="30"
										value="#{catalogueBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText></td>
							</tr>

							<tr>
								<td width="35%"><p:outputLabel
										value="LOA No." /></td>
								<td width="65%"><p:inputText size="50"
										value="#{catalogueBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText></td>
								<td width="35%"><p:outputLabel
										value="Physical LOA No." /></td>
								<td width="65%"><p:inputText size="50"
										value="#{catalogueBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="Document Title" /></td>
								<td width="65%"><p:inputText size="50"
										value="#{catalogueBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText></td>
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="Document Type" /></td>
								<td width="35%">					
									<p:selectOneMenu value="#{supplierReviewBackingBean.managedBean.qt.qtType}">
										<f:selectItems value="#{trackingDiaryBackingBean.getDropdownCodeValues('CT')}" />
									</p:selectOneMenu>
								</td>						
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="Date Range" /></td>
								<td width="35%">
								<p:column>
									<p:calendar showOn="button" readonlyInput="true" id="pubFromDt"
										value="#{noticeBoardBackingBean.managedBean.publishSearchDataBean.fromDate}"
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
										size="10">
										<p:ajax event="dateSelect" update="pubToDt" />
									</p:calendar>
				
									<p:calendar showOn="button" readonlyInput="true" id="pubToDt"
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
										size="10"
										value="#{noticeBoardBackingBean.managedBean.publishSearchDataBean.toDate}"
										mindate="#{noticeBoardBackingBean.managedBean.publishSearchDataBean.fromDate}">
									</p:calendar>
								</p:column>	</td>						
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="Date Type" /></td>
								<td width="35%">					
									<p:selectOneMenu value="#{supplierReviewBackingBean.managedBean.qt.qtType}">
										<f:selectItems value="#{trackingDiaryBackingBean.getDropdownCodeValues('CT')}" />
									</p:selectOneMenu>
								</td>						
							</tr>
							<tr>
								<td width="35%"><p:outputLabel
										value="Status" /></td>
								<td width="35%">					
									<p:selectOneMenu value="#{supplierReviewBackingBean.managedBean.qt.qtType}">
										<f:selectItems value="#{trackingDiaryBackingBean.getDropdownCodeValues('CT')}" />
									</p:selectOneMenu>
								</td>						
							</tr>
							
						</table>



						<div style="text-align: right;">
							<p:commandButton value="#{lbl['lbl.cm.search']}" icon="ui-icon-search" action="#{cdTrackingDiaryBackingBean.unspscSearch}" update="resultPanel" >
								<f:param name="unspscCode" value="aaaaaaaaaaa" />
							</p:commandButton>
							<p:commandButton value="#{lbl['lbl.btn.reset']}" icon="ui-icon-reset" action="#{cdTrackingDiaryBackingBean.reset}" update="resultPanel">
							</p:commandButton>
						</div>

					</p:panel>
			
			

		<p:panel id="resultPanel" header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable id="unspscTableID" lazy="true"
				value="#{codificationBackingBean.searchDataModel}" var="unspscObj"
				width="100%" rows="10">

				<ac:paginator for="unspscTableID"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					Creation Date
				</f:facet>
					#{unspscObj.unspscCode}

				</p:column>

				<p:column width="15%">
					<f:facet name="header">
					Document No.
				</f:facet>
				#{unspscObj.unspscCode}

				</p:column>
				<p:column>
					<f:facet name="header">
					Document Title
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>
				<p:column>
					<f:facet name="header">
					Status
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>				
			<p:column>
					<f:facet name="header">
					Action
				</f:facet>
					<p:commandLink
						action="#{cdTrackingDiaryBackingBean.goToTrackingDiarySearch(unspscObj)}">
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/resources/ep/images/design/document.png" />
						</p:commandLink>

			</p:column>
			</p:dataTable>


		</p:panel>


	</ui:define>

</ui:composition>
