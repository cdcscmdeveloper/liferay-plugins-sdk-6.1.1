<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="ctSearchID">
	<script>
	$('#portlet_Catalogue_WAR_NGePportlet').find('.portlet-title-text').html("#{lbl['lbl.cm.catalogue.search']}"); 
	</script>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		

		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
			
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
			<table>
			<tr>
				<td style="width: 190px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.order.type']}" /><p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu
						value="#{ctTrackingDiaryBackingBean.managedBean.searchTrasactionType}"
						style="width: 314px;">
						<f:selectItems
							value="#{ctTrackingDiaryBackingBean.searchStatusDesc()}" />
						<p:ajax event="change" update="searchPanel"
							listener="#{ctTrackingDiaryBackingBean.selectedOrderType}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td style="width: 190px;"><p:outputLabel value="View Type"	/></td>
				<td><p:selectOneMenu id="searchViewTypeDD" style="width: 314px;"
							value="#{ctTrackingDiaryBackingBean.managedBean.searchViewType}">
							<f:selectItems
								value="#{ctTrackingDiaryBackingBean.managedBean.getSearchViewType()}" />
						</p:selectOneMenu></td>
			</tr>
			</table>
			<h:panelGroup id="docTypeSearch">
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.contract.no']}" />
					<p:inputText size="28"
						value="#{ctTrackingDiaryBackingBean.managedBean.searchContractNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.contr.no']}"/>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" />
					<p:inputText size="28"
						value="#{ctTrackingDiaryBackingBean.managedBean.searchPhysContractNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phycontr.no']}"/>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.loa.no']}" />
					<p:inputText size="28"
						value="#{ctTrackingDiaryBackingBean.managedBean.searchLoaNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.loa']}"/>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" />
					<p:inputText size="28"
						value="#{ctTrackingDiaryBackingBean.managedBean.searchPhysLoaNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phyloa']}"/>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel
						value="#{lbl['lbl.fl.doc.maintain.circular.contract.duration']}" />
					<p:calendar mode="popup" showOn="button"
						readonlyInput="true"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						value="#{ctTrackingDiaryBackingBean.managedBean.searchContractFromDuration}">
					</p:calendar>
					<p:spacer width="5" />
					<p:calendar mode="popup" showOn="button"
						readonlyInput="true"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						value="#{ctTrackingDiaryBackingBean.managedBean.searchContractToDuration}">
					</p:calendar>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel value="Status" />
					<p:selectOneMenu style="width: 314px;"
							value="#{ctTrackingDiaryBackingBean.managedBean.searchStatusId}">
							<f:selectItems
								value="#{ctTrackingDiaryBackingBean.searchStatusDesc()}" />
					</p:selectOneMenu>
				</h:panelGrid>
					</h:panelGroup>
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{ctTrackingDiaryBackingBean.search}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							icon="ui-icon-search" update="resultPanel" />
						<p:commandButton value="#{lbl['lbl.btn.reset']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							action="#{ctTrackingDiaryBackingBean.reset}" icon="ui-icon-reset" update=":form" />
					</div>
					</p:panel>
			
		<p:panel id="resultPanel" header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable id="ctDocListDt" lazy="true"
				value="#{ctTrackingDiaryBackingBeanBackingBean.searchDataModel}" var="flDocument"
				width="100%" rows="10">

				<ac:paginator for="ctDocListDt"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					Creation Date
				</f:facet>
				#{flDocument.docNo}

				</p:column>

				<p:column width="15%">
					<f:facet name="header">
					Document No.
				</f:facet>
				#{flDocument.docNo}

				</p:column>
				<p:column>
					<f:facet name="header">
					Document Title
				</f:facet>
				#{flDocument.docNo}
			</p:column>
				<p:column>
					<f:facet name="header">
					Status
				</f:facet>
				#{flDocument.docNo}
			</p:column>				
			<p:column>
					<f:facet name="header">
					Action
				</f:facet>
					<p:commandLink
						action="#{cdTrackingDiaryBackingBean.goToTrackingDiarySearch(flDocument)}">
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/resources/ep/images/design/document.png" />
						</p:commandLink>

			</p:column>
			</p:dataTable>


		</p:panel>

	</h:panelGroup>

</ui:composition>
