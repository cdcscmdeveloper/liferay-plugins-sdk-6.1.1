<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
		<style>
				.column-align-center {
				text-align: center !important;
				}
				
				.highlight-mark:before {
 					color: red;
 					content: "*";
				}
		</style>
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
			<table>
			<tr>
				<td style="width: 190px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.order.type']}" /><p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu
						value="#{ctTrackingDiaryBackingBean.managedBean.searchTrasactionType}"
						style="width: 314px;">
						<f:selectItems
							value="#{ctTrackingDiaryBackingBean.getDropdownCodeValues(ParameterTypeConst.fulfilmentOrderType)}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td style="width: 190px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.doc.type']}"	/></td>
				<td><p:selectOneMenu id="searchViewTypeDD" style="width: 314px;"
							value="#{ctTrackingDiaryBackingBean.managedBean.searchViewType}">
							<f:selectItems
								value="#{ctTrackingDiaryBackingBean.getDocumentTypeDropDown()}" />
							<p:ajax event="change"
								update="docTypeSearch"
								listener="#{ctTrackingDiaryBackingBean.selectedDoctype}" />
						</p:selectOneMenu></td>
			</tr>
			</table>
			<h:panelGroup id="docTypeSearch">
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.contract.no']}" />
					<p:inputText size="28"
						value="#{ctTrackingDiaryBackingBean.managedBean.searchContractNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.contr.no']}"/>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" />
					<p:inputText size="28"
						value="#{ctTrackingDiaryBackingBean.managedBean.searchPhysContractNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phycontr.no']}"/>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.loa.no']}" />
					<p:inputText size="28"
						value="#{ctTrackingDiaryBackingBean.managedBean.searchLoaNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.loa']}"/>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" />
					<p:inputText size="28"
						value="#{ctTrackingDiaryBackingBean.managedBean.searchPhysLoaNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phyloa']}"/>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel
						value="#{lbl['lbl.fl.doc.maintain.circular.contract.duration']}" />
					<p:calendar mode="popup" showOn="button"
						readonlyInput="true"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						value="#{ctTrackingDiaryBackingBean.managedBean.searchContractFromDuration}">
					</p:calendar>
					<p:spacer width="5" />
					<p:calendar mode="popup" showOn="button"
						readonlyInput="true"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						value="#{ctTrackingDiaryBackingBean.managedBean.searchContractToDuration}">
					</p:calendar>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel value="Status" />
					<p:selectOneMenu style="width: 314px;"
							value="#{ctTrackingDiaryBackingBean.managedBean.searchViewType}">
							<f:selectItems
								value="#{ctTrackingDiaryBackingBean.getDocumentTypeDropDown()}" />
					</p:selectOneMenu>
				</h:panelGrid>
			</h:panelGroup>

						<div style="text-align: right;">
							<p:commandButton value="#{lbl['lbl.cm.search']}" icon="ui-icon-search" action="#{ctTrackingDiaryBackingBean.search}" update="resultPanel" >
								<f:param name="unspscCode" value="aaaaaaaaaaa" />
							</p:commandButton>
							<p:commandButton value="#{lbl['lbl.btn.reset']}" icon="ui-icon-reset" action="#{ctTrackingDiaryBackingBean.reset}" update="resultPanel">
							</p:commandButton>
						</div>

					</p:panel>
			
			

		<p:panel id="resultPanel" header="#{lbl['lbl.cm.search.result']}" toggleable="true">

			<p:dataTable id="unspscTableID" lazy="true"
				value="#{codificationBackingBean.searchDataModel}" var="unspscObj"
				width="100%" rows="10">

				<ac:paginator for="unspscTableID"></ac:paginator>

				<p:column width="15%">
					<f:facet name="header">
					Creation Date
				</f:facet>
					#{unspscObj.unspscCode}

				</p:column>

				<p:column width="15%">
					<f:facet name="header">
					Document No.
				</f:facet>
				#{unspscObj.unspscCode}

				</p:column>
				<p:column>
					<f:facet name="header">
					Document Title
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>
				<p:column>
					<f:facet name="header">
					Status
				</f:facet>
				#{unspscObj.unspscTitle}
			</p:column>				
			<p:column>
					<f:facet name="header">
					Action
				</f:facet>
					<p:commandLink
						action="#{cdTrackingDiaryBackingBean.goToTrackingDiarySearch(unspscObj)}">
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/resources/ep/images/design/document.png" />
						</p:commandLink>

			</p:column>
			</p:dataTable>


		</p:panel>


	</ui:define>

</ui:composition>
