<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <ui:define name="contentSection">
    <style>
      .column-align-center { text-align: center !important;}
    </style> 
  	<p:panel id="templateId" header="#{lbl['lbl.ct.tpl.name']}" toggleable="true" toggleSpeed="500">
  	<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
      <h:panelGrid columns="4" style="width:400px;">
         <p:selectOneMenu id="searchid" value="#{contractTemplateBackingBean.managedBean.searchFilterBean.searchField}" style="width:170px">
	       <f:selectItem itemLabel="---Please Select-----" itemValue="" />
	       <f:selectItems value="#{contractTemplateBackingBean.searchOptions}" />
	    </p:selectOneMenu>
	    <p:spacer width="5"/>
        <p:inputText id="searchTxt" value="#{contractTemplateBackingBean.searchValue}" style="width:150px;"/>
        <p:commandButton value="#{lbl['lbl.ct.search.btn.search']}" action="#{contractTemplateBackingBean.searchActionListener}"
          process="@this,searchTxt,searchid"  icon="ui-icon-search"  update="dataTable"/>
      </h:panelGrid>
     </p:panel>
     <p:panel id="searchResulId" header="#{lbl['lbl.ct.tpl.result']}" toggleable="true" toggleSpeed="500">
        <p:dataTable id="dataTable" var="data" value="#{contractTemplateBackingBean.managedBean.ctTemplatesList}" rowIndexVar="index"
	     widgetVar="dataTableObj" lazy="false" dynamic="true" rowKey="#{data}" 
	     selection="#{contractTemplateBackingBean.selectedTemplates}">
		 <ac:paginator for="dataTable"/>
		 <p:columnGroup type="header"> 
		 <p:row> 
		    <p:column headerText="Select"   /> 
			<p:column headerText="#{lbl['lbl.ct.tpl.table.name']}"   /> 
			<p:column headerText="#{lbl['lbl.ct.tpl.table.cby']}" /> 	
			<p:column headerText="#{lbl['lbl.ct.tpl.table.cdate']}" /> 
			<p:column headerText="#{lbl['lbl.ct.tpl.table.action']}" styleClass="column-align-center" /> 		
		  </p:row>						
		  </p:columnGroup>
		    <p:column selectionMode="multiple" style="width:18px;"/>
		  <p:column><h:outputText value="#{data.name}" /></p:column>
		  <p:column><h:outputText value="#{data.createdBy}" /></p:column>	
		  <p:column><h:outputText value="#{data.createdDate}" /></p:column>	
		  <p:column styleClass="column-align-center">
		  <p:commandLink action="#{contractTemplateBackingBean.gotoEditPage}" ajax="false" process="@form">
			 <f:setPropertyActionListener target="#{contractTemplateBackingBean.managedBean.ctTemplate}" value="#{data}" />
			 <p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
		  </p:commandLink>
		  </p:column> 
		  </p:dataTable>
		  <p:confirmDialog message="Do you want to delete the record?" closable="true" appendToBody="true" 
			header="Delete Confirmation" severity="alert" widgetVar="confirmation">
            <h:panelGrid columns="2">
			<p:commandButton value="Yes" icon="ui-icon-accept" update="dataTable" partialSubmit="true" process="@form"
				onclick="confirmation.hide();" actionListener="#{contractTemplateBackingBean.deleteTemplate()}" />
			<p:commandButton value="No" icon="ui-icon-reject" onclick="confirmation.hide()" type="button" />
			</h:panelGrid>
			</p:confirmDialog>
		  <div class="ppRightBtn"> 
		       <p:commandButton action="#{contractTemplateBackingBean.gotoAddPage}"  value="Add" icon="ui-icon-add" ajax="false"/>
		       <p:spacer width="1"/>
               <p:commandButton value="Delete" partialSubmit="true" process="@form" onsuccess="confirmation.show()" icon="ui-icon-delete" ></p:commandButton>
		   </div>
		 </p:panel>
       </ui:define>
</ui:composition>
