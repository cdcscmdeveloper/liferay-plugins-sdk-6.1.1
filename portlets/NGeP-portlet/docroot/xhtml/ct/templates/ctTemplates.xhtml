<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<ui:define name="contentSection">
    <style>
      .column-align-center { text-align: center !important;}
    </style> 
  	<p:panel id="templateId" header="#{lbl['lbl.ct.tpl.name']}" toggleable="true" toggleSpeed="500">
  	<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
      <h:panelGrid columns="4" style="width:400px;">
         <p:selectOneMenu id="searchid" value="#{contractTemplateBackingBean.managedBean.searchFilterBean.searchField}" style="width:170px">
	       <f:selectItem itemLabel="---Please Select-----" itemValue="" />
	       <f:selectItems value="#{contractTemplateBackingBean.searchOptions}" />
	    </p:selectOneMenu>
	    <p:spacer width="5"/>
        <p:inputText id="searchTxt" value="#{contractTemplateBackingBean.searchValue}" style="width:150px;"/>
        <p:commandButton value="#{lbl['lbl.ct.search.btn.search']}" action="#{contractTemplateBackingBean.searchActionListener}"
          process="@this,searchTxt,searchid"  icon="ui-icon-search"  update="dataTable"/>
      </h:panelGrid>
     </p:panel>
     <p:panel id="searchResulId" header="#{lbl['lbl.ct.tpl.result']}" toggleable="true" toggleSpeed="500">
     <h:panelGrid style="width:100%;">
        <p:dataTable id="dataTable" var="data" value="#{contractTemplateBackingBean.managedBean.ctTemplatesList}" 
	     dynamic="true" rowKey="#{data}" selection="#{contractTemplateBackingBean.selectedTemplates}">
		 <ac:paginator for="dataTable"/>
		    <p:column selectionMode="multiple" style="width:18px;"/>
			<p:column headerText="#{lbl['lbl.ct.tpl.table.name']}" style="width:50%;">
			   <h:outputText value="#{data.name}" />
			</p:column> 
			<p:column headerText="#{lbl['lbl.ct.tpl.table.cby']}" style="width:20%;">
			   <h:outputText value="#{contractTemplateBackingBean.retriveUserName(data.createdBy)}" />
			</p:column> 	
			<p:column headerText="#{lbl['lbl.ct.tpl.table.cdate']}" style="width:20%;">
			   <h:outputText value="#{data.createdDate}" />
			</p:column> 
			<p:column styleClass="column-align-center" style="width:8%;"
			   headerText="#{lbl['lbl.ct.tpl.table.action']}">
			   <p:commandLink action="#{contractTemplateBackingBean.gotoEditPage}" ajax="false" process="@form">
			      <f:setPropertyActionListener target="#{contractTemplateBackingBean.managedBean.ctTemplate}" value="#{data}" />
			      <p:graphicImage library="ep/images/design" name="edit.png" value="/css/images/design/edit.png" title="Edit" />
		       </p:commandLink>
			 </p:column> 		
	    </p:dataTable>
	   </h:panelGrid>
		<div class="ppRightBtn"> 
		    <p:commandButton action="#{contractTemplateBackingBean.gotoAddPage}"  value="Add" icon="ui-icon-add" ajax="false"/>
		       <p:spacer width="1"/>
             <p:commandButton value="Delete" partialSubmit="true" process="@form" onsuccess="dlgDel.show()" icon="ui-icon-delete" />
		 </div>
		  <p:dialog id="dlgDel" widgetVar="dlgDel" header="#{lbl['lbl.ct.dialog.cofirm.header']}" styleClass="screen-title"  
               resizable="false" modal="true" width="350" height="95">  
           <h:panelGrid columns="3">
            <p:graphicImage library="ep/images/design" name="exclamation.png"
			   value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
             <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" 
                 styleClass="ui-inputtextarea"></p:inputTextarea>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:dataTable" process="@form" 
				actionListener="#{contractTemplateBackingBean.deleteTemplate()}" onclick="dlgDel.hide();"/>
			  <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgDel.hide();" type="button" />
		   </div>
        </p:dialog>  
		 </p:panel>
       </ui:define>
</ui:composition>
