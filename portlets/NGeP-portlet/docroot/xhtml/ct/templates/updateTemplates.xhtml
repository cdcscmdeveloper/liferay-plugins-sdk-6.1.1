<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="contentSection">
	     <p:panel id="ctTemplate" header="#{lbl['lbl.ct.tpl.name']}" toggleable="true"  toggleSpeed="500">
            <h:panelGrid columns="2" columnClasses="columnWidth15">
               <p:outputLabel value="#{lbl['lbl.ct.tpl.name']}"/>
               <p:inputText value="#{contractTemplateBackingBean.managedBean.ctTemplate.name}" style="width:500px;"/>
             <h:panelGroup>
			     <div style="height: 220px; vertical-align: top">
               <p:outputLabel for="editorId" value="#{lbl['lbl.ct.enter.content']}"/>  
               </div>
               </h:panelGroup>
                <h:panelGrid>
               <p:editor id="editorId" value="#{contractTemplateBackingBean.convertStrValue(contractTemplateBackingBean.managedBean.ctTemplate.content)}" 
               width="1020" height="400"></p:editor>
            </h:panelGrid>
            </h:panelGrid>
            <div class="ppRightBtn"> 
			      <p:commandButton value="#{lbl['lbl.btn.submit']}" icon="ui-icon-submit"   action="#{contractTemplateBackingBean.updateTemplate()}" update="@form" />
			</div>
         </p:panel>
   </ui:define>
</ui:composition>
