<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="contentSection">
	     <p:panel id="ctTemplate" header="#{lbl['lbl.ct.tpl.name']}" toggleable="true"  toggleSpeed="500">
            <h:panelGrid columns="2">
               <p:outputLabel value="#{lbl['lbl.ct.tpl.name']}"/>
               <p:inputText value="#{contractTemplateBackingBean.managedBean.ctTemplate.name}" style="width:250px;"/>
               <p:outputLabel value="#{lbl['lbl.ct.tpl.category']}"/>
               <p:selectOneMenu id="fromMonth"  style="width:180px;" >
		            <f:selectItem itemLabel="-Select One-" itemValue=""/>
            		<f:selectItem itemLabel="Cover Letter" itemValue="AG"/>
               </p:selectOneMenu>
             <h:panelGroup>
			     <div style="height: 220px; vertical-align: top">
               <p:outputLabel for="editorId" value="#{lbl['lbl.ct.tpl.content']}"/>  
               </div>
               </h:panelGroup>
                <h:panelGrid>
               <p:editor id="editorId" value="#{contractTemplateBackingBean.editorValue}" style="width:800px;"></p:editor>
            </h:panelGrid>
            </h:panelGrid>
            <div class="ppRightBtn"> 
			      <p:commandButton value="Submit" icon="ui-icon-submit"   action="#{contractTemplateBackingBean.updateTemplate()}" update="@form" />
			</div>
         </p:panel>
   </ui:define>
</ui:composition>
