<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="contentSection">
      <h:form id="form">  
	     <p:panel id="ctTemplate" header="#{lbl['lbl.ct.tpl.name']}" toggleable="true"  toggleSpeed="500">
            <h:panelGrid columns="2" columnClasses="columnWidth15">
               <p:outputLabel value="#{lbl['lbl.ct.tpl.name']}"/>
               <p:inputText value="#{contractTemplateBackingBean.managedBean.ctTemplate.name}" style="width:500px;"/>
               <h:panelGroup>
			     <div style="height: 220px; vertical-align: top">
               <p:outputLabel value="#{lbl['lbl.ct.enter.content']}"/>  
               </div>
               </h:panelGroup>
                 <p:editor id="editor" value="#{contractTemplateBackingBean.editorValue}" width="1020" height="400" />
              </h:panelGrid>
              <div class="ppRightBtn"> 
			      <p:commandButton id="submitButton" value="#{lbl['lbl.btn.submit']}"  action="#{contractTemplateBackingBean.createTemplate()}" icon="ui-icon-submit" />
			      <p:commandButton value="#{lbl['lbl.btn.cancel']}" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" />
		    	</div>
         </p:panel>
        </h:form>
   </ui:define>
</ui:composition>
