<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="contentSection">
	     <p:panel id="ctTemplate" header="#{lbl['lbl.ct.tpl.name']}" toggleable="true"  toggleSpeed="500">
            <h:panelGrid columns="2">
               <p:outputLabel value="#{lbl['lbl.ct.tpl.name']}"/>
               <p:inputText value="#{contractTemplateBackingBean.managedBean.ctTemplate.name}" size="40"/>
             <h:panelGroup>
			     <div style="height: 220px; vertical-align: top">
               <p:outputLabel value="#{lbl['lbl.ct.tpl.content']}"/>  
               </div>
               </h:panelGroup>
               <p:editor value="#{contractTemplateBackingBean.editorValue}" style="width:650px;"></p:editor>
            </h:panelGrid>
            <h:panelGrid style="width:600px" columnClasses="column-align-right">
			      <p:commandButton value="Submit" icon="ui-icon-add"   action="#{contractTemplateBackingBean.createTemplate()}" update="@form" />
			</h:panelGrid>
         </p:panel>
   </ui:define>
</ui:composition>
