							</p:columnGroup>

						  <p:dataTable id="dataTable1" var="data"  value="" rowIndexVar="index" widgetVar="dataTableObj"

	                         currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
