<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	
   	       
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/fulfilmentDetails/shared/sideMenu/menuAmend.xhtml" />
	</ui:define>

	<ui:define name="content">
		      
        	<h:form prependId="false" id="form">         
        	    
        	       <p:messages showDetail="true" globalOnly="true"/> 
        	       
                     <p:panel id="agencyId" header="Agency Details"   toggleable="true"  toggleSpeed="500" widgetVar="panelagency">
                      
                          <div style="overflow-x:auto">
			                               
			                               <p:dataTable id="dataTable" var="data" value=" " rowIndexVar="index"
							               widgetVar="dataTableObj" lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom"
							               paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" rowsPerPageTemplate="5,10,15,20"
							               currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row> 
									                     <p:column rowspan="1" headerText="PTJ Code"  />
									                     <p:column colspan="1" headerText="PTJ Name"  /> 
									                     <p:column colspan="1" headerText="Ceiling Amount (MYR)" /> 
									                     <p:column colspan="1" headerText="Action" /> 	
									                
								               </p:row>							
								
							
							                </p:columnGroup>
							                    
							                     <p:column></p:column>	
							                     <p:column></p:column>	
							                     <p:column > </p:column> 							
							                     <p:column styleClass="column-align-center">
								                       <p:commandButton title="delete" onsuccess="confirmation.show()"
									                     partialSubmit="true" process="@this" icon="ui-icon-delete">
			                                 			</p:commandButton>
							                    </p:column>
							               </p:dataTable>
						            </div>
                        
							               <h:panelGrid style="width:780px" columnClasses="column-align-right">
							                       <p:commandButton value="Add" styleClass="text-align: right;" process="@this" partialSubmit="true" 
							                       icon="ui-icon-add"   onclick="dlg2.show();">
											</p:commandButton>
					                  	   </h:panelGrid>
                         </p:panel>
                                    
              
                       <p:confirmDialog message="Do you want to delete the record?"
							closable="true" appendToBody="true" header="Delete Confirmation"
							severity="alert" widgetVar="confirmation">

							<h:panelGrid columns="2"
								columnClasses="column-align-right,column-align-left">
								<p:commandButton value="Yes" icon="ui-icon-accept"
									update="dataTable" partialSubmit="true" process="@this"
									onclick="confirmation.hide();"/>
								    <p:commandButton value="No" icon="ui-icon-reject"
									onclick="confirmation.hide()" type="button" />
							</h:panelGrid>
						</p:confirmDialog>

                   <p:dialog id="modalDialog" header="Add PTJ" widgetVar="dlg2" modal="true" width="600" height="400">
					<p:panel  id="agencyies">

						<h:panelGrid columns="2">
						
							<h:outputLabel  value="Ministry" />
            				<p:selectOneMenu  value=" " style="width:210px">
            				   <f:selectItem itemLabel="--Please Select--" itemValue="" /> 
                				<f:selectItems value="" />
                			</p:selectOneMenu>
							
							<h:outputLabel  value="Department" />
            				<p:selectOneMenu   value="" style="width:210px" >
            					<f:selectItem itemLabel="--Please Select--" itemValue="" /> 
                				<f:selectItems value="" />
                			</p:selectOneMenu>
						</h:panelGrid>

			

						<p:dataTable id="dataTable2" var="data" value="#{contractDetailsBean.agencyLists}" rowIndexVar="index" widgetVar="dataTableObj"
                         lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" 
                         emptyMessage="No Records!" rows="10"  rowsPerPageTemplate="5,10,15,20" 
                         selection="#{agencyDetailsBean.selectedAgencyList}" rowKey="#{data.ptjCode}"
                         currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
                         paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
                			
                			<p:column selectionMode="multiple" style="width:18px" />
							
							
							<p:column headerText="No.">
								<h:outputText value="#{index+1}" />
							</p:column>

	                         <p:column headerText="PTJ Code">
								
							</p:column>

							<p:column headerText="PTJ Name" >
								
							</p:column>
							
							
						</p:dataTable>

						<f:facet name="footer">
							<h:panelGrid columns="2"  style="height: 40px;vertical-align: middle;">
								<p:commandButton value="Select"   process="modalDialog" update="dataTable,modalDialog" onclick="dlg2.hide();"/>
                            	<p:commandButton value="Cancel"  type="button" ajax="false" onclick="dlg2.hide();" />
						</h:panelGrid>
						</f:facet>

					</p:panel>
				</p:dialog>
				</h:form>
				</ui:define>
				</ui:composition>
