<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	
   	       
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/fulfilmentDetails/shared/sideMenu/menuAmend.xhtml" />
	</ui:define>

	<ui:define name="content">
		      
        	<h:form prependId="false" id="form">         
        	       <p:messages showDetail="true" globalOnly="true"/> 
		      
        	        
        	       
                     <p:panel id="itemId" header="Item Details"   toggleable="true"  toggleSpeed="500" widgetVar="panelitem">
                                           
                                          <p:messages showDetail="true" globalOnly="true"/>
                                        
			                               
			                               <p:dataTable id="dataTable" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row> 
									                  
									                   
									                     <p:column colspan="1"  style="width:80px" headerText="Item Code" /> 
									                     <p:column colspan="1"  style="width:320px" headerText="Item Name" /> 	
									                     <p:column colspan="1" style="width:100px" headerText="Origin Country"  /> 
									                     <p:column colspan="1"  style="width:70px" headerText="Price UOM" /> 	
									                     <p:column colspan="1" style="width:50px" headerText="Exempted"  /> 
									                     <p:column colspan="1" style="width:70px" headerText="Action"  /> 
									                    
								               </p:row>							
								
							
							                </p:columnGroup>
							                   				
							             <p:column></p:column>       
						                   <p:column></p:column>       
						                    <p:column></p:column>       
						                      <p:column></p:column>       
						                      <p:column styleClass="column-align-center">
						                       <p:selectBooleanCheckbox value=""/> 
                                              </p:column>       
						                      <p:column styleClass="column-align-center">
						                         <p:commandButton title="Edit" partialSubmit="true" process="@this" 
								                 icon="ui-icon-edit" styleClass="ui-icon-button"/>
								                 <p:spacer width="2"></p:spacer>
								                 <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
								                 icon="ui-icon-delete" styleClass="ui-icon-button"/>
							                     </p:column>  
						       
							                     
							               </p:dataTable>
							               
							       
						           
						            
						    <h:panelGrid columns="2" style="height:100px;text-align:bottom;">
							  <h:outputLabel for="show" value="Show" style="width:100px;" styleClass="txtsize"/>  
                                         <p:selectOneMenu id="show" disabled="false"  value="#{fulfilmentBackingBean.createContractDetails.zoneType}"  style="width:200px;">
            					        <f:selectItem itemLabel="--Please Select--" itemValue="--Please Select--" /> 
            					         <f:selectItems value="#{fulfilmentBackingBean.itemDetailsMethod}" />
            					         <p:ajax event="change" update="changeField" listener="#{fulfilmentBackingBean.changeField}" process="@this"/>  
	                               </p:selectOneMenu>         
	                        <p:message for="show"/>  
                				      
						</h:panelGrid>
						</p:panel>
						
						
						    <p:outputPanel id="changeField"> 
						  
						         <h:panelGrid columns="1" style="width:800px"
						          rendered="#{fulfilmentBackingBean.itemZonal or fulfilmentBackingBean.itemTier or fulfilmentBackingBean.itemZonalTier or fulfilmentBackingBean.itemCeilingQuantity}">
						         <p:panel id="itemZoneId"  header="#{fulfilmentBackingBean.createContractDetails.zoneType}"  toggleable="true"  toggleSpeed="500" widgetVar="panelitemzone">
						  
						          <p:dataTable id="dataTable1"  var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header">
								<p:row rendered="#{fulfilmentBackingBean.itemZonal}">

									<p:column colspan="1" style="width:100px" headerText="Zone" />
									<p:column colspan="1" style="width:50px" headerText="From Qty" />
									<p:column colspan="1" style="width:50px" headerText="To Qty" />
									<p:column colspan="1" style="width:100px" headerText="Price (MYR)" />
									<p:column colspan="1" style="width:150px" headerText="Effective Date" />
									<p:column colspan="1" style="width:150px" headerText="Expirey Date" />
									<p:column colspan="1" style="width:100px" headerText="Action" />
								</p:row>

								<p:row  rendered="#{fulfilmentBackingBean.itemTier}"> 
									                  
									                    <p:column colspan="1" style="width:100px" headerText="Zone" />
									<p:column colspan="1" style="width:50px" headerText="From Qty" />
									<p:column colspan="1" style="width:50px" headerText="To Qty" />
									<p:column colspan="1" style="width:100px" headerText="Price (MYR)" />
									<p:column colspan="1" style="width:150px" headerText="Effective Date" />
									<p:column colspan="1" style="width:150px" headerText="Expirey Date" />
									<p:column colspan="1" style="width:100px" headerText="Action" />
									           </p:row>	
									           
									            <p:row  rendered="#{fulfilmentBackingBean.itemZonalTier}"> 
									                  
									                   <p:column colspan="1" style="width:100px" headerText="Zone" />
									<p:column colspan="1" style="width:50px" headerText="From Qty" />
									<p:column colspan="1" style="width:50px" headerText="To Qty" />
									<p:column colspan="1" style="width:100px" headerText="Price (MYR)" />
									<p:column colspan="1" style="width:150px" headerText="Effective Date" />
									<p:column colspan="1" style="width:150px" headerText="Expirey Date" />
									<p:column colspan="1" style="width:100px" headerText="Action" />
									           </p:row>		
									           
									           <p:row  rendered="#{fulfilmentBackingBean.itemCeilingQuantity}"> 
									                  
									                     <p:column colspan="1" style="width:100px" headerText="Ministry Name"   /> 
									                     <p:column colspan="1"  style="width:100px" headerText="Jabatan Name" /> 
									                        <p:column colspan="1"  style="width:100px" headerText="PTJ Name" /> 
									                      <p:column colspan="1"  style="width:100px" headerText="Ceiling Quantity" /> 
									                    
									           </p:row>								
								
							
							                </p:columnGroup>
							                   				
							             <p:column rendered="#{!fulfilmentBackingBean.itemCeilingQuantity}"></p:column>       
						                  <p:column rendered="#{!fulfilmentBackingBean.itemCeilingQuantity}"></p:column>       
							               <p:column rendered="#{!fulfilmentBackingBean.itemCeilingQuantity}"></p:column>              
							                 <p:column rendered="#{!fulfilmentBackingBean.itemCeilingQuantity}"></p:column>            
							                  <p:column rendered="#{!fulfilmentBackingBean.itemCeilingQuantity}">
							                    <p:calendar style="width:130px;" value="#{searchDetailsBean.searchDetails.date}" id="popupButtonCal" showOn="button" />
							                    </p:column>       
							                   <p:column rendered="#{!fulfilmentBackingBean.itemCeilingQuantity}">
							                     <p:calendar style="width:130px;" value="#{searchDetailsBean.searchDetails.date}" id="popupButtonCal1" showOn="button" />
							                     </p:column>       
							                     <p:column styleClass="column-align-center" rendered="#{!fulfilmentBackingBean.itemCeilingQuantity}">
							                    <p:commandButton title="Add" partialSubmit="true" process="@this" 
								                 icon="ui-icon-add1" styleClass="ui-icon-button"/>
								                 <p:spacer width="2"></p:spacer>
						                         <p:commandButton title="Edit" partialSubmit="true" process="@this" 
								                 icon="ui-icon-edit" styleClass="ui-icon-button"/>
								                 <p:spacer width="2"></p:spacer>
								                 <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
								                 icon="ui-icon-delete" styleClass="ui-icon-button"/>
							                     </p:column>          
							               </p:dataTable>
							                </p:panel>
		                        
	                        </h:panelGrid>  
	                        
	                        
						    
						    </p:outputPanel>
                                    
                  <p:confirmDialog message="Do you want to delete the record?"
							closable="true" appendToBody="true" header="Delete Confirmation"
							severity="alert" widgetVar="confirmation">

							<h:panelGrid columns="2"
								columnClasses="column-align-right-50,column-align-left">
								<p:commandButton value="Yes" 
									update="dataTable" partialSubmit="true" process="@this"
									onclick="confirmation.hide();"/>
								<p:commandButton value="No" 
									onclick="confirmation.hide()" type="button" />
							</h:panelGrid>
						</p:confirmDialog>                          
               
              
	</h:form>
	</ui:define>
	</ui:composition>
