<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	
   	       
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/fulfilmentDetails/shared/sideMenu/menuFulfilment.xhtml" />
	</ui:define>

	<ui:define name="content">
		      
        	<h:form prependId="false" id="form">         
        	       <p:messages showDetail="true" globalOnly="true"/> 
		      
        	        
        	       
                     <p:panel id="itemId" header="Item Details"   toggleable="true"  toggleSpeed="500" widgetVar="panelitem">
                                           
                                          <p:messages showDetail="true" globalOnly="true"/>
                                        
			                               
			                               <p:dataTable id="dataTable" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row> 
									                  
									                     <p:column colspan="1" style="width:70px" headerText="Item Type"  /> 
									                     <p:column colspan="1"  style="width:80px" headerText="Item Code" /> 
									                     <p:column colspan="1"  style="width:120px" headerText="Item Name" /> 	
									                     <p:column colspan="1" style="width:120px" headerText="Supplier's SKU"  /> 
									                     <p:column colspan="1" style="width:100px" headerText="Origin Country"  /> 
									                     <p:column colspan="1"  style="width:70px" headerText="Currency" /> 
									                     <p:column colspan="1"  style="width:70px" headerText="Price" /> 	
									                     <p:column colspan="1" style="width:70px" headerText="UOM"  /> 
									                     <p:column colspan="1" style="width:70px" headerText="Minimum Order"  /> 
									                    
								               </p:row>							
								
							
							                </p:columnGroup>
							                   				
							             <p:column></p:column>       
						
							                     
							                     
							                     
							               </p:dataTable>
							               
							               
						           
						            
						    <h:panelGrid columns="2" style="height:70px;text-align:bottom;">
							  <h:outputLabel for="show" value="Show" style="width:100px;" styleClass="txtsize"/>  
                                         <p:selectOneMenu id="show" disabled="false"  value="#{contractDetailsBean.createContractDetails.zoneType}"  style="width:200px;">
            					        <f:selectItem itemLabel="--Please Select--" itemValue="--Please Select--" /> 
            					         <f:selectItems value="#{contractDetailsBean.itemDetailsMethod}" />
            					         <p:ajax event="change" update="changeField" listener="#{contractDetailsBean.changeField}" process="@this"/>  
	                               </p:selectOneMenu>         
	                        <p:message for="show"/>  
                				      
						</h:panelGrid>
						</p:panel>
						
						
						    <p:outputPanel id="changeField"> 
						  
						         <h:panelGrid columns="1" style="width:800px"
						          rendered="#{contractDetailsBean.itemZonal or contractDetailsBean.itemTier or contractDetailsBean.itemZonalTier or contractDetailsBean.itemCeilingQuantity}">
						         <p:panel id="itemZoneId"  header="#{contractDetailsBean.createContractDetails.zoneType}"  toggleable="true"  toggleSpeed="500" widgetVar="panelitemzone">
						  
						          <p:dataTable id="dataTable1"  var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row  rendered="#{contractDetailsBean.itemZonal}"> 
									                  
									                     <p:column colspan="1" style="width:100px" headerText="Zone"   /> 
									                     <p:column colspan="1"  style="width:100px" headerText="Currency" /> 
									                     <p:column colspan="1"  style="width:200px" headerText="Price Effective Date" /> 	
									                     <p:column colspan="1" style="width:150px" headerText="Expirey Date"  /> 
									           </p:row>	
									           
									           <p:row  rendered="#{contractDetailsBean.itemTier}"> 
									                  
									                     <p:column colspan="1" style="width:100px" headerText="Quantity From"   /> 
									                     <p:column colspan="1"  style="width:100px" headerText="Quantity To" /> 
									                      <p:column colspan="1"  style="width:100px" headerText="Currency" /> 
									                     <p:column colspan="1"  style="width:200px" headerText="Price Effective Date" /> 	
									                     <p:column colspan="1" style="width:150px" headerText="Expirey Date"  /> 
									           </p:row>	
									           
									            <p:row  rendered="#{contractDetailsBean.itemZonalTier}"> 
									                  
									                     <p:column colspan="1" style="width:100px" headerText="Zone"   /> 
									                     <p:column colspan="1"  style="width:100px" headerText="Quantity From" /> 
									                        <p:column colspan="1"  style="width:100px" headerText="Quantity To" /> 
									                      <p:column colspan="1"  style="width:100px" headerText="Currency" /> 
									                     <p:column colspan="1"  style="width:200px" headerText="Price Effective Date" /> 	
									                     <p:column colspan="1" style="width:150px" headerText="Expirey Date"  /> 
									           </p:row>		
									           
									           <p:row  rendered="#{contractDetailsBean.itemCeilingQuantity}"> 
									                  
									                     <p:column colspan="1" style="width:100px" headerText="Ministry Name"   /> 
									                     <p:column colspan="1"  style="width:100px" headerText="Jabatan Name" /> 
									                        <p:column colspan="1"  style="width:100px" headerText="PTJ Name" /> 
									                      <p:column colspan="1"  style="width:100px" headerText="Ceiling Quantity" /> 
									                    
									           </p:row>								
								
							
							                </p:columnGroup>
							                   				
							             <p:column ></p:column>       
						
							                     
							                     
							                     
							               </p:dataTable>
							                </p:panel>
		                        
	                        </h:panelGrid>  
	                        
	                        
						    
						    </p:outputPanel>
                                    
                                    
               
              
	</h:form>
	</ui:define>
	</ui:composition>
