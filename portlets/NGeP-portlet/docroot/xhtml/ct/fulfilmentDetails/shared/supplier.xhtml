            <h:panelGrid columns="2" style="width:800px;">

                                                <h:outputLabel  value="#{lbl['lbl.supplier.email']}" style="width:200px;" styleClass="txtsize"/>

                                                   <h:outputLabel  value="#{lbl['lbl.supplier.tel.hp']}" style="width:200px;" styleClass="txtsize"/>

                                                   <h:panelGroup>
										             <div style="height: 100px; vertical-align: top">
											              <p:outputLabel for="supplierAddress" value="#{lbl['lbl.supplier.address']}" styleClass="txtsize" />
										             </div>
									            </h:panelGroup>

										        rows="3" cols="28"   maxlength="100"  autoResize="false" />
										        
									           </h:panelGrid>
                                                 
                                          
                                               </h:panelGrid>  
                                               
                                          <h:panelGrid columns="2" style="width:400px;" class="formTable">  
                                          
                                                   <h:outputLabel for="sName" value="#{lbl['lbl.supplier.name']}"  style="width:200px;" styleClass="txtsize"/>  
                                                  <p:inputText  value="#{contractDetailsBean.supplierBankDetails.supplierName}" required="true" 
                                                         disabled="true" style="width:200px;" />  
                                      
                                                  <h:outputLabel  value="#{lbl['lbl.bank.name']}" style="width:200px;" styleClass="txtsize"/>  
                                                  <p:inputText  value="#{contractDetailsBean.supplierBankDetails.bankName}" required="true" 
                                                  disabled="true" style="width:200px;" />  
                                         
                                                  <h:outputLabel  value="#{lbl['lbl.bank.branch']}" style="width:200px;" styleClass="txtsize"/>  
                                                  <p:inputText  value="#{contractDetailsBean.supplierBankDetails.bankBranch}" required="true" disabled="true" 
                                                  style="width:200px;" />
                                         
                                                  <h:outputLabel  value="#{lbl['lbl.bank.acc.no']}" style="width:200px;" styleClass="txtsize"/>  
                                                  <p:inputText  value="#{contractDetailsBean.supplierBankDetails.accountNo}" required="true" disabled="true" 
                                                  style="width:200px;" />
                                         
                                                
                                                
                                                
									              
									              <h:panelGroup>
										             <div style="height: 90px; vertical-align: top">
											              <p:outputLabel for="bankAddress" value="#{lbl['lbl.bank.address']}" styleClass="txtsize" />
										             </div>
									</h:panelGroup>
									<h:panelGrid>
										<p:inputTextarea id="bankAddress" 
											value="#{contractDetailsBean.supplierBankDetails.bankAddress}" disabled="true" required="false" rows="3" cols="28"

									</h:panelGrid>
