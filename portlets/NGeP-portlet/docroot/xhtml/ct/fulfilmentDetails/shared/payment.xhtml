<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
  
   
   
            <h:panelGrid style="width:800px">
			                               <p:dataTable id="dataTable" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row> 
									                  
									                     <p:column colspan="1" style="width:150px" headerText="Fulfillment No."  /> 
									                     <p:column colspan="1"  style="width:300px" headerText="Pay to" /> 
									                     <p:column colspan="1"  style="width:150px" headerText="Invoice Date" /> 	
									                     <p:column colspan="1" style="width:100px" headerText="Invoice Amount (MYR)"  /> 
									                    
									                       
								               </p:row>	
								               						
								            </p:columnGroup>
							                   				
							             <p:column>
							             <p:commandLink id="fulfillmentNo" style="margin-right:20px;" process="@this"  partialSubmit="true" 
							             immediate="true" actionListener="#{contractDetailsBean.changePaymentValue}">  
							             
                                          <h:outputText value="#{contractDetailsBean.fulfillmentNo}"  styleClass="linkcommand"/>  
                                          </p:commandLink>  
							             </p:column>       
						
							                     
							                     
							                     
							               </p:dataTable>
							               </h:panelGrid>
                                               
                                       
                                           <h:panelGrid style="width:600px">
                                          
                                           <h:outputLabel  value="Summary" style="width:100px;hight:50px;"/>  
                                          
                                           <p:dataTable id="dataTable1" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row> 
									                  
									                     <p:column colspan="1" style="width:200px" headerText="Description"  /> 
									                     <p:column colspan="1"  style="width:150px" headerText="Amount(MYR)" /> 
									                    
									                    
									                       
								               </p:row>	
								               						
								            </p:columnGroup>
								            <p:column></p:column>
                                          </p:dataTable>
                                           </h:panelGrid>
</ui:composition>
