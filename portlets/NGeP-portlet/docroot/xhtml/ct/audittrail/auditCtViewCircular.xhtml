<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<h:head>
		<script>
			$('#portlet_ctContractMaintenance_WAR_NGePportlet').find('.portlet-title-text').html('#{auditContractBackingBean.getPortletTitle()}');
		</script>
		<style>
/* Tabel Utama */
.custom-table {
	border-collapse: collapse;
	border: 0;
	cellspacing: 0;
	cellpadding: 0;
	width: 100%;
	table-layout: fixed;
}

/* Kolom Rata Kanan */
.column-align-right {
	text-align: right !important;
}

/* Mencegah Teks Panjang Meluap */
.truncate-text {
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}

.sidemenu {
	width: 250px; /* Sesuaikan dengan kebutuhan */
	word-wrap: break-word;
}

.sidemenu .ui-menuitem-text {
	white-space: normal !important;
	word-wrap: break-word;
	display: block;
	text-align: left;
}
</style>
	</h:head>



	<!-- PanelGrid for Tab-Like Buttons -->
	<p:panel header="#{lbl['lbl.audit.panel.view']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td>
					<div align="right" style="width: 100%">
						<p:commandLink value="#{lbl['lbl.btn.print']}" ajax="false">
							<p:fileDownload
								value="#{auditContractBackingBean.generateReport(auditContractBackingBean.managedBean.docId, auditContractBackingBean.managedBean.auTabView)}"
								immediate="true" onstart="blockWidget.show();"
								oncomplete="blockWidget.hide();" />
						</p:commandLink>
						&#160;
						<p:commandLink value="#{lbl['lbl.btn.download']}" ajax="false">
							<p:fileDownload
								value="#{auditContractBackingBean.getAuditTrailDetailsForExlRpt(auditContractBackingBean.managedBean.docId, auditContractBackingBean.managedBean.auTabView,auditContractBackingBean.managedBean.ctType)}" />
						</p:commandLink>
						&#160;
					</div>
				</td>
			</tr>
		</table>
		<table class="custom-table">
			<tr>
				<!-- SideTab Menu -->
				<td width="20%;" valign="top" class="sidemenutd"><p:tabMenu
						id="sidemenuCircularId" styleClass="sidemenu"
						rendered="#{auditContractBackingBean.managedBean.ctType eq 'CCR' }"
						activeIndex="#{auditContractBackingBean.managedBean.activeTab}">

						<p:menuitem value="#{lbl['lbl.ct.audit.tab.central.contract']}"
							actionListener="#{auditContractBackingBean.handleButtonClick(0)}"
							update="@form" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()">
						</p:menuitem>

						<p:menuitem style="white-space:normal;"
							value="#{lbl['lbl.ct.audit.tab.purchase.in.default']}"
							actionListener="#{auditContractBackingBean.handleButtonClick(1)}"
							update="@form" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()">
						</p:menuitem>

						<p:menuitem style="white-space:normal;"
							value="#{lbl['lbl.ct.audit.tab.contact.person.details']}"
							actionListener="#{auditContractBackingBean.handleButtonClick(2)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							update="@form">
						</p:menuitem>

						<p:menuitem style="white-space:normal;"
							value="#{lbl['lbl.ct.audit.tab.exempted.ministry']}"
							actionListener="#{auditContractBackingBean.handleButtonClick(3)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							update="@form">
						</p:menuitem>

						<p:menuitem style="white-space:normal;"
							value="#{lbl['lbl.ct.audit.tab.related.cancelled.treasury']}"
							actionListener="#{auditContractBackingBean.handleButtonClick(4)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							update="@form">
						</p:menuitem>

						<p:menuitem style="white-space:normal;"
							value="#{lbl['lbl.ct.audit.tab.contract.list']}"
							actionListener="#{auditContractBackingBean.handleButtonClick(5)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							update="@form">
						</p:menuitem>
					</p:tabMenu> <!-- SideTab Panel Circular --> <p:tabMenu id="sidemenuPanelId"
						styleClass="sidemenu"
						rendered="#{auditContractBackingBean.managedBean.ctType eq 'PCR' }"
						activeIndex="#{auditContractBackingBean.managedBean.activeTab}">

						<p:menuitem style="white-space:normal;"
							value="#{lbl['lbl.ct.audit.tab.panel.contract']}"
							actionListener="#{auditContractBackingBean.handleButtonClick(0)}"
							update="@form" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()">
						</p:menuitem>

						<p:menuitem style="white-space:normal;"
							value="#{lbl['lbl.ct.audit.tab.purchase.in.default']}"
							actionListener="#{auditContractBackingBean.handleButtonClick(1)}"
							update="@form" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()">
						</p:menuitem>

						<p:menuitem style="white-space:normal;"
							value="#{lbl['lbl.ct.audit.tab.contact.person.details']}"
							actionListener="#{auditContractBackingBean.handleButtonClick(2)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							update="@form">
						</p:menuitem>

						<p:menuitem style="white-space:normal;"
							value="#{lbl['lbl.ct.audit.tab.related.cancelled.treasury']}"
							actionListener="#{auditContractBackingBean.handleButtonClick(3)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							update="@form">
						</p:menuitem>

						<p:menuitem style="white-space:normal;"
							value="#{lbl['lbl.ct.audit.tab.item.details']}"
							actionListener="#{auditContractBackingBean.handleButtonClick(4)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							update="@form">
						</p:menuitem>

						<p:menuitem style="white-space:normal;"
							value="#{lbl['lbl.ct.audit.tab.item.supplier']}"
							actionListener="#{auditContractBackingBean.handleButtonClick(5)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							update="@form">
						</p:menuitem>
					</p:tabMenu></td>

				<td width="80%" valign="top"><p:outputPanel>
						<p:dataTable id="searchCircularId" var="obj" rows="10"
							width="100%" value="#{auditContractBackingBean.searchCT}"
							rowIndexVar="index" lazy="true">

							<ac:paginator for="searchCTId"></ac:paginator>

							<p:column headerText="#{lbl['lbl.audit.header.action.date']}"
								style="white-space: normal!important;" width="5%">
								<h:outputText value="#{obj.createdDate}">
									<f:convertDateTime
										pattern="#{CommonConstants.getDefault12hrDatetimesecondFormat()}" />
								</h:outputText>
							</p:column>

							<p:column headerText="#{lbl['lbl.audit.header.action.type']}"
								style="white-space: normal!important;" width="5%">
								<h:outputText value="#{obj.actionType}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.audit.header.action.by']}"
								style="white-space: normal!important;" width="5%">
								<h:outputText value="#{obj.actionBy}" escape="false" />
							</p:column>

							<p:column headerText="#{lbl['lbl.audit.header.org.name']}"
								style="white-space: normal!important;" width="10%">
								<h:outputText value="#{obj.orgName}" escape="false" />
							</p:column>

							<p:column headerText="#{lbl['lbl.audit.header.role']}"
								style="width :5%">
								<h:outputText value="#{obj.roleName}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.audit.header.docType']}"
								style="width :5%">
								<h:outputText value="#{obj.docType}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.audit.header.docNo']}"
								style="width :10%">
								<h:outputText value="#{obj.docNo}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.audit.header.subDocNo']}"
								style="white-space: pre-line;" width="40%">
								<h:outputText value="#{obj.subDocNo}" escape="false" />
							</p:column>

							<p:column headerText="#{lbl['lbl.audit.header.fieldName']}"
								style="width :5%">
								<h:outputText value="#{obj.fieldName}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.audit.header.oldValue']}"
								style="width :5%">
								<h:outputText value="#{obj.oldValue}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.audit.header.newValue']}"
								style="width :5%">
								<h:outputText value="#{obj.newValue}" />
							</p:column>

						</p:dataTable>
					</p:outputPanel></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
