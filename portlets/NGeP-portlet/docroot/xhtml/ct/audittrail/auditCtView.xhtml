<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ac="http://ac.my/jsf/composite/cc">

    <!-- CONTRACT type audit view -->
    <ui:fragment rendered="#{auditContractBackingBean.managedBean.ctType eq 'CONTRACT'}">
        <p:panel header="#{lbl['lbl.audit.panel.view']}" toggleable="true">

            <!-- Print & Download buttons -->
            <div style="text-align: right; margin-bottom: 10px;">
                <p:commandLink value="#{lbl['lbl.btn.print']}" ajax="false">
                    <p:fileDownload
                        value="#{auditContractBackingBean.generateReport(
                                auditContractBackingBean.managedBean.docId, 
                                auditContractBackingBean.managedBean.auTabView, 
                                auditContractBackingBean.managedBean.ctType)}"
                        immediate="true" 
                        onstart="blockWidget.show();" 
                        oncomplete="blockWidget.hide();" />
                </p:commandLink>
                &#160;
                <p:commandLink value="#{lbl['lbl.btn.download']}" ajax="false">
                    <p:fileDownload
                        value="#{auditContractBackingBean.getAuditTrailDetailsForExlRpt(
                                auditContractBackingBean.managedBean.docId, 
                                auditContractBackingBean.managedBean.auTabView, 
                                auditContractBackingBean.managedBean.ctType)}" />
                </p:commandLink>
            </div>

            <!-- Tab menu -->
            <h:panelGroup id="searchViewId">
                <p:tabMenu id="sidemenuId"
                           activeIndex="#{auditContractBackingBean.managedBean.activeTab}"
                           styleClass="equal-width-tabs">

                    <p:menuitem value="#{lbl['lbl.ct.audit.tab.contract.summary']}"
                                actionListener="#{auditContractBackingBean.handleButtonClick(0)}"
                                update="searchViewId"
                                onstart="blockWidget.show()"
                                oncomplete="blockWidget.hide()" />
                    <p:menuitem value="#{lbl['lbl.ct.audit.tab.zone.details']}"
                                actionListener="#{auditContractBackingBean.handleButtonClick(1)}"
                                update="searchViewId"
                                onstart="blockWidget.show()"
                                oncomplete="blockWidget.hide()" />
                    <p:menuitem value="#{lbl['lbl.ct.audit.tab.agency.details']}"
                                actionListener="#{auditContractBackingBean.handleButtonClick(2)}"
                                update="searchViewId"
                                onstart="blockWidget.show()"
                                oncomplete="blockWidget.hide()" />
                    <p:menuitem value="#{lbl['lbl.ct.audit.tab.product.details']}"
                                actionListener="#{auditContractBackingBean.handleButtonClick(3)}"
                                update="searchViewId"
                                onstart="blockWidget.show()"
                                oncomplete="blockWidget.hide()" />
                    <p:menuitem value="#{lbl['lbl.ct.audit.tab.service.details']}"
                        		actionListener="#{auditContractBackingBean.handleButtonClick(4)}"
                        		update="searchViewId" 
                        		onstart="blockWidget.show()"
                        		oncomplete="blockWidget.hide()" />
                    <p:menuitem value="#{lbl['lbl.ct.audit.tab.deduction.details']}"
                        		actionListener="#{auditContractBackingBean.handleButtonClick(5)}"
                        		update="searchViewId" 
                        		onstart="blockWidget.show()"
                        		oncomplete="blockWidget.hide()" />
                    <p:menuitem value="#{lbl['lbl.ct.audit.tab.schedule.details']}"
                        		actionListener="#{auditContractBackingBean.handleButtonClick(6)}"
                        		update="searchViewId" 
                        		onstart="blockWidget.show()"
                        		oncomplete="blockWidget.hide()" />
                    <p:menuitem
                        		value="#{lbl['lbl.ct.audit.tab.performancebond.details']}"
                        		actionListener="#{auditContractBackingBean.handleButtonClick(7)}"
                        		update="searchViewId" 
                        		onstart="blockWidget.show()"
                        		oncomplete="blockWidget.hide()" />
                    <p:menuitem
                        		value="#{lbl['lbl.ct.audit.tab.performancebond.deferment']}"
                        		actionListener="#{auditContractBackingBean.handleButtonClick(8)}"
                        		update="searchViewId" 
                        		onstart="blockWidget.show()"
                        		oncomplete="blockWidget.hide()" />
                    <p:menuitem
                        		value="#{lbl['lbl.ct.audit.tab.item.details.suspension']}"
                        		actionListener="#{auditContractBackingBean.handleButtonClick(9)}"
                        		update="searchViewId" 
                        		onstart="blockWidget.show()"
                        		oncomplete="blockWidget.hide()" />
                    <p:menuitem
                        		value="#{lbl['lbl.ct.audit.tab.agency.details.suspension']}"
                        		actionListener="#{auditContractBackingBean.handleButtonClick(10)}"
                        		update="searchViewId" 
                        		onstart="blockWidget.show()"
                        		oncomplete="blockWidget.hide()" />
                    <p:menuitem value="#{lbl['lbl.ct.audit.tab.factoring.details']}"
                        		actionListener="#{auditContractBackingBean.handleButtonClick(11)}"
                        		update="searchViewId" 
                        		onstart="blockWidget.show()"
                        		oncomplete="blockWidget.hide()" />
                    <p:menuitem
                        		value="#{lbl['lbl.ct.audit.tab.contractmgm.module.ntf.setting']}"
                        		actionListener="#{auditContractBackingBean.handleButtonClick(12)}"
                        		update="searchViewId" 
                        		onstart="blockWidget.show()"
                        		oncomplete="blockWidget.hide()" />
                    <p:menuitem
                        		value="#{lbl['lbl.ct.audit.tab.fulfilment.module.ntf.setting']}"
                        		actionListener="#{auditContractBackingBean.handleButtonClick(13)}"
                        		update="searchViewId" 
                        		onstart="blockWidget.show()"
                        		oncomplete="blockWidget.hide()" />
                    <p:menuitem
                        		value="#{lbl['lbl.ct.audit.tab.new.contract.owner.details']}"
                        		actionListener="#{auditContractBackingBean.handleButtonClick(14)}"
                        		update="searchViewId" 
                        		onstart="blockWidget.show()"
                        		oncomplete="blockWidget.hide()" />
                </p:tabMenu>

                <!-- DataTable for CONTRACT -->
                <p:dataTable 
                    id="searchCTId" 
                    var="obj" 
                    value="#{auditContractBackingBean.searchCT}"
                    rows="10"
                    lazy="true"
                    paginator="true"
                    responsiveLayout="scroll"
                    styleClass="audit-table"
                    scrollHeight="400">

                    <ac:paginator for="searchCTId" />

                    <p:column headerText="#{lbl['lbl.audit.header.action.date']}" styleClass="col-action-date">
                        <h:outputText value="#{obj.createdDate}">
                            <f:convertDateTime pattern="#{CommonConstants.getDefault12hrDatetimesecondFormat()}" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="#{lbl['lbl.audit.header.action.type']}" styleClass="col-action-type">
                        <h:outputText value="#{obj.actionType}" />
                    </p:column>

                    <p:column headerText="#{lbl['lbl.audit.header.action.by']}" styleClass="col-action-by">
                        <h:outputText value="#{obj.actionBy}" escape="false" />
                    </p:column>

                    <p:column headerText="#{lbl['lbl.audit.header.org.name']}" styleClass="col-org-name">
                        <h:outputText value="#{obj.orgName}" escape="false" />
                    </p:column>

                    <p:column headerText="#{lbl['lbl.audit.header.role']}" styleClass="col-role">
                        <h:outputText value="#{obj.roleName}" />
                    </p:column>

                    <p:column headerText="#{lbl['lbl.audit.header.docType']}" styleClass="col-doc-type">
                        <h:outputText value="#{obj.docType}" />
                    </p:column>

                    <p:column headerText="#{lbl['lbl.audit.header.docNo']}" styleClass="col-doc-no">
                        <h:outputText value="#{obj.docNo}" />
                    </p:column>

                    <p:column headerText="#{lbl['lbl.audit.header.docStatus']}" styleClass="col-doc-status">
                        <h:outputText value="#{obj.docStatus}" escape="false" />
                    </p:column>

                    <p:column headerText="#{lbl['lbl.audit.header.fieldName']}" styleClass="col-field-name">
                        <h:outputText value="#{obj.fieldName}" />
                    </p:column>

                    <p:column headerText="#{lbl['lbl.audit.header.oldValue']}" styleClass="col-old-value">
                        <h:outputText value="#{obj.oldValue}" style="white-space: pre-line;" />
                    </p:column>

                    <p:column headerText="#{lbl['lbl.audit.header.newValue']}" styleClass="col-new-value">
                        <h:outputText value="#{obj.newValue}" style="white-space: pre-line;" />
                    </p:column>
                </p:dataTable>
            </h:panelGroup>
        </p:panel>
    </ui:fragment>
</ui:composition>
