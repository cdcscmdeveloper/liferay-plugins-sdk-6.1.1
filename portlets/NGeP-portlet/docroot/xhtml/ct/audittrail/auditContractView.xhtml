<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:tp="http://java.sun.com/jsf/composite/ep"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:panel style="width: 1500px !important;">
			<table style="width: 100%">
				<tr>
					<td>
						<div align="left" style="width: 100%">
							<p:commandButton value="#{lbl['lbl.btn.back']}"
								action="#{auditContractBackingBean.redirectToMainPage}" />
						</div>
					</td>

					<td>
						<div align="right" style="width: 100%">
							<p:commandLink value="#{lbl['lbl.txt.print.audit.all']}"
								ajax="false">
								<p:fileDownload
									value="#{auditContractBackingBean.generateAllReport(auditContractBackingBean.managedBean.docId, auditContractBackingBean.managedBean.ctType)}" />
							</p:commandLink>
							&#160;
							<p:commandLink value="#{lbl['lbl.txt.file.audit.download.all']}"
								ajax="false">
								<p:fileDownload
									value="#{auditContractBackingBean.getAuditTrailDetailsForExlRpt(auditContractBackingBean.managedBean.docId, null,auditContractBackingBean.managedBean.ctType)}" />
							</p:commandLink>
							&#160;
						</div>
					</td>

				</tr>
			</table>

			<!-- Tampilkan Konten Berdasarkan Jenis Contract -->
			<c:if
				test="#{auditContractBackingBean.managedBean.ctType eq 'CONTRACT'}">
				<ui:include src="/xhtml/ct/audittrail/auditCtView.xhtml" />
			</c:if>
			<c:if
				test="#{auditContractBackingBean.managedBean.ctType eq 'CCR' or auditContractBackingBean.managedBean.ctType eq 'PCR'}">
				<ui:include src="/xhtml/ct/audittrail/auditCtViewCircular.xhtml" />
			</c:if>
		</p:panel>
	</ui:define>
</ui:composition>
