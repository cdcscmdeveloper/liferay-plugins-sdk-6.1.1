<ui:composition
    template="/WEB-INF/facelets/templates/basic_template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://java.sun.com/jsf/html">


    <ui:define name="contentSection">
        <!-- Import external audit.css -->
        <h:outputStylesheet library="ep/css" name="audit.css" />
        
        <p:panel styleClass="audit-main-panel">
            
            <!-- Back & Export Buttons -->
            <table style="width: 100%; margin-bottom: 10px;">
                <tr>
                    <td style="width: 50%; text-align: left;">
                        <p:commandButton value="#{lbl['lbl.btn.back']}"
                            action="#{auditContractBackingBean.redirectToMainPage}" />
                    </td>
                    <td style="width: 50%; text-align: right;">
                        <p:commandLink value="#{lbl['lbl.txt.print.audit.all']}" ajax="false">
                            <p:fileDownload value="#{auditContractBackingBean.generateAllReport(
                                auditContractBackingBean.managedBean.docId,
                                auditContractBackingBean.managedBean.ctType)}" />
                        </p:commandLink>
                        &#160;
                        <p:commandLink value="#{lbl['lbl.txt.file.audit.download.all']}" ajax="false">
                            <p:fileDownload value="#{auditContractBackingBean.getAuditTrailDetailsForExlRpt(
                                auditContractBackingBean.managedBean.docId,
                                null,
                                auditContractBackingBean.managedBean.ctType)}" />
                        </p:commandLink>
                    </td>
                </tr>
            </table>

            <!-- Include Views -->
            <ui:include src="/xhtml/ct/audittrail/auditCtView.xhtml" />
            <ui:include src="/xhtml/ct/audittrail/auditCtViewCircular.xhtml" />
            
        </p:panel>
    </ui:define>
</ui:composition>
