<ui:composition

    <ui:define name="contentSection">
    <style>
      .dashboarTable {
             color: #000 !important;
             font-family: Arial,Helvetica,sans-serif;
              font-size: 12px;
              border-color: #ddd;
              border-width:1px;
              padding-left: 5px;
              border-style:solid;
      }
      
     .tableWidth80{
          width:80%;
     }
     
      .tableWidth20{
          width:20%;
          text-align: center;
     }
    
    
    </style>
    
           <table style="width:100%;">
                    <tr>
                         <td  class="tableWidth80 dashboarTable">

                        <td class=" tableWidth20 dashboarTable">
                                  #{contractDashboardBackingBean.managedBean.lessThan30Days}</td></tr>
                           <tr>
                               <td  class="tableWidth80, dashboarTable">
                                     <p:outputLabel value="#{lbl['lbl.ct.dash.board.120.days']}"  style="float:left;text-align:left;" /></td>

                                 #{contractDashboardBackingBean.managedBean.lessThan120Days}</td>
                           </tr>
                           <tr><td colspan="3" style="text-align:right;padding-right: 8%;" class="dashboarTable">
	                            <p:commandLink value="#{lbl['lbl.ct.dash.board.more']}"  styleClass="blue_font" process="@this" update="@form"
