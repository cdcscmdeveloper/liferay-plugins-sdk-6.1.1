<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <ui:define name="contentSection">
     <style>
      .column-align-center { text-align: center !important;}
      .myTable thead {
              display:none;
      }
      
      table td, table th {
            border-style:ridge;
            border-width:1px;
            border-color:#000000; 
            padding: 10px;
}
    </style>
   	    <p:panel id="supplier" header="#{lbl['lbl.ct.dash.board.panel']}" toggleable="true"  toggleSpeed="500">
           <p:spacer height="2"/>
           <table style="width:100%;" >
                    <tr><td style="width:80%; padding-left: 5px;"><p:outputLabel value="#{lbl['lbl.ct.dash.board.30.days']}" style="float:left;" /></td>
                    <td  style="width:20%;text-align: center;">#{contractDashboardBackingBean.managedBean.lessThan30Days}</td></tr>
                           <tr><td  style="width:80%;padding-left: 5px;" ><p:outputLabel value="#{lbl['lbl.ct.dash.board.120.days']}"  style="float:left;" /></td>
                           <td  style="width:20%;text-align: center">#{contractDashboardBackingBean.managedBean.lessThan120Days}</td></tr>
                           <tr><td colspan="3" style="text-align:right;padding-right: 6%;">
	                            <p:commandLink value="#{lbl['lbl.ct.dash.board.more']}"  styleClass="blue_font" process="@form" 
	                                action="#{contractDashboardBackingBean.goToMaintenancePage}" >
								<f:param name="contractVerId" />
							</p:commandLink></td></tr>
                  </table>
         </p:panel>
     </ui:define>
</ui:composition>
