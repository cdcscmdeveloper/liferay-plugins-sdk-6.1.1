<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
		<script> $('#portlet_ctAgreement_WAR_NGePportlet').find('.portlet-title-text').html('#{agreementBackingBean.getPortletTitle()}'); </script>
		<style>
		 .top-aligned-columns td{ vertical-align: top;}
		 .img1{
		  vertical-align: top; }
		.columnWidth150 {
	        width: 150px;
	        text-align: right;
         }
          .columnWidth200 {
	        width: 200px;
         }
         
            .columnWidth250 {
	        width: 250px;
         }
         .columnWidth350 {
	        width: 350px;
         }
         .confirmation-message-box {
         	border: 1px solid #cecece;
			font-family: Arial;
			font-size: 12px;
			cursor: default;
			padding: 10px;
         }
         
            .column-align-center {
                   text-align: center !important;
             }
      
      .fileupload-buttonbar.ui-widget-header.ui-corner-top {
                padding: 0.0em 0.0em;
                padding-top: 0em;
                padding-right: 0em;
                padding-bottom: 0em;
                padding-left: 0em;
        }
		</style>
		
		   <script type="text/javascript">  
                 $(function(){
    	                $('form').on('keypress', function(event){
    	                  if(event.which == 13){
    	                  event.preventDefault();
    	                   }
    	             });
            	});
		</script> 
		
		 <p:blockUI id="blockUiId" block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>				
		<f:event listener="#{agreementBackingBean.preRenderView}" type="preRenderView" />
   		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	  	<ui:include src="/xhtml/ct/agreement/agreementButtons.xhtml" />
	  	<ui:include src="/xhtml/ct/agreement/agreementHeader.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		  <tr>
			<td width="20%" valign="top" class="sidemenutd">
				<p:tabMenu styleClass="sidemenu"
					activeIndex="#{agreementBackingBean.managedBean.selectedTabIndex}">
                   
                    <p:menuitem style="white-space:normal;" value="#{agreementBackingBean.managedBean.agreementType eq CtConst.supplementalAgreement ? lbl['lbl.ct.menu.create.sup.agreement'] : lbl['lbl.ct.menu.create.agreement']}" update="@all">
						<f:setPropertyActionListener target="#{agreementBackingBean.managedBean.selectedTabIndex}" value="0" />
					</p:menuitem>
					
					<p:menuitem style="white-space:normal;" value="#{agreementBackingBean.managedBean.agreementType eq CtConst.supplementalAgreement ? lbl['lbl.ct.menu.signing.sup.agreement'] : lbl['lbl.ct.menu.signing.agreement']}" update="@all">
						<f:setPropertyActionListener target="#{agreementBackingBean.managedBean.selectedTabIndex}" value="1" />
					</p:menuitem>
					<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.signed']}" update="@all" rendered="#{agreementBackingBean.managedBean.uploadStampedAndSignedPage}">
						<f:setPropertyActionListener target="#{agreementBackingBean.managedBean.selectedTabIndex}" value="2" />
					</p:menuitem>
					
					 <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.approver.setting']}" update="@all"
					    rendered="#{agreementBackingBean.isApproverSetting() and agreementBackingBean.managedBean.uploadStampedAndSignedPage}">
						<f:setPropertyActionListener target="#{agreementBackingBean.managedBean.selectedTabIndex}" value="3" />
					</p:menuitem>
					 
					 <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.approver.setting']}" update="@all" 
					    rendered="#{agreementBackingBean.isApproverSetting() and !agreementBackingBean.managedBean.uploadStampedAndSignedPage}">
						<f:setPropertyActionListener target="#{agreementBackingBean.managedBean.selectedTabIndex}" value="2" />
					</p:menuitem>
				</p:tabMenu>
			</td>
			<td width="80%">
			 <p:outputPanel rendered="#{agreementBackingBean.managedBean.selectedTabIndex == 0}">
					<ui:include src="/xhtml/ct/agreement/agreementDetails.xhtml" />
				    <ui:include src="/xhtml/ct/agreement/agreementSupDetails.xhtml" />
				    <ui:include src="/xhtml/ct/agreement/standardDocument.xhtml" />
				    <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
				</p:outputPanel>
				 <p:outputPanel rendered="#{agreementBackingBean.managedBean.selectedTabIndex == 1}">
					<ui:include src="/xhtml/ct/agreement/agencySignerWitnes.xhtml" />
				    <ui:include src="/xhtml/ct/agreement/supplierSignerWitnes.xhtml" />
				</p:outputPanel>
	
				 <p:outputPanel rendered="#{agreementBackingBean.managedBean.selectedTabIndex == 2 and agreementBackingBean.managedBean.uploadStampedAndSignedPage}">
					<ui:include src="/xhtml/ct/agreement/uploadDocument.xhtml" />
			     </p:outputPanel>
				
				 <p:outputPanel rendered="#{(agreementBackingBean.managedBean.selectedTabIndex == 3 and agreementBackingBean.managedBean.uploadStampedAndSignedPage)
				  or (agreementBackingBean.managedBean.selectedTabIndex == 2 and !agreementBackingBean.managedBean.uploadStampedAndSignedPage) and agreementBackingBean.isApproverSetting()}">
					<ui:include src="/xhtml/ct/agreement/approverSetting.xhtml" />
				</p:outputPanel>
				
			</td>
		</tr>
		</table>
	</ui:define>
</ui:composition>
