<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
	<style>
        .column-align-center { text-align: center !important;}
         .top-aligned-columns td{ vertical-align: top;}
    </style>
	 <f:event listener="#{agreementBackingBean.preRenderView}" type="preRenderView" />	
	  <p:panel>
	  <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
      <table style="width: 100%;">
	    		<tr>
	    			<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" /></td>
	    			<td class="ppRightBtn">
			  			 <ui:repeat var="outcome" value="#{agreementBackingBean.managedBean.action}">
			              <p:commandButton value="#{outcome}" process="@form" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(outcome)}" 
			               action="#{agreementBackingBean.createAgreement(outcome)}" />
		            </ui:repeat>    			
	    			</td>
	    		</tr>
	  </table>
	  <table style="width: 99%; margin-left: 25px;" class="header-info">
				<tr style="margin-button: 10px;">
				  <td>
				     <p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
				  </td>
				  <td>
				   <p:inputText size="20" disabled="true"
					 value="#{agreementBackingBean.managedBean.ctContract.loaPhysicalNo}"  />	
				  </td>		
			     <td>
					
							<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
					
					</td>
					<td>
						
							<p:inputText size="20" disabled="true"
								value="#{agreementBackingBean.managedBean.ctContract.contractNo}" />
					
					</td>
					<td>
		
							<p:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
					
					</td>
					<td>
						
							<p:inputText size="30" disabled="true" value="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}"/>
						
					</td>					
					<td>
						
							<p:outputLabel value="#{lbl['lbl.ct.cc.status']}" />
						
					</td>
					<td>
						
							<p:inputText size="20"
								value="#{agreementBackingBean.getStatusDescById(agreementBackingBean.managedBean.ctContract.currentContractVer.status.statusId)}"
								disabled="true" />
						
					</td>
				</tr>
			</table>	    			
	</p:panel>
	<p:tabView id="agreementTab" orientation="left">
	    <p:tab id="agDetail" title="Create Agreement" >
            <ui:include src="/xhtml/ct/agreement/agreementDetails.xhtml"/>
            <c:if test='#{agreementBackingBean.managedBean.agreementType eq "supplemental"}'>
             <ui:include src="/xhtml/ct/agreement/agreementSupDetails.xhtml"/>  </c:if>
            <ui:include src="/xhtml/ct/agreement/standardDocument.xhtml"/>
            <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" /> 
        </p:tab> 
         <p:tab id="agCreate" title="Signing Agreement">
             <ui:include src="/xhtml/ct/agreement/agencySignerWitnes.xhtml"/>  
              <ui:include src="/xhtml/ct/agreement/supplierSignerWitnes.xhtml"/>  
        </p:tab> 
        <p:tab id="signedDetail" title="Signed Details" 
           rendered="#{agreementBackingBean.managedBean.uploadFinalAgreement}">
             <ui:include src="/xhtml/ct/agreement/uploadDocument.xhtml"/>  
        </p:tab> 
        <p:tab id="approverSetting" title="Approver Setting" rendered="#{!agreementBackingBean.isApprover()}">
             <ui:include src="/xhtml/ct/agreement/approverSetting.xhtml"/>  
        </p:tab> 
	</p:tabView>
</ui:define>
</ui:composition>
