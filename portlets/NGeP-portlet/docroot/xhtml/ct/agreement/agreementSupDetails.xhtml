<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="suplimental" header="#{lbl['lbl.ct.menu.amendment']}"   toggleable="true"  
	  toggleSpeed="500" rendered="#{agreementBackingBean.managedBean.agreementType eq 'supplemental'}">
	  <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth15" >
	     <f:verbatim/>
	     <h:panelGrid columns="3">
		    <p:selectBooleanCheckbox disabled="true"
			   value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.quantityChange}" >
			</p:selectBooleanCheckbox>
		    <p:spacer width="2" />				
		    <h:panelGrid columns="2">
				<p:outputLabel value="#{lbl['lbl.ct.change.quantity']}" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.change.quantity']}" />
			</h:panelGrid>
		</h:panelGrid>
		
		 <f:verbatim/>
	     <h:panelGrid columns="3">
		    <p:selectBooleanCheckbox disabled="true"
			    value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.valueChange}"  >
			</p:selectBooleanCheckbox>
		    <p:spacer width="2" />				
		    <h:panelGrid columns="2">
				<p:outputLabel value="#{lbl['lbl.ct.change.contract.value']}" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.change.contract.amount']}" />
			</h:panelGrid>
		</h:panelGrid>
		
		<f:verbatim/>
	     <h:panelGrid columns="3">
		    <p:selectBooleanCheckbox disabled="true"
			   value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.itemPriceChange}" >
			</p:selectBooleanCheckbox>
		    <p:spacer width="2" />
		    <h:panelGrid columns="2">
				<p:outputLabel value="#{lbl['lbl.ct.change.item.price']}" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.change.item.price']}" />
			</h:panelGrid>
		</h:panelGrid>
		
		<f:verbatim/>
	     <h:panelGrid columns="4">
		    <p:selectBooleanCheckbox disabled="true"
			    value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.contractExtend}">
			</p:selectBooleanCheckbox>
		    <p:spacer width="2" />				
		    <h:panelGrid columns="2">
				<p:outputLabel value="#{lbl['lbl.ct.contract.extension']}" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.extension']}" />
			</h:panelGrid>
		</h:panelGrid>
		
		<f:verbatim/>
	     <h:panelGrid columns="3">
		    <p:selectBooleanCheckbox disabled="true"
			    value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.clauseChange}">
			</p:selectBooleanCheckbox>
		    <p:spacer width="2" />				
		    <h:panelGrid columns="2">
				<p:outputLabel value="#{lbl['lbl.ct.change.clause']}" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.change.clause']}" />
			</h:panelGrid>	
	  	</h:panelGrid>
	  </h:panelGrid>
	   <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth15" styleClass="top-aligned-columns">
         <p:outputLabel value="#{lbl['lbl.ct.amendment.title']}" />  
         <p:inputText  value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.title}" style="width:170px;" disabled="true" />
         <p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}"/>  
         <h:panelGrid columns="3">
         	<p:inputText value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.fileRefNo}" style="width:170px;" disabled="true" /> 
      		<p:spacer width="1"/>
			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.file.ref.no']}" />
		 </h:panelGrid>
	     <h:panelGroup>
		   <div style="height: 40px; vertical-align: top;">
		      <p:outputLabel for="amendmentD" value="#{lbl['lbl.ct.description']}" />
		   </div>
		 </h:panelGroup>
		 <h:panelGrid>
		    <p:inputTextarea id="amendmentD" value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.description}"  disabled="true" rows="3" cols="31"  autoResize="false" />
		 </h:panelGrid>

         <p:outputLabel value="#{lbl['lbl.ct.amend.effective.date']}" />  
         <h:panelGrid columns="3">
         	<p:inputText value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.amendmentEffDate}" style="width:170px;"  disabled="true" >
         		<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
         	</p:inputText>
         	<p:spacer width="1"/>
			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.new.effective.date']}" />
	  	</h:panelGrid>
	  </h:panelGrid>
	</p:panel>
</ui:composition>
