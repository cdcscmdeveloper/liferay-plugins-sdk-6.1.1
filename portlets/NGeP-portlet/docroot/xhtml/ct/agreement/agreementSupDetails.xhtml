<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="suplimental" header="#{lbl['lbl.ct.sup.ag.header']}"   toggleable="true"  
	  toggleSpeed="500" rendered="#{agreementBackingBean.managedBean.agreementType eq 'supplemental'}">
	  <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth15">
	     <f:verbatim/>
	     <h:panelGrid columns="3">
		    <p:selectBooleanCheckbox disabled="true"
			   value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.quantityChange}" >
			</p:selectBooleanCheckbox>
		    <p:spacer width="2" />				
		    <p:outputLabel value="#{lbl['lbl.ct.change.quantity']}" />
		</h:panelGrid>
		
		 <f:verbatim/>
	     <h:panelGrid columns="3">
		    <p:selectBooleanCheckbox disabled="true"
			    value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.valueChange}"  >
			</p:selectBooleanCheckbox>
		    <p:spacer width="2" />				
		    <p:outputLabel value="#{lbl['lbl.ct.change.contract.value']}" />
		</h:panelGrid>
		
		<f:verbatim/>
	     <h:panelGrid columns="3">
		    <p:selectBooleanCheckbox disabled="true"
			   value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.itemPriceChange}" >
			</p:selectBooleanCheckbox>
		    <p:spacer width="2" />				
		    <p:outputLabel value="#{lbl['lbl.ct.change.item.price']}" />
		</h:panelGrid>
		
		<f:verbatim/>
	     <h:panelGrid columns="3">
		    <p:selectBooleanCheckbox disabled="true"
			    value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.contractExtend}">
			</p:selectBooleanCheckbox>
		    <p:spacer width="2" />				
		    <p:outputLabel value="#{lbl['lbl.ct.contract.extension']}" />
		</h:panelGrid>
		
		<f:verbatim/>
	     <h:panelGrid columns="3">
		    <p:selectBooleanCheckbox disabled="true"
			    value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.clauseChange}">
			</p:selectBooleanCheckbox>
		    <p:spacer width="2" />				
		    <p:outputLabel value="#{lbl['lbl.ct.change.clause']}" />
		</h:panelGrid>		
	  </h:panelGrid>
	  
	   <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth15">
	     
         <p:outputLabel value="#{lbl['lbl.ct.amendment.title']}" />  
         <p:inputText  value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.title}" style="width:170px;" disabled="true" />
         <p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}"/>  
         <p:inputText value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.fileRefNo}" style="width:170px;" disabled="true" /> 
      
	     <h:panelGroup>
		   <div style="height: 40px; vertical-align: top;">
		      <p:outputLabel for="amendmentD" value="#{lbl['ct.lbl.amend.desc']}" />
		   </div>
		 </h:panelGroup>
		 <h:panelGrid>
		    <p:inputTextarea id="amendmentD" value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.description}"  disabled="true" rows="3" cols="31"  autoResize="false" />
		 </h:panelGrid>

         <p:outputLabel value="#{lbl['ct.lbl.amend.amendeffdate']}" />  
         <p:inputText value="#{agreementBackingBean.managedBean.ctAgreement.ctAmendment.amendmentEffDate}" style="width:170px;"  disabled="true" >
         	<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
         </p:inputText>
         		 
	  </h:panelGrid>
	</p:panel>
</ui:composition>
