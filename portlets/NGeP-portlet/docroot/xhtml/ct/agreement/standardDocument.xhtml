<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="createAgreement" header="AGREEMENT CONTENT"
		toggleable="true" toggleSpeed="500">
		<h:panelGrid style="width:100%">
			<p:spacer height="5" />
			<p:dataTable id="contentTable" var="data" rowIndexVar="rowIndex"
				value="#{agreementBackingBean.managedBean.ctContract.currentAgreement.agreementContents}"
				selectionMode="single" selection="#{agreementBackingBean.managedBean.selectedAgreementContent}" rowKey="#{data}">
				<p:column style="width:60%;" headerText="Content">
					<p:outputLabel value="#{data.title}" style="float:left;" rendered="#{data.agreementContentId != null}" />
					<p:inputText value="#{data.title}" style="width:90%;" rendered="#{data.agreementContentId == null}"/>
				</p:column>
				<p:column style="width:20%px;"
					headerText="#{lbl['lbl.ct.ag.table.type']}">
					<p:outputLabel style="float:left;"
						value="#{agreementBackingBean.getParameterDesc(data.contentType.pmParameterType.parameterType,data.contentType.parameterCode)}" />
				</p:column>
				<p:column style="width:20%;" styleClass="column-align-center"
					headerText="#{lbl['lbl.ct.ag.table.action']}">
					<h:panelGroup rendered="#{data.contentType.parameterCode == ParameterConst.agreementTemplateDoc}">
					 <p:commandLink process="@this" partialSubmit="true"
							action="#{agreementBackingBean.openNewWindow(data)}">
							<p:graphicImage library="ep/images/design" name="download.png"
								value="/resources/ep/images/design/download.png"
								title="File Download" />
						</p:commandLink>
						<p:spacer width="2"/>
					   <p:commandLink
							action="#{agreementBackingBean.openNewWindow(data)}">
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/resources/ep/images/design/document.png"
								title="View Document" />
						</p:commandLink>	
					</h:panelGroup>
					<h:panelGroup rendered="#{data.contentType.parameterCode eq ParameterConst.agreementSystemDefineDoc}">
						<h:commandLink
							action="#{agreementBackingBean.downloadDocFile(data.title)}">
							<p:graphicImage library="ep/images/design" name="download.png"
								value="/resources/ep/images/design/download.png"
								title="File Download" />
						</h:commandLink>
					</h:panelGroup>
					  	<h:panelGroup id="uploadUserDefinePg" rendered="#{data.agreementContentId == null}">
							<p:commandButton
								oncomplete="uploadUserDefineDlg.show();return false;"
								icon="iconAttachment" update=":form:agreementTab:contentTable"
								rendered="#{data.filePath == null}">
								<f:setPropertyActionListener value="#{data}" 
								  target="#{agreementBackingBean.managedBean.selectedAgreementContent}" />
							</p:commandButton>
							<h:commandLink rendered="#{data.filePath != null}"
								action="#{agreementBackingBean.downloadFile(data.filePath)}">
								<p:graphicImage library="ep/images/design" name="download.png"
									value="/resources/ep/images/design/download.png"
									title="File Download" />
							</h:commandLink>
					  </h:panelGroup>
				</p:column>
			</p:dataTable>
			<p:dialog id="uploadUserDefineDlg" widgetVar="uploadUserDefineDlg"
				modal="false" resizable="false" width="700px" height="350"
				styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
				<p:ajax event="close" />
				<p:fileUpload style="display:inline;" mode="advanced"
					fileUploadListener="#{agreementBackingBean.fileUpload}"
					allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
					invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
					update=":form:agreementTab:contentTable">
				</p:fileUpload>
			</p:dialog>
		</h:panelGrid>
		  <div class="ppRightBtn"> 
              <p:commandButton value="Add" process="@form"  icon="ui-icon-add" update="contentTable" 
                 action="#{agreementBackingBean.addAgreementContents}" />
		      <p:spacer width="1"/>
		      <p:commandButton value="Delete" 
		        icon="ui-icon-delete" process="@form" onclick="dlgDocumentDel.show();"/> 
		      <p:spacer width="1"/>
		      <h:commandButton value="DownLoad All" 
		       action="#{agreementBackingBean.downloadAll()}"
		        icon="ui-icon-download" process="@form"/> 
	   </div>
	    <p:dialog id="dlgDocumentDel" widgetVar="dlgDocumentDel" header="Delete Confirmation" 
	      styleClass="screen-title" resizable="false" modal="true" width="325" height="90">  
           <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png"
			     value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			   <p:spacer width="10"/>
              <p:inputTextarea rows="2" cols="48" 
                 styleClass="ui-inputtextarea" value="Are you sure you want to delete this record?"/>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="Yes" icon="ui-icon-accept" update="contentTable" process="@form" 
				actionListener="#{agreementBackingBean.delAgreementContents()}" onclick="dlgDocumentDel.hide();"/>
			 <p:commandButton value="No" icon="ui-icon-reject" onclick="dlgDocumentDel.hide();" type="button" />
		   </div>
        </p:dialog>  
	</p:panel>
</ui:composition>
