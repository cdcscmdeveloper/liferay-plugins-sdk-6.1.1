<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="createAgreement" header="#{agreementBackingBean.managedBean.agreementType eq CtConst.supplementalAgreement ? lbl['lbl.ct.panel.supplemental.agreement.content'] : lbl['lbl.ct.panel.agreement.content']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid style="width:100%">
			  <h:panelGrid columns="2">
				<p:outputLabel value="#{lbl['lbl.ct.sample.contract']}" />
				<h:commandLink action="#{agreementBackingBean.downloadSampleFile()}">
					<p:graphicImage value="/css/images/design/ico-download.png" title="#{lbl['lbl.txt.file.download']}" />
				</h:commandLink>				
			</h:panelGrid>
			
			<p:spacer height="5" />
			<p:dataTable id="contentTable" var="contentsVar" rowIndexVar="rowIndex"
				value="#{agreementBackingBean.managedBean.ctAgreement.agreementContents}"
				selectionMode="single" selection="#{agreementBackingBean.managedBean.selectedAgreementContent}" rowKey="#{contentsVar}">
				<p:ajax event="rowSelect" update=":form:delContentBtn" />
				
				<p:column style="width:40%;" styleClass="column-align-center">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.contents']}"/>
				        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.content']}"/>
				  	</f:facet>
					    <h:outputText value="#{contentsVar.title}" style="text-align:left;float:left;" 
					        rendered="#{contentsVar.contentType.parameterCode != ParameterConst.agreementUserUploadDoc}" />
					<p:inputText value="#{contentsVar.title}"  maxlength="50" 
					     style="width:90%;" rendered="#{contentsVar.contentType.parameterCode eq ParameterConst.agreementUserUploadDoc}"/>
				</p:column>
				
				<p:column style="width:30%px;" styleClass="column-align-center">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.type']}"/>
				        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.content.type']}"/>
				  	</f:facet>
					<h:outputText style="text-align:left; float:left;"
					   value="#{agreementBackingBean.getParameterDesc(contentsVar.contentType.parameterType,contentsVar.contentType.parameterCode)}" />
				</p:column>
				
				<p:column style="width:30%;" styleClass="column-align-center">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.action']}"/>
				        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.content.action']}"/>
				  	</f:facet>
				   	<h:panelGroup rendered="#{contentsVar.contentType.parameterCode eq ParameterConst.agreementTemplateDoc}">
						<h:commandLink action="#{agreementBackingBean.downloadDocFile(contentsVar)}" immediate="true"  
						     rendered="#{contentsVar.tplDocMaster != null and contentsVar.tplDocMaster.docMasterId != null}" >
							<p:graphicImage value="/css/images/design/ico-download.png" title="#{lbl['lbl.txt.file.download']}" />
						</h:commandLink>
					 <p:spacer width="5"/>
					 <p:commandLink
							action="#{agreementBackingBean.gotoTemplateDoc(contentsVar)}">
							<p:graphicImage value="/css/images/design/ico-viewnedit.png" title="#{lbl['lbl.ct.view.document']}" />
					</p:commandLink>	
					</h:panelGroup>
					<h:panelGroup rendered="#{contentsVar.contentType.parameterCode eq ParameterConst.agreementSystemDefineDoc}">
						<h:commandLink action="#{agreementBackingBean.downloadDocFile(contentsVar)}" immediate="true">
							<p:graphicImage value="/css/images/design/ico-download.png" title="#{lbl['lbl.txt.file.download']}" />
						</h:commandLink>
					</h:panelGroup>
					
					<h:panelGroup id="uploadUserDefinePg" 
					    rendered="#{contentsVar.contentType.parameterCode eq ParameterConst.agreementUserUploadDoc}">
						
						<p:commandButton icon="iconAttachment"  rendered="#{contentsVar.filePath  == null}"
					   		update=":form:contentTable, :form:uploadUserDefineDlg" oncomplete="uploadUserDefineDlg.show();return false;"  >
							<f:setPropertyActionListener value="#{contentsVar}" 
						    	target="#{agreementBackingBean.managedBean.selectedAgreementContent}" />
						</p:commandButton>
						
						<h:commandLink rendered="#{contentsVar.filePath != null}" title="#{contentsVar.fileName}"
							value="#{agreementBackingBean.getShortFileName(contentsVar.fileName)}"
							action="#{agreementBackingBean.downloadFile(contentsVar.filePath, contentsVar.fileName)}">
					    </h:commandLink>
					    
					     	<p:commandLink 
			   	                 onclick="deleteContentDlg.show();" action="#{agreementBackingBean.setIndexProperty(rowIndex)}"
						         rendered="#{contentsVar.filePath  != null}">
			   				   <h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			 	          </p:commandLink>
					 
					 </h:panelGroup>
				</p:column>
			</p:dataTable>
			<p:dialog id="uploadUserDefineDlg" widgetVar="uploadUserDefineDlg" height="350"
				modal="true" width="700px" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
				<p:ajax event="close" />
				<p:fileUpload style="display:inline;" mode="advanced" 
				    sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
				    fileUploadListener="#{agreementBackingBean.fileUpload}"
					allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
					invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"  update=":form:contentTable">
				</p:fileUpload>
			</p:dialog>
			
			<p:dialog id="deleteContentId" widgetVar="deleteContentDlg" styleClass="screen-title" modal="true" width="330">  
      	           <h:panelGrid columns="3">
 			              <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
		   	              <p:spacer width="10"/>
                          <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.delete.attachment.msg']}</div>
     	            </h:panelGrid>
		            <div class="ppRightBtn">
	                      <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@form"  update=":form:contentTable"
	                        	actionListener="#{agreementBackingBean.deleteContentAttachement()}"  onclick="deleteContentDlg.hide();"/>
		                  <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteContentDlg.hide();" type="button" />
	              </div>
 	       </p:dialog>	
		</h:panelGrid>
		  <div class="ppRightBtn"> 
              <p:commandButton id="addContentBtn" value="#{lbl['lbl.btn.add']}" process="@form"  
                   update=":form:contentTable" action="#{agreementBackingBean.addAgreementContents}">
             		<p:tooltip for="addContentBtn">
					    <h:outputText value="#{lbl['lbl.ct.tooltip.add.agreement.content']}" escape="false" />
					</p:tooltip>
              </p:commandButton>
		      <p:spacer width="1"/>
		      <p:commandButton id="delContentBtn" value="#{lbl['lbl.btn.delete']}" process="@form" onclick="dlgDocumentDel.show();"
		      		disabled="#{!(agreementBackingBean.managedBean.selectedAgreementContent!=null and 
		      		agreementBackingBean.managedBean.selectedAgreementContent.contentType.parameterCode==ParameterConst.agreementUserUploadDoc)}">
		      		<p:tooltip for="delContentBtn">
					    <h:outputText value="#{lbl['lbl.ct.tooltip.delete.agreement.content']}" escape="false" />
					</p:tooltip>
              </p:commandButton> 
		      <p:spacer width="1"/>
		      <p:commandButton id="downloadAllContentBtn" value="#{lbl['lbl.btn.download.all']}" ajax="false" 
		      		action="#{agreementBackingBean.downloadAll()}" process="@form">
		        	<p:tooltip for="downloadAllContentBtn">
					    <h:outputText value="#{lbl['lbl.ct.tooltip.download.all.agreement.content']}" escape="false" />
					</p:tooltip>
		      </p:commandButton> 
	   </div>
	    <p:dialog id="dlgDocumentDel" widgetVar="dlgDocumentDel"
	      styleClass="screen-title" modal="true" width="330">  
           <h:panelGrid columns="3">
              <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			   <p:spacer width="10"/>
              <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:contentTable" 
				process="@form"  actionListener="#{agreementBackingBean.delAgreementContents()}" onclick="dlgDocumentDel.hide();"/>
			 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgDocumentDel.hide();" type="button" />
		   </div>
        </p:dialog>  
	</p:panel>
	<p:panel id="agreementDisclaimerPnl" header="#{lbl['lbl.ct.disclaimer']}"
	    toggleable="true" toggleSpeed="500" rendered="#{agreementBackingBean.managedBean.approveFinalAgreement}" >
		<h:panelGrid columns="2">
			<p:selectBooleanCheckbox id="disclaimerCheckBox"
				value="#{agreementBackingBean.managedBean.agreementDisclaimer}" />
			<h:outputText value="#{lbl['lbl.ct.agreement.disclaimer']}" styleClass="required" />
		</h:panelGrid>
	</p:panel>
	
</ui:composition>
