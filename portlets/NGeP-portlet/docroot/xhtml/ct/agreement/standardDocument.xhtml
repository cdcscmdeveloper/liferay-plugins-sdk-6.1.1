<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="createAgreement" header="STANDARD DOCUMENT"  toggleable="true"  toggleSpeed="500">
       <h:panelGrid style="width:100%">  
          <p:spacer height="5"/>
            <p:dataTable id="standard" var="data" value="#{agreementBackingBean.detailsList}" rowIndexVar="rowIndex" >
				<ac:paginator for="standard" />
				<p:columnGroup type="header">
					<p:row>
						<p:column style="width:400px;" headerText="#{lbl['lbl.ct.ag.table.section']}" />
						<p:column style="width:150px;" headerText="#{lbl['lbl.ct.ag.table.type']}" />
						<p:column style="width:100px;" styleClass="column-align-center" headerText="#{lbl['lbl.ct.ag.table.action']}" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<p:outputLabel value="#{data.fileName}" style="float:left;" />
				</p:column>
				<p:column>
					<p:outputLabel value="#{data.fileType}" style="float:left;" />
				</p:column>
				<p:column styleClass="column-align-center">
				 <h:commandLink  action="#{agreementBackingBean.openNewWindow(data)}" target="_blank">
					<p:graphicImage library="ep/images/design" name="document.png"
					  value="/resources/ep/images/design/document.png" title="View Document" rendered="#{rowIndex lt 3 }" />
					  <p:graphicImage library="ep/images/design" name="download.png"
					  value="/resources/ep/images/design/download.png" title="File Download" rendered="#{rowIndex gt 2 }" />
			     </h:commandLink>
				</p:column>
			</p:dataTable>
		</h:panelGrid>
    </p:panel>
     <ui:include src="appendixDocument.xhtml" /> 
</ui:composition>
