<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="createAgreement" header="AGREEMENT CONTENT" toggleable="true" toggleSpeed="500">
		<h:panelGrid style="width:100%">
			<h:panelGrid columns="2">
				<p:outputLabel value="Sample Contract" />
				<h:commandLink action="#{agreementBackingBean.downloadFile('', 'sample')}">
					<p:graphicImage library="ep/images/design" name="download.png"
						value="/css/images/design/download.png" title="File Download" />
				</h:commandLink>				
			</h:panelGrid>
			<p:spacer height="5" />
			<p:dataTable id="contentTable" var="contentsVar" rowIndexVar="rowIndex"
				value="#{agreementBackingBean.managedBean.ctAgreement.agreementContents}"
				selectionMode="single" selection="#{agreementBackingBean.managedBean.selectedAgreementContent}" rowKey="#{contentsVar}">
				<p:ajax event="rowSelect" update=":form:delContentBtn" />
				<p:column style="width:60%;" headerText="Content">
					<p:outputLabel value="#{contentsVar.title}" style="float:left;" rendered="#{contentsVar.contentType.parameterCode != ParameterConst.agreementUserUploadDoc}" />
					<p:inputText value="#{contentsVar.title}" style="width:90%;" rendered="#{contentsVar.contentType.parameterCode eq ParameterConst.agreementUserUploadDoc}"/>
				</p:column>
				<p:column style="width:20%px;"
					headerText="#{lbl['lbl.ct.ag.table.type']}">
					<p:outputLabel style="float:left;"
						value="#{agreementBackingBean.getParameterDesc(contentsVar.contentType.parameterType,contentsVar.contentType.parameterCode)}" />
				</p:column>
				<p:column style="width:20%;" styleClass="column-align-center"
					headerText="#{lbl['lbl.ct.ag.table.action']}">
					<h:panelGroup rendered="#{contentsVar.contentType.parameterCode == ParameterConst.agreementTemplateDoc}">
					 <p:commandLink process="@this" partialSubmit="true"
							action="#{agreementBackingBean.downloadTemplateDoc(contentsVar)}">
							<p:graphicImage library="ep/images/design" name="download.png"
								value="/css/images/design/download.png"
								title="File Download" />
						</p:commandLink>
						<p:spacer width="2"/>
					   <p:commandLink
							action="#{agreementBackingBean.gotoTemplateDoc(contentsVar)}">
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/css/images/design/document.png"
								title="View Document" />
						</p:commandLink>	
					</h:panelGroup>
					<h:panelGroup rendered="#{contentsVar.contentType.parameterCode eq ParameterConst.agreementSystemDefineDoc}">
						<h:commandLink action="#{agreementBackingBean.downloadDocFile(contentsVar)}">
							<p:graphicImage library="ep/images/design" name="download.png"
								value="/css/images/design/download.png"
								title="File Download" />
						</h:commandLink>
					</h:panelGroup>
					  	<h:panelGroup id="uploadUserDefinePg" rendered="#{contentsVar.contentType.parameterCode eq ParameterConst.agreementUserUploadDoc}">
							<p:commandButton oncomplete="uploadUserDefineDlg.show();return false;"
								icon="iconAttachment" update=":form:contentTable">
								<f:setPropertyActionListener value="#{contentsVar}" 
								  target="#{agreementBackingBean.managedBean.selectedAgreementContent}" />
							</p:commandButton>
							<h:commandLink rendered="#{contentsVar.filePath != null}" value="#{contentsVar.fileName}"
								action="#{agreementBackingBean.downloadFile(contentsVar.filePath, contentsVar.fileName)}">
							</h:commandLink>
					  </h:panelGroup>
				</p:column>
			</p:dataTable>
			<p:dialog id="uploadUserDefineDlg" widgetVar="uploadUserDefineDlg"
				modal="false" resizable="false" width="700px" height="350"
				styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
				<p:ajax event="close" />
				<p:fileUpload style="display:inline;" mode="advanced"
					fileUploadListener="#{agreementBackingBean.fileUpload}"
					allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
					invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted" update=":form:contentTable">
				</p:fileUpload>
			</p:dialog>
		</h:panelGrid>
		  <div class="ppRightBtn"> 
              <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form"  icon="ui-icon-add" update=":form:contentTable" action="#{agreementBackingBean.addAgreementContents}" />
		      <p:spacer width="1"/>
		      <p:commandButton id="delContentBtn" value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" process="@form" onclick="dlgDocumentDel.show();"
		      	disabled="#{!(agreementBackingBean.managedBean.selectedAgreementContent!=null and agreementBackingBean.managedBean.selectedAgreementContent.contentType.parameterCode==ParameterConst.agreementUserUploadDoc)}" /> 
		      <p:spacer width="1"/>
		      <p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false" action="#{agreementBackingBean.downloadAll()}"
		        	icon="ui-icon-download" process="@form"/> 
	   </div>
	    <p:dialog id="dlgDocumentDel" widgetVar="dlgDocumentDel" header="#{lbl['lbl.ct.dialog.confirm.header']}" 
	      styleClass="screen-title" resizable="false" modal="true" width="350" height="95">  
           <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png"
			     value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			   <p:spacer width="10"/>
              <p:inputTextarea rows="2" cols="48" 
                 styleClass="ui-inputtextarea" value="Are you sure you want to delete this record?"/>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:contentTable" process="@form" 
				actionListener="#{agreementBackingBean.delAgreementContents()}" onclick="dlgDocumentDel.hide();"/>
			 <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgDocumentDel.hide();" type="button" />
		   </div>
        </p:dialog>  
	</p:panel>
	
	<p:panel id="agreementPnl" header="agreement" toggleable="true" toggleSpeed="500" rendered="#{agreementBackingBean.managedBean.uploadFinalAgreement}" >
		<h:panelGroup id="uploadAgPg">
			<h:panelGrid columns="2">
				<h:panelGrid columns="2">
					<p:outputLabel value="*" styleClass="mandatory" />
					<p:outputLabel value="#{lbl['lbl.txt.attachment']}" />
				</h:panelGrid>
				<p:commandButton oncomplete="uploadAgDlg.show();return false;" 
					rendered="#{!agreementBackingBean.managedBean.uploadStampedAndSignedPage}"
					icon="iconAttachment" value="#{lbl['lbl.btn.upload']}" update=":form:uploadAgPg" />
				<h:outputLabel rendered="#{!agreementBackingBean.managedBean.uploadStampedAndSignedPage}" />
				<h:commandLink value="#{agreementBackingBean.managedBean.ctAgreement.fileName}"
					style="float:left;" styleClass="blue_font"
					rendered="#{agreementBackingBean.managedBean.ctAgreement.fileName != null}"
					action="#{agreementBackingBean.downloadFile(agreementBackingBean.managedBean.ctAgreement.filePath, 
						agreementBackingBean.managedBean.ctAgreement.fileName)}" />
			</h:panelGrid>
			<p:spacer height="20" />
		</h:panelGroup>
		<p:dialog id="uploadAgDlg" widgetVar="uploadAgDlg"
			modal="false" resizable="false" width="700px" height="350"
			styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;" mode="advanced"
				fileUploadListener="#{agreementBackingBean.uploadAgreement}"
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
				invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
				update=":form:uploadAgPg">
			</p:fileUpload>
		</p:dialog>				
	</p:panel>
</ui:composition>
