<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="createAgreement" header="STANDARD DOCUMENT"  toggleable="true"  toggleSpeed="500">
       <h:panelGrid style="width:100%">  
          <p:spacer height="5"/>
            <p:dataTable id="standard" var="data" value="#{agreementBackingBean.detailsList}" rowIndexVar="rowIndex" >
				<ac:paginator for="standard" />
				<p:columnGroup type="header">
					<p:row>
						<p:column style="width:400px;" headerText="#{lbl['lbl.ct.ag.table.section']}" />
						<p:column style="width:150px;" headerText="#{lbl['lbl.ct.ag.table.type']}" />
						<p:column style="width:100px;" styleClass="column-align-center" headerText="#{lbl['lbl.ct.ag.table.action']}" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<p:outputLabel value="#{data.fileName}"  style="float:left;" />
				</p:column>
				<p:column>
					<p:outputLabel value="#{data.fileType}" style="float:left;" />
				</p:column>
				<p:column styleClass="column-align-center">
				<p:commandLink actionListener="#{agreementBackingBean.openNewWindow(data)}"
                     process="@this" update="@([id$=myDilog])" oncomplete="dlgBox.show();">
				     	<p:graphicImage library="ep/images/design" name="document.png"
					  value="/resources/ep/images/design/document.png" title="View Document" rendered="#{rowIndex lt 3 }" />
					  <p:graphicImage library="ep/images/design" name="download.png"
					  value="/resources/ep/images/design/download.png" title="File Download" rendered="#{rowIndex gt 2 }" />
			     </p:commandLink>
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		</p:panel>
		<ui:include src="appendixDocument.xhtml" />   
		 <p:dialog id="modelDialog" header="Document Description" widgetVar="dlgBox" modal="true" width="600" height="450">
		 <h:panelGroup id="myDilog">
		   <p:panel id="documemtPanel">
              <table style="width:100%;">
	          <tr>
	    	    <td class="ppRightBtn">
	    	       <p:commandButton value="Download" ajax="false"   action="#{agreementBackingBean.downloadDocFile(agreementBackingBean.managedBean.ctTemplates)}"  styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(download)}" />
			   	   <p:commandButton  value="Closed" ajax="false" onclick="dlgBox.close();" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(closed)}"/>			
	    	   </td>
	         </tr>
	        </table>
	         </p:panel>
	           <p:panel id="documemtDesc" header="Document Description">
             <h:panelGrid style="width:800px;float:center;">  
                <h:outputText value="#{agreementBackingBean.blobToStr(agreementBackingBean.managedBean.ctTemplates.content)}"  escape="false"/>    
             </h:panelGrid>  
        </p:panel>
        </h:panelGroup>
	 </p:dialog>
</ui:composition>
