<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="createAgreement" header="#{agreementBackingBean.managedBean.agreementType eq CtConst.supplementalAgreement ? lbl['lbl.ct.panel.supplemental.agreement.content'] : lbl['lbl.ct.panel.agreement.content']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid style="width:100%">
			<p:dataTable id="contentTable" var="contentsVar" rowIndexVar="rowIndex"
				value="#{agreementBackingBean.managedBean.ctAgreement.agreementContents}" rowKey="#{contentsVar}">
				
				<p:column style="width:40%;" styleClass="column-align-center"
					rendered="#{contentsVar.contentType.parameterCode != ParameterConst.documentDefinitionTypeGeneratedFromFulfilment
				   			or agreementBackingBean.managedBean.bondReq}">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.contents']}" />
				        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.content']}"/>
				  	</f:facet>
					<h:outputText value="#{contentsVar.title}" style="text-align:left;float:left;" />					
				</p:column>
				
				<p:column style="width:30%px;" styleClass="column-align-center"
					rendered="#{contentsVar.contentType.parameterCode != ParameterConst.documentDefinitionTypeGeneratedFromFulfilment
				   			or agreementBackingBean.managedBean.bondReq}">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.type']}" />
				        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.content.type']}"/>
				  	</f:facet>
					<h:outputText style="text-align:left; float:left;"
						rendered="#{contentsVar.contentType.parameterCode != ParameterConst.documentDefinitionTypeTemplateDocument}"
					   	value="#{agreementBackingBean.getParameterDesc(contentsVar.contentType.parameterType, contentsVar.contentType.parameterCode)}" />
					<h:outputText style="text-align:left; float:left;"
					   	rendered="#{contentsVar.contentType.parameterCode eq ParameterConst.documentDefinitionTypeTemplateDocument}"
					   	value="#{agreementBackingBean.getParameterDesc(contentsVar.contentType.parameterType, ParameterConst.documentDefinitionTypeDocumentSample)}" />
				</p:column>
				
				<p:column style="width:30%;" styleClass="column-align-center"
					rendered="#{contentsVar.contentType.parameterCode != ParameterConst.documentDefinitionTypeGeneratedFromFulfilment
				   			or agreementBackingBean.managedBean.bondReq}">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.action']}"  />
				        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.content.action']}"/>
				  	</f:facet>
				   	<h:panelGroup>
						<p:commandLink disabled="#{(contentsVar.contentType.parameterCode eq ParameterConst.documentDefinitionTypeGeneratedFromFulfilment
				   					and !agreementBackingBean.managedBean.validBondAttachment)
				   				or (contentsVar.contentType.parameterCode eq ParameterConst.documentDefinitionTypeDefinedFromLoa
				   						and agreementBackingBean.managedBean.migrationContract)}"
							action="#{agreementBackingBean.clickDownloadIcon(contentsVar)}" ajax="false">
							<p:graphicImage  id="downloadFileImg" value="/css/images/design/download.png">
								<p:tooltip for="downloadFileImg">
									<p:outputLabel escape="false" value="#{(contentsVar.contentType.parameterCode eq ParameterConst.documentDefinitionTypeDefinedFromLoa
				   								and agreementBackingBean.managedBean.migrationContract)
				   							? lbl['lbl.ct.tooltip.download.migration.contract'] : lbl['lbl.txt.file.download']}"  />
								</p:tooltip>
							</p:graphicImage>
						</p:commandLink>
					 	<p:spacer width="5" rendered="#{contentsVar.contentType.parameterCode eq ParameterConst.documentDefinitionTypeTemplateDocument}" />
					 	<p:commandLink rendered="#{contentsVar.contentType.parameterCode eq ParameterConst.documentDefinitionTypeTemplateDocument}"
								action="#{agreementBackingBean.gotoTemplateDoc(contentsVar)}">
							<p:graphicImage value="/css/images/design/ico-viewnedit.png" title="#{lbl['lbl.ct.view.document']}" />
						</p:commandLink>
					</h:panelGroup>
				</p:column>
			</p:dataTable>          
		</h:panelGrid>
	</p:panel>	
</ui:composition>
