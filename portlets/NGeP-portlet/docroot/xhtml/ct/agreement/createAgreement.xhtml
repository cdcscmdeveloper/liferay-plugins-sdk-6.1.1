<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
		  <p:panel id="createAgreement" header="#{lbl['lbl.ct.ag.panel.header']}"  toggleable="true"  toggleSpeed="500">
           <h:panelGrid style="width:780px;">  
             <p:spacer height="5"/>
              <p:outputLabel value="#{lbl['lbl.ct.ag.standard']}" style="float:left;" />
              <p:spacer height="5"/>
              <p:dataTable id="standard" var="data" value="#{agreementBackingBean.agreementList}" 
                 widgetVar="dataTableObj" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" 
                    emptyMessage="No Records!">
                    <ac:paginator for="standard"/>
			     <p:columnGroup type="header"> 
				    <p:row> 
					   <p:column style="width:400px;" headerText="#{lbl['lbl.ct.ag.table.section']}" /> 
					   <p:column style="width:150px;" headerText="#{lbl['lbl.ct.ag.table.type']}" /> 	
					   <p:column style="width:100px;" styleClass="column-align-center"
					            headerText="#{lbl['lbl.ct.ag.table.action']}"  /> 
					 </p:row>	
				  </p:columnGroup> 							
				  <p:column> <p:outputLabel value="#{data.agrementTitle}" style="float:left;"/> </p:column>
			      <p:column><p:outputLabel value="#{data.agrementType}" style="float:left;"/> </p:column>	
				  <p:column  styleClass="column-align-center">
				  <p:commandLink partialSubmit="true" process="@this" rendered="#{data.agrementTitle != 'Agreement Clause'}">
			        <p:graphicImage library="ep/images/design" name="search.png" value="/resources/ep/images/design/search.png" title="Search" />
			      </p:commandLink>
				    <p:commandLink partialSubmit="true" process="@this" rendered="#{data.agrementTitle == 'Agreement Clause'}">
			        <p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
			      </p:commandLink>
				  </p:column> 
				</p:dataTable>
			 </h:panelGrid>
			 <h:panelGrid style="width:770px;" columnClasses="column-align-right">
			<p:commandButton id="downloadLink" value="Download" ajax="false" onclick="PrimeFaces.monitorDownload(start, stop)"   
                      icon="ui-icon-download">  
                <p:fileDownload value="#{agreementBackingBean.download}" />  
            </p:commandButton>  
			 </h:panelGrid>
			 <h:panelGrid style="width:780px;">  
               <p:spacer height="5"/>
                 <p:outputLabel value="#{lbl['lbl.ct.ag.appendixes']}" style="float:left;" />
                  <p:spacer height="5"/>
                   <p:dataTable id="appendixes" var="data" value="#{agreementBackingBean.managedBean.appendixList}" widgetVar="dataTableObj" 
                   lazy="false" dynamic="true" rowIndexVar="index" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" 
                    emptyMessage="No Records!">
                    <ac:paginator for="appendixes"/>
					  <p:columnGroup type="header"> 
					      <p:row> 
						      <p:column style="width:200px;" headerText="#{lbl['lbl.ct.ag.table.type']}" /> 	
					         <p:column style="width:200px;" headerText="#{lbl['lbl.ct.ag.table.section']}" /> 
					         <p:column style="width:100px;" headerText="#{lbl['lbl.ct.ag.table.action']}"  /> 
		                  </p:row>	
	               	  </p:columnGroup>
					  <p:column><p:outputLabel value="#{data.title}" style="float:left;" /></p:column>
					  <p:column><p:outputLabel value="#{data.fileName}" style="float:left;"  /></p:column>	
					  <p:column styleClass="column-align-center">
					  <p:commandLink partialSubmit="true" process="@this" onsuccess="confirmation.show()" >
					     <f:setPropertyActionListener value="#{data}" target="#{agreementBackingBean.managedBean.agreementAppendix}" />
			             <p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
			          </p:commandLink>
					  <p:spacer width="3"/>
					   <p:commandLink partialSubmit="true" process="@this">
					      <p:graphicImage library="ep/images/design" name="view.png" value="/resources/ep/images/design/view.png" title="View" />
			          </p:commandLink>
					  </p:column> 
				   </p:dataTable>
			  </h:panelGrid>
			  <h:panelGrid style="width:770px;" columnClasses="column-align-right">
				 <p:commandButton value="#{lbl['lbl.ct.ag.btn.appendixes']}" process="@this" partialSubmit="true" icon="ui-icon-add"  onclick="dlg2.show();" />
				</h:panelGrid>
            </p:panel>
            <p:panel id="uploadAgreements" header="#{lbl['lbl.ct.ag.upload']}"  toggleable="true"  toggleSpeed="500" widgetVar="uploadsagreement">
               <p:spacer width="15"/>
                  <h:panelGrid style="width:780px;">
                    <p:outputLabel value="User is allowed to export the agreement into word document and modifies in word application such as adding image.
                         User is required to upload the modified agreement document in this section. If there is no modification on the agreement generated, 
                         system will automatic generate the agreement in word format for approver review during submission." />
                  </h:panelGrid>
                  <p:spacer width="5"/>
                  <h:panelGrid id="uploadID" columns="3">
                           <p:outputLabel value="#{lbl['lbl.ct.ag.doc']} :"/>
                           <p:commandLink>  
                           <p:outputLabel value="#{agreementBackingBean.managedBean.agreement.fileName}"/>  
                           </p:commandLink> 
                            <p:fileUpload fileUploadListener="#{agreementBackingBean.fileUpload}" mode="advanced" id="uploadFile"
		                         allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
		                        invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted" update="uploadID" >
	                      </p:fileUpload> 
			      </h:panelGrid>
                </p:panel>
                <p:confirmDialog message="Do you want to delete the record?"
				  closable="true" appendToBody="true" header="Delete Confirmation"
							severity="alert" widgetVar="confirmation">
                         	<h:panelGrid columns="2">
								<p:commandButton value="Yes" icon="ui-icon-accept"
									update="appendixes" partialSubmit="true" process="@this" actionListener="#{agreementBackingBean.deleteAgreementAppendix()}"
									onclick="confirmation.hide();"/>
								    <p:commandButton value="No" icon="ui-icon-reject"
									onclick="confirmation.hide()" type="button" />
							</h:panelGrid>
						</p:confirmDialog>
               <p:dialog id="modalDialog" header="#{lbl['lbl.ct.ag.dailog.header']}" widgetVar="dlg2" modal="true" width="600" height="300">
				<p:panel  id="appendix">
					 <h:panelGrid columns="1">
                       <h:panelGrid columns="2" style="width:350px;">
					        <p:outputLabel value="#{lbl['lbl.ct.ag.dailog.title']}" style="width:80px;" />
            				<p:outputLabel value="#{lbl['lbl.ct.ag.dailog.scope']}"  style="float:left;"  />
							<p:outputLabel  value="#{lbl['lbl.ct.ag.dailog.type']}" style="width:80px;"  />
            				<p:selectOneMenu  value="#{agreementBackingBean.managedBean.agreementAppendix.title}"  style="width:200px;">
            			    <f:selectItem itemLabel="--Please Select--" itemValue="--Please Select--" /> 
            			    <f:selectItems value="#{agreementBackingBean.agreementApendex}" />
            					  <p:ajax event="change" update="changeField" listener="#{agreementBackingBean.changeApendexType}" process="@this"/>  
	                         </p:selectOneMenu> 
						</h:panelGrid>
                       <p:outputPanel id="changeField"> 
						  <h:panelGrid rendered="#{agreementBackingBean.systemDefined}" columns="2" style="width:350px;">
						    <h:panelGroup>
			                <div style="height: 30px; width:95px; vertical-align: top;">
			                  <p:outputLabel for="sourcingFiles" value="#{lbl['lbl.ct.ag.dailog.file']}" />
							 </div>
						     </h:panelGroup>
						     <h:panelGrid>
                             <p:selectOneListbox id="sourcingFiles" value="#{agreementBackingBean.managedBean.agreementAppendix.fileName}" style="width:200px;">
                              <f:selectItems value="#{agreementBackingBean.sourcingFiles}" />    
                           </p:selectOneListbox>
                           </h:panelGrid>
						   </h:panelGrid>            
                           <h:panelGrid id="uploadApexFile" rendered="#{agreementBackingBean.userUploaded}" columns="3">
                           <p:outputLabel value="#{lbl['lbl.ct.ag.upload.file']}" style="width:80px;"/>
                           <p:commandLink>  
                           <p:outputLabel value="#{agreementBackingBean.managedBean.agreementAppendix.fileName}"/>  
                           </p:commandLink> 
                            <p:fileUpload fileUploadListener="#{agreementBackingBean.fileApexUpload}" mode="advanced" process="@this" 
		                         allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
		                        invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted" update="uploadApexFile" >
	                      </p:fileUpload> 
			              </h:panelGrid>
                         
						 </p:outputPanel>
						</h:panelGrid>
						 <f:facet name="footer">
							<h:panelGrid columns="2" style="float:right;height:100px;vertical-align: middle;">
							<p:commandButton value="Select" process="modalDialog" actionListener="#{agreementBackingBean.addAgreementAppendex}" 
				                update="appendixes" onclick="dlg2.hide();"/>
							<p:commandButton value="#{lbl['lbl.ct.ag.btn.cancel']}" type="button" ajax="false" onclick="dlg2.hide();" />
						</h:panelGrid>
						</f:facet>
					</p:panel>
				</p:dialog>
</ui:composition>
