<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
   <p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true" toggleSpeed="500">
	  <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth15">
		 <h:outputLabel value="#{lbl['lbl.ct.cno']}"/>
		 <h:commandLink value="#{agreementBackingBean.managedBean.ctContract.contractNo}" styleClass="blue_font"/>
         <p:outputLabel value="#{lbl['lbl.ct.physicalNo']}" />
		 <p:inputText style="width:170px;"  disabled="true" 
		   value="#{agreementBackingBean.managedBean.ctContract.currentContractVer.ctContractValue.contractPhysicalNo}" />				
		 <p:outputLabel value="#{lbl['lbl.ct.fulfilmentType']}" />
		 <p:inputText style="width:170px;" disabled="true" 
		    value="#{agreementBackingBean.getParameterDesc(agreementBackingBean.managedBean.ctContract.fulfillmentType)}" />				
		 <p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
		 <p:inputText style="width:170px;" disabled="true" 
		    value="#{agreementBackingBean.managedBean.ctContract.loaNo}" />
		 <p:outputLabel id="edate" value="#{lbl['lbl.ct.effectiveDate']}" />
		 <p:inputText for="edate" style="width:130px;" disabled="true"
			value="#{agreementBackingBean.convertTime(agreementBackingBean.managedBean.ctContract.currentContractVer.ctContractValue.effDate)}" />
		 <h:outputLabel id="expdate" value="#{lbl['lbl.ct.edate']}" />
		 <p:inputText for="expdate" style="width:130px;" disabled="true"
			value="#{agreementBackingBean.convertTime(agreementBackingBean.managedBean.ctContract.currentContractVer.ctContractValue.expDate)}" />
		<p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contractAmount']}" />
		<p:inputText for="contractAmount"  styleClass="ppRightBtn" disabled="true" style="width:130px;"
		   value="#{agreementBackingBean.managedBean.ctContract.currentContractVer.ctContractValue.contractAmount}">
		   <f:convertNumber pattern="#,###.00" />
		</p:inputText>	
		<h:outputLabel value="#{lbl['lbl.ct.dperiod']}" />
		<h:panelGrid columns="3">
		   <p:inputText size="8" value="#{agreementBackingBean.managedBean.ctContract.currentContractVer.ctContractValue.deliveryTerm}"   />
		   <p:spacer width="2"/>
		   <p:outputLabel value="Days" />
		 </h:panelGrid>
		 <h:panelGroup>
		    <div style="height: 40px; vertical-align: top;">
			   <p:outputLabel for="contractName" value="Contract Title" />
			</div>
		 </h:panelGroup>
		 <h:panelGrid>
		   <p:inputTextarea id="contractName" required="false" rows="3" cols="31" disabled="true"
			  autoResize="false" value="#{agreementBackingBean.managedBean.ctContract.contractName}"/>	
		 </h:panelGrid>		
		 <f:verbatim />
		 <f:verbatim />
		 <h:outputLabel rendered="#{agreementBackingBean.managedBean.ctContract.circular.latestCircularVer.circularNo != null}"
			value="#{lbl['lbl.ct.circularNo']}" />
			<h:commandLink rendered="#{agreementBackingBean.managedBean.ctContract.circular.latestCircularVer.circularNo != null}"
			  style="margin-right:20px;" ajax="false">
			  <h:outputText value="#{agreementBackingBean.managedBean.ctContract.circular.latestCircularVer.circularNo}" 
			  styleClass="linkcommand" />
			</h:commandLink>
		</h:panelGrid>
	</p:panel>
</ui:composition>
