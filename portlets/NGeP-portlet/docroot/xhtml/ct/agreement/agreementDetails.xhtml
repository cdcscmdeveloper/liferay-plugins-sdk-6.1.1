<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="fd" toggleable="true" collapsed="false" toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.contract']}" />
			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fulfilment.dtls']}" />
		</f:facet>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br /><br />
		
		<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
			<h:panelGroup style="width:765px;" >
			<table style="width: 100%">
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="cno" value="#{lbl['lbl.ct.contract.no']}" />
					</td>
					<td>
						<h:panelGrid columns="3">
							<p:commandLink value="#{agreementBackingBean.managedBean.ctContract.contractNo}"
								styleClass="blue_font" action="#{agreementBackingBean.goToContractView}">
								<f:param name="contractVerId" value="#{agreementBackingBean.managedBean.contractVer.contractVerId}" />
							</p:commandLink>
							<p:spacer width="1" />
							<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.no']}" />
						</h:panelGrid>
					</td>
					<h:panelGroup>
					<td class="columnWidth150">
	     	             	<p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physical.no']}"  styleClass="required"/>
					</td> 
					<td>
						<p:inputText id="contractPhysicalNo" for="physicalNo"
							value="#{agreementBackingBean.managedBean.agreementContractVer.contractPhysicalNo}"
							style="width:130px;" maxlength="30" required="true" label="#{lbl['lbl.ct.physical.no']}" >
							<p:ajax update="@this" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.physical.contract.no']}" />
					</td>
					</h:panelGroup>
				</tr>
				<tr rowspan="2">
					<td class="columnWidth150">
						<p:outputLabel value="#{lbl['lbl.ct.loa.no']}" />
					</td> 
					<td>
						<p:inputTextarea autoResize="false"  style="width:130px;margin-bottom:5px;" 
						     disabled="true" rows="2" maxlength="30" value="#{agreementBackingBean.managedBean.agreementContractVer.ctContractValue.loaNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.loa.no']}" />
					</td>
					<td class="columnWidth150">
						<p:outputLabel value="#{lbl['lbl.ct.loa.physical.no']}" />
					</td>
					<td>
						<p:inputTextarea autoResize="false" maxlength="1000" 
							disabled="true" rows="2" style="width:130px;margin-bottom:5px;"
							value="#{agreementBackingBean.managedBean.agreementContractVer.ctContractValue.loaPhysicalNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.loa.physical.no']}" />
					</td>					
				</tr>
				<tr>
			     <td class="columnWidth150">
						<p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contract.amount']}" />
					</td>
					<td>
						<p:inputText for="contractAmount" styleClass="ppRightBtn"  maxlength="22" style="width:90px;"
			   				value="#{agreementBackingBean.managedBean.contractVer.ctContractAmount.contractAmount}"  disabled="true">
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</td>	
					<td class="columnWidth150">
						<p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effective.date']}" />
					</td>
					<td>
						<p:inputText for="effectiveDate" disabled="true" style="width:80px;"
							value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
				</tr>				
				<tr>
				    <td class="columnWidth150">
				       <p:outputLabel id="gstAmount" value="#{lbl['lbl.ct.gst.amt']}"  />
					</td>
					<td>
						<p:inputText for="gstAmount" styleClass="ppRightBtn"  maxlength="22" style="width:90px;"
			   				 disabled="true" 
			   				 rendered="#{ctBackingBean.managedBean.gstCheckingGUI}"
			   				 value="#{agreementBackingBean.managedBean.contractVer.ctContractAmount.gstAmount}" >
			   				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
						<p:inputText styleClass="ppRightBtn" style="width:90px;" disabled="true" 
			   				  rendered="#{!ctBackingBean.managedBean.gstCheckingGUI}" value="#{lbl['lbl.txt.na']}">
						</p:inputText>
				     </td>
				<td class="columnWidth150">
						<p:outputLabel id="edate" value="#{lbl['lbl.ct.expiry.date']}" />
					</td> 
					<td>
						<p:inputText for="edate" disabled="true" style="width:80px;"
							value="#{agreementBackingBean.managedBean.ctAgreement.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
				</tr>
				  <tr>
					<td class="columnWidth150">
						<p:outputLabel id="overAllAmt" value="#{lbl['lbl.ct.gst.all.amt']}" />
					</td>
					<td>
						<p:inputText id="overAllAmts" styleClass="ppRightBtn"  maxlength="22" style="width:90px;"
			   				value="#{agreementBackingBean.managedBean.contractVer.ctContractAmount.gstAmount + agreementBackingBean.managedBean.contractVer.ctContractAmount.contractAmount}"  disabled="true">
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</td>
					   <td>
			            <p:outputLabel value="#{lbl['lbl.ct.proc.type.category']}" />
			        </td>
			        <td>
			           <p:inputText style="width:130px;" disabled="true"  
			                value="#{agreementBackingBean.getParameterDesc(agreementBackingBean.managedBean.contractVer.ctContractValue.procurementTypeCategory)}" />		
			        </td>
					</tr>
				<tr rowspan="4">
					<td class="columnWidth150">
						<p:outputLabel for="contractName" value="#{lbl['lbl.ct.contract.title']}" />
					</td>
					<td colspan="3">
						<p:inputTextarea id="contractName" autoResize="false" maxlength="1000"
							disabled="true" rows="4" style="width:455px; margin-bottom:5px;" 
							value="#{agreementBackingBean.managedBean.ctContract.contractName}" />
					</td>					
				</tr>
			</table>
		</h:panelGroup>
		<h:panelGrid style="width:265px; margin-left:5px">
		   <h:panelGrid columns="3" rendered="#{agreementBackingBean.managedBean.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase
		   		and agreementBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
			 <p:selectBooleanCheckbox value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="true">
			 </p:selectBooleanCheckbox>
			 <p:spacer width="2" />
			 <h:panelGrid columns="2">
				 <h:outputText value="#{lbl['lbl.ct.concession']}" />
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.concession']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		    <h:panelGrid columns="3"
		       rendered="#{agreementBackingBean.managedBean.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase}">
			  <p:selectBooleanCheckbox id="exemptId" value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			   	disabled="true" style="text-align:top;">
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.ap201']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap201.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
			       <p:selectBooleanCheckbox disabled="true" 
			             value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.pid}"  style="text-align:top;">
			         </p:selectBooleanCheckbox>
			         <p:spacer width="2" />	
			          <h:panelGrid columns="2">
			  	            <h:outputText value="#{lbl['lbl.ct.pid']}"  />
			  	           <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.pid']}" />
			  	      </h:panelGrid>
		 </h:panelGrid>	
		   
		   <h:panelGrid columns="3" 
		     rendered="#{agreementBackingBean.managedBean.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase
		     	and agreementBackingBean.managedBean.contractVer.ctContractAmount.bondReq}">
			 <p:selectBooleanCheckbox value="#{agreementBackingBean.managedBean.contractVer.ctContractAmount.bondExempted}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.pb.exemption']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		      <h:panelGrid columns="2">
			     <h:outputText value="#{lbl['lbl.ct.fee.exmption']}"/>
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fee.exmption']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox 
			  value="#{agreementBackingBean.managedBean.contractVer.ctContractAmount.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <h:panelGrid columns="2">
			     <h:outputText value="#{lbl['lbl.ct.has.agreement']}" />
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement']}" />
			 </h:panelGrid>
	       </h:panelGrid>	       
	       <h:panelGrid columns="3" 
	          	rendered="#{false and agreementBackingBean.managedBean.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase
	          	and agreementBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
			  <p:selectBooleanCheckbox value="#{agreementBackingBean.managedBean.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.mto']}" />
			  </h:panelGrid>
		   </h:panelGrid>	
		     <h:panelGrid columns="3" rendered="#{agreementBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral}">  
			   <p:selectBooleanCheckbox 
			      value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.followLoaAmt}"  disabled="true"/>
		       <p:spacer width="2" />
		       <h:panelGrid columns="2">
		       		<h:outputText value="#{lbl['lbl.ct.follow.ctvalue']}" />
		       		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fctvalue']}" />
			   </h:panelGrid>
		     </h:panelGrid>	
	    </h:panelGrid>
		</h:panelGrid>
		<p:outputPanel id="justificationPanel">
		<h:panelGrid columns="2" style="width:765px;"  columnClasses="columnWidth150"
			rendered="#{agreementBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt or 
		 	agreementBackingBean.managedBean.contractVer.ctContractValue.concession}">
			<p:outputLabel for="justificationLbl" value="#{lbl['lbl.ct.justification.ap201']}" style="width:120px;" />
			<p:inputTextarea id="justificationLbl" value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.justification}"
	  			rows="3" style="width:455px;" maxlength="200" autoResize="false" disabled="true" />			
	    </h:panelGrid> 
	  	</p:outputPanel>
	</p:panel>
</ui:composition>
