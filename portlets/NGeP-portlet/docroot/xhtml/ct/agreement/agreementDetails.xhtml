<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true" collapsed="false" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		   <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth15,columnWidth20,columnWidth20,columnWidth20">
		      <p:outputLabel id="cno" value="#{lbl['lbl.ct.cno']}" />
		      <h:commandLink value="#{agreementBackingBean.managedBean.ctContract.contractNo}" styleClass="blue_font"/>
			  <p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physicalNo']}" />
		 	  <p:inputText for="physicalNo" value="#{agreementBackingBean.managedBean.ctContract.contractPhysicalNo}" style="width:170px;" />				
		      <p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effectiveDate']}" />
			  <p:inputText for="effectiveDate" style="width:170px;" disabled="true"
				value="#{agreementBackingBean.convertTime(agreementBackingBean.managedBean.contractVer.ctContractValue.effDate)}" />
			  <p:outputLabel id="edate" value="#{lbl['lbl.ct.edate']}" />
			  <p:inputText for="edate" style="width:170px;" disabled="true"
				value="#{agreementBackingBean.convertTime(agreementBackingBean.managedBean.contractVer.ctContractValue.expDate)}" />
			  <p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contractAmount']}" />
			  <p:inputText for="contractAmount" styleClass="ppRightBtn" value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				 disabled="true" style="width:170px;">
				   <f:convertNumber pattern="#,###.00" />
			</p:inputText>	
			<p:outputLabel id="signBy" value="Signed Date"  rendered="#{agreementBackingBean.managedBean.ctContract.agreement}" />
			<p:inputText for="signBy"  value="#{agreementBackingBean.convertTime(agreementBackingBean.managedBean.ctContract.currentAgreement.signedDate)}"
			   rendered="#{agreementBackingBean.managedBean.ctContract.agreement}" disabled="true" style="width:170px;"/>
			<h:outputLabel id="dperiod" value="#{lbl['lbl.ct.dperiod']}" rendered="#{!agreementBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:panelGrid columns="3" rendered="#{!agreementBackingBean.managedBean.ctContract.zonalPricing}">
				<p:inputText for="dperiod" styleClass="ppRightBtn" size="23" value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" 
					disabled="#{agreementBackingBean.managedBean.ctContract.zonalPricing}" />
				<p:spacer width="2"/>
				<p:outputLabel value="Days" />
			</h:panelGrid>	
			<f:verbatim rendered="#{agreementBackingBean.managedBean.ctContract.zonalPricing and !agreementBackingBean.managedBean.ctContract.agreement}"/>
			<f:verbatim rendered="#{agreementBackingBean.managedBean.ctContract.zonalPricing and !agreementBackingBean.managedBean.ctContract.agreement}"/>
			 <p:outputLabel for="astatus" value="Agreement Status" rendered="#{agreementBackingBean.managedBean.ctContract.agreement and 
			    !agreementBackingBean.managedBean.ctContract.zonalPricing}" />
			 <p:inputText id="astatus" style="width:170px;" disabled="true" 
			  value="#{agreementBackingBean.getStatusDescById(agreementBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}"
			  rendered="#{agreementBackingBean.managedBean.ctContract.agreement and !agreementBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="Contract Title" />
			</div>
			</h:panelGroup>
		    <h:panelGrid>
			<p:inputTextarea id="contractName"
				value="#{agreementBackingBean.managedBean.ctContract.contractName}"
				required="false" rows="3" cols="31" disabled="true" style="margin-bottom: 5px;"
				autoResize="false" />	
			</h:panelGrid>	
			<p:outputLabel id="astatus1" value="Agreement Status" rendered="#{agreementBackingBean.managedBean.ctContract.agreement and 
			   agreementBackingBean.managedBean.ctContract.zonalPricing}" />
			<p:inputText for="astatus1" style="width:170px;" disabled="true" 
			  value="#{agreementBackingBean.getStatusDescById(agreementBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}"
			 rendered="#{agreementBackingBean.managedBean.ctContract.agreement and agreementBackingBean.managedBean.ctContract.zonalPricing}" />
	    </h:panelGrid>
		<h:panelGrid  style="width:180px;">
		   <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="true">
			 </p:selectBooleanCheckbox>
			 <p:spacer width="2" />
			 <p:outputLabel value="Concession" />
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		     <p:outputLabel value="Fee Exemption"/>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox 
			  value="#{agreementBackingBean.managedBean.ctContract.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
	       </h:panelGrid>	
	       <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox value="#{agreementBackingBean.managedBean.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
		   </h:panelGrid>	
		   <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox id="exemptId" value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			    disabled="true" style="text-align:top;">
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <p:outputLabel value="AP201 Exemption" style="text-align:top;" />
		   </h:panelGrid>	
		    <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{agreementBackingBean.managedBean.ctContract.bondReq ? false : true}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.chkbx.pbexemption']}" style="text-align:top;" />
		   </h:panelGrid>
	    </h:panelGrid>
	</h:panelGrid>
	<p:outputPanel id="justificationPanel">
	 <h:panelGrid columns="2" style="width:100%;" columnClasses="columnWidth15" 
	    rendered="#{agreementBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt or 
	       agreementBackingBean.managedBean.contractVer.ctContractValue.concession}">
         <h:panelGroup>
		    <div style="height:70px; vertical-align:top;">
			   <p:outputLabel id="justificationLbls" value="* Justification" />
		    </div>
	     </h:panelGroup>
	  <h:panelGrid columns="1">
	    <p:inputTextarea id="justificationLbl" value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.justification}"
		  rows="4" cols="113" disabled="true" required="true" autoResize="false"></p:inputTextarea>	
	  </h:panelGrid>		
    </h:panelGrid> 
  </p:outputPanel>
 </p:panel>
</ui:composition>
