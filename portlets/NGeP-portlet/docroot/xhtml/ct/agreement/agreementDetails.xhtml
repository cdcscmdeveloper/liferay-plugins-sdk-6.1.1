		    <f:selectItem itemLabel="Years" itemValue="Years" />

         </h:panelGrid>
         <h:outputLabel value="#{lbl['lbl.ct.camount']}"/>

			  <f:selectItem itemLabel="MYR" itemValue="MYR"/>

            <p:selectOneMenu disabled="false"  style="width:20px;">
