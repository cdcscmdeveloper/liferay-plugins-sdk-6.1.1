<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="agencyPanelId" header="#{lbl['lbl.ct.ag.agysigndtls']}"  toggleable="true"  toggleSpeed="500">
    <h:panelGrid style="width:100%">
     <p:outputLabel value="#{lbl['lbl.ct.ag.signer']}" style="float:left;"/>
      <p:dataTable id="AgSignerTable" var="agSignerVar" value="#{agreementBackingBean.managedBean.ctAgencySigner}" 
	     selection="#{agreementBackingBean.selectedAgencySigner}" rowKey="#{agSignerVar}">
		 <ac:paginator for="AgSignerTable"/>
		 <p:column selectionMode="multiple" style="width:2%"/>  
		 <p:column style="width:15%; white-space:normal;"  headerText="#{lbl['lbl.ct.ag.ministry']}" 
		   rendered="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile != null and
		   		agreementBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile.orgProfileId != null}" >
		   <p:outputLabel value="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile.orgName}"/>
		 </p:column>
         <p:column style="width:25%;" headerText="#{lbl['lbl.ct.ag.ptj']}">
            <p:selectOneMenu id="ptj" value="#{agSignerVar.orgProfile.orgProfileId}"  style="width:320px;" label="#{lbl['lbl.ct.ag.view.ct.ptj']}" 
            	rendered="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile != null and
            		agreementBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile.orgProfileId != null}" >
              <f:selectItems value="#{agreementBackingBean.getPtjCodeName()}"/>
            <p:ajax event="change" update="contractSigner" process="@this"/> 
            </p:selectOneMenu>
            <p:outputLabel value="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}" style="float:left;" 
            	rendered="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile == null or
            		agreementBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile.orgProfileId == null}" />
         </p:column>
         <p:column style="width:15%;" headerText="#{lbl['lbl.ct.ag.csigner']}" styleClass="companyHeaderGrid">
           <p:selectOneMenu id="contractSigner"
              value="#{agSignerVar.officer.userId}"  style="width:180px;" label="#{lbl['lbl.ct.ag.csigner']}">
              <f:selectItems value="#{agreementBackingBean.getContractSignerDropdown(agSignerVar)}"/>
              <p:ajax event="change" update="agOfId,agOfPosition" process="@this" 
                 listener="#{agreementBackingBean.setUserValueAgency(agSignerVar,agSignerVar.officer.userId)}"/> 
           </p:selectOneMenu>
         </p:column>  
         <p:column style="width:10%; white-space:normal;" headerText="#{lbl['lbl.ct.ag.icno']}">
             <p:outputLabel id="agOfId" value="#{agSignerVar.officerIc}" style="float:left;"/>
         </p:column>         
         <p:column style="width:10%; white-space:normal;" headerText="#{lbl['lbl.ct.ag.position']}">
            <p:outputLabel id="agOfPosition" value="#{agSignerVar.officerPosition}" style="float:left;"/>
         </p:column> 
       </p:dataTable>
     </h:panelGrid>
      <div class="ppRightBtn"> 
		  <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" 
		    action="#{agreementBackingBean.addAgencySignerParty()}" icon="ui-icon-add" update=":form:AgSignerTable"/>
		  <p:commandButton value="#{lbl['lbl.btn.delete']}"
		     icon="ui-icon-delete" process="@form" onsuccess="dlgAgSignerDel.show()"/>
	  </div>
	   <p:dialog id="dlgAgSignerDel" widgetVar="dlgAgSignerDel" header="Delete Confirmation" styleClass="screen-title"  
           resizable="false" modal="true" width="350" height="95">  
            <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png"
			   value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
              <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" 
              styleClass="ui-inputtextarea"></p:inputTextarea>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:AgSignerTable" process="@form" 
				actionListener="#{agreementBackingBean.deleteAgencySignerParty()}" onclick="dlgAgSignerDel.hide();"/>
			  <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgAgSignerDel.hide();" type="button" />
		   </div>
        </p:dialog>  
	  <p:spacer width="15"/>
      <h:panelGrid style="width:100%">  
         <p:outputLabel value="#{lbl['lbl.ct.ag.witness']}" style="float:left;"/>
          <p:dataTable id="AgWitnessTable" var="signAgWitnessVar" value="#{agreementBackingBean.managedBean.ctSignAgencyWitness}" 
	         selection="#{agreementBackingBean.selectedAgencyWitnes}" rowKey="#{signAgWitnessVar}">
		 <ac:paginator for="AgWitnessTable"/>
		 <p:column selectionMode="multiple" style="width:2%"/> 
		 <p:column headerText="Name" style="width:50%;">
		    <p:inputText value="#{signAgWitnessVar.officerName}" style="width:90%" maxlength="20"/>
		 </p:column> 
		  <p:column headerText="IC No." style="width:20%;">
		    <p:inputText value="#{signAgWitnessVar.officerIc}" style="width:90%" maxlength="20"/>
		 </p:column> 
		  <p:column headerText="#{lbl['lbl.ct.ag.position']}" style="width:30%;">
		    <p:inputText value="#{signAgWitnessVar.officerPosition}" style="width:90%" maxlength="255"/>
		 </p:column> 
		</p:dataTable>
      </h:panelGrid>
      <div class="ppRightBtn"> 
		  <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" icon="ui-icon-add"
		     action="#{agreementBackingBean.addAgencyWitnes()}" update=":form:AgWitnessTable"/>
		  <p:commandButton value="#{lbl['lbl.btn.delete']}" 
		    icon="ui-icon-delete" process="@form" onsuccess="dlgAgWitnessDel.show()"/>
	  </div>
	   <p:dialog id="dlgAgWitnessDel" widgetVar="dlgAgWitnessDel" header="#{lbl['lbl.ct.dialog.confirm.header']}" 
	      styleClass="screen-title" resizable="false" modal="true" width="350" height="95">  
            <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png"
			   value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
              <p:inputTextarea value="Are you sure you want to delete this record?" rows="2" cols="48" 
              styleClass="ui-inputtextarea"></p:inputTextarea>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" process="@form"
		      update=":form:AgWitnessTable" actionListener="#{agreementBackingBean.deleteAgencyWitnes()}" onclick="dlgAgWitnessDel.hide();"/>
			  <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgAgWitnessDel.hide();" type="button" />
		   </div>
        </p:dialog>  
	</p:panel>		   	
</ui:composition>
