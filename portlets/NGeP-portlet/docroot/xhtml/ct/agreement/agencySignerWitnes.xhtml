<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
   
    <p:panel id="agencyPanelId"  toggleSpeed="500"  header="#{lbl['lbl.ct.panel.agency.signing']}"  toggleable="true"  >
         <h:panelGrid style="width:980px;">
           		
           		<h:panelGrid columns="3">
   					<p:outputLabel value="#{lbl['lbl.ct.signer']}" style="float:left;"/>
      				<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.signer']}" />
		 		 </h:panelGrid>
               
                 <p:dataTable id="AgSignerTable" var="agSignerVar" 
                       value="#{agreementBackingBean.managedBean.ctAgencySigner}" widgetVar="AgSignerObj" 
                       selection="#{agreementBackingBean.selectedAgencySigner}" rowKey="#{agSignerVar}" rowIndexVar="index">
		          
		               <ac:paginator for="AgSignerTable"/>
		               <p:column selectionMode="multiple" style="width:5%;"/>  
		               
		               <p:column style="width:20%; white-space:normal;"  headerText="#{lbl['lbl.ct.ptj']}"
		                      rendered="#{agreementBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
		                   <h:outputText value="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}"/>
		               </p:column>
		        
		               <p:column style="width:20%; white-space:normal;"  headerText="#{lbl['lbl.ct.ministry']}"
		                       rendered="#{agreementBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
		                   <h:outputText value="#{agreementBackingBean.retrieveMinistryByOrgProfileId(agreementBackingBean.managedBean.ctContract.ownerOrgProfile.orgProfileId)}"/>
		               </p:column>
        
                        <p:column style="width:30%;" headerText="#{lbl['lbl.ct.ptj']}" 
                             rendered="#{agreementBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
                              <h:panelGroup>
                                   <ac:lov id="listOfPtj" lovId="PM_ORG_PROFILE" headerText="#{lbl['lbl.ct.ptj']}" 
                                     saveObject="agreementBackingBean.managedBean.ctAgencySigner[#{index}].orgProfile"
                                     postUpdateListener="agreementBackingBean.validateDuplicateAgencyPtj(#{index},agreementBackingBean.managedBean.ctAgencySigner,agreementBackingBean.managedBean.ctAgencySigner[#{index}].orgProfile)"
						             value="#{agSignerVar.orgProfile.orgName}" readonly="true" size="35" 
						            conditionField="#{agreementBackingBean.retrievePtjBylovCondition()}" update="@form">
					              </ac:lov>
					         </h:panelGroup>
					     </p:column>
			
                         <p:column style="width:15%;" headerText="#{lbl['lbl.ct.contract.signer']}" styleClass="companyHeaderGrid">
                             <p:selectOneMenu id="contractSigner" 
                                 style="width:180px;" value="#{agSignerVar.officer.userId}"   label="#{lbl['lbl.ct.contract.signer']}">
                                 <f:selectItems value="#{agreementBackingBean.getContractSignerDropdown(agSignerVar)}"/>
                                 <p:ajax event="change" update="@([id$=agOfId],[id$=agOfPosition])"  
                                      onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
                                     process="@all" listener="#{agreementBackingBean.setUserValueAgency(agSignerVar)}"/> 
                             </p:selectOneMenu>
                         </p:column>  
        
                         <p:column style="width:10%; white-space:normal;" headerText="#{lbl['lbl.ct.ic.no']}">
                              <h:outputText id="agOfId" value="#{agSignerVar.officerIc}" style="float:left;"/>
                         </p:column>         
               
                         <p:column style="width:20%; white-space:normal;" headerText="#{lbl['lbl.ct.designation']}">
                              <h:outputText id="agOfPosition" value="#{agSignerVar.officerPosition}" style="float:left;"/>
                         </p:column> 
                 </p:dataTable>
           </h:panelGrid>
           <div class="ppRightBtn"> 
		      <p:commandButton id="addAgencySignerBtn" value="#{lbl['lbl.btn.add']}" 
		          action="#{agreementBackingBean.addAgencySignerParty()}" process="@form" 
		           update=":form:AgSignerTable"  onstart="blockWidget.show();" oncomplete="blockWidget.hide();">
		          <p:tooltip for="addAgencySignerBtn">
			 	     <h:outputText value="#{lbl['lbl.ct.tooltip.add.agency.signer']}" escape="false" />
			      </p:tooltip>
		      </p:commandButton>
		      <p:commandButton id="delAgencySignerBtn" process="@form" 
		          value="#{lbl['lbl.btn.delete']}"   onsuccess="dlgAgSignerDel.show()">
		  	       <p:tooltip for="delAgencySignerBtn">
				      <h:outputText value="#{lbl['lbl.ct.tooltip.delete.agency.signer']}" escape="false" />
			       </p:tooltip>
		       </p:commandButton>
	        </div>
	  
	        <p:dialog id="dlgAgSignerDel" 
	            widgetVar="dlgAgSignerDel" styleClass="screen-title" modal="true" width="330">  
                <h:panelGrid columns="3">
                   <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			       <p:spacer width="10"/>
                   <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
                </h:panelGrid>
                <div class="ppRightBtn">
		           <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:AgSignerTable" 
		               process="@form" actionListener="#{agreementBackingBean.deleteAgencySignerParty()}" onclick="dlgAgSignerDel.hide();"/>
			       <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgAgSignerDel.hide();" type="button" />
		        </div>
             </p:dialog>  
	 
	         <p:spacer width="15"/>
             <h:panelGrid style="width:980px;">
			  
			       <h:panelGrid columns="3">
   				    	<p:outputLabel value="#{lbl['lbl.ct.witness']}" style="float:left;"/>
      				    <p:spacer width="1"/>
					    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.witness']}" />
		 	       </h:panelGrid>
                  
                   <p:dataTable id="AgWitnessTable" var="signAgWitnessVar"
                        value="#{agreementBackingBean.managedBean.ctSignAgencyWitness}" widgetVar="AgWitnessObj" 
	                    selection="#{agreementBackingBean.selectedAgencyWitnes}" rowKey="#{signAgWitnessVar}">
		                
		                <ac:paginator for="AgWitnessTable"/>
		                <p:column selectionMode="multiple" style="width:2%"/> 
		
		                <p:column headerText="#{lbl['lbl.ct.name']}" style="width:35%;">
		                      <p:inputText value="#{signAgWitnessVar.officerName}" 
		                          style="width:90%" maxlength="20" />
		                </p:column> 
		
		                <p:column headerText="#{lbl['lbl.ct.ic.no']}" style="width:20%;">
		                    <p:inputText value="#{signAgWitnessVar.officerIc}" style="width:90%"
		                        label="#{lbl['lbl.ct.ic.no']}"  maxlength="12">
		                    <p:ajax event="blur" process="@form" listener="#{agreementBackingBean.addAgencyWitnes(1)}"
		                       onstart="blockWidget.show();" oncomplete="blockWidget.hide();"></p:ajax>
		                    </p:inputText>
		                </p:column> 
		         
		                <p:column headerText="#{lbl['lbl.ct.designation']}" style="width:45%;">
		                     <p:inputText value="#{signAgWitnessVar.officerPosition}" style="width:90%" maxlength="255"/>
		                </p:column> 
		           </p:dataTable>
             </h:panelGrid>
      
             <div class="ppRightBtn"> 
		       <p:commandButton id="addAgencyWitnessBtn" value="#{lbl['lbl.btn.add']}" 
		            action="#{agreementBackingBean.addAgencyWitnes(2)}" 
		           process="@form" onstart="blockWidget.show();"
		           oncomplete="blockWidget.hide();" update=":form:AgWitnessTable">
		           <p:tooltip for="addAgencyWitnessBtn">
				      <h:outputText value="#{lbl['lbl.ct.tooltip.add.agency.witness']}" escape="false" />
			       </p:tooltip>
		       </p:commandButton>
		       <p:commandButton id="delAgencyWitnessBtn" process="@form"
		            value="#{lbl['lbl.btn.delete']}"    onsuccess="dlgAgWitnessDel.show()">
		            <p:tooltip for="delAgencyWitnessBtn">
			             <h:outputText value="#{lbl['lbl.ct.tooltip.delete.agency.witness']}" escape="false" />
			        </p:tooltip>
		        </p:commandButton>
	        </div>
	        <p:dialog id="dlgAgWitnessDel" 
	            widgetVar="dlgAgWitnessDel" styleClass="screen-title" modal="true" width="330">  
                <h:panelGrid columns="3">
                   <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			       <p:spacer width="10"/>
                   <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
                </h:panelGrid>
               <div class="ppRightBtn">
		          <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:AgWitnessTable"  
		              process="@form"  actionListener="#{agreementBackingBean.deleteAgencyWitnes()}" onclick="dlgAgWitnessDel.hide();"/>
			      <p:commandButton value="#{lbl['lbl.btn.no']}" onclick="dlgAgWitnessDel.hide();" type="button" />
		       </div>
           </p:dialog>  
	   </p:panel>		
	<ac:lovPopup />   	
</ui:composition>
