<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="agencyPanelId" header="#{lbl['lbl.ct.ag.agysigndtls']}"  toggleable="true"  toggleSpeed="500">
    <h:panelGrid style="width:100%">
     <p:outputLabel value="#{lbl['lbl.ct.ag.signer']}" style="float:left;"/>
      <p:dataTable id="AgSignerTable" var="data" value="#{agreementBackingBean.managedBean.ctAgencySigner}" 
	     selection="#{agreementBackingBean.selectedAgencySigner}" rowKey="#{data}">
		 <ac:paginator for="AgSignerTable"/>
		 <p:column selectionMode="multiple" style="width:2%"/>  
		 <p:column style="width:15%; white-space:normal;"  headerText="#{lbl['lbl.ct.ag.ministry']}">
		   <p:outputLabel value="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"/>
		 </p:column> 
         <p:column style="width:20%;"  headerText="#{lbl['lbl.ct.ag.department']}"> 	
           <p:selectOneMenu id="department" value="#{data.orgProfile.parentOrgProfile.orgProfileId}"  style="width:95%;" >
              <f:selectItems value="#{agreementBackingBean.getDepartmentDropdown(agreementBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile.parentOrgProfile.orgProfileId)}"/>
              <p:ajax event="change" update="ptj,contractSigner" process="@this"/> 
           </p:selectOneMenu>
         </p:column>
         <p:column style="width:25%;" headerText="#{lbl['lbl.ct.ag.ptj']}">
            <p:selectOneMenu id="ptj" value="#{data.orgProfile.orgProfileId}"  style="width:95%" >
              <f:selectItems value="#{agreementBackingBean.getPtjCodeName(data.orgProfile.parentOrgProfile.orgProfileId)}"/>
              <p:ajax event="change" update="contractSigner" process="@this"/> 
            </p:selectOneMenu>
         </p:column>
         <p:column style="width:15%;" headerText="#{lbl['lbl.ct.ag.csigner']}">
           <p:selectOneMenu id="contractSigner" value="#{data.officer.userId}"  style="width:95%;">
              <f:selectItems value="#{agreementBackingBean.getContractSignerDropdown(data)}"/>
              <p:ajax event="change" update="agOfId,agOfPosition" process="@this" listener="#{agreementBackingBean.setUserValueAgency(data,data.officer.userId)}"/> 
           </p:selectOneMenu>
         </p:column>  
         <p:column style="width:10%; white-space:normal;" headerText="#{lbl['lbl.ct.ag.icno']}">
             <p:outputLabel id="agOfId" value="#{data.officerIc}" style="float:left;"/>
         </p:column>         
         <p:column style="width:10%; white-space:normal;" headerText="#{lbl['lbl.ct.ag.position']}">
            <p:outputLabel id="agOfPosition" value="#{data.officerPosition}" style="float:left;"/>
         </p:column> 
       </p:dataTable>
     </h:panelGrid>
      <div class="ppRightBtn"> 
		  <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form"  action="#{agreementBackingBean.addAgencySignerParty()}" 
		     icon="ui-icon-add" update="AgSignerTable"/>
		  <p:commandButton value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" process="@form" onsuccess="dlgAgSignerDel.show()"/>
	  </div>
	   <p:dialog id="dlgAgSignerDel" widgetVar="dlgAgSignerDel" header="Delete Confirmation" styleClass="screen-title"  
           resizable="false" modal="true" width="325" height="90">  
            <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png"
			   value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
              <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" 
              styleClass="ui-inputtextarea"></p:inputTextarea>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" icon="ui-icon-accept" update="AgSignerTable" process="@form" 
				actionListener="#{agreementBackingBean.deleteAgencySignerParty()}" onclick="dlgAgSignerDel.hide();"/>
			  <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" icon="ui-icon-reject" onclick="dlgAgSignerDel.hide();" type="button" />
		   </div>
        </p:dialog>  
	  <p:spacer width="15"/>
      <h:panelGrid style="width:100%">  
         <p:outputLabel value="#{lbl['lbl.ct.ag.witness']}" style="float:left;"/>
          <p:dataTable id="AgWitnessTable" var="data" value="#{agreementBackingBean.managedBean.ctSignAgencyWitness}" 
	         selection="#{agreementBackingBean.selectedAgencyWitnes}" rowKey="#{data}">
		 <ac:paginator for="AgWitnessTable"/>
		 <p:column selectionMode="multiple" style="width:2%"/> 
		 <p:column headerText="Name" style="width:50%;">
		    <p:inputText value="#{data.officerName}" style="width:90%"/>
		 </p:column> 
		  <p:column headerText="IC No." style="width:20%;">
		    <p:inputText value="#{data.officerIc}" style="width:90%"/>
		 </p:column> 
		  <p:column headerText="#{lbl['lbl.ct.ag.position']}" style="width:30%;">
		    <p:inputText value="#{data.officerPosition}" style="width:90%"/>
		 </p:column> 
		</p:dataTable>
      </h:panelGrid>
      <div class="ppRightBtn"> 
		  <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" icon="ui-icon-add"
		     action="#{agreementBackingBean.addAgencyWitnes()}" update="AgWitnessTable"/>
		  <p:commandButton value="#{lbl['lbl.btn.delete']}" 
		    icon="ui-icon-delete" process="@form" onsuccess="dlgAgWitnessDel.show()"/>
	  </div>
	   <p:dialog id="dlgAgWitnessDel" widgetVar="dlgAgWitnessDel" header="Delete Confirmation" 
	      styleClass="screen-title" resizable="false" modal="true" width="325" height="90">  
            <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png"
			   value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
              <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" 
              styleClass="ui-inputtextarea"></p:inputTextarea>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" icon="ui-icon-accept" update="AgWitnessTable" process="@form" 
				actionListener="#{agreementBackingBean.deleteAgencyWitnes()}" onclick="dlgAgWitnessDel.hide();"/>
			  <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" icon="ui-icon-reject" onclick="dlgAgWitnessDel.hide();" type="button" />
		   </div>
        </p:dialog>  
	</p:panel>		   	
</ui:composition>
