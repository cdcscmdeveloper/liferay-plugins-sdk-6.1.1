<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
   
    <p:panel id="agencyPanelId"  toggleSpeed="500"
       header="#{lbl['lbl.ct.panel.agency.signing']}"  toggleable="true"  >
        
           <h:panelGrid style="width:100%">
           		<h:panelGrid columns="3">
   					<p:outputLabel value="#{lbl['lbl.ct.signer']}" style="float:left;"/>
      				<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.signer']}" />
		 		 </h:panelGrid>
                 <p:dataTable id="AgSignerTable" var="agSignerVar"  
                       value="#{agreementBackingBean.managedBean.ctAgencySigner}" 
                        selection="#{agreementBackingBean.selectedAgencySigner}" rowKey="#{agSignerVar}" rowIndexVar="index">
		          
		                <ac:paginator for="AgSignerTable"/>
		                <p:column selectionMode="multiple" style="width:2%"></p:column>  
		        
		                <p:column style="width:15%; white-space:normal;"  headerText="#{lbl['lbl.ct.ministry']}">
		                    <p:outputLabel value="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile.orgName}"/>
		                </p:column>
        
                        <p:column style="width:25%;" headerText="#{lbl['lbl.ct.ptj']}" >
                        <h:panelGroup  rendered="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile != null}">
                          <ac:lov id="listOfPtj" lovId="PM_ORG_PROFILE" headerText="#{lbl['lbl.ct.ptj']}"  
						      saveObject="agreementBackingBean.managedBean.ctAgencySigner[#{index}].orgProfile"
						      value="#{agSignerVar.orgProfile.orgName}" readonly="true" size="50" update=":form:AgSignerTable"
						      conditionField="recordStatusFlg^1|parentOrgProfile.orgProfileId^#{agreementBackingBean.getPtjParentId()}">
					      </ac:lov>
					      </h:panelGroup>
					      <h:panelGroup  rendered="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile == null}">
					         <p:outputLabel value="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}" style="float:left;"/>
					     </h:panelGroup>
					   </p:column>
			
                       <p:column style="width:15%;" headerText="#{lbl['lbl.ct.contract.signer']}" styleClass="companyHeaderGrid">
                        <p:selectOneMenu id="contractSigner" style="width:180px;"
                             value="#{agSignerVar.officer.userId}"   label="#{lbl['lbl.ct.contract.signer']}">
                             <f:selectItems value="#{agreementBackingBean.getContractSignerDropdown(agSignerVar)}"/>
                             <p:ajax event="change" update="@([id$=agOfId],[id$=agOfPosition])" 
                                 process="@this" listener="#{agreementBackingBean.setUserValueAgency(agSignerVar)}"/> 
                         </p:selectOneMenu>
                      </p:column>  
        
                      <p:column style="width:10%; white-space:normal;" headerText="#{lbl['lbl.ct.ic.no']}">
                         <p:outputLabel id="agOfId" value="#{agSignerVar.officerIc}" style="float:left;"/>
                      </p:column>         
               
                     <p:column style="width:10%; white-space:normal;" headerText="#{lbl['lbl.ct.designation']}">
                         <p:outputLabel id="agOfPosition" value="#{agSignerVar.officerPosition}" style="float:left;"/>
                     </p:column> 
            </p:dataTable>
        </h:panelGrid>
        <div class="ppRightBtn"> 
		  <p:commandButton id="addAgencySignerBtn" value="#{lbl['lbl.btn.add']}" process="@form" 
		     action="#{agreementBackingBean.addAgencySignerParty()}" icon="ui-icon-add" update=":form:AgSignerTable">
		     <p:tooltip for="addAgencySignerBtn">
			 	<h:outputText value="#{lbl['lbl.ct.tooltip.add.agency.signer']}" escape="false" />
			 </p:tooltip>
		  </p:commandButton>
		  <p:commandButton id="delAgencySignerBtn" value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" process="@form" onsuccess="dlgAgSignerDel.show()">
		  	<p:tooltip for="delAgencySignerBtn">
				<h:outputText value="#{lbl['lbl.ct.tooltip.delete.agency.signer']}" escape="false" />
			</p:tooltip>
		  </p:commandButton>
	    </div>
	  
	   <p:dialog id="dlgAgSignerDel" widgetVar="dlgAgSignerDel" 
	       styleClass="screen-title"  resizable="false" modal="true" width="350" height="95">  
            <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png"
			   value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			   <p:spacer width="10"/>
               <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" styleClass="ui-inputtextarea"/>
            </h:panelGrid>
            <div class="ppRightBtn">
		        <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:AgSignerTable" process="@form" 
			   	    actionListener="#{agreementBackingBean.deleteAgencySignerParty()}" onclick="dlgAgSignerDel.hide();"/>
			    <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgAgSignerDel.hide();" type="button" />
		    </div>
        </p:dialog>  
	 
	    <p:spacer width="15"/>
        <h:panelGrid style="width:100%">
			   <h:panelGrid columns="3">
   					<p:outputLabel value="#{lbl['lbl.ct.witness']}" style="float:left;"/>
      				<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.witness']}" />
		 	   </h:panelGrid>
               <p:dataTable id="AgWitnessTable" var="signAgWitnessVar" 
                  value="#{agreementBackingBean.managedBean.ctSignAgencyWitness}" 
	              selection="#{agreementBackingBean.selectedAgencyWitnes}" rowKey="#{signAgWitnessVar}">
		
		           <ac:paginator for="AgWitnessTable"/>
		           <p:column selectionMode="multiple" style="width:2%"/> 
		
		           <p:column headerText="#{lbl['lbl.ct.name']}" style="width:50%;">
		              <p:inputText value="#{signAgWitnessVar.officerName}" style="width:90%" maxlength="20"/>
		           </p:column> 
		
		          <p:column headerText="#{lbl['lbl.ct.ic.no']}" style="width:20%;">
		              <p:inputText value="#{signAgWitnessVar.officerIc}" style="width:90%" maxlength="20"/>
		          </p:column> 
		         
		          <p:column headerText="#{lbl['lbl.ct.designation']}" style="width:30%;">
		              <p:inputText value="#{signAgWitnessVar.officerPosition}" style="width:90%" maxlength="255"/>
		         </p:column> 
		     </p:dataTable>
      </h:panelGrid>
      
      <div class="ppRightBtn"> 
		  <p:commandButton id="addAgencyWitnessBtn" value="#{lbl['lbl.btn.add']}" process="@form" icon="ui-icon-add"
		     action="#{agreementBackingBean.addAgencyWitnes()}" update=":form:AgWitnessTable">
		     <p:tooltip for="addAgencyWitnessBtn">
				<h:outputText value="#{lbl['lbl.ct.tooltip.add.agency.witness']}" escape="false" />
			 </p:tooltip>
		  </p:commandButton>
		  <p:commandButton id="delAgencyWitnessBtn" value="#{lbl['lbl.btn.delete']}" 
		    icon="ui-icon-delete" process="@form" onsuccess="dlgAgWitnessDel.show()">
		    <p:tooltip for="delAgencyWitnessBtn">
			    <h:outputText value="#{lbl['lbl.ct.tooltip.delete.agency.witness']}" escape="false" />
			</p:tooltip>
		  </p:commandButton>
	  </div>
	   <p:dialog id="dlgAgWitnessDel" widgetVar="dlgAgWitnessDel"
	      styleClass="screen-title" resizable="false" modal="true" width="350" height="95">  
            <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png"
			   value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
              <p:inputTextarea value="Are you sure you want to delete this record?" rows="2" cols="48" 
              styleClass="ui-inputtextarea"></p:inputTextarea>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" process="@form"
		      update=":form:AgWitnessTable" actionListener="#{agreementBackingBean.deleteAgencyWitnes()}" onclick="dlgAgWitnessDel.hide();"/>
			  <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgAgWitnessDel.hide();" type="button" />
		   </div>
        </p:dialog>  
	</p:panel>		
		<ac:lovPopup />   	
</ui:composition>
