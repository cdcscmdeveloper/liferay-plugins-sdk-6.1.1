<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
   
    <p:panel id="agencyPanelId"  toggleSpeed="500"  header="#{lbl['lbl.ct.panel.agency.signing']}"  toggleable="true"  >
         <h:panelGrid style="width:100%;">
           		
           		<h:panelGrid columns="3">
   					<p:outputLabel value="#{lbl['lbl.ct.signer']}" style="float:left;"/>
      				<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.signer']}" />
		 		 </h:panelGrid>
               
                 <p:dataTable id="AgSignerTable" var="agSignerVar" 
                       value="#{agreementBackingBean.managedBean.ctAgencySigner}" widgetVar="AgSignerObj" 
                       selection="#{agreementBackingBean.managedBean.selectedAgencySigner}" rowKey="#{agSignerVar}" rowIndexVar="index">
		               <ac:paginator for="AgSignerTable"/>
		               <p:ajax event="toggleSelect"
                                  listener="#{agreementBackingBean.onToggleSelect}" update=":form:delAgencySignerBtn" />
                            <p:ajax event="rowSelect"
                                   listener="#{agreementBackingBean.onRowSelect}" update=":form:delAgencySignerBtn" />
			                 <p:ajax event="rowSelectCheckbox" 
			                        listener="#{agreementBackingBean.onRowSelect}" update=":form:delAgencySignerBtn" />
                              <p:ajax event="rowUnselectCheckbox"  
                                    listener="#{agreementBackingBean.onRowUnselect}" update=":form:delAgencySignerBtn" />
		               <p:column selectionMode="multiple" style="width:5%;"/>  
		               
		               <p:column style="width:20%; white-space:normal;"  headerText="#{lbl['lbl.ct.ptj']}" styleClass="column-align-center"
		                      rendered="#{agreementBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
		                   <div align="left">
		                       <h:outputText value="#{agSignerVar.orgProfile.orgName}" /></div>
		               </p:column>
		        
		               <p:column style="width:15%; white-space:normal;"  headerText="#{lbl['lbl.ct.ministry']}" styleClass="column-align-center"
		                       rendered="#{agreementBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
		                          <div align="left">
		                             <h:outputText value="#{agSignerVar.ministryName}" /></div>
		                   </p:column>
		               
		               <p:column style="width:15%;white-space:normal;" headerText="#{lbl['lbl.ct.pengawai.pengawal']}"  styleClass="column-align-center"
                             rendered="#{agreementBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
					                <div align="left">
					                <h:outputText  value="#{agSignerVar.pengawaiPengawalName}" /></div>
					       </p:column>
			
					     <p:column style="width:15%;white-space:normal;" headerText="#{lbl['lbl.ct.jabatan']}" styleClass="column-align-center"
                             rendered="#{agreementBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
					              <div align="left">
					               <h:outputText  value="#{agSignerVar.jabatanName}" /></div>
					        </p:column>
        
                        <p:column style="width:15%;white-space:normal;" headerText="#{lbl['lbl.ct.ptj']}"  styleClass="column-align-center"
                             rendered="#{agreementBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
                                <div align="left">
                                 <h:outputText value="#{agSignerVar.ptjName}" /> </div>
					     </p:column>
					     
					     <p:column style="width:15%;" styleClass="column-align-center">
					     <f:facet name="header">
					         <h:outputText value="#{lbl['lbl.ct.contract.signer']}" styleClass="required"/>
				        </f:facet>
                 
                             <p:selectOneMenu id="contractSigner" 
                                 style="width:180px;" value="#{agSignerVar.officer.userId}"   label="#{lbl['lbl.ct.contract.signer']}">
                                 <f:selectItems value="#{agreementBackingBean.getContractSignerDropdown(agSignerVar)}"/>
                                 <p:ajax event="change" update="@([id$=agOfId],[id$=agOfPosition])"  
                                      onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
                                     process="@all" listener="#{agreementBackingBean.setUserValueAgency(agSignerVar)}"/> 
                             </p:selectOneMenu>
                         </p:column>  
        
                         <p:column style="width:10%; white-space:normal;" headerText="#{lbl['lbl.ct.ic.no']}" styleClass="column-align-center">
                          <div align="left">
                              <h:outputText id="agOfId" value="#{agSignerVar.officerIc}" /> 
                              </div>
                         </p:column>         
               
                         <p:column style="width:20%; white-space:normal;" headerText="#{lbl['lbl.ct.designation']}" styleClass="column-align-center">
                             <div align="left">
                              <h:outputText id="agOfPosition" value="#{agSignerVar.officerPosition}" /></div>
                         </p:column> 
                 </p:dataTable>
           </h:panelGrid>
           <div class="ppRightBtn"> 
           <p:commandButton id="addAgencySignerBtn" value="#{lbl['lbl.btn.add']}"  
                oncomplete="dlgAgencySigner.show();"  partialSubmit="true" process="@this"
       	        update=":form:AgSignerTable,:form:dialogAgencySigner" action="#{agreementBackingBean.resetSignerAgencyDetails()}">
                <p:tooltip for="addAgencySignerBtn">
			 	     <h:outputText value="#{lbl['lbl.ct.tooltip.add.agency.signer']}" escape="false" />
			      </p:tooltip>
       		</p:commandButton>
       		
		      <p:commandButton id="delAgencySignerBtn" process="@this" 
		            disabled="#{agreementBackingBean.managedBean.buttonHideActive}"
		          value="#{lbl['lbl.ct.delete']}"   onsuccess="dlgAgSignerDel.show()">
		  	       <p:tooltip for="delAgencySignerBtn">
				      <h:outputText value="#{lbl['lbl.ct.tooltip.delete.agency.signer']}" escape="false" />
			       </p:tooltip>
		       </p:commandButton>
	        </div>
	        
	         <p:confirmDialog id="dlgAgSignerDel" widgetVar="dlgAgSignerDel" message="#{lbl['lbl.msg.confirm.delete']}" 	
                severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                 <div class="ppRightBtn">
		                 <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                       update=":form:AgSignerTable, :form:delAgencySignerBtn" 
		                       action="#{agreementBackingBean.deleteAgencySignerParty()}" oncomplete="dlgAgSignerDel.hide();"/>
			            <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgAgSignerDel.hide();" type="button" />
		           </div>
          </p:confirmDialog>
	 
	         <p:spacer width="15"/>
             <h:panelGrid style="width:100%;">
			  
			       <h:panelGrid columns="3">
   				    	<p:outputLabel value="#{lbl['lbl.ct.witness']}" style="float:left;"/>
      				    <p:spacer width="1"/>
					    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.witness']}" />
		 	       </h:panelGrid>
                  
                   <p:dataTable id="AgWitnessTable" var="signAgWitnessVar"
                        value="#{agreementBackingBean.managedBean.ctSignAgencyWitness}" widgetVar="AgWitnessObj" 
	                    selection="#{agreementBackingBean.managedBean.selectedAgencyWitnes}" rowKey="#{signAgWitnessVar}">
		                <ac:paginator for="AgWitnessTable"/>
		                <p:ajax event="toggleSelect"
                                  listener="#{agreementBackingBean.onToggleSelect}" update=":form:delAgencyWitnessBtn" />
                            <p:ajax event="rowSelect"
                                   listener="#{agreementBackingBean.onRowSelect}" update=":form:delAgencyWitnessBtn" />
			                 <p:ajax event="rowSelectCheckbox" 
			                        listener="#{agreementBackingBean.onRowSelect}" update=":form:delAgencyWitnessBtn" />
                              <p:ajax event="rowUnselectCheckbox"  
                                    listener="#{agreementBackingBean.onRowUnselect}" update=":form:delAgencyWitnessBtn" />
		                <p:column selectionMode="multiple" style="width:2%"/> 
		
		                <p:column headerText="#{lbl['lbl.ct.name']}" style="width:35%;" styleClass="column-align-center">
		                      <p:inputText value="#{signAgWitnessVar.officerName}" 
		                          style="width:90%" maxlength="20" />
		                </p:column> 
		
		                <p:column headerText="#{lbl['lbl.ct.ic.no']}" style="width:20%;" styleClass="column-align-center">
		                    <p:inputText value="#{signAgWitnessVar.officerIc}" style="width:90%"
		                        label="#{lbl['lbl.ct.ic.no']}"  maxlength="12">
		                    </p:inputText>
		                </p:column> 
		         
		                <p:column headerText="#{lbl['lbl.ct.designation']}" style="width:45%;" styleClass="column-align-center">
		                     <p:inputText value="#{signAgWitnessVar.officerPosition}" style="width:90%" maxlength="255"/>
		                </p:column> 
		           </p:dataTable>
             </h:panelGrid>
      
             <div class="ppRightBtn"> 
		       <p:commandButton id="addAgencyWitnessBtn" value="#{lbl['lbl.btn.add']}" 
		            action="#{agreementBackingBean.addAgencyWitnes(2)}" 
		           process="@form" onstart="blockWidget.show();"
		           oncomplete="blockWidget.hide();" update=":form:AgWitnessTable">
		           <p:tooltip for="addAgencyWitnessBtn">
				      <h:outputText value="#{lbl['lbl.ct.tooltip.add.agency.witness']}" escape="false" />
			       </p:tooltip>
		       </p:commandButton>
		       <p:commandButton id="delAgencyWitnessBtn" process="@this"
		             disabled="#{agreementBackingBean.managedBean.buttonHideActive}"
		            value="#{lbl['lbl.ct.delete']}"    onsuccess="dlgAgWitnessDel.show()">
		            <p:tooltip for="delAgencyWitnessBtn">
			             <h:outputText value="#{lbl['lbl.ct.tooltip.delete.agency.witness']}" escape="false" />
			        </p:tooltip>
		        </p:commandButton>
	        </div>
	          <p:confirmDialog id="dlgAgWitnessDel" widgetVar="dlgAgWitnessDel" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                         <div class="ppRightBtn">
		                     <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                         update=":form:AgWitnessTable, :form:delAgencyWitnessBtn" 
		                         action="#{agreementBackingBean.deleteAgencyWitnes()}" oncomplete="dlgAgWitnessDel.hide();"/>
			                 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgAgWitnessDel.hide();" type="button" />
		                 </div>
                   </p:confirmDialog>
         
           <p:dialog id="dialogAgencySigner"  header="Add Agency Signer" 
                  widgetVar="dlgAgencySigner"  styleClass="pop_up_top" modal="true" width="600" height="200">
			    <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.add.agency.signer']}" escape="false"/><br/><br/>
		      <h:panelGroup  id="agencyiesSingner">
                  <h:panelGrid columns="3">
               
                 <p:selectOneMenu for="ministry"  style="width:140px" disabled="true" >
            	    <f:selectItem itemLabel="#{lbl['lbl.ct.ministry']}" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="ministry" style="width:430px"
                      value="#{agreementBackingBean.managedBean.ministryProfileId}" >
            	   <f:selectItems value="#{agreementBackingBean.getMinistryDropdown()}"/>
            	   <p:ajax event="change"  process="@this" 
            	       listener="#{agreementBackingBean.settingMinistryListener}" update=":form:controllingOfficer,:form:jabatan,:form:ptjId" />
                 </p:selectOneMenu>
               
                  <p:selectOneMenu for="controllingOfficer"  style="width:140px" disabled="true" >
            	    <f:selectItem itemLabel="Controlling Officer" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="controllingOfficer" style="width:430px"
                      value="#{agreementBackingBean.managedBean.officerProfileId}" >
            	   <f:selectItems value="#{agreementBackingBean.getPengawaiPengawalDropdown()}"/>
            	   <p:ajax event="change" process="@this" 
            	       listener="#{agreementBackingBean.settingPengawaiPengawalListener}" update=":form:jabatan, :form:ptjId" />
                 </p:selectOneMenu>
                 
                 <p:selectOneMenu for="jabatan"  style="width:140px" disabled="true" >
            	    <f:selectItem itemLabel="#{lbl['lbl.ct.jabatan']}" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="jabatan" style="width:430px"
                      value="#{agreementBackingBean.managedBean.jabatanProfileId}" >
            	   <f:selectItems value="#{agreementBackingBean.getJabatanDropdown()}"/>
            	    <p:ajax event="change" process="@this" 
            	        listener="#{agreementBackingBean.settingJabatanListener}" update=":form:ptjId"/>
                 </p:selectOneMenu>
                 
                 <p:selectOneMenu for="ptjId"  style="width:140px" disabled="true">
            	    <f:selectItem itemLabel="PTJ" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="ptjId" style="width:430px"
                      value="#{agreementBackingBean.managedBean.ptjProfileId}" >
            	   <f:selectItems value="#{agreementBackingBean.getPtjDropdown()}"/>
            	    <p:ajax event="change"/>
                 </p:selectOneMenu>
                </h:panelGrid>
                 <div class="ppRightBtn">
       		        <p:commandButton value="#{lbl['lbl.btn.select']}" partialSubmit="true" process="@this" update=":form:AgSignerTable" 
				    action="#{agreementBackingBean.addAgencySignerDetails}"  onclick="tableAgencySigner.hide();"/>
		       </div>
             </h:panelGroup>
	      </p:dialog>  
	   </p:panel>		
	<ac:lovPopup />   	
</ui:composition>
