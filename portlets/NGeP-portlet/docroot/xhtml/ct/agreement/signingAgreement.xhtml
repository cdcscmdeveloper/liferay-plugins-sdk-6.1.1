<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
        <p:panel id="signingAgreements" header="Signing Agreement Details"  toggleable="true"  toggleSpeed="500">
        <h:panelGrid style="width:100%">
			<p:dataTable id="signTable" var="data" value="#{agreementBackingBean.managedBean.signOfficerList}" 
			  paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" 
			  emptyMessage="No Records!">
			  <ac:paginator for="signTable"/>
			   <p:columnGroup type="header"> 
				<p:row> 
                   <p:column style="width:100px;"  headerText="Ministry" /> 
                   <p:column style="width:100px;"  headerText="Department" /> 	
                   <p:column style="width:100px;" headerText="PTJ"  /> 
                   <p:column style="width:100px;" headerText="Officer Name"  /> 
                   <p:column style="width:120px;" headerText="IC No"  />   
                   <p:column style="width:180px;" headerText="Officer Position"  /> 
                   <p:column style="width:50px;" headerText="Action"  />   
               </p:row>	
			  </p:columnGroup>
			  <p:column width="100"> 
			    <p:selectOneMenu disabled="false">
            	   <f:selectItem itemLabel="MOF" itemValue="MOF" /> 
                   <f:selectItem itemLabel="PJT" itemValue="PTJ" /> 
                   <f:selectItem itemLabel="JABATAN" itemValue="JABATAN" /> 
                 </p:selectOneMenu>
               </p:column>
			   <p:column  width="100"> 
			     <p:selectOneMenu disabled="false">
            	   <f:selectItem itemLabel="Ministry" itemValue="ministry" /> 
				   <f:selectItem itemLabel="PTJ" itemValue="ptj" /> 
				   <f:selectItem itemLabel="Kewangan" itemValue="kewanngan" /> 
    			   </p:selectOneMenu>
    			</p:column>	
                <p:column width="100"> 
                  <p:selectOneMenu disabled="false">
                  <f:selectItem itemLabel="PJT" itemValue="PTJ" /> 
                  <f:selectItem itemLabel="JABATAN" itemValue="JABATAN" />
			      </p:selectOneMenu>
			     </p:column>
                 <p:column width="100">
                   <p:selectOneMenu disabled="false">
				   <f:selectItem itemLabel="Khan" itemValue="khan" /> 
				  </p:selectOneMenu>
                </p:column>	
                <p:column width="120"> <p:outputLabel value="6404-03-6843" /> </p:column>
                <p:column width="180"><p:outputLabel value="PTJ Head" style="float:left;"/></p:column>	
                 <p:column width="50" styleClass="column-align-center">
                  <p:commandLink partialSubmit="true" process="@this"  onsuccess="confirmation2.show()">
					     <f:setPropertyActionListener value="#{data}" target="#{agreementBackingBean.managedBean.signOfficerParty}" />
			             <p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
			          </p:commandLink>
                 </p:column> 
           </p:dataTable>
           </h:panelGrid>
		 <h:panelGrid style="width:100%" columnClasses="column-align-right">
		    <p:commandButton value="Add" process="@this" action="#{agreementBackingBean.addSignParty()}" 
		    partialSubmit="true" icon="ui-icon-add" update="signTable"/>
		</h:panelGrid>
		 
	     <p:spacer width="15"/>
         <h:panelGrid style="width:100%">  
         <p:dataTable id="supplierSign" var="data" value="#{agreementBackingBean.managedBean.signSupplierList}" widgetVar="dataTableObj" 
            lazy="false" dynamic="true" rowIndexVar="index" paginator="true" paginatorPosition="bottom"
            paginatorAlwaysVisible="true" emptyMessage="No Records!">
            <ac:paginator for="supplierSign"/>
			  <p:columnGroup type="header"> 
               <p:row> 
                   <p:column colspan="1"  style="width:100px" headerText="Supplier Company Name" /> 
                   <p:column colspan="1"  style="width:150px" headerText="Officer Name" /> 	
                   <p:column colspan="1" style="width:100px" headerText="IC No"  /> 
                   <p:column colspan="1" style="width:100px" headerText="Officer Position"  />  
                   <p:column colspan="1" style="width:50px" headerText="Action"  />    
			  </p:row>	
		    </p:columnGroup>						
                <p:column><p:outputLabel value="XYZ SDN BHD" style="float:left;"/> </p:column>
                <p:column><p:selectOneMenu disabled="false"  value="" style="width:150px;">
					      <f:selectItem itemLabel="Alam" itemValue="khan" /> 
					      </p:selectOneMenu>
			     </p:column>	
                 <p:column><p:outputLabel value="64043-03-6843" style="float:right;"/> </p:column>
                <p:column><p:outputLabel value="Sales Manager" style="float:left;"/></p:column>	
               <p:column styleClass="column-align-center">
                <p:commandLink partialSubmit="true" process="@this"  onsuccess="confirmation1.show()">
				   <f:setPropertyActionListener value="#{data}" target="#{agreementBackingBean.managedBean.signSupplierParty}" />
			       <p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
			    </p:commandLink>
                </p:column> 
             </p:dataTable>
		</h:panelGrid>
		<h:panelGrid style="width:100%" columnClasses="column-align-right">
		  <p:commandButton value="Add" process="@this" partialSubmit="true" action="#{agreementBackingBean.addSignSupplier()}" icon="ui-icon-add"
		  update="supplierSign"/>
	   </h:panelGrid>
      </p:panel>
       <p:confirmDialog message="Do you want to delete the record?"
		  closable="true" appendToBody="true" header="Delete Confirmation" severity="alert" widgetVar="confirmation1">
          <h:panelGrid columns="2">
			<p:commandButton value="Yes" icon="ui-icon-accept" update="supplierSign" partialSubmit="true"
			 process="@this" actionListener="#{agreementBackingBean.deleteSignSupplier()}" onclick="confirmation1.hide();"/>
			  <p:commandButton value="No" icon="ui-icon-reject" onclick="confirmation1.hide()" type="button" />
		  </h:panelGrid>
		</p:confirmDialog>
		 <p:confirmDialog message="Do you want to delete the record?"
		  closable="true" appendToBody="true" header="Delete Confirmation" severity="alert" widgetVar="confirmation2">
          <h:panelGrid columns="2">
			<p:commandButton value="Yes" icon="ui-icon-accept" update="signTable" partialSubmit="true"
			 process="@this" actionListener="#{agreementBackingBean.deleteSignParty()}" onclick="confirmation2.hide();"/>
			  <p:commandButton value="No" icon="ui-icon-reject" onclick="confirmation2.hide()" type="button" />
		  </h:panelGrid>
		</p:confirmDialog>
</ui:composition>
