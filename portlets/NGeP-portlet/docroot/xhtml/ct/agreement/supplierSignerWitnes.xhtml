<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="signingWitness" header="#{lbl['lbl.ct.panel.supplier.signing']}" toggleable="true" toggleSpeed="500">
        
         <h:panelGrid style="width:100%">
              <h:panelGrid columns="3">
   			      <p:outputLabel value="#{lbl['lbl.ct.signer']}" style="float:left;"/>
      		      <p:spacer width="1"/>
			      <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.supplier.signer']}" />
		      </h:panelGrid>
        
              <p:dataTable id="agSupplierSigner" var="signSupplierVar" 
                   value="#{agreementBackingBean.managedBean.ctSupplierSigner}" widgetVar="supSignerObj"
                   selection="#{agreementBackingBean.managedBean.selectedSupplierSigner}" rowKey="#{signSupplierVar}">
                   <ac:paginator for="agSupplierSigner"/>
			        <p:column  style="width:5%;text-align:center">
				                   <f:facet name="header">
							             <p:selectBooleanCheckbox value="#{agreementBackingBean.managedBean.selectAll}">
								               <p:ajax partialSubmit="true" process="@this"
									                  update=":form:agSupplierSigner,:form:delSupplierSignerBtn" listener="#{agreementBackingBean.selectAllSupplierSignerCheckBox}" />
							              </p:selectBooleanCheckbox>
						            </f:facet>
		           
		                             <p:selectBooleanCheckbox  value="#{signSupplierVar.selectedCheckBox}" styleClass="myCustomChekBox">
		           		                    <p:ajax event="change" 
		           		                         update=":form:agSupplierSigner,:form:delSupplierSignerBtn" listener="#{agreementBackingBean.selectOneSupplierSignerCheckBox}"></p:ajax>
			                         </p:selectBooleanCheckbox>
			            </p:column>
                  
                   <p:column style="width:25%;" headerText="#{lbl['lbl.ct.business.name']}" styleClass="column-align-center">
                       <div align="left">
                        <h:outputText 
                            value="#{agreementBackingBean.managedBean.contractVer.ctContractValue.supplierName}" /></div>
                   </p:column> 
                 
                   <p:column style="width:25%;" styleClass="column-align-center">
                        <f:facet name="header">
					         <h:outputText value="#{lbl['lbl.ct.contract.signer']}" styleClass="required"/>
					        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.signer']}"/>
				        </f:facet>
                 
                       <p:selectOneMenu id="contractSigner" value="#{signSupplierVar.officerName}"  style="width:95%;">
                          <f:selectItems value="#{agreementBackingBean.getSupplierSignerDropdown()}"/>
                          <p:ajax event="change" update="suOfId,suOfPosition"   
                              onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
                              process="@all" listener="#{agreementBackingBean.setSupplierUserValue(signSupplierVar)}"/> 
                       </p:selectOneMenu>
                     </p:column>  
             
                     <p:column style="width:15%;" headerText="#{lbl['lbl.ct.ic.no']}" styleClass="column-align-center"> 
                          <h:outputText id="suOfId" value="#{signSupplierVar.officerIc}" style="float:left;"/>
                     </p:column> 	
               
                      <p:column style="width:30%;" headerText="#{lbl['lbl.ct.designation']}" styleClass="column-align-center">
                           <div align="left">
                           <h:outputText id="suOfPosition" value="#{signSupplierVar.officerPosition}" /></div>
                      </p:column>  	
                </p:dataTable>
		    </h:panelGrid>
		    <div class="ppRightBtn"> 
		       <p:commandButton id="addSupplierSignerBtn" value="#{lbl['lbl.btn.add']}" 
		           process="@form" action="#{agreementBackingBean.addSupplierSigner()}" update=":form:agSupplierSigner">
		    	   <p:tooltip for="addSupplierSignerBtn">
				      <h:outputText value="#{lbl['lbl.ct.tooltip.add.supplier.signer']}" escape="false" />
				   </p:tooltip>
		        </p:commandButton>
		        <p:commandButton id="delSupplierSignerBtn" process="@this" 
		             disabled="#{agreementBackingBean.managedBean.buttonHideActive}"
		           value="#{lbl['lbl.ct.delete']}"  onsuccess="dlgAgSupplierDel.show()">
		    	   <p:tooltip for="delSupplierSignerBtn">
				       <h:outputText value="#{lbl['lbl.ct.tooltip.delete.supplier.signer']}" escape="false" />
			        </p:tooltip>
		         </p:commandButton>
              </div>
              
                 <p:confirmDialog id="dlgAgSupplierDel" widgetVar="dlgAgSupplierDel" message="#{lbl['lbl.msg.confirm.delete']}" 	
                severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                 <div class="ppRightBtn">
		                 <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                       update=":form:agSupplierSigner, :form:delSupplierSignerBtn" 
		                       action="#{agreementBackingBean.deleteTableRow('SUPPLIER_SIGNER')}" oncomplete="dlgAgSupplierDel.hide();"/>
			            <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgAgSupplierDel.hide();" type="button" />
		           </div>
          </p:confirmDialog>
      
             <h:panelGrid style="width:100%">
                  <h:panelGrid columns="3">
   			          <p:outputLabel value="#{lbl['lbl.ct.witness']}" style="float:left;"/>
      		          <p:spacer width="1"/>
			         <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.supplier.witness']}" />
		          </h:panelGrid>
       
                  <p:dataTable id="supplierWitnesTable" var="supplierWitnessVar" 
                       value="#{agreementBackingBean.managedBean.ctSupplierWitness}" widgetVar="supWitnessObj"
                       selection="#{agreementBackingBean.managedBean.selectedSupplierWitnes}" rowKey="#{supplierWitnessVar}">
                       <ac:paginator for="witnessSign"/>
                        <p:column  style="width:5%;text-align:center">
				                   <f:facet name="header">
							             <p:selectBooleanCheckbox value="#{agreementBackingBean.managedBean.selectAll}">
								               <p:ajax partialSubmit="true" process="@this"
									                  update=":form:supplierWitnesTable,:form:delSupplierWitnessBtn" listener="#{agreementBackingBean.selectAllSupplierWitnessCheckBox}" />
							              </p:selectBooleanCheckbox>
						            </f:facet>
		           
		                             <p:selectBooleanCheckbox  value="#{supplierWitnessVar.selectedCheckBox}" styleClass="myCustomChekBox">
		           		                    <p:ajax event="change" 
		           		                         update=":form:supplierWitnesTable,:form:delSupplierWitnessBtn" listener="#{agreementBackingBean.selectOneSupplierSignerCheckBox}"></p:ajax>
			                         </p:selectBooleanCheckbox>
			            </p:column>
                     
                       <p:column style="width:35%;" headerText="#{lbl['lbl.ct.name']}" styleClass="column-align-center">
                           <p:inputText value="#{supplierWitnessVar.officerName}"  style="width:95%;" maxlength="20"/>
                        </p:column>
                       
                        <p:column style="width:20%;" headerText="#{lbl['lbl.ct.ic.no']}" styleClass="column-align-center"> 
                            <p:inputText value="#{supplierWitnessVar.officerIc}" label="#{lbl['lbl.ct.ic.no']}"  style="width:95%;" maxlength="12">
                              </p:inputText>
                        </p:column> 	       
          
                         <p:column style="width:45%;" headerText="#{lbl['lbl.ct.designation']}"  styleClass="column-align-center">
                             <p:inputText value="#{supplierWitnessVar.officerPosition}" style="width:95%;" maxlength="255"/>
                         </p:column>  
                   </p:dataTable>
              </h:panelGrid>
              <div class="ppRightBtn"> 
		            <p:commandButton id="addSupplierWitnessBtn" value="#{lbl['lbl.btn.add']}" 
		                 process="@form" 
		                 action="#{agreementBackingBean.addSupplierWitness(2)}" update=":form:supplierWitnesTable">
		    	        <p:tooltip for="addSupplierWitnessBtn">
				             <h:outputText value="#{lbl['lbl.ct.tooltip.add.supplier.witness']}" escape="false" />
				        </p:tooltip>
		            </p:commandButton>
		            <p:commandButton id="delSupplierWitnessBtn" value="#{lbl['lbl.ct.delete']}" 
		                  disabled="#{agreementBackingBean.managedBean.buttonHideActive}"
		                  process="@this" onsuccess="dlgSupplierWitnesDel.show()">
		         	     <p:tooltip for="delSupplierWitnessBtn">
				             <h:outputText value="#{lbl['lbl.ct.tooltip.delete.supplier.witness']}" escape="false" />
				         </p:tooltip>
		             </p:commandButton>
                </div>
                
                   <p:confirmDialog id="dlgSupplierWitnesDel" widgetVar="dlgSupplierWitnesDel" message="#{lbl['lbl.msg.confirm.delete']}" 	
                severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                 <div class="ppRightBtn">
		                 <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                       update=":form:supplierWitnesTable, :form:delSupplierWitnessBtn" 
		                       action="#{agreementBackingBean.deleteTableRow('SUPPLIER_WITNESS')}" oncomplete="dlgSupplierWitnesDel.hide();"/>
			            <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgSupplierWitnesDel.hide();" type="button" />
		           </div>
          </p:confirmDialog>
       </p:panel>
       <p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{agreementBackingBean.managedBean.ctAgreement.signAgreementRemark}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{agreementBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<p:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" 
												   onkeyup="limitTextArea(this,1000);" onkeydown="limitTextArea(this,1000);" 
												   style="width:70%;" autoResize="false" /> 
												<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.remark']}" rendered="#{remarkIndex==0}" />
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		   	
</ui:composition>
