<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="uploadDocument" header="#{lbl['lbl.ct.menu.signed']}" toggleable="true" toggleSpeed="500">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br/><br/>
		<h:panelGrid style="width:400px;" columns="2"	columnClasses="columnWidth150,columnWidth200">
			<h:panelGrid columns="2" style="float:right;">
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel value="#{lbl['lbl.ct.signed.date']}" />
			</h:panelGrid>
			<h:panelGrid columns="4">
				<p:calendar	value="#{agreementBackingBean.managedBean.ctAgreement.signedDate}" id="popupButtonCal4" 
					showOn="button" size="25" required="true" label="Signed Date" readonlyInput="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.dated']}" />
				<p:spacer width="1"/>
				<p:message for="popupButtonCal4" display="icon" />
			</h:panelGrid>
			<h:panelGrid columns="2" style="float:right;">
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel value="#{lbl['lbl.ct.signed.page']}" />
			</h:panelGrid>
			<h:panelGrid columns="2">
				<h:panelGroup id="upAgrSignedPagePg">
					<p:commandButton
						oncomplete="upAgrSignedPageDlg.show();return false;"
						icon="iconAttachment" update="upAgrSignedPagePg"
						value="#{lbl['lbl.btn.upload.doc']}" />
					<h:commandLink
						value="#{agreementBackingBean.managedBean.ctContract.currentAgreement.signedPageName}"
						rendered="#{agreementBackingBean.managedBean.ctContract.currentAgreement.signedPageName != null}"
						styleClass="blue_font"
						action="#{agreementBackingBean.downloadFile(agreementBackingBean.managedBean.ctContract.currentAgreement.signedPagePath,
							agreementBackingBean.managedBean.ctContract.currentAgreement.signedPageName)}" />
					<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.page']}" />
				</h:panelGroup>
			</h:panelGrid>
			<h:panelGrid columns="2" style="float:right;">
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel value="#{lbl['lbl.ct.stamped.page']}" />
			</h:panelGrid>
			<h:panelGrid columns="2">
				<h:panelGroup id="upStampedPagePg">
					<p:commandButton
						oncomplete="upStampedPageDlg.show();return false;"
						icon="iconAttachment" update="upStampedPagePg"
						value="#{lbl['lbl.btn.upload.doc']}" />
					<h:commandLink
						value="#{agreementBackingBean.managedBean.ctContract.currentAgreement.stampedPageName}"
						rendered="#{agreementBackingBean.managedBean.ctContract.currentAgreement.stampedPageName != null}"
						styleClass="blue_font"
						action="#{agreementBackingBean.downloadFile(agreementBackingBean.managedBean.ctContract.currentAgreement.stampedPagePath,
							agreementBackingBean.managedBean.ctContract.currentAgreement.stampedPageName)}" />
					<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.stamped.page']}" />
				</h:panelGroup>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
	<p:dialog id="upAgrSignedPageDlg" widgetVar="upAgrSignedPageDlg" modal="false" resizable="false" 
       width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" 
			fileUploadListener="#{agreementBackingBean.uploadSignedPage}" 
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="#{lbl['lbl.ct.upload.invalid.msg']}"
			update="upAgrSignedPagePg">
		</p:fileUpload> 
	 </p:dialog>
	  <p:dialog id="upStampedPageDlg" widgetVar="upStampedPageDlg" modal="false" resizable="false"
	    width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" 
			fileUploadListener="#{agreementBackingBean.uploadStampedPage}" 
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="#{lbl['lbl.ct.upload.invalid.msg']}"
			update="upStampedPagePg">
		</p:fileUpload> 
	 </p:dialog>
</ui:composition>
