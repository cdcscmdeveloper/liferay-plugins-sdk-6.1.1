<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="uploadDocument" header="#{agreementBackingBean.retrieveContractDocumentName()}" toggleable="true" toggleSpeed="500">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.agreement.disclaimer1']}" escape="false"/>
		<p:commandLink value="#{lbl['lbl.ct.instruction.agreement.disclaimer2']}" ajax="false" 
			style="font-style:italic" process="@this"
			action="#{agreementBackingBean.downloadAgreementGuideline()}"></p:commandLink>
	   	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.agreement.disclaimer3']}" escape="false"/><br/><br/>
	   	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.contract.document']}" escape="false"/><br/>
	   	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.attachment']}" escape="false"/><br/><br/>		
	   	<h:panelGrid style="width:100%;" columns="2"  columnClasses="columnWidth250">
			<p:outputLabel value="#{lbl['lbl.ct.contract.document']}" styleClass="required" />
			<p:commandButton oncomplete="upContractDocumentDlg.show();return false;"
				update="contractDocumentList, upContractDocumentDlg" value="#{lbl['lbl.btn.upload']}" />		
			<f:verbatim/>
			<p:dataGrid id="contractDocumentList" value="#{agreementBackingBean.managedBean.ctAgreement.contractDocumentAttachments}"
				var="attachFile" rowIndexVar="attachFileIndex" columns="1" style="width:100%"
				emptyMessage ="#{lbl['lbl.datatable.msg.no.records.found']}">
				<table>
					<tr>
						<td rowspan="2"><h:graphicImage value="/css/images/design/#{ctBackingBean.determineIcon(attachFile)}" height="30" width="30"/></td>
						<td width="5"></td>
						<td>
							<h:commandLink value="#{attachFile.fileName}" 
								styleClass="blue_font" action="#{ctBackingBean.downloadFile(attachFile)}" />
							<p:commandLink onsuccess="delContractDocumentDlg.show();" action="#{ctBackingBean.setAttachFileIndex(attachFileIndex)}">
		   						<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
		 	 				</p:commandLink>
		 	 			</td>
					</tr>
				</table>
			</p:dataGrid>			
		</h:panelGrid>
		<!-- 29417 -->
	   	<h:panelGrid style="width:100%;" columns="2"  columnClasses="columnWidth250" rendered="#{agreementBackingBean.managedBean.finalAgreement}">
			<p:outputLabel value="#{lbl['lbl.ct.signed.date']}"  styleClass="required"/>
			<h:panelGrid columns="5" styleClass="top-aligned-columns">
				<p:calendar	value="#{agreementBackingBean.managedBean.agreementContractVer.signedDate}" id="popupButtonCal4" 
					showOn="button" size="17"   readonlyInput="true"
					mindate="#{agreementBackingBean.managedBean.contractVer.ctContractValue.effDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				<p:spacer width="2"/>
				<ac:iconTooltip value="#{agreementBackingBean.managedBean.agreementType eq CtConst.supplementalAgreement ? lbl['lbl.ct.tooltip.signed.dated.supplemental.agreement'] : lbl['lbl.ct.tooltip.signed.dated.agreement']}"  style="margin-top:6px;"/>
				<p:spacer width="1"/>
				<p:message for="popupButtonCal4" display="icon" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.signed.page']}" styleClass="required" />
			<h:panelGrid columns="4">
				<h:panelGroup id="upAgrSignedPagePg">
					<p:commandButton oncomplete="upAgrSignedPageDlg.show();return false;"
						update="upAgrSignedPagePg, upAgrSignedPageDlg"  icon="ui-icon-upload"
						rendered="#{agreementBackingBean.managedBean.ctAgreement.signedPageName == null}" />	
					<h:commandLink value="#{agreementBackingBean.managedBean.ctAgreement.signedPageName}"
						rendered="#{agreementBackingBean.managedBean.ctAgreement.signedPageName != null}"
						styleClass="blue_font" action="#{agreementBackingBean.commonDownload(agreementBackingBean.managedBean.ctAgreement.signedPagePath,
							agreementBackingBean.managedBean.ctAgreement.signedPageName)}" />					
					<p:spacer width="3"/>
					<p:commandLink onclick="delSignedPageDlg.show();" 
						rendered="#{agreementBackingBean.managedBean.ctAgreement.signedPageName != null}" >
						<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
					</p:commandLink>
					<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.page']}" />
				</h:panelGroup>
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.stamped.page']}" styleClass="required" />
			<h:panelGrid columns="4">
				<h:panelGroup id="upStampedPagePg">
					<p:commandButton oncomplete="upStampedPageDlg.show();return false;"
						update="upStampedPagePg, upStampedPageDlg"  icon="ui-icon-upload"
						rendered="#{agreementBackingBean.managedBean.ctAgreement.stampedPageName == null}" />	
					<h:commandLink value="#{agreementBackingBean.managedBean.ctAgreement.stampedPageName}"
						rendered="#{agreementBackingBean.managedBean.ctAgreement.stampedPageName != null}"
						styleClass="blue_font" action="#{agreementBackingBean.commonDownload(agreementBackingBean.managedBean.ctAgreement.stampedPagePath,
							agreementBackingBean.managedBean.ctAgreement.stampedPageName)}" />					
					<p:spacer width="3"/>
					<p:commandLink onclick="delStampedPageDlg.show();" 
						rendered="#{agreementBackingBean.managedBean.ctAgreement.stampedPageName != null}">
						<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
					</p:commandLink>
					<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.stamped.page']}" />
				</h:panelGroup>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
	<p:panel id="agreementDisclaimerPnl" header="#{lbl['lbl.ct.disclaimer']}"
	    toggleable="true" toggleSpeed="500" rendered="#{agreementBackingBean.managedBean.approveFinalAgreement}" >
		<h:panelGrid columns="2">
			<p:selectBooleanCheckbox id="disclaimerCheckBox"
				value="#{agreementBackingBean.managedBean.agreementDisclaimer}" />
			<h:outputText value="#{lbl['lbl.ct.agreement.disclaimer']}" styleClass="required" />
		</h:panelGrid>
	</p:panel>
	
	<p:dialog id="upContractDocumentDlg" widgetVar="upContractDocumentDlg" modal="true"  resizable="false"
	     width="700px" height="350px" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{agreementBackingBean.fileUpload}"
			mode="advanced" id="uploadContractDocumentId" multiple="true"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}"
			label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload.all']}" cancelLabel="#{lbl['lbl.btn.remove.all']}" 
			update="contractDocumentList" >
		</p:fileUpload>
		<f:facet name="footer">
		<div class="ppRightBtn">
		    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="upContractDocumentDlg.hide();" />
  		</div>
   		</f:facet>
	</p:dialog>
	<p:confirmDialog id="delContractDocumentDlg" widgetVar="delContractDocumentDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
		severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
   		<div class="ppRightBtn">
  		<p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
    		update=":form:contractDocumentList" 
        	action="#{agreementBackingBean.deleteContractDocumentAction(ctBackingBean.managedBean.attachFileIndex)}"
        	oncomplete="delContractDocumentDlg.hide();"/>
       	<p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delContractDocumentDlg.hide();" type="button" />
      	</div>
	</p:confirmDialog>
    	
	<p:dialog id="upAgrSignedPageDlg" widgetVar="upAgrSignedPageDlg" modal="true" resizable="false"
       width="700px" height="350px" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}"
       onShow="singleUploadListener(singedUploadWV);">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" dragDropSupport="false"
			fileUploadListener="#{agreementBackingBean.uploadSignedPage}" showButtons="false"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" multiple="false"
			allowTypes="#{CommonConstants.FILE_UPLOAD_PDF_TYPE}" widgetVar="singedUploadWV"
			invalidFileMessage="#{lbl['lbl.txt.upload.pdf.file']}" 
			invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}"
			update="upAgrSignedPagePg" label="#{lbl['lbl.btn.choose']}" oncomplete="upAgrSignedPageDlg.hide();">
		</p:fileUpload>
		<f:facet name="footer">
		<div class="ppRightBtn">
		    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="upAgrSignedPageDlg.hide();" />
   		</div> 
   		</f:facet>
	 </p:dialog>
	 <p:confirmDialog id="delSignedPageDlg" widgetVar="delSignedPageDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
 		severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
       	<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		  		update=":form:upAgrSignedPagePg, :form:upAgrSignedPageDlg"
		   		action="#{agreementBackingBean.delUploadedSignedPage()}" oncomplete="delSignedPageDlg.hide();"/>
			<p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delSignedPageDlg.hide();" type="button" />
		</div>
    </p:confirmDialog>
	 
	  <p:dialog id="upStampedPageDlg" widgetVar="upStampedPageDlg" modal="true" resizable="false"
	    width="700px" height="350px" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}"
	    onShow="singleUploadListener(stampedUploadWV);">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" dragDropSupport="false"
		    sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" showButtons="false"
			fileUploadListener="#{agreementBackingBean.uploadStampedPage}" multiple="false"
			allowTypes="#{CommonConstants.FILE_UPLOAD_PDF_TYPE}" widgetVar="stampedUploadWV"
			invalidFileMessage="#{lbl['lbl.txt.upload.pdf.file']}" 
			invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}"
			update="upStampedPagePg"  label="#{lbl['lbl.btn.choose']}" oncomplete="upStampedPageDlg.hide();" >
		</p:fileUpload>
		<f:facet name="footer">
		<div class="ppRightBtn">
		    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="upStampedPageDlg.hide();" />
   		</div>
   		</f:facet> 
	 </p:dialog>
	 <p:confirmDialog id="delStampedPageDlg" widgetVar="delStampedPageDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
 		severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
       	<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		  		update=":form:upStampedPagePg, :form:upStampedPageDlg"
		   		action="#{agreementBackingBean.delUploadedStampedPage()}" oncomplete="delStampedPageDlg.hide();"/>
			<p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delStampedPageDlg.hide();" type="button" />
		</div>
    </p:confirmDialog>
</ui:composition>
