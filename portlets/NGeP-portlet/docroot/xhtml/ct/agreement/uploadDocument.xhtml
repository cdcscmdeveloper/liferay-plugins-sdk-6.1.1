<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="uploadDocument" header="#{lbl['lbl.ct.menu.signed']}" toggleable="true" toggleSpeed="500">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br/><br/>
		<h:panelGrid style="width:100%;" columns="2"  columnClasses="columnWidth150">
			<h:panelGrid columns="2" style="float:right;">
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel value="#{lbl['lbl.ct.signed.date']}" />
			</h:panelGrid>
			<h:panelGrid columns="5" styleClass="top-aligned-columns">
				<p:calendar	value="#{agreementBackingBean.managedBean.particularContractVer.signedDate}" id="popupButtonCal4" 
					showOn="button" size="17" required="true" label="#{lbl['lbl.ct.signed.date']}" readonlyInput="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.dated']}" />
				<p:spacer width="1"/>
				<p:message for="popupButtonCal4" display="icon" />
			</h:panelGrid>
			<h:panelGrid columns="2" style="float:right;">
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel value="#{lbl['lbl.ct.signed.page']}" />
			</h:panelGrid>
			<h:panelGrid columns="2">
				<h:panelGroup id="upAgrSignedPagePg">
					<p:commandButton
						oncomplete="upAgrSignedPageDlg.show();return false;"
						icon="iconAttachment" update="upAgrSignedPagePg, upAgrSignedPageDlg"
						value="#{lbl['lbl.btn.upload.doc']}" />
					<h:commandLink
						value="#{agreementBackingBean.managedBean.ctAgreement.signedPageName}"
						rendered="#{agreementBackingBean.managedBean.ctAgreement.signedPageName != null}"
						styleClass="blue_font"
						action="#{agreementBackingBean.downloadFile(agreementBackingBean.managedBean.ctAgreement.signedPagePath,
							agreementBackingBean.managedBean.ctAgreement.signedPageName)}" />
					<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.page']}" />
				</h:panelGroup>
			</h:panelGrid>
			<h:panelGrid columns="2" style="float:right;">
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel value="#{lbl['lbl.ct.stamped.page']}" />
			</h:panelGrid>
			<h:panelGrid columns="2">
				<h:panelGroup id="upStampedPagePg">
					<p:commandButton
						oncomplete="upStampedPageDlg.show();return false;"
						icon="iconAttachment" update="upStampedPagePg, upStampedPageDlg"
						value="#{lbl['lbl.btn.upload.doc']}" />
					<h:commandLink
						value="#{agreementBackingBean.managedBean.ctAgreement.stampedPageName}"
						rendered="#{agreementBackingBean.managedBean.ctAgreement.stampedPageName != null}"
						styleClass="blue_font"
						action="#{agreementBackingBean.downloadFile(agreementBackingBean.managedBean.ctAgreement.stampedPagePath,
							agreementBackingBean.managedBean.ctAgreement.stampedPageName)}" />
					<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.stamped.page']}" />
				</h:panelGroup>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
	<p:dialog id="upAgrSignedPageDlg" widgetVar="upAgrSignedPageDlg" modal="true"
       width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" 
			fileUploadListener="#{agreementBackingBean.uploadSignedPage}" 
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}" 
			update="upAgrSignedPagePg">
		</p:fileUpload> 
	 </p:dialog>
	  <p:dialog id="upStampedPageDlg" widgetVar="upStampedPageDlg" modal="true"
	    width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" 
		    sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			fileUploadListener="#{agreementBackingBean.uploadStampedPage}" 
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}" 
			update="upStampedPagePg">
		</p:fileUpload> 
	 </p:dialog>
</ui:composition>
