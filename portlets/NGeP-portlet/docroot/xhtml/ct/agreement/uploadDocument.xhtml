<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="uploadDocument" header="#{lbl['lbl.ct.menu.signed']}" toggleable="true" toggleSpeed="500">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br/><br/>
		<h:panelGrid style="width:100%;" columns="2"  columnClasses="columnWidth150">
				<p:outputLabel value="#{lbl['lbl.ct.signed.date']}"  styleClass="required"/>
			<h:panelGrid columns="5" styleClass="top-aligned-columns">
				<p:calendar	value="#{agreementBackingBean.managedBean.agreementContractVer.signedDate}" id="popupButtonCal4" 
					showOn="button" size="17" required="true" label="#{lbl['lbl.ct.signed.date']}" readonlyInput="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				<p:spacer width="2"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.dated']}" style="margin-top:6px;" />
				<p:spacer width="1"/>
				<p:message for="popupButtonCal4" display="icon" />
			</h:panelGrid>
				<p:outputLabel value="#{lbl['lbl.ct.signed.page']}" styleClass="required" />
			<h:panelGrid columns="4">
				<h:panelGroup id="upAgrSignedPagePg">
					<p:commandButton oncomplete="upAgrSignedPageDlg.show();return false;"
						update="upAgrSignedPagePg, upAgrSignedPageDlg"  icon="ui-icon-upload"
						rendered="#{agreementBackingBean.managedBean.ctAgreement.signedPageName == null}" />	
					<h:commandLink value="#{agreementBackingBean.managedBean.ctAgreement.signedPageName}"
						rendered="#{agreementBackingBean.managedBean.ctAgreement.signedPageName != null}"
						styleClass="blue_font" action="#{agreementBackingBean.downloadFile(agreementBackingBean.managedBean.ctAgreement.signedPagePath,
							agreementBackingBean.managedBean.ctAgreement.signedPageName)}" />					
					<p:spacer width="3"/>
					<p:commandLink onclick="delSignedPageDlg.show();" 
						rendered="#{agreementBackingBean.managedBean.ctAgreement.signedPageName != null}" >
						<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
					</p:commandLink>
					<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.page']}" />
				</h:panelGroup>
			</h:panelGrid>
				<p:outputLabel value="#{lbl['lbl.ct.stamped.page']}" styleClass="required" />
			<h:panelGrid columns="4">
				<h:panelGroup id="upStampedPagePg">
					<p:commandButton oncomplete="upStampedPageDlg.show();return false;"
						update="upStampedPagePg, upStampedPageDlg"  icon="ui-icon-upload"
						rendered="#{agreementBackingBean.managedBean.ctAgreement.stampedPageName == null}" />	
					<h:commandLink value="#{agreementBackingBean.managedBean.ctAgreement.stampedPageName}"
						rendered="#{agreementBackingBean.managedBean.ctAgreement.stampedPageName != null}"
						styleClass="blue_font" action="#{agreementBackingBean.downloadFile(agreementBackingBean.managedBean.ctAgreement.stampedPagePath,
							agreementBackingBean.managedBean.ctAgreement.stampedPageName)}" />					
					<p:spacer width="3"/>
					<p:commandLink onclick="delStampedPageDlg.show();" 
						rendered="#{agreementBackingBean.managedBean.ctAgreement.stampedPageName != null}">
						<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
					</p:commandLink>
					<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.stamped.page']}" />
				</h:panelGroup>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
	<p:dialog id="upAgrSignedPageDlg" widgetVar="upAgrSignedPageDlg" modal="true"
       width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" dragDropSupport="false"
			fileUploadListener="#{agreementBackingBean.uploadSignedPage}" showButtons="false"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" multiple="false"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}" 
			update="upAgrSignedPagePg">
		</p:fileUpload>
		<div class="ppRightBtn">
		    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="upAgrSignedPageDlg.hide();" />
   		</div> 
	 </p:dialog>
	 <p:confirmDialog id="delSignedPageDlg" widgetVar="delSignedPageDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
 		severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
       	<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		  		update=":form:upAgrSignedPagePg, :form:upAgrSignedPageDlg"
		   		action="#{agreementBackingBean.delUploadedSignedPage()}" oncomplete="delSignedPageDlg.hide();"/>
			<p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delSignedPageDlg.hide();" type="button" />
		</div>
    </p:confirmDialog>
	 
	  <p:dialog id="upStampedPageDlg" widgetVar="upStampedPageDlg" modal="true"
	    width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" dragDropSupport="false"
		    sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" showButtons="false"
			fileUploadListener="#{agreementBackingBean.uploadStampedPage}" multiple="false"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}" 
			update="upStampedPagePg">
		</p:fileUpload>
		<div class="ppRightBtn">
		    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="upStampedPageDlg.hide();" />
   		</div> 
	 </p:dialog>
	 <p:confirmDialog id="delStampedPageDlg" widgetVar="delStampedPageDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
 		severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
       	<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		  		update=":form:upStampedPagePg,, :form:upStampedPageDlg"
		   		action="#{agreementBackingBean.delUploadedStampedPage()}" oncomplete="delStampedPageDlg.hide();"/>
			<p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delStampedPageDlg.hide();" type="button" />
		</div>
    </p:confirmDialog>
</ui:composition>
