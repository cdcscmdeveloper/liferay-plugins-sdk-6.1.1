<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="apedixDoc" header="APPENDIXES DOCUMENT"  toggleable="true"  toggleSpeed="500">
        <h:panelGrid style="width:100%">  
          <p:dataTable id="appendixes" var="data" value="#{agreementBackingBean.managedBean.ctAgreement.ctAgreementAppendixs}" 
             lazy="false" dynamic="true" selection="#{agreementBackingBean.selectedAppendixs}" rowKey="#{data}" rowIndexVar="rowIndex">
             <ac:paginator for="appendixes"/>
	 		  <p:column selectionMode="multiple" style="width:18px;"/>  
	 		    <p:column style="width:400px;" headerText="#{lbl['lbl.ct.ag.table.section']}">
			      <h:outputText value="#{data.title}"
					rendered="#{rowIndex lt agreementBackingBean.managedBean.ctAgreement.ctAgreementAppendixs.size()-1}" />
			       <p:inputText value="#{data.title}" style="width:400px;"  rendered="#{rowIndex eq agreementBackingBean.managedBean.ctAgreement.ctAgreementAppendixs.size()-1}"  />  
			  </p:column> 
			  <p:column style="width:150px;" headerText="#{lbl['lbl.ct.ag.table.type']}">
			  <h:outputText value="#{agreementBackingBean.retrieveParameterObj(data.appendixType.parameterId)}"
					rendered="#{rowIndex lt agreementBackingBean.managedBean.ctAgreement.ctAgreementAppendixs.size()-1}" />
			   <p:selectOneMenu style="width:140px;" value="#{data.appendixType.parameterId}"
			     rendered="#{rowIndex eq agreementBackingBean.managedBean.ctAgreement.ctAgreementAppendixs.size()-1}" >
                    <f:selectItems value="#{agreementBackingBean.getDropdownValues(ParameterTypeConst.agreementAppendixType)}" />
               	 </p:selectOneMenu>
			 </p:column> 	
			
			  <p:column style="width:100px;" headerText="#{lbl['lbl.ct.ag.table.action']}" styleClass="column-align-center">
	     	     <h:panelGroup id="userDefinedPg">
			       <p:commandButton oncomplete="userDefinedDlg.show();return false;" icon="iconAttachment" 
					  update="appendixes" rendered="#{data.filePath == null}" >
					  <f:setPropertyActionListener value="#{data}" target="#{agreementBackingBean.managedBean.ctAgreementAppendix}" /></p:commandButton>	
				      <h:commandLink value="#{agreementBackingBean.fileNames(data.filePath)}" styleClass="blue_font" 
				      action="#{agreementBackingBean.downloadFile(data.filePath)}" />					
			     </h:panelGroup>
			   </p:column> 
		  </p:dataTable>  
		  <p:dialog id="userDefinedDlg" widgetVar="userDefinedDlg" modal="false" resizable="false" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		             <p:ajax event="close" />
		             <p:fileUpload style="display:inline;" mode="advanced" fileUploadListener="#{agreementBackingBean.fileUpload}" 
			            allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			            invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			            update="appendixes">
		              </p:fileUpload> 
	               </p:dialog> 
	   </h:panelGrid>
	   <div class="ppRightBtn"> 	
	     <p:commandButton value="Add" process="@form" update="appendixes" icon="ui-icon-add" action="#{agreementBackingBean.addAppendix()}" />
		 <p:commandButton value="Delete" icon="ui-icon-delete" process="@form" onsuccess="confirmation.show()"/>
	   </div>
	   <p:confirmDialog message="Do you want to delete the record?" closable="true" 
	      appendToBody="true" header="Delete Confirmation" severity="alert" widgetVar="confirmation">
          <h:panelGrid columns="2">
			<p:commandButton value="Yes" icon="ui-icon-accept" update=":form" 
			  process="@form" action="#{agreementBackingBean.deleteAppendix()}"
				onclick="confirmation.hide();"/>
			<p:commandButton value="No" icon="ui-icon-reject" onclick="confirmation.hide()" type="button" />
		  </h:panelGrid>
	   </p:confirmDialog>
	</p:panel>	    	  
</ui:composition>
