<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ac:gpkiPopup
		textBeforeSign="#{agreementBackingBean.managedBean.textBeforeSign}"
		postSignAction="#{agreementBackingBean.preSubmitAgreement(gpkiBackingBean.pmDigiSign)}"
		enableAutoUpdate="#{agreementBackingBean.enableAutoUpdate()}" />
		
		
	<table style="width: 100%;">
		<tr>
			<td><p:commandButton value="#{lbl['lbl.btn.back']}"
					immediate="true"
					rendered="#{agreementBackingBean.managedBean.taskId==null}"
					oncomplete="window.history.back();blockWidget.hide();"
					onstart="blockWidget.show();" /></td>
			<td class="ppRightBtn">
				<ui:repeat var="action"
					value="#{agreementBackingBean.managedBean.outComes}">
					<ui:param name="buttonLabel"
						value="lbl.btn.#{fn:toLowerCase(action)}" />
					<p:commandButton value="#{lbl[buttonLabel]}" process="@form"
						update="@form" styleClass="ui-button" onkeypress="if (event.keyCode == 13) { return false; }"
						action="#{agreementBackingBean.gpkiSignAction(action)}"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
				</ui:repeat>
			</td>
		</tr>
	</table>
</ui:composition>
