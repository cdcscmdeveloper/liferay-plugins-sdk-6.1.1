<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%;">
		<tr>
			<td>
				<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" 
					rendered="#{agreementBackingBean.managedBean.taskId==null}" />
			</td>
			<td class="ppRightBtn">
				<ui:repeat var="outcome" value="#{agreementBackingBean.managedBean.action}">
					<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(outcome)}" />
					<p:commandButton value="#{lbl[buttonLabel]}" ajax="false" process="@form"
						styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(outcome)}"
						  action="#{agreementBackingBean.saveAgreement(outcome)}" />
				</ui:repeat>
			</td>
		</tr>
	</table>
</ui:composition>
