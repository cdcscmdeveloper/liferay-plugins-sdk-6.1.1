<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
    <p:panel>
      <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	  <table style="width:100%;">
	    <tr>
	    	<td class="ppRightBtn">
	    	    <p:commandButton value="Download"  action="#{agreementBackingBean.downloadFile(agreementBackingBean.managedBean.filePath)}"  ajax="false"  styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(download)}" />
			 	<p:commandButton value="Closed" ajax="false" onclick="window.close()" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(closed)}"/>			
	    	</td>
	    </tr>
	   </table>
	    <table style="width: 99%; margin-left: 25px;" class="header-info">
				<tr style="margin-button: 10px;">
				  <td>
				     <p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
				  </td>
				  <td>
				   <p:inputText size="20" disabled="true"
					 value="#{agreementBackingBean.managedBean.ctContract.loaNo}"  />	
				  </td>		
			     <td>
					
							<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
					
					</td>
					<td>
						
							<p:inputText size="20" disabled="true"
								value="#{agreementBackingBean.managedBean.ctContract.contractNo}" />
					
					</td>
					<td>
		
							<p:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
					
					</td>
					<td>
						
							<p:inputText size="30" disabled="true" value="#{agreementBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}"/>
						
					</td>					
					<td>
						
							<p:outputLabel value="#{lbl['lbl.ct.cc.status']}" />
						
					</td>
					<td>
						
							<p:inputText size="20"
								value="#{agreementBackingBean.getStatusDescById(agreementBackingBean.managedBean.ctContract.currentContractVer.status.statusId)}"
								disabled="true" />
						
					</td>
				</tr>
			</table>	    			  	
	</p:panel> 
	<p:panel header="Templates Documents" toggleable="true"  toggleSpeed="500">
      <p:growl life="5000" autoUpdate="true" />  
         <h:panelGrid>  
            <h:outputLabel value="#{agreementBackingBean.blobToStr(agreementBackingBean.managedBean.ctTemplates.content)}" title="Name" />    
         </h:panelGrid>  
      </p:panel>
   </ui:define>
</ui:composition>
