<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	
   	       
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/pc/menuPanelCircular/menuUpdatePanelCircular.xhtml" />
	</ui:define>

	<ui:define name="content">
	 <h:form prependId="false" id="form">
	   <p:messages showDetail="true" globalOnly="true"/>
               
                               <p:panel id="pc" header="Circular Details"  toggleable="true"  toggleSpeed="500" widgetVar="panelpc">
                              
                                 
                                
                                         
                                    <h:panelGrid columns="6" style="width:800px;" >
                                           
                                         <h:outputLabel for="cNo" value="Circular Number"   styleClass="txtsize"/>  
                                         <p:inputText id="cNo" value="" required="true" label="Circular Number" />  
                                         
                                         <h:outputLabel for="cName" value="Circular Name" styleClass="txtsize"/>  
                                         <p:inputText id="cName" value="" required="true" disabled="false" label="Circular Name" /> 
                                          
                                         <p:outputLabel id="coverage"  value="Circular Coverage" styleClass="txtcheckbox" />
                                         <h:panelGrid columns="2">
                                          <p:selectBooleanCheckbox  value=" " disabled="false"/> 
                                          <p:outputLabel rendered="true"  value="Semenanjung" styleClass="txtcheckbox" />
                                         </h:panelGrid>
                                         
                                         
                                         <h:outputLabel for="fileNo" value="File Reference No"  styleClass="txtsize"/>  
                                         <p:inputText id="fileNo" value="" required="true" disabled="false" label="File Reference No" /> 
                                       
                                         <h:outputLabel for="csdate" value="Circular Start Date"   styleClass="txtsize"/>  
                                         <p:inputText id="csdate" value="" required="true" label="Circular Start Date" />  
                                         
                                         <f:verbatim></f:verbatim>
                                          <h:panelGrid columns="2">
                                         <p:selectBooleanCheckbox value=" " disabled="false"/> 
                                         <p:outputLabel rendered="true" value="Sabah" styleClass="txtcheckbox"  /> 
                                         </h:panelGrid>
                                         
                                          <h:outputLabel for="cedate" value="Circular End Date"  styleClass="txtsize"/>  
                                          <p:inputText id="cedate" value="" required="true" disabled="false" label="Circular End Date" />
                                          
                                           <h:outputLabel for="ctype" value="Circular Type" styleClass="txtsize"/>  
                                          <p:selectOneMenu  disabled="false"  value="" >
            					          <f:selectItem itemLabel="--Please Select--" itemValue="--Please Select--" /> 
            					          <f:selectItem itemLabel="Tambahan" itemValue="Tambahan" /> 
            					          <f:selectItem itemLabel="Pindaan" itemValue="Pindaan" /> 
            					          </p:selectOneMenu>
            					          
            					          <f:verbatim></f:verbatim>
                                          <h:panelGrid columns="2">
            					           <p:selectBooleanCheckbox value=""  disabled="false"/> 
                                         <p:outputLabel rendered="true"  value="Sarawak" styleClass="txtcheckbox" />
                                          </h:panelGrid>
            					          
            					           <h:outputLabel for="cApprover" value="Approver" styleClass="txtsize"/>  
                                           <p:selectOneMenu  disabled="false"  value="" style="width:120px;">
            					           <f:selectItem itemLabel="Approver1" itemValue="Approver1" /> 
            					           <f:selectItem itemLabel="Approver2" itemValue="Approver2" /> 
            					           </p:selectOneMenu>
            					           
            					             <h:outputLabel for="phNo" value="Physical No" styleClass="txtsize"/>  
                                         <p:inputText id="phNo" value="" required="true" disabled="false" label="Physical No" /> 
                                          <f:verbatim></f:verbatim>
                                         <f:verbatim></f:verbatim>
                                          
                                         <h:outputLabel for="tpNo" value="Tambahan/Pindaan No" styleClass="txtsize"/>  
                                         <p:inputText id="tpNo" value="" required="true" disabled="false" label="Tambahan/Pindaan No" />  
                                         
                                         
                                        
                                         
                                          <h:outputLabel for="tpName" value="Tambahan/Pindaan Name" styleClass="txtsize" />  
                                         <p:inputText id="tpName" value="" required="true" disabled="false" label="Tambahan/Pindaan Name" />  
                                        
                                         
                                         
                                           
                                   </h:panelGrid>
                                         
                                           
                           
                 
						</p:panel>
						
						<p:panel id="contactPerson" header="Contact Person Details"  toggleable="true"  toggleSpeed="500" widgetVar="panelcontactPerson">
                              
                                  <div style="overflow-x:auto">
                                  <h:panelGrid style="width:800px;" styleClass="txtsize">  
                                  <p:dataTable id="dataTable" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" rowIndexVar="index"
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row> 
									                  
									                     <p:column colspan="1" style="width:30px" headerText="No"  /> 
									                     <p:column colspan="1"  style="width:130px" headerText="Contact Person Name" /> 
									                     <p:column colspan="1"  style="width:300px" headerText="Address" /> 	
									                     <p:column colspan="1" style="width:100px" headerText="Email"  /> 
									                     <p:column colspan="1" style="width:100px" headerText="Phone No"  /> 
									                      <p:column colspan="1" style="width:100px" headerText="Action"  />   
								               </p:row>	
								               						
								            </p:columnGroup>
							                   				
							              <p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
							                     <p:column> </p:column>
							                     <p:column></p:column>	
							                      <p:column> </p:column>
							                     <p:column></p:column>	
							                      <p:column styleClass="column-align-center">
								                 <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
								                 icon="ui-icon-delete" styleClass="ui-icon-button"/>
							                     </p:column> 
							                    
						                    </p:dataTable>
							               </h:panelGrid>
							               </div>
						            <h:panelGrid style="width:800px" columnClasses="column-align-right">
							                       <p:commandButton value="Add" styleClass="text-align: right;" process="@this" partialSubmit="true" icon="ui-icon-add"  update="dataTable"/>
							
						                  </h:panelGrid>
                                  
                            
                        
                        </p:panel>
                        
                       
 <p:confirmDialog message="Do you want to delete the record?"
							closable="true" appendToBody="true" header="Delete Confirmation"
							severity="alert" widgetVar="confirmation">

							<h:panelGrid columns="2"
								columnClasses="column-align-right-50,column-align-left">
								<p:commandButton value="Yes" 
									update="dataTable" partialSubmit="true" process="@this"
									onclick="confirmation.hide();"/>
								<p:commandButton value="No" 
									onclick="confirmation.hide()" type="button" />
							</h:panelGrid>
						</p:confirmDialog>
						</h:form>
		</ui:define>
</ui:composition>
