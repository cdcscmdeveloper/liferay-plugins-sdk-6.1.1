<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>     
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/panelCircular/shared/sideMenu/menuUpdateCircular.xhtml" />
	</ui:define>
<ui:define name="content">
        <p:messages showDetail="true" globalOnly="true"/> 
           <p:panel id="zoneId" header="#{lbl['lbl.ct.pc.panel.zone']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelzone">
              <h:panelGrid style="width:800px;">  
                 <p:dataTable id="dTableZone" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" rowIndexVar="index"
			         paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			         rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
					  paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
					 <p:columnGroup type="header"> 
					 <p:row> 
					    <p:column colspan="1" style="width:30px" headerText="#{lbl['lbl.ct.pc.no']}"  /> 
						<p:column colspan="1"  style="width:600px" headerText="#{lbl['lbl.ct.pc.zone.name']}" /> 
						<p:column colspan="1" style="width:100px" headerText="#{lbl['lbl.ct.pc.action']}"  />   
					 </p:row>	
					 </p:columnGroup>
					 <p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
					 <p:column> </p:column>
					 <p:column styleClass="column-align-center">
					 <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
						icon="ui-icon-delete" styleClass="ui-icon-button"/>
					 </p:column> 
				  </p:dataTable>
				</h:panelGrid>
				<h:panelGrid style="width:800px" columnClasses="column-align-right">
					   <p:commandButton value="Add" process="@this" partialSubmit="true" icon="ui-icon-add"   onclick="dlg2.show();"
					   update="dTableZone">
					    <p:ajax event="change" update=":form:dTableZone" process="@this" /></p:commandButton>
				</h:panelGrid>
				<p:spacer height="40"/>
                <h:panelGrid style="width:800px;">  
                   <p:dataTable id="dTableLocation" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" rowIndexVar="index"
			          paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			          rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
					  paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
					  <p:columnGroup type="header"> 
					  <p:row> 
						 <p:column  style="width:30px" headerText="#{lbl['lbl.ct.pc.no']}"  /> 
						 <p:column  style="width:600px" headerText="#{lbl['lbl.ct.pc.zone.location']}" /> 
						 <p:column  style="width:100px" headerText="#{lbl['lbl.ct.pc.action']}" />   
					  </p:row>	
					</p:columnGroup>
					<p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
				    <p:column> </p:column>
					 <p:column styleClass="column-align-center">
						 <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" icon="ui-icon-delete"/>
					 </p:column> 
				</p:dataTable>
			</h:panelGrid>
         </p:panel>
         <p:confirmDialog message="#{lbl['lbl.ct.dialong.cofirm.message']}"
							closable="true" appendToBody="true" header="#{lbl['lbl.ct.dialong.cofirm.header']}"
							severity="alert" widgetVar="confirmation">
                          	<h:panelGrid columns="2"
								columnClasses="column-align-right-50,column-align-left">
								<p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" 
									update="dTableZone" partialSubmit="true" process="@this"
									onclick="confirmation.hide();"/>
								<p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" 
									onclick="confirmation.hide()" type="button" />
							</h:panelGrid>
			</p:confirmDialog>
			<p:dialog id="modalDialog" header="" widgetVar="dlg2" modal="true" width="550" height="250">
			   <p:panel  id="zonePanelId">
                  <h:panelGrid columns="2">
				     <h:outputLabel value="#{lbl['lbl.ct.pc.zone.name']}" styleClass="txtsize"/>
            	     <p:inputText  value=" "></p:inputText>
					 <h:outputLabel  value="#{lbl['lbl.ct.pc.zone.location']}" styleClass="txtsize" />
            		   <p:selectOneMenu disabled="false"  value="" style="width:200px;">
            			 <f:selectItem itemLabel="Selangor" itemValue="selangor" /> 
            					 <f:selectItem itemLabel="Putra Jaya" itemValue="Putrajaya" />
                		</p:selectOneMenu>
					 </h:panelGrid>
					  <p:dataTable id="dTablePopup" var="data" value=" " rowIndexVar="index" widgetVar="dataTableObj" emptyMessage="No Records!" rows="10"  
                       rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
                       paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
                	   <p:columnGroup type="header"> 
					      <p:row> 
						      <p:column headerText="#{lbl['lbl.ct.pc.no']}"  />
						       <p:column style="width:600px" headerText="#{lbl['lbl.ct.pc.zone.location']}" /> 
						       <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.action']}" />  
						</p:row>							
						</p:columnGroup>
						     <p:column> <h:outputText value="" /></p:column> 							
							 <p:column> <h:outputText value="" /></p:column>
							 <p:column styleClass="column-align-center">
							    <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" icon="ui-icon-delete"
									styleClass="ui-icon-button"></p:commandButton></p:column>
					</p:dataTable>
			    <f:facet name="footer">
					<h:panelGrid columns="2"  style="float:right;height:100px;vertical-align: middle;">
					   <p:commandButton value="Select"  process="modalDialog" update="dTableZone,dTableLocation,modalDialog" onclick="dlg2.hide();"/>
                          <p:commandButton value="Cancel" type="button" ajax="false" onclick="dlg2.hide();" />
					  </h:panelGrid>
				</f:facet>
            </p:panel>
	    </p:dialog>
         </ui:define>
         </ui:composition>
