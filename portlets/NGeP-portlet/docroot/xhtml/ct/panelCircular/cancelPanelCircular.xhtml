<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/panelCircular/shared/sideMenu/menuCancelCircular.xhtml" />
	</ui:define>
    <ui:define name="content">
	<p:messages showDetail="true" globalOnly="true"/>
      <p:panel id="concelCircular" header="Cancel Circular From List"  toggleable="true"  toggleSpeed="500" widgetVar="panelconcelCircular">
         <h:panelGrid columns="1" style="width:800px;" >  
           <p:dataTable id="dataTable" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" rowIndexVar="index"
			  paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			  rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
              paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}  {LastPageLink} {RowsPerPageDropdown}">
               <p:columnGroup type="header"> 
				<p:row> 
				      <p:column colspan="1" style="width:30px" headerText="No"  /> 
                      <p:column colspan="1"  style="width:140px" headerText="Circular No" /> 
                      <p:column colspan="1"  style="width:200px" headerText="Circular Name" /> 	
                      <p:column colspan="1" style="width:100px" headerText="Circular Type"  /> 
                      <p:column colspan="1" style="width:100px" headerText="Circular Start Date"  /> 
                      <p:column colspan="1" style="width:100px" headerText="Circular End Date"  /> 
                      <p:column colspan="1" style="width:80px" headerText="Action"  />   
				 </p:row>	
				</p:columnGroup>
				<p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
				 <p:column> </p:column>
				 <p:column></p:column>	
				 <p:column> </p:column>
				 <p:column></p:column>	
				 <p:column></p:column>
				 <p:column styleClass="column-align-center">
				 <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this"  icon="ui-icon-delete" />
				 </p:column> 
			 </p:dataTable>
		 </h:panelGrid>
		 <h:panelGrid style="width:800px" columnClasses="column-align-right">
			<p:commandButton value="Add" styleClass="text-align: right;" process="@this" partialSubmit="true" icon="ui-icon-add"  update="dataTable"/>
		 </h:panelGrid>
        </p:panel>
       <p:panel id="attachementid" header="Remarks And Attachements"  toggleable="true"  toggleSpeed="500" widgetVar="panelattachements">
       </p:panel>
        <p:confirmDialog message="Do you want to delete the record?"
		    closable="true" appendToBody="true" header="Delete Confirmation"
							severity="alert" widgetVar="confirmation">
                            <h:panelGrid columns="2"
								columnClasses="column-align-right-50,column-align-left">
								<p:commandButton value="Yes" 
									update="dataTable" partialSubmit="true" process="@this"
									onclick="confirmation.hide();"/>
								<p:commandButton value="No" 
									onclick="confirmation.hide()" type="button" />
							</h:panelGrid>
						</p:confirmDialog>
			</ui:define>
		</ui:composition>
