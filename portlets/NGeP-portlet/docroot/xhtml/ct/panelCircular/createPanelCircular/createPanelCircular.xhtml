<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/panelCircular/shared/sideMenu/menuCreateCircular.xhtml" />
	</ui:define>
    <ui:define name="content">
	   <p:messages showDetail="true" globalOnly="true"/>
         <p:panel id="pc" header="#{lbl['lbl.ct.pc.panel.pcd']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelpc">
           <h:panelGrid columns="6" style="width:800px;">  
               <h:outputLabel  value="#{lbl['lbl.ct.pc.cno']}"   styleClass="txtsize"/>  
               <p:inputText  value="" required="true"/>  
               <h:outputLabel  value="#{lbl['lbl.ct.pc.cname']}" styleClass="txtsize"/>  
               <p:inputText  value="" required="true" disabled="false" /> 
               <p:outputLabel id="coverage"  value="#{lbl['lbl.ct.pc.coverage']}" styleClass="txtcheckbox" />
               <h:panelGrid columns="2">
                   <p:selectBooleanCheckbox  value=" " disabled="false"/> 
                   <p:outputLabel rendered="true"  value="#{lbl['lbl.ct.pc.chk']}" styleClass="txtcheckbox" />
               </h:panelGrid>
               <h:outputLabel for="fileNo" value="#{lbl['lbl.ct.pc.frno']}"  styleClass="txtsize"/>  
               <p:inputText id="fileNo" value="" required="true" disabled="false" label="File Reference No" /> 
               <h:outputLabel  value="#{lbl['lbl.ct.pc.csdate']}"   styleClass="txtsize"/>  
               <p:calendar  style="width:40px;" value="#{searchDetailsBean.searchDetails.date}" id="popupButtonCal" showOn="button" />
               <f:verbatim></f:verbatim>
               <h:panelGrid columns="2">
                   <p:selectBooleanCheckbox value=" " disabled="false"/> 
                   <p:outputLabel rendered="true" value="#{lbl['lbl.ct.pc.chk.sabah']}" styleClass="txtcheckbox"  /> 
               </h:panelGrid>
               <h:outputLabel  value="#{lbl['lbl.ct.pc.cedate']}"  styleClass="txtsize"/>  
               <p:calendar style="width:40px;" value="#{searchDetailsBean.searchDetails.date}" id="popupButtonCal1" showOn="button" />
               <f:verbatim></f:verbatim><f:verbatim></f:verbatim><f:verbatim></f:verbatim>
                <h:panelGrid columns="2">
                   <p:selectBooleanCheckbox value=" "  disabled="false"/> 
                   <p:outputLabel rendered="true"  value="#{lbl['lbl.ct.pc.chk.swak']}" styleClass="txtcheckbox" />
               </h:panelGrid>
            </h:panelGrid>
         </p:panel>
		 <p:panel id="contactPerson" header="#{lbl['lbl.ct.pc.cpd']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelcontactPerson">
            <h:panelGrid style="width:800px;">  
               <p:dataTable id="dTablePerson" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" rowIndexVar="index"
			      paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			      rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
		          paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
				  {LastPageLink} {RowsPerPageDropdown}">
				  <p:columnGroup type="header"> 
					  <p:row> 
						 <p:column style="width:30px" headerText="#{lbl['lbl.ct.pc.no']}"  /> 
					     <p:column style="width:150px" headerText="#{lbl['lbl.ct.pc.cperson']}" /> 
						 <p:column style="width:280px" headerText="#{lbl['lbl.ct.pc.caddress']}" /> 	
						 <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.cemail']}"  /> 
					     <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.pno']}"  /> 
						 <p:column style="width:80px" headerText="#{lbl['lbl.ct.pc.action']}"  />   
	                 </p:row>	
				  </p:columnGroup>
				   <p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 														                     <p:column> </p:column>
					  <p:column></p:column>	
					  <p:column> </p:column>
				      <p:column></p:column>	
					  <p:column styleClass="column-align-center">
					  <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" 
					    process="@this" icon="ui-icon-delete"/>
				      </p:column> 
				 </p:dataTable>
               </h:panelGrid>
			   <h:panelGrid style="width:800px" columnClasses="column-align-right">
				  <p:commandButton value="Add" process="@this" partialSubmit="true" icon="ui-icon-add"  
				    update="dTablePerson"/>
			  </h:panelGrid>
           </p:panel>
           <p:panel id="concelCircular" header="#{lbl['lbl.ct.pc.panel.ccfl']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelconcelCircular">
              <h:panelGrid style="width:800px;">  
                 <p:dataTable id="dTableCancel" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true"  rowIndexVar="index"
			        paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			        rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
					paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
					{LastPageLink} {RowsPerPageDropdown}">
					<p:columnGroup type="header"> 
					   <p:row> 
						  <p:column style="width:30px" headerText="#{lbl['lbl.ct.pc.no']}"  /> 
						  <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.cno']}" /> 
						  <p:column style="width:200px" headerText="#{lbl['lbl.ct.pc.cname']}" /> 	
						  <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.frno']}"  /> 
					      <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.coverage']}"  /> 
					      <p:column style="width:80px" headerText="#{lbl['lbl.ct.pc.csdate']}"  />  
					      <p:column style="width:80px" headerText="#{lbl['lbl.ct.pc.cedate']}"  /> 
						  <p:column style="width:80px" headerText="#{lbl['lbl.ct.pc.action']}"  />    
					   </p:row>	
					  </p:columnGroup>
					   <p:column styleClass="column-align-center"> <h:outputText value="#{index+1}"/></p:column> 							
					   <p:column> </p:column>
					   <p:column></p:column>	
					   <p:column> </p:column>
					   <p:column></p:column>	
					   <p:column></p:column>	
					   <p:column> </p:column>
					   <p:column styleClass="column-align-center">
					   <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
					      icon="ui-icon-delete"/>
				       </p:column> 
					</p:dataTable>
				</h:panelGrid>
				<h:panelGrid style="width:800px" columnClasses="column-align-right">
							<p:commandButton value="Add" process="@this" partialSubmit="true" icon="ui-icon-add"  update="dTableCancel"/>
				</h:panelGrid>
            </p:panel>
            <p:confirmDialog message="#{lbl['lbl.ct.dialong.cofirm.message']}"
							closable="true" appendToBody="true" header="#{lbl['lbl.ct.dialong.cofirm.header']}"
							severity="alert" widgetVar="confirmation">
                          	<h:panelGrid columns="2"
								columnClasses="column-align-right-50,column-align-left">
								<p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" 
									update="dTablePerson" partialSubmit="true" process="@this"
									onclick="confirmation.hide();"/>
								<p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" 
									onclick="confirmation.hide()" type="button" />
							</h:panelGrid>
			</p:confirmDialog>
		</ui:define>
</ui:composition>
