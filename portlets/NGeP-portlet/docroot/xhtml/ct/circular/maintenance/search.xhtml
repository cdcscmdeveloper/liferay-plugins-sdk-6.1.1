<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<ui:define name="contentSection">
	    <p:blockUI widgetVar="circularSearchBlk" block=":form" trigger="panelSearchId">  
			  <p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>  
		 </p:blockUI> 	
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info, warning" />
		<p:panel id="searchPanel" header="#{lbl['lbl.ct.search']}" toggleable="true">
			<h:panelGrid columns="4" style="width:100%" columnClasses="columnWidth25, columnWidth30, columnWidth25,columnWidth20">
				<h:outputLabel value="#{lbl['lbl.ct.circular.type']}" styleClass="required" />
				<p:selectOneMenu value="#{circularBackingBean.managedBean.searchCircularDocType}" style="width:380px;" >
					<p:ajax event="change" process="@this" update="searchPanel" />
					<f:selectItems value="#{circularBackingBean.getCircularDocTypeValues()}" />
				</p:selectOneMenu>			
				<h:outputLabel value="#{lbl['lbl.ct.circular.name']}" />
				 <h:panelGrid columns="3">
				           <p:inputText value="#{circularBackingBean.managedBean.searchCircularName}" style="width:170px;" maxlength="500" />	
				           <p:spacer width="2"/>
				           <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.circular.maint.name']}" />
                 </h:panelGrid>		
				<h:outputLabel value="#{lbl['lbl.ct.circular.no']}" />
				<p:inputText value="#{circularBackingBean.managedBean.searchCircularNo}" style="width:170px;" maxlength="17" />
				<h:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" />
				<p:inputText value="#{circularBackingBean.managedBean.searchPhysicalCircularNo}" style="width:170px;" maxlength="60" />
				<h:outputLabel value="#{lbl['lbl.ct.supplier.name']}" />
				<p:inputText value="#{circularBackingBean.managedBean.searchSupplierName}" style="width:170px;" maxlength="100" />
				<h:outputLabel value="#{lbl['lbl.ct.item.name']}" />
				<p:inputText value="#{circularBackingBean.managedBean.searchItemName}" style="width:170px;margin-top:3px;" maxlength="100" />
				<h:outputLabel value="#{lbl['lbl.ct.circular.start.date']}" />								
				<p:calendar style="width:150px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" readonlyInput="true"
					navigator="true" value="#{circularBackingBean.managedBean.searchStartDate}" id="popupButtonCal" showOn="button" />
				<h:outputLabel value="#{lbl['lbl.ct.circular.end.date']}" />
				<p:calendar style="width:150px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" readonlyInput="true"
					navigator="true" value="#{circularBackingBean.managedBean.searchEndDate}" id="popupButtonCal1" showOn="button" />								
				<h:outputLabel value="#{lbl['lbl.ct.status']}" />
				<p:selectOneMenu id="status" value="#{circularBackingBean.managedBean.searchStatusId}" style="width:470px;">
					<f:selectItems value="#{circularBackingBean.getStatusDropdown()}" />
				</p:selectOneMenu>
				<p:outputLabel for="circularStatus" value="#{lbl['lbl.ct.circular.status']}" />
		   			<p:selectOneMenu id="circularStatus" value="#{circularBackingBean.managedBean.searchCircularStatus}"	
		   	   			style="width:200px;">
					<f:selectItems value="#{circularBackingBean.getSearchCircularStatusDropdown()}" />
		   		</p:selectOneMenu>
			</h:panelGrid>		
			<div class="ppRightBtn"> 
				<p:commandButton id="panelSearchId" value="#{lbl['lbl.btn.search']}" action="#{circularBackingBean.searchCircular}"
				    onstart="circularSearchBlk.show();" oncomplete="circularSearchBlk.hide();" update="circularVerDt" />
				<p:commandButton value="#{lbl['lbl.ct.reset']}" action="#{circularBackingBean.searchReset}"  update=":form" />
			</div>		
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.ct.search.result']}" toggleable="true">
			<p:dataTable id="circularVerDt" value="#{circularBackingBean.managedBean.circularListingPagingDataModel}"
				var="data" lazy="true" rows="10" rowIndexVar="index" >
				<ac:paginator for="circularVerDt" />
				<p:column headerText="#{lbl['lbl.ct.circular.no']}"  style="width:15%;white-space:normal;" styleClass="column-align-center" >
					<h:outputText value="#{data.ctCircular.circularNo}" style="text-align:left;float:left;"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.physical.circular.no']}"  style="width:15%;white-space:normal;" styleClass="column-align-center" >
					 <div align="left">
					<h:outputText value="#{data.circularNo}" /></div>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.name']}"  style="width:25%;white-space:normal;" styleClass="column-align-center" >
				<div align="left">
					<h:outputText value="#{data.name}"  /> </div>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.start.date']}"  style="width:10%;white-space:normal;" styleClass="column-align-center" >
					<h:outputText value="#{data.startDate}"  style="float:left;">
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.end.date']}"  style="width:10%;white-space:normal;" styleClass="column-align-center">
					<h:outputText value="#{data.endDate}" style="float:left;">
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.status']}"  style="width:15%;white-space:normal;" styleClass="column-align-center">
					<div align="left">
					   <h:outputText value="#{circularBackingBean.getStatusDescById(data.status.statusId)}" />
				    </div>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.action']}" styleClass="column-align-center"  style="width:10%;white-space:normal;">
					<p:menuButton id="menuButtonId" value="#{lbl['lbl.btn.option']}">
						<p:menuitem id="menuItemId3" value="#{lbl['lbl.ct.view']}" icon="ui-icon-view"
							onstart="circularSearchBlk.show();" oncomplete="circularSearchBlk.hide();"
							action="#{circularBackingBean.gotoPage('view', data.circularVerId)}">
						</p:menuitem>
						<p:menuitem id="menuItemId4" value="#{lbl['lbl.ct.update']}" icon="ui-icon-update"
							onstart="circularSearchBlk.show();" oncomplete="circularSearchBlk.hide();"
							rendered="#{!circularBackingBean.managedBean.trackingDiarySearch and data.ctCircular.recordStatusFlg == 1 and
							         ((circularBackingBean.isPanelAdmin() and (data.status.statusId == CtStatusConst.pqApproved or data.status.statusId == CtStatusConst.pqUpdateApproved
									 or data.status.statusId == CtStatusConst.pqUpdateRejected or data.status.statusId == CtStatusConst.pqUpdateCancelled
									 or data.status.statusId == CtStatusConst.pqCancelRequestRejected)) or 
									     (circularBackingBean.isCentralContractAdmin() and (data.status.statusId == CtStatusConst.cqApproved or data.status.statusId == CtStatusConst.cqUpdateApproved
									 or data.status.statusId == CtStatusConst.cqUpdateRejected or data.status.statusId == CtStatusConst.cqUpdateCancelled
									 or data.status.statusId == CtStatusConst.cqCancelRequestRejected))) }"
							action="#{circularBackingBean.gotoPage('update', data.ctCircular.latestCircularVer.circularVerId)}">
						</p:menuitem>
					</p:menuButton>
				</p:column>											
			</p:dataTable>		
		</p:panel>
	</ui:define>
</ui:composition>
