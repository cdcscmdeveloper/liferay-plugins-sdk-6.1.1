<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/circular/shared/sidemenu/panel.xhtml" />
	</ui:define>
    <ui:define name="content">
	    <p:messages showDetail="true" globalOnly="true"/>
            <p:panel id="pc" header="#{lbl['lbl.ct.pc.panel.pcd']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelpc">
                   <ui:include src="/xhtml/ct/circular/shared/update.xhtml" />
              </p:panel>
			  <p:panel id="contactPerson" header="#{lbl['lbl.ct.pc.cpd']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelcontactPerson">
                  <div style="overflow-x:auto">
                      <h:panelGrid style="width:800px;" styleClass="txtsize">  
                           <p:dataTable id="dataTable" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" rowIndexVar="index"
			                  paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			                  rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							  paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							  <p:columnGroup type="header"> 
								 <p:row> 
								    <p:column style="width:30px" headerText="#{lbl['lbl.ct.pc.no']}"  /> 
					                <p:column style="width:150px" headerText="#{lbl['lbl.ct.pc.cperson']}" /> 
						            <p:column style="width:280px" headerText="#{lbl['lbl.ct.pc.caddress']}" /> 	
						            <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.cemail']}"  /> 
					                <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.pno']}"  /> 
						            <p:column style="width:80px" headerText="#{lbl['lbl.ct.pc.action']}"  />  
								 </p:row>	
							 </p:columnGroup>
							 <p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
							    <p:column> </p:column>
							    <p:column></p:column>	
							    <p:column> </p:column>
							    <p:column></p:column>	
							    <p:column styleClass="column-align-center">
								<p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this"   icon="ui-icon-delete" styleClass="ui-icon-button"/>
							    </p:column> 
							</p:dataTable>
						</h:panelGrid>
					 </div>
					<h:panelGrid style="width:800px" columnClasses="column-align-right">
					   <p:commandButton value="Add" styleClass="text-align: right;" process="@this" partialSubmit="true" icon="ui-icon-add"  update="dataTable"/>
					</h:panelGrid>
                 </p:panel>
                <p:confirmDialog message="#{lbl['lbl.ct.dialong.cofirm.message']}"
							closable="true" appendToBody="true" header="#{lbl['lbl.ct.dialong.cofirm.header']}"
							severity="alert" widgetVar="confirmation">
                          	<h:panelGrid columns="2"
								columnClasses="column-align-right-50,column-align-left">
								<p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" 
									update="dataTable" partialSubmit="true" process="@this"
									onclick="confirmation.hide();"/>
								<p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" 
									onclick="confirmation.hide()" type="button" />
							</h:panelGrid>
			</p:confirmDialog>
		  </ui:define>
   </ui:composition>
