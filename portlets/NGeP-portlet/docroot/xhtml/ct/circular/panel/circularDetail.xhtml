<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="pc" header="#{lbl['lbl.ct.panel.panel.circular']}" toggleable="true" toggleSpeed="500" widgetVar="panelpc">
		<h:panelGroup rendered="#{!panelBackingBean.managedBean.updateAction and panelBackingBean.managedBean.circularVer.extendStartDate == null }">
			<ui:include src="createCircularDetail.xhtml" />
		</h:panelGroup>
		<h:panelGroup rendered="#{panelBackingBean.managedBean.updateAction || panelBackingBean.managedBean.circularVer.extendStartDate != null }">
			<ui:include src="updateCircularDetail.xhtml" />
		</h:panelGroup>	
	</p:panel>
	
	<p:panel id="contactPerson" header="#{lbl['lbl.ct.panel.contact.person']}" toggleable="true" toggleSpeed="500" widgetVar="panelcontactPerson">
		<p:dataTable id="contactPersonDt" var="data" value="#{panelBackingBean.managedBean.circularVer.ctContactPersons}"
			rowKey="#{data}" rowIndexVar="index" selection="#{panelBackingBean.managedBean.selectedContactPersons}">
			<ac:paginator for="contactPersonDt" />
			<p:column selectionMode="multiple" style="width:3%" />
			<p:column headerText="#{lbl['lbl.ct.contact.person.name']}" style="width:20%;">
				<p:inputText value="#{data.name}" style="width:95%;" maxlength="20" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.address']}" style="width:40%;">
				<p:inputText value="#{data.address}" style="width:95%;" maxlength="200" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.email']}"  style="width:20%;">
				<p:inputText id="email" value="#{data.email}" style="width:95%;" maxlength="100"
				 validator="#{webappBean.checkEmail}" label="#{lbl['lbl.ct.email']}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.tel']}" style="width:20%;">
				<p:inputText id="phoneNo" value="#{data.phoneNo}" style="width:95%;" maxlength="100"
				  validator="#{webappBean.checkPhoneNumber}" label="#{lbl['lbl.ct.tel']}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" partialSubmit="true" icon="ui-icon-add"
				action="#{panelBackingBean.addContactPerson()}" update="contactPersonDt" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this" partialSubmit="true" icon="ui-icon-delete" onsuccess="delCtPersonDlg.show()"/>						
		</div>
		
		<p:dialog id="delCtPersonDlg" resizable="false"
		    styleClass="screen-title" widgetVar="delCtPersonDlg"  modal="true" width="330">  
            <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png" value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			  <p:spacer width="10"/>
              <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update="@([id$=contactPersonDt])"
		       process="@all" actionListener="#{panelBackingBean.deleteContactPerson()}" onclick="delCtPersonDlg.hide();"/>
			 <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="delCtPersonDlg.hide();" type="button" />
		   </div>
        </p:dialog>  		
		
	</p:panel>
	
	<p:panel id="cancelCircularPnl" header="Related Cancelled Circular" toggleable="true" toggleSpeed="500">
		<p:dataTable id="cancelCircularDt" var="data" rowKey="#{data}" rowIndexVar="index" 
			value="#{panelBackingBean.managedBean.circularVer.ctCancelCircularList}"
			selection="#{panelBackingBean.managedBean.selectedCancelCirculars}" >
			<ac:paginator for="cancelCircularDt" />		
			<p:column selectionMode="multiple" style="width:3%" />
			<p:column headerText="#{lbl['lbl.ct.circular.no']}">
				<h:outputText value="#{data.circularVer.circularNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.circular.name']}" >
				<h:outputText value="#{data.circularVer.name}" />
			</p:column>	
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="#{lbl['lbl.btn.add']}" icon="ui-icon-add" oncomplete="cancelCircularDlg.show();" update="cancelledCclDt"
				actionListener="#{panelBackingBean.addCancelCircularListener()}" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@form" partialSubmit="true" icon="ui-icon-delete"
				action="#{panelBackingBean.deleteCancelCircular()}" update="cancelCircularDt" />				
		</div>	
	</p:panel>
	
	<p:dialog id="cancelCircularDlg" header="#{lbl['lbl.ct.cancelled.circular']}" widgetVar="cancelCircularDlg" modal="true" width="550" height="350">
		<p:panel id="circular">
			<p:dataTable id="cancelledCclDt" var="data" rowKey="#{data}" 
			    rowIndexVar="index" value="#{panelBackingBean.managedBean.cancelledCircularList}" 
				selection="#{panelBackingBean.managedBean.selectedCancelledCircularList}" >
				<ac:paginator for="cancelledCclDt" />
				<p:column selectionMode="multiple" style="width:3%" />
				<p:column headerText="#{lbl['lbl.ct.circular.no']}">
					<h:outputText value="#{data.circularVer.circularNo}" style="width:200px;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.name']}">
					<h:outputText value="#{data.circularVer.name}" style="width:300px;" />
				</p:column>											
			</p:dataTable>
			<p:spacer height="2" />
			<div class="ppRightBtn"> 
				<p:commandButton value="#{lbl['lbl.btn.select']}" icon="ui-icon-accept" process="cancelCircularDlg" 
					action="#{panelBackingBean.addCancelledCircular}"
					update="cancelCircularDt" onclick="cancelCircularDlg.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" icon="ui-icon-cancel" type="button" ajax="false" onclick="cancelCircularDlg.hide();" />
			</div>			
		</p:panel>
	</p:dialog>

	<p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{panelBackingBean.managedBean.circularVer.circularRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{panelBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
					<ui:include src="/xhtml/ct/shared/attachment.xhtml" />						
				</td>
			</tr>
		</table>
	</p:panel>	
		
</ui:composition>
