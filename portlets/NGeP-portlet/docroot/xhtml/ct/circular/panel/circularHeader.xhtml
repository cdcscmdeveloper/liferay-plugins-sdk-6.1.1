<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<style>
	.truncate {
    max-width: 250px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
    font-weight: normal;
    text-align: left;
    font-size: 12px;
    padding-right: 20px;
    border-right: 3px solid #FFFFFF
}
 
..ui-tooltip {
                max-width: 400px;
         }
         
   .ui-tooltip, .ui-tooltip-content.ui-widget-content {
    max-width: 400px;
    background-color: yellow;
    background-image: none;
}
	</style>
	
	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td>
					<h:outputLabel value="#{lbl['lbl.ct.circular.no']} " />
				</td>
				<td class="header-info-text">
					#{panelBackingBean.managedBean.circular.circularNo == null ? lbl['lbl.ct.system.generated'] : panelBackingBean.managedBean.circular.circularNo}
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.ct.status']} " />
				</td>
				<td class="header-info-text">
					#{panelBackingBean.getStatusDescById(panelBackingBean.managedBean.circularVer.status.statusId)}
				</td>
			</tr>
		</table>
	</div>
	<br/>
</ui:composition>
