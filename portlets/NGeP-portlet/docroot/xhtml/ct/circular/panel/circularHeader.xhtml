<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		<table border="0" style="text-align:left" 
		   cellspacing="0" cellpadding="0" width="100%" class="header-info">
			<tr style="margin-button: 0px;">
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.pc.cno']}" />
					</td>
					<td>
							<p:inputText size="20"
								value="#{panelBackingBean.managedBean.circularVer.circularNo == null ? '-- User Input --':panelBackingBean.managedBean.circularVer.circularNo}"
								disabled="true" />
					</td>
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.cc.cname']}" />
					</td>
					<td>
							<p:inputText size="40"
								value="#{panelBackingBean.managedBean.circularVer.name == null ? '-- User input --':panelBackingBean.managedBean.circularVer.name}"
								disabled="true" />
					</td>					
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.cc.status']}" />
					</td>
					<td>
							<p:inputText size="20"
								value="#{panelBackingBean.getStatusDescById(panelBackingBean.managedBean.circularVer.status.statusId)}"
								disabled="true" />
					</td>
				</tr>
		</table>
</ui:composition>
