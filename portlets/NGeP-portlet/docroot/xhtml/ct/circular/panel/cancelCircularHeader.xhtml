<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td>
					<h:outputLabel value="#{lbl['lbl.ct.cancel.circular.request.no']}" />
				</td>
				<td class="header-info-text">
					#{panelBackingBean.managedBean.cancelCircularReq.cancelCircularReqNo == null ? '-- System Generated --' : panelBackingBean.managedBean.cancelCircularReq.cancelCircularReqNo}
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.ct.status']}" />
				</td>
				<td class="header-info-text">
					#{panelBackingBean.getStatusDescById(panelBackingBean.managedBean.cancelCircularReq.status.statusId)}
				</td>
			</tr>
		</table>
	</div>
	<br/>
</ui:composition>
