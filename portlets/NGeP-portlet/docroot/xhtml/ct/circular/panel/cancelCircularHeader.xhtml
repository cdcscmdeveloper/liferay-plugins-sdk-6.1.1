<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<div align="left" class="header-info">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr style="margin-button: 0px;">
					<td><p:outputLabel value="Cancel Circular Request Id" />
					</td>
					 <td> <p:inputText size="20"
								value="#{panelBackingBean.managedBean.cancelCircularReq.cancelCircularReqId == null ? '-- System Generated --':panelBackingBean.managedBean.cancelCircularReq.cancelCircularReqId}"
								disabled="true" />
					</td>
					 <td><p:outputLabel value="#{lbl['lbl.ct.cc.status']}" />
					 </td>
					 <td><p:inputText size="20"
								value="#{panelBackingBean.getStatusDescById(panelBackingBean.managedBean.cancelCircularReq.status.statusId)}"
								disabled="true" />
					</td>
				</tr>
		</table>
	</div>
</ui:composition>
