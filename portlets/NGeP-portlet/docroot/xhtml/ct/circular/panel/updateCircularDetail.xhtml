<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <h:panelGrid columns="2" style="width:100%;"  styleClass="top-aligned-columns"  id="panelCircularDetailsId">
           <h:panelGrid columns="2" style="width:550px;" columnClasses="columnWidth200">
				   <p:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" styleClass="required"/>
				   <h:panelGrid columns="5">
					   <p:inputText  id="circularNoTxt1" style="width:200px;"  
						    required="true" maxlength="60" disabled="#{panelBackingBean.managedBean.viewContract}"
						    label="#{lbl['lbl.ct.physical.circular.no']}" value="#{panelBackingBean.managedBean.circularVer.circularNo}"/>
					        <p:spacer width="5"/>
					        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.circular.panel.no']}" />
					        <p:spacer width="5"/>
					        <p:message for="circularNoTxt1" display="icon" />
				   </h:panelGrid>
				   
				     <h:outputLabel value="#{lbl['lbl.ct.circular.panel.name']}" styleClass="required"/>
					<h:panelGrid columns="5">
					    <p:inputTextarea id="circularNameTxt1" rows="5"  style="width:200px;" maxlength="500"
					        disabled="#{panelBackingBean.managedBean.viewContract}" autoResize="false"
					        required="true" label="#{lbl['lbl.ct.circular.name']}" value="#{panelBackingBean.managedBean.circularVer.name}" />
					      <p:spacer width="5"/>
					        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.circular.panel.name']}" />
					        <p:spacer width="5"/>
					        <p:message for="circularNameTxt1" display="icon" />
				    </h:panelGrid>
				    
				    <p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
			    	<p:inputText  style="width:200px;margin-bottom:2px;" maxlength="60"
					     disabled="#{panelBackingBean.managedBean.viewContract}"
					     value="#{panelBackingBean.managedBean.circularVer.circularFileRefNo}" />
					     
				<h:outputLabel value="#{lbl['lbl.ct.delivery.period']}" /> 
				<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.deliveryTerm}" 
				    maxlength="4" style="text-align:right; width:85px;"
				    disabled="#{panelBackingBean.managedBean.viewContract}">
				</p:inputText>
				<p:spacer width="5" />
				<h:outputText value="#{lbl['lbl.ct.days']}" />
			</h:panelGroup>
			    
			<p:outputLabel value="#{lbl['lbl.ct.start.date']}" />
			<p:inputText value="#{panelBackingBean.managedBean.circularVer.startDate}" disabled="true" style="width:85px;">
			   	 <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			 </p:inputText>	
			   		
			   	<p:outputLabel value="#{lbl['lbl.ct.end.date']}" />
			   	<p:inputText value="#{panelBackingBean.managedBean.circularVer.endDate}" disabled="true" style="width:85px; margin-top:3px;" >
			   			<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			   	</p:inputText>	 
			   	
			   	<p:outputLabel value="#{lbl['lbl.ct.circular.letter']}" rendered="#{panelBackingBean.managedBean.circularVer.circularFileName != null}" />
		         <h:commandLink value="#{panelBackingBean.managedBean.circularVer.circularFileName}" 
			    	styleClass="blue_font"  action="#{panelBackingBean.downloadFile()}" />	
			   	
			 </h:panelGrid>
			 <h:panelGrid  style="width:350px; margin-left:5px" columns="2" id="pmGridId">
			 
			     	 <p:outputLabel value="#{lbl['lbl.ct.panel.pm']}"/>
			        <h:panelGrid columns="3">
			               <p:selectBooleanCheckbox  disabled="true" style="text-align:top;"  
			                       value="#{panelBackingBean.managedBean.circularVer.directNego}"> 
			               </p:selectBooleanCheckbox>
			              <p:spacer width="2" />	
			  	         <h:outputText value="#{lbl['lbl.ct.panel.dn']}"  />
			       </h:panelGrid>      	
			   		
			       <f:verbatim/>
			       <h:panelGrid columns="3">
			             <p:selectBooleanCheckbox disabled="true" style="text-align:top;"
			                      value="#{panelBackingBean.managedBean.circularVer.directPurchase}" >
			             </p:selectBooleanCheckbox>
			             <p:spacer width="2" />	
			  	          <h:outputText value="#{lbl['lbl.ct.panel.dp']}"  />
			  	 </h:panelGrid>
			  	 
			  	  <f:verbatim/>
			         <h:panelGrid columns="3">
		         	       <p:selectBooleanCheckbox disabled="true" style="text-align:top;"
		         	              value="#{panelBackingBean.managedBean.circularVer.qt}">
				           </p:selectBooleanCheckbox>
			               <p:spacer width="2" />	
			  	          <h:outputText value="#{lbl['lbl.ct.panel.qt']}"  />   
			  	      </h:panelGrid>    
			  	           
			     <p:outputLabel value="#{lbl['lbl.ct.pid']}"  />
			      <p:selectBooleanCheckbox disabled="#{panelBackingBean.managedBean.viewContract}" 
			                  value="#{panelBackingBean.managedBean.circularVer.pid}"  style="text-align:top;">
			                       <p:ajax event="change"  update=":form:groupPaneId" process="@this"></p:ajax>
			       </p:selectBooleanCheckbox>
			
			  	       <p:outputLabel value="#{lbl['lbl.ct.circular.extension']}" />
			   	        <p:selectBooleanCheckbox id="extensionId" value="#{panelBackingBean.managedBean.circularExtension}"
			   	        	disabled="#{panelBackingBean.managedBean.viewContract}">
			                 <p:ajax event="change" update=":form:pmGridId" listener="#{panelBackingBean.chkCircularExtension}" process="@this"/> 
			           </p:selectBooleanCheckbox>
			  	     
			    <p:outputLabel value="#{lbl['lbl.ct.extension.start.date']}"  styleClass="required"  rendered="#{panelBackingBean.managedBean.circularExtension}" />
			    <p:calendar  value="#{panelBackingBean.managedBean.circularVer.extendStartDate}" readonly="true"
			         maxdate="#{panelBackingBean.managedBean.circularVer.extendStartDate}" 
			         mindate="#{panelBackingBean.managedBean.circularVer.extendStartDate}"
			         disabled="#{panelBackingBean.managedBean.viewContract}"
			         rendered="#{panelBackingBean.managedBean.circularExtension}"  size="8"  id="popupButtonCal5" showOn="button"
				     pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
		       </p:calendar>
		       
		   <p:outputLabel value="#{lbl['lbl.ct.extension.end.date']}"  styleClass="required"  rendered="#{panelBackingBean.managedBean.circularExtension}"  />
		   <p:calendar size="8"  value="#{panelBackingBean.managedBean.circularVer.extendEndDate}"  navigator="true"
		            mindate="#{panelBackingBean.managedBean.circularVer.extendStartDate}" readonlyInput="true"  styleClass="calendarDateField" 
				   disabled="#{panelBackingBean.managedBean.viewContract}"
				   rendered="#{panelBackingBean.managedBean.circularExtension}" 
				   required="true" label="#{lbl['lbl.ct.extension.end.date']}"
				   pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" showOn="button" id="popupButtonCal6" >
		    </p:calendar>
		 </h:panelGrid>
		 </h:panelGrid>
</ui:composition>
