<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<h:panelGrid columns="2" columnClasses="colAlignTop,colAlignTop">
		<h:panelGrid columns="4">
			<h:outputLabel value="#{lbl['lbl.ct.cc.cno']}" />
			<p:inputText disabled="true" value="#{panelBackingBean.managedBean.circularVer.circularNo}" />
			<h:outputLabel value="#{lbl['lbl.ct.cc.cname']}" />
			<p:inputTextarea disabled="true" value="#{panelBackingBean.managedBean.circularVer.name}" />
			<h:outputLabel value="#{lbl['lbl.ct.cc.csdate']}" />
			<p:calendar disabled="true" value="#{panelBackingBean.managedBean.circularVer.startDate}" 
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal3" showOn="button" />
			<h:outputLabel value="#{lbl['lbl.ct.cc.cedate']}" />
			<p:calendar disabled="true" value="#{panelBackingBean.managedBean.circularVer.endDate}" 
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal4" showOn="button" />
			<h:outputLabel value="#{lbl['lbl.ct.cc.upload']}" />
			<h:commandLink value="#{panelBackingBean.managedBean.circularVer.circularFileName}" styleClass="blue_font" 
				action="#{panelBackingBean.downloadFile()}" />			
			<h:outputLabel value="#{lbl['lbl.ct.cc.frno']}" />
			<p:inputText disabled="true" value="#{panelBackingBean.managedBean.circularVer.circularFileRefNo}" />	
			<h:outputLabel value="Item Category" />
			<p:selectOneMenu value="#{panelBackingBean.managedBean.circularVer.itemCategory.parameterCode}">
				<f:selectItems value="#{panelBackingBean.getDropdownCodeValues(ParameterTypeConst.itemCategoryType)}" />
				<p:ajax event="change" update=":form:tabview" process="@form" />
			</p:selectOneMenu>			
			<h:outputLabel value="Zonal Level" />
			<p:selectOneMenu value="#{panelBackingBean.managedBean.circularVer.zonalLevel.parameterCode}">
				<f:selectItems value="#{panelBackingBean.getZonalLevelDropDown()}" />
				<p:ajax event="change" update=":form:tabview" process="@form" />
			</p:selectOneMenu>
			<h:outputLabel value="Complaint Deadline" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.complaintDeadline}" style="text-align:right; width:50px;" />
				<h:outputText value=" months" />
			</h:panelGroup>	
			<h:outputLabel value="Payment Day" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.paymentDay}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup>
			<h:outputLabel value="Delivery Term" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.deliveryTerm}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup>	
			<h:outputLabel value="Last Request Day" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.lastRequestDay}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup>
			<h:outputLabel value="Replacement Day" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.replacementDay}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup>	
			<h:outputLabel value="Warranty Period" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.warrantyPeriod}" style="text-align:right; width:50px;" />
				<h:outputText value=" months" />
			</h:panelGroup>											
			<p:outputLabel value="Update Effective Date" />
			<p:calendar value="#{panelBackingBean.managedBean.circularVer.updateEffDate}" 
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal7" showOn="button" />			
			<h:outputLabel value="Update Description" />
			<p:inputTextarea value="#{panelBackingBean.managedBean.circularVer.updateDescription}" />								
			<h:outputLabel value="Extension Period" />
			<p:inputText value="#{panelBackingBean.managedBean.circularVer.extPeriod}" />
			<f:verbatim />
			<f:verbatim />			
			<h:outputLabel value="Extension Start Date" />
			<p:calendar style="width:150px;" value="#{panelBackingBean.managedBean.circularVer.extStartDate}"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal5" showOn="button" />
			<h:outputLabel value="Extension End Date" />
			<p:calendar style="width:150px;" value="#{panelBackingBean.managedBean.circularVer.extEndDate}" 
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal6" showOn="button" />				
		</h:panelGrid>
	</h:panelGrid>

</ui:composition>
