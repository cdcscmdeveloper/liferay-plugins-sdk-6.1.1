<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<table style="width: 100%" >
			<tr>
				<td style="width: 15%;" >
					<p:outputLabel value="#{lbl['lbl.ct.cc.cno']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td style="width: 200px">
					<p:inputText id="circularNoTxt1" style="width:170px;"  required="true" maxlength="50"
					label="#{lbl['lbl.ct.cc.cno']}" value="#{panelBackingBean.managedBean.circularVer.circularNo}"/>
				</td>
				<td>
					<p:message for="circularNoTxt1" display="icon" />
				</td>				
				<td rowspan="2" valign="top" style="width: 15%;">	
					<h:outputLabel value="#{lbl['lbl.ct.cc.cname']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td rowspan="2" style="width: 180px">
					<p:inputTextarea id="circularNameTxt1" rows="3" style="width:170px;" maxlength="200"
					   required="true" label="#{lbl['lbl.ct.cc.cname']}" value="#{panelBackingBean.managedBean.circularVer.name}" />
				</td>
				<td>
					<p:message for="circularNameTxt1" display="icon" />
				</td>					
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.ct.cc.frno']}" /></td>
				<td><p:inputText  style="width:170px;" maxlength="50"
					  value="#{panelBackingBean.managedBean.circularVer.circularFileRefNo}" /></td>
			</tr>
			<tr>
			   <td>
			   	<p:outputLabel value="#{lbl['lbl.ct.cc.csdate']}" />
			   </td>
			   <td>
			   		<p:inputText value="#{panelBackingBean.managedBean.circularVer.startDate}" disabled="true" style="width:140px;">
			   			<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			   		</p:inputText>				   
			   </td>
				<td>
				</td>				   
		       <td>
		       	<h:outputLabel value="#{lbl['lbl.ct.cc.cedate']}" />
		       </td>
			   <td>
			   		<p:inputText value="#{panelBackingBean.managedBean.circularVer.endDate}" disabled="true" style="width:140px; margin-top:3px;" >
			   			<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			   		</p:inputText>	 
			    </td>
				<td>
					<p:message for="popupButtonCal1" display="icon" />
				</td>				         
		    </tr>
			<tr>
		   	     <td><h:outputLabel value="#{lbl['lbl.ct.pc.compdeadline']}" /></td>
			     <td><h:panelGroup>
				     <p:inputText value="#{panelBackingBean.managedBean.circularVer.complaintDeadline}" 
				       maxlength="4" style="margin-top:2px;text-align:right; width:50px;" />
				     <p:spacer width="5" />
				     <h:outputText value="#{lbl['lbl.ct.pc.months']}" />
			        </h:panelGroup>	</td>
			       <td></td>
			<td><h:outputLabel value="#{lbl['lbl.ct.pc.paymentday']}" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.paymentDay}" 
				  maxlength="4" style="margin-top:2px;text-align:right; width:50px;" />
				<p:spacer width="5" />
				<h:outputText value="#{lbl['lbl.ct.pc.days']}" />
			</h:panelGroup></td>
			<td></td>
			</tr>
			
			<tr>
			<td><h:outputLabel value="#{lbl['lbl.ct.delivery.period']}" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.deliveryTerm}" 
				    maxlength="4" style="text-align:right; width:50px;">
				</p:inputText>
				<p:spacer width="5" />
				<h:outputText value="#{lbl['lbl.ct.pc.days']}" />
			</h:panelGroup>	</td>
			<td></td>
			<td><h:outputLabel value="#{lbl['lbl.ct.pc.lastreqday']}" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.lastRequestDay}" 
				   maxlength="4" style="text-align:right; width:50px;" />
				<p:spacer width="5" />
				<h:outputText value="#{lbl['lbl.ct.pc.days']}" />
			</h:panelGroup></td>
			<td></td>
			</tr>
			
			<tr>
			<td><h:outputLabel value="#{lbl['lbl.ct.pc.replacementday']}" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.replacementDay}" 
				  maxlength="4" style="text-align:right; width:50px;" />
				<p:spacer width="5" />
				<h:outputText value="#{lbl['lbl.ct.pc.days']}" />
			</h:panelGroup>	</td>
			<td></td>
			<td><h:outputLabel value="#{lbl['lbl.ct.pc.warrantyperiod']}" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.warrantyPeriod}"
				   maxlength="4" style="text-align:right; width:50px;" />
				<p:spacer width="5" />
				<h:outputText value="#{lbl['lbl.ct.pc.months']}" />
			</h:panelGroup>	</td>
			<td></td>
			</tr>
			
			<tr>
			<td><p:outputLabel value="#{lbl['lbl.ct.pc.extperiod']}" /></td>
			<td><h:panelGroup>
			    <p:inputText value="#{panelBackingBean.managedBean.circularVer.extendPeriod}" 
			    style="text-align:right; width:50px;">
			    <p:ajax event="blur" process="@this" 
				  listener="#{panelBackingBean.extendStartEndDate()}" update=":form:popupButtonCal5,:form:popupButtonCal6"></p:ajax>
				</p:inputText>
			    <p:spacer width="5" />
			    <h:outputText value="#{lbl['lbl.ct.pc.months']}" /></h:panelGroup>
			</td>
			<td></td>
			<td><p:outputLabel value="#{lbl['lbl.ct.cc.upload']}" /></td>
			<td><h:commandLink value="#{panelBackingBean.managedBean.circularVer.circularFileName}" styleClass="blue_font" 
				action="#{panelBackingBean.downloadFile()}" />	</td>
		
			</tr>
			
			<tr>
			<td><p:outputLabel value="#{lbl['lbl.ct.pc.extstartdt']}" /></td>
			<td>
			  <p:calendar  value="#{panelBackingBean.managedBean.circularVer.extendStartDate}" 
			    disabled="true" size="17" id="popupButtonCal5" showOn="button"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
		       </p:calendar>
		    </td>
			<td> </td>	
			<td><p:outputLabel value="#{lbl['lbl.ct.pc.extenddt']}" /></td>
			<td><p:calendar size="17" value="#{panelBackingBean.managedBean.circularVer.extendEndDate}" disabled="true"
				 pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" showOn="button" id="popupButtonCal6" >
				</p:calendar>
			</td>
			<td> </td>					
		    </tr>
		 </table>
</ui:composition>
