<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<table style="width: 100%" >
			<tr>
				<td style="width: 15%;" ><p:outputLabel value="#{lbl['lbl.ct.cc.cno']}" /></td>
				<td><p:inputText disabled="true" value="#{panelBackingBean.managedBean.circularVer.circularNo}" style="width:170px;" /></td>
				<td rowspan="2" valign="top" style="width: 15%;">	<p:outputLabel value="#{lbl['lbl.ct.cc.cname']}" /></td>
				<td rowspan="2"><p:inputTextarea cols="31" rows="3"
						style=" margin-bottom:5px;"
						value="#{panelBackingBean.managedBean.circularVer.name}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.ct.cc.frno']}" /></td>
				<td><p:inputText
				    value="#{panelBackingBean.managedBean.circularVer.circularFileRefNo}" style="width:170px;" /></td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.ct.cc.csdate']}" /></td>
			    <td><p:calendar disabled="true" value="#{panelBackingBean.managedBean.circularVer.startDate}" 
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal3" showOn="button" /></td>
			    <td><p:outputLabel value="#{lbl['lbl.ct.cc.cedate']}" /></td>
			    <td><p:calendar disabled="true" value="#{panelBackingBean.managedBean.circularVer.endDate}" 
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" size="24" id="popupButtonCal4" showOn="button"  
				/></td>
		    </tr>
		    <tr>
			<td><p:outputLabel value="Complaint Deadline" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.complaintDeadline}" 
				  style="text-align:right; margin-top:5px; width:50px;" />
				<h:outputText value=" months" />
			</h:panelGroup>	</td>
			<td><p:outputLabel value="Payment Day" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.paymentDay}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup></td>
		    </tr>
		    
		    <tr>
		    <td><p:outputLabel value="Delivery Term" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.deliveryTerm}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup>	</td>
			<td><p:outputLabel value="Last Request Day" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.lastRequestDay}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup></td>
		    </tr>
		   
		    <tr>
			   <td><p:outputLabel value="Replacement Day" /></td>
			   <td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.replacementDay}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup>	</td>
			<td><p:outputLabel value="Warranty Period" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.warrantyPeriod}" style="text-align:right; width:50px;" />
				<h:outputText value=" months" />
			</h:panelGroup>	</td>										
			</tr>
			
			<tr>
			<td><p:outputLabel value="Extension Period" /></td>
			<td><h:panelGroup>
			    <p:inputText value="#{panelBackingBean.managedBean.circularVer.extendPeriod}" 
			    style="text-align:right; width:50px;" /> <h:outputText value=" months" /></h:panelGroup></td>
			<td><p:outputLabel value="#{lbl['lbl.ct.cc.upload']}" /></td>
			<td><h:commandLink value="#{panelBackingBean.managedBean.circularVer.circularFileName}" styleClass="blue_font" 
				action="#{panelBackingBean.downloadFile()}" />	</td>
		
			</tr>
			
			<tr>
			<td><p:outputLabel value="Extension Start Date" /></td>
			<td><p:calendar style="width:150px;" value="#{panelBackingBean.managedBean.circularVer.extendStartDate}"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal5" showOn="button" /></td>
			<td><p:outputLabel value="Extension End Date" /></td>
			<td><p:calendar style="width:150px;" value="#{panelBackingBean.managedBean.circularVer.extendEndDate}" 
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal6" showOn="button" /></td>				
		    </tr>
		 </table>
</ui:composition>
