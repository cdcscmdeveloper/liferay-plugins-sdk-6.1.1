<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<h:panelGrid columns="2" columnClasses="colAlignTop,colAlignTop">
		<h:panelGrid columns="4" style="width:600px;">
			<h:outputLabel value="#{lbl['lbl.ct.cc.cno']}" />
			<p:inputText disabled="true" value="#{panelBackingBean.managedBean.circularVer.circularNo}" />
			<h:outputLabel value="#{lbl['lbl.ct.cc.cname']}" />
			<p:inputText disabled="true" value="#{panelBackingBean.managedBean.circularVer.name}" />
			<h:outputLabel value="#{lbl['lbl.ct.cc.csdate']}" />
			<p:calendar disabled="true" value="#{panelBackingBean.managedBean.circularVer.startDate}" 
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal3" showOn="button" />
			<h:outputLabel value="#{lbl['lbl.ct.cc.cedate']}" />
			<p:calendar disabled="true" value="#{panelBackingBean.managedBean.circularVer.endDate}" 
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal4" showOn="button" />
			<h:outputLabel value="#{lbl['lbl.ct.cc.upload']}" />
			<h:commandLink value="#{panelBackingBean.managedBean.circularVer.circularFileName}" styleClass="blue_font" 
				action="#{panelBackingBean.downloadFile(1)}" />			
			<h:outputLabel value="#{lbl['lbl.ct.cc.frno']}" />
			<p:inputText disabled="true" value="#{panelBackingBean.managedBean.circularVer.circularFileRefNo}" />	
			<h:outputLabel value="Panel Type" />
			<p:selectOneMenu value="#{panelBackingBean.managedBean.circularVer.panelType.parameterId}">
				<f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.panelType)}" />
			</p:selectOneMenu>			
			<p:spacer />
			<p:spacer />				
			<h:outputLabel value="Complaint Deadline" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.complaintDeadline}" style="text-align:right; width:50px;" />
				<h:outputText value=" months" />
			</h:panelGroup>	
			<h:outputLabel value="Payment Day" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.paymentDay}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup>
			<h:outputLabel value="Delivery Term" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.deliveryTerm}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup>	
			<h:outputLabel value="Last Request Day" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.lastRequestDay}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup>
			<h:outputLabel value="Replacement Day" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.replacementDay}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup>	
			<h:outputLabel value="Warranty Period" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.warrantyPeriod}" style="text-align:right; width:50px;" />
				<h:outputText value=" months" />
			</h:panelGroup>											
			<p:outputLabel value="#{lbl['lbl.ct.pc.update.type']}" />
			<p:selectOneMenu value="#{panelBackingBean.managedBean.circularVer.updateType.parameterId}">
				<f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.circularUpdateType)}" />
			</p:selectOneMenu>			
			<h:outputLabel value="#{lbl['lbl.ct.pc.update.no']}" />
			<p:inputText value="#{panelBackingBean.managedBean.circularVer.updateNo}" />
			<h:outputLabel value="#{lbl['lbl.ct.pc.update.name']}" />
			<p:inputText value="#{panelBackingBean.managedBean.circularVer.updateName}" />		
			<h:outputLabel value="Update Description" />
			<p:inputText value="#{panelBackingBean.managedBean.circularVer.updateDescription}" />								
			<h:outputLabel value="* Update Letter" />
			<h:panelGroup id="uploadUpdCcrPg">
				<p:commandButton oncomplete="uploadUpdCcrDlg.show();return false;" icon="iconAttachment" 
					update="uploadUpdCcrPg" value="Choose file" 
					rendered="#{panelBackingBean.isCentralContractAdmin()}" />	
				<h:commandLink value="#{panelBackingBean.managedBean.circularVer.updateFileName}" styleClass="blue_font" 
					action="#{panelBackingBean.downloadFile(2)}" />					
			</h:panelGroup>
			<h:outputLabel value="Update File Ref. No." />
			<p:inputText value="#{panelBackingBean.managedBean.circularVer.updateFileRefNo}" />
			<h:outputLabel value="Extension Period" />
			<p:inputText value="#{panelBackingBean.managedBean.circularVer.extPeriod}" />
			<f:verbatim />
			<f:verbatim />			
			<h:outputLabel value="Extension Start Date" />
			<p:calendar style="width:150px;" value="#{panelBackingBean.managedBean.circularVer.extStartDate}"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal5" showOn="button" />
			<h:outputLabel value="Extension End Date" />
			<p:calendar style="width:150px;" value="#{panelBackingBean.managedBean.circularVer.extEndDate}" 
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal6" showOn="button" />				
		</h:panelGrid>
		<h:panelGrid columns="1" style="width:120px;">
			<p:outputLabel value="#{lbl['lbl.ct.cc.coverage']}" />
			<h:panelGrid columns="4">
				<p:spacer width="20" />
				<p:selectBooleanCheckbox disabled="true" value="#{panelBackingBean.managedBean.circularVer.peninsular}" />
				<p:spacer width="5" />
				<p:outputLabel value="#{lbl['lbl.ct.cc.chk']}" />
			</h:panelGrid>
			<h:panelGrid columns="4">
				<p:spacer width="20" />
				<p:selectBooleanCheckbox disabled="true" value="#{panelBackingBean.managedBean.circularVer.sabah}" />
				<p:spacer width="5" />
				<p:outputLabel value="#{lbl['lbl.ct.cc.chk.sabah']}" />
			</h:panelGrid>
			<h:panelGrid columns="4">
				<p:spacer width="20" />
				<p:selectBooleanCheckbox disabled="true" value="#{panelBackingBean.managedBean.circularVer.sarawak}" />
				<p:spacer width="5" />
				<p:outputLabel value="#{lbl['lbl.ct.cc.chk.swak']}" />
			</h:panelGrid>
		</h:panelGrid>
	</h:panelGrid>
	
	<p:dialog id="uploadUpdCcrDlg" widgetVar="uploadUpdCcrDlg" modal="false" resizable="false" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" 
			fileUploadListener="#{panelBackingBean.fileUpload}" 
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="uploadUpdCcrPg" >
		</p:fileUpload> 
	</p:dialog>

</ui:composition>
