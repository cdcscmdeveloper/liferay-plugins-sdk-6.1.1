<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
    <ui:define name="contentSection">
    <script> $('#portlet_ctCancelCircular_WAR_NGePportlet').find('.portlet-title-text').html('#{panelBackingBean.getCancelPortletTitle()}'); </script>
    <style>
    .confirmation-message-box {
         	border: 1px solid #cecece;
			font-family: Arial;
			font-size: 12px;
			cursor: default;
			padding: 10px;
         }
    </style>
    	<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	    <ui:include src="cancelCircularButtons.xhtml" />
		<ui:include src="cancelCircularHeader.xhtml" />
		<ui:include src="cancelCircularDetail.xhtml" />
		<c:if test="#{panelBackingBean.isPanelAdmin() || panelBackingBean.isCentralContractAdmin()}">
		  <p:panel id="settingId" header="#{lbl['lbl.ct.panel.approver.list']}" toggleable="true" toggleSpeed="500">
		    <h:panelGrid columns="2">
		     <h:panelGrid style="width:180px;"> <f:verbatim/></h:panelGrid>
			   <h:panelGrid style="width:500px;">
				 <p:pickList id="approverpickList" value="#{panelBackingBean.managedBean.approverModel}"
					var="data" itemValue="#{data}" itemLabel="#{data.userName}" 
					showTargetControls="true" filterMatchMode="contains"
					converter="pmUserConverter">
					<f:facet name="sourceCaption">#{lbl['lbl.ct.available.approver']}</f:facet>  
        			<f:facet name="targetCaption">
        				    <h:outputText value="#{lbl['lbl.ct.selected.approver']}"  styleClass="required"/>
        	        </f:facet> 
				</p:pickList>
			 </h:panelGrid>
	 	 </h:panelGrid>
	  </p:panel>
	</c:if>
	<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" /> 
	    
  </ui:define>
</ui:composition>
