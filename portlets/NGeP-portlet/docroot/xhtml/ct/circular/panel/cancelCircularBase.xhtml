<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
    <ui:define name="contentSection">
    	<f:event listener="#{panelBackingBean.preRenderViewCancelReq}" type="preRenderView" />	
		<p:panel>
			<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	    	<table style="width: 100%;">
	    		<tr>
	    			<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" /></td>
	    			<td class="ppRightBtn">
			  			<ui:repeat var="action"	value="#{panelBackingBean.managedBean.outComes}">
							<p:commandButton value="#{action}" ajax="false" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(action)}" 
								action="#{panelBackingBean.saveCancelCircularReq(action)}" />
						</ui:repeat>	    			
	    			</td>
	    		</tr>
	    	</table>			
			<table style="width: 99%; margin-left: 25px;">
				<tr style="margin-button: 10px;">
					<td>
						<h6 style="color: blue;">
							<p:outputLabel value="Cancel Circular Request Id" />
						</h6>
					</td>
					<td>
						<h6>
							<p:inputText size="20"
								value="#{panelBackingBean.managedBean.cancelCircularReq.cancelCircularReqId == null ? '-- System Generated --':panelBackingBean.managedBean.cancelCircularReq.cancelCircularReqId}"
								disabled="true" />
						</h6>
					</td>
					<td>
						<h6 style="color: blue;">
							<p:outputLabel value="#{lbl['lbl.ct.cc.status']}" />
						</h6>
					</td>
					<td>
						<h6>
							<p:inputText size="20"
								value="#{panelBackingBean.getStatusDescById(panelBackingBean.managedBean.cancelCircularReq.status.statusId)}"
								disabled="true" />
						</h6>
					</td>
				</tr>
			</table>	    	
		</p:panel>
		<p:tabView id="tabview" orientation="left" >
			<p:tab id="tabcd" title="Circular Details" >
	       		<ui:include src="/xhtml/ct/circular/panel/cancelCircularDetail.xhtml"/>
	       		<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" /> 
	       	</p:tab> 
		 	<p:tab id="tabSetting" title="Setting" rendered="#{panelBackingBean.isPanelAdmin() || panelBackingBean.isCentralContractAdmin()}" >
	       		<ui:include src="/xhtml/ct/circular/panel/approverSetting.xhtml" />  
	       	</p:tab>   
		</p:tabView>
	</ui:define>
		    
</ui:composition>
