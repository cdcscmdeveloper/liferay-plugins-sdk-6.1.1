<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ac:gpkiPopup
		textBeforeSign="#{panelBackingBean.managedBean.textBeforeSign}"
		postSignAction="#{panelBackingBean.preSubmitPanelCircular(gpkiBackingBean.pmDigiSign)}"
		enableAutoUpdate="#{panelBackingBean.enableAutoUpdate()}" />
	<table style="width: 100%;">
		<tr>
			<td><!--#33511 start--><p:commandButton value="#{lbl['lbl.btn.back']}"
					immediate="true" action="#{panelBackingBean.backAction}"
					rendered="#{panelBackingBean.managedBean.action != null and panelBackingBean.managedBean.taskId==null}" /><!--#33511 end--></td>
			<td class="ppRightBtn"><f:event
					listener="#{panelBackingBean.preRenderView}" type="preRenderView" />
				<ui:repeat var="action"
					value="#{panelBackingBean.managedBean.outComes}">
					<ui:param name="buttonLabel"
						value="lbl.btn.#{fn:toLowerCase(action)}" />
					<p:commandButton id="subBtnId" value="#{lbl[buttonLabel]}" styleClass="ui-button"
						update="@form" onkeypress="if (event.keyCode == 13) { return false; }"
						process="@form"
						onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{panelBackingBean.gpkiSignAction(action)}"/>
				</ui:repeat></td>
				<td style="float: right;">
				<c:if test="#{panelBackingBean.managedBean.action eq 'view' and circularBackingBean.isAuditCheck()}">
			<p:commandLink value="#{lbl['lbl.audit.link.auditTrail']}"
						action="#{auditContractBackingBean.redirectToAudittrailView(
                panelBackingBean.managedBean.circular.circularType,
                panelBackingBean.managedBean.circular.circularId,
                panelBackingBean.managedBean.circularVer.docType)}"
						immediate="true" />
			</c:if>
			<c:if test="#{panelBackingBean.managedBean.action eq 'view' }">
			&#160;&#160;
					<p:commandLink value="#{lbl['lbl.td.doc.trackingDiary']}" immediate="true"
						action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiaryForCircularContract(panelBackingBean.managedBean.circularVer.docType,
						panelBackingBean.managedBean.circular.circularId, panelBackingBean.managedBean.circular.circularNo)}"  /> <!-- #36608 -->

			</c:if>
			</td>
		</tr>
	</table>
</ui:composition>
