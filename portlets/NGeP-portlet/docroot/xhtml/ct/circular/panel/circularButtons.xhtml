<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%;">
	 <tr>
	   <td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" icon="ui-icon-back" action="#{panelBackingBean.backAction}" rendered="#{panelBackingBean.managedBean.action != null}" /></td>
	    <td class="ppRightBtn">
	         <f:event listener="#{panelBackingBean.preRenderView}" type="preRenderView" />	
			 <ui:repeat var="action" value="#{panelBackingBean.managedBean.outComes}">
			    <ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(action)}" />
				<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(action)}" update="@form" 
				   action="#{panelBackingBean.savePanelCircular(action)}" />
			 </ui:repeat>	    			
	    </td>
	  </tr>
	</table>	
</ui:composition>
