<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <ui:define name="contentSection">
    	<f:event listener="#{panelBackingBean.preRenderView}" type="preRenderView" />	
		<p:panel>
			<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	    	<table style="width: 100%;">
	    		<tr>
	    			<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" /></td>
	    			<td class="ppRightBtn">
			  			<ui:repeat var="action"	value="#{panelBackingBean.managedBean.outComes}">
							<p:commandButton value="#{action}" ajax="false" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(action)}" 
								action="#{panelBackingBean.savePanelCircular(action)}" />
						</ui:repeat>	    			
	    			</td>
	    		</tr>
	    	</table>
			<table style="width: 99%; margin-left: 0px;" class="header-info">
				<tr style="margin-button: 0px;">
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.pc.cno']}" />
					</td>
					<td>
							<p:inputText size="20"
								value="#{panelBackingBean.managedBean.circularVer.circularNo == null ? '-- User Input --':panelBackingBean.managedBean.circularVer.circularNo}"
								disabled="true" />
					</td>
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.cc.cname']}" />
					</td>
					<td>
							<p:inputText size="40"
								value="#{panelBackingBean.managedBean.circularVer.name == null ? '-- User input --':panelBackingBean.managedBean.circularVer.name}"
								disabled="true" />
					</td>					
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.cc.status']}" />
					</td>
					<td>
							<p:inputText size="20"
								value="#{panelBackingBean.getStatusDescById(panelBackingBean.managedBean.circularVer.status.statusId)}"
								disabled="true" />
					</td>
				</tr>
			</table>	    	
		</p:panel>
		<p:tabView id="tabview" orientation="left"  >
			<p:tab id="tabcd" title="Circular Details" >
	       		<ui:include src="/xhtml/ct/circular/panel/circularDetail.xhtml"/>
	       	</p:tab> 
	       	<p:tab id="tabItem" title="Item">
	       		<ui:include src="/xhtml/ct/circular/panel/item.xhtml"/>  
	       	</p:tab>  
		 	<p:tab id="tabSetting" title="Setting" rendered="#{panelBackingBean.isPanelAdmin()}" >
	       		<ui:include src="/xhtml/ct/circular/panel/approverSetting.xhtml" />  
	       	</p:tab>   
		</p:tabView>
		<ac:lovPopup />
	</ui:define>
		    
</ui:composition>
