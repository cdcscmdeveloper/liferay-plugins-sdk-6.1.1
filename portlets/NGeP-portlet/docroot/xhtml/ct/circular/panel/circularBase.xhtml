<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="contentSection">
    	<f:event listener="#{panelBackingBean.preRenderView}" type="preRenderView" />	
		<p:panel>
			<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
			<div class="ppRightBtn"> 
	  			<ui:repeat var="action"	value="#{panelBackingBean.managedBean.outComes}">
					<p:commandButton value="#{action}" ajax="false" styleClass="ui-button" action="#{panelBackingBean.saveCircularPanel(action)}" />
				</ui:repeat>		
	    	</div>
		</p:panel>
		<p:tabView id="tabview" orientation="left" >
			<p:tab id="tabcd" title="Circular Details" >
	       		<ui:include src="/xhtml/ct/circular/panel/circularDetail.xhtml"/>
	       	</p:tab> 
		 	<p:tab id="tabAgency" title="Zone" >
	       		<ui:include src="/xhtml/ct/circular/panel/zone.xhtml"/>
	       	</p:tab> 
		 	<p:tab id="tabItem" title="Item" >
	       		<ui:include src="/xhtml/ct/circular/panel/item.xhtml"/>  
	       	</p:tab>  
		 	<p:tab id="tabSetting" title="Setting" rendered="#{panelBackingBean.isPanelAdmin()}" >
	       		<ui:include src="/xhtml/ct/circular/panel/approverSetting.xhtml" />  
	       	</p:tab>   
			<p:tab id="tabSchedule" title="#{lbl['lbl.ct.menu.remark']}" >
		    	<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />   
		    </p:tab>  
		</p:tabView>
	</ui:define>
		    
</ui:composition>
