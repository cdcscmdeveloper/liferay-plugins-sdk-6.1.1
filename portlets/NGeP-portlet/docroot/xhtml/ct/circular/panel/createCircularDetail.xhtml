<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	
	<h:panelGrid id="panelCircularId" columns="4" 
	   columnClasses="columnWidth200,columnWidth230,columnWidth180,columnWidth300">
				
				     <p:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" styleClass="required" />
				   <h:panelGrid columns="2">
					<p:inputTextarea id="circularNoTxt" style="width:170px; margin-top:2px;margin-bottom:2px" rows="5"
					 	required="true" maxlength="60"  disabled="#{panelBackingBean.managedBean.viewContract}"
						value="#{panelBackingBean.managedBean.circularVer.circularNo}" label="#{lbl['lbl.ct.physical.circular.no']}"  autoResize="false"
						onkeyup="limitTextArea(this,60);" onkeydown="limitTextArea(this,60);" />
					<p:message for="circularNoTxt" display="icon" />
				   </h:panelGrid>
				
				    <p:outputLabel value="#{lbl['lbl.ct.circular.name']}"  styleClass="required"/>
				    <h:panelGrid columns="2">
				       <p:inputTextarea id="circularNameTxt" rows="5" style="width:230px;" maxlength="500" required="true" 
						   disabled="#{panelBackingBean.managedBean.viewContract}" autoResize="false"
						   label="#{lbl['lbl.ct.circular.name']}" value="#{panelBackingBean.managedBean.circularVer.name}" 
						   onkeyup="limitTextArea(this,500);" onkeydown="limitTextArea(this,500);" />
				         	<p:message for="circularNameTxt" display="icon" />
				    </h:panelGrid>
				    
				    <p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
				    <p:inputText  style="width:170px;" maxlength="60" disabled="#{panelBackingBean.managedBean.viewContract}"
						value="#{panelBackingBean.managedBean.circularVer.circularFileRefNo}"
						onkeypress="if (event.keyCode == 13) { return false; }"  />
						
						  <h:outputLabel value="#{lbl['lbl.ct.delivery.period']}" /> 
				         <h:panelGroup>
				             <p:inputText value="#{panelBackingBean.managedBean.circularVer.deliveryTerm}" 
				                 maxlength="4" style="text-align:right; width:85px;"
				                 disabled="#{panelBackingBean.managedBean.viewContract}">
				            </p:inputText>
				           <p:spacer width="5" />
				           <h:outputText value="#{lbl['lbl.ct.days']}" />
			            </h:panelGroup>	
			            
						<p:outputLabel value="#{lbl['lbl.ct.start.date']}" styleClass="required"/>
			   	         <h:panelGrid columns="2">
			   	            <p:calendar value="#{panelBackingBean.managedBean.circularVer.startDate}" id="popupButtonCal" 
			   			          navigator="true" size="17" showOn="button" required="true" readonlyInput="true" label="#{lbl['lbl.ct.start.date']}"
			       		         disabled="#{panelBackingBean.managedBean.viewContract}" 
			       		             pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
			       	             <p:ajax event="dateSelect" process="@this" update=":form:popupButtonCal1" />
			                </p:calendar> 
			                <p:message for="popupButtonCal" display="icon" />
			              </h:panelGrid>
			          
		            	    <h:outputLabel value="#{lbl['lbl.ct.end.date']}"  styleClass="required"/>
	                    <h:panelGrid columns="2">
		   		           <p:calendar value="#{panelBackingBean.managedBean.circularVer.endDate}" id="popupButtonCal1" 
		   		            	pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
		         	            mindate="#{panelBackingBean.managedBean.circularVer.startDate}" size="17" navigator="true"
		         	            showOn="button" required="true" readonlyInput="true" label="#{lbl['lbl.ct.end.date']}"
		         	            disabled="#{panelBackingBean.managedBean.viewContract}">
		         	            <f:attribute name="startDate" value="#{panelBackingBean.managedBean.circularVer.startDate}" />
                                  <f:validator validatorId="primeDateRangeValidator" />
		         	   </p:calendar>
		         	   <p:message for="popupButtonCal1" display="icon" />
		         	</h:panelGrid>			        
			</h:panelGrid>
			
			<h:panelGrid columns="2">    
				           <h:panelGrid class="columnWidth200">
			    	           <p:outputLabel value="#{lbl['lbl.ct.circular.letter']}" styleClass="required" />
				           </h:panelGrid>
		
		                   <h:panelGroup id="uploadCircularPg">
				   	              <p:commandButton
						               update="uploadCircularPg, uploadCircularDlg" action="#{panelBackingBean.setPanelDetailsValue()}" 
						                value="#{lbl['lbl.bpm.choose.file']}" disabled="#{panelBackingBean.managedBean.viewContract}"/>	
					               <h:commandLink value="#{panelBackingBean.managedBean.circularVer.circularFileName}" 
						               styleClass="blue_font"  action="#{panelBackingBean.downloadFile()}" />				
			  	            </h:panelGroup>
			  	          </h:panelGrid>	
	
	   <p:dialog id="uploadCircularDlg" widgetVar="uploadCircularDlg" 
	        modal="true" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" 
		    sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			fileUploadListener="#{panelBackingBean.fileUpload}" 
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}" 
			update="uploadCircularPg" >
		</p:fileUpload> 
	</p:dialog>
</ui:composition>
