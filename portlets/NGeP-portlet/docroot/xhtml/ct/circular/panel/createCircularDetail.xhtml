<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<table style="width: 100%" >
			<tr>
				<td style="width: 15%;" ><p:outputLabel value="#{lbl['lbl.ct.cc.cno']}" /></td>
				<td><p:inputText value="#{panelBackingBean.managedBean.circularVer.circularNo}"  style="width:170px;"/></td>
				<td rowspan="2" valign="top" style="width: 15%;">	<h:outputLabel value="#{lbl['lbl.ct.cc.cname']}" /></td>
				<td rowspan="2"><p:inputTextarea cols="23" rows="3"
						style=" margin-bottom:0px;"
						value="#{panelBackingBean.managedBean.circularVer.name}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.ct.cc.frno']}" /></td>
				<td><p:inputText  style="width:170px;"
						value="#{panelBackingBean.managedBean.circularVer.circularFileRefNo}"
						disabled="true" /></td>
			</tr>
			<tr>
			   <td><p:outputLabel value="#{lbl['lbl.ct.cc.csdate']}" /></td>
			   <td><p:calendar value="#{panelBackingBean.managedBean.circularVer.startDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal" showOn="button" /></td>
		       <td><h:outputLabel value="#{lbl['lbl.ct.cc.cedate']}" /></td>
			   <td><p:calendar value="#{panelBackingBean.managedBean.circularVer.endDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal1" showOn="button" /></td>
		    </tr>
		    <tr>
		        <td><p:outputLabel value="Item Category" /></td>
			    <td><p:selectOneMenu value="#{panelBackingBean.managedBean.circularVer.itemCategory.parameterCode}" style="width:135px;">
				<f:selectItems value="#{panelBackingBean.getDropdownCodeValues(ParameterTypeConst.itemCategoryType)}" />
				<p:ajax event="change" update=":form:tabview" process="@form" />
			   </p:selectOneMenu>	</td>
			   <td><h:outputLabel value="Zonal Level" /></td>
			   <td><p:selectOneMenu value="#{panelBackingBean.managedBean.circularVer.zonalLevel.parameterCode}" style="width:135px;">
				<f:selectItems value="#{panelBackingBean.getZonalLevelDropDown()}" />
				<p:ajax event="change" update=":form:tabview" process="@form" />
			   </p:selectOneMenu></td>
			</tr>
			<tr>
			<td> <h:outputLabel value="* #{lbl['lbl.ct.cc.upload']}" /></td>
			<td> <h:panelGroup id="uploadCircularPg">
				   <p:commandButton oncomplete="uploadCircularDlg.show();return false;" icon="iconAttachment" 
					update="uploadCircularPg" value="Choose file" 
					rendered="#{panelBackingBean.isPanelAdmin()}" />	
					<h:commandLink value="#{panelBackingBean.managedBean.circularVer.circularFileName}" styleClass="blue_font" 
					action="#{panelBackingBean.downloadFile(1)}" />				
			</h:panelGroup>	</td>
			<td></td>
			<td></td>
			</tr>
			<tr>
		   	     <td><h:outputLabel value="Complaint Deadline" /></td>
			     <td><h:panelGroup>
				     <p:inputText value="#{panelBackingBean.managedBean.circularVer.complaintDeadline}" style="text-align:right; width:50px;" />
				     <h:outputText value=" months" />
			        </h:panelGroup>	</td>
			<td><h:outputLabel value="Payment Day" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.paymentDay}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup></td>
			</tr>
			
			<tr>
			<td><h:outputLabel value="Delivery Term" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.deliveryTerm}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup>	</td>
			<td><h:outputLabel value="Last Request Day" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.lastRequestDay}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup></td>
			</tr>
			
			<tr>
			<td><h:outputLabel value="Replacement Day" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.replacementDay}" style="text-align:right; width:50px;" />
				<h:outputText value=" days" />
			</h:panelGroup>	</td>
			<td><h:outputLabel value="Warranty Period" /></td>
			<td><h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.warrantyPeriod}" style="text-align:right; width:50px;" />
				<h:outputText value=" months" />
			</h:panelGroup>	</td>
			</tr>	
		</table>	
	   <p:dialog id="uploadCircularDlg" widgetVar="uploadCircularDlg" modal="false" resizable="false" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" 
			fileUploadListener="#{panelBackingBean.fileUpload}" 
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="uploadCircularPg" >
		</p:fileUpload> 
	</p:dialog>
	
</ui:composition>
