<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	
	<h:panelGrid id="panelCircularId" columns="4" columnClasses="columnWidth200,columnWidth230,columnWidth180,columnWidth300">
				
					<h:panelGrid columns="2" style="float:right;">
					     <p:outputLabel value="*" styleClass="mandatory" />
					     <p:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" />
				   </h:panelGrid>
				   <h:panelGrid columns="2">
					<p:inputTextarea id="circularNoTxt" style="width:170px; margin-top:2px;margin-bottom:2px" rows="5"
					 	required="true" maxlength="60"  disabled="#{panelBackingBean.managedBean.viewContract}"
						value="#{panelBackingBean.managedBean.circularVer.circularNo}" label="#{lbl['lbl.ct.physical.circular.no']}"  autoResize="false"/>
					<p:message for="circularNoTxt" display="icon" />
				   </h:panelGrid>
				
				   <h:panelGrid columns="2" style="float:right;">
				        <p:outputLabel value="*" styleClass="mandatory" />
				        <h:outputLabel value="#{lbl['lbl.ct.circular.name']}" />
				   </h:panelGrid>
				    <h:panelGrid columns="2">
				       <p:inputTextarea id="circularNameTxt" rows="5" style="width:230px;" maxlength="200" required="true" 
						   disabled="#{panelBackingBean.managedBean.viewContract}" autoResize="false"
						   label="#{lbl['lbl.ct.circular.name']}" value="#{panelBackingBean.managedBean.circularVer.name}" />
				         	<p:message for="circularNameTxt" display="icon" />
				    </h:panelGrid>
				    
				    <p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
				    <p:inputText  style="width:170px;" maxlength="60" disabled="#{panelBackingBean.managedBean.viewContract}"
						value="#{panelBackingBean.managedBean.circularVer.circularFileRefNo}" />
						
						 <h:panelGrid columns="2" style="float:right;">
						    <p:outputLabel value="*" styleClass="mandatory" />
							<p:outputLabel value="#{lbl['lbl.ct.start.date']}" />
			   	         </h:panelGrid>
			   	         <h:panelGrid columns="2">
			   	            <p:calendar value="#{panelBackingBean.managedBean.circularVer.startDate}" id="popupButtonCal" 
			   			          navigator="true" size="17" showOn="button" required="true" readonlyInput="true" label="#{lbl['lbl.ct.start.date']}"
			       		         disabled="#{panelBackingBean.managedBean.viewContract}" 
			       		             pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
			       	             <p:ajax event="dateSelect" process="@this" update=":form:popupButtonCal1" />
			                </p:calendar> 
			                <p:message for="popupButtonCal" display="icon" />
			              </h:panelGrid>
			              
			              <h:outputLabel value="#{lbl['lbl.ct.complaint.deadline']}" />
			            <h:panelGroup>
				            <p:inputText value="#{panelBackingBean.managedBean.circularVer.complaintDeadline}" 
				     	        disabled="#{panelBackingBean.managedBean.viewContract}"
				       	        maxlength="4" style="text-align:right;margin-top:2px; width:50px;" label="#{lbl['lbl.ct.complaint.deadline']}" />
				           <p:spacer width="5" />
				          <h:outputText value="#{lbl['lbl.ct.months']}" />
			        </h:panelGroup>	
			              
			               <h:panelGrid columns="2" style="float:right;">
			                    <p:outputLabel value="*" styleClass="mandatory" />
			              	    <h:outputLabel value="#{lbl['lbl.ct.end.date']}" />
		                   </h:panelGrid>
		                   <h:panelGrid columns="2">
			   		           <p:calendar value="#{panelBackingBean.managedBean.circularVer.endDate}" id="popupButtonCal1" 
			   		            	pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
			         	            mindate="#{panelBackingBean.managedBean.circularVer.startDate}" size="17" navigator="true"
			         	            showOn="button" required="true" readonlyInput="true" label="#{lbl['lbl.ct.end.date']}"
			         	            disabled="#{panelBackingBean.managedBean.viewContract}">
			         	            <f:attribute name="startDate" value="#{panelBackingBean.managedBean.circularVer.startDate}" />
                                   <f:validator validatorId="primeDateRangeValidator" />
			         	   </p:calendar>
			         	   <p:message for="popupButtonCal1" display="icon" />
			         	</h:panelGrid>
			         	
			         	
			        
			        
			         <h:outputLabel value="#{lbl['lbl.ct.complaint.deadline']}" />
			         <h:panelGroup>
				     <p:inputText value="#{panelBackingBean.managedBean.circularVer.complaintDeadline}" 
				     	disabled="#{panelBackingBean.managedBean.viewContract}"
				       	maxlength="4" style="text-align:right;margin-top:2px; width:50px;" label="#{lbl['lbl.ct.complaint.deadline']}" />
				     <p:spacer width="5" />
				     <h:outputText value="#{lbl['lbl.ct.months']}" />
			        </h:panelGroup>	
			        
			        <h:outputLabel value="#{lbl['lbl.ct.payment.day']}" />
			        <h:panelGroup>
				       <p:inputText value="#{panelBackingBean.managedBean.circularVer.paymentDay}" 
					     disabled="#{panelBackingBean.managedBean.viewContract}"
				         maxlength="4" style="text-align:right; width:50px;margin-top:2px;" label="#{lbl['lbl.ct.payment.day']}" />
				      <p:spacer width="5" />
				     <h:outputText value="#{lbl['lbl.ct.days']}" />
			      </h:panelGroup>
			
			     <h:outputLabel value="#{lbl['lbl.ct.delivery.period']}" /> 
			     <h:panelGroup>
				    <p:inputText value="#{panelBackingBean.managedBean.circularVer.deliveryTerm}" 
					disabled="#{panelBackingBean.managedBean.viewContract}"
				    maxlength="4" style="text-align:right; width:50px;" label="#{lbl['lbl.ct.delivery.period']}" />
				<p:spacer width="5" />
				<h:outputText value="#{lbl['lbl.ct.days']}" />
			</h:panelGroup>	
			
			<h:outputLabel value="#{lbl['lbl.ct.contract.effective.end.date']}" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.lastRequestDay}" 
					disabled="#{panelBackingBean.managedBean.viewContract}"
				     maxlength="4" style="text-align:right; width:50px;" label="#{lbl['lbl.ct.contract.effective.end.date']}" />
				<p:spacer width="5" />
				<h:outputText value="#{lbl['lbl.ct.days']}" />
			</h:panelGroup>
			
			<h:outputLabel value="#{lbl['lbl.ct.replacement.day']}" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.replacementDay}" 
					disabled="#{panelBackingBean.managedBean.viewContract}"
				  	maxlength="4" style="text-align:right; width:50px;" label="#{lbl['lbl.ct.replacement.day']}" />
				<p:spacer width="5" />
				<h:outputText value="#{lbl['lbl.ct.days']}" />
			</h:panelGroup>	
			
			<h:outputLabel value="#{lbl['lbl.ct.warranty.period']}" />
			<h:panelGroup>
				<p:inputText value="#{panelBackingBean.managedBean.circularVer.warrantyPeriod}" 
					disabled="#{panelBackingBean.managedBean.viewContract}"
				  	maxlength="4" style="text-align:right; width:50px;" label="#{lbl['lbl.ct.warranty.period']}" />
				<p:spacer width="5" />
				<h:outputText value="#{lbl['lbl.ct.months']}" />
			</h:panelGroup>	
			
			 <h:panelGrid columns="2" style="float:right;">
			     <p:outputLabel value="*" styleClass="mandatory" />
				 <h:outputLabel value="#{lbl['lbl.ct.circular.letter']}" />
			</h:panelGrid>
		
		        <h:panelGroup id="uploadCircularPg">
				   <p:commandButton icon="iconAttachment" 
					update="uploadCircularPg, uploadCircularDlg" action="#{panelBackingBean.setPanelDetailsValue()}" 
					value="#{lbl['lbl.bpm.choose.file']}" disabled="#{panelBackingBean.managedBean.viewContract}"/>	
					<h:commandLink value="#{panelBackingBean.managedBean.circularVer.circularFileName}" 
					    styleClass="blue_font"  action="#{panelBackingBean.downloadFile(1)}" />				
			  </h:panelGroup>	
			</h:panelGrid>
	
	 
	   <p:dialog id="uploadCircularDlg" widgetVar="uploadCircularDlg" modal="false" resizable="false" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" 
			fileUploadListener="#{panelBackingBean.fileUpload}" 
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="#{lbl['lbl.ct.upload.invalid.msg']}"
			update="uploadCircularPg" >
		</p:fileUpload> 
	</p:dialog>
	
</ui:composition>
