<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="itemId" header="#{lbl['lbl.ct.pc.panel.item']}" toggleable="true" toggleSpeed="500">
	 <h:panelGrid style="width:100%">
		<p:dataTable id="panelItemDt" var="panelItemsVar"  value="#{panelBackingBean.managedBean.circularVer.ctPanelItems}" 
		  selectionMode="single" rowKey="#{panelItemsVar}" selection="#{panelBackingBean.managedBean.selectedPanelItems}" 
		  rowIndexVar="index">
		   <ac:paginator for="panelItemDt" />
            <p:ajax event="rowSelect" update="@([id$=itemZone],[id$=itemSupplier],[id$=deleteItemBtn])"
		     process="@this"  listener="#{panelBackingBean.setPanelListner()}"/>	
		     <p:column style="width:2%;">
		     <p:selectBooleanCheckbox value="#{panelItemsVar.selectedCheckBox}"
				styleClass="myCustomChekBox">
					<p:ajax event="change" update="@([id$=deleteItemBtn])"
						listener="#{panelBackingBean.selectOneCheckboxSelect}"></p:ajax>
			 </p:selectBooleanCheckbox>
		     </p:column>
			  <p:column headerText="Panel Coverage" style="white-space:pre-line;width:6%;">
			     <p:selectOneMenu value="#{panelItemsVar.panelCoverageId.parameterId}" style="width:95%;" >
			      <f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.panelCoverageType)}"/>
			       <p:ajax event="change"  update="@([id$=panelItemDt],[id$=itemZone],[id$=itemSupplier],[id$=deleteItemBtn])" process="@this" 
			       listener="#{panelBackingBean.setCtPanelZoneListner(panelItemsVar)}"/> 
			     </p:selectOneMenu>
	  	      </p:column>
			  <p:column headerText="Item Category" style="white-space:pre-line;width:6%">
			     <p:selectOneMenu value="#{panelItemsVar.itemCategoryId.parameterId}" style="width:95%">
			       <f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.itemCategoryType)}"/>
			       <p:ajax event="change" update="spec" process="@this"/> 
			     </p:selectOneMenu>
			  </p:column>
		 	  <p:column headerText="#{lbl['lbl.ct.pc.item.name']}" style="width:10%;"><p:inputText value="#{panelItemsVar.itemName}" style="width:95%;" maxlength="100" /></p:column>
			  <p:column headerText="Specification" style="width:11%;">
			     <p:inputText id="spec" value="#{panelItemsVar.specification}"   style="width:95%;" maxlength="200"
				    disabled="#{panelBackingBean.getItemGeneralCode(panelItemsVar.itemCategoryId.parameterId) == ParameterConst.itemCategoryTypeGeneral}"/>
			  </p:column>
			  <p:column headerText="UOM" style="width: 11%;">
			      <ac:lov id="uomLovId" lovId="PM_UOM" size="8" 
				     headerText="UOM Lov" 
				     value="#{panelItemsVar.pmUom.uomName}" conditionField="recordStatus^1"
				     saveObject="panelBackingBean.managedBean.circularVer.ctPanelItems[#{index}].pmUom">
			      </ac:lov>
			  </p:column>
			  <p:column headerText="Min. Order Qty" style="white-space:pre-line;width:5%;">
			  <p:inputText value="#{panelItemsVar.minimumOrderQty}" style="width:90%;text-align:right;" label="Min. Order Qty">
			     <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, panelItemsVar.pmUom.uomCode)}" /> </p:inputText>
			  </p:column>
			  <p:column headerText="Had Pembelian Luar Kontrak" style="white-space:pre-line;width:7%;">
			    <p:inputText value="#{panelItemsVar.maxProcureAmt}" style="width:90%;text-align:right;" label="Had Pembelian Luar Kontrak">
			       <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText>
			    </p:column>
			  <p:column headerText="Direct Nego" style="white-space:pre-line;width:5%;"><p:selectBooleanCheckbox value="#{panelItemsVar.directNego}" /></p:column>			
			  <p:column headerText="Direct Purchase" style="white-space:pre-line;width:6%;"><p:selectBooleanCheckbox value="#{panelItemsVar.directPurchase}" /></p:column>	
			  <p:column headerText="Quotation /Tender" style="white-space:pre-line;width:6%;"><p:selectBooleanCheckbox value="#{panelItemsVar.qt}" /></p:column>
			  <p:column headerText="Status" style="width:6%;">
		        <p:selectOneMenu  value="#{panelItemsVar.recordStatusFlg}"
		          disabled="#{!panelBackingBean.managedBean.updateAction}" style="width:95%;">
				  <f:selectItem itemValue="0" itemLabel="Inactive" />
			      <f:selectItem itemValue="1" itemLabel="Active" />
			    </p:selectOneMenu>
			  </p:column>													
		  </p:dataTable>
		</h:panelGrid>
		<p:spacer height="2" />
		<div class="ppRightBtn">
		<p:commandButton value="Bulk Update" process="@this" icon="ui-icon-add" onsuccess="bulkUpdateDlg.show()"/>
		   <p:commandButton value="Add" process="@all" icon="ui-icon-add"
		      update="@([id$=panelItemDt])" action="#{panelBackingBean.addPanelItem()}"/>
		   <p:commandButton id="deleteItemBtn" value="Delete" icon="ui-icon-delete"  process="@this"
			 onsuccess="delItemDlg.show()" disabled="#{panelBackingBean.managedBean.buttonHideActive}" />
	    </div>
	    <p:dialog id="bulkUpdateDlg" header="Bulk Update" resizable="false"
		    styleClass="screen-title" widgetVar="bulkUpdateDlg"  modal="true" width="300" height="120">  
            <h:panelGrid columns="3">
               <f:verbatim></f:verbatim>
              <p:outputLabel  value="Panel Coverage"/>
                 <p:selectOneMenu value="#{panelBackingBean.managedBean.panelCoverageId}" style="width:100px;margin-bottom: 5px;">
			        <f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.panelCoverageType)}"/> 
			     </p:selectOneMenu>
			     <f:verbatim></f:verbatim>
			      <p:outputLabel  value="Item Category"/>
			     <p:selectOneMenu value="#{panelBackingBean.managedBean.itemCategoryId}" style="width:100px;">
			       <f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.itemCategoryType)}"/>
			     </p:selectOneMenu>
			  </h:panelGrid>
			  <p:spacer height="15"/>
           <div class="ppRightBtn">
		     <p:commandButton value="Yes" icon="ui-icon-accept" update="@([id$=panelItemDt])"
		       process="@all" actionListener="#{panelBackingBean.bulkUpdateRow()}" onclick="bulkUpdateDlg.hide();"/>
			 <p:commandButton value="No" icon="ui-icon-reject" onclick="bulkUpdateDlg.hide();" type="button" />
		   </div>
        </p:dialog>  	
		<p:dialog id="delItemDlg" header="Delete Confirmation" resizable="false"
		    styleClass="screen-title" widgetVar="delItemDlg"  modal="true" width="350" height="95">  
            <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png" value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			  <p:spacer width="10"/>
              <p:inputTextarea styleClass="ui-inputtextarea" rows="2" cols="48" value="Are you sure you want to delete this record?"/>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="Yes" icon="ui-icon-accept" update="@([id$=itemId])"
		       process="@all" actionListener="#{panelBackingBean.removeAddRow()}" onclick="delItemDlg.hide();"/>
			 <p:commandButton value="No" icon="ui-icon-reject" onclick="delItemDlg.hide();" type="button" />
		   </div>
        </p:dialog>  		
		<p:spacer height="40" />
		<p:outputPanel id="itemZone">
		    <h:panelGroup rendered="#{panelBackingBean.managedBean.selectionOfZone}">
		     <p:outputLabel value="#{lbl['lbl.ct.pc.sublabel.panelcoverage']}" style="float:left; font-weight:bold; padding-top:25px;"/>
			 <div style="clear:both" />
			 <table style="width: 100%">
				<tr>
					<td style="width: 94px"><p:outputLabel value="Location Level" /></td>
					<td><p:selectOneMenu id="locationLevels"
							value="#{panelBackingBean.managedBean.selectedPanelItems.locationLevelId.parameterId}"
							style="width: 178px;">
							<f:selectItems
								value="#{panelBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
							<p:ajax event="change"
								listener="#{panelBackingBean.selectLocation}"></p:ajax>
						</p:selectOneMenu></td>
				</tr>
			</table>
		  
		      <p:spacer height="20" />
		     <p:dataTable id="zoneGeneralDataTable" value="#{panelBackingBean.managedBean.selectedPanelItems.ctPanelZones}" var="panelZoneVar"
		        selectionMode="single" selection="#{panelBackingBean.managedBean.selectedPanelZone}" rowKey="#{panelZoneVar}" rowIndexVar="index" >
			    <ac:paginator for="zoneGeneralDataTable" />
			    <p:ajax event="rowSelect" update="@([id$=itemSupplier])" process="@this"  />	
					<p:column headerText="Location" style="width:60%">
					<p:outputLabel value="#{panelZoneVar.name}" style="float:left;"/>	
					</p:column>
                    <p:column headerText="Status" style="width:20%">
                      <p:selectOneMenu  value="#{panelZoneVar.recordStatusFlg}"  
                         disabled="#{!panelBackingBean.managedBean.updateAction}" style="width:100px;">
				         <f:selectItem itemValue="0" itemLabel="Inactive" />
			             <f:selectItem itemValue="1" itemLabel="Active" />
			          </p:selectOneMenu>
                    </p:column>
					<p:column headerText="Action" style="width:20%">
					  <p:commandLink
						actionListener="#{panelBackingBean.editPanelZoneLocation(panelZoneVar,index)}"
						process="@this" update="@([id$=zonePopupGeneral])"
						oncomplete="ZoneGeneral.show();">
						<p:graphicImage library="ep/images/design" name="edit.png"
						  value="/resources/ep/images/design/edit.png" />
					  </p:commandLink>
					</p:column>
			</p:dataTable>
		   <div class="ppRightBtn">
		   <p:commandButton value="Add"
					process="@this" update="@([id$=zonePopupGeneral])"
					oncomplete="ZoneGeneral.show();"
					actionListener="#{panelBackingBean.showGeneralZoneLocationPopup}"
					icon="ui-icon-add" />
		  <p:commandButton id="deleteZoneBtn" value="Delete" icon="ui-icon-delete" process="@this"
		     onsuccess="delZoneDlg.show();"/>
	    </div>	
	  </h:panelGroup>
	  <p:dialog header="ADD LOCATION" widgetVar="ZoneGeneral" modal="true"
		width="600" position="top" height="400">
		<p:panel id="zonePopupGeneral">
			<table styleClass="noBorders tr,noBorders td">

				<TR>
					<TD width="20%" valign="top"><p:outputLabel value="Zone Name"></p:outputLabel></TD>
					<TD width="80%"><p:inputText size="70"
							value="#{panelBackingBean.managedBean.zoneName}"></p:inputText>
					</TD>
				</TR>
				<TR>
					<TD width="20%" valign="top"><p:outputLabel
							value="Zone Location" /></TD>
					<TD width="80%"><p:panel></p:panel>
						<div style="height: 300px; overflow-y: scroll;">
							<p:tree id="treeZoneGeneralPopup"
								value="#{panelBackingBean.managedBean.rootZoanlTree}"
								var="location"
								selection="#{panelBackingBean.managedBean.selectedGeneralTreeNodes}"
								selectionMode="checkbox">
								<p:treeNode type="state">
									<h:outputText value="#{location.stateId.stateName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.districtId.districtName}" />
								</p:treeNode>
							</p:tree>
						</div></TD>
				</TR>
			</table>
		</p:panel>
		
		<p:commandButton
			value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}"
			style="float:right;" onclick="ZoneGeneral.hide();"
			icon="ui-icon-cancel" />
		
		<p:commandButton value="Ok"
			style="float:right;" onclick="ZoneGeneral.hide();" process="@all"
			update="@([id$=itemZone],[id$=zonePopupGeneral])"
			icon="ui-icon-accept"
			action="#{panelBackingBean.updateZoneGeneralLocation}">
		</p:commandButton>
	   </p:dialog>
	   
	   <p:dialog id="delZoneDlg" header="Delete Confirmation" resizable="false"
		    styleClass="screen-title" widgetVar="delZoneDlg"  modal="true" width="350" height="95">  
            <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png" value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			  <p:spacer width="10"/>
              <p:inputTextarea styleClass="ui-inputtextarea" rows="2" cols="48" value="Are you sure you want to delete this record?"/>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="Yes" icon="ui-icon-accept" update="@([id$=zoneGeneralDataTable],[id$=itemSupplier])"
		       process="@all" actionListener="#{panelBackingBean.deletePanelZone()}" onclick="delZoneDlg.hide();"/>
			 <p:commandButton value="No" icon="ui-icon-reject" onclick="delZoneDlg.hide();" type="button" />
		   </div>
        </p:dialog>  		
       </p:outputPanel>
		<p:spacer height="40" />
		<p:outputPanel id="itemSupplier">
		<p:outputLabel rendered="#{panelBackingBean.managedBean.selectedPanelZone != null and panelBackingBean.managedBean.selectionOfZone}" value="#{lbl['lbl.ct.pc.sublabel.panelsupplier']}" style="float:left; font-weight:bold; padding-top:25px;"/>
		<p:outputLabel rendered="#{panelBackingBean.managedBean.selectedPanelItems != null and !panelBackingBean.managedBean.selectionOfZone}" value="#{lbl['lbl.ct.pc.sublabel.itemsupplier']}" style="float:left; font-weight:bold; padding-top:25px;"/>
		<div style="clear:both" />
		<h:panelGroup rendered="#{(panelBackingBean.managedBean.selectedPanelZone != null and panelBackingBean.managedBean.selectionOfZone) or
		 (panelBackingBean.managedBean.selectedPanelItems != null and !panelBackingBean.managedBean.selectionOfZone)}">
			<p:dataTable id="itemSupplierDt" var="supVar" 
			value="#{panelBackingBean.managedBean.selectionOfZone ? panelBackingBean.managedBean.selectedPanelZone.ctPanelSuppliers : panelBackingBean.managedBean.selectedPanelItems.ctPanelSuppliers}"
		    selectionMode="single" selection="#{panelBackingBean.managedBean.selectedPanelSupplier}" rowKey="#{supVar}" rowIndexVar="index">
				<p:ajax event="rowSelect" />
				<p:column headerText="Supplier Name">
				<c:if test="#{panelBackingBean.managedBean.selectionOfZone}">
				   <ac:lov id="loaSupId"  lovId="SM_SUPPLIER" headerText="Supplier List" 
					   saveObject="panelBackingBean.managedBean.selectedPanelZone.ctPanelSuppliers[#{index}].supplier"
					   value="#{supVar.supplier.companyName}" update="@form" >
				   </ac:lov>
				  </c:if>
				  <c:if test="#{!panelBackingBean.managedBean.selectionOfZone}">
				   <ac:lov id="loaSupId1"  lovId="SM_SUPPLIER" headerText="Supplier List" 
					   saveObject="panelBackingBean.managedBean.selectedPanelItems.ctPanelSuppliers[#{index}].supplier"
					   value="#{supVar.supplier.companyName}"  update="@form" >
				   </ac:lov>
				  </c:if>
			    </p:column>
				<p:column headerText="Business Reg. No."> <p:outputLabel value="#{supVar.supplier.regNo}" style="float:left;"/></p:column>
				<p:column headerText="MOF No."><p:outputLabel /></p:column>
				<p:column headerText="Address"> <p:outputLabel value="#{panelBackingBean.getSupAddress(supVar)}"/></p:column>
				<p:column headerText="Status">
				 <p:selectOneMenu  value="#{supVar.recordStatusFlg}"  
                         disabled="#{!panelBackingBean.managedBean.updateAction}" style="width:100px;">
				         <f:selectItem itemValue="0" itemLabel="Inactive" />
			             <f:selectItem itemValue="1" itemLabel="Active" />
			          </p:selectOneMenu>
				</p:column>
			</p:dataTable>
		   <div class="ppRightBtn">
		     <p:commandButton value="Add" process="@form" icon="ui-icon-add"
		       update="itemSupplierDt" action="#{panelBackingBean.addPanelSupplier()}"/>
		     <p:commandButton id="deleteSupplierBtn" value="Delete" 
		       icon="ui-icon-delete" process="@this" onclick="delSupplierDlg.show()"/>
	      </div>
	      <p:dialog id="delSupplierDlg" widgetVar="delSupplierDlg" header="Delete Confirmation" 
		   styleClass="screen-title" resizable="false" modal="true" width="350" height="95">  
           <h:panelGrid columns="3">
             <p:graphicImage library="ep/images/design" name="exclamation.png"
			   value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			   <p:spacer width="10"/>
              <p:inputTextarea value="Are you sure you want to delete this record?" 
                rows="2" cols="48" styleClass="ui-inputtextarea"/>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="Yes" icon="ui-icon-accept" update="@([id$=itemSupplierDt])" process="@all"
		        actionListener="#{panelBackingBean.deletePanelSupplier()}" onclick="delSupplierDlg.hide();"/>
			 <p:commandButton value="No" icon="ui-icon-reject" onclick="delSupplierDlg.hide();" type="button" />
		  </div>
        </p:dialog>  
	    </h:panelGroup>	
	  </p:outputPanel>
	</p:panel>
	<p:panel header="#{lbl['lbl.ct.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{panelBackingBean.managedBean.circularVer.itemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{panelBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>	
</ui:composition>
