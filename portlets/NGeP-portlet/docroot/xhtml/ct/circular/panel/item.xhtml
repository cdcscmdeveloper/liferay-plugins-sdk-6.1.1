<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="itemId" header="#{lbl['lbl.ct.pc.panel.item']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="panelItemDt" var="data"   value="#{panelBackingBean.managedBean.circularVer.ctPanelItems}" 
		   rowKey="#{data}" selection="#{panelBackingBean.selectedPanelItem}" rowIndexVar="index" >
			<ac:paginator for="panelItemDt" />
			  <p:column selectionMode="multiple" style="width:18px;"/>  
			 <p:column headerText="Panel Coverage">
			   <p:selectOneMenu value="#{data.panelCoverageId.parameterId}" style="width:100px;">
			      <f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.panelCoverageType)}"/>
			       <p:ajax event="change" update=":form:tabview:itemId" process="@this" listener="#{panelBackingBean.setCtPanelZoneListner(data)}"/> 
			   </p:selectOneMenu>
	  	    </p:column>
			<p:column headerText="Item Category">
			 <p:selectOneMenu value="#{data.itemCategoryId.parameterId}" style="width:100px;">
			   <f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.itemCategoryType)}"/>
			   <p:ajax event="change" update="spec" process="@this"/> 
			 </p:selectOneMenu>
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.pc.item.name']}">
			  <p:inputText value="#{data.itemName}" style="width:135px;" />
			</p:column>
			<p:column headerText="Specification">
			  <p:inputText id="spec" value="#{data.specification}"  style="width:170px;" 
				disabled="#{panelBackingBean.getItemGeneralCode(data.itemCategoryId.parameterId) == ParameterConst.itemCategoryTypeGeneral}"/>
			</p:column>
			<p:column headerText="UOM">
			  <ac:lov id="uomLovId" lovId="PM_UOM" size="10"
				headerText="UOM Lov" update=":form:tabview:panelItemDt"
				value="#{data.pmUom.uomName}" conditionField="recordStatus^1"
				saveObject="panelBackingBean.managedBean.circularVer.ctPanelItems[#{index}].pmUom">
			  </ac:lov>
			</p:column>
			<p:column headerText="Min. Order Qty" >
			   <p:inputText value="#{data.minimumOrderQty}" style="width:70px;text-align:right;" />
			</p:column>
			<p:column headerText="Had Pembelian Luar Kontrak">
			   <p:inputText value="#{data.maxProcureAmt}" style="width:150px;text-align:right;" />
			</p:column>
			<p:column headerText="Direct Nego">
			  <p:selectBooleanCheckbox value="#{data.directNego}" />
			</p:column>			
			<p:column headerText="Direct Purchase">
			  <p:selectBooleanCheckbox value="#{data.directPurchase}" />
			</p:column>	
			<p:column headerText="Quotation/Tender">
			   <p:selectBooleanCheckbox value="#{data.qt}" />
			</p:column>
			<p:column headerText="Status">
		       <p:selectOneMenu  value="#{data.chkStatusId}" style="width:70px;">
				<f:selectItem itemValue="0" itemLabel="Inactive" />
			    <f:selectItem itemValue="1" itemLabel="Active" />
			  </p:selectOneMenu>
			</p:column>													
		</p:dataTable>
		<ac:lovPopup />
		<p:spacer height="2" />
		<div class="ppRightBtn">
		   <p:commandButton value="Add" process="@form" partialSubmit="true" 
			 icon="ui-icon-add" update="panelItemDt" action="#{panelBackingBean.addPanelItem()}"/>
		   <p:commandButton id="deleteItemBtn" value="Delete" icon="ui-icon-delete"  process="@form"
			 onsuccess="delItemDlg.show()" disabled="#{panelBackingBean.managedBean.ctPanelItems == null}" />
	     </div>	
		 <p:dialog id="delItemDlg" header="Delete Confirmation" resizable="false"
		    styleClass="screen-title" widgetVar="delItemDlg"  modal="true" width="325" height="90">  
            <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png"
			    value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			  <p:spacer width="10"/>
              <p:inputTextarea styleClass="ui-inputtextarea"
                 rows="2" cols="48" value="Are you sure you want to delete this record?"/>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="Yes" icon="ui-icon-accept" update="panelItemDt"
		       process="@form" actionListener="#{panelBackingBean.deletePanelItem()}" onclick="delItemDlg.hide();"/>
			 <p:commandButton value="No" icon="ui-icon-reject" onclick="delItemDlg.hide();" type="button" />
		   </div>
        </p:dialog>  		
		<p:spacer height="20" />
		<h:panelGroup id="itemZone" rendered="#{panelBackingBean.managedBean.ctPanelItems != null}">
		<table style="width: 100%">
		  <tr>
			<td style="width: 94px"><p:outputLabel id="locLevel" value="Location Level"/></td>
			<td> <p:selectOneMenu id="locationMenu" style="width:170px;"
			        value="#{panelBackingBean.managedBean.ctPanelItems.locationLevelId.parameterId}">
			        <f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.locationLevel)}"/>
			     </p:selectOneMenu>
		     </td>
		  </tr>
		</table>
		<p:spacer height="20" />
		<p:dataTable id="itemZoneDt" var="data" value="#{panelBackingBean.managedBean.ctPanelItems.ctPanelZones}"
		   rowKey="#{data}" selectionMode="Single" selection="#{panelBackingBean.managedBean.selectedPanelZone}" >
			<ac:paginator for="itemZoneDt"/>
			 <p:ajax event="rowSelect" update="@([id$=itemSupplier])"/>
			<p:column style="width:60%" headerText="#{lbl['lbl.ct.pc.zone.name']}">
				<h:outputText value="#{data.name}" style="width:200px;" />
			</p:column>
			<p:column style="width:25%" headerText="Status">
			   <p:selectOneMenu  value="#{data.recordStatusFlg}" style="width:70px;">
				  <f:selectItem itemValue="0" itemLabel="Inactive" />
			      <f:selectItem itemValue="1" itemLabel="Active" />
			   </p:selectOneMenu>
			</p:column>
			<p:column style="width:15%" headerText="Action">	
			  <p:commandLink>
			    <p:graphicImage library="ep/images/design" name="edit.png"
				  value="/resources/ep/images/design/edit.png" title="Update" />
			  </p:commandLink>		
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn">
		  <p:commandButton value="Add" process="@form" 
		     icon="ui-icon-add" update="itemZoneDt" action="#{panelBackingBean.addPanelZone()}"/>
		  <p:commandButton id="deleteZoneBtn" value="Delete" icon="ui-icon-delete" process="@form"
		     onsuccess="delZoneDlg.show();"/>
	    </div>	
	  </h:panelGroup>
		<p:dialog id="delZoneDlg" widgetVar="delZoneDlg" header="Delete Confirmation" 
		   styleClass="screen-title" resizable="false" modal="true" width="325" height="90">  
           <h:panelGrid columns="3">
             <p:graphicImage library="ep/images/design" name="exclamation.png"
			   value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			   <p:spacer width="10"/>
              <p:inputTextarea value="Are you sure you want to delete this record?" 
                rows="2" cols="48" styleClass="ui-inputtextarea"/>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="Yes" icon="ui-icon-accept" update="itemZoneDt" 
		        process="@form" actionListener="#{panelBackingBean.deletePanelZone()}" onclick="delZoneDlg.hide();"/>
			 <p:commandButton value="No" icon="ui-icon-reject" onclick="delZoneDlg.hide();" type="button" />
		  </div>
        </p:dialog>  
		<p:spacer height="20" />
		<h:panelGroup id="itemSupplier" rendered="#{panelBackingBean.managedBean.selectedPanelZone != null}">
		   <ac:lovPopup />
			<p:dataTable id="itemSupplierDt" var="data"
				value="#{panelBackingBean.managedBean.selectedPanelZone.ctPanelSuppliers}"
				selection="#{panelBackingBean.managedBean.selectedPanelSupplier}" rowKey="#{data}" 
				selectionMode="single" rowIndexVar="index">
				<p:ajax event="rowSelect"/>
				<p:column headerText="Supplier Name">
				   <ac:lov id="loaSupId" lovId="SM_SUPPLIER" headerText="Supplier List"
					   saveObject="panelBackingBean.managedBean.selectedPanelZone.ctPanelSuppliers[#{index}].supplier"
					   value="#{data.supplier.companyName}">
				   </ac:lov>
			   </p:column>
				<p:column headerText="Business Reg. No.">
				</p:column>

				<p:column headerText="MOF No.">
				</p:column>
				<p:column headerText="Address">
				</p:column>
				<p:column headerText="Status">
				</p:column>
			</p:dataTable>
		   <div class="ppRightBtn">
		  <p:commandButton value="Add" process="@form" 
		     icon="ui-icon-add" update="itemSupplierDt" action="#{panelBackingBean.addPanelSupplier()}"/>
		  <p:commandButton id="deleteSupplierBtn" value="Delete" icon="ui-icon-delete" process="@form"/>
	    </div>	
	  </h:panelGroup>
	</p:panel>
	<p:panel header="#{lbl['lbl.ct.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{panelBackingBean.managedBean.circularVer.itemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{panelBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>	
</ui:composition>
