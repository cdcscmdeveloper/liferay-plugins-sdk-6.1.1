<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core" >

	<p:panel id="itemId" header="#{lbl['lbl.ct.pc.panel.item']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="panelItemDt" var="data" rowIndexVar="index" rowKey="#{data}"
			value="#{panelBackingBean.managedBean.circularVer.ctPanelItems}" selectionMode="single"
			selection="#{panelBackingBean.managedBean.selectedPanelItem}" >
			<p:ajax event="rowSelect" update=":form:tabview:supplierItemPnl" />
			<p:columnGroup type="header">
				<p:row>
					<p:column style="width:30px" headerText="#{lbl['lbl.ct.pc.no']}" />
					<p:column style="width:150px" headerText="#{lbl['lbl.ct.pc.item.name']}" />
					<p:column style="width:450px" headerText="Description" />
					<p:column style="width:150px" headerText="Specification" />
					<p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.action']}" />
				</p:row>
			</p:columnGroup>
			<p:column styleClass="column-align-center">
				<h:outputText value="#{index+1}" />
			</p:column>
			<p:column>
				<p:inputText value="#{data.itemName}" style="width:120px;" />
			</p:column>
			<p:column>
				<p:inputText value="#{data.itemDescription}" style="width:200px;" />
			</p:column>
			<p:column>
			</p:column>
			<p:column>
				<p:commandButton title="delete" oncomplete="delItemDlg.show()" partialSubmit="true" process="@this" icon="ui-icon-delete">
					<f:setPropertyActionListener value="#{data}" target="#{panelBackingBean.managedBean.selectedPanelItem}" />
				</p:commandButton>				
			</p:column>			
		</p:dataTable>
		<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delItemDlg"
			closable="true" appendToBody="true" header="Delete Confirmation" >
			<h:panelGrid columns="2" columnClasses="column-align-right-50,column-align-left">
				<p:commandButton value="Yes" icon="ui-icon-accept" update="panelItemDt"
					 action="#{panelBackingBean.deletePanelItem()}" oncomplete="delItemDlg.hide();"   /> 
				<p:commandButton value="No" icon="ui-icon-reject" onclick="delItemDlg.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>	
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add"
				action="#{panelBackingBean.addPanelItem()}" update="panelItemDt" />
		</div>		
		<p:spacer height="20" />
		
		<h:panelGrid id="supplierItemPnl" columnClasses="ppRightBtn" >
			<p:dataTable id="supplierItemDt" var="data" lazy="false" dynamic="true" rowIndexVar="index"
				 value="#{panelBackingBean.managedBean.selectedPanelItem.ctPanelSupplierItems}">		
				<p:columnGroup type="header">
					<p:row>
						<p:column style="width:30px" headerText="#{lbl['lbl.ct.pc.no']}" />
						<p:column style="width:300px" headerText="#{lbl['lbl.ct.pc.item.sname']}" />
						<p:column style="width:300px" headerText="#{lbl['lbl.ct.pc.item.zone']}" />
						<p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.item.action']}" />
					</p:row>
				</p:columnGroup>
				<p:column styleClass="column-align-center">
					<h:outputText value="#{index+1}" />
				</p:column>				
				<p:column>
					<p:selectOneMenu value="#{data.ctPanelSupplier.panelSupplierId}">
						<f:selectItems value="#{panelBackingBean.getStateDropdownValues()}" />
					</p:selectOneMenu>						
				</p:column>
				<p:column>
					<p:selectOneMenu value="#{data.ctPanelZone.panelZoneId}">
						<f:selectItems value="#{panelBackingBean.getStateDropdownValues()}" />
					</p:selectOneMenu>					
				</p:column>
				<p:column styleClass="column-align-center">
					<p:commandButton title="delete" oncomplete="delSupItemDlg.show()" partialSubmit="true" process="@this" icon="ui-icon-delete">
						<f:setPropertyActionListener value="#{data}" target="#{panelBackingBean.managedBean.selectedPanelSupplierItem}" />
					</p:commandButton>					
				</p:column>
			</p:dataTable>			
			<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delSupItemDlg"
				closable="true" appendToBody="true" header="Delete Confirmation" >
				<h:panelGrid columns="2" columnClasses="column-align-right-50,column-align-left">
					<p:commandButton value="Yes" icon="ui-icon-accept" update="supplierItemDt"
						 action="#{panelBackingBean.deletePanelSupplierItem()}" oncomplete="delSupItemDlg.hide();"   /> 
					<p:commandButton value="No" icon="ui-icon-reject" onclick="delSupItemDlg.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>	
			<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add"
				rendered="#{panelBackingBean.managedBean.selectedPanelItem != null}"
				action="#{panelBackingBean.addPanelSupplierItem()}" update="supplierItemDt" />			
		</h:panelGrid>
	</p:panel>
	
</ui:composition>
