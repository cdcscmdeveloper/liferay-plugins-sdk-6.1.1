<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc">
<p:panel id="itemId" header="#{lbl['lbl.ct.panel.item']}" toggleable="true" toggleSpeed="500">
		<div>
		  <h:panelGrid width="100%">
		  <p:dataTable id="panelItemDt" var="panelItemsVar"  value="#{panelBackingBean.managedBean.circularVer.ctPanelItems}" 
		      selectionMode="single" rowKey="#{panelItemsVar}" selection="#{panelBackingBean.managedBean.selectedPanelItems}"
		      rowIndexVar="index" widgetVar="panelItemObj">
		      <ac:paginator for="panelItemDt" />
              <p:ajax event="rowSelect"  listener="#{panelBackingBean.setPanelListner()}" process="@this" 
                  onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  update="@([id$=itemZone],[id$=itemSupplier])"  />	
		      <p:ajax event="rowUnselect" process="@this" 
                  onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  update="@([id$=itemZone],[id$=itemSupplier])" >
                 <f:setPropertyActionListener value="#{null}" target="#{panelBackingBean.managedBean.selectedPanelItems}" />
              </p:ajax>	
		      
		      <p:column style="width:3%;">
		           <p:selectBooleanCheckbox value="#{panelItemsVar.selectedCheckBox}" styleClass="myCustomChekBox"
		           		rendered="#{!panelBackingBean.managedBean.viewContract}">
				       <p:ajax event="change" update=":form:deleteItemBtn,:form:delUpdateButtonId" listener="#{panelBackingBean.selectOneCheckboxSelect}"></p:ajax>
			       </p:selectBooleanCheckbox>
		      </p:column>
			 
			  <p:column style="white-space:normal;width:11%;" styleClass="column-align-center" >
			       <f:facet name="header">
						<h:outputText id="coverageId" value="#{lbl['lbl.ct.panel.coverage']}" styleClass="required"/>
	               		<ac:iconTooltip for="coverageId"   value="#{lbl['lbl.ct.tooltip.panel.coverage']}" />
	               </f:facet>
			       <p:selectOneMenu id="panelCoverage" value="#{panelItemsVar.zoneAllParamterId}" style="width:100%;" 
			       		disabled="#{panelBackingBean.managedBean.viewContract}">
			             <f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.panelCoverageType)}"/>
			             <p:ajax event="change"   listener="#{panelBackingBean.setCtPanelZoneListner(panelItemsVar)}" 
			                 process="@all"   update="panelItemDt,@([id$=itemZone],[id$=itemSupplier],[id$=deleteItemBtn])" /> 
			       </p:selectOneMenu>
	  	      </p:column>
			 
			  <p:column  style="white-space:pre-line;width:11%;" styleClass="column-align-center" >
			      <f:facet name="header">
			         <h:outputText value="#{lbl['lbl.ct.item.category']}" styleClass="required"/>
			      </f:facet>
			      <p:selectOneMenu value="#{panelItemsVar.categoryParameterId}" style="width:100%;"
			      		disabled="#{panelBackingBean.managedBean.viewContract}">
			           <f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.itemCategoryType)}"/>
			           <p:ajax event="change" update="spec" process="@this" listener="#{panelBackingBean.changeItemCategoryListner(panelItemsVar)}" />
			      </p:selectOneMenu>
			  </p:column>
			  
			  <p:column  style="width:15%;" styleClass="column-align-center" >
			     <f:facet name="header">
			        <h:outputText value="#{lbl['lbl.ct.item.group']}" styleClass="required"/>
			     </f:facet>
			     <div  align="left">
			       <ac:lov id="itemGroupLovId" lovId="CT_PANEL_ITEM_GROUP" size="8" headerText="#{lbl['lbl.ct.item.group']}" readonly="true" 
						value="#{panelItemsVar.ctPanelItemGroup.groupName}" conditionField="recordStatus^1" 
						saveObject="panelBackingBean.managedBean.circularVer.ctPanelItems[#{index}].ctPanelItemGroup"
						disabled="#{panelBackingBean.managedBean.viewContract}">
			       </ac:lov>
			       </div>
			   </p:column>
			     <p:column  style="width:11%;white-space:pre-line" styleClass="column-align-center" >
                   <f:facet name="header">
			        <h:outputText value="#{lbl['lbl.ct.item.type']}" styleClass="required"/>
			     </f:facet>
                    <p:selectOneMenu value="#{panelItemsVar.itemType.parameterId}" style="width:100%;"
			      		disabled="#{panelBackingBean.managedBean.viewContract}">
			           <f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.scItemType)}"/>
			    </p:selectOneMenu>
              </p:column>
              <p:column style="width:16%;" styleClass="column-align-center">
                  <f:facet name="header">
			        <h:outputText value="#{lbl['lbl.ct.item.name']}" styleClass="required"/>
			     </f:facet>
                  <p:inputTextarea value="#{panelItemsVar.itemName}" maxlength="100" rows="2" style="width:75px;" autoResize="false"
                  	disabled="#{panelBackingBean.managedBean.viewContract}"/>
                  	<p:spacer width="3" />
                  	<p:commandLink id="spec" update=":form:itemSpecDlg" action="#{panelBackingBean.panelItemSpecDlg(panelItemsVar)}" style="width:35px;"
                  		disabled="#{panelItemsVar.categoryParameterId == null or panelBackingBean.getItemGeneralCode(panelItemsVar.categoryParameterId) == ParameterConst.itemCategoryTypeGeneral}">
						<p:graphicImage value="/css/images/design/ico-viewnedit.png" title="#{lbl['lbl.ct.specification']}"  />
					</p:commandLink>
              </p:column>
			  <p:column styleClass="column-align-center" style="width:12%;">
				  	<f:facet name="header" >
						<h:outputText value="#{lbl['lbl.ct.uom']}" style="float:left;white-space:pre-line" styleClass="required"  />
	               	</f:facet>
			       <ac:lov id="uomLovId" lovId="PM_UOM" size="5" headerText="#{lbl['lbl.ct.uom']}" readonly="true" 
				         value="#{panelItemsVar.pmUom.uomName}" conditionField="recordStatus^1" 
				       saveObject="panelBackingBean.managedBean.circularVer.ctPanelItems[#{index}].pmUom"
				       disabled="#{panelBackingBean.managedBean.viewContract}">
			       </ac:lov>
			   </p:column>
			  
			  <p:column headerText="#{lbl['lbl.ct.min.order.qty']}" style="white-space:pre-line;width:7%;" styleClass="column-align-center" >
			       <p:inputText value="#{panelItemsVar.minimumOrderQty}" style="width:85%;text-align:right;" label="#{lbl['lbl.ct.min.order.qty']}"
			       		maxlength="#{panelItemsVar.pmUom.decimalScale == 0 ? 13 : 14}"
			       		disabled="#{panelBackingBean.managedBean.viewContract}">
			           	<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, panelItemsVar.pmUom.uomCode)}" />
						<p:ajax event="blur" update="@this" />
			       </p:inputText>
			  </p:column>
			 
			  <p:column headerText="#{lbl['lbl.ct.purchase.limit']}" style="white-space:pre-line;width:7%;" styleClass="column-align-center" >
			       <p:inputText value="#{panelItemsVar.maxProcureAmt}" style="width:85%;text-align:right;" label="#{lbl['lbl.ct.purchase.limit']}"
			       		disabled="#{panelBackingBean.managedBean.viewContract}">
			          <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			       </p:inputText>
			  </p:column>
			  <p:column headerText="#{lbl['lbl.ct.status']}" style="width:7%;" styleClass="column-align-center" >
		           <p:selectOneMenu  value="#{panelItemsVar.recordStatusFlg}" 
		           		disabled="#{!panelBackingBean.managedBean.updateAction or panelBackingBean.managedBean.viewContract}" style="width:95%;">
				       <f:selectItem itemValue="0" itemLabel="#{lbl['lbl.ct.inactive']}" />
			           <f:selectItem itemValue="1" itemLabel="#{lbl['lbl.ct.active']}" />
			       </p:selectOneMenu>
			  </p:column>													
		    </p:dataTable>
		    </h:panelGrid>
		 </div>
	  <h:panelGroup id="delUpdateButtonId">
	   <div class="ppRightBtn">
	 	 <ac:lov id="loaBulkSupId" lovId="SM_SUPPLIER"  
	 	                disabled="#{panelBackingBean.managedBean.buttonHideActiveDel}"
						postUpdateListener="panelBackingBean.addBulkPanelSupplier"
						headerText="#{lbl['lbl.ct.supplier']}" 
						buttonLabel="#{lbl['lbl.ct.bulk.update.supplier']}"
						selectionMode="multiple"
						saveObject="panelBackingBean.managedBean.supplierList"
						update=":form:itemSupplierDt" 
						rendered="#{!panelBackingBean.managedBean.viewContract}"/>
		<p:commandButton id="bulkUpdateBtn" value="#{lbl['lbl.ct.bulk.update']}"  process="@this" update="bulkUpdateDlg" 
					     action="#{panelBackingBean.bulkUpdateItem}"  disabled="#{panelBackingBean.managedBean.buttonHideActiveDel}" 
					     rendered="#{!panelBackingBean.managedBean.viewContract}"/>
		<p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" 
		                   update=":form:panelItemDt" action="#{panelBackingBean.addPanelItem()}"
		                   rendered="#{!panelBackingBean.managedBean.viewContract}" oncomplete="panelItemObj.paginator.endLink.click();"/>
		<p:commandButton id="deleteItemBtn" value="#{lbl['lbl.ct.delete']}"   process="@this"
			              onsuccess="delItemDlg.show()" disabled="#{panelBackingBean.managedBean.buttonHideActiveDel}" 
			              rendered="#{!panelBackingBean.managedBean.viewContract}"/>
	 </div>
	  </h:panelGroup>
	    <p:dialog id="bulkUpdateDlg" header="#{lbl['lbl.ct.bulk.update']}" styleClass="pop_up_top"
		    widgetVar="bulkUpdateDlg"  modal="true" width="300" height="120">  
            <h:panelGrid columns="3">
               <f:verbatim></f:verbatim>
              <p:outputLabel  value="#{lbl['lbl.ct.panel.coverage']}"/>
                 <p:selectOneMenu value="#{panelBackingBean.managedBean.panelCoverageId}" style="width:100px;margin-bottom: 5px;">
			        <f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.panelCoverageType)}"/> 
			     </p:selectOneMenu>
			     <f:verbatim></f:verbatim>
			      <p:outputLabel  value="#{lbl['lbl.ct.item.category']}"/>
			     <p:selectOneMenu value="#{panelBackingBean.managedBean.itemCategoryId}" style="width:100px;">
			       <f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.itemCategoryType)}"/>
			     </p:selectOneMenu>
			  </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}"  update="@([id$=panelItemDt])"
		       process="@all" actionListener="#{panelBackingBean.bulkUpdateRow()}" onclick="bulkUpdateDlg.hide();"/>
			 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="bulkUpdateDlg.hide();" type="button" />
		   </div>
        </p:dialog>
        
        <p:confirmDialog id="delItemDlg" widgetVar="delItemDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
		                severity="alert"  closable="true"  appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
		           <div class="ppRightBtn">
				     <p:commandButton value="#{lbl['lbl.btn.yes']}"  update="@([id$=itemId])"
		       process="@all" actionListener="#{panelBackingBean.removeAddRow()}" onclick="delItemDlg.hide();"/>
			 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delItemDlg.hide();" type="button" />
				   </div>
        </p:confirmDialog>
       
        <p:dialog id="itemSpecDlg" widgetVar="itemSpecDlg" header="#{lbl['lbl.ct.item.specification.list']}" 
	   		styleClass="pop_up_top" modal="true" width="700" height="450">
	   		<h:panelGrid columns="1">
	    		<p:outputLabel value="#{lbl['lbl.ct.item.name']}" >: #{panelBackingBean.managedBean.selectedItemForSpec.itemName}</p:outputLabel>
	     	</h:panelGrid>
	     	<p:spacer  height="5"/>
	     	<p:dataTable id="itemSpecDt" var="data" value="#{panelBackingBean.managedBean.selectedItemForSpec.ctPanelItemSpecs}"
				rowKey="#{data}" rowIndexVar="index" selection="#{panelBackingBean.managedBean.selectedPanelItemSpecs}" widgetVar="panelItemSpecObj">
				<ac:paginator for="itemSpecDt" />
				  <p:ajax event="toggleSelect" 
			                listener="#{panelBackingBean.onToggleSelect}" update=":form:itemSpecificDelBtn" />
			                     <p:ajax event="rowSelect"
                                       listener="#{panelBackingBean.onRowSelect}" update=":form:itemSpecificDelBtn" />
			                      <p:ajax event="rowSelectCheckbox" 
			                             listener="#{panelBackingBean.onRowSelect}" update=":form:itemSpecificDelBtn" />
                                  <p:ajax event="rowUnselectCheckbox" 
                                         listener="#{panelBackingBean.onRowUnselect}" update=":form:itemSpecificDelBtn" />
				<p:column selectionMode="multiple" style="width:3%" 
					rendered="#{!panelBackingBean.managedBean.viewContract}"/>
				<p:column headerText="#{lbl['lbl.ct.specification']}" style="width:40%;" styleClass="column-align-center" >
					<p:inputTextarea value="#{data.specification}" maxlength="1000" rows="3" style="width:98%;" autoResize="false"
						disabled="#{panelBackingBean.managedBean.viewContract}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.description']}" style="width:40%;" styleClass="column-align-center" >
					<p:inputTextarea value="#{data.description}" maxlength="1000" rows="3" style="width:98%;" autoResize="false"
						disabled="#{panelBackingBean.managedBean.viewContract}" />
				</p:column>
			</p:dataTable>
			<div class="ppRightBtn"> 
				<p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" partialSubmit="true" 
					action="#{panelBackingBean.addPanelItemSpec()}" update="itemSpecDt" 
					oncomplete="panelItemSpecObj.paginator.endLink.click();" rendered="#{!panelBackingBean.managedBean.viewContract}"/>
				<p:commandButton id="itemSpecificDelBtn" value="#{lbl['lbl.ct.delete']}" process="@this"  partialSubmit="true"
				     disabled="#{panelBackingBean.managedBean.buttonHideActiveDel}" 
				     onsuccess="delPanelItemSpecDlg.show()" rendered="#{!panelBackingBean.managedBean.viewContract}"/>				
				<p:commandButton value="#{lbl['lbl.btn.close']}"  onclick="itemSpecDlg.hide();" />
			</div>
   		</p:dialog>
   		
   		 <p:confirmDialog id="delPanelItemSpecDlg" widgetVar="delPanelItemSpecDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
		                severity="alert"  closable="true"  appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
		           <div class="ppRightBtn">
				     <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:itemSpecDt, :form:itemSpecificDelBtn"
				       process="@this" partialSubmit="true" actionListener="#{panelBackingBean.deletePanelItemSpec()}" oncomplete="delPanelItemSpecDlg.hide();"/>
					 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delPanelItemSpecDlg.hide();" type="button" />
				   </div>
        </p:confirmDialog>
        
		<p:spacer height="40" />
		<p:outputPanel id="itemZone">
		    <h:panelGroup rendered="#{panelBackingBean.managedBean.selectedPanelItems != null and panelBackingBean.managedBean.selectionOfZone}">
		                <p:outputLabel value="#{lbl['lbl.ct.sublabel.panel.coverage']}" style="float:left; font-weight:bold; padding-top:25px;"/>
			            <div style="clear:both" />
			            <table style="width: 100%">
				            <tr>
								<td style="width: 120px;"><p:outputLabel value="#{lbl['lbl.ct.location.level']}" /></td>
								<td><p:selectOneMenu id="locationLevels" style="width:178px;" disabled="#{panelBackingBean.managedBean.viewContract}"
										value="#{panelBackingBean.managedBean.selectedPanelItems.locationLevelId.parameterId}">
										<f:selectItems value="#{panelBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
										<p:ajax event="change" listener="#{panelBackingBean.selectLocation}" process="@this" update=":form:zoneGeneralDataTable"/>
									</p:selectOneMenu>
								</td>
							</tr>
						</table>
		  
				      <p:spacer height="20" />
				     <p:dataTable id="zoneGeneralDataTable" value="#{panelBackingBean.managedBean.selectedPanelItems.ctPanelZones}" 
				                var="panelZoneVar" selectionMode="single" widgetVar="panelZoneObj"
				                selection="#{panelBackingBean.managedBean.selectedPanelZone}" rowKey="#{panelZoneVar}" rowIndexVar="index" >
									    <ac:paginator for="zoneGeneralDataTable" />
									    <p:ajax event="rowSelect" update=":form:itemSupplier, :form:deleteZoneBtn"   listener="#{panelBackingBean.onRowSelect}"
											process="@this"  onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  />
										<p:ajax event="rowUnselect" process="@this"	onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
											update=":form:itemSupplier">
											<f:setPropertyActionListener value="#{null}" target="#{panelBackingBean.managedBean.selectedPanelZone}" />
										</p:ajax>
										<p:column style="width:60%" styleClass="column-align-center" >
				    	                   <f:facet name="header">
				    	                       <h:outputText value="#{lbl['lbl.ct.location']}" styleClass="required"/>
				    	                 </f:facet>
				    	                 <h:outputText value="#{panelZoneVar.name}" style="float:left;"/>	
					                 </p:column>
                    
                                     <p:column headerText="#{lbl['lbl.ct.status']}" style="width:20%" styleClass="column-align-center" >
                                          <p:selectOneMenu  value="#{panelZoneVar.recordStatusFlg}"  
                                               disabled="#{!panelBackingBean.managedBean.updateAction or panelBackingBean.managedBean.viewContract}" style="width:100px;">
				                                 <f:selectItem itemValue="0" itemLabel="#{lbl['lbl.ct.inactive']}" />
			                                    <f:selectItem itemValue="1" itemLabel="#{lbl['lbl.ct.active']}" />
			                             </p:selectOneMenu>
                                    </p:column>
					
					               <p:column headerText="#{lbl['lbl.ct.action']}" style="width:20%" styleClass="column-align-center" >
					                   <p:commandLink
						                   actionListener="#{panelBackingBean.editPanelZoneLocation(panelZoneVar,index)}"
						                   process="@this" update=":form:ZoneGeneral"
					                    	oncomplete="ZoneGeneral.show();">
						                <p:graphicImage value="/css/images/design/ico-viewnedit.png" />
					                 </p:commandLink>
					            </p:column>
			
			         </p:dataTable>
		           
		             <div class="ppRightBtn">
		                 <p:commandButton value="#{lbl['lbl.btn.add']}" process="@this" update="@([id$=zonePopupGeneral])"
					           oncomplete="ZoneGeneral.show();" actionListener="#{panelBackingBean.showGeneralZoneLocationPopup}"
					           rendered="#{!panelBackingBean.managedBean.viewContract}"/>
		                 <p:commandButton id="deleteZoneBtn" value="#{lbl['lbl.ct.delete']}"  process="@this"
		                             disabled="#{panelBackingBean.managedBean.buttonHideActiveDel}"
		                      onsuccess="delZoneDlg.show();" rendered="#{!panelBackingBean.managedBean.viewContract}"/>
	              </div>	
	    
	         <p:confirmDialog id="delZoneDlg" widgetVar="delZoneDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
		                severity="alert"  closable="true"  appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
		           <div class="ppRightBtn">
				     <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:zoneGeneralDataTable,:form:itemSupplier, :form:deleteZoneBtn"
				       process="@all" actionListener="#{panelBackingBean.deletePanelZone()}" onclick="delZoneDlg.hide();"/>
					 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delZoneDlg.hide();" type="button" />
				   </div>
        </p:confirmDialog>
	  </h:panelGroup>
	  <p:dialog id="ZoneGeneral" header="#{lbl['lbl.ct.add.location']}" widgetVar="ZoneGeneral" 
	  	styleClass="pop_up_top" modal="true" width="600" height="500">
	  	 <p:panel id="zonePopupGeneral">
	  	 	<table styleClass="noBorders tr,noBorders td">
				<tr>
					<td width="25%" valign="top"><p:outputLabel value="#{lbl['lbl.ct.zone.name']}" styleClass="required"></p:outputLabel></td>
					<td width="70%"><p:inputText id="zoneName" style="width:300px;" disabled="#{panelBackingBean.managedBean.viewContract}"
							value="#{panelBackingBean.managedBean.zoneName}"  
							label="#{lbl['lbl.ct.zone.name']}"
						    maxlength="20"></p:inputText> 
					</td>
				</tr>
				<tr>
					<td width="25%" valign="top"><p:outputLabel value="#{lbl['lbl.ct.location']}" styleClass="required" /></td>
					<td width="70%">
				
						<div style="height: 370px; overflow-y: scroll;">
							<p:tree id="treeZoneGeneralPopup"
								value="#{panelBackingBean.managedBean.rootZoanlTree}"
								var="location"
								selection="#{panelBackingBean.managedBean.selectedGeneralTreeNodes}"
								selectionMode="checkbox">
								<p:treeNode type="state">
									<h:outputText value="#{location.stateId.stateName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.districtId.districtName}" />
								</p:treeNode>
							</p:tree>
						</div></td>
				</tr>
			</table>
		
		
		<div align="right">
		<p:spacer height="10"/>
		<p:commandButton value="#{lbl['lbl.btn.ok']}"  process="@all"
			update=":form:zonePopupGeneral, :form:itemZone"
			rendered="#{!panelBackingBean.managedBean.viewContract}"
			action="#{panelBackingBean.updateZoneGeneralLocation}">
		</p:commandButton>
		
		<p:commandButton rendered="#{!panelBackingBean.managedBean.viewContract}"
			value="#{lbl['lbl.btn.cancel']}" onclick="ZoneGeneral.hide();"  />
	</div>
	</p:panel>
	   </p:dialog>
       </p:outputPanel>
		<p:spacer height="40" />
		<p:outputPanel id="itemSupplier" >
		<p:outputLabel rendered="#{panelBackingBean.managedBean.selectedPanelItems != null and panelBackingBean.managedBean.selectedPanelZone != null and panelBackingBean.managedBean.selectionOfZone}" value="#{lbl['lbl.ct.sublabel.panel.supplier']}" style="float:left; font-weight:bold; padding-top:25px;"/>
		<p:outputLabel rendered="#{panelBackingBean.managedBean.selectedPanelItems != null and !panelBackingBean.managedBean.selectionOfZone}" value="#{lbl['lbl.ct.sublabel.item.supplier']}" style="float:left; font-weight:bold; padding-top:25px;"/>
		<div style="clear:both" />
		<h:panelGroup rendered="#{(panelBackingBean.managedBean.selectedPanelItems != null and panelBackingBean.managedBean.selectedPanelZone != null and panelBackingBean.managedBean.selectionOfZone) or
		       (panelBackingBean.managedBean.selectedPanelItems != null and !panelBackingBean.managedBean.selectionOfZone)}">
		    	<p:dataTable id="itemSupplierDt" var="supVar" rowIndexVar="index"
			          value="#{panelBackingBean.managedBean.selectionOfZone ? panelBackingBean.managedBean.selectedPanelZone.ctPanelSuppliers : panelBackingBean.managedBean.selectedPanelItems.ctPanelSuppliers}"
		              selection="#{panelBackingBean.managedBean.selectedPanelSuppliers}" rowKey="#{supVar}" >
			          <ac:paginator for="itemSupplierDt" />
			           
				              <p:column  style="width:2%" 
				      	         	 rendered="#{!panelBackingBean.managedBean.viewContract}">
				      		        <f:facet name="header">
							            <p:selectBooleanCheckbox value="#{panelBackingBean.managedBean.selectAll}">
								             <p:ajax partialSubmit="true" process="@this"
									             update=":form:itemSupplierDt,:form:deleteSupplierBtn" listener="#{panelBackingBean.selectAllPanelItem}" />
							            </p:selectBooleanCheckbox>
						          </f:facet>
		           
		                          <p:selectBooleanCheckbox 
		                               value="#{supVar.selectedCheckBox}" styleClass="myCustomChekBox">
		           		               <p:ajax event="change"
		           		                    update=":form:itemSupplierDt,:form:deleteSupplierBtn" listener="#{panelBackingBean.selectSupplierCheckboxSelect}"></p:ajax>
			                     </p:selectBooleanCheckbox>     
				      		</p:column>
