<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="itemId" header="#{lbl['lbl.ct.pc.panel.item']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="panelItemDt" var="data" rowKey="#{data}" lazy="true"
			value="#{panelBackingBean.managedBean.circularVer.ctPanelItems}" selectionMode="single"
			selection="#{panelBackingBean.managedBean.selectedPanelItem}" >
			<ac:paginator for="panelItemDt" />
			<p:ajax event="rowSelect" 
				update=":form:tabview:supplierItemPnl,:form:tabview:itemSpecDlg,:form:tabview:viewSpecBtn,:form:tabview:deleteItemBtn" 
				listener="#{panelBackingBean.selectPanelItemEvent()}" />
			<p:columnGroup type="header">
				<p:row>
					<p:column headerText="#{lbl['lbl.ct.pc.item.name']}" />
					<p:column headerText="Description" />
					<p:column headerText="Min. Order Qty" />
					<p:column headerText="Max. Procure Amount" />
				</p:row>
			</p:columnGroup>
			<p:column>
				<p:inputText value="#{data.itemName}" style="width:150px;" />
			</p:column>
			<p:column>
				<p:inputText value="#{data.itemDescription}" style="width:200px;" />
			</p:column>
			<p:column>
				<p:inputText value="#{data.minimumOrderQty}" style="width:80px;text-align:right;" />
			</p:column>
			<p:column>
				<p:inputText value="#{data.maxProcureAmount}" style="width:80px;text-align:right;" />
			</p:column>			
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn">
			<p:commandButton id="viewSpecBtn" value="View Specification" icon="ui-icon-action" onsuccess="itemSpecDlg.show()"
				disabled="#{panelBackingBean.managedBean.selectedPanelItem == null}" /> 
			<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add"
				update=":form:tabview:deleteItemBtn,:form:tabview:viewSpecBtn,panelItemDt"
				action="#{panelBackingBean.addPanelItem()}" />
			<p:commandButton id="deleteItemBtn" value="Delete" icon="ui-icon-delete" onsuccess="delItemDlg.show()" 
				disabled="#{panelBackingBean.managedBean.selectedPanelItem == null}" />
		</div>		
		<p:dialog id="itemSpecDlg" header="Item Specification" widgetVar="itemSpecDlg" modal="true" width="550" height="350">
			<p:panel id="itemSpec">
				<p:dataTable id="itemSpecDt" var="data" lazy="false" 
					value="#{panelBackingBean.managedBean.selectedPanelItem.ctPanelItemSpecs}" rowIndexVar="index" >
					<ac:paginator for="itemSpecDt" />
					<p:column style="#{(index == 0) ? 'background-color:#dddddd;' : ''}" >
						<h:outputLabel value="No." style="width:0px;float:left;" rendered="#{index == 0}" />
						<h:outputText value="#{index}" rendered="#{index != 0}" />
					</p:column>					
					<p:column style="#{(index == 0) ? 'background-color:#dddddd;' : ''}">
						<p:inputText value="#{data.column1}" style="width:60px;" />
					</p:column>
					<p:column style="#{(index == 0) ? 'background-color:#dddddd;' : ''}">
						<p:inputText value="#{data.column2}" style="width:60px;"  />
					</p:column>
					<p:column style="#{(index == 0) ? 'background-color:#dddddd;' : ''}">
						<p:inputText value="#{data.column3}" style="width:60px;"  />
					</p:column>		
					<p:column style="#{(index == 0) ? 'background-color:#dddddd;' : ''}">
						<p:inputText value="#{data.column4}" style="width:60px;"  />
					</p:column>	
					<p:column style="#{(index == 0) ? 'background-color:#dddddd;' : ''}">
						<p:inputText value="#{data.column5}" style="width:60px;"  />
					</p:column>																									
				</p:dataTable>
				<p:spacer height="2" />
				<div class="ppRightBtn"> 
					<p:commandButton value="Add" process="itemSpecDlg" partialSubmit="true" icon="ui-icon-add"
						action="#{panelBackingBean.addPanelItemSpec()}" update="itemSpecDt" />	
					<p:commandButton value="Delete" process="itemSpecDlg" partialSubmit="true" icon="ui-icon-delete"
						action="#{panelBackingBean.addPanelItemSpec()}" update="itemSpecDt" />												
				</div>				
			</p:panel>
			<f:facet name="footer">
				<p:commandButton value="OK" process="itemSpecDlg" 
					action="#{panelBackingBean.addCancelledCircular()}"
					onclick="itemSpecDlg.hide();" icon="ui-icon-accept" />
				<p:commandButton value="Cancel" icon="ui-icon-cancel" type="button" ajax="false" onclick="itemSpecDlg.hide();" />			
			</f:facet>
		</p:dialog>		
		<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delItemDlg"
			closable="true" appendToBody="true" header="Delete Confirmation" >
			<h:panelGrid columns="2">
				<p:commandButton value="Yes" icon="ui-icon-accept" partialSubmit="true" process="@this"
				 update="panelItemDt,:form:tabview:deleteItemBtn,:form:tabview:viewSpecBtn,:form:tabview:supplierItemPnl" 
				 action="#{panelBackingBean.deletePanelItem()}" onsuccess="delItemDlg.hide();"   /> 
				<p:commandButton value="No" icon="ui-icon-reject" onclick="delItemDlg.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>	
		<p:spacer height="20" />
		
		<h:panelGroup id="supplierItemPnl">
			<p:dataTable id="supplierItemDt" var="data" lazy="true" rowKey="#{data}" rowIndexVar="index"
				value="#{panelBackingBean.managedBean.selectedPanelItem.ctPanelSuppliers}" selectionMode="single"
				selection="#{panelBackingBean.managedBean.selectedPanelSupplier}" >	
				<ac:paginator for="supplierItemDt" />  	
				<p:ajax event="rowSelect" update=":form:tabview:deleteSupplierBtn" />
				<p:columnGroup type="header">
					<p:row>
						<p:column style="width:300px" headerText="#{lbl['lbl.ct.pc.item.sname']}" />
						<p:column style="width:300px" headerText="#{lbl['lbl.ct.pc.item.zone']}" />
					</p:row>
				</p:columnGroup>		
				<p:column>
					<ac:lov id="supplier" lovId="SM_SUPPLIER"
						headerText="Supplier Lov" 
						saveObject="panelBackingBean.managedBean.selectedPanelItem.ctPanelSuppliers[#{index}].supplier"
						value="#{data.supplier.supplierName}"
						conditionField="recordStatus^1" /> 						
				</p:column>
				<p:column>
					<p:selectOneMenu value="#{data.ctPanelZone.objectId}">
						<p:ajax event="change" process="@this" />
						<f:selectItems value="#{panelBackingBean.getPanelZoneDropdown()}" />
					</p:selectOneMenu>					
				</p:column>
			</p:dataTable>		
			<ac:lovPopup />
			<p:spacer height="2" />
			<div class="ppRightBtn">
				<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add"
					disabled="#{panelBackingBean.managedBean.selectedPanelItem == null}"
					action="#{panelBackingBean.addPanelSupplier()}" update="supplierItemDt" />	
				<p:commandButton id="deleteSupplierBtn" value="Delete" icon="ui-icon-delete" onsuccess="delSupItemDlg.show()" 
					disabled="#{panelBackingBean.managedBean.selectedPanelSupplier == null}" />						
			</div>					
			<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delSupItemDlg"
				closable="true" appendToBody="true" header="Delete Confirmation" >
				<h:panelGrid columns="2">
					<p:commandButton value="Yes" icon="ui-icon-accept" partialSubmit="true" process="@this" update=":form:tabview:deleteSupplierBtn,supplierItemDt"
						 action="#{panelBackingBean.deletePanelSupplier()}" oncomplete="delSupItemDlg.hide();"   /> 
					<p:commandButton value="No" icon="ui-icon-reject" onclick="delSupItemDlg.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>	
		</h:panelGroup>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.ct.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{ctBackingBean.managedBean.remarkList}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{ctBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>	
	
</ui:composition>
