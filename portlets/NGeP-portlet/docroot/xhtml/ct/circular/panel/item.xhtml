<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/circular/shared/sidemenu/panel.xhtml" />
	</ui:define>
    <ui:define name="content">
	 <p:panel id="pRightPanel">
			<div class="ppRightBtn">
				<p:commandButton id="ctSave" value="#{lbl['lbl.ct.btn.save']}"/>
				<p:commandButton id="ctSubmit" value="#{lbl['lbl.ct.btn.submit']}"/>
			</div>
		</p:panel>
		  <p:panel id="itemId" header="#{lbl['lbl.ct.pc.panel.item']}"   toggleable="true"  toggleSpeed="500" widgetVar="panelitem">
              <h:panelGrid style="width:800px">
			     <p:dataTable id="dTableItem" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
			        paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			        rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
				    paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
					<p:columnGroup type="header"> 
					   <p:row> 
					       <p:column style="width:30px" headerText="#{lbl['lbl.ct.pc.no']}"  /> 
	                       <p:column style="width:150px" headerText="#{lbl['lbl.ct.pc.item.code']}" /> 
	                       <p:column style="width:450px" headerText="#{lbl['lbl.ct.pc.item.name']}" /> 	 
	                    </p:row>							
					 </p:columnGroup>
					 <p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 	   
				     <p:column> </p:column>
				     <p:column> </p:column>
				  </p:dataTable>
			  </h:panelGrid>
			</p:panel>    
			<p:panel id="supplierId" header="#{lbl['lbl.ct.pc.panel.sd']}"   toggleable="true"  toggleSpeed="500" widgetVar="panelsupplier">
              <h:panelGrid style="width:800px">
			    <p:dataTable id="dTableSupplier" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
			       paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			       rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
			       paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
				   <p:columnGroup type="header"> 
				      <p:row> 
					     <p:column style="width:60px" headerText="#{lbl['lbl.ct.pc.item.sid']}"  /> 
						 <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.item.sname']}" /> 
						 <p:column style="width:60px" headerText="#{lbl['lbl.ct.pc.item.pno']}"  /> 
						 <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.item.zone']}" /> 
						 <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.item.state']}"  /> 
						 <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.item.bname']}"  /> 
						 <p:column style="width:80px" headerText="#{lbl['lbl.ct.pc.item.acno']}" /> 
						 <p:column style="width:60px" headerText="#{lbl['lbl.ct.pc.item.action']}"  /> 
					  </p:row>							
				   </p:columnGroup>
				   <p:column></p:column>
				   <p:column> </p:column>
				   <p:column> </p:column>
				   <p:column>
				   <p:selectOneMenu disabled="false"  value=""  style="width:100px">
            			 <f:selectItem itemLabel="Utara" itemValue="Utara" /> 
            					 <f:selectItem itemLabel="Sabah" itemValue="Sabah" />
                		</p:selectOneMenu>
                   </p:column>
				   <p:column> </p:column>
				   <p:column></p:column>
				   <p:column> </p:column>
				   <p:column styleClass="column-align-center"> <p:commandButton title="delete" onsuccess="confirmation.show()"
					   partialSubmit="true" process="@this"  icon="ui-icon-delete" styleClass="ui-icon-button"/> </p:column>  
                    </p:dataTable>
					</h:panelGrid>
					<h:panelGrid style="width:800px" columnClasses="column-align-right">
					   <p:commandButton value="Add" styleClass="text-align: right;" process="@this" partialSubmit="true" icon="ui-icon-add"  update="dTableSupplier"/>
					</h:panelGrid>
			</p:panel>                
	       <p:confirmDialog message="#{lbl['lbl.ct.dialong.cofirm.message']}"
							closable="true" appendToBody="true" header="#{lbl['lbl.ct.dialong.cofirm.header']}"
							severity="alert" widgetVar="confirmation">
                          	<h:panelGrid columns="2"
								columnClasses="column-align-right-50,column-align-left">
								<p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" 
									update="dTableSupplier" partialSubmit="true" process="@this"
									onclick="confirmation.hide();"/>
								<p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" 
									onclick="confirmation.hide()" type="button" />
							</h:panelGrid>
			</p:confirmDialog>
						
			
  </ui:define>
  </ui:composition>
