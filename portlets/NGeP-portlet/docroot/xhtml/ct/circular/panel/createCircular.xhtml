<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/circular/shared/sidemenu/panel.xhtml" />
	</ui:define>
    <ui:define name="content">
	 <p:panel id="pRightPanel">
			<div class="ppRightBtn">
				<p:commandButton id="ctSave" value="#{lbl['lbl.ct.btn.save']}"/>
				<p:commandButton id="ctSubmit" value="#{lbl['lbl.ct.btn.submit']}"/>
			</div>
		</p:panel>
         <p:panel id="pc" header="#{lbl['lbl.ct.pc.panel.pcd']}"  toggleable="true"  toggleSpeed="500" 
               widgetVar="panelpc">
           <ui:include src="/xhtml/ct/circular/shared/create.xhtml" />
         </p:panel>
         <p:panel id="contactPerson" header="#{lbl['lbl.ct.pc.cpd']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelcontactPerson">
               <p:dataTable id="tablePerson" var="data" value="#{panelBackingBean.managedBean.contractPerson}" widgetVar="dataTableObj" lazy="false" 
               dynamic="true" rowIndexVar="index" paginator="false">
				  <p:columnGroup type="header"> 
					  <p:row> 
						 <p:column style="width:30px;" headerText="#{lbl['lbl.ct.pc.no']}"  /> 
					     <p:column style="width:150px;" headerText="#{lbl['lbl.ct.pc.cperson']}" /> 
						 <p:column style="width:250px;" headerText="#{lbl['lbl.ct.pc.caddress']}" /> 	
						 <p:column style="width:100px;" headerText="#{lbl['lbl.ct.pc.cemail']}"  /> 
					     <p:column style="width:100px;" headerText="#{lbl['lbl.ct.pc.pno']}"  /> 
						 <p:column style="width:60px;" headerText="#{lbl['lbl.ct.pc.action']}"  />   
	                 </p:row>	
				  </p:columnGroup>
				       <p:column styleClass="column-align-center" >
				       <h:outputText value="#{index+1}" /></p:column> 														                   
					    <p:column><p:inputText value="#{data.contractPersonName}" style="width:140px;"/></p:column>	
					  <p:column> <p:inputText value="#{data.contractAddress}"  style="width:240px;"/> </p:column>
				      <p:column><p:inputText value="#{data.contractEmail}" style="width:90px;"/></p:column>	
				      <p:column><p:inputText value="#{data.contractPhone}" style="width:90px;"/></p:column>	
					  <p:column styleClass="column-align-center">
					  <p:commandButton title="delete" onsuccess="confirmation.show()"
									partialSubmit="true" process="@this" icon="ui-icon-delete">
					    <f:setPropertyActionListener value="#{data}" target="#{panelBackingBean.managedBean.deleteContractPerson}" />
					  </p:commandButton>
					  </p:column> 
				 </p:dataTable>
				 <p:confirmDialog message="Do you want to delete the record?"
						closable="true" appendToBody="true" header="Delete Confirmation" severity="alert" widgetVar="confirmation">
                        <h:panelGrid columns="2" columnClasses="column-align-right-50,column-align-left">
						   <p:commandButton value="Yes" icon="ui-icon-accept" update="tablePerson" partialSubmit="true" process="@this"
									onclick="confirmation.hide();" actionListener="#{panelBackingBean.deletePersonList()}" />
								<p:commandButton value="No" icon="ui-icon-reject" onclick="confirmation.hide()" type="button" />
						</h:panelGrid>
				 </p:confirmDialog>
			     <h:panelGrid style="width:790px" columnClasses="column-align-right">
				      <p:commandButton value="Add" process="@this" partialSubmit="true" action="#{panelBackingBean.addNewPerson()}"
				  icon="ui-icon-add"  update="tablePerson"/>
			     </h:panelGrid>
           </p:panel>
             <p:panel id="addLoa" header="LOA Detials"  toggleable="true"  toggleSpeed="500" widgetVar="panelLoa">
                 <p:dataTable id="tableLoa" var="data" value="" widgetVar="dataTableObj" lazy="false" dynamic="true" rowIndexVar="index">
					<p:columnGroup type="header"> 
					   <p:row> 
						  <p:column style="width:30px" headerText="No"  /> 
						  <p:column style="width:80px" headerText="LOA Number" /> 
						  <p:column style="width:150px" headerText="LOA Name" /> 	
						  <p:column style="width:100px" headerText="LOA Date"  /> 
					      <p:column style="width:70px" headerText="Action"  /> 
				 	   </p:row>	
					  </p:columnGroup>
					   <p:column styleClass="column-align-center"> <h:outputText value="#{index+1}"/></p:column> 							
					   <p:column> </p:column>
					   <p:column></p:column>	
					   <p:column> </p:column>
					   <p:column styleClass="column-align-center">
					   <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
					      icon="ui-icon-delete"/>
				       </p:column> 
					</p:dataTable>
				<h:panelGrid style="width:790px" columnClasses="column-align-right">
							<p:commandButton value="Add" process="@this" partialSubmit="true" icon="ui-icon-add"  
							onclick="dlg2.show();"/>
				</h:panelGrid>
            </p:panel>
            <p:dialog id="modalDialog"  header="Add LOA" widgetVar="dlg2" modal="true" width="550" height="350">
		   <p:panel  id="loa">
              <h:panelGrid columns="5">
				<p:outputLabel  value="LOA Name" />
            	<p:inputText value ="" size="15"/>
				<p:outputLabel  value="LOA No" />
            	<p:inputText value="" size="15"/>
            	 <p:commandButton title="Search" value="Search" partialSubmit="true" process="@this"/>
			 </h:panelGrid>
             <p:dataTable id="popupLoa" var="data" value="#{panelBackingBean.loaLists}" rowIndexVar="index" widgetVar="dataTableObj"
                lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true"  emptyMessage="No Records!" rows="10" 
                rowsPerPageTemplate="5,10,15,20"  selection="#{agencyDetailsBean.selectedAgencyList}" rowKey="#{data.loaNo}"
                currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "   paginatorTemplate="{CurrentPageReport}
                {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
                <p:column selectionMode="multiple" style="width:18px" />
			        <p:column headerText="No.">
						<h:outputText value="#{index+1}" />
					</p:column>
                    <p:column headerText="LOA No">
					</p:column>
                    <p:column headerText="LOA Name" >
					</p:column>
			 </p:dataTable>
             <f:facet name="footer">
			  <h:panelGrid columns="2"  style="height: 40px;vertical-align: middle;">
				<p:commandButton value="Select"   process="modalDialog" update="tableLoa" onclick="dlg2.hide();"/>
                <p:commandButton value="Cancel"  type="button" ajax="false" onclick="dlg2.hide();" />
			  </h:panelGrid>
			</f:facet>
           </p:panel>
	       </p:dialog>
           <p:panel id="concelCircular" header="#{lbl['lbl.ct.pc.panel.ccfl']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelconcelCircular">
                 <p:dataTable id="dTableCancel" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true"  rowIndexVar="index"
			        paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			        rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
					paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
					{LastPageLink} {RowsPerPageDropdown}">
					<p:columnGroup type="header"> 
					   <p:row> 
						  <p:column style="width:30px" headerText="#{lbl['lbl.ct.pc.no']}"  /> 
						  <p:column style="width:80px" headerText="#{lbl['lbl.ct.pc.cno']}" /> 
						  <p:column style="width:150px" headerText="#{lbl['lbl.ct.pc.cname']}" /> 	
						  <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.frno']}"  /> 
					      <p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.coverage']}"  /> 
					      <p:column style="width:70px" headerText="#{lbl['lbl.ct.pc.csdate']}"  />  
					      <p:column style="width:70px" headerText="#{lbl['lbl.ct.pc.cedate']}"  /> 
						  <p:column style="width:60px" headerText="#{lbl['lbl.ct.pc.action']}"  />    
					   </p:row>	
					  </p:columnGroup>
					   <p:column styleClass="column-align-center"> <h:outputText value="#{index+1}"/></p:column> 							
					   <p:column> </p:column>
					   <p:column></p:column>	
					   <p:column> </p:column>
					   <p:column></p:column>	
					   <p:column></p:column>	
					   <p:column> </p:column>
					   <p:column styleClass="column-align-center">
					   <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
					      icon="ui-icon-delete"/>
				       </p:column> 
					</p:dataTable>
				<h:panelGrid style="width:790px" columnClasses="column-align-right">
							<p:commandButton value="Add" process="@this" partialSubmit="true" icon="ui-icon-add"  
							onclick="dlg3.show();"/>
				</h:panelGrid>
            </p:panel>
            <p:dialog id="modalDialog1"  header="Add LOA" widgetVar="dlg3" modal="true" width="550" height="350">
		   <p:panel  id="circular">
              <h:panelGrid columns="5">
				<p:outputLabel  value="Circular Name" />
            	<p:inputText value ="" size="15"/>
				<p:outputLabel  value="Circular No" />
            	<p:inputText value="" size="15"/>
            	 <p:commandButton title="Search" value="Search" partialSubmit="true" process="@this"/>
			 </h:panelGrid>
             <p:dataTable id="popupCircular" var="data" value="#{panelBackingBean.loaLists}" rowIndexVar="index" widgetVar="dataTableObj"
                lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true"  emptyMessage="No Records!" rows="10" 
                rowsPerPageTemplate="5,10,15,20"  selection="#{agencyDetailsBean.selectedAgencyList}" rowKey="#{data.loaNo}"
                currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "   paginatorTemplate="{CurrentPageReport}
                {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
                <p:column selectionMode="multiple" style="width:18px" />
			        <p:column headerText="No.">
						<h:outputText value="#{index+1}" />
					</p:column>
                    <p:column headerText="Circular No">
					</p:column>
                    <p:column headerText="Circular Name" >
					</p:column>
			 </p:dataTable>
             <f:facet name="footer">
			  <h:panelGrid columns="2"  style="height: 40px;vertical-align: middle;">
				<p:commandButton value="Select"   process="modalDialog1" update="dTableCancel" onclick="dlg3.hide();"/>
                <p:commandButton value="Cancel"  type="button" ajax="false" onclick="dlg3.hide();" />
			  </h:panelGrid>
			</f:facet>
           </p:panel>
	       </p:dialog>
		</ui:define>
</ui:composition>
