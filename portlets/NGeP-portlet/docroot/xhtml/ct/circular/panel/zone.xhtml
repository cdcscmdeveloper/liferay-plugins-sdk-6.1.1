<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core" >

	<p:panel id="zonePnl" header="#{lbl['lbl.ct.pc.panel.zone']}" toggleable="true" toggleSpeed="500" >
		<p:dataTable id="panelZoneDt" var="data" rowKey="#{data}" rowIndexVar="index" 
			value="#{panelBackingBean.managedBean.circularVer.ctPanelZones}" selectionMode="single" 
			selection="#{panelBackingBean.managedBean.selectedPanelZone}" >
			<p:ajax event="rowSelect" update=":form:tabview:panelStatePnl" />
			<p:columnGroup type="header">
				<p:row>
					<p:column style="width:30px" headerText="#{lbl['lbl.ct.pc.no']}" />
					<p:column style="width:600px" headerText="#{lbl['lbl.ct.pc.zone.name']}" />
					<p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.action']}" />
				</p:row>
			</p:columnGroup>
			<p:column styleClass="column-align-center">
				<h:outputText value="#{index+1}" />
			</p:column>
			<p:column>
				<p:inputText value="#{data.name}" style="width:120px;" />
			</p:column>
			<p:column styleClass="column-align-center">
				<p:commandButton title="delete" oncomplete="delZoneDlg.show()" partialSubmit="true" process="@this" icon="ui-icon-delete">
					<f:setPropertyActionListener value="#{data}" target="#{panelBackingBean.managedBean.selectedPanelZone}" />
				</p:commandButton>				
			</p:column>
		</p:dataTable>
		<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delZoneDlg"
			closable="true" appendToBody="true" header="Delete Confirmation" >
			<h:panelGrid columns="2" columnClasses="column-align-right-50,column-align-left">
				<p:commandButton value="Yes" icon="ui-icon-accept" update="panelZoneDt"
					 action="#{panelBackingBean.deletePanelZone()}" oncomplete="delZoneDlg.hide();"   /> 
				<p:commandButton value="No" icon="ui-icon-reject" onclick="delZoneDlg.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>	
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="Add" partialSubmit="false" icon="ui-icon-add"
				action="#{panelBackingBean.addPanelZone()}" update="panelZoneDt" />
		</div>
		
		<p:spacer height="20" />
		
		<h:panelGrid id="panelStatePnl" columnClasses="ppRightBtn" >
			<p:dataTable id="panelStateDt" var="data" lazy="false" dynamic="true" rowIndexVar="index"
				 value="#{panelBackingBean.managedBean.selectedPanelZone.ctPanelStates}">
				<p:columnGroup type="header">
					<p:row>
						<p:column style="width:30px" headerText="#{lbl['lbl.ct.pc.no']}" />
						<p:column style="width:600px" headerText="State" />
						<p:column style="width:100px" headerText="#{lbl['lbl.ct.pc.action']}" />
					</p:row>
				</p:columnGroup>
				<p:column styleClass="column-align-center">
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column>
					<p:selectOneMenu value="#{data.state.stateId}">
						<f:selectItems value="#{panelBackingBean.getStateDropdownValues()}" />
					</p:selectOneMenu>			
				</p:column>
				<p:column styleClass="column-align-center">
					<p:commandButton title="delete" oncomplete="delStateDlg.show()" partialSubmit="true" process="@this" icon="ui-icon-delete">
						<f:setPropertyActionListener value="#{data}" target="#{panelBackingBean.managedBean.selectedPanelState}" />
					</p:commandButton>			
				</p:column>			
			</p:dataTable>
			<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delStateDlg"
				closable="true" appendToBody="true" header="Delete Confirmation" >
				<h:panelGrid columns="2" columnClasses="column-align-right-50,column-align-left">
					<p:commandButton value="Yes" icon="ui-icon-accept" update="panelStateDt"
						 action="#{panelBackingBean.deletePanelState()}" oncomplete="delStateDlg.hide();"   /> 
					<p:commandButton value="No" icon="ui-icon-reject" onclick="delStateDlg.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>	
			<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add"
				rendered="#{panelBackingBean.managedBean.selectedPanelZone != null}"
				action="#{panelBackingBean.addPanelState()}" update="panelStateDt" />
		</h:panelGrid>
	</p:panel>
	
</ui:composition>
