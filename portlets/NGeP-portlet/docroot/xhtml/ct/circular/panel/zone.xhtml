<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<p:panel id="zonePnl" header="#{lbl['lbl.ct.panel.zone']}" toggleable="true" toggleSpeed="500" >
		<p:dataTable id="circularZoneDt" var="data" rowKey="#{data}"
			value="#{panelBackingBean.managedBean.circularVer.ctCircularZones}" selectionMode="single" 
			selection="#{panelBackingBean.managedBean.selectedCircularZone}" >
			<ac:paginator for="circularZoneDt" />
			<p:ajax event="rowSelect" update=":form:tabview:circularZoneDtlPnl,:form:tabview:deleteZoneBtn" 
				listener="#{panelBackingBean.selectZoneEvent()}" />
			<p:columnGroup type="header">
				<p:row>
					<p:column style="width:600px" headerText="#{lbl['lbl.ct.zone.name']}" />
				</p:row>
			</p:columnGroup>
			<p:column>
				<p:inputText value="#{data.name}" style="width:200px;" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="false" icon="ui-icon-add"
				action="#{panelBackingBean.addCircularZone()}" update="circularZoneDt" />
			<p:commandButton id="deleteZoneBtn" value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" onsuccess="delZoneDlg.show()" 
				disabled="#{panelBackingBean.managedBean.selectedCircularZone == null}" />				
		</div>		
		<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delZoneDlg"
			closable="true" appendToBody="true" >
			<h:panelGrid columns="2">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:tabview:deleteZoneBtn,:form:tabview:circularZoneDtlPnl,circularZoneDt" partialSubmit="true" process="@this"
					 action="#{panelBackingBean.deleteCircularZone()}" oncomplete="delZoneDlg.hide();"   /> 
				<p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="delZoneDlg.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>	
		
		<p:spacer height="20" />
		
		<h:panelGroup id="circularZoneDtlPnl">
			<p:dataTable id="circularZoneDtlDt" var="data" rowKey="#{data}" rowIndexVar="index"
				value="#{panelBackingBean.managedBean.selectedCircularZone.ctCircularZoneDtls}" selectionMode="single" 
				selection="#{panelBackingBean.managedBean.selectedCircularZoneDtl}" >
				<ac:paginator for="circularZoneDtlDt" />
				<p:ajax event="rowSelect" update=":form:tabview:deleteZoneDtlBtn" />
				<p:columnGroup type="header">
					<p:row>
						<p:column style="width:600px" headerText="#{lbl['lbl.ct.location']}" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<p:selectOneMenu value="#{data.state.stateId}" rendered="#{panelBackingBean.managedBean.circularVer.zonalLevel.parameterCode == ParameterConst.locationLevelState}">
						<p:ajax event="change" process="@this" />
						<f:selectItems value="#{panelBackingBean.getStateDropdownValues()}" />
					</p:selectOneMenu>			
					<ac:lov id="district" lovId="PM_DISTRICT" rendered="#{panelBackingBean.managedBean.circularVer.zonalLevel.parameterCode == ParameterConst.locationLevelDistrict}"
						headerText="#{lbl['lbl.ct.district']}" 
						saveObject="panelBackingBean.managedBean.selectedCircularZone.ctCircularZoneDtls[#{index}].district"
						value="#{data.district.districtName}"
						conditionField="recordStatus^1" /> 					
				</p:column>
			</p:dataTable>
			
			<p:spacer height="2" />
			<div class="ppRightBtn"> 
				<p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" partialSubmit="true" icon="ui-icon-add"
					disabled="#{panelBackingBean.managedBean.selectedCircularZone == null}"
					action="#{panelBackingBean.addCircularZoneDtl()}" update="circularZoneDtlDt" />	
				<p:commandButton id="deleteZoneDtlBtn" value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" onsuccess="delStateDlg.show()" 
					disabled="#{panelBackingBean.managedBean.selectedCircularZoneDtl == null}" />			
			</div>							
			<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delStateDlg"
				closable="true" appendToBody="true" >
				<h:panelGrid columns="2">
					<p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:tabview:deleteZoneDtlBtn,circularZoneDtlDt" partialSubmit="true" process="@this"
						 action="#{panelBackingBean.deleteCircularZoneDtl()}" oncomplete="delStateDlg.hide();"   /> 
					<p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="delStateDlg.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>	
		</h:panelGroup>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{panelBackingBean.managedBean.circularVer.zoneRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{panelBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
