<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info, warning" />
		<p:panel id="searchPanel" header="Search" toggleable="true">
			<h:panelGrid columns="4" style="width:100%">
				<h:outputLabel value="#{lbl['lbl.ct.pc.cno']}" />
				<p:inputText value="#{panelBackingBean.managedBean.searchCircularNo}" style="width:170px;" maxlength="50" />
				<h:outputLabel value="#{lbl['lbl.ct.pc.cname']}" />
				<p:inputText value="#{panelBackingBean.managedBean.searchCircularName}" style="width:170px;" maxlength="200" />
				<h:outputLabel value="#{lbl['lbl.ct.pc.item.sname']}" />
				<p:inputText value="#{panelBackingBean.managedBean.searchSupplierName}" style="width:170px;" maxlength="100" />
				<h:outputLabel value="#{lbl['lbl.ct.pc.frno']}" />
				<p:inputText value="#{panelBackingBean.managedBean.searchFileRefNo}" style="width:170px;" maxlength="50" />
				<h:outputLabel value="#{lbl['lbl.ct.cc.cstartdt']}" />
				<p:calendar style="width:150px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" readonlyInput="true"
					value="#{panelBackingBean.managedBean.searchStartDate}" id="popupButtonCal" showOn="button" />
				<h:outputLabel value="#{lbl['lbl.ct.cc.cenddt']}" />
				<p:calendar style="width:150px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" readonlyInput="true"
					value="#{panelBackingBean.managedBean.searchEndDate}" id="popupButtonCal1" showOn="button" />
				<h:outputLabel value="#{lbl['lbl.ct.pc.item.name']}" />
				<p:inputText value="#{panelBackingBean.managedBean.searchItemName}" style="width:170px;margin-top:3px;" maxlength="100" />						
				<p:outputLabel for="status" value="#{lbl['lbl.ct.status']}" />
				<p:selectOneMenu id="status" value="#{panelBackingBean.managedBean.searchStatusId}" style="width:200px;">
					<f:selectItems value="#{panelBackingBean.getStatusDropdown()}" />
				</p:selectOneMenu>
			</h:panelGrid>		
			<div class="ppRightBtn"> 
				<p:commandButton value="#{lbl['lbl.ct.search.btn.search']}" action="#{panelBackingBean.searchCircularVer}" icon="ui-icon-search" update="circularVerDt" />
				<p:commandButton value="#{lbl['lbl.ct.search.btn.reset']}" action="#{panelBackingBean.searchReset}" icon="ui-icon-reset" update=":form" />
			</div>		
		</p:panel>
		<p:panel id="resultPanel" header="Result" toggleable="true">
			<p:dataTable id="circularVerDt" value="#{panelBackingBean.circularVerPagingDataModel}"
				var="data" lazy="true" rowIndexVar="index" >
				<ac:paginator for="circularVerDt" />
				<p:column headerText="#{lbl['lbl.ct.cc.cnumber']}" >
					<h:outputText value="#{data.circularNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.pc.cname']}" >
					<h:outputText value="#{data.name}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.pc.frno']}" >
					<h:outputText value="#{data.circularFileRefNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.cc.cstartdt']}" >
					<h:outputText value="#{data.startDate}" >
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.cc.cenddt']}" >
					<h:outputText value="#{data.endDate}" >
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.status']}" >
					<h:outputText value="#{(data.status.statusId eq 0)? lbl['lbl.ct.pc.status.cancelled'] : panelBackingBean.getStatusDescById(data.status.statusId)}" />
				</p:column>				
				<p:column headerText="#{lbl['lbl.ct.action']}" styleClass="column-align-center">
					<p:commandLink rendered="#{data.status.statusId == CtStatusConst.pqPendingSubmission}"
							onclick="gotoPage([{name:'action',value:'save'},{name:'circularVerId',value:'#{data.circularVerId}'}])">
					 <p:graphicImage library="ep/images/design" name="edit.png" value="/css/images/design/edit.png" title="Update" />
					</p:commandLink>
					<p:commandLink rendered="#{data.status.statusId == CtStatusConst.pqApproved or 
						(data.status.statusId == CtStatusConst.pqRejected and data.ctCircular.latestCircularVer != null)}" 
						onclick="gotoPage([{name:'action',value:'update'},{name:'circularVerId',value:'#{data.circularVerId}'}])">
					 <p:graphicImage library="ep/images/design" name="edit.png" value="/css/images/design/edit.png" title="Update" />
					</p:commandLink>
					<p:spacer width="5" rendered="#{!(data.status.statusId == CtStatusConst.pqPendingSubmission) or
						data.status.statusId == CtStatusConst.pqApproved or 
						(data.status.statusId == CtStatusConst.pqRejected and data.ctCircular.latestCircularVer != null)}" />	
					<p:commandLink rendered="#{!(data.status.statusId == CtStatusConst.pqPendingSubmission)}"
					onclick="gotoPage([{name:'action',value:'view'},{name:'circularVerId',value:'#{data.circularVerId}'}])">
					 <p:graphicImage library="ep/images/design" name="document.png" value="/css/images/design/document.png" title="View" />
					</p:commandLink>	
						<!-- 
						<p:spacer width="1" />
						<p:commandButton title="Cancel" icon="ui-icon-cancel" 
							onclick="gotoPage([{name:'action',value:'cancel'},{name:'circularVerId',value:'#{data.circularVerId}'}])"  />
						 -->		
				</p:column>
			</p:dataTable>		
			<p:remoteCommand name="gotoPage" action="#{panelBackingBean.gotoPage}" />
		</p:panel>
	</ui:define>
</ui:composition>
