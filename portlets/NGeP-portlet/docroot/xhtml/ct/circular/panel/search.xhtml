<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<ui:define name="contentSection">
		<script> $('#portlet_ctPanelCircularMaintenance_WAR_NGePportlet').find('.portlet-title-text').html('#{panelBackingBean.getMaintenancePortletTitle()}'); </script>
	    <p:blockUI widgetVar="blkPanelSearchTable"  block=":form" trigger="panelSearchId">  
			  <p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>  
		 </p:blockUI> 	
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info, warning" />
		<p:panel id="searchPanel" header="#{lbl['lbl.btn.search']}" toggleable="true">
			<h:panelGrid columns="4" style="width:100%">
				<h:outputLabel value="#{lbl['lbl.ct.circular.no']}" />
				<p:inputText value="#{panelBackingBean.managedBean.searchCircularNo}" style="width:170px;" maxlength="17" />
				<h:outputLabel value="#{lbl['lbl.ct.circular.name']}" />
				<p:inputText value="#{panelBackingBean.managedBean.searchCircularName}" style="width:170px;" maxlength="200" />
				<h:outputLabel value="#{lbl['lbl.ct.supplier.name']}" />
				<p:inputText value="#{panelBackingBean.managedBean.searchSupplierName}" style="width:170px;" maxlength="100" />
				<h:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" />
				<p:inputText value="#{panelBackingBean.managedBean.searchPhysicalCircularNo}" style="width:170px;" maxlength="60" />
				<h:outputLabel value="#{lbl['lbl.ct.circular.start.date']}" />
				<p:calendar style="width:150px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" readonlyInput="true"
					navigator="true" value="#{panelBackingBean.managedBean.searchStartDate}" id="popupButtonCal" showOn="button" />
				<h:outputLabel value="#{lbl['lbl.ct.circular.end.date']}" />
				<p:calendar style="width:150px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" readonlyInput="true"
					navigator="true" value="#{panelBackingBean.managedBean.searchEndDate}" id="popupButtonCal1" showOn="button" />
				<h:outputLabel value="#{lbl['lbl.ct.item.name']}" />
				<p:inputText value="#{panelBackingBean.managedBean.searchItemName}" style="width:170px;margin-top:3px;" maxlength="100" />						
				<p:outputLabel for="status" value="#{lbl['lbl.ct.status']}" />
				<p:selectOneMenu id="status" value="#{panelBackingBean.managedBean.searchStatusId}" style="width:200px;">
					<f:selectItems value="#{panelBackingBean.getStatusDropdown()}" />
				</p:selectOneMenu>
			</h:panelGrid>		
			<div class="ppRightBtn"> 
				<p:commandButton id="panelSearchId" value="#{lbl['lbl.btn.search']}" action="#{panelBackingBean.searchCircularVer}"
				    onstart="blkPanelSearchTable.show();" oncomplete="blkPanelSearchTable.hide();"   update="circularVerDt" />
				<p:commandButton value="#{lbl['lbl.ct.reset']}" action="#{panelBackingBean.searchReset}" update=":form" />
			</div>		
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.ct.search.result']}" toggleable="true">
			<p:dataTable id="circularVerDt" value="#{panelBackingBean.managedBean.circularVerPagingDataModel}"
				var="data" lazy="true" rowIndexVar="index" rows="10">
				<ac:paginator for="circularVerDt" />
				<p:column headerText="#{lbl['lbl.ct.circular.no']}"  style="width:15%;white-space:normal;">
					<h:outputText value="#{data.ctCircular.circularNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.physical.circular.no']}"  style="width:15%;white-space:normal;">
					<h:outputText value="#{data.circularNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.name']}"  style="width:25%;white-space:normal;">
					<h:outputText value="#{data.name}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.start.date']}"  style="width:10%;white-space:normal;">
					<h:outputText value="#{data.startDate}" >
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.end.date']}"  style="width:10%;white-space:normal;">
					<h:outputText value="#{data.endDate}" >
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.status']}"  style="width:15%;white-space:normal;">
					<h:outputText value="#{(data.status.statusId eq 0)? lbl['lbl.ct.cancelled'] : panelBackingBean.getStatusDescById(data.status.statusId)}" />
				</p:column>				
				<p:column headerText="#{lbl['lbl.ct.action']}" styleClass="column-align-center"  style="width:10%;white-space:normal;">
					<p:commandLink rendered="#{data.status.statusId == CtStatusConst.pqApproved or 
						((data.status.statusId == CtStatusConst.pqRejected or data.status.statusId == CtStatusConst.pqCancelled) and data.ctCircular.latestCircularVer != null)}" 
						onclick="gotoPage([{name:'action',value:'update'},{name:'circularVerId',value:'#{data.circularVerId}'}])">
					 <p:graphicImage value="/css/images/design/ico-edit.png" title="#{lbl['lbl.ct.update']}" />
					</p:commandLink>
					<p:spacer width="5" />	
					<p:commandLink onclick="gotoPage([{name:'action',value:'view'},{name:'circularVerId',value:'#{data.circularVerId}'}])">
					 <p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.ct.view']}" />
					</p:commandLink>		
				</p:column>
			</p:dataTable>		
			<p:remoteCommand name="gotoPage" action="#{panelBackingBean.gotoPage}" />
		</p:panel>
	</ui:define>
</ui:composition>
