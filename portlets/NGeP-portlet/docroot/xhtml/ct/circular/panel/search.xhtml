<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
		<p:panel id="searchPanel" header="Search" toggleable="true">
			<h:panelGrid columns="4" style="width:100%">
				<h:outputLabel value="Circular No." />
				<p:inputText value="#{panelBackingBean.managedBean.searchCircularNo}" style="width:200px;" />
				<h:outputLabel value="Circular Name" />
				<p:inputText value="#{panelBackingBean.managedBean.searchCircularName}" style="width:200px;" />
				<h:outputLabel value="Supplier Name" />
				<p:inputText value="#{panelBackingBean.managedBean.searchSupplierName}" style="width:200px;" />
				<h:outputLabel value="File Reference No." />
				<p:inputText value="#{panelBackingBean.managedBean.searchFileRefNo}" style="width:200px;" />
				<h:outputLabel value="Item Name" />
				<p:inputText value="#{panelBackingBean.managedBean.searchItemName}" style="width:200px;" />
				<p:outputLabel value="Update Type" />
				<p:selectOneMenu value="#{panelBackingBean.managedBean.searchUpdateType}">
					<f:selectItems value="#{panelBackingBean.getDropdownValues(ParameterTypeConst.circularUpdateType)}" />
				</p:selectOneMenu>								
				<h:outputLabel value="Circular Start Date" />
				<p:calendar style="width:150px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
					value="#{panelBackingBean.managedBean.searchStartDate}" id="popupButtonCal" showOn="button" />
				<h:outputLabel value="Circular End Date" />
				<p:calendar style="width:150px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
					value="#{panelBackingBean.managedBean.searchEndDate}" id="popupButtonCal1" showOn="button" />
				<p:outputLabel for="status" value="Status" />
				<p:selectOneMenu id="status" value="#{panelBackingBean.managedBean.searchStatusId}" style="width:200px;">
					<f:selectItems value="#{panelBackingBean.getStatusDropdown()}" />
				</p:selectOneMenu>				
				<f:verbatim></f:verbatim>
				<f:verbatim></f:verbatim>
				<f:verbatim></f:verbatim>
			</h:panelGrid>		
			<div class="ppRightBtn"> 
				<p:commandButton value="Search" action="#{panelBackingBean.searchCircularVer}" icon="ui-icon-search" update="circularVerDt" />
			</div>		
		</p:panel>
		<p:panel id="resultPanel" header="Result" toggleable="true">
			<p:dataTable id="circularVerDt" value="#{panelBackingBean.circularVerPagingDataModel}"
				var="data" lazy="true" rowIndexVar="index" >
				<ac:paginator for="circularVerDt" />
				<p:columnGroup type="header">
					<p:row>
						<p:column colspan="1" headerText="Circular Number" />
						<p:column colspan="1" headerText="Circular Name" />
						<p:column colspan="1" headerText="Circular Type" />
						<p:column colspan="1" headerText="Update No" />
						<p:column colspan="1" headerText="Status" />
						<p:column colspan="1" headerText="Circular Start Date" />
						<p:column colspan="1" headerText="Circular End Date" />
						<p:column colspan="1" headerText="Action" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText value="#{data.circularNo}" />
				</p:column>
				<p:column>
					<h:outputText value="#{data.name}" />
				</p:column>
				<p:column>
					<h:outputText rendered="#{data.updateType != null}" 
						value="#{panelBackingBean.getParameterDesc(data.updateType)}" />
				</p:column>
				<p:column>
					<h:outputText value="#{data.updateNo}" />
				</p:column>
				<p:column>
					<h:outputText value="#{data.status.pmStatusDescs[0].statusName}" />
				</p:column>
				<p:column>
					<h:outputText value="#{data.startDate}" >
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText value="#{data.endDate}" >
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
				<p:column styleClass="column-align-center">
				<p:commandLink rendered="#{data.status.statusId==CtStatusConst.approved}"
						onclick="gotoPage([{name:'action',value:'update'},{name:'circularVerId',value:'#{data.circularVerId}'}])">
				 <p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Update" />
				</p:commandLink>
				<p:spacer width="5" />	
				<p:commandLink onclick="gotoPage([{name:'action',value:'view'},{name:'circularVerId',value:'#{data.circularVerId}'}])">
				 <p:graphicImage library="ep/images/design" name="document.png" value="/resources/ep/images/design/document.png" title="View" />
				</p:commandLink>	
					<!-- 
					<p:spacer width="1" />
					<p:commandButton title="Cancel" icon="ui-icon-cancel" 
						onclick="gotoPage([{name:'action',value:'cancel'},{name:'circularVerId',value:'#{data.circularVerId}'}])"  />
					 -->		
				</p:column>
			</p:dataTable>		
			<p:remoteCommand name="gotoPage" action="#{panelBackingBean.gotoPage}" />
		</p:panel>
	</ui:define>
</ui:composition>
