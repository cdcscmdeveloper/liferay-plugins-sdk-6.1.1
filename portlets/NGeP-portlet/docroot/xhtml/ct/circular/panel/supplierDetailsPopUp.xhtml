<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:dialog id="suppDtlPopUp" widgetVar="suppDtlWidgetVar" modal="true"
		styleClass="pop_up_top" header="#{lbl['lbl.sc.supplier.details']}" 
		width="500" height="530">
		
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
			columnClasses="columnWidth50">
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.ep.no']}" />
			</h:column>
			<h:column>
				<p:inputText size="30"
					value="#{panelBackingBean.managedBean.smSupplier.epNo}"
					readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" style=" margin-bottom:5px;"
					value="#{panelBackingBean.managedBean.ctPanelSupplier.supplierCompanyName}"
					readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.registration.type']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" value="" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.registration.no']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" style=" margin-bottom:5px;"
					value="#{panelBackingBean.managedBean.ctPanelSupplier.supplierRegNo}"
					readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.mof.no']}" />
			</h:column>
			<h:column>
				<p:inputText size="30"
					value="#{panelBackingBean.managedBean.ctPanelSupplier.supplierMofNo}"
					readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.income.tax.ref.no']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" style="margin-bottom:5px;" 
					value="#{panelBackingBean.managedBean.smCompanyBasic.incomeTaxNo}" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.establishment.date']}" />
			</h:column>
			<h:column>
				<p:inputText size="30"
					value="#{panelBackingBean.managedBean.smSupplier.establishDate}"
					readonly="true">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</p:inputText>
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.type.of.company']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" style=" margin-bottom:5px;"
					value="#{panelBackingBean.managedBean.smSupplier.businessType}"
					readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.mof.expired.date']}" />
			</h:column>
			<h:column>
				<p:inputText size="30"
					value="#{panelBackingBean.managedBean.smMofAccount.expDate}"
					readonly="true">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</p:inputText>				
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.disciplinary.rating']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" style=" margin-bottom:5px;" value="" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.branch']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" value="#{panelBackingBean.managedBean.supplierBranch}" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.address']}" />
			</h:column>
			<h:column>
				<p:inputTextarea cols="30" value="#{panelBackingBean.getFullAddress(panelBackingBean.managedBean.ctPanelSupplier.supplierAddress)}" 
					style=" margin-bottom:5px;" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.contact.person']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" value="#{panelBackingBean.managedBean.ctPanelSupplier.supplierAddress.contactPerson}" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.designation']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" value="#{panelBackingBean.managedBean.smPersonnel.designation}" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.email']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" value="#{panelBackingBean.managedBean.ctPanelSupplier.supplierAddress.contactEmail}" readonly="true" />
			</h:column>
		</h:panelGrid>

		<p:spacer height="10" />
		<div class="ppRightBtn">
     		<p:commandButton value="#{lbl['lbl.btn.close']}" 
				onclick="suppDtlWidgetVar.hide();" />
  		 </div>		
	</p:dialog>	
</ui:composition>
