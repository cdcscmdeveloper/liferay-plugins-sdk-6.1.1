<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions" 
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="cancelCcrPnl" header="Circular(s) to be cancel" toggleable="true" toggleSpeed="500" >
		<p:selectOneMenu value="#{panelBackingBean.managedBean.circularDocType}" 
			disabled="#{fn:length(panelBackingBean.managedBean.cancelCircularReq.ctCancelCircularList) > 0}" 
			rendered="#{!panelBackingBean.isBPKApprover()}" >
			<f:selectItems value="#{panelBackingBean.getCircularDocTypeValues()}" />
			<p:ajax event="change" update="@([id$=cancelCircularList])"/>
		</p:selectOneMenu>		
		<p:spacer height="10" />
		<p:outputPanel id="cancelCircularList">
		<p:dataTable id="cancelCcrDt" var="data" lazy="true" rowKey="#{data}"
			value="#{panelBackingBean.managedBean.cancelCircularReq.ctCancelCircularList}"
			selection="#{panelBackingBean.managedBean.selectedCancelledCircularList}" >
			<ac:paginator for="cancelCcrDt" />
			<p:column selectionMode="multiple" style="width:3%" />
			<p:column headerText="#{lbl['lbl.ct.pc.cno']}" >
				<h:outputText value="#{data.circularVer.circularNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.pc.cname']}" >
				<h:outputText value="#{data.circularVer.name}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="Add" icon="ui-icon-add" actionListener="#{panelBackingBean.searchActiveCircularVer}" update="circularVerDt" oncomplete="activeCircularDlg.show();" >
					<f:setPropertyActionListener
						value="#{panelBackingBean.managedBean.circularDocType == ContractConst.circularDocTypePanel ? CtStatusConst.pqApproved : CtStatusConst.cqApproved}"
						target="#{panelBackingBean.managedBean.searchStatusId}" />
				</p:commandButton>
			<p:commandButton value="Delete" process="@this" partialSubmit="true" icon="ui-icon-delete" onclick="delCancelCircular.show()"/>				
		</div>				
		</p:outputPanel>	
		<p:dialog id="activeCircularDlg" header="Active Circulars" widgetVar="activeCircularDlg" modal="true" width="700" height="350">
			<p:panel id="circular">
				<p:dataTable id="circularVerDt" var="data" lazy="true" rowKey="#{data.circularVerId}" 
					selection="#{panelBackingBean.managedBean.selectedCircularVerList}"
					value="#{panelBackingBean.managedBean.circularVerList}" >
					<ac:paginator for="circularVerDt" />
					<p:column selectionMode="multiple" style="width:3%" />
					<p:column headerText="Circular No.">
						<h:outputText value="#{data.circularNo}" />
					</p:column>
					<p:column headerText="Circular Name">
						<h:outputText value="#{data.name}" />
					</p:column>									
				</p:dataTable>
				<f:facet name="footer">
					<div class="ppRightBtn"> 
						<p:commandButton value="Select" process="@form" action="#{panelBackingBean.selectActiveCirculars()}"
							update="cancelCcrDt cancelCcrPnl" onclick="activeCircularDlg.hide();" />
						<p:commandButton value="Cancel" type="button" ajax="false" onclick="activeCircularDlg.hide();" />
					</div>
				</f:facet>
			</p:panel>
		</p:dialog>	
		 <p:dialog id="delCancelCircular" widgetVar="delCancelCircular" 
		   header="Delete Confirmation" styleClass="screen-title" resizable="false" modal="true" width="350" height="95">  
           <h:panelGrid columns="3">
               <p:graphicImage library="ep/images/design" name="exclamation.png"
			      value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			      <p:spacer width="10"/>
                  <p:inputTextarea rows="2" styleClass="ui-inputtextarea"
                     cols="48" value="Are you sure you want to delete this record?"/>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton icon="ui-icon-accept" update=":form:cancelCcrDt,:form:cancelCcrPnl" process="@all"
		        value="Yes" actionListener="#{panelBackingBean.deleteCancelReqCircular()}" onclick="delCancelCircular.hide();"/>
			 <p:commandButton value="No" icon="ui-icon-reject" onclick="delCancelCircular.hide();" type="button" />
		  </div>
        </p:dialog>  		
	</p:panel>
		
</ui:composition>
