<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<ui:define name="contentSection">
		<script>
			$('#portlet_ctCcCircular_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{centralContractBackingBean.getPortletTitle()}');
		</script>
		<style>
.confirmation-message-box {
	border: 1px solid #cecece;
	font-family: Arial;
	font-size: 12px;
	cursor: default;
	padding: 10px;
}

.columnWidth180 {
	width: 150px;
	vertical-align: top;
}

.columnWidth200 {
	width: 260px;
	vertical-align: top;
}

.columnWidth300 {
	width: 290px;
	vertical-align: top;
}

 .top-aligned-columns td { 
         vertical-align: top;
      }    
         .column-align-center {
         text-align: center !important;
      }
</style>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<c:if test="#{!centralContractBackingBean.managedBean.fromCircularNotice}">
			<ac:title value="#{centralContractBackingBean.getParameterDesc(ParameterTypeConst.documentTypes, ParameterConst.doctypeCentralContractCircular)}" />
		</c:if>
		<p:messages id="messages" showSummary="false" escape="false"
			showDetail="false" rendered="#{!centralContractBackingBean.managedBean.viewContract}" />
     <f:event listener="#{centralContractBackingBean.preRenderView}" type="preRenderView" />
       <table style="width: 100%;">
		<tr>
			<td> <p:commandButton value="#{lbl['lbl.btn.back']}"
					        immediate="true" action="#{centralContractBackingBean.backAction}" />
			</td>
			</tr>
		</table>
		
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu"
						activeIndex="#{centralContractBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.panel.central.contract.circular']}" update="@form">
							<f:setPropertyActionListener
								target="#{centralContractBackingBean.managedBean.selectedTabIndex}" value="0" />
						</p:menuitem>
						<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.contract']}" update="@form">
							<f:setPropertyActionListener
								target="#{centralContractBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
					</p:tabMenu></td>
				<td width="80%"><p:outputPanel
						rendered="#{centralContractBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="/xhtml/ct/circular/centralcontract/createCircular.xhtml" />
						</p:outputPanel> <p:outputPanel
						rendered="#{centralContractBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="/xhtml/ct/circular/centralcontract/contract.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
