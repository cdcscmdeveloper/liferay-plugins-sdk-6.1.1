<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<p:panel id="ccc" header="#{lbl['lbl.ct.panel.central.contract.circular']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="4" columnClasses="columnWidth200,columnWidth200,columnWidth180,columnWidth300">
			 
			     <p:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" />
				 <p:inputTextarea id="circularNoUpTxt" style="width:170px; margin-top:2px;margin-bottom:2px" rows="5"
					 disabled="true" value="#{centralContractBackingBean.managedBean.circularVer.circularNo}"   autoResize="false"/>
				   
				  <p:outputLabel  value="#{lbl['lbl.ct.circular.central.name']}" />
				  <p:inputTextarea id="circularNameUpTxt" rows="5" style="width:230px;" 
				       disabled="true" autoResize="false" value="#{centralContractBackingBean.managedBean.circularVer.name}" />
						    
			      <h:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
				  <p:inputText  style="width:170px;"  disabled="true"
						value="#{centralContractBackingBean.managedBean.circularVer.circularFileRefNo}" />
						
			      <p:outputLabel value="#{lbl['lbl.ct.start.date']}" />
		          <p:inputText  id="popupButtonCal3" style="width:115px;" disabled="true"
		              value="#{centralContractBackingBean.managedBean.circularVer.startDate}">
				    <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
				
				  <p:outputLabel value="#{lbl['lbl.ct.extension.period']}" />
		           <h:panelGrid columns="2">
		           <p:inputText id="extendPeriod"  style="text-align:right;width:65px;" 
		           	  disabled="true" value="#{centralContractBackingBean.managedBean.circularVer.extendPeriod}"/>
		           <p:outputLabel value="#{lbl['lbl.ct.months']}"/>
		        </h:panelGrid>
		        
				<h:outputLabel value="#{lbl['lbl.ct.end.date']}" />
		        <p:inputText id="popupButtonCal4" style="width:115px;" disabled="true"
		            value="#{centralContractBackingBean.managedBean.circularVer.endDate}" >
				        <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				 </p:inputText>
				
			
		        <p:outputLabel value="#{lbl['lbl.ct.extension.start.date']}" /> 
		         <p:inputText  id="popupButtonCal5" style="width:115px;" disabled="true"
		             value="#{centralContractBackingBean.managedBean.circularVer.extendStartDate}">
			              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
			     </p:inputText>
		      
		        <p:outputLabel value="#{lbl['lbl.ct.extension.end.date']}" />
		       <p:inputText id="popupButtonCal6"  style="width:115px;" disabled="true"
		           value="#{centralContractBackingBean.managedBean.circularVer.extendEndDate}">
			              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
			    </p:inputText>
		   </h:panelGrid>
		  
		   <h:panelGrid columns="2">
		       <h:panelGrid  class="columnWidth200">
			  	  <p:outputLabel value="#{lbl['lbl.ct.circular.letter']}" />
			   </h:panelGrid>
		       <h:commandLink  action="#{centralContractBackingBean.downloadFile(1)}" rendered="#{centralContractBackingBean.managedBean.circularVer.circularFileName != null}"
		          styleClass="blue_font" value="#{centralContractBackingBean.managedBean.circularVer.circularFileName}"  />
		        <h:outputText rendered="#{centralContractBackingBean.managedBean.circularVer.circularFileName == null}" value="#{lbl['lbl.txt.na']}" />  
			</h:panelGrid>
	     </p:panel>
	
	     
	     <p:panel id="contactPerson" toggleable="true" toggleSpeed="500" 
	          header="#{lbl['lbl.ct.panel.contact.person']}" widgetVar="panelcontactPerson">
		    
		      <p:dataTable id="contactPersonDt" var="contactPersonsVar" 
		          value="#{centralContractBackingBean.managedBean.circularVer.ctContactPersons}">
			      <ac:paginator for="contactPersonDt" />
			      <p:column headerText="#{lbl['lbl.ct.contact.person.name']}"
			           style="width:20%;white-space:normal;"  styleClass="column-align-center" >
				       <h:outputText id="cperson" value="#{contactPersonsVar.name}"  style="float:left;"  />
			       </p:column>
			       <p:column headerText="#{lbl['lbl.ct.address']}" 
			            style="width:40%;white-space:normal;" styleClass="column-align-center" >
				        <h:outputText value="#{contactPersonsVar.address}" style="float:left;"  />
			       </p:column>
		      	    <p:column headerText="#{lbl['lbl.ct.email']}" 
		      	       style="width:20%;white-space:normal;" styleClass="column-align-center" >
				       <h:outputText id="validateEmail" value="#{contactPersonsVar.email}"  style="float:left;"  />
			        </p:column>
		         	<p:column headerText="#{lbl['lbl.ct.tel']}" 
		         	     style="width:15%;white-space:normal;" styleClass="column-align-center" >
				        <h:outputText id="validPhone"   value="#{contactPersonsVar.phoneNo}" style="float:left;"   />
			        </p:column>
		      </p:dataTable>
		         <p:spacer height="2" />
		     </p:panel>
	
	        <p:panel id="exemptedOrgPnl" header="#{lbl['lbl.ct.panel.exempted.ministry']}" toggleable="true" toggleSpeed="500">
		       <p:dataTable id="exemptedOrgDt" var="exemptedOrgsVar" 
		           value="#{centralContractBackingBean.managedBean.circularVer.ctExemptedOrgs}">
			         <ac:paginator for="exemptedOrgDt" />
			            <p:column headerText="#{lbl['lbl.ct.panel.exempted.org.type']}" style="width:30%;">
			            	#{centralContractBackingBean.getParameterDesc(ParameterTypeConst.organisationTypes, exemptedOrgsVar.orgTypeCode)}
			            </p:column>			         
			           <p:column headerText="#{lbl['lbl.ct.ministry']}">
				             #{exemptedOrgsVar.orgProfile.orgName}
			           </p:column>
		        </p:dataTable>
	       </p:panel>
	
	       <p:panel id="cancelCircularPnl" 
	            header="#{lbl['lbl.ct.panel.related.cancelled.circular']}" toggleable="true" toggleSpeed="500">
		        <p:dataTable id="cancelCircularDt" var="cancelCircularVar"
			         value="#{centralContractBackingBean.managedBean.circularVer.ctCancelCircularList}">
			         <ac:paginator for="cancelCircularDt" />
			         <p:column headerText="#{lbl['lbl.ct.physical.circular.no']}" styleClass="column-align-center" >
			              <h:outputText value="#{cancelCircularVar.circularVer.circularNo}"  style="float:left;" />
			         </p:column>
			         <p:column headerText="#{lbl['lbl.ct.circular.name']}"  styleClass="column-align-center" >
				          <h:outputText value="#{cancelCircularVar.circularVer.name}" style="float:left;"  />
			         </p:column>
		        </p:dataTable>
		     <p:spacer height="2" />
	    </p:panel>
</ui:composition>
