<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<ui:define name="contentSection">
	    <p:blockUI widgetVar="blkPanelSearchTable"  block=":form" trigger="panelSearchId">  
			  <p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>  
		 </p:blockUI> 	
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info, warning" />
		<p:panel id="searchPanel" header="#{lbl['lbl.btn.search']}" toggleable="true">
			<h:panelGrid columns="4" style="width:100%">
				<h:outputLabel value="#{lbl['lbl.ct.circular.name']}" />
				<p:inputText value="#{circularBackingBean.managedBean.searchCircularName}" style="width:170px;" maxlength="500" />
				<h:outputLabel value="#{lbl['lbl.ct.circular.no']}" />
				<p:inputText value="#{circularBackingBean.managedBean.searchCircularNo}" style="width:170px;" maxlength="17" />
				<h:outputLabel value="#{lbl['lbl.ct.circular.type']}" />
				<p:selectOneMenu value="#{circularBackingBean.managedBean.searchCircularDocType}" >
					<f:selectItems value="#{circularBackingBean.getCircularDocTypeValues()}" />
				</p:selectOneMenu>
				<h:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" />
				<p:inputText value="#{circularBackingBean.managedBean.searchPhysicalCircularNo}" style="width:170px;" maxlength="60" />
				<h:outputLabel value="#{lbl['lbl.ct.status']}" />
				<p:selectOneMenu value="#{circularBackingBean.managedBean.searchStatus}" >
					<f:selectItems value="#{circularBackingBean.getCircularStatusValues()}" />
				</p:selectOneMenu>
			</h:panelGrid>		
			<div class="ppRightBtn"> 
				<p:commandButton id="panelSearchId" value="#{lbl['lbl.btn.search']}" action="#{circularBackingBean.searchCircularListing}"
				    onstart="blkPanelSearchTable.show();" oncomplete="blkPanelSearchTable.hide();"   update="circularVerDt" />
				<p:commandButton value="#{lbl['lbl.ct.reset']}" action="#{circularBackingBean.searchReset}"  update=":form" />
			</div>		
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.ct.search.result']}" toggleable="true">
			<p:dataTable id="circularVerDt" value="#{circularBackingBean.managedBean.circularListingPagingDataModel}"
				var="data" lazy="true" rows="10" rowIndexVar="index" >
				<ac:paginator for="circularVerDt" />
				<p:column headerText="#{lbl['lbl.ct.circular.type']}"  style="width:13%;white-space:normal;" styleClass="column-align-center">
					<div align="left">
					    <h:outputText value="#{circularBackingBean.getParameterDesc(ParameterTypeConst.documentTypes, data.docType)}"  />
				     </div>
				</p:column>				
				<p:column headerText="#{lbl['lbl.ct.circular.no']}"  style="width:12%;white-space:normal;" styleClass="column-align-center">
					<h:outputText value="#{data.ctCircular.circularNo}" style="float:left;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.physical.circular.no']}"  style="width:12%;white-space:normal;" styleClass="column-align-center">
					 <div align="left">
					   <h:outputText value="#{data.circularNo}"  /></div>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.name']}"  style="width:50%;white-space:normal;" styleClass="column-align-center">
				   <div align="left">	
					   <h:commandLink value="#{data.name}"
						    styleClass="blue_font"
						    action="#{circularBackingBean.gotoViewPage(data.circularVerId, data.docType)}" /></div>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.update.as.of']}"  style="width:10%;white-space:normal;" styleClass="column-align-center">
					<h:outputText value="#{data.changedDate}" style="float:left;"  >
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.status']}"  style="width:5%;white-space:normal;" styleClass="column-align-center">
					<h:outputText value="#{circularBackingBean.getParameterDesc(ParameterTypeConst.recordStatus, data.ctCircular.recordStatusFlg)}" style="float:left;"  />
				</p:column>								
			</p:dataTable>		
		</p:panel>
	</ui:define>
</ui:composition>
