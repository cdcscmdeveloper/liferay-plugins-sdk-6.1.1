<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc">
<p:panel id="itemId" header="#{lbl['lbl.ct.panel.item']}" toggleable="true" toggleSpeed="500">
	 <h:panelGrid style="width:100%">
		  <p:dataTable id="panelItemDt" var="panelItemsVar" rowKey="#{panelItemsVar}"
		      value="#{panelBackingBean.managedBean.circularVer.ctPanelItems}"   selectionMode="single"
		        selection="#{panelBackingBean.managedBean.selectedPanelItems}"  rowIndexVar="index" widgetVar="panelItemObj">
		      <ac:paginator for="panelItemDt" />
              <p:ajax event="rowSelect"   
                   update=":form:itemId"  process="@this" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"   />	
		  
			  <p:column headerText="#{lbl['lbl.ct.panel.coverage']}" style="white-space:pre-line;width:6%;" styleClass="column-align-center" >
			        <h:outputText value="#{panelBackingBean.getParameterDesc(panelItemsVar.panelCoverageId)}" style="float:left;" />
			   </p:column>
			 
			  <p:column headerText="#{lbl['lbl.ct.item.category']}" style="white-space:pre-line;width:6%" styleClass="column-align-center" >
			         <h:outputText value="#{panelBackingBean.getParameterDesc(panelItemsVar.itemCategoryId)}" style="float:left;"  />
		      </p:column>
		      
		      <p:column headerText="#{lbl['lbl.ct.item.group']}" style="white-space:pre-line;width:10%" styleClass="column-align-center" >
			         <h:outputText value="#{panelItemsVar.ctPanelItemGroup.groupName}" style="float:left;" />
		      </p:column>
		 	
              <p:column headerText="#{lbl['lbl.ct.item.name']}" style="width:15%;" styleClass="column-align-center" >
                  <p:inputTextarea value="#{panelItemsVar.itemName}" maxlength="100" rows="2" cols="15" style="float:left;"  autoResize="false" disabled="true"/>
                  <p:spacer width="5" />
   	   			  <p:commandLink id="spec" update=":form:itemSpecDlg" action="#{panelBackingBean.panelItemSpecDlg(panelItemsVar)}" 
             		disabled="#{panelItemsVar.itemCategoryId == null or panelBackingBean.getItemGeneralCode(panelItemsVar.itemCategoryId.parameterId) == ParameterConst.itemCategoryTypeGeneral}">
					<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.ct.specification']}" />
				  </p:commandLink>
              </p:column>
              
               <p:column style="width:10%;" headerText="#{lbl['lbl.ct.item.type']}"  styleClass="column-align-center" >
				    <p:outputLabel style="float:left;" value="#{panelBackingBean.getParameterDesc(panelItemsVar.itemType)}" />
			   </p:column>
			
			  <p:column headerText="#{lbl['lbl.ct.uom']}" style="white-space:pre-line; width:6%;" styleClass="column-align-center"  >
			 		<h:outputText value="#{panelItemsVar.pmUom.uomName}" style="float:left;"   />
		      </p:column>
			  
			  <p:column headerText="#{lbl['lbl.ct.min.order.qty']}" style="white-space:pre-line;width:8%;" styleClass="column-align-center" >
			       <h:outputText value="#{panelItemsVar.minimumOrderQty}"  style="float:left;" >
			           	<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, panelItemsVar.pmUom.uomCode)}" />
			       </h:outputText>
			  </p:column>
			 
			  <p:column headerText="#{lbl['lbl.ct.purchase.limit']}" style="white-space:pre-line;width:7%;" styleClass="column-align-center" >
			       <h:outputText value="#{panelItemsVar.maxProcureAmt}" style="text-align:right;">
			          <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			       </h:outputText>
			  </p:column>
			  
			  <p:column styleClass="column-align-center"  style="white-space:normal;width:2%;">
			  	<f:facet name="header">
					<h:outputText value="#{lbl['lbl.ct.dn']}"/>
               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.direct.nego']}"/>
               	</f:facet>
			    <p:selectBooleanCheckbox value="#{panelItemsVar.directNego}" disabled="true"/>
			  </p:column>		
			  	
			  <p:column styleClass="column-align-center"  style="white-space:normal;width:2%;">
			  	<f:facet name="header">
					<h:outputText value="#{lbl['lbl.ct.dp']}"/>
               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.direct.purchase']}"/>
               	</f:facet>
			  	<p:selectBooleanCheckbox value="#{panelItemsVar.directPurchase}" disabled="true"/>
			  </p:column>	
			  
			  <p:column styleClass="column-align-center"  style="white-space:normal;width:2%;">
			    <f:facet name="header">
					<h:outputText value="#{lbl['lbl.ct.qt']}"/>
               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.quotation.tender']}"/>
               	</f:facet>   
			  	<p:selectBooleanCheckbox value="#{panelItemsVar.qt}" disabled="true"/>
			  </p:column>
			  
			  <p:column headerText="#{lbl['lbl.ct.status']}" style="width:6%;" styleClass="column-align-center" >
		           <h:outputText  value="#{panelItemsVar.recordStatusFlg == 1 ? 'active' : 'inactive'}" style="float:left;"   />
			  </p:column>												
		    </p:dataTable>
		    <p:dialog id="itemSpecDlg" widgetVar="itemSpecDlg" header="#{lbl['lbl.ct.item.specification.list']}" 
	   			styleClass="pop_up_top" modal="true" width="700" height="450">
		   		<h:panelGrid columns="1">
		    		<p:outputLabel value="#{lbl['lbl.ct.item.name']}" >: #{panelBackingBean.managedBean.selectedItemForSpec.itemName}</p:outputLabel>
		     	</h:panelGrid>
		     	<p:spacer  height="5"/>
		     	<p:dataTable id="itemSpecDt" var="data" value="#{panelBackingBean.managedBean.selectedItemForSpec.ctPanelItemSpecs}" rowIndexVar="index">
					<ac:paginator for="itemSpecDt" />
					<p:column headerText="#{lbl['lbl.ct.specification']}" style="width:45%; white-space:normal">
						<p:inputTextarea value="#{data.specification}" maxlength="200" rows="3" style="width:98%;" autoResize="false"
							disabled="true" />
					</p:column>	
					<p:column headerText="#{lbl['lbl.ct.description']}" style="width:45%; white-space:normal">
						<p:inputTextarea value="#{data.description}" maxlength="200" rows="3" style="width:98%;" autoResize="false"
							disabled="true" />
					</p:column>	
				</p:dataTable>
				<div class="ppRightBtn"> 
					<p:commandButton value="#{lbl['lbl.btn.close']}"  onclick="itemSpecDlg.hide();" />
				</div>	
	   		</p:dialog>
	 </h:panelGrid>
		
		<p:spacer height="2" />
		
		<p:outputPanel id="itemZone">
		    <h:panelGroup rendered="#{panelBackingBean.managedBean.selectedPanelItems.panelCoverageId.parameterCode == ParameterConst.circularPanelCoverageZone}">
		     <p:outputLabel value="#{lbl['lbl.ct.sublabel.panel.coverage']}" style="float:left; font-weight:bold; padding-top:25px;"/>
			 <div style="clear:both" />
			 <table style="width: 100%">
				<tr>
					<td style="width: 120px;"><p:outputLabel value="Location Level" /></td>
					<td><p:outputLabel  style="float:left"
							value="#{panelBackingBean.getParameterDesc(panelBackingBean.managedBean.selectedPanelItems.locationLevelId)}"/>
			   	</td>
				</tr>
			</table>
		  
		      <p:spacer height="20" />
		     <p:dataTable id="zoneGeneralDataTable" value="#{panelBackingBean.managedBean.selectedPanelItems.ctPanelZones}" 
		        var="panelZoneVar" selectionMode="single" widgetVar="panelZoneObj"
		        selection="#{panelBackingBean.managedBean.selectedPanelZone}" rowKey="#{panelZoneVar}" rowIndexVar="index" >
			    <ac:paginator for="zoneGeneralDataTable" />
			    <p:ajax event="rowSelect" update=":form:itemSupplier"   process="@this" 
			            onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  />	
					<p:column headerText="#{lbl['lbl.ct.location']}" style="width:60%" styleClass="column-align-center" >
				    	 <h:outputText value="#{panelZoneVar.name}" style="float:left;"/>	
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.status']}" style="width:20%" styleClass="column-align-center" >
                         <h:outputText  value="#{panelZoneVar.recordStatusFlg == 1 ? 'Active' : 'Inactive'}"  style="float:left;" />
                    </p:column>
					<p:column headerText="#{lbl['lbl.ct.action']}" style="width:20%" styleClass="column-align-center" >
					  <p:commandLink
						actionListener="#{panelBackingBean.editPanelZoneLocation(panelZoneVar,index)}"
						process="@this" update="@([id$=zonePopupGeneral])"
						oncomplete="ZoneGeneral.show();">
						<p:graphicImage value="/css/images/design/ico-view.png" />
					  </p:commandLink>
					</p:column>
			</p:dataTable>
	  </h:panelGroup>
	  <p:dialog header="#{lbl['lbl.ct.add.location']}" widgetVar="ZoneGeneral" 
	  	styleClass="pop_up_top" modal="true" width="600" height="500">
		<p:panel id="zonePopupGeneral">
			<table styleClass="noBorders tr,noBorders td">
				<tr>
					<td width="25%" valign="top"><p:outputLabel value="#{lbl['lbl.ct.zone.name']}"></p:outputLabel></td>
					<td width="70%"><p:inputText id="zoneName" style="width:300px;" disabled="true"
							value="#{panelBackingBean.managedBean.zoneName}"  label="#{lbl['lbl.ct.zone.name']}"></p:inputText>
					</td>
				</tr>
				<tr>
					<td width="25%" valign="top"><p:outputLabel value="#{lbl['lbl.ct.location']}" /></td>
					<td width="70%">
				
						<div style="height: 370px; overflow-y: scroll;">
							<p:tree id="treeZoneGeneralPopup"
								value="#{panelBackingBean.managedBean.rootZoanlTree}"
								var="location" 
								selection="#{panelBackingBean.managedBean.selectedGeneralTreeNodes}"
								selectionMode="checkbox" >
								<p:treeNode type="state">
									<h:outputText value="#{location.stateId.stateName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.districtId.districtName}" />
								</p:treeNode>
							</p:tree>
						</div></td>
				</tr>
			</table>
		</p:panel>
		<p:spacer height="10"/>
		<p:commandButton value="#{lbl['lbl.btn.cancel']}" style="float:right;" onclick="ZoneGeneral.hide();"  />
		</p:dialog>
       </p:outputPanel>
		<p:spacer height="40" />
		<p:outputPanel id="itemSupplier">
		<h:panelGroup rendered="#{(panelBackingBean.managedBean.selectedPanelZone != null and panelBackingBean.managedBean.selectedPanelItems.panelCoverageId.parameterCode == ParameterConst.circularPanelCoverageZone) or
		       (panelBackingBean.managedBean.selectedPanelItems != null and panelBackingBean.managedBean.selectedPanelItems.panelCoverageId.parameterCode == ParameterConst.circularPanelCoverageAll)}">
		    	<p:outputLabel value="#{lbl['lbl.ct.sublabel.item.supplier']}" style="float:left; font-weight:bold; padding-top:25px;"/>
	         <div style="clear:both" />
	         	<p:dataTable id="itemSupplierDt" var="supVar" rowIndexVar="index"
			          value="#{panelBackingBean.managedBean.selectedPanelItems.panelCoverageId.parameterCode == ParameterConst.circularPanelCoverageZone ? panelBackingBean.managedBean.selectedPanelZone.ctPanelSuppliers : panelBackingBean.managedBean.selectedPanelItems.ctPanelSuppliers}"
		              selection="#{panelBackingBean.managedBean.selectedPanelSuppliers}" rowKey="#{supVar}" >
			          <ac:paginator for="itemSupplierDt" />
				  
				      <p:column headerText="#{lbl['lbl.ct.supplier.name']}" style="width:27%;white-space:normal;" styleClass="column-align-center" >
				          <div align="left">
				           <p:commandLink update="@([id$=suppDtlPopUp])" 
								action="#{panelBackingBean.showSupplierDetails(supVar.supplier)}"
								oncomplete="suppDtlWidgetVar.show();">
								<h:outputText value="#{supVar.supplier.companyName}" />
							</p:commandLink> </div>
			          </p:column>
				
				      <p:column headerText="#{lbl['lbl.ct.business.reg.no']}"  style="width:10%;" styleClass="column-align-center" > 
				          <h:outputText value="#{supVar.supplier.regNo}" style="float:left;"/>
				      </p:column>
				     
				      <p:column headerText="#{lbl['lbl.ct.mof.no']}"  style="width:10%;" styleClass="column-align-center" >
				          <h:outputText value="#{panelBackingBean.retrieveMofNo(supVar.supplier)}" style="float:left;" />
				      </p:column>
				   
				      <p:column headerText="#{lbl['lbl.ct.address']}" style="width:40%;white-space:normal;" styleClass="column-align-center" >
					    <div align="left">
					     <h:outputText value="#{panelBackingBean.getSupAddress(supVar)}"  /></div>
				      </p:column>
				      
				      <p:column headerText="#{lbl['lbl.ct.bank.account.name']}"  style="width:15%;" styleClass="column-align-center" >
				           <h:outputText  id="accountId"    value="#{supVar.bankAccountNo}" style="float:left;" />
						          
					  </p:column>
				   
				      <p:column headerText="#{lbl['lbl.ct.status']}" style="width:10%;" styleClass="column-align-center" >
				        <h:outputText  value="#{supVar.recordStatusFlg == 1 ? 'Active' : 'Inactive' }"  style="float:left;"  />
				    </p:column>
		
			</p:dataTable>
	    </h:panelGroup>	
	  </p:outputPanel>
	  <!-- Supplier Details PopUp -->
	  <ui:include src="/xhtml/ct/circular/panel/supplierDetailsPopUp.xhtml" />
	</p:panel>
</ui:composition>
