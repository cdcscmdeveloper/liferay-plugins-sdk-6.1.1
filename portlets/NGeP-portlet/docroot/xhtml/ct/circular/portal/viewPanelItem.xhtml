<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc">
<p:panel id="itemId" header="#{lbl['lbl.ct.panel.item']}" toggleable="true" toggleSpeed="500">
	 <h:panelGrid style="width:100%">
		  <p:dataTable id="panelItemDt" var="panelItemsVar"  value="#{panelBackingBean.managedBean.circularVer.ctPanelItems}" 
		       rowKey="#{panelItemsVar}" selectionMode="single"
		        selection="#{panelBackingBean.managedBean.selectedPanelItems}"  rowIndexVar="index" widgetVar="panelItemObj">
		      <ac:paginator for="panelItemDt" />
              <p:ajax event="rowSelect"   update=":form:itemId"  process="@this"
                   onstart="blockWidget.show();" oncomplete="blockWidget.hide();"   />	
		  
			  <p:column headerText="#{lbl['lbl.ct.panel.coverage']}" style="white-space:pre-line;width:6%;">
			       <p:outputLabel value="#{panelBackingBean.getParameterDesc(panelItemsVar.panelCoverageId)}" style="width:95%;" />
			   </p:column>
			 
			  <p:column headerText="#{lbl['lbl.ct.item.category']}" style="white-space:pre-line;width:6%">
			         <p:outputLabel value="#{panelBackingBean.getParameterDesc(panelItemsVar.itemCategoryId)}" style="width:95%;" />
		      </p:column>
		 	
              <p:column headerText="#{lbl['lbl.ct.item.name']}" style="width:10%;">
                  <p:inputText value="#{panelItemsVar.itemName}" style="width:95%;" maxlength="100" disabled="true"/>
              </p:column>
              
			  <p:column headerText="#{lbl['lbl.ct.specification']}" style="width:11%;">
			     <p:inputText id="spec" value="#{panelItemsVar.specification}"   style="width:95%;" maxlength="200" disabled="true"/>
			  </p:column>
			
			  <p:column headerText="#{lbl['lbl.ct.uom']}" style="width: 11%;">
			               <p:outputLabel value="#{panelItemsVar.pmUom.uomName}" style="width:95%;" />
		      </p:column>
			  
			  <p:column headerText="#{lbl['lbl.ct.min.order.qty']}" style="white-space:pre-line;width:8%;">
			       <p:inputText value="#{panelItemsVar.minimumOrderQty}" style="width:95%;text-align:right;" disabled="true">
			           <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, panelItemsVar.pmUom.uomCode)}" /> 
			       </p:inputText>
			  </p:column>
			 
			  <p:column headerText="#{lbl['lbl.ct.purchase.limit']}" style="white-space:pre-line;width:7%;">
			       <p:inputText value="#{panelItemsVar.maxProcureAmt}" style="width:95%;text-align:right;"  disabled="true">
			          <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			       </p:inputText>
			  </p:column>
			  
			  <p:column styleClass="column-align-center"  style="white-space:normal;width:2%;">
			  	<f:facet name="header">
					<h:outputText value="#{lbl['lbl.ct.dn']}"/>
               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.direct.nego']}"/>
               	</f:facet>
			    <p:selectBooleanCheckbox value="#{panelItemsVar.directNego}" disabled="true"/>
			  </p:column>		
			  	
			  <p:column styleClass="column-align-center"  style="white-space:normal;width:2%;">
			  	<f:facet name="header">
					<h:outputText value="#{lbl['lbl.ct.dp']}"/>
               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.direct.purchase']}"/>
               	</f:facet>
			  	<p:selectBooleanCheckbox value="#{panelItemsVar.directPurchase}" disabled="true"/>
			  </p:column>	
			  
			  <p:column styleClass="column-align-center"  style="white-space:normal;width:2%;">
			    <f:facet name="header">
					<h:outputText value="#{lbl['lbl.ct.qt']}"/>
               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.quotation.tender']}"/>
               	</f:facet>   
			  	<p:selectBooleanCheckbox value="#{panelItemsVar.qt}" disabled="true"/>
			  </p:column>
			  
			  <p:column headerText="#{lbl['lbl.ct.status']}" style="width:6%;">
		           <p:selectOneMenu  value="#{panelItemsVar.recordStatusFlg}"  disabled="true" style="width:95%;">
				       <f:selectItem itemValue="0" itemLabel="#{lbl['lbl.ct.inactive']}" />
			           <f:selectItem itemValue="1" itemLabel="#{lbl['lbl.ct.active']}" />
			       </p:selectOneMenu>
			  </p:column>	
			  												
		    </p:dataTable>
	 </h:panelGrid>
		
		<p:spacer height="2" />
		
		<p:outputPanel id="itemZone">
		    <h:panelGroup rendered="#{panelBackingBean.managedBean.selectedPanelItems.panelCoverageId.parameterCode == ParameterConst.circularPanelCoverageZone}">
		     <p:outputLabel value="#{lbl['lbl.ct.sublabel.panel.coverage']}" style="float:left; font-weight:bold; padding-top:25px;"/>
			 <div style="clear:both" />
			 <table style="width: 100%">
				<tr>
					<td style="width: 120px;"><p:outputLabel value="Location Level" /></td>
					<td><p:outputLabel  style="float:left"
							value="#{panelBackingBean.getParameterDesc(panelBackingBean.managedBean.selectedPanelItems.locationLevelId)}"/>
			   	</td>
				</tr>
			</table>
		  
		      <p:spacer height="20" />
		     <p:dataTable id="zoneGeneralDataTable" value="#{panelBackingBean.managedBean.selectedPanelItems.ctPanelZones}" 
		        var="panelZoneVar" selectionMode="single" widgetVar="panelZoneObj"
		        selection="#{panelBackingBean.managedBean.selectedPanelZone}" rowKey="#{panelZoneVar}" rowIndexVar="index" >
			    <ac:paginator for="zoneGeneralDataTable" />
			    <p:ajax event="rowSelect" update=":form:itemSupplier"   process="@this" 
			            onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  />	
					<p:column headerText="#{lbl['lbl.ct.location']}" style="width:60%">
				    	<p:outputLabel value="#{panelZoneVar.name}" style="float:left;"/>	
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.status']}" style="width:20%">
                      <p:selectOneMenu  value="#{panelZoneVar.recordStatusFlg}"   disabled="#{true}" style="width:100px;">
				              <f:selectItem itemValue="0" itemLabel="#{lbl['lbl.ct.inactive']}" />
			                  <f:selectItem itemValue="1" itemLabel="#{lbl['lbl.ct.active']}" />
			          </p:selectOneMenu>
                    </p:column>
					<p:column headerText="#{lbl['lbl.ct.action']}" style="width:20%">
					  <p:commandLink
						actionListener="#{panelBackingBean.editPanelZoneLocation(panelZoneVar,index)}"
						process="@this" update="@([id$=zonePopupGeneral])"
						oncomplete="ZoneGeneral.show();">
						<p:graphicImage library="ep/images/design" name="edit.png"
						  value="/css/images/design/edit.png" />
					  </p:commandLink>
					</p:column>
			</p:dataTable>
	  </h:panelGroup>
	  <p:dialog header="#{lbl['lbl.ct.add.location']}" widgetVar="ZoneGeneral" modal="true" width="600" position="top" height="500">
		<p:panel id="zonePopupGeneral">
			<table styleClass="noBorders tr,noBorders td">
				<tr>
					<td width="25%" valign="top"><p:outputLabel value="#{lbl['lbl.ct.zone.name']}"></p:outputLabel></td>
					<td width="70%"><p:inputText id="zoneName" style="width:300px;" disabled="true"
							value="#{panelBackingBean.managedBean.zoneName}"  label="#{lbl['lbl.ct.zone.name']}"></p:inputText>
					</td>
				</tr>
				<tr>
					<td width="25%" valign="top"><p:outputLabel value="#{lbl['lbl.ct.location']}" /></td>
					<td width="70%">
				
						<div style="height: 370px; overflow-y: scroll;">
							<p:tree id="treeZoneGeneralPopup"
								value="#{panelBackingBean.managedBean.rootZoanlTree}"
								var="location" 
								selection="#{panelBackingBean.managedBean.selectedGeneralTreeNodes}"
								selectionMode="checkbox" >
								<p:treeNode type="state">
									<h:outputText value="#{location.stateId.stateName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.districtId.districtName}" />
								</p:treeNode>
							</p:tree>
						</div></td>
				</tr>
			</table>
		</p:panel>
		<p:spacer height="10"/>
		<p:commandButton value="#{lbl['lbl.btn.cancel']}" style="float:right;" onclick="ZoneGeneral.hide();"  />
		</p:dialog>
       </p:outputPanel>
		<p:spacer height="40" />
		<p:outputPanel id="itemSupplier">
		<h:panelGroup rendered="#{(panelBackingBean.managedBean.selectedPanelZone != null and panelBackingBean.managedBean.selectedPanelItems.panelCoverageId.parameterCode == ParameterConst.circularPanelCoverageZone) or
		       (panelBackingBean.managedBean.selectedPanelItems != null and panelBackingBean.managedBean.selectedPanelItems.panelCoverageId.parameterCode == ParameterConst.circularPanelCoverageAll)}">
		    	<p:outputLabel value="#{lbl['lbl.ct.sublabel.item.supplier']}" style="float:left; font-weight:bold; padding-top:25px;"/>
	         <div style="clear:both" />
	         	<p:dataTable id="itemSupplierDt" var="supVar" rowIndexVar="index"
			          value="#{panelBackingBean.managedBean.selectedPanelItems.panelCoverageId.parameterCode == ParameterConst.circularPanelCoverageZone ? panelBackingBean.managedBean.selectedPanelZone.ctPanelSuppliers : panelBackingBean.managedBean.selectedPanelItems.ctPanelSuppliers}"
		              selection="#{panelBackingBean.managedBean.selectedPanelSuppliers}" rowKey="#{supVar}" >
			          <ac:paginator for="itemSupplierDt" />
				  
				      <p:column headerText="#{lbl['lbl.ct.supplier.name']}" style="width:27%;white-space:normal;">
				           <p:outputLabel value="#{supVar.supplier.companyName}" style="float:left;"/>
			          </p:column>
				
				      <p:column headerText="#{lbl['lbl.ct.business.reg.no']}"  style="width:10%;"> 
				          <h:outputText value="#{supVar.supplier.regNo}" style="float:left;"/>
				      </p:column>
				     
				      <p:column headerText="#{lbl['lbl.ct.mof.no']}"  style="width:10%;">
				          <h:outputText value="#{panelBackingBean.retrieveMofNo(supVar.supplier)}" />
				      </p:column>
				   
				      <p:column headerText="#{lbl['lbl.ct.address']}" style="width:40%;white-space:normal;">
					     <h:outputText value="#{panelBackingBean.getSupAddress(supVar)}"/>
				      </p:column>
				   
				      <p:column headerText="#{lbl['lbl.ct.status']}" style="width:10%;">
				         <p:selectOneMenu  value="#{supVar.recordStatusFlg}"  
                             disabled="#{!panelBackingBean.managedBean.updateAction or panelBackingBean.managedBean.viewContract}" style="width:70px;">
				             <f:selectItem itemValue="0" itemLabel="#{lbl['lbl.ct.inactive']}" />
			                 <f:selectItem itemValue="1" itemLabel="#{lbl['lbl.ct.active']}" />
			          </p:selectOneMenu>
				    </p:column>
		
			</p:dataTable>
	    </h:panelGroup>	
	  </p:outputPanel>
	</p:panel>
</ui:composition>
