<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="pc" header="#{lbl['lbl.ct.panel.panel.circular']}" toggleable="true" toggleSpeed="500" widgetVar="panelpc">
	<h:panelGrid id="panelCircularId" columns="4" columnClasses="columnWidth200,columnWidth230,columnWidth180,columnWidth300">
				
				     <p:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" />
				    <p:inputTextarea id="circularNoTxt" style="width:170px; margin-top:2px;margin-bottom:2px" rows="5"
                        maxlength="60"  disabled="true" value="#{panelBackingBean.managedBean.circularVer.circularNo}"  autoResize="false"/>
					
				       <h:outputLabel value="#{lbl['lbl.ct.circular.name']}" />
				       <p:inputTextarea id="circularNameTxt" rows="5" style="width:230px;" maxlength="500"
						   disabled="true" autoResize="false" value="#{panelBackingBean.managedBean.circularVer.name}" />
				    
				    <p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
				    <p:inputText  style="width:170px;" maxlength="60" disabled="true"
						value="#{panelBackingBean.managedBean.circularVer.circularFileRefNo}" />
					
						<h:outputLabel value="#{lbl['lbl.ct.circular.letter']}" />
	                   <h:commandLink value="#{panelBackingBean.managedBean.circularVer.circularFileName}" 
			                   	styleClass="blue_font" action="#{panelBackingBean.downloadFile()}" />				
		
					 	<p:outputLabel value="#{lbl['lbl.ct.start.date']}" />
			   	         <p:calendar id="popupButtonCal" navigator="true" size="17" showOn="button" 
			   	               value="#{panelBackingBean.managedBean.circularVer.startDate}"  disabled="true" 
			       		        pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
			       	      </p:calendar> 
			              
			           	    <h:outputLabel value="#{lbl['lbl.ct.end.date']}" />
		                      <p:calendar value="#{panelBackingBean.managedBean.circularVer.endDate}" id="popupButtonCal1" 
			   		            	pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
			         	            size="17" navigator="true" showOn="button"   disabled="true">
			   	         	   </p:calendar>
      	</h:panelGrid>
	</p:panel>
	
	<p:panel id="contactPerson" header="#{lbl['lbl.ct.panel.contact.person']}" toggleable="true" toggleSpeed="500" >
		<p:dataTable id="contactPersonDt" var="data" value="#{panelBackingBean.managedBean.circularVer.ctContactPersons}"
			rowKey="#{data}" rowIndexVar="index">
			<ac:paginator for="contactPersonDt" />
			<p:column headerText="#{lbl['lbl.ct.contact.person.name']}" style="width:20%;">
			     <h:outputText  value="#{data.name}" style="width:95%;" maxlength="20" ></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.address']}" style="width:40%;">
				 <h:outputText  value="#{data.address}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.email']}"  style="width:20%;">
				<h:outputText   id="email" value="#{data.email}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.tel']}" style="width:20%;">
				<h:outputText  id="phoneNo" value="#{data.phoneNo}" />
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<p:panel id="cancelCircularPnl" header="#{lbl['lbl.ct.panel.related.cancelled.circular']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="cancelCircularDt" var="data" rowKey="#{data}" rowIndexVar="index" 
			value="#{panelBackingBean.managedBean.circularVer.ctCancelCircularList}">
			<ac:paginator for="cancelCircularDt" />		
			<p:column headerText="#{lbl['lbl.ct.physical.circular.no']}">
				<h:outputText value="#{data.circularVer.circularNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.circular.name']}" >
				<h:outputText value="#{data.circularVer.name}" />
			</p:column>	
		</p:dataTable>
	</p:panel>
	</ui:composition>
