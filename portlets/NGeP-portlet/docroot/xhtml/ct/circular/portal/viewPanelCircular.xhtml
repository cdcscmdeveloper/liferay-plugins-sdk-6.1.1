<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="pc" 
	     header="#{lbl['lbl.ct.panel.panel.circular']}" toggleable="true" toggleSpeed="500" widgetVar="panelpc">
	      
	       <h:panelGrid id="panelCircularId" columns="4"
	            columnClasses="columnWidth200,columnWidth200,columnWidth180,columnWidth200">
				
				    <p:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" />
				    <p:inputTextarea id="circularNoTxt" style="width:170px; margin-top:2px;margin-bottom:2px" rows="5"
                         disabled="true" value="#{panelBackingBean.managedBean.circularVer.circularNo}"  autoResize="false"/>
					
				    <h:outputLabel value="#{lbl['lbl.ct.circular.panel.name']}" />
				    <p:inputTextarea id="circularNameTxt" rows="5" style="width:230px;" 
						   disabled="true" autoResize="false" value="#{panelBackingBean.managedBean.circularVer.name}" />
				    
				    <p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
				    <p:inputText  style="width:170px;" disabled="true"
						value="#{panelBackingBean.managedBean.circularVer.circularFileRefNo}" />
					
				     <h:outputLabel value="#{lbl['lbl.ct.circular.letter']}" />
	                 <h:commandLink 	 action="#{panelBackingBean.downloadFile()}" 
	                      value="#{panelBackingBean.managedBean.circularVer.circularFileName}" styleClass="blue_font"/>				
		
					  <p:outputLabel value="#{lbl['lbl.ct.start.date']}" />
			   	      <p:calendar id="popupButtonCal" navigator="true" size="17" showOn="button" 
			   	           value="#{panelBackingBean.managedBean.circularVer.startDate}"  disabled="true" 
			       		   pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
			       	   </p:calendar> 
			              
			           <h:outputLabel value="#{lbl['lbl.ct.end.date']}" />
		               <p:calendar value="#{panelBackingBean.managedBean.circularVer.endDate}"
		                    size="17" navigator="true" showOn="button"   disabled="true" id="popupButtonCal1" 
			   		        pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
			   	       </p:calendar>
      	        </h:panelGrid>
	       </p:panel>
	
	       <p:panel id="contactPerson"
	            header="#{lbl['lbl.ct.panel.contact.person']}" toggleable="true" toggleSpeed="500" >
		        <p:dataTable id="contactPersonDt" 
		             var="data" value="#{panelBackingBean.managedBean.circularVer.ctContactPersons}">
			         <ac:paginator for="contactPersonDt" />
			         <p:column headerText="#{lbl['lbl.ct.contact.person.name']}" style="width:20%;" styleClass="column-align-center"  >
			                <h:outputText  value="#{data.name}" style="float:left;"  />
			         </p:column>
			         <p:column headerText="#{lbl['lbl.ct.address']}" style="width:40%;" styleClass="column-align-center" >
				          <h:outputText  value="#{data.address}" style="float:left;" />
			         </p:column>
			         <p:column headerText="#{lbl['lbl.ct.email']}"  style="width:20%;" styleClass="column-align-center" >
				         <h:outputText   id="email" value="#{data.email}" style="float:left;"  />
			          </p:column>
			          <p:column headerText="#{lbl['lbl.ct.tel']}" style="width:20%;" styleClass="column-align-center" >
				           <h:outputText  id="phoneNo" value="#{data.phoneNo}" style="float:left;" />
			          </p:column>
		        </p:dataTable>
	         </p:panel>
	
	        <p:panel id="cancelCircularPnl"
	            header="#{lbl['lbl.ct.panel.related.cancelled.circular']}" toggleable="true" toggleSpeed="500">
		        <p:dataTable id="cancelCircularDt" var="data"
			        value="#{panelBackingBean.managedBean.circularVer.ctCancelCircularList}">
			        <ac:paginator for="cancelCircularDt" />		
			        <p:column headerText="#{lbl['lbl.ct.physical.circular.no']}" styleClass="column-align-center" >
			         	<h:outputText value="#{data.circularVer.circularNo}" style="float:left;" />
			        </p:column>
			        <p:column headerText="#{lbl['lbl.ct.circular.name']}" styleClass="column-align-center" >
				        <h:outputText value="#{data.circularVer.name}"  style="float:left;" />
			        </p:column>	
		        </p:dataTable>
	        </p:panel>
	</ui:composition>
