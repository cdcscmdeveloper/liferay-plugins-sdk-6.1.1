<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="contractListPnl" header="#{lbl['lbl.ct.contract.list']}" toggleable="true" toggleSpeed="500">
		
		<p:dataTable id="centralContractDt" var="circularContractsVar" rowIndexVar="index"
			   value="#{centralContractBackingBean.managedBean.circularVer.ctCircularContracts}" selectionMode="single" 
			   selection="#{centralContractBackingBean.managedBean.selectedCircularContract}" rowKey="#{circularContractsVar}">
			        <ac:paginator for="centralContractDt" />
			        <p:ajax event="rowSelect" update=":form:contractListPnl"
			           process="@this"  onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
		   
		             <p:column headerText="#{lbl['lbl.ct.contract.title']}" style="width:32%;white-space:normal;" styleClass="column-align-center">
				        <h:outputText value="#{circularContractsVar.ctContract.contractName}" style="float:left;"   />
			         </p:column>
		
		          	<p:column headerText="#{lbl['lbl.ct.loa.physical.no']}" style="width:12%;white-space:normal;" styleClass="column-align-center">
				        <h:outputText value="#{circularContractsVar.ctContract.latestContractVer.ctContractValue.loaPhysicalNo}" style="float:left;" />
			        </p:column>
			
			        <p:column headerText="#{lbl['lbl.ct.physical.no']}" style="width:10%;white-space:normal;" styleClass="column-align-center">
				        <h:outputText value="#{circularContractsVar.ctContract.latestContractVer.contractPhysicalNo}" style="float:left;" />
			        </p:column>
			
			        <p:column headerText="#{lbl['lbl.ct.contract.start']}" style="width:8%;" styleClass="column-align-center">
			 	        <h:outputText value="#{circularContractsVar.ctContract.latestContractVer.ctContractValue.effDate}" style="float:left;" >
					       <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				        </h:outputText>
			         </p:column>
			         
			         <p:column headerText="#{lbl['lbl.ct.contract.end']}" style="width:8%;" styleClass="column-align-center">
			 	        <h:outputText value="#{circularContractsVar.ctContract.latestContractVer.ctContractValue.expDate}" style="float:left;" >
					        <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				        </h:outputText>
			          </p:column>
			
			          <p:column headerText="#{lbl['lbl.ct.supplier.name']}" style="width:20%;white-space:normal;" styleClass="column-align-center">
				          <div align="left">
				          <h:outputText value="#{circularContractsVar.ctContract.latestContractVer.ctContractValue.supplierName}"   /> </div>
			          </p:column>
		
			          <p:column headerText="#{lbl['lbl.ct.status']}" style="width:10%;" styleClass="column-align-center">
				            <h:outputText value="#{circularContractsVar.recordStatusFlg == 1 ? 'Active' : 'Inactive' }" style="float:left;"  />
			          </p:column>
		         </p:dataTable>
		         <p:spacer height="2" />

		<p:spacer height="20" />
		<p:outputPanel id="circularItemsPanel">
			<h:panelGroup
				rendered="#{centralContractBackingBean.managedBean.selectedCircularContract != null and
		           centralContractBackingBean.managedBean.selectedCircularContract.ctCircularItems.size() > 0}">
				<p:outputLabel value="#{lbl['lbl.ct.sublabel.item']}"
					style="float:left; font-weight:bold; padding-top:5px;" />
				<div style="clear: both" />
				<p:dataTable id="circularItemDt" var="itemVar"
					value="#{centralContractBackingBean.getActiveCircularItem()}"
					selectionMode="single" selection="#{centralContractBackingBean.managedBean.selectedCircularItem}"
					rowKey="#{itemVar}">
					<ac:paginator for="circularItemDt" />
					<p:ajax event="rowSelect"
						update="@([id$=circularZonePanel],[id$=circularPricePanel])"
						process="@this" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						listener="#{centralContractBackingBean.setZoneListener()}" />
					<p:column headerText="#{lbl['lbl.ct.item.name']}"
						style="width:45%; white-space:pre-line;" styleClass="column-align-center">
						<h:outputText value="#{itemVar.ctContractItem.scRequestItem.itemName}" style="float:left;" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.min.order.qty']}" style="width:10%;" styleClass="column-align-center">
						 <h:outputText styleClass="colFloatRight" style="float:right;" value="#{itemVar.minimumOrderQty}">
							<f:converter converterId="dynamicNumberConverter" />
							<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, itemVar.ctContractItem.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.min.order.amount']}" 
					   styleClass="column-align-center" style="width:15%;white-space:pre-line;">
						 <h:outputText styleClass="colFloatRight" style="float:left;" value="#{itemVar.minimumOrderAmt}" >
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.contract.purchase.limit']}"
						style="width:15%;white-space:pre-line;" styleClass="column-align-center">
						 <h:outputText styleClass="colFloatRight" style="float:left;" value="#{itemVar.maxProcureAmt}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
				</p:dataTable>
			</h:panelGroup>
		</p:outputPanel>

		<p:spacer height="40" />
		<p:outputPanel id="circularZonePanel">
			<h:panelGroup
				rendered="#{centralContractBackingBean.managedBean.selectedCircularItem != null
		     and centralContractBackingBean.managedBean.chkItemZone}">
				<p:outputLabel value="#{lbl['lbl.ct.sublabel.zone']}"
					style="float:left; font-weight:bold; padding-top:25px;" />
				<div style="clear: both" />
				<p:dataTable id="circularItemZoneDt" var="dataZone"
					value="#{centralContractBackingBean.managedBean.contractItemZones}"
					selection="#{centralContractBackingBean.managedBean.selectedZoneItems}"
					selectionMode="single" rowKey="#{dataZone}" rowIndexVar="index">
					<ac:paginator for="circularItemZoneDt" />
					<p:ajax event="rowSelect" update="@([id$=circularPricePanel])"
						process="@this" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						listener="#{centralContractBackingBean.setPriceListener()}" />
					<p:column headerText="#{lbl['lbl.ct.zone']}" style="width:60%;" styleClass="column-align-center">
						<h:outputText value="#{dataZone.zoneName}" style="float:left;"  />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.action']}" style="width:40%;" styleClass="column-align-center">
						<p:commandLink update="@([id$=itemZoneId])"
							oncomplete="itemZoneDlg.show();" immediate="true">
							<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.ct.view']}"></p:graphicImage>
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</h:panelGroup>
		</p:outputPanel>

		<p:spacer height="40" />
		<p:outputPanel id="circularPricePanel">
			<h:panelGroup
				rendered="#{centralContractBackingBean.managedBean.chkItemPrice and  
		    centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.ctItemPrices != null 
		    and centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.ctItemPrices.size() > 0}">
				<p:outputLabel
					value="#{(centralContractBackingBean.managedBean.selectedCircularItem != null
		       and centralContractBackingBean.managedBean.chkItemZone)?lbl['lbl.ct.sublabel.zone.price']:lbl['lbl.ct.sublabel.item.price']}"
					style="float:left; font-weight:bold; padding-top:25px;" />
				<div style="clear: both" />
				<p:dataTable id="circularItemZonePriceDt" var="itemPrice"  value="#{centralContractBackingBean.getItemPrice()}">
					<ac:paginator for="circularItemZonePriceDt" />
					
					 <c:if test="#{centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.priceType.parameterCode eq ParameterConst.priceTypeStandard}">
			                   <p:column headerText="#{lbl['lbl.ct.price']}">
			                        <h:outputText value="#{itemPrice.unitPrice}">
			                           <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			                        </h:outputText>
			                   </p:column>   
			            </c:if>  
			     
			            <c:if test="#{centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.priceType.parameterCode eq ParameterConst.priceTypeTier}">
			                  <p:column styleClass="column-align-center">
					          	<f:facet name="header">
									<h:outputText value="#{lbl['lbl.ct.from.qty']}"/>
				               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
				               	</f:facet>
			               		<h:outputText value="#{itemPrice.fromQty}">
               						<f:converter converterId="dynamicNumberConverter" />
									<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.scRequestItem.uom.uomCode)}" />
			              		</h:outputText>
			                  </p:column>       
			                  <p:column styleClass="column-align-center">
					          	<f:facet name="header">
									<h:outputText value="#{lbl['lbl.ct.to.qty']}"/>
				               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
				               	</f:facet>
				               	<h:outputText value="#{itemPrice.toQty}">
               						<f:converter converterId="dynamicNumberConverter" />
									<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.scRequestItem.uom.uomCode)}" />		
				               	</h:outputText>          
			                  </p:column> 
			                 <p:column headerText="#{lbl['lbl.ct.price']}" styleClass="column-align-center">
			                     <h:outputText value="#{itemPrice.unitPrice}">
			                         <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			                     </h:outputText>
			                 </p:column>
			              </c:if>   
			        
			              <c:if  test="#{centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.priceType.parameterCode 
			                  eq ParameterConst.priceTypeZonalStandard}">
			                   <p:column headerText="#{lbl['lbl.ct.price']}">
			                       <h:outputText value="#{itemPrice.unitPrice}">
			                           <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			                       </h:outputText>
			                   </p:column>
			             </c:if>
			           
			             <c:if test="#{centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.priceType.parameterCode
			                  eq ParameterConst.priceTypeZonalTier}">
			                 <p:column styleClass="column-align-center">
					             <f:facet name="header">
									<h:outputText value="#{lbl['lbl.ct.from.qty']}"/>
				               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
				               	</f:facet>
			               		<h:outputText value="#{itemPrice.fromQty}">
               						<f:converter converterId="dynamicNumberConverter" />
									<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.scRequestItem.uom.uomCode)}" />
				              	</h:outputText>
			                 </p:column>       
			                 <p:column styleClass="column-align-center">
					             <f:facet name="header">
									<h:outputText value="#{lbl['lbl.ct.to.qty']}"/>
				               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
				               	</f:facet>
			               		<h:outputText value="#{itemPrice.toQty}">
               						<f:converter converterId="dynamicNumberConverter" />
									<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.uom.uomCode)}" />			
				             	</h:outputText>		           
			                 </p:column>    
			                 <p:column headerText="#{lbl['lbl.ct.price']}" styleClass="column-align-center">
			                     <h:outputText value="#{itemPrice.unitPrice}">
			                         <f:convertNumber
						                pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			                     </h:outputText>
			                </p:column>
			              </c:if> 
                    
                          <c:if test="#{centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.priceType.parameterCode
			                  eq ParameterConst.priceTypeTariff}">
			                   <p:column styleClass="column-align-center">
					           	<f:facet name="header">
									<h:outputText value="#{lbl['lbl.ct.from.qty']}"/>
				               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
				               	</f:facet>
			               		<h:outputText value="#{itemPrice.fromQty}">
               						<f:converter converterId="dynamicNumberConverter" />
									<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.scRequestItem.uom.uomCode)}" />			
				               	</h:outputText>		            
			                   </p:column>       
			                  <p:column styleClass="column-align-center">
					          	<f:facet name="header">
									<h:outputText value="#{lbl['lbl.ct.to.qty']}"/>
				               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
				               	</f:facet>
			               		<h:outputText value="#{itemPrice.toQty}">
               						<f:converter converterId="dynamicNumberConverter" />
									<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.scRequestItem.uom.uomCode)}" />
				               	</h:outputText>   
			                   </p:column>  
			                   <p:column styleClass="column-align-center">
					           	<f:facet name="header">
									<h:outputText value="#{lbl['lbl.ct.sub.seq']}"/>
				               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
				               	</f:facet>
				                <h:outputText value="#{itemPrice.subSequence}">
               						<f:converter converterId="dynamicNumberConverter" />
									<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.scRequestItem.uom.uomCode)}" />
				                </h:outputText>
			                   </p:column> 
			                    <p:column headerText="#{lbl['lbl.ct.price']}" styleClass="column-align-center">
			                        <h:outputText value="#{itemPrice.unitPrice}">
			                            <f:convertNumber
						                   pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			                        </h:outputText>			                
			                    </p:column>            
			             </c:if> 
			           
			             <c:if test="#{centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.priceType.parameterCode
			                eq ParameterConst.priceTypeZonalTariff}">
			                 <p:column styleClass="column-align-center">
					             <f:facet name="header">
									<h:outputText value="#{lbl['lbl.ct.from.qty']}"/>
				               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
				               	</f:facet>
			               		<h:outputText value="#{itemPrice.fromQty}">
               						<f:converter converterId="dynamicNumberConverter" />
									<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.scRequestItem.uom.uomCode)}" />
				             	</h:outputText>			              
			                 </p:column>       
			                 <p:column styleClass="column-align-center">
					         	<f:facet name="header">
									<h:outputText value="#{lbl['lbl.ct.to.qty']}"/>
				               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
				               	</f:facet>
			               		<h:outputText value="#{itemPrice.toQty}">
               						<f:converter converterId="dynamicNumberConverter" />
									<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.scRequestItem.uom.uomCode)}" />
				             	</h:outputText>	           
			                 </p:column>
			                  <p:column styleClass="column-align-center">
					          	<f:facet name="header">
									<h:outputText value="#{lbl['lbl.ct.sub.seq']}"/>
				               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
				               	</f:facet>
			               		<h:outputText value="#{itemPrice.subSequence}">
               						<f:converter converterId="dynamicNumberConverter" />
									<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.scRequestItem.uom.uomCode)}" />
				              	</h:outputText>
			                  </p:column>     
			           </c:if>
				</p:dataTable>
			</h:panelGroup>
		</p:outputPanel>

		<p:dialog id="itemZoneDlg" header="#{lbl['lbl.ct.panel.zone']}" styleClass="pop_up_top"
			widgetVar="itemZoneDlg" modal="true" width="350" height="200">
			<p:outputPanel id="itemZoneId">
				<p:treeTable id="itemZoneDt"
					value="#{centralContractBackingBean.managedBean.centralZoneTrees}"
					var="zoneTree">
					<p:column style="width:70%;">
						<f:facet name="header">#{lbl['lbl.ct.location.name']}</f:facet>
						<p:treeNode type="zone">
							<h:outputText value="#{zoneTree.zone}" />
						</p:treeNode>
						<p:treeNode type="state">
							<h:outputText value="#{zoneTree.state.stateName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{zoneTree.district.districtName}" />
						</p:treeNode>
					</p:column>
				</p:treeTable>
			</p:outputPanel>
		</p:dialog>
	</p:panel>
		
</ui:composition>
