<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	  <h:panelGrid columns="4" columnClasses="columnWidth200,columnWidth230,columnWidth180,columnWidth300">
			 
			   <h:panelGrid columns="2" style="float:right;">
			    	 <p:outputLabel value="*" styleClass="mandatory" />
				     <p:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" />
				</h:panelGrid>
				 <h:panelGrid columns="2">
				     <p:inputTextarea id="circularNoUpTxt" style="width:170px; margin-top:2px;margin-bottom:2px" rows="5"
					 	required="true" maxlength="60"  disabled="#{centralContractBackingBean.managedBean.viewContract}"
						value="#{centralContractBackingBean.managedBean.circularVer.circularNo}"  label="#{lbl['lbl.ct.physical.circular.no']}"  autoResize="false"/>
				      <p:message for="circularNoUpTxt" display="icon"/>
				  </h:panelGrid>
				   
				    <h:panelGrid columns="2" style="float:right;">
				        <p:outputLabel value="*" styleClass="mandatory" />
			        	<p:outputLabel  value="#{lbl['lbl.ct.circular.name']}" />
				    </h:panelGrid>
		            <h:panelGrid columns="3">
				        <p:inputTextarea id="circularNameUpTxt" rows="5" style="width:230px;" 
				              maxlength="200" required="true" 
						      disabled="#{centralContractBackingBean.managedBean.viewContract}" autoResize="false"
						      label="#{lbl['lbl.ct.circular.name']}" value="#{centralContractBackingBean.managedBean.circularVer.name}" />
						      <p:spacer width="5"/>
					          <p:message for="circularNameUpTxt" display="icon"/>
			        </h:panelGrid>
			        
			          <h:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
				  <p:inputText  style="width:170px;" maxlength="60"
						disabled="#{centralContractBackingBean.managedBean.viewContract}"
						value="#{centralContractBackingBean.managedBean.circularVer.circularFileRefNo}" />
						
			      <p:outputLabel value="#{lbl['lbl.ct.start.date']}" />
		          <p:inputText  id="popupButtonCal3" style="width:115px;" disabled="true"
		              value="#{centralContractBackingBean.managedBean.circularVer.startDate}">
				    <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
				
				  <p:outputLabel value="#{lbl['lbl.ct.extension.period']}" />
		           <h:panelGrid columns="3">
		           <p:inputText id="extendPeriod"  style="text-align:right;width:65px;" 
		           	  disabled="#{centralContractBackingBean.managedBean.viewContract}"
		              label="#{lbl['lbl.ct.extension.period']}" value="#{centralContractBackingBean.managedBean.circularVer.extendPeriod}">
		             <p:ajax event="blur" process="@this" 
				        listener="#{centralContractBackingBean.extendStartEndDate()}" update=":form:popupButtonCal5,:form:popupButtonCal6"></p:ajax>
		           </p:inputText>
		           <p:spacer width="2" /> 
		           <p:outputLabel value="#{lbl['lbl.ct.months']}"/>
		        </h:panelGrid>
		        
				<h:outputLabel value="#{lbl['lbl.ct.end.date']}" />
		        <p:inputText value="#{centralContractBackingBean.managedBean.circularVer.endDate}" id="popupButtonCal4" 
			             style="width:115px;" disabled="true">
				        <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
				
			
		        <p:outputLabel value="#{lbl['lbl.ct.extension.start.date']}" /> 
		         <p:inputText value="#{centralContractBackingBean.managedBean.circularVer.extendStartDate}" id="popupButtonCal5" 
			             style="width:115px;" disabled="true">
			              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
		        <p:outputLabel value="#{lbl['lbl.ct.extension.end.date']}" />
		       <p:inputText value="#{centralContractBackingBean.managedBean.circularVer.extendEndDate}" id="popupButtonCal6" 
			             style="width:115px;" disabled="true">
			              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
		     
		     	<h:outputLabel value="#{lbl['lbl.ct.warranty.period']}" />
				<h:panelGroup>
					<p:inputText value="#{centralContractBackingBean.managedBean.circularVer.warrantyPeriod}" 
						disabled="#{centralContractBackingBean.managedBean.viewContract}"
					  	maxlength="4" style="text-align:right; width:50px;" label="#{lbl['lbl.ct.warranty.period']}" />
					<p:spacer width="5" />
					<h:outputText value="#{lbl['lbl.ct.months']}" />
				</h:panelGroup>
		     
		      <h:panelGrid columns="2" style="float:right;">
		        <p:outputLabel value="*" styleClass="mandatory" />
		         <p:outputLabel value="#{lbl['lbl.ct.circular.letter']}" />
		       </h:panelGrid> 
		        <h:commandLink value="#{centralContractBackingBean.managedBean.circularVer.circularFileName}" styleClass="blue_font" 
				action="#{centralContractBackingBean.downloadFile(1)}" />
		   </h:panelGrid>
</ui:composition>
