<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<table style="width: 100%" >
			<tr>
				<td style="width: 15%;" >
				  <p:outputLabel value="#{lbl['lbl.ct.cc.cno']}" />
				  <p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td> <h:panelGrid columns="2">
				  <p:inputText id="circularNo" style="width:170px;" label="#{lbl['lbl.ct.cc.cno']}" maxlength="50"
				     required="true"  value="#{centralContractBackingBean.managedBean.circularVer.circularNo}"/>
				      <p:message for="circularNo" display="icon"/>
				    </h:panelGrid>
				    </td>
				<td rowspan="2" valign="top" style="width: 15%;">
				<p:outputLabel  value="#{lbl['lbl.ct.cc.cname']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td rowspan="2">
				 <h:panelGrid columns="3">
				<p:inputTextarea id="cName" rows="3" label="#{lbl['lbl.ct.cc.cname']}"  maxlength="200"
						style="width:170px; margin-bottom:5px;" required="true"
						value="#{centralContractBackingBean.managedBean.circularVer.name}" />
						<p:spacer width="5"/>
					 <p:message for="cName" display="icon"/>
			    </h:panelGrid>
				</td>
			</tr>
			<tr>
				<td>
				  <h:outputLabel value="#{lbl['lbl.ct.cc.frno']}" />
				</td>
				<td><p:inputText  style="width:170px;" maxlength="50"
						value="#{centralContractBackingBean.managedBean.circularVer.circularFileRefNo}" /></td>
			</tr>
			
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.ct.cc.csdate']}" /></td>
		        <td>
		           <p:calendar disabled="true"  value="#{centralContractBackingBean.managedBean.circularVer.startDate}"
			       pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal3" size="24" showOn="button"
			       navigator="true"   style="margin-bottom:5px;" /></td>
		        <td><h:outputLabel value="#{lbl['lbl.ct.cc.cedate']}" /></td>
		        <td><p:calendar disabled="true" value="#{centralContractBackingBean.managedBean.circularVer.endDate}" 
			        navigator="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" size="24" id="popupButtonCal4" showOn="button" /></td>
			</tr>
			
			<tr>
		    <td>
		      <p:outputLabel value="#{lbl['lbl.ct.pc.extperiod']}" /></td>
		    <td><h:panelGrid columns="3"  style="margin-top:5px;">
		           <p:inputText id="extendPeriod"  style="text-align:right;margin-top:2px;width:130px;" 
		              label="#{lbl['lbl.ct.pc.extperiod']}" value="#{centralContractBackingBean.managedBean.circularVer.extendPeriod}">
		             <p:ajax event="blur" process="@this" 
				        listener="#{centralContractBackingBean.extendStartEndDate()}" update=":form:popupButtonCal5,:form:popupButtonCal6"></p:ajax>
		           </p:inputText>
		           <p:spacer width="2" /> 
		           <p:outputLabel value="#{lbl['lbl.ct.pc.months']}"/>
		        </h:panelGrid>
		     </td>
		     <td><p:outputLabel value="#{lbl['lbl.ct.cc.upload']}" />
		         <p:outputLabel value="*" styleClass="mandatory" />
		     </td>
		    <td><h:commandLink value="#{centralContractBackingBean.managedBean.circularVer.circularFileName}" styleClass="blue_font" 
				action="#{centralContractBackingBean.downloadFile(1)}" /></td>
		  </tr>
		  
		  <tr>
		    <td> <p:outputLabel value="#{lbl['lbl.ct.pc.extstartdt']}" /> </td>
		    <td>
		    <p:calendar value="#{centralContractBackingBean.managedBean.circularVer.extendStartDate}" label="#{lbl['lbl.ct.pc.extstartdt']}"
		       disabled="true" size="24" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal5" showOn="button">
		    </p:calendar>
		     
		       </td>
		  
		    <td><p:outputLabel value="#{lbl['lbl.ct.pc.extenddt']}" /></td>
		    <td>
		      <p:calendar size="24" value="#{centralContractBackingBean.managedBean.circularVer.extendEndDate}" 
				disabled="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal6" showOn="button">
			  </p:calendar>
		    </td>
		  </tr>  
	</table>
</ui:composition>
