<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	  <h:panelGrid columns="4" style="width:980px;"
	      columnClasses="columnWidth200,columnWidth200,columnWidth180,columnWidth300">
			 
			     <p:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" styleClass="required" />
				 <h:panelGrid columns="5" styleClass="top-aligned-columns">
				     <p:inputTextarea id="circularNoUpTxt" style="width:170px; margin-top:2px;margin-bottom:2px" rows="5"
					 	required="true" maxlength="60"  disabled="#{centralContractBackingBean.managedBean.viewContract}"
						value="#{centralContractBackingBean.managedBean.circularVer.circularNo}"  
						label="#{lbl['lbl.ct.physical.circular.no']}"  autoResize="false"
						onkeyup="limitTextArea(this,60);" onkeydown="limitTextArea(this,60);"/>
						<p:spacer width="5"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.circular.central.no']}" />
						<p:spacer width="5"/>
				        <p:message for="circularNoUpTxt" display="icon"/>
				  </h:panelGrid>
				   
				  	<p:outputLabel  value="#{lbl['lbl.ct.circular.central.name']}"  styleClass="required"/>
				    <h:panelGrid columns="5" styleClass="top-aligned-columns">
				        <p:inputTextarea id="circularNameUpTxt" rows="5" style="width:200px;" 
				              maxlength="500" required="true" 
						      disabled="#{centralContractBackingBean.managedBean.viewContract}" autoResize="false"
						      label="#{lbl['lbl.ct.circular.name']}" value="#{centralContractBackingBean.managedBean.circularVer.name}"
							  onkeyup="limitTextArea(this,60);" onkeydown="limitTextArea(this,500);" />
						      <p:spacer width="5"/>
						      	<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.circular.central.name']}" />
						      	<p:spacer width="5"/>
					          <p:message for="circularNameUpTxt" display="icon"/>
			        </h:panelGrid>
			        
			          <p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
				  <p:inputText  style="width:170px;" maxlength="60"
						disabled="#{centralContractBackingBean.managedBean.viewContract}"
						value="#{centralContractBackingBean.managedBean.circularVer.circularFileRefNo}"
						onkeypress="if (event.keyCode == 13) { return false; }"  />
						
			      <p:outputLabel value="#{lbl['lbl.ct.start.date']}"  />
		          <p:inputText  id="popupButtonCal3" style="width:115px;" disabled="true"
		              value="#{centralContractBackingBean.managedBean.circularVer.startDate}">
				    <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
				    
				     <p:outputLabel value="#{lbl['lbl.ct.pid']}"  />
			         <p:selectBooleanCheckbox disabled="#{centralContractBackingBean.managedBean.viewContract}" 
			                       value="#{centralContractBackingBean.managedBean.circularVer.pid}"  style="text-align:top;">
			                       <p:ajax event="change"  update=":form:groupPidId" process="@this"></p:ajax>
			           </p:selectBooleanCheckbox>
			               
				 <p:outputLabel value="#{lbl['lbl.ct.end.date']}" />
		        <p:inputText value="#{centralContractBackingBean.managedBean.circularVer.endDate}" id="popupButtonCal4" 
			             style="width:115px;" disabled="true">
				        <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
				
			  <p:outputLabel value="#{lbl['lbl.ct.circular.extension']}" />
			   	        <p:selectBooleanCheckbox id="extensionId" value="#{centralContractBackingBean.managedBean.circularExtension}"
			   	        	 disabled="#{centralContractBackingBean.managedBean.viewContract}">
			                 <p:ajax event="change" update=":form:ccc" listener="#{centralContractBackingBean.chkCircularExtension}" process="@this"/> 
			           </p:selectBooleanCheckbox>
			             <f:verbatim/> <f:verbatim/>
		        <p:outputLabel value="#{lbl['lbl.ct.extension.start.date']}" styleClass="required"  rendered="#{centralContractBackingBean.managedBean.circularExtension}" />
			    <p:calendar  value="#{centralContractBackingBean.managedBean.circularVer.extendStartDate}" readonly="true"
			         maxdate="#{centralContractBackingBean.managedBean.circularVer.extendStartDate}"
			         mindate="#{centralContractBackingBean.managedBean.circularVer.extendStartDate}"
			         disabled="#{centralContractBackingBean.managedBean.viewContract}"
			         rendered="#{centralContractBackingBean.managedBean.circularExtension}"  size="10"  id="popupButtonCal5" showOn="button"
				     pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
		       </p:calendar>
		         <f:verbatim/> <f:verbatim/>
		       
		    <p:outputLabel value="#{lbl['lbl.ct.extension.end.date']}" styleClass="required"   rendered="#{centralContractBackingBean.managedBean.circularExtension}"  />
		   <p:calendar size="10"  value="#{centralContractBackingBean.managedBean.circularVer.extendEndDate}"  navigator="true"
		         mindate="#{centralContractBackingBean.managedBean.circularVer.extendStartDate}" readonlyInput="true"  styleClass="calendarDateField" 
				   disabled="#{centralContractBackingBean.managedBean.viewContract}"
				   rendered="#{centralContractBackingBean.managedBean.circularExtension}" 
				   required="true" label="#{lbl['lbl.ct.extension.end.date']}"
				   pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" showOn="button" id="popupButtonCal6" >
				</p:calendar>
				
			  	      <f:verbatim/> <f:verbatim/>
				
				
		       <p:outputLabel value="#{lbl['lbl.ct.circular.letter']}" />
		        <h:commandLink value="#{centralContractBackingBean.managedBean.circularVer.circularFileName}" 
		        	styleClass="blue_font" 
					action="#{centralContractBackingBean.downloadFile(1)}" />
			</h:panelGrid>
</ui:composition>
