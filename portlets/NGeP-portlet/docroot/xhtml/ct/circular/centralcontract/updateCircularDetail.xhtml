<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<table style="width: 100%" >
			<tr>
				<td style="width: 20%;" >
				  <p:outputLabel value="#{lbl['lbl.ct.circular.no']}" />
				  <p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td> <h:panelGrid columns="2">
				  <p:inputText id="circularNo" style="width:170px;" label="#{lbl['lbl.ct.circular.no']}" maxlength="50"
				     required="true"  value="#{centralContractBackingBean.managedBean.circularVer.circularNo}"/>
				      <p:message for="circularNo" display="icon"/>
				    </h:panelGrid>
				    </td>
				<td rowspan="2" valign="top" style="width: 20%;">
				<p:outputLabel  value="#{lbl['lbl.ct.circular.name']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td rowspan="2">
				 <h:panelGrid columns="3">
				<p:inputTextarea id="cName" rows="3" label="#{lbl['lbl.ct.circular.name']}"  maxlength="200"
						style="width:170px; margin-bottom:5px;" required="true"
						value="#{centralContractBackingBean.managedBean.circularVer.name}" />
						<p:spacer width="5"/>
					 <p:message for="cName" display="icon"/>
			    </h:panelGrid>
				</td>
			</tr>
			<tr>
				<td>
				  <h:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
				</td>
				<td><p:inputText  style="width:170px;" maxlength="50"
						value="#{centralContractBackingBean.managedBean.circularVer.circularFileRefNo}" /></td>
			</tr>
			
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.ct.start.date']}" /></td>
		        <td>
		        <p:inputText value="#{centralContractBackingBean.managedBean.circularVer.startDate}" id="popupButtonCal3"
				   style="width:170px;" disabled="true">
				<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
				</td>
		        <td><h:outputLabel value="#{lbl['lbl.ct.end.date']}" /></td>
		        <td>
		             <p:inputText value="#{centralContractBackingBean.managedBean.circularVer.endDate}" id="popupButtonCal4" 
			             style="width:170px;" disabled="true">
				        <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
		        </td>
			</tr>
			
			<tr>
		    <td>
		      <p:outputLabel value="#{lbl['lbl.ct.extension.period']}" /></td>
		    <td><h:panelGrid columns="3"  style="margin-top:5px;">
		           <p:inputText id="extendPeriod"  style="text-align:right;margin-top:2px;width:130px;" 
		              label="#{lbl['lbl.ct.extension.period']}" value="#{centralContractBackingBean.managedBean.circularVer.extendPeriod}">
		             <p:ajax event="blur" process="@this" 
				        listener="#{centralContractBackingBean.extendStartEndDate()}" update=":form:popupButtonCal5,:form:popupButtonCal6"></p:ajax>
		           </p:inputText>
		           <p:spacer width="2" /> 
		           <p:outputLabel value="#{lbl['lbl.ct.months']}"/>
		        </h:panelGrid>
		     </td>
		     <td><p:outputLabel value="#{lbl['lbl.ct.circular.letter']}" />
		         <p:outputLabel value="*" styleClass="mandatory" />
		     </td>
		    <td><h:commandLink value="#{centralContractBackingBean.managedBean.circularVer.circularFileName}" styleClass="blue_font" 
				action="#{centralContractBackingBean.downloadFile(1)}" /></td>
		  </tr>
		  
		  <tr>
		    <td> <p:outputLabel value="#{lbl['lbl.ct.extension.start.date']}" /> </td>
		    <td>
		         <p:inputText value="#{centralContractBackingBean.managedBean.circularVer.extendStartDate}" id="popupButtonCal5" 
			             style="width:170px;" disabled="true">
			              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
		       </td>
		  
		    <td><p:outputLabel value="#{lbl['lbl.ct.extension.end.date']}" /></td>
		    <td>
		       <p:inputText value="#{centralContractBackingBean.managedBean.circularVer.extendEndDate}" id="popupButtonCal6" 
			             style="width:170px;" disabled="true">
			              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
		    </td>
		  </tr>  
	</table>
</ui:composition>
