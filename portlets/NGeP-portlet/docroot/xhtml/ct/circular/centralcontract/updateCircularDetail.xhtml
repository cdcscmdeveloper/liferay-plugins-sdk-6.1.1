<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	
	<table style="width: 100%" >
			<tr>
				<td style="width: 15%;" ><h:outputLabel value="#{lbl['lbl.ct.cc.cno']}" /></td>
				<td><p:inputText value="#{centralContractBackingBean.managedBean.circularVer.circularNo}" style="width:170px;"/></td>
				<td rowspan="2" valign="top" style="width: 15%;"><p:outputLabel  value="#{lbl['lbl.ct.cc.cname']}" /></td>
				<td rowspan="2"><p:inputTextarea rows="3"
						style="width:170px; margin-bottom:5px;"
						value="#{centralContractBackingBean.managedBean.circularVer.name}" />
				</td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.ct.cc.frno']}" /></td>
				<td><p:inputText  style="width:170px;"
						value="#{centralContractBackingBean.managedBean.circularVer.circularFileRefNo}" /></td>
			</tr>
			
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.ct.cc.csdate']}" /></td>
		        <td>
		           <p:calendar disabled="true"  value="#{centralContractBackingBean.managedBean.circularVer.startDate}"
			       pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal3" size="29" showOn="button"
			         style="margin-bottom:5px;" /></td>
		        <td><h:outputLabel value="#{lbl['lbl.ct.cc.cedate']}" /></td>
		        <td><p:calendar disabled="true" value="#{centralContractBackingBean.managedBean.circularVer.endDate}" 
			       pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" size="29" id="popupButtonCal4" showOn="button" /></td>
			</tr>
			
			<tr>
		    <td>
		      <h:outputLabel value="Extension Period" />
		        </td>
		    <td><h:panelGrid columns="3"  style="margin-top:5px;">
		           <p:inputText value="#{centralContractBackingBean.managedBean.circularVer.extendPeriod}" style="width:100px;"/>
		           <p:spacer width="2" /> 
		           <p:outputLabel value="Months"/></h:panelGrid></td>
		     <td><p:outputLabel value="#{lbl['lbl.ct.cc.upload']}" /></td>
		    <td><h:commandLink value="#{centralContractBackingBean.managedBean.circularVer.circularFileName}" styleClass="blue_font" 
				action="#{centralContractBackingBean.downloadFile(1)}" /></td>
		  </tr>
		  
		  <tr>
		    <td> <h:outputLabel value="Extension Start Date" /></td>
		    <td><p:calendar size="24" value="#{centralContractBackingBean.managedBean.circularVer.extendStartDate}" 
		       readonlyInput="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal5" showOn="button" /></td>
		    <td><h:outputLabel value="Extension End Date" /></td>
		    <td><p:calendar size="24" value="#{centralContractBackingBean.managedBean.circularVer.extendEndDate}" 
				readonlyInput="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal6" showOn="button" /></td>
		  </tr>  
	</table>
</ui:composition>
