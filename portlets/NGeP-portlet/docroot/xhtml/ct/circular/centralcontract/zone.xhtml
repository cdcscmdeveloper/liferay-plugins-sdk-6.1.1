<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<p:panel id="zonePnl" header="#{lbl['lbl.ct.panel.zone.contract.coverage']}" toggleable="true" toggleSpeed="500" 
		rendered="#{centralContractBackingBean.managedBean.circularVer.zonalLevel.parameterCode!=null}" >
		<table style="width=100%;">
			<tr>
				<td valign="top">
					<p:dataTable id="circularZoneDt" var="circularZoneVar" rowKey="#{circularZoneVar}"
						value="#{centralContractBackingBean.getCircularZoneList('C')}" selectionMode="single" 
						selection="#{centralContractBackingBean.managedBean.selectedCircularZone}" >
						<ac:paginator for="circularZoneDt" />
						<p:ajax event="rowSelect" update=":form:tabview:circularZoneDtlPnl,:form:tabview:deleteZoneBtn" 
							listener="#{centralContractBackingBean.selectZoneEvent()}" />
						<p:column headerText="#{lbl['lbl.ct.zone.name']}" style="width:250px;" >
							<p:inputText value="#{circularZoneVar.name}" style="width:250px;" maxlength="100" />
						</p:column>
						<p:column headerText="#{lbl['lbl.ct.delivery.term']}" style="width:150px;" >
							<p:inputText value="#{circularZoneVar.deliveryTerm}" maxlength="4" label="#{lbl['lbl.ct.delivery.term']}" />
						</p:column>						
					</p:dataTable>
					<p:spacer height="2" />
					<div class="ppRightBtn"> 
						<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="false" icon="ui-icon-add"
							action="#{centralContractBackingBean.addCircularZone('C')}" update="circularZoneDt" />
						<p:commandButton id="deleteZoneBtn" value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" onsuccess="delZoneDlg.show()" 
							disabled="#{centralContractBackingBean.managedBean.selectedCircularZone == null}" />				
					</div>		
					<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delZoneDlg"
						closable="true" appendToBody="true" >
						<h:panelGrid columns="2">
							<p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:tabview:deleteZoneBtn,:form:tabview:circularZoneDtlPnl,circularZoneDt" partialSubmit="true" process="@this"
								 action="#{centralContractBackingBean.deleteCircularZone('C')}" oncomplete="delZoneDlg.hide();"   /> 
							<p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="delZoneDlg.hide()" type="button" />
						</h:panelGrid>
					</p:confirmDialog>					
				</td>
				<td><p:spacer width="50px;" /></td>
				<td valign="top">
					<h:panelGroup id="circularZoneDtlPnl">
						<p:dataTable id="circularZoneDtlDt" var="circularZoneDtlsVar" rowKey="#{circularZoneDtlsVar}" rowIndexVar="index"
							value="#{centralContractBackingBean.managedBean.selectedCircularZone.ctCircularZoneDtls}" selectionMode="single" 
							selection="#{centralContractBackingBean.managedBean.selectedCircularZoneDtl}" >
							<ac:paginator for="circularZoneDtlDt" />
							<p:ajax event="rowSelect" update=":form:tabview:deleteZoneDtlBtn" />
							<p:column headerText="#{lbl['lbl.ct.location']}" style="width:450px;">
								<p:selectOneMenu value="#{circularZoneDtlsVar.state.stateId}" rendered="#{centralContractBackingBean.managedBean.circularVer.zonalLevel.parameterCode == ParameterConst.locationLevelState}">
									<p:ajax event="change" process="@this" />
									<f:selectItems value="#{centralContractBackingBean.getStateDropdownValues()}" />
								</p:selectOneMenu>			
								<ac:lov id="district" lovId="PM_DISTRICT" rendered="#{centralContractBackingBean.managedBean.circularVer.zonalLevel.parameterCode == ParameterConst.locationLevelDistrict}"
									headerText="#{lbl['lbl.ct.district']}" 
									saveObject="centralContractBackingBean.managedBean.selectedCircularZone.ctCircularZoneDtls[#{index}].district"
									value="#{circularZoneDtlsVar.district.districtName}"
									conditionField="recordStatus^1" /> 					
							</p:column>
						</p:dataTable>
						
						<p:spacer height="2" />
						<div class="ppRightBtn"> 
							<p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" partialSubmit="true" icon="ui-icon-add"
								disabled="#{centralContractBackingBean.managedBean.selectedCircularZone == null}"
								action="#{centralContractBackingBean.addCircularZoneDtl()}" update="circularZoneDtlDt" />	
							<p:commandButton id="deleteZoneDtlBtn" value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" onsuccess="delStateDlg.show()" 
								disabled="#{centralContractBackingBean.managedBean.selectedCircularZoneDtl == null}" />			
						</div>							
						<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delStateDlg"
							closable="true" appendToBody="true">
							<h:panelGrid columns="2">
								<p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:tabview:deleteZoneDtlBtn,circularZoneDtlDt" partialSubmit="true" process="@this"
									 action="#{centralContractBackingBean.deleteCircularZoneDtl()}" oncomplete="delStateDlg.hide();"   /> 
								<p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="delStateDlg.hide()" type="button" />
							</h:panelGrid>
						</p:confirmDialog>	
					</h:panelGroup>				
				</td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel id="itemZonePnl" header="#{lbl['lbl.ct.panel.zone.item.price']}" toggleable="true" toggleSpeed="500" 
		rendered="#{centralContractBackingBean.managedBean.circularVer.itemZonalLevel.parameterCode!=null}" >
		<table style="width:100%;">
			<tr>
				<td valign="top">
					<p:dataTable id="itemZoneDt" var="itemZoneVar" rowKey="#{itemZoneVar}"
						value="#{centralContractBackingBean.getCircularZoneList('I')}" selectionMode="single" 
						selection="#{centralContractBackingBean.managedBean.selectedItemZone}" >
						<ac:paginator for="itemZoneDt" />
						<p:ajax event="rowSelect" update=":form:tabview:itemZoneDtlPnl,:form:tabview:deleteItemZoneBtn" 
							listener="#{centralContractBackingBean.selectItemZoneEvent()}" />
						<p:column headerText="#{lbl['lbl.ct.zone.name']}" style="width:370px;" >
							<p:inputText value="#{itemZoneVar.name}" style="width:400px;" />
						</p:column>			
					</p:dataTable>
					<p:spacer height="2" />
					<div class="ppRightBtn"> 
						<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="false" icon="ui-icon-add"
							action="#{centralContractBackingBean.addCircularZone('I')}" update="itemZoneDt" />
						<p:commandButton id="deleteItemZoneBtn" value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" onsuccess="delItemZoneDlg.show()" 
							disabled="#{centralContractBackingBean.managedBean.selectedItemZone == null}" />				
					</div>		
					<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delItemZoneDlg"
						closable="true" appendToBody="true">
						<h:panelGrid columns="2">
							<p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:tabview:deleteItemZoneBtn,:form:tabview:itemZoneDtlPnl,itemZoneDt" partialSubmit="true" process="@this"
								 action="#{centralContractBackingBean.deleteCircularZone('I')}" oncomplete="delItemZoneDlg.hide();"   /> 
							<p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="delItemZoneDlg.hide()" type="button" />
						</h:panelGrid>
					</p:confirmDialog>					
				</td>
				<td><p:spacer width="50px;" /></td>
				<td valign="top">
					<h:panelGroup id="itemZoneDtlPnl">
						<p:dataTable id="itemZoneDtlDt" var="itemZoneDtVar" rowKey="#{itemZoneDtVar}" rowIndexVar="index"
							value="#{centralContractBackingBean.managedBean.selectedItemZone.ctCircularZoneDtls}" selectionMode="single" 
							selection="#{centralContractBackingBean.managedBean.selectedItemZoneDtl}" >
							<ac:paginator for="itemZoneDtlDt" />
							<p:ajax event="rowSelect" update=":form:tabview:deleteItemZoneDtlBtn" />
							<p:column headerText="#{lbl['lbl.ct.location']}" style="width:400px;">
								<p:selectOneMenu value="#{itemZoneDtVar.state.stateId}" rendered="#{centralContractBackingBean.managedBean.circularVer.itemZonalLevel.parameterCode == ParameterConst.locationLevelState}">
									<p:ajax event="change" process="@this" />
									<f:selectItems value="#{centralContractBackingBean.getStateDropdownValues()}" />
								</p:selectOneMenu>			
								<ac:lov id="item_district" lovId="PM_DISTRICT" rendered="#{centralContractBackingBean.managedBean.circularVer.itemZonalLevel.parameterCode == ParameterConst.locationLevelDistrict}"
									headerText="#{lbl['lbl.ct.district']}" 
									saveObject="centralContractBackingBean.managedBean.selectedItemZone.ctCircularZoneDtls[#{index}].district"
									value="#{itemZoneDtVar.district.districtName}"
									conditionField="recordStatus^1" /> 					
							</p:column>
						</p:dataTable>
						
						<p:spacer height="2" />
						<div class="ppRightBtn"> 
							<p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" partialSubmit="true" icon="ui-icon-add"
								disabled="#{centralContractBackingBean.managedBean.selectedItemZone == null}"
								action="#{centralContractBackingBean.addItemZoneDtl()}" update="itemZoneDtlDt" />	
							<p:commandButton id="deleteItemZoneDtlBtn" value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" onsuccess="delItemZoneDtlDlg.show()" 
								disabled="#{centralContractBackingBean.managedBean.selectedItemZoneDtl == null}" />			
						</div>							
						<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delItemZoneDtlDlg"
							closable="true" appendToBody="true" >
							<h:panelGrid columns="2">
								<p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:tabview:deleteItemZoneDtlBtn,itemZoneDtlDt" partialSubmit="true" process="@this"
									 action="#{centralContractBackingBean.deleteItemZoneDtl()}" oncomplete="delItemZoneDtlDlg.hide();"   /> 
								<p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="delItemZoneDtlDlg.hide()" type="button" />
							</h:panelGrid>
						</p:confirmDialog>	
					</h:panelGroup>				
				</td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{centralContractBackingBean.managedBean.circularVer.zoneRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{centralContractBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
