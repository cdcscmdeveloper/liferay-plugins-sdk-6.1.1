<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/circular/shared/sidemenu/central.xhtml" />
	</ui:define>
	<ui:define name="content">
	   <p:panel id="pRightPanel">
		 <div class="ppRightBtn">
				<p:commandButton id="ctSave" value="#{lbl['lbl.ct.btn.save']}"/>
				<p:commandButton id="ctSubmit" value="#{lbl['lbl.ct.btn.submit']}"/>
		 </div>
	   </p:panel>
       <p:panel id="settingId" header="Approver Setting"  toggleable="true"  toggleSpeed="500" widgetVar="panelsetting">
       <h:panelGrid columns="2">
           <h:outputLabel for="days" value="Days To Approved" styleClass="txtsize" />
           <h:panelGrid columns="2">
              <h:panelGroup>
				 <div style="height: 200px; width:150px; vertical-align: top; text-align: left">
                   <h:outputLabel for="approver" value="Select Approver" styleClass="txtsize"/>
                 </div>
              </h:panelGroup>
			  <h:panelGrid style="width:500px">
			  <p:pickList id="approverpickList" value="#{centralBackingBean.managedBean.approverSetting.settingDetails}" var="data"  
                itemValue="#{data}" itemLabel="#{data.aproverName}" 
                showTargetControls="true"  filterMatchMode="contains" >  
                <p:ajax event="transfer" listener="#{centralBackingBean.managedBean.approverSetting.onTransfer}"  />  
                <p:column style="width:75%;">  
                  <h:outputText value="#{data.aproverName}" styleClass="txtsize" />
                </p:column>  
              </p:pickList>  
             </h:panelGrid>
			</h:panelGrid>
          </p:panel>
        </ui:define>
</ui:composition>
