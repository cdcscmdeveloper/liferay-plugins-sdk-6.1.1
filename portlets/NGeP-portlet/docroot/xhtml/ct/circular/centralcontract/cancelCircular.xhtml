<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="resourceSection">
	</ui:define>
    <ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/circular/shared/sidemenu/central.xhtml" />
	</ui:define>
    <ui:define name="content">
	   <p:panel id="pRightPanel">
			<div class="ppRightBtn">
				<p:commandButton id="ctSave" value="#{lbl['lbl.ct.btn.save']}"/>
				<p:commandButton id="ctSubmit" value="#{lbl['lbl.ct.btn.submit']}"/>
			</div>
		</p:panel>
        <p:panel id="concelCircular" header="Cancel Circular"  toggleable="true"  toggleSpeed="500" widgetVar="panelconcelCircular">
           <h:panelGrid style="width:800px;">  
                                  <p:dataTable id="dataTable" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
                                  rowIndexVar="index"
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							                <p:columnGroup type="header"> 
								                <p:row> 
									                     <p:column colspan="1" style="width:30px" headerText="Seq No"  /> 
									                     <p:column colspan="1"  style="width:100px" headerText="Circular No" /> 
									                     <p:column colspan="1"  style="width:200px" headerText="Circular Name" /> 	
									                     <p:column colspan="1" style="width:100px" headerText="Circular Type"  /> 
									                     <p:column colspan="1" style="width:80px" headerText="Contract Start"  />  
									                     <p:column colspan="1" style="width:80px" headerText="Contract End"  /> 
									                     <p:column colspan="1" style="width:80px" headerText="Action"  />    
								               </p:row>	
								               </p:columnGroup>
							                   	<p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
							                     <p:column> </p:column>
							                     <p:column></p:column>	
							                      <p:column> </p:column>
							                     <p:column></p:column>	
							                      <p:column> </p:column>
							                     <p:column styleClass="column-align-center">
								                 <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
								                 icon="ui-icon-delete" styleClass="ui-icon-button"/>
							                     </p:column> 
						   </p:dataTable>
						   </h:panelGrid>
						   <h:panelGrid style="width:800px" columnClasses="column-align-right">
							  <p:commandButton value="Add" styleClass="text-align: right;" process="@this" partialSubmit="true" icon="ui-icon-add" 
							  onclick="dlg2.show();"/>
						   </h:panelGrid>
                       </p:panel>
                       <p:panel id="centralContractList" header="Contract List"  toggleable="true"  toggleSpeed="500" widgetVar="panelcentralCircular">
                       <h:panelGrid style="width:800px;">  
                                  <p:dataTable id="dataTable1" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
                                  rowIndexVar="index"
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							                <p:columnGroup type="header"> 
								                <p:row> 
									                   <p:column colspan="1" style="width:30px" headerText="Seq No"  /> 
									                     <p:column colspan="1"  style="width:100px" headerText=" Contract No" /> 
									                     <p:column colspan="1"  style="width:120px" headerText="Contract Name" /> 	
									                     <p:column colspan="1" style="width:100px" headerText="LOA No"  /> 
									                     <p:column colspan="1" style="width:100px" headerText="Supplier"  /> 
									                     <p:column colspan="1" style="width:80px" headerText="Status"  />  
									                     <p:column colspan="1" style="width:80px" headerText="Contract Start"  /> 
									                      <p:column colspan="1" style="width:80px" headerText="Contract End"  /> 
									                     <p:column colspan="1" style="width:80px" headerText="Action"  />    
								               </p:row>	
								              </p:columnGroup>
							                   <p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
							                     <p:column> </p:column>
							                     <p:column></p:column>	
							                      <p:column> </p:column>
							                     <p:column></p:column>	
							                      <p:column></p:column>	
							                      <p:column> </p:column>
							                        <p:column> </p:column>
							                     <p:column styleClass="column-align-center">
								                 <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
								                 icon="ui-icon-delete" styleClass="ui-icon-button"/>
							                     </p:column> 
						 </p:dataTable>
				       </h:panelGrid>
					</p:panel>
                    <p:panel id="attachements" header="Remarks And Attachments"  toggleable="true"  toggleSpeed="500" widgetVar="panelattachements">
                     </p:panel>
                	<p:confirmDialog message="Do you want to delete the record?"
							closable="true" appendToBody="true" header="Delete Confirmation"
							severity="alert" widgetVar="confirmation">

							<h:panelGrid columns="2"
								columnClasses="column-align-right-50,column-align-left">
								<p:commandButton value="Yes" 
									update="dataTable" partialSubmit="true" process="@this"
									onclick="confirmation.hide();"/>
								<p:commandButton value="No" 
									onclick="confirmation.hide()" type="button" />
							</h:panelGrid>
						</p:confirmDialog>
				<p:dialog id="modalDialog" header="Circular List" widgetVar="dlg2" modal="true" width="800" height="400">
				     <p:panel  id="circularList">
                     	<p:dataTable id="dataTable2" var="data" value="#{centralBackingBean.centralCircularContract}" rowIndexVar="index" widgetVar="dataTableObj"
                         lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" 
                         emptyMessage="No Records!" rows="10"  rowsPerPageTemplate="5,10,15,20" 
                         selection="#{centralBackingBean.selectedCentralContractList}" rowKey="#{data.circularNo}"
                         currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
                         paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
                			<p:column selectionMode="multiple" style="width:18px" />
							<p:column headerText="Circular No">
									<h:outputText value="C00992394234" />
							</p:column>
                            <p:column headerText="Circular Name">
								<h:outputText value="Bekalan Pen Bebola" />
							</p:column>
                            <p:column headerText="Circular Type">
								<h:outputText value="LOA 325/2012" />
							</p:column>
							<p:column headerText="Period (Start)">
								<h:outputText value="01-DEC-2012" />
							</p:column>
                            <p:column headerText="Period (End)">
								<h:outputText value="LOA 325/2012" />
							</p:column>
					</p:dataTable>
                  	<f:facet name="footer">
							<h:panelGrid columns="2"  style="height: 40px;vertical-align: middle;">
								<p:commandButton value="Select" icon="ui-icon-select"  process="modalDialog" update="dataTable" onclick="dlg2.hide();"/>
                            		<p:commandButton value="Cancel"  type="button" ajax="false" onclick="dlg2.hide();" />
                            			</h:panelGrid>
						</f:facet>
                    </p:panel>
				</p:dialog>
			</ui:define>
</ui:composition>
