<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<p:panel id="contractListPnl" header="#{lbl['lbl.ct.cc.ct']}" toggleable="true" toggleSpeed="500">
	   <p:dataTable id="centralContractDt" var="data" rowIndexVar="index" 
		  value="#{centralContractBackingBean.managedBean.circularVer.ctCircularContracts}" 
		  lazy="true" selectionMode="single" selection="#{centralContractBackingBean.managedBean.selectedCircularContract}" rowKey="#{data}">
		  <ac:paginator for="centralContractDt" />
		  <p:ajax event="rowSelect" update="@([id$=circularItemsPanel],[id$=deleteContractBtn])" process="@this"/>			
			 <p:column headerText="#{lbl['lbl.ct.cc.phyloa']}" >
				<h:outputText value="#{data.ctContract.loaPhysicalNo}" />
			 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.cc.phyCno']}" >
				<h:outputText value="#{data.ctContract.contractPhysicalNo}" />
			 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.cc.ctname']}" >
				<h:outputText value="#{data.ctContract.contractName}" />
			 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.cc.sup']}" >
				<h:outputText value="#{data.ctContract.smSupplier.companyName}" />
			 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.cc.ctsdate']}" >
				<h:outputText value="#{data.ctContract.latestContractVer.ctContractValue.effDate}" >
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.cc.ctedate']}" >
				<h:outputText value="#{data.ctContract.latestContractVer.ctContractValue.expDate}" >
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			 </p:column>
			 <p:column headerText="Status">
				<p:selectOneMenu  value="#{data.recordStatusFlg}" style="width:70px;">
				  <f:selectItem itemValue="0" itemLabel="Inactive" />
			      <f:selectItem itemValue="1" itemLabel="Active" />
			    </p:selectOneMenu>
			 </p:column>			
		 </p:dataTable>
		 <p:spacer height="2" />
		 <div class="ppRightBtn"> 
			<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add" oncomplete="contractDlg.show();" 
				actionListener="#{centralContractBackingBean.addCircularContractListener()}" update="contractDlg" />
			<p:commandButton id="deleteContractBtn" value="Delete" process="@form" partialSubmit="true" icon="ui-icon-delete"
				disabled="#{centralContractBackingBean.managedBean.selectedCircularContract == null}"
				action="#{centralContractBackingBean.deleteCircularContract()}" update="centralContractDt,popupButtonCal,popupButtonCal1" />				
		</div>
		
		<p:spacer height="20" />
		<p:outputPanel id="circularItemsPanel">
		 <h:panelGroup rendered="#{centralContractBackingBean.managedBean.selectedCircularContract != null}">
		  <p:dataTable id="circularItemDt" var="itemVar" 
		    value="#{centralContractBackingBean.managedBean.selectedCircularContract.ctContract.latestContractVer.ctContractItems}"
		   lazy="true" selectionMode="single" selection="#{centralContractBackingBean.managedBean.selectedCircularItem}" rowKey="#{itemVar}">
		   <ac:paginator for="circularItemDt" />
		   <p:ajax event="rowSelect" update="@([id$=circularZonePanel])" process="@this"/>
			  <p:column headerText="Item Name" style="width:450px;">
				<h:outputText value="#{itemVar.itemName}" style="width:450px;" />
			  </p:column>
			  <p:column headerText="Minimum Order Qty." style="width:150px;" >
				<p:inputText value="#{itemVar.minimumOrderQty}" />
			  </p:column>	
			  <p:column headerText="Had Pembelian Luar Kontrak" style="width:150px;">
				<p:inputText value="#{itemVar.maxProcureAmt}" />
			  </p:column>	
			  <p:column headerText="Status">
				<p:selectOneMenu  value="#{itemVar.recordStatusFlg}" style="width:70px;">
				   <f:selectItem itemValue="0" itemLabel="Inactive" />
			       <f:selectItem itemValue="1" itemLabel="Active" />
			    </p:selectOneMenu>
			  </p:column>								
		</p:dataTable>
		</h:panelGroup>
		</p:outputPanel>
		<p:spacer height="20" />
		<p:outputPanel id="circularZonePanel">		
		  <h:panelGroup rendered="#{centralContractBackingBean.managedBean.selectedCircularItem != null 
		    and centralContractBackingBean.managedBean.selectedCircularItem.ctItemPrices != null
		    and centralContractBackingBean.managedBean.selectedCircularItem.ctItemPrices.size() > 0}">
		    <p:dataTable id="circularItemZoneDt" var="zoneVar" value="#{centralContractBackingBean.contractItemZones}"
		      selectionMode="single" selection="#{centralContractBackingBean.managedBean.selectedItemsZone}" rowKey="#{zoneVar}">
		      <ac:paginator for="circularItemZoneDt" />
		      <p:ajax event="rowSelect" update="@([id$=circularPricePanel])" process="@this"/>
		         <p:column headerText="Zone" style="width:60%;">
			    	<h:outputText value="#{zoneVar.zoneName}" style="width:50%;" />
			     </p:column>	
			     <p:column headerText="Action" style="width:40%;">
			     </p:column>							
		</p:dataTable>
		</h:panelGroup>
		</p:outputPanel>
		<p:spacer height="20" />
		<p:outputPanel id="circularPricePanel">		
		  <h:panelGroup rendered="#{centralContractBackingBean.managedBean.selectedItemsZone != null}">	
		<p:dataTable id="circularItemZonePriceDt" var="priceVar" 
		   value="#{centralContractBackingBean.managedBean.selectedItemsZone.ctItemPrices}">
		   <ac:paginator for="circularItemZonePriceDt" />
			  <p:column headerText="From Qty." style="width:30%;">
			 	<h:outputText value="#{priceVar.fromQty}" style="width:50%;" />
			  </p:column>
			  <p:column headerText="To Qty." style="width:30%;">
			    <h:outputText value="#{priceVar.toQty}" style="width:50%;" />
			  </p:column>
			  <p:column headerText="Unit Price (RM)" style="width:30%;">
			   	 <h:outputText value="#{priceVar.unitPrice}" style="width:50%;" />
			  </p:column>
		</p:dataTable>
		</h:panelGroup>
		</p:outputPanel>
	   </p:panel>
	   
	   <p:dialog id="contractDlg" header="Contract List" widgetVar="contractDlg" modal="true" width="750" height="400">
		<p:panel id="listOfContract">
			<h:panelGrid columns="6">
				<h:outputText value="Contract No."/>
				<p:inputText id="contractNo" value="#{centralContractBackingBean.managedBean.searchContractNo}" />
				<p:spacer width="10" />
				<h:outputText value="Contract Name"/>
				<p:inputText id="contractName" value="#{centralContractBackingBean.managedBean.searchContractName}" />
				<p:commandButton value="Search" process="contractDlg,contractNo,contractName"
					icon="ui-icon-search" update="contractDt"
					actionListener="#{centralContractBackingBean.searchContract()}"  />
			</h:panelGrid>
			<p:dataTable id="contractDt" var="data"	rowIndexVar="index" rowKey="#{data.contractId}" lazy="true"  paginator="true" 
				value="#{centralContractBackingBean.managedBean.contractList}"
				selection="#{centralContractBackingBean.managedBean.selectedContractList}" >
				<ac:paginator for="contractDt" />
				<p:column selectionMode="multiple" style="width:3%;" />
				<p:column headerText="{lbl['lbl.ct.cc.phyloa']}">
					<h:outputText value="#{data.loaPhysicalNo}" />
				</p:column>
				 <p:column headerText="#{lbl['lbl.ct.cc.phyCno']}" >
				<h:outputText value="#{data.contractPhysicalNo}" />
			 </p:column>
			 <p:column headerText="Contract No">
					<h:outputText value="#{data.contractNo}" />
				</p:column>
			 <p:column headerText="#{lbl['lbl.ct.cc.sup']}" >
				<h:outputText value="#{data.smSupplier.companyName}" />
			 </p:column>
			</p:dataTable>
			<p:spacer height="2" />
			<div class="ppRightBtn"> 
				<p:commandButton value="Select" process="contractDlg" icon="ui-icon-accept"
					action="#{centralContractBackingBean.addSelectedContract}"
					update="centralContractDt,popupButtonCal,popupButtonCal1" onclick="contractDlg.hide();" />
				<p:commandButton value="Cancel" icon="ui-icon-cancel" type="button" ajax="false" onclick="contractDlg.hide();" />
			</div>	
		</p:panel>
	</p:dialog>
	
	<p:panel header="#{lbl['lbl.ct.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{centralContractBackingBean.managedBean.circularVer.itemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{centralContractBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
