<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<p:panel id="contractListPnl" header="#{lbl['lbl.ct.cc.ct']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="centralContractDt" var="data" lazy="true" rowIndexVar="index" rowKey="#{data}"
			value="#{centralContractBackingBean.managedBean.circularVer.ctCircularContracts}" selectionMode="single"
			selection="#{centralContractBackingBean.managedBean.selectedCircularContract}" >
			<ac:paginator for="centralContractDt" />
			<p:ajax event="rowSelect" 
				update=":form:tabview:circularItemDt,:form:tabview:circularItemPriceDt,:form:tabview:deleteContractBtn" 
				listener="#{centralContractBackingBean.selectCcrContractEvent()}" />			
			<p:column headerText="#{lbl['lbl.ct.cc.ctno']}" >
				<h:commandLink value="#{data.ctContract.latestContractVer.ctContractValue.contractPhysicalNo}" styleClass="blue_font" 
					onclick="alert('Development in progress');" immediate="true" /> 
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.ctname']}" >
				<h:outputText value="#{data.ctContract.contractName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.loa']}" >
				<h:outputText value="#{data.ctContract.loaNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.sup']}" >
				<h:outputText value="#{data.ctContract.smSupplier.companyName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.ctsdate']}" >
				<h:outputText value="#{data.ctContract.latestContractVer.ctContractValue.effDate}" >
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.ctedate']}" >
				<h:outputText value="#{data.ctContract.latestContractVer.ctContractValue.expDate}" >
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Zone" rendered="#{centralContractBackingBean.managedBean.circularVer.zonalLevel.parameterCode!=null}" >
				<p:selectOneMenu value="#{data.ctCircularZone.objectId}">
					<p:ajax event="change" process="@this" />
					<f:selectItems value="#{centralContractBackingBean.getCircularZoneDropdown('C')}" />
				</p:selectOneMenu>
			</p:column>			
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add" oncomplete="contractDlg.show();" 
				actionListener="#{centralContractBackingBean.addCircularContractListener()}" update="contractDlg" />
			<p:commandButton id="deleteContractBtn" value="Delete" process="@form" partialSubmit="true" icon="ui-icon-delete"
				disabled="#{centralContractBackingBean.managedBean.selectedCircularContract == null}"
				action="#{centralContractBackingBean.deleteCircularContract()}" update="centralContractDt,popupButtonCal,popupButtonCal1" />				
		</div>
		<p:spacer height="20" />
		<p:dataTable id="circularItemDt" var="data" rowKey="#{data}" lazy="true" 
			value="#{centralContractBackingBean.managedBean.selectedCircularContract.ctCircularItems}" selectionMode="single" 
			selection="#{centralContractBackingBean.managedBean.selectedCircularItem}" >
			<ac:paginator for="circularItemDt" />
			<p:ajax event="rowSelect" update=":form:tabview:circularItemPriceDt" 
				listener="#{centralContractBackingBean.selectCircularItemEvent()}" />
			<p:column headerText="Item Name" >
				<h:outputText value="#{data.itemName}" style="width:200px;" />
			</p:column>
			<p:column headerText="Minimum Order Qty." >
				<p:inputText value="#{data.minimumOrderQty}" />
			</p:column>	
			<p:column headerText="Had Pembelian Luar Kontrak" >
				<p:inputText value="#{data.maxProcureAmount}" />
			</p:column>						
		</p:dataTable>
		<p:spacer height="20" />		
		<p:dataTable id="circularItemPriceDt" var="data" rowKey="#{data}" lazy="true" 
			value="#{centralContractBackingBean.managedBean.selectedCircularItem.ctCircularItemPrices}" selectionMode="single" 
			selection="#{centralContractBackingBean.managedBean.selectedCircularItemPrice}" >
			<ac:paginator for="circularItemPriceDt" />
			<p:ajax event="rowSelect" update=":form:tabview:deleteCircularItemPriceBtn" />
			<p:column headerText="Zone" rendered="#{centralContractBackingBean.managedBean.circularVer.itemZonalLevel.parameterCode!=null}" >
				<p:selectOneMenu value="#{data.ctCircularZone.objectId}">
					<p:ajax event="change" process="@this" />
					<f:selectItems value="#{centralContractBackingBean.getCircularZoneDropdown('I')}" />
				</p:selectOneMenu>				
			</p:column>
			<p:column headerText="Tier From" >
				<p:inputText value="#{data.tierFrom}" />
			</p:column>	
			<p:column headerText="Tier To" >
				<p:inputText value="#{data.tierTo}" />
			</p:column>
			<p:column headerText="Unit Price" >
				<p:inputText value="#{data.unitPrice}" />
			</p:column>										
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn">
			<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add"
				disabled="#{centralContractBackingBean.managedBean.selectedCircularItem == null}"
				action="#{centralContractBackingBean.addCircularItemPrice()}" update="circularItemPriceDt" />	
			<p:commandButton id="deleteCircularItemPriceBtn" value="Delete" icon="ui-icon-delete" 
				disabled="#{centralContractBackingBean.managedBean.selectedCircularItemPrice == null}"
				action="#{centralContractBackingBean.deleteCircularItemPrice()}" update="circularItemPriceDt" />						
		</div>				
		<p:spacer height="20" />		
	</p:panel>
	
	<p:dialog id="contractDlg" header="Contract List" widgetVar="contractDlg" modal="true" width="750" height="400">
		<p:panel id="listOfContract">
			<h:panelGrid columns="6">
				<h:outputText value="Contract No."/>
				<p:inputText id="contractNo" value="#{centralContractBackingBean.managedBean.searchContractNo}" />
				<p:spacer width="10" />
				<h:outputText value="Contract Name"/>
				<p:inputText id="contractName" value="#{centralContractBackingBean.managedBean.searchContractName}" />
				<p:commandButton value="Search" process="contractDlg,contractNo,contractName"
					icon="ui-icon-search" update="contractDt"
					actionListener="#{centralContractBackingBean.searchContract()}"  />
			</h:panelGrid>
			<p:dataTable id="contractDt" var="data"	rowIndexVar="index" rowKey="#{data.contractId}" lazy="true"  paginator="true" 
				value="#{centralContractBackingBean.managedBean.contractList}"
				selection="#{centralContractBackingBean.managedBean.selectedContractList}" >
				<ac:paginator for="contractDt" />
				<p:column selectionMode="multiple" style="width:3%;" />
				<p:column headerText="Contract No">
					<h:outputText value="#{data.latestContractVer.ctContractValue.contractPhysicalNo}" />
				</p:column>
				<p:column headerText="Contract Name">
					<h:outputText value="#{data.contractName}" />
				</p:column>
				<p:column headerText="LOA No">
					<h:outputText value="#{data.loaNo}" />
				</p:column>
				<p:column headerText="Contract Start">
					<h:outputText value="#{data.latestContractVer.ctContractValue.effDate}" >
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
				<p:column headerText="Contract End">
					<h:outputText value="#{data.latestContractVer.ctContractValue.expDate}" >
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
			</p:dataTable>
			<p:spacer height="2" />
			<div class="ppRightBtn"> 
				<p:commandButton value="Select" process="contractDlg" icon="ui-icon-accept"
					action="#{centralContractBackingBean.addSelectedContract}"
					update="centralContractDt,popupButtonCal,popupButtonCal1" onclick="contractDlg.hide();" />
				<p:commandButton value="Cancel" icon="ui-icon-cancel" type="button" ajax="false" onclick="contractDlg.hide();" />
			</div>	
		</p:panel>
	</p:dialog>
	
	<p:panel header="#{lbl['lbl.ct.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{centralContractBackingBean.managedBean.circularVer.itemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{centralContractBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
