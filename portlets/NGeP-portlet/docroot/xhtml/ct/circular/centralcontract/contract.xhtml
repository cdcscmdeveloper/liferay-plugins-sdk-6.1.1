<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <p:panel id="contractListPnl" header="#{lbl['lbl.ct.cc.ct']}" toggleable="true" toggleSpeed="500">
	   <p:dataTable id="centralContractDt" var="data" rowIndexVar="index" 
		   value="#{centralContractBackingBean.managedBean.circularVer.ctCircularContracts}" 
		   lazy="true" selectionMode="single" selection="#{centralContractBackingBean.managedBean.selectedCircularContract}" rowKey="#{data}">
		   <ac:paginator for="centralContractDt" />
		   <p:ajax event="rowSelect" update="@([id$=circularItemsPanel],[id$=deleteContractBtn],[id$=circularZonePanel],[id$=circularPricePanel])"
		     process="@this"  listener="#{centralContractBackingBean.setContractListner()}"/>			
			 <p:column headerText="#{lbl['lbl.ct.cc.phyloa']}" > <h:outputText value="#{data.ctContract.loaPhysicalNo}" /></p:column>
			 <p:column headerText="#{lbl['lbl.ct.cc.phyCno']}" > <h:outputText value="#{data.ctContract.contractPhysicalNo}" /></p:column>
			 <p:column headerText="#{lbl['lbl.ct.cc.ctname']}" ><h:outputText value="#{data.ctContract.contractName}" /> </p:column>
			 <p:column headerText="#{lbl['lbl.ct.cc.sup']}" ><h:outputText value="#{data.ctContract.smSupplier.companyName}" /></p:column>
			 <p:column headerText="#{lbl['lbl.ct.cc.ctsdate']}" ><h:outputText value="#{data.ctContract.latestContractVer.ctContractValue.effDate}" >
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText> </p:column>
			 <p:column headerText="#{lbl['lbl.ct.cc.ctedate']}" ><h:outputText value="#{data.ctContract.latestContractVer.ctContractValue.expDate}" >
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText> </p:column>
			 <p:column headerText="Status">
				<p:selectOneMenu  value="#{data.recordStatusFlg}" style="width:70px;">
				  <f:selectItem itemValue="0" itemLabel="Inactive" />
			      <f:selectItem itemValue="1" itemLabel="Active" />
			    </p:selectOneMenu>
			 </p:column>			
		 </p:dataTable>
		 <p:spacer height="2" />
		 <div class="ppRightBtn"> 
			<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add" oncomplete="contractDlg.show();" 
				actionListener="#{centralContractBackingBean.addCircularContractListener()}" update="contractDlg" />
			<p:commandButton id="deleteContractBtn" value="Delete" process="@all" partialSubmit="true" icon="ui-icon-delete"
				disabled="#{centralContractBackingBean.managedBean.selectedCircularContract == null}"
				action="#{centralContractBackingBean.deleteCircularContract()}" update="@([id$=contractListPnl])"/>				
		</div>
		
		<p:spacer height="20" />
		<p:outputPanel id="circularItemsPanel">
		 <h:panelGroup rendered="#{centralContractBackingBean.managedBean.selectedCircularContract != null and
		   centralContractBackingBean.managedBean.selectedCircularContract.ctCircularItems.size() > 0}">
		  <p:outputLabel value="#{lbl['lbl.ct.cc.sublabel.item']}" style="float:left; font-weight:bold; padding-top:5px;"/>
		  <p:dataTable id="circularItemDt" var="itemVar" 
		      value="#{centralContractBackingBean.managedBean.selectedCircularContract.ctCircularItems}"
		      lazy="true" selectionMode="single" selection="#{centralContractBackingBean.managedBean.selectedCircularItem}" rowKey="#{itemVar}">
		      <ac:paginator for="circularItemDt" />
		        <p:ajax event="rowSelect"  update="@([id$=circularZonePanel],[id$=circularPricePanel])" process="@this"
		           listener="#{centralContractBackingBean.setZoneListener()}"/>
			       <p:column headerText="Item Name" style="width:450px;"><h:outputText value="#{itemVar.ctContractItem.itemName}" style="width:450px;" /></p:column>
			       <p:column headerText="Minimum Order Qty." style="width:150px;" ><p:inputText value="#{itemVar.minimumOrderQty}" /> </p:column>	
			       <p:column headerText="Nilai Pesanan Minimum (RM)"> <p:inputText value="#{itemVar.minimumOrderAmt}" />   </p:column>
			       <p:column headerText="Had Pembelian Luar Kontrak" style="width:150px;"><p:inputText value="#{itemVar.maxProcureAmt}" /></p:column>	
			       <p:column headerText="Status">
			     	<p:selectOneMenu  value="#{itemVar.recordStatusFlg}" style="width:70px;">
				        <f:selectItem itemValue="0" itemLabel="Inactive" />
			            <f:selectItem itemValue="1" itemLabel="Active" />
			        </p:selectOneMenu>
			       </p:column>								
		    </p:dataTable>
		</h:panelGroup>
    </p:outputPanel>
    
    <p:spacer height="40" />
		<p:outputPanel id="circularZonePanel">		
		  <h:panelGroup rendered="#{centralContractBackingBean.managedBean.selectedCircularItem != null
		     and centralContractBackingBean.managedBean.chkItemZone}">
		     <p:outputLabel value="#{lbl['lbl.ct.cc.sublabel.zone']}" style="float:left; font-weight:bold; padding-top:25px;"/>
		     <p:dataTable id="circularItemZoneDt" var="dataZone" value="#{centralContractBackingBean.managedBean.contractItemZones}"
		       lazy="true" selection="#{centralContractBackingBean.managedBean.selectedZoneItems}" 
		       selectionMode="single" rowKey="#{dataZone}" rowIndexVar="index">
		       <ac:paginator for="circularItemZoneDt" />
		       <p:ajax event="rowSelect" update="@([id$=circularPricePanel])"  process="@this"
		           listener="#{centralContractBackingBean.setPriceListener()}"/>
		           <p:column headerText="Zone" style="width:60%;"><h:outputText value="#{dataZone.zoneName}" style="width:50%;" /> </p:column>	
			    	 <p:column headerText="Action" style="width:40%;"> 
			    	 <p:commandLink update="@([id$=itemZoneId])"
			         oncomplete="itemZoneDlg.show();" immediate="true">
			          <p:graphicImage library="ep/images/design" name="document.png"
			          value="/resources/ep/images/design/document.png" title="View"></p:graphicImage>
                 	</p:commandLink>
			     </p:column>			
		     </p:dataTable>
		   </h:panelGroup>
		</p:outputPanel>
    
    <p:spacer height="40" />
		<p:outputPanel id="circularPricePanel">	
		   <h:panelGroup rendered="#{centralContractBackingBean.managedBean.chkItemPrice and  
		    centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.ctItemPrices != null 
		    and centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.ctItemPrices.size() > 0}">
		   <p:outputLabel value="#{lbl['lbl.ct.cc.sublabel.price']}" style="float:left; font-weight:bold; padding-top:25px;"/>
		   <p:dataTable id="circularItemZonePriceDt" var="priceVar" 
		   value="#{centralContractBackingBean.getItemPrice()}">
		   <ac:paginator for="circularItemZonePriceDt" />
			  <p:column headerText="From Qty." style="width:30%;">
			 	<h:outputText value="#{priceVar.fromQty}" style="width:50%;" />
			  </p:column>
			  <p:column headerText="To Qty." style="width:30%;">
			    <h:outputText value="#{priceVar.toQty}" style="width:50%;" />
			  </p:column>
			  <p:column headerText="Unit Price (RM)" style="width:30%;">
			   	 <h:outputText value="#{priceVar.unitPrice}" style="width:50%;" />
			  </p:column>
		</p:dataTable>
		</h:panelGroup>
		</p:outputPanel>
	  
	  <p:dialog id="itemZoneDlg" header="Zone Details" widgetVar="itemZoneDlg" modal="true" width="350" height="200">
	  <p:outputPanel id="itemZoneId">
	     <p:treeTable id="itemZoneDt"  value="#{centralContractBackingBean.managedBean.centralZoneTrees}"
 		    var="zoneTree">
 		    <p:column style="width:70%;">
            <f:facet name="header">  Location Name </f:facet>
              <p:treeNode type="zone">
                  <h:outputText value="#{zoneTree.zone}"/>
              </p:treeNode>
              <p:treeNode type="state">
               <h:outputText value="#{zoneTree.state.stateName}"  />
              </p:treeNode>
              <p:treeNode type="district">
               <h:outputText value="#{zoneTree.district.districtName}"  />
              </p:treeNode>
        </p:column>
      </p:treeTable>
	</p:outputPanel>
	</p:dialog>
		
   <p:dialog id="contractDlg" header="Contract List" widgetVar="contractDlg" modal="true" width="750" height="400">
		<p:panel id="listOfContract">
			<h:panelGrid columns="6">
				<h:outputText value="Contract No."/>
				<p:inputText id="contractNo" value="#{centralContractBackingBean.managedBean.searchContractNo}" />
				<p:spacer width="10" />
				<h:outputText value="Contract Name"/>
				<p:inputText id="contractName" value="#{centralContractBackingBean.managedBean.searchContractName}" />
				<p:commandButton value="Search" process="contractDlg,contractNo,contractName"
					icon="ui-icon-search" update="contractDt"
					actionListener="#{centralContractBackingBean.searchContract()}"  />
			</h:panelGrid>
			<p:dataTable id="contractDt" var="data"	rowIndexVar="index" rowKey="#{data.contractId}" lazy="true"  paginator="true" 
				value="#{centralContractBackingBean.managedBean.contractList}"
				selection="#{centralContractBackingBean.managedBean.selectedContractList}" >
				<ac:paginator for="contractDt" />
				<p:column selectionMode="multiple" style="width:3%;" />
				<p:column headerText="#{lbl['lbl.ct.cc.phyloa']}">
					<h:outputText value="#{data.loaPhysicalNo}" />
				</p:column>
				 <p:column headerText="#{lbl['lbl.ct.cc.phyCno']}" >
				<h:outputText value="#{data.contractPhysicalNo}" />
			 </p:column>
			 <p:column headerText="Contract No">
					<h:outputText value="#{data.contractNo}" />
				</p:column>
			 <p:column headerText="#{lbl['lbl.ct.cc.sup']}" >
				<h:outputText value="#{data.latestContractVer.ctContractValue.supplierCompanyName}" />
			 </p:column>
			</p:dataTable>
			<p:spacer height="2" />
			<div class="ppRightBtn"> 
				<p:commandButton value="Select" process="contractDlg" icon="ui-icon-accept"
					action="#{centralContractBackingBean.addSelectedContract}"
					update="centralContractDt,popupButtonCal,popupButtonCal1" onclick="contractDlg.hide();" />
				<p:commandButton value="Cancel" icon="ui-icon-cancel" type="button" ajax="false" onclick="contractDlg.hide();" />
			</div>	
		</p:panel>
	</p:dialog>
	 </p:panel>
	 </ui:composition>
