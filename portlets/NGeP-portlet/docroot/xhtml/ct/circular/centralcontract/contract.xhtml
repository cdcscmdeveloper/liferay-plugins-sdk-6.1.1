<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="contractListPnl" header="#{lbl['lbl.ct.cc.ct']}"
		toggleable="true" toggleSpeed="500">
		<p:dataTable id="centralContractDt" var="circularContractsVar" rowIndexVar="index"
			value="#{centralContractBackingBean.managedBean.circularVer.ctCircularContracts}" selectionMode="single" 
			selection="#{centralContractBackingBean.managedBean.selectedCircularContract}" rowKey="#{circularContractsVar}">
			<ac:paginator for="centralContractDt" />
			<p:ajax event="rowSelect"
				update=":form:contractListPnl"
				process="@this"
				listener="#{centralContractBackingBean.setContractListner()}" />
			<p:column headerText="#{lbl['lbl.ct.cc.phyloa']}">
				<h:outputText value="#{circularContractsVar.ctContract.loaPhysicalNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.phyCno']}">
				<h:outputText value="#{circularContractsVar.ctContract.contractPhysicalNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.ctname']}">
				<h:outputText value="#{circularContractsVar.ctContract.contractName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.sup']}">
				<h:outputText
					value="#{circularContractsVar.ctContract.latestContractVer.ctContractValue.supplierName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.ctsdate']}">
				<h:outputText
					value="#{circularContractsVar.ctContract.latestContractVer.ctContractValue.effDate}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.ctedate']}">
				<h:outputText
					value="#{circularContractsVar.ctContract.latestContractVer.ctContractValue.expDate}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Status">
				<p:selectOneMenu value="#{circularContractsVar.recordStatusFlg}"
					disabled="#{!centralContractBackingBean.managedBean.updateAction}"
					style="width:70px;">
					<f:selectItem itemValue="0" itemLabel="Inactive" />
					<f:selectItem itemValue="1" itemLabel="Active" />
				</p:selectOneMenu>
			</p:column>
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" icon="ui-icon-add"
				oncomplete="contractDlg.show();"
				actionListener="#{centralContractBackingBean.addCircularContractListener()}"/>
			<p:commandButton id="deleteContractBtn"
				value="#{lbl['lbl.btn.delete']}" process="@this"
				icon="ui-icon-delete"
				disabled="#{centralContractBackingBean.managedBean.selectedCircularContract == null}"
				onsuccess="delCtContractDlg.show()" />
		</div>

		<p:dialog id="delCtContractDlg"
			header="#{lbl['lbl.ct.dialog.confirm.header']}" resizable="false"
			styleClass="screen-title" widgetVar="delCtContractDlg" modal="true"
			width="350" height="95">
			<h:panelGrid columns="3">
				<p:graphicImage library="ep/images/design" name="exclamation.png"
					value="/css/images/design/exclamation.png"
					styleClass="ui-icon-complain" />
				<p:spacer width="10" />
				<p:inputTextarea styleClass="ui-inputtextarea" rows="2" cols="48"
					value="Are you sure you want to delete this record?" />
			</h:panelGrid>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					icon="ui-icon-accept" update="@([id$=contractListPnl])"
					process="@all"
					actionListener="#{centralContractBackingBean.deleteCircularContract()}"
					onclick="delCtContractDlg.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					icon="ui-icon-reject" onclick="delCtContractDlg.hide();"
					type="button" />
			</div>
		</p:dialog>

		<p:spacer height="20" />
		<p:outputPanel id="circularItemsPanel">
			<h:panelGroup
				rendered="#{centralContractBackingBean.managedBean.selectedCircularContract != null and
		   centralContractBackingBean.managedBean.selectedCircularContract.ctCircularItems.size() > 0}">
				<p:outputLabel value="#{lbl['lbl.ct.cc.sublabel.item']}"
					style="float:left; font-weight:bold; padding-top:5px;" />
				<div style="clear: both" />
				<p:dataTable id="circularItemDt" var="itemVar"
					value="#{centralContractBackingBean.managedBean.selectedCircularContract.ctCircularItems}"
					selectionMode="single"
					selection="#{centralContractBackingBean.managedBean.selectedCircularItem}"
					rowKey="#{itemVar}">
					<ac:paginator for="circularItemDt" />
					<p:ajax event="rowSelect"
						update="@([id$=circularZonePanel],[id$=circularPricePanel])"
						process="@this"
						listener="#{centralContractBackingBean.setZoneListener()}" />
					<p:column headerText="#{lbl['lbl.ct.pc.item.name']}"
						style="width:45%; white-space:pre-line;">
						<h:outputText value="#{itemVar.ctContractItem.itemName}"
							style="width:450px;" />
					</p:column>
					<p:column headerText="Minimum Order Qty." style="width:10%;">
						<p:inputText styleClass="colFloatRight" style="width:120px;"
							value="#{itemVar.minimumOrderQty}" maxlength="14"
							label="Minimum Order Qty.">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, itemVar.ctContractItem.uom.uomCode)}" />
						</p:inputText>
					</p:column>
					<p:column headerText="Nilai Pesanan Minimum (RM)" style="width:15%;white-space:pre-line;">
						<p:inputText styleClass="colFloatRight" style="width:120px;"
							value="#{itemVar.minimumOrderAmt}" maxlength="19"
							label="Nilai Pesanan Minimum (RM)">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</p:column>
					<p:column headerText="Had Pembelian Luar Kontrak (RM)"
						style="width:15%;white-space:pre-line;">
						<p:inputText styleClass="colFloatRight" style="width:120px;"
							value="#{itemVar.maxProcureAmt}" maxlength="19"
							label="Had Pembelian Luar Kontrak (RM)">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.status']}" style="width:10%;">
						<p:selectOneMenu value="#{itemVar.recordStatusFlg}"
							disabled="#{!centralContractBackingBean.managedBean.updateAction}"
							style="width:70px;">
							<f:selectItem itemValue="0" itemLabel="Inactive" />
							<f:selectItem itemValue="1" itemLabel="Active" />
						</p:selectOneMenu>
					</p:column>
				</p:dataTable>
			</h:panelGroup>
		</p:outputPanel>

		<p:spacer height="40" />
		<p:outputPanel id="circularZonePanel">
			<h:panelGroup
				rendered="#{centralContractBackingBean.managedBean.selectedCircularItem != null
		     and centralContractBackingBean.managedBean.chkItemZone}">
				<p:outputLabel value="#{lbl['lbl.ct.cc.sublabel.zone']}"
					style="float:left; font-weight:bold; padding-top:25px;" />
				<div style="clear: both" />
				<p:dataTable id="circularItemZoneDt" var="dataZone"
					value="#{centralContractBackingBean.managedBean.contractItemZones}"
					selection="#{centralContractBackingBean.managedBean.selectedZoneItems}"
					selectionMode="single" rowKey="#{dataZone}" rowIndexVar="index">
					<ac:paginator for="circularItemZoneDt" />
					<p:ajax event="rowSelect" update="@([id$=circularPricePanel])"
						process="@this"
						listener="#{centralContractBackingBean.setPriceListener()}" />
					<p:column headerText="Zone" style="width:60%;">
						<h:outputText value="#{dataZone.zoneName}" style="width:50%;" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.action']}" style="width:40%;">
						<p:commandLink update="@([id$=itemZoneId])"
							oncomplete="itemZoneDlg.show();" immediate="true">
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/css/images/design/document.png" title="View"></p:graphicImage>
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</h:panelGroup>
		</p:outputPanel>

		<p:spacer height="40" />
		<p:outputPanel id="circularPricePanel">
			<h:panelGroup
				rendered="#{centralContractBackingBean.managedBean.chkItemPrice and  
		    centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.ctItemPrices != null 
		    and centralContractBackingBean.managedBean.selectedCircularItem.ctContractItem.ctItemPrices.size() > 0}">
				<p:outputLabel
					value="#{(centralContractBackingBean.managedBean.selectedCircularItem != null
		     and centralContractBackingBean.managedBean.chkItemZone)?lbl['lbl.ct.cc.sublabel.zoneprice']:lbl['lbl.ct.cc.sublabel.itemprice']}"
					style="float:left; font-weight:bold; padding-top:25px;" />
				<div style="clear: both" />
				<p:dataTable id="circularItemZonePriceDt" var="priceVar" 
				     value="#{centralContractBackingBean.getItemPrice()}">
					<ac:paginator for="circularItemZonePriceDt" />
					<p:column headerText="From Qty." style="width:30%;">
						<h:outputText value="#{priceVar.fromQty}" style="width:50%;" />
					</p:column>
					<p:column headerText="To Qty." style="width:30%;">
						<h:outputText value="#{priceVar.toQty}" style="width:50%;" />
					</p:column>
					<p:column headerText="Unit Price (RM)" style="width:30%;">
						<h:outputText value="#{priceVar.unitPrice}" style="width:50%;" />
					</p:column>
				</p:dataTable>
			</h:panelGroup>
		</p:outputPanel>

		<p:dialog id="itemZoneDlg" header="Zone Details"
			widgetVar="itemZoneDlg" modal="true" width="350" height="200">
			<p:outputPanel id="itemZoneId">
				<p:treeTable id="itemZoneDt"
					value="#{centralContractBackingBean.managedBean.centralZoneTrees}"
					var="zoneTree">
					<p:column style="width:70%;">
						<f:facet name="header">  Location Name </f:facet>
						<p:treeNode type="zone">
							<h:outputText value="#{zoneTree.zone}" />
						</p:treeNode>
						<p:treeNode type="state">
							<h:outputText value="#{zoneTree.state.stateName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{zoneTree.district.districtName}" />
						</p:treeNode>
					</p:column>
				</p:treeTable>
			</p:outputPanel>
		</p:dialog>

		<p:dialog id="contractDlg" header="#{lbl['lbl.ct.cc.ct']}"
			widgetVar="contractDlg" modal="true" width="750" height="400">
			<p:panel id="listOfContract">
				<h:panelGrid columns="6">
					<h:outputText value="#{lbl['lbl.ct.contract.no']}" />
					<p:inputText id="contractNo"
						value="#{centralContractBackingBean.managedBean.searchContractNo}"
						maxlength="17" />
					<p:spacer width="10" />
					<h:outputText value="#{lbl['lbl.ct.search.table.cname']}" />
					<p:inputText id="contractName"
						value="#{centralContractBackingBean.managedBean.searchContractName}"
						maxlength="1000" />
					<p:commandButton value="#{lbl['lbl.btn.search']}"
						process="contractDlg,contractNo,contractName"
						icon="ui-icon-search" update="contractDt"
						actionListener="#{centralContractBackingBean.searchContract()}" />
				</h:panelGrid>
				<p:dataTable id="contractDt" var="contractListVar" rowIndexVar="index"
					rowKey="#{contractListVar.contractId}" paginator="true"
					value="#{centralContractBackingBean.managedBean.contractList}"
					selection="#{centralContractBackingBean.managedBean.selectedContractList}">
					<ac:paginator for="contractDt" />
					<p:column selectionMode="multiple" style="width:3%;" />
					<p:column headerText="#{lbl['lbl.ct.cc.phyloa']}">
						<h:outputText value="#{contractListVar.loaPhysicalNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.cc.phyCno']}">
						<h:outputText value="#{contractListVar.contractPhysicalNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.table.cno']}">
						<h:outputText value="#{contractListVar.contractNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.cc.sup']}">
						<h:outputText
							value="#{contractListVar.latestContractVer.ctContractValue.supplierName}" />
					</p:column>
				</p:dataTable>
				<p:spacer height="2" />
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.select']}"
						process="contractDlg" icon="ui-icon-accept"
						action="#{centralContractBackingBean.addSelectedContract}"
						update="centralContractDt" onclick="contractDlg.hide();" />
					<p:commandButton value="#{lbl['lbl.btn.cancel']}"
						icon="ui-icon-cancel" type="button" ajax="false"
						onclick="contractDlg.hide();" />
				</div>
			</p:panel>
		</p:dialog>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{centralContractBackingBean.managedBean.circularVer.contractRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{centralContractBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>
		
</ui:composition>
