<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<p:panel id="ccc" header="#{lbl['lbl.ct.cc.panel.ccd']}" toggleable="true" toggleSpeed="500">
		<c:choose>
			<c:when test="#{!centralContractBackingBean.managedBean.updateAction and centralContractBackingBean.managedBean.circularVer.updateNo == null}">
				<ui:include src="createCircularDetail.xhtml" />
			</c:when>	
			<c:otherwise>
				<ui:include src="updateCircularDetail.xhtml" />
			</c:otherwise>	
		</c:choose>
	</p:panel>
	
	<p:panel id="contactPerson" header="#{lbl['lbl.ct.pc.cpd']}" toggleable="true" toggleSpeed="500" widgetVar="panelcontactPerson">
		<p:dataTable id="contactPersonDt" var="data" value="#{centralContractBackingBean.managedBean.circularVer.ctContactPersons}"
			rowIndexVar="index" lazy="true">
			<ac:paginator for="contactPersonDt" />
			<p:columnGroup type="header">
				<p:row>
					<p:column style="width:150px;" headerText="#{lbl['lbl.ct.pc.cperson']}" />
					<p:column style="width:250px;" headerText="#{lbl['lbl.ct.pc.caddress']}" />
					<p:column style="width:100px;" headerText="#{lbl['lbl.ct.pc.cemail']}" />
					<p:column style="width:100px;" headerText="#{lbl['lbl.ct.pc.pno']}" />
					<p:column style="width:60px;" headerText="#{lbl['lbl.ct.pc.action']}" />
				</p:row>
			</p:columnGroup>
			<p:column>
				<p:inputText value="#{data.name}" style="width:120px;" />
			</p:column>
			<p:column>
				<p:inputText value="#{data.address}" style="width:200px;" />
			</p:column>
			<p:column>
				<p:inputText value="#{data.email}" style="width:90px;" />
			</p:column>
			<p:column>
				<p:inputText value="#{data.phoneNo}" style="width:90px;" />
			</p:column>
			<p:column styleClass="column-align-center">
			<p:commandLink  oncomplete="delCtPersonDlg.show()" partialSubmit="true" process="@form">
			    <f:setPropertyActionListener value="#{data}" target="#{centralContractBackingBean.managedBean.selectedContactPerson}" />
				<p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
		    </p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add"
				action="#{centralContractBackingBean.addContactPerson()}" update="contactPersonDt" />
		</div>
		<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delCtPersonDlg"
			closable="true" appendToBody="true" header="Delete Confirmation" >
			<h:panelGrid columns="2" columnClasses="column-align-right-50,column-align-left">
				<p:commandButton value="Yes" icon="ui-icon-accept" update="contactPersonDt"
					 action="#{centralContractBackingBean.deleteContactPerson()}" oncomplete="delCtPersonDlg.hide();"   /> 
				<p:commandButton value="No" icon="ui-icon-reject" onclick="delCtPersonDlg.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>
	</p:panel>
	
	<p:panel id="contractList" header="#{lbl['lbl.ct.cc.ct']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="centralContractDt" var="data" lazy="true" rowIndexVar="index" paginator="true"
			value="#{centralContractBackingBean.managedBean.circularVer.ctCircularContracts}" >
			<ac:paginator for="centralContractDt" />
			<p:columnGroup type="header">
				<p:row>
					<p:column headerText="#{lbl['lbl.ct.cc.ctno']}" />
					<p:column headerText="#{lbl['lbl.ct.cc.ctname']}" />
					<p:column headerText="#{lbl['lbl.ct.cc.loa']}" />
					<p:column headerText="#{lbl['lbl.ct.cc.sup']}" />
					<p:column headerText="#{lbl['lbl.ct.cc.ctsdate']}" />
					<p:column headerText="#{lbl['lbl.ct.cc.ctedate']}" />
					<p:column headerText="#{lbl['lbl.ct.cc.action']}" />
				</p:row>
			</p:columnGroup>
			<p:column>
				<p:outputLabel value="#{data.ctContract.latestContractVer.ctContractValue.contractPhysicalNo}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{data.ctContract.contractName}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{data.ctContract.loaNo}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{data.ctContract.smSupplier.supplierName}" />
			</p:column>
			<p:column>
				<h:outputText value="#{data.ctContract.latestContractVer.ctContractValue.effDate}" >
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText value="#{data.ctContract.latestContractVer.ctContractValue.expDate}" >
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>
			</p:column>
			<p:column styleClass="column-align-center">
			<p:commandLink  oncomplete="delContractDlg.show()"  partialSubmit="true" process="@form">
			    <f:setPropertyActionListener value="#{data}" target="#{centralContractBackingBean.managedBean.selectedCircularContract}" />
				<p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
		    </p:commandLink>
			</p:column>
		</p:dataTable>
		<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delContractDlg"
			closable="true" appendToBody="true" header="Delete Confirmation" >
			<h:panelGrid columns="2" columnClasses="column-align-right-50,column-align-left">
				<p:commandButton value="Yes" icon="ui-icon-accept" update="centralContractDt"
					 action="#{centralContractBackingBean.deleteCircularContract()}" oncomplete="delContractDlg.hide();"   /> 
				<p:commandButton value="No" icon="ui-icon-reject" onclick="delContractDlg.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add" onclick="contractDlg.show();" />
		</div>
	</p:panel>
	
	<p:dialog id="contractDlg" header="Contract List" widgetVar="contractDlg" modal="true" width="750" height="400">
		<p:panel id="listOfContract">
			<h:panelGrid columns="6">
				<h:outputText value="Contract No."/>
				<p:inputText id="contractNo" value="#{centralContractBackingBean.managedBean.searchContractNo}" />
				<p:spacer width="10" />
				<h:outputText value="Contract Name"/>
				<p:inputText id="contractName" value="#{centralContractBackingBean.managedBean.searchContractName}" />
				<p:commandButton value="Search" process="contractDlg,contractNo,contractName"
					icon="ui-icon-search" update="contractDt"
					actionListener="#{centralContractBackingBean.searchContract()}"  />
			</h:panelGrid>
			<p:dataTable id="contractDt" var="data"	rowIndexVar="index" rowKey="#{data.contractId}" lazy="true"  paginator="true" 
				value="#{centralContractBackingBean.managedBean.contractList}"
				selection="#{centralContractBackingBean.managedBean.selectedContractList}" >
				<ac:paginator for="contractDt" />
				<p:column selectionMode="multiple" style="width:18px" />
				<p:column headerText="Contract No">
					<h:outputText value="#{data.contractValue.contractNo}" />
				</p:column>
				<p:column headerText="Contract Name">
					<h:outputText value="#{data.contractName}" />
				</p:column>
				<p:column headerText="LOA No">
					<h:outputText value="#{data.qtLoaNo}" />
				</p:column>
				<p:column headerText="Contract Start">
					<h:outputText value="#{data.contractValue.effDate}" >
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</p:column>
				<p:column headerText="Contract End">
					<h:outputText value="#{data.contractValue.expDate}" >
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</p:column>
			</p:dataTable>
			<f:facet name="footer">
				<div class="ppRightBtn"> 
					<p:commandButton value="Select" process="contractDlg" icon="ui-icon-select"
						action="#{centralContractBackingBean.addSelectedContract}"
						update="centralContractDt" onclick="contractDlg.hide();" />
					<p:commandButton value="Cancel" icon="ui-icon-cancel" type="button" ajax="false" onclick="contractDlg.hide();" />
				</div>			
			</f:facet>
		</p:panel>
	</p:dialog>
	
	<p:panel id="concelCircularPnl" header="Related Cancelled Circular" toggleable="true" toggleSpeed="500" 
		rendered="#{!centralContractBackingBean.managedBean.updateAction and centralContractBackingBean.managedBean.circularVer.updateNo == null}" >
		<p:dataTable id="cancelCircularDt" var="data" value="#{centralContractBackingBean.managedBean.circularVer.ctCancelCircularList}"
			lazy="true" rowIndexVar="index" >
			<ac:paginator for="cancelCircularDt" />
			<p:columnGroup type="header">
				<p:row>
					<p:column style="width:80px" headerText="Circular No." />
					<p:column style="width:150px" headerText="#{lbl['lbl.ct.pc.cname']}" />
					<p:column style="width:100px" headerText="Update Type" />
					<p:column style="width:100px" headerText="Update No" />
					<p:column style="width:60px" headerText="#{lbl['lbl.ct.pc.action']}" />
				</p:row>
			</p:columnGroup>
			<p:column>
				<h:outputText value="#{data.ctCancelCircularVer.circularNo}" />
			</p:column>
			<p:column>
				<h:outputText value="#{data.ctCancelCircularVer.name}" />
			</p:column>
			<p:column>
				<h:outputText value="#{data.ctCancelCircularVer.circularTypeCode.code}" />
			</p:column>
			<p:column>
				<h:outputText value="#{data.ctCancelCircularVer.updateNo}" />
			</p:column>
			<p:column styleClass="column-align-center">
			<p:commandLink  oncomplete="delCancelCircularDlg.show()"  partialSubmit="true" process="@form">
			    <f:setPropertyActionListener value="#{data}" target="#{centralContractBackingBean.managedBean.selectedCancelCircular}" />
				<p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
		    </p:commandLink>	
			</p:column>			
		</p:dataTable>
		<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delCancelCircularDlg"
			closable="true" appendToBody="true" header="Delete Confirmation" >
			<h:panelGrid columns="2" columnClasses="column-align-right-50,column-align-left">
				<p:commandButton value="Yes" icon="ui-icon-accept" update="cancelCircularDt"
					 action="#{centralContractBackingBean.deleteCancelCircular()}" oncomplete="delCancelCircularDlg.hide();"   /> 
				<p:commandButton value="No" icon="ui-icon-reject" onclick="delCancelCircularDlg.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="Add" icon="ui-icon-add" onclick="cancelCircularDlg.show();" />
		</div>		
	</p:panel>
	
	<p:dialog id="cancelCircularDlg" header="Cancelled Circulars" widgetVar="cancelCircularDlg" modal="true" width="550" height="350">
		<p:panel id="circular">
			<p:dataTable id="cancelledCclDt" var="data" lazy="false" selection="#{centralContractBackingBean.managedBean.selectedCancelledCircularList}"
				value="#{centralContractBackingBean.cancelledCircularDataModel}" rowIndexVar="index" >
				<ac:paginator for="cancelledCclDt" />
				<p:column selectionMode="multiple" style="width:18px" />
				<p:column headerText="Circular No.">
				</p:column>
				<p:column headerText="Circular Name">
				</p:column>
				<p:column headerText="Update Type">
				</p:column>
				<p:column headerText="Update No.">
				</p:column>												
			</p:dataTable>
			<f:facet name="footer">
				<div class="ppRightBtn"> 
					<p:commandButton value="Select" icon="ui-icon-select" process="cancelCircularDlg" 
						action="#{centralContractBackingBean.addCancelledCircular()}"
						update="cancelCircularDt" onclick="cancelCircularDlg.hide();" />
					<p:commandButton value="Cancel" icon="ui-icon-cancel" type="button" ajax="false" onclick="cancelCircularDlg.hide();" />
				</div>
			</f:facet>
		</p:panel>
	</p:dialog>
</ui:composition>
