<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<p:panel id="ccc" header="#{lbl['lbl.ct.panel.central.contract.circular']}" toggleable="true" toggleSpeed="500">
		<h:panelGroup rendered="#{centralContractBackingBean.managedBean.circular.latestCircularVer == null
		or panelBackingBean.managedBean.viewContract}">
			<ui:include src="createCircularDetail.xhtml" />
		</h:panelGroup>
		<h:panelGroup rendered="#{centralContractBackingBean.managedBean.circular.latestCircularVer != null and !panelBackingBean.managedBean.viewContract}">
			<ui:include src="updateCircularDetail.xhtml" />
		</h:panelGroup>		
	</p:panel>
	
	<p:panel id="contactPerson" header="#{lbl['lbl.ct.panel.contact.person']}" toggleable="true" toggleSpeed="500" widgetVar="panelcontactPerson">
		<p:dataTable id="contactPersonDt" var="contactPersonsVar" widgetVar="contactPersonObj"
		     value="#{centralContractBackingBean.managedBean.circularVer.ctContactPersons}" rowIndexVar="index"
		 	rowKey="#{contactPersonsVar}"  selection="#{centralContractBackingBean.managedBean.selectedContactPersons}">
			<ac:paginator for="contactPersonDt" />
			<p:column selectionMode="multiple" style="width:5%" 
				rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
			<p:column headerText="#{lbl['lbl.ct.contact.person.name']}" style="width:20%;">
				<p:inputText id="cperson" value="#{contactPersonsVar.name}" maxlength="20"
					disabled="#{centralContractBackingBean.managedBean.viewContract}"
				   	style="width:95%;" label="#{lbl['lbl.ct.contact.person.name']}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.address']}" style="width:40%;">
				<p:inputText value="#{contactPersonsVar.address}" style="width:95%;" maxlength="200"
					disabled="#{centralContractBackingBean.managedBean.viewContract}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.email']}" style="width:20%;">
				  <p:inputText id="validateEmail" value="#{contactPersonsVar.email}" maxlength="100"
				     style="width:95%;" validator="#{webappBean.checkEmail}" label="#{lbl['lbl.ct.email']}"
				     disabled="#{centralContractBackingBean.managedBean.viewContract}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.tel']}" style="width:15%;">
				<p:inputText id="validPhone" style="width:90%;" label="#{lbl['lbl.ct.tel']}" maxlength="100"
				   value="#{contactPersonsVar.phoneNo}"  validator="#{webappBean.checkPhoneNumber}"
				   disabled="#{centralContractBackingBean.managedBean.viewContract}"/>
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn"> 
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" partialSubmit="true" 
			   action="#{centralContractBackingBean.addContactPerson()}" update="contactPersonDt"
				oncomplete="contactPersonObj.paginator.endLink.click();" rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this"  partialSubmit="true" 
			    onsuccess="delCtPersonDlg.show()" rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>				
		</div>
		
		<p:dialog id="delCtPersonDlg" 
		    styleClass="screen-title" widgetVar="delCtPersonDlg"  modal="true" width="330">  
            <h:panelGrid columns="3">
              <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			  <p:spacer width="10"/>
              <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}"  update="@([id$=contactPersonDt])"
		       process="@all" actionListener="#{centralContractBackingBean.deleteContactPerson()}" onclick="delCtPersonDlg.hide();"/>
			 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delCtPersonDlg.hide();" type="button" />
		   </div>
        </p:dialog>  		
        
	</p:panel>
	
	<p:panel id="exemptedOrgPnl" header="#{lbl['lbl.ct.panel.exempted.ministry']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="exemptedOrgDt" var="exemptedOrgsVar" value="#{centralContractBackingBean.managedBean.circularVer.ctExemptedOrgs}"
		 	rowKey="#{exemptedOrgsVar}" rowIndexVar="index" selection="#{centralContractBackingBean.managedBean.selectedExemptedOrgs}">
			<ac:paginator for="exemptedOrgDt" />
			<p:column selectionMode="multiple" style="width:3%"
				rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
			<p:column headerText="#{lbl['lbl.ct.ministry']}">
				#{exemptedOrgsVar.orgProfile.orgName}
			</p:column>
		</p:dataTable>
		 <div class="ppRightBtn">
		 	<ac:lov id="ministryId" lovId="PM_ORG_PROFILE_MINSTRY"
						postUpdateListener="centralContractBackingBean.addExemptedOrg"
						headerText="#{lbl['lbl.ct.ministry']}" 
						buttonLabel="#{lbl['lbl.btn.add']}"
						selectionMode="multiple"
						saveObject="centralContractBackingBean.managedBean.orgProfiles"
						conditionField="orgTypeCode.parameterCode^#{ParameterConst.orgTypeMinistry}|recordStatus^1" update="@form"
						rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this" 
						  partialSubmit="true" 
						  onsuccess="delExemptedOrgDlg.show()"
						  rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
		 </div>
		<p:dialog id="delExemptedOrgDlg"
		    styleClass="screen-title" widgetVar="delExemptedOrgDlg"  modal="true" width="330">  
            <h:panelGrid columns="3">
              <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			  <p:spacer width="10"/>
              <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}"  update="@([id$=exemptedOrgDt])"
		       process="@all" actionListener="#{centralContractBackingBean.deleteExemptedOrg()}" onclick="delExemptedOrgDlg.hide();"/>
			 <p:commandButton value="#{lbl['lbl.btn.no']}" onclick="delExemptedOrgDlg.hide();" type="button" />
		   </div>
        </p:dialog>  	
        
	</p:panel>
	
	<p:panel id="cancelCircularPnl" header="#{lbl['lbl.ct.panel.related.cancelled.circular']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="cancelCircularDt" var="cancelCircularVar" rowKey="#{cancelCircularVar}" rowIndexVar="index" 
			value="#{centralContractBackingBean.managedBean.circularVer.ctCancelCircularList}"
			selection="#{centralContractBackingBean.managedBean.selectedCancelCirculars}" >
			<ac:paginator for="cancelCircularDt" />
			<p:column selectionMode="multiple" style="width:3%"
				rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
			<p:column headerText="#{lbl['lbl.ct.physical.circular.no']}">
				<h:outputText value="#{cancelCircularVar.circularVer.circularNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.circular.name']}" >
				<h:outputText value="#{cancelCircularVar.circularVer.name}" />
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn"> 
			<p:commandButton value="#{lbl['lbl.btn.add']}"  oncomplete="cancelCircularDlg.show();" update="cancelledCclDt"
				actionListener="#{centralContractBackingBean.addCancelCircularListener()}" 
				rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@form" partialSubmit="true" 
				action="#{centralContractBackingBean.deleteCancelCircular()}" update="cancelCircularDt" 
				rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>			
		</div>		
	</p:panel>
	
	<p:dialog id="cancelCircularDlg" header="#{lbl['lbl.ct.cancelled.circular']}" widgetVar="cancelCircularDlg" 
		styleClass="pop_up_top" modal="true" width="550" height="350">
			<p:dataTable id="cancelledCclDt" var="cancelledCircularDlgVar" rowKey="#{cancelledCircularDlgVar}" rowIndexVar="index"
				value="#{centralContractBackingBean.managedBean.cancelledCircularList}" 
				selection="#{centralContractBackingBean.managedBean.selectedCancelledCircularList}" >
				<ac:paginator for="cancelledCclDt" />
				<p:column selectionMode="multiple" style="width:3%" />
				<p:column headerText="#{lbl['lbl.ct.physical.circular.no']}">
					<h:outputText value="#{cancelledCircularDlgVar.circularVer.circularNo}" style="width:200px;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.name']}">
					<h:outputText value="#{cancelledCircularDlgVar.circularVer.name}" style="width:300px;" />
				</p:column>									
			</p:dataTable>
			<div class="ppRightBtn"> 
				<p:commandButton value="#{lbl['lbl.btn.ok']}"  process="cancelCircularDlg" 
					action="#{centralContractBackingBean.addCancelledCircular}"
					update="cancelCircularDt" onclick="cancelCircularDlg.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" type="button" ajax="false" onclick="cancelCircularDlg.hide();" />
			</div>			
	</p:dialog>
</ui:composition>
