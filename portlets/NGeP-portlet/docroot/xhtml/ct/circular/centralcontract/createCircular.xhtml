<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<p:panel id="ccc" header="#{lbl['lbl.ct.cc.panel.ccd']}" toggleable="true" toggleSpeed="500">
		<h:panelGroup rendered="#{!centralContractBackingBean.managedBean.updateAction and (centralContractBackingBean.managedBean.circularVer.updateNo == null)}">
			<ui:include src="createCircularDetail.xhtml" />
		</h:panelGroup>
		<h:panelGroup rendered="#{centralContractBackingBean.managedBean.updateAction || (centralContractBackingBean.managedBean.circularVer.updateNo != null)}">
			<ui:include src="updateCircularDetail.xhtml" />
		</h:panelGroup>		
	</p:panel>
	
	<p:panel id="contactPerson" header="#{lbl['lbl.ct.pc.cpd']}" toggleable="true" toggleSpeed="500" widgetVar="panelcontactPerson">
		<p:dataTable id="contactPersonDt" var="data" value="#{centralContractBackingBean.managedBean.circularVer.ctContactPersons}"
		 	rowKey="#{data}" rowIndexVar="index" lazy="true" selection="#{centralContractBackingBean.managedBean.selectedContactPersons}">
			<ac:paginator for="contactPersonDt" />
			<p:column selectionMode="multiple" style="width:3%" />
			<p:column headerText="#{lbl['lbl.ct.pc.cperson']}">
				<p:inputText value="#{data.name}" style="width:150px;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.pc.caddress']}">
				<p:inputText value="#{data.address}" style="width:250px;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.pc.cemail']}">
				<p:inputText value="#{data.email}" style="width:120px;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.pc.pno']}">
				<p:inputText value="#{data.phoneNo}" style="width:120px;" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add"
				action="#{centralContractBackingBean.addContactPerson()}" update="contactPersonDt" />
			<p:commandButton value="Delete" process="@form" partialSubmit="true" icon="ui-icon-delete"
				action="#{centralContractBackingBean.deleteContactPerson()}" update="contactPersonDt" />				
		</div>
	</p:panel>
	
	<p:panel id="contractList" header="#{lbl['lbl.ct.cc.ct']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="centralContractDt" var="data" lazy="true" rowIndexVar="index" rowKey="#{data}"
			value="#{centralContractBackingBean.managedBean.circularVer.ctCircularContracts}" 
			selection="#{centralContractBackingBean.managedBean.selectedCircularContracts}" >
			<ac:paginator for="centralContractDt" />
			<p:column selectionMode="multiple" style="width:3%" />
			<p:column headerText="#{lbl['lbl.ct.cc.ctno']}" >
				<h:commandLink value="#{data.ctContract.latestContractVer.ctContractValue.contractPhysicalNo}" styleClass="blue_font" 
					onclick="alert('Development in progress');" immediate="true" /> 
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.ctname']}" >
				<h:outputText value="#{data.ctContract.contractName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.loa']}" >
				<h:outputText value="#{data.ctContract.loaNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.sup']}" >
				<h:outputText value="#{data.ctContract.smSupplier.smAppl.smCompanyBasic.companyName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.ctsdate']}" >
				<h:outputText value="#{data.ctContract.latestContractVer.ctContractValue.effDate}" >
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.cc.ctedate']}" >
				<h:outputText value="#{data.ctContract.latestContractVer.ctContractValue.expDate}" >
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="Add" process="@form" partialSubmit="true" icon="ui-icon-add" oncomplete="contractDlg.show();" 
				actionListener="#{centralContractBackingBean.addCircularContractListener()}" update="contractDlg" />
			<p:commandButton value="Delete" process="@form" partialSubmit="true" icon="ui-icon-delete"
				action="#{centralContractBackingBean.deleteCircularContract()}" update="centralContractDt,popupButtonCal,popupButtonCal1" />				
		</div>
	</p:panel>
	
	<p:dialog id="contractDlg" header="Contract List" widgetVar="contractDlg" modal="true" width="750" height="400">
		<p:panel id="listOfContract">
			<h:panelGrid columns="6">
				<h:outputText value="Contract No."/>
				<p:inputText id="contractNo" value="#{centralContractBackingBean.managedBean.searchContractNo}" />
				<p:spacer width="10" />
				<h:outputText value="Contract Name"/>
				<p:inputText id="contractName" value="#{centralContractBackingBean.managedBean.searchContractName}" />
				<p:commandButton value="Search" process="contractDlg,contractNo,contractName"
					icon="ui-icon-search" update="contractDt"
					actionListener="#{centralContractBackingBean.searchContract()}"  />
			</h:panelGrid>
			<p:dataTable id="contractDt" var="data"	rowIndexVar="index" rowKey="#{data.contractId}" lazy="true"  paginator="true" 
				value="#{centralContractBackingBean.managedBean.contractList}"
				selection="#{centralContractBackingBean.managedBean.selectedContractList}" >
				<ac:paginator for="contractDt" />
				<p:column selectionMode="multiple" style="width:3%;" />
				<p:column headerText="Contract No">
					<h:outputText value="#{data.latestContractVer.ctContractValue.contractPhysicalNo}" />
				</p:column>
				<p:column headerText="Contract Name">
					<h:outputText value="#{data.contractName}" />
				</p:column>
				<p:column headerText="LOA No">
					<h:outputText value="#{data.loaNo}" />
				</p:column>
				<p:column headerText="Contract Start">
					<h:outputText value="#{data.latestContractVer.ctContractValue.effDate}" >
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
				<p:column headerText="Contract End">
					<h:outputText value="#{data.latestContractVer.ctContractValue.expDate}" >
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>
			</p:dataTable>
			<p:spacer height="2" />
			<div class="ppRightBtn"> 
				<p:commandButton value="Select" process="contractDlg" icon="ui-icon-accept"
					action="#{centralContractBackingBean.addSelectedContract}"
					update="centralContractDt,popupButtonCal,popupButtonCal1" onclick="contractDlg.hide();" />
				<p:commandButton value="Cancel" icon="ui-icon-cancel" type="button" ajax="false" onclick="contractDlg.hide();" />
			</div>	
		</p:panel>
	</p:dialog>
	
	<p:panel id="cancelCircularPnl" header="Related Cancelled Circular" toggleable="true" toggleSpeed="500" 
		rendered="#{!centralContractBackingBean.managedBean.updateAction and centralContractBackingBean.managedBean.circularVer.updateNo == null}" >
		<p:dataTable id="cancelCircularDt" var="data" rowKey="#{data}" lazy="true" rowIndexVar="index" 
			value="#{centralContractBackingBean.managedBean.circularVer.ctCancelCircularList}"
			selection="#{centralContractBackingBean.managedBean.selectedCancelCirculars}" >
			<ac:paginator for="cancelCircularDt" />
			<p:column selectionMode="multiple" style="width:3%" />
			<p:column headerText="Circular No.">
				<h:outputText value="#{data.ctCancelCircularVer.circularNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.pc.cname']}" >
				<h:outputText value="#{data.ctCancelCircularVer.name}" />
			</p:column>
			<p:column headerText="Update Type" >
				<h:outputText value="#{centralContractBackingBean.getParameterDesc(ParameterTypeConst.circularUpdateType, data.ctCancelCircularVer.updateType.parameterCode)}" />
			</p:column>
			<p:column headerText="Update No." >
				<h:outputText value="#{data.ctCancelCircularVer.updateNo}" />
			</p:column>	
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="Add" icon="ui-icon-add" oncomplete="cancelCircularDlg.show();" update="cancelledCclDt"
				actionListener="#{centralContractBackingBean.addCancelCircularListener()}" />
			<p:commandButton value="Delete" process="@form" partialSubmit="true" icon="ui-icon-delete"
				action="#{centralContractBackingBean.deleteCancelCircular()}" update="cancelCircularDt" />			
		</div>		
	</p:panel>
	
	<p:dialog id="cancelCircularDlg" header="Cancelled Circulars" widgetVar="cancelCircularDlg" modal="true" width="550" height="350">
		<p:panel id="circular">
			<p:dataTable id="cancelledCclDt" var="data" lazy="true" rowKey="#{data}" rowIndexVar="index"
				value="#{centralContractBackingBean.managedBean.cancelledCircularList}" 
				selection="#{centralContractBackingBean.managedBean.selectedCancelledCircularList}" >
				<ac:paginator for="cancelledCclDt" />
				<p:column selectionMode="multiple" style="width:3%" />
				<p:column headerText="Circular No.">
					<h:outputText value="#{data.ctCancelCircularVer.circularNo}" style="width:200px;" />
				</p:column>
				<p:column headerText="Circular Name">
					<h:outputText value="#{data.ctCancelCircularVer.name}" style="width:300px;" />
				</p:column>
				<p:column headerText="Update Type">
					<h:outputText value="#{centralContractBackingBean.getParameterDesc(ParameterTypeConst.circularUpdateType, data.ctCancelCircularVer.updateType.parameterCode)}" style="width:150px;" />
				</p:column>
				<p:column headerText="Update No.">
					<h:outputText value="#{data.ctCancelCircularVer.updateNo}" style="width:200px;" />
				</p:column>												
			</p:dataTable>
			<p:spacer height="2" />
			<div class="ppRightBtn"> 
				<p:commandButton value="Select" icon="ui-icon-accept" process="cancelCircularDlg" 
					action="#{centralContractBackingBean.addCancelledCircular}"
					update="cancelCircularDt" onclick="cancelCircularDlg.hide();" />
				<p:commandButton value="Cancel" icon="ui-icon-cancel" type="button" ajax="false" onclick="cancelCircularDlg.hide();" />
			</div>			
		</p:panel>
	</p:dialog>
</ui:composition>
