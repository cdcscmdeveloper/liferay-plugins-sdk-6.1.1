<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<p:panel id="ccc" header="#{lbl['lbl.ct.panel.central.contract.circular']}" toggleable="true" toggleSpeed="500">
		<h:panelGroup  rendered="#{centralContractBackingBean.managedBean.circular.latestCircularVer == null
		 or centralContractBackingBean.managedBean.viewContract}">
			<ui:include src="createCircularDetail.xhtml" />
		</h:panelGroup>
		<h:panelGroup rendered="#{centralContractBackingBean.managedBean.circular.latestCircularVer != null and !centralContractBackingBean.managedBean.viewContract}">
			<ui:include src="updateCircularDetail.xhtml" />
		</h:panelGroup>		
	</p:panel>
	
	<h:panelGroup id="groupPidId">
	   <p:panel id="purchaseInDefault"   toggleable="true" toggleSpeed="500" 
	         rendered="#{centralContractBackingBean.managedBean.circularVer.pid}"  header="#{lbl['lbl.ct.pid.panel.name']}">
	             <p:dataTable id="pidTableId" var="pidObj" widgetVar="PidReasonObj"
	                      value="#{centralContractBackingBean.managedBean.circularVer.ctCircularPidReason}" 
	                       rowKey="#{pidObj}" selection="#{centralContractBackingBean.managedBean.ctCircularPidReasons}">
				                 <ac:paginator for="pidTableId" />
				                    <p:column style="width:5%;text-align:center"
				                        rendered="#{!centralContractBackingBean.managedBean.viewContract}">
				                        <f:facet name="header">
							                  <p:selectBooleanCheckbox id="checkBoxAll" value="#{centralContractBackingBean.managedBean.selectAll}">
								                  <p:ajax partialSubmit="true" process="@this"
									                    update=":form:pidTableId,:form:delPidBtn" listener="#{centralContractBackingBean.selectAllPidReason}" />
							               </p:selectBooleanCheckbox>
						                  </f:facet>
		           
		                                 <p:selectBooleanCheckbox 
		                                     value="#{pidObj.selectedCheckBox}" styleClass="myCustomChekBox">
		           		                    <p:ajax event="change" 
		           		                        update=":form:delPidBtn,:form:pidTableId" listener="#{centralContractBackingBean.selectOnePidCheckboxSelect}"></p:ajax>
			                             </p:selectBooleanCheckbox>
				                       </p:column>
				                          <p:column style="width:50%;white-space:normal;" 
				                       headerText="#{lbl['lbl.ct.pid.reason']}" id="updateColumn"  styleClass="column-align-center">
		                                <c:if test="#{!centralContractBackingBean.managedBean.viewContract}">  
		                                    <p:selectOneMenu value="#{pidObj.pmReason.reasonId}" 
		                                             disabled="#{centralContractBackingBean.managedBean.viewContract}" style="width:360px;float:left;text-align:left;">
			                                             <f:selectItems value="#{centralContractBackingBean.getDropdownPidCodeValues()}" />
			                                             <p:ajax event="change" partialSubmit="true" update=":form:pidTableId"
			                                                 process="@this" listener="#{centralContractBackingBean.validatePidReason(pidObj.pmReason.reasonId)}"></p:ajax>
			                               </p:selectOneMenu>
			                               </c:if>
			                                 <c:if test="#{centralContractBackingBean.managedBean.viewContract}">
			                                     <h:outputText value="#{centralContractBackingBean.getReasonDesc(pidObj.pmReason)}" style="float:left;"/>
			                                </c:if>
			                    </p:column> 
		                        <p:column  headerText="#{lbl['lbl.ct.pid.reason.desc']}" 
		                                  id="updatePidPurchase"  styleClass="column-align-center" style="width:45%;white-space:normal;">
		                                     <c:if test="#{!centralContractBackingBean.managedBean.viewContract}">  
		                                        <p:inputText  value="#{pidObj.reasonDesc}" maxlength="255"
		                                            style="width:350px;float:left;text-align:left;"  disabled="#{centralContractBackingBean.managedBean.viewContract}" 
		                                            rendered="#{centralContractBackingBean.PidPurchaseTypeOther(pidObj.pmReason.reasonId)}"/>
		                                    </c:if>
		                                   <c:if test="#{centralContractBackingBean.managedBean.viewContract}">
		                                        <h:outputText value="#{pidObj.reasonDesc}"  style="float:left;"/>
		                                  </c:if>
		                       </p:column>  
				        </p:dataTable>
	             
	                    <div class="ppRightBtn"> 
			                 <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form"   
				                     partialSubmit="true" action="#{centralContractBackingBean.addPurchaseInDefault()}" update=":form:pidTableId" 
				                     oncomplete="PidReasonObj.paginator.endLink.click();" rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>	
				              <p:commandButton id="delPidBtn" value="#{lbl['lbl.ct.delete']}" process="@this"  
				                   disabled="#{centralContractBackingBean.managedBean.buttonHideActiveDel}"  partialSubmit="true" 
			                         onsuccess="delPidPurchaseDlg.show()" rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>			
		             </div>
		      
		             <p:confirmDialog id="delPidPurchaseDlg" widgetVar="delPidPurchaseDlg"  message="#{lbl['lbl.msg.confirm.delete']}" 	
		                severity="alert"  closable="true"  appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                          <div class="ppRightBtn">
		                       <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:pidTableId, :form:delPidBtn"  process="@all" 
		                           actionListener="#{centralContractBackingBean.deleteTableRow('PID')}" onclick="delPidPurchaseDlg.hide();"/>
			                   <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delPidPurchaseDlg.hide();" type="button" />
		                 </div>
                     </p:confirmDialog>	
	         </p:panel>
	  </h:panelGroup>
	
	      <p:panel id="contactPerson" 
	           header="#{lbl['lbl.ct.panel.contact.person']}" toggleable="true" toggleSpeed="500" widgetVar="panelcontactPerson">
		            <p:dataTable id="contactPersonDt" var="contactPersonsVar" widgetVar="contactPersonObj"
		                    value="#{centralContractBackingBean.managedBean.circularVer.ctContactPersons}" rowIndexVar="index"
		 	                rowKey="#{contactPersonsVar}"  selection="#{centralContractBackingBean.managedBean.selectedContactPersons}">
			                      <ac:paginator for="contactPersonDt" />
			                       <p:column  style="width:5%; text-align:center" 
				                         rendered="#{!centralContractBackingBean.managedBean.viewContract}">
				                           <f:facet name="header">
							                     <p:selectBooleanCheckbox value="#{centralContractBackingBean.managedBean.selectAll}">
								                     <p:ajax partialSubmit="true" process="@this"
									                      update=":form:contactPersonDt,:form:delCtPerson" listener="#{centralContractBackingBean.selectAllPerson}" />
							                    </p:selectBooleanCheckbox>
						                </f:facet>
		           
		                                 <p:selectBooleanCheckbox
		                                      value="#{contactPersonsVar.selectedCheckBox}" styleClass="myCustomChekBox">
		           		                         <p:ajax event="change" update=":form:delCtPerson,:form:contactPersonDt" partialSubmit="true" process="@this"
		           		                             listener="#{centralContractBackingBean.selectOnePersonCheckboxSelect}"></p:ajax>
			                              </p:selectBooleanCheckbox>
				                   </p:column>    
						           <p:column style="width:20%;white-space:normal;" styleClass="column-align-center">
						                  <f:facet name="header">
						                        <h:outputText value="#{lbl['lbl.ct.contact.person.name']}"  styleClass="required"></h:outputText>
						                   </f:facet>
						                   <c:if test="#{!centralContractBackingBean.managedBean.viewContract}">
							                     <p:inputText id="cperson" value="#{contactPersonsVar.name}" 
							                            maxlength="20"  disabled="#{centralContractBackingBean.managedBean.viewContract}"
							   	                        style="width:90%;" label="#{lbl['lbl.ct.contact.person.name']}" onkeypress="if (event.keyCode == 13) { return false; }"/>
							   	           </c:if>
							   	           <c:if test="#{centralContractBackingBean.managedBean.viewContract}">
							   	                  <h:outputText  value="#{contactPersonsVar.name}" style="float:left;" />
							   	            </c:if>
						                </p:column>
						                <p:column headerText="#{lbl['lbl.ct.address']}" style="width:40%;white-space:normal;" styleClass="column-align-center">
							                   <c:if test="#{!centralContractBackingBean.managedBean.viewContract}">
							                      <p:inputText value="#{contactPersonsVar.address}" style="width:95%;" maxlength="200"
								                       disabled="#{centralContractBackingBean.managedBean.viewContract}" onkeypress="if (event.keyCode == 13) { return false; }"/>
								               </c:if>
							   	                      <c:if test="#{centralContractBackingBean.managedBean.viewContract}">
							   	                              <h:outputText  value="#{contactPersonsVar.address}" style="float:left;"/>
							   	                      </c:if>
						                   </p:column>
						
						                   <p:column style="width:20%;white-space:normal;" styleClass="column-align-center">
							                      <f:facet name="header">
										            <h:outputText value="#{lbl['lbl.ct.email']}"/>
								               		<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.email']}"/>
								               	</f:facet>							                      
							                      <c:if test="#{!centralContractBackingBean.managedBean.viewContract}">
							                
							                      <p:inputText id="validateEmail" value="#{contactPersonsVar.email}" maxlength="100"
							                             style="width:90%;"  label="#{lbl['lbl.ct.email']}"
							                             disabled="#{centralContractBackingBean.managedBean.viewContract}" onkeypress="if (event.keyCode == 13) { return false; }"/>
							                       </c:if>
							   	                      <c:if test="#{centralContractBackingBean.managedBean.viewContract}">
							   	                              <h:outputText  value="#{contactPersonsVar.email}" style="float:left;" />
							   	                      </c:if>
						                    </p:column>
						
						                    <p:column style="width:15%;" styleClass="column-align-center">
						                    	<f:facet name="header">
										            <h:outputText value="#{lbl['lbl.ct.tel']}"/>
								               		<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.tel.no']}"/>
								               	</f:facet>
						                       <c:if test="#{!centralContractBackingBean.managedBean.viewContract}">
							                     <p:inputText id="validPhone" style="width:90%;" label="#{lbl['lbl.ct.tel']}" maxlength="100"
							                           value="#{contactPersonsVar.phoneNo}" 
							                           disabled="#{centralContractBackingBean.managedBean.viewContract}"
							                           onkeypress="if (event.keyCode == 13) {  return false; }"/>
							                             </c:if>
							   	                      <c:if test="#{centralContractBackingBean.managedBean.viewContract}">
							   	                              <h:outputText  value="#{contactPersonsVar.phoneNo}" style="float:left;" />
							   	                      </c:if>
						                    </p:column>
		               </p:dataTable>
	
	                	<div class="ppRightBtn"> 
			                    <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" partialSubmit="true" 
			                         action="#{centralContractBackingBean.addContactPerson()}" update="contactPersonDt" widgetVar="addContactPersonBtn"
			 	                    oncomplete="contactPersonObj.paginator.endLink.click();" rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
			                    <p:commandButton id="delCtPerson"   value="#{lbl['lbl.ct.delete']}" process="@this"  partialSubmit="true" 
			                         disabled="#{centralContractBackingBean.managedBean.buttonHideActiveDel}"
			                          onsuccess="delCtPersonDlg.show()" rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>				
		                </div>
		 
		                <p:confirmDialog id="delCtPersonDlg" widgetVar="delCtPersonDlg" 
	   	                       message="#{lbl['lbl.msg.confirm.delete']}" 	severity="alert"  closable="true"
			                   appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                              <div class="ppRightBtn">
		                            <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:contactPersonDt, :form:delCtPerson" partialSubmit="true"
		                                     action="#{centralContractBackingBean.deleteTableRow('PERSON')}" oncomplete="delCtPersonDlg.hide();"/>
			                         <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delCtPersonDlg.hide();" type="button" />
		                     </div>
                      </p:confirmDialog>
          </p:panel>
	
	       <p:panel id="exemptedOrgPnl" header="#{lbl['lbl.ct.panel.exempted.ministry']}" toggleable="true" toggleSpeed="500">
		  
		   <p:dataTable id="exemptedOrgDt" var="exemptedOrgsVar"  rowIndexVar="index" widgetVar="exemptedOrgsWidget" 
		           value="#{centralContractBackingBean.managedBean.circularVer.ctExemptedOrgs}"
rowKey="#{exemptedOrgsVar}" >
			            <ac:paginator for="exemptedOrgDt" />
			               <p:column  style="width:5%; text-align:center" 
				                         rendered="#{!centralContractBackingBean.managedBean.viewContract}">
				                           <f:facet name="header">
							                     <p:selectBooleanCheckbox value="#{centralContractBackingBean.managedBean.selectAll}">
								                     <p:ajax partialSubmit="true" process="@this"
									                      update=":form:exemptedOrgDt,:form:delExemptedBtn" listener="#{centralContractBackingBean.selectAllexemptedOrg}" />
							                    </p:selectBooleanCheckbox>
						                </f:facet>
		           
		                                 <p:selectBooleanCheckbox
		                                      value="#{exemptedOrgsVar.selectedCheckBox}" styleClass="myCustomChekBox">
		           		                         <p:ajax event="change" update=":form:delExemptedBtn,:form:exemptedOrgDt" 
		           		                             listener="#{centralContractBackingBean.selectExemptedOrgCheckboxSelect}"></p:ajax>
			                              </p:selectBooleanCheckbox>
				             </p:column>
		                    <p:column headerText="#{lbl['lbl.ct.panel.exempted.org.type']}" 
				                   style="width:30%;" styleClass="column-align-center">
				                    <p:selectOneMenu id="OrgTypeId" 
				                           style="width:200px;float:left;" value="#{exemptedOrgsVar.orgTypeCode}" disabled="true">
		            	                   <f:selectItems value="#{centralContractBackingBean.retrieveParameterDescListByType()}"/>
		            	            </p:selectOneMenu>
		                   </p:column>
		                   <p:column headerText="#{lbl['lbl.ct.panel.exempted.org.name']}" 
		                         style="width:65%;" styleClass="column-align-center">
		                               <h:outputText value="#{exemptedOrgsVar.orgProfile.orgName}" style="float:left;"/>
		                   </p:column>
	       </p:dataTable>
	     
	       <div class="ppRightBtn">
	                <p:commandButton id="addExemptedBtn" value="#{lbl['lbl.btn.add']}" rendered="#{!centralContractBackingBean.managedBean.viewContract}"  
                          partialSubmit="true" process="@this" update=":form:dialogExemptedMinistry" action="#{centralContractBackingBean.clickExemptedOrgBtn}" 
                          oncomplete="dlgExemptedMinistry.show()">
       	            </p:commandButton>
       	            <p:commandButton id="delExemptedBtn" process="@form" 
       	            rendered="#{!centralContractBackingBean.managedBean.viewContract}"  
		                  value="#{lbl['lbl.ct.delete']}"   onsuccess="dlgExemptedDel.show()"
		                    disabled="#{centralContractBackingBean.managedBean.buttonHideActiveDel}">
		            </p:commandButton>
	         </div>
	      
	       <p:confirmDialog id="dlgExemptedDel" widgetVar="dlgExemptedDel" 
	   	       message="#{lbl['lbl.msg.confirm.delete']}" 	severity="alert"  closable="true"
			    appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                     <div class="ppRightBtn">
		                    <p:commandButton value="#{lbl['lbl.btn.yes']}"  
		                         action="#{centralContractBackingBean.deleteTableRow('ORG')}" 
		                         update=":form:exemptedOrgDt,:form:delExemptedBtn" partialSubmit="true"  oncomplete="dlgExemptedDel.hide();">
		                    </p:commandButton>
			                <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgExemptedDel.hide();" />
		             </div>
                 </p:confirmDialog>
	    
	              <p:dialog id="dialogExemptedMinistry"  header="#{lbl['lbl.ct.panel.exempted.org.dlg']}" 
	                     widgetVar="dlgExemptedMinistry" styleClass="pop_up_top" modal="true" width="670" height="auto">
			            <p:panel id="popUpExmptedDlg" header="#{lbl['lbl.ct.search']}" toggleable="true" toggleSpeed="500">
			                  <p:messages id="exemptedMsgId" showSummary="false"
			                         showDetail="true"  autoUpdate="true" closable="true" severity="error, info" />
		                             <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.add.orgtype.menu']}" escape="false"/><br/><br/>
		        
		                            <h:panelGrid columns="3">
		                                    <p:selectOneMenu for="OrgTypeId"  style="width:150px" disabled="true" >
            	                                   <f:selectItem itemLabel="#{lbl['lbl.ct.panel.exempted.org.type']}" itemValue=""/>
                                            </p:selectOneMenu>
		                                   <p:spacer height="1"/>
		                                   <p:selectOneMenu id="OrgTypeId"   label="#{lbl['lbl.ct.panel.exempted.org.type']}"  
		                                         style="width:300px" value="#{centralContractBackingBean.managedBean.orgTypeCode}">
            	                               <f:selectItems value="#{centralContractBackingBean.retrieveParameterDescListByType()}"/>
            	                                   <p:ajax event="change"  update=":form:exmptedMinistryId,:form:popUpExmptedTable"
            	                                         process="@this"  listener="#{centralContractBackingBean.resetMinistryDetails}" ></p:ajax>
            	                            </p:selectOneMenu>
            	                     </h:panelGrid>
            	    
            	           <h:panelGroup  id="exmptedMinistryId">
                                   
                                   <h:panelGrid  rendered="#{centralContractBackingBean.managedBean.orgTypeCode ==ParameterConst.orgTypePtj 
                                                 or centralContractBackingBean.managedBean.orgTypeCode == ParameterConst.orgTypeJabatan}" columns="3" >
                                          <p:selectOneMenu for="ministry"  style="width:150px" disabled="true" >
            	                                  <f:selectItem itemLabel="#{lbl['lbl.ct.ministry']}" itemValue=""/>
                                           </p:selectOneMenu>
                                          <p:spacer height="1"/>
                                          <p:selectOneMenu id="ministry" label="#{lbl['lbl.ct.ministry']}"
                                                  value="#{centralContractBackingBean.managedBean.ministryProfileId}" style="width:300px"  >
            	                                  <f:selectItems value="#{centralContractBackingBean.getMinistryDropdown()}"/>
            	                                  <p:ajax event="change" update=":form:jabatan" partialSubmit="true"
            	                                         process="@this" listener="#{centralContractBackingBean.settingMinistryListener}" />
                                         </p:selectOneMenu>
                                   </h:panelGrid>
                     
                                   <h:panelGrid columns="3" 
                                         rendered="#{centralContractBackingBean.managedBean.orgTypeCode == ParameterConst.orgTypePtj}">
                                           <p:selectOneMenu for="jabatan"  style="width:150px" disabled="true" >
            	                                <f:selectItem itemLabel="#{lbl['lbl.ct.jabatan']}" itemValue=""/>
                                           </p:selectOneMenu>
                                          <p:spacer height="1"/>
                                          <p:selectOneMenu id="jabatan" style="width:300px"
                                                value="#{centralContractBackingBean.managedBean.jabatanProfileId}" >
            	                                <f:selectItems value="#{centralContractBackingBean.getJabatanDropdown()}"/>
            	                                <p:ajax process="@this"></p:ajax>
                                          </p:selectOneMenu>
                                </h:panelGrid>
                    
                              <h:panelGrid rendered="#{centralContractBackingBean.managedBean.orgTypeCode == ParameterConst.orgTypePtj
                                           or centralContractBackingBean.managedBean.orgTypeCode == ParameterConst.orgTypeJabatan
                                           or centralContractBackingBean.managedBean.orgTypeCode == ParameterConst.orgTypeMinistry}" columns="3" >
                                      <p:selectOneMenu for="ptjcodename" 
                                           value="#{centralContractBackingBean.managedBean.ptjCodeName}"  style="width:150px;">
                                           <f:selectItem itemLabel="#{lbl['lbl.ct.org.code']}" itemValue="#{CtConst.ptjCode}"/>
            	                           <f:selectItem itemLabel="#{lbl['lbl.ct.org.name']}" itemValue="#{CtConst.ptjName}"/>
            	                           <p:ajax process="@this"/>
                                      </p:selectOneMenu>
				                      <p:spacer height="1"/>
                                      <p:inputText id="ptjCodeVaue"  style="width:305px;" onkeypress="if (event.keyCode == 13) { orgSearchBtn.jq.click(); return false; }" 
                                             value="#{centralContractBackingBean.managedBean.ptjCodeNameSearchValues}" >
                                            <p:ajax process="@this"/>
                                      </p:inputText>
			                 </h:panelGrid>
			  	           
			  	             <div class="ppRightBtn">
       		                        <p:commandButton id="PtjSearchId" value="#{lbl['lbl.btn.search']}" widgetVar="orgSearchBtn" 
       		                              disabled="#{centralContractBackingBean.managedBean.orgTypeCode == null}"
       		                              update=":form:tablePtjCode"  action="#{centralContractBackingBean.searchPtjDetails}" process="@this">
       		                        </p:commandButton> 
			                       <p:commandButton id="resetlBtn"
			                                  action="#{centralContractBackingBean.flushExempMisntry}"  process="@this"  value="#{lbl['lbl.ct.reset']}" 
			                                 disabled="#{centralContractBackingBean.managedBean.orgTypeCode == null}" 
			                                 update=":form:exmptedMinistryId, :form:tablePtjCode,:form:OrgTypeId" >
			                       </p:commandButton>
		                       </div>
		             </h:panelGroup>
		            </p:panel>
			          <p:spacer height="2"/>
                      <p:panel id="popUpExmptedTable" header="#{lbl['lbl.ct.search.result']}" toggleable="true" toggleSpeed="500">
                      <p:dataTable id="tablePtjCode" var="pmVar" value="#{centralContractBackingBean.exemptedOrgDataModel}" 
                              rowIndexVar="rowIndex"  rowKey="#{pmVar}" lazy="true" 
                              selection="#{centralContractBackingBean.managedBean.selectedOrgsProfile}">
                              <ac:paginator for="tablePtjCode"/>
                                 <p:ajax event="toggleSelect"  update=":form:tablePtjCode,:form:exmptedPopUpButton" />
                                  <p:ajax event="rowSelect" update=":form:tablePtjCode,:form:exmptedPopUpButton" />
			                      <p:ajax event="rowSelectCheckbox"  update=":form:tablePtjCode,:form:exmptedPopUpButton" />
                                  <p:ajax event="rowUnselectCheckbox"  update=":form:tablePtjCode,:form:exmptedPopUpButton" />
                                  <p:column selectionMode="multiple" style="width:3%" 
				                         rendered="#{!panelBackingBean.managedBean.viewContract}"/>
                             <p:column headerText="#{lbl['lbl.ct.org.code']}" >
                                	#{pmVar.orgCode}
					         </p:column>
                             <p:column headerText="#{lbl['lbl.ct.org.name']}" >
                                  	#{pmVar.orgName}
					         </p:column>
			            </p:dataTable>
			           <p:spacer height="2"/>           
			 
			            <div class="ppRightBtn">
				              <p:commandButton id="exmptedPopUpButton"  process="@form" update=":form:exemptedOrgDt,:form:exemptedMsgId" 
				                      disabled="#{centralContractBackingBean.managedBean.selectedOrgsProfile.size() == 0
				                      or centralContractBackingBean.managedBean.selectedOrgsProfile.size() == ''
				                      or centralContractBackingBean.managedBean.selectedOrgsProfile == null}"
				                     value="#{lbl['lbl.btn.select']}"   action="#{centralContractBackingBean.addExemtedOrgDetails()}"
				                     oncomplete="exemptedOrgsWidget.paginator.endLink.click();">
				              </p:commandButton>
				               <p:commandButton id="closeButId" value="#{lbl['lbl.btn.cancel']}"  onclick="dlgExemptedMinistry.hide();"  type="button"
				                  action="#{centralContractBackingBean.autoUpdate()}" />
                       </div>
                   </p:panel>
	           </p:dialog>
	 </p:panel>
	
	<p:panel id="cancelCircularPnl" header="#{lbl['lbl.ct.panel.related.cancelled.circular']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="cancelCircularDt" var="cancelCircularVar" rowKey="#{cancelCircularVar}" rowIndexVar="index" 
			value="#{centralContractBackingBean.managedBean.circularVer.ctCancelCircularList}"
			selection="#{centralContractBackingBean.managedBean.selectedCancelCirculars}"
			widgetVar="cancelCircularWidget" >
			<ac:paginator for="cancelCircularDt" />
			    <p:column  style="width:5%; text-align:center;" 
				rendered="#{!centralContractBackingBean.managedBean.viewContract}">
			     	<f:facet name="header">
					     <p:selectBooleanCheckbox value="#{centralContractBackingBean.managedBean.selectAll}">
						       <p:ajax partialSubmit="true" process="@this"
									 update=":form:cancelCircularDt,:form:cancelCircularDelBtn" listener="#{centralContractBackingBean.selectAllCancelCircular}" />
						 </p:selectBooleanCheckbox>
				      </f:facet>
		           
		               <p:selectBooleanCheckbox 
		                     value="#{cancelCircularVar.selectedCheckBox}" styleClass="myCustomChekBox">
		           		      <p:ajax event="change"
		           		             update=":form:cancelCircularDt,:form:cancelCircularDelBtn" listener="#{centralContractBackingBean.selectCancelCheckboxSelect}"></p:ajax>
			          </p:selectBooleanCheckbox>     
				</p:column>
			    <p:column headerText="#{lbl['lbl.ct.physical.circular.no']}" styleClass="column-align-center">
				       <h:outputText value="#{cancelCircularVar.circularVer.circularNo}" style="float:left;"/>
			    </p:column>
			    <p:column headerText="#{lbl['lbl.ct.circular.name']}" styleClass="column-align-center">
				     <h:outputText value="#{cancelCircularVar.circularVer.name}" style="float:left;"/>
			    </p:column>
		</p:dataTable>
		<div class="ppRightBtn"> 
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" update="cancelledCclDt,:form:cancelCircularDlg"
				actionListener="#{centralContractBackingBean.addCancelCircularListener()}" 
				rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
				  <p:commandButton  process="@form" id="cancelCircularDelBtn"
				          disabled="#{centralContractBackingBean.managedBean.buttonHideActiveDel}"
				         rendered="#{!centralContractBackingBean.managedBean.viewContract}"  
		                  value="#{lbl['lbl.ct.delete']}"   onsuccess="circularDeleteDlg.show()"/>			
		</div>		  
		   <p:confirmDialog id="cancelCircularDelete" widgetVar="circularDeleteDlg" 
	   	       message="#{lbl['lbl.msg.confirm.delete']}" 	severity="alert"  closable="true"
			    appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                     <div class="ppRightBtn">
		                    <p:commandButton value="#{lbl['lbl.btn.yes']}"  
		                         action="#{centralContractBackingBean.deleteTableRow('CANCEL')}" 
		                         update=":form:cancelCircularDt, :form:cancelCircularDelBtn"
		                           partialSubmit="true"  oncomplete="circularDeleteDlg.hide();">
		                    </p:commandButton>
			                <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="circularDeleteDlg.hide();" />
		             </div>
                 </p:confirmDialog>
	</p:panel>
	
	<p:dialog id="cancelCircularDlg" header="#{lbl['lbl.ct.cancelled.circular']}" widgetVar="cancelCircularDlg" 
		styleClass="pop_up_top" modal="true" width="550" height="auto">
			<p:dataTable id="cancelledCclDt" var="cancelledCircularDlgVar" rowKey="#{cancelledCircularDlgVar}" rowIndexVar="index"
				value="#{centralContractBackingBean.managedBean.cancelledCircularList}" widgetVar="cancelledCircularObj"
				selection="#{centralContractBackingBean.managedBean.selectedCancelledCircularList}" >
				<ac:paginator for="cancelledCclDt" />
				<p:column  style="width:3%">
				                <f:facet name="header">
							      <p:selectBooleanCheckbox value="#{centralContractBackingBean.managedBean.selectAll}">
								     <p:ajax partialSubmit="true" process="@this"
									      update=":form:cancelledCclDt, :form:popUpSlectButtonId" listener="#{centralContractBackingBean.selectAllCancelCircularList}" />
							      </p:selectBooleanCheckbox>
						       </f:facet>
		           
		                        <p:selectBooleanCheckbox 
		                             value="#{cancelledCircularDlgVar.selectedCheckBox}" styleClass="myCustomChekBox">
		           		               <p:ajax event="change"
		           		                  update=":form:cancelledCclDt,:form:popUpSlectButtonId" listener="#{centralContractBackingBean.selectCancelCheckboxSelectList}"></p:ajax>
			                     </p:selectBooleanCheckbox>     
				              </p:column>
				<p:column headerText="#{lbl['lbl.ct.physical.circular.no']}" styleClass="column-align-center"
				      filterBy="#{cancelledCircularDlgVar.circularVer.circularNo}"   filterMatchMode="contains">
					<h:outputText value="#{cancelledCircularDlgVar.circularVer.circularNo}" style="float:left;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.name']}" styleClass="column-align-center">
					<h:outputText value="#{cancelledCircularDlgVar.circularVer.name}" style="float:left;" />
				</p:column>									
			</p:dataTable>
			<p:spacer height="5"></p:spacer>
			<div class="ppRightBtn"> 
				<p:commandButton id="popUpSlectButtonId" value="#{lbl['lbl.btn.ok']}"  process="cancelCircularDlg" 
					action="#{centralContractBackingBean.addCancelledCircular}"
					disabled="#{centralContractBackingBean.managedBean.buttonHideActiveDel}"
					update="cancelCircularDt" onclick="cancelCircularDlg.hide();"
					oncomplete="cancelCircularWidget.paginator.endLink.click();"/>
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" 
				     type="button" ajax="false" onclick="cancelCircularDlg.hide();" />
			</div>			
	</p:dialog>
</ui:composition>
