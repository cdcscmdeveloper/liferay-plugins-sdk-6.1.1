<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<p:panel id="ccc" header="#{lbl['lbl.ct.cc.panel.ccd']}" toggleable="true" toggleSpeed="500">
		<h:panelGroup rendered="#{!centralContractBackingBean.managedBean.updateAction and (centralContractBackingBean.managedBean.circularVer.extendStartDate  == null)}">
			<ui:include src="createCircularDetail.xhtml" />
		</h:panelGroup>
		<h:panelGroup rendered="#{centralContractBackingBean.managedBean.updateAction || (centralContractBackingBean.managedBean.circularVer.extendStartDate  != null)}">
			<ui:include src="updateCircularDetail.xhtml" />
		</h:panelGroup>		
	</p:panel>
	
	<p:panel id="contactPerson" header="#{lbl['lbl.ct.pc.cpd']}" toggleable="true" toggleSpeed="500" widgetVar="panelcontactPerson">
		<p:dataTable id="contactPersonDt" var="data" value="#{centralContractBackingBean.managedBean.circularVer.ctContactPersons}"
		 	rowKey="#{data}" rowIndexVar="index" selection="#{centralContractBackingBean.managedBean.selectedContactPersons}">
			<ac:paginator for="contactPersonDt" />
			<p:column selectionMode="multiple" style="width:3%" />
			<p:column headerText="#{lbl['lbl.ct.pc.cperson']}">
				<p:inputText id="cperson" value="#{data.name}" maxlength="20"
				   style="width:150px;" label="#{lbl['lbl.ct.pc.cperson']}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.pc.caddress']}">
				<p:inputText value="#{data.address}" style="width:250px;" maxlength="200" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.pc.cemail']}">
				  <p:inputText id="validateEmail" value="#{data.email}" maxlength="100"
				     style="width:120px;" validator="#{webappBean.checkEmail}" label="#{lbl['lbl.ct.pc.cemail']}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.pc.pno']}">
				<p:inputText id="validPhone" style="width:120px;" label="#{lbl['lbl.ct.pc.pno']}" maxlength="100"
				   value="#{data.phoneNo}"  validator="#{webappBean.checkPhoneNumber}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" partialSubmit="true" icon="ui-icon-add"
				action="#{centralContractBackingBean.addContactPerson()}" update="contactPersonDt" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this"
			  partialSubmit="true" icon="ui-icon-delete" onsuccess="delCtPersonDlg.show()"/>				
		</div>
		
		<p:dialog id="delCtPersonDlg" header="#{lbl['lbl.ct.dialong.cofirm.header']}" resizable="false"
		    styleClass="screen-title" widgetVar="delCtPersonDlg"  modal="true" width="350" height="95">  
            <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png" value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			  <p:spacer width="10"/>
              <p:inputTextarea styleClass="ui-inputtextarea" rows="2" cols="48" value="Are you sure you want to delete this record?"/>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" icon="ui-icon-accept" update="@([id$=contactPersonDt])"
		       process="@all" actionListener="#{centralContractBackingBean.deleteContactPerson()}" onclick="delCtPersonDlg.hide();"/>
			 <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" icon="ui-icon-reject" onclick="delCtPersonDlg.hide();" type="button" />
		   </div>
        </p:dialog>  		
        
	</p:panel>
	
	<p:panel id="exemptedOrgPnl" header="Exempted Ministry" toggleable="true" toggleSpeed="500">
		<p:dataTable id="exemptedOrgDt" var="data" value="#{centralContractBackingBean.managedBean.circularVer.ctExemptedOrgs}"
		 	rowKey="#{data}" rowIndexVar="index" selection="#{centralContractBackingBean.managedBean.selectedExemptedOrgs}">
			<ac:paginator for="exemptedOrgDt" />
			<p:column selectionMode="multiple" style="width:3%" />
			<p:column headerText="Ministry">
				#{data.orgProfile.orgName}
			</p:column>
		</p:dataTable>
		<p:spacer height="2" />		
		<div>
			<table style="width: 100%">
				<tr><td class="TableFieldLeft" width="80%"></td>
			 	<td>
			   	<table><tr>
			   		<td>
		   			<ac:lov id="ministryId" lovId="PM_ORG_PROFILE"
						postUpdateListener="centralContractBackingBean.addExemptedOrg(centralContractBackingBean.managedBean.orgProfiles)"
						headerText="Ministry" 
						buttonLabel="Add"
						buttonIcon="ui-icon-add" 
						selectionMode="multiple"
						saveObject="centralContractBackingBean.managedBean.orgProfiles"
						conditionField="orgTypeCode.parameterCode^#{ParameterConst.orgTypeMinistry}|recordStatus^1" update="@form" />
					</td>
					<td>
					  <p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this" 
						  partialSubmit="true" icon="ui-icon-delete" 
						  onsuccess="delExemptedOrgDlg.show()"/>
					</td>
					</tr></table>
				</td>
			    </tr>
			</table>
		 </div>
		<p:dialog id="delExemptedOrgDlg" header="#{lbl['lbl.ct.dialong.cofirm.header']}" resizable="false"
		    styleClass="screen-title" widgetVar="delExemptedOrgDlg"  modal="true" width="350" height="95">  
            <h:panelGrid columns="3">
              <p:graphicImage library="ep/images/design" name="exclamation.png" value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			  <p:spacer width="10"/>
              <p:inputTextarea styleClass="ui-inputtextarea" rows="2" cols="48" value="Are you sure you want to delete this record?"/>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" icon="ui-icon-accept" update="@([id$=exemptedOrgDt])"
		       process="@all" actionListener="#{centralContractBackingBean.deleteExemptedOrg()}" onclick="delExemptedOrgDlg.hide();"/>
			 <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" icon="ui-icon-reject" onclick="delExemptedOrgDlg.hide();" type="button" />
		   </div>
        </p:dialog>  	
        
	</p:panel>
	
	<p:panel id="cancelCircularPnl" header="Related Cancelled Circular" toggleable="true" toggleSpeed="500">
		<p:dataTable id="cancelCircularDt" var="data" rowKey="#{data}" rowIndexVar="index" 
			value="#{centralContractBackingBean.managedBean.circularVer.ctCancelCircularList}"
			selection="#{centralContractBackingBean.managedBean.selectedCancelCirculars}" >
			<ac:paginator for="cancelCircularDt" />
			<p:column selectionMode="multiple" style="width:3%" />
			<p:column headerText="#{lbl['lbl.ct.cc.cno']}">
				<h:outputText value="#{data.circularVer.circularNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.pc.cname']}" >
				<h:outputText value="#{data.circularVer.name}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2" />
		<div class="ppRightBtn"> 
			<p:commandButton value="#{lbl['lbl.btn.add']}" icon="ui-icon-add" oncomplete="cancelCircularDlg.show();" update="cancelledCclDt"
				actionListener="#{centralContractBackingBean.addCancelCircularListener()}" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@form" partialSubmit="true" icon="ui-icon-delete"
				action="#{centralContractBackingBean.deleteCancelCircular()}" update="cancelCircularDt" />			
		</div>		
	</p:panel>
	
	<p:dialog id="cancelCircularDlg" header="Cancelled Circulars" widgetVar="cancelCircularDlg" modal="true" width="550" height="350">
		<p:panel id="circular">
			<p:dataTable id="cancelledCclDt" var="data" rowKey="#{data}" rowIndexVar="index"
				value="#{centralContractBackingBean.managedBean.cancelledCircularList}" 
				selection="#{centralContractBackingBean.managedBean.selectedCancelledCircularList}" >
				<ac:paginator for="cancelledCclDt" />
				<p:column selectionMode="multiple" style="width:3%" />
				<p:column headerText="#{lbl['lbl.ct.cc.cno']}">
					<h:outputText value="#{data.circularVer.circularNo}" style="width:200px;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.cc.cname']}">
					<h:outputText value="#{data.circularVer.name}" style="width:300px;" />
				</p:column>									
			</p:dataTable>
			<p:spacer height="2" />
			<div class="ppRightBtn"> 
				<p:commandButton value="#{lbl['lbl.btn.ok']}" icon="ui-icon-accept" process="cancelCircularDlg" 
					action="#{centralContractBackingBean.addCancelledCircular}"
					update="cancelCircularDt" onclick="cancelCircularDlg.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" icon="ui-icon-cancel" type="button" ajax="false" onclick="cancelCircularDlg.hide();" />
			</div>			
		</p:panel>
	</p:dialog>
</ui:composition>
