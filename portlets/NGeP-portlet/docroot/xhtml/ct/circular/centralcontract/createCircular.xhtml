<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/circular/shared/sidemenu/central.xhtml" />
	</ui:define>
    <ui:define name="content">
	<p:panel id="pRightPanel">
			<div class="ppRightBtn">
				<p:commandButton id="ctSave" value="#{lbl['lbl.ct.btn.save']}"/>
				<p:commandButton id="ctSubmit" value="#{lbl['lbl.ct.btn.submit']}"/>
			</div>
		</p:panel>
       <p:panel id="cc" header="#{lbl['lbl.ct.cc.panel.ccd']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelcc">
          <ui:include src="/xhtml/ct/circular/shared/create.xhtml" />
       </p:panel>
		<p:panel id="contactPerson" header="Contact Person Details"  toggleable="true"  toggleSpeed="500" widgetVar="panelcontactPerson">
           <p:dataTable id="tablePerson" var="data" value="#{centralBackingBean.managedBean.contractPerson}"  widgetVar="dataTableObj" 
           lazy="false" dynamic="true" rowIndexVar="index">
			  <p:columnGroup type="header"> 
			  <p:row> 
				  <p:column style="width:30px;" headerText="#{lbl['lbl.ct.cc.no']}"  /> 
				  <p:column style="width:150px;" headerText="#{lbl['lbl.ct.cc.cperson']}" /> 
				  <p:column style="width:280px;" headerText="#{lbl['lbl.ct.cc.caddress']}" /> 	
				  <p:column style="width:100px;" headerText="#{lbl['lbl.ct.cc.cemail']}"  /> 
				  <p:column style="width:100px;" headerText="#{lbl['lbl.ct.cc.pno']}"  /> 
				  <p:column style="width:80px;" headerText="#{lbl['lbl.ct.cc.action']}"  />   
			  </p:row>	
			 </p:columnGroup>
			 <p:column styleClass="column-align-center" >
				       <h:outputText value="#{index+1}" /></p:column> 														                   
					    <p:column><p:inputText value="#{data.contractPersonName}" style="width:140px;"/></p:column>	
					  <p:column> <p:inputText value="#{data.contractAddress}"  style="width:240px;"/> </p:column>
				      <p:column><p:inputText value="#{data.contractEmail}" style="width:90px;"/></p:column>	
				      <p:column><p:inputText value="#{data.contractPhone}" style="width:90px;"/></p:column>	
					  <p:column styleClass="column-align-center">
					  <p:commandButton title="delete" onsuccess="confirmation.show()"
									partialSubmit="true" process="@this" icon="ui-icon-delete">
					    <f:setPropertyActionListener value="#{data}" target="#{centralBackingBean.managedBean.deleteContractPerson}" />
					  </p:commandButton>
					  </p:column> 
		</p:dataTable>
		<p:confirmDialog message="Do you want to delete the record?"
	     closable="true" appendToBody="true" header="Delete Confirmation"
							severity="alert" widgetVar="confirmation">

							<h:panelGrid columns="2"
								columnClasses="column-align-right-50,column-align-left">
								<p:commandButton value="Yes" 
									update="tablePerson" partialSubmit="true" process="@this"
									onclick="confirmation.hide();" actionListener="#{centralBackingBean.deletePersonList()}"/>
								<p:commandButton value="No" 
									onclick="confirmation.hide()" type="button" />
							</h:panelGrid>
						</p:confirmDialog>
						
		<h:panelGrid style="width:800px" columnClasses="column-align-right">
		  <p:commandButton value="Add" styleClass="text-align: right;" process="@this" partialSubmit="true" icon="ui-icon-add"  
		  action="#{centralBackingBean.addNewPerson()}" update="tablePerson"/>
	    </h:panelGrid>
      </p:panel>
      <p:panel id="centralContractList" header="#{lbl['lbl.ct.cc.ct']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelcentralCircular">
       <p:dataTable id="dataTable1" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" rowIndexVar="index"
		  paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
	      rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
	      paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
		  <p:columnGroup type="header"> 
		    <p:row> 
               <p:column colspan="1" style="width:30px;" headerText="#{lbl['lbl.ct.cc.no']}"  /> 
               <p:column colspan="1"  style="width:100px;" headerText="#{lbl['lbl.ct.cc.ctno']}" /> 
               <p:column colspan="1"  style="width:120px;" headerText="#{lbl['lbl.ct.cc.ctname']}" /> 	
               <p:column colspan="1" style="width:100px;" headerText="#{lbl['lbl.ct.cc.loa']}"  /> 
               <p:column colspan="1" style="width:100px;" headerText="#{lbl['lbl.ct.cc.sup']}"  /> 
               <p:column colspan="1" style="width:80px;" headerText="#{lbl['lbl.ct.cc.status']}"  />  
               <p:column colspan="1" style="width:80px;" headerText="#{lbl['lbl.ct.cc.ctsdate']}"  /> 
               <p:column colspan="1" style="width:80px;" headerText="#{lbl['lbl.ct.cc.ctedate']}"  /> 
               <p:column colspan="1" style="width:80px;" headerText="#{lbl['lbl.ct.cc.action']}"  />    
		   </p:row>	
		</p:columnGroup>
		<p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
		   <p:column> </p:column>
		   <p:column></p:column>	
		   <p:column> </p:column>
		   <p:column></p:column>	
		   <p:column></p:column>	
		   <p:column> </p:column>
		   <p:column> </p:column>
		   <p:column styleClass="column-align-center">
		   <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
			  icon="ui-icon-delete" styleClass="ui-icon-button"/>
		   </p:column> 
	   </p:dataTable>
	   <h:panelGrid style="width:800px" columnClasses="column-align-right">
		  <p:commandButton value="Add" styleClass="text-align: right;" process="@this" partialSubmit="true" icon="ui-icon-add" 
			 onclick="dlg2.show();"/>
	   </h:panelGrid>
      </p:panel>
      <p:panel id="concelCircular" header="Cancel Circular From List"  toggleable="true"  toggleSpeed="500" widgetVar="panelconcelCircular">
         <p:dataTable id="dataTable2" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" rowIndexVar="index">
		  <p:columnGroup type="header"> 
			<p:row> 
			  <p:column colspan="1" style="width:30px;" headerText="#{lbl['lbl.ct.cc.no']}"  /> 
              <p:column colspan="1"  style="width:100px;" headerText="#{lbl['lbl.ct.cc.cno']}" /> 
              <p:column colspan="1"  style="width:200px;" headerText="#{lbl['lbl.ct.cc.cname']}" /> 	
              <p:column colspan="1" style="width:100px;" headerText="#{lbl['lbl.ct.cc.frno']}"  /> 
              <p:column colspan="1" style="width:100px;" headerText="#{lbl['lbl.ct.cc.coverage']}"  /> 
              <p:column colspan="1" style="width:80px;" headerText="#{lbl['lbl.ct.cc.csdate']}"  />  
              <p:column colspan="1" style="width:80px;" headerText="#{lbl['lbl.ct.cc.cedate']}"  /> 
              <p:column colspan="1" style="width:80px;" headerText="#{lbl['lbl.ct.cc.action']}"  />    
		   </p:row>	
		 </p:columnGroup>
		 <p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
		   <p:column> </p:column>
		   <p:column></p:column>	
		   <p:column> </p:column>
		   <p:column></p:column>	
		   <p:column></p:column>	
		   <p:column> </p:column>
		   <p:column styleClass="column-align-center">
		   <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
			  icon="ui-icon-delete" styleClass="ui-icon-button"/>
		   </p:column> 
		</p:dataTable>
		<h:panelGrid style="width:800px" columnClasses="column-align-right">
		 <p:commandButton value="Add" styleClass="text-align: right;" process="@this" partialSubmit="true" icon="ui-icon-add" 
		    onclick="dlg3.show();"/>
		</h:panelGrid>
      </p:panel>
      
		<p:dialog id="modalDialog" header="Contract List" widgetVar="dlg2" modal="true" width="800" height="400">
		  <p:panel  id="contractList">
             <h:panelGrid columns="3">
				<p:selectOneMenu id="contract"  value="" style="width:150px">
            	   <f:selectItem itemLabel="--Please Select--" itemValue="" /> 
                	  <f:selectItem itemLabel="contract No" itemValue="contract No" /> 
                	  <f:selectItem itemLabel="contract Name" itemValue="contract Name" /> 
               </p:selectOneMenu>
               <p:inputText value=""></p:inputText>
               <p:commandButton value="Search" icon="ui-icon-select"  process="modalDialog" update="dataTable3"/>
             </h:panelGrid>
	         <p:dataTable id="dataTable3" var="data" value="#{centralBackingBean.centralContract}" rowIndexVar="index" widgetVar="dataTableObj"
                lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10"  
                rowsPerPageTemplate="5,10,15,20" selection="#{centralBackingBean.managedBean.selectedCentralContractList}" rowKey="#{data.contractNo}"
                currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} " paginatorTemplate="{CurrentPageReport}  
                {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
                <p:column selectionMode="multiple" style="width:18px" />
				<p:column headerText=" Contract No">
					<h:outputText value="C00992394234" />
				</p:column>
                <p:column headerText="Contract Name">
				   <h:outputText value="Bekalan Pen Bebola" />
				</p:column>
                <p:column headerText="LOA No">
				   <h:outputText value="LOA 325/2012" />
				</p:column>
				<p:column headerText="Contract Start">
				   <h:outputText value="01-DEC-2012" />
				</p:column>
                <p:column headerText="Contract End">
				   <h:outputText value="LOA 325/2012" />
				</p:column>
			</p:dataTable>
            <f:facet name="footer">
			   <h:panelGrid columns="2"  style="height: 40px;vertical-align: middle;">
				 <p:commandButton value="Select" icon="ui-icon-select"  process="modalDialog" update="dataTable1" onclick="dlg2.hide();"/>
				 <p:commandButton value="Cancel"  type="button" ajax="false" onclick="dlg2.hide();" />
               </h:panelGrid>
			</f:facet>
         </p:panel>
	  </p:dialog>
	  <p:dialog id="modalDialog1" header="Circular List" widgetVar="dlg3" modal="true" width="800" height="400">
	  <p:panel  id="contractList1">
      <h:panelGrid columns="3">
		 <p:selectOneMenu id="circular"  value="" style="width:150px">
            <f:selectItem itemLabel="--Please Select--" itemValue="" /> 
            <f:selectItem itemLabel="Circular No" itemValue="Circular No" /> 
            <f:selectItem itemLabel="Circular Name" itemValue="Circular Name" /> 
         </p:selectOneMenu>
        <p:inputText value=""></p:inputText>
        <p:commandButton value="Search" icon="ui-icon-select"  process="modalDialog1" update="dataTable4"/>
     </h:panelGrid>
	 <p:dataTable id="dataTable4" var="data" value="#{centralBackingBean.centralCircularContract}" rowIndexVar="index" widgetVar="dataTableObj"
      lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" 
      emptyMessage="No Records!" rows="10"  rowsPerPageTemplate="5,10,15,20" 
      selection="#{centralBackingBean.managedBean.selectedCentralContractList}" rowKey="#{data.circularNo}"
      currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
      paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
      <p:column selectionMode="multiple" style="width:18px" />
	   <p:column headerText="Circular No">
	   <h:outputText value="C00992394234" />
	   </p:column>
       <p:column headerText="Circular Name">
		 <h:outputText value="Bekalan Pen Bebola" />
	   </p:column>
       <p:column headerText="Circular Type">
			<h:outputText value="LOA 325/2012" />
		</p:column>
		 <p:column headerText="Period (Start)">
			<h:outputText value="01-DEC-2012" />
		</p:column>
        <p:column headerText="Period (End)">
			<h:outputText value="LOA 325/2012" />
		</p:column>
	</p:dataTable>
        <f:facet name="footer">
		<h:panelGrid columns="2"  style="height: 40px;vertical-align: middle;">
			<p:commandButton value="Select" icon="ui-icon-select"  process="modalDialog1" update="dataTable2" onclick="dlg3.hide();"/>
			<p:commandButton value="Cancel"  type="button" ajax="false" onclick="dlg3.hide();" />
           </h:panelGrid>
		</f:facet>
    </p:panel>
    </p:dialog>
  </ui:define>
 </ui:composition>
