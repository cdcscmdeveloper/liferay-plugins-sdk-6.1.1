<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<p:panel id="ccc" header="#{lbl['lbl.ct.panel.central.contract.circular']}" toggleable="true" toggleSpeed="500">
		<h:panelGroup rendered="#{centralContractBackingBean.managedBean.circular.latestCircularVer == null
		 or centralContractBackingBean.managedBean.viewContract}">
			<ui:include src="createCircularDetail.xhtml" />
		</h:panelGroup>
		<h:panelGroup rendered="#{centralContractBackingBean.managedBean.circular.latestCircularVer != null and !centralContractBackingBean.managedBean.viewContract}">
			<ui:include src="updateCircularDetail.xhtml" />
		</h:panelGroup>		
	</p:panel>
	
	<p:panel id="contactPerson" header="#{lbl['lbl.ct.panel.contact.person']}" toggleable="true" toggleSpeed="500" widgetVar="panelcontactPerson">
		<p:dataTable id="contactPersonDt" var="contactPersonsVar" widgetVar="contactPersonObj"
		     value="#{centralContractBackingBean.managedBean.circularVer.ctContactPersons}" rowIndexVar="index"
		 	rowKey="#{contactPersonsVar}"  selection="#{centralContractBackingBean.managedBean.selectedContactPersons}">
			<ac:paginator for="contactPersonDt" />
			<p:column selectionMode="multiple" style="width:5%" 
				rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
			<p:column style="width:20%;" styleClass="column-align-center">
			   <f:facet name="header">
			      <h:outputText value="#{lbl['lbl.ct.contact.person.name']}"  styleClass="required"></h:outputText>
			   </f:facet>
				<p:inputText id="cperson" value="#{contactPersonsVar.name}" maxlength="20"
					disabled="#{centralContractBackingBean.managedBean.viewContract}"
				   	style="width:90%;" label="#{lbl['lbl.ct.contact.person.name']}"
				   	onkeypress="if (event.keyCode == 13) { return false; }">
				   	 </p:inputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.address']}" style="width:40%;" styleClass="column-align-center">
				<p:inputText value="#{contactPersonsVar.address}" style="width:95%;" maxlength="200"
					disabled="#{centralContractBackingBean.managedBean.viewContract}"
					onkeypress="if (event.keyCode == 13) { return false; }"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.email']}" style="width:20%;" styleClass="column-align-center">
				  <p:inputText id="validateEmail" value="#{contactPersonsVar.email}" maxlength="100"
				     style="width:90%;" validator="#{webappBean.checkEmail}" label="#{lbl['lbl.ct.email']}"
				     disabled="#{centralContractBackingBean.managedBean.viewContract}"
				     onkeypress="if (event.keyCode == 13) { return false; }">
				     </p:inputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.tel']}" style="width:15%;" styleClass="column-align-center">
				<p:inputText id="validPhone" style="width:90%;" label="#{lbl['lbl.ct.tel']}" maxlength="100"
				   value="#{contactPersonsVar.phoneNo}"  validator="#{webappBean.checkPhoneNumber}"
				   disabled="#{centralContractBackingBean.managedBean.viewContract}"
				   onkeypress="if (event.keyCode == 13) {  return false; }"/>
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn"> 
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" partialSubmit="true" 
			   action="#{centralContractBackingBean.addContactPerson()}" update="contactPersonDt"
			   widgetVar="addContactPersonBtn"
			 	oncomplete="contactPersonObj.paginator.endLink.click();" rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this"  partialSubmit="true" 
			    onsuccess="delCtPersonDlg.show()" rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>				
		</div>
		
		<p:dialog id="delCtPersonDlg" 
		    styleClass="screen-title" widgetVar="delCtPersonDlg"  modal="true" width="330">  
            <h:panelGrid columns="3">
              <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			  <p:spacer width="10"/>
              <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}"  update="@([id$=contactPersonDt])"
		       process="@all" actionListener="#{centralContractBackingBean.deleteContactPerson()}" onclick="delCtPersonDlg.hide();"/>
			 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delCtPersonDlg.hide();" type="button" />
		   </div>
        </p:dialog>  		
        
	</p:panel>
	
	<p:panel id="exemptedOrgPnl" header="#{lbl['lbl.ct.panel.exempted.ministry']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="exemptedOrgDt" var="exemptedOrgsVar" value="#{centralContractBackingBean.managedBean.circularVer.ctExemptedOrgs}"
		 	rowKey="#{exemptedOrgsVar}" rowIndexVar="index" selection="#{centralContractBackingBean.selectedExemptedOrgs}">
			<ac:paginator for="exemptedOrgDt" />
	        <p:column selectionMode="multiple"  style="width:5%"
				rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
		     <p:column headerText="#{lbl['lbl.ct.panel.exempted.org.type']}" style="width:30%;">
		         <p:selectOneMenu id="OrgTypeId" 
		              style="width:200px" value="#{exemptedOrgsVar.orgTypeCode}" disabled="true">
            	        <f:selectItems value="#{centralContractBackingBean.retrieveParameterDescListByType()}"/>
            	  </p:selectOneMenu>
		     </p:column>
		      <p:column headerText="#{lbl['lbl.ct.panel.exempted.org.name']}" style="width:65%;">
		           <h:outputText value="#{exemptedOrgsVar.orgProfile.orgName}"></h:outputText>
		     </p:column>
	 </p:dataTable>
	   <div class="ppRightBtn">
	       <p:commandButton id="addAgencySignerBtn" value="#{lbl['lbl.btn.add']}"  
                partialSubmit="true" process="@this" oncomplete="dlgExemptedMinistry.show()"
       	        action="#{centralContractBackingBean.flushExempMisntry()}">
       	        </p:commandButton>
       	        <p:commandButton id="delAgencySignerBtn" process="@form"  
		          value="#{lbl['lbl.btn.delete']}"   onsuccess="dlgExemptedDel.show()">
		       </p:commandButton>
       		
	    </div>
	    <p:dialog id="dialogExemptedMinistry"  header="#{lbl['lbl.ct.panel.exempted.org.dlg']}" 
	          widgetVar="dlgExemptedMinistry" styleClass="pop_up_top" modal="true" width="600" height="500">
			  <p:messages id="exemptedMsgId" showSummary="false"
			      showDetail="true"  autoUpdate="true" closable="true" severity="error, info" />
		       <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.add.orgtype.menu']}" escape="false"/><br/><br/>
		         <h:panelGrid columns="3">
		            <p:selectOneMenu for="orgTypeId"  style="width:150px" disabled="true" >
            	               <f:selectItem itemLabel="#{lbl['lbl.ct.panel.exempted.type']}" itemValue=""/>
                            </p:selectOneMenu>
		              <p:spacer height="1"/>
		             <p:selectOneMenu id="OrgTypeId"  style="width:200px" required="true"
		                 label="#{lbl['lbl.ct.panel.exempted.type']}"  value="#{centralContractBackingBean.managedBean.orgTypeCode}">
            	           <f:selectItems value="#{centralContractBackingBean.retrieveParameterDescListByType()}"/>
            	           <p:ajax event="change" process="@this"   update="exmptedMinistryId"
            	             listener="#{centralContractBackingBean.resetMinistryDetails}" ></p:ajax>
            	     </p:selectOneMenu>
            	  </h:panelGrid>
            	     <h:panelGroup  id="exmptedMinistryId">
                        <h:panelGrid columns="3" 
                            rendered="#{centralContractBackingBean.managedBean.orgTypeCode == ParameterConst.orgTypeJabatan
                           or centralContractBackingBean.managedBean.orgTypeCode == ParameterConst.orgTypePtj}">
                            <p:selectOneMenu for="ministry"  style="width:150px" disabled="true" >
            	               <f:selectItem itemLabel="#{lbl['lbl.ct.ministry']}" itemValue=""/>
                            </p:selectOneMenu>
                           <p:spacer height="1"/>
                           <p:selectOneMenu id="ministry" style="width:300px" required="true" label="#{lbl['lbl.ct.ministry']}"
                                value="#{centralContractBackingBean.managedBean.ministryProfileId}" >
            	                <f:selectItems value="#{centralContractBackingBean.getMinistryDropdown()}"/>
            	               <p:ajax event="change" update=":form:jabatan" partialSubmit="true"
            	                  process="@this" listener="#{centralContractBackingBean.settingMinistryListener}" />
                           </p:selectOneMenu>
                      </h:panelGrid>
                     
                     <h:panelGrid columns="3" 
                           rendered="#{centralContractBackingBean.managedBean.orgTypeCode == ParameterConst.orgTypePtj}">
                          <p:selectOneMenu for="jabatan"  style="width:150px" disabled="true" >
            	               <f:selectItem itemLabel="#{lbl['lbl.ct.jabatan']}" itemValue=""/>
                       </p:selectOneMenu>
                       <p:spacer height="1"/>
                       <p:selectOneMenu id="jabatan" style="width:300px"
                           value="#{centralContractBackingBean.managedBean.jabatanProfileId}" >
            	               <f:selectItems value="#{centralContractBackingBean.getJabatanDropdown()}"/>
                       </p:selectOneMenu>
                    </h:panelGrid>
                    <h:panelGrid columns="3" rendered="#{centralContractBackingBean.managedBean.orgTypeCode == ParameterConst.orgTypeJabatan
                           or centralContractBackingBean.managedBean.orgTypeCode == ParameterConst.orgTypePtj}">
                          <p:selectOneMenu for="ptjcodename" 
                              value="#{centralContractBackingBean.managedBean.ptjCodeName}"  style="width:150px;">
                              <f:selectItem itemLabel="#{lbl['lbl.ct.ptj.code']}" itemValue="#{CtConst.ptjCode}"/>
            	              <f:selectItem itemLabel="#{lbl['lbl.ct.ptj.name']}" itemValue="#{CtConst.ptjName}"/>
            	              <p:ajax process="@this"/>
                         </p:selectOneMenu>
				      <p:spacer height="1"/>
                       <p:inputText id="ptjCodeVaue"  style="width:300px;" 
                             value="#{centralContractBackingBean.managedBean.ptjCodeNameSearchValues}" >
                             <p:ajax process="@this"/></p:inputText>
			         </h:panelGrid>
			  	     <div class="ppRightBtn">
       		               <p:commandButton id="PtjSearchId" value="#{lbl['lbl.btn.search']}" 
       		                  update=":form:tablePtjCode"  disabled="#{centralContractBackingBean.managedBean.orgTypeCode == null}"
       		                     action="#{centralContractBackingBean.searchPtjDetails}" process="@this" /> 
			               <p:commandButton id="resetlBtn" value="#{lbl['lbl.ct.reset']}" process="@this"
			                     action="#{centralContractBackingBean.resetPtjDetails}" 
			                     disabled="#{centralContractBackingBean.managedBean.orgTypeCode == null}" update=":form:dialogExemptedMinistry"   />
		                 </div>
		             </h:panelGroup>
			   <p:spacer height="2"/>
              <p:dataTable id="tablePtjCode" var="pmVar" value="#{centralContractBackingBean.exemptedOrgDataModel}" 
                 rowIndexVar="rowIndex" selection="#{centralContractBackingBean.selectedPmOrgProfile}" rowKey="#{pmVar}" lazy="true">
                  <ac:paginator for="tablePtjCode"/>
                    <p:column selectionMode="multiple" style="width:18px;"> 
                         <f:facet name="header">
                             <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.popup.chkBox']}"/>
		               </f:facet>
                    </p:column>       
                    <p:column headerText="#{lbl['lbl.ct.ptj.code']}" >
                       	#{pmVar.orgCode}
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.ptj.name']}" >
                      	#{pmVar.orgName}
					</p:column>
			 </p:dataTable>
			 <p:spacer height="2"/>           
			 <div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.select']}" 
				   process="@form" update=":form:exemptedOrgDt,:form:exemptedMsgId" 
				    action="#{centralContractBackingBean.addExemtedOrgDetails()}"/>
				    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" 
				        onclick="dialogExemptedMinistry.hide();"  action="#{centralContractBackingBean.resetMinistryDetails()}" />
           </div>
	</p:dialog>
	    
	  
	       <p:dialog id="dlgExemptedDel" 
	            widgetVar="dlgExemptedDel" styleClass="screen-title" modal="true" width="330">  
                <h:panelGrid columns="3">
                   <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			       <p:spacer width="10"/>
                   <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
                </h:panelGrid>
                <div class="ppRightBtn">
		           <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:exemptedOrgDt" 
		               process="@form" partialSubmit="true" actionListener="#{centralContractBackingBean.deleteExemptedOrgMinistry()}" onclick="dlgExemptedDel.hide();"/>
			       <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgExemptedDel.hide();" type="button" />
		        </div>
             </p:dialog>  
	 </p:panel>
	
	<p:panel id="cancelCircularPnl" header="#{lbl['lbl.ct.panel.related.cancelled.circular']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="cancelCircularDt" var="cancelCircularVar" rowKey="#{cancelCircularVar}" rowIndexVar="index" 
			value="#{centralContractBackingBean.managedBean.circularVer.ctCancelCircularList}"
			selection="#{centralContractBackingBean.managedBean.selectedCancelCirculars}" >
			<ac:paginator for="cancelCircularDt" />
			<p:column selectionMode="multiple" style="width:3%" 
				rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
			<p:column headerText="#{lbl['lbl.ct.physical.circular.no']}" styleClass="column-align-center">
				<p:outputLabel value="#{cancelCircularVar.circularVer.circularNo}" style="float:left;"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.ct.circular.name']}" styleClass="column-align-center">
				<p:outputLabel value="#{cancelCircularVar.circularVer.name}" style="float:left;"/>
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn"> 
			<p:commandButton value="#{lbl['lbl.btn.add']}"  oncomplete="cancelCircularDlg.show();" update="cancelledCclDt"
				actionListener="#{centralContractBackingBean.addCancelCircularListener()}" 
				rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>
			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@form" partialSubmit="true" 
				action="#{centralContractBackingBean.deleteCancelCircular()}" update="cancelCircularDt" 
				rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>			
		</div>		
	</p:panel>
	
	<p:dialog id="cancelCircularDlg" header="#{lbl['lbl.ct.cancelled.circular']}" widgetVar="cancelCircularDlg" 
		styleClass="pop_up_top" modal="true" width="550" height="350">
			<p:dataTable id="cancelledCclDt" var="cancelledCircularDlgVar" rowKey="#{cancelledCircularDlgVar}" rowIndexVar="index"
				value="#{centralContractBackingBean.managedBean.cancelledCircularList}" 
				selection="#{centralContractBackingBean.managedBean.selectedCancelledCircularList}" >
				<ac:paginator for="cancelledCclDt" />
				<p:column selectionMode="multiple" style="width:3%" />
				<p:column headerText="#{lbl['lbl.ct.physical.circular.no']}" styleClass="column-align-center">
					<h:outputText value="#{cancelledCircularDlgVar.circularVer.circularNo}" style="float:left;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.name']}" styleClass="column-align-center">
					<h:outputText value="#{cancelledCircularDlgVar.circularVer.name}" style="float:left;" />
				</p:column>									
			</p:dataTable>
			<p:spacer height="5"></p:spacer>
			<div class="ppRightBtn"> 
				<p:commandButton value="#{lbl['lbl.btn.ok']}"  process="cancelCircularDlg" 
					action="#{centralContractBackingBean.addCancelledCircular}"
					update="cancelCircularDt" onclick="cancelCircularDlg.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" type="button" ajax="false" onclick="cancelCircularDlg.hide();" />
			</div>			
	</p:dialog>
</ui:composition>
