<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	
    <ui:define name="contentSection">
    	<f:event listener="#{centralContractBackingBean.preRenderView}" type="preRenderView" />	
		<p:panel>
			<p:messages id="messages" showSummary="false" escape="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	    	<table style="width: 100%;">
	    		<tr>
	    			<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" /></td>
	    			<td class="ppRightBtn">
			  			<ui:repeat var="action"	value="#{centralContractBackingBean.managedBean.outComes}">
							<p:commandButton value="#{action}" ajax="false" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(action)}" 
								action="#{centralContractBackingBean.saveCircular(action)}" />
						</ui:repeat>	    			
	    			</td>
	    		</tr>
	    	</table>
	    	<table style="width: 99%; margin-left: 25px;" class="header-info">
				<tr style="margin-button: 10px;">
				<td>
						
							<p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
						
					</td>
					<td>
						
							<p:inputText size="20" disabled="true" />
						
					</td>		
					<td>
					
							<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
					
					</td>
					<td>
						
							<p:inputText size="20" disabled="true"/>
					
					</td>
					<td>
		
							<p:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
					
					</td>
					<td>
						
							<p:inputText size="30" disabled="true" />
						
					</td>					
					<td>
						
							<p:outputLabel value="#{lbl['lbl.ct.cc.status']}" />
						
					</td>
					<td>
						
							<p:inputText size="20"
								disabled="true" />
						
					</td>
				</tr>
			</table>	    	
		</p:panel>
		<p:tabView id="tabview" orientation="left" >
			<p:ajax event="tabChange" process="@form" update=":form:tabview:contractListPnl"/>
			<p:tab id="tabcd" title="Circular Details" >
	       		<ui:include src="/xhtml/ct/circular/centralcontract/createCircular.xhtml"/>
	       		<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" /> 
	       	</p:tab> 
	       	<p:tab id="tabAgency" title="Zone" rendered="#{centralContractBackingBean.managedBean.circularVer.zonalLevel.parameterCode!=null or centralContractBackingBean.managedBean.circularVer.itemZonalLevel.parameterCode!=null}" >
	       		<ui:include src="zone.xhtml"/>
	       	</p:tab>
	       	<p:tab id="tabContract" title="Contract">
	       		<ui:include src="contract.xhtml"/>
	       	</p:tab>
		 	<p:tab id="tabSetting" title="Setting" rendered="#{centralContractBackingBean.isCentralContractAdmin()}" >
	       		<ui:include src="/xhtml/ct/circular/centralcontract/approverSetting.xhtml" />  
	       	</p:tab>   
		</p:tabView>
		<ac:lovPopup />
	</ui:define>
		    
</ui:composition>
