<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <ui:define name="contentSection">
        <p:messages id="messages" showSummary="false" escape="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	    <f:event listener="#{centralContractBackingBean.preRenderView}" type="preRenderView" />	
          <ui:include src="circularButtons.xhtml" />
		  <ui:include src="circularHeader.xhtml" />
		  
		  <table border="0" cellspacing="0" cellpadding="0" width="100%">
		  <tr>
			<td width="20%" valign="top">
				<p:tabMenu styleClass="sidemenu"
					activeIndex="#{centralContractBackingBean.managedBean.selectedTabIndex}"
					style="display : table-caption;">
                    <p:menuitem value="Circular Details" update="@form">
						<f:setPropertyActionListener target="#{centralContractBackingBean.managedBean.selectedTabIndex}" value="0" />
					</p:menuitem>
					<p:menuitem value="Contract" update="@form">
						<f:setPropertyActionListener target="#{centralContractBackingBean.managedBean.selectedTabIndex}" value="1" />
					</p:menuitem>
					<p:menuitem value="Setting" update="@form" rendered="#{centralContractBackingBean.isCentralContractAdmin()}">
						<f:setPropertyActionListener target="#{centralContractBackingBean.managedBean.selectedTabIndex}" value="2" />
					</p:menuitem>
				</p:tabMenu>
			</td>
			<td width="80%">
				<c:if test="#{centralContractBackingBean.managedBean.selectedTabIndex == 0}">
					<ui:include src="createCircular.xhtml" />
					<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" /> 
				</c:if>
				<c:if test="#{centralContractBackingBean.managedBean.selectedTabIndex == 1}">
					<ui:include src="contract.xhtml" />
				</c:if>
	
				<c:if test="#{centralContractBackingBean.managedBean.selectedTabIndex == 2 
				  and centralContractBackingBean.isCentralContractAdmin()}">
					<ui:include src="approverSetting.xhtml" />
				</c:if>
			</td>
		</tr>
		</table>
		<ac:lovPopup />
	</ui:define>
</ui:composition>
