<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<script>
			$('#portlet_ctCcCircular_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{centralContractBackingBean.getPortletTitle()}');
		</script>
		<style>
.confirmation-message-box {
	border: 1px solid #cecece;
	font-family: Arial;
	font-size: 12px;
	cursor: default;
	padding: 10px;
}

.column-align-center {
         text-align: center !important;
      }

   .top-aligned-columns td { 
         vertical-align: top;
      }      
.columnWidth180 {
	width: 150px;
	vertical-align: top;
}

.columnWidth170 {
	width: 180px;
	vertical-align: top;
}

.columnWidth200 {
	width: 260px;
	vertical-align: top;
}

.columnWidth230 {
	width: 230px;
	vertical-align: top;
}

.columnWidth300 {
	width: 290px;
	vertical-align: top;
}

 .fileupload-buttonbar.ui-widget-header.ui-corner-top {
                padding: 0.0em 0.0em;
                padding-top: 0em;
                padding-right: 0em;
                padding-bottom: 0em;
                padding-left: 0em;
        }
</style>
   <script type="text/javascript">  
   $(document).on("keypress", 'form', function (e) {
	    var code = e.keyCode || e.which;
	    if (code == 13) {
	        e.preventDefault();
	        return false;
	    }
	});
				</script> 
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<p:messages id="messages" showSummary="false" escape="false"
			showDetail="true"
			autoUpdate="#{centralContractBackingBean.managedBean.autoUpdate}"
			closable="true" severity="error, info, warn" />
		<f:event listener="#{centralContractBackingBean.preRenderView}"
			type="preRenderView" />

		<ui:include src="circularButtons.xhtml" />
		<ui:include src="circularHeader.xhtml" />

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu"
						activeIndex="#{centralContractBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.panel.central.contract.circular']}" update="@form">
							<f:setPropertyActionListener
								target="#{centralContractBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.contract']}" update="@form">
							<f:setPropertyActionListener
								target="#{centralContractBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
						<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.setting']}" update="@form"
							rendered="#{centralContractBackingBean.isCentralContractAdmin()}">
							<f:setPropertyActionListener
								target="#{centralContractBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>
					</p:tabMenu></td>
				<td width="80%"><p:outputPanel
						rendered="#{centralContractBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="createCircular.xhtml" />
						<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{centralContractBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="contract.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{centralContractBackingBean.managedBean.selectedTabIndex == 2 
				  and centralContractBackingBean.isCentralContractAdmin()}">
						<ui:include src="approverSetting.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
		<ac:lovPopup />
		<p:confirmDialog message="#{lbl['lbl.ct.dialog.confirm.message']}"
			severity="alert" widgetVar="cancelConfirmDlg" closable="true"
			appendToBody="true">
			<h:panelGrid columns="2">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					partialSubmit="true" process="@this"
					action="#{centralContractBackingBean.saveCircular('CANCEL')}"
					onstart="cancelConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();"  />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="cancelConfirmDlg.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>
	</ui:define>
</ui:composition>
