<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <ui:define name="contentSection">
	    <style>
	    	.confirmation-message-box {
	         	border: 1px solid #cecece;
				font-family: Arial;
				font-size: 12px;
				cursor: default;
				padding: 10px;
	         }
         </style>
        <p:messages id="messages" showSummary="false" escape="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	    <f:event listener="#{centralContractBackingBean.preRenderView}" type="preRenderView" />	
          <ui:include src="circularButtons.xhtml" />
		  <ui:include src="circularHeader.xhtml" />
		  
		  <table border="0" cellspacing="0" cellpadding="0" width="100%">
		  <tr>
			<td width="20%" valign="top" class="sidemenutd">
				<p:tabMenu styleClass="sidemenu"
					activeIndex="#{centralContractBackingBean.managedBean.selectedTabIndex}">
                    <p:menuitem value="#{lbl['lbl.ct.menu.circular']}" update="@form">
						<f:setPropertyActionListener target="#{centralContractBackingBean.managedBean.selectedTabIndex}" value="0" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.ct.menu.contract']}" update="@form">
						<f:setPropertyActionListener target="#{centralContractBackingBean.managedBean.selectedTabIndex}" value="1" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.ct.menu.setting']}" update="@form" rendered="#{centralContractBackingBean.isCentralContractAdmin()}">
						<f:setPropertyActionListener target="#{centralContractBackingBean.managedBean.selectedTabIndex}" value="2" />
					</p:menuitem>
				</p:tabMenu>
			</td>
			<td width="80%">
				<p:outputPanel rendered="#{centralContractBackingBean.managedBean.selectedTabIndex == 0}">
					<ui:include src="createCircular.xhtml" />
					<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" /> 
				</p:outputPanel>
				<p:outputPanel rendered="#{centralContractBackingBean.managedBean.selectedTabIndex == 1}">
					<ui:include src="contract.xhtml" />
				</p:outputPanel>
				<p:outputPanel rendered="#{centralContractBackingBean.managedBean.selectedTabIndex == 2 
				  and centralContractBackingBean.isCentralContractAdmin()}">
					<ui:include src="approverSetting.xhtml" />
				</p:outputPanel>
			</td>
		</tr>
		</table>
		<ac:lovPopup />
	</ui:define>
</ui:composition>
