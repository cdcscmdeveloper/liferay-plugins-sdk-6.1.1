<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ac:gpkiPopup
		textBeforeSign="#{centralContractBackingBean.managedBean.textBeforeSign}"
		postSignAction="#{centralContractBackingBean.preSubmitCircular(gpkiBackingBean.pmDigiSign)}" 
		enableAutoUpdate="#{centralContractBackingBean.enableAutoUpdate()}"	/>
	<table style="width: 100%;">
		<tr>
			<td><p:commandButton value="#{lbl['lbl.btn.back']}"
					immediate="true" action="#{centralContractBackingBean.backAction}"
					rendered="#{centralContractBackingBean.managedBean.action != null}"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();" /></td>
			<td class="ppRightBtn"><ui:repeat var="action"
					value="#{centralContractBackingBean.managedBean.outComes}">
					<ui:param name="buttonLabel"
						value="lbl.btn.#{fn:toLowerCase(action)}" />
					<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
						update="@form" process="@form" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{centralContractBackingBean.gpkiSignAction(action)}" />
				</ui:repeat></td>
			<c:if test='#{centralContractBackingBean.managedBean.action eq "view"}'>
				<td style="text-align: right">
					<p:commandLink value="#{lbl['lbl.td.doc.trackingDiary']}" immediate="true"
						action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(centralContractBackingBean.managedBean.circularVer.docType, centralContractBackingBean.managedBean.circular.circularId)}"  />
				</td>
			</c:if>				
		</tr>
	</table>
</ui:composition>
