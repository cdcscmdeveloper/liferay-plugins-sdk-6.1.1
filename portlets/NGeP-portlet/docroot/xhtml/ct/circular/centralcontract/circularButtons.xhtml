<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%;">
	    <tr>
	      <td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" icon="ui-icon-back" action="#{centralContractBackingBean.backAction}" rendered="#{centralContractBackingBean.managedBean.action != null}" /></td>
	      <td class="ppRightBtn">
			  <ui:repeat var="action" value="#{centralContractBackingBean.managedBean.outComes}">
				<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(action)}" />
				<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(action)}" update="@form" 
				  action="#{centralContractBackingBean.saveCircular(action)}" />
			  </ui:repeat>	    			
	      </td>
	    </tr>
	  </table>	
</ui:composition>
