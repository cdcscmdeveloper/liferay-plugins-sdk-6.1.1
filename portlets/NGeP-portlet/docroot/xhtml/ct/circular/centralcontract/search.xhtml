<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="resourceSection">
	</ui:define>
	<ui:define name="content">
         <p:messages showDetail="true" globalOnly="true"/> 
            <p:tabView id="tabView">
              
                 <p:tab id="searchTab" title="General" >
                  <p:panel id="searchId" header="Search"   toggleable="true"  toggleSpeed="500" widgetVar="panelsearch">
                     <h:panelGrid columns="4" style="width:900px;" >
                           <h:outputLabel value="Circular No" />
                           <p:inputText value="" style="width:200px;"/>
                           <h:outputLabel value="Supplier ID"/>
                           <p:inputText value="" style="width:200px;"/>
                           
                           <h:outputLabel value="Circular Name"/>
                           <p:inputText value="" style="width:200px;" />
                           <h:outputLabel value="Supplier Name"/>
                           <p:inputText value="" style="width:200px;"/>
                           
                            <h:outputLabel value="File Reference No"/>
                           <p:inputText value="" style="width:200px;"/>
                           <h:outputLabel value="Item Name" />
                           <p:inputText value="" style="width:200px;"/>
                           
                           <h:outputLabel value="Circular Start" />
                           <p:calendar style="width:150px;" value="#{centralBackingBean.date}" id="popupButtonCal" showOn="button" />
                           <h:outputLabel value="Contract End"/>
                            <p:calendar style="width:150px;" value="#{centralBackingBean.date}" id="popupButtonCal1" showOn="button" />
                           
                           
                             <h:panelGroup>
			                <div style="height: 70px; vertical-align: top">
			                  <p:outputLabel for="circularType" value="Circular Type" />
							 </div>
						     </h:panelGroup>
						     <h:panelGrid >
                           <p:selectOneListbox id="circularType" value="" style="width:200px;"  >
                             <f:selectItem itemLabel="Main" itemValue="1"  />  
                              <f:selectItem itemLabel="Pindaan" itemValue="2"  />  
                              <f:selectItem itemLabel="Tambahan" itemValue="3" />  
                              <f:selectItem itemLabel="All" itemValue="4" />  
                           </p:selectOneListbox>
                           </h:panelGrid>
                           
                          
                          
                            <h:panelGroup>
			                <div style="height: 70px; vertical-align: top">
			                  <p:outputLabel for="status" value="Status" />
							 </div>
						     </h:panelGroup>
						     <h:panelGrid styleClass="txtsize">
                           <p:selectOneListbox id="status" value="" style="width:200px;"  >
                               <f:selectItem itemLabel="Pending Approval" itemValue="1"  />  
                              <f:selectItem itemLabel="Approved" itemValue="2" />  
                              <f:selectItem itemLabel="Cancelled" itemValue="3" />
                                <f:selectItem itemLabel="All" itemValue="4"  />    
                           </p:selectOneListbox>
                           </h:panelGrid>
                           
                            <f:verbatim></f:verbatim>
							 <f:verbatim></f:verbatim>
                             <f:verbatim></f:verbatim>
                               <h:panelGrid columns="2" columnClasses="column-align-right">
                               <p:commandButton value="Search"  process="@this" partialSubmit="true" icon="ui-icon-add"  update="dataTable"/>
							   <p:commandButton value="Reset"  process="@this" partialSubmit="true" icon="ui-icon-add"  update="dataTable"/>
						        </h:panelGrid>
                           
                           </h:panelGrid>
                          
            
			</p:panel>
						      
						   
						   <p:panel id="searchResulId" header="Search Result"   toggleable="true"  toggleSpeed="500" widgetVar="panelsearchResul">
                          
						     <div style="overflow-x:auto">
			                               
			                               <p:dataTable id="dataTable" var="data" value="" rowIndexVar="index"
							               widgetVar="dataTableObj" lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom"
							               paginatorAlwaysVisible="false" emptyMessage="No Records!" rows="10" rowsPerPageTemplate="5,10,15,20"
							               currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row> 
									                     <p:column rowspan="1" headerText="No." />
									                     <p:column colspan="1" headerText="Circular Number"   /> 
									                     <p:column colspan="1" headerText="Circular Name" /> 
									                     <p:column colspan="1" headerText="Circular Type" /> 	
									                     
									                     <p:column colspan="1" headerText="File Reference No"  /> 
									                     <p:column colspan="1" headerText="Supplier Name"  /> 	
									                     <p:column colspan="1" headerText="Status"   /> 
									                     <p:column colspan="1" headerText="Circular Start"  />
									                      <p:column colspan="1" headerText="Circular End"  /> 
									                     <p:column colspan="1" headerText="Action" />
								               </p:row>							
								
							
							                </p:columnGroup>
							                     <p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
							                     <p:column> <h:outputText value="" /></p:column>
							                     <p:column><h:outputText value="" /></p:column>	
							                     <p:column><h:outputText value="" /></p:column>	
							                     <p:column><h:outputText value="" /></p:column>	
							                     <p:column > <h:outputText value="" /> </p:column> 							
							                  
							                     <p:column><h:outputText value="" /></p:column>	
							                     <p:column><h:outputText value="" /></p:column>	
							                      <p:column> <h:outputText value="" /> </p:column>	
							                        <p:column styleClass="column-align-center">
								                 <p:commandButton title="Edit" action="#{centralBackingBean.gotoEditPage}" partialSubmit="true" process="@this" 
								                 icon="ui-icon-edit" styleClass="ui-icon-button"/>
								                 <p:spacer width="3"/>
								                   <p:commandButton title="Cancel" action="#{centralBackingBean.gotoCancelPage}" partialSubmit="true" process="@this" 
								                 icon="ui-icon-cancel" styleClass="ui-icon-button"/>
							                     </p:column> 
							                     
							               </p:dataTable>
				
						   </div>
						  
						    </p:panel>
                                        
             </p:tab>
            </p:tabView>
            
           
   </ui:define>
   </ui:composition>
