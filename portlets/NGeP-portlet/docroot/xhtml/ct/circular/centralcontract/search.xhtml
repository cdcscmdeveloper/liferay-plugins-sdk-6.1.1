<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
		<p:panel id="searchPanel" header="Search" toggleable="true">
			<h:panelGrid columns="4" style="width:900px;">
				<h:outputLabel value="Circular No." />
				<p:inputText value="#{centralContractBackingBean.managedBean.searchCircularNo}" style="width:200px;" />
				<h:outputLabel value="Circular Name" />
				<p:inputText value="#{centralContractBackingBean.managedBean.searchCircularName}" style="width:200px;" />
				<h:outputLabel value="File Reference No." />
				<p:inputText value="#{centralContractBackingBean.managedBean.searchFileRefNo}" style="width:200px;" />
				<p:outputLabel value="Circular Type" />
				<p:selectOneMenu value="#{centralContractBackingBean.managedBean.searchCircularTypeCodeId}">
					<f:selectItems value="#{centralContractBackingBean.getDropdownValues(PmCodeCatConst.circularType)}" />
				</p:selectOneMenu>					
				<h:outputLabel value="Circular Start Date" />
				<p:calendar style="width:150px;" value="#{centralContractBackingBean.managedBean.searchStartDate}" id="popupButtonCal" showOn="button" />
				<h:outputLabel value="Circular End Date" />
				<p:calendar style="width:150px;" value="#{centralContractBackingBean.managedBean.searchEndDate}" id="popupButtonCal1" showOn="button" />
				<h:panelGroup>
					<div style="height: 70px; vertical-align: top">
						<p:outputLabel for="status" value="Status" />
					</div>
				</h:panelGroup>
				<h:panelGrid>
					<p:selectOneListbox id="status" value="#{centralContractBackingBean.managedBean.searchStatusId}" style="width:200px;">
						<f:selectItem itemLabel="Pending Approval" itemValue="1" />
						<f:selectItem itemLabel="Approved" itemValue="2" />
						<f:selectItem itemLabel="Cancelled" itemValue="3" />
						<f:selectItem itemLabel="All" itemValue="4" />
					</p:selectOneListbox>
				</h:panelGrid>
				<f:verbatim></f:verbatim>
				<f:verbatim></f:verbatim>
				<f:verbatim></f:verbatim>
			</h:panelGrid>		
			<div class="ppRightBtn"> 
				<p:commandButton value="Search" action="#{centralContractBackingBean.searchCircularVer}" update="circularVerDt" icon="ui-icon-search" />
			</div>		
		</p:panel>
		<p:panel id="resultPanel" header="Result" toggleable="true">
			<p:dataTable id="circularVerDt" value="#{centralContractBackingBean.circularVerPagingDataModel}"
				var="data" lazy="true" rowIndexVar="index" >
				<ac:paginator for="circularVerDt" />
				<p:columnGroup type="header">
					<p:row>
						<p:column colspan="1" headerText="Circular Number" />
						<p:column colspan="1" headerText="Circular Name" />
						<p:column colspan="1" headerText="Circular Type" />
						<p:column colspan="1" headerText="Update No" />
						<p:column colspan="1" headerText="Status" />
						<p:column colspan="1" headerText="Circular Start Date" />
						<p:column colspan="1" headerText="Circular End Date" />
						<p:column colspan="1" headerText="Action" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText value="#{data.circularNo}" />
				</p:column>
				<p:column>
					<h:outputText value="#{data.name}" />
				</p:column>
				<p:column>
					<h:outputText value="#{data.circularTypeCode.code}" />
				</p:column>
				<p:column>
					<h:outputText value="#{data.updateNo}" />
				</p:column>
				<p:column>
					<h:outputText value="#{data.status.statusId}" />
				</p:column>
				<p:column>
					<h:outputText value="#{data.startDate}" >
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText value="#{data.endDate}" >
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</p:column>
				<p:column styleClass="column-align-center">
				<p:commandLink onclick="gotoPage([{name:'action',value:'update'},{name:'circularVerId',value:'#{data.circularVerId}'}])">
				 <p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Update" />
				</p:commandLink>
				<p:spacer width="5" />	
				<p:commandLink onclick="gotoPage([{name:'action',value:'view'},{name:'circularVerId',value:'#{data.circularVerId}'}])">
				 <p:graphicImage library="ep/images/design" name="search.png" value="/resources/ep/images/design/search.png" title="View" />
				</p:commandLink>	
				</p:column>
			</p:dataTable>		
			<p:remoteCommand name="gotoPage" action="#{centralContractBackingBean.gotoPage}" />
		</p:panel>           
	</ui:define>
</ui:composition>
