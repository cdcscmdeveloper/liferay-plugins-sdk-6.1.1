<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<ui:define name="contentSection">
	      <p:blockUI widgetVar="blkCentralSearchTable"  block=":form"   trigger="centralSearchId">  
			      <p:graphicImage value="/resources/ep/images/ajax-loader.gif"></p:graphicImage>  
	      </p:blockUI> 	
	      <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info, warning" />
		
		  <p:panel id="searchPanel" header="#{lbl['lbl.btn.search']}" toggleable="true">
			   <h:panelGrid columns="4" style="width:100%">
				   <p:outputLabel value="#{lbl['lbl.ct.circular.no']}" />
				   <p:inputText style="width:170px;" maxlength="50" 
				       value="#{centralContractBackingBean.managedBean.searchCircularNo}" />
				 
				   <p:outputLabel value="#{lbl['lbl.ct.circular.name']}" />
				   <p:inputText style="width:170px;" maxlength="200" 
				       value="#{centralContractBackingBean.managedBean.searchCircularName}" />
				
				   <h:outputLabel value="#{lbl['lbl.ct.circular.start.date']}" />
				   <p:calendar style="width:150px;" readonlyInput="true" 
				       navigator="true" showOn="button"  pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"  
				       value="#{centralContractBackingBean.managedBean.searchStartDate}" id="popupButtonCal" />
				   
				   <h:outputLabel value="#{lbl['lbl.ct.circular.end.date']}" />
				   <p:calendar style="width:150px;" readonlyInput="true" 
				       showOn="button"  pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" 
				       navigator="true" value="#{centralContractBackingBean.managedBean.searchEndDate}" id="popupButtonCal1" />
			
				   <h:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
				   <p:inputText style="width:170px;margin-top:3px;" maxlength="50" 
				       value="#{centralContractBackingBean.managedBean.searchFileRefNo}" />					
				   
				   <p:outputLabel for="status" value="#{lbl['lbl.ct.status']}" />
				   <p:selectOneMenu id="status" 
				       value="#{centralContractBackingBean.managedBean.searchStatusId}" style="width:200px;">
					    <f:selectItems value="#{centralContractBackingBean.getStatusDropdown()}" />
				   </p:selectOneMenu>
			</h:panelGrid>		
			
			<div class="ppRightBtn"> 
				<p:commandButton id="centralSearchId"  onstart="blkCentralSearchTable.show();" 
				    oncomplete="blkCentralSearchTable.hide();"  icon="ui-icon-search"  value="#{lbl['lbl.btn.search']}"
				    action="#{centralContractBackingBean.searchCircularVer}" update="circularVerDt" />
				<p:commandButton value="#{lbl['lbl.ct.reset']}" icon="ui-icon-reset"
				   action="#{centralContractBackingBean.searchReset}"  update=":form" />
			</div>		
		</p:panel>
		
		<p:panel id="resultPanel" header="#{lbl['lbl.ct.search.result']}" toggleable="true">
			<p:dataTable id="circularVerDt" var="data" lazy="true" 
			    value="#{centralContractBackingBean.circularVerPagingDataModel}" rowIndexVar="index">
				<ac:paginator for="circularVerDt" />
				<p:column headerText="#{lbl['lbl.ct.circular.no']}" >
					<h:outputText value="#{data.circularNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.name']}" >
					<h:outputText value="#{data.name}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.file.ref.no']}" >
					<h:outputText value="#{data.circularFileRefNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.start.date']}" >
					<h:outputText value="#{data.startDate}" >
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.circular.end.date']}" >
					<h:outputText value="#{data.endDate}" >
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.status']}" >
					<h:outputText value="#{(data.status.statusId eq 0)? lbl['lbl.ct.cancelled']  : centralContractBackingBean.getStatusDescById(data.status.statusId)}" />
				</p:column>				
				<p:column headerText="#{lbl['lbl.ct.action']}" styleClass="column-align-center">
					<p:commandLink rendered="#{data.status.statusId == CtStatusConst.cqApproved or 
						(data.status.statusId == CtStatusConst.cqRejected and data.ctCircular.latestCircularVer != null)}"
						onclick="gotoPage([{name:'action',value:'update'},{name:'circularVerId',value:'#{data.circularVerId}'}])">
						<p:graphicImage library="ep/images/design" name="edit.png" value="/css/images/design/edit.png" title="#{lbl['lbl.ct.update']}" />
					</p:commandLink>
					<p:spacer width="5" />
					<p:commandLink onclick="gotoPage([{name:'action',value:'view'},{name:'circularVerId',value:'#{data.circularVerId}'}])">
						<p:graphicImage library="ep/images/design" name="document.png" value="/css/images/design/document.png" title="#{lbl['lbl.ct.view']}" />
					</p:commandLink>
				</p:column>
			</p:dataTable>	
			
			<p:remoteCommand name="gotoPage" action="#{centralContractBackingBean.gotoPage}" />
		</p:panel>           
	</ui:define>
</ui:composition>
