<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel id="settingId" header="#{lbl['lbl.ct.panel.approver.list']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="1">
				<p:pickList id="approverpickList" value="#{centralContractBackingBean.managedBean.approverModel}"
					var="data" itemValue="#{data}" itemLabel="#{data}" 
					showTargetControls="true" filterMatchMode="contains">
					<f:facet name="sourceCaption">#{lbl['lbl.ct.available.approver']}</f:facet>  
        			<f:facet name="targetCaption">#{lbl['lbl.ct.selected.approver']}</f:facet> 
					<p:column style="width:75%;">
						<h:outputText value="#{data}" />
					</p:column>
				</p:pickList>
			</h:panelGrid>
	</p:panel>
</ui:composition>
