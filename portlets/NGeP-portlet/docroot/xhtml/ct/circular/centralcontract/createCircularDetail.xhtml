<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	
	<h:panelGrid id="centralCircularId" columns="4" style="width:980px;"
	   columnClasses="columnWidth200,columnWidth200,columnWidth180,columnWidth300">
				
			      <p:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}"  styleClass="required" />
				  <h:panelGrid columns="5" styleClass="top-aligned-columns">
				      <p:inputTextarea id="circularNoTxt" style="width:170px;margin-bottom:2px" rows="4" maxlength="60"
					 	required="true"  disabled="#{centralContractBackingBean.managedBean.viewContract}"
						value="#{centralContractBackingBean.managedBean.circularVer.circularNo}" label="#{lbl['lbl.ct.physical.circular.no']}"  
						autoResize="false"
						onkeyup="limitTextArea(this,60);" onkeydown="limitTextArea(this,60);"/>
						<p:spacer width="5"/>
					<ac:iconTooltip  value="#{lbl['lbl.ct.tooltip.circular.no']}"  />
					<p:spacer width="5"/>
					<p:message for="circularNoTxt" display="icon" />
				    </h:panelGrid>
						
					 <p:outputLabel value="#{lbl['lbl.ct.circular.central.name']}"   styleClass="required"/>
				    <h:panelGrid columns="5"  styleClass="top-aligned-columns">
				       <p:inputTextarea id="circularNameTxt" rows="4" style="width:200px;" required="true" maxlength="500"
						   disabled="#{centralContractBackingBean.managedBean.viewContract}" autoResize="false"
						   label="#{lbl['lbl.ct.circular.name']}" value="#{centralContractBackingBean.managedBean.circularVer.name}" 
						   onkeyup="limitTextArea(this,500);" onkeydown="limitTextArea(this,500);" />
						   <p:spacer width="5"/>
				         	<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.circular.name']}" />
				         	<p:spacer width="5"/>
				         	<p:message for="circularNameTxt" display="icon" />
				    </h:panelGrid>
				    
				    <p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
				    <p:inputText  style="width:170px;" maxlength="60" disabled="#{centralContractBackingBean.managedBean.viewContract}"
						value="#{centralContractBackingBean.managedBean.circularVer.circularFileRefNo}" />
				   
					<p:outputLabel value="#{lbl['lbl.ct.warranty.period']}" />
					<h:panelGroup>
						<p:inputText value="#{centralContractBackingBean.managedBean.circularVer.warrantyPeriod}" 
							disabled="#{centralContractBackingBean.managedBean.viewContract}"
						  	maxlength="4" style="text-align:right; width:50px;" label="#{lbl['lbl.ct.warranty.period']}" />
						<p:spacer width="5" />
						<h:outputText value="#{lbl['lbl.ct.months']}" />
					</h:panelGroup>
				    <!-- #33752 start -->
					<p:outputLabel value="#{lbl['lbl.ct.start.date']}"  styleClass="required" />
					<h:panelGrid columns="2">
		   				<p:calendar value="#{centralContractBackingBean.managedBean.circularVer.startDate}" id="popupButtonCal" 
							navigator="true" size="10" showOn="button" required="true" readonlyInput="true" label="#{lbl['lbl.ct.start.date']}"
		      				disabled="#{centralContractBackingBean.managedBean.viewContract}" 
		      				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
	     					<p:ajax event="dateSelect" process="@this" update=":form:popupButtonCal1" />
		 				</p:calendar> 
		                <p:message for="popupButtonCal" display="icon" />
		 			</h:panelGrid>
		 			
		 		      <p:outputLabel value="#{lbl['lbl.ct.end.date']}"   styleClass="required"/>
              		  <h:panelGrid columns="2">
	   					<p:calendar value="#{centralContractBackingBean.managedBean.circularVer.endDate}" id="popupButtonCal1" 
	   						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
	         	            mindate="#{centralContractBackingBean.managedBean.circularVer.startDate}" size="10" navigator="true"
	         	            showOn="button" required="true" readonlyInput="true" label="#{lbl['lbl.ct.end.date']}"
	         	            disabled="#{centralContractBackingBean.managedBean.viewContract}">
	         	            <f:attribute name="startDate" value="#{centralContractBackingBean.managedBean.circularVer.startDate}" />
                 			<f:validator validatorId="primeDateRangeValidator" />
	         	   		</p:calendar>
	         	   		<p:message for="popupButtonCal1" display="icon" />
	         		</h:panelGrid>
					<!-- #33752 end -->
					
					 <p:outputLabel value="#{lbl['lbl.ct.pid']}"  />
					 <h:panelGrid columns="3">
			   			<p:selectBooleanCheckbox disabled="#{centralContractBackingBean.managedBean.viewContract}" 
			       			value="#{centralContractBackingBean.managedBean.circularVer.pid}"  style="text-align:top;">
			         		<p:ajax event="change"  update=":form:groupPidId" process="@this"></p:ajax>
			           	</p:selectBooleanCheckbox>
			           	<p:spacer width="5"/>
				       	<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.circular.pid']}" />
					 </h:panelGrid>
			  	  
			  	  <f:verbatim/>	  <f:verbatim/>
				 
				<p:outputLabel value="#{lbl['lbl.ct.circular.letter']}" styleClass="required"/>
		 		 <h:panelGroup id="uploadCircularPg">
		 			<h:panelGrid columns="5">
				  		<p:commandButton icon="ui-icon-upload" update="uploadCircularPg, uploadCircularDlg"
							action="#{centralContractBackingBean.setCentralDetailsValue()}" 
							rendered="#{!centralContractBackingBean.managedBean.viewContract}"/>	
					 			
					 			 <p:dataGrid id="copyAgreement" value="#{centralContractBackingBean.retrieveAttachmentList()}"
									var="attachAggreement" rowIndexVar="attachAggreementIndex" columns="1" style="width:100%"
									emptyMessage ="#{lbl['lbl.datatable.msg.no.records.found']}">
									<table>
										
										<tr>
											<td></td>
											<td>
											 	<h:commandLink action="#{centralContractBackingBean.downloadFile(attachAggreement)}" 
											 		styleClass="blue_font" style="color:#009ae5 !important;" value="#{attachAggreement.fileName}" /><!-- Fix #30866 -->			
										     	<p:commandLink action="#{centralContractBackingBean.setAttachmentIndex(attachAggreementIndex)}"
								   	                 onclick="deleteCircularFileDlg.show();" rendered="#{!centralContractBackingBean.managedBean.viewContract}">
								   				   <h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
								   			   	 </p:commandLink>
								   			 </td>
										</tr>
									 </table>
								</p:dataGrid>
				 	           <p:spacer width="1" />
			 	          </h:panelGrid>		
			  		</h:panelGroup>
			</h:panelGrid>
</ui:composition>
