<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<h:panelGrid columns="2" style="vertical-align=top;">
		<h:panelGrid columns="4" style="width:600px;">
			<h:outputLabel value="#{lbl['lbl.ct.cc.cno']}" />
			<p:inputText value="#{centralContractBackingBean.managedBean.circularVer.circularNo}" />
			<h:outputLabel value="#{lbl['lbl.ct.cc.cname']}" />
			<p:inputTextarea value="#{centralContractBackingBean.managedBean.circularVer.name}" />
			<h:outputLabel value="#{lbl['lbl.ct.cc.csdate']}" />
			<p:calendar value="#{centralContractBackingBean.managedBean.circularVer.startDate}" 
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal" disabled="true" />
			<h:outputLabel value="#{lbl['lbl.ct.cc.cedate']}" />
			<p:calendar value="#{centralContractBackingBean.managedBean.circularVer.endDate}" 
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal1" disabled="true" />
			<h:outputLabel value="* #{lbl['lbl.ct.cc.upload']}" />
			<h:panelGroup id="uploadCircularPg">
				<p:commandButton oncomplete="uploadCircularDlg.show();return false;" icon="iconAttachment" 
					update="uploadCircularPg" value="Choose file" 
					rendered="#{centralContractBackingBean.isCentralContractAdmin()}" />	
				<h:commandLink value="#{centralContractBackingBean.managedBean.circularVer.circularFileName}" styleClass="blue_font" 
					action="#{centralContractBackingBean.downloadFile(1)}" />					
			</h:panelGroup>
			<h:outputLabel value="#{lbl['lbl.ct.cc.frno']}" />
			<p:inputText value="#{centralContractBackingBean.managedBean.circularVer.circularFileRefNo}" />			
			<h:outputLabel value="Zonal Level" />
			<p:selectOneMenu value="#{centralContractBackingBean.managedBean.circularVer.zonalLevel.parameterCode}">
				<f:selectItems value="#{centralContractBackingBean.getZonalLevelDropDown()}" />
				<p:ajax event="change" update=":form:tabview" process="@form" />
			</p:selectOneMenu>			
			<h:outputLabel value="Item Zonal Level" />
			<p:selectOneMenu value="#{centralContractBackingBean.managedBean.circularVer.itemZonalLevel.parameterCode}">
				<f:selectItems value="#{centralContractBackingBean.getZonalLevelDropDown()}" />
				<p:ajax event="change" update=":form:tabview" process="@form" />
			</p:selectOneMenu>					
		</h:panelGrid>
	</h:panelGrid>

	<p:dialog id="uploadCircularDlg" widgetVar="uploadCircularDlg" modal="false" resizable="false" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" 
			fileUploadListener="#{centralContractBackingBean.fileUpload}" 
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="uploadCircularPg" >
		</p:fileUpload> 
	</p:dialog>
	
</ui:composition>
