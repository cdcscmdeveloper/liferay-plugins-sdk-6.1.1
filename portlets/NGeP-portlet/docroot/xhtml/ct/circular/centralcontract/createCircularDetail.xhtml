<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	
	<h:panelGrid columns="4" columnClasses="columnWidth200,columnWidth230,columnWidth180,columnWidth300">
				
					<h:panelGrid columns="2" style="float:right;">
					    <p:outputLabel value="*" styleClass="mandatory" />
					    <h:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" />
				   </h:panelGrid>
				   <h:panelGrid columns="2">
				      <p:inputTextarea id="circularNoTxt" style="width:170px;margin-bottom:2px" rows="4"
					 	required="true" maxlength="60"  disabled="#{panelBackingBean.managedBean.viewContract}"
						value="#{centralContractBackingBean.managedBean.circularVer.circularNo}" label="#{lbl['lbl.ct.physical.circular.no']}"  autoResize="false"/>
					<p:message for="circularNoTxt" display="icon" />
				    </h:panelGrid>
						
					<h:panelGrid columns="2" style="float:right;">
				        <p:outputLabel value="*" styleClass="mandatory" />
				        <h:outputLabel value="#{lbl['lbl.ct.circular.name']}" />
				   </h:panelGrid>
				    <h:panelGrid columns="2">
				       <p:inputTextarea id="circularNameTxt" rows="4" style="width:250px;" maxlength="200" required="true" 
						   disabled="#{centralContractBackingBean.managedBean.viewContract}" autoResize="false"
						   label="#{lbl['lbl.ct.circular.name']}" value="#{centralContractBackingBean.managedBean.circularVer.name}" />
				         	<p:message for="circularNameTxt" display="icon" />
				    </h:panelGrid>
				    
					<h:panelGrid columns="2" style="float:right;">
						<p:outputLabel value="*" styleClass="mandatory" />
						<p:outputLabel value="#{lbl['lbl.ct.start.date']}" />
					</h:panelGrid>
		   	   		<h:panelGrid columns="2">
		   				<p:calendar value="#{centralContractBackingBean.managedBean.circularVer.startDate}" id="popupButtonCal" 
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
		    				navigator="true" size="17" showOn="button" required="true" readonlyInput="true" label="#{lbl['lbl.ct.start.date']}"
		      				disabled="#{centralContractBackingBean.managedBean.viewContract}">
	     					<p:ajax event="dateSelect" update="popupButtonCal1" />
		 				</p:calendar> 
		                <p:message for="popupButtonCal" display="icon" />
		 			</h:panelGrid>
		 			
		 			<h:panelGrid columns="2" style="float:right;">
	              		<p:outputLabel value="*" styleClass="mandatory" />
	              	    <h:outputLabel value="#{lbl['lbl.ct.end.date']}" />
              		</h:panelGrid>
               		<h:panelGrid columns="2">
	   					<p:calendar value="#{centralContractBackingBean.managedBean.circularVer.endDate}" id="popupButtonCal1" 
	   						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
	         	            mindate="#{centralContractBackingBean.managedBean.circularVer.startDate}" size="17" navigator="true"
	         	            showOn="button" required="true" readonlyInput="true" label="#{lbl['lbl.ct.end.date']}"
	         	            disabled="#{centralContractBackingBean.managedBean.viewContract}">
	         	            <f:attribute name="startDate" value="#{panelBackingBean.managedBean.circularVer.startDate}" />
                 			<f:validator validatorId="primeDateRangeValidator" />
	         	   		</p:calendar>
	         	   		<p:message for="popupButtonCal1" display="icon" />
	         		</h:panelGrid>
			              
			              
			     	      <p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
				    <p:inputText  style="width:170px;" maxlength="60" disabled="#{centralContractBackingBean.managedBean.viewContract}"
						value="#{centralContractBackingBean.managedBean.circularVer.circularFileRefNo}" />
				    <f:verbatim/><f:verbatim/>
				       
				       <h:panelGrid columns="2" style="float:right;">
				          <p:outputLabel value="*" styleClass="mandatory" />
				          <h:outputLabel value="#{lbl['lbl.ct.circular.letter']}" />
				      </h:panelGrid>
		             
		             <h:panelGroup id="uploadCircularPg">
			         	<p:commandButton oncomplete="uploadCircularDlg.show();return false;" icon="iconAttachment" 
				          	update="uploadCircularPg, uploadCircularDlg" value="#{lbl['lbl.bpm.choose.file']}"
					        disabled="#{centralContractBackingBean.managedBean.viewContract}"/>	
				            <h:commandLink value="#{centralContractBackingBean.managedBean.circularVer.circularFileName}" styleClass="blue_font" 
					            action="#{centralContractBackingBean.downloadFile(1)}" />					
			         </h:panelGroup>
				    
			</h:panelGrid>
	<p:dialog id="uploadCircularDlg" widgetVar="uploadCircularDlg" modal="false" 
	    resizable="false" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" 
			fileUploadListener="#{centralContractBackingBean.fileUpload}" 
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="#{lbl['lbl.ct.upload.invalid.msg']}"
			update="uploadCircularPg" >
		</p:fileUpload> 
	</p:dialog>
</ui:composition>
