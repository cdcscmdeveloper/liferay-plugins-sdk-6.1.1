<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="groupItemPanel" header="#{lbl['lbl.btn.search']}" toggleable="true" >
		<table class="ppTwoTable">
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.ct.panel.group.name']}"></p:outputLabel></th>
				<td><p:inputText value="#{panelGroupItemBackingBean.managedBean.groupName}" id="panelGroupId" size="30" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.ct.panel.group.status']}"></p:outputLabel></th>
				<td><p:selectOneMenu style="width:205px" value="#{panelGroupItemBackingBean.managedBean.status}">
						<f:selectItems value="#{panelGroupItemBackingBean.getStatusList()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="2" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.ct.panel.group.search']}" validateClient="true" process="@all"
							action="#{panelGroupItemBackingBean.searchPanelGroupItem}" update=":form:panelGroupItemTabel" />
						<p:commandButton value="#{lbl['lbl.ct.reset']}"
							action="#{panelGroupItemBackingBean.resetPanelGroupItemSearch}"
							update=":form:groupItemPanel, :form:panelGroupItemTabel" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
