<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
   <p:panel header="#{panelGroupItemBackingBean.managedBean.ctPanelItemGroup.brandNew ? lbl['lbl.ct.panel.group.created'] : lbl['lbl.ct.panel.group.updated']}" toggleable="true">
	<p:spacer height="10"></p:spacer>
			
	<table style="width:100%;">
	  <tr>
		<td><p:outputLabel value="#{lbl['lbl.ct.panel.group.name']}" styleClass="required"  /></td>
		<td><p:inputText id="GroupId" value="#{panelGroupItemBackingBean.managedBean.ctPanelItemGroup.groupName}" 
			 size="30" maxlength="100" required="true" label="#{lbl['lbl.ct.panel.group.name']}" />
	  </td>
	  </tr>
	   <tr> 
		<td><p:outputLabel value="#{lbl['lbl.ct.panel.group.status']}" /></td>
     	<td><p:selectOneMenu style="width:178px;margin-bottom:5px;" 
     	      value="#{panelGroupItemBackingBean.managedBean.ctPanelItemGroup.recordStatusFlg}"
     			disabled="#{panelGroupItemBackingBean.managedBean.ctPanelItemGroup.brandNew}" > 
    	    	<f:selectItems value="#{panelGroupItemBackingBean.getStatusList()}"></f:selectItems>   	   
    	    </p:selectOneMenu></td>				
	    </tr>
	</table>
	<p:spacer height="50"></p:spacer>
   </p:panel>	
</ui:composition>
