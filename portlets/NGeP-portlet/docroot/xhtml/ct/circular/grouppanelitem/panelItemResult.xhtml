<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="panelGroupItemResult" header="#{lbl['lbl.ct.search.result']}" toggleable="true">
		<p:dataTable id="panelGroupItemTabel"  lazy="true" rows="10"
			value="#{panelGroupItemBackingBean.panelGroupItemDataModel}"  var="panelGroupItemObj">
			<ac:paginator for="panelGroupItemTabel" />

			<p:column headerText="#{lbl['lbl.ct.panel.group.name']}" style="width:60%" styleClass="column-align-center" >
				<h:outputText value="#{panelGroupItemObj.groupName}" style="float:left;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.ct.panel.group.status']}" style="width:20%" styleClass="column-align-center" > 
   	              #{(panelGroupItemObj.recordStatusFlg==1)? lbl['lbl.ct.active'] : lbl['lbl.ct.inactive']}              
            </p:column>
 
			<p:column headerText="#{lbl['lbl.ct.action']}" style="width:5%" styleClass="column-align-center" >
				<p:commandLink action="#{panelGroupItemBackingBean.goToMaintaincePage(panelGroupItemObj)}" process="@this">
					<p:graphicImage library="ep/images/design"  value="/css/images/design/edit.png" />						
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.create']}" ajax="false"
			action="#{panelGroupItemBackingBean.createpanelGroupItem}" />
	</div>
</ui:composition>
