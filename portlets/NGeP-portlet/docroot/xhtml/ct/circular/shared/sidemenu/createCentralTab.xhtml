<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	<style>
      .column-align-right { text-align: right !important;}
    </style>
    <p:panel>
	 <div class="ppRightBtn"> 
	  			<ui:repeat var="action"	value="#{centralBackingBean.managedBean.outComes}">
					<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(action)}" />
					<p:commandButton value="#{lbl[buttonLabel]}" process="@this" styleClass="ui-button" actionListener="#{centralBackingBean.saveCircular(action)}" />
				</ui:repeat>		
    </div>
	</p:panel>
	<p:tabView id="tabview" orientation="left" >
	<p:tab id="createCentral" title="#{lbl['lbl.ct.cc.createcc']}" >
       <ui:include src="/xhtml/ct/circular/centralcontract/createCircular.xhtml"/>
    </p:tab> 
	 <p:tab id="approverSetting" title="#{lbl['lbl.ct.menu.approver.setting']}" >
       <ui:include src="/xhtml/ct/circular/centralcontract/approvalSetting.xhtml"/>
       </p:tab> 
	 <p:tab id="remakrs" title="#{lbl['lbl.ct.remarksnattachements']}" >
       <ui:include src="/xhtml/ct/circular/centralcontract/attachement.xhtml"/>
       </p:tab>  
	</p:tabView>
   </ui:define>
</ui:composition>
