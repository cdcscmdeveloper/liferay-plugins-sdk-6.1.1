<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	<style>
      .column-align-right { text-align: right !important;}
    </style>
    <p:panel>
	 <div class="ppRightBtn"> 
	  			<ui:repeat var="action"	value="#{panelBackingBean.managedBean.outComes}">
					<p:commandButton value="#{action}" process="@this" styleClass="ui-button" actionListener="#{panelBackingBean.saveCircular(action)}" />
				</ui:repeat>		
    </div>
	</p:panel>
	<p:tabView id="tabview" orientation="left" >
	<p:tab id="updateTab" title="#{lbl['lbl.ct.pc.updatepc']}" >
       <ui:include src="/xhtml/ct/circular/panel/updateCircular.xhtml"/> 
    </p:tab> 
	 <p:tab id="zoneDetails" title="#{lbl['lbl.ct.pc.panel.zone']}" >
       <ui:include src="/xhtml/ct/circular/panel/zone.xhtml"/>
     </p:tab> 
     <p:tab id="itemDetails" title="#{lbl['lbl.ct.pc.panel.item']}" >
       <ui:include src="/xhtml/ct/circular/panel/item.xhtml"/>
     </p:tab> 
   <p:tab id="approverSetting" title="#{lbl['lbl.ct.menu.approver.setting']}" >
       <ui:include src="/xhtml/ct/circular/panel/approverSetting.xhtml"/>
       </p:tab> 
	 <p:tab id="remakrs" title="#{lbl['lbl.ct.remarksnattachements']}" >
       <ui:include src="/xhtml/ct/circular/panel/attachements.xhtml"/>
       </p:tab>  
	</p:tabView>
   </ui:define>
</ui:composition>
