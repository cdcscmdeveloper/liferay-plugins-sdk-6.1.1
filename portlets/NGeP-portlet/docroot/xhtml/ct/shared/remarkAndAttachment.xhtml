<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.ct.panel.remarks.attachment']}" toggleable="true" 
	    rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting and !ctBackingBean.managedBean.viewSCL}">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include src="remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include src="attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>		
	<!-- Bug #29446 - start -->
	<p:panel header="#{lbl['lbl.ct.panel.remarks.attachment']}" toggleable="true" 
	    rendered="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.viewSCL}">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top" style="text-align:center"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" style="float:none;text-align:center"/></td>
				<td width="50%" valign="top" style="text-align:center"><h:outputLabel value="#{lbl['lbl.txt.attachment']}" style="float:none;text-align:center"/></td>
			</tr>
			<tr>
				<td class="TableFieldLeft" width="50%" style="padding-left:6.25%;text-align:left">
					<p:dataGrid var="remark" 
					value="#{ctBackingBean.managedBean.remarkList}" rowIndexVar="index"
						columns="1"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
						<table>
							<tr>
								<td rowspan="2" valign="top">
									<h:graphicImage value="#{ctBackingBean.userImagePath(remark.createdUser.loginId)}"
										height="30" width="30" />
									</td>
								<td width="5"></td>
								<td>
									<h:outputText id="remarkCreator"
										value="#{remark.createdUser.userName}" />, 
									<h:outputText id="remarkDates" value="#{remark.changedDate}">
										<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText>
								</td>
							</tr>
							<tr>
								<td></td>
								<td>
									<h:outputText value="#{remark.remark}"
									style="display: inline-block; word-break: break-word; white-space:normal"/>
								</td>
							</tr>
						</table>
					</p:dataGrid>
				</td>
				<td class="TableFieldRight" width="50%" style="padding-left:6.25%">
						<p:dataGrid value="#{ctBackingBean.managedBean.attachmentList}"
							emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" var="attachment"
							rowIndexVar="attachFileIndex" columns="1" style="width:100%">
							<table>
								<tr>
									<td rowspan="2" style="vertical-align: top;" align="left">
										<h:graphicImage value="/css/images/design/#{ctBackingBean.determineIcon(attachment)}"
											height="30" width="30" />
									</td>
									<td><h:outputText value="#{attachment.createdUser.userName}" />, 
										<h:outputText value="#{attachment.createdDate}">
											<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
										</h:outputText>
									</td>
								</tr>
								<tr>
									<td>
										<h:commandLink value="#{attachment.fileName}"
											styleClass="blue_font" immediate="true"
											action="#{ctBackingBean.downloadFile(attachment)}" />
									</td>
								</tr>
							</table>
						</p:dataGrid>
				</td>
			</tr>
		</table>
	</p:panel>
	<!-- Bug #29446 - end -->
</ui:composition>
