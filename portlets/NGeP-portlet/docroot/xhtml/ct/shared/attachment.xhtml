<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" >

	<table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.attachment']}" /></td>
			<td class="TableFieldRight">
				<p:commandButton oncomplete="uploadDlg.show();return false;"
					update="lampiran, uploadDlg" value="#{lbl['lbl.txt.attach.files']}"
					disabled="#{ctBackingBean.managedBean.viewContract
						or (ctBackingBean.managedBean.taskId != null and !bpmTasklistBackingBean.managedBean.claim)}" />
			</td>
		</tr>
		<tr>
			<td/>
			<td>
				<p:dataGrid id="lampiran" value="#{ctBackingBean.managedBean.attachmentList}"
					var="attachFile" rowIndexVar="attachFileIndex" columns="1" style="width:100%">
					<table>
						<tr>
							<td rowspan="2"><h:graphicImage value="/css/images/design/#{ctBackingBean.determineIcon(attachFile)}" height="30" width="30"/></td>
							<td width="5"></td>
							<td>
								<h:outputText value=" #{attachFile.createdUser.userName}"></h:outputText>,
								<h:outputText value="#{attachFile.createdDate}">									
									<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<h:commandLink value="#{attachFile.fileName}" 
									styleClass="blue_font" action="#{ctBackingBean.downloadFile(attachFile)}" />
								<p:commandLink onsuccess="deleteAttachmentDlg.show();" action="#{ctBackingBean.setAttachFileIndex(attachFileIndex)}"
									rendered="#{ctBackingBean.compareUserName(attachFile.createdUser.loginId)
												and !ctBackingBean.managedBean.viewContract}"
									disabled="#{ctBackingBean.managedBean.viewContract
										or (ctBackingBean.managedBean.taskId != null and !bpmTasklistBackingBean.managedBean.claim)}">
			   						<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			 	 				</p:commandLink>
			 	 			</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>

	<p:dialog id="uploadDlg" widgetVar="uploadDlg" modal="true"  resizable="false"
	     width="700px" height="350px" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{ctBackingBean.fileUpload}"
			mode="advanced" id="upload" multiple="true"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload.all']}" cancelLabel="#{lbl['lbl.btn.remove.all']}" 
			update="lampiran" >
		</p:fileUpload>
		<f:facet name="footer">
		<div class="ppRightBtn">
		    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadDlg.hide();" />
  		</div>
   		</f:facet>
	</p:dialog>	
	
	  <p:confirmDialog id="deleteAttachmentDlg" widgetVar="deleteAttachmentDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                         <div class="ppRightBtn">
		                     <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                         update=":form:lampiran" 
		                         action="#{ctBackingBean.deleteAttachmentAction(ctBackingBean.managedBean.attachFileIndex)}" oncomplete="deleteAttachmentDlg.hide();"/>
			                 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteAttachmentDlg.hide();" type="button" />
		                 </div>
                   </p:confirmDialog>
		
</ui:composition>
