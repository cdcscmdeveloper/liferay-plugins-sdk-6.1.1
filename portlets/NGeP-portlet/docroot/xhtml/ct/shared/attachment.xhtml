<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" >

	<table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.attachment']}" /></td>
			<td class="TableFieldRight">
				<p:commandButton oncomplete="uploadDlg.show();return false;" icon="iconAttachment" 
					update="lampiran" value="#{lbl['lbl.ct.upload.attach.files']}" />
			</td>
		</tr>
		<tr>
			<td/>
			<td>
				<p:dataGrid id="lampiran" value="#{ctBackingBean.managedBean.attachmentList}"
					var="attachFile" rowIndexVar="attachFileIndex" columns="1" style="width:100%">
					<table>
						<tr>
							<td rowspan="2"><h:graphicImage library="ep/images/design" name="#{ctBackingBean.determineIcon(attachFile)}" height="30" width="30"/></td>
							<td width="5"></td>
							<td>
								<h:outputText value=" #{attachFile.createdUser.userName}"></h:outputText>,
								<h:outputText value="#{attachFile.createdDate}">									
									<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<h:commandLink value="#{attachFile.fileName}" styleClass="blue_font" action="#{ctBackingBean.downloadFile(attachFile)}" />
								<p:commandLink action="#{ctBackingBean.deleteAttachmentAction(attachFileIndex)}" immediate="true" 
									rendered="#{ctBackingBean.compareUserName(attachFile.createdUser.loginId)}" update="lampiran" >
			   						<h:graphicImage library="ep/images/design" name="icon_trash.png" styleClass="tasklist_title1"/>
			 	 				</p:commandLink>
			 	 			</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>

	<p:dialog id="uploadDlg" widgetVar="uploadDlg" modal="false" resizable="false" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{ctBackingBean.fileUpload}"
			mode="advanced" id="upload"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="#{lbl['lbl.ct.upload.invalid.msg']}"
			update="lampiran" >
		</p:fileUpload> 
	</p:dialog>		
		
</ui:composition>
