<!-- Bug #29446 -->
<!-- start -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<tr>
		<td class="TableFieldLeft" width="50%" style="padding-left:6.25%;text-align:left">
			<p:dataGrid var="remark" 
			value="#{contractDetailsBackingBean.managedBean.selectedTabIndex eq 0 ? ctBackingBean.managedBean.remarkList : 
				(contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.agencyIndex ? ctBackingBean.managedBean.contractVer.agencyRemarks : 
				(contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.itemIndex ? ctBackingBean.managedBean.contractVer.itemRemarks : 
				(contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.deductionIndex ? ctBackingBean.managedBean.contractVer.deductionRemarks : 
				(contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.scheduleIndex ? ctBackingBean.managedBean.contractVer.scheduleRemarks : 
				(contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.factoring ? ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.remark : 
				(contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.settingIndex ? ctBackingBean.managedBean.contractVer.settingRemarks : 
				(contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.notificationIndex ? ctBackingBean.managedBean.contractVer.notiSettingRemarks : null)))))))}" rowIndexVar="index"
				columns="1"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<table>
					<tr>
						<td rowspan="2" valign="top">
							<h:graphicImage value="#{ctBackingBean.userImagePath(remark.createdUser.loginId)}"
								height="30" width="30" />
							</td>
						<td width="5"></td>
						<td>
							<h:outputText id="remarkCreator"
								value="#{remark.createdUser.userName}" />, 
							<h:outputText id="remarkDates" value="#{remark.changedDate}">
								<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</h:outputText>
						</td>
					</tr>
					<tr>
						<td></td>
						<td>
							<h:outputText value="#{remark.remark}"
							style="display: inline-block; width:220px;word-wrap: break-word;"/>
						</td>
					</tr>
				</table>
			</p:dataGrid>
		</td>
		<td class="TableFieldRight" width="50%" style="padding-left:6.25%">
			<p:dataGrid value="#{contractDetailsBackingBean.managedBean.selectedTabIndex eq 0 ? ctBackingBean.managedBean.attachmentList : 
				(contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.agencyIndex ? ctBackingBean.managedBean.contractVer.agencyAttachements : 
				(contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.itemIndex ? ctBackingBean.managedBean.contractVer.itemAttachments : 
				(contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.deductionIndex ? ctBackingBean.managedBean.contractVer.deductionAttachments : 
				(contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.scheduleIndex ? ctBackingBean.managedBean.contractVer.scheduleAttachments : 
				(contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.factoring ? ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.attachement : null)))))}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" var="attachment"
				rowIndexVar="attachFileIndex" columns="1" style="width:100%">
				<table>
					<tr>
						<td rowspan="2" style="vertical-align: top;" align="left">
							<h:graphicImage value="/css/images/design/#{ctBackingBean.determineIcon(attachment)}"
								height="30" width="30" />
						</td>
						<td><h:outputText value="#{attachment.createdUser.userName}" />, 
							<h:outputText value="#{attachment.createdDate}">
								<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</h:outputText>
						</td>
					</tr>
					<tr>
						<td>
							<h:commandLink value="#{attachment.fileName}"
								styleClass="blue_font" immediate="true"
								action="#{ctBackingBean.downloadFile(attachment)}" />
						</td>
					</tr>
				</table>
			</p:dataGrid>
		</td>
	</tr>

</ui:composition>
<!-- end -->
