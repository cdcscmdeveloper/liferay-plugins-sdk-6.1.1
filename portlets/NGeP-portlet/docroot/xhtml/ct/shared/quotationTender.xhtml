<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<style>
		.columnTop td {
			vertical-align:top;
		}
	</style>
   <p:panel id="qtnTenderPnl" header="#{lbl['lbl.ct.panel.procurement']}" toggleable="true"  toggleSpeed="500">
	    <!-- <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.procurement.dtls']}"/> -->
	   
	  <h:panelGrid style="width:100%;" styleClass="top-aligned-columns">
		<h:panelGroup style="width:100%;" >
		  <table style="width: 100%">
				<tr>
					<td class="columnWidth150">
			             <p:outputLabel value="#{lbl['lbl.ct.proc.mode']}" />
			       </td>
			       <td>
		             <p:inputTextarea  style="width:170px;" disabled="true" maxlength="50" rows="2" autoResize="false" 
		                value="#{ctBackingBean.getParameterDesc(ctBackingBean.managedBean.ctContractVer.ctContract.procurementMode)}" />
		           </td>
		          <td>
		                   <p:outputLabel value="#{lbl['lbl.ct.loa.physical.no']}" />
			     </td>
			     <td> 
			         <h:panelGrid columns="3">				
				     <p:inputTextarea id="ctLoaNo" rows="2"  style="width:170px;margin-bottom: 5px;" disabled="true" 
				         maxlength="30" autoResize="false"  value="#{ctBackingBean.managedBean.ctContractVer.ctContract.loaPhysicalNo}" />
				     <p:spacer width="1"/>
			         <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.loa.physical.no']}" />
			       </h:panelGrid>	
			     </td>
			  </tr>
			  
			  <tr>
			  <td>
			            <p:outputLabel value="#{lbl['lbl.ct.fulfilment.type']}" />
			        </td>
			        <td>
			             <p:inputText style="width:170px;" disabled="true"  
			                value="#{ctBackingBean.getParameterDesc(ctBackingBean.managedBean.ctContractVer.ctContract.fulfillmentType)}" />		
			        </td>
			     <td>
		             <p:outputLabel value="#{lbl['lbl.ct.loa.no']}" />
		         </td>
		         <td>
			          <h:panelGrid columns="3">
				         <p:inputText style="width:170px;" disabled="true" maxlength="30" 
				             value="#{ctBackingBean.managedBean.ctContractVer.ctContract.loa.loaNo}" />
				         <p:spacer width="1"/>
			            <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.loa.no']}" />
			         </h:panelGrid>
			     </td>
			     </tr>
			     
			     <tr>
			     
			     <td>
			                 <p:outputLabel value="#{lbl['lbl.ct.contract.Type']}" />
			            </td>
			            <td>
		                       <p:inputText  style="width:170px;" disabled="true" maxlength="50"
		                            value="#{ctBackingBean.getParameterDesc(ctBackingBean.managedBean.ctContractVer.ctContract.contractType)}" />
		               </td>
		               <td>
		    	           <p:outputLabel value="#{lbl['lbl.ct.loa.ack.date']}" />
		    	       </td>
		    	       <td>
			                  <p:inputText style="width:170px;" disabled="true"
			                        value="#{ctBackingBean.managedBean.ctContractVer.ctContract.ackDate}">
			                        <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			                  </p:inputText>
		                </td>
		            </tr>
		            
		            <tr>
		               <td>
			            <p:outputLabel value="#{lbl['lbl.ct.proc.type.category']}" />
			        </td>
			        <td>
			           <p:inputText style="width:170px;" disabled="true"  
			                value="#{ctBackingBean.getParameterDesc(ctBackingBean.managedBean.ctContractVer.ctContractValue.procurementTypeCategory)}" />		
			        </td>
		               
		               <td>
		                         <p:outputLabel value="#{lbl['lbl.ct.service.fee']}" />
		                   </td>
		                   <td>
			                     <h:panelGrid columns="4">
			                         <p:inputText styleClass="ppRightBtn" style="width:80px;" disabled="true" 
			                             maxlength="5"  value="#{ctBackingBean.managedBean.ctContractVer.ctContract.serviceFee}"/>	
				                     <p:outputLabel value="%" />
				                     <p:spacer width="1" />
				                   <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.service.fee']}" />
		                          </h:panelGrid>
		                    </td>
		                    </tr>
		                    <tr>
		                 <td>
		                      <p:outputLabel value="#{lbl['lbl.ct.gst.service']}" rendered="#{ctBackingBean.chkProcurementTypeService()}"/>
			                  </td>
			                  <td>
		                        <h:panelGrid  style="margin-bottom:10px" cellpadding="5" 
		                            rendered="#{ctBackingBean.chkProcurementTypeService()}">
                                          <p:selectOneRadio id="radioButtonId" disabled="true"
                                              value="#{ctBackingBean.managedBean.ctContractVer.ctContractValue.serviceTax}">
                                                <f:selectItem itemLabel="Yes" itemValue="true" />
                                                <f:selectItem itemLabel="No" itemValue="false" />
                                          </p:selectOneRadio>
                                 </h:panelGrid>
			                 </td>
			                 <td>
		                         <p:outputLabel value="#{lbl['lbl.ct.pub.date']}" rendered="#{!ctBackingBean.managedBean.directPurchase}"/>
			                 </td>
			                 <td>
			                      <p:inputText  rendered="#{!ctBackingBean.managedBean.directPurchase}"
				                       style="width:80px;" disabled="true" value="#{ctBackingBean.managedBean.ctContractVer.ctContract.publishDate}">
				                    <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
		                         </p:inputText>	
		                    </td>
		                 </tr>
		               </table>	
		               </h:panelGroup>	
		           </h:panelGrid>
        </p:panel>
</ui:composition>
