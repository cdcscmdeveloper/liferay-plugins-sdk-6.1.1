<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="fd" toggleable="true" collapsed="false" toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.contract']}"/>
			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fulfilment.dtls']}"/>
	   	</f:facet>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br/><br/>
		<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		   <h:panelGroup style="width:870px;" >
			<table style="width: 100%">
				<tr>
					<td class="columnWidth200">
						<p:outputLabel id="cno" value="#{lbl['lbl.ct.contract.no']}" />
					</td>
					<td>
						<p:inputText for="cno"  disabled="true" maxlength="17" style="width:160px;"
							value="#{ctBackingBean.managedBean.ctContractVer.ctContract.contractNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.no']}" />
					</td>
					<h:panelGroup rendered="#{ctBackingBean.managedBean.ctContractVer.ctContractAmount.agreement or 
						ctBackingBean.managedBean.ctContractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral}">
					<td class="columnWidth200">
						<p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physical.no']}" />
					</td> 
					<td>
						<p:inputText for="physicalNo" maxlength="30" style="width:160px;" disabled="true"
		 	    		value="#{ctBackingBean.managedBean.agreementContractVer.contractPhysicalNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.physical.contract.no']}" />
					</td>
					</h:panelGroup>
				</tr>
				<tr>
					<td class="columnWidth200">
						<p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contract.amount']}" />
					</td>
					<td>
						<p:inputText for="contractAmount" styleClass="ppRightBtn"  maxlength="22" style="width:160px;"
			   				value="#{ctBackingBean.managedBean.ctContractVer.ctContractAmount.contractAmount}"  disabled="true">
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</td>
					<td class="columnWidth200">
						<p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effective.date']}" />
					</td>
					<td>
						<p:inputText for="effectiveDate" disabled="true" style="width:160px;"
							value="#{ctBackingBean.managedBean.ctContractVer.ctContractValue.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
			  	</tr>
			  	<tr>
			  	<td class="columnWidth200">
						<p:outputLabel id="gstAmount" value="#{lbl['lbl.ct.gst.amt']}"  />
					</td>
					<td>
						<p:inputText for="gstAmount" styleClass="ppRightBtn"  maxlength="22" style="width:160px;"
			   				 disabled="true" 
			   				 rendered="#{ctBackingBean.managedBean.gstCheckingGUI}"
			   				 value="#{ctBackingBean.managedBean.ctContractVer.ctContractAmount.gstAmount}" >
			   				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
						<p:inputText style="width:160px;" disabled="true" 
			   				  rendered="#{!ctBackingBean.managedBean.gstCheckingGUI}" value="#{lbl['lbl.ct.gst.na']}">
						</p:inputText>
					</td>
					<td class="columnWidth200">
						<p:outputLabel id="edate" value="#{lbl['lbl.ct.expiry.date']}" />
					</td> 
					<td>
						<p:inputText for="edate" disabled="true" style="width:160px;"
							value="#{ctBackingBean.managedBean.ctContractVer.ctContractValue.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
				</tr>
				<tr>
					<td class="columnWidth200">
						<p:outputLabel id="overAllAmt" value="#{lbl['lbl.ct.gst.all.amt']}" />
					</td>
					<td>
						<p:inputText id="overAllAmts" styleClass="ppRightBtn"  maxlength="22" style="width:160px;"
			   				value="#{ctBackingBean.managedBean.ctContractVer.ctContractAmount.gstAmount + ctBackingBean.managedBean.ctContractVer.ctContractAmount.contractAmount}"  disabled="true">
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</td>
					<h:panelGroup rendered="#{!ctBackingBean.managedBean.ctContractVer.ctContract.zonalPricing}">
					<td class="columnWidth200">
	     	             	<p:outputLabel id="dperiodtxt" value="#{lbl['lbl.ct.delivery.period']}" style="width:100%" styleClass="required" />
					</td> 
					<td><p:inputText id="dperiod" styleClass="ppRightBtn" validator="#{webappBean.validateDPeriod}" required="true" style="width:45px;"
		              		maxlength="4" value="#{ctBackingBean.managedBean.ctContractVer.ctContractValue.deliveryTerm}" disabled="true" />
                		<p:spacer width="3"/>
                		<h:outputText value="#{lbl['lbl.ct.days']}" />
                	</td>
                	</h:panelGroup>
                	</tr>
                	<tr>
				  	<h:panelGroup rendered="#{ctBackingBean.managedBean.ctContractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral 
                		and !ctBackingBean.managedBean.ctContractVer.ctContractAmount.agreement}">
					<td class="columnWidth200">
						<p:outputLabel id="signBy1" value="#{lbl['lbl.ct.signed.date']}" />
					</td> 
					<td>
						<p:inputText for="signBy1" disabled="true" style="width:160px;"
							value="#{ctBackingBean.managedBean.agreementContractVer.signedDate}">
			   				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
					</td>
                	</h:panelGroup>
				</tr>
				<h:panelGroup rendered="#{ctBackingBean.managedBean.ctContractVer.ctContractAmount.agreement}">
				<tr rowspan="2">
					<h:panelGroup rendered="#{ctBackingBean.managedBean.ctContractVer.ctContractAmount.ctAgreement.status.statusId != CtStatusConst.acComplete and
						ctBackingBean.managedBean.ctContractVer.ctContractAmount.ctAgreement.status.statusId != CtStatusConst.saComplete}">
					<td class="columnWidth200">
						<p:outputLabel for="astatus" value="#{lbl['lbl.ct.agreement.status']}" />
					</td>
					<td>
						<p:inputTextarea id="astatus" autoResize="false" maxlength="1000" 
							disabled="true" rows="2" style="width:160px;margin-bottom:5px;"
							value="#{ctBackingBean.getStatusDescById(ctBackingBean.managedBean.ctContractVer.ctContractAmount.ctAgreement.status.statusId)}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.status']}" />
					</td>
					</h:panelGroup>
					<h:panelGroup rendered="#{ctBackingBean.managedBean.ctContractVer.ctContractAmount.ctAgreement.status.statusId eq CtStatusConst.acComplete or
						ctBackingBean.managedBean.ctContractVer.ctContractAmount.ctAgreement.status.statusId eq CtStatusConst.saComplete}">
					<td styleClass="columnWidth200">
						<p:outputLabel id="agreement" value="#{lbl['lbl.ct.agreement']}" />
					</td>
					<td>
						<h:commandLink for="agreement" styleClass="blue_font"
							title="#{ctBackingBean.managedBean.ctContractVer.ctContractAmount.ctAgreement.fileName}"
							value="#{ctBackingBean.getShortFileName(ctBackingBean.managedBean.ctContractVer.ctContractAmount.ctAgreement.fileName)}"
							action="#{ctBackingBean.downloadFile(ctBackingBean.managedBean.ctContractVer.ctContractAmount.ctAgreement.filePath,
							ctBackingBean.managedBean.ctContractVer.ctContractAmount.ctAgreement.fileName)}" />
					</td>
					</h:panelGroup>
					<td class="columnWidth200">
						<p:outputLabel id="signBy" value="#{lbl['lbl.ct.signed.date']}" />
					</td> 
					<td>
						<p:inputText for="signBy" disabled="true" style="width:160px;"
							value="#{ctBackingBean.managedBean.agreementContractVer.signedDate}">
			   				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
					</td>
				</tr>
				</h:panelGroup>
				<tr rowspan="4">
					<td class="columnWidth200">
						<p:outputLabel for="contractName" value="#{lbl['lbl.ct.contract.title']}" />
					</td>
					<td colspan="3">
						<p:inputTextarea id="contractName" autoResize="false" maxlength="1000"
							disabled="true" rows="4" style="width:585px; margin-bottom:5px;" 
							value="#{ctBackingBean.managedBean.ctContractVer.ctContract.contractName}" />
					</td>					
				</tr>
			</table>
		</h:panelGroup>
		<h:panelGrid style="width:330px; margin-left:5px">
		   <h:panelGrid columns="3" rendered="#{ctBackingBean.managedBean.ctContractVer.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase
		   		and ctBackingBean.managedBean.ctContractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
			 <p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.ctContractVer.ctContractValue.concession}" disabled="true">
			 </p:selectBooleanCheckbox>
			 <p:spacer width="2" />
			 <h:panelGrid columns="2">
				 <h:outputText value="#{lbl['lbl.ct.concession']}" />
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.concession']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.ctContractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		     <h:panelGrid columns="2">
			     <h:outputText value="#{lbl['lbl.ct.fee.exmption']}"/>
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fee.exmption']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.ctContractVer.ctContractAmount.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <h:panelGrid columns="2">
			     <h:outputText value="#{lbl['lbl.ct.agreement']}" />
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement']}" />
			 </h:panelGrid>
	       </h:panelGrid>	
	       <h:panelGrid columns="3" 
	          	rendered="#{false and ctBackingBean.managedBean.ctContractVer.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase
	          	and ctBackingBean.managedBean.ctContractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
			  <p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.ctContractVer.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.mto']}" />
			  </h:panelGrid>
		   </h:panelGrid>	
		   <h:panelGrid columns="3" rendered="#{ctBackingBean.managedBean.ctContractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral}">  
			   <p:selectBooleanCheckbox 
			      value="#{ctBackingBean.managedBean.ctContractVer.ctContractValue.followLoaAmt}"  disabled="true"/>
		       <p:spacer width="2" />
		       <h:panelGrid columns="2">
		       		<h:outputText value="#{lbl['lbl.ct.follow.ctvalue']}" />
		       		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fctvalue']}" />
			   </h:panelGrid>
		     </h:panelGrid> 
		   <h:panelGrid columns="3" rendered="#{ctBackingBean.managedBean.ctContractVer.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase}">
			  <p:selectBooleanCheckbox id="exemptId" value="#{ctBackingBean.managedBean.ctContractVer.ctContractValue.ap201Exempt}" 
			    disabled="true" style="text-align:top;"> 
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.ap201']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap201.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3" 
		     rendered="#{ctBackingBean.managedBean.ctContractVer.ctContract.loa.loaAmt > ctBackingBean.managedBean.performanceBondRuleAmt
		     	and ctBackingBean.managedBean.ctContractVer.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase
		     	and ctBackingBean.managedBean.ctContractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
			 <p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.ctContractVer.ctContractAmount.bondReq ? false : true}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.pb.exemption']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>	
	    </h:panelGrid>
	     <h:panelGrid columns="2" style="width:870px;"  styleClass="top-aligned-columns" columnClasses="columnWidth200"
	      	rendered="#{ctBackingBean.managedBean.ctContractVer.ctContractValue.ap201Exempt or 
	       	ctBackingBean.managedBean.ctContractVer.ctContractValue.concession}">	   		
	   		<p:outputLabel for="justificationLbl" value="#{lbl['lbl.ct.justification.ap201']}" />
			<p:inputTextarea id="justificationLbl" value="#{ctBackingBean.managedBean.ctContractVer.ctContractValue.justification}"
  				rows="3" style="width:585px;" maxlength="200" autoResize="false" disabled="true" />		         		
    	</h:panelGrid> 
	</h:panelGrid>
 </p:panel>
</ui:composition>
