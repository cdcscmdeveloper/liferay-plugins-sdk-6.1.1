<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	
   	       
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/fulfilmentAgreement/shared/sideMenu/menuSuplementAgreement.xhtml" />
	</ui:define>

	<ui:define name="content">
		      
        	<h:form prependId="false" id="form">         
        	    
        	       <p:messages showDetail="true" globalOnly="true"/> 
						
						<p:panel id="templatesAgreements" header="Create Agreement"  toggleable="true"  toggleSpeed="500" widgetVar="signingAgreements">
                              
                                 
                                  <h:panelGrid style="width:800px;">  
                                  
                                  <p:spacer height="10"/>
                                  <h:outputLabel value="Standard" />
                                  <p:spacer height="10"/>
                                  <p:dataTable id="dataTable" var="data" value="#{agreementBackingBean.agreementList}" widgetVar="dataTableObj" lazy="false" dynamic="true" rowIndexVar="index"
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="false" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row> 
									                  
									                     <p:column colspan="1" style="width:30px" headerText="No"  /> 
									                     <p:column colspan="1"  style="width:400px" headerText="Section Title" /> 
									                     <p:column colspan="1"  style="width:150px" headerText="Type" /> 	
									                     <p:column colspan="1" style="width:100px" headerText="Action"  /> 
									                     </p:row>	
								               						
								            </p:columnGroup>
							                   				
							              <p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
							                     <p:column> <p:outputLabel value="#{data.agrementTitle}"/>    </p:column>
							                     <p:column><p:outputLabel value="#{data.agrementType}"/> </p:column>	
							                   
							                      <p:column styleClass="column-align-center">
								                 <p:commandButton title="Search"  rendered="#{data.agrementTitle != 'Agreement Clause'}" partialSubmit="true" process="@this" 
								                  icon="ui-icon-search" styleClass="ui-icon-button"/>
								                 <p:commandButton title="Edit"   rendered="#{data.agrementTitle == 'Agreement Clause'}" partialSubmit="true" process="@this"  
								                 icon="ui-icon-edit" styleClass="ui-icon-button"/>
							                     </p:column> 
							                    
						                    </p:dataTable>
							               </h:panelGrid>
							               
							                 <h:panelGrid style="width:800px" columnClasses="column-align-right">
							                       <p:commandButton value="Export to Word(.docx)" styleClass="text-align: right;" process="@this" partialSubmit="true" icon="ui-icon-add" 
							                      />
							
						                  </h:panelGrid>
							      
                        
                                  <h:panelGrid style="width:800px;">  
                                    <p:spacer height="10"/>
                                    <h:outputLabel value="Appendixes" />
                                
                                    <p:spacer height="10"/>
                                  <p:dataTable id="dataTable1" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" rowIndexVar="index"
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="false" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row> 
									                  
									                     <p:column colspan="1" style="width:30px" headerText="No"  /> 
									                     <p:column colspan="1"  style="width:400px" headerText="Section Title" /> 
									                     <p:column colspan="1"  style="width:150px" headerText="Type" /> 	
									                     <p:column colspan="1" style="width:100px" headerText="Action"  /> 
									                     </p:row>	
								               						
								            </p:columnGroup>
							                   				
							              <p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
							                     <p:column> 
                				                 </p:column>
							                     <p:column></p:column>	
							                      <p:column styleClass="column-align-center">
								                       <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
								                           icon="ui-icon-delete" styleClass="ui-icon-button"/>
								                           <p:spacer width="3"/>
								                          <p:commandButton title="View" onsuccess="confirmation.show()" partialSubmit="true" 
								                          process="@this"     icon="ui-icon-view" styleClass="ui-icon-button"/>
							                     </p:column> 
							               </p:dataTable>
							               </h:panelGrid>
							               
						            <h:panelGrid style="width:800px" columnClasses="column-align-right">
							                       <p:commandButton value="Add Appendix" styleClass="text-align: right;" process="@this" 
							                       partialSubmit="true" icon="ui-icon-add"  onclick="dlg2.show();"  />
							
						                  </h:panelGrid>
                                  
                            
                        
                        </p:panel>
                        
                        <p:panel id="uploadAgreements" header="Upload Agreement"  toggleable="true"  toggleSpeed="500" widgetVar="uploadsAgreements">
                        <p:spacer width="15"/>
                        <h:panelGrid style="width:800px;">
                        <h:outputLabel value="User is allowed to export the agreement into word document and modifies in word application such as adding image.
                         User is required to upload the modified agreement document in this section. If there is no modification on the agreement generated, 
                         system will automatic generate the agreement in word format for approver review during submission." />
                         </h:panelGrid>
                        
                        <p:spacer width="5"/>
                          <h:panelGrid columns="3">
                          <h:outputLabel value="Agreement Document :"/>
                          <p:commandLink style="margin-right:20px;" sajax="false">  
                                            <h:outputText value="KKM-2013-0003.docx"  styleClass="linkcommand" />  
                          </p:commandLink> 
                          <p:fileUpload value="alam"  mode="simple"></p:fileUpload>
                          
                          
                         </h:panelGrid>
                       
                        </p:panel>
                        
                        
                         <p:confirmDialog message="Do you want to delete the record?"
							closable="true" appendToBody="true" header="Delete Confirmation"
							severity="alert" widgetVar="confirmation">

							<h:panelGrid columns="2"
								columnClasses="column-align-right,column-align-left">
								<p:commandButton value="Yes" icon="ui-icon-accept"
									update="dataTable" partialSubmit="true" process="@this"
									onclick="confirmation.hide();"/>
								    <p:commandButton value="No" icon="ui-icon-reject"
									onclick="confirmation.hide()" type="button" />
							</h:panelGrid>
						</p:confirmDialog>

                   <p:dialog id="modalDialog" header="Add Appendix" widgetVar="dlg2" modal="true" width="600" height="300">
					<p:panel  id="appendix">

						<h:panelGrid columns="2" styleClass="txtpoup">
						
						
						 <h:panelGroup>
						    <div style="width:130px;">
							<h:outputLabel for="titles" value="Title" styleClass="txtpoup" />
							</div>
							</h:panelGroup>
            				<h:outputLabel id="titles"  value="Scope of Work" styleClass="txtpopup" />
							
							
							 <h:panelGroup>
						    <div style="width:130px;">
							<h:outputLabel  for="show" value="Type" styleClass="txtpopup"/>
							</div>
							</h:panelGroup>
            				<p:selectOneMenu id="show" disabled="false"  value="#{agreementBackingBean.agreementDetails.appendexType}"  style="width:200px;">
            			    <f:selectItem itemLabel="--Please Select--" itemValue="--Please Select--" /> 
            			    <f:selectItems value="#{agreementBackingBean.agreementApendex}" />
            					  <p:ajax event="change" update="changeField" listener="#{agreementBackingBean.changeApendexType}" process="@this"/>  
	                         </p:selectOneMenu> 
						</h:panelGrid>

			        

						 <p:outputPanel id="changeField"> 
						  
						  <h:panelGrid rendered="#{agreementBackingBean.systemDefined}" columns="2">
						    <h:panelGroup>
			                <div style="height: 65px; width:130px; vertical-align: top">
			                  <p:outputLabel for="sourcingFiles" value="Sourcing Files" styleClass="txtpopup" />
							 </div>
						     </h:panelGroup>
						     <h:panelGrid styleClass="txtsize">
                             <p:selectOneListbox id="sourcingFiles" value="" style="width:200px;">
                               <f:selectItem itemLabel="Scope of Work.docx" itemValue="1"  />  
                              <f:selectItem itemLabel="Floor_map.docx" itemValue="2" />  
                              <f:selectItem itemLabel="work_schedule.docx" itemValue="3" />
                                <f:selectItem itemLabel="performance_bond.docx" itemValue="4"  />    
                           </p:selectOneListbox>
                           </h:panelGrid>
						   </h:panelGrid>            
						                 
						   <h:panelGrid rendered="#{agreementBackingBean.userUploaded}" columns="3" >
						    <h:panelGroup>
						    <div style="width:130px;">
						    <h:outputLabel for="file" value="Upload File"/>
						 </div>
						 </h:panelGroup>
                          <p:commandLink style="margin-right:20px;" sajax="false">  
                                            <h:outputText value="KKM-2013-0003.docx"  styleClass="linkcommand" />  
                          </p:commandLink> 
                          <p:fileUpload value="alam"  mode="simple"></p:fileUpload>
                          
                          
                         </h:panelGrid>
						
						 
						 
						 </p:outputPanel>
						 <f:facet name="footer">
							<h:panelGrid columns="2" columnClasses="column-align-right,column-align-left" style="height: 40px;vertical-align: middle;">
								<p:commandButton value="Ok"   process="modalDialog" update="dataTable1,modalDialog" onclick="dlg2.hide();"/>
                            	<p:commandButton value="Cancel"  type="button" ajax="false" onclick="dlg2.hide();" />
						</h:panelGrid>
						</f:facet>
					</p:panel>
				</p:dialog>
                       </h:form>
                       </ui:define>
                       </ui:composition>
