<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
	<script> $('#portlet_ctContractMaintenance_WAR_NGePportlet').find('.portlet-title-text').html('#{contractDetailsBackingBean.getViewPortletTitle()}'); </script>
	  <style>
      .column-align-center {
         text-align: center !important;
      }
      .top-aligned-columns td { 
         vertical-align: top;
      }     
         .columnWidth150 {
	        width: 150px;
	        vertical-align: top;
	        text-align: right;
         }
          .columnWidth200 {
	        width: 200px;
         }
         .columnWidth250 {
	        width: 250px;
         }
         .columnWidth350 {
	        width: 350px;
         }
         
          .columnWidth240 {
	        width: 240px;
	        vertical-align: top;
	        text-align: right;
         }
         .confirmation-message-box {
         	border: 1px solid #cecece;
			font-family: Arial;
			font-size: 12px;
			cursor: default;
			padding: 10px;
         }
         .columnWidthFact220 {
	        width: 220px;
	        vertical-align: top;
	        text-align: right;
         }
         .zone-tree-node tr td {
			border: none;
			padding: 4px 3px;
		}
		
		 .fileupload-buttonbar.ui-widget-header.ui-corner-top {
                padding: 0.0em 0.0em;
                padding-top: 0em;
                padding-right: 0em;
                padding-bottom: 0em;
                padding-left: 0em;
        }
    </style> 
    
      <script type="text/javascript">  
           window.addEventListener('keydown',function(e)
    		      {
    	                  if(e.keyIdentifier=='U+000A'||e.keyIdentifier=='Enter'||e.keyCode==13)
    	                       {
    	            	            e.preventDefault();return false;
    	                   }
    	        },  true);
      </script>
      
	  <p:blockUI id="blockUiId" block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<h:panelGroup id="comPanelMsgId">
			<f:event listener="#{contractDetailsBackingBean.preRenderView}"  type="preRenderView"  />	
			<p:messages id="messages" showSummary="false" showDetail="true"  autoUpdate="#{contractDetailsBackingBean.managedBean.autoUpdate}" closable="true" severity="error, info, warn" />
			<p:tooltip id="headerTooltip" global="true" position="left center" targetPosition="right center" forSelector=".ui-state-error"/>
	   </h:panelGroup>		
	   	<ui:include src="ownerManagementButtons.xhtml" />
		<ui:include src="ownerManagementHeader.xhtml" />
		
	<p:panel id="om" toggleable="true" collapsed="false" toggleSpeed="500">
	<f:facet name="header">
		<h:outputText value="#{lbl['lbl.ct.menu.contract.details']}"/>
		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.om.ct.dtls']}"/>
   	</f:facet>
	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br/><br/>
	<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		<h:panelGroup style="width:765px;" >
			<table style="width: 100%">
					<tr>
					<td class="columnWidth240">
						<p:outputLabel id="nosst" style="width:240px;" value="#{lbl['lbl.ct.loa.no']}" />
					</td>
					<td>
						<p:inputText for="nosst" disabled="true"  style="width:130px;"
			   				value="#{ctBackingBean.managedBean.contractVer.ctContractValue.loaNo}">
				   			<p:ajax  event="blur"> </p:ajax>
						</p:inputText>
					</td>
					<td class="columnWidth240">
						<p:outputLabel id="sstdate" style="width:240px;" value="#{lbl['lbl.ct.loa.date']}" />
					</td>
					<td>
						<p:inputText for="sstdate" disabled="true" style="width:130px;"
							value="#{ctBackingBean.managedBean.contractVer.ctContractValue.ackDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
			    </tr>
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="cno" value="#{lbl['lbl.ct.contract.no']}" />
					</td>
					<td>
						<p:inputText for="cno"  disabled="true" maxlength="17" style="width:130px;"
							value="#{ctBackingBean.managedBean.contractVer.ctContract.contractNo}" rows="2">
							</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.no']}" />
					</td>
					<td class="columnWidth150">
						<p:outputLabel id="nofile" value="#{lbl['lbl.ct.loa.physical.no']}" />
					</td>
					<td>
						<p:inputText for="nofile" disabled="true" style="width:130px;"
							value="#{ctBackingBean.managedBean.contractVer.ctContractValue.loaPhysicalNo}">
			  			</p:inputText>
			  		</td>					
				</tr>			
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effective.date']}" />
					</td>
					<td>
						<p:inputText for="effectiveDate" disabled="true" style="width:130px;"
							value="#{ctBackingBean.managedBean.contractVer.ctContractValue.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
			  		<td class="columnWidth150">
						<p:outputLabel id="exdate" value="#{lbl['lbl.ct.expiry.date']}" />
					</td> 
					<td>
						<p:inputText for="exdate" disabled="true" style="width:130px;"
							value="#{ctBackingBean.managedBean.contractVer.ctContractValue.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
			    </tr>			    
			    <tr>
			    <td class="columnWidth150">
						<p:outputLabel id="ministrycol" value="#{lbl['lbl.ct.ministry.owner.management']}"  />
					</td>
					<td>
						<p:inputText for="ministrycol" disabled="true"  style="width:250px;"
			   				 value="#{contractDetailsBackingBean.managedBean.oldMinistryProfile.orgName}">
			   				<p:ajax  event="blur" ></p:ajax>
						</p:inputText>
					</td>
					<td class="columnWidth150">
						<p:outputLabel id="centralphyNo" value="#{lbl['lbl.ct.physical.no']}" />
					</td> 
					<td>
						<p:inputText for="centralphyNo" disabled="true" style="width:130px;"
							value="#{ctBackingBean.managedBean.contractVer.contractPhysicalNo}">
			  			</p:inputText>
			  		</td>
				</tr>

				<tr rowspan="4">
					<td class="columnWidth150">
						<p:outputLabel for="contractName" value="#{lbl['lbl.ct.contract.title']}" />
					</td>
					<td >
						<p:inputTextarea id="contractName" 
							disabled="true" rows="4" style="width:250px;"  
							value="#{ctBackingBean.managedBean.contractVer.ctContract.contractName}" />
					</td>
					
					<td class="columnWidth150">
						<p:outputLabel for="ptjname" value="#{lbl['lbl.ct.ptj.name']}" />
					</td>
					<td>
						<p:inputTextarea id="ptjname"  
							disabled="true" rows="4" style="width:250px;"  
							value="#{ctBackingBean.managedBean.contractVer.ctContract.ownerOrgProfile.orgName}" />
					</td>					
				</tr>
			</table>
		</h:panelGroup>
	</h:panelGrid>

 </p:panel>
 <p:panel id="newom" header="#{lbl['lbl.ct.panel.owner.management']}" toggleable="true"  toggleSpeed="500">
 	<f:facet name="header">
		<h:outputText value="#{lbl['lbl.ct.panel.owner.management']}"/>
		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.om.owner.dtls']}"/>
   	</f:facet>
	<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		<h:panelGroup style="width:765px;" >
			<table style="width: 100%">
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="mnstry" value="#{lbl['lbl.ct.ministry']}" />
					</td>
					<td>
						<p:inputText  id="searchMinistry" for="mnstry" rows="2" readonly="true" size="110" 
						value="#{contractDetailsBackingBean.managedBean.searchMinistryProfile.orgName}" 
						disabled="#{contractDetailsBackingBean.disableMinistryLov()}"
						style="width:455px;">
						</p:inputText>
					</td>
				</tr>				
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="grpptj" value="#{lbl['lbl.ct.jabatan']}" />
					</td>
					<td>
					<p:inputText id="searchPtjGroup" rows="2"  readonly="true" size="110" style="width:455px;"
						value="#{contractDetailsBackingBean.managedBean.searchPtjGroupProfile.orgName}"
						disabled="#{contractDetailsBackingBean.isContractAdmin() 
					or ctBackingBean.isApprover() 
					or contractDetailsBackingBean.managedBean.searchMinistryProfile==null}">
					</p:inputText>
					</td>
				</tr>
				
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="ptj" value="#{lbl['lbl.ct.ptj']}" />
						<p:outputLabel
						value="*" styleClass="mandatory" />
					</td>
					<td>
					<p:inputText id="newOrgProfile" rows="3" cols="63" disabled="true" size="100" style="width:auto"
						value="#{contractDetailsBackingBean.managedBean.searchPtjProfile.orgName}">
						</p:inputText>
					<p:commandLink
						oncomplete="dlgAgency.show();"
						action="#{contractDetailsBackingBean.getPtjCondition()}"
						update=":form:newOrgProfile,dialogAgency">
						<p:graphicImage value="/css/images/design/search.png" />
					</p:commandLink>
					</td>
				</tr>

			</table>
		</h:panelGroup>
	</h:panelGrid>

	  </p:panel>
	  
	   <p:dialog id="dialogAgency"  header="#{lbl['lbl.ct.add.agency']}" widgetVar="dlgAgency" 
			styleClass="pop_up_top" modal="true" width="700" height="auto" resizable="false">
			<p:messages id="agencyMsg" showSummary="false" showDetail="true"  autoUpdate="true" closable="true" severity="error, info" />
		   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.add.agency.list']}" escape="false"/><br/><br/>
		   <h:panelGroup  id="agencyies">
		       <p:panel id="agencyPopUpId" header="#{lbl['lbl.ct.search']}" toggleable="true" toggleSpeed="500" >
              <h:panelGrid columns="4">
              	<p:outputLabel value="*" styleClass="mandatory" />
                 <p:selectOneMenu for="ministry"  style="width:150px" disabled="true" >
            	    <f:selectItem itemLabel="#{lbl['lbl.ct.ministry']}" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="ministry"   style="width:300px" 
                      value="#{ctBackingBean.managedBean.ministryProfileId}">
            	   <f:selectItems value="#{ctBackingBean.getMinistryDropdown()}"/>
            	   <p:ajax  process="@this" partialSubmit="true" event="change"  
            		  update=":form:jabatan,:form:ptjCodeVaue,:form:agencyTablePopUpId" listener="#{ctBackingBean.resetMinistryDetails}"   />
 
                 </p:selectOneMenu>
                  <p:spacer height="1"/>
                 <p:selectOneMenu for="jabatan"  style="width:150px" disabled="true" >
            	    <f:selectItem itemLabel="#{lbl['lbl.ct.jabatan']}" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="jabatan" style="width:300px"
                      value="#{ctBackingBean.managedBean.jabatanProfileId}" >
            	   <f:selectItems value="#{ctBackingBean.getJabatanDropdown()}"/>
            	    <p:ajax event="change" process="@this" partialSubmit="true"
            	        update=":form:ptjCodeVaue,:form:agencyTablePopUpId"  listener="#{ctBackingBean.resetJabatanDetails}" />
                 </p:selectOneMenu>
                  <p:spacer height="1"/>
                 <p:selectOneMenu for="ptjcodename" 
                    value="#{ctBackingBean.managedBean.ptjCodeName}"  style="width:150px;">
                       <f:selectItem itemLabel="#{lbl['lbl.ct.ptj.code']}" itemValue="#{CtConst.ptjCode}"/>
            	      <f:selectItem itemLabel="#{lbl['lbl.ct.ptj.name']}" itemValue="#{CtConst.ptjName}"/>
            	      <p:ajax process="@this"/>
                 </p:selectOneMenu>
				 <p:spacer height="1"/>
                 <p:inputText id="ptjCodeVaue"  style="width:300px;" 
                     value="#{ctBackingBean.managedBean.ptjCodeNameSearchValues}" >
                     <p:ajax process="@this"/></p:inputText>
			  </h:panelGrid>
			  	<div class="ppRightBtn">
       		         <p:commandButton id="agencySearchId" value="#{lbl['lbl.btn.search']}" update=":form:agencyTablePopUpId, agySlectBtnId"  
       		            action="#{ctBackingBean.searchAgencyDetails}" process="@this" partialSubmit="true"
       		            disabled="#{ctBackingBean.managedBean.ministryProfileId == null}"/> 
			         <p:commandButton id="resetlBtn" value="#{lbl['lbl.btn.reset']}" process="@this"
			            action="#{ctBackingBean.resetAgencyDetails}" update=":form:agencyies"   />
		       </div>
		       </p:panel>
			   <p:spacer height="2"/>
			        <p:panel id="agencyTablePopUpId" header="#{lbl['lbl.ct.search.result']}" toggleable="true" toggleSpeed="500" >
              <p:dataTable id="tableAgency"  value="#{ctBackingBean.agencyDataModel}" 
	       		rowIndexVar="rowIndex" var="pmVar" rowKey="#{pmVar}" lazy="true"
                  selection="#{ctBackingBean.managedBean.agencySelected}" >
                  <ac:paginator for="tableAgency"/>
                    <p:ajax event="toggleSelect" process="@this" update=":form:agySlectBtnId"/> 
                    <p:ajax event="rowSelectCheckbox" process="@this" update=":form:agySlectBtnId"/>
                    <p:ajax event="rowUnselectCheckbox" process="@this" update=":form:agySlectBtnId"/>
                    <p:ajax event="rowUnselect" process="@this" update=":form:agySlectBtnId"/>
					<p:ajax event="rowSelect" process="@this" update=":form:agySlectBtnId"/>
												
                  <p:column selectionMode="multiple" style="width:5%;"/>
                    <p:column headerText="#{lbl['lbl.ct.ptj.code']}" >
                       	#{pmVar.orgCode}
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.ptj.name']}" >
                      	#{pmVar.orgName}
					</p:column>
			 </p:dataTable>     
			<div class="ppRightBtn">
				<p:commandButton id="agySlectBtnId"  value="#{lbl['lbl.btn.select']}" process="@form" 
					update=":form:newOrgProfile, :form:newom" 
				    action="#{contractDetailsBackingBean.setSelectedRecommendedAgency}" onclick="dlgAgency.hide();"
				    disabled="#{ctBackingBean.managedBean.agencySelected eq null or empty ctBackingBean.managedBean.agencySelected}" 
				     onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
				    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="dlgAgency.hide();" />
           </div>
          </p:panel>
           </h:panelGroup>
	</p:dialog>	 
	<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml"  />
			<p:confirmDialog message="#{lbl['lbl.ct.msg.confirm.com.remark']}"
			severity="alert" widgetVar="cancelComConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					partialSubmit="true" process="@this"
					action="#{contractDetailsBackingBean.saveContract('CANCEL')}"
					onstart="cancelComConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" partialSubmit="true"
				process="@this" update="@form"
				onclick="cancelComConfirmDlg.hide()">
				<f:setPropertyActionListener
					target="#{contractDetailsBackingBean.managedBean.remarkList[0].remark}" value="#{null}" />
				</p:commandButton>
			</div>
		</p:confirmDialog>

	</ui:define>
</ui:composition>
