<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
  <p:panel id="settingId" header="#{lbl['lbl.ct.panel.approver.list']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="2">
			<p:spacer width="50" />
			<h:panelGrid style="width:500px;">
				<p:pickList id="approverpickList" value="#{amendmentBackingBean.managedBean.approverModel}"
					var="data" itemValue="#{data}" itemLabel="#{data.userName}"
					showTargetControls="true" filterMatchMode="contains" converter="pmUserConverter">
					<f:facet name="sourceCaption">
						#{lbl['lbl.ct.available.approver']}
						<p:graphicImage id="sourceList" value="/css/images/design/tooltips.png" /> 
						  <p:tooltip id="sourceTooltip" for="sourceList">
							<h:outputText id="sourceApprover" escape="false" value="#{lbl['lbl.ct.tooltip.available.approver']}" />
						</p:tooltip> 
					</f:facet>  
        			<f:facet name="targetCaption">
        			    <h:outputText  styleClass="required"/>
        			  # {lbl['lbl.ct.selected.approver']}
        				<p:graphicImage id="targetList" value="/css/images/design/tooltips.png" /> 
						  <p:tooltip id="targetTooltip" for="targetList">
							<h:outputText id="targetApprover" escape="false" value="#{lbl['lbl.ct.tooltip.selected.approver']}" />
						</p:tooltip> 
        			</f:facet>
				</p:pickList>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
</ui:composition>
