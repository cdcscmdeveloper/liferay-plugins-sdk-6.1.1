<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <p:panel id="itemId" header="Product Details"   toggleable="true"  toggleSpeed="500">
      <h:panelGrid  style="width:100%;">
        	<p:dataTable id="itemTable" var="data" value="#{contractDetailsBackingBean.contractItemList}" rowKey="#{data}" 
              	selectionMode="single" selection="#{contractDetailsBackingBean.managedBean.selectedItem}">
               	<ac:paginator for="itemTable"/>
               	<p:ajax event="rowSelect" update=":form:tabview:changeField"  />
		     	   <p:column headerText="#{lbl['lbl.ct.item.table.name']}">
		     	      <p:outputLabel value="#{data.itemName}" style="float:left;"/> </p:column>       
		     	   <p:column headerText="#{lbl['lbl.ct.item.table.uom']}">
		     	      <p:outputLabel value="#{data.uom.uomName}" style="float:left;"/> </p:column>        
		     	   <p:column headerText="#{lbl['lbl.ct.item.minodrqty']}" style="text-align: right;">
		     	     <p:outputLabel value="#{data.minimumOrderQty}"/></p:column>   
		     	   <p:column headerText="#{lbl['lbl.ct.item.maxqty']}" style="text-align: right;">
		     		 <p:outputLabel value="#{data.maxProcureAmount}"/></p:column>     
		     	   <p:column headerText="#{lbl['lbl.ct.item.typeofgoods']}">
		     		  <p:outputLabel value="#{contractDetailsBackingBean.getParameterDesc(data.itemOrigin)}" 
		     		    style="float:left;" />
		     	   </p:column>              
    		 </p:dataTable> 
       </h:panelGrid>
       <p:outputPanel id="changeField">
		  <p:spacer height="20"/>
		  <h:panelGrid columns="2" style="height:50px;text-align:bottom;" 
			rendered="#{contractDetailsBackingBean.managedBean.selectedItem!=null}">
		    <h:outputLabel for="show" value="Show" style="width:50px;"/>  
		      <p:selectOneMenu id="show" value="#{contractDetailsBackingBean.managedBean.showItem}" style="width:200px;">
		         <f:selectItems value="#{contractDetailsBackingBean.getDropdownCodeValues(ParameterTypeConst.itemDisplayType)}" />
		         <p:ajax event="change" update="changeField" listener="#{contractDetailsBackingBean.changeField}" process="@this"/>  
			  </p:selectOneMenu>         
		  </h:panelGrid>
		  <p:outputPanel columns="1" style="width:100%"
			rendered="#{(contractDetailsBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypePrice) 
			   and contractDetailsBackingBean.managedBean.selectedItem!=null}">
		    <p:dataTable id="itemPriceTable" var="data" value="#{contractDetailsBackingBean.managedBean.selectedItem.ctItemPrices}"
			   rowKey="#{data}">
			   <ac:paginator for="itemPriceTable"/>
			   <p:column headerText="#{lbl['lbl.ct.menu.zone']}"><p:outputLabel value="#{data.ctContractZone.zoneName}" style="float:left;" /></p:column>       
			   <p:column headerText="#{lbl['lbl.ct.item.fromqty']}" style="text-align: right;">
				  <p:outputLabel value="#{data.tierFrom}"/>
			   </p:column>       
			   <p:column headerText="#{lbl['lbl.ct.item.toqty']}" style="text-align: right;">
				  <p:outputLabel value="#{data.tierTo}"/>
			   </p:column>              
			   <p:column headerText="#{lbl['lbl.ct.item.table1.price.price']}" style="text-align: right;"><p:outputLabel value="#{data.unitPrice}"/></p:column>            
			   <p:column headerText="#{lbl['lbl.ct.item.table1.price.efdate']}">
				  <p:calendar style="width:130px;" value="#{data.effDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" 
				  disabled="true" />
			   </p:column>       
			   <p:column headerText="#{lbl['lbl.ct.item.table1.price.edate']}">
				  <p:calendar style="width:130px;" value="#{data.expDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				   disabled="true"  />
			   </p:column>       
			</p:dataTable>
		  </p:outputPanel>  
		  <h:panelGrid columns="1" style="width:100%"
			 rendered="#{(contractDetailsBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypeCeilQty)
			  and contractDetailsBackingBean.managedBean.selectedItem!=null}">
			 <p:dataTable id="ceilingTable" var="data" value="#{contractDetailsBackingBean.managedBean.selectedItem.ctItemCeilingQties}"
				rowKey="#{data}">
				<ac:paginator for="ceilingTable"/>
				<p:column headerText="#{lbl['lbl.ct.ministry']}">
				   <p:outputLabel value="#{data.ctAgency.orgProfile.parentOrgProfile.orgName}" style="float:left;" />
				</p:column>      
				<p:column headerText="#{lbl['lbl.ct.ptj.name']}">
				  <p:outputLabel value="#{data.ctAgency.orgProfile.orgName}" style="float:left;" />
				</p:column>              
				<p:column headerText="#{lbl['lbl.ct.item.table2.ceil.quan']}" style="text-align: right;">
					<p:inputText style="width:70px;" value="#{data.ceilingQuantity}" />
				</p:column>            
				<p:column headerText="#{lbl['lbl.ct.item.table1.price.efdate']}">
				   <p:calendar style="width:130px;" value="#{data.effDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true" />
				</p:column>       
				<p:column headerText="#{lbl['lbl.ct.item.table1.price.edate']}">
				   <p:calendar style="width:130px;" value="#{data.expDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true" />
				</p:column>           
			  </p:dataTable>
		  	</h:panelGrid>  
		</p:outputPanel> 
  	 </p:panel>
  	 <p:panel id="serviceId" header="Service Details"   toggleable="true"  toggleSpeed="500">
  	  <h:panelGrid  style="width:100%;">
  	    <p:dataTable id="serviceTable" var="data" value="#{contractDetailsBackingBean.contractItemList}" rowKey="#{data}" 
           selectionMode="single" selection="#{contractDetailsBackingBean.managedBean.selectedServiceItem}">
           <ac:paginator for="serviceTable"/>
              <p:ajax event="rowSelect" update=":form:tabview:showServicePrice"/>
		      <p:column headerText="#{lbl['lbl.ct.susp.tbl.item.name']}"><p:outputLabel value="#{data.itemName}" style="float:left;"/></p:column>       
		      <p:column headerText="#{lbl['lbl.ct.item.table.uom']}"><p:outputLabel value="#{data.uom.uomName}" style="float:left;"/></p:column>        
		      <p:column headerText="#{lbl['lbl.ct.item.minodrqty']}" style="text-align: right;"><p:outputLabel value="#{data.minimumOrderQty}"/></p:column>               
		      <p:column headerText="#{lbl['lbl.ct.item.uompermonth']}"  style="text-align: right;">
		     	<p:outputLabel value="#{data.uomPerMonth}"/>
		      </p:column>  
    		</p:dataTable> 
        </h:panelGrid>
        <p:outputPanel id="showServicePrice" columns="1" style="width:100%"
		   rendered="#{contractDetailsBackingBean.managedBean.selectedServiceItem!=null}">
		   <p:spacer height="20"/>
		   <p:dataTable id="servicePriceTable" var="data" value="#{contractDetailsBackingBean.managedBean.selectedItem.ctItemPrices}"
			 rowKey="#{data}">
			 <ac:paginator for="servicePriceTable"/>
			 <p:column headerText="Zone"><p:outputLabel value="#{data.ctContractZone.zoneName}" style="float:left;" /></p:column>                   
			 <p:column headerText="#{lbl['lbl.ct.item.table1.price.price']}" style="text-align: right;"><p:outputLabel value="#{data.unitPrice}"/></p:column>            
			 <p:column headerText="#{lbl['lbl.ct.item.table1.price.efdate']}">
				<p:calendar style="width:130px;" value="#{data.effDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true" />
			 </p:column>       
			 <p:column headerText="#{lbl['lbl.ct.item.table1.price.edate']}">
			   <p:calendar style="width:130px;" value="#{data.expDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"  />
			 </p:column>       
		</p:dataTable>
	  </p:outputPanel>
  	</p:panel>
	<p:panel header="Remarks" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.itemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		  		
 </ui:composition>
