<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"	
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<table style="width: 100%;">
		<tr>
			<td><p:commandButton value="#{lbl['lbl.btn.back']}"
					immediate="true" icon="ui-icon-back"
					rendered="#{amendmentBackingBean.managedBean.taskId==null}"
					action="#{amendmentBackingBean.backAction}" /></td>
			<td class="ppRightBtn"><ui:repeat var="outcome"
					value="#{amendmentBackingBean.managedBean.action}">
					<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(outcome)}" />
					<p:commandButton value="#{lbl[buttonLabel]}" ajax="false"
						styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(outcome)}"
						action="#{amendmentBackingBean.saveContractAmendment(outcome)}"
						rendered="#{!amendmentBackingBean.managedBean.memberSignOff and outcome != 'SUBMIT' and outcome != 'REJECT' and outcome != 'APPROVE'}" />
					<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
						icon="ui-icon-#{fn:toLowerCase(outcome)}" process="@form"
						update="@form,@([id$=messages])"
						actionListener="#{amendmentBackingBean.validateContractAmendment(outcome)}"
						action="#{amendmentBackingBean.disableUpdate}"
						oncomplete="if (args &amp;&amp; !args.validationFailed &amp;&amp; !args.epException) gpki_dlg.show(); "
						rendered="#{!amendmentBackingBean.managedBean.memberSignOff and (outcome == 'SUBMIT' or outcome == 'REJECT' or outcome == 'APPROVE')}" />
				</ui:repeat> <ac:gpkiPopup
					textBeforeSign="#{amendmentBackingBean.managedBean.textBeforeSign}"
					postSignAction="#{amendmentBackingBean.preSubmitContractAmendment(gpkiBackingBean.pmDigiSign)}" /></td>

		</tr>
	</table>
</ui:composition>
