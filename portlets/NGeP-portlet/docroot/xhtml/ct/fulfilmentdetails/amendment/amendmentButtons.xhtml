<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<style>
		.disciplinaryNotifyCss {
			font-family: Arial, Helvetica, sans-serif;
			font-size: 12px;
			font-weight: bold;
			color:#0000FF;
			height:32px;
			vertical-align: middle;
			margin: 10px;
			background-color:#CCE6FF;
		}
		.disciplinaryNotifyCssAlign {
			margin: 10px;
		}
	</style>
	
	<ac:gpkiPopup
			textBeforeSign="#{amendmentBackingBean.managedBean.textBeforeSign}"
			postSignAction="#{amendmentBackingBean.preSubmitContractAmendment(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{amendmentBackingBean.enableAutoUpdate()}" />
	<ac:spkiPopup
			password="#{amendmentBackingBean.managedBean.spkiBackingBean.password}"
			challengeAns1="#{amendmentBackingBean.managedBean.spkiBackingBean.challengeAns1}"
			challengeQues1="#{amendmentBackingBean.managedBean.spkiBackingBean.challengeQues1}"
			postSignAction="#{amendmentBackingBean.preSubmitContractAmendment(spkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{amendmentBackingBean.enableAutoUpdate()}" />

		<table style="width: 70%;">
			<tr>
				<td valign="top" class="disciplinaryNotifyCss">
					<div class="disciplinaryNotifyCssAlign">
					<h:outputText rendered="#{not empty amendmentBackingBean.managedBean.disciplinaryActionMsg}" 
					value="#{amendmentBackingBean.managedBean.disciplinaryActionMsg}"/>
						
					<p:commandLink onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
						rendered="#{not empty amendmentBackingBean.managedBean.disciplinaryActionMsg}"
						action="#{amendmentBackingBean.onViewDisciplinaryAction}" 
						process="@this" partialSubmit="true" update=":form">
						<u><h:outputText value="#{lbl['lbl.sm.disciplinary.here']}" style="color:blue;"/></u>
					</p:commandLink><p:spacer width="2"/>
						
					<h:outputText rendered="#{not empty amendmentBackingBean.managedBean.disciplinaryActionMsg}"
							value="#{lbl['lbl.sm.supplier.to.view.disc.action.details']}"/>
					</div>
				</td>
			</tr>
		</table>
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}"
						immediate="true" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						rendered="#{amendmentBackingBean.managedBean.taskId==null}"
						action="#{amendmentBackingBean.backAction}" /></td>
				<td class="ppRightBtn">
					<ui:decorate template="/xhtml/ct/shared/claim_template.xhtml">
					<ui:define name="outComeSection">
					 <ui:repeat
						var="outcome" value="#{amendmentBackingBean.managedBean.outComes}">
						<ui:param name="buttonLabel"
							value="lbl.btn.#{fn:toLowerCase(outcome)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							styleClass="ui-button"
							action="#{amendmentBackingBean.gpkiSignAction(outcome)}"
							rendered="#{!amendmentBackingBean.managedBean.memberSignOff and not amendmentBackingBean.isSupplierRole()
							and !amendmentBackingBean.managedBean.viewOnly}" />
						<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							styleClass="ui-button"
							action="#{amendmentBackingBean.gpkiSignAction(outcome)}"
							disabled="#{outcome eq BpmOutcomeConstant.bpmAcknowledge and !amendmentBackingBean.managedBean.allowAcknowledge}"
							rendered="#{!amendmentBackingBean.managedBean.memberSignOff and amendmentBackingBean.isSupplierRole()
							and !amendmentBackingBean.managedBean.viewOnly}" />
					</ui:repeat>
					</ui:define>
					</ui:decorate>
				</td>
			</tr>
		</table>
		
	<p:remoteCommand update=":form:panelHeaderException"
		actionListener="#{amendmentBackingBean.showCompleteButton}"
		name="showCompleteBtn" />
	<ac:disciplinaryActionHistory voList="#{amendmentBackingBean.managedBean.disciplineVOs}" />
</ui:composition>
