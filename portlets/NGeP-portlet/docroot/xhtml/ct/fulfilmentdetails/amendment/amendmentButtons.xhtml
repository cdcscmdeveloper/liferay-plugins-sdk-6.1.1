<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"	
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="btnPnl">
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}"
						immediate="true" 
						onstart="blockUIWidget.show();" 
						oncomplete="blockUIWidget.hide();"
						rendered="#{amendmentBackingBean.managedBean.taskId==null}"
						action="#{amendmentBackingBean.backAction}" /></td>
				<td class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.print']}" 
						styleClass="ui-button" update="btnPnl"
						onclick="printBtn.jq.click();"
						actionListener="#{amendmentBackingBean.showCompleteButton()}"
						rendered="#{amendmentBackingBean.managedBean.showPrintButton}" />						
					<p:commandButton value="#{lbl['lbl.btn.print']}" ajax="false" widgetVar="printBtn"
						styleClass="ui-button" style="display:none;" 
						action="#{amendmentBackingBean.downloadAll()}"  />
					<ui:repeat var="outcome"
						value="#{amendmentBackingBean.managedBean.action}">
						<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(outcome)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" update="@form" 
							onstart="blockUIWidget.show();" 
						  	oncomplete="blockUIWidget.hide();"
							styleClass="ui-button" 
							disabled="#{!amendmentBackingBean.managedBean.bpmActionFlag}"
							action="#{amendmentBackingBean.gpkiSignAction(outcome)}"
							rendered="#{!amendmentBackingBean.managedBean.memberSignOff}" />				
					</ui:repeat> <ac:gpkiPopup
						textBeforeSign="#{amendmentBackingBean.managedBean.textBeforeSign}"
						postSignAction="#{amendmentBackingBean.preSubmitContractAmendment(gpkiBackingBean.pmDigiSign)}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:remoteCommand update="btnPnl" actionListener="#{amendmentBackingBean.showCompleteButton}" name="showCompleteBtn" />
</ui:composition>
