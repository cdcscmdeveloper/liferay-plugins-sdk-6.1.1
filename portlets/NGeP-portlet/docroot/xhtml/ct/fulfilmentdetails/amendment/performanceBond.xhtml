<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="bondId" toggleable="true"  toggleSpeed="500" 
		rendered="#{ctBackingBean.managedBean.contractVer.ctContractAmount.bondReq 
			and !ctBackingBean.managedBean.directPurchase
			and !ctBackingBean.managedBean.contractVer.ctContractAmount.bondExempted}" >
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.performance.bond']}"/>
			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.dtls']}"/>
	   	</f:facet>
	   		<f:verbatim />
			 <h:commandLink value="#{lbl['lbl.ct.sample.bond.letter']}" style="float:left;"
				styleClass="blue_font"
				action="#{amendmentBackingBean.downloadSampleBondLetter()}">
			</h:commandLink>
	   	<p:spacer width="2" />
	   	<h:panelGrid columns="2">
	   		<p:outputLabel id="contractPeriodBondId" value="#{lbl['lbl.ct.bond.contractperiod']}" />
			<p:inputText for="contractPeriodBondId" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
	  			value="#{ctBackingBean.calculateBondPeriod()}"  disabled="true">
		 	</p:inputText>
			
			<p:outputLabel id="overallContractAmountBondId" value="#{lbl['lbl.ct.bond.overallamount']}" />
			<p:inputText for="overallContractAmountBondId" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
	  			value="#{ctBackingBean.managedBean.contractVer.ctContract.loa.loaAmt}"  disabled="true">
		 		<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>
	   	
	   		<p:outputLabel id="bondPercentageBondId" value="#{lbl['lbl.ct.bond.bondpercentage']}" />
			<p:inputText for="bondPercentageBondId" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
	  			value="#{ctBackingBean.managedBean.contractVer.ctContract.loa.bondPercentage}"  disabled="true">
		 		<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>
			
			<p:outputLabel id="bondAmountBondId" value="#{lbl['lbl.ct.bond.bondamount']}" />
			<p:inputText for="bondAmountBondId" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
	  			value="#{ctBackingBean.managedBean.contractVer.ctContract.loa.bondAmt}"  disabled="true">
		 		<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>
			<p:outputLabel />
			<p:inputTextarea autoResize="false" disabled="true" rows="4" 
				style="width:200px;margin-bottom:5px;"
			   	value="#{ctBackingBean.getBondAmountInText()}" />
		</h:panelGrid>
		
		<p:spacer width="1" />	
        <p:dataTable  id="tableBond" var="varBond" 
           value="#{ctBackingBean.managedBean.contractVer.ctContractAmount.ctPerformanceBonds}"> 
	      <ac:paginator for="tableBond" />
	      			<p:column style="width:2%;"  rendered="#{!ctBackingBean.managedBean.viewContract
				and ctBackingBean.managedBean.ctContractAmount.bondReq}">
				<f:facet name="header">
					<p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.selectAll}">
					<p:ajax partialSubmit="true" process="@this"
						update=":form:tableBond" listener="#{ctBackingBean.selectAllBond}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{varBond.selectedCheckBox}" styleClass="myCustomChekBox">
					<p:ajax event="change"  update="@this, :form:tableBond" listener="#{ctBackingBean.selectOnePerformanceCheckboxSelect}" />
				</p:selectBooleanCheckbox>
			</p:column> 
         
            <p:column headerText="#{lbl['lbl.ct.ref.no']}"   style="width:10%;" styleClass="column-align-center">
                <p:inputText value="#{varBond.refNo}" style="width:70px;" disabled="true"/>
            </p:column>	
         
            <p:column headerText="#{lbl['lbl.ct.financial.inst']}"  style="width:25%;" styleClass="column-align-center">
                <p:inputText value="#{varBond.financialOrgName}" style="width:180px;" disabled="true"/>
            </p:column>	
         
            <p:column headerText="#{lbl['lbl.ct.amount']}" style="width:10%;" styleClass="column-align-center">
                  <p:inputText value="#{varBond.bondAmount}" styleClass="ppRightBtn" style="width:70px;"  disabled="true" >
                      <f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText>
             </p:column>	
         
            <p:column headerText="#{lbl['lbl.ct.effective.date']}" style="width:10%;" styleClass="column-align-center" > 
			  	 <p:inputText value="#{varBond.effDate}" style="width:100px;"  disabled="true" >
                      <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
            </p:column>	
           
            <p:column headerText="#{lbl['lbl.ct.expiry.date']}"  style="width:10%;" styleClass="column-align-center"> 
                <p:inputText value="#{varBond.expDate}" style="width:100px;"  disabled="true" >
                      <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
            </p:column>	
           
            <p:column styleClass="column-align-center" headerText="#{lbl['lbl.txt.attachment']}"  style="width:25%;">
               <h:panelGroup id="uploadBondPg">
					<h:commandLink styleClass="blue_font"
						title="#{varBond.fileName}"
						value="#{amendmentBackingBean.getShortFileName(varBond.fileName)}"
						rendered="#{varBond.filePath != null}" style="float:left;"
						action="#{ctBackingBean.commonDownload(varBond.filePath, varBond.fileName)}" />
				</h:panelGroup> 
			</p:column>
	    
	    </p:dataTable>
  </p:panel>
</ui:composition>
