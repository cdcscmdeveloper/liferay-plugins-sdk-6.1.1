<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="bondId" toggleable="true"  toggleSpeed="500" 
		rendered="#{ctBackingBean.managedBean.contractVer.ctContractAmount.bondReq 
			and !ctBackingBean.managedBean.directPurchase
			and !ctBackingBean.managedBean.contractVer.ctContractAmount.bondExempted}" >
        <f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.performance.bond']}"/>
	        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.dtls']}"/>
	  	</f:facet>	  	
	   	<h:panelGrid columns="2">
		  	<p:outputLabel id="bondAmount" value="#{lbl['lbl.ct.pb.amount']}" />
			<p:inputText for="bondAmount" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
	  				value="#{ctBackingBean.managedBean.ctContractAmount.totalBondAmt}"  disabled="true">
	   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>
		</h:panelGrid>
        <p:dataTable  id="tableBond" var="varBond" 
           value="#{ctBackingBean.managedBean.contractVer.ctContractAmount.ctPerformanceBonds}"> 
	      <ac:paginator for="tableBond" />
         
            <p:column headerText="#{lbl['lbl.ct.ref.no']}"   style="width:10%;" styleClass="column-align-center">
                <p:inputText value="#{varBond.refNo}" style="width:70px;" disabled="true"/>
            </p:column>	
         
            <p:column headerText="#{lbl['lbl.ct.financial.inst']}"  style="width:25%;" styleClass="column-align-center">
                <p:selectOneMenu id="orgName" value="#{varBond.financialOrg.financialOrgId}" style="width:180px;" disabled="true">
                     <f:selectItems value="#{amendmentBackingBean.retrieveFinancialOrgList()}"/>
                </p:selectOneMenu>
            </p:column>	
         
            <p:column headerText="#{lbl['lbl.ct.amount']}" style="width:10%;" styleClass="column-align-center">
                  <p:inputText value="#{varBond.bondAmount}" styleClass="ppRightBtn" style="width:70px;"  disabled="true" >
                      <f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText>
             </p:column>	
         
            <p:column headerText="#{lbl['lbl.ct.effective.date']}" style="width:10%;" styleClass="column-align-center" > 
			  	 <p:inputText value="#{varBond.effDate}" style="width:100px;"  disabled="true" >
                      <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
            </p:column>	
           
            <p:column headerText="#{lbl['lbl.ct.expiry.date']}"  style="width:10%;" styleClass="column-align-center"> 
                <p:inputText value="#{varBond.expDate}" style="width:100px;"  disabled="true" >
                      <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></p:inputText>
            </p:column>	
           
            <p:column styleClass="column-align-center" headerText="#{lbl['lbl.txt.attachment']}"  style="width:25%;">
               <h:panelGroup id="uploadBondPg">
					<h:commandLink styleClass="blue_font"
						title="#{varBond.fileName}"
						value="#{amendmentBackingBean.getShortFileName(varBond.fileName)}"
						rendered="#{varBond.filePath != null}" style="float:left;"
						action="#{ctBackingBean.downloadFile(varBond.filePath, varBond.fileName)}" />
				</h:panelGroup> 
			</p:column>
	    
	    </p:dataTable>
  </p:panel>
</ui:composition>
