<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="meetingPanel" header="Meeting Details" toggleable="true"  toggleSpeed="500">
      <p:dataTable id="meetingTable" var="data" value=" " paginator="true" 
            paginatorPosition="bottom" paginatorAlwaysVisible="true"  emptyMessage="No Records!">
             <ac:paginator for="meetingTable" />
            
               <p:columnGroup type="header"> 
			  <p:row> 
				 <p:column style="width:200px;" headerText="Meeting Date" /> 
				 <p:column style="width:450px;" headerText="Location"  /> 
				 <p:column style="width:100px;" headerText="Action" /> 	
			  </p:row>							
			 </p:columnGroup>
        </p:dataTable>
      	</p:panel>
      <p:panel id="committePanel" header="Committe Member" toggleable="true"  toggleSpeed="500">
      <p:dataTable id="committeTable" var="data" value=" " paginator="true" 
       paginatorPosition="bottom" paginatorAlwaysVisible="true"  emptyMessage="No Records!">
            <ac:paginator for="committeTable" />
            <p:columnGroup type="header"> 
			  <p:row> 
				 <p:column style="width:375px;" headerText="Name" /> 
				 <p:column style="width:375px;" headerText="Role"  /> 
			  </p:row>							
			 </p:columnGroup>
            </p:dataTable>
      	</p:panel>
</ui:composition>
