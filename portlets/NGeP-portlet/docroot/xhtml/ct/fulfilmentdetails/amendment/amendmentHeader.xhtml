<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<div align="left" class="header-info">
	   <table style="width: 100%">
			<tr>
				<td style="width: 15%">
					<h:outputLabel value="#{lbl['lbl.ct.contract.no']}" />
				</td>
				<td style="width: 15%" class="header-info-text">
					#{amendmentBackingBean.managedBean.ctContract.contractNo}
				</td>
				<td style="width: 15%">
					<h:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
				</td>
				<td style="width: 25%" class="header-info-text">
					#{amendmentBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}
				</td>
				<td style="width: 10%">
					<h:outputLabel value="#{lbl['lbl.ct.cc.status']}" />
				</td>
				<td style="width: 20%" class="header-info-text">
					#{amendmentBackingBean.getStatusDescById(amendmentBackingBean.managedBean.contractVer.status.statusId)}
				</td>
			</tr>
		</table>
	</div>
</ui:composition>
