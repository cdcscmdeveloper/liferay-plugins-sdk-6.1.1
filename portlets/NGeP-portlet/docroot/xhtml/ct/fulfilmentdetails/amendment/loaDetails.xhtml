<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="panelLOA" header="LOA DETAILS" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:75%" columnClasses="columnWidth30">
			<p:outputLabel value="File No" />
			<h:panelGrid columns="3">
				<p:inputText style="width:170px;" disabled="true"
					value="#{amendmentBackingBean.managedBean.ctContract.quotationTender.fileNo}"  />
				<p:spacer width="2" />
				<p:inputText style="width:10px;"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.fileExtNo}" />
			</h:panelGrid>
			<p:outputLabel value="Required Insurance / Warranty" />
			<h:panelGrid columns="4">
				<p:selectOneRadio id="radiOptions" required="true" disabled="true"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.insWarrantyReq}">
					<f:selectItem itemLabel="Yes" itemValue="true" />
					<f:selectItem itemLabel="No" itemValue="false" />
				</p:selectOneRadio>
			</h:panelGrid>
			<p:outputLabel value="Contract Type" />
			<p:inputText style="width:170px;" disabled="true"
				value="#{amendmentBackingBean.getParameterDesc(amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractType)}" />				
			<p:outputLabel value="Agency" />
			<p:inputText style="width:170px;" disabled="true" rendered="#{amendmentBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}"
				value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.pmOrgProfile.orgName}" />
			<p:inputText style="width:170px;" disabled="true" rendered="#{amendmentBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral}"
				value="#{amendmentBackingBean.getParameterDesc(amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.pmParameter)}" />				
			<p:outputLabel value="Contract Adminstrator" />
			<p:inputText style="width:170px;" disabled="true"
				value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractAdmin.userName}" />				
			<p:outputLabel value="Completion/Contract Period" />
			<h:panelGrid columns="3">
				<p:inputText style="width:70px;" disabled="true"
					value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.contractPeriod}" />
				<p:spacer width="2" />
				<p:outputLabel value="months" />
			</h:panelGrid>
			<p:outputLabel value="Completion/Contract Effective Date" />
			<p:calendar value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractEffDate}"
				id="popupButtonCal1" showOn="button" size="10" disabled="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			<p:outputLabel value="Completion/Contract Expiry Date" />
			<p:calendar	value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractExpDate}"
				id="popupButtonCal2" showOn="button" size="10" disabled="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			<p:outputLabel value="Amendment Effective Date" />
			<p:calendar	value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentEffDate}"
				id="popupButtonCal3" showOn="button" size="10" disabled="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			<p:outputLabel value="Extension Period" />
			<h:panelGrid columns="3">
				<p:inputText style="width:70px;"  disabled="true"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.extendPeriod}" />
				<p:spacer width="2" />
				<p:outputLabel value="months" />
			</h:panelGrid>
			<p:outputLabel value="Extension Effective Date" />
			<h:panelGrid columns="3" style="width:100%"	columnClasses="columnWidth20,columnWidth30,columnWidth30">
				<p:calendar value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.extendStartDate}"
					id="popupButtonCal4" showOn="button" size="10"  disabled="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				<h:outputLabel value="Extension Expiry Date" />
				<p:calendar value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.extendEndDate}"
					id="popupButtonCal5" showOn="button" size="10" disabled="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
	<p:panel id="contractSigner" header="Contract Signer" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:75%" columnClasses="columnWidth30">
			<p:outputLabel value="Contract Signer" />
			<p:selectOneMenu id="signer" style="width:200px" value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractSigner.userId}">
				<f:selectItems value="#{amendmentBackingBean.getcontractSignerDropdown()}" />
			</p:selectOneMenu>
		</h:panelGrid>
	</p:panel>
</ui:composition>
