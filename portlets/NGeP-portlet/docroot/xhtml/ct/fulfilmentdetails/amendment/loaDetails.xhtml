<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<style>
	   .calanderWidth input {
	       width:75px;margin-bottom: 5px;
	   }
	    .calanderWidth1 input {
	       width:200px;margin-bottom: 5px;
	   }
	   
	    .calanderWidth2 input {
	       width:120px;margin-bottom: 5px;
	   }
	</style>
	<p:panel id="panelLOA" header="#{lbl['lbl.ct.menu.loa.details']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="2" columnClasses="columnWidth225">
			<p:outputLabel value="#{lbl['lbl.ct.file.no']}" styleClass="required" />
			<h:panelGrid columns="3">
				<p:inputText style="width:250px;" disabled="#{amendmentBackingBean.managedBean.disableFinalAmendDetails}"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.scLoiLoa.fileNo}" maxlength="50"
					required="true" label="#{lbl['lbl.ct.file.no']}"  />
				<p:spacer width="2" />
				<p:inputText style="width:36px;" disabled="#{amendmentBackingBean.managedBean.disableFinalAmendDetails}"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.fileExtNo}" maxlength="5" 
					 required="true" label="#{lbl['lbl.ct.file.no']}"/>
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.insurance.warranty']}" />
			<h:panelGrid columns="4">
				<p:selectOneRadio id="radiOptionsWarenty" required="true" disabled="true"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.insWarrantyReq}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="true" />
					<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="false" />
				</p:selectOneRadio>
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.contract.type']}" />
			<p:inputText style="width:300px;" disabled="true"
				value="#{amendmentBackingBean.getParameterDesc(ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractType)}" />				
			<p:outputLabel value="#{lbl['lbl.ct.menu.agency']}" />
			<p:inputTextarea rows="2"  autoResize="false" style="width:300px; margin-bottom: 5px;" disabled="true" 
			   rendered="#{ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}"
				value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.pmOrgProfile.orgName}" />
			<p:inputText style="width:300px;" disabled="true" rendered="#{ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral}"
				value="#{amendmentBackingBean.getParameterDesc(ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.pmParameter)}" />				
			<p:outputLabel value="#{lbl['lbl.ct.contract.admin']}" />
			<p:inputText style="width:300px;" disabled="true"
				value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractAdmin.userName}" />				
			<p:outputLabel value="#{lbl['lbl.ct.contract.period']}" />
			<h:panelGrid columns="3">
				<p:inputText style="width:75px;" disabled="true"
					value="#{ctBackingBean.managedBean.contractVer.ctContractValue.contractPeriod}" />
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.months']}" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.contract.effective.date']}" />
			<p:calendar id="popupButtonCal1" showOn="button" styleClass="calanderWidth" disabled="true"
			    	pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
			        value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractEffDate}"/>
			<p:outputLabel value="#{lbl['lbl.ct.contract.expiry.date']}" />
			<p:calendar id="popupButtonCal2" showOn="button"  disabled="true"  styleClass="calanderWidth"
			    pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
			    value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractExpDate}" />
			<p:outputLabel value="#{lbl['lbl.ct.amend.effective.date']}" />
			<p:calendar id="popupButtonCal3" showOn="button" disabled="true" styleClass="calanderWidth"
			     value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentEffDate}"
		         pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			<p:outputLabel value="#{lbl['lbl.ct.extension.period']}" />
			<h:panelGrid columns="3">
				<p:inputText style="width:75px;"  disabled="true"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.extendPeriod}" />
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.months']}" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.extension.effective.date']}" />
			<h:panelGrid columns="3" style="width:500px;"	columnClasses="columnWidth20,columnWidth30,columnWidth30">
				<p:calendar id="popupButtonCal4" showOn="button" disabled="true" styleClass="calanderWidth1"
				    value="#{ctBackingBean.managedBean.contractVer.ctAmendment.extendStartDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				<p:outputLabel value="#{lbl['lbl.ct.extension.expiry.date']}" />
				<p:calendar id="popupButtonCal5" showOn="button"  disabled="true" styleClass="calanderWidth2"
				    value="#{ctBackingBean.managedBean.contractVer.ctAmendment.extendEndDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.required.agreement']}" />			
			<h:panelGrid columns="4">
				<p:selectOneRadio id="reqAgreement" disabled="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.agreementReq
				 	or amendmentBackingBean.managedBean.disableFinalAmendDetails}"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.agreementReq}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="true" />
					<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="false" />
				</p:selectOneRadio>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
	<p:panel id="contractSigner" toggleable="true" toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.loa.signer']}"/>
	        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.signer']}"/>
	  	</f:facet>
		<h:panelGrid columns="2" columnClasses="columnWidth225">
			    <p:outputLabel value="#{lbl['lbl.ct.loa.signer']}"  styleClass="required"/>
			<h:panelGrid columns="2">
			   <p:selectOneMenu id="signer" style="width:310px; margin-bottom:5px" label="#{lbl['lbl.ct.loa.signer']}"
			        disabled="#{amendmentBackingBean.managedBean.disableFinalAmendDetails}"
			       value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractSigner.userId}">
				   <f:selectItems value="#{amendmentBackingBean.getContractSignerDropdown()}" />
				   <p:ajax event="change" partialSubmit="true" process="@this" update="@this signerDesignation" 
				   	listener="#{amendmentBackingBean.contractSignerChange()}" />
		     	</p:selectOneMenu>
		         <p:message for="signer" display="icon"/>
		     </h:panelGrid>
		     <p:outputLabel value="#{lbl['lbl.ct.signer.designation']}"  styleClass="required"/>
			<h:panelGrid columns="2">
			   	<p:inputText id="signerDesignation"
						disabled="#{amendmentBackingBean.managedBean.disableFinalAmendDetails}"
						maxlength="100"
						value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.loaSignerDesig}"
						label="#{lbl['lbl.ct.signer.designation']}" required="true"
						style="width:250px">
					</p:inputText>
		         <p:message for="signerDesignation" display="icon"/>
		     </h:panelGrid>
		</h:panelGrid>
	</p:panel>
	<p:panel id="loaVerifier" header="#{lbl['lbl.ct.panel.loa.verifier']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:80%" columnClasses="columnWidth225">
		    <p:outputLabel value="#{lbl['lbl.ct.panel.loa.verifier']}" />
			<p:inputText style="width:300px;" disabled="true"
				value="#{amendmentBackingBean.managedBean.approverName}" />
			<p:outputLabel value="#{lbl['lbl.ct.required.loa.verifier']}" />			
			<h:panelGrid columns="4">
				<p:selectOneRadio id="reqLoaVerifier" disabled="#{amendmentBackingBean.managedBean.disableFinalAmendDetails or
					amendmentBackingBean.managedBean.disableEndorseAmendDetails}"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.approvalReq}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="true" />
					<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="false" />
				</p:selectOneRadio>
			</h:panelGrid>			
		</h:panelGrid>
	</p:panel>
</ui:composition>
