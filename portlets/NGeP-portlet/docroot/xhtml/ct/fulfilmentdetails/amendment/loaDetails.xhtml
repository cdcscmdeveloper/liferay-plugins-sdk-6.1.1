<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<style>
	   .calanderWidth input {
	       width:75px;margin-bottom: 5px;
	   }
	    .calanderWidth1 input {
	       width:170px;margin-bottom: 5px;
	   }
	</style>
	<p:panel id="panelLOA" header="#{lbl['lbl.ct.menu.loa.details']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:75%" columnClasses="columnWidth30">
			<p:outputLabel value="#{lbl['lbl.ct.file.no']}" />
			<h:panelGrid columns="3">
				<p:inputText style="width:170px;" disabled="true"
					value="#{amendmentBackingBean.managedBean.ctContract.quotationTender.fileNo}"  />
				<p:spacer width="2" />
				<p:inputText style="width:20px;"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.fileExtNo}" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.insurance.warranty']}" />
			<h:panelGrid columns="4">
				<p:selectOneRadio id="radiOptions" required="true" disabled="true"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.insWarrantyReq}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="true" />
					<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="false" />
				</p:selectOneRadio>
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.contract.type']}" />
			<p:inputText style="width:170px;" disabled="true"
				value="#{amendmentBackingBean.getParameterDesc(amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractType)}" />				
			<p:outputLabel value="#{lbl['lbl.ct.menu.agency']}" />
			<p:inputText style="width:170px;" disabled="true" rendered="#{amendmentBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}"
				value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.pmOrgProfile.orgName}" />
			<p:inputText style="width:170px;" disabled="true" rendered="#{amendmentBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral}"
				value="#{amendmentBackingBean.getParameterDesc(amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.pmParameter)}" />				
			<p:outputLabel value="#{lbl['lbl.ct.contract.admin']}" />
			<p:inputText style="width:170px;" disabled="true"
				value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractAdmin.userName}" />				
			<p:outputLabel value="#{lbl['lbl.ct.contract.period']}" />
			<h:panelGrid columns="3">
				<p:inputText style="width:75px;" disabled="true"
					value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.contractPeriod}" />
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.months']}" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.contract.effective.date']}" />
			<p:calendar id="popupButtonCal1" showOn="button" styleClass="calanderWidth" disabled="true"
			    	pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
			        value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractEffDate}"/>
			<p:outputLabel value="#{lbl['lbl.ct.contract.expiry.date']}" />
			<p:calendar id="popupButtonCal2" showOn="button"  disabled="true"  styleClass="calanderWidth"
			    pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
			    value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractExpDate}" />
			<p:outputLabel value="#{lbl['lbl.ct.amend.effective.date']}" />
			<p:calendar id="popupButtonCal3" showOn="button" disabled="true" styleClass="calanderWidth"
			     value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentEffDate}"
		         pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			<p:outputLabel value="#{lbl['lbl.ct.extension.period']}" />
			<h:panelGrid columns="3">
				<p:inputText style="width:75px;"  disabled="true"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.extendPeriod}" />
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.months']}" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.extension.effective.date']}" />
			<h:panelGrid columns="3" style="width:100%"	columnClasses="columnWidth20,columnWidth30,columnWidth30">
				<p:calendar id="popupButtonCal4" showOn="button" disabled="true" styleClass="calanderWidth1"
				    value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.extendStartDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				<h:outputLabel value="#{lbl['lbl.ct.extension.expiry.date']}" />
				<p:calendar id="popupButtonCal5" showOn="button"  disabled="true" styleClass="calanderWidth1"
				    value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.extendEndDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
	<p:panel id="contractSigner" toggleable="true" toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.contract.signer']}"/>
	        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.signer']}"/>
	  	</f:facet>
		<h:panelGrid columns="2" style="width:75%" columnClasses="columnWidth30">
		    <h:panelGrid columns="2" style="float:right;">
			    <p:outputLabel value="*" styleClass="mandatory" />
			    <p:outputLabel value="#{lbl['lbl.ct.contract.signer']}" />
			</h:panelGrid>
			<h:panelGrid columns="2">
			   <p:selectOneMenu id="signer" style="width:180px" required="true" label="#{lbl['lbl.ct.contract.signer']}"
			       value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.contractSigner.userId}">
				   <f:selectItems value="#{amendmentBackingBean.getcontractSignerDropdown()}" />
		     	</p:selectOneMenu>
		         <p:message for="signer" display="icon"/>
		     </h:panelGrid>
		</h:panelGrid>
	</p:panel>
</ui:composition>
