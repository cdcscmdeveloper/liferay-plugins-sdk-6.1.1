<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<style>
		.zoneDataTable.ui-treetable tbody td {
		    border: none !important;
		} 
	</style>
	<p:panel toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.zone']}"/>
	        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.zone.dtls']}"/>
	  	</f:facet>
		<h:panelGrid columns="3">
			<p:outputLabel value="#{lbl['lbl.ct.location.level']}" />
			<p:outputLabel value=": " />
			<p:outputLabel value="#{amendmentBackingBean.getParameterDesc(ctBackingBean.managedBean.contractVer.ctContract.locationLevel)}" />
		</h:panelGrid>
		<h:panelGrid width="100%" style="margin-top:20px">
 		  <p:treeTable id="zoneLocationDataTable" class="zoneDataTable"
 		      value="#{amendmentBackingBean.managedBean.ctZoneTrees}" var="zoneTree">
 		    <p:column style="width:70%;" styleClass="column-align-center" >
            <f:facet name="header">#{lbl['lbl.ct.location.name']}</f:facet>
              <p:treeNode type="zone">
                  <h:outputText value="#{zoneTree.zone}" style="float:left"/>
              </p:treeNode>
              <p:treeNode type="state">
               <h:outputText value="#{zoneTree.state.stateName}"  style="float:left" />
              </p:treeNode>
              <p:treeNode type="district">
               <h:outputText value="#{zoneTree.district.districtName}" style="float:left" />
              </p:treeNode>
        </p:column>
        <p:column style="width:30%;" styleClass="column-align-center">
            <f:facet name="header"><h:outputText value="*" styleClass="mandatory" />
            	#{lbl['lbl.ct.delivery.term']}
            	<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.delivery.term']}"/>
            </f:facet>
             <p:treeNode type="zone">
             	<h:panelGrid columns="2" style="width:30%;" styleClass="zone-tree-node">
	                <p:inputText value="#{zoneTree.deliveryTerm}" disabled="true" rendered="#{zoneTree.zone != null}"  style="width:40px;" />
	                <h:outputText rendered="#{zoneTree.zone != null}" value="#{lbl['lbl.ct.days']}" />
	                <p:selectOneMenu id="dTerms" value="#{zoneTree.uomId}" disabled="true" rendered="#{false and zoneTree.zone != null}"  style="width:80px;" >
				       <f:selectItems value="#{amendmentBackingBean.getDropdownValues(ParameterTypeConst.deliveryTerm)}" />
				    </p:selectOneMenu>
			    </h:panelGrid>
             </p:treeNode>
        </p:column>
      </p:treeTable>
 	 </h:panelGrid>
	</p:panel>
</ui:composition>
