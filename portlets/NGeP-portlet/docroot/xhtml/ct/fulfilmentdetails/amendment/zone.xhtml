<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="Zone Details" toggleable="true">
		<table style="width: 100%">
		  <tr>
			  <td style="width: 94px"><p:outputLabel value="Location Level" /></td>
			  <td><p:selectOneMenu id="locLevels" style="width: 178px;margin-bottom: 5px;" disabled="true"
			        value="#{amendmentBackingBean.managedBean.supplierLocation}">
                    <f:selectItems
						value="#{amendmentBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
					    <p:ajax event="change" listener="#{amendmentBackingBean.selectLocation}"></p:ajax>
				  </p:selectOneMenu></td>
			  </tr>
		  </table>
 		 <h:panelGrid width="100%" style="margin-top:20px">
 		  <p:treeTable id="zoneLocationDataTable"  value="#{amendmentBackingBean.managedBean.ctZoneTrees}"
 		    var="zoneTree">
 		    
 		    <p:column style="width:70%;">
            <f:facet name="header">  Location Name </f:facet>
              <p:treeNode type="zone">
                  <h:outputText value="#{zoneTree.zone}"/>
              </p:treeNode>
              <p:treeNode type="state">
               <h:outputText value="#{zoneTree.state.stateName}"  />
              </p:treeNode>
              <p:treeNode type="district">
               <h:outputText value="#{zoneTree.district.districtName}"  />
              </p:treeNode>
               
              
        </p:column>
 
        <p:column style="width:30%;">
            <f:facet name="header"> * Delivery Term </f:facet>
             <p:treeNode type="zone">
                <p:inputText value="#{zoneTree.deliveryTerm}" disabled="true" rendered="#{zoneTree.zone != null}"  style="width:40px;" />
                <p:spacer width="2" />
                <p:selectOneMenu id="dTerms" value="#{zoneTree.uomId}" disabled="true" rendered="#{zoneTree.zone != null}"  style="width:100px;" >
			       <f:selectItems value="#{amendmentBackingBean.getDropdownValues(ParameterTypeConst.deliveryTerm)}" />
			    </p:selectOneMenu>
             </p:treeNode>
        </p:column>
      </p:treeTable>
 	 </h:panelGrid>
	</p:panel>
</ui:composition>
