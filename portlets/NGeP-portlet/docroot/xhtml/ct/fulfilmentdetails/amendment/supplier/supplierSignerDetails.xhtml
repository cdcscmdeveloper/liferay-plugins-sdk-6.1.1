<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="signerDetails" header="#{lbl['lbl.ct.panel.supplier.signer']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="2"  columnClasses="columnWidth225">
			<p:outputLabel value="#{lbl['lbl.ct.business.name']}" />
			<p:inputText style="width:300px;" disabled="true"
				value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierName}" />			
			
			<p:outputLabel value="#{lbl['lbl.ct.signed.by']}" />
			<h:panelGrid columns="2">
				<!-- #30453 start -->
				<p:inputText style="width:300px;" disabled="true"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.ackBy.salutationCode.salutationName.concat(' ').concat(ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.ackBy.userName)}" />
				<!-- #30453 end -->	
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.supplier.signed.by']}"/>
			</h:panelGrid>			
			        
			<p:outputLabel value="#{lbl['lbl.ct.ic.no']}" />
        	<p:inputText  style="width:300px;" disabled="true"
				value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.ackBy.identificationNo}" />
			
			<p:outputLabel value="#{lbl['lbl.ct.designation']}" />
			<p:inputText style="width:300px;" disabled="true"
				value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.ackBy.designation}" />
		</h:panelGrid>
	</p:panel>
</ui:composition>
