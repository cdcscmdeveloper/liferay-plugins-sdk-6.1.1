<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	 <p:panel id="paymentDetails" header="PAYMENTS DETAILS" toggleable="true" toggleSpeed="500"
	 	rendered="#{amendmentBackingBean.managedBean.ackFA == 'Ack'}" >
		<h:panelGrid columns="2" style="width:75%" columnClasses="columnWidth30">
		  <h:panelGrid columns="2" style="float:right;">
			 <p:outputLabel value="*" styleClass="mandatory" />
			 <p:outputLabel value="Account No"/>
		 </h:panelGrid>
		<h:panelGrid columns="2">
		   <p:selectOneMenu id="accountNo"  style="width:180px; margin-bottom: 5px;" required="true" label="Account No"
			 value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.bankAccountNo}">
			   <f:selectItem itemLabel="-Select One-" itemValue=""/>
			   <f:selectItems value="#{amendmentBackingBean.populateBankAccountList}"/>
			    <p:ajax event="change" process="@this" update="paymentDetails" listener="#{amendmentBackingBean.changeAccountActionListener}"/>
		     </p:selectOneMenu>
		     <p:message for="accountNo" display="icon"/>
		  </h:panelGrid>
		   <p:outputLabel value="Bank Name"/>
		   <p:inputText style="width:170px;" disabled="true"
			    value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.bankName}"/>
			<p:outputLabel value="Bank Branch"/>
			<p:inputText style="width:170px;" disabled="true"
			   value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.bankBranch}"/>
			 <h:panelGroup>
            <div style="height: 70px; vertical-align:top;">
                <p:outputLabel for="payBankAddress" value="Bank Address" />
            </div>
           </h:panelGroup>
           <h:panelGrid>
             <p:inputTextarea id="payBankAddress" disabled="true"  rows="4" 
               maxlength="200"  autoResize="false" style="width:170px;margin-bottom: 5px;" 
                value="#{amendmentBackingBean.getFullAddress(amendmentBackingBean.managedBean.contractVer.ctContractValue.bankAddress)}"/>
           </h:panelGrid>
		</h:panelGrid>
	</p:panel>	
</ui:composition>
