<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	 <p:panel id="paymentDetails" header="PAYMENTS DETAILS" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:75%" columnClasses="columnWidth30">
			<p:outputLabel value="Account No"/>
			<p:selectOneMenu style="width:180px;margin-bottom: 5px;" >
			   <f:selectItem itemLabel="--" itemValue=""/>
			</p:selectOneMenu>
			<p:outputLabel value="Bank Name"/>
			<p:inputText style="width:170px;"/>
			<p:outputLabel value="Bank Branch"/>
			<p:inputText style="width:170px;"/>
			 <h:panelGroup>
            <div style="height: 90px; vertical-align:top;">
                <p:outputLabel for="payBankAddress" value="Bank Address " />
            </div>
           </h:panelGroup>
           <h:panelGrid>
             <p:inputTextarea id="payBankAddress" disabled="true"
                rows="4" cols="31"   maxlength="200"  autoResize="false" style="margin-bottom: 5px;" />
           </h:panelGrid>
		</h:panelGrid>
	</p:panel>	
</ui:composition>
