<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" >
	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.attachment']}" escape="false"/><br/><br/>
	<table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="14%"><h:outputLabel
					value="#{lbl['lbl.txt.attachment']}" /></td>
			<td class="TableFieldRight"><p:commandButton
					oncomplete="uploadDisciplinaryAttachmentDlg.show();return false;"
					value="#{lbl['lbl.txt.attach.files']}"
					update="lampiranDisciplinary, uploadDisciplinaryAttachmentDlg" immediate="true" /></td>
		</tr>
		<tr>
			<td />
			<td><p:dataGrid id="lampiranDisciplinary"
					value="#{ctBackingBean.managedBean.contractVer.disciplinaryActionAttachments}"
					var="attachFile" rowIndexVar="attachFileIndex" columns="1"
					style="width:100%"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
					<table>
						<tr>
							<td rowspan="2"><h:graphicImage
									value="/css/images/design/#{ctBackingBean.determineIcon(attachFile)}"
									height="30" width="30" /></td>
							<td width="5"></td>
							<td><h:outputText
									value=" #{attachFile.createdUser.userName}"></h:outputText>, <h:outputText
									value="#{attachFile.createdDate}">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
								</h:outputText></td>
						</tr>
						<tr>
							<td></td>
							<td><h:commandLink value="#{attachFile.fileName}"
									styleClass="blue_font"
									action="#{ctBackingBean.downloadFile(attachFile)}" /> <p:commandLink
									onsuccess="deleteDisciplinaryAttachmetnDlg.show();"
									action="#{ctBackingBean.setAttachFileIndex(attachFileIndex)}">
									<h:graphicImage value="/css/images/design/icon_trash.png"
										styleClass="tasklist_title1" />
								</p:commandLink></td>
						</tr>
					</table>
				</p:dataGrid></td>
		</tr>
	</table>

	<p:dialog id="uploadDisciplinaryAttachmentDlg" widgetVar="uploadDisciplinaryAttachmentDlg"
		resizable="false" modal="true" width="700px" height="350px"
		styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{ctBackingBean.fileUpload}"
			mode="advanced" id="disciplinaryAttachmentId" multiple="true"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}"
			label="#{lbl['lbl.btn.choose']}"
			uploadLabel="#{lbl['lbl.btn.upload.all']}"
			cancelLabel="#{lbl['lbl.btn.remove.all']}" update="lampiranDisciplinary">
		</p:fileUpload>

		<f:facet name="footer">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.close']}" type="button"
					ajax="false" onclick="uploadDisciplinaryAttachmentDlg.hide();" />
			</div>
		</f:facet>
	</p:dialog>

	<p:confirmDialog id="deleteDisciplinaryAttachmetnDlg" widgetVar="deleteDisciplinaryAttachmetnDlg"
		message="#{lbl['lbl.msg.confirm.delete']}" severity="alert"
		closable="true" appendToBody="true"
		header="#{lbl['lbl.msg.confirm.delete.header']}">
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" process="@this"
				partialSubmit="true" update=":form:lampiranDisciplinary"
				action="#{ctBackingBean.deleteDisciplinaryAttachmentAction(ctBackingBean.managedBean.attachFileIndex)}"
				oncomplete="deleteDisciplinaryAttachmetnDlg.hide();" 
				id = "disciplinaryAttachmentIdDelete"/>
			<p:commandButton value="#{lbl['lbl.btn.no']}"
				onclick="deleteDisciplinaryAttachmetnDlg.hide();" type="button" />
		</div>
	</p:confirmDialog>

</ui:composition>
