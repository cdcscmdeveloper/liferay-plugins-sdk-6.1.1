<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="panelSupplier" header="#{lbl['lbl.ct.panel.supplier']}" toggleable="true"	toggleSpeed="500">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br/><br/>
		<h:panelGrid columns="2"  columnClasses="columnWidth225">
			<p:outputLabel value="#{lbl['lbl.ct.mof.no']}" />
			<p:inputText style="width:300px;" disabled="true" value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierMofNo}" />
			<p:outputLabel value="#{lbl['lbl.ct.business.name']}" />
			<p:inputText style="width:300px;" disabled="true" value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierName}" />
			<p:outputLabel value="#{lbl['lbl.ct.branch.name']}" />
			<p:inputText style="width:300px;" disabled="true" value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierBranch}" />
		    <p:outputLabel value="#{lbl['lbl.ct.contact.person']}" />
			<p:inputText style="width:300px;" disabled="true" value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierAddress.contactPerson}" />
		
			<h:panelGroup>
				<div style="height: 70px; vertical-align: top;">
					<p:outputLabel for="address" value="#{lbl['lbl.ct.address']}" />
				</div>
			</h:panelGroup>
			<h:panelGrid>
				<p:inputTextarea id="address" disabled="true"
					value="#{amendmentBackingBean.getFullAddress(ctBackingBean.managedBean.contractVer.ctContractValue.supplierAddress)}"
					rows="5" style="width:300px;margin-bottom: 5px;" maxlength="200" autoResize="false"/>
			</h:panelGrid>
				<p:outputLabel value="#{lbl['lbl.ct.tel']}" />
			<p:inputText style="width:150px;" disabled="true" value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierAddress.phoneNo}" />
			<p:outputLabel value="#{lbl['lbl.ct.mobile']}" />
			<h:panelGrid columns="3" style="width:420px;" columnClasses="columnWidth30,columnWidth30">
				<p:inputText style="width:150px;" disabled="true" value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierAddress.contactMobileNo}" />
				<p:outputLabel value="#{lbl['lbl.ct.fax']}" />
				<p:inputText style="width:140px;" disabled="true" value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierAddress.faxNo}" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.email']}" />
			<p:inputText style="width:420px;" disabled="true" value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierAddress.contactEmail}" />
		</h:panelGrid>
	</p:panel>
</ui:composition>
