<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.supplier.declaration.msg']}" escape="false"/><br/><br/>
	<p:panel id="panelSupplierDeclare" header="#{lbl['lbl.ct.panel.terms.condition']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid style="width:100%" columns="2">
			<p:selectBooleanCheckbox value="#{amendmentBackingBean.managedBean.termAndConditionFlg}" 
				disabled="#{!bpmTasklistBackingBean.managedBean.claim}" />
			  <p:media value="#{amendmentStreamContent.populateLoaStreamContent()}" 
		         	width="100%" height="500px" player="pdf" > 
		         	  <f:param name="filePath" value="#{amendmentBackingBean.getAcknowledgmentReceiptContent(false)}" />
		</p:media>
		
		</h:panelGrid>
	</p:panel>
</ui:composition>
