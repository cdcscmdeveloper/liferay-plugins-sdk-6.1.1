<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="panelSupplierDeclare" header="Terms and Condition" toggleable="true" toggleSpeed="500">
		<h:panelGrid style="width:100%">
			<p:editor controls="print" id="loaEditor" value="#{amendmentBackingBean.managedBean.editorValue}" width="800" height="430" />
			<p:spacer height="10" />
			<h:panelGrid columns="2">
				<p:selectBooleanCheckbox value="#{amendmentBackingBean.managedBean.termAndConditionFlg}" />
				<p:outputLabel value="#{lbl['lbl.ct.agree.term.condition']}" />
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
</ui:composition>
