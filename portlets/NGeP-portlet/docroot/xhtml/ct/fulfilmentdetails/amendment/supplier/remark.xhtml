<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.ct.panel.remarks.attachment']}" toggleable="true"
	     rendered="#{amendmentBackingBean.managedBean.ackFA == CtConst.supplierAckLoa}">
		<table style="width: 100%">
			<tr>
				   <td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{ctBackingBean.managedBean.contractVer.supplierRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{amendmentBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<p:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000"
													disabled="#{!bpmTasklistBackingBean.managedBean.claim}" style="width:70%;" autoResize="false" /> 
												<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.remark']}" rendered="#{remarkIndex==0}" />
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
							<td>
	   						<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.attachment']}" escape="false"/><br/><br/>   						 
							</td>
							</tr>
		</table>
		<table style="width: 100%">
		<tr>
		<td style="width: 50%; "/>
			<td class="TableFieldLeft" width="24%" ><h:outputLabel value="#{lbl['lbl.txt.attachment']}" /></td> 
			<td class="TableFieldRight">
				<p:commandButton oncomplete="uploadDlgAttch.show();return false;"
					update="lampiranAttch, uploadDlgAttch" value="#{lbl['lbl.txt.attach.files']}"
					disabled="#{ctBackingBean.managedBean.viewContract
						or !bpmTasklistBackingBean.managedBean.claim}" />
			</td>
			</tr>
			<tr>
			<td style="width: 768px; "/>
			<td/>
			<td>
				<p:dataGrid id="lampiranAttch" value="#{ctBackingBean.managedBean.attachmentList}"
					var="attachFile" rowIndexVar="attachFileIndex" columns="1" style="width:100%"
					emptyMessage ="#{lbl['lbl.datatable.msg.no.records.found']}">
					<table>
						<tr>
							<td rowspan="2"><h:graphicImage value="/css/images/design/#{ctBackingBean.determineIcon(attachFile)}" height="30" width="30"/></td>
							<td width="5"></td>
							<td>
								<h:outputText value=" #{attachFile.createdUser.userName}"></h:outputText>,
								<h:outputText value="#{attachFile.createdDate}">									
									<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<h:commandLink value="#{attachFile.fileName}" 
									styleClass="blue_font" action="#{ctBackingBean.downloadFile(attachFile)}" />
								<p:commandLink onsuccess="deleteAttachmentDlgAttch.show();" action="#{ctBackingBean.setAttachFileIndex(attachFileIndex)}"
									rendered="#{!ctBackingBean.managedBean.viewContract}"
									disabled="#{ctBackingBean.managedBean.viewContract
										or (ctBackingBean.managedBean.taskId != null and !bpmTasklistBackingBean.managedBean.claim)}">
			   						<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			 	 				</p:commandLink>
			 	 			</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
			</tr>		
		</table>
		
		<p:dialog id="uploadDlgAttch" widgetVar="uploadDlgAttch" modal="true"  resizable="false"
	     width="700px" height="350px" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{ctBackingBean.fileUpload}"
			mode="advanced" id="uploadAttch" multiple="true"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}"
			label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload.all']}" cancelLabel="#{lbl['lbl.btn.remove.all']}" 
			update="lampiranAttch" >
		</p:fileUpload>
		<f:facet name="footer">
		<div class="ppRightBtn">
		    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadDlgAttch.hide();" />
  		</div>
   		</f:facet>
	</p:dialog>
	
			<p:confirmDialog id="deleteAttachmentDlgAttch" widgetVar="deleteAttachmentDlgAttch" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                         <div class="ppRightBtn">
		                     <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                         update=":form:lampiranAttch" 
		                         action="#{ctBackingBean.deleteAttachmentActionByIndex(ctBackingBean.managedBean.attachFileIndex)}" oncomplete="deleteAttachmentDlgAttch.hide();"/>
			                 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteAttachmentDlgAttch.hide();" type="button" />
		                 </div>
           </p:confirmDialog>
	</p:panel>		  	
 </ui:composition>
