<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="disciplinaryPanel"
		header="#{lbl['lbl.ct.panel.disciplinary.decision.details']}"
		toggleable="true" toggleSpeed="500">

		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth150">
						<h:panelGrid columns="2" style="float:right;">
							<h:outputText value="* " styleClass="mandatory" />
							<p:outputLabel value="#{lbl['lbl.ct.decision']}" />
						</h:panelGrid>
						<p:selectOneMenu id="disciplinaryDecisionId"
							style="width:190px;margin-bottom: 10px;"
							label="#{lbl['lbl.ct.decision']}"
							value="#{amendmentBackingBean.managedBean.disciplinaryApprovedFlag}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItem itemLabel="#{lbl['lbl.ct.approve']}" itemValue="A" />
							<f:selectItem itemLabel="#{lbl['lbl.ct.reject']}" itemValue="R" />
							<p:ajax process="@this" partialSubmit="true"
								update=":form:disciplinaryDecisionId"
								listener="#{amendmentBackingBean.setDisciplinaryDecisionValue}"></p:ajax>
						</p:selectOneMenu>

						<h:panelGrid columns="2" style="float:right;">
							<p:outputLabel value="#{lbl['lbl.txt.remarks']}" />
						</h:panelGrid>
						<h:panelGrid>
							<p:inputTextarea id="justificationDisciplinary" rows="4"
								style="width:180px;margin-bottom: 4px;" maxlength="200"
								autoResize="false" label="#{lbl['lbl.txt.remarks']}"
								onkeyup="limitTextArea(this,1000);"
								onkeydown="limitTextArea(this,1000);"
								value="#{ctBackingBean.managedBean.contractVer.ctDisciplinaryActions.justification}" />
						</h:panelGrid>
					</h:panelGrid></td>
				<td width="50%" valign="top"><ui:include src="supplierDisciplinaryAttachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
