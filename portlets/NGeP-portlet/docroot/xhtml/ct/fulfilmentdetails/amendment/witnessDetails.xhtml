<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="witnessDetails" toggleable="true" toggleSpeed="500">
	   <f:facet name="header">
			<h:outputText value="#{amendmentBackingBean.managedBean.witnessHeader}"/>
	        <ac:iconTooltip value="#{amendmentBackingBean.managedBean.witnessHeaderTooltip}"/>
	  	</f:facet>
	  	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.email']}" escape="false"/><br/><br/>
		<h:panelGrid columns="2" style="width:75%" columnClasses="columnWidth30">
		   
		    <h:panelGrid columns="2" style="float:right;">
			    <p:outputLabel value="*" styleClass="mandatory" />
			    <p:outputLabel value="#{lbl['lbl.ct.full.name']}" />
		    </h:panelGrid>
		    <h:panelGrid columns="2">
			   <p:inputText id="fullName"  required="true" label="#{lbl['lbl.ct.full.name']}" style="width:170px;"
			        value="#{amendmentBackingBean.managedBean.scLoaWitness.witnessName}" validator="#{webappBean.checkInputField}"  />
			    <p:message for="fullName" display="icon"/>
			</h:panelGrid>
		    
		    <h:panelGrid columns="2" style="float:right;">
			    <p:outputLabel value="*" styleClass="mandatory" />
			    <p:outputLabel value="#{lbl['lbl.ct.ic.no']}" />
            </h:panelGrid>
            <h:panelGrid columns="2">
			   <p:inputText id="icNo"  style="width:170px;" required="true" label="#{lbl['lbl.ct.ic.no']}"
			       value="#{amendmentBackingBean.managedBean.scLoaWitness.identificationNo}" />
			   <p:message for="icNo"  display="icon"/>
			</h:panelGrid>
			
			<h:panelGrid columns="2" style="float:right;">
			    <p:outputLabel value="*" styleClass="mandatory" />
			    <p:outputLabel value="#{lbl['lbl.ct.designation']}" />
			</h:panelGrid>
			<h:panelGrid columns="2">
			    <p:inputText id="designation" style="width:170px;"  required="true"
			        value="#{amendmentBackingBean.managedBean.scLoaWitness.designation}"  label="#{lbl['lbl.ct.designation']}"/>
			    <p:message for="designation" display="icon"/>
			</h:panelGrid>
			
			<h:panelGroup>
				<div style="height: 80px; vertical-align: top;">
					<p:outputLabel for="agencyAddress" value="#{lbl['lbl.ct.address']}" />
				</div>
			</h:panelGroup>
			<h:panelGrid columns="2" style="width:100%;" columnClasses="columnWidth20,columnWidth20">
				 <p:inputTextarea id="agencyAddress" 	rows="4" style="width:170px;" maxlength="200" 
				   value="#{amendmentBackingBean.managedBean.scLoaWitness.address}"  autoResize="false" />
				   <h:panelGrid columns="2" columnClasses="columnWidth30,columnWidth30">
				  
				        <h:panelGrid columns="2" style="float:right;">
			                 <p:outputLabel value="*" styleClass="mandatory" />
				         	 <p:outputLabel value="#{lbl['lbl.ct.tel']}" />
				        </h:panelGrid>
				        <h:panelGrid columns="2">
					         <p:inputText id="tellNo" style="width:150px;" required="true"   label="#{lbl['lbl.ct.tel']}"
					             value="#{amendmentBackingBean.managedBean.scLoaWitness.phoneNo}"  validator="#{webappBean.checkPhoneNumber}"/>
					         <p:message for="tellNo" display="icon"/>
					    </h:panelGrid>
					    
			  	       <h:panelGrid columns="2" style="float:right;">
			                <p:outputLabel value="*" styleClass="mandatory" />
					        <p:outputLabel value="#{lbl['lbl.ct.fax']}" />
			           </h:panelGrid>
			           <h:panelGrid columns="2">
					        <p:inputText id="faxNo" style="width:150px;" required="true"  label="#{lbl['lbl.ct.fax']}"
					            value="#{amendmentBackingBean.managedBean.scLoaWitness.faxNo}" validator="#{webappBean.checkFaxNumber}"   />
					        <p:message for="faxNo" display="icon"/>
					   </h:panelGrid>
					   
				       <h:panelGrid columns="2" style="float:right;">
			              <p:outputLabel value="*" styleClass="mandatory" />
				  	      <p:outputLabel value="#{lbl['lbl.ct.mobile']}" />
				  	   </h:panelGrid>
				        <h:panelGrid columns="3">
					       <p:inputText id="mobileNo" style="width:150px;"  required="true"  label="#{lbl['lbl.ct.mobile']}"
					           value="#{amendmentBackingBean.managedBean.scLoaWitness.mobileNo}"  validator="#{webappBean.checkMobileNumber}"/>
					       <p:message for="mobileNo" display="icon"/>
					   </h:panelGrid>
				</h:panelGrid>
			</h:panelGrid>
			<h:panelGrid columns="2" style="float:right;">
			    <p:outputLabel value="*" styleClass="mandatory" />
			      <p:outputLabel value="#{lbl['lbl.ct.email']}" />
			 </h:panelGrid>
			 <h:panelGrid columns="5">
			     <p:inputText  id="email" style="width:170px;" required="true"   label="#{lbl['lbl.ct.email']}"
			        value="#{amendmentBackingBean.managedBean.scLoaWitness.email}" validator="#{webappBean.checkEmail}"/>
			     <p:spacer width="1"/>
			     <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.email']}" />
			     <p:spacer width="1"/>
			     <p:message for="email" display="icon"/>
		     </h:panelGrid>
		</h:panelGrid>
	</p:panel>
</ui:composition>
