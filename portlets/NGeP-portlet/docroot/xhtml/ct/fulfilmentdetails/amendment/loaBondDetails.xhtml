<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="bondDetails" header="#{lbl['lbl.ct.panel.performance.bond']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="2" columnClasses="columnWidth225">
		  <f:verbatim />
			  <h:commandLink value="#{lbl['lbl.ct.sample.bond.letter']}" style="float:left;"
				styleClass="blue_font"
				action="#{amendmentBackingBean.downloadSampleBondLetter()}">
			</h:commandLink>
			<p:outputLabel value="#{lbl['lbl.ct.bond.no.days']}" styleClass="required" />
			<p:selectOneMenu id="bondSubmissionPeriod" style="width:200px;"
				value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.bondSubmissionPeriod}"
				disabled="#{amendmentBackingBean.managedBean.disableFinalAmendDetails or ctBackingBean.managedBean.viewSCL}"> <!-- 15851 -->
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="14" itemValue="14"></f:selectItem>
					<f:selectItem itemLabel="30" itemValue="30"></f:selectItem>
			</p:selectOneMenu>
			<p:outputLabel value="#{lbl['lbl.ct.bond.due.date']}" styleClass="required" />
			<h:panelGrid columns="2">
				<p:inputText style="width:200px;" id="dueDate" disabled="true"
					value="#{!empty ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.bondResDueDate
						? ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.bondResDueDate
						: lbl['lbl.txt.na']}" >
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.bond.submission.due.date']}" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.contract.period']}" />
			<h:panelGrid columns="3">
				<p:inputText style="width:120px;" disabled="true" 
				       styleClass="ppRightBtn" value="#{amendmentBackingBean.calculateNewContractPeriod(false)}" />
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.months']}" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.new.contract.period']}" />
			<h:panelGrid columns="3">
				<p:inputText style="width:120px;" disabled="true" styleClass="ppRightBtn"
					value="#{(ctBackingBean.managedBean.contractVer.ctAmendment.contractExtend)
						? amendmentBackingBean.calculateNewContractPeriod(true) : lbl['lbl.txt.na']}" />
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.months']}" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.gst.all.amt']}" />
			<p:inputText disabled="true" style="width:200px;" styleClass="ppRightBtn"
			    value="#{(ctBackingBean.managedBean.contractVer.ctContractAmount.gstAmount == null )
			    	? ctBackingBean.managedBean.contractVer.ctContractAmount.contractAmount
			    		: (ctBackingBean.managedBean.contractVer.ctContractAmount.contractAmount
			    			+ ctBackingBean.managedBean.contractVer.ctContractAmount.gstAmount 
			    			+ ctBackingBean.managedBean.contractVer.ctContractAmount.staxAmount)}"  >
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />		
			</p:inputText>
			<p:outputLabel value="#{lbl['lbl.ct.new.overall.contract.amt']}" />
			<h:panelGrid columns="4">
			<p:inputText disabled="true" style="width:200px;" styleClass="ppRightBtn"
			    value="#{(ctBackingBean.managedBean.contractVer.ctAmendment.valueChange) 
			    	? amendmentBackingBean.newOverallContractAmount() : lbl['lbl.txt.na']}"  >
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />			
			</p:inputText>
			<p:spacer width="2"/>
			    <p:graphicImage id="iconToolTipAmts" value="/css/images/design/tooltips.png" /> 
				  	<p:tooltip id="amtsTooltipSource" for="iconToolTipAmts">
						<h:outputText id="amtsLabelSource" escape="false" value="#{lbl['lbl.ct.tooltip.new.overall.contract.amt']}" />
					</p:tooltip>
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.pb.percentage']}" />
			<p:inputText style="width:200px;" disabled="true" styleClass="ppRightBtn"
				value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.bondPercentage}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</p:inputText>
			<p:outputLabel value="#{lbl['lbl.ct.pb.amount']}" />
			<p:inputText style="width:200px;" disabled="true"  styleClass="ppRightBtn"
			  value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.bondAmt}" >
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />				
			</p:inputText>
			<p:outputLabel />
			<p:inputTextarea autoResize="false" disabled="true" rows="4" 
				style="width:200px;margin-bottom:5px;"
			   	value="#{amendmentBackingBean.getBondAmountInText()}" />
		</h:panelGrid>
	</p:panel>
	<!-- END LOG : 24333, by Putra 05082019 -->
	
	<!-- #13847 start -->
	<p:panel id="performanceBondDefermentPanel" toggleable="true" toggleSpeed="500" rendered="#{!ctBackingBean.isPendingSupplementalContractLetter()}">	<!-- #24333  -->
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.pb.waiver.table.title']}"/>
			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.deferment.bond.dtls']}"/>
	   	</f:facet>
			
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.performance.bond']}" escape="false"/><br/>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.bond.waiver']}" escape="false"/><br/><br/>
		<h:panelGrid columns="2" >
			<p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.ctContractAmount.bondWaived}"
				disabled="true">
				<p:ajax event="change" update="@all" listener="#{ctBackingBean.chkBondWaiverAction}" process="@this"/>
	  		</p:selectBooleanCheckbox>
	   		<h:outputFormat id="bondDefermentChckbox" value="#{lbl['lbl.ct.bond.waiver.chkbox']}" styleClass="instruction">
	   			<f:param value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierName}" />
	 		</h:outputFormat>
	   	</h:panelGrid>
	   	
		<p:outputPanel id="bondDefermentGrid" rendered="#{ctBackingBean.managedBean.ctContractAmount.bondWaived}">
			<p:dataGrid id="defermentDataGridId" value="#{ctBackingBean.managedBean.contractVer.bondWaiverDefermentLatest}"
				var="bondDeferment" rowIndexVar="defermentIndex" columns="1" style="width:100%" emptyMessage="">
				<table>
					<tr>
						<td>
							<p:outputLabel id="defermentStartDateLbl" value="#{lbl['lbl.ct.pb.waiver.start.date']}" styleClass="required" />
						</td>
						<td>
							<p:calendar id="defermentStartDate" value="#{bondDeferment.waiverStartDate}" styleClass="calendarDateField" size="9" 
								readonlyInput="true" navigator="true" disabled="true"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							</p:calendar>
							<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.waiver.performance.bond.start.date']}"/>
						</td>
						<td>
							<p:outputLabel id="defermentEndDateLbl" value="#{lbl['lbl.ct.pb.waiver.end.date']}" styleClass="required" />
						</td>
						<td colspan="2">
							<p:calendar id="defermentEndDate" value="#{bondDeferment.waiverEndDate}" styleClass="calendarDateField" size="9" 									
								readonlyInput="true" navigator="true" disabled="true"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >							
							</p:calendar>
							<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.waiver.pb.end.date']}"/>
						</td>
					</tr>
					<tr>
						<td>
							<p:outputLabel id="defermentReferenceNoLbl" value="#{lbl['lbl.ct.pb.waiver.reference.no']}" styleClass="required" />
						</td>
						<td>
							<p:inputText id="defermentReferenceNo" maxlength="20" style="width:130px;"
								value="#{bondDeferment.referenceNo}"
				 				disabled="true"  >
							</p:inputText>
						</td>
						<td>
							<h:outputLabel value="#{lbl['lbl.ct.pb.waiver.letter']}"  styleClass="required" />
						</td>
						<td>
							<p:outputPanel id="uploadDocDeferment">
								<p:commandButton icon=" ui-icon-upload" partialSubmit="true"
									rendered="#{bondDeferment.ctAttachment.fileName == null}"
									disabled="true" 
									/>
								<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.pb.waiver.letter']}"/>
							</p:outputPanel>
						</td>
						<td>
							<h:commandLink value="#{bondDeferment.ctAttachment.fileName}" 
								styleClass="blue_font" style="word-break: break-word; overflow: hidden; display: -webkit-box; 
								max-width: 192px; -webkit-line-clamp: 2; -webkit-box-orient: vertical;" 
								action="#{ctBackingBean.downloadFile(bondDeferment.ctAttachment)}" />
						</td>
						<td>
							<p:commandButton id="addwaiverBtn" value="#{lbl['lbl.btn.add']}" disabled="true" />
						</td>
					</tr>
				</table>
			</p:dataGrid>
		</p:outputPanel>
	</p:panel>
	
	<br></br>
	<p:panel id="defermentHistoryPanel" toggleable="true" toggleSpeed="500" rendered="#{!ctBackingBean.isPendingSupplementalContractLetter()}">	<!-- #24333  -->
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.menu.performanceBond.history.header']}"/>
	   	</f:facet>
		<p:dataTable id="deferHistoryTable" var="bondDefermentHistory" rowIndexVar="defermentHistoryIndex" widgetVar="defermentTableWidget" 
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			render="#{ctBackingBean.managedBean.bondWaiverDefermentHistory.size >0}"
			value="#{ctBackingBean.managedBean.contractVer.bondWaiverDefermentHistory}"  rowKey="#{rowKeyObj}">
			<ac:paginator for="deferHistoryTable" />
			
			<p:column style="width:25%;" styleClass="column-align-center">
				<f:facet name="header">
				        <h:outputText value="#{lbl['lbl.ct.pb.waiver.start.date']}" />
				        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.waiver.performance.bond.start.date']}"/>
				</f:facet>
				
				<p:calendar id="defermentHistoryStartDate" value="#{bondDefermentHistory.waiverStartDate}"  styleClass="calendarDateField" size="9" 
					readonlyInput="true" navigator="true" disabled = "true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
				</p:calendar>
			</p:column>
			
			<p:column style="width:25%;" styleClass="column-align-center">
				<f:facet name="header">
				        <h:outputText value="#{lbl['lbl.ct.pb.waiver.end.date']}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.waiver.pb.end.date']}"/>
				</f:facet>
				<p:calendar id="defermentHistoryEndDate" value="#{bondDefermentHistory.waiverEndDate}"  styleClass="calendarDateField" size="9" 
					readonlyInput="true" navigator="true"
					disabled = "true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
				</p:calendar>
			</p:column>
			<p:column style="width:20%;white-space:normal;"  styleClass="column-align-center" >
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.ct.pb.waiver.reference.no']}"  />
				</f:facet>
				<h:outputText value="#{bondDefermentHistory.referenceNo}" 
				      style="float:left;text-align:left;" />
			</p:column>	
			<p:column styleClass="column-align-center"  headerText="#{lbl['lbl.ct.pb.waiver.letter']}" style="width:30%;">	
				<h:panelGroup id="defermentHistoryAttachment" columns="2">
					<h:commandLink
						title="#{bondDefermentHistory.ctAttachment.fileName}" value="#{bondDefermentHistory.ctAttachment.fileName}"					
						style="float:left; overflow: hidden; text-overflow: ellipsis; 
						max-width: 192px;" styleClass="blue_font"
						action="#{ctBackingBean.commonDownload(bondDefermentHistory.ctAttachment.filePath, bondDefermentHistory.ctAttachment.fileName)}" />
					<p:commandButton icon=" ui-icon-upload" 
						disabled = "true"
						rendered="#{bondDefermentHistory.ctAttachment.fileName eq null and bondDefermentHistory.ctAttachment.filePath eq null}"
						/>
					<p:commandLink 
						disabled = "true"
						rendered="#{bondDefermentHistory.ctAttachment.fileName ne null and bondDefermentHistory.ctAttachment.filePath ne null}">
		  					<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
		 			</p:commandLink>
				</h:panelGroup>
			</p:column>
		</p:dataTable>
	</p:panel>
	<br/>
	<!-- #13847 end -->
</ui:composition>
