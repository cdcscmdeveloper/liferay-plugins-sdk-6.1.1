<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="bondDetails" header="#{lbl['lbl.ct.panel.performance.bond']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:100%;" columnClasses="columnWidth20">
		  <f:verbatim />
			  <h:commandLink value="#{lbl['lbl.ct.sample.bond.letter']}" style="float:left;"
				styleClass="blue_font"
				action="#{amendmentBackingBean.downloadFile('', 'sample')}">
			</h:commandLink>
			<p:outputLabel value="#{lbl['lbl.ct.bond.due.date']}" />
			<h:panelGrid columns="3">
				<p:inputText style="width:105px;" id="dueDate" disabled="true"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.bondResDueDate}" >
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				<p:spacer width="2" />
				<p:inputText style="width:50px;" value="30 days" disabled="true" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.contract.period']}" />
			<h:panelGrid columns="5">
				<p:inputText style="width:170px;" disabled="true"  styleClass="ppRightBtn"
					value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.contractPeriod / 12}" />
				<p:spacer width="2" />
				<p:outputLabel value="(#{lbl['lbl.ct.years']})" />
				<p:spacer width="1" />
				<p:outputLabel value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.contractPeriod}"> #{lbl['lbl.ct.months']}</p:outputLabel>
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.contract.amount']}" />
			<p:inputText disabled="true" style="width:170px;" styleClass="ppRightBtn"
			    value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"  >
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />			
			</p:inputText>
			<p:outputLabel value="#{lbl['lbl.ct.pb.percentage']}" />
			<p:inputText style="width:170px;" disabled="true" styleClass="ppRightBtn"
				value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.bondPercentage}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</p:inputText>
			<p:outputLabel value="#{lbl['lbl.ct.pb.amount']}" />
			<h:panelGrid columns="3">
				<p:inputText style="width:170px;" disabled="true"  styleClass="ppRightBtn"
				  value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.bondAmt}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />				
				</p:inputText>
				<p:spacer width="1" />
				<p:inputText style="width:300px;" 
				   value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.proposedAmt}" />
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
</ui:composition>
