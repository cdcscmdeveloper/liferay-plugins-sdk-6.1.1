				</p:selectBooleanCheckbox>
			</p:column>

					   <p:ajax  process="@this"></p:ajax>
				</p:selectOneMenu>

			</p:column>
			<!-- #30479 end -->
					
			<p:column style="width:12%;" headerText="#{lbl['lbl.ct.amount']}" styleClass="column-align-center">

					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax process="@this"></p:ajax>
				</p:inputText>

					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>

			<p:column style="width:8%;" styleClass="column-align-center">

				        <h:outputText value="#{lbl['lbl.ct.effective.date']}"  styleClass="required"/>
				</f:facet>

					showOn="button" readonlyInput="true" navigator="true"
					mindate="#{ctBackingBean.managedBean.contractVer.ctContractValue.effDate}"

					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >

				</p:calendar>

						or !ctBackingBean.managedBean.ctContractAmount.bondReq}">
		                <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText>
			</p:column>
					
			<p:column style="width:8%;" headerText="#{lbl['lbl.ct.expiry.date']}" styleClass="column-align-center">
				<p:calendar id="bondExpDateCalId"  value="#{varBond.expDate}" styleClass="calendarDateField" showOn="button"

				    and ctBackingBean.managedBean.ctContractAmount.bondReq}"
					size="9"  pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
				    <f:attribute name="startDate" value="#{varBond.effDate}" />
	                   <f:validator validatorId="primeDateRangeValidator" />
			    </p:calendar>
			    
			     <h:outputText value="#{varBond.expDate}" rendered="#{ctBackingBean.managedBean.viewContract
			     	or !ctBackingBean.managedBean.ctContractAmount.bondReq}">
		            <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText>
			</p:column>
					
			<p:column styleClass="column-align-center"  headerText="#{lbl['lbl.txt.attachment']}" style="width:15%;">			
				<h:panelGroup id="uploadBondPg" columns="2">
				<!--  <p:commandButton oncomplete="uploadBondDlg.show();return false;" update=":form:uploadBondDlg"
					   	process="@this" partialSubmit="true" actionListener="#{ctBackingBean.PerformanceBondValue(varBond)}"
						rendered="#{!ctBackingBean.managedBean.viewContract and varBond.fileName == null
						and ctBackingBean.managedBean.ctContractAmount.bondReq}"
						style="float:left;" icon="ui-icon-upload">
					</p:commandButton> -->
					<h:commandLink
						title="#{varBond.fileName}"
						value="#{ctBackingBean.getShortFileName(varBond.fileName)}"						
						style="float:left;" styleClass="blue_font"
						action="#{ctBackingBean.commonDownload(varBond.filePath, varBond.fileName)}" />
					<p:commandLink rendered="#{varBond.fileName != null and (!ctBackingBean.managedBean.viewContract
						or !ctBackingBean.managedBean.ctContractAmount.bondReq)and ctBackingBean.managedBean.contractVer.docType != ParameterConst.doctypeContractAmendment}" style="float:left;" 
					  	action="#{ctBackingBean.setIndexProperty(index)}"
					   	process="@this" partialSubmit="true"  onsuccess="deleteBondAttachmentDlg.show();">
			   			<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			 	</p:commandLink>
				</h:panelGroup>
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn">
				
			<p:commandButton id="addPdBtn"  value="#{lbl['lbl.btn.add']}" process="@this" 
			  rendered="#{!ctBackingBean.managedBean.viewContract
			  	and ctBackingBean.managedBean.contractVer.docType != ParameterConst.doctypeContractAmendment
			  	and ctBackingBean.managedBean.ctContractAmount.bondReq}" 
			     action="#{ctBackingBean.addBondDetails}" update=":form:tableBondId" partialSubmit="true"
			     oncomplete="tableBondWidget.paginator.endLink.click();">
				<p:tooltip for="addPdBtn">
				    <h:outputText value="#{lbl['lbl.ct.tooltip.add.performance.bond']}" escape="false" />
				</p:tooltip>
			</p:commandButton>
			
			
			<p:spacer width="1" />
			  
		     <p:commandButton id="delPdBtn" value="#{lbl['lbl.ct.delete']}" 
		          process="@this" partialSubmit="true" onsuccess="dlgPerformDel.show();"
		          disabled="#{ctBackingBean.managedBean.buttonHideActive}"
			      rendered="#{!ctBackingBean.managedBean.viewContract
			      	and ctBackingBean.managedBean.contractVer.docType != ParameterConst.doctypeContractAmendment
			      	and ctBackingBean.managedBean.ctContractAmount.bondReq}" >
				<p:tooltip for="delPdBtn">
				    <h:outputText value="#{lbl['lbl.ct.tooltip.delete.performance.bond']}" escape="false" />
				</p:tooltip>
			</p:commandButton>				
		</div>
		</p:panel>

	<p:panel id="performanceBondDefermentPanel" toggleable="true" toggleSpeed="500" rendered="#{!ctBackingBean.isPendingSupplementalContractLetter()}">	
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.pb.waiver.table.title']}"/>
			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.deferment.bond.dtls']}"/>
	   	</f:facet>
			
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.performance.bond']}" escape="false"/><br/>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.bond.waiver']}" escape="false"/><br/><br/>
		<h:panelGrid columns="2" >
			<p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.ctContractAmount.bondWaived}"
				disabled="true">
				<p:ajax event="change" update="@all" listener="#{ctBackingBean.chkBondWaiverAction}" process="@this"/>
	  		</p:selectBooleanCheckbox>
	   		<h:outputFormat id="bondDefermentChckbox" value="#{lbl['lbl.ct.bond.waiver.chkbox']}" styleClass="instruction">
	   			<f:param value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierName}" />
	 		</h:outputFormat>
	   	</h:panelGrid>
	   	
		<p:outputPanel id="bondDefermentGrid" rendered="#{ctBackingBean.managedBean.ctContractAmount.bondWaived}">
			<p:dataGrid id="defermentDataGridId" value="#{ctBackingBean.managedBean.contractVer.bondWaiverDefermentLatest}"
				var="bondDeferment" rowIndexVar="defermentIndex" columns="1" style="width:100%" emptyMessage="">
				<table>
					<tr>
						<td>
							<p:outputLabel id="defermentStartDateLbl" value="#{lbl['lbl.ct.pb.waiver.start.date']}" styleClass="required" />
						</td>
						<td>
							<p:calendar id="defermentStartDate" value="#{bondDeferment.waiverStartDate}" styleClass="calendarDateField" size="9" 
								readonlyInput="true" navigator="true" disabled="true"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							</p:calendar>
							<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.waiver.performance.bond.start.date']}"/>
						</td>
						<td>
							<p:outputLabel id="defermentEndDateLbl" value="#{lbl['lbl.ct.pb.waiver.end.date']}" styleClass="required" />
						</td>
						<td colspan="2">
							<p:calendar id="defermentEndDate" value="#{bondDeferment.waiverEndDate}" styleClass="calendarDateField" size="9" 									
								readonlyInput="true" navigator="true" disabled="true"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >							
							</p:calendar>
							<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.waiver.pb.end.date']}"/>
						</td>
					</tr>
					<tr>
						<td>
							<p:outputLabel id="defermentReferenceNoLbl" value="#{lbl['lbl.ct.pb.waiver.reference.no']}" styleClass="required" />
						</td>
						<td>
							<p:inputText id="defermentReferenceNo" maxlength="20" style="width:130px;"
								value="#{bondDeferment.referenceNo}"
				 				disabled="true"  >
							</p:inputText>
						</td>
						<td>
							<h:outputLabel value="#{lbl['lbl.ct.pb.waiver.letter']}"  styleClass="required" />
						</td>
						<td>
							<p:outputPanel id="uploadDocDeferment">
								<p:commandButton icon=" ui-icon-upload" partialSubmit="true"
									rendered="#{bondDeferment.ctAttachment.fileName == null}"
									disabled="true" 
									/>
								<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.pb.waiver.letter']}"/>
							</p:outputPanel>
						</td>
						<td>
							<h:commandLink value="#{bondDeferment.ctAttachment.fileName}" 
								styleClass="blue_font" style="word-break: break-word; overflow: hidden; display: -webkit-box; 
								max-width: 192px; -webkit-line-clamp: 2; -webkit-box-orient: vertical;" 
								action="#{ctBackingBean.downloadFile(bondDeferment.ctAttachment)}" />
						</td>
						<td>
							<p:commandButton id="addwaiverBtn" value="#{lbl['lbl.btn.add']}" disabled="true" />
						</td>
					</tr>
				</table>
			</p:dataGrid>
		</p:outputPanel>
	</p:panel>
