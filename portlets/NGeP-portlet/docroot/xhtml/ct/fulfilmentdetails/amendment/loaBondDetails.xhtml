<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	 <p:panel id="bondDetails" header="Performance Bond" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:100%;" columnClasses="columnWidth20">
		    <f:verbatim/>
		     <h:commandLink value="#{amendmentBackingBean.fileNames(data.filePath)}" 
				style="float:left;" styleClass="blue_font" 
				action="#{amendmentBackingBean.downloadFile(data.filePath)}">
			 </h:commandLink>					
			<p:outputLabel value="Bond Response Due Date"/>
			<h:panelGrid columns="3">
			   <p:calendar  size="18" id="dueDate" pattern="#{CommonConstants.DATE_FORMAT_TYPE_DATE}" 
			     value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.bondResDueDate}"/>
			    <p:spacer width="1"/>
			    <p:inputText style="width:40px;"/>
			</h:panelGrid>
			<p:outputLabel value="Contract Period"/>
			<h:panelGrid columns="5">
			    <p:inputText style="width:80px;"
			      value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.contractPeriod}"/>
			    <p:spacer width="1"/>
			    <p:outputLabel value="(Year)"/>
			    <p:spacer width="1"/>
			    <p:outputLabel value="#{amendmentBackingBean.calculateInMonths(amendmentBackingBean.managedBean.contractVer.ctContractValue.contractPeriod)}, Months"/>
			</h:panelGrid>
			<p:outputLabel value="Contract Amount (RM)"/>
			<p:inputText value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
			   style="width:170px;"/>
			<p:outputLabel value="Percentage Bond"/>
			<p:inputText value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.bondPercentage}" 
			  style="width:170px;"/>
			<p:outputLabel value="Bond Amount Per Year (RM)"/>
			<h:panelGrid columns="3">
		  	  <p:inputText style="width:170px;"
		  	    value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.bondAmt}"/>
			   <p:spacer width="1"/>
			  <p:inputText style="width:300px;"
			    value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.proposedAmt}"/>
			</h:panelGrid>
		 </h:panelGrid>
	</p:panel>	
</ui:composition>
