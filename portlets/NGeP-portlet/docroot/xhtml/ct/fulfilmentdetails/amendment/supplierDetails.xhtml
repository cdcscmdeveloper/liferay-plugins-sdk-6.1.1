<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
   <p:panel id="sbd" toggleable="true"  toggleSpeed="500">
     <f:facet name="header">
		<h:outputText value="#{lbl['lbl.ct.panel.supplier']}"/>
        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.supplier.dtls']}"/>
  	 </f:facet>
     <h:panelGrid columns="4" style="width:100%;" styleClass="top-aligned-columns"
         columnClasses="columnWidth150,columnWidth350,columnWidth150,columnWidth200">
          <p:outputLabel value="#{lbl['lbl.ct.business.reg.no']}" />  
          <h:panelGrid columns="4" style="width:350px;">
          	<h:panelGrid columns="3">
	            <p:inputText disabled="true" style="width:100px;" 
	                value="#{amendmentBackingBean.managedBean.contractVer.ctContract.smSupplier.regNo}" />
                <p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.business.reg.no']}" />
			 </h:panelGrid>
             <p:spacer width="2"/>
             <p:outputLabel value="#{lbl['lbl.ct.mof.no']}" />
             <h:panelGrid columns="3">
	             <p:inputText disabled="true" style="width:100px;" 
	             	value="#{amendmentBackingBean.managedBean.ctContract.loa.scLoiLoa.mofNo}" />
	             <p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.mof.no']}" />
			 </h:panelGrid>
          </h:panelGrid>
           <p:outputLabel value="#{lbl['lbl.ct.contact.person']}"/>  
           <p:inputText disabled="true" style="width:170px;" 
              value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.supplierContact}" />
          <p:outputLabel value="#{lbl['lbl.ct.business.name']}" />
          <h:panelGrid columns="3">
          	 <p:inputText disabled="true" style="width:220px;" id="supplierCompanyName"
             	value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.supplierName}" />
              <p:spacer width="1"/>
			  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.supplier.branch']}" />
		   </h:panelGrid>	
           <p:outputLabel  value="#{lbl['lbl.ct.tel']}"/>  
           <p:inputText  value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.supplierPhoneNo}"  disabled="true" style="width:170px;" />
          
          <p:outputLabel value="#{lbl['lbl.ct.branch.name']}"/>
          <p:inputText disabled="true" style="width:170px;" value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.supplierBranch}" /> 
           <p:outputLabel  value="#{lbl['lbl.ct.fax']}"/>
           <p:inputText  disabled="true" style="width:170px;"  
              value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.supplierFaxNo}"/>  
         
          <h:panelGroup>
            <div style="height: 40px; vertical-align:top;">
                <p:outputLabel for="supplierAddress" value="#{lbl['lbl.ct.address']}" />
            </div>
           </h:panelGroup>
           <h:panelGrid>
             <p:inputTextarea id="supplierAddress" disabled="true"  rows="4"   maxlength="200"  style="width:170px; margin-bottom: 5px;"
              autoResize="false" value="#{amendmentBackingBean.getFullAddress(amendmentBackingBean.managedBean.contractVer.ctContractValue.supplierAddress)}" />
             <p:spacer width="5"/>
		     </h:panelGrid>
           <p:outputLabel  value="#{lbl['lbl.ct.email']}"/>  
           <p:inputText disabled="true" style="width:170px;" value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.supplierEmail}"/>
        </h:panelGrid>
      </p:panel>
      <p:panel id="BankInfoPanel" header="#{lbl['lbl.ct.panel.bank.info']}"  toggleable="true"  
            toggleSpeed="500" rendered="#{!contractDetailsBackingBean.managedBean.ctContract.factored}">
            <h:panelGrid columns="4" style="width:100%;" styleClass="top-aligned-columns"
                   columnClasses="columnWidth150,columnWidth350,columnWidth150,columnWidth200">
     
                   <p:outputLabel  value="#{lbl['lbl.ct.bank.name']}"/>  
                   <p:inputText disabled="true" style="width:170px;" 
                       value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.bankName}"/>
          
                   <p:outputLabel  value="#{lbl['lbl.ct.account.no']}" />  
                   <p:inputText  disabled="true" style="width:170px;"
                       value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.bankAccountNo}"/> 
                   <h:panelGroup>
                      <div style="height: 60px; vertical-align: top;">
                             <p:outputLabel for="bankAddress" value="#{lbl['lbl.ct.bank.address']}" />
                     </div>
                  </h:panelGroup>
	              <h:panelGrid>
                       <p:inputTextarea id="bankAddress"  disabled="true" rows="4"  autoResize="false" style="width:170px; margin-bottom: 5px;"
                          value="#{amendmentBackingBean.getFullAddress(amendmentBackingBean.managedBean.contractVer.ctContractValue.bankAddress)}" />
	             </h:panelGrid>
	 
	           <p:outputLabel  value="#{lbl['lbl.ct.bank.branch']}"/>  
               <p:inputText  disabled="true" style="width:170px;"
                    value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.bankBranch}"  />
         </h:panelGrid>
      </p:panel>
</ui:composition>
