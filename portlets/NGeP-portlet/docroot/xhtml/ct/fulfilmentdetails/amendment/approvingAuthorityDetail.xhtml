<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- START 24336 -->
	<p:panel id="approvingAuthority"
		header="#{lbl['lbl.ct.menu.approving.authority']}" toggleable="true"
		toggleSpeed="500">
		<!-- END 24336 -->
		<h:panelGrid id="approvingAuthorityPanel" columns="2"
			style="width:100%" columnClasses="columnWidth170">
			<p:outputLabel value="#{lbl['lbl.ct.approving.authority']}"
				styleClass="required" />
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.mofAuthorityReq}"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails 
					or ctBackingBean.managedBean.viewSCL or amendmentBackingBean.isContractAmountAmend()}">
				</p:selectBooleanCheckbox>
				<!-- Enhancement 15851 - shaqimi -->
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.mof']}" style="text-align:left" />
			</h:panelGrid>
			<f:verbatim />
			<h:panelGrid columns="4">
				<p:selectBooleanCheckbox
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.pbqcAuthorityReq}"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails 
					or ctBackingBean.managedBean.viewSCL or amendmentBackingBean.isContractAmountAmend()}">
					<p:ajax event="change"
						update=":form:approvingAuthority, :form:approvingAuthoritySecretary"
						process="@all" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						listener="#{amendmentBackingBean.resetPbqcAuthoritySelection}" />
					<!-- #24336 -->
				</p:selectBooleanCheckbox>
				<!-- Enhancement 15851 - shaqimi -->
				<p:spacer width="2" />
				<!-- #24336 - Start -->
				<p:outputLabel value="#{lbl['lbl.ct.committee.type']}"
					style="text-align:left" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.committee.type']}" />
				<!-- #24336 - End -->
			</h:panelGrid>
			<f:verbatim />
			<!-- #24336 - Start -->

			<h:panelGrid id="committeeTypeGrid" columns="2" style="width:100%"
				columnClasses="columnWidth30"
				rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.pbqcAuthorityReq}">
				<h:outputText />
				<p:selectOneRadio id="committeeType"
					styleClass="committee-type-radio" layout="pageDirection"
					value="#{amendmentBackingBean.managedBean.committeeType}"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}">
					<f:selectItems
						value="#{amendmentBackingBean.getCommitteeTypeSelectItems()}" />
					<p:ajax event="change" update=":form:approvingAuthoritySecretary"
						process="@this" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();" />
				</p:selectOneRadio>
			</h:panelGrid>
			<f:verbatim />
		</h:panelGrid>

		<h:panelGrid id="approvingAuthoritySecretary" columns="2"
			style="width:100%" columnClasses="columnWidth60">
			<h:outputText />
			<h:panelGrid columns="5"
				rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.pbqcAuthorityReq}">
				<p:outputLabel value="#{lbl['lbl.ct.secretary.committee']}" />
				<p:spacer width="2" />
				<p:inputText id="secretaryId" style="width:300px;"
					value="#{amendmentBackingBean.getSecretaryName()}" disabled="true" />
				<!-- <p:selectOneMenu id="secretaryId"
					value="#{amendmentBackingBean.managedBean.secretaryId}"
					label="#{lbl['lbl.ct.secretary.committee']}" style="width:300px;"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails 
					or ctBackingBean.managedBean.viewSCL or amendmentBackingBean.managedBean.committeeType eq null}">
					<f:selectItems
						value="#{amendmentBackingBean.getSecretaryDropdownList()}" />
				</p:selectOneMenu> -->
				<p:spacer width="2" />
				<p:commandLink
					action="#{amendmentBackingBean.searchSecretaryApprovingAuthorityReset()}"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails 
					or ctBackingBean.managedBean.viewSCL or amendmentBackingBean.managedBean.committeeType eq null}"
					process="@this"
					update=":form:dialogSecretaryApprovingAuthority, :form:searchPanelSecretary, :form:searchResultSecretary"
					onstart="blockWidget.show();"
					oncomplete="blockWidget.hide(); dialogSecretaryApprovingAuthorityVar.show();">
					<p:graphicImage value="/css/images/design/ico-search.png" />
				</p:commandLink>
			</h:panelGrid>
			<f:verbatim />
		</h:panelGrid>
		<!-- #24336 - End -->

		<h:panelGrid id="approvingAuthorityContractApprover" columns="2"
			style="width:100%" columnClasses="columnWidth170">
			<h:outputText />
			<h:panelGrid columns="2">
				<p:selectBooleanCheckbox id="approverAuthorityReq"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.approverAuthorityReq}"
					disabled="#{!amendmentBackingBean.isContractAmountAmend() 
					or ctBackingBean.managedBean.viewSCL or ctBackingBean.managedBean.disableAmendDetails}" />
				<!-- Enhancement 15851 - shaqimi, Redmine- #40000 -->
				<p:outputLabel value="#{lbl['lbl.ct.contract.approval']}"
					style="text-align:left" />
			</h:panelGrid>
		</h:panelGrid>

		<h:panelGroup id="approvalLetterPanel">
			<h:panelGrid columns="2" style="width:100%"
				columnClasses="columnWidth170"
				rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.valueChangeByGst}">
				<p:outputLabel value="#{lbl['lbl.ct.approval.letter']}"
					styleClass="required" />
				<h:panelGroup id="uploadApprovalLetter">
					<p:commandButton
						oncomplete="uploadApprovalLetterDlg.show();return false;"
						update="uploadApprovalLetter, uploadApprovalLetterDlg"
						icon="ui-icon-upload"
						rendered="#{ctBackingBean.managedBean.contractVer.approvalLetterAttachement.filePath == null}"
						disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}" />
					<!-- Enhancement 15851 - shaqimi -->
					<h:commandLink
						value="#{ctBackingBean.managedBean.contractVer.approvalLetterAttachement.fileName}"
						rendered="#{ctBackingBean.managedBean.contractVer.approvalLetterAttachement.filePath != null}"
						styleClass="blue_font"
						action="#{ctBackingBean.commonDownload(ctBackingBean.managedBean.contractVer.approvalLetterAttachement.filePath, 
						ctBackingBean.managedBean.contractVer.approvalLetterAttachement.fileName)}" />
					<p:spacer width="3" />
					<p:commandLink onclick="deleteApprovalLetterDlg.show();"
						rendered="#{ctBackingBean.managedBean.contractVer.approvalLetterAttachement.filePath != null}"
						disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}">
						<!-- Enhancement 15851 - shaqimi -->
						<h:graphicImage value="/css/images/design/icon_trash.png"
							styleClass="tasklist_title1" />
					</p:commandLink>
					<p:spacer width="1" />
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.approval.letter']}" />
				</h:panelGroup>
			</h:panelGrid>
		</h:panelGroup>
	</p:panel>
	<!-- Enhancement 24336 -->

	<!-- #37808 start -->
	<p:dialog id="dialogSecretaryApprovingAuthority"
		header="#{lbl['lbl.ct.secretary.desk.officer']}"
		widgetVar="dialogSecretaryApprovingAuthorityVar" resizable="false"
		styleClass="pop_up_top" modal="true" width="500" fitViewport="true">

		<p:panel id="searchPanelSecretary" header="#{lbl['lbl.ct.secretary.search']}"
			toggleable="true" toggleSpeed="500">
			<h:panelGrid columns="4">
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel for="ministrySecretary"
					value="#{lbl['lbl.ct.ministry']}" />
				<p:spacer height="1" />
				<p:selectOneMenu id="ministrySecretary" style="width:300px"
					value="#{amendmentBackingBean.managedBean.ministryProfileId}">
					<f:selectItems
						value="#{amendmentBackingBean.getDropdownCommittee(CtConst.dropdownMinistryCommittee)}" />
					<p:ajax process="@this" partialSubmit="true" event="change"
						update=":form:searchPanelSecretary, :form:jabatanSecretary,:form:ptjSecretary,:form:searchResultSecretary"
						listener="#{amendmentBackingBean.resetSecretaryDropdown(CtConst.dropdownMinistryCommittee)}"/>
				</p:selectOneMenu>
				<p:spacer height="1" />

				<p:outputLabel for="jabatanSecretary"
					value="#{lbl['lbl.ct.jabatan']}" />
				<p:spacer height="1" />
				<p:selectOneMenu id="jabatanSecretary" style="width:300px"
					value="#{amendmentBackingBean.managedBean.jabatanProfileId}">
					<f:selectItems
						value="#{amendmentBackingBean.getDropdownCommittee(CtConst.dropdownJabatanCommittee)}" />
					<p:ajax event="change" process="@this" partialSubmit="true"
						update=":form:searchPanelSecretary,:form:ptjSecretary,:form:searchResultSecretary"
						listener="#{amendmentBackingBean.resetSecretaryDropdown(CtConst.dropdownJabatanCommittee)}"/>
				</p:selectOneMenu>
				<p:spacer height="1" />

				<p:outputLabel for="ptjSecretary" value="#{lbl['lbl.ct.ptj.code']}" />
				<p:spacer height="1" />
				<p:selectOneMenu id="ptjSecretary" style="width:300px"
					value="#{amendmentBackingBean.managedBean.ptjProfileId}">
					<f:selectItems
						value="#{amendmentBackingBean.getDropdownCommittee(CtConst.dropdownPtjCommittee)}" />
					<p:ajax event="change" process="@this" partialSubmit="true"
						update=":form:searchPanelSecretary,:form:searchResultSecretary"
						listener="#{amendmentBackingBean.resetSecretaryDropdown(CtConst.dropdownPtjCommittee)}"/>
				</p:selectOneMenu>
				<p:spacer height="1" />

				<p:selectOneMenu for="secretarySearchOption"
					value="#{amendmentBackingBean.managedBean.secretaryIcName}"
					style="width:150px;">
					<f:selectItem itemLabel="#{lbl['lbl.ct.secretary.name']}"
						itemValue="#{CtConst.secretaryName}" />
					<f:selectItem itemLabel="#{lbl['lbl.ct.secretary.ic']}"
						itemValue="#{CtConst.secretaryIc}" />
				</p:selectOneMenu>
				<p:spacer height="1" />

				<p:inputText id="secretaryIcNameSearchValues" style="width:300px;"
					value="#{amendmentBackingBean.managedBean.secretaryIcNameSearchValues}" />
			</h:panelGrid>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}" process="@this"
					partialSubmit="true"
					action="#{amendmentBackingBean.searchSecretaryApprovingAuthority}"
					update=":form:searchResultSecretary" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}" process="@this"
					partialSubmit="true"
					action="#{amendmentBackingBean.searchSecretaryApprovingAuthorityReset}"
					update=":form:searchPanelSecretary, :form:searchResultSecretary" />
			</div>
		</p:panel>

		<p:panel id="searchResultSecretary"
			header="#{lbl['lbl.ct.search.result']}" toggleable="true"
			toggleSpeed="500">

			<p:dataTable id="searchSecretaryTable" var="data"
				value="#{amendmentBackingBean.managedBean.secretaryDataModel}"
				rowKey="#{data}" selectionMode="single"
				selection="#{amendmentBackingBean.managedBean.selectedSecretary}"
				rows="10" lazy="true" rowIndexVar="index">
				<ac:paginator for="searchSecretaryTable" />
				<p:ajax event="rowSelect" process="@this"
					update=":form:selectButtonSecretary" />

				<p:column style="width:20%;white-space:normal;"
					headerText="#{lbl['lbl.ct.secretary.name']}">
					<div align="left">
						<h:outputText value="#{data.userName}" />
					</div>
				</p:column>

				<p:column style="width:10%;"
					headerText="#{lbl['lbl.ct.secretary.ic']}">
					<div align="left">
						<h:outputText value="#{data.identificationNo}" />
					</div>
				</p:column>
			</p:dataTable>

			<f:facet name="footer">
				<h:panelGrid columns="2"
					style="float:right;height:50px;vertical-align: middle;">
					<p:commandButton value="#{lbl['lbl.btn.select']}"
						process="@this,dialogSecretaryApprovingAuthority"
						id="selectButtonSecretary"
						disabled="#{amendmentBackingBean.managedBean.selectedSecretary eq null}"
						action="#{amendmentBackingBean.setSelectedSecretarySearch()}"
						update="approvingAuthoritySecretary,dialogSecretaryApprovingAuthority"
						oncomplete="dialogSecretaryApprovingAuthorityVar.hide();" />
					<p:commandButton value="#{lbl['lbl.btn.close']}" type="button"
						ajax="false"
						onclick="dialogSecretaryApprovingAuthorityVar.hide();" />
				</h:panelGrid>
			</f:facet>
		</p:panel>
	</p:dialog>
	<!-- #37808 end -->

	<p:confirmDialog id="deleteApprovalLetterDlg"
		widgetVar="deleteApprovalLetterDlg"
		message="#{lbl['lbl.msg.confirm.delete']}" severity="alert"
		closable="true" appendToBody="true"
		header="#{lbl['lbl.msg.confirm.delete.header']}">
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" process="@this"
				partialSubmit="true"
				update=":form:uploadApprovalLetter, :form:uploadApprovalLetterDlg"
				action="#{ctBackingBean.deleteAttachmentAction(ctBackingBean.managedBean.contractVer.approvalLetterAttachement)}"
				oncomplete="deleteApprovalLetterDlg.hide();" />
			<p:commandButton value="#{lbl['lbl.btn.no']}"
				onclick="deleteApprovalLetterDlg.hide();" type="button" />
		</div>
	</p:confirmDialog>
	<p:dialog id="uploadApprovalLetterDlg"
		widgetVar="uploadApprovalLetterDlg" modal="true" resizable="false"
		width="700px" height="350px" styleClass="pop_up_top"
		header="#{lbl['lbl.txt.choose.files']}"
		onShow="singleUploadListener(approvalLetterUploadWV);">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced"
			dragDropSupport="false" id="approvalLetterId"
			fileUploadListener="#{ctBackingBean.fileUpload}" showButtons="false"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			multiple="false"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			widgetVar="approvalLetterUploadWV"
			invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}"
			update="uploadApprovalLetter" label="#{lbl['lbl.btn.choose']}"
			oncomplete="uploadApprovalLetterDlg.hide();">
		</p:fileUpload>
		<f:facet name="footer">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.close']}" type="button"
					ajax="false" onclick="uploadApprovalLetterDlg.hide();" />
			</div>
		</f:facet>
	</p:dialog>
</ui:composition>
