<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="approvingAuthority" header="#{lbl['lbl.ct.menu.approving.authority']}" toggleable="true" toggleSpeed="500">
		<!-- END 24336 -->
		<h:panelGrid id="approvingAuthorityPanel" columns="2" style="width:100%" columnClasses="columnWidth170">
			<p:outputLabel value="#{lbl['lbl.ct.approving.authority']}" styleClass="required" />
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.contractVer.ctAmendment.mofAuthorityReq}"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL or amendmentBackingBean.isContractAmountAmend()}">
				</p:selectBooleanCheckbox><!-- Enhancement 15851 - shaqimi -->
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.mof']}" style="text-align:left" />
			</h:panelGrid>
			<f:verbatim/>
			<h:panelGrid columns="4">
				<p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.contractVer.ctAmendment.pbqcAuthorityReq}"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL or amendmentBackingBean.isContractAmountAmend()}">
					<p:ajax event="change" update=":form:approvingAuthority, :form:approvingAuthoritySecretary" process="@all"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
						listener="#{amendmentBackingBean.resetPbqcAuthoritySelection}" /> <!-- #24336 -->
				</p:selectBooleanCheckbox><!-- Enhancement 15851 - shaqimi -->
				<p:spacer width="2" />
				<!-- #24336 - Start -->
				<p:outputLabel value="#{lbl['lbl.ct.committee.type']}" style="text-align:left" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.committee.type']}" />
				<!-- #24336 - End -->
			</h:panelGrid>
			<f:verbatim/>
			<!-- #24336 - Start -->
			
			<h:panelGrid id="committeeTypeGrid" columns="2" style="width:100%" columnClasses="columnWidth30" rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.pbqcAuthorityReq}" >
				<h:outputText />
				<p:selectOneRadio id="committeeType" styleClass="committee-type-radio" layout="pageDirection"
					value="#{amendmentBackingBean.managedBean.committeeType}" disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}">
					<f:selectItems value="#{amendmentBackingBean.getCommitteeTypeSelectItems()}" />
					<p:ajax event="change" update="secretaryId" process="@this" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/>
				</p:selectOneRadio>
			</h:panelGrid>
			<f:verbatim/>
		</h:panelGrid>
		
		<h:panelGrid id="approvingAuthoritySecretary" columns="2" style="width:100%" columnClasses="columnWidth60">
			<h:outputText />
			<h:panelGrid columns="4" rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.pbqcAuthorityReq}">
				<p:outputLabel value="#{lbl['lbl.ct.secretary.committee']}" />
				<p:spacer width="2" />
				<p:selectOneMenu id="secretaryId" value="#{amendmentBackingBean.managedBean.secretaryId}"
					label="#{lbl['lbl.ct.secretary.committee']}" style="width:300px;"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL or amendmentBackingBean.managedBean.committeeType eq null}">
					<f:selectItems value="#{amendmentBackingBean.getSecretaryDropdownList()}" />
				</p:selectOneMenu>
				<p:commandLink action="#{terminationBackingBean.resetSearchAgency()}" 
						disabled="#{terminationBackingBean.managedBean.viewContract or terminationBackingBean.managedBean.disableField}"
						process="@this"	update=":form:searchAgencyPanel" oncomplete="searchAgencyDlg.show();">
					<p:graphicImage value="/css/images/design/ico-search.png" /></p:commandLink>
			</h:panelGrid>
			<f:verbatim/>
		</h:panelGrid>
			<!-- #24336 - End -->
		
		<h:panelGrid id="approvingAuthorityContractApprover" columns="2" style="width:100%" columnClasses="columnWidth170">
			<h:outputText />
			<h:panelGrid columns="2">
				<p:selectBooleanCheckbox id="approverAuthorityReq"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.approverAuthorityReq}"
					disabled="#{!amendmentBackingBean.isContractAmountAmend() or ctBackingBean.managedBean.viewSCL or ctBackingBean.managedBean.disableAmendDetails}" />
				<!-- Enhancement 15851 - shaqimi, Redmine- #40000 -->
				<p:outputLabel value="#{lbl['lbl.ct.contract.approval']}" style="text-align:left" />
			</h:panelGrid>
		</h:panelGrid>

		<h:panelGroup id="approvalLetterPanel">
			<h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth170"
				rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.valueChangeByGst}">
				<p:outputLabel value="#{lbl['lbl.ct.approval.letter']}" styleClass="required" />
				<h:panelGroup id="uploadApprovalLetter">
					<p:commandButton oncomplete="uploadApprovalLetterDlg.show();return false;"
						update="uploadApprovalLetter, uploadApprovalLetterDlg" icon="ui-icon-upload"
						rendered="#{ctBackingBean.managedBean.contractVer.approvalLetterAttachement.filePath == null}"
						disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}" />
					<!-- Enhancement 15851 - shaqimi -->
					<h:commandLink value="#{ctBackingBean.managedBean.contractVer.approvalLetterAttachement.fileName}"
						rendered="#{ctBackingBean.managedBean.contractVer.approvalLetterAttachement.filePath != null}"
						styleClass="blue_font"
						action="#{ctBackingBean.commonDownload(ctBackingBean.managedBean.contractVer.approvalLetterAttachement.filePath, ctBackingBean.managedBean.contractVer.approvalLetterAttachement.fileName)}" />
					<p:spacer width="3" />
					<p:commandLink onclick="deleteApprovalLetterDlg.show();"
						rendered="#{ctBackingBean.managedBean.contractVer.approvalLetterAttachement.filePath != null}"
						disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}">
						<!-- Enhancement 15851 - shaqimi -->
						<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1" />
					</p:commandLink>
					<p:spacer width="1" />
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.approval.letter']}" />
				</h:panelGroup>
			</h:panelGrid>
		</h:panelGroup>
	</p:panel> <!-- Enhancement 24336 -->

	<p:confirmDialog id="deleteApprovalLetterDlg" widgetVar="deleteApprovalLetterDlg"
		message="#{lbl['lbl.msg.confirm.delete']}" severity="alert" closable="true" appendToBody="true"
		header="#{lbl['lbl.msg.confirm.delete.header']}">
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" process="@this" partialSubmit="true"
				update=":form:uploadApprovalLetter, :form:uploadApprovalLetterDlg"
				action="#{ctBackingBean.deleteAttachmentAction(ctBackingBean.managedBean.contractVer.approvalLetterAttachement)}"
				oncomplete="deleteApprovalLetterDlg.hide();" />
			<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="deleteApprovalLetterDlg.hide();" type="button" />
		</div>
	</p:confirmDialog>
	<p:dialog id="uploadApprovalLetterDlg" widgetVar="uploadApprovalLetterDlg" modal="true" resizable="false"
		width="700px" height="350px" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}"
		onShow="singleUploadListener(approvalLetterUploadWV);">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" dragDropSupport="false" id="approvalLetterId"
			fileUploadListener="#{ctBackingBean.fileUpload}" showButtons="false"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" multiple="false"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}" widgetVar="approvalLetterUploadWV"
			invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}" update="uploadApprovalLetter"
			label="#{lbl['lbl.btn.choose']}" oncomplete="uploadApprovalLetterDlg.hide();">
		</p:fileUpload>
		<f:facet name="footer">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false"
					onclick="uploadApprovalLetterDlg.hide();" />
			</div>
		</f:facet>
	</p:dialog>
</ui:composition>
