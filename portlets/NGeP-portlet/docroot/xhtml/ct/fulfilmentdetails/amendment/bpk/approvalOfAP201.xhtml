<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	 <p:panel id="approvalForAP201" header="Special Approval for AP201" toggleable="true" toggleSpeed="500">
		<h:panelGrid style="width:100%" columnClasses="columnWidth15">
			<p:outputLabel value="Referring to AP201, the followings are the reasons where contract needs special approval:-" style="float:left;font:bold;" />
			<p:spacer height="10"/>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox  disabled="true"
				   > 
					</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value="Contract is not active" />
			</h:panelGrid>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="true"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange}" >
					 </p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value="Changes of Unit Price" />
			</h:panelGrid>
		    <h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="true"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.clauseChange}" >
					</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value=" Change of Term and Condition of Contract" />
			</h:panelGrid>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="true"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}"  >
					</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value="Extension is done more than once and period of extension exceed 2 years" />
			</h:panelGrid>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="true"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange}" >
				</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value=" Additional Quantity exceed the 50% of the original quantity and additional contract value exceeded RM7.5M and Total Contract Value exceed RM25M (Product)"  />
			</h:panelGrid>
	        <h:panelGrid columns="3">
			<p:selectBooleanCheckbox disabled="true"
				value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange}"  />
			    <p:spacer width="2" />
				<p:outputLabel value=" Additional contract value exceeded RM7.5 M and Total Contract Value exceed RM25M" />
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
	 <p:panel header="Remarks" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{amendmentBackingBean.managedBean.contractVer.ap201Remark}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{amendmentBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		  	
</ui:composition>
