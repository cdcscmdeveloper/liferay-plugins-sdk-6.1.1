<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="approvalForAP201" header="#{lbl['lbl.ct.menu.special.ap201']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid style="width:100%" columnClasses="columnWidth15">
			<p:outputLabel style="float:left;font:bold;"
				value="#{lbl['lbl.ct.special.ap201.content']}" />
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="true" 
				    value="#{ctBackingBean.managedBean.contractVer.ctContract.recordStatusFlg!=1}" />
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.contract.not.active']}" />
			</h:panelGrid>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="true" 
				   value="#{ctBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange}" />
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.change.item.price']}" />
			</h:panelGrid>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="true" 
				   value="#{ctBackingBean.managedBean.contractVer.ctAmendment.clauseChange}" />
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.change.contract.clause']}" />
			</h:panelGrid>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="true" value="#{amendmentBackingBean.breachAP201Rules(1)}" />
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.extension.exceed.2years']}" />
			</h:panelGrid>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="true" value="#{amendmentBackingBean.breachAP201Rules(2)}" />
				<p:spacer width="2" />
				<p:outputLabel value="#{amendmentBackingBean.getAdditionalQtyLabel()}" />
			</h:panelGrid>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="true" value="#{amendmentBackingBean.breachAP201Rules(3)}" />
				<p:spacer width="2" />
				<p:outputLabel value="#{amendmentBackingBean.getAdditionalValueLabel()}" />			
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
	<p:panel header="#{lbl['lbl.ct.panel.remarks.attachment']}" toggleable="true">		
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.attachment']}" escape="false"/><br/><br/>
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%">
								
									<p:outputLabel value="#{lbl['lbl.txt.remarks']}" styleClass="required" />
								
							</td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{ctBackingBean.managedBean.contractVer.ap201Remark}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{amendmentBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" 
													disabled="#{ctBackingBean.managedBean.viewContract 
														or (ctBackingBean.managedBean.taskId != null and !bpmTasklistBackingBean.managedBean.claim)}"  autoResize="false" 
													onkeyup="limitTextArea(this,1000);" onkeydown="limitTextArea(this,1000);">
											 	</h:inputTextarea>
												<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.remark']}" rendered="#{remarkIndex==0}" />
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
					<table style="width: 100%">
				    <tr>
				    	<td class="TableFieldLeft" width="24%">
				  			<p:outputLabel value="#{lbl['lbl.txt.attachment']}" styleClass="required" />
				    	</td>
			           	<td class="TableFieldRight">
				        	<p:commandButton oncomplete="uploadDlg2.show();return false;"
					        	update="lampiran1, uploadDlg2" value="#{lbl['lbl.ct.upload.attach.files']}"
					        	disabled="#{ctBackingBean.managedBean.viewContract
					        		or (ctBackingBean.managedBean.taskId != null and !bpmTasklistBackingBean.managedBean.claim)}" />
			           	</td>
		           	</tr>
		            <tr>
		            	<td/>
		            	<td>
	            		<p:dataGrid id="lampiran1" value="#{ctBackingBean.managedBean.contractVer.ap201Attachements}"
				           var="attachFile" rowIndexVar="attachFileIndex" columns="1" style="width:100%">
							<table>
								<tr>
							       	<td rowspan="2"><h:graphicImage value="/css/images/design/#{ctBackingBean.determineIcon(attachFile)}" height="30" width="30"/></td>
							       	<td width="5"></td>
							       	<td>
							       		<h:outputText value=" #{attachFile.createdUser.userName}"></h:outputText>,
								       	<h:outputText value="#{attachFile.createdDate}">
									   		<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
						   				</h:outputText>
									</td>
								</tr>
								<tr>
								<td></td>
								<td>
									<h:commandLink value="#{attachFile.fileName}" 
										styleClass="blue_font" action="#{ctBackingBean.downloadFile(attachFile)}" />
				 	 				<p:commandLink onclick="deleteAttachmentDlgObj.show();" action="#{amendmentBackingBean.setAttachFileIndex(attachFileIndex)}"
										rendered="#{ctBackingBean.compareUserName(attachFile.createdUser.loginId)}">
				   						<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
				 	 				</p:commandLink>
		 	 					</td>
								</tr>
							</table>
						</p:dataGrid>
						</td>
					</tr>
					</table>

					<p:dialog id="uploadDlg2" widgetVar="uploadDlg2" modal="true" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
						<p:ajax event="close" />
						<p:fileUpload style="display:inline;"
						   sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
							fileUploadListener="#{amendmentBackingBean.ap201FileUpload}"
							mode="advanced" id="upload201"
							allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
							invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}" 
							update="lampiran1" >
						</p:fileUpload> 
					</p:dialog>
	
					<p:dialog id="deleteAttachmentDlgId" widgetVar="deleteAttachmentDlgObj"
				      	styleClass="screen-title" modal="true" width="330">  
				 		<h:panelGrid columns="3">
				 			<p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
						   	<p:spacer width="10"/>
				            <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.delete.attachment.msg']}</div>
				     	</h:panelGrid>
						<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.yes']}"  update="lampiran1" process="@form" 
					     		actionListener="#{amendmentBackingBean.deleteAttachmentAction(amendmentBackingBean.managedBean.attachFileIndex)}" 
					     		onclick="deleteAttachmentDlgObj.hide();"/>
						 	<p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteAttachmentDlgObj1.hide();" type="button" />
					 	</div>
					</p:dialog>	
				</td>
			</tr>
		</table>
	</p:panel>		  	
</ui:composition>
