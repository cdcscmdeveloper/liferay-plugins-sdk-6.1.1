<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="fd" header="Contract Details" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="4" style="width:100%" columnClasses="columnWidth15">
			<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
			<p:inputText value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}" style="width:170px;" disabled="true" />
			<p:outputLabel value="#{lbl['lbl.ct.physicalNo']}" />
			<p:inputText value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}" style="width:170px;" disabled="true" />				
			<p:outputLabel value="#{lbl['lbl.ct.effectiveDate']}" />
			<p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate}"
				id="popupCal1" showOn="button" />
			<h:outputLabel value="#{lbl['lbl.ct.edate']}" />
			<p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate}"
				id="popupCal" showOn="button" />
			<p:outputLabel value="#{lbl['lbl.ct.amend.txt.rno']}" />
			<p:inputText disabled="true" style="width:170px;" value="#{contractDetailsBackingBean.managedBean.contractVer.docNo}" />
			<p:outputLabel value="#{lbl['lbl.ct.contractAmount']}" />
			<p:inputText disabled="true" styleClass="ppRightBtn"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.contractAmount}" >
				<f:convertNumber pattern="#,###.00" />
			</p:inputText>			
			<h:panelGroup>
				<div style="height: 40px; vertical-align: top;">
					<p:outputLabel for="contractName" value="Contract Title" />
				</div>
			</h:panelGroup>
			<h:panelGrid>
				<p:inputTextarea id="contractName"
					value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.contractName}"
					required="false" rows="2" cols="30" disabled="true"
					autoResize="false" />	
			</h:panelGrid>		
			<f:verbatim />
			<f:verbatim />
			<f:verbatim />
			<h:outputLabel
				rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				value="#{lbl['lbl.ct.circularNo']}" />
			<p:commandLink
				rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				style="margin-right:20px;" ajax="false">
				<h:outputText
					value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo}"
					styleClass="linkcommand" />
			</p:commandLink>
		</h:panelGrid>
	</p:panel>
</ui:composition>
