<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="loaContents" header="#{lbl['lbl.ct.panel.loa.contents']}" toggleable="true" toggleSpeed="500">
	    <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.loa.letter']}" escape="false"/><br/>
	    <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.loa.file.format']}" escape="false"/><br/><br/>
		<h:panelGrid columns="2" style="width:900px;" >
		<h:panelGrid columns="3" style="width:500px;" >
				<p:outputLabel value="#{lbl['lbl.ct.amend.loa.gov.sign.date']}" styleClass="required" style="width:250px;"/> 
     			<p:calendar style="width:80px;" id="signDateLoaId" showOn="button"  readonlyInput="true" navigator="true"
			   		 	pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
					    label="#{lbl['lbl.ct.amend.loa.gov.sign.date']}" 
					     disabled="#{amendmentBackingBean.disableBtn(0)}"
					    value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.govtSignDate}">
				</p:calendar>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
		</h:panelGrid>
			<h:panelGrid columns="3" style="width:400px;">
				<p:outputLabel value="#{lbl['lbl.ct.amend.loa.agency.no']}" styleClass="required" style="width:200px;" /> 
				 <h:outputText style="text-align:left;float:left;"
				   value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.scLoiLoa.fileNo}-#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.fileExtNo}"  /> 
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.loa.agency.no']}" />
		</h:panelGrid>
	</h:panelGrid>
		<p:spacer height="5"/>
		
		<p:dataTable id="loaContentDt" var="loaReportVar" rowIndexVar="index"
	    		 value="#{amendmentBackingBean.managedBean.ctLetterOfAcceptance}">
				 <p:column headerText="#{lbl['lbl.ct.contents']}" style="width:45%;" styleClass="column-align-center">
					    <h:outputText value="#{loaReportVar.contentTypeDesc}" style="float:left;" />
					   
			     </p:column>
				 
				 <p:column headerText="#{lbl['lbl.ct.amend.sample']}" styleClass="column-align-center" style="width:10%;">
                     	 <h:commandLink  action="#{amendmentBackingBean.downloadLOAContentFile(index)}"  immediate="true'"
               			          disabled="#{amendmentBackingBean.disableBtn(index)}">
								 <p:graphicImage value="/css/images/design/ico-download.png" title="#{lbl['lbl.txt.file.download']}" />
					     </h:commandLink>
					  <p:outputPanel rendered="#{index == 0}">
					    	<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.loa.ct.letter']}"  />
					   </p:outputPanel>
					<p:outputPanel rendered="#{index == 1}">
					    	<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.loa.sup.letter']}"  />
					  </p:outputPanel>
				 </p:column>
				 
				 <p:column headerText="#{lbl['lbl.ct.action']}" styleClass="column-align-center" style="width:45%;">
					 <h:panelGroup id="uploadLetterPg">
						   <p:commandButton icon="ui-icon-upload-arrow"  rendered="#{loaReportVar.loaAttachments.filePath == null}"
								   disabled="#{amendmentBackingBean.disableBtn(index)}" process="@this" partialSubmit="true"
								   update=":form:loaContentDt, :form:uploadLetterDlg" oncomplete="uploadLetterDlg.show();return false;" >
							</p:commandButton>
							<h:commandLink rendered="#{loaReportVar.loaAttachments.filePath != null}" title="#{loaReportVar.loaAttachments.fileName}"
							         value="#{loaReportVar.loaAttachments.fileName}"
									action="#{amendmentBackingBean.downloadFile(loaReportVar.loaAttachments.filePath, loaReportVar.loaAttachments.fileName)}">
							</h:commandLink>							
							<p:spacer width="1"/>
							<p:commandLink onsuccess="deleteUploadLetterDlg.show();" 
						         	   disabled="#{amendmentBackingBean.disableBtn(index) or loaReportVar.loaAttachments.filePath == null}"
						           action="#{ctBackingBean.setAttachFileIndex(index)}" process="@this" partialSubmit="true">
			   					     <h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			 	 		  	 </p:commandLink>
					 	</h:panelGroup>
				  </p:column>
		 </p:dataTable>

			 <p:dialog id="uploadLetterDlg" widgetVar="uploadLetterDlg" height="auto" resizable="false" modal="true" 
		    	  width="700px" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}" onShow="singleUploadListener(letterUploadWV);">
					<p:ajax event="close" />
					<p:fileUpload style="display:inline;" mode="advanced"  dragDropSupport="false" 
					      sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"  showButtons="false"  
					      fileUploadListener="#{amendmentBackingBean.UploadLetterOfAcceptance}" multiple="false" 
					      allowTypes="/(\.|\/)(pdf)$/"  widgetVar="letterUploadWV"
					      invalidFileMessage="#{lbl['lbl.txt.upload.pdf.only']}"					      
						  invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}"
					      update=":form:loaContentDt" label="#{lbl['lbl.btn.choose']}" oncomplete="uploadLetterDlg.hide();" >
					</p:fileUpload>
					<f:facet name="footer">
							<div class="ppRightBtn">
			   					 <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadLetterDlg.hide();" />
	   						</div>
	   				</f:facet>
				</p:dialog>
		
				<p:confirmDialog id="deleteUploadLetterId" widgetVar="deleteUploadLetterDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
                		  severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                  		 <div class="ppRightBtn">
		               			<p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                      		 	  update=":form:loaContentDt" 
		                        		 action="#{amendmentBackingBean.deleteLoaAttachment(ctBackingBean.managedBean.attachFileIndex)}"
		                       			  oncomplete="deleteUploadLetterDlg.hide();"/>
			                	 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteUploadLetterDlg.hide();" type="button" />
		                 </div>
                   </p:confirmDialog>
	 	 </p:panel>
</ui:composition>
