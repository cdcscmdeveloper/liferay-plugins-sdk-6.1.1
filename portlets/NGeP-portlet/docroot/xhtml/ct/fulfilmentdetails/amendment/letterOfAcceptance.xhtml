<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="loaContents" header="#{lbl['lbl.ct.panel.loa.contents']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="loaContentDt" var="loaReportVar" 
		          value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.scLoaReports}"
		          selectionMode="single" selection="#{amendmentBackingBean.managedBean.selectedScLoaReports}" rowKey="#{loaReportVar}">
					         <p:ajax event="rowSelect" update=":form:delLoaContentBtn" />
						    <p:column headerText="#{lbl['lbl.ct.contents']}" style="width:50%;" styleClass="column-align-center">
						    <h:outputText value="#{loaReportVar.title}" style="float:left;" rendered="#{loaReportVar.definationType.parameterCode == ParameterConst.documentDefinitionTypeSystemDefined}" />
							<p:inputText value="#{loaReportVar.title}" style="width:90%;" maxlength="1000"  
							    disabled="#{amendmentBackingBean.managedBean.disableFinalAmendDetails}"
							rendered="#{loaReportVar.definationType.parameterCode == ParameterConst.documentDefinitionTypeUpload}"/>
					     </p:column>
						 <p:column style="width:15%;" styleClass="column-align-center">
						 	<f:facet name="header">
								<h:outputText value="#{lbl['lbl.ct.type']}"/>
						        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.content.type']}"/>
						  	</f:facet>
							<h:outputText style="float:left;"
								value="#{amendmentBackingBean.getParameterDesc(loaReportVar.definationType)}" />
						 </p:column>
						 <p:column headerText="#{lbl['lbl.btn.upload']}" styleClass="column-align-center" style="width:20%;">
							<h:panelGroup id="uploadLetterPg" rendered="#{loaReportVar.definationType.parameterCode == ParameterConst.documentDefinitionTypeUpload}">
								<p:commandButton icon="ui-icon-upload"  rendered="#{loaReportVar.scLoaReportAttachment.filePath == null}"
								   update=":form:loaContentDt, :form:uploadLetterDlg" oncomplete="uploadLetterDlg.show();return false;"  >
									<f:setPropertyActionListener value="#{loaReportVar}" 
									    target="#{amendmentBackingBean.managedBean.selectedScLoaReports}" />
								</p:commandButton>
								<h:commandLink rendered="#{loaReportVar.scLoaReportAttachment.filePath != null}" title="#{loaReportVar.scLoaReportAttachment.fileName}"
									value="#{amendmentBackingBean.getShortFileName(loaReportVar.scLoaReportAttachment.fileName)}"
									action="#{amendmentBackingBean.downloadFile(loaReportVar.scLoaReportAttachment.filePath, loaReportVar.scLoaReportAttachment.fileName)}">
								</h:commandLink>
							 </h:panelGroup>
						 </p:column>
						 <p:column headerText="#{lbl['lbl.ct.action']}" styleClass="column-align-center" style="width:10%;">
						    <h:panelGroup  rendered="#{loaReportVar.definationType.parameterCode == ParameterConst.documentDefinitionTypeUpload}">
						       <h:commandLink icon="ui-icon-download" action="#{amendmentBackingBean.downloadFile(loaReportVar.scLoaReportAttachment.filePath, loaReportVar.scLoaReportAttachment.fileName)}">
							       <p:graphicImage value="/css/images/design/ico-download.png" title="#{lbl['lbl.txt.file.download']}" />
							   </h:commandLink>
						    </h:panelGroup>
						     <h:panelGroup  rendered="#{loaReportVar.definationType.parameterCode == ParameterConst.documentDefinitionTypeSystemDefined}">
						         <h:commandLink icon="ui-icon-download" action="#{amendmentBackingBean.downloadDocFile(loaReportVar)}">
								    <p:graphicImage value="/css/images/design/ico-download.png" title="#{lbl['lbl.txt.file.download']}" />
							     </h:commandLink>
						    </h:panelGroup>
						  </p:column>
		  </p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"  process="@form"  rendered="#{amendmentBackingBean.managedBean.ackFA != 'Ack'}"
			    update=":form:loaContentDt" action="#{amendmentBackingBean.addLoaContents}" 
			    disabled="#{amendmentBackingBean.managedBean.disableFinalAmendDetails}"/>
			<p:spacer width="1" />
			<p:commandButton id="delLoaContentBtn" value="#{lbl['lbl.ct.delete']}" 
			  process="@this" partialSubmit="true" onsuccess="dlgDocumentDel.show();"
			   rendered="#{amendmentBackingBean.managedBean.ackFA != 'Ack'}"
			    disabled="#{amendmentBackingBean.managedBean.selectedScLoaReports == null or  (amendmentBackingBean.managedBean.selectedScLoaReports != null  and 
			            amendmentBackingBean.managedBean.selectedScLoaReports.definationType.parameterCode == ParameterConst.documentDefinitionTypeSystemDefined)
			            or amendmentBackingBean.managedBean.disableFinalAmendDetails}"/>
			<p:spacer width="1" />
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false" action="#{amendmentBackingBean.downloadAll()}" />
		 </div>
		 <p:dialog id="uploadLetterDlg" widgetVar="uploadLetterDlg" height="350px" resizable="false"
			modal="true" width="700px" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}"
			onShow="singleUploadListener(letterUploadWV);">
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;" mode="advanced"  dragDropSupport="false"
			    sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" showButtons="false" 
			    fileUploadListener="#{amendmentBackingBean.contentLetterUpload}" multiple="false"
				allowTypes="/(\.|\/)(pdf)$/" widgetVar="letterUploadWV"
				invalidFileMessage="#{lbl['lbl.txt.upload.pdf.only']}"  update=":form:loaContentDt"
				label="#{lbl['lbl.btn.choose']}" >
			</p:fileUpload>
			<f:facet name="footer">
			<div class="ppRightBtn">
			    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadLetterDlg.hide();" />
	   		</div>
	   		</f:facet>
		</p:dialog>
		 <p:confirmDialog id="dlgDocumentDel" widgetVar="dlgDocumentDel" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
			      <div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:loaContentDt,:form:delLoaContentBtn" 
						    process="@this" partialSubmit="true"  
						    actionListener="#{amendmentBackingBean.deleteLoaContents()}" oncomplete="dlgDocumentDel.hide();" />
						<p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgDocumentDel.hide();" type="button" />
			    </div>
		</p:confirmDialog>
	  </p:panel>
</ui:composition>
