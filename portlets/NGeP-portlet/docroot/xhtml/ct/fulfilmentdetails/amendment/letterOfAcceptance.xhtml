<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="loaContents" header="#{lbl['lbl.ct.panel.loa.contents']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="loaContentDt" var="data" 
		     value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.scLoaReports}"
		     selectionMode="single" selection="#{amendmentBackingBean.managedBean.selectedScLoaReports}" rowKey="#{data}">
		     <p:ajax event="rowSelect" update=":form:delLoaContentBtn" />
			 <p:column headerText="#{lbl['lbl.ct.contents']}" style="width:50%;">
			    <p:outputLabel value="#{data.title}" style="float:left;" rendered="#{data.definationType.parameterCode == ParameterConst.documentDefinitionTypeSystemDefined}" />
				<p:inputText value="#{data.title}" style="width:90%;" rendered="#{data.definationType.parameterCode == ParameterConst.documentDefinitionTypeUpload}"/>
		     </p:column>
			 <p:column headerText="#{lbl['lbl.ct.type']}" style="width:15%;">
				<p:outputLabel style="float:left;"
					value="#{amendmentBackingBean.getParameterDesc(data.definationType)}" />
			 </p:column>
			 <p:column headerText="#{lbl['lbl.btn.upload']}" styleClass="column-align-center" style="width:20%;">
				<h:panelGroup id="uploadLetterPg" rendered="#{data.definationType.parameterCode == ParameterConst.documentDefinitionTypeUpload}">
					<p:commandButton icon="iconAttachment"  rendered="#{data.scLoaReportAttachment.filePath == null}"
					   update=":form:loaContentDt" oncomplete="uploadLetterDlg.show();return false;"  >
						<f:setPropertyActionListener value="#{data}" 
						    target="#{amendmentBackingBean.managedBean.selectedScLoaReports}" />
					</p:commandButton>
					<h:commandLink rendered="#{data.scLoaReportAttachment.filePath != null}" value="#{data.scLoaReportAttachment.fileName}"
						action="#{amendmentBackingBean.downloadFile(data.scLoaReportAttachment.filePath, data.scLoaReportAttachment.fileName)}">
					</h:commandLink>
				 </h:panelGroup>
			 </p:column>
			 <p:column headerText="#{lbl['lbl.btn.action']}" styleClass="column-align-center" style="width:10%;">
			    <h:panelGroup  rendered="#{data.definationType.parameterCode == ParameterConst.documentDefinitionTypeUpload}">
			       <h:commandLink icon="ui-icon-download" action="#{amendmentBackingBean.downloadFile(data.scLoaReportAttachment.filePath, data.scLoaReportAttachment.fileName)}">
				       <p:graphicImage library="ep/images/design" name="download.png"
						   value="/css/images/design/download.png" title="#{lbl['lbl.txt.file.download']}" />
				   </h:commandLink>
			    </h:panelGroup>
			     <h:panelGroup  rendered="#{data.definationType.parameterCode == ParameterConst.documentDefinitionTypeSystemDefined}">
			         <h:commandLink icon="ui-icon-download" action="#{amendmentBackingBean.downloadDocFile(data)}">
					    <p:graphicImage library="ep/images/design" name="download.png"
						    value="/css/images/design/download.png" title="#{lbl['lbl.txt.file.download']}" />
				     </h:commandLink>
			    </h:panelGroup>
			  </p:column>
		  </p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"  process="@form"  
			    icon="ui-icon-add"	update=":form:loaContentDt" action="#{amendmentBackingBean.addLoaContents}" />
			<p:spacer width="1" />
			<p:commandButton id="delLoaContentBtn" value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" process="@form" onclick="dlgDocumentDel.show();"
			    disabled="#{amendmentBackingBean.managedBean.selectedScLoaReports == null or  (amendmentBackingBean.managedBean.selectedScLoaReports != null  and 
			            amendmentBackingBean.managedBean.selectedScLoaReports.definationType.parameterCode == ParameterConst.documentDefinitionTypeSystemDefined)}"/>
			<p:spacer width="1" />
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false"  icon="ui-icon-download" action="#{amendmentBackingBean.downloadAll()}" />
		 </div>
		 <p:dialog id="uploadLetterDlg" widgetVar="uploadLetterDlg" width="700px" 
		      height="350" modal="false" resizable="false"  styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
			  <p:ajax event="close" />
			  <p:fileUpload mode="advanced" fileUploadListener="#{amendmentBackingBean.contentLetterUpload}"
				  allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"  style="display:inline;"
				  invalidFileMessage="#{lbl['lbl.ct.upload.invalid.msg']}" update=":form:loaContentDt">
			 </p:fileUpload>
		 </p:dialog>
		 <p:dialog id="dlgDocumentDel" widgetVar="dlgDocumentDel"  modal="true" width="350"
		    header="#{lbl['lbl.ct.dialog.confirm.header']}" styleClass="screen-title" resizable="false"  height="95">
			 <h:panelGrid columns="3">
				 <p:graphicImage library="ep/images/design" name="exclamation.png"
					 value="/css/images/design/exclamation.png" styleClass="ui-icon-complain" />
				<p:spacer width="10" />
				<p:inputTextarea rows="2" cols="48" 
				     styleClass="ui-inputtextarea" value="Are you sure you want to delete this record?" />
			 </h:panelGrid>
			 <div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept"  update=":form:loaContentDt" 
				    process="@form"  actionListener="#{amendmentBackingBean.deleteLoaContents()}" onclick="dlgDocumentDel.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
				    icon="ui-icon-reject" onclick="dlgDocumentDel.hide();" type="button" />
			</div>
		</p:dialog>
	  </p:panel>
	  <p:panel id="letterOfAcceptance" header="Letter of Acceptance" toggleable="true" toggleSpeed="500">
	     <h:panelGroup id="uploadLoaPg">
			  <h:panelGrid columns="5">			  	  
			  	  <p:outputLabel value="*" styleClass="mandatory" />
			  	  <p:outputLabel value="#{lbl['lbl.txt.attachment']}" />
				  <p:commandButton icon="iconAttachment" 
				       oncomplete="uploadLoaDlg.show();return false;" value="Upload" update="uploadLoaPg" />
				 <p:spacer width="1" />
				 <h:commandLink style="float:left;" styleClass="blue_font" 
				     value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.scLoaAttachment.fileName}"
				     rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.scLoaAttachment != null}"
					action="#{amendmentBackingBean.downloadFile(amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.scLoaAttachment.filePath,
						amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.scLoaAttachment.fileName)}" />
			</h:panelGrid>
		</h:panelGroup>
		<p:dialog id="uploadLoaDlg" widgetVar="uploadLoaDlg"  modal="false" resizable="false"
		    width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;" mode="advanced"
				fileUploadListener="#{amendmentBackingBean.letterOfAcceptenceUpload}"
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
				invalidFileMessage="#{lbl['lbl.ct.upload.invalid.msg']}"
				update=":form:uploadLoaPg">
			</p:fileUpload>
		</p:dialog>		
	</p:panel>
</ui:composition>
