<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="loaContents" header="#{lbl['lbl.ct.amend.loacontents']}" toggleable="true" toggleSpeed="500">
		<p:dataTable id="loaContentDt" var="data" value="#{amendmentBackingBean.loaDocumentList}">
			<p:column headerText="Content" style="width:40%;">
				<p:outputLabel value="#{data.docName}" style="float:left;" />
			</p:column>
			<p:column headerText="Type" style="width:20%;">
				<p:outputLabel style="float:left;"
					value="#{amendmentBackingBean.getParameterDesc(data.docDefinitionTypeCode)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.btn.upload']}" styleClass="column-align-center" style="width:15%;">
				<h:panelGroup id="uploadLetterPg" rendered="#{data.docDefinitionTypeCode.parameterCode == ParameterConst.documentDefinitionTypeUpload}">
					<p:commandButton oncomplete="uploadLetterPg.show();return false;"
						icon="iconAttachment" update=":form:loaContentDt" />
				</h:panelGroup>
			</p:column>
			<p:column headerText="Action" styleClass="column-align-center" style="width:20%;">
				<h:commandLink icon="ui-icon-download" action="#{amendmentBackingBean.downloadDocFile(data.docName)}">
					<p:graphicImage library="ep/images/design" name="download.png"
						value="/resources/ep/images/design/download.png" title="File Download" />
				</h:commandLink>
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" icon="ui-icon-add"	update="loaContentDt"
				action="#{amendmentBackingBean.addLoaContents}" />
			<p:spacer width="1" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" process="@form" onclick="dlgDocumentDel.show();" />
			<p:spacer width="1" />
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false" icon="ui-icon-download" action="#{amendmentBackingBean.downloadAll()}" />
		</div>
		<p:dialog id="uploadLetterDlg" widgetVar="uploadLetterDlg"
			modal="false" resizable="false" width="700px" height="350"
			styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;" mode="advanced"
				fileUploadListener="#{amendmentBackingBean.fileUpload}"
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
				invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
				update=":form:loaContentDt">
			</p:fileUpload>
		</p:dialog>
		<p:dialog id="dlgDocumentDel" widgetVar="dlgDocumentDel" header="#{lbl['lbl.ct.dialong.cofirm.header']}" styleClass="screen-title"
			resizable="false" modal="true" width="350" height="95">
			<h:panelGrid columns="3">
				<p:graphicImage library="ep/images/design" name="exclamation.png"
					value="/resources/ep/images/design/exclamation.png"
					styleClass="ui-icon-complain" />
				<p:spacer width="10" />
				<p:inputTextarea rows="2" cols="48" styleClass="ui-inputtextarea"
					value="Are you sure you want to delete this record?" />
			</h:panelGrid>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" icon="ui-icon-accept" update="loaContentDt" process="@form"
					actionListener="#{amendmentBackingBean.deleteLoaContents()}"
					onclick="dlgDocumentDel.hide();" />
				<p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" icon="ui-icon-reject" onclick="dlgDocumentDel.hide();" type="button" />
			</div>
		</p:dialog>
	</p:panel>
	<p:panel id="letterOfAcceptance" header="Letter of Acceptance" toggleable="true" toggleSpeed="500">
		<h:panelGroup id="uploadLoaPg">
			<h:panelGrid columns="3">
				<p:outputLabel value="#{lbl['lbl.txt.attachment']}" />
				<p:commandButton oncomplete="uploadLoaDlg.show();return false;"
					icon="iconAttachment" value="Upload" update="uploadLoaPg" />
				<p:spacer width="1" />
				<h:commandLink value="#{amendmentBackingBean.managedBean.contractVer}"
					style="float:left;" styleClass="blue_font"
					rendered="#{amendmentBackingBean.managedBean.contractVer == null}"
					action="#{amendmentBackingBean.downloadFile(supplierBackingBean.managedBean.contractVer)}" />
			</h:panelGrid>
		</h:panelGroup>
		<p:dialog id="uploadLoaDlg" widgetVar="uploadLoaDlg"
			modal="false" resizable="false" width="700px" height="350"
			styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;" mode="advanced"
				fileUploadListener="#{amendmentBackingBean.fileUpload}"
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
				invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
				update=":form:uploadLoaPg">
			</p:fileUpload>
		</p:dialog>		
	</p:panel>
</ui:composition>
