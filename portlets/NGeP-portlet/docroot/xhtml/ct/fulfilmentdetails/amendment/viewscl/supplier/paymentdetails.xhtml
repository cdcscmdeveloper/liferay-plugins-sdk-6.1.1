<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	 <p:panel id="paymentDetails" header="#{lbl['lbl.ct.panel.payment']}" toggleable="true" toggleSpeed="500"
	 	rendered="#{amendmentBackingBean.managedBean.ackFA == CtConst.supplierAckLoa}" >
		<h:panelGrid columns="2" columnClasses="columnWidth225">
			 <p:outputLabel value="#{lbl['lbl.ct.bank.account.name']}" styleClass="required"/>
		<h:panelGrid columns="2">
		   <p:selectOneMenu id="accountNo"  style="width:310px; margin-bottom: 5px;" disabled="#{!bpmTasklistBackingBean.managedBean.claim}"
			 value="#{ctBackingBean.managedBean.contractVer.ctContractValue.bankAccountNo}">
			   <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"/>
			   <f:selectItems value="#{amendmentBackingBean.populateBankAccountList}"/>
			    <p:ajax event="change" process="@this" update="paymentDetails" listener="#{amendmentBackingBean.changeAccountActionListener}"/>
		     </p:selectOneMenu>
		     <p:message for="accountNo" display="icon"/>
		  </h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.bank.branch']}"/>
			<p:inputText style="width:300px;" disabled="true"
			   value="#{ctBackingBean.managedBean.contractVer.ctContractValue.bankBranch}"/>
			 <h:panelGroup>
            <div style="height: 70px; vertical-align:top;">
                <p:outputLabel for="payBankAddress" value="#{lbl['lbl.ct.bank.address']}" />
            </div>
           </h:panelGroup>
           <h:panelGrid>
             <p:inputTextarea id="payBankAddress" disabled="true"  rows="4" 
               maxlength="200"  autoResize="false" style="width:300px;margin-bottom: 5px;" 
                value="#{amendmentBackingBean.getFullAddress(ctBackingBean.managedBean.contractVer.ctContractValue.bankAddress)}"/>
           </h:panelGrid>
		</h:panelGrid>
	</p:panel>	
</ui:composition>
