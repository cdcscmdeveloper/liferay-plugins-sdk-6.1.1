<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" >
   <p:panel header="Attachement" toggleable="true">
		<table style="width: 100%">
				    <tr>
			           <td class="TableFieldLeft" width="14%"><h:outputLabel value="#{lbl['lbl.txt.attachment']}" /></td>
			           <td class="TableFieldRight">
				         <p:commandButton oncomplete="uploadComitteDlg.show();return false;"
				           disabled="#{amendmentBackingBean.managedBean.prepareLOA}"
					        update="lampiranComitte, uploadComitteDlg" icon="ui-icon-upload" immediate="true"/>
			           </td>
		             </tr>
		             <tr>
			           <td/>
			           <td>
				            <p:dataGrid id="lampiranComitte" value="#{ctBackingBean.managedBean.contractVer.committeDecisionAttachements}"
					           var="attachFile" rowIndexVar="attachFileIndex" columns="1" style="width:100%"
					           emptyMessage ="#{lbl['lbl.datatable.msg.no.records.found']}">
					           <table>
						          <tr>
							       <td rowspan="2"><h:graphicImage value="/css/images/design/#{ctBackingBean.determineIcon(attachFile)}" height="30" width="30"/></td>
							       <td width="5"></td>
							       <td>
								       <h:outputText value=" #{attachFile.createdUser.userName}"></h:outputText>,
								       <h:outputText value="#{attachFile.createdDate}">
									     <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
						   </h:outputText>
						</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<h:commandLink value="#{attachFile.fileName}" 
									styleClass="blue_font" action="#{ctBackingBean.downloadFile(attachFile)}" />
			 	 				<p:commandLink onsuccess="deleteComitteDlg.show();"  disabled="#{amendmentBackingBean.managedBean.prepareLOA}"
			 	 				   action="#{amendmentBackingBean.setAttachFileIndex(attachFileIndex)}">
			   						<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			 	 				</p:commandLink>
			 	 			</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>

	<p:dialog id="uploadComitteDlg" widgetVar="uploadComitteDlg" resizable="false"
	   modal="true" width="700px" height="350px" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}"
	   onShow="singleUploadListener(meetingUploadWV);">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" dragDropSupport="false" multiple="false"
		    sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" showButtons="false"
			fileUploadListener="#{amendmentBackingBean.committeeFileUpload}"
			mode="advanced" id="CommitteUploadId" widgetVar="meetingUploadWV"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}" 
			update="lampiranComitte" label="#{lbl['lbl.btn.choose']}" oncomplete="uploadComitteDlg.hide();" >
		</p:fileUpload>
		<f:facet name="footer">
		<div class="ppRightBtn">
		    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadComitteDlg.hide();" />
   		</div> 
   		</f:facet>
	</p:dialog>
	
	  <p:confirmDialog id="deleteComitteDlg" widgetVar="deleteComitteDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                         <div class="ppRightBtn">
		                     <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                         update=":form:lampiranComitte" 
		                         action="#{amendmentBackingBean.deleteCommitteAttachmentAction(amendmentBackingBean.managedBean.attachFileIndex)}"
		                          oncomplete="deleteComitteDlg.hide();"/>
			                 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteComitteDlg.hide();" type="button" />
		                 </div>
                   </p:confirmDialog>
	</p:panel>		
		
</ui:composition>
