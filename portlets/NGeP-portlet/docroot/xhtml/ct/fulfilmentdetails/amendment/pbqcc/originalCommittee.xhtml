<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="oriCommitteePanel" header="#{lbl['lbl.sc.original.committee.member']}"
		toggleable="true" toggleSpeed="500">
		<p:dataTable id="originalCommitteeTable" var="ctOriCommitteeVar"
			widgetVar="oriCommitteeTableWidget" rowIndexVar="index"
			rowKey="#{ctOriCommitteeVar}"
			value="#{ctBackingBean.managedBean.contractVer.ctAmendment.ctCommitteeMembers}"
			filteredValue="#{amendmentBackingBean.getFilteredOriginalCommitteeMembers()}" >
			<p:column style="width:2%;">
				<f:facet name="header">
					<p:selectBooleanCheckbox
						value="#{amendmentBackingBean.managedBean.selectAll}"
						disabled="true">
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{ctOriCommitteeVar.selectedCheckBox}"
					styleClass="myCustomChekBox"
					disabled="true">
				</p:selectBooleanCheckbox>
			</p:column>

			<p:column style="width:17%;white-space:normal"
				styleClass="column-align-center" headerText="#{lbl['lbl.ct.name']}">
				<div align="left">
					<h:outputText value="#{ctOriCommitteeVar.memberName}" />
				</div>
			</p:column>

			<p:column style="width:11%;white-space:normal;"
				styleClass="column-align-center"
				headerText="#{lbl['lbl.ct.identification.no']}">
				<div align="left">
					<h:outputText value="#{ctOriCommitteeVar.icPassport}" />
				</div>
			</p:column>

			<p:column style="width:27%;white-space:normal;"
				styleClass="column-align-center"
				headerText="#{lbl['lbl.ct.designation']}">
				<div align="left">
					<h:outputText value="#{ctOriCommitteeVar.designation}" />
				</div>
			</p:column>

			<p:column style="width:20%;white-space:normal;"
				styleClass="column-align-center" headerText="#{lbl['lbl.ct.email']}">
				<div align="left">
					<h:outputText value="#{ctOriCommitteeVar.email}" />
				</div>
			</p:column>

			<p:column style="width:5%;" styleClass="column-align-center"
				headerText="#{lbl['lbl.ct.grade']}">
				<div align="left">
					<h:outputText value="#{ctOriCommitteeVar.grade}" />
				</div>
			</p:column>

			<p:column headerText="#{lbl['lbl.ct.pnp']}"
				styleClass="column-align-center" style="width:5%;">
				<h:outputText
					value="#{ctOriCommitteeVar.pnp ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}"
					style="float:left;" />
			</p:column>

			<p:column style="width:13%;" styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.ct.role']}" />
				</f:facet>
				<ui:fragment
					rendered="#{ctOriCommitteeVar.memberRole.parameterCode == ParameterConst.committeeRoleSecretary}">
					<h:outputText value="#{lbl['lbl.ct.secretary']}" />
				</ui:fragment>
				<ui:fragment
					rendered="#{ctOriCommitteeVar.memberRole.parameterCode != ParameterConst.committeeRoleSecretary}">
					<p:selectOneMenu id="originalRoleSelMenu"
						disabled="true"
						value="#{ctOriCommitteeVar.memberRoleId}"
						style="width: 110px;margin-bottom: 5px;" required="true"
						label="#{lbl['lbl.ct.role']}">
						<f:selectItems
							value="#{amendmentBackingBean.getRoleTypeDropdown(ctOriCommitteeVar)}" />
					</p:selectOneMenu>
				</ui:fragment>
			</p:column>
			<p:column style="width: 15%" styleClass="column-align-center"
			rendered="#{(amendmentBackingBean.managedBean.committeeType != ParameterConst.committeeTypeQuotationCommitteeB) 
				     	and (amendmentBackingBean.managedBean.committeeType != ParameterConst.committeeTypeQuotationCommitteeA)}">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.ct.represent.type']}" />
				</f:facet>
				<h:panelGroup id="originalRepresentativePnlGrp">
					<p:selectOneMenu id="originalRepresentativeTypeSelMenu" required="true"
						value="#{ctOriCommitteeVar.representativeType.parameterId}"
						disabled="true"
						label="#{lbl['lbl.ct.represent.type']}"
						style="width: 150px;margin-bottom: 5px;"
						rendered="#{amendmentBackingBean.chkBooleanRepresentType(ctOriCommitteeVar.memberRoleId, ctOriCommitteeVar.pnp)}">
						<f:selectItems
							value="#{amendmentBackingBean.getRepresentativeDropdown()}" />
					</p:selectOneMenu>
				</h:panelGroup>

			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
