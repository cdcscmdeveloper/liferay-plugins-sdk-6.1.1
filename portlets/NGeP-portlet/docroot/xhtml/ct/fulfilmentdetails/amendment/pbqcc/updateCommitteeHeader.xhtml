<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<h:panelGroup id="panelHeaderExceptionUpdateCommittee">
		<p:messages id="messages" showSummary="false" showDetail="true"
			autoUpdate="#{amendmentBackingBean.managedBean.autoUpdate}"
			closable="true" severity="error, info, warn" />
		<div align="left" class="header-button">
			<table style="width: 100%;">
				<tr>
					<td class="ppRightBtn"><p:commandButton
							value="#{lbl['lbl.btn.update']}" immediate="true"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							actionListener="#{amendmentBackingBean.validateLatestCommitteeMembers}"
							partialSubmit="true" /> <p:commandButton
							value="#{lbl['lbl.ct.btn.back']}" immediate="true"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							actionListener="#{amendmentBackingBean.backToDecisionTab}"
							update="@form" /></td>
				</tr>
			</table>
		</div>
		<div align="left" class="header-info">
			<table style="width: 100%">
				<tr>
					<td style="width: 15%"><h:outputLabel value="#{lbl['lbl.ct.loa.no']}" /></td>
					<td style="width: 10%"><p:commandLink
							value="#{ctBackingBean.managedBean.contractVer.ctContractValue.loaNo}"
							process="@this" partialSubmit="true" styleClass="blue_font"
							action="#{ctBackingBean.goToLoaView(ctBackingBean.managedBean.contractVer.ctContract.loa)}" />
					</td>
					<td style="width: 10%"><h:outputLabel value="#{lbl['lbl.ct.contract.no']}" /></td>
					<td style="width: 15%"><p:commandLink
							value="#{ctBackingBean.managedBean.contractVer.ctContract.contractNo}"
							process="@this" partialSubmit="true" styleClass="blue_font"
							action="#{amendmentBackingBean.gotoCommonViewPage(ctBackingBean.managedBean.contractVer.ctContract.contractId)}" />
					</td>
					<h:panelGroup rendered="#{amendmentBackingBean.managedBean.ackFA eq null}">
						<td style="width: 10%"><h:outputLabel
								value="#{lbl['lbl.ct.ptj.name']}" /></td>
						<td style="width: 15%" class="header-info-text">
							#{ctBackingBean.managedBean.contractVer.ctContract.ownerOrgProfile.orgName}
						</td>
					</h:panelGroup>
					<h:panelGroup rendered="#{amendmentBackingBean.managedBean.ackFA ne null}">
						<td style="width: 10%"><h:outputLabel value="#{lbl['lbl.ct.ptj.name']}" /></td>
						<td style="width: 35%" class="header-info-text">
							#{ctBackingBean.managedBean.contractVer.ctContract.ownerOrgProfile.orgName}
						</td>
					</h:panelGroup>
					<h:panelGroup rendered="#{amendmentBackingBean.managedBean.ackFA eq null}">
						<td style="width: 10%"><h:outputLabel value="#{lbl['lbl.ct.fulfilment.details.status']}" /></td>
						<td style="width: 15%" class="header-info-text">
							#{ctBackingBean.getStatusDescById(ctBackingBean.managedBean.contractVer.status.statusId)}
						</td>
					</h:panelGroup>
				</tr>
			</table>
		</div>
	</h:panelGroup>
</ui:composition>
