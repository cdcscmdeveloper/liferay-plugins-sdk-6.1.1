<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="secretryPanel" header="#{lbl['ct.lbl.amend.meetingdtls']}" toggleable="true"  toggleSpeed="500">
      <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth20">
         <p:outputLabel value="Decision"/>
         <p:selectOneMenu value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.pbQcApproved}" 
            style="width:180px;margin-bottom: 4px;">
               <f:selectItem itemLabel="-Select One-" itemValue=""/>
			   <f:selectItem itemLabel="Approved" itemValue="True"/>
			   <f:selectItem itemLabel="Reject" itemValue="False"/>
		 </p:selectOneMenu>
		 <h:panelGroup>
            <div style="height: 60px; vertical-align:top;">
                <p:outputLabel for="justificationPbQCC" value="#{lbl['lbl.ct.ament.justification']}" />
            </div>
          </h:panelGroup>
          <h:panelGrid>
             <p:inputTextarea id="justificationPbQCC" 
                value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.pbqcJustification}"
                rows="4" cols="31"   maxlength="200"  autoResize="false" style="margin-bottom: 4px;" />
          </h:panelGrid>
           <p:outputLabel value="#{lbl['lbl.ct.amend.dtofmeeting']}"/>   
             <p:calendar value="#{amendmentBackingBean.meetingDate(amendmentBackingBean.managedBean.contractVer.ctAmendment.ctMeetings)}" 
               size="29" id="calMeeting" showOn="button" disabled="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/> 
		   <h:panelGroup>
            <div style="height: 80px; vertical-align:top;">
                <p:outputLabel for="SecretryLocation" value="#{lbl['lbl.ct.amend.locofmeeting']}" />
            </div>
          </h:panelGroup>
          <h:panelGrid>
             <p:inputTextarea id="SecretryLocation" disabled="true" 
                value="#{amendmentBackingBean.meetingLocation(amendmentBackingBean.managedBean.contractVer.ctAmendment.ctMeetings)}"
                rows="4" cols="31"   maxlength="200"  autoResize="false" style="margin-bottom: 4px;" />
          </h:panelGrid> 
        </h:panelGrid>
        <h:panelGrid style="width:100%;">
          <p:outputLabel value="#{lbl['lbl.ct.amend.listcommmembers']}" style="float:left;"/>
          <p:dataTable id="secretryTable" var="data" value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.ctCommitteeMembers}">
             <ac:paginator for="decisionTable" />
				 <p:column style="width:20%;" headerText="Name">
				     <p:outputLabel value="#{data.memberName}" style="float:left;"/>
				 </p:column> 
				 <p:column style="width:15%;" headerText="#{lbl['ct.lbl.amend.identno']}">
				    <p:outputLabel value="#{data.icPassport}" style="float:left;"/>
				 </p:column> 	
				 <p:column style="width:15%;" headerText="#{lbl['lbl.ct.designation']}">
				   <p:outputLabel value="#{data.designation}" style="float:left;"/>
				 </p:column> 	
				 <p:column style="width:15%;" headerText="#{lbl['lbl.ct.email']}">
				    <p:outputLabel value="#{data.email}" style="float:left;"/>
				 </p:column> 
				 <p:column style="width:5%;" headerText="#{lbl['lbl.ct.grade']}">
				    <p:outputLabel value="#{data.grade}" style="float:left;"/>
				 </p:column> 	
				 <p:column style="width:5%;" headerText="#{lbl['lbl.ct.pnp']}">
				     <h:outputText value="#{data.pnp ? 'Yes' : 'No'}"  style="float:left;"/>
				 </p:column> 	
				 <p:column style="width:15%;" headerText="#{lbl['lbl.ct.role']}">
				      <p:outputLabel value="#{amendmentBackingBean.getParameterDesc(data.memberRole)}" 
				       style="float:left;"/>
				 </p:column> 
				 <p:column style="width:10%;" headerText="#{lbl['lbl.ct.attendance']}" styleClass="column-align-center">
				     <p:selectBooleanCheckbox value="#{data.attended}" />
				 </p:column> 
           </p:dataTable>
         </h:panelGrid>
     </p:panel>
</ui:composition>
