<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="secretryPanel" header="#{lbl['lbl.ct.panel.meeting.decision']}" toggleable="true"  toggleSpeed="500">
        <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth150">
         <h:panelGrid columns="2" style="float:right;">
           <h:outputText value="* " styleClass="mandatory" />
		    <p:outputLabel value="#{lbl['lbl.ct.decision']}"    />
		  </h:panelGrid>
             <p:selectOneMenu id="pqQcDecisionId"  style="width:190px;margin-bottom: 10px;"
               required="true" label="#{lbl['lbl.ct.decision']}" disabled="#{isPrepareLoa
                     or amendmentBackingBean.managedBean.disableFinalAmendDetails}"
                 value="#{amendmentBackingBean.managedBean.pbQcApproved}" >
			     <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue=""/>
			     <f:selectItem itemLabel="#{lbl['lbl.ct.approve']}" itemValue="A"/>
			     <f:selectItem itemLabel="#{lbl['lbl.ct.reject']}" itemValue="R"/>
			     <p:ajax process="@this" partialSubmit="true" 
			        update=":form:pqQcDecisionId"  listener="#{amendmentBackingBean.setPbQcDecisionValue}"></p:ajax>
		    </p:selectOneMenu>
		   
		   <h:panelGrid columns="2" style="float:right;">               
            	<h:outputText value="*" styleClass="mandatory" />
                    <p:outputLabel value="#{lbl['lbl.txt.remarks']}" />
               
           </h:panelGrid>
            <h:panelGrid>
               <p:inputTextarea id="justificationPbQCC"   rows="4" disabled="#{isPrepareLoa
               or amendmentBackingBean.managedBean.disableFinalAmendDetails}"
                   style="width:180px;margin-bottom: 4px;"   maxlength="200"  autoResize="false" 
                    required="true" label="#{lbl['lbl.txt.remarks']}"
                    onkeyup="limitTextArea(this,1000);" onkeydown="limitTextArea(this,1000);"
                   value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.pbqcJustification}"/>
            </h:panelGrid>
           </h:panelGrid>
       
           <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth150" styleClass="top-aligned-columns">
               <p:outputLabel value="#{lbl['lbl.ct.list.comm.members']}" />
                
               <p:dataTable id="secretryTable" var="data" rowIndexVar="index"
                   value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.ctCommitteeMembers}">
                   <ac:paginator for="decisionTable" />
				   
				   <p:column style="width:20%;white-space:normal;" headerText="#{lbl['lbl.ct.name']}">
				       <p:outputLabel value="#{data.memberName}" style="float:left;"/>
				   </p:column> 
				  
				   <p:column style="width:12%;" headerText="#{lbl['lbl.ct.identification.no']}">
				       <p:outputLabel value="#{data.icPassport}" style="float:left;"/>
				   </p:column> 	
				  
				   <p:column style="width:20%;white-space:normal;" headerText="#{lbl['lbl.ct.designation']}">
				      <p:outputLabel value="#{data.designation}" style="float:left;"/>
				   </p:column> 	
				
				    <p:column style="width:15%;white-space:normal;" headerText="#{lbl['lbl.ct.email']}">
				       <p:outputLabel value="#{data.email}" style="float:left;"/>
				    </p:column> 
				
				    <p:column style="width:5%;" headerText="#{lbl['lbl.ct.grade']}">
				         <p:outputLabel value="#{data.grade}" style="float:left;"/>
				    </p:column> 	
				   
				    <p:column style="width:5%;" headerText="#{lbl['lbl.ct.pnp']}">
				        <h:outputText value="#{data.pnp ? 'Yes' : 'No'}"  style="float:left;"/>
				    </p:column> 	
				  
				    <p:column style="width:6%;" headerText="#{lbl['lbl.ct.role']}">
				         <p:outputLabel  style="float:left;" value="#{amendmentBackingBean.getParameterDesc(index, data.memberRole)}" />
				    </p:column> 
				    
				     <p:column style="width:15%;white-space:normal;" headerText="#{lbl['lbl.ct.represent.type']}">
				         <p:outputLabel  style="float:left;" value="#{amendmentBackingBean.getParameterDesc(data.representativeType)}" />
				    </p:column> 
				   
				    <p:column style="width:7%;" styleClass="column-align-center">
				        <f:facet name="header">
					        <h:outputText value="* " styleClass="mandatory" />
					       <h:outputText value="#{lbl['lbl.ct.attendance']}"  />
				        </f:facet>
				        <p:selectBooleanCheckbox value="#{data.attended}" 
				              disabled="#{data.memberRole.parameterCode == ParameterConst.committeeRoleSecretary or
				               amendmentBackingBean.managedBean.disableAmendDetails}" />
				    </p:column> 
           </p:dataTable>
      </h:panelGrid>
 </p:panel>
</ui:composition>
