<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="secretryPanel" header="#{lbl['lbl.ct.panel.meeting.decision.dtl']}" toggleable="true"  toggleSpeed="500">
        <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth150">
             <p:outputLabel value="Decision"/>
             <p:selectOneMenu  style="width:190px;margin-bottom: 4px;"
                 value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.pbQcApproved}" >
			     <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue=""/>
			     <f:selectItem itemLabel="#{lbl['lbl.ct.approve']}" itemValue="True"/>
			     <f:selectItem itemLabel="#{lbl['lbl.ct.reject']}" itemValue="False"/>
		    </p:selectOneMenu>
		   
		    <h:panelGroup>
                <div style="height: 85px; vertical-align:top;">
                     <p:outputLabel for="justificationPbQCC" value="#{lbl['lbl.txt.remarks']}" />
                </div>
            </h:panelGroup>
            <h:panelGrid>
               <p:inputTextarea id="justificationPbQCC"   rows="4" 
                   style="width:180px;"   maxlength="200"  autoResize="false"  
                   value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.pbqcJustification}"/>
            </h:panelGrid>
          
            <p:outputLabel value="#{lbl['lbl.ct.date.of.meeting']}"/>   
            <p:calendar id="calMeeting" 
                 showOn="button" disabled="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"  styleClass="calanderWidth" 
                value="#{amendmentBackingBean.meetingDate(amendmentBackingBean.managedBean.contractVer.ctAmendment.ctMeetings)}" /> 
		   
		     <h:panelGroup>
                 <div style="height: 85px; vertical-align:top;">
                    <p:outputLabel for="SecretryLocation" value="#{lbl['lbl.ct.location.of.meeting']}" />
                 </div>
              </h:panelGroup>
              <h:panelGrid>
                 <p:inputTextarea id="SecretryLocation" disabled="true"  rows="4"  
                     style="width:180px;margin-bottom: 4px;"   maxlength="200"  autoResize="false"  
                     value="#{amendmentBackingBean.meetingLocation(amendmentBackingBean.managedBean.contractVer.ctAmendment.ctMeetings)}"/>
              </h:panelGrid> 
           </h:panelGrid>
       
           <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth150" styleClass="top-aligned-columns">
               <p:outputLabel value="#{lbl['lbl.ct.list.comm.members']}" />
                
               <p:dataTable id="secretryTable" var="data" 
                   value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.ctCommitteeMembers}">
                   <ac:paginator for="decisionTable" />
				   
				   <p:column style="width:20%;white-space:normal;" headerText="#{lbl['lbl.ct.name']}">
				       <p:outputLabel value="#{data.memberName}" style="float:left;"/>
				   </p:column> 
				  
				   <p:column style="width:15%;" headerText="#{lbl['lbl.ct.identification.no']}">
				       <p:outputLabel value="#{data.icPassport}" style="float:left;"/>
				   </p:column> 	
				  
				   <p:column style="width:20%;white-space:normal;" headerText="#{lbl['lbl.ct.designation']}">
				      <p:outputLabel value="#{data.designation}" style="float:left;"/>
				   </p:column> 	
				
				    <p:column style="width:20%;white-space:normal;" headerText="#{lbl['lbl.ct.email']}">
				       <p:outputLabel value="#{data.email}" style="float:left;"/>
				    </p:column> 
				
				    <p:column style="width:5%;" headerText="#{lbl['lbl.ct.grade']}">
				         <p:outputLabel value="#{data.grade}" style="float:left;"/>
				    </p:column> 	
				   
				    <p:column style="width:5%;" headerText="#{lbl['lbl.ct.pnp']}">
				        <h:outputText value="#{data.pnp ? 'Yes' : 'No'}"  style="float:left;"/>
				    </p:column> 	
				  
				    <p:column style="width:7%;" headerText="#{lbl['lbl.ct.role']}">
				         <p:outputLabel  style="float:left;"
				            value="#{amendmentBackingBean.getParameterDesc(data.memberRole)}" />
				    </p:column> 
				   
				    <p:column style="width:8%;" headerText="#{lbl['lbl.ct.attendance']}" styleClass="column-align-center">
				        <p:selectBooleanCheckbox value="#{data.attended}" />
				    </p:column> 
           </p:dataTable>
      </h:panelGrid>
 </p:panel>
</ui:composition>
