<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="secretryPanel" header="#{lbl['lbl.ct.panel.meeting.decision']}" toggleable="true"  toggleSpeed="500">
        <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth150">
         <h:panelGrid columns="2" style="float:right;">
           <h:outputText value="* " styleClass="mandatory" />
		    <p:outputLabel value="#{lbl['lbl.ct.decision']}"    />
		  </h:panelGrid>
             <p:selectOneMenu id="pqQcDecisionId"  style="width:190px;margin-bottom: 10px;"
                    label="#{lbl['lbl.ct.decision']}" disabled="#{isPrepareLoa
                     or amendmentBackingBean.managedBean.disableFinalAmendDetails}"
                 value="#{amendmentBackingBean.managedBean.pbQcApproved}" >
			     <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue=""/>
			     <f:selectItem itemLabel="#{lbl['lbl.ct.approve']}" itemValue="A"/>
			     <f:selectItem itemLabel="#{lbl['lbl.ct.reject']}" itemValue="R"/>
			     <p:ajax process="@this" partialSubmit="true" 
			        update=":form:pqQcDecisionId"  listener="#{amendmentBackingBean.setPbQcDecisionValue}"></p:ajax>
		    </p:selectOneMenu>
		   
		   <h:panelGrid columns="2" style="float:right;">               
            	<h:outputText value="*" styleClass="mandatory" />
                    <p:outputLabel value="#{lbl['lbl.txt.remarks']}" />
               
           </h:panelGrid>
            <h:panelGrid>
               <p:inputTextarea id="justificationPbQCC"   rows="4" disabled="#{isPrepareLoa
               or amendmentBackingBean.managedBean.disableFinalAmendDetails}"
                   style="width:180px;margin-bottom: 4px;"   maxlength="200"  autoResize="false" 
                    label="#{lbl['lbl.txt.remarks']}"
                    onkeyup="limitTextArea(this,1000);" onkeydown="limitTextArea(this,1000);"
                   value="#{ctBackingBean.managedBean.contractVer.ctAmendment.pbqcJustification}"/>
            </h:panelGrid>
           </h:panelGrid>
       
           <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth150" styleClass="top-aligned-columns">
               <p:outputLabel value="#{lbl['lbl.ct.list.comm.members']}" />
                
               <p:dataTable id="secretryTable" var="data" rowIndexVar="index"
                   value="#{ctBackingBean.managedBean.contractVer.ctAmendment.ctCommitteeMembers}">
                   <ac:paginator for="decisionTable" />
				   
				   <p:column style="width:20%;white-space:normal;"
				        headerText="#{lbl['lbl.ct.name']}" styleClass="column-align-center" >
				     <div align="left">
				       <h:outputText value="#{data.memberName}" /></div>
				   </p:column> 
				  
				   <p:column style="width:12%;" 
				      styleClass="column-align-center"  headerText="#{lbl['lbl.ct.identification.no']}">
				        <div align="left">
				            <h:outputText value="#{data.icPassport}" /></div>
				   </p:column> 	
				  
				   <p:column style="width:20%;white-space:normal;" 
				      styleClass="column-align-center"  headerText="#{lbl['lbl.ct.designation']}">
				       <div align="left">
				      <h:outputText value="#{data.designation}" /></div>
				   </p:column> 	
				
				    <p:column style="width:15%;white-space:normal;" 
				      styleClass="column-align-center"  headerText="#{lbl['lbl.ct.email']}">
				       <div align="left">
				       <h:outputText value="#{data.email}"/></div>
				    </p:column> 
				
				    <p:column style="width:5%;" 
				       styleClass="column-align-center"  headerText="#{lbl['lbl.ct.grade']}">
				        <div align="left">
				        <h:outputText value="#{data.grade}" /></div>
				    </p:column> 	
				   
				    <p:column style="width:5%;" headerText="#{lbl['lbl.ct.pnp']}"
				       styleClass="column-align-center" >
				        <div align="left">
				        <h:outputText value="#{data.pnp ? 'Yes' : 'No'}"  /></div>
				    </p:column> 	
				  
				    <p:column style="width:6%;" headerText="#{lbl['lbl.ct.role']}"
				      styleClass="column-align-center" >
				       <div align="left">
				         <h:outputText  value="#{amendmentBackingBean.getParameterDesc(index, data.memberRole)}" /></div>
				    </p:column> 
				    
				     <p:column style="width:15%;white-space:normal;" headerText="#{lbl['lbl.ct.represent.type']}"
				       styleClass="column-align-center" >
				          <div align="left">
				             <h:outputText   value="#{amendmentBackingBean.getParameterDesc(data.representativeType)}" />
				         </div>
				    </p:column> 
				   
				    <p:column style="width:7%;" styleClass="column-align-center">
				        <f:facet name="header">
					        <h:outputText value="* " styleClass="mandatory" />
					       <h:outputText value="#{lbl['lbl.ct.attendance']}"  />
				        </f:facet>
				        <p:selectBooleanCheckbox value="#{data.attended}" 
				              disabled="#{data.memberRole.parameterCode == ParameterConst.committeeRoleSecretary or amendmentBackingBean.managedBean.prepareLOA}" />
				    </p:column> 
           </p:dataTable>
      </h:panelGrid>
 </p:panel>
</ui:composition>
