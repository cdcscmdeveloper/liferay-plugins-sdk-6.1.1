<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
     <p:panel id="committePanel" header="#{lbl['lbl.ct.panel.committee.member']}" toggleable="true"  toggleSpeed="500">
            <p:dataTable id="committeTable" var="ctCommitteeVar" 
                value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.ctCommitteeMembers}"
                selection="#{amendmentBackingBean.selectedCommitteMembers}" rowKey="#{ctCommitteeVar}">
                <ac:paginator for="committeTable" />
                <p:column selectionMode="multiple" style="width:2%;" />
			   
			    <p:column style="width:20%;white-space:normal" headerText="#{lbl['lbl.ct.name']}">
				   <p:outputLabel value="#{ctCommitteeVar.memberName}" style="float:left;"/>
				</p:column> 
				 
				 <p:column style="width:15%;" headerText="#{lbl['lbl.ct.identification.no']}">
				    <p:outputLabel value="#{ctCommitteeVar.icPassport}" style="float:left;"/>
				 </p:column>  
				 
				 <p:column style="width:20%;white-space:normal" headerText="#{lbl['lbl.ct.designation']}" >
				      <p:outputLabel value="#{ctCommitteeVar.designation}" style="float:left;"/>
				 </p:column> 
				
				 <p:column style="width:20%;white-space:normal" headerText="#{lbl['lbl.ct.email']}">
				     <p:outputLabel value="#{ctCommitteeVar.email}" style="float:left;"/>
				 </p:column> 
			
				 <p:column style="width:5%;" headerText="#{lbl['lbl.ct.grade']}">
				     <p:outputLabel value="#{ctCommitteeVar.grade}" style="float:left;"/>
				 </p:column> 
				
				 <p:column headerText="#{lbl['lbl.ct.pnp']}" style="width:5%;">
				     <h:outputText value="#{ctCommitteeVar.pnp ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}"  style="float:left;"/>
				 </p:column>
				 
				 <p:column headerText="Role" style="width:13%;">
					 <ui:fragment rendered="#{ctCommitteeVar.pnp == true}">
							<h:outputText value="#{lbl['lbl.ct.chairperson']}" />
					 </ui:fragment>
					<ui:fragment rendered="#{ctCommitteeVar.pnp == false}" >
						<p:selectOneMenu id="appaction" value="#{ctCommitteeVar.memberRole.parameterId}"
							style="width: 110px;margin-bottom: 5px;" required="true" label="Role">
							<f:selectItems value="#{amendmentBackingBean.getCommitteDropdown()}" />
							</p:selectOneMenu>
						 </ui:fragment>
				 </p:column>
	    
	         </p:dataTable>
	         <p:spacer height="5"/>
	         
	         <div class="ppRightBtn"> 
		          <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" icon="ui-icon-add" onclick="dlg2.show();"  />
		          <p:commandButton value="#{lbl['lbl.btn.delete']}" process="@form" onsuccess="dlgDel.show();" icon="ui-icon-delete"/>
		     </div>
           
             <p:dialog id="dlgCommitteDetails"
                 styleClass="screen-title"  widgetVar="dlgDel"   resizable="false" modal="true" width="330">  
               
                 <h:panelGrid columns="3">
                      <p:graphicImage library="ep/images/design" name="exclamation.png"
			              value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			          <p:spacer width="10"/>
                      <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
                  </h:panelGrid>
                 
                  <div class="ppRightBtn">
		              <p:commandButton value="#{lbl['lbl.btn.yes']}"  update="committeTable"
		                icon="ui-icon-accept" process="@form"  action="#{amendmentBackingBean.delCommitteMembers}" onclick="dlgDel.hide();"/>
			          <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgDel.hide();" type="button" />
		          </div>
             </p:dialog>
        </p:panel>
      
         <p:dialog id="modelDialog" header="#{lbl['lbl.ct.new.committee.member']}" widgetVar="dlg2" modal="true" width="875" height="525">
		         
		           <p:panel id="searchPanel" header="#{lbl['lbl.btn.search']}" toggleable="true"   toggleSpeed="500">
		              
		                <h:panelGrid columns="2" width="100%" columnClasses="columnWidth20">
		                  
		                     <p:outputLabel for="nameId" value="#{lbl['lbl.ct.name']}" />
	                         <p:inputText id="nameId" value="#{amendmentBackingBean.managedBean.name}" style="width:260px;"/>
                           
                             <p:outputLabel for="idenType" value="#{lbl['lbl.ct.identification.type']}" />
	                         <p:selectOneMenu id="idenType"  style="width:180px;margin-bottom: 5px;" value="#{amendmentBackingBean.managedBean.identificationType}">
	                              <f:selectItems value="#{amendmentBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}"/>
	                           </p:selectOneMenu>
	                         <p:outputLabel for="idenNo" value="#{lbl['lbl.ct.identification.no']}" />
	                         <p:inputText id="idenNo"  style="width:170px;" value="#{amendmentBackingBean.managedBean.identificationNo}"/>
                  
                      </h:panelGrid>  
                     
                       <div class="ppRightBtn"> 
                  	      <p:commandButton value="#{lbl['lbl.btn.search']}" icon="ui-icon-search" process="@form" 
                  	          action="#{amendmentBackingBean.existingCommitteMemberList}" update=":form:newCommitteTable" />
		                  <p:commandButton value="#{lbl['lbl.ct.reset']}"  icon="ui-icon-reset" action="#{amendmentBackingBean.searchExistingCommitteMemberReset}" update=":form:changeCommitteMember"/>
		               </div> 
		         </p:panel>
		         
		         <p:panel id="searchResult" header="#{lbl['lbl.ct.search.result']}" toggleable="true" toggleSpeed="500">
		         
		             <p:dataTable id="newCommitteTable" var="data" value="#{amendmentBackingBean.committeDataModel}"  
		                   lazy="true"  rowKey="#{data}" selection="#{amendmentBackingBean.selectedPmUser}" rowIndexVar="index">
                           <ac:paginator for="newCommitteTable"/>
                           <p:column selectionMode="multiple" style="width:2%" />
                      
				            <p:column style="width:20%;white-space:normal;" headerText="#{lbl['lbl.ct.name']}">
				                 <p:outputLabel value="#{data.userName}" style="float:left;"/>
				            </p:column> 
				      
				            <p:column style="width:10%;" headerText="#{lbl['lbl.ct.identification.no']}">
				                 <p:outputLabel value="#{data.identificationNo}" style="float:left;"/>
				             </p:column> 
				            
				             <p:column style="width:25%;white-space:normal;" headerText="#{lbl['lbl.ct.designation']}">
				                  <p:outputLabel value="#{data.designation}" style="float:left;"/>
				             </p:column> 
				    
				             <p:column style="width:25%;white-space:normal;" headerText="#{lbl['lbl.ct.email']}">
				                  <p:outputLabel value="#{data.email}" style="float:left;"/>
				             </p:column> 
				      
				             <p:column style="width:10%;white-space:normal;" headerText="#{lbl['lbl.ct.grade']}">
				                  <p:outputLabel value="#{data.grade}" style="float:left;"/>
				             </p:column> 
				       
				             <p:column style="width:7%;white-space:normal;" headerText="#{lbl['lbl.ct.pnp']}">
				                 <p:outputLabel value="#{data.PMP ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}" style="float:left;"/>
				             </p:column> 
	                </p:dataTable>
	          
	              <f:facet name="footer">
			      <h:panelGrid columns="2" style="float:right;height:50px;vertical-align: middle;">
				      <p:commandButton value="#{lbl['lbl.btn.ok']}" process="@this,modelDialog" icon="ui-icon-accept" 
				          action="#{amendmentBackingBean.okCommitteMembers}"  update="committeTable,modelDialog" onclick="dlg2.hide();"/>
                       <p:commandButton value="#{lbl['lbl.btn.cancel']}" type="button"  icon="ui-icon-cancel" ajax="false" onclick="dlg2.hide();" />
			      </h:panelGrid>
		        </f:facet>
		  
		    </p:panel>
    </p:dialog>
</ui:composition>
