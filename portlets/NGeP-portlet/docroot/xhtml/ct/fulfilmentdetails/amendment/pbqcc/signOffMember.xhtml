<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="memberPanel" header="#{lbl['lbl.ct.panel.meeting.decision']}" toggleable="true"  toggleSpeed="500">
        <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth20">
          
            <p:outputLabel value="#{lbl['lbl.ct.menu.decision']}"/>
            <p:selectOneMenu   style="width:190px;margin-bottom: 4px;" disabled="true" 
                value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.pbQcApproved}" >
                   <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="null"/>
			       <f:selectItem itemLabel="#{lbl['lbl.ct.approve']}" itemValue="True"/>
			       <f:selectItem itemLabel="#{lbl['lbl.ct.reject']}" itemValue="False"/>
		    </p:selectOneMenu>
		   
		    <h:panelGroup>
               <div style="height: 60px; vertical-align:top;">
                    <p:outputLabel for="justificationMember" value="#{lbl['lbl.txt.remarks']}" />
               </div>
           </h:panelGroup>
           <h:panelGrid>
             <p:inputTextarea id="justificationMember" disabled="true"
                  rows="4"  maxlength="200"  autoResize="false" style="width:180px;margin-bottom: 4px;" 
                  value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.pbqcJustification}"/>
          </h:panelGrid>
           
           <p:outputLabel value="#{lbl['lbl.ct.date.of.meeting']}"/>    
           <p:calendar id="calMemMeeting" showOn="button" disabled="true" 
               styleClass="calanderWidth"  pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
               value="#{amendmentBackingBean.meetingDate(amendmentBackingBean.managedBean.contractVer.ctAmendment.ctMeetings)}" /> 
		  
		    <h:panelGroup>
                <div style="height: 80px; vertical-align:top;">
                      <p:outputLabel for="memberLocation" value="#{lbl['lbl.ct.location.of.meeting']}" />
                </div>
             </h:panelGroup>
             <h:panelGrid>
                <p:inputTextarea id="memberLocation" disabled="true" maxlength="200"  style="width:180px;margin-bottom: 4px;" autoResize="false" 
                    rows="4"  value="#{amendmentBackingBean.meetingLocation(amendmentBackingBean.managedBean.contractVer.ctAmendment.ctMeetings)}"/>
             </h:panelGrid> 
          </h:panelGrid>
          
          <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth20" styleClass="top-aligned-columns">
                 <p:outputLabel value="#{lbl['lbl.ct.list.comm.members']}" />
                
                 <p:dataTable id="memberTable" var="data" 
                     value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.ctCommitteeMembers}">
                     <ac:paginator for="decisionTable" />
            	   
            	     <p:column style="width:50%;white-space:normal;" headerText="#{lbl['lbl.ct.name']}">
				           <p:outputLabel value="#{data.memberName}" style="float:left;"/>
				     </p:column> 
				 
				     <p:column style="width:30%;white-space:normal;" headerText="#{lbl['lbl.ct.role']}">
				          <p:outputLabel value="#{amendmentBackingBean.getParameterDesc(data.memberRole)}"  style="float:left;"/>
				     </p:column> 	
				   
				     <p:column style="width:20%;white-space:normal;" headerText="#{lbl['lbl.ct.attendance']}" styleClass="column-align-center">
				            <p:selectBooleanCheckbox value="#{data.attended}" disabled="true" />
				     </p:column> 	
              </p:dataTable>
         </h:panelGrid>
     </p:panel>
</ui:composition>
