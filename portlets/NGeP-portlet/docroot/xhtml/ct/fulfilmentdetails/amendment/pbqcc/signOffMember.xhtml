<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<style>
		.panelColumns td {
		    vertical-align: top; 
		} 
	</style>
    <p:panel id="memberPanel" header="#{lbl['lbl.ct.panel.meeting.decision']}" toggleable="true"  toggleSpeed="500">
        <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidthSize16" styleClass="panelColumns" >
     		<h:panelGrid columns="2" style="float:right;">
	        	<h:outputText value="* " styleClass="mandatory" />
				<p:outputLabel value="#{lbl['lbl.ct.decision']}"/>
			</h:panelGrid>
            <p:selectOneMenu   style="width:190px;margin-bottom: 4px;" disabled="true" 
     			value="#{amendmentBackingBean.managedBean.pbQcApproved}" >
              		<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="null"/>
			       	<f:selectItem itemLabel="#{lbl['lbl.ct.approve']}" itemValue="A"/>
			       	<f:selectItem itemLabel="#{lbl['lbl.ct.reject']}" itemValue="R"/>
		    </p:selectOneMenu>
		   
		    <h:panelGrid columns="2" style="float:right;">               
           		<h:outputText value="*" styleClass="mandatory" />
          		<p:outputLabel for="justificationMember" value="#{lbl['lbl.txt.remarks']}" />               
           	</h:panelGrid>
           	<h:panelGrid>
    			<p:inputTextarea id="justificationMember" disabled="true"
                  	rows="4"  maxlength="200"  autoResize="false" style="width:180px;margin-bottom: 4px;" 
                  	value="#{ctBackingBean.managedBean.contractVer.ctAmendment.pbqcJustification}"/>
          	</h:panelGrid>
          	<h:panelGrid columns="2" style="float:right;">
           		<h:outputText value="* " styleClass="mandatory" />
		    	<p:outputLabel value="#{lbl['lbl.ct.decision.letter']}"    />
		  	</h:panelGrid>
		  	<h:commandLink value="#{ctBackingBean.managedBean.contractVer.pbqcDecisionLetterAttachment.fileName}" styleClass="blue_font"
		  		action="#{ctBackingBean.commonDownload(ctBackingBean.managedBean.contractVer.pbqcDecisionLetterAttachment.filePath, ctBackingBean.managedBean.contractVer.pbqcDecisionLetterAttachment.fileName)}" />        
    	</h:panelGrid>
          
          <!-- #30479 start -->
          <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidthSize16" styleClass="top-aligned-columns">
          <!-- #30479 end -->
                 <p:outputLabel value="#{lbl['lbl.ct.list.comm.members']}" />
                
                 <p:dataTable id="memberTable" var="data" rowIndexVar="index"
                     value="#{ctBackingBean.managedBean.contractVer.ctAmendment.ctCommitteeMembers}" filteredValue="#{amendmentBackingBean.getFilteredSignedCommitteeMembers()}">
                     <ac:paginator for="decisionTable" />
            	   
            	     <p:column style="width:50%;white-space:normal;" 
            	          styleClass="column-align-center"  headerText="#{lbl['lbl.ct.name']}">
            	          <div align="left">
				           <h:outputText value="#{data.memberName}" /></div>
				     </p:column> 
				 
				     <p:column style="width:20%;white-space:normal;" 
				         styleClass="column-align-center"  headerText="#{lbl['lbl.ct.role']}">
				         <div align="left">
				         <h:outputText value="#{amendmentBackingBean.getParameterDesc(index,data.memberRole)}"  /></div>
				     </p:column> 	
				     
				     <p:column style="width:20%;white-space:normal;" 
				          styleClass="column-align-center"  headerText="#{lbl['lbl.ct.represent.type']}">
				       <div align="left">
				         <h:outputText  style="float:left;" value="#{amendmentBackingBean.getParameterDesc(data.representativeType)}" />
				         </div>
				    </p:column> 
				   
				     <p:column style="width:10%;white-space:normal;" 
				           headerText="#{lbl['lbl.ct.attendance']}" styleClass="column-align-center">
				            <p:selectBooleanCheckbox value="#{data.attended}" disabled="true" />
				     </p:column> 	
              </p:dataTable>
         </h:panelGrid>
     </p:panel>
     <p:panel header="#{lbl['lbl.txt.attachment']}" toggleable="true" 
        rendered="#{ctBackingBean.managedBean.contractVer.committeDecisionAttachements.size() > 0}">
		<table style="width: 100%">
				    <tr>
			           <td class="TableFieldLeft" width="14%"><h:outputLabel value="#{lbl['lbl.txt.attachment']}" /></td>
			           <td>
				            <p:dataGrid id="lampiranComitte1" value="#{ctBackingBean.managedBean.contractVer.committeDecisionAttachements}"
					           var="attachFile" rowIndexVar="attachFileIndex" columns="1" style="width:100%"
					           emptyMessage ="#{lbl['lbl.datatable.msg.no.records.found']}">
					           <table>
						          <tr>
							       <td rowspan="2"><h:graphicImage value="/css/images/design/#{ctBackingBean.determineIcon(attachFile)}" height="30" width="30"/></td>
							       <td width="5"></td>
							       <td>
								       <h:outputText value=" #{attachFile.createdUser.userName}"></h:outputText>,
								       <h:outputText value="#{attachFile.createdDate}">
									     <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
						   </h:outputText>
						</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<h:commandLink value="#{attachFile.fileName}" 
									styleClass="blue_font" action="#{ctBackingBean.downloadFile(attachFile)}" />
			 	 			</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>
	</p:panel>
</ui:composition>
