<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="memberPanel" header="Meeting Decision Details" toggleable="true"  toggleSpeed="500">
      <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth20">
         <p:outputLabel value="Decision"/>
         <p:selectOneMenu style="width:180px;margin-bottom: 4px;" >
			   <f:selectItem itemLabel="--" itemValue=""/>
		 </p:selectOneMenu>
		 <h:panelGroup>
            <div style="height: 60px; vertical-align:top;">
                <p:outputLabel for="justificationMember" value="Justification" />
            </div>
          </h:panelGroup>
          <h:panelGrid>
             <p:inputTextarea id="justificationMember"
                rows="4" cols="31"   maxlength="200"  autoResize="false" style="margin-bottom: 4px;" />
          </h:panelGrid>
           <p:outputLabel value="Date Of Meeting"/>    
           <p:inputText style="width:170px;">
               <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
           </p:inputText>
		   <h:panelGroup>
            <div style="height: 60px; vertical-align:top;">
                <p:outputLabel for="memberLocation" value="Location of Meeting" />
            </div>
          </h:panelGroup>
          <h:panelGrid>
             <p:inputTextarea id="memberLocation" disabled="true" 
                rows="4" cols="31"   maxlength="200"  autoResize="false" style="margin-bottom: 4px;" />
          </h:panelGrid> 
        <p:outputLabel value="List of Committee Members" />
         <p:dataTable id="memberTable" var="data" value=" ">
             <ac:paginator for="decisionTable" />
             <p:columnGroup type="header"> 
			  <p:row> 
				 <p:column style="width:20%;" headerText="Name" /> 
				 <p:column style="width:10%;" headerText="Role" /> 	
				 <p:column style="width:10%;" headerText="Attendance" /> 	
			  </p:row>							
			 </p:columnGroup>
			   <p:column> </p:column>
			   <p:column> </p:column>
			   <p:column> </p:column>
           </p:dataTable>
           </h:panelGrid>
     </p:panel>
</ui:composition>
