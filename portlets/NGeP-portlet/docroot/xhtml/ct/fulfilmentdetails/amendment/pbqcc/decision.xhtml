<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="decisionPanel" header="#{lbl['lbl.ct.panel.meeting.decision.dtl']}" toggleable="true"  toggleSpeed="500">
      <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth15">
         <p:outputLabel value="#{lbl['lbl.ct.menu.decision']}"/>
         <p:selectOneMenu style="width:180px;margin-bottom: 4px;" >
			   <f:selectItem itemLabel="--" itemValue=""/>
		 </p:selectOneMenu>
		 <h:panelGroup>
            <div style="height: 60px; vertical-align:top;">
                <p:outputLabel for="justification" value="#{lbl['lbl.txt.remarks']}" />
            </div>
          </h:panelGroup>
          <h:panelGrid>
             <p:inputTextarea id="justification"
                rows="4" cols="31"   maxlength="200"  autoResize="false" style="margin-bottom: 4px;" />
          </h:panelGrid>
           <p:outputLabel value="#{lbl['lbl.ct.date.of.meeting']}"/>    
           <p:inputText style="width:170px;">
               <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
           </p:inputText>
		   <h:panelGroup>
            <div style="height: 60px; vertical-align:top;">
                <p:outputLabel for="meetingLocation" value="#{lbl['lbl.ct.location.of.meeting']}" />
            </div>
          </h:panelGroup>
          <h:panelGrid>
             <p:inputTextarea id="meetingLocation" disabled="true" 
                rows="4" cols="31" maxlength="200"  autoResize="false" style="margin-bottom: 4px;" />
          </h:panelGrid> 
         <p:spacer height="30"/>   
      </h:panelGrid>
        <p:spacer height="10"/>  
        <p:outputLabel value="#{lbl['lbl.ct.list.comm.members']}" style="float:left; font:bold;"/>
         <p:dataTable id="decisionTable" var="data" value=" ">
             <ac:paginator for="decisionTable" />
             <p:columnGroup type="header"> 
			  <p:row> 
				 <p:column style="width:20%;" headerText="#{lbl['lbl.ct.name']}" /> 
				 <p:column style="width:20%;" headerText="#{lbl['lbl.ct.identification.no']}"  /> 
				 <p:column style="width:20%;" headerText="#{lbl['lbl.ct.identification']}" /> 	
				 <p:column style="width:10%;" headerText="#{lbl['lbl.ct.email']}" /> 	
				 <p:column style="width:10%;" headerText="#{lbl['lbl.ct.grade']}" /> 	
				 <p:column style="width:10%;" headerText="#{lbl['lbl.ct.role']}" /> 	
				 <p:column style="width:10%;" headerText="#{lbl['lbl.ct.attendance']}" /> 	
			  </p:row>							
			 </p:columnGroup>
			   <p:column> </p:column>
			   <p:column> </p:column>
			   <p:column> </p:column>
			   <p:column> </p:column>
			   <p:column> </p:column>
			   <p:column> </p:column>
			   <p:column> </p:column>
           </p:dataTable>
     </p:panel>
</ui:composition>
