<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="meetingPanel" header="#{lbl['lbl.ct.menu.meeting']}" toggleable="true"  toggleSpeed="500">
           <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br/><br/>
           <p:dataTable id="meetingTable" var="ctMeetingsVar" 
                value="#{ctBackingBean.managedBean.contractVer.ctAmendment.ctMeetings}"
                selection="#{amendmentBackingBean.selectedMeetingUser}" rowKey="#{ctMeetingsVar}">
                <ac:paginator for="meetingTable" />
                  <p:ajax event="toggleSelect" 
			                              listener="#{ctBackingBean.onToggleSelect}" update=":form:meetingDelBtn" />
			      <p:ajax event="rowSelect"
                                       listener="#{ctBackingBean.onRowSelect}" update=":form:meetingDelBtn" />
			      <p:ajax event="rowSelectCheckbox" 
			                             listener="#{ctBackingBean.onRowSelect}" update=":form:meetingDelBtn" />
                   <p:ajax event="rowUnselectCheckbox" 
                                         listener="#{ctBackingBean.onRowUnselect}" update=":form:meetingDelBtn" />
              
                <p:column selectionMode="multiple" style="width:2%;" rendered="#{!amendmentBackingBean.managedBean.disableMeetingDetails}"/>  
                <p:column style="width:25%;white-space:normal;" headerText="#{lbl['lbl.ct.date.of.meeting']}" styleClass="column-align-center" >
			          <p:calendar value="#{ctMeetingsVar.meetingDate}" size="25" id="calMeeting" navigator="true"
			              maxdate="#{ctBackingBean.managedBean.contractVer.ctContractValue.expDate}" 
				   		  mindate="#{DateUtils.getCurrentDateWithoutTime()}"
			              readonlyInput="true"  showOn="button" pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"
			              disabled="#{amendmentBackingBean.managedBean.disableMeetingDetails}">
			          </p:calendar>
			    </p:column> 
			 
			     <p:column style="width:55%;white-space:normal;" styleClass="column-align-center">
			         <f:facet name="header">
			             <h:outputText value="#{lbl['lbl.ct.location.of.meeting']}" styleClass="required" />
			         </f:facet>
				      <p:inputText value="#{ctMeetingsVar.meetingLocation}" style="width:95%;" maxlength="50"
				      	disabled="#{amendmentBackingBean.managedBean.disableMeetingDetails}"/>
			     </p:column> 
			   
			     <p:column style="width:20%;white-space:normal;"  styleClass="column-align-center">
			        <f:facet name="header">
			             <h:outputText value="#{lbl['lbl.ct.status']}" styleClass="required"/>
			        </f:facet>
				      <p:selectOneMenu value="#{ctMeetingsVar.meetingStatusId}"  style="with:150px;"
				      	disabled="#{amendmentBackingBean.managedBean.disableMeetingDetails}">
			              <f:selectItems value="#{amendmentBackingBean.getMeetingStatusDropdown()}"/>
			          </p:selectOneMenu>
			     </p:column> 	
           </p:dataTable>
    
            <div class="ppRightBtn"> 
		       <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" 
		          action="#{amendmentBackingBean.addPbQccMeetingDetails}"  update="meetingTable"
		          rendered="#{!amendmentBackingBean.managedBean.disableMeetingDetails}"/>
		       <p:commandButton id="meetingDelBtn" value="#{lbl['lbl.ct.delete']}"  process="@this"  partialSubmit="true"
		          onsuccess="dlgMeetingDetails.show();" update="meetingTable" disabled="#{ctBackingBean.managedBean.buttonHideActive}"
		          rendered="#{!amendmentBackingBean.managedBean.disableMeetingDetails}"/>
		    </div>
		    
		    <p:confirmDialog id="dlgMeetingDetails" widgetVar="dlgMeetingDetails" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                         <div class="ppRightBtn">
		                     <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                         update=":form:meetingTable,:form:meetingDelBtn" 
		                         action="#{amendmentBackingBean.delPbQccMeetingDetails}" oncomplete="dlgMeetingDetails.hide();"/>
			                 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgMeetingDetails.hide();" type="button" />
		                 </div>
                   </p:confirmDialog>
      	</p:panel>
</ui:composition>
