<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="meetingPanel" header="#{lbl['lbl.ct.menu.meeting']}" toggleable="true"  toggleSpeed="500">
           <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br/><br/>
           <p:dataTable id="meetingTable" var="ctMeetingsVar" 
                value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.ctMeetings}"
                selection="#{amendmentBackingBean.selectedMeetingUser}" rowKey="#{ctMeetingsVar}">
                <ac:paginator for="meetingTable" />
                <p:column selectionMode="multiple" style="width:2%;"/>
                
                <p:column style="width:25%;white-space:normal;" headerText="#{lbl['lbl.ct.date.of.meeting']}">
			          <p:calendar value="#{ctMeetingsVar.meetingDate}" size="25" id="calMeeting" navigator="true"
			              readonlyInput="true"  showOn="button" pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
			          </p:calendar>
			    </p:column> 
			 
			     <p:column style="width:55%;white-space:normal;" headerText="#{lbl['lbl.ct.location.of.meeting']}">
				      <p:inputText value="#{ctMeetingsVar.meetingLocation}" style="width:95%;"/>
			     </p:column> 
			   
			     <p:column style="width:20%;white-space:normal;" headerText="#{lbl['lbl.ct.status']}">
				      <p:selectOneMenu value="#{ctMeetingsVar.meetingStatusId}" style="with:150px;">
			              <f:selectItems value="#{amendmentBackingBean.getMeetingStatusDropdown()}"/>
			          </p:selectOneMenu>
			     </p:column> 	
           </p:dataTable>
    
            <div class="ppRightBtn"> 
		       <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" icon="ui-icon-add"
		          action="#{amendmentBackingBean.addPbQccMeetingDetails}"  update="meetingTable"/>
		       <p:commandButton value="#{lbl['lbl.btn.delete']}" process="@form" partialSubmit="true"  
		          onclick="dlgMeetingDetails.show();" icon="ui-icon-delete" update="meetingTable"/>
		    </div>
		    
		    <p:dialog id="dlgMeetingDetails" widgetVar="dlgMeetingDetails" styleClass="screen-title" 
		         resizable="false" modal="true" width="350" height="95">  
               
                 <h:panelGrid columns="3">
                      <p:graphicImage library="ep/images/design" name="exclamation.png"
			             value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			          <p:spacer width="10"/>
                      <p:inputTextarea   styleClass="ui-inputtextarea"
                           value="Are you sure you want to delete this record?"  rows="2" cols="48" />
                  </h:panelGrid>
                 
                  <div class="ppRightBtn">
		               <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update="meetingTable" 
		                    process="@form"  action="#{amendmentBackingBean.delPbQccMeetingDetails}" onclick="dlgMeetingDetails.hide();"/>
			           <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgMeetingDetails.hide();" type="button" />
		           </div>
             </p:dialog>
      	</p:panel>
</ui:composition>
