<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="meetingPanel" header="#{lbl['lbl.ct.amend.meetingDtl']}" toggleable="true"  toggleSpeed="500">
      <div style="overflow-x:auto">
      <p:dataTable id="meetingTable" var="ctMeetingsVar" 
        value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.ctMeetings}"
         selection="#{amendmentBackingBean.selectedMeetingUser}" rowKey="#{ctMeetingsVar}">
             <ac:paginator for="meetingTable" />
              <p:column selectionMode="multiple" style="width:2%;" />
			  <p:column style="width:25%;" headerText="#{lbl['lbl.ct.amend.dtofmeeting']}">
			     <p:calendar value="#{ctMeetingsVar.meetingDate}" size="25" id="calMeeting"
			         readonlyInput="true"  showOn="button" pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"/>
			  </p:column> 
			  <p:column style="width:55%;" headerText="#{lbl['lbl.ct.amend.locofmeeting']}">
				    <p:inputText value="#{ctMeetingsVar.meetingLocation}" style="width:95%;"/>
			  </p:column> 
			  <p:column style="width:20%;" headerText="Status">
				 <p:selectOneMenu value="#{ctMeetingsVar.meetingStatusId}" style="with:150px;">
			          <f:selectItems value="#{amendmentBackingBean.getMeetingStatusDropdown()}"/>
			     </p:selectOneMenu>
			  </p:column> 	
        </p:dataTable>
        </div>
          <div class="ppRightBtn"> 
		       <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" 
		          action="#{amendmentBackingBean.addPbQccMeetingDetails}" icon="ui-icon-add" update="meetingTable"/>
		       <p:commandButton value="Delete" process="@form" partialSubmit="true"  
		          onclick="dlgMeetingDetails.show();"  icon="ui-icon-delete" update="meetingTable"/>
		  </div>
		  <p:dialog id="dlgMeetingDetails" widgetVar="dlgMeetingDetails" header="#{lbl['lbl.ct.dialong.cofirm.header']}" styleClass="screen-title"  
              resizable="false" modal="true" width="350" height="95">  
              <h:panelGrid columns="3">
                 <p:graphicImage library="ep/images/design" name="exclamation.png"
			        value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			     <p:spacer width="10"/>
                 <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" 
                    styleClass="ui-inputtextarea"></p:inputTextarea>
              </h:panelGrid>
              <div class="ppRightBtn">
		        <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" icon="ui-icon-accept" update="meetingTable" process="@form" 
			      action="#{amendmentBackingBean.delPbQccMeetingDetails}" onclick="dlgMeetingDetails.hide();"/>
			    <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" icon="ui-icon-reject" onclick="dlgMeetingDetails.hide();" type="button" />
		      </div>
         </p:dialog>
      	</p:panel>
      <p:panel id="committePanel" header="#{lbl['lbl.ct.amend.commmember']}" toggleable="true"  toggleSpeed="500">
        <div style="overflow-x:auto">
         <p:dataTable id="committeTable" var="ctCommitteeVar" 
            value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.ctCommitteeMembers}"
           selection="#{amendmentBackingBean.selectedCommitteMembers}" rowKey="#{ctCommitteeVar}">
            <ac:paginator for="committeTable" />
                 <p:column selectionMode="multiple" style="width:2%;" />
				 <p:column style="width:20%;" headerText="Name">
				   <p:outputLabel value="#{ctCommitteeVar.memberName}" style="float:left;"/>
				 </p:column> 
				 <p:column style="width:15%;" headerText="Identification No.">
				    <p:outputLabel value="#{ctCommitteeVar.icPassport}" style="float:left;"/>
				 </p:column>  
				 <p:column style="width:15%;" headerText="Designation">
				   <p:outputLabel value="#{ctCommitteeVar.designation}" style="float:left;"/>
				 </p:column> 
				 <p:column style="width:15%;" headerText="Email">
				    <p:outputLabel value="#{ctCommitteeVar.email}" style="float:left;"/>
				 </p:column> 
				 <p:column style="width:10%;" headerText="Grade">
				     <p:outputLabel value="#{ctCommitteeVar.grade}" style="float:left;"/>
				 </p:column> 
				 <p:column headerText="PNP">
				     <h:outputText value="#{ctCommitteeVar.pnp ? 'Yes' : 'No'}"  style="float:left;"/>
				 </p:column>
				 <p:column headerText="Role">
					 <ui:fragment rendered="#{ctCommitteeVar.pnp == true}">
							<h:outputText value="Chairperson" />
					 </ui:fragment>
					<ui:fragment rendered="#{ctCommitteeVar.pnp == false}">
						<p:selectOneMenu id="appaction" value="#{ctCommitteeVar.memberRole.parameterId}"
							style="width: 110px;margin-bottom: 5px;">
							 <f:selectItems
								value="#{amendmentBackingBean.getDropdownValues(ParameterTypeConst.committeeRole)}" />
							</p:selectOneMenu>
						 </ui:fragment>
				</p:column>
	      </p:dataTable>
         </div>
         <div class="ppRightBtn"> 
		      <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" onclick="memCommitteDialog.show();"  icon="ui-icon-add"/>
		      <p:commandButton value="#{lbl['lbl.btn.delete']}" process="@form" onclick="dlgCommitteDetails.show();"
		         icon="ui-icon-delete" update="committeTable"/>
		 </div>
		 <p:dialog id="dlgCommitteDetails" widgetVar="dlgCommitteDetails" header="Delete Confirmation" styleClass="screen-title"  
              resizable="false" modal="true" width="350" height="95">  
              <h:panelGrid columns="3">
                 <p:graphicImage library="ep/images/design" name="exclamation.png"
			        value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			     <p:spacer width="10"/>
                 <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" 
                    styleClass="ui-inputtextarea"></p:inputTextarea>
              </h:panelGrid>
              <div class="ppRightBtn">
		        <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" icon="ui-icon-accept" update="committeTable" process="@form" 
			      action="#{amendmentBackingBean.delCommitteMembers}" onclick="dlgCommitteDetails.hide();"/>
			    <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" icon="ui-icon-reject" onclick="dlgCommitteDetails.hide();" type="button" />
		      </div>
         </p:dialog>
		</p:panel>
		<p:dialog id="memCommitteDialog" header="New Committee Member" widgetVar="memCommitteDialog" modal="true" 
		   width="850" height="500">
		    <h:panelGrid columns="2" style="width:100%;" columnClasses="columnWidth20">
		       <p:outputLabel value="*Selection"/>
		         <p:selectOneRadio id="radiOptions1" value="#{amendmentBackingBean.managedBean.selectedRadioButton}" 
		           required="true">  
                    <f:selectItem itemLabel="Existing List" itemValue="1"/>  
                    <f:selectItem itemLabel="New" itemValue="2" /> 
                      <p:ajax event="change"  listener="#{amendmentBackingBean.radioButtonForMeeting}" 
                         process="@this" update="@([id$=changeField1])"/> 
                 </p:selectOneRadio> 
	        </h:panelGrid>
	        <p:outputPanel id="changeField1">
	          <h:panelGroup rendered="#{amendmentBackingBean.managedBean.existingUsers}">
		       <p:panel id="searchPanel" header="Search" toggleable="true"  toggleSpeed="500">
		        <h:panelGrid columns="2" width="100%" columnClasses="columnWidth20">
		          <p:outputLabel for="nameId" value="Name" />
	              <p:inputText id="nameId" value="#{amendmentBackingBean.managedBean.name}" style="width:260px;"/>
                  <p:outputLabel for="idenType" value="Identification Type" />
	              <p:selectOneMenu id="idenType" value="#{amendmentBackingBean.managedBean.identificationType}"
	                  style="width:180px;margin-bottom: 5px;">
	                <f:selectItems value="#{amendmentBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}"/>
	              </p:selectOneMenu>
	              <p:outputLabel for="idenNo" value="Identification No." />
	              <p:inputText id="idenNo"  style="width:170px;"
	                 value="#{amendmentBackingBean.managedBean.identificationNo}"/>
                </h:panelGrid>  
                <div class="ppRightBtn"> 
                  	<p:commandButton value="Search" icon="ui-icon-search"
						action="#{amendmentBackingBean.existingCommitteMemberList}"
						update="newCommitteTable" partialSubmit="true"
						process="@form" />
		           <p:commandButton value="Reset" process="@this" partialSubmit="true"  icon="ui-icon-reset" update="changeField"/>
		        </div> 
		      </p:panel>
		      <p:panel id="searchResult" header="#{lbl['lbl.ct.tpl.result']}" toggleable="true"  toggleSpeed="500">
		        <div style="overflow-x:auto">
                 <p:dataTable id="newCommitteTable" var="existuser" 
                   value="#{amendmentBackingBean.managedBean.externalUsers}"
                   rowKey="#{existuser}" selection="#{amendmentBackingBean.selectedPmUser}">
                   <ac:paginator for="newCommitteTable" />
                      <p:column selectionMode="multiple" style="width:2%" />
				       <p:column style="width:20%;" headerText="Name">
				          <p:outputLabel value="#{existuser.userName}" style="float:left;"/>
				       </p:column> 
				       <p:column style="width:15%;" headerText="Identification No.">
				         <p:outputLabel value="#{existuser.identificationNo}" style="float:left;"/>
				       </p:column> 
				       <p:column style="width:15%;" headerText="Designation">
				          <p:outputLabel value="#{existuser.designation}" style="float:left;"/>
				       </p:column> 
				       <p:column style="width:15%;" headerText="Email">
				          <p:outputLabel value="#{existuser.pmAddressTypes[0].pmAddress.email}" style="float:left;"/>
				       </p:column> 
				       <p:column style="width:10%;" headerText="Grade">
				          <p:outputLabel value="#{existuser.grade}" style="float:left;"/>
				       </p:column> 
				       <p:column style="width:10%;" headerText="PMP">
				          <p:outputLabel value="#{existuser.PMP ? 'Yes' : 'No'}" style="float:left;"/>
				       </p:column> 
	           </p:dataTable>
              </div>
              <div class="ppRightBtn"> 
		          <p:commandButton value="Ok" process="@this,changeField1" partialSubmit="true" 
		          actionListener="#{amendmentBackingBean.okCommitteMembers}" icon="ui-icon-ok" 
		          update="committeTable" onclick="memCommitteDialog.hide();"/>
		          <p:commandButton value="Cancel" process="@this" partialSubmit="true"  icon="ui-icon-cancel"
		             onclick="memCommitteDialog.close()"/>
		        </div> 
		    </p:panel>
		    </h:panelGroup>
		    <h:panelGroup rendered="#{amendmentBackingBean.managedBean.newUsers}">
		        <p:panel id="newUser" header="New User" toggleable="true"  toggleSpeed="500">
		        <h:panelGrid columns="2" width="100%" columnClasses="columnWidth20">
		          <p:outputLabel for="newNameId" value="Name" />
	              <p:inputText id="newNameId" style="width:260px;"
	                 value="#{amendmentBackingBean.managedBean.ctCommitteeMember.memberName}"/>
                  <p:outputLabel for="newIdenType" value="Identification Type" />
	              <p:selectOneMenu id="newIdenType" style="width:180px;margin-bottom: 5px;"
	                value="#{amendmentBackingBean.managedBean.ctCommitteeMember.pmUser.userId}">
	                <f:selectItems value="#{amendmentBackingBean.getDropdownValues(ParameterTypeConst.identificationTypes)}"/>
	              </p:selectOneMenu>
	              <p:outputLabel for="newIdenNo" value="Identification No." />
	              <p:inputText id="newIdenNo" style="width:170px;"
	                value="#{amendmentBackingBean.managedBean.ctCommitteeMember.icPassport}"/>
	              <p:outputLabel for="newGrade" value="Grade" />
	              <p:inputText id="newGrade" style="width:170px;"
	                value="#{amendmentBackingBean.managedBean.ctCommitteeMember.grade}"/>
	              <p:outputLabel value="PNP"/>
		          <h:panelGrid columns="4">
		            <p:selectOneRadio id="pandp" required="true"
		               value="1">  
                       <f:selectItem itemLabel="Yes" itemValue="1"/>  
                       <f:selectItem itemLabel="No" itemValue="0" /> 
                    </p:selectOneRadio> 
	              </h:panelGrid>
	               <p:outputLabel for="newDesignation" value="Designation" />
	              <p:inputText id="newDesignation" style="width:170px;"
	                 value="#{amendmentBackingBean.managedBean.ctCommitteeMember.designation}"/>
	              <p:outputLabel for="newEmail" value="Email" />
	              <p:inputText id="newEmail" style="width:170px;"
	                value="#{amendmentBackingBean.managedBean.ctCommitteeMember.email}"/>
	              <p:outputLabel for="newRole" value="Role" />
	              <p:selectOneMenu id="newRole" style="width:180px;"
	                value="#{amendmentBackingBean.managedBean.ctCommitteeMember.memberRole.parameterId}">
	                <f:selectItems />
	              </p:selectOneMenu>
                </h:panelGrid>
                 <div class="ppRightBtn">
		           <p:commandButton value="Ok" icon="ui-icon-ok" process="@form"  update=":form"
			         action="#{amendmentBackingBean.addNewUserMemberCommitte()}"  onclick="memCommitteDialog.hide();"  />
			        <p:commandButton value="Cancel" icon="ui-icon-cancel" onclick="memCommitteDialog.hide();" type="button" />
		         </div>  
		         </p:panel>
		    </h:panelGroup>
		   </p:outputPanel>    
		</p:dialog>
</ui:composition>
