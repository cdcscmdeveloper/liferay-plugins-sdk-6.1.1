<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <p:panel id="amend" header="#{lbl['lbl.ct.amend.panel.header']}"    toggleable="true"  toggleSpeed="500">
      <h:panelGrid columns="4" style="width:800px;" columnClasses="columnWidth15"> 
       <p:outputLabel for="txtrno" value="#{lbl['lbl.ct.amend.txt.rno']}" />
       <p:inputText   id="txtrno"  disabled="true" style="width:170px;"/>
        <p:outputLabel value="Extension of Contract" />
	   <p:selectBooleanCheckbox value=" " disabled="false" />
       <p:outputLabel for="txtrdate" value="#{lbl['lbl.ct.amend.txt.rdate']}" />
       <p:inputText   id="txtrdate" value="#{contractDetailsBackingBean.managedBean.ctContract.createdDate}"  disabled="true" style="width:170px;" />
        <p:outputLabel value="Change of item price" />
	   <p:selectBooleanCheckbox value=" " disabled="false" />
       <p:outputLabel for="txtname" value="#{lbl['lbl.ct.amend.txt.name']}" />
       <p:inputText   id="txtname" value="#{contractDetailsBackingBean.managedBean.ctAmendment.title}" style="width:170px;" />
       <p:outputLabel value="Change of quantity" />
	   <p:selectBooleanCheckbox value=" " disabled="false" />
       <p:outputLabel for="txtfrno" value="#{lbl['lbl.ct.amend.txt.frno']}"  />
       <p:inputText   id="txtfrno" value="#{contractDetailsBackingBean.managedBean.ctAmendment.fileRefNo}" style="width:170px;" /> 
       <p:outputLabel value="Change of contract value" />
	   <p:selectBooleanCheckbox value=" " disabled="false" />
        <h:panelGroup>
            <div style="height: 40px;vertical-align: top">
	             <p:outputLabel for="txtdesc" value="#{lbl['lbl.ct.amend.txt.desc']}" />
            </div>
        </h:panelGroup>
       <h:panelGrid>
          <p:inputTextarea id="txtdesc" value="#{contractDetailsBackingBean.managedBean.ctAmendment.description}"  rows="2" cols="31"/>
	   </h:panelGrid>
	    <p:outputLabel value="#{lbl['lbl.ct.amend.txt.avalue']}" />
         <p:inputText  style="width:80px;"/> 
         <p:outputLabel value="#{lbl['lbl.ct.amend.txt.effdate']}" />
       <p:calendar style="width:170px;" value="#{contractDetailsBackingBean.managedBean.ctAmendment.amendmentEffDate}" id="edateCal" showOn="button" />
	   <p:outputLabel  value="#{lbl['lbl.ct.amend.txt.ceperiod']}" />
          <h:panelGrid columns="3">
             <p:inputText id="ceperiod"  style="width:80px;"/>
             <p:spacer width="1"/>
             <p:selectOneMenu  style="width:65px;">
		       <f:selectItem itemLabel="Months" itemValue="1" /> 
		       <f:selectItem itemLabel="Years" itemValue="2" /> 
		     </p:selectOneMenu>   
            </h:panelGrid>
            <p:outputLabel value="#{lbl['lbl.ct.amend.txt.cestart']}"/>
            <p:calendar style="width:170px;" value="#{contractDetailsBackingBean.managedBean.contractValues.effDate}" id="efdateCal" showOn="button" /> 
            <p:outputLabel value="#{lbl['lbl.ct.amend.txt.ceend']}" />
            <p:calendar style="width:170px;" value="#{contractDetailsBackingBean.managedBean.contractValues.expDate}" id="exdateCal" showOn="button" /> 
             <p:outputLabel value="#{lbl['lbl.ct.amend.txt.apr.date']}" />
              <p:calendar style="width:170px;" value="#{contractDetailsBackingBean.managedBean.ctAmendment.approvedDate}" id="adateCal" showOn="button" />
             <p:outputLabel value="#{lbl['lbl.ct.amend.txt.apr.name']}" />
             <p:inputText   style="width:170px;" />
           </h:panelGrid>
           <h:panelGrid columns="2" style="width:800px;" columnClasses="columnWidth15">  
           <h:panelGroup>
              <div style="height: 45px; float:right; vertical-align:top">
	              <p:outputLabel for="contractHistory" value="#{lbl['lbl.ct.amend.txt.history']}" />
             </div>
      	   </h:panelGroup>
           <h:panelGrid id="contractHistory" columns="1">
              <p:dataTable id="dataTableHistory" var="data"  value=" "   rowIndexVar="index">
                 <p:columnGroup type="header"> 
                    <p:row> 
                      <p:column rowspan="1" headerText="#{lbl['lbl.ct.amend.txt.no']}"/>
                      <p:column rowspan="1" headerText="#{lbl['lbl.ct.amend.tbl.rno']}" />
                      <p:column colspan="1" headerText="#{lbl['lbl.ct.amend.tbl.eperiod']}"  /> 
                      <p:column rowspan="1" headerText="#{lbl['lbl.ct.amend.tbl.sdate']}" />
                      <p:column colspan="1" headerText="#{lbl['lbl.ct.amend.tbl.edate']}"  /> 
                    </p:row>
                 </p:columnGroup>
                    <p:column styleClass="column-align-center"  > <h:outputText value="#{index+1}" /></p:column> 						
                    <p:column> <h:outputText /></p:column>
                    <p:column><h:outputText /></p:column>
                    <p:column> <h:outputText  /></p:column>
                    <p:column><h:outputText  /></p:column>
                </p:dataTable>
             </h:panelGrid>
           </h:panelGrid>
      	</p:panel>
</ui:composition>
