<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
      <p:panel id="amend" header="#{lbl['lbl.ct.amend.panel.header']}"    toggleable="true"  toggleSpeed="500" widgetVar="panelamends">
      <h:panelGrid columns="4" style="width:680px;">  
         <p:outputLabel for="txtrno" value="#{lbl['lbl.ct.amend.txt.rno']}" />
         <p:inputText   id="txtrno"  disabled="true" style="width:170px;"/>
         <p:outputLabel for="txtrdate" value="#{lbl['lbl.ct.amend.txt.rdate']}" />
         <p:inputText   id="txtrdate" value="#{contractDetailsBackingBean.managedBean.ctContract.createdDate}"  disabled="true" style="width:170px;" />
          <p:outputLabel for="txtname" value="#{lbl['lbl.ct.amend.txt.name']}" />
         <p:inputText   id="txtname" value="#{contractDetailsBackingBean.managedBean.ctAmendment.title}" style="width:170px;" />
         <p:outputLabel for="txtfrno" value="#{lbl['lbl.ct.amend.txt.frno']}"  />
         <p:inputText   id="txtfrno" value="#{contractDetailsBackingBean.managedBean.ctAmendment.fileRefNo}" style="width:170px;" />
        </h:panelGrid>
        <h:panelGrid columns="2">  
       
        <h:panelGroup>
            <div style="height: 40px;width:120px; vertical-align: top">
	             <p:outputLabel for="txtdesc" value="#{lbl['lbl.ct.amend.txt.desc']}" />
            </div>
        </h:panelGroup>
       <h:panelGrid>
          <p:inputTextarea id="txtdesc" value="#{contractDetailsBackingBean.managedBean.ctAmendment.description}"  rows="2" cols="63"/>
	   </h:panelGrid>
       </h:panelGrid>
       <h:panelGrid columns="4" style="width:720px;">  
          <p:outputLabel  value="#{lbl['lbl.ct.amend.txt.ceperiod']}" />
          <h:panelGrid columns="3">
             <p:inputText id="ceperiod"  style="width:90px;"/>
             <p:selectOneMenu value=" " style="width:70px;">
		       <f:selectItem itemLabel="Months" itemValue="1" /> 
		       <f:selectItem itemLabel="Years" itemValue="2" /> 
		     </p:selectOneMenu>   
            </h:panelGrid>
            <p:outputLabel value="#{lbl['lbl.ct.amend.txt.cestart']}"/>
            <p:inputText style="width:170px;" />
            <p:outputLabel value="#{lbl['lbl.ct.amend.txt.ceend']}" />
            <p:inputText   style="width:170px;"/>
            <p:outputLabel value="#{lbl['lbl.ct.amend.txt.effdate']}" />
            <p:inputText style="width:170px;" />
            <p:outputLabel value="#{lbl['lbl.ct.amend.txt.avalue']}" />
            <p:inputText  style="width:50px;"/>
             <p:outputLabel value="#{lbl['lbl.ct.amend.txt.apr.date']}" />
             <p:inputText style="width:170px;" />
             <p:outputLabel value="#{lbl['lbl.ct.amend.txt.apr.name']}" />
             <p:inputText   style="width:170px;" />
           </h:panelGrid>
           <h:panelGrid columns="2" style="width:660px;">  
           <h:panelGroup>
              <div style="height: 45px;width:100px; vertical-align: top">
	              <p:outputLabel for="contractHistory" value="#{lbl['lbl.ct.amend.txt.history']}" />
             </div>
      	   </h:panelGroup>
           <h:panelGrid id="contractHistory" columns="1">
              <p:dataTable id="dataTableHistory" var="data"  value=" "   rowIndexVar="index">
                 <p:columnGroup type="header"> 
                    <p:row> 
                      <p:column rowspan="1" headerText="#{lbl['lbl.ct.amend.txt.no']}"/>
                      <p:column rowspan="1" headerText="#{lbl['lbl.ct.amend.tbl.rno']}" />
                      <p:column colspan="1" headerText="#{lbl['lbl.ct.amend.tbl.eperiod']}"  /> 
                      <p:column rowspan="1" headerText="#{lbl['lbl.ct.amend.tbl.sdate']}" />
                      <p:column colspan="1" headerText="#{lbl['lbl.ct.amend.tbl.edate']}"  /> 
                    </p:row>
                 </p:columnGroup>
                    <p:column styleClass="column-align-center"  > <h:outputText value="#{index+1}" /></p:column> 						
                    <p:column> <h:outputText /></p:column>
                    <p:column><h:outputText /></p:column>
                    <p:column> <h:outputText  /></p:column>
                    <p:column><h:outputText  /></p:column>
                </p:dataTable>
             </h:panelGrid>
           </h:panelGrid>
      	</p:panel>
</ui:composition>
