<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel id="amend" header="#{lbl['lbl.ct.amend.panel.header']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="4" style="width:100%"	columnClasses="columnWidth15">
			<p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" style="height:20px;" />
			<h:outputText value="Contract extension" />
			<f:verbatim />
			<f:verbatim />
			<p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.priceChange}" style="height:20px;" />
			<h:outputText value="Change item price" />
			<f:verbatim />
			<f:verbatim />			
			<p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.quantityChange}" style="height:20px;" />
			<h:outputText value="Change quantity" />
			<f:verbatim />
			<f:verbatim />			
			<p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.valueChange}" style="height:20px;" />
			<h:outputText value="Change contract value" />
			<f:verbatim />
			<f:verbatim />						
			<p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.valueChange}" style="height:20px;" />
			<h:outputText value="Change clause" />
			<f:verbatim />
			<f:verbatim />
			<p:spacer height="20px" />
			<f:verbatim />
			<f:verbatim />
			<f:verbatim />				
			
			<p:outputLabel for="txtname" value="#{lbl['lbl.ct.amend.txt.name']}" />
			<p:inputText id="txtname" style="width:170px;"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.title}"  />
			<p:outputLabel value="#{lbl['lbl.ct.amend.txt.effdate']}" />
			<p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.amendmentEffDate}"
				id="edateCal" showOn="button" />
			<h:panelGroup>
				<div style="height: 40px; vertical-align: top;">
					<p:outputLabel for="txtdesc" value="#{lbl['lbl.ct.amend.txt.desc']}" />
				</div>
			</h:panelGroup>
			<h:panelGrid>
				<p:inputTextarea id="txtdesc" rows="2" cols="33"
					value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.description}"  />
			</h:panelGrid>					
			<p:outputLabel for="txtfrno" value="#{lbl['lbl.ct.amend.txt.frno']}" />
			<p:inputText id="txtfrno"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.fileRefNo}"
				style="width:170px;" />
			<p:outputLabel value="#{lbl['lbl.ct.amend.txt.ceperiod']}" />
			<h:panelGrid columns="3">
				<p:inputText id="ceperiod" style="width:110px;" />
				<p:spacer width="1" />
				<p:outputLabel value="Months" />
			</h:panelGrid>
			<f:verbatim />
			<f:verbatim />			
			<p:outputLabel value="#{lbl['lbl.ct.amend.txt.cestart']}" />
			<p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate}"
				id="efdateCal" showOn="button" />
			<p:outputLabel value="#{lbl['lbl.ct.amend.txt.ceend']}" />
			<p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate}"
				id="exdateCal" showOn="button" />
			<p:outputLabel value="#{lbl['lbl.ct.amend.txt.avalue']}" />
			<p:inputText style="width:110px;" />
			<p:outputLabel value="New Contract Value" />
			<p:inputText style="width:110px;" disabled="true" />
		</h:panelGrid>
		<h:panelGrid columns="2" style="width:100%"
			columnClasses="columnWidth15">
			<h:panelGroup>
				<div style="height: 45px; float: right; vertical-align: top">
					<p:outputLabel for="contractHistory"
						value="#{lbl['lbl.ct.amend.txt.history']}" />
				</div>
			</h:panelGroup>
			<h:panelGrid id="contractHistory" columns="1">
				<p:dataTable id="dataTableHistory" var="data" value=" "
					rowIndexVar="index">
					<p:columnGroup type="header">
						<p:row>
							<p:column headerText="#{lbl['lbl.ct.amend.tbl.rno']}" />
							<p:column headerText="#{lbl['lbl.ct.amend.tbl.eperiod']}" />
							<p:column headerText="#{lbl['lbl.ct.amend.tbl.sdate']}" />
							<p:column headerText="#{lbl['lbl.ct.amend.tbl.edate']}" />
						</p:row>
					</p:columnGroup>
					<p:column>
						<h:outputText />
					</p:column>
					<p:column>
						<h:outputText />
					</p:column>
					<p:column>
						<h:outputText />
					</p:column>
					<p:column>
						<h:outputText />
					</p:column>
				</p:dataTable>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
</ui:composition>
