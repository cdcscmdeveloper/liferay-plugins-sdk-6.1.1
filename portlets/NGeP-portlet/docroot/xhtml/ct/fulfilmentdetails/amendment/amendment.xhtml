<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel id="amend" header="#{lbl['lbl.ct.amend.panel.header']}" toggleable="true" toggleSpeed="500">	
	<table style="width: 100%">
	  <tr>
	      <td style="width:115px;"><f:verbatim /></td>
		  <td>	<p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" 
		        style="height:20px;" />
			    <h:outputText value="Contract extension" /></td>
	  </tr>	
	  <tr>
		  <td> </td>
		    <td><p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.priceChange}" 
		        style="height:20px;" />
			   <h:outputText value="Change item price" /></td>
	  </tr>
		<tr>
		<td> </td>
		  <td><p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.quantityChange}" 
		      style="height:20px;" />
			  <h:outputText value="Change quantity" /></td>
		</tr>
		<tr>
		    <td> </td>
		    <td><p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.valueChange}" 
		        style="height:20px;" />
			    <h:outputText value="Change contract value" /></td>
	    </tr>
	    <tr>
		<td> </td>
		<td><p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.valueChange}" 
		    style="height:20px;" />
			<h:outputText value="Change clause" /></td>
		</tr>
	</table>
	<table style="width: 100%">
	  <tr>
	      <td style="width:115px;"><p:outputLabel for="txtname" value="#{lbl['lbl.ct.amend.txt.name']}" /></td>		
	      <td> <p:inputText id="txtname" style="width:170px;"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.title}"  /></td>	
		  <td> <p:outputLabel for="txtfrno" value="#{lbl['lbl.ct.amend.txt.frno']}" /> </td>
		  <td> <p:inputText id="txtfrno"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.fileRefNo}"
				style="width:150px;"/>
		  </td>
		  <td style="width:115px;"><f:verbatim/></td>
	 </tr>
	 </table>
	  <h:panelGrid columns="2">
	     <h:panelGroup>
				 <div style="height:70px;width:115px; vertical-align: top;">
					<p:outputLabel for="txtdesc" value="#{lbl['lbl.ct.amend.txt.desc']}" /></div>
			  </h:panelGroup>
		   <h:panelGrid>
				<h:inputTextarea id="txtdesc" rows="5" cols="103"
					value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.description}"  />
			  </h:panelGrid>
		   </h:panelGrid>
	  <p:outputPanel>
	  <table style="width: 100%">
	  <tr>
	      <td style="width:115px;"> <p:outputLabel value="#{lbl['lbl.ct.amend.txt.effdate']}" /></td>
		 <td> <p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctAmendment.amendmentEffDate}"
				id="edateCal" showOn="button" /> </td>
		 <td> <h:outputLabel value="#{lbl['lbl.ct.amend.txt.ceperiod']}" /></td>
		 <td> <h:panelGrid columns="3">
				<p:inputText id="ceperiod" style="width:65px;" />
				<p:spacer width="1" />
				<p:outputLabel value="Months" />
			 </h:panelGrid></td>
			  <td style="width:130px;"><f:verbatim/></td>
		</tr>
	  
		<tr>
		<td><p:outputLabel value="#{lbl['lbl.ct.amend.txt.cestart']}" /></td>	
		<td><p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate}"
				id="efdateCal" showOn="button" /></td>
		<td><p:outputLabel value="#{lbl['lbl.ct.amend.txt.ceend']}" /></td>
		<td><p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate}"
				id="exdateCal" showOn="button" /></td>
				 <td style="width:130px;"><f:verbatim/></td>
		</tr>
		<tr>
		<td><p:outputLabel value="#{lbl['lbl.ct.amend.txt.avalue']}" /></td>
		<td><p:inputText style="width:150px;" /></td>
		<td><p:outputLabel value="New Contract Value" /></td>
		<td><p:inputText style="width:150px;" disabled="true" /></td>
		 <td style="width:130px;"><f:verbatim/></td>
	    </tr>
	    
	   </table>
	   </p:outputPanel>
	   <h:panelGrid columns="2" style="width:100%"
			columnClasses="columnWidth15">
			<h:panelGroup>
				<div style="height: 35px; float: right; vertical-align: top">
					<p:outputLabel for="contractHistory"
						value="#{lbl['lbl.ct.amend.txt.history']}" />
				</div>
			</h:panelGroup>
			<h:panelGrid id="contractHistory" columns="1">
				<p:dataTable id="dataTableHistory" var="data" value=" "
					rowIndexVar="index">
					<p:columnGroup type="header">
						<p:row>
							<p:column headerText="#{lbl['lbl.ct.amend.tbl.rno']}" />
							<p:column headerText="#{lbl['lbl.ct.amend.tbl.eperiod']}" />
							<p:column headerText="#{lbl['lbl.ct.amend.tbl.sdate']}" />
							<p:column headerText="#{lbl['lbl.ct.amend.tbl.edate']}" />
						</p:row>
					</p:columnGroup>
					<p:column>
						<h:outputText />
					</p:column>
					<p:column>
						<h:outputText />
					</p:column>
					<p:column>
						<h:outputText />
					</p:column>
					<p:column>
						<h:outputText />
					</p:column>
				</p:dataTable>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
</ui:composition>
