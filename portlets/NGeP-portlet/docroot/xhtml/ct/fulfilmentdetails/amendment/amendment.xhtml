<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
      <p:panel id="amend" header="#{lbl['lbl.ct.amend.panel.header']}"    toggleable="true"  toggleSpeed="500" widgetVar="panelamends">
      <h:panelGrid columns="4" style="width:700px;">  
         <p:outputLabel value="#{lbl['lbl.ct.amend.txt.rno']}" />
         <h:panelGrid columns="2">
            <p:inputText value="" disabled="true" style="width:30px;"/>
            <p:inputText value="" disabled="true" style="width:100px;"/>
         </h:panelGrid>
         <p:outputLabel value="#{lbl['lbl.ct.amend.txt.rdate']}" />
         <p:inputText value=""  disabled="true" />
         <p:outputLabel value="#{lbl['lbl.ct.amend.txt.name']}" />
         <p:inputText value=""  disabled="true" style="width:170px;" />
         <p:outputLabel value="#{lbl['lbl.ct.amend.txt.frno']}"  />
         <p:inputText value=""  disabled="true" />
        </h:panelGrid>
        <h:panelGrid columns="2" style="width:750px;">  
        <h:panelGroup>
            <div style="height: 45px;width:120px; vertical-align: top">
	             <p:outputLabel for="amendmentD" value="#{lbl['lbl.ct.amend.txt.desc']}" />
            </div>
        </h:panelGroup>
       <h:panelGrid>
          <p:inputTextarea id="amendmentD" value="" required="false"  rows="2" cols="74" disabled="true" autoResize="false" />
	   </h:panelGrid>
       </h:panelGrid>
       <h:panelGrid columns="4" style="width:700px;">  
          <p:outputLabel value="#{lbl['lbl.ct.amend.txt.ceperiod']}" />
          <h:panelGrid columns="3">
             <p:inputText value="" disabled="true" style="width:90px;"/>
             <p:selectOneMenu value=" " style="width:40px;">
		       <f:selectItem itemLabel="Months" itemValue="1" /> 
		       <f:selectItem itemLabel="Years" itemValue="1" /> 
		     </p:selectOneMenu>   
            </h:panelGrid>
            <p:outputLabel value="#{lbl['lbl.ct.amend.txt.cestart']}"/>
            <p:inputText value=""  disabled="true" />
            <p:outputLabel value="#{lbl['lbl.ct.amend.txt.ceend']}" />
            <p:inputText value=""  disabled="true" style="width:170px;"/>
            <p:outputLabel value="#{lbl['lbl.ct.amend.txt.effdate']}" />
            <p:inputText value=""  disabled="true" />
            <p:outputLabel value="#{lbl['lbl.ct.amend.txt.avalue']}" />
            <h:panelGrid columns="3">
              <p:inputText value="" disabled="true" style="width:100px;"/>
                 <p:selectOneMenu value=" " style="width:30px;">
		            <f:selectItem itemLabel="MYR" itemValue="1" /> 
		            <f:selectItem itemLabel="SGD" itemValue="1" /> 
		         </p:selectOneMenu>   
             </h:panelGrid> 
             <p:outputLabel value="#{lbl['lbl.ct.amend.txt.apr.date']}" />
             <p:inputText value=""  disabled="true" />
             <p:outputLabel value="#{lbl['lbl.ct.amend.txt.apr.name']}" />
             <p:inputText value=""  disabled="true" style="width:170px;" />
           </h:panelGrid>
           <h:panelGrid columns="2" style="width:700px;">  
           <h:panelGroup>
              <div style="height: 45px;width:140px; vertical-align: top">
	              <p:outputLabel for="contractHistory" value="#{lbl['lbl.ct.amend.txt.history']}" />
             </div>
      	   </h:panelGroup>
           <h:panelGrid id="contractHistory" columns="1">
              <p:dataTable id="dataTableHistory" var="data"  value=" "   rowIndexVar="index">
                 <p:columnGroup type="header"> 
                    <p:row> 
                      <p:column rowspan="1" headerText="#{lbl['lbl.ct.amend.txt.no']}"/>
                      <p:column rowspan="1" headerText="#{lbl['lbl.ct.amend.tbl.rno']}" />
                      <p:column colspan="1" headerText="#{lbl['lbl.ct.amend.tbl.eperiod']}"  /> 
                      <p:column rowspan="1" headerText="#{lbl['lbl.ct.amend.tbl.sdate']}" />
                      <p:column colspan="1" headerText="#{lbl['lbl.ct.amend.tbl.edate']}"  /> 
                    </p:row>
                 </p:columnGroup>
                    <p:column styleClass="column-align-center"  > <h:outputText value="#{index+1}" /></p:column> 						
                    <p:column> <h:outputText value=" " /></p:column>
                    <p:column><h:outputText value=" " /></p:column>
                    <p:column> <h:outputText value=" " /></p:column>
                    <p:column><h:outputText value=" " /></p:column>
                </p:dataTable>
             </h:panelGrid>
           </h:panelGrid>
      	</p:panel>
</ui:composition>
