<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="itemId" header="#{lbl['lbl.ct.panel.product']}" toggleable="true"	
	     toggleSpeed="500"  rendered="#{amendmentBackingBean.managedBean.itemProductExist}" >
	     <!-- <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.product.dtls']}"/> -->
		<h:panelGrid style="width:100%;">
		
			<p:dataTable id="itemTable" var="ctItemVar" widgetVar="ctItemsTableObj"
			    value="#{amendmentBackingBean.managedBean.ctItemList}"  selectionMode="single"	
			    selection="#{amendmentBackingBean.managedBean.selectedItem}"  rowKey="#{ctItemVar}">
				<ac:paginator for="itemTable" />
				<p:ajax event="rowSelect" update=":form:itemId" process="@this"  />
			
				<p:column headerText="#{lbl['lbl.ct.item.desc']}" 
				      style="width:35%; white-space:normal;" filterBy="#{ctItemVar.itemName}" filterMatchMode="contains">
					<p:outputLabel value="#{ctItemVar.itemName}" style="float:left;" />
				</p:column>
			
				<p:column style="width:10%; white-space:normal;" headerText="#{lbl['lbl.ct.type.of.goods']}">
					<p:outputLabel value="#{amendmentBackingBean.getParameterDesc(ctItemVar.itemOrigin)}" style="float:left;" />
				</p:column>				
			
				<p:column headerText="#{lbl['lbl.ct.uom']}" style="width:10%; white-space:normal;">
					<p:outputLabel value="#{ctItemVar.uom.uomName}" style="float:left;" />
				</p:column>
			
				<p:column headerText="#{lbl['lbl.ct.min.order.qty']}" style="width:10%; white-space:normal;text-align: right;">
					<h:outputText value="#{ctItemVar.minimumOrderQty}" >
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, ctItemVar.uom.uomCode)}" />					
					</h:outputText>
				</p:column>
			
				<p:column headerText="#{lbl['lbl.ct.max.order.qty']}" style="width:10%; white-space:normal;text-align: right;">
					<h:outputText value="#{ctItemVar.maxQuantity}" >
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, ctItemVar.uom.uomCode)}" />
					</h:outputText>
				</p:column>
			
			
				<p:column headerText="#{lbl['lbl.ct.new.max.order.qty']}" style="text-align: right;width:15%; white-space:normal;" 
				   rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange}">
					<p:inputText style="width:75px;" value="#{ctItemVar.newMaxQuantity}" disabled="true" styleClass="ppRightBtn" label="#{lbl['lbl.ct.new.max.order.qty']}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, ctItemVar.uom.uomCode)}" />					
					</p:inputText>
					<p:spacer width="5"/>
					<p:commandLink update=":form:dlgItemMaxQty,itemTable" oncomplete="dlgItemMaxQty.show();return false;">
						<f:setPropertyActionListener value="#{ctItemVar}" target="#{amendmentBackingBean.managedBean.selectedItem}" />
						<p:graphicImage library="ep/images/design" name="edit.png" value="/css/images/design/edit.png" title="Edit" style="margin-bottom: -4px;" />
					</p:commandLink>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.ct.status']}" style="width:10%; white-space:normal;">
		            <p:outputLabel value="#{ctItemVar.recordStatusFlg == 1 ?  lbl['lbl.ct.active'] : lbl['lbl.ct.inactive'] }"/>
		        </p:column> 
				
			</p:dataTable>
			
			<p:dialog id="dlgItemMaxQty" widgetVar="dlgItemMaxQty" 
			     header="#{lbl['lbl.ct.amend.max.qty']}" styleClass="screen-title" resizable="false" modal="true" width="450" height="200">
			  	    <h:panelGrid columns="1">
				    	<p:outputLabel value="#{lbl['lbl.ct.item.desc']}" >: #{amendmentBackingBean.managedBean.selectedItem.itemName}</p:outputLabel>
				     </h:panelGrid>
				     <p:spacer  height="5"/>
				
				     <p:dataTable id="ctItemMaxQtyTable" var="itemMaxQtiesVar" 
				           value="#{amendmentBackingBean.managedBean.selectedItem.ctItemMaxQties}">
					       <ac:paginator for="ctItemMaxQtyTable" />
					     
					       <p:column headerText="#{lbl['lbl.ct.max.order.qty']}">
					        	<p:inputText value="#{itemMaxQtiesVar.maxQuantity}" styleClass="ppRightBtn" style="width:119px;" rendered="#{itemMaxQtiesVar.changeQuantity}" label="#{lbl['lbl.ct.max.order.qty']}">
							         <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, itemMaxQtiesVar.ctContractItem.uom.uomCode)}" />
							         <p:ajax process="@this"/>
						        </p:inputText>
						        <h:outputText value="#{itemMaxQtiesVar.maxQuantity}" style="float:right;" rendered="#{!itemMaxQtiesVar.changeQuantity}">
							        <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, itemMaxQtiesVar.ctContractItem.uom.uomCode)}" />
						        </h:outputText>
					       </p:column>
				
				     	   <p:column headerText="#{lbl['lbl.ct.effective.date']}" style="width:10%;">
						       <h:outputText value="#{itemMaxQtiesVar.effDate}">
						        	<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						       </h:outputText>
					       </p:column>
					
					       <p:column headerText="#{lbl['lbl.ct.expiry.date']}" style="width:10%;">
					 	       <h:outputText value="#{itemMaxQtiesVar.expDate}">
							       <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						       </h:outputText>
					       </p:column>
				
				    	   <p:column headerText="#{lbl['lbl.ct.action']}" styleClass="column-align-center" style="width:10%;">
						        <p:commandLink update=":form:ctItemMaxQtyTable" process="@form" 
						           rendered="#{!itemMaxQtiesVar.changeQuantity and itemMaxQtiesVar.editable}" action="#{amendmentBackingBean.editItemMaxQtyOnIndexs()}">
							       <f:setPropertyActionListener value="#{itemMaxQtiesVar}" target="#{amendmentBackingBean.managedBean.ctItemMaxQty}" />
							       <p:graphicImage library="ep/images/design" name="edit.png" value="/css/images/design/edit.png" title="#{lbl['lbl.ct.edit']}" />
						        </p:commandLink>
					    	    <p:commandLink rendered="#{itemMaxQtiesVar.changeQuantity}" oncomplete="dlgDelItemMaxQty.show();return false;">
							        <f:setPropertyActionListener value="#{itemMaxQtiesVar}" target="#{amendmentBackingBean.managedBean.ctItemMaxQty}" />
							        <p:graphicImage library="ep/images/design" name="delete.png" value="/css/images/design/delete.png" title="#{lbl['lbl.btn.delete']}" />
						        </p:commandLink>
				  	       </p:column>					
				     </p:dataTable>
				
				     <p:spacer height="10"/>
				     <div class="ppRightBtn">
					       <p:commandButton value="#{lbl['lbl.btn.ok']}" icon="ui-icon-accept" update=":form:itemTable" 
					          process="@form" action="#{amendmentBackingBean.setNewMaxQty()}" onclick="dlgItemMaxQty.hide();" />
					       <p:commandButton value="#{lbl['lbl.btn.cancel']}" icon="ui-icon-reject" onclick="dlgItemMaxQty.hide();" type="button" />
				      </div>
		   	     </p:dialog>	
				
			     <p:dialog id="dlgDelItemMaxQty" widgetVar="dlgDelItemMaxQty" modal="true"
			          styleClass="screen-title" resizable="false"  width="350" height="95">
				      <h:panelGrid columns="3">
					     <p:graphicImage library="ep/images/design" name="exclamation.png"
					     	value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
					     <p:spacer width="10" />
					     <p:inputTextarea cols="48" styleClass="ui-inputtextarea" value="Are you sure you want to delete this record?" rows="2" />
				     </h:panelGrid>
				     <div class="ppRightBtn">
					     <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:ctItemMaxQtyTable" 
					         process="@form" action="#{amendmentBackingBean.deleteItemMaxQtyOnIndexs()}" onclick="dlgDelItemMaxQty.hide();" />
					     <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgDelItemMaxQty.hide();" type="button" />
				     </div>
			     </p:dialog>					
		       </h:panelGrid>
		
		       <p:outputPanel id="changeField">
			       <p:spacer height="20" />
			       <h:panelGrid columns="2" style="height:50px;text-align:bottom;"
				        rendered="#{amendmentBackingBean.managedBean.selectedItem != null}">
				        <h:outputLabel for="show" value="#{lbl['lbl.ct.show']}" style="width:50px;" />
				        <p:selectOneMenu id="show" value="#{amendmentBackingBean.managedBean.showItem}" style="width:200px;">
				           	<f:selectItems value="#{amendmentBackingBean.getItemDisplayTypeDropdownList()}" />
					        <p:ajax event="change" update=":form:changeField" listener="#{amendmentBackingBean.changeField}" process="@form" />
				       </p:selectOneMenu>
			       </h:panelGrid>
			
			       <p:outputPanel style="width:100%" 
			           rendered="#{(amendmentBackingBean.managedBean.selectedItem !=null and 
			    	   amendmentBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypePrice)
				       and amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange}">
				
				            <p:dataTable id="itemPriceTable" var="itemPriceVar" 
					             value="#{amendmentBackingBean.managedBean.selectedItem.ctItemPrices}" >
					             <ac:paginator for="itemPriceTable" />
					 
					             <p:column headerText="#{lbl['lbl.ct.zone']}" style="width:40%; white-space:normal;"
						             rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalStandard or 
					  		         amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTier or 
					  		         amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
						               <p:outputLabel value="#{itemPriceVar.ctContractZone.zoneName}" style="float:left;" />
					             </p:column>
					
					            <p:column style="width:10%; white-space:normal;"
						            rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTier or 
					  		        amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTier or
					  		        amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTariff or 
					  		        amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
						     		<f:facet name="header">
										<h:outputText value="#{lbl['lbl.ct.from.qty']}"/>
					               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
					               	</f:facet>
						            <p:outputLabel value="#{itemPriceVar.fromQty}" styleClass="ppRightBtn">
						            	<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, amendmentBackingBean.managedBean.selectedItem.uom.uomCode)}" />
						            </p:outputLabel>
					           </p:column>
				
								<p:column style="width:10%; white-space:normal;"
									rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTier or 
								  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTier or
								  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTariff or 
								  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
									<f:facet name="header">
										<h:outputText value="#{lbl['lbl.ct.to.qty']}"/>
					               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
					            	</f:facet>
									<p:outputLabel value="#{itemPriceVar.toQty}" styleClass="ppRightBtn">
										<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, amendmentBackingBean.managedBean.selectedItem.uom.uomCode)}" />
						            </p:outputLabel>
								</p:column>
							
								<p:column style="width:10%; white-space:normal;"
									rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTariff or 
								  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
									<f:facet name="header">
										<h:outputText value="#{lbl['lbl.ct.sub.seq']}"/>
					               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
					               	</f:facet>
					               	<p:outputLabel value="#{itemPriceVar.toQty}" styleClass="ppRightBtn">
					               		<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, amendmentBackingBean.managedBean.selectedItem.uom.uomCode)}" />
						            </p:outputLabel>
								</p:column>
								
								<p:column headerText="#{lbl['lbl.ct.price']}" style="width:10%; white-space:normal;">
								  <h:panelGroup style="float:right;" rendered="#{itemPriceVar.changePrice}">
								   	<p:inputText value="#{itemPriceVar.unitPrice}" styleClass="ppRightBtn" style="width:100px;" label="#{lbl['lbl.ct.price']}">
										<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
										<p:ajax process="@this"/>
									</p:inputText>
									</h:panelGroup>
									<h:outputText value="#{itemPriceVar.unitPrice}" style="float:right;" rendered="#{!itemPriceVar.changePrice}">
										<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
									</h:outputText>
								</p:column>
							
								<p:column headerText="#{lbl['lbl.ct.effective.date']}" style="width:10%; white-space:normal;">
									<h:outputText value="#{itemPriceVar.effDate}">
										<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
									</h:outputText>
								</p:column>
								
								<p:column headerText="#{lbl['lbl.ct.expiry.date']}" style="width:10%; white-space:normal;">
									<h:outputText value="#{itemPriceVar.expDate}">
										<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
									</h:outputText>
								</p:column>
								
								<p:column headerText="#{lbl['lbl.ct.action']}"
								    styleClass="column-align-center" style="width:10%; white-space:normal;">
									<p:commandLink update=":form:itemId" process="@form" rendered="#{!itemPriceVar.changePrice and itemPriceVar.editable}"
										action="#{amendmentBackingBean.editItemPriceOnIndexs()}">
										<f:setPropertyActionListener value="#{itemPriceVar}" target="#{amendmentBackingBean.managedBean.ctItemPrices}" />
										<p:graphicImage library="ep/images/design" name="edit.png" value="/css/images/design/edit.png" title="#{lbl['lbl.ct.edit']}" />
									</p:commandLink>
									<p:commandLink rendered="#{itemPriceVar.changePrice}" oncomplete="dlgItemPrices.show();return false;">
										<f:setPropertyActionListener value="#{itemPriceVar}" target="#{amendmentBackingBean.managedBean.ctItemPrices}" />
										<p:graphicImage library="ep/images/design" name="delete.png" value="/css/images/design/delete.png" title="#{lbl['lbl.btn.delete']}" />
									</p:commandLink>
								</p:column>
				        
				        </p:dataTable>
			          	<p:dialog id="dlgItemPrices" widgetVar="dlgItemPrices"  modal="true"
			          	    styleClass="screen-title" resizable="false" width="350" height="95">
					        <h:panelGrid columns="3">
						         <p:graphicImage library="ep/images/design" name="exclamation.png"
						          	value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
						         <p:spacer width="10" />
						         <p:inputTextarea cols="48" styleClass="ui-inputtextarea" value="Are you sure you want to delete this record?" rows="2" />
					        </h:panelGrid>
				
				  	        <div class="ppRightBtn">
						       <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept"	update=":form:itemPriceTable" 
						        	process="@form" action="#{amendmentBackingBean.deleteItemPriceOnIndexs()}" onclick="dlgItemPrices.hide();" />
						       <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgItemPrices.hide();" type="button" />
					       </div>
				      </p:dialog>
			    </p:outputPanel>
			
			    <h:panelGrid columns="1" style="width:100%" 
			         rendered="#{amendmentBackingBean.managedBean.selectedItem!=null and
			 		(amendmentBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypeCeilQty)
			 		and amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange}">
				<p:dataTable id="ceilingTable" var="itemCeilingQtiesVar"
					value="#{amendmentBackingBean.managedBean.selectedItem.ctItemCeilingQties}" >
					<ac:paginator for="ceilingTable" />
					<p:column headerText="#{lbl['lbl.ct.ministry']}" style="width:25%; white-space:normal;">
						<p:outputLabel style="float:left;" value="#{itemCeilingQtiesVar.ctAgency.orgProfile.parentOrgProfile.orgName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.ptj']}"	style="width:30%; white-space:normal;">
						<p:outputLabel style="float:left;" value="#{itemCeilingQtiesVar.ctAgency.orgProfile.orgName}" />
					</p:column>
					<p:column style="width:10%; white-space:normal;">
						 <f:facet name="header">
							<h:outputText value="#{lbl['lbl.ct.ceiling.qty']}"/>
		               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ceiling.qty']}"/>
	               		 </f:facet>
					     <h:panelGroup style="float:right;" rendered="#{itemCeilingQtiesVar.changeCeilQuantity}">
						  <p:inputText value="#{itemCeilingQtiesVar.ceilingQuantity}" styleClass="ppRightBtn" style="width:100px;" label="#{lbl['lbl.ct.ceiling.qty']}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, itemCeilingQtiesVar.ctContractItem.uom.uomCode)}" />
								<p:ajax process="@this"/>
						</p:inputText>
						</h:panelGroup>
						<h:outputText value="#{itemCeilingQtiesVar.ceilingQuantity}" style="float:right;" rendered="#{!itemCeilingQtiesVar.changeCeilQuantity}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, itemCeilingQtiesVar.ctContractItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.effective.date']}" style="width:10%; white-space:normal;">
						<h:outputText value="#{itemCeilingQtiesVar.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.expiry.date']}" style="width:10%; white-space:normal;">
						<h:outputText value="#{itemCeilingQtiesVar.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.action']}" style="width:5%; white-space:normal;" styleClass="column-align-center">
						<p:commandLink update=":form:ceilingTable" rendered="#{!itemCeilingQtiesVar.changeCeilQuantity and itemCeilingQtiesVar.editable}"
							action="#{amendmentBackingBean.editCeilingQuantityOnIndexs()}">
							<f:setPropertyActionListener value="#{itemCeilingQtiesVar}" target="#{amendmentBackingBean.managedBean.ctItemCeilingQtys}" />
							<p:graphicImage library="ep/images/design" name="edit.png" value="/css/images/design/edit.png" title="#{lbl['lbl.ct.edit']}" />
						</p:commandLink>
						<p:commandLink oncomplete="dlgCeilQuantity.show();return false;" rendered="#{itemCeilingQtiesVar.changeCeilQuantity}">
							<f:setPropertyActionListener value="#{itemCeilingQtiesVar}" target="#{amendmentBackingBean.managedBean.ctItemCeilingQtys}" />
							<p:graphicImage library="ep/images/design" name="delete.png" value="/css/images/design/delete.png" title="#{lbl['lbl.btn.delete']}" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</h:panelGrid>
			<p:dialog id="dlgCeilQuantity" widgetVar="dlgCeilQuantity" styleClass="screen-title"
				resizable="false" modal="true" width="350" height="95">
				<h:panelGrid columns="3">
					<p:graphicImage library="ep/images/design" name="exclamation.png"
						value="/css/images/design/exclamation.png"
						styleClass="ui-icon-complain"></p:graphicImage>
					<p:spacer width="10" />
					<p:inputTextarea
						value="Are you sure you want to delete this record?" rows="2"
						cols="48" styleClass="ui-inputtextarea"></p:inputTextarea>
				</h:panelGrid>
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:ceilingTable" process="@form"
						action="#{amendmentBackingBean.deleteCeilingQuantityOnIndexs()}"
						onclick="dlgCeilQuantity.hide();" />
					<p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgCeilQuantity.hide();" type="button" />
				</div>
			</p:dialog>
		</p:outputPanel>
	</p:panel>
	<p:panel id="serviceId" header="#{lbl['lbl.ct.panel.service']}" 
	  toggleable="true" toggleSpeed="500" rendered="#{amendmentBackingBean.managedBean.itemServiceExist}">
		<!-- <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.service.dtls']}"/> -->
		<h:panelGrid style="width:100%;">
			<p:dataTable id="serviceTable" var="serviceItemVar" value="#{amendmentBackingBean.managedBean.ctServiceItemList}"
				selectionMode="single" selection="#{amendmentBackingBean.managedBean.selectedServiceItem}"   rowKey="#{serviceItemVar}"  widgetVar="serviceTableObj">
				<ac:paginator for="serviceTable" />
				<p:ajax event="rowSelect" update=":form:serviceId" process="@this" />
				<p:column headerText="#{lbl['lbl.ct.item.desc']}" style="width:35%;white-space:normal;" filterBy="#{serviceItemVar.itemName}" filterMatchMode="contains">
					<p:outputLabel value="#{serviceItemVar.itemName}" style="float:left;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.uom']}"  style="width:15%;white-space:normal;">
					<p:outputLabel value="#{serviceItemVar.uom.uomName}" style="float:left;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.quantity']}" style="width:15%;white-space:normal;text-align:right;">
					<p:outputLabel value="#{serviceItemVar.minimumOrderQty}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.uom.per.month']}" style="width:15%; white-space:normal;text-align: right;">
					<p:outputLabel value="#{serviceItemVar.uomPerMonth}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.status']}" style="width:10%;white-space:normal;">
		            <p:outputLabel value="#{serviceItemVar.recordStatusFlg == 1 ?  lbl['lbl.ct.active'] : lbl['lbl.ct.inactive'] }"/>
		        </p:column> 
			</p:dataTable>
		</h:panelGrid>
		<p:outputPanel id="showServicePrice">
			<p:spacer height="20" />
			<h:panelGrid columns="1" style="width:100%"	rendered="#{amendmentBackingBean.managedBean.selectedServiceItem != null}">
				<p:dataTable id="servicePriceTable" var="ItemPricesVar"
					value="#{amendmentBackingBean.managedBean.selectedServiceItem.ctItemPrices}" >
					<ac:paginator for="servicePriceTable" />
					<p:column headerText="#{lbl['lbl.ct.zone']}" style="width:40%; white-space:normal;"
						rendered="#{amendmentBackingBean.managedBean.selectedServiceItem.priceType.parameterCode eq ParameterConst.priceTypeZonalStandard}">
						<p:outputLabel value="#{ItemPricesVar.ctContractZone.zoneName}" style="float:left;" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.price']}" style="width:10%; white-space:normal;">
					     <h:panelGroup style="float:right;"  rendered="#{ItemPricesVar.changePrice}">
					    	<p:inputText value="#{ItemPricesVar.unitPrice}" styleClass="ppRightBtn" style="width:100px;" label="#{lbl['lbl.ct.price']}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								<p:ajax process="@this"/>
						</p:inputText>
					</h:panelGroup>
						<h:outputText value="#{ItemPricesVar.unitPrice}" style="float:right;" rendered="#{!ItemPricesVar.changePrice}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.effective.date']}" style="width:10%;white-space:normal;">
						<h:outputText value="#{ItemPricesVar.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.expiry.date']}" style="width:10%;white-space:normal;">
						<h:outputText value="#{ItemPricesVar.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.action']}" styleClass="column-align-center" style="width:10%;white-space:normal;">
						<p:commandLink update=":form:servicePriceTable" process="@form" rendered="#{!ItemPricesVar.changePrice and ItemPricesVar.editable}"
							action="#{amendmentBackingBean.editServiceItemPriceOnIndexs()}">
							<f:setPropertyActionListener value="#{ItemPricesVar}" target="#{amendmentBackingBean.managedBean.ctServiceItemPrices}" />
							<p:graphicImage library="ep/images/design" name="edit.png" value="/css/images/design/edit.png" title="#{lbl['lbl.ct.edit']}" />
						</p:commandLink>
						<p:commandLink rendered="#{ItemPricesVar.changePrice}" oncomplete="dlgSvcItemPrices.show();return false;">
							<f:setPropertyActionListener value="#{ItemPricesVar}" target="#{amendmentBackingBean.managedBean.ctServiceItemPrices}" />
							<p:graphicImage library="ep/images/design" name="delete.png" value="/css/images/design/delete.png" title="#{lbl['lbl.btn.delete']}" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
				<p:dialog id="dlgSvcItemPrices" widgetVar="dlgSvcItemPrices" styleClass="screen-title"
					resizable="false" modal="true" width="350" height="95">
					<h:panelGrid columns="3">
						<p:graphicImage library="ep/images/design" name="exclamation.png"
							value="/css/images/design/exclamation.png"
							styleClass="ui-icon-complain"></p:graphicImage>
						<p:spacer width="10" />
						<p:inputTextarea cols="48" styleClass="ui-inputtextarea"
							value="Are you sure you want to delete this record?" rows="2" />
					</h:panelGrid>
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept"	update=":form:servicePriceTable" process="@form"
							action="#{amendmentBackingBean.deleteServiceItemPriceOnIndexs()}" onclick="dlgSvcItemPrices.hide();" />
						<p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgSvcItemPrices.hide();" type="button" />
					</div>
				</p:dialog>			
			</h:panelGrid>
		</p:outputPanel>
	</p:panel>
	<p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{amendmentBackingBean.managedBean.contractVer.itemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{amendmentBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		  	
 </ui:composition>
