<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="itemId" header="Item Details"   toggleable="true"  toggleSpeed="500">
     
      <h:panelGrid columns="2" style="height:50px;text-align:bottom;">
		   <h:outputLabel for="itemTypes" value="Item Type" style="width:50px;"/>  
           <p:selectOneMenu id="itemTypes" disabled="false"  value="#{amendmentBackingBean.managedBean.itemType}"  style="width:200px;">
              <f:selectItems value="#{amendmentBackingBean.itemTypeMethode}" />
            	 <p:ajax event="change" update="changeItemType" listener="#{amendmentBackingBean.changeItemTypes}" process="@form"/>  
	       </p:selectOneMenu>         
	       <p:message for="itemTypes"/>  
        </h:panelGrid>
      
        <p:outputPanel id="changeItemType">
           <h:panelGrid columns="1" style="width:100%" 
              rendered="#{amendmentBackingBean.managedBean.productItem}">
               <p:dataTable id="productTable" var="data" value="#{amendmentBackingBean.managedBean.contractVer.ctContractItems}" widgetVar="dataTableObj"  rowKey="#{data}" 
                selectionMode="single" selection=" " 
                 lazy="true" dynamic="true"  paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
                 <ac:paginator for="productTable"/>
                   <p:ajax event="rowSelect" update=":form:tabview:changeField" listener="#{amendmentBackingBean.selectedItemList()}"/>
			     <p:columnGroup type="header"> 
			        <p:row> 
		               <p:column style="width:320px" headerText="Item Name" /> 	
		               <p:column style="width:100px" headerText="Uom"  /> 
		               <p:column style="width:100px" headerText="Minimum Order" /> 	
		               <p:column style="width:100px" headerText="Maximum Quantity"  /> 
		                <p:column style="width:100px" headerText="Type Of Goods"  /> 
                   </p:row>							
		   	     </p:columnGroup>
			     <p:column><p:outputLabel value="#{data.itemName}" style="float:left;"/></p:column>       
			     <p:column><p:outputLabel value="#{data.uom.uomName}" style="float:left;"/></p:column>        
			     <p:column><p:outputLabel value="#{data.minimumOrderQty}"/></p:column>   
			     <p:column><p:outputLabel value="100"/></p:column>     
			     <p:column><p:outputLabel value="#{data.itemType.pmParameterType.parameterType}" style="float:left;"/></p:column>              
		    </p:dataTable>
		   </h:panelGrid>
		 
		   <h:panelGrid columns="1" style="width:100%"
		      rendered="#{amendmentBackingBean.managedBean.serviceItem}">
             <p:dataTable id="serviceTable" var="data" value="#{amendmentBackingBean.managedBean.contractVer.ctContractItems}" widgetVar="dataTableObj" rowKey="#{data}" 
                selectionMode="single" selection=" " 
                lazy="true" dynamic="true" paginator="true"  paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
                 <ac:paginator for="serviceTable"/>
                  <p:ajax event="rowSelect" update=":form:tabview:changeField" 
                    listener="#{amendmentBackingBean.selectedServiceList()}" />
			     <p:columnGroup type="header"> 
			        <p:row> 
		               <p:column style="width:320px" headerText="Item Name" /> 	
		               <p:column style="width:100px" headerText=" Maximum Quantity"  /> 
		               <p:column style="width:100px" headerText="UOM" /> 	
		               <p:column style="width:100px" headerText="UOM Per Month"  />  
                   </p:row>							
		   	     </p:columnGroup>
			      <p:column><p:outputLabel value="#{data.itemName}" style="float:left;"/></p:column>            
			      <p:column><p:outputLabel value="100"/></p:column>        
			      <p:column><p:outputLabel value="#{data.uom.decimalScale}"/></p:column>   
			      <p:column><p:outputLabel value="#{data.uomPerMonth}"/></p:column>    
		    </p:dataTable>
	     </h:panelGrid>
	    
	     <p:spacer height="20"/>
		<h:panelGrid columns="2" style="height:50px;text-align:bottom;" rendered="#{amendmentBackingBean.managedBean.productItem}">
		   <h:outputLabel for="show" value="Show" style="width:50px;"/>  
           <p:selectOneMenu id="show" disabled="false"  value="#{amendmentBackingBean.managedBean.showItem}"  style="width:200px;">
              <f:selectItems value="#{amendmentBackingBean.itemDetailsMethod}" />
            	 <p:ajax event="change" update="changeField" listener="#{amendmentBackingBean.changeField}" process="@this"/>  
	       </p:selectOneMenu>         
	       <p:message for="show"/>  
        </h:panelGrid>
         
        <p:spacer height="10"/>
        <p:outputPanel id="changeField"> 
	   <h:panelGrid columns="1" style="width:100%"
		  rendered="#{amendmentBackingBean.managedBean.itemPricing or amendmentBackingBean.managedBean.serviceItem}">
		  <p:panel id="itemZoneId"  header="ITEM PRICING"  toggleable="true"  toggleSpeed="500">
		  <p:dataTable id="itemTable"  var="itemVar" value="#{amendmentBackingBean.managedBean.itemPriceList}" widgetVar="dataTableObj" lazy="false" 
		        editable="true" dynamic="true" emptyMessage="No Records!">
		         <p:ajax event="rowEdit" listener="#{amendmentBackingBean.onEdit}" update="itemTable"  />  
                  <p:ajax event="rowEditCancel" listener="#{amendmentBackingBean.onCancel}" update="itemTable" />  
		        <p:column headerText="Zone" style="width:10%">  
                         <p:cellEditor>  
                           <f:facet name="output">  <h:outputText value="#{itemVar.ctContractZone.zoneName}" />  </f:facet>  
                           <f:facet name="input">  <p:inputText value="#{itemVar.ctContractZone.zoneName}" style="width:100%"/>   </f:facet>  
                         </p:cellEditor>
                      </p:column>  
                      <p:column headerText="From Qty" rendered="#{amendmentBackingBean.managedBean.productItem}" style="width:10%">  
                         <p:cellEditor>  
                           <f:facet name="output">  <h:outputText value="#{itemVar.tierFrom}" />  </f:facet>  
                           <f:facet name="input">  <p:inputText value="#{itemVar.tierFrom}" style="width:100%"/>  </f:facet>  
                         </p:cellEditor>  
                     </p:column> 
                     <p:column headerText="To Qty" rendered="#{amendmentBackingBean.managedBean.productItem}" style="width:10%">  
                         <p:cellEditor>  
                            <f:facet name="output">  <h:outputText value="#{itemVar.tierTo}" />  </f:facet>  
                            <f:facet name="input">  <p:inputText value="#{itemVar.tierTo}" style="width:100%"/>  </f:facet>  
                         </p:cellEditor>  
                   </p:column>   
                    <p:column headerText="Price (MYR)" style="width:12%">  
                       <p:cellEditor>  
                         <f:facet name="output">  <h:outputText value="#{itemVar.unitPrice}" />  </f:facet>  
                         <f:facet name="input">  <p:inputText value="#{itemVar.unitPrice}" style="width:100%"/>  </f:facet>  
                       </p:cellEditor>  
                   </p:column>   
                   <p:column headerText="Effective Date" style="width:10%">  
                      <p:cellEditor>  
                        <f:facet name="output">  <h:outputText value="#{itemVar.effDate}" />  </f:facet>  
                        <f:facet name="input">    <p:calendar style="width:130px;" value="#{itemVar.effDate}" id="popupButtonItem" showOn="button" /></f:facet>  
                      </p:cellEditor> 
                   </p:column>
                   <p:column headerText="Expiry Date" style="width:10%">  
                      <p:cellEditor>  
                        <f:facet name="output">  <h:outputText value="#{itemVar.expDate}" />  </f:facet>  
                        <f:facet name="input">    <p:calendar style="width:130px;" value="#{itemVar.expDate}" id="popupButtonItem1" showOn="button" />   </f:facet>  
                      </p:cellEditor>
                   </p:column> 
			       <p:column headerText="Action" style="width:6%">  
                     <p:rowEditor />  
                   </p:column>  
		</p:dataTable>
		 <h:panelGrid style="width:100%;" columnClasses="column-align-right">
		       <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@this" partialSubmit="true"  icon="ui-icon-add" update="itemTable"/>
		  </h:panelGrid>
	   </p:panel>
	  </h:panelGrid>  
	 
	   <h:panelGrid columns="1" style="width:100%"
		  rendered="#{amendmentBackingBean.managedBean.itemCeilingQuantity and amendmentBackingBean.managedBean.productItem}">
		  <p:panel id="itemCeilingId"  header="ITEM CEILING QUANTITY"  toggleable="true"  toggleSpeed="500">
		  <p:dataTable id="ceilingTable"  var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" emptyMessage="No Records!">
			  <p:columnGroup type="header">
               <p:row> 
				  <p:column style="width:100px" headerText="Ministry Name"   /> 
				  <p:column style="width:100px" headerText="Jabatan Name" /> 
				  <p:column style="width:100px" headerText="PTJ Name" /> 
			      <p:column style="width:100px" headerText="Ceiling Quantity" /> 
			      <p:column style="width:150px" headerText="Effective Date" />
				  <p:column style="width:150px" headerText="Expirey Date" />
			   </p:row>								
			</p:columnGroup>
			<p:column></p:column>       
			<p:column></p:column>       
			<p:column></p:column>              
			<p:column><p:inputText style="width:70px;"/></p:column>            
			<p:column>
			  <p:calendar style="width:130px;" value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.effDate}" id="popupButtonCal2" showOn="button" />
			</p:column>       
			<p:column>
			  <p:calendar style="width:130px;" value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.expDate}" id="popupButtonCal3" showOn="button" />
			</p:column>           
		</p:dataTable>
	   </p:panel>
	  </h:panelGrid>  
	</p:outputPanel>
   </p:outputPanel>        
  </p:panel>
 </ui:composition>
