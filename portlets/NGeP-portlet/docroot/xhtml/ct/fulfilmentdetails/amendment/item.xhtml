<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <p:panel id="itemId" header="Product Details"   toggleable="true"  toggleSpeed="500">
      <h:panelGrid  style="width:100%;">
        <p:dataTable id="itemTable" var="data" value="#{amendmentBackingBean.managedBean.ctItemList}" rowKey="#{data}" 
           selectionMode="single" selection="#{amendmentBackingBean.managedBean.selectedItem}" lazy="true" 
           widgetVar="ctItemsTable"  filteredValue="#{suspensionBackingBean.ctFilterItems}">
		   <ac:paginator for="itemTable"/>
           <p:ajax event="rowSelect" update=":form:tabview:changeField"  />
		    <p:column id="modelColumn" style="width:45%;">
		       <f:facet name="header">
                 <p:outputPanel>  
                    <h:outputText value="#{lbl['lbl.ct.susp.tbl.item.name']}"/>  
                    <p:inputText id="globalFilter"  onkeyup="ctItemsTable.filter()"  style="width:100px;" />  
                 </p:outputPanel>  
              </f:facet>
             <p:outputLabel value ="#{data.itemName}" style="float:left;width:55%;"/>
           </p:column>
           <p:column headerText="UOM" style="width:10%;">
              <p:outputLabel value="#{data.uom.uomName}" style="float:left;"/> 
           </p:column>  
           <p:column  style="width:20%;" 
		      headerText="#{lbl['lbl.ct.susp.tbl.item.type']}">
		      <p:outputLabel value="#{data.itemType.pmParameterType.parameterName}" style="float:left;"/>
		   </p:column>
		   <p:column headerText="Minimum Order Qty." style="text-align: right;">
		      <p:outputLabel value="#{data.minimumOrderQty}"/>
		   </p:column>   
		   <p:column headerText="Maximum Qty." style="text-align: right;">
		      <p:outputLabel value="#{data.maxProcureAmt}"/>
		   </p:column>     
		</p:dataTable> 
      </h:panelGrid>
       <p:outputPanel id="changeField">
		   <p:spacer height="20"/>
		   <h:panelGrid columns="2" style="height:50px;text-align:bottom;" rendered="#{amendmentBackingBean.managedBean.selectedItem!=null}">
		       <h:outputLabel for="show" value="Show" style="width:50px;"/>  
		       <p:selectOneMenu id="show" value="#{amendmentBackingBean.managedBean.showItem}" style="width:200px;">
		           <f:selectItems value="#{amendmentBackingBean.getDropdownCodeValues(ParameterTypeConst.itemDisplayType)}" />
		           <p:ajax event="change" update="changeField" listener="#{amendmentBackingBean.changeField}" process="@this"/>  
			   </p:selectOneMenu>         
		 </h:panelGrid>
		 <p:outputPanel style="width:100%" rendered="#{(amendmentBackingBean.managedBean.selectedItem!=null and 
			amendmentBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypePrice)}">
		    <p:dataTable id="itemPriceTable" var="data" value="#{amendmentBackingBean.managedBean.selectedItem.ctItemPrices}"
			  selectionMode="single" rowKey="#{data}" selection="#{amendmentBackingBean.managedBean.selectedIndexOfPrice}" lazy="true" >
			  <ac:paginator for="itemPriceTable"/>
			  <p:column headerText="Zone" style="width:40%;">
			     <p:outputLabel value="#{data.ctContractZone.zoneName}" style="float:left;" />
			  </p:column>       
			  <p:column headerText="From Qty." style="width:10%;">
				 <p:outputLabel value="#{data.fromQty}" styleClass="ppRightBtn"/>
			  </p:column>       
			  <p:column headerText="To Qty." style="width:10%;">
				 <p:outputLabel value="#{data.toQty}" styleClass="ppRightBtn"/>
			  </p:column>              
			  <p:column headerText="Price (MYR)" style="width:10%;">
			  <p:inputText value="#{data.unitPrice}" styleClass="ppRightBtn" style="width:100px;" rendered="#{data.changePrice}">
                     <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
               </p:inputText>
			    <h:outputText value="#{data.unitPrice}" style="float:right;" rendered="#{!data.changePrice}">
                     <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
                </h:outputText>
			  </p:column>            
			  <p:column headerText="Effective Date" style="width:10%;">
				  <h:outputText value="#{data.effDate}" >
                        <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
                   </h:outputText>
			  </p:column>       
			  <p:column headerText="Expiry Date" style="width:10%;">
			     <h:outputText value="#{data.expDate}" >
                        <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
                   </h:outputText>
			  </p:column>
			  <p:column headerText="Action"  styleClass="column-align-center" style="width:10%;">
			      <p:commandLink action="#{amendmentBackingBean.editItemPriceOnIndexs()}" update="itemPriceTable" process="@form"
			          rendered="#{!data.changePrice}">
			        <f:setPropertyActionListener value="#{data}" target="#{amendmentBackingBean.managedBean.ctItemPrices}" />
			        <p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
		          </p:commandLink> 
		           <p:commandLink  rendered="#{data.changePrice}" oncomplete="dlgItemPrices.show();return false;">
			         <p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
		          </p:commandLink> 
			  </p:column>          
		   </p:dataTable>
		    <p:dialog id="dlgItemPrices" widgetVar="dlgItemPrices" header="Delete Confirmation" styleClass="screen-title"  
             resizable="false" modal="true" width="325" height="90">  
            <h:panelGrid columns="3">
               <p:graphicImage library="ep/images/design" name="exclamation.png"
			      value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
               <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" 
                  styleClass="ui-inputtextarea"></p:inputTextarea>
             </h:panelGrid>
             <div class="ppRightBtn">
		        <p:commandButton value="Yes" icon="ui-icon-accept" update="itemPriceTable" process="@form" 
			      action="#{amendmentBackingBean.deleteItemPriceOnIndexs()}" onclick="dlgItemPrices.hide();"/>
			    <p:commandButton value="No" icon="ui-icon-reject" onclick="dlgItemPrices.hide();" type="button" />
		    </div>
         </p:dialog>
		</p:outputPanel>  
		<h:panelGrid columns="1" style="width:100%" rendered="#{amendmentBackingBean.managedBean.selectedItem!=null and
			 (amendmentBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypeCeilQty)}">
			 <p:dataTable id="ceilingTable" var="data" value="#{amendmentBackingBean.managedBean.selectedItem.ctItemCeilingQties}"
				selectionMode="single" rowKey="#{data}" selection="#{amendmentBackingBean.managedBean.selectedIndexOfCeilingQty}" lazy="true" >
				<ac:paginator for="ceilingTable"/>
				<p:column headerText="Ministry Name" style="width:20%;">
				   <p:outputLabel value="#{data.ctAgency.orgProfile.parentOrgProfile.parentOrgProfile.orgName}" style="float:left;" />
				</p:column>       
				<p:column headerText="Jabatan Name" style="width:20%;">
					<p:outputLabel value="#{data.ctAgency.orgProfile.parentOrgProfile.orgName}" style="float:left;" />
				</p:column>       
				<p:column headerText="PTJ Name" style="width:20%;">
				  <p:outputLabel value="#{data.ctAgency.orgProfile.orgName}" style="float:left;" />
				</p:column>              
				<p:column headerText="Ceiling Quantity" style="width:10%;">
				 <p:inputText value="#{data.ceilingQuantity}" styleClass="ppRightBtn" style="width:100px;" rendered="#{data.changeCeilQuantity}">
                      <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, data.ctContractItem.uom.uomCode)}" />
               </p:inputText>
				  <h:outputText value="#{data.ceilingQuantity}" style="float:right;" rendered="#{!data.changeCeilQuantity}">
                       <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, data.ctContractItem.uom.uomCode)}" />
                  </h:outputText>
				</p:column>            
				<p:column headerText="Effective Date" style="width:10%;">
				   <h:outputText value="#{data.effDate}" >
                        <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
                   </h:outputText>
				</p:column>       
				<p:column headerText="Expiry Date" style="width:10%;">
				   <h:outputText value="#{data.expDate}" >
                        <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
                   </h:outputText>
				</p:column>  
				<p:column headerText="Action" style="width:10%;" styleClass="column-align-center">
				   <p:commandLink action="#{amendmentBackingBean.editCeilingQuantityOnIndexs()}" update="ceilingTable" rendered="#{!data.changeCeilQuantity}">
			          <f:setPropertyActionListener value="#{data}" target="#{amendmentBackingBean.managedBean.ctItemCeilingQtys}" />
			        <p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
		          </p:commandLink> 
		           <p:commandLink  oncomplete="dlgCeilQuantity.show();return false;" rendered="#{data.changeCeilQuantity}">
			         <p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
		          </p:commandLink> 
				</p:column>         
			  </p:dataTable>
		  	</h:panelGrid> 
		  	<p:dialog id="dlgCeilQuantity" widgetVar="dlgCeilQuantity" header="Delete Confirmation" styleClass="screen-title"  
             resizable="false" modal="true" width="325" height="90">  
            <h:panelGrid columns="3">
               <p:graphicImage library="ep/images/design" name="exclamation.png"
			      value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
               <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" 
                  styleClass="ui-inputtextarea"></p:inputTextarea>
             </h:panelGrid>
             <div class="ppRightBtn">
		        <p:commandButton value="Yes" icon="ui-icon-accept" update="ceilingTable" process="@form" 
			      action="#{amendmentBackingBean.deleteCeilingQuantityOnIndexs()}" onclick="dlgCeilQuantity.hide();"/>
			    <p:commandButton value="No" icon="ui-icon-reject" onclick="dlgCeilQuantity.hide();" type="button" />
		    </div>
         </p:dialog> 
		</p:outputPanel> 
  	 </p:panel>
  	 <p:panel header="Remarks" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{amendmentBackingBean.managedBean.contractVer.itemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{amendmentBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		  	
 </ui:composition>
