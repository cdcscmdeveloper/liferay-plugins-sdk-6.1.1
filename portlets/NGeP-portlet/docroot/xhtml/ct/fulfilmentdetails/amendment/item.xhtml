<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="itemId" header="Item Details"   toggleable="true"  toggleSpeed="500">
      <h:panelGrid columns="2" style="height:50px;text-align:bottom;">
		   <h:outputLabel for="itemTypes" value="Item Type" style="width:50px;"/>  
           <p:selectOneMenu id="itemTypes" disabled="false"  value="#{contractDetailsBackingBean.managedBean.itemType}"  style="width:200px;">
              <f:selectItems value="#{contractDetailsBackingBean.itemTypeMethode}" />
            	 <p:ajax event="change" update="changeItemType" listener="#{contractDetailsBackingBean.changeItemTypes}" process="@this"/>  
	       </p:selectOneMenu>         
	       <p:message for="show"/>  
        </h:panelGrid>
        <p:outputPanel id="changeItemType">
           <h:panelGrid columns="1" style="width:100%" 
              rendered="#{contractDetailsBackingBean.managedBean.productItem}">
               <p:dataTable id="productTable" var="data" value=" " widgetVar="dataTableObj"  rowKey="#{data}" 
                selectionMode="single" selection=" " 
                 lazy="true" dynamic="true"  paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
                 <ac:paginator for="productTable"/>
                 <p:ajax event="rowSelect" update=":form:tabview:changeField" listener="#{contractDetailsBackingBean.selectedItemList()}"/>
			     <p:columnGroup type="header"> 
			        <p:row> 
		               <p:column style="width:320px" headerText="Item Name" /> 	
		               <p:column style="width:100px" headerText="Uom"  /> 
		               <p:column style="width:80px" headerText="Minimum Order" /> 	
		               <p:column style="width:80px" headerText="Maximum Quantity"  /> 
		                <p:column style="width:100px" headerText="Type Of Goods"  /> 
		               <p:column style="width:50px" headerText="Action"  /> 
                   </p:row>							
		   	     </p:columnGroup>
			     <p:column><p:outputLabel value="DESKTOP" style="float:left;"/></p:column>       
			     <p:column><p:outputLabel value="Malaysia" style="float:left;"/></p:column>        
			     <p:column><p:outputLabel value="10"/></p:column>   
			     <p:column><p:outputLabel value="100"/></p:column>     
			     <p:column><p:outputLabel value="Malaysia" style="float:left;"/></p:column>              
			     <p:column styleClass="column-align-center">
			     <p:commandLink>
			        <p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
			     </p:commandLink>
			   </p:column>  
		    </p:dataTable>
		   </h:panelGrid>
		   <h:panelGrid columns="1" style="width:100%"
		      rendered="#{contractDetailsBackingBean.managedBean.serviceItem}">
             <p:dataTable id="serviceTable" var="data" value=" " widgetVar="dataTableObj" rowKey="#{data}" 
                selectionMode="single" selection=" " 
                lazy="true" dynamic="true" paginator="true"  paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
                 <ac:paginator for="serviceTable"/>
                  <p:ajax event="rowSelect" update=":form:tabview:changeField" 
                    listener="#{contractDetailsBackingBean.selectedServiceList()}" />
			     <p:columnGroup type="header"> 
			        <p:row> 
		               <p:column style="width:320px" headerText="Item Name" /> 	
		               <p:column style="width:100px" headerText=" Maximum Quantity"  /> 
		               <p:column style="width:70px" headerText="UOM" /> 	
		               <p:column style="width:50px" headerText="UOM Per Month"  /> 
		               <p:column style="width:70px" headerText="Action" /> 
                   </p:row>							
		   	     </p:columnGroup>
			      <p:column><p:outputLabel value="DESKTOP" style="float:left;"/></p:column>            
			      <p:column><p:outputLabel value="100"/></p:column>        
			      <p:column><p:outputLabel value="30000.00"/></p:column>   
			      <p:column><p:outputLabel value="5"/></p:column>    
			      <p:column styleClass="column-align-center">
			     <p:commandLink>
			        <p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
			     </p:commandLink>
			   </p:column>  
		    </p:dataTable>
	     </h:panelGrid>
	     <p:spacer height="20"/>
		<h:panelGrid columns="2" style="height:50px;text-align:bottom;" rendered="#{contractDetailsBackingBean.managedBean.productItem}">
		   <h:outputLabel for="show" value="Show" style="width:50px;"/>  
           <p:selectOneMenu id="show" disabled="false"  value="#{contractDetailsBackingBean.managedBean.showItem}"  style="width:200px;">
              <f:selectItems value="#{contractDetailsBackingBean.itemDetailsMethod}" />
            	 <p:ajax event="change" update="changeField" listener="#{contractDetailsBackingBean.changeField}" process="@this"/>  
	       </p:selectOneMenu>         
	       <p:message for="show"/>  
        </h:panelGrid>
           <p:spacer height="10"/>
        <p:outputPanel id="changeField"> 
	   <h:panelGrid columns="1" style="width:100%"
		  rendered="#{contractDetailsBackingBean.managedBean.itemPricing or contractDetailsBackingBean.managedBean.serviceItem}">
		  <p:panel id="itemZoneId"  header="ITEM PRICING"  toggleable="true"  toggleSpeed="500">
		  <p:dataTable id="itemTable"  var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" emptyMessage="No Records!">
			 <p:columnGroup type="header">
				<p:row>
                   <p:column style="width:100px" headerText="Zone" />
				   <p:column style="width:50px" headerText="From Qty" rendered="#{contractDetailsBackingBean.managedBean.productItem}" />
				   <p:column style="width:50px" headerText="To Qty" rendered="#{contractDetailsBackingBean.managedBean.productItem}"/>
				   <p:column style="width:100px" headerText="Price (MYR)" />
				   <p:column style="width:150px" headerText="Effective Date" />
				   <p:column style="width:150px" headerText="Expiry Date" />
				   <p:column style="width:100px" headerText="Action" />
		       </p:row>					
			</p:columnGroup>
			<p:column></p:column>       
			<p:column rendered="#{contractDetailsBackingBean.managedBean.productItem}"></p:column>       
			<p:column rendered="#{contractDetailsBackingBean.managedBean.productItem}"></p:column>              
			<p:column></p:column>            
			<p:column>
			  <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate}" id="popupButtonCal" showOn="button" />
			</p:column>       
			<p:column>
			  <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate}" id="popupButtonCal1" showOn="button" />
			</p:column>       
			<p:column styleClass="column-align-center">
			<p:commandLink>
			        <p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
			  </p:commandLink>
			</p:column>          
		</p:dataTable>
		 <h:panelGrid style="width:100%;" columnClasses="column-align-right">
		       <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@this" partialSubmit="true"  icon="ui-icon-add" update="itemTable"/>
		  </h:panelGrid>
	   </p:panel>
	  </h:panelGrid>  
	   <h:panelGrid columns="1" style="width:100%"
		  rendered="#{contractDetailsBackingBean.managedBean.itemCeilingQuantity and contractDetailsBackingBean.managedBean.productItem}">
		  <p:panel id="itemCeilingId"  header="ITEM CEILING QUANTITY"  toggleable="true"  toggleSpeed="500">
		  <p:dataTable id="ceilingTable"  var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" emptyMessage="No Records!">
			  <p:columnGroup type="header">
               <p:row> 
				  <p:column style="width:100px" headerText="Ministry Name"   /> 
				  <p:column style="width:100px" headerText="Jabatan Name" /> 
				  <p:column style="width:100px" headerText="PTJ Name" /> 
			      <p:column style="width:100px" headerText="Ceiling Quantity" /> 
			      <p:column style="width:150px" headerText="Effective Date" />
				  <p:column style="width:150px" headerText="Expirey Date" />
			   </p:row>								
			</p:columnGroup>
			<p:column></p:column>       
			<p:column></p:column>       
			<p:column></p:column>              
			<p:column><p:inputText style="width:70px;"/></p:column>            
			<p:column>
			  <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate}" id="popupButtonCal2" showOn="button" />
			</p:column>       
			<p:column>
			  <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate}" id="popupButtonCal3" showOn="button" />
			</p:column>           
		</p:dataTable>
	   </p:panel>
	  </h:panelGrid>  
	</p:outputPanel>
   </p:outputPanel>        
  </p:panel>
 </ui:composition>
