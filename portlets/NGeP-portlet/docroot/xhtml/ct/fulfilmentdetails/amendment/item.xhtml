<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="itemId" header="Product Details" toggleable="true"	
	     toggleSpeed="500"  rendered="#{amendmentBackingBean.managedBean.itemProductExist}" >
		<h:panelGrid style="width:100%;">
		
			<p:dataTable id="itemTable" var="ctItemVar" 
			    value="#{amendmentBackingBean.managedBean.ctItemList}"  widgetVar="ctItemsTableObj"
				selectionMode="single"	selection="#{amendmentBackingBean.managedBean.selectedItem}"  rowKey="#{ctItemVar}">
				<ac:paginator for="itemTable" />
				<p:ajax event="rowSelect" update=":form:itemId" process="@this"  />
			
				<p:column headerText="#{lbl['lbl.ct.susp.tbl.item.name']}" 
				      style="width:45%;" filterBy="#{ctItemVar.itemName}" filterMatchMode="contains">
					<p:outputLabel value="#{ctItemVar.itemName}"	style="float:left;" />
				</p:column>
			
				<p:column style="width:10%;" headerText="Type of Goods">
					<p:outputLabel value="#{amendmentBackingBean.getParameterDesc(ctItemVar.itemOrigin)}" style="float:left;" />
				</p:column>				
			
				<p:column headerText="#{lbl['lbl.ct.item.table.uom']}" style="width:10%;">
					<p:outputLabel value="#{ctItemVar.uom.uomName}" style="float:left;" />
				</p:column>
			
				<p:column headerText="#{lbl['lbl.ct.item.minodrqty']}" style="width:10%;text-align: right;">
					<h:outputText value="#{ctItemVar.minimumOrderQty}" >
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, ctItemVar.uom.uomCode)}" />					
					</h:outputText>
				</p:column>
			
				<p:column headerText="#{lbl['lbl.ct.item.maxqty']}" style="width:10%;text-align: right;">
					<h:outputText value="#{ctItemVar.maxQuantity}" >
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, ctItemVar.uom.uomCode)}" />
					</h:outputText>
				</p:column>
			
				<p:column headerText="#{lbl['lbl.ct.item.newmaxqty']}" style="text-align: right;width:15%;" rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange}">
					<p:inputText style="width:75px;" value="#{ctItemVar.newMaxQuantity}" disabled="true" styleClass="ppRightBtn" label="#{lbl['lbl.ct.item.newmaxqty']}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, ctItemVar.uom.uomCode)}" />					
					</p:inputText>
					<p:spacer width="5"/>
					<p:commandLink update=":form:dlgItemMaxQty,itemTable" oncomplete="dlgItemMaxQty.show();return false;">
						<f:setPropertyActionListener value="#{ctItemVar}" target="#{amendmentBackingBean.managedBean.selectedItem}" />
						<p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" style="margin-bottom: -4px;" />
					</p:commandLink>
				</p:column>
				
			</p:dataTable>
			
			<p:dialog id="dlgItemMaxQty" widgetVar="dlgItemMaxQty" 
			   header="Edit Maximum Quantity" styleClass="screen-title" resizable="false" modal="true" width="420" height="200">
				<h:panelGrid columns="1">
					<p:outputLabel value="Item Name : #{amendmentBackingBean.managedBean.selectedItem.itemName}" />
				</h:panelGrid>
				<p:spacer  height="5"/>
				<p:dataTable id="ctItemMaxQtyTable" var="data" 
				     value="#{amendmentBackingBean.managedBean.selectedItem.ctItemMaxQties}">
					<ac:paginator for="ctItemMaxQtyTable" />
					<p:column headerText="Maximum Quantity">
						<p:inputText value="#{data.maxQuantity}" styleClass="ppRightBtn" style="width:119px;" rendered="#{data.changeQuantity}" label="Maximum Quantity">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, data.ctContractItem.uom.uomCode)}" />
							<p:ajax process="@this"/>
						</p:inputText>
						<h:outputText value="#{data.maxQuantity}" style="float:right;" rendered="#{!data.changeQuantity}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, data.ctContractItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.table1.price.efdate']}" style="width:10%;">
						<h:outputText value="#{data.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.table1.price.edate']}" style="width:10%;">
						<h:outputText value="#{data.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="Action" styleClass="column-align-center"
						style="width:10%;">
						<p:commandLink update=":form:ctItemMaxQtyTable" process="@form" rendered="#{!data.changeQuantity and data.editable}"
							action="#{amendmentBackingBean.editItemMaxQtyOnIndexs()}">
							<f:setPropertyActionListener value="#{data}" target="#{amendmentBackingBean.managedBean.ctItemMaxQty}" />
							<p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
						</p:commandLink>
						<p:commandLink rendered="#{data.changeQuantity}" oncomplete="dlgDelItemMaxQty.show();return false;">
							<f:setPropertyActionListener value="#{data}" target="#{amendmentBackingBean.managedBean.ctItemMaxQty}" />
							<p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
						</p:commandLink>
					</p:column>					
				</p:dataTable>
				<p:spacer height="10"/>
				<div class="ppRightBtn">
					<p:commandButton value="OK" icon="ui-icon-accept" update=":form:itemTable" process="@form"
						action="#{amendmentBackingBean.setNewMaxQty()}" onclick="dlgItemMaxQty.hide();" />
					<p:commandButton value="Cancel" icon="ui-icon-reject" onclick="dlgItemMaxQty.hide();" type="button" />
				</div>
			</p:dialog>	
				
			<p:dialog id="dlgDelItemMaxQty" widgetVar="dlgDelItemMaxQty" header="Delete Confirmation" styleClass="screen-title"
				resizable="false" modal="true" width="350" height="95">
				<h:panelGrid columns="3">
					<p:graphicImage library="ep/images/design" name="exclamation.png"
						value="/resources/ep/images/design/exclamation.png"
						styleClass="ui-icon-complain"></p:graphicImage>
					<p:spacer width="10" />
					<p:inputTextarea cols="48" styleClass="ui-inputtextarea"
						value="Are you sure you want to delete this record?" rows="2" />
				</h:panelGrid>
				<div class="ppRightBtn">
					<p:commandButton value="Yes" icon="ui-icon-accept" update=":form:ctItemMaxQtyTable" process="@form"
						action="#{amendmentBackingBean.deleteItemMaxQtyOnIndexs()}" onclick="dlgDelItemMaxQty.hide();" />
					<p:commandButton value="No" icon="ui-icon-reject" onclick="dlgDelItemMaxQty.hide();" type="button" />
				</div>
			</p:dialog>					
		</h:panelGrid>
		
		<p:outputPanel id="changeField">
			<p:spacer height="20" />
			<h:panelGrid columns="2" style="height:50px;text-align:bottom;"
				rendered="#{amendmentBackingBean.managedBean.selectedItem != null}">
				<h:outputLabel for="show" value="Show" style="width:50px;" />
				<p:selectOneMenu id="show" value="#{amendmentBackingBean.managedBean.showItem}" style="width:200px;">
					<f:selectItems value="#{amendmentBackingBean.getItemDisplayTypeDropdownList()}" />
					<p:ajax event="change" update=":form:changeField"	listener="#{amendmentBackingBean.changeField}" process="@form" />
				</p:selectOneMenu>
			</h:panelGrid>
			<p:outputPanel style="width:100%" rendered="#{(amendmentBackingBean.managedBean.selectedItem !=null and 
				amendmentBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypePrice)
				and amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange}">
				<p:dataTable id="itemPriceTable" var="itemPriceVar" 
					value="#{amendmentBackingBean.managedBean.selectedItem.ctItemPrices}" >
					<ac:paginator for="itemPriceTable" />
					<p:column headerText="#{lbl['lbl.ct.item.table1.price.zone']}" style="width:40%;"
						rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalStandard or 
					  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTier or 
					  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
						<p:outputLabel value="#{itemPriceVar.ctContractZone.zoneName}" style="float:left;" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.fromqty']}" style="width:10%;"
						rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTier or 
					  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTier or
					  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTariff or 
					  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
						<p:outputLabel value="#{itemPriceVar.fromQty}" styleClass="ppRightBtn" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.toqty']}" style="width:10%;"
						rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTier or 
					  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTier or
					  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTariff or 
					  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
						<p:outputLabel value="#{itemPriceVar.toQty}" styleClass="ppRightBtn" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.subseq']}" style="width:10%;"
						rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTariff or 
					  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
						<p:outputLabel value="#{itemPriceVar.toQty}" styleClass="ppRightBtn" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.table1.price.price']}" style="width:10%;">
					  <h:panelGroup style="float:right;" rendered="#{itemPriceVar.changePrice}">
					   	<p:inputText value="#{itemPriceVar.unitPrice}" styleClass="ppRightBtn" style="width:100px;" label="#{lbl['lbl.ct.item.table1.price.price']}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							<p:ajax process="@this"/>
						</p:inputText>
						</h:panelGroup>
						<h:outputText value="#{itemPriceVar.unitPrice}" style="float:right;" rendered="#{!itemPriceVar.changePrice}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.table1.price.efdate']}" style="width:10%;">
						<h:outputText value="#{itemPriceVar.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.table1.price.edate']}" style="width:10%;">
						<h:outputText value="#{itemPriceVar.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="Action" styleClass="column-align-center"
						style="width:10%;">
						<p:commandLink update=":form:itemId" process="@form" rendered="#{!itemPriceVar.changePrice and itemPriceVar.editable}"
							action="#{amendmentBackingBean.editItemPriceOnIndexs()}">
							<f:setPropertyActionListener value="#{itemPriceVar}" target="#{amendmentBackingBean.managedBean.ctItemPrices}" />
							<p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
						</p:commandLink>
						<p:commandLink rendered="#{itemPriceVar.changePrice}" oncomplete="dlgItemPrices.show();return false;">
							<f:setPropertyActionListener value="#{itemPriceVar}" target="#{amendmentBackingBean.managedBean.ctItemPrices}" />
							<p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
				<p:dialog id="dlgItemPrices" widgetVar="dlgItemPrices" header="Delete Confirmation" styleClass="screen-title"
					resizable="false" modal="true" width="350" height="95">
					<h:panelGrid columns="3">
						<p:graphicImage library="ep/images/design" name="exclamation.png"
							value="/resources/ep/images/design/exclamation.png"
							styleClass="ui-icon-complain"></p:graphicImage>
						<p:spacer width="10" />
						<p:inputTextarea cols="48" styleClass="ui-inputtextarea"
							value="Are you sure you want to delete this record?" rows="2" />
					</h:panelGrid>
					<div class="ppRightBtn">
						<p:commandButton value="Yes" icon="ui-icon-accept"	update=":form:itemPriceTable" process="@form"
							action="#{amendmentBackingBean.deleteItemPriceOnIndexs()}" onclick="dlgItemPrices.hide();" />
						<p:commandButton value="No" icon="ui-icon-reject" onclick="dlgItemPrices.hide();" type="button" />
					</div>
				</p:dialog>
			</p:outputPanel>
			<h:panelGrid columns="1" style="width:100%" rendered="#{amendmentBackingBean.managedBean.selectedItem!=null and
			 		(amendmentBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypeCeilQty)
			 		and amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange}">
				<p:dataTable id="ceilingTable" var="data" rowKey="#{data}"
					value="#{amendmentBackingBean.managedBean.selectedItem.ctItemCeilingQties}" >
					<ac:paginator for="ceilingTable" />
					<p:column headerText="Ministry Name" style="width:25%; white-space:normal;">
						<p:outputLabel style="float:left;" value="#{data.ctAgency.orgProfile.parentOrgProfile.orgName}" />
					</p:column>
					<p:column headerText="PTJ Name"	style="width:25%; white-space:normal;">
						<p:outputLabel style="float:left;" value="#{data.ctAgency.orgProfile.orgName}" />
					</p:column>
					<p:column headerText="Ceiling Quantity" style="width:10%;">
					     <h:panelGroup style="float:right;" rendered="#{data.changeCeilQuantity}">
						  <p:inputText value="#{data.ceilingQuantity}" styleClass="ppRightBtn" style="width:100px;" label="Ceiling Quantity">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, data.ctContractItem.uom.uomCode)}" />
								<p:ajax process="@this"/>
						</p:inputText>
						</h:panelGroup>
						<h:outputText value="#{data.ceilingQuantity}" style="float:right;" rendered="#{!data.changeCeilQuantity}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, data.ctContractItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.table1.price.efdate']}" style="width:10%;">
						<h:outputText value="#{data.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.table1.price.edate']}" style="width:10%;">
						<h:outputText value="#{data.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="Action" style="width:10%;" styleClass="column-align-center">
						<p:commandLink update=":form:ceilingTable" rendered="#{!data.changeCeilQuantity and data.editable}"
							action="#{amendmentBackingBean.editCeilingQuantityOnIndexs()}">
							<f:setPropertyActionListener value="#{data}" target="#{amendmentBackingBean.managedBean.ctItemCeilingQtys}" />
							<p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
						</p:commandLink>
						<p:commandLink oncomplete="dlgCeilQuantity.show();return false;" rendered="#{data.changeCeilQuantity}">
							<f:setPropertyActionListener value="#{data}" target="#{amendmentBackingBean.managedBean.ctItemCeilingQtys}" />
							<p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</h:panelGrid>
			<p:dialog id="dlgCeilQuantity" widgetVar="dlgCeilQuantity" header="Delete Confirmation" styleClass="screen-title"
				resizable="false" modal="true" width="350" height="95">
				<h:panelGrid columns="3">
					<p:graphicImage library="ep/images/design" name="exclamation.png"
						value="/resources/ep/images/design/exclamation.png"
						styleClass="ui-icon-complain"></p:graphicImage>
					<p:spacer width="10" />
					<p:inputTextarea
						value="Are you sure you want to delete this record?" rows="2"
						cols="48" styleClass="ui-inputtextarea"></p:inputTextarea>
				</h:panelGrid>
				<div class="ppRightBtn">
					<p:commandButton value="Yes" icon="ui-icon-accept" update=":form:ceilingTable" process="@form"
						action="#{amendmentBackingBean.deleteCeilingQuantityOnIndexs()}"
						onclick="dlgCeilQuantity.hide();" />
					<p:commandButton value="No" icon="ui-icon-reject" onclick="dlgCeilQuantity.hide();" type="button" />
				</div>
			</p:dialog>
		</p:outputPanel>
	</p:panel>
	<p:panel id="serviceId" header="Service Details" 
	  toggleable="true" toggleSpeed="500" rendered="#{amendmentBackingBean.managedBean.itemServiceExist}">
		<h:panelGrid style="width:100%;">
			<p:dataTable id="serviceTable" var="data" value="#{amendmentBackingBean.managedBean.ctServiceItemList}"
				selectionMode="single" selection="#{amendmentBackingBean.managedBean.selectedServiceItem}"   rowKey="#{data}"  widgetVar="serviceTableObj">
				<ac:paginator for="serviceTable" />
				<p:ajax event="rowSelect" update=":form:serviceId" process="@this" />
				<p:column headerText="Item Name" style="width:45%;" filterBy="#{data.itemName}" filterMatchMode="contains">
					<p:outputLabel value="#{data.itemName}" style="float:left;" />
				</p:column>
				<p:column headerText="UOM"  style="width:15%;">
					<p:outputLabel value="#{data.uom.uomName}" style="float:left;" />
				</p:column>
				<p:column headerText="Qty." style="width:15%;text-align: right;">
					<p:outputLabel value="#{data.minimumOrderQty}" />
				</p:column>
				<p:column headerText="UOM Per Month" style="width:15%;text-align: right;">
					<p:outputLabel value="#{data.uomPerMonth}" />
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		<p:outputPanel id="showServicePrice">
			<p:spacer height="20" />
			<h:panelGrid columns="1" style="width:100%"	rendered="#{amendmentBackingBean.managedBean.selectedServiceItem != null}">
				<p:dataTable id="servicePriceTable" var="data" rowKey="#{data}"
					value="#{amendmentBackingBean.managedBean.selectedServiceItem.ctItemPrices}" >
					<ac:paginator for="servicePriceTable" />
					<p:column headerText="#{lbl['lbl.ct.item.table1.price.zone']}" style="width:40%;"
						rendered="#{amendmentBackingBean.managedBean.selectedServiceItem.priceType.parameterCode eq ParameterConst.priceTypeZonalStandard}">
						<p:outputLabel value="#{data.ctContractZone.zoneName}" style="float:left;" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.table1.price.price']}" style="width:10%;">
					     <h:panelGroup style="float:right;"  rendered="#{data.changePrice}">
					    	<p:inputText value="#{data.unitPrice}" styleClass="ppRightBtn" style="width:100px;" label="#{lbl['lbl.ct.item.table1.price.price']}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								<p:ajax process="@this"/>
						</p:inputText>
					</h:panelGroup>
						<h:outputText value="#{data.unitPrice}" style="float:right;" rendered="#{!data.changePrice}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.table1.price.efdate']}" style="width:10%;">
						<h:outputText value="#{data.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.item.table1.price.edate']}" style="width:10%;">
						<h:outputText value="#{data.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="Action" styleClass="column-align-center"
						style="width:10%;">
						<p:commandLink update=":form:servicePriceTable" process="@form" rendered="#{!data.changePrice and data.editable}"
							action="#{amendmentBackingBean.editServiceItemPriceOnIndexs()}">
							<f:setPropertyActionListener value="#{data}" target="#{amendmentBackingBean.managedBean.ctServiceItemPrices}" />
							<p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
						</p:commandLink>
						<p:commandLink rendered="#{data.changePrice}" oncomplete="dlgSvcItemPrices.show();return false;">
							<f:setPropertyActionListener value="#{data}" target="#{amendmentBackingBean.managedBean.ctServiceItemPrices}" />
							<p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
				<p:dialog id="dlgSvcItemPrices" widgetVar="dlgSvcItemPrices" header="Delete Confirmation" styleClass="screen-title"
					resizable="false" modal="true" width="350" height="95">
					<h:panelGrid columns="3">
						<p:graphicImage library="ep/images/design" name="exclamation.png"
							value="/resources/ep/images/design/exclamation.png"
							styleClass="ui-icon-complain"></p:graphicImage>
						<p:spacer width="10" />
						<p:inputTextarea cols="48" styleClass="ui-inputtextarea"
							value="Are you sure you want to delete this record?" rows="2" />
					</h:panelGrid>
					<div class="ppRightBtn">
						<p:commandButton value="Yes" icon="ui-icon-accept"	update=":form:servicePriceTable" process="@form"
