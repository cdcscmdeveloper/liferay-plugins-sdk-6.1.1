<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
        <p:panel id="itemId" header="Item Details"   toggleable="true"  toggleSpeed="500" widgetVar="panelitem">
          <p:dataTable id="dataTable" var="data" value=" " widgetVar="dataTableObj"
           lazy="false" dynamic="true"  paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
           <ac:paginator for="dataTable"/>
			 <p:columnGroup type="header"> 
			 <p:row> 
			   <p:column style="width:80px" headerText="Item Code" /> 
               <p:column style="width:320px" headerText="Item Name" /> 	
               <p:column style="width:100px" headerText="Origin Country"  /> 
               <p:column style="width:70px" headerText="Price UOM" /> 	
               <p:column style="width:50px" headerText="Exempted"  /> 
               <p:column style="width:70px" headerText="Action"  /> 
            </p:row>							
			</p:columnGroup>
			<p:column><p:outputLabel value="EP 308X3120P" style="float:left;"/></p:column>       
			 <p:column><p:outputLabel value="DESKTOP" style="float:left;"/></p:column>       
			 <p:column><p:outputLabel value="Malaysia" style="float:left;"/></p:column>        
			 <p:column><p:outputLabel value="30000" style="float:left;"/></p:column>      
			<p:column styleClass="column-align-center">
			<p:selectBooleanCheckbox value="true" disabled="true"/> 
            </p:column>       
			<p:column styleClass="column-align-center">
			 <p:commandLink>
			        <p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
			  </p:commandLink>
			<p:spacer width="2"/>
			 <p:commandLink partialSubmit="true" process="@this" onsuccess="confirmation6.show()">
			        <p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
			  </p:commandLink>
			</p:column>  
		</p:dataTable>
		<h:panelGrid columns="2" style="height:50px;text-align:bottom;">
		   <h:outputLabel for="show" value="Show" style="width:50px;"/>  
           <p:selectOneMenu id="show" disabled="false"  value="#{contractDetailsBackingBean.managedBean.showItem}"  style="width:200px;">
              <f:selectItems value="#{contractDetailsBackingBean.itemDetailsMethod}" />
            	 <p:ajax event="change" update="changeField" listener="#{contractDetailsBackingBean.changeField}" process="@this"/>  
	       </p:selectOneMenu>         
	       <p:message for="show"/>  
        </h:panelGrid>
	   </p:panel>
	   <p:outputPanel id="changeField"> 
	   <h:panelGrid columns="1" style="width:800px"
		  rendered="#{contractDetailsBackingBean.managedBean.itemPricing or contractDetailsBackingBean.managedBean.itemCeilingQuantity}">
		  <p:panel id="itemZoneId"  header="#{contractDetailsBackingBean.managedBean.showItem}"  toggleable="true"  toggleSpeed="500">
		  <p:dataTable id="itemTable"  var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
			 paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
			 <ac:paginator for="itemTable"/>
			 <p:columnGroup type="header">
				<p:row rendered="#{contractDetailsBackingBean.managedBean.itemPricing}">
                   <p:column style="width:100px" headerText="Zone" />
				   <p:column style="width:50px" headerText="From Qty" />
				   <p:column style="width:50px" headerText="To Qty" />
				   <p:column style="width:100px" headerText="Price (MYR)" />
				   <p:column style="width:150px" headerText="Effective Date" />
				   <p:column style="width:150px" headerText="Expirey Date" />
				   <p:column style="width:100px" headerText="Action" />
		       </p:row>
               <p:row  rendered="#{contractDetailsBackingBean.managedBean.itemCeilingQuantity}"> 
				  <p:column style="width:100px" headerText="Ministry Name"   /> 
				  <p:column style="width:100px" headerText="Jabatan Name" /> 
				  <p:column style="width:100px" headerText="PTJ Name" /> 
			      <p:column style="width:100px" headerText="Ceiling Quantity" /> 
			      <p:column style="width:150px" headerText="Effective Date" />
				  <p:column style="width:150px" headerText="Expirey Date" />
			   </p:row>								
			</p:columnGroup>
			<p:column></p:column>       
			<p:column></p:column>       
			<p:column></p:column>              
			<p:column></p:column>            
			<p:column>
			  <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.managedBean.createContractDetails.date}" id="popupButtonCal" showOn="button" />
			</p:column>       
			<p:column>
			  <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.managedBean.createContractDetails.date}" id="popupButtonCal1" showOn="button" />
			</p:column>       
			<p:column styleClass="column-align-center" rendered="#{!contractDetailsBackingBean.managedBean.itemCeilingQuantity}">
			<p:commandLink>
			        <p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
			  </p:commandLink>
			<p:spacer width="2"/>
			 <p:commandLink partialSubmit="true" process="@this" onsuccess="confirmation6.show()">
			        <p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
			  </p:commandLink>
			</p:column>          
		</p:dataTable>
		 <h:panelGrid style="width:760px" columnClasses="column-align-right" rendered="#{!contractDetailsBackingBean.managedBean.itemCeilingQuantity}">
		       <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@this" partialSubmit="true"  icon="ui-icon-add" update="itemTable"/>
		  </h:panelGrid>
	   </p:panel>
	  </h:panelGrid>  
	</p:outputPanel>
    <p:confirmDialog message="Do you want to delete the record?" closable="true" appendToBody="false" header="Delete Confirmation"
	   severity="alert" widgetVar="confirmation6">
       <h:panelGrid columns="2">
		  <p:commandButton value="Yes" 	update="dataTable" partialSubmit="true" process="@this"
			 onclick="confirmation6.hide();"/>
		  <p:commandButton value="No" onclick="confirmation6.hide()" type="button" />
	   </h:panelGrid>
    </p:confirmDialog>                          
</ui:composition>
