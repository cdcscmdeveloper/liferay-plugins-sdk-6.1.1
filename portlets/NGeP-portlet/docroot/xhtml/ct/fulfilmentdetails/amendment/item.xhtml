<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="itemId" toggleable="true" 
	    toggleSpeed="500"  rendered="#{amendmentBackingBean.managedBean.itemProductExist}" >
	      <f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.product']}"/>
	        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.product.dtls']}"/>
	     </f:facet>
	  	
	  	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.select.item']}" escape="false"/><br/><br/>
		
		<h:panelGrid style="width:100%;">
		   <p:dataTable id="itemTable" var="ctItemVar" widgetVar="ctItemsTableObj"
			     value="#{amendmentBackingBean.managedBean.ctItemList}"  selectionMode="single"	
			     selection="#{amendmentBackingBean.managedBean.selectedItem}"  rowKey="#{ctItemVar}">
				 <ac:paginator for="itemTable" />
				 <p:ajax event="rowSelect" update=":form:itemId" listener="#{amendmentBackingBean.onSelectProductItem()}"
				     process="@this" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
			
				  <p:column style="width:30%; white-space:normal;" styleClass="column-align-center"
				     filterBy="#{ctItemVar.scRequestItem.itemName}" filterMatchMode="contains">
				  <f:facet name="header">
		                    <h:outputText id="productItemDesc"  value="#{lbl['lbl.ct.item.desc']}"/>
		                        &#160;<p:graphicImage id="amendProductItemId" value="/css/images/design/tooltips.png" /> <p:tooltip
							          id="amendProductTooltip" for="amendProductItemId">
							<h:outputText id="amendProductInstruction" escape="false" value="#{lbl['lbl.ct.instruction.item.search']}" />
						</p:tooltip> 
		               </f:facet>
					    <h:outputText id="itemNameID" value="#{ctItemVar.scRequestItem.itemName}" style="float:left;" />
					        <p:tooltip id="toolTipItemName" for="itemNameID" value="#{ctItemVar.scRequestItem.itemDesc == null ? lbl['lbl.ct.item.tooltip.desc'] : ctItemVar.scRequestItem.itemDesc}" />
             
			   	  </p:column>
			
				  <p:column style="width:15%; white-space:normal;" 
				      styleClass="column-align-center" headerText="#{lbl['lbl.ct.type.of.goods']}">
					   <h:outputText  style="float:left;" 
					     value="#{amendmentBackingBean.getParameterDesc(ctItemVar.itemOrigin)}"  />
				  </p:column>				
			
				  <p:column headerText="#{lbl['lbl.ct.uom']}" 
				     styleClass="column-align-center" style="width:10%; white-space:normal;">
					    <h:outputText value="#{ctItemVar.scRequestItem.uom.uomName}" style="float:left;" />
				  </p:column>
			
				  <p:column style="width:10%;white-space:normal;text-align: right;"
				    styleClass="column-align-center">
				 	  <f:facet name="header">
			            <h:outputText value="#{lbl['lbl.ct.min.order.qty']}"/>
	               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.min.order.qty']}"/>
	                  </f:facet>
					 <h:outputText value="#{ctItemVar.minimumOrderQty}" style="float:right;">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, ctItemVar.scRequestItem.uom.uomCode)}" />		
					  </h:outputText>
				   </p:column>
				
				<p:column headerText="#{lbl['lbl.ct.status']}" style="width:10%; white-space:normal;" styleClass="column-align-center">
		             <h:outputText value="#{ctItemVar.chkStatus ? lbl['lbl.ct.active'] : lbl['lbl.ct.inactive'] }" style="float:left;"/>
		        </p:column> 
				
			</p:dataTable>
			
							
		       </h:panelGrid>
		
		       <p:outputPanel id="changeField">
			       <p:spacer height="20" />
			       <h:panelGrid columns="2" style="height:50px;text-align:bottom;"
				        rendered="#{amendmentBackingBean.managedBean.selectedItem != null}">
				        <h:outputLabel for="show" value="#{lbl['lbl.ct.show']}" style="width:50px;" />
					    <h:panelGrid columns="3">
					    	<p:selectOneMenu id="show" value="#{amendmentBackingBean.managedBean.showItem}" style="width:200px;">
					           	<f:selectItems value="#{amendmentBackingBean.getItemDisplayTypeDropdownList(
					           		amendmentBackingBean.managedBean.selectedItem.itemType.parameterCode)}" />
						        <p:ajax event="change" update=":form:changeField"  process="@form"  onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
					       	</p:selectOneMenu>
					       	<p:spacer width="1"/>
				     		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.product.dtls.show']}" />
			             </h:panelGrid>
			       </h:panelGrid>
				   <!-- Item Price -->
			       <p:outputPanel style="width:100%" 
			           rendered="#{amendmentBackingBean.managedBean.selectedItem !=null and 
			    	   amendmentBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypePrice
				       and (ctBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or  ctBackingBean.managedBean.contractVer.ctAmendment.otherChange)}">
				
				            <p:dataTable id="itemPriceTable" var="itemPriceVar" 
					             value="#{amendmentBackingBean.managedBean.selectedItem.ctItemPrices}" >
					             <ac:paginator for="itemPriceTable" />
					 
					             <p:column headerText="#{lbl['lbl.ct.zone']}" style="width:40%; white-space:normal;" styleClass="column-align-center"
						             rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalStandard or 
					  		         amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTier or 
					  		         amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
						               <p:outputLabel value="#{itemPriceVar.ctContractZone.zoneName}" style="float:left;" rendered="#{!itemPriceVar.changeZoneLabel}" />
						               <p:outputLabel value="#{itemPriceVar.ctContractZone.zoneName} (#{lbl['lbl.ct.new']})" style="float:left;" rendered="#{itemPriceVar.changeZoneLabel}" />
			             
					             </p:column>
					
					            <p:column style="width:10%; white-space:normal;" styleClass="column-align-center"
						            rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTier or 
					  		        amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTier or
					  		        amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTariff or 
					  		        amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
						     		<f:facet name="header">
										<h:outputText value="#{lbl['lbl.ct.from.qty']}"/>
					               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
					               	</f:facet>
						            <h:outputText value="#{itemPriceVar.fromQty}" styleClass="ppRightBtn">
						            	<f:converter converterId="dynamicNumberConverter" />
										<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, amendmentBackingBean.managedBean.selectedItem.scRequestItem.uom.uomCode)}" />
						            </h:outputText>
					           </p:column>
				
								<p:column style="width:10%; white-space:normal;" styleClass="column-align-center"
									rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTier or 
								  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTier or
								  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTariff or 
								  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
									<f:facet name="header">
										<h:outputText value="#{lbl['lbl.ct.to.qty']}"/>
					               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
					            	</f:facet>
									<h:outputText value="#{itemPriceVar.toQty}" styleClass="ppRightBtn">
										<f:converter converterId="dynamicNumberConverter" />
										<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, amendmentBackingBean.managedBean.selectedItem.scRequestItem.uom.uomCode)}" />
						            </h:outputText>
								</p:column>
							
								<p:column style="width:10%; white-space:normal;" styleClass="column-align-center"
									rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTariff or 
								  		amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
									<f:facet name="header">
										<h:outputText value="#{lbl['lbl.ct.sub.seq']}"/>
					               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.qty']}"/>
					               	</f:facet>
					               	<h:outputText value="#{itemPriceVar.subSequence}" styleClass="ppRightBtn">					               		
										<f:converter converterId="dynamicNumberConverter" />
										<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, amendmentBackingBean.managedBean.selectedItem.scRequestItem.uom.uomCode)}" />
						            </h:outputText>
								</p:column>
								
								<p:column headerText="#{lbl['lbl.ct.price']}" style="width:10%; white-space:normal;" styleClass="column-align-center">
								  <h:panelGroup style="float:right;" rendered="#{itemPriceVar.changePrice}">
								   	<p:inputText value="#{itemPriceVar.unitPrice}" styleClass="ppRightBtn" style="width:100px;" label="#{lbl['lbl.ct.price']}"
								   		disabled="#{ctBackingBean.managedBean.disableAmendDetails}" required="true">
										<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
										<p:ajax process="@this"/>
									</p:inputText>
									</h:panelGroup>
									<h:outputText value="#{itemPriceVar.unitPrice}" style="float:right;" rendered="#{!itemPriceVar.changePrice}">
										<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
									</h:outputText>
								</p:column>
							
								<p:column headerText="#{lbl['lbl.ct.effective.date']}" style="width:10%; white-space:normal;" styleClass="column-align-center">
									<h:outputText value="#{itemPriceVar.effDate}" style="float:left;">
										<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
									</h:outputText>
								</p:column>
								
								<p:column headerText="#{lbl['lbl.ct.expiry.date']}" style="width:10%; white-space:normal;" styleClass="column-align-center">
									<h:outputText value="#{itemPriceVar.expDate}" style="float:left;">
										<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
									</h:outputText>
								</p:column>
								
								<p:column headerText="#{lbl['lbl.ct.action']}"  styleClass="column-align-center"
									rendered="#{!ctBackingBean.managedBean.disableAmendDetails and 
						           		amendmentBackingBean.managedBean.selectedItem.chkStatus}"
								     style="width:10%; white-space:normal;">
									<p:commandLink update=":form:itemId" process="@form" 
										disabled="#{itemPriceVar.chkIndexOfRow or 
										(ctBackingBean.managedBean.contractVer.ctAmendment.otherChange and !ctBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange) }"
									   	rendered="#{!itemPriceVar.changePrice and itemPriceVar.editable}" action="#{amendmentBackingBean.editItemPriceOnIndexs()}">
										<f:setPropertyActionListener value="#{itemPriceVar}" target="#{amendmentBackingBean.managedBean.ctItemPrices}" />
										<p:graphicImage value="/css/images/design/ico-edit.png" title="#{lbl['lbl.ct.edit']}" />
									</p:commandLink>
									<p:commandLink rendered="#{itemPriceVar.changePrice}" oncomplete="dlgItemPrices.show();return false;">
										<f:setPropertyActionListener value="#{itemPriceVar}" target="#{amendmentBackingBean.managedBean.ctItemPrices}" />
										<p:graphicImage value="/css/images/design/delete.png" title="#{lbl['lbl.ct.delete']}" />
									</p:commandLink>
								</p:column>
				        
				        </p:dataTable>
			          	<p:dialog id="dlgItemPrices" widgetVar="dlgItemPrices"  modal="true"
			          	    styleClass="screen-title" width="330">
					        <h:panelGrid columns="3">
						         <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
						         <p:spacer width="10" />
						         <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
					        </h:panelGrid>
				
				  	        <div class="ppRightBtn">
						       <p:commandButton value="#{lbl['lbl.btn.yes']}" 	update=":form:itemPriceTable" 
						        	process="@form" action="#{amendmentBackingBean.deleteItemPriceOnIndexs()}" onclick="dlgItemPrices.hide();" />
						       <p:commandButton value="#{lbl['lbl.btn.no']}" onclick="dlgItemPrices.hide();" type="button" />
					       </div>
				      </p:dialog>
			    </p:outputPanel>
				<!-- Ceiling Quantity -->
				<p:outputPanel style="width:100%" 
			         rendered="#{amendmentBackingBean.managedBean.selectedItem!=null and
			 		amendmentBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypeCeilQty
			 		and (ctBackingBean.managedBean.contractVer.ctAmendment.quantityChange or ctBackingBean.managedBean.contractVer.ctAmendment.otherChange)}">
				<p:dataTable id="ceilingTable" var="itemCeilingQtiesVar"
					value="#{amendmentBackingBean.getActiveItemCeilingQty()}" >
					<ac:paginator for="ceilingTable" />
					<p:column headerText="#{lbl['lbl.ct.ministry']}" style="width:25%; white-space:normal;" styleClass="column-align-center">
						<div align="left">
						<h:outputText  value="#{amendmentBackingBean.retrieveMinistryByOrgProfileId(itemCeilingQtiesVar.ctAgency.orgProfile.orgProfileId)}" />
					</div>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.jabatan']}" style="width:25%; white-space:normal;" styleClass="column-align-center">
						<div align="left">
						<h:outputText  value="#{amendmentBackingBean.retrieveJabatanByOrgProfileId(itemCeilingQtiesVar.ctAgency.orgProfile.orgProfileId)}" />
					</div>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.ptj']}"	style="width:30%; white-space:normal;" styleClass="column-align-center">
						<div align="left">
						   <h:outputText  value="#{itemCeilingQtiesVar.ctAgency.orgProfile.orgName}" />
					</div>
					</p:column>
					<p:column style="width:10%; white-space:normal;" styleClass="column-align-center">
						 <f:facet name="header">
							<h:outputText value="#{lbl['lbl.ct.ceiling.qty']}"/>
		               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ceiling.qty']}"/>
	               		 </f:facet>
					     <h:panelGroup style="float:right;" 
					         rendered="#{itemCeilingQtiesVar.changeCeilQuantity or ctBackingBean.managedBean.contractVer.ctAmendment.otherChange}">
						  <p:inputText value="#{itemCeilingQtiesVar.ceilingQuantity}" 
						      styleClass="ppRightBtn" style="width:100px;" label="#{lbl['lbl.ct.ceiling.qty']}"
						  	  maxlength="#{amendmentBackingBean.managedBean.selectedItem.scRequestItem.uom.decimalScale == 0 ? 13 : 14}"
						  	  disabled="#{ctBackingBean.managedBean.disableAmendDetails}" >
							<f:converter converterId="dynamicNumberConverter" />
							<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, amendmentBackingBean.managedBean.selectedItem.scRequestItem.uom.uomCode)}" />
							<p:ajax event="blur" update="@this"/>
						</p:inputText>
						</h:panelGroup>
						<h:outputText value="#{itemCeilingQtiesVar.ceilingQuantity}"
						        style="float:right;" rendered="#{!itemCeilingQtiesVar.changeCeilQuantity 
						             and !ctBackingBean.managedBean.contractVer.ctAmendment.otherChange}">
							<f:converter converterId="dynamicNumberConverter" />
							<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, amendmentBackingBean.managedBean.selectedItem.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column rendered="false" headerText="#{lbl['lbl.ct.effective.date']}" 
					    style="width:10%; white-space:normal;" styleClass="column-align-center">
						<h:outputText value="#{itemCeilingQtiesVar.effDate}" style="float:left;">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column rendered="false" headerText="#{lbl['lbl.ct.expiry.date']}" style="width:10%; white-space:normal;" styleClass="column-align-center">
						<h:outputText value="#{itemCeilingQtiesVar.expDate}" style="float:left;">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column rendered="false" headerText="#{lbl['lbl.ct.action']}" style="width:5%; white-space:normal;" styleClass="column-align-center">
						<p:commandLink update=":form:ceilingTable"
							disabled="#{itemCeilingQtiesVar.chkIndexOfRow}"
						   	rendered="#{!itemCeilingQtiesVar.changeCeilQuantity and itemCeilingQtiesVar.editable}"
							action="#{amendmentBackingBean.editCeilingQuantityOnIndexs()}">
							<f:setPropertyActionListener value="#{itemCeilingQtiesVar}" target="#{amendmentBackingBean.managedBean.ctItemCeilingQtys}" />
							<p:graphicImage value="/css/images/design/ico-edit.png" title="#{lbl['lbl.ct.edit']}" />
						</p:commandLink>
						<p:commandLink oncomplete="dlgCeilQuantity.show();return false;" rendered="#{itemCeilingQtiesVar.changeCeilQuantity}">
							<f:setPropertyActionListener value="#{itemCeilingQtiesVar}" target="#{amendmentBackingBean.managedBean.ctItemCeilingQtys}" />
							<p:graphicImage value="/css/images/design/delete.png" title="#{lbl['lbl.ct.delete']}" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
				<p:dialog id="dlgCeilQuantity" widgetVar="dlgCeilQuantity" styleClass="screen-title"
					modal="true" width="330">
					<h:panelGrid columns="3">
						<p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
						<p:spacer width="10" />
						<div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
					</h:panelGrid>
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:ceilingTable" process="@form"
							action="#{amendmentBackingBean.deleteCeilingQuantityOnIndexs()}"
							onclick="dlgCeilQuantity.hide();" />
						<p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgCeilQuantity.hide();" type="button" />
					</div>
				</p:dialog>
			</p:outputPanel>
			<!-- Maximum Order Quantity -->
			<p:outputPanel style="width:100%" 
		           rendered="#{amendmentBackingBean.managedBean.selectedItem !=null and 
		    	   amendmentBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypeMaxQty
			       and (ctBackingBean.managedBean.contractVer.ctAmendment.quantityChange or ctBackingBean.managedBean.contractVer.ctAmendment.otherChange)}">
			
			            <p:dataTable id="itemMaxQtyTable" var="itemMaxQtyVar" 
				             value="#{amendmentBackingBean.managedBean.selectedItem.ctItemMaxQties}" >
				             <ac:paginator for="itemMaxQtyTable" />
				 
				             <p:column headerText="#{lbl['lbl.ct.zone']}" style="width:40%; white-space:normal;" styleClass="column-align-center"
					             rendered="#{amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalStandard or 
				  		         amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTier or 
				  		         amendmentBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
					               <p:outputLabel value="#{itemMaxQtyVar.ctContractZone.zoneName}" style="float:left;" rendered="#{!itemMaxQtyVar.changeZoneLabel}" />
					               <p:outputLabel value="#{itemMaxQtyVar.ctContractZone.zoneName} (#{lbl['lbl.ct.new']})" style="float:left;" rendered="#{itemMaxQtyVar.changeZoneLabel}" />
		             
				             </p:column>
				
				            
							
							<p:column headerText="#{lbl['lbl.ct.max.order.qty']}" styleClass="column-align-center">							  								
								<p:inputText value="#{itemMaxQtyVar.maxQuantity}" styleClass="ppRightBtn" style="float:right;" required="true" rendered="#{itemMaxQtyVar.changeQuantity}" label="#{lbl['lbl.ct.max.order.qty']}"
					        		maxlength="#{amendmentBackingBean.managedBean.selectedItem.scRequestItem.uom.decimalScale == 0 ? 13 : 14}" disabled="#{ctBackingBean.managedBean.disableAmendDetails}">
									<f:converter converterId="dynamicNumberConverter" />
									<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, amendmentBackingBean.managedBean.selectedItem.scRequestItem.uom.uomCode)}" />
									<p:ajax event="blur" update="@this"/>
						        </p:inputText>
						        <h:outputText value="#{itemMaxQtyVar.maxQuantity}" style="float:right;" rendered="#{!itemMaxQtyVar.changeQuantity}">
							        <f:converter converterId="dynamicNumberConverter" />
									<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, amendmentBackingBean.managedBean.selectedItem.scRequestItem.uom.uomCode)}" />
						        </h:outputText>
								
							</p:column>
						
							<p:column headerText="#{lbl['lbl.ct.effective.date']}" styleClass="column-align-center">
								<h:outputText value="#{itemMaxQtyVar.effDate}"  style="float:left;">
									<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</h:outputText>
							</p:column>
							
							<p:column headerText="#{lbl['lbl.ct.expiry.date']}" styleClass="column-align-center">
								<h:outputText value="#{itemMaxQtyVar.expDate}" style="float:left;">
									<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</h:outputText>
							</p:column>
							
							<p:column headerText="#{lbl['lbl.ct.action']}" styleClass="column-align-center"
								rendered="#{!ctBackingBean.managedBean.disableAmendDetails and 
					           		amendmentBackingBean.managedBean.selectedItem.chkStatus}"
							    	style="width:10%; white-space:normal;">
								<p:commandLink update=":form:itemId" process="@form" 
									disabled="#{itemMaxQtyVar.chkIndexOfRow 
									  or (ctBackingBean.managedBean.contractVer.ctAmendment.otherChange and !ctBackingBean.managedBean.contractVer.ctAmendment.quantityChange)}"
								   	rendered="#{!itemMaxQtyVar.changeQuantity and itemMaxQtyVar.editable}" action="#{amendmentBackingBean.editItemMaxQtyOnIndexs()}">
									<f:setPropertyActionListener value="#{itemMaxQtyVar}" target="#{amendmentBackingBean.managedBean.ctItemMaxQty}" />
									<p:graphicImage value="/css/images/design/ico-edit.png" title="#{lbl['lbl.ct.edit']}" />
								</p:commandLink>
								<p:commandLink rendered="#{itemMaxQtyVar.changeQuantity}" oncomplete="dlgItemMaxQty.show();return false;">
									<f:setPropertyActionListener value="#{itemMaxQtyVar}" target="#{amendmentBackingBean.managedBean.ctItemMaxQty}" />
									<p:graphicImage value="/css/images/design/delete.png" title="#{lbl['lbl.ct.delete']}" />
								</p:commandLink>
							</p:column>
			        
			        </p:dataTable>
		          	<p:dialog id="dlgItemMaxQty" widgetVar="dlgItemMaxQty"  modal="true"
		          	    styleClass="screen-title" width="330">
				        <h:panelGrid columns="3">
					         <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
					         <p:spacer width="10" />
					         <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
				        </h:panelGrid>
			
			  	        <div class="ppRightBtn">
					       <p:commandButton value="#{lbl['lbl.btn.yes']}" 	update=":form:itemMaxQtyTable" 
					        	process="@form" action="#{amendmentBackingBean.deleteItemMaxQtyOnIndexs()}" onclick="dlgItemMaxQty.hide();" />
					       <p:commandButton value="#{lbl['lbl.btn.no']}" onclick="dlgItemMaxQty.hide();" type="button" />
				       </div>
			      </p:dialog>
		    </p:outputPanel>
		</p:outputPanel>
	</p:panel>
	<p:panel id="serviceId" toggleable="true" toggleSpeed="500" rendered="#{amendmentBackingBean.managedBean.itemServiceExist}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.service']}"/>
	        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.service.dtls']}"/>
	  	</f:facet>
	  	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.select.service.item']}" escape="false"/><br/><br/>
		<h:panelGrid style="width:100%;">
			<p:dataTable id="serviceTable" var="serviceItemVar" value="#{amendmentBackingBean.managedBean.ctServiceItemList}"
				selectionMode="single" selection="#{amendmentBackingBean.managedBean.selectedServiceItem}"   rowKey="#{serviceItemVar}"  widgetVar="serviceTableObj">
				<ac:paginator for="serviceTable" />
				<p:ajax event="rowSelect" update=":form:serviceId" process="@this" listener="#{amendmentBackingBean.onSelectServiceItem()}" 
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
				<p:column  style="width:20%;white-space:normal;" filterBy="#{serviceItemVar.scRequestItem.itemName}" filterMatchMode="contains">
				      <f:facet name="header">
		                    <h:outputText id="serviceItemDesc" value="#{lbl['lbl.ct.item.desc']}"/>
		                        &#160; <p:graphicImage id="amendServiceItemId" value="/css/images/design/tooltips.png" /> <p:tooltip
							          id="amendServiceTooltip" for="amendServiceItemId">
							<h:outputText id="amendServiceInstruction" escape="false" value="#{lbl['lbl.ct.instruction.item.search']}" />
						</p:tooltip> 
		               </f:facet>
					<h:outputText id="serviceNameID" value="#{serviceItemVar.scRequestItem.itemName}" style="float:left;" />
					  <p:tooltip id="toolTipServiceName" for="serviceNameID" value="#{serviceItemVar.scRequestItem.itemDesc == null ? lbl['lbl.ct.item.tooltip.desc'] : serviceItemVar.scRequestItem.itemDesc}" />
             
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.uom']}"  style="width:15%;white-space:normal;" styleClass="column-align-center">
					<h:outputText value="#{serviceItemVar.scRequestItem.uom.uomName}" style="float:left;" />
				</p:column>
		      <p:column headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" style="width:15%; white-space:normal;" styleClass="column-align-center">
		        	<h:outputText value="#{serviceItemVar.scRequestItem.tplSpecQuestion.clUomFrequency == null ? lbl['lbl.txt.na'] : serviceItemVar.scRequestItem.tplSpecQuestion.clUomFrequency}" style="float:right;" />
		      </p:column>				
		      	<p:column headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}" 
		      	     style="width:15%; white-space:normal;" styleClass="column-align-center">
		          	<h:outputText value="#{serviceItemVar.scRequestItem.tplSpecQuestion.clUomPerDay == null ? lbl['lbl.txt.na'] : serviceItemVar.scRequestItem.tplSpecQuestion.clUomPerDay}" style="float:right;" />
		      	</p:column>				
				<p:column headerText="#{lbl['lbl.ct.uom.per.month']}" 
				    style="width:15%; white-space:normal;" styleClass="column-align-center">
					<h:outputText value="#{serviceItemVar.scRequestItem.tplSpecQuestion.clUomPerMonth == null ? lbl['lbl.txt.na'] : serviceItemVar.scRequestItem.tplSpecQuestion.clUomPerMonth}" style="float:right;" />
				</p:column>
		      <p:column    headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.year']}" 
		          styleClass="column-align-center" style="width:15%; white-space:normal;"  rendered="false" >
		          	<h:outputText value="#{serviceItemVar.scRequestItem.tplSpecQuestion.clUomPerYear == null ? lbl['lbl.txt.na'] : serviceItemVar.scRequestItem.tplSpecQuestion.clUomPerYear}" style="float:right;" />
		      </p:column>		
				<p:column headerText="#{lbl['lbl.ct.status']}" style="width:10%;white-space:normal;" styleClass="column-align-center">
		            <h:outputText value="#{serviceItemVar.chkStatus ? lbl['lbl.ct.active'] : lbl['lbl.ct.inactive'] }" style="float:left;"/>
		        </p:column> 
			</p:dataTable>
		</h:panelGrid>
		<p:outputPanel id="showServicePrice">
			<p:spacer height="20"/>
	        <h:panelGrid columns="2" style="height:50px;text-align:bottom;" 
	        	rendered="#{amendmentBackingBean.managedBean.selectedServiceItem != null}">
	    		<h:outputLabel for="show" value="#{lbl['lbl.ct.show']}" style="width:50px;"/>
	   			<h:panelGrid columns="3">
		   			<p:selectOneMenu id="showService" value="#{amendmentBackingBean.managedBean.showServiceItem}" style="width:200px;">
		      			<f:selectItems value="#{amendmentBackingBean.getItemDisplayTypeDropdownList(
		      				amendmentBackingBean.managedBean.selectedServiceItem.itemType.parameterCode)}" />
		         		<p:ajax event="change" update=":form:showServicePrice" process="@form"
		         			onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />  
			  		</p:selectOneMenu>
					<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.service.dtls.show']}" />
	  			</h:panelGrid>
			</h:panelGrid>
			<!-- Item Price -->
			<p:outputPanel style="width:100%" 
				rendered="#{amendmentBackingBean.managedBean.selectedServiceItem !=null and 
					amendmentBackingBean.managedBean.showServiceItem == ParameterConst.itemDisplayTypePrice
					and (ctBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or  ctBackingBean.managedBean.contractVer.ctAmendment.otherChange)}">
					
				<p:dataTable id="servicePriceTable" var="ItemPricesVar"
					value="#{amendmentBackingBean.managedBean.selectedServiceItem.ctItemPrices}" >
					<ac:paginator for="servicePriceTable" />
					<p:column headerText="#{lbl['lbl.ct.zone']}" style="width:40%; white-space:normal;" styleClass="column-align-center"
						rendered="#{amendmentBackingBean.managedBean.selectedServiceItem.priceType.parameterCode eq ParameterConst.priceTypeZonalStandard}">
						        <p:outputLabel value="#{ItemPricesVar.ctContractZone.zoneName}" style="float:left;" rendered="#{!ItemPricesVar.changeZoneLabel}" />
						        <p:outputLabel value="#{ItemPricesVar.ctContractZone.zoneName} (#{lbl['lbl.ct.new']})" style="float:left;" rendered="#{ItemPricesVar.changeZoneLabel}" />
			       	</p:column>
					<p:column headerText="#{lbl['lbl.ct.price']}" style="width:10%; white-space:normal;" styleClass="column-align-center">
					     <h:panelGroup style="float:right;"  rendered="#{ItemPricesVar.changePrice}">
					    	<p:inputText value="#{ItemPricesVar.unitPrice}" styleClass="ppRightBtn" style="width:100px;" label="#{lbl['lbl.ct.price']}"
					    		disabled="#{ctBackingBean.managedBean.disableAmendDetails}" >
								<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								<p:ajax process="@this"/>
						</p:inputText>
					</h:panelGroup>
						<h:outputText value="#{ItemPricesVar.unitPrice}" style="float:right;" rendered="#{!ItemPricesVar.changePrice}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.effective.date']}" style="width:10%;white-space:normal;" styleClass="column-align-center">
						<h:outputText value="#{ItemPricesVar.effDate}" style="float:left">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.expiry.date']}" style="width:10%;white-space:normal;" styleClass="column-align-center">
						<h:outputText value="#{ItemPricesVar.expDate}" style="float:left;">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.action']}" styleClass="column-align-center" style="width:10%;white-space:normal;" 
						rendered="#{!ctBackingBean.managedBean.disableAmendDetails and 
								amendmentBackingBean.managedBean.selectedServiceItem.chkStatus}">
						<p:commandLink update=":form:servicePriceTable" process="@form" rendered="#{!ItemPricesVar.changePrice and ItemPricesVar.editable}"
							action="#{amendmentBackingBean.editServiceItemPriceOnIndexs()}"
							 disabled="#{ItemPricesVar.chkIndexOfRow or 
										(ctBackingBean.managedBean.contractVer.ctAmendment.otherChange and !ctBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange) }">
							<f:setPropertyActionListener value="#{ItemPricesVar}" target="#{amendmentBackingBean.managedBean.ctServiceItemPrices}" />
							<p:graphicImage value="/css/images/design/ico-edit.png" title="#{lbl['lbl.ct.edit']}" />
						</p:commandLink>
						<p:commandLink rendered="#{ItemPricesVar.changePrice}" oncomplete="dlgSvcItemPrices.show();return false;"
						 disabled="#{ctBackingBean.managedBean.disableAmendDetails}" >
							<f:setPropertyActionListener value="#{ItemPricesVar}" target="#{amendmentBackingBean.managedBean.ctServiceItemPrices}" />
							<p:graphicImage value="/css/images/design/delete.png" title="#{lbl['lbl.ct.delete']}" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
				<p:dialog id="dlgSvcItemPrices" widgetVar="dlgSvcItemPrices" styleClass="screen-title"
					modal="true" width="330">
					<h:panelGrid columns="3">
						<p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
						<p:spacer width="10" />
						<div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
					</h:panelGrid>
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.yes']}" update=":form:servicePriceTable" process="@form"
							action="#{amendmentBackingBean.deleteServiceItemPriceOnIndexs()}" onclick="dlgSvcItemPrices.hide();" />
						<p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgSvcItemPrices.hide();" type="button" />
					</div>
				</p:dialog>			
			</p:outputPanel>		    
			<!-- Quantity -->
			<p:outputPanel style="width:100%" 
				rendered="#{amendmentBackingBean.managedBean.selectedServiceItem !=null and 
					amendmentBackingBean.managedBean.showServiceItem == ParameterConst.itemDisplayTypeQty
					and (ctBackingBean.managedBean.contractVer.ctAmendment.quantityChange or ctBackingBean.managedBean.contractVer.ctAmendment.otherChange)}">
					
					
				<p:dataTable id="serviceItemMaxQtyTbl" var="serviceItemMaxQty" 
					value="#{amendmentBackingBean.managedBean.selectedServiceItem.ctItemMaxQties}">
					<ac:paginator for="serviceItemMaxQtyTbl"/>
					<p:column headerText="#{lbl['lbl.ct.zone']}" style="width:30%; white-space:normal;"
						rendered="#{amendmentBackingBean.managedBean.selectedServiceItem.priceType.parameterCode eq ParameterConst.priceTypeZonalStandard or 
			  		 		amendmentBackingBean.managedBean.selectedServiceItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTier or 
			  		  		amendmentBackingBean.managedBean.selectedServiceItem.priceType.parameterCode eq ParameterConst.priceTypeZonalTariff}">
						<p:outputLabel value="#{serviceItemMaxQty.ctContractZone.zoneName}" style="float:left;" rendered="#{!serviceItemMaxQty.changeZoneLabel}" />
						<p:outputLabel value="#{serviceItemMaxQty.ctContractZone.zoneName} (#{lbl['lbl.ct.new']})" style="float:left;" rendered="#{serviceItemMaxQty.changeZoneLabel}" />
					</p:column>				            
			   		<p:column headerText="#{lbl['lbl.ct.quantity']}" style="width: 30%; white-space:normal;" styleClass="column-align-center">
		       			<h:outputText value="#{serviceItemMaxQty.maxQuantity}" style="float:right;">
		           			<f:converter converterId="dynamicNumberConverter" />
							<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, ctBackingBean.managedBean.selectedServiceItem.scRequestItem.uom.uomCode)}" />
			  			</h:outputText>
					</p:column>  
		            <p:column headerText="#{lbl['lbl.ct.effective.date']}" style="width: 20%; white-space:normal;" styleClass="column-align-center">
		                <h:outputText value="#{serviceItemMaxQty.effDate}" style="float:left;">
                   			<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                  		</h:outputText>			            
			    	</p:column>       
		            <p:column headerText="#{lbl['lbl.ct.expiry.date']}" style="width: 20%; white-space:normal;" styleClass="column-align-center">
		                <h:outputText value="#{serviceItemMaxQty.expDate}" style="float:left;">
                             <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                 		</h:outputText>			            
		 			</p:column>
			    </p:dataTable>
		  	</p:outputPanel>
		</p:outputPanel>
	</p:panel>
	<p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true" rendered="#{!ctBackingBean.managedBean.viewContract}">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{ctBackingBean.managedBean.contractVer.itemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{amendmentBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" 
												   disabled="#{ctBackingBean.managedBean.disableAmendDetails}" maxlength="1000" /> 
												<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.remark']}" rendered="#{remarkIndex==0}" />
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		  	
 </ui:composition>
