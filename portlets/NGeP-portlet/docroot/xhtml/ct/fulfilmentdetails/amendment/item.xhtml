<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
        <p:panel id="itemId" header="Item Details"   toggleable="true"  toggleSpeed="500" widgetVar="panelitem">
          <p:dataTable id="dataTable" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
			 paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			 rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
			 paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
			 {LastPageLink} {RowsPerPageDropdown}">
			 <p:columnGroup type="header"> 
			 <p:row> 
			   <p:column style="width:80px" headerText="Item Code" /> 
               <p:column style="width:320px" headerText="Item Name" /> 	
               <p:column style="width:100px" headerText="Origin Country"  /> 
               <p:column style="width:70px" headerText="Price UOM" /> 	
               <p:column style="width:50px" headerText="Exempted"  /> 
               <p:column style="width:70px" headerText="Action"  /> 
            </p:row>							
			</p:columnGroup>
			<p:column></p:column>       
			<p:column></p:column>       
			<p:column></p:column>       
			<p:column></p:column>       
			<p:column styleClass="column-align-center">
			<p:selectBooleanCheckbox value=""/> 
            </p:column>       
			<p:column styleClass="column-align-center">
			<p:commandButton title="Edit" partialSubmit="true" process="@this" 
			   icon="ui-icon-edit" styleClass="ui-icon-button"/>
			<p:spacer width="2"></p:spacer>
			<p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
			  icon="ui-icon-delete" styleClass="ui-icon-button"/>
			</p:column>  
		</p:dataTable>
		<h:panelGrid columns="2" style="height:100px;text-align:bottom;">
		   <h:outputLabel for="show" value="Show" style="width:100px;" styleClass="txtsize"/>  
           <p:selectOneMenu id="show" disabled="false"  value="#{contractDetailsBackingBean.managedBean.createContractDetails.zoneType}"  style="width:200px;">
              <f:selectItem itemLabel="--Please Select--" itemValue="--Please Select--" /> 
              <f:selectItems value="#{contractDetailsBackingBean.itemDetailsMethod}" />
            	 <p:ajax event="change" update="changeField" listener="#{contractDetailsBackingBean.changeField}" process="@this"/>  
	       </p:selectOneMenu>         
	       <p:message for="show"/>  
        </h:panelGrid>
	   </p:panel>
	   <p:outputPanel id="changeField"> 
	   <h:panelGrid columns="1" style="width:800px"
		  rendered="#{contractDetailsBackingBean.itemPricing or contractDetailsBackingBean.itemCeilingQuantity}">
		  <p:panel id="itemZoneId"  header="#{contractDetailsBackingBean.managedBean.createContractDetails.zoneType}"  toggleable="true"  toggleSpeed="500" widgetVar="panelitemzone">
		  <p:dataTable id="dataTable1"  var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
			 paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			 rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
		     paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
			 {LastPageLink} {RowsPerPageDropdown}">
			 <p:columnGroup type="header">
				<p:row rendered="#{contractDetailsBackingBean.itemPricing}">
                   <p:column style="width:100px" headerText="Zone" />
				   <p:column style="width:50px" headerText="From Qty" />
				   <p:column style="width:50px" headerText="To Qty" />
				   <p:column style="width:100px" headerText="Price (MYR)" />
				   <p:column style="width:150px" headerText="Effective Date" />
				   <p:column style="width:150px" headerText="Expirey Date" />
				   <p:column style="width:100px" headerText="Action" />
		       </p:row>
               <p:row  rendered="#{contractDetailsBackingBean.itemCeilingQuantity}"> 
				  <p:column style="width:100px" headerText="Ministry Name"   /> 
				  <p:column style="width:100px" headerText="Jabatan Name" /> 
				  <p:column style="width:100px" headerText="PTJ Name" /> 
			      <p:column style="width:100px" headerText="Ceiling Quantity" /> 
			      <p:column style="width:150px" headerText="Effective Date" />
				  <p:column style="width:150px" headerText="Expirey Date" />
			   </p:row>								
			</p:columnGroup>
			<p:column></p:column>       
			<p:column></p:column>       
			<p:column></p:column>              
			<p:column></p:column>            
			<p:column>
			  <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.managedBean.createContractDetails.date}" id="popupButtonCal" showOn="button" />
			</p:column>       
			<p:column>
			  <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.managedBean.createContractDetails.date}" id="popupButtonCal1" showOn="button" />
			</p:column>       
			<p:column styleClass="column-align-center" rendered="#{!contractDetailsBackingBean.itemCeilingQuantity}">
			<p:commandButton title="Add" partialSubmit="true" process="@this" 
			   icon="ui-icon-add1" styleClass="ui-icon-button"/>
			<p:spacer width="2"/>
			<p:commandButton title="Edit" partialSubmit="true" process="@this" 
			   icon="ui-icon-edit" styleClass="ui-icon-button"/>
			<p:spacer width="2"/>
			<p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
				icon="ui-icon-delete" styleClass="ui-icon-button"/>
			</p:column>          
		</p:dataTable>
	   </p:panel>
	  </h:panelGrid>  
	</p:outputPanel>
    <p:confirmDialog message="Do you want to delete the record?" closable="true" appendToBody="true" header="Delete Confirmation"
	   severity="alert" widgetVar="confirmation">
       <h:panelGrid columns="2" columnClasses="column-align-right-50,column-align-left">
		  <p:commandButton value="Yes" 	update="dataTable" partialSubmit="true" process="@this"
			 onclick="confirmation.hide();"/>
		  <p:commandButton value="No" onclick="confirmation.hide()" type="button" />
	   </h:panelGrid>
    </p:confirmDialog>                          
</ui:composition>
