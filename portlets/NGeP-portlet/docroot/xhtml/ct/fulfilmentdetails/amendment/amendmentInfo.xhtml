<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<style>
		.disciplinaryNotifyCss {
			font-family: Arial, Helvetica, sans-serif;
			font-size: 12px;
			font-weight: bold;
			color: #0000FF;
			height: 35px;
			vertical-align: middle;
			margin: 10px;
			background-color: #CCE6FF;
			border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
		}
		
		.disciplinaryNotifyCssAlign {
			margin: 10px;
		}
	</style>

	<table style="width: 100%;">
		<tr>
			<td valign="top" class="disciplinaryNotifyCss">
				<div class="disciplinaryNotifyCssAlign">
					<h:outputText
						rendered="#{not empty amendmentBackingBean.managedBean.disciplinaryActionMsg}"
						value="#{amendmentBackingBean.managedBean.disciplinaryActionMsg}" />

					<p:commandLink onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						rendered="#{not empty amendmentBackingBean.managedBean.disciplinaryActionMsg}"
						action="#{amendmentBackingBean.onViewDisciplinaryAction}"
						process="@this" partialSubmit="true" update=":form">
						<u><h:outputText value="#{lbl['lbl.sm.disciplinary.here']}"
								style="color:blue;" /></u>
					</p:commandLink>
					<p:spacer width="2" />

					<h:outputText
						rendered="#{not empty amendmentBackingBean.managedBean.disciplinaryActionMsg}"
						value="#{lbl['lbl.sm.supplier.to.view.disc.action.details']}" />
				</div>
			</td>
		</tr>
	</table>
	
	<ac:disciplinaryActionHistory voList="#{amendmentBackingBean.managedBean.disciplineVOs}" btnView="true"/>
</ui:composition>
