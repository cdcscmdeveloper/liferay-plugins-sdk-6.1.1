<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="amend" header="#{lbl['lbl.ct.menu.amendment']}" toggleable="true" toggleSpeed="500">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.amendment.type']}" escape="false"/><br/><br/>
		<h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth170">
				<p:outputLabel value="#{lbl['lbl.ct.amendment.type']}"  styleClass="required"/>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.contractExtend}"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails}">
					<p:ajax event="change" update=":form:typesOfAmend,:form:instruction,:form:itemId,:form:serviceId" process="@all"
					   onstart="blockWidget.show();" 
					   oncomplete="blockWidget.hide();"  listener="#{amendmentBackingBean.onContractExtensionChecked}" />
				</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<h:panelGrid columns="2">
					<p:outputLabel value="#{lbl['lbl.ct.contract.extension']}" style="width:100%; text-align:left" />
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.extension']}" />
				</h:panelGrid>
			</h:panelGrid>
			<f:verbatim/>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange}"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails
						or (!amendmentBackingBean.managedBean.itemProductExist and !amendmentBackingBean.managedBean.itemServiceExist)}">
					 <p:ajax event="change" update=":form"  process="@form" 
					    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  listener="#{amendmentBackingBean.onItemPriceChecked}" /> 
					 </p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<h:panelGrid columns="2">
					<p:outputLabel value="#{lbl['lbl.ct.change.item.price']}" style="width:150px; text-align:left" />
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.change.item.price']}" />
				</h:panelGrid>
			</h:panelGrid>
			<f:verbatim/>
		    <h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.quantityChange}" 
					disabled="#{ctBackingBean.managedBean.disableAmendDetails
					or !amendmentBackingBean.managedBean.itemProductExist
					or  ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
					<p:ajax event="change" update=":form" process="@form"
					    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  listener="#{amendmentBackingBean.onQuantityChecked}" /> 
					</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<h:panelGrid columns="2">
					<p:outputLabel value="#{lbl['lbl.ct.change.quantity']}" style="width:150px; text-align:left" />
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.change.quantity']}" />
				</h:panelGrid>
			</h:panelGrid>
			<f:verbatim/>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="#{ctBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange 
				    or ctBackingBean.managedBean.contractVer.ctAmendment.quantityChange
				    or ctBackingBean.managedBean.disableAmendDetails
				    or (ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral
				    	and !ctBackingBean.managedBean.contractVer.ctContractValue.followLoaAmt)}"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.valueChange}"  >
					<p:ajax event="change"  update=":form:amend" process="@form"
						listener="#{amendmentBackingBean.onChangeValueChecked}"
					  	onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  /> 
					</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<h:panelGrid columns="2">
					<p:outputLabel value="#{lbl['lbl.ct.change.contract.value']}" style="width:150px; text-align:left" />
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.change.contract.amount']}" />
				</h:panelGrid>
			</h:panelGrid>
			<f:verbatim/>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="#{ctBackingBean.managedBean.disableAmendDetails}"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.clauseChange}" >
					<p:ajax event="change"  update=":form:typesOfAmend" process="@form"
					     onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  /> 
				</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<h:panelGrid columns="2">
					<p:outputLabel value="#{lbl['lbl.ct.change.clause']}" style="width:150px; text-align:left" />
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.change.clause']}" />
				</h:panelGrid>
			</h:panelGrid>
			<f:verbatim/>
			
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="#{ctBackingBean.managedBean.disableAmendDetails}"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.otherChange}" >
					<p:ajax event="change" update=":form"  process="@form" listener="#{amendmentBackingBean.onChangeOther}"
					    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  />
				</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<h:panelGrid columns="2">
				        <p:outputLabel value="#{lbl['lbl.ct.gst.amend.other']}" style="width:150px; text-align:left" />
				         <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.gst.other']}" />
				    </h:panelGrid>
		  	</h:panelGrid>
		 </h:panelGrid>
	    <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth170">
				<p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" styleClass="required" />
			<h:panelGrid columns="5">
				<p:inputText id="txtfrno" style="width:650px;" label="#{lbl['lbl.ct.file.ref.no']}"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.fileRefNo}" 
					disabled="#{ctBackingBean.managedBean.disableAmendDetails}" maxlength="100" />
				<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.file.ref.no']}" />
			    <p:spacer width="1"/>
				<p:message for="txtfrno" display="icon" />
			</h:panelGrid>			
				<p:outputLabel value="#{lbl['lbl.ct.amendment.title']}"  styleClass="required"/>
			<h:panelGrid columns="2">
				<p:inputTextarea id="txtname" style="width:650px;margin-bottom:5px;"  label="#{lbl['lbl.ct.amendment.title']}" rows="2"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.title}" maxlength="100"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails}" autoResize="false" />
				<p:message for="txtname" display="icon" />	
			</h:panelGrid>
		</h:panelGrid>
		<h:panelGrid columns="3" style="width:100%"	columnClasses="columnWidth170">
			<h:panelGroup>
				<div style="float: right; vertical-align: top;">
						<p:outputLabel value="#{lbl['lbl.ct.amendment.desc']}"  styleClass="required"/>
				</div>
			</h:panelGroup>
			<h:panelGrid columns="2">
				<p:inputTextarea id="txtdesc" rows="5"  label="#{lbl['lbl.ct.amendment.desc']}"
					style="width:650px;margin-bottom: 5px;"  autoResize="false" maxlength="200"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.description}"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails}"
					onkeyup="limitTextArea(this,200);" onkeydown="limitTextArea(this,200);"  />
				<p:message for="txtdesc" display="icon" />	
			</h:panelGrid>			
		</h:panelGrid>
		<h:panelGroup rendered="#{!ctBackingBean.managedBean.disableAmendDetails}">
		  <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth170">
			<h:panelGrid columns="1" style="float:right;">
				<p:outputLabel value="#{lbl['lbl.ct.secretary.committee']}" />
			</h:panelGrid>
			<h:panelGrid columns="1">
				<p:selectOneMenu id="secretaryId" value="#{amendmentBackingBean.managedBean.secretaryId}" 
					label="#{lbl['lbl.ct.secretary.committee']}" style="width:300px;">
		           	<f:selectItems value="#{amendmentBackingBean.getSecretaryDropdownList()}" />
		       	</p:selectOneMenu>
			</h:panelGrid>
		  </h:panelGrid>
		</h:panelGroup>
		<h:panelGrid id="instruction"  columns="1" style="width:100%">
			<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.extension.period']}" escape="false"
				rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.contractExtend}"/><br/>
		</h:panelGrid>
		<h:panelGrid id="typesOfAmend"  columns="6" style="width:100%" columnClasses="columnWidth170">
			<h:outputLabel value="#{lbl['lbl.ct.extension.period']}" styleClass="required"
				rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" />
			<h:panelGrid columns="3"
				rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.contractExtend}">
				<p:inputText style="width:80px;" required="true" label="#{lbl['lbl.ct.extension.period']}"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.extendPeriod}" maxlength="3"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails}">
					<p:ajax event="blur" update="extStartDate, extEndDate, :form:itemId, :form:serviceId" listener="#{amendmentBackingBean.onExtensionPeriodChanged}" 
					 onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  />
					</p:inputText>
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.months']}" />
			</h:panelGrid>
		
			<p:outputLabel value="#{lbl['lbl.ct.extension.start.date']}"
				rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" />
			<p:inputText id="extStartDate" value="#{ctBackingBean.managedBean.contractVer.ctAmendment.extendStartDate}" 
			    disabled="true" style="width:90px;" rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.contractExtend}">
				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</p:inputText>
			
			<p:outputLabel value="#{lbl['lbl.ct.extension.end.date']}"
				rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" />
			<p:inputText id="extEndDate" value="#{ctBackingBean.managedBean.contractVer.ctAmendment.extendEndDate}" 
			    disabled="true" style="width:90px;" rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.contractExtend}">
				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</p:inputText>
		
			<p:outputLabel value="#{lbl['lbl.ct.additional.contract.amt']}" rendered="#{amendmentBackingBean.getAmendValue(1)}"/>			
			<h:panelGrid columns="5" rendered="#{amendmentBackingBean.getAmendValue(1)}" >
				<p:inputText id="addValueTxt" styleClass="ppRightBtn" style="width:80px;"  
				   value="#{ctBackingBean.managedBean.contractVer.ctAmendment.additionalAmount}" 
				   disabled="#{ctBackingBean.managedBean.disableAmendDetails}">
					 <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					 <p:ajax event="blur" update="addValueTxt, addValue, overallAmt" process="@this" listener="#{amendmentBackingBean.changeAdditionalValue}"
					   onstart="blockWidget.show();"  oncomplete="blockWidget.hide();" />
				</p:inputText>
				<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.additional.contract.amount']}" />
			    <p:spacer width="1"/>
				<p:message for="addValueTxt" display="icon" />
			</h:panelGrid>
			
			<p:outputLabel value="#{lbl['lbl.ct.new.contract.amt']}" rendered="#{amendmentBackingBean.getAmendValue(1)}"/>
			<h:panelGrid columns="3" rendered="#{amendmentBackingBean.getAmendValue(1)}">
				<p:inputText id="addValue" styleClass="ppRightBtn" style="width:90px;" disabled="true"
					value="#{amendmentBackingBean.newContractAmt()}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
				<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.new.contract.amount']}" />
			</h:panelGrid>			
		
			<h:panelGrid columns="2" rendered="#{amendmentBackingBean.getAmendValue(2)}"  style="float:right;">
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel value="#{lbl['lbl.ct.effective.date']}" style="float:left;" />
			</h:panelGrid>
			<h:panelGrid columns="5" rendered="#{amendmentBackingBean.getAmendValue(2)}" >
				<p:calendar style="width:80px;" id="edateCal1" showOn="button"  readonlyInput="true" navigator="true"
			    	required="true" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
				    label="#{lbl['lbl.ct.effective.date']}" value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentEffDate}"
				    maxdate="#{ctBackingBean.managedBean.contractVer.ctContractValue.expDate}" 
				    mindate="#{amendmentBackingBean.managedBean.newAmendmentEffDate}"
				    rendered="#{!ctBackingBean.managedBean.disableAmendDetails}">
				        <p:ajax event="dateSelect" process="@this" onstart="blockWidget.show();"  oncomplete="blockWidget.hide();"
				            listener="#{amendmentBackingBean.changeAmendmentEffDate}"  update=":form:itemId,:form:serviceId"/> 
				</p:calendar>
				<p:inputText disabled="true" style="width:90px;"
					rendered="#{ctBackingBean.managedBean.disableAmendDetails}"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.amendmentEffDate}">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
	  			</p:inputText>
				<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.new.effective.date']}" />
			    <p:spacer width="1"/>
			   <p:message for="edateCal1" display="icon" />	
			</h:panelGrid>
			
			<f:verbatim rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.contractExtend and
				!amendmentBackingBean.getAmendValue(2)}"/>
			<f:verbatim rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.contractExtend and
				!amendmentBackingBean.getAmendValue(2)}"/>
			
			<p:outputLabel value="#{lbl['lbl.ct.new.gst.amt']}" rendered="#{amendmentBackingBean.getAmendValue(1)}"/>	
			<h:panelGrid columns="5" rendered="#{amendmentBackingBean.getAmendValue(1)}" >
				<p:inputText id="newGstAmtTxt" styleClass="ppRightBtn"  maxlength="18" style="width:80px;"
				   value="#{ctBackingBean.managedBean.contractVer.ctAmendment.newGstAmount}" 
				   disabled="#{ctBackingBean.managedBean.disableAmendDetails
				   		or ctBackingBean.managedBean.disableGstAmount}"
				   rendered="#{ctBackingBean.managedBean.gstCheckingGUI}">
					 <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					 <p:ajax event="blur" update="newGstAmtTxt, overallAmt" process="@this" 
					   onstart="blockWidget.show();"  oncomplete="blockWidget.hide();" />
				</p:inputText>
				<p:message for="newGstAmtTxt" display="icon" />
				<p:inputText styleClass="ppRightBtn" style="width:80px;" disabled="true" 
	   				 rendered="#{!ctBackingBean.managedBean.gstCheckingGUI}" value="#{lbl['lbl.txt.na']}">
				</p:inputText>
			</h:panelGrid>
			
			<p:outputLabel value="#{lbl['lbl.ct.new.overall.contract.amt']}" rendered="#{amendmentBackingBean.getAmendValue(1)}"/>
			<h:panelGrid columns="3" rendered="#{amendmentBackingBean.getAmendValue(1)}">
				<p:inputText id="overallAmt" styleClass="ppRightBtn" style="width:90px;" disabled="true"
					value="#{amendmentBackingBean.newOverallContractAmt()}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</h:panelGrid>
		</h:panelGrid>
		
		<h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth170"
			 rendered="#{amendmentBackingBean.managedBean.amendHistoryList != null and 
			!empty amendmentBackingBean.managedBean.amendHistoryList and amendmentBackingBean.bpkApprover}">
			<h:panelGroup>
				<div style="height: 35px; vertical-align: top;">
					<p:outputLabel for="contractHistory"
						value="#{lbl['lbl.ct.extension.history']}" style="text-align:right;" />
				</div>
			</h:panelGroup>
			<h:panelGrid id="contractHistory" columns="1">
				<p:dataTable id="dataTableHistory" var="data" style="width:100%;"
				     value="#{amendmentBackingBean.managedBean.amendHistoryList}">
	                <ac:paginator for="dataTableHistory" />
					<p:columnGroup type="header">
						<p:row>
							<p:column headerText="#{lbl['lbl.ct.file.ref.no']}" styleClass="column-align-center" style="width:35%;white-space:normal;"/>
							<p:column headerText="#{lbl['lbl.ct.extension.period.month']}" styleClass="column-align-center" style="width:20%;white-space:normal;"/>
							<p:column headerText="#{lbl['lbl.ct.extension.start.date']}" styleClass="column-align-center" style="width:25%;white-space:normal;"/>
							<p:column headerText="#{lbl['lbl.ct.extension.end.date']}" styleClass="column-align-center" style="width:25%;white-space:normal;"/>
						</p:row>
					</p:columnGroup>
						<p:column> <h:outputText value="#{data.ctAmendment.fileRefNo}" style="float:left;"/></p:column>
						<p:column> <h:outputText value="#{data.ctAmendment.extendPeriod}" style="float:left;"/></p:column>
						<p:column>
							<h:outputText value="#{data.ctAmendment.extendStartDate}" style="float:left;">
								<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
							</h:outputText>
						</p:column>
						<p:column>
							<h:outputText value="#{data.ctAmendment.extendEndDate}" style="float:left;">
								<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />								
							</h:outputText>
						</p:column>
				</p:dataTable>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
</ui:composition>
