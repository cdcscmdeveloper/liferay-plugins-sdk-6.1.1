<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="amend" header="#{lbl['lbl.ct.menu.amendment']}" toggleable="true" toggleSpeed="500">	
		<h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth225">
			<h:panelGrid columns="2" style="float:right;">
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel value="#{lbl['lbl.ct.amendment.type']}" />
			</h:panelGrid>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}"
					disabled="#{amendmentBackingBean.invalidContractExtendPeriod()}">
					<p:ajax event="change" update=":form:amend" process="@form" listener="#{amendmentBackingBean.onContractExtensionChecked}" />
				</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.contract.extension']}" />
			</h:panelGrid>
			<f:verbatim/>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange}"
					disabled="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.contractAmount lt CtConst.contractThresholdValue}">
					 <p:ajax event="change" update=":form"  process="@form" listener="#{amendmentBackingBean.onItemPriceChecked}" /> 
					 </p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.change.item.price']}" />
			</h:panelGrid>
			<f:verbatim/>
		    <h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange}" 
					disabled="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.contractAmount lt CtConst.contractThresholdValue}">
					<p:ajax event="change" update=":form" process="@form" listener="#{amendmentBackingBean.onQuantityChecked}" /> 
					</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.change.quantity']}" />
			</h:panelGrid>
			<f:verbatim/>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox disabled="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange 
				    or amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange
				    or amendmentBackingBean.managedBean.contractVer.ctContractValue.contractAmount lt CtConst.contractThresholdValue}"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange}"  >
					<p:ajax event="change"  update=":form:amend" process="@form" /> 
					</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.change.contract.value']}" />
			</h:panelGrid>
			<f:verbatim/>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.clauseChange}" >
					<p:ajax event="change"  update=":form:amend" process="@form"/> 
				</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.change.clause']}"  />
			</h:panelGrid>
	     </h:panelGrid>
	    <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth225">
			<h:panelGrid columns="2" style="float:right;">
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
			</h:panelGrid>
			<h:panelGrid columns="2">
				<p:inputText id="txtfrno" style="width:170px;" required="true" label="#{lbl['lbl.ct.file.ref.no']}"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.fileRefNo}" />
				<p:message for="txtfrno" display="icon" />
			</h:panelGrid>
			<h:panelGrid columns="2" style="float:right;">
				<p:outputLabel value="*" styleClass="mandatory" />				
				<p:outputLabel value="#{lbl['lbl.ct.amendment.title']}" />
			</h:panelGrid>
			<h:panelGrid columns="2">
				<p:inputText id="txtname" style="width:530px;" required="true" label="#{lbl['lbl.ct.amendment.title']}"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.title}" />
				<p:message for="txtname" display="icon" />	
			</h:panelGrid>
		</h:panelGrid>
		<h:panelGrid columns="3" style="width:100%"	columnClasses="columnWidth225">
			<h:panelGroup>
				<div style="float: right; vertical-align: top;">
					<h:panelGrid columns="2">
						<p:outputLabel value="*" styleClass="mandatory" />
						<p:outputLabel value="#{lbl['lbl.ct.amendment.desc']}" />
					</h:panelGrid>
				</div>
			</h:panelGroup>
			<h:panelGrid columns="2">
				<p:inputTextarea id="txtdesc" rows="5"  required="true" label="#{lbl['lbl.ct.amendment.desc']}"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.description}"
					style="width:530px;margin-bottom: 5px;" />
				<p:message for="txtdesc" display="icon" />	
			</h:panelGrid>
		</h:panelGrid>
		<h:panelGrid columns="6" style="width:100%" columnClasses="columnWidth225">
			<h:outputLabel value="#{lbl['lbl.ct.extension.period']}"
				rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" />
			<h:panelGrid columns="3"
				rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}">
				<p:selectOneMenu id="ceperiod" style="width:80px;"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.extendPeriod}" >
					<p:ajax event="change" update="extStartDate, extEndDate" listener="#{amendmentBackingBean.onExtensionPeriodChanged}" />
					<f:selectItem itemLabel="3" itemValue="3" />
					<f:selectItem itemLabel="6" itemValue="6" />
					<f:selectItem itemLabel="9" itemValue="9" />
					<f:selectItem itemLabel="12" itemValue="12" />
					<f:selectItem itemLabel="24" itemValue="24" />
					<f:selectItem itemLabel="36" itemValue="36" />
				</p:selectOneMenu>
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.months']}" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.extension.start']}"
				rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" />
			<p:inputText id="extStartDate" value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.extendStartDate}" 
			    disabled="true" style="width:100px;" rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}">
				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</p:inputText>
			<p:outputLabel value="#{lbl['lbl.ct.extension.end']}"
				rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" />
			<p:inputText id="extEndDate" value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.extendEndDate}" 
			    disabled="true" style="width:100px;" rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}">
				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</p:inputText>
			<h:panelGrid columns="2" rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or
		          amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange or
		          amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange}" style="float:right;" >
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel value="#{lbl['lbl.ct.additional.contract.amt']}" />
			</h:panelGrid>
			<h:panelGrid columns="2" rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or
			          amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange or
			          amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange}" >
				<p:inputText id="addValueTxt" style="width:70px;" styleClass="ppRightBtn" required="true" label="#{lbl['lbl.ct.additional.contract.amt']}"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.additionalAmount}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					<p:ajax event="blur" update="addValueTxt, addValue" process="@this" listener="#{amendmentBackingBean.addContractValue}" />
				</p:inputText>
				<p:message for="addValueTxt" display="icon" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.new.contract.amt']}"
				rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or
		          amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange or
		          amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange}" />
			<p:inputText id="addValue"
				value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				styleClass="ppRightBtn" style="width:100px;" disabled="true"
				rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or
		          amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange or
		          amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>
			<h:panelGrid columns="2" rendered="#{(amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or
		          amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange or
		          amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange or 
		          amendmentBackingBean.managedBean.contractVer.ctAmendment.clauseChange) and 
		          !amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}"  style="float:right;">
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel value="#{lbl['lbl.ct.effective.date']}" style="float:left;" />
			</h:panelGrid>
			<h:panelGrid columns="2" rendered="#{(amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or
		          amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange or
		          amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange or 
		          amendmentBackingBean.managedBean.contractVer.ctAmendment.clauseChange) and 
		          !amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" >
				<p:calendar size="10" style="float:left;" id="edateCal1" showOn="button"  readonlyInput="true" navigator="true"
			    	required="true" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
				    label="#{lbl['lbl.ct.effective.date']}" value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentEffDate}"
				    maxdate="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.expDate}"
				    mindate="#{amendmentBackingBean.currentDate}">
				        <p:ajax event="dateSelect" listener="#{amendmentBackingBean.changeAmendmentEffDate}" process="@this" update=":form:itemId,:form:serviceId"/> 
				 </p:calendar>
				<p:message for="edateCal1" display="icon" />	
			</h:panelGrid>
		</h:panelGrid>
		<h:panelGrid columns="2" style="width:100%"
			columnClasses="columnWidth225" rendered="#{amendmentBackingBean.managedBean.amendHistoryList != null and 
			!empty amendmentBackingBean.managedBean.amendHistoryList and amendmentBackingBean.bpkApprover}">
			<h:panelGroup>
				<div style="height: 35px; vertical-align: top;">
					<p:outputLabel for="contractHistory"
						value="#{lbl['lbl.ct.extension.history']}" style="text-align:right;" />
				</div>
			</h:panelGroup>
			<h:panelGrid id="contractHistory" columns="1">
				<p:dataTable id="dataTableHistory" var="data"
				     dynamic="true" value="#{amendmentBackingBean.managedBean.amendHistoryList}">
	                <ac:paginator for="dataTableHistory" />
					<p:columnGroup type="header">
						<p:row>
							<p:column headerText="#{lbl['lbl.ct.file.ref.no']}" />
							<p:column headerText="#{lbl['lbl.ct.extension.period.month']}" />
							<p:column headerText="#{lbl['lbl.ct.extension.start.date']}" />
							<p:column headerText="#{lbl['lbl.ct.extension.end.date']}" />
						</p:row>
					</p:columnGroup>
						<p:column> <p:outputLabel value="#{data.ctAmendment.fileRefNo}"/></p:column>
						<p:column> <p:outputLabel value="#{data.ctAmendment.extendPeriod}"/></p:column>
						<p:column>
							<p:outputLabel value="#{data.ctAmendment.extendStartDate}">
								<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</p:outputLabel>
						</p:column>
						<p:column>
							<p:outputLabel value="#{data.ctAmendment.extendEndDate}">
								<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</p:outputLabel>
						</p:column>
				</p:dataTable>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
</ui:composition>
