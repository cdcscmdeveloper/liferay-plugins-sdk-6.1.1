					   onstart="blockWidget.show();" 
					   oncomplete="blockWidget.hide();"/>
				</p:selectBooleanCheckbox><!-- Enhancement 15851 - shaqimi -->
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.pbqc']}" style="text-align:left" />
			</h:panelGrid>
			<f:verbatim rendered="#{amendmentBackingBean.getAmendValue(3)}" />
			<h:panelGrid columns="3" rendered="#{amendmentBackingBean.getAmendValue(3)}">
				<p:selectBooleanCheckbox
				    id ="approverAuthorityReq"
					value="#{ctBackingBean.managedBean.contractVer.ctAmendment.approverAuthorityReq}"
					disabled="#{!amendmentBackingBean.isContractAmountAmend() or ctBackingBean.managedBean.viewSCL}" /><!-- Enhancement 15851 - shaqimi -->
				<p:spacer width="2" />
				<p:outputLabel value="#{lbl['lbl.ct.contract.approval']}" style="text-align:left" />
			</h:panelGrid>
		</h:panelGrid>
				
		<h:panelGroup id="secretryDropDownPanel" rendered="#{!ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}">
			<h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth170" rendered="#{amendmentBackingBean.getAmendValue(3) and ctBackingBean.managedBean.contractVer.ctAmendment.pbqcAuthorityReq}">
				<p:outputLabel value="#{lbl['lbl.ct.secretary.committee']}" />
				<p:selectOneMenu id="secretaryId" value="#{amendmentBackingBean.managedBean.secretaryId}" 
					label="#{lbl['lbl.ct.secretary.committee']}" style="width:300px;" disabled="#{ctBackingBean.managedBean.viewSCL}">
		           	<f:selectItems value="#{amendmentBackingBean.getSecretaryDropdownList()}" />
		       	</p:selectOneMenu>
		  	</h:panelGrid>
		</h:panelGroup>
		
		<h:panelGroup id="approvalLetterPanel">
			<h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth170" rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.valueChangeByGst}">
				<p:outputLabel value="#{lbl['lbl.ct.approval.letter']}" styleClass="required" />
				<h:panelGroup id="uploadApprovalLetter">
			 		<p:commandButton oncomplete="uploadApprovalLetterDlg.show();return false;"
						update="uploadApprovalLetter, uploadApprovalLetterDlg" icon="ui-icon-upload"
						rendered="#{ctBackingBean.managedBean.contractVer.approvalLetterAttachement.filePath == null}"
				 		disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"/>	<!-- Enhancement 15851 - shaqimi -->
		     		<h:commandLink value="#{ctBackingBean.managedBean.contractVer.approvalLetterAttachement.fileName}" 
		           		rendered="#{ctBackingBean.managedBean.contractVer.approvalLetterAttachement.filePath != null}"
		          		styleClass="blue_font" action="#{ctBackingBean.commonDownload(ctBackingBean.managedBean.contractVer.approvalLetterAttachement.filePath, ctBackingBean.managedBean.contractVer.approvalLetterAttachement.fileName)}" />					
		     		<p:spacer width="3"/>
		         	<p:commandLink onclick="deleteApprovalLetterDlg.show();" 
			           rendered="#{ctBackingBean.managedBean.contractVer.approvalLetterAttachement.filePath != null}"
			           disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"><!-- Enhancement 15851 - shaqimi -->
			   			<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			      	</p:commandLink>
			      	<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.approval.letter']}" />
				</h:panelGroup>
    		</h:panelGrid> 
  		</h:panelGroup>
   		<p:confirmDialog id="deleteApprovalLetterDlg" widgetVar="deleteApprovalLetterDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
    		severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
      		<div class="ppRightBtn">
		 		<p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		   			update=":form:uploadApprovalLetter, :form:uploadApprovalLetterDlg" 
		 			action="#{ctBackingBean.deleteAttachmentAction(ctBackingBean.managedBean.contractVer.approvalLetterAttachement)}" oncomplete="deleteApprovalLetterDlg.hide();"/>
				<p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteApprovalLetterDlg.hide();" type="button" />
			</div>
   		</p:confirmDialog>
  		<p:dialog id="uploadApprovalLetterDlg" widgetVar="uploadApprovalLetterDlg" modal="true" resizable="false"
	   		width="700px" height="350px" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}"
	   		onShow="singleUploadListener(approvalLetterUploadWV);">
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;" mode="advanced" dragDropSupport="false" id="approvalLetterId"
				fileUploadListener="#{ctBackingBean.fileUpload}"  showButtons="false"
				sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
				allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" multiple="false"
				invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}" widgetVar="approvalLetterUploadWV"
				invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}"
				update="uploadApprovalLetter" label="#{lbl['lbl.btn.choose']}" oncomplete="uploadApprovalLetterDlg.hide();" >
			</p:fileUpload>
			<f:facet name="footer">
			<div class="ppRightBtn">
		    	<p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadApprovalLetterDlg.hide();" />
   			</div>
   			</f:facet>
		</p:dialog>
	</p:panel>
</ui:composition>
