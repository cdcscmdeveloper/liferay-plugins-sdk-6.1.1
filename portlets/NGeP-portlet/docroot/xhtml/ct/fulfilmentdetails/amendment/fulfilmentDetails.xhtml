<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	 <p:panel id="fd" header="#{lbl['lbl.ct.panel.contract']}" toggleable="true" collapsed="false" toggleSpeed="500">
		<!-- <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fulfilment.dtls']}"/> -->
		<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		   <h:panelGrid columns="4" style="width:770px;" 
		         columnClasses="columnWidth150,columnWidth200,columnWidth150,columnWidth200">
		      <p:outputLabel id="cno" value="#{lbl['lbl.ct.contract.no']}" />
			  <h:panelGrid columns="3">
				  <p:inputText for="cno" value="#{amendmentBackingBean.managedBean.ctContract.contractNo}" 
				     disabled="true" style="width:170px;" />
				  <p:spacer width="1"/>
			     <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.no']}" />
			  </h:panelGrid>
			  <p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physical.no']}" />
		 	  <h:panelGrid columns="3">
		 	  	<p:inputText for="physicalNo" value="#{amendmentBackingBean.managedBean.ctContract.contractPhysicalNo}" disabled="true" style="width:170px;" />				
		      	<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.physical.contract.no']}" />
			  </h:panelGrid>
		      <p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effective.date']}" />
			  <p:inputText for="effectiveDate" style="width:170px;" disabled="true"
				value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.effDate}" >
				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</p:inputText>
			  <p:outputLabel id="edate" value="#{lbl['lbl.ct.expiry.date']}" />
			  <p:inputText for="edate" style="width:170px;" disabled="true"
				value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.expDate}" >
				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  </p:inputText>
			  <p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contract.amount']}" />
			  <p:inputText for="contractAmount" styleClass="ppRightBtn" value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				 disabled="true" style="width:170px;">
				   <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>	
			<p:outputLabel id="signBy" value="#{lbl['lbl.ct.signed.date']}" rendered="#{amendmentBackingBean.managedBean.ctContract.agreement}" />
			<h:panelGrid columns="3" rendered="#{amendmentBackingBean.managedBean.ctContract.agreement}">
				<p:inputText for="signBy"  value="#{amendmentBackingBean.managedBean.ctContract.currentAgreement.signedDate}"
			   		disabled="true" style="width:170px;" label="#{lbl['lbl.ct.delivery.period']}" >
			   		<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
			</h:panelGrid>
			<h:outputLabel id="dperiod" value="#{lbl['lbl.ct.delivery.period']}" rendered="#{!amendmentBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:panelGrid columns="3" rendered="#{!amendmentBackingBean.managedBean.ctContract.zonalPricing}">
				<p:inputText for="dperiod" styleClass="ppRightBtn" style="width:65px;"  disabled="true" 
				   value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" />
				<p:spacer width="2"/>
				<p:selectOneMenu  style="width:100px;"  disabled="true" 
				   value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.deliveryTermUom.parameterId}">
			       <f:selectItems value="#{amendmentBackingBean.getDropdownValues(ParameterTypeConst.deliveryTerm)}" />
			   </p:selectOneMenu>
			</h:panelGrid>	
			 <p:outputLabel id="astatus" value="#{lbl['lbl.ct.agreement.status']}"
			 	rendered="#{amendmentBackingBean.managedBean.ctContract.agreement and
			 				amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
							amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
			 				!amendmentBackingBean.managedBean.ctContract.zonalPricing}" />
			 <h:panelGrid columns="3"
			 	rendered="#{amendmentBackingBean.managedBean.ctContract.agreement and
			 				amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
							amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
			 				!amendmentBackingBean.managedBean.ctContract.zonalPricing}">
			 	<p:inputText for="astatus" style="width:170px;" disabled="true"			 	
			 		value="#{amendmentBackingBean.getStatusDescById(amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}" />
			 	<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.status']}" />
			 </h:panelGrid>
			 <p:outputLabel id="agreement" value="#{lbl['lbl.ct.agreement']}"
			 	rendered="#{amendmentBackingBean.managedBean.ctContract.agreement and 
							(amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			!amendmentBackingBean.managedBean.ctContract.zonalPricing}" />
			 <h:commandLink for="agreement" value="#{amendmentBackingBean.managedBean.ctContract.currentAgreement.fileName}" styleClass="blue_font" 
				rendered="#{amendmentBackingBean.managedBean.ctContract.agreement and 
							(amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			!amendmentBackingBean.managedBean.ctContract.zonalPricing}"
				action="#{amendmentBackingBean.downloadFile(amendmentBackingBean.managedBean.ctContract.currentAgreement.filePath,
							amendmentBackingBean.managedBean.ctContract.currentAgreement.fileName)}" />
			<h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="#{lbl['lbl.ct.contract.title']}" />
			</div>
			</h:panelGroup>
		    <h:panelGrid>
			<p:inputTextarea id="contractName"
				value="#{amendmentBackingBean.managedBean.ctContract.contractName}"
				required="false" rows="3" style="width:170px;margin-bottom: 5px;" disabled="true"
				autoResize="false" />	
			</h:panelGrid>	
			<p:outputLabel id="astatus1" value="#{lbl['lbl.ct.agreement.status']}"
				rendered="#{amendmentBackingBean.managedBean.ctContract.agreement and
							amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
							amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
							amendmentBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:panelGrid columns="3"
				rendered="#{amendmentBackingBean.managedBean.ctContract.agreement and
							amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
							amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
							amendmentBackingBean.managedBean.ctContract.zonalPricing}">
				<p:inputText for="astatus1" style="width:170px;" disabled="true"				
				value="#{amendmentBackingBean.getStatusDescById(amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}" />
				<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.status']}" />
			</h:panelGrid>
			<p:outputLabel id="agreement1" value="#{lbl['lbl.ct.agreement']}"
			 	rendered="#{amendmentBackingBean.managedBean.ctContract.agreement and 
							(amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			amendmentBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:commandLink for="agreement1" value="#{amendmentBackingBean.managedBean.ctContract.currentAgreement.fileName}" styleClass="blue_font" 
				rendered="#{amendmentBackingBean.managedBean.ctContract.agreement and 
							(amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			amendmentBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			amendmentBackingBean.managedBean.ctContract.zonalPricing}"
				action="#{amendmentBackingBean.downloadFile(amendmentBackingBean.managedBean.ctContract.currentAgreement.filePath,
							amendmentBackingBean.managedBean.ctContract.currentAgreement.fileName)}" />
	    </h:panelGrid>
		<h:panelGrid  style="width:260px;">
		   <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="true">
			    <p:ajax event="change" update=":form:justificationPanel,:form:exemptId" listener="#{amendmentBackingBean.chkJustificationAction}" process="@this"/> 
			 </p:selectBooleanCheckbox>
			 <p:spacer width="2" />
			 <h:panelGrid columns="2">
				 <p:outputLabel value="#{lbl['lbl.ct.concession']}" />
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.concession']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		      <h:panelGrid columns="2">
			     <p:outputLabel value="#{lbl['lbl.ct.fee.exmption']}"/>
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fee.exmption']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox 
			  value="#{amendmentBackingBean.managedBean.ctContract.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <h:panelGrid columns="2">
			     <p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement']}" />
			 </h:panelGrid>
	       </h:panelGrid>	
	       <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox value="#{amendmentBackingBean.managedBean.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <p:outputLabel value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.mto']}" />
			  </h:panelGrid>
		   </h:panelGrid>	 
		   <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox id="exemptId" value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			   disabled="true" style="text-align:top;">
			     <p:ajax event="change" update=":form:justificationPanel" listener="#{amendmentBackingBean.chkJustificationAction}" process="@this"/> 
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <p:outputLabel value="#{lbl['lbl.ct.ap201']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap201.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>	
		    <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{amendmentBackingBean.managedBean.ctContract.bondReq ? false : true}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <p:outputLabel value="#{lbl['lbl.ct.pb.exemption']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>		
	    </h:panelGrid>
	</h:panelGrid>
	<p:outputPanel id="justificationPanel">
	 <h:panelGrid columns="2" style="width:740px;"
	   rendered="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt or 
	       amendmentBackingBean.managedBean.contractVer.ctContractValue.concession}">
         <h:panelGroup>
		    <div style="height:80px; width:157px; vertical-align:top;">
		    	<h:panelGrid columns="2" style="float:right;margin-right:-11px;">
		        	<p:outputLabel value="*" styleClass="mandatory" />			   	   	
			   		<p:outputLabel for="justificationLbl" value="#{lbl['lbl.ct.justification.ap201']}" />			   	   	
			   	</h:panelGrid>
		    </div>
	     </h:panelGroup>
	  <h:panelGrid>
	    <p:inputTextarea id="justificationLbl"  rows="4" style="width:570px;"  disabled="false" autoResize="false"
	      value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.justification}" maxlength="200"/>	
	  </h:panelGrid>		
    </h:panelGrid> 
  </p:outputPanel>
 </p:panel>
</ui:composition>
