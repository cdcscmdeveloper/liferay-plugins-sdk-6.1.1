<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	 <p:panel id="fd" toggleable="true" collapsed="false" toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.contract']}"/>
	        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fulfilment.dtls']}"/>
	  	</f:facet>
	  	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br/><br/>
		<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		   <h:panelGroup style="width:750px;" >
			<table style="width: 100%">
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="cno" value="#{lbl['lbl.ct.contract.no']}" />
					</td>
					<td>
						<p:inputText for="cno"  disabled="true" maxlength="17" style="width:130px;"
							value="#{amendmentBackingBean.managedBean.ctContract.contractNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.no']}" />
					</td>
					<h:panelGroup rendered="#{amendmentBackingBean.managedBean.contractVer.ctContractAmount.agreement or 
						amendmentBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral}">
					<td class="columnWidth150">
						<p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physical.no']}" />
					</td> 
					<td>
						<p:inputText for="physicalNo" maxlength="30" style="width:130px;" disabled="true"
		 	    		value="#{amendmentBackingBean.managedBean.agreementContractVer.contractPhysicalNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.physical.contract.no']}" />
					</td>
					</h:panelGroup>
				</tr>
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effective.date']}" />
					</td>
					<td>
						<p:inputText for="effectiveDate" disabled="true" style="width:130px;"
							value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
					<td class="columnWidth150">
						<p:outputLabel id="edate" value="#{lbl['lbl.ct.expiry.date']}" />
					</td> 
					<td>
						<p:inputText for="edate" disabled="true" style="width:130px;"
							value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
				</tr>
				<tr>
					<h:panelGroup rendered="#{amendmentBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry or
					amendmentBackingBean.managedBean.contractVer.ctContractValue.followLoaAmt}">
					<td class="columnWidth150">
						<p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contract.amount']}" />
					</td>
					<td>
						<p:inputText for="contractAmount" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
			   				value="#{amendmentBackingBean.managedBean.contractVer.ctContractAmount.contractAmount}"  disabled="true">
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</td>
					</h:panelGroup>
					<h:panelGroup rendered="#{!amendmentBackingBean.managedBean.ctContract.zonalPricing}">
					<td class="columnWidth150">
	     	             	<p:outputLabel id="dperiodtxt" value="#{lbl['lbl.ct.delivery.period']}" style="width:100%"  styleClass="required"/>
					</td> 
					<td><p:inputText id="dperiod" styleClass="ppRightBtn" validator="#{webappBean.validateDPeriod}" required="true" style="width:45px;"
		              		maxlength="4" value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" disabled="true" />
                		<p:spacer width="3"/>
                		<h:outputText value="#{lbl['lbl.ct.days']}" />
                	</td>
                	</h:panelGroup>
                	<h:panelGroup rendered="#{amendmentBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral 
                		and !amendmentBackingBean.managedBean.contractVer.ctContractAmount.agreement}">
					<td class="columnWidth150">
						<p:outputLabel id="signBy1" value="#{lbl['lbl.ct.signed.date']}" />
					</td> 
					<td>
						<p:inputText for="signBy1" disabled="true" style="width:130px;"
							value="#{amendmentBackingBean.managedBean.agreementContractVer.signedDate}">
			   				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
					</td>
                	</h:panelGroup>
				</tr>
				<h:panelGroup rendered="#{amendmentBackingBean.managedBean.contractVer.ctContractAmount.agreement}">
				<tr rowspan="2">
					<h:panelGroup rendered="#{amendmentBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId != CtStatusConst.acComplete and
						amendmentBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId != CtStatusConst.saComplete}">
					<td class="columnWidth150">
						<p:outputLabel for="astatus" value="#{lbl['lbl.ct.agreement.status']}" />
					</td>
					<td>
						<p:inputTextarea id="astatus" autoResize="false" maxlength="1000" 
							disabled="true" rows="2" style="width:130px;margin-bottom:5px;"
							value="#{amendmentBackingBean.getStatusDescById(amendmentBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId)}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.status']}" />
					</td>
					</h:panelGroup>
					<h:panelGroup rendered="#{amendmentBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId eq CtStatusConst.acComplete or
						amendmentBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId eq CtStatusConst.saComplete}">
					<td styleClass="columnWidth150">
						<p:outputLabel id="agreement" value="#{lbl['lbl.ct.agreement']}" />
					</td>
					<td>
						<h:commandLink for="agreement" styleClass="blue_font"
							value="#{amendmentBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.fileName}"
							action="#{amendmentBackingBean.downloadFile(amendmentBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.filePath,
							amendmentBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.fileName)}" />
					</td>
					</h:panelGroup>
					<td class="columnWidth150">
						<p:outputLabel id="signBy" value="#{lbl['lbl.ct.signed.date']}" />
					</td> 
					<td>
						<p:inputText for="signBy" disabled="true" style="width:130px;"
							value="#{amendmentBackingBean.managedBean.agreementContractVer.signedDate}">
			   				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
					</td>
				</tr>
				</h:panelGroup>
				<tr rowspan="4">
					<td class="columnWidth150">
						<p:outputLabel for="contractName" value="#{lbl['lbl.ct.contract.title']}" />
					</td>
					<td colspan="3">
						<p:inputTextarea id="contractName" autoResize="false" maxlength="1000"
							disabled="true" rows="4" style="width:465px; margin-bottom:5px;" 
							value="#{amendmentBackingBean.managedBean.ctContract.contractName}" />
					</td>					
				</tr>
			</table>
		</h:panelGroup>
		<h:panelGrid style="width:280px; margin-left:5px">
		   <h:panelGrid columns="3" rendered="#{amendmentBackingBeanmanagedBean.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase
		   		and amendmentBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
			 <p:selectBooleanCheckbox value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="true">
			 </p:selectBooleanCheckbox>
			 <p:spacer width="2" />
			 <h:panelGrid columns="2">
				 <h:outputText value="#{lbl['lbl.ct.concession']}" />
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.concession']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		      <h:panelGrid columns="2">
			     <h:outputText value="#{lbl['lbl.ct.fee.exmption']}"/>
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fee.exmption']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox 
			  value="#{amendmentBackingBean.managedBean.contractVer.ctContractAmount.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <h:panelGrid columns="2">
			     <h:outputText value="#{lbl['lbl.ct.agreement']}" />
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement']}" />
			 </h:panelGrid>
	       </h:panelGrid>	       
	       <h:panelGrid columns="3" 
	          	rendered="#{false and amendmentBackingBean.managedBean.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase
	          	and amendmentBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
			  <p:selectBooleanCheckbox value="#{amendmentBackingBean.managedBean.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.mto']}" />
			  </h:panelGrid>
		   </h:panelGrid>	 
		   <h:panelGrid columns="3" rendered="#{amendmentBackingBean.managedBean.ctContract.procurementMode.parameterCode eq ParameterConst.contractTypeCentral}">  
			   <p:selectBooleanCheckbox 
			      value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.followLoaAmt}"  disabled="true"/>
		       <p:spacer width="2" />
		       <h:panelGrid columns="2">
		       		<h:outputText value="#{lbl['lbl.ct.follow.ctvalue']}" />
		       		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fctvalue']}" />
			   </h:panelGrid>
		     </h:panelGrid> 
		   <h:panelGrid columns="3"
		       rendered="#{amendmentBackingBean.managedBean.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase}">
			  <p:selectBooleanCheckbox id="exemptId" value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			   	disabled="true" style="text-align:top;">
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.ap201']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap201.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3" 
		     rendered="#{amendmentBackingBean.managedBean.ctContract.loa.loaAmt > amendmentBackingBean.managedBean.performanceBondRuleAmt
		     	and amendmentBackingBean.managedBean.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase
		     	and amendmentBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
			 <p:selectBooleanCheckbox value="#{amendmentBackingBean.managedBean.ctContract.bondReq ? false : true}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.pb.exemption']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>	
	    </h:panelGrid>
	</h:panelGrid>
	<p:outputPanel id="justificationPanel" rendered="#{amendmentBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
	 <h:panelGrid columns="2" style="width:740px;" 
		rendered="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt or 
	 	amendmentBackingBean.managedBean.contractVer.ctContractValue.concession}">
		<p:outputLabel for="justificationLbl" value="#{lbl['lbl.ct.justification.ap201']}" style="width:120px;" />
		<p:inputTextarea id="justificationLbl" value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.justification}"
  			rows="3" style="width:465px;" maxlength="200" autoResize="false" disabled="true" />			
    </h:panelGrid> 
  </p:outputPanel>
 </p:panel>
</ui:composition>
