<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	
	<ui:define name="contentSection">
		<style>
		.column-align-center {text-align: center !important;}
		.top-aligned-columns td{ vertical-align: top;}
         #dlgDel .ui-dialog .ui-dialog-titlebar {display:none !important;}
		.column-align-right {
			text-align: right !important;
		}
		</style>
         <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
		<p:panel>
			<f:event listener="#{amendmentBackingBean.preRenderView}" type="preRenderView" />
			<table style="width: 100%;">
				<tr>
					<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();"/></td>
					<td class="ppRightBtn">
						<ui:repeat var="outcome" value="#{amendmentBackingBean.managedBean.action}">
							<p:commandButton value="#{outcome}" process="@form" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(outcome)}"
								action="#{amendmentBackingBean.saveContractAmendment(outcome)}" rendered="#{amendmentBackingBean.managedBean.memberSignOff}" />
						</ui:repeat>
					</td>
				</tr>
			</table>
			<table style="width: 99%; margin-left: 25px;" class="header-info">
				<tr style="margin-button: 10px;">
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
					</td>
					<td>
							<p:inputText size="20" disabled="true"
								value="#{amendmentBackingBean.managedBean.ctContract.contractNo}"  />
					</td>
					<td>
							<p:outputLabel value="Request No." />
					</td>
					<td>
							<p:inputText size="25" disabled="true"
								value="#{amendmentBackingBean.managedBean.ctContract.contractNo == null ? '-- System Generated --':amendmentBackingBean.managedBean.ctContract.contractNo}" />
					</td>
					 <td>
		    			   <p:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
					</td>
					<td>
						   <p:inputText size="30" disabled="true" value="#{contractDetailsBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}"/>	
					</td>											
					<td>
		  				   <p:outputLabel value="Status" />
					</td>
					<td>
						<p:inputText size="20" disabled="true"
								value="#{amendmentBackingBean.getStatusDescById(amendmentBackingBean.managedBean.contractVer.status.statusId)}" />
					</td>
				</tr>
			</table>	 
	</p:panel>
	<p:tabView id="tabview" value="Termination" dynamic="true" orientation="left" >
	   <p:tab title="#{lbl['lbl.ct.menu.fd']}" >
	     <ui:include src="fulfilmentDetails.xhtml"/>
	     <ui:include src="quotationTender.xhtml"/>
	     <ui:include src="supplierDetails.xhtml"/>
	     <ui:include src="performanceBond.xhtml"/>
      </p:tab>
       <p:tab title="Amendment Details">
          <ui:include src="amendmentDetails.xhtml"/>
          <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
       </p:tab>
       <p:tab id="tabZone" title="#{lbl['lbl.ct.menu.zone']}"
			    rendered="#{amendmentBackingBean.managedBean.ctContract.zonalPricing}">
				 <ui:include src="zone.xhtml" />
			</p:tab>
	   <p:tab title="#{lbl['lbl.ct.menu.item']}">
	      <ui:include src="item.xhtml" />
       </p:tab>
       
        <p:tab title="Meeting Details"  rendered="#{amendmentBackingBean.managedBean.pbConfirmMeeting}">
	      <ui:include src="pbqcc/meeting.xhtml"/>
       </p:tab>
       
        <p:tab title="Decision"  rendered="#{amendmentBackingBean.managedBean.signOffDecision}">
	      <ui:include src="pbqcc/signOffMember.xhtml"/>
       </p:tab>
       
       <p:tab title="Decision"  rendered="#{amendmentBackingBean.managedBean.signUpdateDecision}">
	      <ui:include src="pbqcc/signOffpbqcc.xhtml"/>
       </p:tab>
       
       <p:tab title="Loa Details" rendered="#{amendmentBackingBean.managedBean.prepareLOA}">
	      <ui:include src=" loaDetails.xhtml " />
       </p:tab>
       <p:tab title="Performance Bond" rendered="#{amendmentBackingBean.managedBean.prepareLOA}">
	      <ui:include src="loaBondDetails.xhtml" />
       </p:tab>
     
       <p:tab title="Special Approval of AP201" rendered="#{amendmentBackingBean.managedBean.bpkSaSkApprover}">
         <ui:include src="bpk/approvalOfAP201.xhtml"/>
       </p:tab>  
       
        <p:tab title="Letter Of Acceptance">
         <ui:include src="letterOfAcceptance.xhtml"/>
       </p:tab>  
	</p:tabView>
   </ui:define>  
</ui:composition>
