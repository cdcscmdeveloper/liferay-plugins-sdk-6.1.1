<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	  <style>
		.column-align-center {
			text-align: center !important;
		}
		.top-aligned-columns td {
			vertical-align: top;
		}
		#dlgDel .ui-dialog .ui-dialog-titlebar {
			display: none !important;
		}
		.column-align-right {
			text-align: right !important;
		}
		</style>
		
		<p:panel>
		    <f:event listener="#{amendmentBackingBean.preRenderView}" type="preRenderView" />
		    <h:panelGroup >
			    <div align="left" class="screen-title" style="border-bottom: 0px"> Contract Amendment </div>
			 </h:panelGroup>
			 <p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
			 <ui:include src="amendmentButtons.xhtml" />
		     <ui:include src="amendmentHeader.xhtml" />
		</p:panel>
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		  <tr>
			<td width="20%" valign="top">
				<p:tabMenu  styleClass="sidemenu"
					activeIndex="#{amendmentBackingBean.managedBean.selectedTabIndex}"
					style="display : table-caption;">
					<c:choose>
					
					 <c:when test="#{amendmentBackingBean.managedBean.ackFA == null and !amendmentBackingBean.managedBean.prepareLOA}">
					    <p:menuitem value="#{lbl['lbl.ct.menu.fd']}" update=":form" action="#{amendmentBackingBean.setSelectedTabValue(0)}"/>
					    <p:menuitem value="#{lbl['lbl.ct.amend.panel.header']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(1)}"/>
					    <c:choose>
					       <c:when test="#{amendmentBackingBean.managedBean.ctContract.zonalPricing and (amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or 
			                  amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange)}">
			                 <p:menuitem value="#{lbl['lbl.ct.menu.zone']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(2)}"/>
					          <p:menuitem value="#{lbl['lbl.ct.menu.item']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(3)}"/>
					           <p:menuitem value="#{lbl['lbl.ct.amend.spAprlAP201']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(4)}" 
					             rendered="#{amendmentBackingBean.managedBean.bpkSaSkApprover}"/>
					      </c:when>
					      <c:when test="#{!amendmentBackingBean.managedBean.ctContract.zonalPricing and (andamendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or 
			                  amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange)}">
					           <p:menuitem value="#{lbl['lbl.ct.menu.item']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(2)}"/>
					            <p:menuitem value="#{lbl['lbl.ct.amend.spAprlAP201']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(3)}" 
					             rendered="#{amendmentBackingBean.managedBean.bpkSaSkApprover}"/>
					      </c:when>
					      <c:when test="#{amendmentBackingBean.managedBean.bpkSaSkApprover and !amendmentBackingBean.managedBean.ctContract.zonalPricing and (!andamendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or 
			                  !amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange)}">
			                  <p:menuitem value="#{lbl['lbl.ct.amend.spAprlAP201']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(2)}"/>
			              </c:when>
					   </c:choose>
			         </c:when>
			         <c:otherwise>
			           <c:choose>
			            
			            <c:when test="#{amendmentBackingBean.managedBean.ackFA == null and amendmentBackingBean.managedBean.prepareLOA}">
					    <p:menuitem value="#{lbl['lbl.ct.menu.fd']}" update=":form" action="#{amendmentBackingBean.setSelectedTabValue(0)}"/>
					    <p:menuitem value="#{lbl['lbl.ct.amend.panel.header']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(1)}"/>
					    <c:choose>
					       <c:when test="#{amendmentBackingBean.managedBean.ctContract.zonalPricing and (amendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or 
			                  amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange)}">
			                 <p:menuitem value="#{lbl['lbl.ct.menu.zone']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(2)}"/>
					         <p:menuitem value="#{lbl['lbl.ct.menu.item']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(3)}"/>
					         <p:menuitem value="#{lbl['lbl.ct.amend.loaDtl']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(4)}"/>
					          <p:menuitem value="#{lbl['lbl.ct.amend.perfBond']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(5)}"/>
					         <p:menuitem value="#{lbl['lbl.ct.amend.letterOfAcc']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(6)}"/>
					      </c:when>
					      <c:when test="#{!amendmentBackingBean.managedBean.ctContract.zonalPricing and (andamendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or 
			                  amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange)}">
					           <p:menuitem value="#{lbl['lbl.ct.menu.item']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(2)}"/>
					           <p:menuitem value="#{lbl['lbl.ct.amend.loaDtl']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(3)}" />
					           <p:menuitem value="#{lbl['lbl.ct.amend.perfBond']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(4)}"/>
					           <p:menuitem value="#{lbl['lbl.ct.amend.letterOfAcc']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(5)}"/> 
					      </c:when>
					      <c:when test="#{!amendmentBackingBean.managedBean.ctContract.zonalPricing and
					         (!andamendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or !amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange)}">
			                  <p:menuitem value="#{lbl['lbl.ct.amend.loaDtl']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(2)}"/>
			                  <p:menuitem value="#{lbl['lbl.ct.amend.perfBond']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(3)}"/>
					          <p:menuitem value="#{lbl['lbl.ct.amend.letterOfAcc']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(4)}"/> 
			              </c:when>
		               </c:choose>
			         </c:when>
			         
			          <c:when test="#{amendmentBackingBean.managedBean.ackFA == 'Ack'}">
					    <p:menuitem value="#{lbl['lbl.ct.amend.loaDtl']}" update=":form" action="#{amendmentBackingBean.setSelectedTabValue(0)}"/>
					    <p:menuitem value="#{lbl['lbl.ct.amend.letterOfAcc']}" update=":form"  action="#{amendmentBackingBean.setSelectedTabValue(1)}"/>
					    <p:menuitem value="#{lbl['lbl.ct.amend.declaration']}" update=":form" action="#{amendmentBackingBean.setSelectedTabValue(2)}"/>
			         </c:when>
			         
			         
			         </c:choose>
			       </c:otherwise>
				</c:choose>
			</p:tabMenu>
			</td>
			<td width="80%">
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.selectedTabIndex == 0 and
				   amendmentBackingBean.managedBean.ackFA == null}">
					<ui:include src="fulfilmentDetails.xhtml" />
				    <ui:include src="quotationTender.xhtml" />
				    <ui:include src="supplierDetails.xhtml" />
				    <ui:include src="performanceBond.xhtml" />
				</p:outputPanel>
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.selectedTabIndex == 1 
				    and amendmentBackingBean.managedBean.ackFA == null}">
					<ui:include src="amendmentDetails.xhtml" />
				</p:outputPanel>
	
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.selectedTabIndex == 2 and amendmentBackingBean.managedBean.ctContract.zonalPricing 
				        and amendmentBackingBean.managedBean.ackFA == null}">
					<ui:include src="zone.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel rendered="#{(amendmentBackingBean.managedBean.selectedTabIndex ==  2 and !amendmentBackingBean.managedBean.ctContract.zonalPricing) 
				or (amendmentBackingBean.managedBean.selectedTabIndex ==  3 and  amendmentBackingBean.managedBean.ctContract.zonalPricing)}">
					<ui:include src="item.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel rendered="#{((amendmentBackingBean.managedBean.selectedTabIndex == 4 and amendmentBackingBean.managedBean.ctContract.zonalPricing) or 
				 (amendmentBackingBean.managedBean.selectedTabIndex ==3 and !amendmentBackingBean.managedBean.ctContract.zonalPricing)
				  or (amendmentBackingBean.managedBean.selectedTabIndex ==2 and !amendmentBackingBean.managedBean.ctContract.zonalPricing and
				   (!andamendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or !amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange))) and 
				   (amendmentBackingBean.managedBean.bpkSaSkApprover)}">
					<ui:include src="bpk/approvalOfAP201.xhtml"/>
				</p:outputPanel>
				
				<p:outputPanel rendered="#{(((amendmentBackingBean.managedBean.selectedTabIndex == 4 and amendmentBackingBean.managedBean.ctContract.zonalPricing) or 
				 (amendmentBackingBean.managedBean.selectedTabIndex ==3 and !amendmentBackingBean.managedBean.ctContract.zonalPricing)
				  or (amendmentBackingBean.managedBean.selectedTabIndex ==2 and !amendmentBackingBean.managedBean.ctContract.zonalPricing and
				   (!andamendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or !amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange))) and 
				   (amendmentBackingBean.managedBean.prepareLOA)) or 
				   (amendmentBackingBean.managedBean.selectedTabIndex == 0 and amendmentBackingBean.managedBean.ackFA == 'Ack')}">
					<ui:include src="supplier/supplierforloa.xhtml" />
				    <ui:include src="supplier/paymentdetails.xhtml" />
				    <p:outputPanel rendered="#{amendmentBackingBean.managedBean.prepareLOA}">
					    <ui:include src="loaDetails.xhtml" />
				    </p:outputPanel>
				    <ui:include src="witnessDetails.xhtml" />
			    </p:outputPanel>
			    
			    <p:outputPanel rendered="#{((amendmentBackingBean.managedBean.selectedTabIndex == 5 and amendmentBackingBean.managedBean.ctContract.zonalPricing) or 
				 (amendmentBackingBean.managedBean.selectedTabIndex ==4 and !amendmentBackingBean.managedBean.ctContract.zonalPricing)
				  or (amendmentBackingBean.managedBean.selectedTabIndex ==3 and !amendmentBackingBean.managedBean.ctContract.zonalPricing and
				   (!andamendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or !amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange))) and 
				   (amendmentBackingBean.managedBean.prepareLOA)}">
					<ui:include src="loaBondDetails.xhtml" />
			    </p:outputPanel>
			    
			    <p:outputPanel rendered="#{((amendmentBackingBean.managedBean.selectedTabIndex == 6 and amendmentBackingBean.managedBean.ctContract.zonalPricing) or 
				 (amendmentBackingBean.managedBean.selectedTabIndex ==5 and !amendmentBackingBean.managedBean.ctContract.zonalPricing)
				  or (amendmentBackingBean.managedBean.selectedTabIndex ==4 and !amendmentBackingBean.managedBean.ctContract.zonalPricing and
				   (!andamendmentBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange or !amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange))) and 
				   (amendmentBackingBean.managedBean.prepareLOA and amendmentBackingBean.managedBean.letterOfAcceptance)}">
					<ui:include src="letterOfAcceptance.xhtml" />
			    </p:outputPanel>
			    
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.selectedTabIndex == 1 
				    and amendmentBackingBean.managedBean.ackFA == 'Ack'}">
					<ui:include src="supplier/supplierLoa.xhtml" />
				</p:outputPanel>
	
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.selectedTabIndex == 2 and amendmentBackingBean.managedBean.ackFA == 'Ack'}">
					<ui:include src="supplier/supplierDeclaration.xhtml" />
				</p:outputPanel>
				
			</td>
		</tr>
		</table>
	</ui:define>  
</ui:composition>
