<ui:composition

	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	  <script> $('#portlet_ctContractMaintenance_WAR_NGePportlet').find('.portlet-title-text').html('#{amendmentBackingBean.getPortletTitle()}'); </script>
	  <style>
		.column-align-center {
			text-align: center !important;
		}
			 .calanderWidth input {
	       width:75px;margin-bottom: 5px;
	   }
		.top-aligned-columns td {
			vertical-align: top;
		}
		.column-align-right {
			text-align: right !important;
		}
		 .columnWidth150 {
	        width: 150px;
	        vertical-align: top;
	        text-align: right;
         }
          .columnWidth170 {
	        width: 170px;
	         vertical-align: top;
	        text-align: right;
         }         
         .columnWidth225 {
	        width: 225px;
	        vertical-align: top;
	        text-align: right;
         }
         .columnWidth300 {
	        width: 300px;
	        vertical-align: top;
	        text-align: right;
         }

         	border: 1px solid #cecece;

         }

			border: none;

		}

		<script type="text/javascript">  
	    $(document).on("keypress", 'form', function (e) {
    	    var code = e.keyCode || e.which;
    	    if (code == 13) {
    	        e.preventDefault();
    	        return false;
    	    }
    	});
	</script> 
	  <ui:param name="isPrepareLoa" value="#{ctBackingBean.managedBean.contractVer.status.statusId == CtStatusConst.faPendingLoaSubmission or
	  ctBackingBean.managedBean.contractVer.status.statusId == CtStatusConst.faPendingLoaApproval or
	  ctBackingBean.managedBean.contractVer.status.statusId == CtStatusConst.faPendingLoaRevision or
	  ctBackingBean.managedBean.contractVer.status.statusId == CtStatusConst.faPendingLoaRevisionApproval}" />
	  <p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>			
		  <f:event listener="#{amendmentBackingBean.preRenderView}" type="preRenderView" />
		<h:panelGroup id="panelHeaderException">
		  	 <p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="#{amendmentBackingBean.managedBean.autoUpdate}" closable="true" severity="error, info, warn" />
			 <ui:include src="amendmentButtons.xhtml" />
		     <ui:include src="amendmentHeader.xhtml" />
		  </h:panelGroup>
		
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		   <tr>
			<td width="20%;" style="vertical-align: baseline;" class="sidemenutd">
		  
		      <p:tabMenu id="sidemenuId" styleClass="sidemenu" 
						activeIndex="#{amendmentBackingBean.managedBean.selectedTabIndex}" >
		<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.fd']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{amendmentBackingBean.managedBean.ackFA eq null}"
			actionListener="#{amendmentBackingBean.setTabValue('FD')}" update=":form" />
	
		<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.amendment']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{amendmentBackingBean.managedBean.ackFA eq null}"
			actionListener="#{amendmentBackingBean.setTabValue('AD')}" update=":form" />
	
	 <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.zone']}"  onstart="blockWidget.show()"  oncomplete="blockWidget.hide()" 
		    rendered="#{(amendmentBackingBean.managedBean.ackFA eq null and ctBackingBean.managedBean.contractVer.ctContract.zonalPricing and (ctBackingBean.managedBean.contractVer.ctAmendment.quantityChange or 
		   ctBackingBean.managedBean.contractVer.ctAmendment. itemPriceChange)) or (amendmentBackingBean.managedBean.ackFA eq null and ctBackingBean.managedBean.contractVer.ctAmendment.otherChange and ctBackingBean.managedBean.contractVer.ctContract.zonalPricing)}"
			actionListener="#{amendmentBackingBean.setTabValue('ZO')}" update=":form" />
		
	 
	    <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.agency']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.otherChange
			and ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode != ParameterConst.contractTypeCentral
			 and amendmentBackingBean.managedBean.ackFA eq null}"
			actionListener="#{amendmentBackingBean.setTabValue('AG')}" update=":form" />
	      
			 
		<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.item']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			 rendered="#{amendmentBackingBean.managedBean.ackFA eq null and 
			((ctBackingBean.managedBean.contractVer.ctAmendment.quantityChange or  ctBackingBean.managedBean.contractVer.ctAmendment.itemPriceChange) 
			or ctBackingBean.managedBean.contractVer.ctAmendment.otherChange)}"
			 actionListener="#{amendmentBackingBean.setTabValue('IT')}" update=":form" />
				
		<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.deduction']}" 
		     onstart="blockWidget.show()"   oncomplete="blockWidget.hide()"
		    rendered="#{ctBackingBean.managedBean.contractVer.ctAmendment.otherChange 
		    and amendmentBackingBean.managedBean.ackFA eq null}"
			 actionListener="#{amendmentBackingBean.setTabValue('DE')}" update=":form" />
			
			<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.schedule']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{ctBackingBean.managedBean.contractVer.ctContract.fulfillmentType.parameterCode eq ParameterConst.fulfilmentTypeScheduled 
			and ctBackingBean.managedBean.contractVer.ctAmendment.otherChange
			and ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode != ParameterConst.contractTypeCentral
		    and amendmentBackingBean.managedBean.ackFA eq null}"
			actionListener="#{amendmentBackingBean.setTabValue('SC')}" update=":form" />
		
		<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.loa.details']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{amendmentBackingBean.managedBean.prepareLOA or amendmentBackingBean.managedBean.ackFA eq CtConst.supplierAckLoa}"
			actionListener="#{amendmentBackingBean.setTabValue('LOD')}" update=":form" />
	 
		  <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.loa.content']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{amendmentBackingBean.managedBean.prepareLOA or amendmentBackingBean.managedBean.ackFA eq CtConst.supplierAckLoa}"
			actionListener="#{amendmentBackingBean.setTabValue('CNT')}" update=":form" />
			
			<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.view.loa']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{amendmentBackingBean.managedBean.ackFA eq CtConst.supplierAckLoa}"
			actionListener="#{amendmentBackingBean.setTabValue('SLOA')}" update=":form" />
			
			<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.meeting']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{amendmentBackingBean.managedBean.pbConfirmMeeting}"
			actionListener="#{amendmentBackingBean.setTabValue('MET')}" update=":form" />
	
			<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.performance.bond']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{(amendmentBackingBean.managedBean.prepareLOA or amendmentBackingBean.managedBean.ackFA eq CtConst.supplierAckLoa)
			 and ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa != null
			 and !ctBackingBean.managedBean.contractVer.ctContractAmount.bondExempted
			 and ctBackingBean.managedBean.contractVer.ctAmendment.amendmentLoa.bondReq
			 and ctBackingBean.managedBean.contractVer.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase}"
			actionListener="#{amendmentBackingBean.setTabValue('PB')}" update=":form" />
			
	       <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.declaration']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{amendmentBackingBean.managedBean.ackFA eq CtConst.supplierAckLoa}"
			actionListener="#{amendmentBackingBean.setTabValue('SDEC')}" update=":form" />
				
		 <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.decision']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{amendmentBackingBean.managedBean.signUpdateDecision or amendmentBackingBean.managedBean.signOffDecision
			or amendmentBackingBean.managedBean.decisionPbQcLOA}"
			actionListener="#{amendmentBackingBean.setTabValue('DCN')}" update=":form" />
	
	        <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.approver.setting']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{amendmentBackingBean.isApproverSetting() and !amendmentBackingBean.managedBean.prepareLOA}"
			actionListener="#{amendmentBackingBean.setTabValue('SE')}" update=":form" />
	
		</p:tabMenu>
		 </td>
		 <td width="80%">
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.fd'] }">
					
					<p:outputPanel id="ctMenuId2" rendered="#{ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
		 	               <ui:include src="/xhtml/ct/common/fulfilmentDetails.xhtml"/>
		 	        </p:outputPanel>
		 	        <p:outputPanel id="ctMenuId3" rendered="#{ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
		 	             <ui:include src="/xhtml/ct/common/centralDetails.xhtml"/>
		 	        </p:outputPanel>
		 	        <ui:include id="ctMenuId3a" src="/xhtml/ct/common/contractAgreementDetails.xhtml" />
				    <ui:include src="/xhtml/ct/common/quotationTender.xhtml" />
				    <ui:include src="/xhtml/ct/common/supplier.xhtml" />
				   <p:outputPanel id="ctMenuIdPidId" rendered="#{ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
		 	                <ui:include src="/xhtml/ct/common/purchaseInDefault.xhtml" />
		 	        </p:outputPanel>
				    <ui:include src="performanceBond.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.amendment'] }">
					<ui:include src="amendmentDetails.xhtml" />
					<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.zone'] }">
					<ui:include src="/xhtml/ct/common/zone.xhtml" />
				</p:outputPanel>
				
				
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.agency'] }">
					<ui:include src="/xhtml/ct/common/agency.xhtml" />
				</p:outputPanel>
	
				
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.item'] }">
					<ui:include src="item.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.deduction'] }">
					<ui:include src="/xhtml/ct/common/deduction.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.schedule'] }">
					<ui:include src="/xhtml/ct/common/schedule.xhtml" />
				</p:outputPanel>
				
				 <p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.performance.bond'] }">
					<ui:include src="loaBondDetails.xhtml" />
			    </p:outputPanel>
				
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.loa.details'] }">
					<ui:include src="supplier/instructionHeader.xhtml" />
					<ui:include src="supplier/supplierforloa.xhtml" />
				    <ui:include src="supplier/paymentdetails.xhtml" />
				    <ui:include src="loaDetails.xhtml" />
				    <p:outputPanel rendered="#{amendmentBackingBean.managedBean.ackFA eq CtConst.supplierAckLoa}">
				    	<ui:include src="supplier/supplierSignerDetails.xhtml" />
				    </p:outputPanel>
				    <ui:include src="supplier/remark.xhtml" />
			    </p:outputPanel>
			    
			    <p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.loa.content']}">
					<ui:include src="supplier/instructionHeader.xhtml" />
					<ui:include src="letterOfAcceptance.xhtml" />
			    </p:outputPanel>
			    
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.view.loa']
				        and amendmentBackingBean.managedBean.ackFA == CtConst.supplierAckLoa}">
					<ui:include src="supplier/instructionHeader.xhtml" />
					<ui:include src="supplier/supplierLoa.xhtml"  />
				</p:outputPanel>
	
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.declaration'] }">
					<ui:include src="supplier/instructionHeader.xhtml" />
					<ui:include src="supplier/supplierDeclaration.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.meeting'] }">
					<ui:include src="pbqcc/meeting.xhtml"/>
					<ui:include src="pbqcc/committe.xhtml"/>
				</p:outputPanel>
				
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.decision'] 
					and !amendmentBackingBean.managedBean.signOffDecision}">
					<ui:include src="pbqcc/signOffpbqcc.xhtml"/>
					<ui:include src="pbqcc/attachment.xhtml"/>
				</p:outputPanel>
				
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.decision']
				     and amendmentBackingBean.managedBean.signOffDecision}">
					<ui:include src="pbqcc/signOffMember.xhtml"/>
				</p:outputPanel>
				
				<p:outputPanel rendered="#{amendmentBackingBean.managedBean.finalListOfSideMenu.get(amendmentBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.setting'] }">
					<ui:include	src="approverSetting.xhtml" />
					<ui:include src="/xhtml/ct/shared/remarkAppSetting.xhtml" />
					<!-- <ui:include	src="/xhtml/ct/common/fulfilmentSetting.xhtml" /> -->
				</p:outputPanel>				
			</td>
		</tr>
		</table>
		
		<p:confirmDialog message="#{lbl['lbl.msg.confirm.revise.amendment']}"
			severity="alert" widgetVar="reviseConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					partialSubmit="true" process="@this"
					action="#{amendmentBackingBean.saveContractAmendment('REVISE')}"
					onstart="reviseConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" partialSubmit="true"
				process="@this" update="@form"
				onclick="reviseConfirmDlg.hide()">
				<f:setPropertyActionListener
					target="#{amendmentBackingBean.managedBean.remarkList[0].remark}" value="#{null}" />
				</p:commandButton>
			</div>
		</p:confirmDialog>
		
		<p:confirmDialog message="#{lbl['lbl.msg.confirm.cancel.amendment']}"
			severity="alert" widgetVar="cancelConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					partialSubmit="true" process="@this"
					action="#{amendmentBackingBean.saveContractAmendment('CANCEL')}"
					onstart="cancelConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" partialSubmit="true"
				process="@this" update="@form"
				onclick="cancelConfirmDlg.hide()">
				<f:setPropertyActionListener
					target="#{amendmentBackingBean.managedBean.remarkList[0].remark}" value="#{null}" />
				</p:commandButton>
			</div>
		</p:confirmDialog>
		
		<p:confirmDialog message="#{lbl['lbl.msg.confirm.cancel.officer.amendment']}"
			severity="alert" widgetVar="cancelofficerConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					partialSubmit="true" process="@this"
					action="#{amendmentBackingBean.saveContractAmendment('CANCEL')}"
					onstart="cancelofficerConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" partialSubmit="true"
				process="@this" update="@form"
				onclick="cancelofficerConfirmDlg.hide()">
				<f:setPropertyActionListener
					target="#{amendmentBackingBean.managedBean.remarkList[0].remark}" value="#{null}" />
				</p:commandButton>
			</div>
		</p:confirmDialog>
		
			<p:confirmDialog message="#{lbl['lbl.msg.confirm.reject.amendment']}"
			severity="alert" widgetVar="rejectConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					partialSubmit="true" process="@this"
					action="#{amendmentBackingBean.preRejectContractAmendment('REJECT')}"
					onstart="rejectConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" partialSubmit="true"
				process="@this" update="@form"
				onclick="rejectConfirmDlg.hide()">
				<f:setPropertyActionListener
					target="#{amendmentBackingBean.managedBean.remarkList[0].remark}" value="#{null}" />
				</p:commandButton>
			</div>
		</p:confirmDialog>
		
		<p:confirmDialog message="#{lbl['lbl.msg.confirm.supplier.reject.amendment']}"
			severity="alert" widgetVar="supplierrejectConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					partialSubmit="true" process="@this"
					action="#{amendmentBackingBean.preRejectContractAmendment('REJECT')}"
					onstart="supplierrejectConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" partialSubmit="true"
				process="@this" update="@form"
				onclick="supplierrejectConfirmDlg.hide()">
				<f:setPropertyActionListener
					target="#{amendmentBackingBean.managedBean.remarkList[0].remark}" value="#{null}" />
				</p:commandButton>
			</div>
		</p:confirmDialog>
	</ui:define>  
</ui:composition>
