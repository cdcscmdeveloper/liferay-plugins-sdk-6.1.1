<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <ui:define name="contentSection">
    <style>
      .column-align-center { text-align: center !important;}
    </style> 
    	<p:panel>
    	 	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
			<div class="ppRightBtn">
				<p:commandButton value="Save" icon="ui-icon-save"  action="#{associationBackingBean.createAssociation}"/>
                <p:commandButton value="Back" icon="ui-icon-back"  action="#{associationBackingBean.gotoCancelPage}"/>
			</div>
		</p:panel>
     <p:panel id="projectId" header="Project Associate Creation"   toggleable="true"  toggleSpeed="500">
       <h:panelGrid columns="2">
	     <h:outputLabel value="#{lbl['lbl.ct.asearch.model.pname']}" />
         <p:inputText  value="#{associationBackingBean.managedBean.ctAssociation.projectName}" style="width:200px;"></p:inputText>
		 <h:outputLabel  value="#{lbl['lbl.ct.asearch.model.pdes']}" />
         <p:inputText  value="#{associationBackingBean.managedBean.ctAssociation.description}"  style="width:400px;"></p:inputText>
	  </h:panelGrid>
	  <p:spacer height="10"/>
          <p:dataTable id="associateCreation" var="data" value="#{associationBackingBean.managedBean.associateSearchList}" 
            selection="#{associationBackingBean.deleteSelectedContractList}" rowKey="#{data}" paginator="true" 
            paginatorPosition="bottom" paginatorAlwaysVisible="false" emptyMessage="No Records!">
             <ac:paginator for="associateCreation"/>
             <p:column selectionMode="multiple" style="width:18px" />
             <p:column headerText="#{lbl['lbl.ct.asearch.model.table1.cno']}">
				<h:outputText  value="#{data.latestContractVer.docNo}"/>
			 </p:column>
			  <p:column headerText="#{lbl['lbl.ct.asearch.model.table1.sname']}">
				<h:outputText  value="#{data.smSupplier.companyName}"/>
			 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.asearch.model.table1.cstart']}">
				<h:outputText value="#{data.latestContractVer.ctContractValue.effDate}">
				   <f:convertDateTime pattern="MM/dd/yyyy" /></h:outputText>
		   	 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.asearch.model.table1.cend']}">
				<h:outputText value="#{data.latestContractVer.ctContractValue.expDate}">
                    <f:convertDateTime pattern="MM/dd/yyyy" /></h:outputText>
			 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.asearch.model.table1.pcode']}">
				<h:outputText  value="03"/>
			 </p:column>
			  <p:column headerText="#{lbl['lbl.ct.asearch.model.table1.pname']}">
				<h:outputText  value="Pejabat OIC"/>
			 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.asearch.model.table1.status']}">
				<h:outputText />
			 </p:column>
			</p:dataTable> 
			  <p:confirmDialog message="#{lbl['lbl.ct.dialong.cofirm.message']}" closable="true" appendToBody="true"
		    header="#{lbl['lbl.ct.dialong.cofirm.header']}" severity="alert" widgetVar="confirmation">
            <h:panelGrid columns="2">
		      <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" update="associateCreation"
		         process="@form" onclick="confirmation.hide();" actionListener="#{associationBackingBean.deleteAdvanceContract()}"/>
			  <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" onclick="confirmation.hide()" type="button" />
			</h:panelGrid>
		 </p:confirmDialog>
          	<p:spacer height="5"/>
			 <div class="ppRightBtn">
			   <p:commandButton value="Delete" process="@form" onsuccess="confirmation.show()" icon="ui-icon-delete" />  
			   <p:commandButton value="Add" process="@this" icon="ui-icon-add" onclick="dlg2.show();">
			      <p:ajax event="change" update="associateCreation" process="@this" />
			   </p:commandButton>
			</div>
          </p:panel>
		<p:dialog id="modelDialog" header="#{lbl['lbl.ct.asearch.model1.header']}" widgetVar="dlg2" modal="true" width="750" height="450">
		   <p:panel id="advancePanel">
               <h:panelGrid columns="3">
                  <h:outputLabel value="#{lbl['lbl.ct.asearch.model.table2.cno']}" />
                  <p:inputText value="#{associationBackingBean.managedBean.ctNumber}" style="width:150px;"/>
                  <p:commandButton value="Search" process="modelDialog" icon="ui-icon-search"
                    action="#{associationBackingBean.searchContract}" update="advanceCtSearch"/>
              </h:panelGrid>
		     <p:spacer height="2"/>
                   <p:dataTable id="advanceCtSearch" var="data" value="#{associationBackingBean.managedBean.contractList}" rowIndexVar="index"
                    widgetVar="dataTableObj"  lazy="false" dynamic="true" selection="#{associationBackingBean.selectedContractList}" rowKey="#{data.contractId}"
                    paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="false"  emptyMessage="No Records!">
                    <ac:paginator for="advanceCtSearch"/>
                	<p:column selectionMode="multiple" style="width:18px" />
			        <p:column headerText="#{lbl['lbl.ct.asearch.model.table2.cno']}">
						<h:outputText value="#{data.latestContractVer.docNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.asearch.model.table2.cname']}" >
                    <h:outputText value="#{data.contractName}" />
					</p:column> 
                    <p:column headerText="#{lbl['lbl.ct.asearch.model.table2.sname']}">
                    <h:outputText value="#{data.smSupplier.companyName}" />
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.asearch.model.table2.cstart']}" >
                    <h:outputText value="#{data.latestContractVer.ctContractValue.effDate}">
                      <f:convertDateTime pattern="MM/dd/yyyy" /></h:outputText>
					</p:column> 
					<p:column headerText="#{lbl['lbl.ct.asearch.model.table2.cend']}" >
                    <h:outputText value="#{data.latestContractVer.ctContractValue.expDate}">
                    <f:convertDateTime pattern="MM/dd/yyyy" /></h:outputText>
					</p:column> 
					<p:column headerText="#{lbl['lbl.ct.asearch.model.table2.pname']}">
                    <h:outputText  />
					</p:column> 
			  	 </p:dataTable>
			 <f:facet name="footer">
			   <h:panelGrid columns="2"  style="float:right;height:50px;vertical-align: middle;">
				  <p:commandButton value="Ok" process="modelDialog" action="#{associationBackingBean.addAdvanceContract}" 
				     update="associateCreation,modelDialog" icon="ui-icon-select" onclick="dlg2.hide();"/>
                    <p:commandButton value="Back" type="button"  icon="ui-icon-back" ajax="false" onclick="dlg2.hide();" />
			    </h:panelGrid>
		    </f:facet>
         </p:panel>
	 </p:dialog>
	</ui:define>
</ui:composition>
