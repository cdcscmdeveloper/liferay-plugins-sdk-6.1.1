<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <ui:define name="contentSection">
    <style>
      .column-align-center { text-align: center !important;}
       .top-aligned-columns td{ vertical-align: top;}
       .confirmation-message-box {
         	border: 1px solid #cecece;
			font-family: Arial;
			font-size: 12px;
			cursor: default;
			padding: 10px;
         }
   </style>
   	<p:messages id="messages" showDetail="true" showSummary="false" autoUpdate="true" closable="true" severity="error, info" />
   	<table style="width: 100%;">
   		<tr>
   			<td><p:commandButton value="#{lbl['lbl.btn.back']}"  ajax="false" immediate="true" action="#{associationBackingBean.goToCancelPage}"/></td>
   			<td class="ppRightBtn">
		    	<p:commandButton value="#{lbl['lbl.btn.save']}" ajax="false" validateClient="true" process="@form"
		       		action="#{associationBackingBean.createAssociation}" style="margin-right:0px;" />  			
   			</td>
   		</tr>
   	</table>
   	<br/>
     <p:panel id="projectId" header="#{lbl['lbl.ct.panel.project.assoc.creation']}" toggleable="true" toggleSpeed="500">
	     <h:panelGrid columns="2" styleClass="top-aligned-columns"> 
	          <p:outputLabel value="#{lbl['lbl.ct.project.name']}"  styleClass="required"/>
	       <h:panelGrid columns="2">
           <p:inputText id="projectNames" style="width:300px;" required="true" label="#{lbl['lbl.ct.project.name']}"
               value="#{associationBackingBean.managedBean.ctAssociation.projectName}" maxlength="100">
               </p:inputText>
                <p:message for="projectNames" display="icon"/>
           </h:panelGrid>
                 <p:outputLabel value="#{lbl['lbl.ct.project.desc']}"  styleClass="required"/>
            <h:panelGrid  columns="2">
		    <p:inputTextarea id="projectDesc" style="width:500px;" required="true" label="#{lbl['lbl.ct.project.desc']}"
		       value="#{associationBackingBean.managedBean.ctAssociation.description}" maxlength="200" rows="2" autoResize="false">
		   </p:inputTextarea>
		    <p:message for="projectDesc" display="icon"/>
		   </h:panelGrid>
         </h:panelGrid>
	     <p:spacer height="10"/>
          <p:dataTable id="associateCreation" 
             var="data" value="#{associationBackingBean.managedBean.associateSearchList}" 
             selection="#{associationBackingBean.deleteSelectedContractList}" rowKey="#{data}">
             <ac:paginator for="associateCreation"/>
               <p:column selectionMode="multiple" style="width:2%;" />
               <p:column headerText="#{lbl['lbl.ct.contract.no']}" style="width:15%;">
			     <h:outputText value="#{data.contractNo}"/>
			   </p:column>
			   <p:column headerText="#{lbl['lbl.ct.supplier.name']}" style="width:20%;white-space:normal;">
				 <h:outputText  value="#{data.latestContractVer.ctContractValue.supplierName}"/>
			   </p:column>
			   <p:column headerText="#{lbl['lbl.ct.contract.start']}" style="width:10%;">
				<h:outputText value="#{data.latestContractVer.ctContractValue.effDate}">
			     	<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			     </h:outputText>
			   </p:column>
			   <p:column headerText="#{lbl['lbl.ct.contract.end']}" style="width:10%;">
				 <h:outputText value="#{data.latestContractVer.ctContractValue.expDate}">
			     	<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			     </h:outputText>
               </p:column>
			   <p:column headerText="#{lbl['lbl.ct.ptj.code']}" style="width:5%;">
				 <h:outputText  value="#{data.ownerOrgProfile.orgCode}"/>
			   </p:column>
			   <p:column headerText="#{lbl['lbl.ct.ptj']}" style="width:20%;white-space:normal;">
				 <h:outputText  value="#{data.ownerOrgProfile.orgName}"/>
			   </p:column>
			</p:dataTable> 
			<div class="ppRightBtn">
			      <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form"  onclick="dlg2.show();">
			         <p:ajax event="change" update="associateCreation" process="@this" />
			      </p:commandButton>
			      <p:commandButton value="#{lbl['lbl.ct.delete']}" process="@form" onsuccess="dlgDel.show()"  />     
			   </div>
			 <p:dialog id="dlgDel" widgetVar="dlgDel" header="#{lbl['lbl.ct.dialong.cofirm.header']}" styleClass="screen-title" resizable="false"  
              	modal="true" width="330">  
           <h:panelGrid columns="3">
            <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
             	<div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.ct.btn.yes']}" update="@([id$=associateCreation])" process="@form" 
				actionListener="#{associationBackingBean.deleteAdvanceContract()}" onclick="dlgDel.hide();"/>
			  <p:commandButton value="#{lbl['lbl.ct.btn.no']}"  onclick="dlgDel.hide();" type="button" />
		   </div>
        </p:dialog>  
       
         </p:panel>
		 <p:dialog id="modelDialog" header="#{lbl['lbl.ct.search.contract']}" resizable="false"  
		    widgetVar="dlg2" modal="true" styleClass="pop_up_top" width="800" height="425">
		   <p:panel id="advancePanel">
               <h:panelGrid columns="3">
                  <p:outputLabel value="#{lbl['lbl.ct.contract.no']}" />
                  <p:inputText value="#{associationBackingBean.managedBean.ctNumber}" style="width:150px;"/>
                  <p:commandButton value="#{lbl['lbl.btn.search']}" process="modelDialog" 
                    onstart="blkDlgAssociateTable.show();" oncomplete="blkDlgAssociateTable.hide();" action="#{associationBackingBean.searchContract}" update=":form:advanceCtSearch"/>
              </h:panelGrid>
		     <p:spacer height="2"/>
             <p:dataTable id="advanceCtSearch" var="data" value="#{associationBackingBean.contractDataModel}" 
                rowIndexVar="index"  lazy="true" selection="#{associationBackingBean.selectedContractList}" rowKey="#{data}">
                    <ac:paginator for="advanceCtSearch"/>
                	<p:column selectionMode="multiple" style="width:2%;" />
			        <p:column headerText="#{lbl['lbl.ct.contract.no']}" style="width:10%;">
						<h:outputText value="#{data.contractNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.contract.title']}" style="width:40%;white-space:normal">
                       	<h:outputText value="#{data.contractName}" />
					</p:column> 
                    <p:column headerText="#{lbl['lbl.ct.supplier.name']}" style="width:32%;white-space:normal">
                       	<h:outputText value="#{data.latestContractVer.ctContractValue.supplierName}" />
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.contract.start']}"  style="width:8%;">
                       <h:outputText value="#{data.latestContractVer.ctContractValue.effDate}">
					    	<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
                   	</p:column> 
					<p:column headerText="#{lbl['lbl.ct.contract.end']}" style="width:8%;">
                        <h:outputText value="#{data.latestContractVer.ctContractValue.expDate}">
					    	<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
                  	</p:column>
			  	 </p:dataTable>
			  	  <p:blockUI widgetVar="blkDlgAssociateTable" trigger="advanceCtSearch"  block=":form:advancePanel">  
			      <p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>  
		      </p:blockUI> 
			 <f:facet name="footer">
			   <h:panelGrid columns="2" style="float:right;height:50px;vertical-align: middle;">
				  <p:commandButton value="#{lbl['lbl.btn.select']}" 
				     process="modelDialog" action="#{associationBackingBean.addAdvanceContract}" 
				     update="associateCreation,modelDialog"  onclick="dlg2.hide();"/>
                    <p:commandButton value="#{lbl['lbl.btn.cancel']}" type="button"   ajax="false" onclick="dlg2.hide();" />
			    </h:panelGrid>
		    </f:facet>
         </p:panel>
	 </p:dialog>
	</ui:define>
</ui:composition>
