<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <ui:define name="contentSection">
     <style>
      .column-align-center { text-align: center !important;}
      .confirmation-message-box {
         	border: 1px solid #cecece;
			font-family: Arial;
			font-size: 12px;
			cursor: default;
			padding: 10px;
         }
    </style>
    <p:blockUI widgetVar="blkAssoSearchTable"  block=":form" trigger="searchButtonId">  
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>  
	</p:blockUI> 
  	<p:messages id="messages" showDetail="true" 
 		showSummary="false" autoUpdate="true" closable="true" severity="error, info, warning" >
  	</p:messages>
    <p:panel id="associatePanelId" header="#{lbl['lbl.ct.project.association']}"   toggleable="true"  toggleSpeed="500">
         <h:panelGrid columns="4" style="width:100%;">
               
               <p:outputLabel value="#{lbl['lbl.ct.project.name']}"  />
               <p:inputText id="pNames"  maxlength="100" style="width:170px;" 
                    label="#{lbl['lbl.ct.project.name']}"  value="#{associationBackingBean.managedBean.projectName}"/>
   
               <p:outputLabel value="#{lbl['lbl.ct.contract.title']}"  />
               <p:inputText id="contractName" maxlength="1000" style="width:170px;"
                   label="#{lbl['lbl.ct.contract.title']}" value="#{associationBackingBean.managedBean.ctName}" />
           
               <p:outputLabel value="#{lbl['lbl.ct.project.desc']}" />
               <p:inputText id="pDescp" maxlength="200"  style="width:170px;" 
                   label="#{lbl['lbl.ct.project.desc']}" value="#{associationBackingBean.managedBean.projectDescription}"/>

               <p:outputLabel  value="#{lbl['lbl.ct.supplier.name']}"  />
               <p:inputText id="sName" style="width:170px;" maxlength="100"
                   label="#{lbl['lbl.ct.supplier.name']}" value="#{associationBackingBean.managedBean.ctSupplierName}"/>
         
              <h:outputLabel value="#{lbl['lbl.ct.contract.start']}"  />
              <p:calendar id="calefdate" style="width:130px;margin-bottom:5px;"  navigator="true"
                 value="#{associationBackingBean.managedBean.ctDateStart}" readonlyInput="true"   showOn="button"
                 pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
      
              <p:outputLabel value="#{lbl['lbl.ct.contract.end']}" />
              <p:calendar id="calepdate"  showOn="button" readonlyInput="true"
                  value="#{associationBackingBean.managedBean.ctDateEnd}" style="width:130px;"  navigator="true"
                  pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
       
              <p:outputLabel value="#{lbl['lbl.ct.physical.no']}"/>
              <p:inputText  id="ProdName"  style="width:170px;margin-top:3px;"  maxlength="30"
                   label="#{lbl['lbl.ct.physical.no']}" value="#{associationBackingBean.managedBean.ctProductCode}" />
          </h:panelGrid>
           
          <div class="ppRightBtn"> 
             <p:commandButton value="#{lbl['lbl.btn.search']}" process="@form" action="#{associationBackingBean.searchAssociation}" 
                 onstart="blkAssoSearchTable.show();" oncomplete="blkAssoSearchTable.hide();"  update=":form"
                 id="searchButtonId" />
            
             <p:commandButton value="#{lbl['lbl.ct.reset']}"  process="@form"
              action="#{associationBackingBean.searchReset}" update=":form"/>
        </div>
     </p:panel>
	
	<p:panel id="associateResultId" header="#{lbl['lbl.ct.search.result']}"   toggleable="true"  toggleSpeed="500">
        <p:dataTable id="associateSearch" var="data" 
             lazy="true"  value="#{associationBackingBean.associationDataModel}"  
             rowKey="#{data}" selection="#{associationBackingBean.ctSelectAssociation}">
	        
	        <ac:paginator for="associateSearch"/>
		    
		    <p:column selectionMode="multiple" style="width:3%;" />
		 
		    <p:column style="width:30%; white-space:normal;" headerText="#{lbl['lbl.ct.project.name']}">
		          <h:outputText value="#{data.projectName}" />
		    </p:column> 
		 
		    <p:column style="width:50%; white-space:normal;" headerText="#{lbl['lbl.ct.project.desc']}">
		         <h:outputText value="#{data.description}" /> 
		    </p:column> 
		    
		    <p:column style="width:7%;" headerText="#{lbl['lbl.ct.no.of.contracts']}">
		         <h:outputText value="#{fn:length(data.ctAssocContracts)}"  style="float:right;"/>
		    </p:column>
		    
		    <p:column style="width:10%;" headerText="#{lbl['lbl.ct.action']}" styleClass="column-align-center">
		         <p:commandLink action="#{associationBackingBean.goToUpdateAssociatePage}" process="@this" styleClass="column-align-center">
			         <f:setPropertyActionListener value="#{data}" target="#{associationBackingBean.managedBean.ctUpdateAssociation}" />
			         <p:graphicImage value="/css/images/design/ico-edit.png" title="#{lbl['lbl.ct.edit']}" />
		        </p:commandLink> 
		  </p:column> 	   
	   </p:dataTable>
		    <div class="ppRightBtn">
		         <p:commandButton value="#{lbl['lbl.btn.create']}" process="@this"  
		              action="#{associationBackingBean.goToAssociatePage}"/>
	             <p:commandButton value="#{lbl['lbl.ct.delete']}" process="@this" 
	                  partialSubmit="true" onsuccess="dlgAssociateDel.show()" />
	         </div>
		
		  <p:spacer height="4"/>
		      <p:dialog id="dlgAssociateDel" widgetVar="dlgAssociateDel" styleClass="screen-title" resizable="false" 
		           modal="true" width="330">  
                   <h:panelGrid columns="3">
                       <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			           <p:spacer width="10"/>
                       <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
                   </h:panelGrid>
                   <div class="ppRightBtn">
		                <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@form" 
		                     update=":form:associateSearch" action="#{associationBackingBean.deleteAssociation()}" onclick="dlgAssociateDel.hide();"/>
			            <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgAssociateDel.hide();" type="button" />
		          </div>
              </p:dialog>  
	     </p:panel>
     </ui:define>
</ui:composition>
