<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <ui:define name="contentSection">
    <style>
      .column-align-center { text-align: center !important;}
    </style>
    <p:panel id="associatePanelId" header="Project Association"   toggleable="true"  toggleSpeed="500">
      <h:panelGrid columns="4" style="width:100%;">
        <h:outputLabel value="#{lbl['lbl.ct.asearch.pname']}"  />
        <p:inputText  maxlength="100" style="width:170px;"
          value="#{associationBackingBean.managedBean.projectName}"/>
        <p:outputLabel value="#{lbl['lbl.ct.asearch.cname']}"  />
        <p:inputText maxlength="1000" style="width:170px;"
           value="#{associationBackingBean.managedBean.ctName}"  />
        <p:outputLabel value="#{lbl['lbl.ct.asearch.pdes']}" />
        <p:inputText maxlength="200"  style="width:170px;"
          value="#{associationBackingBean.managedBean.projectDescription}"/>
        <p:outputLabel  value="#{lbl['lbl.ct.asearch.sname']}"  />
        <p:inputText style="width:170px;"
           value="#{associationBackingBean.managedBean.ctSupplierName}"/>
        <h:outputLabel value="#{lbl['lbl.ct.asearch.cstart']}"  />
        <p:calendar style="width:130px;" id="calefdate" readonlyInput="true" showOn="button"
            value="#{associationBackingBean.managedBean.ctDateStart}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
        <p:outputLabel value="#{lbl['lbl.ct.asearch.cend']}" />
        <p:calendar id="calepdate" style="width:130px;"  readonlyInput="true" showOn="button"
          value="#{associationBackingBean.managedBean.ctDateEnd}"  pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/>
        <p:outputLabel value="#{lbl['lbl.ct.asearch.pcno']}"/>
        <p:inputText   style="width:170px;"
           value="#{associationBackingBean.managedBean.ctProductCode}"/>
      </h:panelGrid>
      <div class="ppRightBtn"> 
        <p:commandButton value="#{lbl['lbl.ct.asearch.btn.search']}"
           icon="ui-icon-search" action="#{associationBackingBean.searchAssociation}"  update="associateSearch"/>
           <p:commandButton value="#{lbl['lbl.ct.search.btn.reset']}" 
              action="#{associationBackingBean.searchReset}" icon="ui-icon-search"   update="associatePanelId"/>
      </div>
	</p:panel>
	<p:panel id="associateResultId" header="#{lbl['lbl.ct.asearch.panel.result']}"   toggleable="true"  toggleSpeed="500">
      <p:dataTable id="associateSearch" var="data" 
         value="#{associationBackingBean.managedBean.associationList}"  
         rowKey="#{data}" selection="#{associationBackingBean.ctSelectAssociation}">
	     <ac:paginator for="associateSearch"/>
		 <p:column selectionMode="multiple" style="width:18px;" />
		 <p:column style="width:25%;" headerText="#{lbl['lbl.ct.asearch.table1.pname']}">
		   <h:outputText value="#{data.projectName}" /> </p:column> 
		 <p:column style="width:35%;" headerText="#{lbl['lbl.ct.asearch.table1.pdes']}">
		   <h:outputText value="#{data.description}" /> </p:column> 
		 <p:column style="width:25%;" headerText="#{lbl['lbl.ct.asearch.table1.noc']}">
		   <h:outputText value="#{associationBackingBean.getAssocContractCount(data.associationId)}" />
		 </p:column>
		 <p:column style="width:15%;" headerText="#{lbl['lbl.ct.asearch.table1.action']}" styleClass="column-align-center">
		   <p:commandLink action="#{associationBackingBean.gotoUpdateAssociatePage}" styleClass="column-align-center">
			  <f:setPropertyActionListener value="#{data}" target="#{associationBackingBean.managedBean.ctUpdateAssociation}" />
			  <p:graphicImage library="ep/images/design" name="edit.png" value="/resources/ep/images/design/edit.png" title="Edit" />
		   </p:commandLink> 
		  </p:column> 
		</p:dataTable>
		<div class="ppRightBtn">
		   <p:commandButton value="Create"  icon="ui-icon-add" action="#{associationBackingBean.gotoAssociatePage}"/>
	       <p:commandButton value="Delete" process="@form" onsuccess="dlgAssociateDel.show()" icon="ui-icon-delete"/>
	     </div>
		<p:spacer height="4"/>
		 <p:dialog id="dlgAssociateDel" widgetVar="dlgAssociateDel" styleClass="screen-title"
		    header="#{lbl['lbl.ct.dialong.cofirm.header']}"  resizable="false" modal="true" width="325" height="90">  
           <h:panelGrid columns="3">
            <p:graphicImage library="ep/images/design" name="exclamation.png"
			   value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
             <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" 
                 styleClass="ui-inputtextarea"></p:inputTextarea>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="Yes" icon="ui-icon-accept" update="@([id$=associateSearch])"
		        process="@form" actionListener="#{associationBackingBean.deleteAssociation()}" onclick="dlgAssociateDel.hide();"/>
			  <p:commandButton value="No" icon="ui-icon-reject" onclick="dlgAssociateDel.hide();" type="button" />
		   </div>
        </p:dialog>  
	  </p:panel>
   </ui:define>
</ui:composition>
