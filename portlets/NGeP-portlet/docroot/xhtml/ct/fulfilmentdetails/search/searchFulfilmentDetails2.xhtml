<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="contentSection">
         <p:tabView id="tabview"   tabChangeListener="#{searchBackingBean.onChange}" onTabChangeUpdate="growl">
            <p:tab id="searchTab" title="General" >
                  <p:panel id="searchId" header="#{lbl['lbl.ct.search.panel.name']}" toggleable="true"  toggleSpeed="500" widgetVar="panelsearch">
                   <h:panelGrid columns="4" style="width:800px;">
                    <h:panelGroup>
                     <div style="height: 30px; width:48px; vertical-align: top" >
 					  <p:outputLabel for="type" value="Type" styleClass="txtsize" style="width:200px;"/>
 					   </div>
			        </h:panelGroup>
						    <h:panelGroup>
						      <div style="height:30px; vertical-align: top">
	                  <p:selectOneMenu id="type" value="#{searchBackingBean.searchTxtValue}" required="true" style="width:180px">
	                  <f:selectItem itemLabel="--Please Select--" itemValue="" />
					  <f:selectItems value="#{searchBackingBean.searchItemDetails}" />
					  <p:ajax event="change" update="changeSearchField"  listener="#{searchBackingBean.changeSearchField}" process="@this"/>  
	                  </p:selectOneMenu> 
	                   </div>
	                   </h:panelGroup>
	                
	                  <f:verbatim></f:verbatim>                 
                      <f:verbatim></f:verbatim>
                      </h:panelGrid> 
                      <p:outputPanel id="changeSearchField" > 
                     <h:panelGrid columns="4" style="width:900px;">
                      <p:outputLabel for="cno" value="Contract Number" styleClass="a"  rendered="#{searchBackingBean.contractNumber or searchBackingBean.showAll}" />
			             <p:inputText id="cno" value=""    rendered="#{searchBackingBean.contractNumber or searchBackingBean.showAll}"/> 		                                        
		                 <p:outputLabel for="cname"  value="Contract Name" styleClass="a"  rendered="#{searchBackingBean.contractName or searchBackingBean.showAll}"  />
			              <p:inputText id="cname" value=""  rendered="#{searchBackingBean.contractName or searchBackingBean.showAll}"/> 		                                        
		                 <p:outputLabel value="Physical Contract No" styleClass="a"  rendered="#{searchBackingBean.physicalNumber or searchBackingBean.showAll}"/>
			            <p:inputText value=""  rendered="#{searchBackingBean.physicalNumber or searchBackingBean.showAll}"/> 		                                        
		                 <p:outputLabel value="LOA No" styleClass="a"  rendered="#{searchBackingBean.loaNumber or searchBackingBean.showAll}" />
			              <p:inputText value="" style="width:200px;" rendered="#{searchBackingBean.loaNumber or searchBackingBean.showAll}"/> 		                                        
		                 <p:outputLabel value="Contract Start" styleClass="a"  rendered="#{searchBackingBean.contractStart or searchBackingBean.showAll}" />
			               <p:calendar style="width:150px;" value="#{searchBackingBean.searchDetails.date}" id="popupButton1" showOn="button" 
			               rendered="#{searchBackingBean.contractStart or searchBackingBean.showAll}"  />
                        <p:outputLabel value="Contract End"  styleClass="a"  rendered="#{searchBackingBean.contractEnd or searchBackingBean.showAll}" />
			               <p:calendar style="width:150px;" value="#{searchBackingBean.searchDetails.date}" id="popupButton2" showOn="button"
			                rendered="#{searchBackingBean.contractEnd or searchBackingBean.showAll}"/>                                     
		                <p:outputLabel value="Supplier Id" styleClass="a"  rendered="#{searchBackingBean.supplierId or searchBackingBean.showAll}" />
			               <p:inputText value="" style="width:200px;"  rendered="#{searchBackingBean.supplierId or searchBackingBean.showAll}"/> 		                                        
		                  <p:outputLabel value="Supplier Name"  rendered="#{searchBackingBean.supplierName or searchBackingBean.showAll}" />
			              <p:inputText value="" style="width:200px;"  rendered="#{searchBackingBean.supplierName or searchBackingBean.showAll}"/> 		                                        
		                  <p:outputLabel value="Circular No" rendered="#{searchBackingBean.circularNo or searchBackingBean.showAll}" />
			              <p:inputText value="" style="width:200px;"  rendered="#{searchBackingBean.circularNo or searchBackingBean.showAll}"/> 		                                        
		                  <p:outputLabel value="Circular Name"  rendered="#{searchBackingBean.circularName or searchBackingBean.showAll}" />
			              <p:inputText value="" style="width:200px;"  rendered="#{searchBackingBean.circularName or searchBackingBean.showAll}"/> 		                                        
		                  <h:panelGroup  rendered="#{searchBackingBean.poductCode or searchBackingBean.showAll}">
			              <div style="height: 70px; vertical-align: top" >
			                  <p:outputLabel for="productCode" value="Product / Service Code" 
			                   rendered="#{searchBackingBean.poductCode or searchBackingBean.showAll}"/>
							 </div>
						     </h:panelGroup>
						    <h:panelGroup  rendered="#{searchBackingBean.poductCode or searchBackingBean.showAll}">
						      <div style="height: 70px; vertical-align: top">
							 <p:inputText id="productCode" value="" style="width:200px;" rendered="#{searchBackingBean.poductCode or searchBackingBean.showAll}"/></div>
						     </h:panelGroup>	                                        
		                     <h:panelGroup  rendered="#{searchBackingBean.status or searchBackingBean.showAll}">
			                <div style="height: 70px; vertical-align: top">
			                  <p:outputLabel for="status" value="Status"   />
							 </div>
						     </h:panelGroup>
						     <h:panelGrid rendered="#{searchBackingBean.status or searchBackingBean.showAll}">
                           <p:selectOneListbox id="status" value="" style="width:200px;" >
                             <f:selectItem itemLabel="Pending Fulfillment Creation" itemValue="1"  />  
                              <f:selectItem itemLabel="Pending Approval" itemValue="2"  />  
                              <f:selectItem itemLabel="Approved" itemValue="3" />  
                              <f:selectItem itemLabel="Cancelled" itemValue="4" />  
                           </p:selectOneListbox>
                           </h:panelGrid>   
                           <h:panelGrid rendered="#{!searchBackingBean.showAll}">
                             <f:verbatim></f:verbatim>
                             </h:panelGrid>     
                             <h:panelGrid rendered="#{!searchBackingBean.showAll}">
                             <f:verbatim></f:verbatim>
                             </h:panelGrid>                                  	
		              </h:panelGrid>
		              <h:panelGrid style="width:800px" columnClasses="column-align-right" rendered="#{searchBackingBean.showAll}">
						<p:commandButton value="Search" styleClass="text-align:right;" process="@this" partialSubmit="true" 
						   icon="ui-icon-add">
						</p:commandButton>
					  </h:panelGrid>
					    <h:panelGrid style="width:350px" columnClasses="column-align-right" rendered="#{!searchBackingBean.showAll}">
						  <p:commandButton value="Search" styleClass="text-align:right;" process="@this" partialSubmit="true" 
							 icon="ui-icon-add">
							</p:commandButton>
					    </h:panelGrid>
		              </p:outputPanel>
	    		    </p:panel>
				   <p:panel id="searchResulId" header="#{lbl['lbl.ct.search.panel.result']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelsearchResul">
                       <div style="overflow-x:auto">
			                     <p:dataTable id="dataTable" var="data" value="" rowIndexVar="index"
							               widgetVar="dataTableObj" lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom"
							               paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" rowsPerPageTemplate="5,10,15,20"
							               currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							               <p:columnGroup type="header"> 
								                <p:row> 
									                     <p:column headerText="#{lbl['lbl.ct.search.table.no']}" />
									                     <p:column headerText="#{lbl['lbl.ct.search.table.cno']}"   /> 
									                     <p:column headerText="#{lbl['lbl.ct.search.table.pno']}" /> 	
									                     <p:column headerText="#{lbl['lbl.ct.search.table.clno']}" /> 
									                     <p:column headerText="#{lbl['lbl.ct.search.table.sname']}"  /> 
									                     <p:column headerText="#{lbl['lbl.ct.search.table.cstart']}"  /> 	
									                     <p:column headerText="#{lbl['lbl.ct.search.table.cend']}"   /> 
									                     <p:column headerText="#{lbl['lbl.ct.search.table.lno']}"  />
									                     <p:column headerText="#{lbl['lbl.ct.search.table.status']}"  /> 
									                     <p:column headerText="#{lbl['lbl.ct.search.table.action']}" />
								               </p:row>							
								               </p:columnGroup>
							                            <p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
							                            <p:column> <h:outputText value="" /></p:column>
							                            <p:column><h:outputText value="" /></p:column>	
							                            <p:column><h:outputText value="" /></p:column>	
							                            <p:column><h:outputText value="" /></p:column>					
							                            <p:column> <h:outputText value="" /> </p:column>	
							                            <p:column><h:outputText value="" /></p:column>	
							                            <p:column><h:outputText value="" /></p:column>	
							                            <p:column> <h:outputText value="" /> </p:column>	
							                            <p:column styleClass="column-align-center">
								                          <p:commandButton title="Suspended" action="#{fulfilmentBackingBean.gotoSuspendPage}" 
								                               partialSubmit="true" process="@this" icon="ui-icon-suspend"/>
								                          <p:spacer width="2"/>
								                          <p:commandButton title="Termination" action="#{fulfilmentBackingBean.gotoTerminatePage}"
								                             partialSubmit="true" process="@this" icon="ui-icon-terminate"/>
								                          <p:spacer width="2"/>
								                          <p:commandButton title="Amendment" action="#{fulfilmentBackingBean.gotoAmendPage}" 
								                            partialSubmit="true" process="@this" icon="ui-icon-amend" />
								                      </p:column> 
							              </p:dataTable>
						       </div>
						</p:panel>
                  </p:tab>
                  <p:tab id="associateSearch" title="Associate Ministry Contract">
                       <ui:include src="/xhtml/ct/fulfilmentDetails/searchFulfilment/advanceSearch.xhtml" />
                </p:tab>
	     </p:tabView>
   </ui:define>
</ui:composition>
