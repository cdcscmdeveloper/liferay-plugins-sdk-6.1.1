<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<ui:define name="contentSection">
	<script> $('#portlet_ctContractMaintenance_WAR_NGePportlet').find('.portlet-title-text').html('#{contractDetailsBackingBean.getPortletTitle()}'); </script>
    <style>
      .column-align-center { text-align: center !important;}
    </style>
   
    <p:blockUI block=":form" trigger="searchButtonId" widgetVar="blkContractSearchTable">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
    <p:messages id="messages" showDetail="true" 
          showSummary="false" autoUpdate="true" closable="true" severity="error, info, warning" />

     <p:panel id="searchId" header="#{lbl['lbl.btn.search']}" toggleable="true"  toggleSpeed="500">
     	<h:panelGrid columns="4" style="width:100%;" 
     	   columnClasses="columnWidth20,columnWidth20,columnWidth20,columnWidth20">
           <p:outputLabel value="#{lbl['lbl.ct.contract.no']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctNumber}" maxlength="17" style="width:170px;"/>
           <p:outputLabel value="#{lbl['lbl.ct.contract.title']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctName}" maxlength="1000" style="width:170px;"/>
           <p:outputLabel value="#{lbl['lbl.ct.ministry']}" />
           <p:selectOneMenu id="searchMinistry" style="width:300px" disabled="#{contractDetailsBackingBean.disableMinistrySelection()}"
                rendered="#{!contractDetailsBackingBean.isBPKCCA()}"
                value="#{contractDetailsBackingBean.managedBean.searchMinistryProfileId}" >
      	   		<f:selectItems value="#{contractDetailsBackingBean.getMinistryDropdown()}"/>
      	   		<p:ajax event="change" process="@form" update="@([id$=searchPtj])"  listener="#{contractDetailsBackingBean.resetPtjProfile}"/>
           </p:selectOneMenu>
           <p:inputText value="#{lbl['lbl.pm.org.gst.na']}" maxlength="50" disabled="true" style="width:170px;" rendered="#{contractDetailsBackingBean.isBPKCCA()}"/>
           <p:outputLabel value="#{lbl['lbl.ct.ptj']}" />
           <ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="40" readonly="true"
				disabled="#{contractDetailsBackingBean.isContractAdmin() or contractDetailsBackingBean.managedBean.searchMinistryProfileId==null}"
				headerText="#{lbl['lbl.ct.ptj']}"
				value="#{contractDetailsBackingBean.managedBean.searchPtjProfile.pmOrgValidity.orgName}"
				saveObject="contractDetailsBackingBean.managedBean.searchPtjProfile"
				conditionField="#{contractDetailsBackingBean.getPTJCondition()}">			
			</ac:lov>
           <p:outputLabel value="#{lbl['lbl.ct.physical.circular.no']}" rendered="#{contractDetailsBackingBean.isBPKCCA()}"/>
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctCircularNo}" maxlength="50" style="width:170px;" rendered="#{contractDetailsBackingBean.isBPKCCA()}"/>
           <p:outputLabel value="#{lbl['lbl.ct.circular.name']}" rendered="#{contractDetailsBackingBean.isBPKCCA()}"/>
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctCircularName}" maxlength="200" style="width:170px;" rendered="#{contractDetailsBackingBean.isBPKCCA()}"/>
           <p:outputLabel value="#{lbl['lbl.ct.supplier.id']}" rendered="#{!contractDetailsBackingBean.isSupplierRole()}"/>
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctSupplierId}" maxlength="20" style="width:170px;" rendered="#{!contractDetailsBackingBean.isSupplierRole()}"/>
           <p:outputLabel value="#{lbl['lbl.ct.supplier.name']}" rendered="#{!contractDetailsBackingBean.isSupplierRole()}"/>
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctSupplierName}" maxlength="100" style="width:170px;" rendered="#{!contractDetailsBackingBean.isSupplierRole()}"/> 
           <p:outputLabel value="#{lbl['lbl.ct.contract.start']}"/>
           <p:calendar id="popupButtonCal"   showOn="button" readonlyInput="true"  navigator="true"
               style="width:130px;" value="#{contractDetailsBackingBean.managedBean.ctDateStart}" 
               pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
           <p:outputLabel value="#{lbl['lbl.ct.contract.end']}" />
           <p:calendar id="popupButtonCal1"  style="width:130px;"  readonlyInput="true" 
             value="#{contractDetailsBackingBean.managedBean.ctDateEnd}"  navigator="true"  showOn="button"
             pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
           <p:outputLabel value="#{lbl['lbl.ct.loa.physical.no']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctLOANo}" maxlength="100" style="width:170px;margin-top:3px;"/>                     
           <p:outputLabel value="#{lbl['lbl.ct.physical.no']}" />
           <p:inputText id="productCode" value="#{contractDetailsBackingBean.managedBean.ctPhysicalNo}" maxlength="30" style="width:170px;margin-top:3px;" />
		   <p:outputLabel for="status" value="#{lbl['lbl.ct.status']}" />
		   <p:selectOneMenu id="status" value="#{contractDetailsBackingBean.managedBean.ctStatus}"	style="width:200px; margin-bottom:5px">
				<f:selectItems value="#{contractDetailsBackingBean.getSearchStatusDropdown()}" />
		   </p:selectOneMenu>
		   <p:outputLabel value="#{lbl['lbl.ct.termination.type']}" rendered="#{!contractDetailsBackingBean.isSupplierRole()}"/>
		   <p:selectOneMenu id="terminationType" value="#{contractDetailsBackingBean.managedBean.terminationTypeId}" style="width:200px; margin-bottom:5px"
		   		rendered="#{!contractDetailsBackingBean.isSupplierRole()}">
		   		<f:selectItems value="#{contractDetailsBackingBean.getDropdownValues(ParameterTypeConst.terminationDecisionType)}" />
		   </p:selectOneMenu>
		   <p:outputLabel for="contractStatus" value="#{lbl['lbl.ct.contract.status']}" rendered="#{!contractDetailsBackingBean.isSupplierRole()}"/>
		   <p:selectOneMenu id="contractStatus" value="#{contractDetailsBackingBean.managedBean.ctContractStatus}"	style="width:250px;"
		   		rendered="#{!contractDetailsBackingBean.isSupplierRole()}">
				<f:selectItems value="#{contractDetailsBackingBean.getSearchContractStatusDropdown()}" />
		   </p:selectOneMenu>
		</h:panelGrid>
	  	<div class="ppRightBtn"> 
        	<p:commandButton
        	 id="searchButtonId" value="#{lbl['lbl.btn.search']}" validateClient="true"  action="#{contractDetailsBackingBean.searchContract}" 
        	 onstart="blkContractSearchTable.show();" oncomplete="blkContractSearchTable.hide();"    update="contractTbl"/>
             <p:commandButton value="#{lbl['lbl.ct.reset']}" action="#{contractDetailsBackingBean.searchReset}"    update=":form"/>
	  	</div>	  		  
	  	<ac:lovPopup />
	  </p:panel>
		<p:panel id="searchResulId"	header="#{lbl['lbl.ct.search.result']}" toggleable="true"	toggleSpeed="500">
			<div style="overflow-x: auto">				
				<p:dataTable id="contractTbl" value="#{contractDetailsBackingBean.managedBean.contractDataModel}"
					var="data" lazy="true" rowIndexVar="index" rowKey="#{data}" rows="10">
					<ac:paginator for="contractTbl" />
					<p:column headerText="#{lbl['lbl.ct.contract.no']}" style="width:10%;">
						<h:outputText value="#{data.contractNo}" />
					</p:column>					
					<p:column headerText="#{lbl['lbl.ct.contract.title']}"  style="width:10%; white-space:normal;">
						<h:outputText value="#{data.contractName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.physical.circular.no']}"  style="width:10%; white-space:normal;" rendered="#{contractDetailsBackingBean.isBPKCCA()}">
						<h:outputText value="#{data.ctCircularVer.circularNo}"  rendered="#{data.ctCircularVer.status.statusId != CtStatusConst.cqRejected}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.circular.status']}"  style="width:10%; white-space:normal;" rendered="#{contractDetailsBackingBean.isBPKCCA()}">
						<h:outputText value="#{contractDetailsBackingBean.getStatusDescById(data.ctCircularVer.status.statusId)}" rendered="#{data.ctCircularVer.status.statusId != CtStatusConst.cqRejected}"    />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.supplier.name']}"  style="width:10%; white-space:normal;">
						<h:outputText value="#{data.companyName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.contract.start']}"  style="width:5%; white-space:normal;">
						<h:outputText value="#{data.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.contract.end']}"  style="width:5%; white-space:normal;">
						<h:outputText value="#{data.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.loa.physical.no']}"  style="width:10%; white-space:normal;">
						<h:outputText value="#{data.loaPhysicalNo}" />
					</p:column>
					<p:column style="width:8%; white-space:normal;">
						<f:facet name="header">
					   		<h:outputText value="#{lbl['lbl.ct.status']}"/>
               		   		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.status.contract']}" />
               	    	</f:facet>
						<h:outputText value="#{contractDetailsBackingBean.chkContractStatusType(data.status)}" />						
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.contract.status']}"  style="width:15%; white-space:normal;">
						<h:outputText value="#{contractDetailsBackingBean.getStatusDescById(data.ctContractVer.status.statusId)}" />
					</p:column>
					 	<p:column headerText="#{lbl['lbl.ct.action']}"  style="width:12%; white-space:normal;" rendered="#{!contractDetailsBackingBean.isSupplierRole()}">
					 	<h:panelGroup rendered="#{contractDetailsBackingBean.isContractAdmin()
					 		and data.fdStatus == 1 and data.ctContract.recordStatusFlg==1}" >
						 	<p:commandLink
								onclick="gotoSuspendPage([{name:'contractId',value:'#{data.ctContract.contractId}'}])"
								onstart="blkContractSearchTable.show()" oncomplete="blkContractSearchTable.hide()">
								<p:graphicImage value="/css/images/design/ico-suspend.png" title="#{lbl['lbl.ct.suspend.contract']}" />
							</p:commandLink>
						   	<p:spacer width="5" />
						  	<p:commandLink
								onclick="gotoTerminatePage([{name:'contractId',value:'#{data.ctContract.contractId}'}])"
								onstart="blkContractSearchTable.show()" oncomplete="blkContractSearchTable.hide()">
								<p:graphicImage value="/css/images/design/ico-termination.png" title="#{lbl['lbl.ct.termination']}" />
							</p:commandLink>
						   	<p:spacer width="5" rendered="#{data.ctContract.procurementMode.parameterCode!=ParameterConst.procurementModeDirectPurchase and contractDetailsBackingBean.checkAmendmentAllow(data)}" />
						   	<p:commandLink rendered="#{data.ctContract.procurementMode.parameterCode!=ParameterConst.procurementModeDirectPurchase and contractDetailsBackingBean.checkAmendmentAllow(data)}"
								onclick="gotoAmendPage([{name:'contractId',value:'#{data.ctContract.contractId}'}, {name:'action',value:'update'}])"
								onstart="blkContractSearchTable.show()" oncomplete="blkContractSearchTable.hide()">
								<p:graphicImage value="/css/images/design/ico-viewnedit.png" title="#{lbl['lbl.ct.amendment']}" />
							</p:commandLink>
							<p:spacer width="5" />
						   	<p:commandLink
								onclick="gotoUpdatePage([{name:'contractId',value:'#{data.ctContract.contractId}'}])"
								onstart="blkContractSearchTable.show()" oncomplete="blkContractSearchTable.hide()">
								<p:graphicImage value="/css/images/design/ico-edit.png" title="#{lbl['lbl.ct.contract.update']}" />
							</p:commandLink>
							<p:spacer width="5" />
						</h:panelGroup>
					   	<p:commandLink onclick="gotoViewPage([{name:'contractId',value:'#{data.ctContract.contractId}'}, {name:'contractVerId',value:'#{data.ctContractVer.contractVerId}'}])"
					   		onstart="blkContractSearchTable.show()" oncomplete="blkContractSearchTable.hide()">
							<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.ct.view']}" />
						</p:commandLink>
						<p:spacer width="5" rendered="#{data.terminate or data.mutualTerminate or data.remedy}" />
					   	<p:commandLink rendered="#{data.terminate or data.mutualTerminate or data.remedy}"
							onclick="gotoTerminateHistoryPage([{name:'contractId',value:'#{data.ctContract.contractId}'}])"
							onstart="blkContractSearchTable.show()" oncomplete="blkContractSearchTable.hide()">
							<p:graphicImage value="/css/images/design/ico-termination-history.png" title="#{lbl['lbl.ct.view.termination.history']}" />
						</p:commandLink>
					</p:column>
					<!-- Supplier's action -->
					<p:column headerText="#{lbl['lbl.ct.action']}"  style="width:12%; white-space:normal;" rendered="#{contractDetailsBackingBean.isSupplierRole()}">
						<p:commandLink action="#{contractDetailsBackingBean.gotoCommonViewPage(data.ctContract.contractId)}"
					   		onstart="blkContractSearchTable.show()" oncomplete="blkContractSearchTable.hide()">
							<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.ct.view']}" />
						</p:commandLink>
					</p:column>
				</p:dataTable>			
				 	
				<p:remoteCommand name="gotoSuspendPage" action="#{contractDetailsBackingBean.gotoSuspendPage}" />
				<p:remoteCommand name="gotoTerminatePage" action="#{contractDetailsBackingBean.gotoTerminatePage}" />
				<p:remoteCommand name="gotoAmendPage" action="#{contractDetailsBackingBean.gotoAmendPage}" />
				<p:remoteCommand name="gotoUpdatePage" action="#{contractDetailsBackingBean.gotoUpdatePage}" />
				<p:remoteCommand name="gotoViewPage" action="#{contractDetailsBackingBean.gotoViewPage}" />
				<p:remoteCommand name="gotoTerminateHistoryPage" action="#{contractDetailsBackingBean.gotoTerminateHistoryPage}" />
			</div>
		</p:panel>
	</ui:define>
</ui:composition>
