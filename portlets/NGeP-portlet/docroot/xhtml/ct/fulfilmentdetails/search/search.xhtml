<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<ui:define name="contentSection">
    <style>
      .column-align-center { text-align: center !important;}
    </style>
     <p:panel id="searchId" header="#{lbl['lbl.ct.search.panel.name']}" toggleable="true"  toggleSpeed="500">
        <h:panelGrid columns="4" style="width:100%;">
           <h:outputLabel value="#{lbl['lbl.ct.search.cno']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctNumber}"  style="width:170px;"/>
           <h:outputLabel value="#{lbl['lbl.ct.search.cname']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctName}"  style="width:170px;"/>
           <h:outputLabel value="#{lbl['lbl.ct.search.clno']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctCircularNo}" style="width:170px;" />
           <h:outputLabel value="#{lbl['lbl.ct.search.clname']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctCircularName}"  style="width:170px;"/>
           <h:outputLabel value="#{lbl['lbl.ct.search.sid']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctSupplierId}" style="width:170px;"/>
           <h:outputLabel value="#{lbl['lbl.ct.search.sname']}"/>
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctSupplierName}" style="width:170px;"/> 
           <h:outputLabel value="#{lbl['lbl.ct.search.cstart']}"/>
           <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.managedBean.ctDateStart}" id="popupButtonCal" showOn="button" />
           <h:outputLabel value="#{lbl['lbl.ct.search.cend']}" />
           <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.managedBean.ctDateEnd}" id="popupButtonCal1" showOn="button" />
           <h:outputLabel value="#{lbl['lbl.ct.search.lno']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctLOANo}" style="width:170px;"/>
                                
           <p:outputLabel value="#{lbl['lbl.ct.search.pno']}" />
           <p:inputText id="productCode" value="#{contractDetailsBackingBean.managedBean.ctPhysicalNo}"  style="width:170px;" />
				<p:outputLabel for="status" value="#{lbl['lbl.ct.search.status']}" />
				<p:selectOneMenu id="status" value="#{contractDetailsBackingBean.managedBean.ctContractStatus}"	style="width:200px;">
					<f:selectItems value="#{contractDetailsBackingBean.getSearchStatusDropdown()}" />
				</p:selectOneMenu>
			</h:panelGrid>
		  <div class="ppRightBtn"> 
              <p:commandButton value="#{lbl['lbl.ct.search.btn.search']}" action="#{contractDetailsBackingBean.searchContract}" icon="ui-icon-search"  update="dataTable"/>
              <p:commandButton value="#{lbl['lbl.ct.search.btn.reset']}"  process="@this" icon="ui-icon-reset"  update="dataTable"/>
		  </div>	
	  </p:panel>
		<p:panel id="searchResulId"	header="#{lbl['lbl.ct.search.panel.result']}" toggleable="true"	toggleSpeed="500">
			<div style="overflow-x: auto">
				<p:dataTable id="dataTable" var="data" rowIndexVar="index" rowKey="#{data}" lazy="true"
					value="#{contractDetailsBackingBean.managedBean.contractList}" >
					<ac:paginator for="dataTable" />
					<p:column headerText="#{lbl['lbl.ct.search.cno']}">
						<h:outputText value="#{data.contractNo}" />
					</p:column>					
					<p:column headerText="#{lbl['lbl.ct.search.table.cname']}">
						<h:outputText value="#{data.contractName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.clno']}">
						<h:outputText value="#{data.circular.latestCircularVer.circularNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.table.sname']}">
						<h:outputText value="#{data.smSupplier.companyName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.table.cstart']}">
						<h:outputText value="#{data.currentContractVer.ctContractValue.effDate}">
							<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.table.cend']}">
						<h:outputText value="#{data.currentContractVer.ctContractValue.expDate}">
							<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.lno']}">
						<h:outputText value="#{data.loaNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.table.status']}">
						<h:outputText value="#{contractDetailsBackingBean.getStatusDescById(data.currentContractVer.status.statusId)}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.table.action']}">
						<p:commandLink action="#{contractDetailsBackingBean.gotoSuspendPage}" rendered="#{data.currentContractVer.status.statusId==CtStatusConst.approved}" >
							<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.ctContract}" value="#{data}" />
							<p:graphicImage library="ep/images/design" name="pause.png"
								value="/resources/ep/images/design/pause.png" title="Suspend Contract" />
						</p:commandLink>
						<p:spacer width="7" rendered="#{data.currentContractVer.status.statusId==CtStatusConst.approved}" />
						<p:commandLink action="#{contractDetailsBackingBean.gotoTerminatePage}" rendered="#{data.currentContractVer.status.statusId==CtStatusConst.approved}" >
							<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.ctContract}" value="#{data}" />
							<p:graphicImage library="ep/images/design" name="terminate.png"
								value="/resources/ep/images/design/terminate.png" title="Termination" />
						</p:commandLink>
						<p:spacer width="7" rendered="#{data.currentContractVer.status.statusId==CtStatusConst.approved}" />
						<p:commandLink action="#{contractDetailsBackingBean.gotoAmendPage}" rendered="#{data.currentContractVer.status.statusId==CtStatusConst.approved}" >
							<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.ctContract}" value="#{data}" />
							<p:graphicImage library="ep/images/design" name="revise.png"
								value="/resources/ep/images/design/revise.png" title="Amendment" />
						</p:commandLink>
						<p:spacer width="7" rendered="#{data.currentContractVer.status.statusId==CtStatusConst.approved}" />
						<p:commandLink action="#{contractDetailsBackingBean.gotoViewPage}">
							<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.ctContract}" value="#{data}" />
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/resources/ep/images/design/document.png" title="View Agreement" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</div>
		</p:panel>
	</ui:define>
</ui:composition>
