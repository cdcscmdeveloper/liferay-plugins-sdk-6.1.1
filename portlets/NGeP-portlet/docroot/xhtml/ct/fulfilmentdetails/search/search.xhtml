<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<ui:define name="contentSection">
    <style>
      .column-align-center { text-align: center !important;}
    </style>
     <p:panel id="searchId" header="#{lbl['lbl.ct.search.panel.name']}" toggleable="true"  toggleSpeed="500">
     	<h:panelGrid columns="4" style="width:100%;">
           <p:outputLabel value="#{lbl['lbl.ct.search.cno']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctNumber}"  style="width:170px;"/>
           <p:outputLabel value="#{lbl['lbl.ct.search.cname']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctName}"  style="width:170px;"/>
           <p:outputLabel value="#{lbl['lbl.ct.search.clno']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctCircularNo}" style="width:170px;" />
           <p:outputLabel value="#{lbl['lbl.ct.search.clname']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctCircularName}"  style="width:170px;"/>
           <p:outputLabel value="#{lbl['lbl.ct.search.sid']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctSupplierId}" style="width:170px;"/>
           <p:outputLabel value="#{lbl['lbl.ct.search.sname']}"/>
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctSupplierName}" style="width:170px;"/> 
           <p:outputLabel value="#{lbl['lbl.ct.search.cstart']}"/>
           <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.managedBean.ctDateStart}" 
            pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonCal" showOn="button" />
           <p:outputLabel value="#{lbl['lbl.ct.search.cend']}" />
           <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.managedBean.ctDateEnd}" id="popupButtonCal1" 
             pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"  showOn="button" />
           <p:outputLabel value="#{lbl['lbl.ct.search.lno']}" />
           <p:inputText value="#{contractDetailsBackingBean.managedBean.ctLOANo}" style="width:170px;"/>                     
           <p:outputLabel value="#{lbl['lbl.ct.search.pno']}" />
           <p:inputText id="productCode" value="#{contractDetailsBackingBean.managedBean.ctPhysicalNo}"  style="width:170px;" />
		   <p:outputLabel for="status" value="#{lbl['lbl.ct.search.status']}" />
		   <p:selectOneMenu id="status" value="#{contractDetailsBackingBean.managedBean.ctContractStatus}"	style="width:200px;">
				<f:selectItems value="#{contractDetailsBackingBean.getSearchStatusDropdown()}" />
		   </p:selectOneMenu>
		   <p:outputLabel value="#{lbl['lbl.ct.search.ttype']}" />
		   <p:selectOneMenu id="terminationType" value="#{contractDetailsBackingBean.managedBean.terminationTypeId}" style="width:200px;">
		   		<f:selectItems value="#{contractDetailsBackingBean.getDropdownValues(ParameterTypeConst.terminationDecisionType)}" />
		   </p:selectOneMenu>
		</h:panelGrid>
	  	<div class="ppRightBtn"> 
        	<p:commandButton value="#{lbl['lbl.ct.search.btn.search']}" action="#{contractDetailsBackingBean.searchContract}" icon="ui-icon-search"   update="dataTable"/>
             <p:commandButton value="#{lbl['lbl.ct.search.btn.reset']}" action="#{contractDetailsBackingBean.searchReset}" icon="ui-icon-search"   update=":form"/>
	  	</div>	
	  </p:panel>
		<p:panel id="searchResulId"	header="#{lbl['lbl.ct.search.panel.result']}" toggleable="true"	toggleSpeed="500">
			<div style="overflow-x: auto">
				<p:dataTable id="dataTable" var="data" rowIndexVar="index" rowKey="#{data}" lazy="true"
					value="#{contractDetailsBackingBean.managedBean.contractList}" >
					<ac:paginator for="dataTable" />
					<p:column headerText="#{lbl['lbl.ct.search.cno']}" style="width:10%;">
						<h:outputText value="#{data.contractNo}" />
					</p:column>					
					<p:column headerText="#{lbl['lbl.ct.search.table.cname']}"  style="width:15%;">
						<h:outputText value="#{data.contractName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.clno']}"  style="width:10%;">
						<h:outputText value="#{data.circularNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.table.sname']}"  style="width:15%;">
						<h:outputText value="#{data.companyName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.table.cstart']}"  style="width:8%;">
						<h:outputText value="#{data.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.table.cend']}"  style="width:8%;">
						<h:outputText value="#{data.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.lno']}"  style="width:10%;">
						<h:outputText value="#{data.loaPhysicalNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.table.status']}"  style="width:12%;">
						<h:outputText value="#{contractDetailsBackingBean.chkContractStatusType(data.status)}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.search.table.action']}"  style="width:12%;">
					   <p:commandLink action="#{contractDetailsBackingBean.gotoSuspendPage}" 
					   	 rendered="#{data.fdStatus == 1}" >
						 <f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.ctContract}" value="#{data.ctContract}" />
						 <p:graphicImage library="ep/images/design" name="pause.png"
						  value="/resources/ep/images/design/pause.png" title="#{lbl['lbl.ct.search.susContract']}" />
					   </p:commandLink>
					   <p:spacer width="5" rendered="#{data.fdStatus == 1}" />
					   <p:commandLink action="#{contractDetailsBackingBean.gotoTerminatePage}"
					   	 rendered="#{data.fdStatus == 1}" >
						 <f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.ctContract}" value="#{data.ctContract}" />
						 <p:graphicImage library="ep/images/design" name="terminate.png"
						  value="/resources/ep/images/design/terminate.png" title="#{lbl['lbl.ct.search.terminate']}" />
					   </p:commandLink>
					   <p:spacer width="5" rendered="#{data.fdStatus == 1}" />
					   <p:commandLink action="#{contractDetailsBackingBean.gotoAmendPage}" 
					      rendered="#{data.fdStatus == 1}" >
						 <f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.ctContract}" value="#{data.ctContract}" />
						 <p:graphicImage library="ep/images/design" name="revise.png"
						   value="/resources/ep/images/design/revise.png" title="#{lbl['lbl.ct.search.amd']}" />
					   </p:commandLink>
					   <p:spacer width="5" rendered="#{data.fdStatus == 1}" />
					   <p:commandLink action="#{contractDetailsBackingBean.gotoUpdatePage}"
					     rendered="#{data.fdStatus == 1}" >
						 <f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.ctContract}" value="#{data.ctContract}" />
						 <p:graphicImage library="ep/images/design" name="evaluate.png"
						   value="/resources/ep/images/design/evaluate.png" title="#{lbl['lbl.ct.search.update']}" />
					   </p:commandLink>						
					   <p:spacer width="5" rendered="#{data.fdStatus == 1}" />
					   <p:commandLink action="#{contractDetailsBackingBean.gotoViewPage}">
						 <f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.ctContract}" value="#{data.ctContract}" />
						 <p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png" title="#{lbl['lbl.ct.search.viewCt']}" />
					   </p:commandLink>
					   <p:spacer width="5" rendered="#{data.terminate or data.mutualTerminate or data.remedy}" />
					   <p:commandLink action="#{contractDetailsBackingBean.gotoTerminateHistoryPage}" 
					     rendered="#{data.terminate or data.mutualTerminate or data.remedy}" >
						 <f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.ctContract}" value="#{data.ctContract}" />
						 <p:graphicImage library="ep/images/design" name="history_frame.png"
							value="/resources/ep/images/design/history_frame.png" title="#{lbl['lbl.ct.search.viewHistory']}" />
					   </p:commandLink>
					</p:column>
				</p:dataTable>
			</div>
		</p:panel>
	</ui:define>
</ui:composition>
