<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="itemId" header="Item Details" toggleable="true"
		toggleSpeed="500">

		<h:panelGrid columns="2" style="height:50px;text-align:bottom;">
			<h:outputLabel for="itemTypes" value="Item Type" style="width:50px;" />
			<p:selectOneMenu id="itemTypes" disabled="false"
				value="#{amendmentBackingBean.managedBean.itemType}"
				style="width:200px;">
				<f:selectItems value="#{amendmentBackingBean.itemTypeDropDown}" />
				<p:ajax event="change" update="changeItemType"
					listener="#{amendmentBackingBean.changeItemTypes}" process="@this" />
			</p:selectOneMenu>
		</h:panelGrid>

		<p:outputPanel id="changeItemType">
			<p:dataTable id="itemTable" var="data"
				value="#{amendmentBackingBean.contractItemList}" rowKey="#{data}"
				selectionMode="single"
				selection="#{amendmentBackingBean.managedBean.selectedItem}">
				<ac:paginator for="itemTable" />
				<p:ajax event="rowSelect" update=":form:tabview:changeField" />
				<p:column headerText="Item Name">
					<p:outputLabel value="#{data.itemName}" style="float:left;" />
				</p:column>
				<p:column headerText="UOM">
					<p:outputLabel value="#{data.uom.uomName}" style="float:left;" />
				</p:column>
				<p:column headerText="Minimum Order Qty." style="text-align: right;">
					<p:outputLabel value="#{data.minimumOrderQty}" />
				</p:column>
				<p:column headerText="Maximum Qty." style="text-align: right;"
					rendered="#{amendmentBackingBean.managedBean.productItem}">
					<p:outputLabel value="#{data.maxProcureAmount}" />
				</p:column>
				<p:column headerText="Type Of Goods"
					rendered="#{amendmentBackingBean.managedBean.productItem}">
					<p:outputLabel
						value="#{amendmentBackingBean.getParameterDesc(data.itemOrigin)}"
						style="float:left;" />
				</p:column>
				<p:column headerText="UOM Per Month"
					rendered="#{amendmentBackingBean.managedBean.serviceItem}">
					<p:outputLabel value="#{data.uomPerMonth}" />
				</p:column>
			</p:dataTable>
			<p:outputPanel id="changeField">
				<p:spacer height="20" />
				<h:panelGrid columns="2" style="height:50px;text-align:bottom;"
					rendered="#{amendmentBackingBean.managedBean.productItem and amendmentBackingBean.managedBean.selectedItem!=null}">
					<h:outputLabel for="show" value="Show" style="width:50px;" />
					<p:selectOneMenu id="show"
						value="#{amendmentBackingBean.managedBean.showItem}"
						style="width:200px;">
						<f:selectItems
							value="#{amendmentBackingBean.getDropdownCodeValues(ParameterTypeConst.itemDisplayType)}" />
						<p:ajax event="change" update="changeField" process="@this" />
					</p:selectOneMenu>
				</h:panelGrid>
				<p:outputPanel columns="1" style="width:100%"
					rendered="#{((amendmentBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypePrice) or amendmentBackingBean.managedBean.serviceItem) and amendmentBackingBean.managedBean.selectedItem!=null}">
					<p:dataTable id="itemPriceTable" var="data"
						value="#{amendmentBackingBean.managedBean.selectedItem.ctItemPrices}"
						rowKey="#{data}">
						<ac:paginator for="itemPriceTable" />
						<p:column headerText="Zone">
							<p:outputLabel value="#{data.ctContractZone.zoneName}"
								style="float:left;" />
						</p:column>
						<p:column headerText="From Qty." style="text-align: right;"
							rendered="#{amendmentBackingBean.managedBean.productItem}">
							<p:outputLabel value="#{data.tierFrom}" />
						</p:column>
						<p:column headerText="To Qty." style="text-align: right;"
							rendered="#{amendmentBackingBean.managedBean.productItem}">
							<p:outputLabel value="#{data.tierTo}" />
						</p:column>
						<p:column headerText="Price (MYR)" style="text-align: right;">
							<p:outputLabel value="#{data.unitPrice}" />
						</p:column>
						<p:column headerText="Effective Date">
							<p:calendar style="width:130px;" value="#{data.effDate}"
								pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true" />
						</p:column>
						<p:column headerText="Expiry Date">
							<p:calendar style="width:130px;" value="#{data.expDate}"
								pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true" />
						</p:column>
					</p:dataTable>
				</p:outputPanel>
				<h:panelGrid columns="1" style="width:100%"
					rendered="#{(amendmentBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypeCeilQty) and amendmentBackingBean.managedBean.productItem}">
					<p:dataTable id="ceilingTable" var="data"
						value="#{amendmentBackingBean.managedBean.selectedItem.ctItemCeilingQties}"
						rowKey="#{data}">
						<ac:paginator for="ceilingTable" />
						<p:column headerText="Ministry Name">
							<p:outputLabel
								value="#{data.ctAgency.orgProfile.parentOrgProfile.orgName}"
								style="float:left;" />
						</p:column>
						<p:column headerText="PTJ Name">
							<p:outputLabel value="#{data.ctAgency.orgProfile.orgName}"
								style="float:left;" />
						</p:column>
						<p:column headerText="Ceiling Quantity" style="text-align: right;">
							<p:inputText style="width:70px;" value="#{data.ceilingQuantity}" />
						</p:column>
						<p:column headerText="Effective Date">
							<p:calendar style="width:130px;" value="#{data.effDate}"
								pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true" />
						</p:column>
						<p:column headerText="Expiry Date">
							<p:calendar style="width:130px;" value="#{data.expDate}"
								pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true" />
						</p:column>
					</p:dataTable>
				</h:panelGrid>
			</p:outputPanel>
		</p:outputPanel>
	</p:panel>
		
</ui:composition>
