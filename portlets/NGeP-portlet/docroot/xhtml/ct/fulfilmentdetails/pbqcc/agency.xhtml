<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="agencyId" header="#{lbl['lbl.ct.agn.panel.name']}"	toggleable="true" toggleSpeed="500">
		<div style="overflow-x: auto">
			<p:dataTable id="tableAgencyDetails" var="data"
				value="#{amendmentBackingBean.managedBean.contractVer.ctAgencies}"  rowKey="#{data}" >
				<ac:paginator for="tableAgencyDetails" />
				<p:column selectionMode="multiple" style="width:18px;" />
				<p:column headerText="#{lbl['lbl.ct.ministry']}">
					<h:outputText
						value="#{data.orgProfile.parentOrgProfile.orgCode} - #{data.orgProfile.parentOrgProfile.orgName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.agn.ptj']}">
					<h:outputText
						value="#{data.orgProfile.orgCode} - #{data.orgProfile.orgName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.agn.tree.ptj.amount']}"
					style="width:130px;">
					<p:inputText value="#{data.ceilingAmount}" styleClass="ppRightBtn"
						style="width:120px;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
				</p:column>
			</p:dataTable>
		</div>
	</p:panel>
</ui:composition>
