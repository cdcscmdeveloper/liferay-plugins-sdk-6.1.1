<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel id="amend" header="#{lbl['lbl.ct.amend.panel.header']}" toggleable="true" toggleSpeed="500">	
	<h:panelGrid columns="2" style="width:100%" columnClasses="columnWidth15">
	     <f:verbatim/>
	     <h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" >
					 <p:ajax event="change" update=":form:tabview" action="#{amendmentBackingBean.ChkAmendmentAction}" process="@this"/> 
					</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				
				<p:outputLabel value="Contract extension" />
			</h:panelGrid>
			<f:verbatim/>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.priceChange}" >
					 <p:ajax event="change" update=":form:tabview" listener="#{amendmentBackingBean.ChkAmendmentAction}" process="@this"/> 
					 </p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value="Change item price" />
			</h:panelGrid>
			<f:verbatim/>
		    <h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.quantityChange}" >
					<p:ajax event="change" update=":form:tabview" listener="#{amendmentBackingBean.ChkAmendmentAction}" process="@this"/> 
					</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value="Change quantity" />
			</h:panelGrid>
			<f:verbatim/>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange}"  >
					<p:ajax event="change" update=":form:tabview" listener="#{amendmentBackingBean.ChkAmendmentAction}" process="@this"/> 
					</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value="Change contract value" />
			</h:panelGrid>
			<f:verbatim/>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.clauseChange}" >
					<p:ajax event="change" update=":form:tabview" listener="#{amendmentBackingBean.ChkAmendmentAction}" process="@this"/> 
				</p:selectBooleanCheckbox>
				<p:spacer width="2" />
				<p:outputLabel value="Change clause"  />
			</h:panelGrid>
	     </h:panelGrid>
	    <h:panelGrid columns="4" style="width:75%" columnClasses="columnWidth20">
	      <p:outputLabel for="txtname" value="#{lbl['lbl.ct.amend.txt.name']}" />
	      <p:inputText id="txtname" style="width:170px;"
				value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.title}"  />
		      <p:outputLabel for="txtfrno" value="#{lbl['lbl.ct.amend.txt.frno']}" /> 
		      <p:inputText id="txtfrno"
				value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.fileRefNo}"
				style="width:150px;"/>
				
	 </h:panelGrid>
	  <h:panelGrid columns="3" style="width:100%" columnClasses="columnWidth15">
	     <h:panelGroup>
				 <div style="height:70px;width:115px; float:right; vertical-align: top;">
					<p:outputLabel for="txtdesc" value="#{lbl['lbl.ct.amend.txt.desc']}"  /></div>
			  </h:panelGroup>
		   <h:panelGrid>
				<h:inputTextarea id="txtdesc" rows="5" cols="100"
					value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.description}"  />
			  </h:panelGrid>
			  
		   </h:panelGrid>
	    <h:panelGrid columns="4" style="width:75%" columnClasses="columnWidth20">
	     <p:outputLabel value="#{lbl['lbl.ct.amend.txt.effdate']}" />
		 <p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				value="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.amendmentEffDate}"
				id="edateCal" showOn="button" /> 
		 <h:outputLabel value="#{lbl['lbl.ct.amend.txt.ceperiod']}" rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" />
		 <h:panelGrid columns="3" rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}">
				<p:inputText id="ceperiod" style="width:65px;" />
				<p:spacer width="1" />
				<p:outputLabel value="Months" /> 
			 </h:panelGrid>

		   <p:outputLabel value="#{lbl['lbl.ct.amend.txt.cestart']}" 
		     rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" />	
		   <p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.effDate}"
				id="efdateCal" showOn="button"
			    rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" /> 
		     <p:outputLabel value="#{lbl['lbl.ct.amend.txt.ceend']}" 
		      rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" /> 
		  <p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.expDate}"
				id="exdateCal" showOn="button" 
				rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.contractExtend}" />

		 <p:outputLabel value="#{lbl['lbl.ct.amend.txt.avalue']}" 
		   rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange}" />
		 <p:inputText style="width:150px;" value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.additionalAmount}"
		     rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange}" styleClass="ppRightBtn" >    
		      <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		  </p:inputText>
		 <p:outputLabel value="Contract Value"
		    rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange}" />
		 <p:inputText id="addValue" value="#{amendmentBackingBean.managedBean.contractVer.ctContractValue.contractAmount}" styleClass="ppRightBtn"
		   rendered="#{amendmentBackingBean.managedBean.contractVer.ctAmendment.valueChange}" style="width:150px;" disabled="true">
		   <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText>
		 
	   </h:panelGrid>
	   <h:panelGrid columns="2" style="width:100%"
			columnClasses="columnWidth15">
			<h:panelGroup>
				<div style="height: 35px; vertical-align: top">
					<p:outputLabel for="contractHistory"
						value="#{lbl['lbl.ct.amend.txt.history']}" style="text-align:right;" />
				</div>
			</h:panelGroup>
			<h:panelGrid id="contractHistory" columns="1">
				<p:dataTable id="dataTableHistory" var="data" value=" "
					rowIndexVar="index">
					<p:columnGroup type="header">
						<p:row>
							<p:column headerText="#{lbl['lbl.ct.amend.tbl.rno']}" />
							<p:column headerText="#{lbl['lbl.ct.amend.tbl.eperiod']}" />
							<p:column headerText="#{lbl['lbl.ct.amend.tbl.sdate']}" />
							<p:column headerText="#{lbl['lbl.ct.amend.tbl.edate']}" />
						</p:row>
					</p:columnGroup>
					<p:column>
						<h:outputText />
					</p:column>
					<p:column>
						<h:outputText />
					</p:column>
					<p:column>
						<h:outputText />
					</p:column>
					<p:column>
						<h:outputText />
					</p:column>
				</p:dataTable>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
</ui:composition>
