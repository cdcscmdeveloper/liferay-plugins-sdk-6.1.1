<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	  <style>
      .column-align-center { text-align: center !important;}
    </style> 
	
	<c:if test='#{contractDetailsBackingBean.managedBean.chkRenderPage eq  "BPM"}'>
     <f:event listener="#{contractDetailsBackingBean.preRenderView}" type="preRenderView" />
	</c:if>
	 <p:panel rendered="#{!contractDetailsBackingBean.managedBean.amendDisable or contractDetailsBackingBean.managedBean.amendAckw}">
	  <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
	 <div class="ppRightBtn"> 
	     <ui:repeat var="outcome" value="#{contractDetailsBackingBean.managedBean.action}">
			<p:commandButton value="#{outcome}" process="@this"  action="#{contractDetailsBackingBean.saveContract(outcome)}" />
		 </ui:repeat>		
    </div>
	</p:panel>
	<p:tabView id="tabview" value="Termination" dynamic="true" orientation="left" >
	   <p:tab title="#{lbl['lbl.ct.menu.fd']}" >
	     <ui:include src="/xhtml/ct/fulfilmentdetails/shared/fulfilment.xhtml"/>
	     <ui:include src="/xhtml/ct/fulfilmentdetails/shared/quotationTender.xhtml" />
         <ui:include src="/xhtml/ct/fulfilmentdetails/amendment/amendment.xhtml"/>
         <ui:include src="/xhtml/ct/fulfilmentdetails/shared/supplier.xhtml"/>                 
         <ui:include src="/xhtml/ct/fulfilmentdetails/shared/factoring.xhtml"/>     
         <ui:include src="/xhtml/ct/fulfilmentdetails/amendment/bond.xhtml"/>                      
      </p:tab>
       <p:tab title="Meeting Details" rendered="#{!contractDetailsBackingBean.managedBean.amendDisable}">
         <ui:include src="meeting.xhtml"/>
       </p:tab>  
        <p:tab title="Approval Letter" rendered="#{contractDetailsBackingBean.managedBean.amendDisable}">
         <ui:include src="approvalLetter.xhtml"/>
       </p:tab>  
       <p:tab title="#{lbl['lbl.ct.menu.agency']}" >
         <ui:include src="/xhtml/ct/fulfilmentdetails/shared/agency.xhtml"/>
       </p:tab> 
	   <p:tab title="#{lbl['lbl.ct.menu.item']}">
         <ui:include src="/xhtml/ct/fulfilmentdetails/amendment/item.xhtml"/>
       </p:tab>  
     <p:tab title="#{lbl['lbl.ct.menu.remark']}">
         <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />   
     </p:tab> 
	</p:tabView>
   </ui:define>  
</ui:composition>
