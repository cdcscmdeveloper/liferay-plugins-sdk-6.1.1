<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	  <style>
      .column-align-center { text-align: center !important;}
    </style> 
     <f:event listener="#{amendmentBackingBean.preRenderView}" type="preRenderView" />
	 <p:panel rendered="#{amendmentBackingBean.managedBean.amendAckw}">
	  <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
			<table style="width: 100%;">
				<tr>
					<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" /></td>
					<td class="ppRightBtn">
						<ui:repeat var="outcome" value="#{amendmentBackingBean.managedBean.action}">
							<p:commandButton value="#{outcome}" process="@form" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(outcome)}"
								action="#{amendmentBackingBean.saveContractAmendment(outcome)}" />
						</ui:repeat>
					</td>
				</tr>
			</table>    
			<table style="width: 99%; margin-left: 25px;">
				<tr style="margin-button: 10px;">
					<td>
						<h6 style="color: blue;">
							<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
						</h6>
					</td>
					<td>
						<h6>
							<p:inputText size="20" disabled="true"
								value="#{amendmentBackingBean.managedBean.contractVer.ctContract.contractNo}"  />
						</h6>
					</td>
					<td>
						<h6 style="color: blue;">
							<p:outputLabel value="Request No." />
						</h6>
					</td>
					<td>
						<h6>
							<p:inputText size="25" disabled="true"
								value="#{amendmentBackingBean.managedBean.contractVer.docNo == null ? '-- System Generated --':amendmentBackingBean.managedBean.contractVer.docNo}" />
						</h6>
					</td>										
					<td>
						<h6 style="color: blue;">
							<p:outputLabel value="Status" />
						</h6>
					</td>
					<td>
						<h6>
							<p:inputText size="20" disabled="true"
								value="#{amendmentBackingBean.getStatusDescById(amendmentBackingBean.managedBean.contractVer.status.statusId)}" />
						</h6>
					</td>
				</tr>
			</table>	 			
	</p:panel>
	<p:tabView id="tabview" value="Termination" dynamic="true" orientation="left" >
	   <p:tab title="#{lbl['lbl.ct.menu.fd']}" >
	     <ui:include src="/xhtml/ct/fulfilmentdetails/amendment/contractDetails.xhtml"/>
	     <ui:include src="/xhtml/ct/fulfilmentdetails/amendment/amendment.xhtml"/>
	     <ui:include src="ptjDetails.xhtml"/>
         <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml"/>                                     
      </p:tab>
       <p:tab title="Meeting Details" rendered="#{amendmentBackingBean.managedBean.amendDisable}">
         <ui:include src="meeting.xhtml"/>
       </p:tab>  
        <p:tab title="Approval Letter" rendered="#{amendmentBackingBean.managedBean.approvrLetter}">
         <ui:include src="approvalLetter.xhtml"/>
       </p:tab>  
       <p:tab title="#{lbl['lbl.ct.menu.agency']}" >
         <ui:include src="agency.xhtml"/>
       </p:tab> 
	   <p:tab title="#{lbl['lbl.ct.menu.item']}">
         <ui:include src="item.xhtml"/>
       </p:tab>  
	</p:tabView>
   </ui:define>  
</ui:composition>
