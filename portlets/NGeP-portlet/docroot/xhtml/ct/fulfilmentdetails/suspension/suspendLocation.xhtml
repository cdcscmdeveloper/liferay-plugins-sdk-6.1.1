<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="locationId" header="Agency Details"   toggleable="true"  toggleSpeed="500" widgetVar="panellocation">
      <p:dataTable id="locationTable" var="data"  value="#{contractSuspendBackingBean.managedBean.ctSuspendLoc}" rowIndexVar="index" widgetVar="dataTableObj"
	      lazy="false" paginator="true"  paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
		 <ac:paginator for="locationTable"/>
		  <p:columnGroup type="header"> 
		  <p:row> 
			<p:column rowspan="1" headerText="Location"  />
			<p:column rowspan="1" headerText="Effective Date" /> 	
			<p:column rowspan="1" headerText="Expiry Date" /> 		
			<p:column rowspan="1" headerText="Action" /> 			
		 </p:row>							
		 </p:columnGroup>
		    <p:column> <h:outputText value="Zone Tengah" style="float:left;" />   </p:column> 
			<p:column width="100"> <p:calendar value="#{data.suspendFrom}" id="calloc1" showOn="button"/>  	</p:column> 
			<p:column width="100" > <p:calendar value="#{data.suspendTo}" id="calloc2" showOn="button"/>  	</p:column> 
			<p:column> <p:selectOneMenu disabled="false" style="width:110px;">
				<f:selectItem itemLabel="-Select One-" itemValue="" />	
				<f:selectItem itemLabel="Active" itemValue="Active" />	
				<f:selectItem itemLabel="Suspend" itemValue="Suspend" />	
				<f:selectItem itemLabel="Extend" itemValue="Extend" />			
			</p:selectOneMenu>   </p:column> 
	   </p:dataTable>	
      </p:panel>                
</ui:composition>
