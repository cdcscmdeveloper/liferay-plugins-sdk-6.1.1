<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="locationId" header="#{lbl['lbl.ct.susp.panel.agency.name']}"  toggleable="true"  toggleSpeed="500" widgetVar="panellocation">
      <p:dataTable id="locationTable" var="data"  value="#{suspensionBackingBean.managedBean.contractVer.ctAgencies}"
         lazy="false" paginator="true"  paginatorPosition="bottom" paginatorAlwaysVisible="false" emptyMessage="No Records!">
		 <ac:paginator for="locationTable"/>
		  <p:columnGroup type="header"> 
		  <p:row> 
			<p:column headerText="#{lbl['lbl.ct.susp.tbl.agency.name']}"  />
			<p:column headerText="#{lbl['lbl.ct.susp.tbl.agency.efdate']}" /> 	
			<p:column headerText="#{lbl['lbl.ct.susp.tbl.agency.expdate']}" /> 		
			<p:column headerText="#{lbl['lbl.ct.susp.tbl.agency.action']}" /> 			
		 </p:row>							
		 </p:columnGroup>
		    <p:column> <h:outputText value="Zone Tengah" style="float:left;" />   </p:column> 
			<p:column width="100"> <p:calendar value="#{data.suspendFrom}" id="calloc1" showOn="button"/>  	</p:column> 
			<p:column width="100" > <p:calendar value="#{data.suspendTo}" id="calloc2" showOn="button"/>  	</p:column> 
			<p:column>
			<p:selectOneMenu value="#{data.suspensionType.parameterId}" style="width:110px;">
				<f:selectItems value="#{suspensionBackingBean.getDropdownValues('SPT')}" />
			</p:selectOneMenu>		
			</p:column> 
	   </p:dataTable>	
      </p:panel>                
</ui:composition>
