<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	<style>
      .column-align-center { text-align: center !important;}
    </style>
    <c:if test='#{contractDetailsBackingBean.managedBean.chkRenderPage eq  "BPM"}'>
     <f:event listener="#{contractDetailsBackingBean.preRenderView}" type="preRenderView" />
	</c:if>
   
	<p:panel>
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	 <div class="ppRightBtn"> 
	  			<ui:repeat var="outcome" value="#{contractDetailsBackingBean.managedBean.action}">
					<p:commandButton value="#{outcome}" process="@this" styleClass="ui-button" action="#{contractDetailsBackingBean.saveContract(outcome)}" />
				</ui:repeat>		
    </div>
	</p:panel>
	 <p:tabView id="tabview" orientation="left" dynamic="true">
     <p:tab title="#{lbl['lbl.ct.menu.fd']}" >
            <ui:include	src="suspendDetails.xhtml" />
            <ui:include src="suspendItem.xhtml"/>
            <ui:include src="suspendLocation.xhtml"/>
            <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" /> 
       </p:tab> 
        <p:tab id="sletter" title="Suspension Letter">
           <ui:include src="suspensionLetter.xhtml"/>
       </p:tab> 
	</p:tabView>
	<script type="text/javascript"> 
	    function handleTabShow(tab) {
	    if (tab.index() == 4) {
	        editorWidgetVar.init();
	    }
	}
	</script>
    </ui:define>
</ui:composition>
