<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
		<style>
		.column-align-center {
			text-align: center !important;
		}
		.top-aligned-columns td {
			vertical-align: top;
		}
		 .calanderWidth input {
	       width:110px;margin-bottom: 5px;
	   }
		
          .columnWidth200 {
	        width: 200px;
	        vertical-align: top;
	        text-align: right;
         }
         
           .columnWidth300 {
	        width: 300px;
	        vertical-align: top;
	        text-align: right;
         }
         
            .columnWidth250 {
	        width: 250px;
         }
		</style>
		<p:panel>
			<f:event listener="#{suspensionBackingBean.preRenderView}" type="preRenderView" />
			<h:panelGroup rendered="#{suspensionBackingBean.managedBean.taskId==null}">
				<div align="left" class="screen-title" style="border-bottom: 0px">Contract Suspension</div>
			</h:panelGroup>
			<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
			<table style="width: 100%;">
				<tr>
					<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" icon="ui-icon-back" rendered="#{suspensionBackingBean.managedBean.taskId==null}" action="#{suspensionBackingBean.backAction}"/></td>
					<td class="ppRightBtn">
						<ui:repeat var="outcome" value="#{suspensionBackingBean.managedBean.action}">
							<p:commandButton value="#{outcome}" process="@form"
								styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(outcome)}"
								action="#{suspensionBackingBean.saveContractSuspension(outcome)}" />
						</ui:repeat>
					</td>
				</tr>
			</table>
			<div align="left" class="header-info">
			 <table style="width: 100%">
			<tr>
				<td style="width: 15%">
					<h:outputLabel value="#{lbl['lbl.ct.contract.no']}" />
				</td>
				<td style="width: 15%" class="header-info-text">
					#{suspensionBackingBean.managedBean.ctContract.contractNo}
				</td>
				<td style="width: 15%">
					<h:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
				</td>
				<td style="width: 25%" class="header-info-text">
					#{suspensionBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}
				</td>
				<td style="width: 10%">
					<h:outputLabel value="#{lbl['lbl.ct.status']}" />
				</td>
				<td style="width: 20%" class="header-info-text">
					#{suspensionBackingBean.getStatusDescById(suspensionBackingBean.managedBean.contractVer.status.statusId)}
				</td>
			</tr>
	      </table>
	    </div>
		</p:panel>
		<ui:include src="suspendDetails.xhtml" />
		<ui:include src="suspendItem.xhtml" />
		<p:outputPanel rendered="#{suspensionBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
			<ui:include src="suspendAgency.xhtml" />
		</p:outputPanel>
		<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
	</ui:define>
</ui:composition>
