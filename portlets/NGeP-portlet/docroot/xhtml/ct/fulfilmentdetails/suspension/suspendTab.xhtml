<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<script> $('#portlet_ctContractMaintenance_WAR_NGePportlet').find('.portlet-title-text').html('#{suspensionBackingBean.getPortletTitle()}'); </script>
		<style>
		.column-align-center {
			text-align: center !important;
		}
		.top-aligned-columns td {
			vertical-align: top;
		}
		 .calanderWidth input {
	       width:110px;margin-bottom: 5px;
	   }
		
          .columnWidth200 {
	        width: 220px;
	        vertical-align: top;
	        text-align: right;
         }
         
            .columnWidth300 {
	        width: 210px;
         }
		</style>
		   <script type="text/javascript">  
           window.addEventListener('keydown',function(e)
    		      {
    	                  if(e.keyIdentifier=='U+000A'||e.keyIdentifier=='Enter'||e.keyCode==13)
    	                       {
    	            	            e.preventDefault();return false;
    	                   }
    	        },  true);
      </script>
		<p:blockUI id="blockUiId" block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>	
		<ac:gpkiPopup textBeforeSign="#{suspensionBackingBean.managedBean.textBeforeSign}"  
						postSignAction="#{suspensionBackingBean.preSubmitContractSuspension(gpkiBackingBean.pmDigiSign)}" 
						enableAutoUpdate="#{suspensionBackingBean.enableAutoUpdate()}" />
			<f:event listener="#{suspensionBackingBean.preRenderView}" type="preRenderView" />
			<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="#{suspensionBackingBean.managedBean.autoUpdate}" closable="true" severity="error, info" />
			
			<table style="width: 100%;">
				<tr>
					<td><p:commandButton value="#{lbl['lbl.btn.back']}" 
						immediate="true" 
						rendered="#{suspensionBackingBean.managedBean.taskId==null}" 
						action="#{suspensionBackingBean.backAction}"
						onstart="blockWidget.show();" 
						oncomplete="blockWidget.hide();"/>
					</td>
					<td class="ppRightBtn">
						<c:if test="#{!suspensionBackingBean.managedBean.viewOnly}">	
						<ui:repeat var="outcome" value="#{suspensionBackingBean.managedBean.outComes}">
							<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(outcome)}" />		
							<p:commandButton value="#{lbl[buttonLabel]}" process="@form"
								update ="@form" onkeypress="if (event.keyCode == 13) { return false; }"
								styleClass="ui-button" onstart="blockWidget.show();" 
					  			oncomplete="blockWidget.hide();"  
								action="#{suspensionBackingBean.gpkiSignAction(outcome)}" />
						</ui:repeat> 
						</c:if>
					</td>
			
				</tr>
			</table>
			<div align="left" class="header-info">
			 <table style="width: 100%">
			<tr>
				<td style="width: 15%">
					<h:outputLabel value="#{lbl['lbl.ct.loa.no']}" />
				</td>
				<td style="width: 10%">					
					<p:commandLink value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.loaNo}" 
				       process="@this" partialSubmit="true" styleClass="blue_font"
				       action="#{suspensionBackingBean.goToLoaView(suspensionBackingBean.managedBean.contractVer.ctContract.loa.loaId)}"/>
				</td>
				<td style="width: 10%">
					<h:outputLabel value="#{lbl['lbl.ct.contract.no']}" />
				</td>
				<td style="width: 10%" class="header-info-text">
					#{suspensionBackingBean.managedBean.ctContract.contractNo}
				</td>
				<td style="width: 10%">
					<h:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
				</td>
				<td style="width: 25%" class="header-info-text">
					#{suspensionBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}
				</td>
				<td style="width: 5%">
					<h:outputLabel value="#{lbl['lbl.ct.status']}" />
				</td>
				<td style="width: 15%" class="header-info-text">
					#{suspensionBackingBean.getStatusDescById(suspensionBackingBean.managedBean.contractVer.status.statusId)}
				</td>
			</tr>
	      </table>
	    </div>
	    <br/>
		<ui:include src="/xhtml/ct/shared/ctHeaderDetails.xhtml" />
		<ui:include src="suspendItem.xhtml" />
		<ui:include src="suspendAgency.xhtml" />
		<ui:include src="approverSetting.xhtml" />
		<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
		<p:confirmDialog message="#{suspensionBackingBean.getCancelConfirmationContent(suspensionBackingBean.managedBean.contractVer.docType)}"
			severity="alert" widgetVar="cancelConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					partialSubmit="true" process="@this"
					action="#{suspensionBackingBean.saveContractSuspension('CANCEL')}"
					onstart="cancelConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();"   />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="cancelConfirmDlg.hide()" type="button" />
			</div>
		</p:confirmDialog>
	</ui:define>
</ui:composition>
