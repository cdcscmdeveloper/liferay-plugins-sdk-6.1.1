<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
		<style>
		.column-align-center {
			text-align: center !important;
		}
		.top-aligned-columns td {
			vertical-align: top;
		}
		#dlgDel .ui-dialog .ui-dialog-titlebar {
			display: none !important;
		}
		</style>
		<p:panel>
			<f:event listener="#{suspensionBackingBean.preRenderView}" type="preRenderView" />
			<h:panelGroup rendered="#{suspensionBackingBean.managedBean.taskId==null}">
				<div align="left" class="screen-title" style="border-bottom: 0px">Contract Suspension</div>
			</h:panelGroup>
			<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
			<table style="width: 100%;">
				<tr>
					<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" rendered="#{suspensionBackingBean.managedBean.taskId==null}" oncomplete="window.history.back();" /></td>
					<td class="ppRightBtn">
						<ui:repeat var="outcome" value="#{suspensionBackingBean.managedBean.action}">
							<p:commandButton value="#{outcome}" process="@form"
								styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(outcome)}"
								action="#{suspensionBackingBean.saveContractSuspension(outcome)}" />
						</ui:repeat>
					</td>
				</tr>
			</table>
			<table style="width: 99%; margin-left: 0px;" class="header-info">
				<tr style="margin-button: 0px;">
					<td><p:outputLabel value="#{lbl['lbl.ct.cno']}" /></td>
					<td><p:inputText size="20" disabled="true"
							value="#{suspensionBackingBean.managedBean.ctContract.contractNo}" />
					</td>
					<td><p:outputLabel value="#{lbl['lbl.ct.ptj.name']}" /></td>
					<td><p:inputText size="35" disabled="true"
							value="#{suspensionBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}" />
					</td>
					<td><p:outputLabel value="Status" /></td>
					<td><p:inputText size="30" disabled="true"
							value="#{suspensionBackingBean.getStatusDescById(suspensionBackingBean.managedBean.contractVer.status.statusId)}" />
					</td>
				</tr>
			</table>
		</p:panel>
		<ui:include src="suspendDetails.xhtml" />
		<ui:include src="suspendItem.xhtml" />
		<ui:include src="suspendAgency.xhtml" />
		<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
	</ui:define>
</ui:composition>
