<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
   <p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="5" style="width:100%" columnClasses="columnWidth15">
			<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
			<p:inputText value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}" style="width:170px;" disabled="true" />
			<p:outputLabel value="#{lbl['lbl.ct.physicalNo']}" />
			<p:inputText value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}" style="width:170px;" disabled="true"/>				
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="false" />
				<p:spacer width="2" />
				<p:outputLabel value="Concession" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.effectiveDate']}" />
			<h:inputText style="width:130px;" disabled="true"
				value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.effDate}" >
				<f:convertDateTime pattern="dd/MM/yyyy"></f:convertDateTime>
				</h:inputText>
			<h:outputLabel value="#{lbl['lbl.ct.edate']}" />
			<h:inputText style="width:130px;" disabled="true"
				value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.expDate}" >
				<f:convertDateTime pattern="dd/MM/yyyy"></f:convertDateTime>
				</h:inputText>
			
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox value="false" disabled="true" />
				<p:spacer width="2" />	
				<p:outputLabel value="Exempted" />
			</h:panelGrid>
			
		    <p:outputLabel value="#{lbl['lbl.ct.contractAmount']}" />
			<p:inputText value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				 disabled="true" style="width:130px;" styleClass="ppRightBtn">
				  <f:convertNumber pattern="#,###.00" />
				 </p:inputText>		
				<p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
		    	<p:inputText style="width:130px;" disabled="true" 
				    value="#{suspensionBackingBean.managedBean.contractVer.ctContract.loaNo}" />
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{suspensionBackingBean.managedBean.contractVer.ctContract.agreement}" disabled="true" />
				<p:spacer width="2" />	
				<p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
			</h:panelGrid>	
			 <h:outputLabel value="#{lbl['lbl.ct.dperiod']}" />
			<h:panelGrid columns="3">
				<p:inputText size="8" value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" disabled="true" />
				<p:spacer width="2"/>
				<p:outputLabel value="Days" />
			</h:panelGrid>	
			<f:verbatim></f:verbatim><f:verbatim></f:verbatim>
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{suspensionBackingBean.managedBean.contractVer.ctContract.mto}"
					disabled="true" style="text-align:top;" />
				<p:spacer width="2" />	
				<p:outputLabel value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
			</h:panelGrid>		
			 <h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="Contract Title" />
			</div>
			</h:panelGroup>
			 <h:panelGrid>
			<h:inputTextarea id="contractName"
				value="#{suspensionBackingBean.managedBean.contractVer.ctContract.contractName}"
				required="false" rows="3" cols="35" disabled="true"
				autoResize="false" />	
			</h:panelGrid>		
			<f:verbatim /><f:verbatim /> <f:verbatim /><f:verbatim /><f:verbatim />
			
			<h:outputLabel
				rendered="#{suspensionBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				value="#{lbl['lbl.ct.circularNo']}" />
			<p:commandLink
				rendered="#{suspensionBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				style="margin-right:20px;" ajax="false">
				<h:outputText
					value="#{suspensionBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo}"
					styleClass="linkcommand" />
			</p:commandLink>
		</h:panelGrid>
	</p:panel>
</ui:composition>
