<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.contract']}" toggleable="true" collapsed="false" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		   <h:panelGrid columns="4" style="width:1000px;" columnClasses="columnWidth200,columnWidth250,columnWidth300,columnWidth250">
		      <p:outputLabel id="cno" value="#{lbl['lbl.ct.contract.no']}" />
			  <p:inputText for="cno" value="#{suspensionBackingBean.managedBean.ctContract.contractNo}" 
			     disabled="true" style="width:170px;" />
			  <p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physical.no']}" />
		 	  <p:inputText for="physicalNo" value="#{suspensionBackingBean.managedBean.ctContract.contractPhysicalNo}" style="width:170px;" disabled="true" />				
		      <p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effective.date']}" />
			  <p:inputText for="effectiveDate" style="width:170px;" disabled="true"
				value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.effDate}">
				<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
			  </p:inputText>
			  <p:outputLabel id="edate" value="#{lbl['lbl.ct.expiry.date']}" />
			  <p:inputText for="edate" style="width:170px;" disabled="true"
				value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.expDate}">
				<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
			  </p:inputText>
			  <p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contract.amount']}" />
			  <p:inputText for="contractAmount" styleClass="ppRightBtn" value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				 disabled="true" style="width:170px;">
				   <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>	
			<p:outputLabel id="signBy" value="#{lbl['lbl.ct.signed.date']}"  rendered="#{suspensionBackingBean.managedBean.ctContract.agreement}" />
			<p:inputText for="signBy" value="#{suspensionBackingBean.managedBean.ctContract.currentAgreement.signedDate}"
			   rendered="#{suspensionBackingBean.managedBean.ctContract.agreement}" disabled="true" style="width:170px;">
			   <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
			</p:inputText>
			<h:outputLabel id="dperiod" value="#{lbl['lbl.ct.delivery.period']}" rendered="#{!suspensionBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:panelGrid columns="3" rendered="#{!suspensionBackingBean.managedBean.ctContract.zonalPricing}">
				<p:inputText for="dperiod" styleClass="ppRightBtn" style="width:65px;" disabled="true" 
				   value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" />
				<p:spacer width="2"/>
				<p:selectOneMenu  style="width:100px;"  disabled="true" 
				   value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.deliveryTermUom.parameterId}">
			       <f:selectItems value="#{suspensionBackingBean.getDropdownValues(ParameterTypeConst.deliveryTerm)}" />
			   </p:selectOneMenu>
			</h:panelGrid>	
			<f:verbatim rendered="#{suspensionBackingBean.managedBean.ctContract.zonalPricing and !suspensionBackingBean.managedBean.ctContract.agreement}"/>
			<f:verbatim rendered="#{suspensionBackingBean.managedBean.ctContract.zonalPricing and !suspensionBackingBean.managedBean.ctContract.agreement}"/>
			 <p:outputLabel id="astatus" value="#{lbl['lbl.ct.agreement.status']}" 
				rendered="#{suspensionBackingBean.managedBean.ctContract.agreement and 
			    			suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
							suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
							!suspensionBackingBean.managedBean.ctContract.zonalPricing}" />
			 <p:inputText for="astatus" style="width:170px;" disabled="true"
			   	value="#{suspensionBackingBean.getStatusDescById(suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}"
			    rendered="#{suspensionBackingBean.managedBean.ctContract.agreement and 
			    			suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
							suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
							!suspensionBackingBean.managedBean.ctContract.zonalPricing}" />
			 <p:outputLabel id="agreement" value="#{lbl['lbl.ct.agreement']}"
			 	rendered="#{suspensionBackingBean.managedBean.ctContract.agreement and 
							(suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
							suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
							!suspensionBackingBean.managedBean.ctContract.zonalPricing}" />
			 <h:commandLink for="agreement" value="#{suspensionBackingBean.managedBean.ctContract.currentAgreement.fileName}" styleClass="blue_font" 
				rendered="#{suspensionBackingBean.managedBean.ctContract.agreement and 
							(suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
							suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
							!suspensionBackingBean.managedBean.ctContract.zonalPricing}"
				action="#{suspensionBackingBean.downloadFile(suspensionBackingBean.managedBean.ctContract.currentAgreement.filePath,
							suspensionBackingBean.managedBean.ctContract.currentAgreement.fileName)}" />
			<h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="#{lbl['lbl.ct.contract.title']}" />
			</div>
			</h:panelGroup>
		    <h:panelGrid>
			<p:inputTextarea id="contractName"
				value="#{suspensionBackingBean.managedBean.ctContract.contractName}"
				rows="3" style="width:170px;margin-bottom: 5px;" disabled="true"
				autoResize="false" />	
			</h:panelGrid>	
			<p:outputLabel id="astatus1" value="#{lbl['lbl.ct.agreement.status']}" 
				rendered="#{suspensionBackingBean.managedBean.ctContract.agreement and
			 				suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
							suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
			 				suspensionBackingBean.managedBean.ctContract.zonalPricing}" />
			<p:inputText for="astatus1" style="width:170px;" disabled="true" 
			  	value="#{suspensionBackingBean.getStatusDescById(suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}"
			 	rendered="#{suspensionBackingBean.managedBean.ctContract.agreement and
			 				suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
							suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
			 				suspensionBackingBean.managedBean.ctContract.zonalPricing}" />
			 <p:outputLabel id="agreement1" value="#{lbl['lbl.ct.agreement']}"
			 	rendered="#{suspensionBackingBean.managedBean.ctContract.agreement and 
							(suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
							suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
							suspensionBackingBean.managedBean.ctContract.zonalPricing}" />
			 <h:commandLink for="agreement1" value="#{suspensionBackingBean.managedBean.ctContract.currentAgreement.fileName}" styleClass="blue_font" 
				rendered="#{suspensionBackingBean.managedBean.ctContract.agreement and 
							(suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
							suspensionBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
							suspensionBackingBean.managedBean.ctContract.zonalPricing}"
				action="#{suspensionBackingBean.downloadFile(suspensionBackingBean.managedBean.ctContract.currentAgreement.filePath,
							suspensionBackingBean.managedBean.ctContract.currentAgreement.fileName)}" />
	    </h:panelGrid>
		<h:panelGrid  style="width:200px;">
		   <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="true">
			 </p:selectBooleanCheckbox>
			 <p:spacer width="2" />
			 <p:outputLabel value="#{lbl['lbl.ct.concession']}" />
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		     <p:outputLabel value="#{lbl['lbl.ct.fee.exmption']}"/>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox 
			  value="#{suspensionBackingBean.managedBean.ctContract.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
	       </h:panelGrid>	
	       <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox value="#{suspensionBackingBean.managedBean.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
		   </h:panelGrid>	
		   <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox id="exemptId" value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			    disabled="true" style="text-align:top;"> 
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.ap201']}" style="text-align:top;" />
		   </h:panelGrid>	
		    <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{suspensionBackingBean.managedBean.ctContract.bondReq ? false : true}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.pb.exemption']}" style="text-align:top;" />
		   </h:panelGrid>	
	    </h:panelGrid>
	     <h:panelGrid columns="2" style="width:1000px;"  styleClass="top-aligned-columns" columnClasses="columnWidth200"
	      rendered="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt or 
	       suspensionBackingBean.managedBean.contractVer.ctContractValue.concession}">
	         <h:panelGrid columns="2" style="float:right;">
		    	<p:outputLabel value="*" styleClass="mandatory" />
			   <p:outputLabel for="justificationLbl" style="float:right;" value="#{lbl['lbl.ct.justification.ap201']}" />
			  </h:panelGrid>
	  <h:panelGrid>
	    <p:inputTextarea id="justificationLbl" value="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.justification}"
		  rows="4" style="width:720px;"  disabled="true" autoResize="false" />	
	  </h:panelGrid>		
    </h:panelGrid> 
	</h:panelGrid>
 </p:panel>
</ui:composition>
