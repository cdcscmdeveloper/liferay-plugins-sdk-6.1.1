<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="agencyDetailsId" toggleable="true" 
		rendered="#{suspensionBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}"
	    header="#{lbl['lbl.ct.panel.agency']}"   toggleSpeed="500">
        <p:dataTable id="tableAgencyDetails"
	        lazy="true"
	         var="data"
             value="#{suspensionBackingBean.managedBean.agencyPersistDataModel}">
		     <ac:paginator for="tableAgencyDetails"/>
		
		      <p:column headerText="#{lbl['lbl.ct.ministry']}" style="width:20%;white-space:normal;" styleClass="column-align-center" >
		             <div align="left">
		             <h:outputText value="#{suspensionBackingBean.retrieveMinistryByOrgProfileId(data.orgProfile.orgProfileId)}"
		             	style="float:left; text-align:left;" />
	               </div>
	           </p:column>
	           
	            <p:column headerText="#{lbl['lbl.ct.jabatan']}" style="width:25%; white-space:normal;" styleClass="column-align-center" >
						<div align="left">
						<h:outputText   value="#{suspensionBackingBean.retrieveJabatanByOrgProfileId(data.orgProfile.orgProfileId)}" 
							style="float:left; text-align:left;" />
					</div>
					</p:column>
	  
	           <p:column headerText="#{lbl['lbl.ct.ptj']}" style="width:40%;white-space:normal;" styleClass="column-align-center" >
			        <div align="left">
			         <h:outputText value="#{data.orgProfile.orgCode}" style="float:left;text-align:left;"/><br/>
			         <h:outputText  value="#{data.orgProfile.orgName}" style="float:left; text-align:left;" /></div>
		       </p:column>
		
		       <p:column style="width:15%;" styleClass="column-align-center" >
		           <f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.effective.date']}"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.effective.date']}"/>
			   	   </f:facet>
		           <p:calendar id="agencyDateActive" value="#{data.effDate}" styleClass="calanderWidth" style="float:left"
			            disabled="#{(data.recordStatusFlg == 1 ? true : false) or (suspensionBackingBean.managedBean.viewOnly)}"  showOn="button" 
			             mindate="#{DateUtils.getCurrentDateWithoutTime()}" maxdate="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.expDate}"
			              readonlyInput="true" navigator="true"
			             pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
			             <p:ajax event="dateSelect" process="@this" 
			               onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  update="agencyDateExp" />
			       </p:calendar>
		       </p:column> 	
	    
	           <p:column style="width:15%;" styleClass="column-align-center" >
		            <f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.expiry.date']}"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.expiry.date']}"/>
			   	   	</f:facet>
		            <p:calendar  id="agencyDateExp" value="#{data.expDate}" styleClass="calanderWidth" style="float:left"
			          disabled="#{(data.recordStatusFlg == 1 ? true : false) or (suspensionBackingBean.managedBean.viewOnly)}"  showOn="button" 
			          mindate="#{data.effDate}" maxdate="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.expDate}"
			          readonlyInput="true" navigator="true"
			           pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
			          <f:attribute name="startDate" value="#{data.effDate}" />
                      <f:validator validatorId="primeDateRangeValidator" />
			      </p:calendar>
	           </p:column> 	
		      
		       <p:column style="width:10%;" styleClass="column-align-center">
			         <f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.status']}"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.status']}"/>
			   	   	 </f:facet>
			         <p:selectOneMenu value="#{data.recordStatusFlg}" style="width:85px;" disabled="#{suspensionBackingBean.managedBean.viewOnly}">
			              <f:selectItem itemValue="0" itemLabel="#{lbl['lbl.ct.inactive']}" />
				          <f:selectItem itemValue="1" itemLabel="#{lbl['lbl.ct.active']}" />
				          <p:ajax event="change" process="@this" update="agencyDateActive, agencyDateExp"
					          listener="#{suspensionBackingBean.setSuspensionAgencyStatusValue(data)}" />
			         </p:selectOneMenu>	
	           </p:column> 		
	   
	   </p:dataTable>
    </p:panel>                
</ui:composition>
