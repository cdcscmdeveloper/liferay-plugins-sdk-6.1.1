<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="agencyDetailsId" header="#{lbl['lbl.ct.susp.panel.agency.name']}"  toggleable="true"  toggleSpeed="500">
      <p:dataTable id="agencyDetailsTable" var="data"  
        value="#{suspensionBackingBean.managedBean.contractVer.ctAgencies}" lazy="false">
		 <ac:paginator for="agencyDetailsTable"/>
		   <p:column headerText="Ministry">
				<h:outputText value="#{data.orgProfile.parentOrgProfile.parentOrgProfile.orgName}"/>
			 </p:column>             
             <p:column headerText="Jabatan">
				<h:outputText value="#{data.orgProfile.parentOrgProfile.orgName}"/>
			 </p:column>
			 <p:column headerText="PTJ">
				<h:outputText  value="#{data.orgProfile.orgName}"/>
			 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.susp.tbl.agency.efdate']}">
			   <p:calendar value="#{data.effDate}" size="15" id="calloc1" showOn="button"
			     disabled="#{data.chkStatusId == 1 ? true : false}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/>
			 </p:column> 	
			 <p:column headerText="#{lbl['lbl.ct.susp.tbl.agency.expdate']}">
			  <p:calendar value="#{data.expDate}" size="15" id="calloc2" showOn="button"
			    disabled="#{data.chkStatusId == 1 ? true : false}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/>
			 </p:column> 	
			 <p:column headerText="Status">
			  <p:selectOneMenu value="#{data.chkStatusId}" style="width:85px;">
			    <f:selectItem itemValue="0" itemLabel="Inactive" />
				<f:selectItem itemValue="1" itemLabel="Active" />
				<p:ajax event="change" process="@this" update="agencyDetailsTable"/>
			   </p:selectOneMenu>	
			 </p:column> 			
	   </p:dataTable>	
      </p:panel>                
</ui:composition>
