<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="agencyDetailsId" header="#{lbl['lbl.ct.susp.panel.agency.name']}"  toggleable="true"  toggleSpeed="500">
      <p:dataTable id="agencyDetailsTable" var="data"  
        value="#{suspensionBackingBean.managedBean.contractVer.ctAgencies}" lazy="false">
		 <ac:paginator for="agencyDetailsTable"/>
		   <p:column headerText="Ministry" style="width:20%;">
				<h:outputText value="#{data.orgProfile.parentOrgProfile.orgName}"/>
			 </p:column>
			 <p:column headerText="PTJ" style="width:20%;">
				<h:outputText  value="#{data.orgProfile.orgName}"/>
			 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.susp.tbl.agency.efdate']}" style="width:15%;">
			    <h:panelGroup rendered="#{data.chkStatusId == 1}">
			      <p:calendar value="#{data.effDate}" size="10" id="effDateActive" showOn="button"
			           disabled="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/>
			    </h:panelGroup>
			    <h:panelGroup id="effDateId" rendered="#{data.chkStatusId == 0}">
			      <p:calendar value="#{data.effDate}" size="15" id="effDateInActive" showOn="button" readonlyInput="true"
			           disabled="false" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
			           <p:ajax event="dateSelect" update="agencyDetailsTable" process="@this" listener="#{suspensionBackingBean.validateDate(data)}"/> 
			      </p:calendar>
			    </h:panelGroup>
			 </p:column> 	
			 <p:column headerText="#{lbl['lbl.ct.susp.tbl.agency.expdate']}" style="width:15%;">
			    <h:panelGroup rendered="#{data.chkStatusId == 1}">
			      <p:calendar value="#{data.expDate}" size="15" id="expDateActive" showOn="button"
			           disabled="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/>
			    </h:panelGroup>
			    <h:panelGroup id="expDateId" rendered="#{data.chkStatusId == 0}">
			      <p:calendar value="#{data.expDate}" size="15" id="expDateInActive" showOn="button" readonlyInput="true"
			         disabled="false" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
                    <p:ajax event="dateSelect" update="agencyDetailsTable" process="@this" listener="#{suspensionBackingBean.validateDate(data)}"/> 
			      </p:calendar>
			      <p:spacer width="5"/>
                    <p:commandLink id="validateAction" process="@this" onclick="dlgDateValidation.show(); return false;" 
		               styleClass="column-align-center" rendered="#{data.validateScheduleDate}">
		               <p:graphicImage library="ep/images/design" name="exclamation.png" style="margin-bottom: -5px;" 
			             value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
		           </p:commandLink>
			    </h:panelGroup>
			 </p:column> 	
			 <p:column headerText="Status" style="width:10%;">
			  <p:selectOneMenu value="#{data.chkStatusId}" style="width:75px;">
			    <f:selectItem itemValue="0" itemLabel="Inactive" />
				<f:selectItem itemValue="1" itemLabel="Active" />
				<p:ajax event="change" process="@this" update="agencyDetailsTable"/>
			   </p:selectOneMenu>	
			 </p:column> 			
	   </p:dataTable>
	   
	    <p:dialog id="dlgDateValidation" widgetVar="dlgDateValidation" header="Error List" styleClass="screen-title"  
            resizable="false" modal="true" width="325" height="90">  
             <h:panelGrid columns="3">
                <p:graphicImage library="ep/images/design" name="exclamation.png"
			      value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			    <p:spacer width="10"/>
                <p:inputTextarea value="Date is mandatory?"  rows="2" cols="48" styleClass="ui-inputtextarea"></p:inputTextarea>
            </h:panelGrid>
            <div class="ppRightBtn">
		      <p:commandButton value="Ok" icon="ui-icon-ok" onclick="dlgDateValidation.hide();" type="button" />
		   </div>
         </p:dialog>    	
      </p:panel>                
</ui:composition>
