<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="agencyDetailsId" toggleable="true" 
	    header="#{lbl['lbl.ct.susp.panel.agency.name']}"   toggleSpeed="500">
        
        <p:dataTable id="agencyDetailsTable" var="data"
             value="#{suspensionBackingBean.managedBean.contractVer.ctAgencies}">
		     <ac:paginator for="agencyDetailsTable"/>
		
		      <p:column headerText="Ministry" style="width:20%;white-space:normal;">
		             <h:outputText value="#{data.orgProfile.parentOrgProfile.orgName}"/>
	           </p:column>
	  
	           <p:column headerText="PTJ" style="width:40%;white-space:normal;">
			         <h:outputText  value="#{data.orgProfile.orgName}"/>
		       </p:column>
		
		       <p:column headerText="#{lbl['lbl.ct.susp.tbl.agency.efdate']}" style="width:15%;">
		           <p:calendar id="agencyDateActive" value="#{data.effDate}" styleClass="calanderWidth"
			            disabled="#{data.recordStatusFlg == 1 ? true : false}"  showOn="button" 
			             mindate="#{suspensionBackingBean.currentDate}"  readonlyInput="true" navigator="true"
			             pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
			             <p:ajax event="dateSelect" update="agencyDateExp" />
			       </p:calendar>
		       </p:column> 	
	    
	           <p:column headerText="#{lbl['lbl.ct.susp.tbl.agency.expdate']}" style="width:15%;">
		            <p:calendar  id="agencyDateExp" value="#{data.expDate}" styleClass="calanderWidth"
			          disabled="#{data.recordStatusFlg == 1 ? true : false}"  showOn="button" 
			          mindate="#{data.effDate}" readonlyInput="true" navigator="true"
			           pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
			          <f:attribute name="startDate" value="#{data.effDate}" />
                      <f:validator validatorId="primeDateRangeValidator" />
			      </p:calendar>
	           </p:column> 	
		      
		       <p:column headerText="#{lbl['lbl.ct.status']}" style="width:10%;">
			         <p:selectOneMenu value="#{data.recordStatusFlg}" style="width:85px;">
			              <f:selectItem itemValue="0" itemLabel="Inactive" />
				          <f:selectItem itemValue="1" itemLabel="Active" />
				          <p:ajax event="change" process="@this" update=":form:agencyDetailsId"
					          listener="#{suspensionBackingBean.setSuspensionAgencyStatusValue(data)}" />
			         </p:selectOneMenu>	
	           </p:column> 			
	   
	   </p:dataTable>
    </p:panel>                
</ui:composition>
