<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="itemId" toggleable="true"  toggleSpeed="500" header="#{lbl['lbl.ct.panel.item']}" >
		
		<p:dataTable id="itemTable" var="itemData" 
		    value="#{suspensionBackingBean.managedBean.contractVer.ctContractItems}"
			widgetVar="ctItemsTable" filteredValue="#{suspensionBackingBean.managedBean.ctItemFilter}">
			   <ac:paginator for="itemTable" />
			  
			   <p:column style="width:20%;" headerText="#{lbl['lbl.ct.item.type']}">
				    <p:outputLabel style="float:left;" value="#{suspensionBackingBean.getParameterDesc(itemData.itemType)}" />
			   </p:column>
			
			   <p:column id="modelColumn" headerText="#{lbl['lbl.ct.item.desc']}" 
			        style="width:40%;white-space:normal;"  filterBy="#{itemData.itemName}"   filterMatchMode="contains"> 
			        <p:outputLabel value="#{itemData.itemName}" style="float:left;" />
			   </p:column>
			
			   <p:column style="width:15%;">
			      <f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.effective.date']}"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.effective.date']}"/>
			   	  </f:facet>
			      <p:calendar id="effDateActive" value="#{itemData.effDate}" readonlyInput="true" 
			         disabled="#{itemData.recordStatusFlg == 1 ? true : false}" styleClass="calanderWidth"  showOn="button"  navigator="true"
			         mindate="#{suspensionBackingBean.currentDate}"  
			         pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
			         <p:ajax event="dateSelect" update="expDateActive" />
			    </p:calendar>
			  </p:column>
			
		       <p:column style="width:15%;">
			      <f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.expiry.date']}"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.expiry.date']}"/>
			   	  </f:facet>
			      <p:calendar id="expDateActive" value="#{itemData.expDate}"  styleClass="calanderWidth"
			          showOn="button" disabled="#{itemData.recordStatusFlg == 1 ? true : false}" readonlyInput="true" navigator="true"
			          mindate="#{itemData.effDate}"
			          pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
			          <f:attribute name="startDate" value="#{itemData.effDate}" />
                      <f:validator validatorId="primeDateRangeValidator" />
			      </p:calendar>
			  </p:column>
		   	  
		   	  <p:column style="width:10%;">
		   	  	   <f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.status']}"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.status']}"/>
			   	   </f:facet>
			       <p:selectOneMenu value="#{itemData.recordStatusFlg}" style="width:85px;">
				         <f:selectItem itemValue="0" itemLabel="#{lbl['lbl.ct.inactive']}" />
				         <f:selectItem itemValue="1" itemLabel="#{lbl['lbl.ct.active']}" />
				         <p:ajax event="change" process="@this" update=":form:itemId"
				 	        listener="#{suspensionBackingBean.setSuspensionStatusValue(itemData)}" />
			       </p:selectOneMenu>
			   </p:column>
		
		</p:dataTable>
	</p:panel>
</ui:composition>
