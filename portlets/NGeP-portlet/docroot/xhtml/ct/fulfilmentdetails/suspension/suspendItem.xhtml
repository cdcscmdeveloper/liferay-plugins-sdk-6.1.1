<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	   <p:panel id="itemId" header="Item" toggleable="true"  toggleSpeed="500" widgetVar="panelitem">
	   <div style="overflow-x:auto">
       <p:dataTable id="itemTable" var="data" value="" rowIndexVar="index" widgetVar="dataTableObj" lazy="false" paginator="true" 
          paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
		  <p:columnGroup type="header"> 
			 <p:row> 
				<p:column rowspan="2" headerText="No."  />
				<p:column rowspan="2" headerText="Item Type" /> 
				<p:column rowspan="2" headerText="Item Code" /> 
				<p:column rowspan="2" headerText="Start Date" /> 	
				<p:column rowspan="2" headerText="End Date" /> 		
				<p:column rowspan="2" headerText="Status" /> 					
				<p:column colspan="3" headerText="Action"/>
			 </p:row>							
			 <p:row> 
				<p:column headerText="S" />	
				<p:column headerText="A"/>
				<p:column headerText="E" />	
			 </p:row>
		   </p:columnGroup>
		   <p:column styleClass="column-align-center" ><h:outputText value="#{index+1}" /></p:column> 
		   <p:column><p:outputLabel value ="Product" style="float:left;"/> </p:column> 
		   <p:column width="100"> <p:outputLabel value ="EP 308X3120P" style="float:left;"/></p:column> 
		   <p:column width="100" > <p:calendar value="#{contractSuspendBackingBean.managedBean.startDate}" id="calItem" showOn="button"/>  </p:column> 
		   <p:column> <p:calendar value="#{contractSuspendBackingBean.managedBean.endDate}" id="calItem1" showOn="button"/>  </p:column> 
		   <p:column> <p:outputLabel value ="Active" style="float:left;"/> </p:column>
		   <p:column>  <p:selectBooleanCheckbox value="false"  disabled="false"/>  </p:column>
		   <p:column> <p:selectBooleanCheckbox value="false"  disabled="false"/>  </p:column>
		   <p:column> <p:selectBooleanCheckbox value="true"  disabled="false"/> </p:column>
		 </p:dataTable>	
		 </div>	
		 <p:spacer width="12"/>	
		 <div style="overflow-x:auto">
		 <p:dataTable id="itemTableDetails" var="data"  value="" rowIndexVar="index" widgetVar="dataTableObj"
	        lazy="false" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
			<p:columnGroup type="header"> 
			<p:row> 
				<p:column  headerText="Item Code" /> 
				<p:column headerText="Item Name" /> 	
				<p:column headerText="Supplier's SKU" /> 		
				<p:column headerText="Currency" /> 					
				<p:column headerText="Price" />
				<p:column headerText="UOM" />	
				<p:column headerText="Minimum Order"/>
			</p:row>
			</p:columnGroup>
			<p:column> <p:outputLabel value ="EP 308X3120P" style="float:left;"/> </p:column>
			<p:column> <p:outputLabel value ="DESKTOP" style="float:left;"/> </p:column>
			<p:column> <p:outputLabel value ="KHAI" style="float:left;"/> </p:column>
			<p:column> <p:outputLabel value ="MYR" style="float:left;"/> </p:column>
			<p:column> <p:outputLabel value ="2300" style="float:left;"/> </p:column>
			<p:column> <p:outputLabel value ="UNIT" style="float:left;"/> </p:column>
			<p:column> <p:outputLabel value ="10" style="float:left;"/> </p:column>
		 </p:dataTable>	
		 </div>		
		</p:panel>            
</ui:composition>
