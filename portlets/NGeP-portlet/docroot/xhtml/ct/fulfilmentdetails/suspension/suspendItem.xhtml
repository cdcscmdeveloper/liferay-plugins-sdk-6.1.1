<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<!-- Start Fix - #35597 -->
	<script>
		document.addEventListener('DOMContentLoaded',
				function() {
				// Use correct escaping for colons in IDs
				var calendarButtons = document.querySelectorAll('.calendarBlock .ui-datepicker-trigger');
							if (calendarButtons.length === 0) {
								console.error('No calendar buttons found with the given selector.');
							}
							calendarButtons.forEach(function(button) {
								button.classList.add('disabled-calendar-icon');
							});
						});

		function handleRowAction() {
			// Use correct escaping for colons in IDs
			var calendarButtons = document.querySelectorAll('.calendarBlock .ui-datepicker-trigger');
			if (calendarButtons.length === 0) {
				console.error('No calendar buttons found with the given selector.');
			}
			calendarButtons.forEach(function(button) {
				button.classList.add('disabled-calendar-icon');
			});
		}
	</script>
	<!-- End Fix - #35597 -->
	<p:panel id="itemId" toggleable="true"  toggleSpeed="500" header="#{lbl['lbl.ct.panel.item']}" collapsed="false" >
		<h:panelGrid columns="4" style="width:70%" columnClasses="columnWidth10"  >
			<p:outputLabel value="#{lbl['lbl.ct.item.desc']}" />
           		<p:inputText id="searchItemString" value="#{suspensionBackingBean.managedBean.searchItemString}" style="width:270px;"/>
           	</h:panelGrid>	
           	
	
	<h:panelGrid columns="4" style="width:70%" columnClasses="columnWidth10, columnWidth30, columnWidth5,columnWidth20" >
	    <p:outputLabel value="#{lbl['lbl.ct.item.type']}"  />
		<p:selectOneMenu value="#{suspensionBackingBean.managedBean.itemtype}"  style="width:280px;" maxlength="500" >
					<f:selectItems value="#{contractRequestBackingBean.itemTypeValues}" />
					<f:selectItem itemLabel="#{lbl['lbl.ct.all']}" itemValue="3" />        	
		</p:selectOneMenu>

		<p:outputLabel value="#{lbl['lbl.ct.item.code']}" style="float:center-left;"  />
		<p:inputText value="#{suspensionBackingBean.managedBean.itemcode}" style="width:270px; float:center;"  maxlength="20"  />				
	</h:panelGrid>	
	<h:panelGrid columns="4" style="width:70%" columnClasses="columnWidth10, columnWidth30, columnWidth5,columnWidth20">	
		<p:outputLabel value="#{lbl['lbl.ct.item.status']}"/>
		<p:selectOneMenu value="#{suspensionBackingBean.managedBean.itemstatus}" style="width:280px;" maxlength="500" >  
    	<f:selectItem itemLabel="#{lbl['lbl.ct.selectOne']}" itemValue="" />  
    	<f:selectItem itemLabel="#{lbl['lbl.ct.inactive']}" itemValue="0" />   
    	<f:selectItem itemLabel="#{lbl['lbl.ct.active']}" itemValue="1" /> 
    	<f:selectItem itemLabel="#{lbl['lbl.ct.all']}" itemValue="2" />     	            	
       </p:selectOneMenu> 
	<p:outputLabel value="#{lbl['lbl.ct.item.skuno']}"/>
	<p:inputText value="#{suspensionBackingBean.managedBean.skuno}" style="width:270px;" maxlength="50"></p:inputText>	
  </h:panelGrid>	
  
	<h:panelGrid columns="4" style="width:70%" columnClasses="columnWidth10, columnWidth30, columnWidth5,columnWidth20">	
		<p:outputLabel value="#{lbl['lbl.ct.item.UOM']}"/>
	<p:inputText value="#{suspensionBackingBean.managedBean.UOM}" style="width:270px;" maxlength="20"></p:inputText>	
		<p:outputLabel value="#{lbl['lbl.ct.item.typeofgoods']}"  />
		
	    	<p:selectOneMenu value="#{suspensionBackingBean.managedBean.typeofgoods}" style="width:280px;" maxlength="500" >  
            	<f:selectItem itemLabel="#{lbl['lbl.ct.selectOne']}" itemValue="" />  
            	<f:selectItems value="#{contractItemSearchBackingBean.getLocalGoodsRadioValues(ParameterTypeConst.itemOrigin)}" />
            	<f:selectItem itemLabel="#{lbl['lbl.ct.all']}" itemValue="197" />      	
              </p:selectOneMenu> 
	       </h:panelGrid>	
           		
        
           		
           		
           		<div columns="4" style="width:70%" class="ppRightBtn" >
           		<p:commandButton onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					action="#{suspensionBackingBean.searchItemAction}"
					update="suspensionProdDataModel" value="#{lbl['lbl.btn.search']}" />
				<p:commandButton onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					action="#{suspensionBackingBean.resetSearchItemAction}"
					update=":form" value="#{lbl['lbl.btn.reset']}" />
			</div>
			<h:panelGrid columns="4" style="width:70%" columnClasses="columnWidth10, columnWidth30, columnWidth5,columnWidth20"> </h:panelGrid>	
			
		<p:dataTable id="suspensionProdDataModel" var="itemData" lazy="true" rows="10"  emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		    value="#{suspensionBackingBean.managedBean.suspensionProductListingPagingDataModel}" selectionMode="single" selection="#{ctBackingBean.managedBean.selectedItem}" 
		     rowIndexVar="index" rowKey="#{itemData}"
                  onExpandStart="" widgetVar="ctItemsTable" >
			   <ac:paginator for="suspensionProdDataModel" />

			      <p:column headerText="#{lbl['lbl.ct.No']}" styleClass="column-align-center" style="width:8%; white-space:normal;">
                 <h:outputText value="#{index+1}" />
	         </p:column>  
	         
	          <p:column style="width:13%;" headerText="#{lbl['lbl.ct.item.type']}"  styleClass="column-align-center" >
				    <h:outputText style="float:left;" value="#{suspensionBackingBean.getParameterDesc(itemData.itemType)}" />
			   </p:column>
	         
	         <!-- #31558 start -->
	         <p:column headerText="#{lbl['lbl.ct.item.desc']}" style="width:32%; white-space:normal;">	                       
	         	#{itemData.scRequestItem.itemName}
	         	<p:spacer width="10" />       		 	
       		 	<p:commandLink id="serviceSpec" update=":form:itemSpecDlg" action="#{suspensionBackingBean.viewItemSpecDlg(itemData)}">
       		 		<p:graphicImage value="/css/images/design/ico-viewnedit.png" title="#{lbl['lbl.ct.specification']}"/>
			 	</p:commandLink>
				<br/>				
			  	<h:outputText id="extensionCodeID" value="#{itemData.scRequestItem.cmItem.extensionCode}" size="50" escape="false"  style="float:left; text-align:left; display:block;width:200px"/>       		 				                        
	      	</p:column>	       
	         <!-- #31558 end -->

			
			  <p:column headerText="#{lbl['lbl.ct.skuno']}" styleClass="column-align-center" style="width:12%; white-space:normal;">
	              <h:outputText value="#{itemData.sku}" style="float:left;"/>
	         </p:column>
			
			
			<!-- Start Fix - #35597 -->
			   <p:column style="width:14%;" styleClass="column-align-center" >
			      <f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.effective.date']}"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.effective.date']}"/>
			   	  </f:facet>
			      <p:calendar id="effDateActive" value="#{itemData.effDate}" readonlyInput="true"  style="float:left"
			         disabled="#{(itemData.recordStatusFlg == 1 ? true : false) or (suspensionBackingBean.managedBean.viewOnly)}" styleClass="calendarBlock"  showOn="button"  navigator="true"
			         mindate="#{DateUtils.getCurrentDateWithoutTime()}"  maxdate="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.expDate}"
			         pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
			         <p:ajax event="dateSelect" process="@this" update="expDateActive" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
			    </p:calendar>
			  </p:column>
			
		       <p:column style="width:12%;" styleClass="column-align-center" >
			      <f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.expiry.date']}"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.expiry.date']}"/>
			   	  </f:facet>
			      <p:calendar id="expDateActive" value="#{itemData.expDate}"  styleClass="calendarBlock" style="float:left"
			          showOn="button" disabled="#{(itemData.recordStatusFlg == 1 ? true : false) or (suspensionBackingBean.managedBean.viewOnly)}" readonlyInput="true" navigator="true"
			          mindate="#{itemData.effDate}" maxdate="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.expDate}"
			          pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
			          <f:attribute name="startDate" value="#{itemData.effDate}" />
                      <f:validator validatorId="primeDateRangeValidator" />
			      </p:calendar>
			  </p:column>
		   	 <!-- End Fix - #35597 -->
		   	  
		   	  <p:column style="width:10%;" styleClass="column-align-center" >
		   	  	   <f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.status']}"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.status']}"/>
			   	   </f:facet>
			       <p:selectOneMenu value="#{itemData.recordStatusFlg}" style="width:85px;" disabled="#{suspensionBackingBean.managedBean.viewOnly}">
				         <f:selectItem itemValue="0" itemLabel="#{lbl['lbl.ct.inactive']}" />
				         <f:selectItem itemValue="1" itemLabel="#{lbl['lbl.ct.active']}" />
				         <p:ajax event="change" process="@this" update="effDateActive, expDateActive"
				 	        listener="#{suspensionBackingBean.setSuspensionStatusValue(itemData)}" oncomplete="handleRowAction();" /> <!-- Fix - #35597 -->
			       </p:selectOneMenu>
			   </p:column>
		
		</p:dataTable>
	</p:panel>
	
	 <!-- #28854 start - Display item specification as defined in LOA -->
	<p:dialog id="itemSpecDlg" widgetVar="itemSpecDlg"
		header="#{lbl['lbl.ct.specification']}"
		emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		styleClass="pop_up_top" modal="true" width="auto" height="auto"
		style="max-height: 800px; max-width: 900px;" resizable="false">

		<h:panelGroup
			rendered="#{suspensionBackingBean.managedBean.contractVer.ctContract.loa.procurementMode.parameterCode eq ParameterConst.procurementModeDirectPurchase}">
			<h:panelGrid column="2" cellspacing="7"
				style="margin-bottom: 20px;margin-top: 10px;">
				<!-- #31558 start - Aligning the output so that the display will not affect long data -->
				<h:panelGroup>
					<h:outputText value="#{lbl['lbl.ct.item.desc']}" escape="false"
						style="float:left;font-weight:bold;display:block;width:125px" />
					<h:outputText value=":&#160;" escape="false"
						style="float:left;font-weight:bold" />
					<h:outputText
						value="#{suspensionBackingBean.managedBean.selectedItemForSpec.scRequestItem.itemName}"
						escape="false"
						style="float:left;font-weight:bold;display:block;word-wrap: break-word; width:430px" />
					<br />
				</h:panelGroup>

				<h:panelGroup>
					<h:outputText value="#{lbl['lbl.ct.supp.offer']}" escape="false"
						style="float:left;font-weight:bold;display:block;width:125px" />
					<h:outputText value=":&#160;" escape="false"
						style="float:left;font-weight:bold" />
					<div style="display: flex; align-items: flex-start;">
						<div
							style="overflow-y: auto; overflow-x: hidden; max-height: 100px; display: inline-block; position: relative; padding-right: 15px; width: 450px;">
							<h:outputText
								value="#{suspensionBackingBean.managedBean.supplierOffer != null 
								and not empty suspensionBackingBean.managedBean.supplierOffer.trim() ? suspensionBackingBean.managedBean.supplierOffer : lbl['lbl.sc.qt.item.spec.null']}"
								escape="false"
								style="float:left;font-weight:bold;display:block;word-wrap: break-word; max-height: 150px; width:430px" />
						</div>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.dp.supplieroffer']}"
							style="position: absolute; left: 470px; top: 0;" />
					</div>
					<br />
				</h:panelGroup>

				<h:panelGroup>
					<h:outputText value="#{lbl['lbl.ct.new.supp.offer']}"
						escape="false"
						style="float:left; font-weight:bold; display:block; width: 125px; " />
					<h:outputText value=":&#160;" escape="false"
						style="float:left;font-weight:bold" />
					<div style="display: flex; align-items: flex-start;">
						<div
							style="overflow-y: auto; overflow-x: hidden; max-height: 100px; display: inline-block; position: relative; padding-right: 15px; width: 450px;">
							<h:outputText
								value="#{suspensionBackingBean.managedBean.newOfferSpec != null 
								and not empty suspensionBackingBean.managedBean.newOfferSpec.trim() ? suspensionBackingBean.managedBean.newOfferSpec : lbl['lbl.sc.qt.item.spec.null']}"
								escape="false"
								style="float:left;font-weight:bold;display:block;word-wrap: break-word; max-height: 150px; width:430px" />
						</div>
						<ac:iconTooltip
							value="#{lbl['lbl.ct.tooltip.newofferedspecification']}"
							style="position: absolute; left: 470px; top: 0;" />
					</div>
					<br />
				</h:panelGroup>
				<!-- #31558 end -->
			</h:panelGrid>

			<p:dataTable id="itemSpec" var="item"
				value="#{suspensionBackingBean.managedBean.itemSpecification}"
				classStyle="TableHeader"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				height="auto"
				style="margin: 0; max-height: 250px; max-width: 600px; overflow-y: auto;"
				rows="5" paginator="true" paginatorPosition="bottom"
				paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
				currentPageReportTemplate="Page &#160; {currentPage}/{totalPages}"
				scrollable="true" scrollHeight="150" liveScroll="true">
				<p:column styleClass="column-align-center"
					style="white-space:normal;">
					<f:facet name="header">#{lbl['lbl.ct.specification']}</f:facet>
					<!-- #31558 start - Aligning the title to the center but the content to the left -->
					<h:outputText
						value="#{item == null || item.trim().isEmpty() ? lbl['lbl.sc.qt.item.spec.null'] : item}"
						rows="5" escape="false"
						style="float:left;text-align:left; display:block;word-wrap: break-word; max-width: 600px;"
						disabled="true">
					</h:outputText>
					<!-- #31558 end -->
				</p:column>
			</p:dataTable>
		</h:panelGroup>

		<h:panelGroup
			rendered="#{(suspensionBackingBean.managedBean.contractVer.ctContract.loa.procurementMode.parameterCode eq ParameterConst.procurementModeQuotation) or (suspensionBackingBean.managedBean.contractVer.ctContract.loa.procurementMode.parameterCode eq ParameterConst.procurementModeTender) or (suspensionBackingBean.managedBean.contractVer.ctContract.loa.procurementMode.parameterCode eq ParameterConst.procurementModeDirectNego)}">
			<h:panelGrid column="1">
				<p:outputLabel value="#{lbl['lbl.ct.item.desc']}"
					style="float:left;margin-bottom: 20px;margin-top: 10px;font-weight:bold;">: #{suspensionBackingBean.managedBean.selectedItemForSpec.scRequestItem.itemName}</p:outputLabel>

				<p:dataTable var="item"
					value="#{suspensionBackingBean.managedBean.scRequestItemSpecOfferList}"
					classStyle="TableHeader"
					style="margin: 0; max-height: 700px; overflow-y: auto;"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					height="auto" rows="5" paginator="true" paginatorPosition="bottom"
					paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
					currentPageReportTemplate="Page &#160; {currentPage}/{totalPages}"
					scrollable="true" scrollHeight="200" liveScroll="true">

					<p:column styleClass="column-align-center"
						style="white-space: normal; vertical-align: top; width: 33%;">
						<!-- Aligns content to the top -->
						<f:facet name="header">#{lbl['lbl.ct.specification']}</f:facet>
						<h:outputText
							value="#{item.itemSpec == null || item.itemSpec.trim().isEmpty() ? lbl['lbl.sc.qt.item.spec.null'] : item.itemSpec}"
							style="float: left; text-align: left; max-width: 300px; word-wrap: break-word;"
							escape="false">
						</h:outputText>
					</p:column>

					<p:column styleClass="column-align-center"
						style="white-space: normal; vertical-align: top; width: 33%;">
						<!-- Aligns content to the top -->
						<f:facet name="header">#{lbl['lbl.ct.supp.offer']}
            <ac:iconTooltip
								value="#{lbl['lbl.ct.tooltip.qt.supplieroffer']}" />
						</f:facet>
						<h:outputText
							value="#{item.supplierOffer == null || item.supplierOffer.trim().isEmpty()  ? lbl['lbl.sc.qt.item.spec.null'] : item.supplierOffer}"
							style="float: left; text-align: left; max-width: 500px; word-wrap: break-word;"
							escape="false">
						</h:outputText>
					</p:column>

					<p:column styleClass="column-align-center"
						style="white-space: normal; vertical-align: top; width: 33%;">
						<!-- Aligns content to the top -->
						<f:facet name="header">#{lbl['lbl.ct.new.offer.spec']}
            <ac:iconTooltip
								value="#{lbl['lbl.ct.tooltip.newofferedspecification']}" />
						</f:facet>
						<h:outputText
							value="#{item.newOfferSpec == null || item.newOfferSpec.trim().isEmpty() ? lbl['lbl.sc.qt.item.spec.null'] : item.newOfferSpec}"
							style="float: left; text-align: left; max-width: 500px; word-wrap: break-word;"
							escape="false">
						</h:outputText>
					</p:column>
				</p:dataTable>
			</h:panelGrid>
		</h:panelGroup>
		<!-- #28854 end -->
		<f:facet name="footer">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.close']}" type="button"
					ajax="false" onclick="itemSpecDlg.hide();" />
			</div>
		</f:facet>
	</p:dialog>
</ui:composition>
