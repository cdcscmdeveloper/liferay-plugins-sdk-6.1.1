<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="itemId" toggleable="true"  toggleSpeed="500" header="#{lbl['lbl.ct.panel.item']}" >
		
		<p:dataTable id="itemTable" var="itemData" 
		    value="#{suspensionBackingBean.managedBean.contractVer.ctContractItems}"
			widgetVar="ctItemsTable" filteredValue="#{suspensionBackingBean.managedBean.ctItemFilter}">
			   <ac:paginator for="itemTable" />
			  
			   <p:column style="width:20%;" headerText="#{lbl['lbl.ct.item.type']}"  styleClass="column-align-center" >
				    <p:outputLabel style="float:left;" value="#{suspensionBackingBean.getParameterDesc(itemData.itemType)}" />
			   </p:column>
			
			   <p:column id="modelColumn" headerText="#{lbl['lbl.ct.item.desc']}"  styleClass="column-align-center" 
			        style="width:40%;white-space:normal;"  filterBy="#{itemData.scRequestItem.itemName}"   filterMatchMode="contains"> 
			        <h:outputText id="serviceNameID"  value="#{itemData.scRequestItem.itemName}" style="float:left;"/>
			           <p:tooltip id="toolTipServiceName" for="serviceNameID" value="#{itemData.scRequestItem.itemDesc == null ? lbl['lbl.ct.item.tooltip.desc'] : itemData.scRequestItem.itemDesc}" />
			   </p:column>
			
			   <p:column style="width:15%;" styleClass="column-align-center" >
			      <f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.effective.date']}"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.effective.date']}"/>
			   	  </f:facet>
			      <p:calendar id="effDateActive" value="#{itemData.effDate}" readonlyInput="true" 
			         disabled="#{(itemData.recordStatusFlg == 1 ? true : false) or (suspensionBackingBean.managedBean.viewOnly)}" styleClass="calanderWidth"  showOn="button"  navigator="true"
			         mindate="#{DateUtils.getCurrentDateWithoutTime()}"  maxdate="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.expDate}"
			         pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
			         <p:ajax event="dateSelect" process="@this" update="expDateActive"
			          onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
			    </p:calendar>
			  </p:column>
			
		       <p:column style="width:15%;" styleClass="column-align-center" >
			      <f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.expiry.date']}"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.expiry.date']}"/>
			   	  </f:facet>
			      <p:calendar id="expDateActive" value="#{itemData.expDate}"  styleClass="calanderWidth"
			          showOn="button" disabled="#{(itemData.recordStatusFlg == 1 ? true : false) or (suspensionBackingBean.managedBean.viewOnly)}" readonlyInput="true" navigator="true"
			          mindate="#{itemData.effDate}" maxdate="#{suspensionBackingBean.managedBean.contractVer.ctContractValue.expDate}"
			          pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
			          <f:attribute name="startDate" value="#{itemData.effDate}" />
                      <f:validator validatorId="primeDateRangeValidator" />
			      </p:calendar>
			  </p:column>
		   	  
		   	  <p:column style="width:10%;" styleClass="column-align-center" >
		   	  	   <f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.status']}"/>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.item.status']}"/>
			   	   </f:facet>
			       <p:selectOneMenu value="#{itemData.recordStatusFlg}" style="width:85px;" disabled="#{suspensionBackingBean.managedBean.viewOnly}">
				         <f:selectItem itemValue="0" itemLabel="#{lbl['lbl.ct.inactive']}" />
				         <f:selectItem itemValue="1" itemLabel="#{lbl['lbl.ct.active']}" />
				         <p:ajax event="change" process="@this" update="effDateActive, expDateActive"
				 	        listener="#{suspensionBackingBean.setSuspensionStatusValue(itemData)}" />
			       </p:selectOneMenu>
			   </p:column>
		
		</p:dataTable>
	</p:panel>
</ui:composition>
