<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	   <p:panel id="itemId" header="Item Details" toggleable="true"  toggleSpeed="500">
	   <div style="overflow-x:auto">
       <p:dataTable id="itemTable" var="data" value=" " rowIndexVar="index" 
         widgetVar="dataTableObj" lazy="false" paginator="true"  paginatorPosition="bottom" paginatorAlwaysVisible="true"
         emptyMessage="No Records!">
		  <ac:paginator for="itemTable"/>
            <p:columnGroup type="header"> 
			 <p:row> 
				<p:column rowspan="1" style="width:150px;" headerText="Item Type" /> 
				<p:column rowspan="1" style="width:200px;" headerText="Item Name" /> 
				<p:column rowspan="1" style="width:150px;" headerText="Effective Date" /> 	
				<p:column rowspan="1" style="width:150px;" headerText="Expiry Date" /> 							
				<p:column colspan="1" style="width:100px;" headerText="Action"/>
			 </p:row>							
		   </p:columnGroup>
		   <p:column><p:outputLabel value="Product" style="float:left;"/> </p:column> 
		   <p:column> 
		       <p:outputLabel value ="EP 308X3120P" style="float:left;width:250px;"/>
		   </p:column> 
		   <p:column>
		     <p:calendar value="12/12/2013" id="calItem" size="15" showOn="button"/>
		   </p:column> 
		   <p:column> 
		      <p:calendar value="11/12/2014" id="calItem1" size="15" showOn="button"/>
		   </p:column> 
		   <p:column>  <p:selectOneMenu disabled="false" style="width:90px;">
				<f:selectItem itemLabel="-Select One-" itemValue="" />	
				<f:selectItem itemLabel="Active" itemValue="Active" />	
				<f:selectItem itemLabel="Suspend" itemValue="Suspend" />	
				<f:selectItem itemLabel="Extend" itemValue="Extend" />			
			</p:selectOneMenu> 
		  </p:column>
		 </p:dataTable>	
	  </div>	
		</p:panel>            
</ui:composition>
