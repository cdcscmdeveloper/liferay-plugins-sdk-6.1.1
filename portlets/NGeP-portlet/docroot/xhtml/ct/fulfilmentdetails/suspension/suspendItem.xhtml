<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	   <p:panel id="itemId" header="#{lbl['lbl.ct.susp.panel.item.name']}" toggleable="true"  toggleSpeed="500">
	   <div style="overflow-x:auto">
       <p:dataTable id="itemTable" var="data" value="#{suspensionBackingBean.managedBean.contractVer.ctContractItems}" 
         lazy="false" paginator="true"  paginatorPosition="bottom" paginatorAlwaysVisible="false" emptyMessage="No Records!">
		  <ac:paginator for="itemTable"/>
            <p:columnGroup type="header"> 
			 <p:row> 
				<p:column style="width:150px;" headerText="#{lbl['lbl.ct.susp.tbl.item.type']}"/> 
				<p:column style="width:200px;" headerText="#{lbl['lbl.ct.susp.tbl.item.name']}"/> 
				<p:column style="width:150px;" headerText="#{lbl['lbl.ct.susp.tbl.item.efdate']}"/> 	
				<p:column style="width:150px;" headerText="#{lbl['lbl.ct.susp.tbl.item.expdate']}"/> 							
				<p:column style="width:100px;" headerText="#{lbl['lbl.ct.susp.tbl.item.action']}"/>
			 </p:row>							
		   </p:columnGroup>
		   <p:column><p:outputLabel value="#{data.itemType.pmParameterType.parameterName}" style="float:left;"/> </p:column> 
		   <p:column><p:outputLabel value ="#{data.itemName}" style="float:left;width:250px;"/></p:column> 
		   <p:column><p:calendar value="#{data.suspendFrom}" id="calItem" size="15" showOn="button"/></p:column> 
		   <p:column> <p:calendar value="#{data.suspendTo}" id="calItem1" size="15" showOn="button"/></p:column> 
		   <p:column>  <p:selectOneMenu value="#{data.suspensionType.parameterId}" style="width:110px;">
				<f:selectItems value="#{suspensionBackingBean.getDropdownValues('SPT')}" />
			</p:selectOneMenu>	 
		  </p:column>
		 </p:dataTable>	
	  </div>	
		</p:panel>            
</ui:composition>
