<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	 <p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true"  toggleSpeed="500" widgetVar="panelfd">
      <h:panelGrid columns="5" style="width:800px;">  
         <p:outputLabel  value="#{lbl['lbl.ct.cno']}"/>  
         <p:inputText  value="CT3012343"  disabled="false" style="width:170px;" />  
         <p:outputLabel  value="#{lbl['lbl.ct.sourcingType']}"/>  
         <p:selectOneMenu disabled="false" value="Tender"  style="width:170px;" >
            <f:selectItems value="#{contractDetailsBackingBean.contractListItem.sourcingType}" />
         </p:selectOneMenu>
         <h:panelGrid columns="2">
            <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractValues.agreement}"  disabled="false"/> 
            <p:outputLabel  value="#{lbl['lbl.ct.agreement']}" />
         </h:panelGrid>    
         <p:outputLabel value="#{lbl['lbl.ct.contractType']}"/>  
         <p:inputText  value=""  disabled="false" style="width:170px;"/>  
         <p:outputLabel value="#{lbl['lbl.ct.sourcingCategory']}" />  
         <p:selectOneMenu disabled="false" value="" style="width:170px;">
            <f:selectItems value="" />
         </p:selectOneMenu> 
         <h:panelGrid columns="2">
             <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractValues.concession}" disabled="false"/> 
             <p:outputLabel value="Concession" />
          </h:panelGrid>  
          <p:outputLabel value="#{lbl['lbl.ct.createdDate']}" />  
          <p:inputText  value="#{contractDetailsBackingBean.managedBean.ctContract.createdDate}" style="width:170px;"   disabled="false"/>  
          <p:outputLabel value="#{lbl['lbl.ct.publishingDate']}"  />  
          <p:inputText  value="#{contractDetailsBackingBean.managedBean.ctContract.qtPublishDate}"  style="width:170px;" disabled="false"/>  
          <h:panelGrid columns="2">
             <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractValues.exempted}" disabled="false"/> 
             <p:outputLabel value="Exempted" />
          </h:panelGrid> 
          <p:outputLabel value="#{lbl['lbl.ct.loaNo']}"  />  
          <p:inputText  value="#{contractDetailsBackingBean.managedBean.ctContract.qtLoaNo}" style="width:170px;" disabled="false"/>  
          <p:outputLabel value="#{lbl['lbl.ct.loaDate']}" />  
          <p:inputText  value="#{contractDetailsBackingBean.managedBean.ctContract.qtLoaDate}" style="width:170px;" disabled="false"/>  
          <h:panelGrid columns="2">
             <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.ctContract.chkLocal}" disabled="false"/> 
             <p:outputLabel  value="#{lbl['lbl.ct.localGoods']}"  />
          </h:panelGrid> 
          <p:outputLabel  value="#{lbl['lbl.ct.contractAmount']}" />  
          <p:inputText value="#{contractDetailsBackingBean.managedBean.contractValues.contractAmount}"   size="8"  disabled="false"/>  
          <p:outputLabel  value="#{lbl['lbl.ct.fulfilmentType']}"/>  
          <p:inputText  value=""  disabled="false" style="width:170px;"/>  
          <h:panelGrid columns="2">
              <p:selectBooleanCheckbox value="" 
                 disabled="false"/> 
              <p:outputLabel   value="#{lbl['lbl.ct.Igoods']}"/>
          </h:panelGrid>
          <p:outputLabel value="#{lbl['lbl.ct.physicalNo']}" />  
          <p:inputText value="" size="8"   disabled="false" />  
          <h:outputLabel value="#{lbl['lbl.ct.liquidated']}"/>  
          <p:inputText  value="#{contractDetailsBackingBean.managedBean.contractValues.liquidatedDamage}" size="8" disabled="false"/>  
          <h:panelGrid columns="2">
             <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.ctContract.chkMto}" disabled="false"/> 
             <p:outputLabel  value="#{lbl['lbl.ct.mto']}" />
          </h:panelGrid>
          <p:outputLabel value="#{lbl['lbl.ct.cur']}" />
          <p:selectOneMenu  disabled="false"  value="" style="width:60px;">
              <f:selectItems value="#{contractDetailsBackingBean.contractListItem.currency}" />
          </p:selectOneMenu>
            <h:outputLabel value="#{lbl['lbl.ct.dperiod']}"  />  
              <p:inputText  value="" size="8" disabled="false"/>
            <f:verbatim></f:verbatim>    
             <p:outputLabel  value="#{lbl['lbl.ct.sfee']}" />  
            <p:selectOneMenu  disabled="false"  value="#{contractDetailsBackingBean.managedBean.ctContract.serviceFee}"  style="width:60px;">
              <f:selectItems value="" /> 
            </p:selectOneMenu>
            <h:outputLabel value="#{lbl['lbl.ct.edate']}" />  
            <p:inputText value="#{contractDetailsBackingBean.managedBean.contractValues.expDate}" style="width:170px;" disabled="false" />  
           
             <f:verbatim></f:verbatim>  
              <p:outputLabel  value="#{lbl['lbl.ct.effectiveDate']}"  />  
            <p:inputText value="#{contractDetailsBackingBean.managedBean.contractValues.effDate}" style="width:170px;" disabled="false" /> 
           <h:outputLabel rendered="#{contractDetailsBackingBean.managedBean.ctCircular.circularNo != null}" value="#{lbl['lbl.ct.circularNo']}"  />  
           <p:commandLink  rendered="#{contractDetailsBackingBean.managedBean.ctCircular.circularNo != null}"  style="margin-right:20px;" ajax="false">  
           <h:outputText value="#{contractDetailsBackingBean.managedBean.ctCircular.circularNo}"  styleClass="linkcommand" />  
           </p:commandLink> 
            <f:verbatim></f:verbatim> 
           <h:outputLabel  rendered="#{contractDetailsBackingBean.managedBean.ctAgreement.agreementId != null}" value="#{lbl['lbl.ct.agreeemntno']}" />  
           <p:commandLink  rendered="#{contractDetailsBackingBean.managedBean.ctAgreement.agreementId != null}"  style="margin-right:20px;"  ajax="false">  
           <h:outputText value="#{contractDetailsBackingBean.managedBean.ctAgreement.agreementId}"  styleClass="linkcommand"/>  
           </p:commandLink>  
        </h:panelGrid>
        <h:panelGrid columns="1" style="width:770px;" >  
         <h:panelGrid columns="2">
           <h:panelGroup>
             <div style="height: 30px;width:100px; vertical-align: top">
		     <p:outputLabel for="contractName" value="#{lbl['lbl.ct.cname']}" />
		     </div>
		   </h:panelGroup>
	       <h:panelGrid>
			 <p:inputTextarea id="contractName" value="#{contractDetailsBackingBean.managedBean.ctContract.contractName}" required="false" 
				 rows="3" cols="65" disabled="false" autoResize="false" />
		   </h:panelGrid>
		 </h:panelGrid>
		 
          <h:panelGrid columns="4">
          <h:panelGroup>
            <div style="width:100px;">
              <h:outputLabel value="#{lbl['lbl.ct.owner']}" />  
            </div>
           </h:panelGroup>
             <p:selectOneMenu disabled="false"  value="" style="width:170px;">
              <f:selectItems value="#{contractDetailsBackingBean.contractListItem.contractOwner}" />
             </p:selectOneMenu>
             <p:selectOneMenu  disabled="false" style="width:140px;">
             <f:selectItems value="#{contractDetailsBackingBean.contractListItem.contractOwnerJabatan}" />
             </p:selectOneMenu>
             <p:selectOneMenu  disabled="false" style="width:120px;">
               <f:selectItems value="#{contractDetailsBackingBean.contractListItem.contractOwnerPtj}" />
             </p:selectOneMenu>
             </h:panelGrid>         
	</h:panelGrid>
	</p:panel>
</ui:composition>
