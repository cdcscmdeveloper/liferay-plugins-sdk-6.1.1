<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="fd" toggleable="true" collapsed="false" toggleSpeed="500">
	<f:facet name="header">
		<h:outputText value="#{lbl['lbl.ct.panel.contract']}"/>
		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fulfilment.dtls']}"/>
   	</f:facet>
	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br/><br/>
	<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		<h:panelGroup style="width:765px;" >
			<table style="width: 100%">
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="cno" value="#{lbl['lbl.ct.contract.no']}" />
					</td>
					<td>
						<p:inputText for="cno"  disabled="true" maxlength="17" style="width:130px;"
							value="#{contractDetailsBackingBean.managedBean.ctContract.contractNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.no']}" />
					</td>
					<h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.ctContractAmount.agreement}">
					<td class="columnWidth150">
						<p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physical.no']}" />
					</td> 
					<td>
						<p:inputText for="physicalNo" maxlength="30" style="width:130px;"
						disabled="#{contractDetailsBackingBean.getConditionalValue()}"
		 	    		value="#{contractDetailsBackingBean.managedBean.contractVer.contractPhysicalNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.physical.contract.no']}" />
					</td>
					</h:panelGroup>
				</tr>
				
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contract.amount']}" />
					</td>
					<td>
						<p:inputText for="contractAmount" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
			   				value="#{contractDetailsBackingBean.managedBean.ctContractAmount.contractAmount}"  disabled="true">
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</td>
					<td class="columnWidth150">
						<p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effective.date']}" />
					</td>
					<td>
						<p:inputText for="effectiveDate" disabled="true" style="width:80px;"
							value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
			    </tr>
			    
			    <tr>
			    <td class="columnWidth150">
						<p:outputLabel id="gstAmount" value="#{lbl['lbl.ct.gst.amt']}"  />
					</td>
					<td>
						<p:inputText for="gstAmount" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
			   				 disabled="#{!contractDetailsBackingBean.managedBean.disableGstAmount}" 
			   				 rendered="#{contractDetailsBackingBean.contractWithGst()}"
			   				 value="#{contractDetailsBackingBean.managedBean.ctContractAmount.gstAmount}" >
			   				<p:ajax  event="blur" update="overAllAmts" process="@this"  listener="#{contractDetailsBackingBean.calculateOrverAllAmt()}"></p:ajax>
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
						<p:inputText styleClass="ppRightBtn" style="width:130px;"
			   				 disabled="true" value="#{lbl['lbl.ct.gst.na']}"  rendered="#{!contractDetailsBackingBean.contractWithGst()}">
						</p:inputText>
					</td>
					<td class="columnWidth150">
						<p:outputLabel id="edate" value="#{lbl['lbl.ct.expiry.date']}" />
					</td> 
					<td>
						<p:inputText for="edate" disabled="true" style="width:80px;"
							value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
				</tr>
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="overAllAmt" value="#{lbl['lbl.ct.gst.all.amt']}" />
					</td>
					<td>
						<p:inputText id="overAllAmts" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
			   				value="#{contractDetailsBackingBean.managedBean.gstTotalAmount}"  disabled="true">
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</td>
					<h:panelGroup rendered="#{!contractDetailsBackingBean.managedBean.ctContract.zonalPricing}">
					<td class="columnWidth150">
	     	             	<p:outputLabel id="dperiodtxt" value="#{lbl['lbl.ct.delivery.period']}" style="width:100%" styleClass="required" />
					</td> 
					<td><p:inputText id="dperiod" styleClass="ppRightBtn" validator="#{webappBean.validateDPeriod}" required="true" style="width:45px;"
		              		maxlength="4" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}"
		              		disabled="#{contractDetailsBackingBean.managedBean.viewContract}" label="#{lbl['lbl.ct.delivery.period']}" />
                		<p:spacer width="3"/>
                		<h:outputText value="#{lbl['lbl.ct.days']}" />
                	</td>
                	</h:panelGroup>
				</tr>
				<h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.ctContractAmount.agreement}">
				<tr rowspan="2">
					<h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.ctContractAmount.ctAgreement.status.statusId != CtStatusConst.acComplete and
						contractDetailsBackingBean.managedBean.ctContractAmount.ctAgreement.status.statusId != CtStatusConst.saComplete}">
					<td class="columnWidth150">
						<p:outputLabel for="astatus" value="#{lbl['lbl.ct.agreement.status']}" />
					</td>
					<td>
						<p:inputTextarea id="astatus" autoResize="false" maxlength="1000" 
							disabled="true" rows="2" style="width:130px;margin-bottom:5px;"
							value="#{contractDetailsBackingBean.getStatusDescById(contractDetailsBackingBean.managedBean.ctContractAmount.ctAgreement.status.statusId)}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.status']}" />
					</td>
					</h:panelGroup>
					<h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.ctContractAmount.ctAgreement.status.statusId eq CtStatusConst.acComplete or
						contractDetailsBackingBean.managedBean.ctContractAmount.ctAgreement.status.statusId eq CtStatusConst.saComplete}">
					<td styleClass="columnWidth150">
						<p:outputLabel id="agreement" value="#{lbl['lbl.ct.agreement']}" />
					</td>
					<td>
						<h:commandLink for="agreement" styleClass="blue_font"
							title="#{contractDetailsBackingBean.managedBean.ctContractAmount.ctAgreement.fileName}"
							value="#{contractDetailsBackingBean.getShortFileName(contractDetailsBackingBean.managedBean.ctContractAmount.ctAgreement.fileName)}"
							action="#{contractDetailsBackingBean.downloadFile(contractDetailsBackingBean.managedBean.ctContractAmount.ctAgreement.filePath,
							contractDetailsBackingBean.managedBean.ctContractAmount.ctAgreement.fileName)}" />
					</td>
					</h:panelGroup>
					<td class="columnWidth150">
						<p:outputLabel id="signBy" value="#{lbl['lbl.ct.signed.date']}" />
					</td> 
					<td>
						<p:inputText for="signBy" disabled="true" style="width:80px;"
							value="#{contractDetailsBackingBean.managedBean.agreementContractVer.signedDate}">
			   				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
					</td>
				</tr>
				</h:panelGroup>
				<tr rowspan="4">
					<td class="columnWidth150">
						<p:outputLabel for="contractName" value="#{lbl['lbl.ct.contract.title']}" />
					</td>
					<td colspan="3">
						<p:inputTextarea id="contractName" autoResize="false" maxlength="1000"
							disabled="true" rows="4" style="width:455px; margin-bottom:5px;" 
							value="#{contractDetailsBackingBean.managedBean.ctContract.contractName}" />
					</td>					
				</tr>
			</table>
		</h:panelGroup>
		<h:panelGrid  style="width:265px; margin-left:5px">
		   <h:panelGrid columns="3" rendered="#{!contractDetailsBackingBean.managedBean.directPurchase}">
			 <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.concession}"
			 	 disabled="#{contractDetailsBackingBean.managedBean.viewContract or contractDetailsBackingBean.managedBean.ctContractAmount.agreement}">
			    <p:ajax event="change" update=":form:justificationPanel,:form:exemptId" listener="#{contractDetailsBackingBean.chkJustificationAction}" process="@this"/> 
			 </p:selectBooleanCheckbox>
			 <p:spacer width="2" />
			 <h:panelGrid columns="2">
				 <h:outputText value="#{lbl['lbl.ct.concession']}" />
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.concession']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox 
		        value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		     <h:panelGrid columns="2">
			     <h:outputText value="#{lbl['lbl.ct.fee.exmption']}"/>
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fee.exmption']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.ctContractAmount.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <h:panelGrid columns="2">
			     <h:outputText value="#{lbl['lbl.ct.agreement']}" />
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement']}" />
			 </h:panelGrid>
	       </h:panelGrid>	
	       <h:panelGrid columns="3" 
	           rendered="#{false and !contractDetailsBackingBean.managedBean.directPurchase}">
			  <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.mto']}"  />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.mto']}" />
			  </h:panelGrid>
		   </h:panelGrid>	
		   <h:panelGrid columns="3" rendered="#{!contractDetailsBackingBean.managedBean.directPurchase}">
			  <p:selectBooleanCheckbox id="exemptId" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			    	disabled="#{contractDetailsBackingBean.managedBean.chkConceValue or contractDetailsBackingBean.managedBean.viewContract or contractDetailsBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode==ParameterConst.contractTypeCentral}" 
			    	style="text-align:top;">
			     <p:ajax event="change" update=":form:justificationPanel" listener="#{contractDetailsBackingBean.chkJustificationAction}" process="@this"/> 
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.ap201']}"  />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap201.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3" 
		     rendered="#{contractDetailsBackingBean.managedBean.ctContract.loa.loaAmt > contractDetailsBackingBean.managedBean.performanceBondRuleAmt
		     and !contractDetailsBackingBean.managedBean.directPurchase}">
			 <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.ctContractAmount.bondReq ? false : true}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.pb.exemption']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>		
	    </h:panelGrid>
	</h:panelGrid>
	<p:outputPanel id="justificationPanel">
	 <h:panelGrid columns="2" style="width:765px;"  columnClasses="columnWidth150"
 		rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt or 
       	contractDetailsBackingBean.managedBean.contractVer.ctContractValue.concession}">
	   	   <p:outputLabel id="justificationLbls" value="#{lbl['lbl.ct.justification.ap201']}"  styleClass="required"/>
	  <h:panelGrid columns="2">
	    <p:inputTextarea id="justificationLbl" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.justification}"
		  	rows="3" style="width:455px;" maxlength="200" label="#{lbl['lbl.ct.justification.ap201']}"
		  	required="true" autoResize="false" disabled="#{contractDetailsBackingBean.managedBean.viewContract}"></p:inputTextarea>
		   	<p:message for="justificationLbl" display="icon"/>	
	  </h:panelGrid>	
	   	     <p:outputLabel id="ap201FileId"   value="#{lbl['lbl.ct.upload.ap201']}"  
	   	           styleClass="required"    rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}"/>
	   <h:panelGroup id="uploadAp201Pg">
			 <p:commandButton oncomplete="uploadAp201Dlg.show();return false;" icon="iconAttachment" 
				 update="uploadAp201Pg" value="#{lbl['lbl.bpm.choose.file']}" disabled="#{contractDetailsBackingBean.managedBean.viewContract}"/>	
		     <h:commandLink value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.ap201FileName}" 
		          styleClass="blue_font" action="#{contractDetailsBackingBean.downloadFile(contractDetailsBackingBean.managedBean.contractVer.ctContractValue.ap201FilePath, contractDetailsBackingBean.managedBean.contractVer.ctContractValue.ap201FileName)}" />					
		</h:panelGroup>
    </h:panelGrid> 
  </p:outputPanel>
  <p:dialog id="uploadAp201Dlg" widgetVar="uploadAp201Dlg" modal="true" 
	   	width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" 
			fileUploadListener="#{contractDetailsBackingBean.uploadAp201File}" 
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="#{lbl['lbl.ct.upload.invalid.msg']}"
			update="uploadAp201Pg" >
		</p:fileUpload> 
	</p:dialog>
 </p:panel>
</ui:composition>
