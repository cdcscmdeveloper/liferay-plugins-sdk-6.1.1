<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.contract']}" toggleable="true" collapsed="false" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		    <h:panelGrid columns="4" style="width:770px;" columnClasses="columnWidth150,columnWidth200,columnWidth150,columnWidth200">
		      <p:outputLabel id="cno" value="#{lbl['lbl.ct.contract.no']}" />
			  <p:inputText for="cno"  disabled="true" style="width:170px;" 
			     maxlength="17" value="#{contractDetailsBackingBean.managedBean.ctContract.contractNo}" />
			  <p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physical.no']}" />
		 	  <p:inputText for="physicalNo" maxlength="30" style="width:170px;"
		 	    value="#{contractDetailsBackingBean.managedBean.ctContract.contractPhysicalNo}"/>				
		      <p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effective.date']}" />
			  <p:inputText for="effectiveDate" style="width:170px;" disabled="true"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate}">
				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  </p:inputText>
			  <p:outputLabel id="edate" value="#{lbl['lbl.ct.expiry.date']}" />
			  <p:inputText for="edate" style="width:170px;" disabled="true" 
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate}">
				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  </p:inputText>
			  <p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contract.amount']}" />
			  <p:inputText for="contractAmount" styleClass="ppRightBtn"  maxlength="22"
			    value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"  disabled="true" style="width:170px;">
				   <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>	
			<p:outputLabel id="signBy" value="#{lbl['lbl.ct.signed.date']}"  rendered="#{contractDetailsBackingBean.managedBean.ctContract.agreement}" />
			<p:inputText for="signBy"  value="#{contractDetailsBackingBean.managedBean.ctContract.currentAgreement.signedDate}"
			   rendered="#{contractDetailsBackingBean.managedBean.ctContract.agreement}" disabled="true" style="width:170px;"
			   label="#{lbl['lbl.ct.delivery.period']}" >
			   <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</p:inputText>
			<h:panelGrid columns="2" style="float:right;" rendered="#{!contractDetailsBackingBean.managedBean.ctContract.zonalPricing}">
				<p:outputLabel value="*" styleClass="mandatory" />
				<p:outputLabel id="dperiodtxt" value="#{lbl['lbl.ct.delivery.period']}"  />
			</h:panelGrid> 
			<h:panelGrid columns="5"  rendered="#{!contractDetailsBackingBean.managedBean.ctContract.zonalPricing}">  
		    	<p:inputText id="dperiod" styleClass="ppRightBtn" style="width:45px;" validator="#{webappBean.validateDPeriod}"
		              maxlength="4" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}"/>
                <p:spacer width="2" />
                <p:selectOneMenu id="deliveryTerm" 
                   value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.deliveryTermUom.parameterId}" 
                   style="width:120px;" required="true" label="#{lbl['lbl.ct.delivery.period']}" >
			       <f:selectItems value="#{contractDetailsBackingBean.getDropdownValues(ParameterTypeConst.deliveryTerm)}" />
			   </p:selectOneMenu>
			   <p:message for="deliveryTerm" display="icon"/>
			</h:panelGrid>	
			
			<f:verbatim rendered="#{contractDetailsBackingBean.managedBean.ctContract.zonalPricing and !contractDetailsBackingBean.managedBean.ctContract.agreement}"/>
			<f:verbatim rendered="#{contractDetailsBackingBean.managedBean.ctContract.zonalPricing and !contractDetailsBackingBean.managedBean.ctContract.agreement}"/>
			 <p:outputLabel for="astatus" value="#{lbl['lbl.ct.agreement.status']}"
			 	rendered="#{contractDetailsBackingBean.managedBean.ctContract.agreement and 
				  			contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
						 	contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
						 	!contractDetailsBackingBean.managedBean.ctContract.zonalPricing}" />
			 <p:inputText id="astatus" style="width:170px;" disabled="true"
				value="#{contractDetailsBackingBean.getStatusDescById(contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}"
				rendered="#{contractDetailsBackingBean.managedBean.ctContract.agreement and 
				  			contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
						 	contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
						 	!contractDetailsBackingBean.managedBean.ctContract.zonalPricing}" />
			 <p:outputLabel id="agreement" value="#{lbl['lbl.ct.agreement']}"
			 	rendered="#{contractDetailsBackingBean.managedBean.ctContract.agreement and 
							(contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			!contractDetailsBackingBean.managedBean.ctContract.zonalPricing}" />
			 <h:commandLink for="agreement" value="#{contractDetailsBackingBean.managedBean.ctContract.currentAgreement.fileName}" styleClass="blue_font" 
				rendered="#{contractDetailsBackingBean.managedBean.ctContract.agreement and 
							(contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			!contractDetailsBackingBean.managedBean.ctContract.zonalPricing}"
				action="#{contractDetailsBackingBean.downloadFile(contractDetailsBackingBean.managedBean.ctContract.currentAgreement.filePath,
							contractDetailsBackingBean.managedBean.ctContract.currentAgreement.fileName)}" />
			<h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="#{lbl['lbl.ct.contract.title']}" />
			</div>
			</h:panelGroup>
		    <h:panelGrid>
			<p:inputTextarea id="contractName"
				value="#{contractDetailsBackingBean.managedBean.ctContract.contractName}" maxlength="1000"
				required="false" rows="3" style="width:170px;margin-bottom: 5px;" disabled="true" autoResize="false" />	
			</h:panelGrid>	
			<p:outputLabel id="astatus1" value="#{lbl['lbl.ct.agreement.status']}"
				rendered="#{contractDetailsBackingBean.managedBean.ctContract.agreement and 
			 			 	contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
					 	 	contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
					 	 	contractDetailsBackingBean.managedBean.ctContract.zonalPricing}" />
			<p:inputText for="astatus1" style="width:170px;" disabled="true" 
			  	value="#{contractDetailsBackingBean.getStatusDescById(contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}"
			 	rendered="#{contractDetailsBackingBean.managedBean.ctContract.agreement and 
			 			 	contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
					 	 	contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
					 	 	contractDetailsBackingBean.managedBean.ctContract.zonalPricing}" />
			<p:outputLabel id="agreement1" value="#{lbl['lbl.ct.agreement']}"
			 	rendered="#{contractDetailsBackingBean.managedBean.ctContract.agreement and 
							(contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			contractDetailsBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:commandLink for="agreement1" value="#{contractDetailsBackingBean.managedBean.ctContract.currentAgreement.fileName}" styleClass="blue_font" 
				rendered="#{contractDetailsBackingBean.managedBean.ctContract.agreement and 
							(contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			contractDetailsBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			contractDetailsBackingBean.managedBean.ctContract.zonalPricing}"
				action="#{contractDetailsBackingBean.downloadFile(contractDetailsBackingBean.managedBean.ctContract.currentAgreement.filePath,
							contractDetailsBackingBean.managedBean.ctContract.currentAgreement.fileName)}" />
	    </h:panelGrid>
		<h:panelGrid  style="width:230px;">
		   <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.concession}">
			    <p:ajax event="change" update=":form:justificationPanel,:form:exemptId" listener="#{contractDetailsBackingBean.chkJustificationAction}" process="@this"/> 
			 </p:selectBooleanCheckbox>
			 <p:spacer width="2" />
			 <p:outputLabel value="#{lbl['lbl.ct.concession']}" />
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		     <p:outputLabel value="#{lbl['lbl.ct.fee.exmption']}"/>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox 
			  value="#{contractDetailsBackingBean.managedBean.ctContract.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
	       </h:panelGrid>	
	       <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
		   </h:panelGrid>	
		   <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox id="exemptId" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			    disabled="#{contractDetailsBackingBean.managedBean.chkConceValue}" style="text-align:top;">
			     <p:ajax event="change" update=":form:justificationPanel" listener="#{contractDetailsBackingBean.chkJustificationAction}" process="@this"/> 
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.ap201']}" style="text-align:top;" />
		   </h:panelGrid>
		   <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.ctContract.bondReq ? false : true}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.pb.exemption']}" style="text-align:top;" />
		   </h:panelGrid>		
	    </h:panelGrid>
	</h:panelGrid>
	<p:outputPanel id="justificationPanel">
	 <h:panelGrid columns="2" style="width:740px;" 
	 rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt or 
	       contractDetailsBackingBean.managedBean.contractVer.ctContractValue.concession}">
         <h:panelGroup>
		    <div style="height:90px; width:157px; vertical-align:top;">
		       <h:panelGrid columns="2" style="float:right;margin-right:-11px;">
		           <p:outputLabel value="*" styleClass="mandatory" />
			   	   <p:outputLabel id="justificationLbls" value="#{lbl['lbl.ct.justification.ap201']}" />
			   </h:panelGrid>
		    </div>
	     </h:panelGroup>
	  <h:panelGrid columns="2">
	    <p:inputTextarea id="justificationLbl" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.justification}"
		  rows="4" style="width:570px;" maxlength="200" label="#{lbl['lbl.ct.justification.ap201']}"
		  required="true" autoResize="false">
		   <p:ajax oncomplete="$('.ui-state-error').removeClass('ui-state-error');" update="justificationPanel"/></p:inputTextarea>
		   <p:message for="justificationLbl" display="icon"/>	
	  </h:panelGrid>		
    </h:panelGrid> 
  </p:outputPanel>
 </p:panel>
</ui:composition>
