<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true" collapsed="false" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		   <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth15,columnWidth20,columnWidth20,columnWidth20">
		      <p:outputLabel id="cno" value="#{lbl['lbl.ct.cno']}" />
			  <p:inputText for="cno" value="#{contractDetailsBackingBean.managedBean.ctContract.contractNo}" 
			     disabled="true" style="width:170px;" />
			  <p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physicalNo']}" />
		 	  <p:inputText for="physicalNo" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}" style="width:170px;" />				
		      <p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effectiveDate']}" />
			  <p:inputText for="effectiveDate" style="width:170px;" disabled="true"
				value="#{contractDetailsBackingBean.convertTime(contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate)}" />
			  <p:outputLabel id="edate" value="#{lbl['lbl.ct.edate']}" />
			  <p:inputText for="edate" style="width:170px;" disabled="true"
				value="#{contractDetailsBackingBean.convertTime(contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate)}" />
			  <p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contractAmount']}" />
			  <p:inputText for="contractAmount" styleClass="ppRightBtn" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				 disabled="true" style="width:170px;">
				   <f:convertNumber pattern="#,###.00" />
			</p:inputText>	
			<p:outputLabel id="signBy" value="Signed Date" />
			<p:inputText for="signBy" disabled="true" style="width:170px;"/>
			<h:outputLabel id="dperiod" value="#{lbl['lbl.ct.dperiod']}" rendered="#{!contractDetailsBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:panelGrid columns="3" rendered="#{!contractDetailsBackingBean.managedBean.ctContract.zonalPricing}">
				<p:inputText for="dperiod" styleClass="ppRightBtn" size="23" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" 
					disabled="#{contractDetailsBackingBean.managedBean.ctContract.zonalPricing}" />
				<p:spacer width="2"/>
				<p:outputLabel value="Days" />
			</h:panelGrid>	
			<f:verbatim rendered="#{!contractDetailsBackingBean.managedBean.ctContract.zonalPricing}"/>
			<f:verbatim rendered="#{!contractDetailsBackingBean.managedBean.ctContract.zonalPricing}"/>
			<h:outputLabel
				rendered="#{contractDetailsBackingBean.managedBean.ctContract.circular.latestCircularVer.circularNo != null}"
				value="#{lbl['lbl.ct.circularNo']}" />
			<p:commandLink
				rendered="#{contractDetailsBackingBean.managedBean.ctContract.circular.latestCircularVer.circularNo != null}"
				style="margin-right:20px;" ajax="false">
				<h:outputText
					value="#{contractDetailsBackingBean.managedBean.ctContract.circular.latestCircularVer.circularNo}"
					styleClass="linkcommand" />
			</p:commandLink>
			
			<h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="Contract Title" />
			</div>
			</h:panelGroup>
		    <h:panelGrid>
			<p:inputTextarea id="contractName"
				value="#{contractDetailsBackingBean.managedBean.ctContract.contractName}"
				required="false" rows="3" cols="31" disabled="true"
				autoResize="false" />	
			</h:panelGrid>	
			 <p:outputLabel id="astatus" value="Agreement Status" />
			 <p:inputText for="astatus" style="width:170px;" disabled="true" />
	    </h:panelGrid>
		<h:panelGrid  style="width:180px;">
		   <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="false">
			    <p:ajax event="change" update="justificationPanel" listener="#{contractDetailsBackingBean.chkJustificationAction}" process="@this"/> 
			 </p:selectBooleanCheckbox>
			 <p:spacer width="2" />
			 <p:outputLabel value="Concession" />
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="true" disabled="true"/>
		     <p:spacer width="2" />	
		     <p:outputLabel value="Fee Exemption"/>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox 
			  value="#{contractDetailsBackingBean.managedBean.ctContract.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
	       </h:panelGrid>	
	       <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.ctContract.mto}"
				 disabled="false" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
		   </h:panelGrid>	
		   <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.ctContract.mto}" disabled="false" style="text-align:top;">
			     <p:ajax event="change" update="justificationPanel" listener="#{contractDetailsBackingBean.chkJustificationAction}" process="@this"/> 
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <p:outputLabel value="AP201 Exemption" style="text-align:top;" />
		   </h:panelGrid>	
	    </h:panelGrid>
	</h:panelGrid>
	<p:outputPanel id="justificationPanel">
	 <h:panelGrid columns="2" style="width:100%;" columnClasses="columnWidth15" 
	    rendered="#{contractDetailsBackingBean.managedBean.ctContract.mto or contractDetailsBackingBean.managedBean.contractVer.ctContractValue.concession}">
         <h:panelGroup>
		    <div style="height:80px; vertical-align:top;">
			   <p:outputLabel for="justificationLbl" value="* Justification" />
		    </div>
	     </h:panelGroup>
	  <h:panelGrid>
	    <p:inputTextarea id="justificationLbl" 
		  rows="4" cols="113" disabled="false" autoResize="false" />	
	  </h:panelGrid>		
    </h:panelGrid> 
  </p:outputPanel>
 </p:panel>
</ui:composition>
