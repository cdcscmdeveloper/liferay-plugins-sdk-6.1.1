<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
   <p:panel id="sbd" header="#{lbl['lbl.ct.su.panel.name']}"  toggleable="true"  toggleSpeed="500">
    <h:panelGrid columns="2" style="width:100%" styleClass="top-aligned-columns">
       <h:panelGrid columns="2" style="width:95%;" columnClasses="columnWidth15,columnWidth30">
          <p:outputLabel value="Business Reg. No." />  
          <h:panelGrid columns="4">
             <p:inputText disabled="true" size="10" 
                value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.smSupplier.regNo}" />
             <p:spacer width="5"/>
             <p:outputLabel value="MOF No." />  
             <p:inputText disabled="true" size="10"
             	value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.smSupplier.smMofAccounts[0].mofNo}" />
          </h:panelGrid>
          <p:outputLabel value="Supplier Name" />
          <h:panelGrid columns="3">
          	 <p:inputText disabled="true" style="width:222px;" id="supplierCompanyName"
             	value="#{contractDetailsBackingBean.managedBean.supplierCompanyName}" />
             <p:spacer width="5"/>
             <h:panelGrid columns="3" rendered="#{!contractDetailsBackingBean.managedBean.viewContract and 
                contractDetailsBackingBean.managedBean.updateCompanyName}">
			    <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.companyNameChange}"
			       disabled="#{contractDetailsBackingBean.isApprover()}">
				   <p:ajax event="change" listener="#{contractDetailsBackingBean.retrieveCompanyName}" 
				      update="supplierCompanyName" />
				</p:selectBooleanCheckbox>
			    <p:spacer width="2" />	
			    <p:outputLabel value="Update Company Name" style="width:100px;"/>
		     </h:panelGrid>
          </h:panelGrid>
          <p:outputLabel value="Branch Name" />
          <p:inputText disabled="true" style="width:222px;" /> 
          <h:panelGroup>
            <div style="height: 40px; vertical-align:top;">
                <p:outputLabel for="supplierAddress" value="#{lbl['lbl.ct.su.address']}" />
            </div>
           </h:panelGroup>
           <h:panelGrid columns="3">
             <p:inputTextarea id="supplierAddress" disabled="true" value="#{contractDetailsBackingBean.managedBean.supplierAddress}" 
                rows="4" cols="31"   maxlength="200"  autoResize="false" style="margin-bottom: 5px;" />
             <p:spacer width="5"/>
             <h:panelGrid columns="3" rendered="#{!contractDetailsBackingBean.managedBean.viewContract and
                contractDetailsBackingBean.managedBean.updateSupplierAddress}">
			    <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.addressChange}" 
			       disabled="#{contractDetailsBackingBean.isApprover()}">
			       <p:ajax event="change" listener="#{contractDetailsBackingBean.retrieveSupplierAddress}" 
			          update="supplierAddress" />
			    </p:selectBooleanCheckbox>
			    <p:spacer width="2" />	
			    <p:outputLabel value="Update Address" style="width:100px;"/>
		     </h:panelGrid>
           </h:panelGrid>
           <p:outputLabel value="Contact Person" />  
           <p:inputText disabled="true" style="width:170px;" value="Mr Kamal" />
           <p:outputLabel  value="#{lbl['lbl.ct.su.tel.office']}"/>  
           <p:inputText  value="309-98-93039"  disabled="true" style="width:170px;" />
           <p:outputLabel  value="#{lbl['lbl.ct.su.fax']}"/>
           <p:inputText  disabled="true" style="width:170px;"  
              value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.smSupplierBranch.faxNo}"/>  
           <p:outputLabel  value="#{lbl['lbl.ct.su.email']}"/>  
           <p:inputText disabled="true" style="width:170px;" value="test@company.com"/>
        </h:panelGrid>
        <h:panelGrid columns="2" style="width:100%;"  columnClasses="columnWidth30,columnWidth30" 
           rendered="#{!contractDetailsBackingBean.managedBean.ctContract.factored}">
           <p:outputLabel  value="#{lbl['lbl.ct.bank.name']}"/>  
           <p:inputText  value="CIMB BANK" disabled="true" style="width:170px;" />
           <p:outputLabel  value="#{lbl['lbl.ct.bank.acc.no']}" />  
           <p:inputText value="0111-2345-8795" disabled="true" style="width:170px;"/> 
           <p:outputLabel  value="#{lbl['lbl.ct.bank.branch']}"/>  
           <p:inputText value="CYBERJAYA"  disabled="true" style="width:170px;" />
           <h:panelGroup>
              <div style="height: 60px; vertical-align: top;">
                   <p:outputLabel for="bankAddress" value="#{lbl['lbl.ct.bank.address']}" />
               </div>
           </h:panelGroup>
	       <h:panelGrid>
              <p:inputTextarea id="bankAddress"  value="Prima 5-A, Jalan Teknokrat 5,63000 Cyberjaya, Selangor Malaysia" 
                 disabled="true" rows="4" cols="31"  autoResize="false" style="margin-bottom: 5px;"/>
	       </h:panelGrid>
	       <p:outputLabel  value="#{lbl['lbl.ct.su.tel.office']}"/>  
           <p:inputText disabled="true" style="width:170px;"
              value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.smSupplierBranch.phoneNo}"   /> 
           <p:outputLabel  value="#{lbl['lbl.ct.su.fax']}"/>
           <p:inputText  value="309-98-93039" disabled="true" style="width:170px;"/>  
         </h:panelGrid>
         <h:panelGrid columns="2" style="width:100%;"  columnClasses="columnWidth30,columnWidth30" 
              rendered="#{contractDetailsBackingBean.managedBean.ctContract.factored}">
               <p:spacer style="width:100px;"/><p:spacer style="width:170px;"/>
         </h:panelGrid>
       </h:panelGrid>
    </p:panel>
</ui:composition>
