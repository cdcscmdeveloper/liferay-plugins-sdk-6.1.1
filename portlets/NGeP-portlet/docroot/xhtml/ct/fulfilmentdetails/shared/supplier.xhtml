<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
   <p:panel id="sbd" header="#{lbl['lbl.ct.su.panel.name']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelsbd">
     <h:panelGrid columns="4">
              <p:outputLabel value="#{lbl['lbl.ct.su.id']}" />  
              <p:inputText value="#{contractDetailsBackingBean.managedBean.smSupplier.supplierId}" style="width:170px;" disabled="false"/>
              <p:outputLabel value="Supplier Name" />  
              <p:inputText value="" disabled="false" style="width:170px;"/> 
              <p:outputLabel  value="#{lbl['lbl.ct.su.email']}"/>  
              <p:inputText  value="" required="true" disabled="false"  style="width:170px;"/>
              <p:outputLabel  value="#{lbl['lbl.ct.su.tel.hp']}"/>  
              <p:inputText  value="" required="true" disabled="false" style="width:170px;"/>  
              <p:outputLabel  value="#{lbl['lbl.ct.su.fax']}"/>
              <p:inputText  value="" required="true" disabled="false" style="width:170px;"/>  
              <p:outputLabel  value="#{lbl['lbl.ct.su.tel.office']}"/>  
              <p:inputText  value="" required="true" disabled="false"  style="width:170px;"  />
              <h:panelGroup>
              <div style="height: 30px; vertical-align: top">
                 <p:outputLabel for="supplierAddress" value="#{lbl['lbl.ct.su.address']}" />
              </div>
              </h:panelGroup>
              <h:panelGrid>
                 <p:inputTextarea id="supplierAddress" disabled="false" value="" required="false" 
                  rows="1" cols="23"   maxlength="100"  autoResize="false" />
              </h:panelGrid>
              
               <p:outputLabel  value="#{lbl['lbl.ct.bank.acc.no']}" />  
                <p:selectOneMenu disabled="false"  value="#{contractDetailsBackingBean.managedBean.smSupplierBank.accountNo}">
            	    <f:selectItems value="#{contractDetailsBackingBean.selectedBankAccount}" />
            	    <p:ajax event="change" update="changeAccValue" listener="#{contractDetailsBackingBean.changeAccDetails}" process="@this"/>  
	            </p:selectOneMenu>
        </h:panelGrid>
        <p:outputPanel id="changeAccValue"> 
            <h:panelGrid columns="4">  
                         <p:outputLabel  value="#{lbl['lbl.ct.bank.name']}"/>  
                         <p:inputText  value="" disabled="false" style="width:170px;"/> 
                         <p:outputLabel  value="#{lbl['lbl.ct.bank.branch']}"/>  
                         <p:inputText  value="#{contractDetailsBackingBean.managedBean.smSupplierBank.bankId}" disabled="false" style="width:170px;"/>
                         <h:panelGroup>
                             <div style="height: 40px; vertical-align: top">
                               <p:outputLabel for="bankAddress" value="#{lbl['lbl.ct.bank.address']}" styleClass="txtsize" />
                             </div>
                         </h:panelGroup>
	                     <h:panelGrid>
                            <p:inputTextarea id="bankAddress"  value="#{contractDetailsBackingBean.managedBean.smSupplierBank.addressId}" disabled="false" rows="1" cols="23"  autoResize="false" />
	                     </h:panelGrid>
	             </h:panelGrid>
	           </p:outputPanel>
     </p:panel>
</ui:composition>
