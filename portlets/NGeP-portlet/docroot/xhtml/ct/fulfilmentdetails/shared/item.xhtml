						<tr>
							<td rowspan="2"><h:graphicImage value="/css/images/design/#{ctBackingBean.determineIcon(attachFile)}" height="30" width="30"/></td>

								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<h:commandLink value="#{attachFile.fileName}" 
									styleClass="blue_font" action="#{ctBackingBean.downloadFile(attachFile)}" />
								<p:commandLink onsuccess="deleteItemAttachmentDlg.show();" action="#{ctBackingBean.setAttachFileIndex(attachFileIndex)}"

					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>
				</td>
			</tr>

		<p:dialog id="uploadItemDlg" widgetVar="uploadItemDlg" modal="true"  resizable="false"

		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{ctBackingBean.fileUpload}"
			mode="advanced" id="uploadItemId" multiple="true"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload.all']}" cancelLabel="#{lbl['lbl.btn.remove.all']}" 
			update="lampiranItem" >
		</p:fileUpload>
		<f:facet name="footer">
		<div class="ppRightBtn">
		    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadItemDlg.hide();" />

	</p:dialog>

		                         action="#{ctBackingBean.deleteItemAttachmentAction(ctBackingBean.managedBean.attachFileIndex)}"
		                         oncomplete="deleteItemAttachmentDlg.hide();"/>
			                 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteItemAttachmentDlg.hide();" type="button" />

                   </p:confirmDialog>
