<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
         <p:panel id="itemId" header="#{lbl['lbl.ct.item.panel.name']}"   toggleable="true"  toggleSpeed="500" widgetVar="panelitem">
            <p:dataTable id="tableItem" var="data" value=""
              paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			  rowsPerPageTemplate="5,10,15,20">
            
              <p:ajax event="rowSelect"   listener="#{contractDetailsBackingBean.onRowSelect}"  process="@this" update=":form:tabview:changeFields"/> 
              <p:ajax event="rowUnselect" listener="#{contractDetailsBackingBean.onRowUnselect}" />  
               <p:columnGroup type="header"> 
			  <p:row> 
				 <p:column style="width:80px" headerText="#{lbl['lbl.ct.item.table.code']}" /> 
				 <p:column style="width:320px" headerText="#{lbl['lbl.ct.item.table.name']}" /> 	
				 <p:column style="width:100px" headerText="#{lbl['lbl.ct.item.table.uom']}"  /> 
				 <p:column style="width:70px" headerText="#{lbl['lbl.ct.item.table.morder']}" /> 	
				 <p:column style="width:50px" headerText="#{lbl['lbl.ct.item.table.exmtd']}"  /> 
			  </p:row>							
			 </p:columnGroup>
			 <p:column><p:outputLabel value=""/></p:column>       
			 <p:column><p:outputLabel value=""/></p:column>       
			 <p:column><p:outputLabel value=""/></p:column>       
			 <p:column><p:outputLabel value=""/></p:column>       
			 <p:column styleClass="column-align-center"> 
			    <p:selectBooleanCheckbox value=""/></p:column>     
			</p:dataTable>
			<h:panelGrid columns="2" style="height:70px;text-align:bottom;">
			  <h:outputLabel for="show" value="#{lbl['lbl.ct.item.show']}" style="width:100px;"/>  
               <p:selectOneMenu id="show" disabled="false"  value="#{contractDetailsBackingBean.managedBean.showItem}"  style="width:200px;">
            	    <f:selectItems value="#{contractDetailsBackingBean.itemDetailsMethod}" />
            	    <p:ajax event="change" update="changeFields" listener="#{contractDetailsBackingBean.changeField}" process="@this"/>  
	            </p:selectOneMenu>         
	            <p:message for="show"/>  
              </h:panelGrid>
		   </p:panel>
		   <p:outputPanel id="changeFields"> 
		 	 <p:panel id="itemZoneId"  header="#{contractDetailsBackingBean.managedBean.showItem}"  toggleable="true"  toggleSpeed="500"  widgetVar="panelitemzone">
				<h:panelGrid rendered="#{contractDetailsBackingBean.managedBean.itemPricing}">
				   <p:dataTable id="tableItemZone"  var="data" value="#{contractDetailsBackingBean.ctItemPrice}" widgetVar="dataTableObj"
                    lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			        rowsPerPageTemplate="5,10,15,20">
				    <p:columnGroup type="header"> 
				    <p:row> 
				      <p:column headerText="#{lbl['lbl.ct.item.table1.price.zone']}" />
					  <p:column headerText="#{lbl['lbl.ct.item.table1.price.toqty']}" />
					  <p:column headerText="#{lbl['lbl.ct.item.table1.price.fqty']}" />
					  <p:column headerText="#{lbl['lbl.ct.item.table1.price.price']}" />
					  <p:column headerText="#{lbl['lbl.ct.item.table1.price.efdate']}" />
					  <p:column headerText="#{lbl['lbl.ct.item.table1.price.edate']}" />
					</p:row>	
				 </p:columnGroup>
				  <p:column> 						    
				  <p:outputLabel value="#{data.ctContractZone.zoneName}"/></p:column>       
			      <p:column><p:outputLabel value="#{data.tierTo}"/></p:column>       
			      <p:column><p:outputLabel value="#{data.tierFrom}"/></p:column>       
			      <p:column><p:outputLabel value="#{data.unitPrice}"/></p:column> 
			      <p:column><p:outputLabel value="#{data.effDate}"/></p:column>       
			      <p:column><p:outputLabel value="#{data.expDate}"/></p:column>      
			     </p:dataTable>
				 </h:panelGrid>
				  <h:panelGrid rendered="#{contractDetailsBackingBean.managedBean.itemCeilingQuantity}">
				  <p:dataTable id="tableItemZone1"  var="data" value="#{contractDetailsBackingBean.ctItemCeilingQty}" widgetVar="dataTableObj"
                    lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			        rowsPerPageTemplate="5,10,15,20">
					 <p:columnGroup type="header"> 
					<p:row> 
					   <p:column headerText="#{lbl['lbl.ct.item.table2.ceil.min']}"   /> 
					   <p:column headerText="#{lbl['lbl.ct.item.table2.ceil.jabatan']}" /> 
					   <p:column headerText="#{lbl['lbl.ct.item.table2.ceil.ptj']}" /> 
					   <p:column headerText="#{lbl['lbl.ct.item.table2.ceil.quan']}" /> 
					   <p:column headerText="#{lbl['lbl.ct.item.table1.price.efdate']}" />
					  <p:column headerText="#{lbl['lbl.ct.item.table1.price.edate']}" />
					</p:row>								
			       </p:columnGroup>
			        <p:column><p:outputLabel value=""/></p:column>       
			        <p:column><p:outputLabel value=""/></p:column>  
			        <p:column><p:outputLabel value=""/></p:column>       
			        <p:column><p:outputLabel value="#{data.ceilingQuantity}"/></p:column>  
			        <p:column><p:outputLabel value="#{data.effDate}"/></p:column>       
			        <p:column><p:outputLabel value="#{data.expDate}"/></p:column>  
				  </p:dataTable>
				  </h:panelGrid>
			     </p:panel>
	         </p:outputPanel>
</ui:composition>
