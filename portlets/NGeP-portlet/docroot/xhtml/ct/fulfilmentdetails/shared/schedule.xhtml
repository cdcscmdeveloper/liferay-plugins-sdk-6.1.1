<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="scheduleId" header="#{lbl['lbl.ct.sched.panel.name']}"  toggleable="true"  toggleSpeed="500">
	   <h:panelGrid columns="4">
         <p:selectOneRadio id="radiOptions"  required="true"
            value="#{contractDetailsBackingBean.managedBean.frequencySchedule}" 
               disabled="#{contractDetailsBackingBean.managedBean.disableScheduleRadio}">  
               <f:selectItems value="#{contractDetailsBackingBean.managedBean.radioButtonSchedule}" />
                  <p:ajax event="change"  update=":form:paymentSchedule"
                    process="@form" listener="#{contractDetailsBackingBean.progressivePayment}" /> 
            </p:selectOneRadio>
         </h:panelGrid>  
         <p:outputPanel id="paymentSchedule">   
         <h:panelGroup  style="width:100%;"
            rendered="#{contractDetailsBackingBean.managedBean.ctContract.frequencySchedule}">    
	        <p:dataTable id="tableSchedule" var="schedVar"
	           value="#{contractDetailsBackingBean.managedBean.contractVer.ctSchedules}" 
	           rowIndexVar="index" selection="#{contractDetailsBackingBean.selectedSchedule}" rowKey="#{schedVar}" >
	            <ac:paginator for="tableSchedule" />
	            <p:column selectionMode="multiple" style="width:1%;"/>
		        <p:column style="width:9%;" headerText="#{lbl['lbl.ct.sched.table.schedno']}" >
		           <p:inputText value="#{schedVar.scheduleNo}"  style="width:60px;" maxlength="4" styleClass="ppRightBtn" />
		        </p:column> 
		        <p:column style="width:35%;" headerText="#{lbl['lbl.ct.sched.speriod']}">
		           <p:selectOneMenu id="fromMonth" value="#{schedVar.fromTranDate}" style="width:120px;">
                      <f:selectItems value="#{contractDetailsBackingBean.monthList}"/>  
                      <p:ajax event="change" update=":form:tableSchedule" process="@form" listener="#{contractDetailsBackingBean.validateDate(schedVar)}"/> 
                   </p:selectOneMenu> 
                   <p:spacer width="1"/>
                   <p:selectOneMenu id="fromYear" value="#{schedVar.fromTranYear}" style="width:120px;">
                      <f:selectItems value="#{contractDetailsBackingBean.yearList}" var="year" itemValue="#{year}" itemLabel="#{year}"  />  
                      <p:ajax event="change" update=":form:tableSchedule" process="@form" listener="#{contractDetailsBackingBean.validateDate(schedVar)}"/> 
                   </p:selectOneMenu> 
		        </p:column> 	
		        <p:column style="width:40%;" headerText="#{lbl['lbl.ct.sched.eperiod']}">
		           <h:panelGroup>
		              <p:selectOneMenu id="toMonth" value="#{schedVar.toTranDate}"  style="width:120px;" >
                        <f:selectItems value="#{contractDetailsBackingBean.monthList}" />  
                        <p:ajax event="change" update=":form:tableSchedule" process="@form" listener="#{contractDetailsBackingBean.validateDate(schedVar)}" />
                      </p:selectOneMenu>
                   <p:spacer width="1"/>
                   <p:selectOneMenu id="toYear" value="#{schedVar.toTranYears}" style="width:120px;" >
                      <f:selectItems value="#{contractDetailsBackingBean.yearList}" />
                      <p:ajax event="change" update=":form:tableSchedule" process="@form" listener="#{contractDetailsBackingBean.validateDate(schedVar)}"/> 
                   </p:selectOneMenu>
                   <p:spacer width="5"/>
		               <p:graphicImage id="schedValidation" library="ep/images/design"   name="reject.png" 
		                    rendered="#{schedVar.validateScheduleDate}" styleClass="ui-icon-reject"
			                value="/css/images/design/reject.png"  style="margin-bottom: -5px;" />
			             <p:tooltip for="schedValidation" showEffect="fade" value="#{lbl['lbl.ct.sched.date.validation']}"/> 
		            </h:panelGroup>
		         </p:column> 
		         <p:column headerText="#{lbl['lbl.ct.sched.stype']}" style="width:15%;">
		            <p:selectOneMenu id="scheduleTypeid" value="#{schedVar.scheduleType.parameterId}" style="width:130px;"> 
                      <f:selectItems value="#{contractDetailsBackingBean.getScheduleTypeDropDown()}"/>
                      <p:ajax process="@this"/>
                   </p:selectOneMenu> 
		         </p:column>
		     </p:dataTable>  
	         <p:spacer height="2"  />
		        <div class="ppRightBtn"> 
		          <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" icon="ui-icon-add" 
		               action="#{contractDetailsBackingBean.addScheduleDetails}" update=":form:tableSchedule"/>
		 	      <p:commandButton value="Delete" process="@form" onclick="dlgSchedule.show()" icon="ui-icon-delete" />  
	            </div>
	          <p:dialog id="dlgSchedule" widgetVar="dlgSchedule" modal="true" width="350"
	             header="Delete Confirmation" styleClass="screen-title" resizable="false" height="95">  
                 <h:panelGrid columns="3">
                   <p:graphicImage library="ep/images/design" name="exclamation.png"
			          value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			          <p:spacer width="10"/>
                      <p:inputTextarea  rows="2"  styleClass="ui-inputtextarea"
                        value="Are you sure you want to delete this record?" cols="48" />
                 </h:panelGrid>
                 <div class="ppRightBtn">
		            <p:commandButton value="Yes" icon="ui-icon-accept" update="tableSchedule" process="@form" 
			           action="#{contractDetailsBackingBean.deleteScheduleDetails}" onclick="dlgSchedule.hide();"/>
			        <p:commandButton value="No" icon="ui-icon-reject" onclick="dlgSchedule.hide();" type="button" />
		         </div>
               </p:dialog>
           </h:panelGroup>
		   <h:panelGroup style="width:100%"
		     rendered="#{!contractDetailsBackingBean.managedBean.ctContract.frequencySchedule}" >
	        <p:dataTable id="tableProgress" var="ProgVar" 
	           value="#{contractDetailsBackingBean.managedBean.contractVer.ctProgressivePayments}" 
	           selection="#{contractDetailsBackingBean.selectedProgressive}" rowKey="#{ProgVar}" >
		       <ac:paginator for="tableProgress" />
		       <p:column selectionMode="multiple" style="width:1%;"/> 
               <p:column style="width:5%;" headerText="#{lbl['lbl.ct.sched.table1.phase']}">
                 <p:inputText value="#{ProgVar.phaseNo}" maxlength="4" style="width:25px;" styleClass="ppRightBtn" />
               </p:column>
		       <p:column style="width:30%;" headerText="#{lbl['lbl.ct.sched.table1.desc']}">
		          <p:inputText value="#{ProgVar.phaseDesc}" maxlength="50" style="width:200px;"/>
		       </p:column>
               <p:column style="width:25%;" headerText="#{lbl['lbl.ct.sched.speriod']}" >
		          <p:selectOneMenu id="fromProMonth" value="#{ProgVar.fromProDate}" style="width:120px;">
                   <f:selectItems value="#{contractDetailsBackingBean.monthList}" />  
                   <p:ajax event="change" update=":form:tableProgress" process="@form" listener="#{contractDetailsBackingBean.validateProgressiveDate(ProgVar)}"/>
                  </p:selectOneMenu> 
                   <p:spacer width="1"/>
                   <p:selectOneMenu id="fromProYear" value="#{ProgVar.fromProYear}" style="width:120px;">
                     <f:selectItems value="#{contractDetailsBackingBean.yearList}"/>  
                     <p:ajax event="change" update=":form:tableProgress" process="@form" listener="#{contractDetailsBackingBean.validateProgressiveDate(ProgVar)}"/>
                   </p:selectOneMenu> 
		        </p:column> 	
		        <p:column style="width:30%;" headerText="#{lbl['lbl.ct.sched.eperiod']}">
		          <h:panelGroup columns="5">
		            <p:selectOneMenu id="toProMonth" value="#{ProgVar.toProDate}"  style="width:120px;" >
                       <f:selectItems value="#{contractDetailsBackingBean.monthList}" />  
                       <p:ajax event="change" update=":form:tableProgress" process="@form" listener="#{contractDetailsBackingBean.validateProgressiveDate(ProgVar)}"/>
                     </p:selectOneMenu>
                     <p:spacer width="1"/>
                     <p:selectOneMenu id="toProYear" value="#{ProgVar.toProYears}" style="width:120px;" >
                        <f:selectItems value="#{contractDetailsBackingBean.yearList}" />  
                        <p:ajax event="change" update=":form:tableProgress" process="@form" listener="#{contractDetailsBackingBean.validateProgressiveDate(ProgVar)}"/> 
                     </p:selectOneMenu>
                     <p:spacer width="5"/>
		             <p:graphicImage id="validateProAction" library="ep/images/design" 
		                name="reject.png" value="/css/images/design/reject.png" 
		                style="margin-bottom: -5px;" styleClass="ui-icon-reject"  rendered="#{ProgVar.validateProgressiveDate}"/>
			            <p:tooltip for="validateProAction" showEffect="fade" value="#{lbl['lbl.ct.progr.date.validation']}"/> 
		           </h:panelGroup>
		         </p:column>       
                 <p:column style="width:9%;" headerText="#{lbl['lbl.ct.sched.table1.per']}">
                    <p:inputText value="#{ProgVar.percentage}" style="width:70px;" styleClass="ppRightBtn" label="#{lbl['lbl.ct.sched.table1.per']}">
                     <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" /></p:inputText> 
                  </p:column>
		        </p:dataTable>  
			    <p:spacer height="2" />
		        <div class="ppRightBtn"> 
		           <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@form" partialSubmit="true"
		            icon="ui-icon-add" update="tableProgress" action="#{contractDetailsBackingBean.addFrequencyDetails()}"/>
		           <p:spacer width="2"/>
		           <p:commandButton value="Delete" partialSubmit="true" process="@this" onclick="dlgProgressive.show()"  icon="ui-icon-delete"/>
		        </div>
		       <p:dialog id="dlgProgressive" widgetVar="dlgProgressive" width="350" height="95"
		          header="Delete Confirmation" styleClass="screen-title"  resizable="false" modal="true">  
                  <h:panelGrid columns="3">
                  <p:graphicImage library="ep/images/design" name="exclamation.png"
			         value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			      <p:spacer width="10"/>
                  <p:inputTextarea rows="2" styleClass="ui-inputtextarea" 
                    cols="48" value="Are you sure you want to delete this record?" />
                 </h:panelGrid>
                 <div class="ppRightBtn">
		           <p:commandButton value="Yes" icon="ui-icon-accept" update="tableProgress" process="@form" 
				     action="#{contractDetailsBackingBean.deleteFrequencyDetails}" onclick="dlgProgressive.hide();"/>
			       <p:commandButton value="No" icon="ui-icon-reject" onclick="dlgProgressive.hide();" type="button" />
		        </div>
               </p:dialog>
	        </h:panelGroup>    
		   </p:outputPanel>
        </p:panel>
        <p:panel header="#{lbl['lbl.ct.remarks']}" toggleable="true">
		 <table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.scheduleRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		           
</ui:composition>
