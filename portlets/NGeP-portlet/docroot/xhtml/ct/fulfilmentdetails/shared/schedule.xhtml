<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="scheduleId" header="#{lbl['lbl.ct.sched.panel.name']}"  toggleable="true"  toggleSpeed="500">
	      <h:panelGrid columns="4" >
            <p:selectOneRadio id="options" value="#{contractDetailsBackingBean.managedBean.scheduleOption}" required="true" 
               disabled="#{contractDetailsBackingBean.managedBean.disableScheduleRadio}">  
                  <f:selectItem itemLabel="#{lbl['lbl.ct.sched.fsched']}" itemValue="1"/>  
                  <f:selectItem itemLabel="#{lbl['lbl.ct.sched.progre']}" itemValue="2" /> 
                  <p:ajax event="change"  listener="#{contractDetailsBackingBean.progressivePayment}" 
                         process="@this" update=":form:tabview:paymentSchedule"/> 
            </p:selectOneRadio> 
         </h:panelGrid>  
          <p:outputPanel id="paymentSchedule">   
              <h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.chkSchedule}" style="width:100%;" >    
	             <p:dataTable id="tableSchedule" var="schedVar" value="#{contractDetailsBackingBean.managedBean.contractVer.ctSchedules}" rowIndexVar="index" 
	                 widgetVar="dataTableObj" lazy="true" selection="#{contractDetailsBackingBean.selectedSchedule}" rowKey="#{schedVar}" >
	                         <ac:paginator for="tableSchedule" />
		                     <p:column selectionMode="multiple" style="width:18px;"/>  
		                     <p:column style="width:250px;" headerText="#{lbl['lbl.ct.sched.table.schedno']}" >
		                         <p:outputLabel value="#{schedVar.scheduleNo}" style="float:left;"/>
		                     </p:column> 
		                     <p:column style="width:250px;" headerText="Start Period" >
		                         <p:calendar value="#{schedVar.fromDate}" id="popupButtonSch" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" navigator="true" showOn="button" />
		                     </p:column> 	
		                     <p:column style="width:250px;" headerText="End Period">
		                       	<p:calendar value="#{schedVar.toDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" id="popupButtonSch1" navigator="true" showOn="button"/>
		                     </p:column>       
		              </p:dataTable>  
	                <p:spacer height="2" />
		            <div class="ppRightBtn"> 
		                 <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" icon="ui-icon-add"
		                    action="#{contractDetailsBackingBean.addScheduleDetails}" update="tableSchedule"/>
			             <p:commandButton value="Delete" process="@form" onsuccess="schedule.show()" icon="ui-icon-delete" />  
			        </div>
			        <p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			             severity="alert" widgetVar="schedule">
                         <h:panelGrid columns="2">
				             <p:commandButton value="Yes" update="tableSchedule" partialSubmit="true" process="@form"
				                onclick="schedule.hide();" action="#{contractDetailsBackingBean.deleteScheduleDetails}"/>
				             <p:commandButton value="No" 	onclick="schedule.hide()" type="button" />
				         </h:panelGrid>
			        </p:confirmDialog>
			      </h:panelGroup>
			         <h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.chkProgressive}" style="width:100%">
	                     <p:dataTable id="tableProgress" var="ProgVar" value="#{contractDetailsBackingBean.managedBean.contractVer.ctProgressivePayments}" 
	                         selection="#{contractDetailsBackingBean.selectedProgressive}" rowKey="#{ProgVar}" >
		                    <ac:paginator for="tableProgress" />
		                     <p:column selectionMode="multiple" style="width:18px;"/> 
                             <p:column style="width:100px;" headerText="#{lbl['lbl.ct.sched.table1.phase']}">
                                <p:inputText value="#{ProgVar.phase}" style="width:40px;" />
                             </p:column>
		                     <p:column style="width:350px;" headerText="#{lbl['lbl.ct.sched.table1.desc']}">
		                        <p:inputText style="width:350px;"/>
		                     </p:column>
                             <p:column style="width:100px;" headerText="Start Period">
                                <p:calendar size="12" value="#{ProgVar.fromDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" navigator="true" id="popupButtonCal" showOn="button" />
                             </p:column> 
                             <p:column style="width:100px;" headerText="End Period">
                                <p:calendar size="12" value="#{ProgVar.toDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" navigator="true" id="popupButtonCal1" showOn="button" />
                             </p:column> 	
                             <p:column style="width:100px;" headerText="#{lbl['lbl.ct.sched.table1.per']}">
                                <p:inputText value="#{ProgVar.percentage}" style="width:100px;" styleClass="ppRightBtn">
                                    <f:convertNumber pattern="#,###.00" /></p:inputText>
                             </p:column> 
		               </p:dataTable>   
			     <p:spacer height="2" />
		         <div class="ppRightBtn"> 
		               <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@form" partialSubmit="true" icon="ui-icon-add" 
		                  update="tableProgress" action="#{contractDetailsBackingBean.addFrequencyDetails()}"/>
		               <p:spacer width="2"/>
		               <p:commandButton value="Delete" partialSubmit="true" process="@this" onsuccess="progressive.show()"  icon="ui-icon-delete"/>
		         </div>
		         <p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			           severity="alert" widgetVar="progressive">
                       <h:panelGrid columns="2">
				          <p:commandButton value="Yes" update="tableProgress"  process="@form"
				            onclick="progressive.hide();" action="#{contractDetailsBackingBean.deleteFrequencyDetails}"/>
				          <p:commandButton value="No" 	onclick="progressive.hide()" type="button" />
				       </h:panelGrid>
			</p:confirmDialog> 
		</h:panelGroup> 
		 <h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.chkProgressiveNulValue}" style="width:100%">
	        <p:dataTable id="tableProgressNulValue" var="data" value="#{contractDetailsBackingBean.managedBean.contractVer.ctProgressivePayments}" 
	           widgetVar="dataTableObj" >
		                    <ac:paginator for="tableProgressNulValue" />
		                    <p:columnGroup type="header"> 
			                   <p:row>
                                   <p:column style="width:100px;" headerText="#{lbl['lbl.ct.sched.table1.phase']}"/>
		                           <p:column style="width:400px;" headerText="#{lbl['lbl.ct.sched.table1.desc']}"/>
                                   <p:column style="width:100px;" headerText="Start Period"/> 
                                   <p:column style="width:100px;" headerText="End Period"/> 	
                                   <p:column style="width:100px;" headerText="#{lbl['lbl.ct.sched.table1.per']}"/> 
                               </p:row>	
			                </p:columnGroup>
			                 <p:column><p:outputLabel value="#{data.phase}" style="width:40px;" /> </p:column>  
			                <p:column> <p:outputLabel style="width:400px;"/> </p:column>         
			                <p:column><h:outputText value="#{data.fromDate}" style="float:left;">
                                 <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText></p:column>      
			                <p:column><h:outputText value="#{data.toDate}" style="float:left;">
                                 <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText></p:column>     
			                <p:column><h:outputLabel value="#{data.percentage}" style="width:50px;">
			                          <f:convertNumber pattern="#,###.00" /></h:outputLabel></p:column>
		               </p:dataTable>   
	        	</h:panelGroup> 
	        	 <h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.chkScheduleNulValue}" style="width:100%;" >    
	                  <p:dataTable id="tableScheduleValue" var="schedVar" value="#{contractDetailsBackingBean.managedBean.contractVer.ctSchedules}" 
	                         rowIndexVar="index" >
	                         <ac:paginator for="tableScheduleValue" />
		                     <p:columnGroup type="header"> 
		                        <p:row> 
		                               <p:column style="width:250px;" headerText="#{lbl['lbl.ct.sched.table.schedno']}" /> 
		                               <p:column style="width:250px;" headerText="Start Period" /> 	
		                               <p:column style="width:250px;" headerText="End Period"  />       
		                        </p:row>	
		                     </p:columnGroup>
		                     <p:column style="width:250px;"><p:outputLabel value="Schedule #{index+1}" style="float:left;" /></p:column>
	                         <p:column style="width:250px;"> <h:outputText value="#{schedVar.fromDate}" style="float:left;">
                                <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/> </h:outputText></p:column>
                             <p:column style="width:250px;"> <h:outputText value="#{schedVar.toDate}" style="float:left;">
                                <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /> </h:outputText></p:column>
		              </p:dataTable>  
			      </h:panelGroup>    
		 </p:outputPanel>
      </p:panel>
</ui:composition>
