<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
  
   
    <p:panel id="scheduleId" header="Schedule Details"  toggleable="true"  toggleSpeed="500" widgetVar="panelschedule">
                        
     <h:panelGrid columns="2">
      <p:outputLabel value="Frequency Schedule"/>
      <p:inputText value="" style="width:100px;"/>
       <p:outputLabel value="Progressive Payment"/>
        <p:selectBooleanCheckbox value=""/>
     </h:panelGrid>
     
              <h:panelGrid style="width:750px">
			                               <p:dataTable id="dataTable" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true"   rowIndexVar="index"
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row> 
									                  
									                     <p:column colspan="1" style="width:150px" headerText="No"  /> 
									                     <p:column colspan="1"  style="width:250px" headerText="Fulfillment Schedule No" /> 
									                     <p:column colspan="1"  style="width:150px" headerText="Start Date" /> 	
									                     <p:column colspan="1" style="width:150px" headerText="End Date"  /> 
									                
								               </p:row>	
								               						
								            </p:columnGroup>
							                   				
							              	<p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column>     
						                    <p:column><p:outputLabel value="(System generated upon contract approved)"/></p:column>
							                <p:column>   <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.createContractDetails.date}" 
							                id="popupButtonCal" showOn="button" />
                                            </p:column>   
                                            <p:column>   <p:calendar style="width:130px;" value="#{contractDetailsBackingBean.createContractDetails.date}" 
							                id="popupButtonCal1" showOn="button" />
                                            </p:column>        
							                 </p:dataTable>
							               </h:panelGrid>
						</p:panel>	               
						 <p:panel id="scheduleId1" header="Progressive Payment"  toggleable="true"  toggleSpeed="500" widgetVar="panelschedule1">
						                  
						            <h:panelGrid style="width:750px">
			                            <p:dataTable id="dataTable1" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
			                               paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
			                               rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row> 
									                  
									                     <p:column rowspan="1" style="width:100px" headerText="Phase"  />
									                     <p:column colspan="1"  style="width:200px" headerText="From" /> 
									                     <p:column colspan="1"  style="width:200px" headerText="To" /> 	
									                     <p:column colspan="1" style="width:100px" headerText="Percentage(%)"  /> 
									                    <p:column colspan="1" style="width:100px" headerText="Action"  /> 
									                       
								               </p:row>	
								               						
								            </p:columnGroup>
							                   				
							               <p:column><p:inputText value="1" style="width:80px;"/> </p:column>      
							               <p:column><p:calendar style="width:130px" value="#{contractDetailsBackingBean.createContractDetails.date}"
							                id="popupButtonCal" showOn="button" /> </p:column>      
							                <p:column><p:calendar style="width:130px" value="#{contractDetailsBackingBean.createContractDetails.date}" 
							                id="popupButtonCal1" showOn="button" />  </p:column>     
							                   <p:column><p:inputText value="" style="width:60px;"/></p:column>
							                  <p:column styleClass="column-align-center">
								                 <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" 
								                 icon="ui-icon-delete" styleClass="ui-icon-button"/>
							                     </p:column>    
							               </p:dataTable>
							               </h:panelGrid>
							               
							                <h:panelGrid style="width:750px" columnClasses="column-align-right">
							  <p:commandButton value="Add" styleClass="text-align: right;" process="@this" partialSubmit="true" icon="ui-icon-add" 
							 />
						   </h:panelGrid>
						   </p:panel>
</ui:composition>
