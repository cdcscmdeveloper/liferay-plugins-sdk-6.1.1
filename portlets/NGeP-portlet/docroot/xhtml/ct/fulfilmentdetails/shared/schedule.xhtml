<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="scheduleId" header="Frequency Schedule"  toggleable="true"  toggleSpeed="500">
	  <h:panelGrid style="width:100%;">
        <p:dataTable id="tableSchedule" var="schedVar" value="#{contractDetailsBackingBean.managedBean.contractVer.ctSchedules}" rowIndexVar="index" 
	          widgetVar="dataTableObj" lazy="true" selection="#{contractDetailsBackingBean.selectedSchedule}" rowKey="#{schedVar}" >
	          <ac:paginator for="tableSchedule" />
	          <c:if test ="#{contractDetailsBackingBean.managedBean.contractVer.brandNew}">
		        <p:column selectionMode="multiple" style="width:18px;"/>
		      </c:if>  
		      <p:column style="width:260px;" headerText="#{lbl['lbl.ct.sched.table.schedno']}" >
		        <p:outputLabel value="#{schedVar.scheduleNo}" style="float:left;"/>
		      </p:column> 
		      <p:column style="width:260px;" headerText="Start Period" >
		         <p:selectOneMenu id="fromMonth"  style="width:90px;" >
		            <f:selectItem itemLabel="-Select One-" itemValue=""/>
            		<f:selectItem itemLabel="January" itemValue="January"/>
                 </p:selectOneMenu>
                   <p:spacer width="1"/>
                 <p:selectOneMenu id="fromYear" style="width:90px;" >
            	     <f:selectItem itemLabel="-Select One-" itemValue=""/>
            		 <f:selectItem itemLabel="2014" itemValue="2014"/>
                 </p:selectOneMenu>
		       </p:column> 	
		      <p:column style="width:260px;" headerText="End Period">
		         <p:selectOneMenu id="toMonth"  style="width:90px;" >
		            <f:selectItem itemLabel="-Select One-" itemValue=""/>
            		<f:selectItem itemLabel="January" itemValue="January"/>
                 </p:selectOneMenu>
                 <p:spacer width="1"/>
                 <p:selectOneMenu id="toYear" style="width:90px;" >
            	     <f:selectItem itemLabel="-Select One-" itemValue=""/>
            		 <f:selectItem itemLabel="2014" itemValue="2014"/>
                 </p:selectOneMenu>
		      </p:column>       
		    </p:dataTable>  
		    </h:panelGrid>
	        <p:spacer height="2" />
		    <div class="ppRightBtn"> 
		      <c:if test ="#{contractDetailsBackingBean.managedBean.contractVer.brandNew}">
		        <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" icon="ui-icon-add" 
		           action="#{contractDetailsBackingBean.addScheduleDetails}" update="tableSchedule"/>
			    <p:commandButton value="Delete" process="@form" onsuccess="schedule.show()" icon="ui-icon-delete" />  
			  </c:if>
			</div>
			<p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			   severity="alert" widgetVar="schedule">
               <h:panelGrid columns="2">
				 <p:commandButton value="Yes" update="tableSchedule" partialSubmit="true" process="@form"
				    onclick="schedule.hide();" action="#{contractDetailsBackingBean.deleteScheduleDetails}"/>
				 <p:commandButton value="No" 	onclick="schedule.hide()" type="button" />
			   </h:panelGrid>
			</p:confirmDialog>
	  </p:panel>
	  <p:spacer height="100"/>
	  <p:panel id="frequencyId" header="Progressive Payment"  toggleable="true"  toggleSpeed="500">
	   <h:panelGrid style="width:100%;">
	        <p:dataTable id="tableProgress" var="ProgVar" value="#{contractDetailsBackingBean.managedBean.contractVer.ctProgressivePayments}" 
	           selection="#{contractDetailsBackingBean.selectedProgressive}" rowKey="#{ProgVar}" >
		       <ac:paginator for="tableProgress" />
		       <p:column selectionMode="multiple" style="width:18px;"/> 
               <p:column style="width:70px;" headerText="#{lbl['lbl.ct.sched.table1.phase']}">
                 <p:inputText value="#{ProgVar.phase}" style="width:40px;" />
               </p:column>
		       <p:column style="width:300px;" headerText="#{lbl['lbl.ct.sched.table1.desc']}">
		          <p:inputText style="width:300px;"/>
		       </p:column>
                <p:column style="width:150px;" headerText="Start Period" >
		         <p:selectOneMenu id="fromMonth"  style="width:90px;" >
		            <f:selectItem itemLabel="-Select One-" itemValue=""/>
            		<f:selectItem itemLabel="January" itemValue="January"/>
                 </p:selectOneMenu>
                   <p:spacer width="1"/>
                 <p:selectOneMenu id="fromYear" style="width:90px;" >
            	     <f:selectItem itemLabel="-Select One-" itemValue=""/>
            		 <f:selectItem itemLabel="2014" itemValue="2014"/>
                 </p:selectOneMenu>
		       </p:column> 	
		      <p:column style="width:150px;" headerText="End Period">
		         <p:selectOneMenu id="toMonth"  style="width:90px;" >
		            <f:selectItem itemLabel="-Select One-" itemValue=""/>
            		<f:selectItem itemLabel="January" itemValue="January"/>
                 </p:selectOneMenu>
                 <p:spacer width="1"/>
                 <p:selectOneMenu id="toYear" style="width:90px;" >
            	     <f:selectItem itemLabel="-Select One-" itemValue=""/>
            		 <f:selectItem itemLabel="2014" itemValue="2014"/>
                 </p:selectOneMenu>
		      </p:column>       
               <p:column style="width:100px;" headerText="#{lbl['lbl.ct.sched.table1.per']}">
                  <p:inputText value="#{ProgVar.percentage}" style="width:100px;" styleClass="ppRightBtn">
                     <f:convertNumber pattern="#,###.00" /></p:inputText>
               </p:column> 
		     </p:dataTable>  
		     </h:panelGrid>
			 <p:spacer height="2" />
		        <div class="ppRightBtn"> 
		           <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@form" partialSubmit="true" icon="ui-icon-add" 
		              update="tableProgress" action="#{contractDetailsBackingBean.addFrequencyDetails()}"/>
		           <p:spacer width="2"/>
		           <p:commandButton value="Delete" partialSubmit="true" process="@this" onsuccess="progressive.show()"  icon="ui-icon-delete"/>
		        </div>
		        <p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			       severity="alert" widgetVar="progressive">
                   <h:panelGrid columns="2">
				     <p:commandButton value="Yes" update="tableProgress"  process="@form"
				        onclick="progressive.hide();" action="#{contractDetailsBackingBean.deleteFrequencyDetails}"/>
				     <p:commandButton value="No" 	onclick="progressive.hide()" type="button" />
				   </h:panelGrid>
			    </p:confirmDialog> 
     </p:panel>
     <p:panel header="Remarks" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.scheduleRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		           
</ui:composition>
