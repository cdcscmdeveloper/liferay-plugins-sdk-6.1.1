<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="scheduleId" header="#{lbl['lbl.ct.panel.schedule']}"  toggleable="true"  toggleSpeed="500">
	   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.add.schedule']}" escape="false"/><br/>
	   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.delete.schedule']}" escape="false"/><br/><br/>
	   <h:panelGrid columns="4">
           <p:selectOneRadio id="radiOptions"  required="true"
               value="#{contractDetailsBackingBean.managedBean.frequencySchedule}" 
               disabled="#{contractDetailsBackingBean.managedBean.disableScheduleRadio}">  
               <f:selectItems value="#{contractDetailsBackingBean.managedBean.radioButtonSchedule}" />
               <p:ajax event="change"  update=":form:paymentSchedule"
                  process="@form" listener="#{contractDetailsBackingBean.progressivePayment}" /> 
            </p:selectOneRadio>
         </h:panelGrid>  
       
         <p:outputPanel id="paymentSchedule">   
             <h:panelGroup  style="width:100%;"  
                 rendered="#{contractDetailsBackingBean.managedBean.ctContract.frequencySchedule}">    
	             <p:dataTable id="tableSchedule" var="schedVar"
	                 value="#{contractDetailsBackingBean.managedBean.contractVer.ctSchedules}" 
	                 rowIndexVar="index" selection="#{contractDetailsBackingBean.selectedSchedule}" rowKey="#{schedVar}" >
	                 <ac:paginator for="tableSchedule" />
	                 <p:column selectionMode="multiple" style="width:1%;"/>
		       
		             <p:column style="width:9%;" headerText="#{lbl['lbl.ct.schedule.no']}" >
		                <p:inputText value="#{schedVar.scheduleNo}"  style="width:60px;" maxlength="4" styleClass="ppRightBtn" />
		             </p:column> 
		      
		             <p:column style="width:35%;" headerText="#{lbl['lbl.ct.start.period']}">
		                 <p:selectOneMenu id="fromMonth" value="#{schedVar.fromTranDate}" style="width:120px;">
                             <f:selectItems value="#{contractDetailsBackingBean.monthList}"/>  
                             <p:ajax event="change" update=":form:tableSchedule" 
                                process="@form" listener="#{contractDetailsBackingBean.validateDate(schedVar)}"/> 
                         </p:selectOneMenu> 
                         <p:spacer width="1"/>
                         <p:selectOneMenu id="fromYear" value="#{schedVar.fromTranYear}" style="width:120px;">
                              <f:selectItems value="#{contractDetailsBackingBean.yearList}" var="year" itemValue="#{year}" itemLabel="#{year}"  />  
                              <p:ajax event="change" update=":form:tableSchedule"
                                 process="@form" listener="#{contractDetailsBackingBean.validateDate(schedVar)}"/> 
                         </p:selectOneMenu> 
		            </p:column> 	
		       
		            <p:column style="width:40%;" headerText="#{lbl['lbl.ct.end.period']}">
		                  <h:panelGroup>
		                    <p:selectOneMenu id="toMonth" value="#{schedVar.toTranDate}"  style="width:120px;" >
                                <f:selectItems value="#{contractDetailsBackingBean.monthList}" />  
                                <p:ajax event="change" update=":form:tableSchedule"
                                    process="@form" listener="#{contractDetailsBackingBean.validateDate(schedVar)}" />
                            </p:selectOneMenu>
                            <p:spacer width="1"/>
                            <p:selectOneMenu id="toYear" value="#{schedVar.toTranYears}" style="width:120px;" >
                                <f:selectItems value="#{contractDetailsBackingBean.yearList}" />
                                <p:ajax event="change" update=":form:tableSchedule" 
                                   process="@form" listener="#{contractDetailsBackingBean.validateDate(schedVar)}"/> 
                            </p:selectOneMenu>
                            <p:spacer width="5"/>
		                      <p:graphicImage id="schedValidation" library="ep/images/design"  value="/css/images/design/reject.png"  
		                          name="reject.png"  rendered="#{schedVar.validateScheduleDate}" styleClass="ui-icon-reject" style="margin-bottom: -5px;" />
			                     <p:tooltip for="schedValidation" showEffect="fade" value="#{lbl['lbl.ct.schedule.date.validation']}"/> 
		                 </h:panelGroup>
		            </p:column> 
		           
		            <p:column headerText="#{lbl['lbl.ct.fulfilment.type']}" style="width:15%;">
		               <p:selectOneMenu id="scheduleTypeid" value="#{schedVar.scheduleType.parameterId}" style="width:130px;"> 
                            <f:selectItems value="#{contractDetailsBackingBean.getScheduleTypeDropDown()}"/>
                            <p:ajax process="@this"/>
                       </p:selectOneMenu> 
		           </p:column>
		    
		     </p:dataTable>  
	         <p:spacer height="2"  />
		        <div class="ppRightBtn"> 
		            <p:commandButton id="addScheduleBtn" value="#{lbl['lbl.btn.add']}" icon="ui-icon-add" 
		               action="#{contractDetailsBackingBean.addScheduleDetails}" update=":form:tableSchedule">
		               <p:tooltip for="addScheduleBtn">
						    <h:outputText value="#{lbl['lbl.ct.tooltip.add.schedule']}" escape="false" />
						</p:tooltip>
		       		</p:commandButton>
		 	        <p:commandButton id="deleteScheduleBtn" value="#{lbl['lbl.btn.delete']}" process="@form" onclick="dlgSchedule.show()" icon="ui-icon-delete">
		 	        	<p:tooltip for="deleteScheduleBtn">
						    <h:outputText value="#{lbl['lbl.ct.tooltip.delete.schedule']}" escape="false" />
						</p:tooltip>
		 	        </p:commandButton>  
	           </div>
	         
	          <p:dialog id="dlgSchedule" widgetVar="dlgSchedule" modal="true" width="330"
	            	styleClass="screen-title" resizable="false">  
                
                   <h:panelGrid columns="3">
                     <p:graphicImage library="ep/images/design" name="exclamation.png"
			            value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			          <p:spacer width="10"/>
                      <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
                  </h:panelGrid>
                 
                  <div class="ppRightBtn">
		            <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update="tableSchedule" process="@form" 
			           action="#{contractDetailsBackingBean.deleteScheduleDetails}" onclick="dlgSchedule.hide();"/>
			        <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgSchedule.hide();" type="button" />
		         </div>
               </p:dialog>
           </h:panelGroup>
		   
		   <h:panelGroup style="width:100%"
		        rendered="#{!contractDetailsBackingBean.managedBean.ctContract.frequencySchedule}" >
	            <p:dataTable id="tableProgress" var="ProgVar" 
	                value="#{contractDetailsBackingBean.managedBean.contractVer.ctProgressivePayments}" 
	                selection="#{contractDetailsBackingBean.selectedProgressive}" rowKey="#{ProgVar}" >
		           <ac:paginator for="tableProgress" />
		           <p:column selectionMode="multiple" style="width:1%;"/> 
                  
                   <p:column style="width:5%;" headerText="#{lbl['lbl.ct.phase']}">
                        <p:inputText value="#{ProgVar.phaseNo}" maxlength="4" 
                           style="width:25px;" label="#{lbl['lbl.ct.phase']}" styleClass="ppRightBtn" />
                   </p:column>
		      
		           <p:column style="width:30%;" headerText="#{lbl['lbl.ct.description']}">
		               <p:inputText value="#{ProgVar.phaseDesc}" 
		                   maxlength="50" style="width:200px;" label="#{lbl['lbl.ct.description']}" />
		           </p:column>
              
                   <p:column style="width:25%;" headerText="#{lbl['lbl.ct.start.period']}" >
		               <p:selectOneMenu id="fromProMonth" value="#{ProgVar.fromProDate}" style="width:120px;">
                           <f:selectItems value="#{contractDetailsBackingBean.monthList}" />  
                           <p:ajax event="change" update=":form:tableProgress"
                              process="@form" listener="#{contractDetailsBackingBean.validateProgressiveDate(ProgVar)}"/>
                      </p:selectOneMenu> 
                      <p:spacer width="1"/>
                      <p:selectOneMenu id="fromProYear" value="#{ProgVar.fromProYear}" style="width:120px;">
                         <f:selectItems value="#{contractDetailsBackingBean.yearList}"/>  
                         <p:ajax event="change" update=":form:tableProgress" 
                            process="@form" listener="#{contractDetailsBackingBean.validateProgressiveDate(ProgVar)}"/>
                      </p:selectOneMenu> 
		          </p:column> 	
		        
		          <p:column style="width:30%;" headerText="#{lbl['lbl.ct.end.period']}">
		             <h:panelGroup columns="5">
		                <p:selectOneMenu id="toProMonth" value="#{ProgVar.toProDate}"  style="width:120px;" >
                            <f:selectItems value="#{contractDetailsBackingBean.monthList}" />  
                            <p:ajax event="change" update=":form:tableProgress"
                               process="@form" listener="#{contractDetailsBackingBean.validateProgressiveDate(ProgVar)}"/>
                        </p:selectOneMenu>
                        <p:spacer width="1"/>
                        <p:selectOneMenu id="toProYear" value="#{ProgVar.toProYears}" style="width:120px;" >
                            <f:selectItems value="#{contractDetailsBackingBean.yearList}" />  
                            <p:ajax event="change" update=":form:tableProgress" 
                               process="@form" listener="#{contractDetailsBackingBean.validateProgressiveDate(ProgVar)}"/> 
                         </p:selectOneMenu>
                         <p:spacer width="5"/>
		                 <p:graphicImage id="validateProAction" library="ep/images/design" rendered="#{ProgVar.validateProgressiveDate}"
		                     name="reject.png" value="/css/images/design/reject.png" style="margin-bottom: -5px;" styleClass="ui-icon-reject" />
			              <p:tooltip for="validateProAction" showEffect="fade" value="#{lbl['lbl.ct.progressive.date.validation']}"/> 
		            </h:panelGroup>
		         </p:column>       
               
                   <p:column style="width:9%;" headerText="#{lbl['lbl.ct.percentage']}">
                       <p:inputText value="#{ProgVar.percentage}" style="width:70px;" styleClass="ppRightBtn" label="#{lbl['lbl.ct.percentage']}">
                       <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" /></p:inputText> 
                  </p:column>
		       </p:dataTable>  
			   
			    <p:spacer height="2" />
		       
		        <div class="ppRightBtn"> 
		           <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form" partialSubmit="true"
		            icon="ui-icon-add" update="tableProgress" action="#{contractDetailsBackingBean.addFrequencyDetails()}"/>
		           <p:spacer width="2"/>
		           <p:commandButton value="#{lbl['lbl.btn.delete']}" partialSubmit="true" process="@this" onclick="dlgProgressive.show()"  icon="ui-icon-delete"/>
		        </div>
		       
		       <p:dialog id="dlgProgressive" widgetVar="dlgProgressive" width="330"
		            styleClass="screen-title"  resizable="false" modal="true">  
                    <h:panelGrid columns="3">
                      <p:graphicImage library="ep/images/design" name="exclamation.png"
			             value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			           <p:spacer width="10"/>
                       <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
                    </h:panelGrid>
                   
                    <div class="ppRightBtn">
		               <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update="tableProgress" process="@form" 
				           action="#{contractDetailsBackingBean.deleteFrequencyDetails}" onclick="dlgProgressive.hide();"/>
			           <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgProgressive.hide();" type="button" />
		             </div>
               </p:dialog>
	       </h:panelGroup>    
	</p:outputPanel>
   </p:panel>
    <p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true">
		 <table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.scheduleRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.remark']}" rendered="#{remarkIndex==0}" />
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		           
</ui:composition>
