<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <p:panel id="scheduleId" header="#{lbl['lbl.ct.sched.panel.name']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelschedule">
    <h:panelGrid columns="2">
       <p:outputLabel value="#{lbl['lbl.ct.sched.fsched']}"/>
       <p:inputText value="" style="width:100px;"/>
       <p:outputLabel value="#{lbl['lbl.ct.sched.progre']}"/>
           <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractValues.progressivePayment}">
            <p:ajax event="change"  listener="#{contractDetailsBackingBean.progressivePayment}" process="@this" update=":form:tabview:paymentSchedule"/>
           </p:selectBooleanCheckbox>
     </h:panelGrid>
	 <p:dataTable id="tableSchedule" var="data" value="#{contractDetailsBackingBean.managedBean.ctContract.ctSchedules}" widgetVar="dataTableObj" 
	    rowIndexVar="index" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
		<p:columnGroup type="header"> 
		 <p:row> 
		  <p:column style="width:150px" headerText="#{lbl['lbl.ct.sched.table.no']}"  /> 
		  <p:column style="width:250px" headerText="#{lbl['lbl.ct.sched.table.schedno']}" /> 
		  <p:column style="width:150px" headerText="#{lbl['lbl.ct.sched.table.sdate']}" /> 	
		  <p:column style="width:150px" headerText="#{lbl['lbl.ct.sched.table.edate']}"  /> 
		</p:row>	
		</p:columnGroup>
		<p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column>     
		<p:column><p:outputLabel value="#{data.scheduleNo}" style="float:left;"/></p:column>
		<p:column><p:outputLabel value="#{data.startDate}"/></p:column>   
        <p:column><p:outputLabel value="#{data.endDate}"/></p:column>        
	  </p:dataTable>
	</p:panel>	
	 <p:outputPanel id="paymentSchedule">                
	 <p:panel header="#{lbl['lbl.ct.sched.panel1.name']}" rendered="#{contractDetailsBackingBean.managedBean.chkSchedule}"  toggleable="true"  toggleSpeed="500">
	    <p:dataTable id="tableProgress" var="data" value="#{contractDetailsBackingBean.managedBean.ctContract.ctProgressivePayments}" widgetVar="dataTableObj" 
		   paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
		   <p:columnGroup type="header"> 
			 <p:row> 
		        <p:column style="width:100px" headerText="#{lbl['lbl.ct.sched.table1.phase']}"  />
                <p:column style="width:200px" headerText="#{lbl['lbl.ct.sched.table1.from']}" /> 
                <p:column style="width:200px" headerText="#{lbl['lbl.ct.sched.table1.to']}" /> 	
                <p:column style="width:100px" headerText="#{lbl['lbl.ct.sched.table1.per']}"  /> 
                <p:column style="width:100px" headerText="#{lbl['lbl.ct.sched.table1.action']}"  /> 
            </p:row>	
			</p:columnGroup>
			<p:column><p:inputText value="#{data.phase}" style="width:80px;"/> </p:column>      
			<p:column>
			   <p:calendar style="width:130px" value="#{data.toDate}" id="popupButtonCal" showOn="button" />
		    </p:column>      
			<p:column>
			  <p:calendar style="width:130px" value="#{data.fromDate}" id="popupButtonCal1" showOn="button" />  
			</p:column>     
			<p:column>
			   <p:inputText value="#{data.percentage}" style="width:60px;"/>
			</p:column>
			<p:column styleClass="column-align-center">
		        <p:commandButton title="delete" onsuccess="confirmation5.show()" partialSubmit="true" process="@this" icon="ui-icon-delete">
					    <f:setPropertyActionListener value="#{data}" target="#{contractDetailsBackingBean.managedBean.ctProgressivePayment}" />
					  </p:commandButton>
			</p:column>    
		</p:dataTable>
		<h:panelGrid style="width:760px" columnClasses="column-align-right">
		  <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@this" partialSubmit="true" icon="ui-icon-add"
		  action="#{contractDetailsBackingBean.addScheduleDetails()}" update="tableProgress"/>
		</h:panelGrid>
		<p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			   severity="alert" widgetVar="confirmation5">
                 <h:panelGrid columns="2">
				 <p:commandButton value="Yes" update="tableProgress" partialSubmit="true" process="@this"
				    onclick="confirmation5.hide();" actionListener="#{contractDetailsBackingBean.deleteScheduleDetails()}"/>
				  <p:commandButton value="No" 	onclick="confirmation5.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>
   </p:panel>
   </p:outputPanel>
</ui:composition>
