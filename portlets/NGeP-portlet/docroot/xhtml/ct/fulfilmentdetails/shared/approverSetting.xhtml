<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel  header="Approver Setting"  toggleable="true"  toggleSpeed="500" widgetVar="panelapprover">  
    <h:panelGrid columns="2">
     <h:panelGroup>
	   <div style="height: 200px; width:150px; vertical-align: top; text-align: left">
        <h:outputLabel value="#{lbl['lbl.ct.set.app.name']}"/>
       </div>
       </h:panelGroup>
	   <h:panelGrid style="width:500px">
		 <p:pickList id="approverpickList" value="#{contractDetailsBackingBean.managedBean.settingDetails}" var="data"   
           itemValue="#{data}" itemLabel="#{data}" showSourceControls="true" showTargetControls="true" filterMatchMode="contains" >  
             <f:facet name="sourceCaption">Approver List</f:facet>  
             <f:facet name="targetCaption">Selected Approver</f:facet>  
             <p:ajax event="transfer" listener="#{contractDetailsBackingBean.onTransfer}"  />  
               <p:column style="width:75%;">  
            #{data}
          </p:column>  
         </p:pickList>  
       </h:panelGrid>
	</h:panelGrid>
   </p:panel>
</ui:composition>
