<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <p:panel id="panelSetting" header="#{lbl['lbl.ct.set.app.panel.name']}"  toggleable="true"  toggleSpeed="500">
       <h:panelGrid columns="2" style="width:700px">
        <h:panelGroup>
           <div style="height: 200px; width:150px; vertical-align: top; text-align: left">
		      	<p:outputLabel  value="#{lbl['lbl.ct.set.app.name']} :"/>
		    </div>
		 </h:panelGroup>
				<p:pickList id="pickList" value="#{contractDetailsBackingBean.pickListBean.approverList}"  var="dataList"   itemLabel="#{dataList}"  itemValue="#{dataList}" >
					<f:facet name="sourceCaption">Available Approver List</f:facet>  
					<f:facet name="targetCaption">Selected Approver List</f:facet>  
				</p:pickList>  
             </h:panelGrid>
          </p:panel>
</ui:composition>
