<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel id="qtnTenderPnl" header="#{lbl['lbl.ct.panel.procDtls']}" toggleable="true"  toggleSpeed="500">
		 <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth150,columnWidth350,columnWidth150,columnWidth200">
			<p:outputLabel value="#{lbl['lbl.ct.qt.procMode']}" />
		    <p:inputText  style="width:170px;" disabled="true" maxlength="50"
		      value="#{contractDetailsBackingBean.getParameterDesc(contractDetailsBackingBean.managedBean.ctContract.procurementMode)}" />
			<p:outputLabel value="#{lbl['lbl.ct.qt.pubDate']}" rendered="#{!contractDetailsBackingBean.managedBean.directPurchase}"/>
			<p:inputText  rendered="#{!contractDetailsBackingBean.managedBean.directPurchase}"
			  style="width:170px;" disabled="true" value="#{contractDetailsBackingBean.managedBean.ctContract.publishDate}">
				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" /></p:inputText>			
			<p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
			<p:inputText style="width:170px;" disabled="true" maxlength="30"
			 value="#{contractDetailsBackingBean.managedBean.ctContract.loaPhysicalNo}" />
			<p:outputLabel styleClass="ppRightBtn" value="#{lbl['lbl.ct.qt.loaAckDt']}" />
			<p:inputText style="width:170px;" disabled="true"
			  value="#{contractDetailsBackingBean.managedBean.ctContract.ackDate}">
			  <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</p:inputText>
			<p:outputLabel value="#{lbl['lbl.ct.fulfilmentType']}" />
			<p:inputText style="width:170px;" disabled="true"  
			  value="#{contractDetailsBackingBean.getParameterDesc(contractDetailsBackingBean.managedBean.ctContract.fulfillmentType)}" />			
			<p:outputLabel value="#{lbl['lbl.ct.serviceFee']}" />
			<h:panelGrid columns="2">
			   <p:inputText styleClass="ppRightBtn" style="width:160px;" disabled="true" 
			    maxlength="5"  value="#{contractDetailsBackingBean.managedBean.ctContract.serviceFee}"/>	
				<p:outputLabel value="%" />
		    </h:panelGrid>		
		</h:panelGrid>
	</p:panel>
</ui:composition>
