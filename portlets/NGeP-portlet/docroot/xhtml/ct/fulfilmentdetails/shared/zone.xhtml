<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
  
   
   
           <p:treeTable id="treetable" value="#{contractDetailsBackingBean.rootNode}" var="data">
        	       
        	               <p:column style="width:40%">  
                               <f:facet name="header"> Location Name  </f:facet>  
                               <h:outputText value="#{data.zoneName}" />  
                          </p:column>  
                  
                         <p:column style="width:40%" styleClass="removeBorder">  
                                   <h:outputText value="#{data.zonePeriod}" />  
                          </p:column>  
                   </p:treeTable>    
</ui:composition>
