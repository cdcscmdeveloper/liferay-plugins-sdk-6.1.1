<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.ct.panel.zone']}" toggleable="true">
		<table style="width: 100%">
		  <tr>
			  <td style="width: 105px"><p:outputLabel value="#{lbl['lbl.ct.location.level']}" /></td>
				  <td>
				  		<p:inputText id="locLevels2" disabled="true" 
				  			value="#{contractDetailsBackingBean.getParameterDesc(contractDetailsBackingBean.managedBean.contractVer.ctContract.locationLevel)}" />
				  </td>
			  </tr>
		  </table>
 		 <h:panelGrid width="100%" style="margin-top:20px">
 		  <p:treeTable id="zoneLocationDataTable"  value="#{contractDetailsBackingBean.managedBean.ctZoneTrees}"
 		    var="zoneTree">
 		    
 		    <p:column style="width:70%;">
            <f:facet name="header">#{lbl['lbl.ct.location.name']}</f:facet>
              <p:treeNode type="zone">
                  <h:outputText value="#{zoneTree.zone}"/>
              </p:treeNode>
              <p:treeNode type="state">
               <h:outputText value="#{zoneTree.state.stateName}"  />
              </p:treeNode>
              <p:treeNode type="district">
               <h:outputText value="#{zoneTree.district.districtName}"  />
              </p:treeNode>
               
              
        </p:column>
 
        <p:column style="width:30%;">
            <f:facet name="header"><h:outputText value="*" styleClass="mandatory" />#{lbl['lbl.ct.delivery.term']}</f:facet>
             <p:treeNode type="zone">
                <p:inputText value="#{zoneTree.deliveryTerm}"  rendered="#{zoneTree.zone != null}"  required="true"
                     style="width:40px;" styleClass="ppRightBtn" validator="#{webappBean.validateDPeriod}" label="Delivery Term" />
                <p:spacer width="2" />
                <p:selectOneMenu id="dTerms" value="#{zoneTree.uomId}"
                  required="true" rendered="#{zoneTree.zone != null}" style="width:100px;" label="#{lbl['lbl.ct.delivery.term']}">
			       <f:selectItems value="#{contractDetailsBackingBean.getDropdownValues(ParameterTypeConst.deliveryTerm)}" />
			    </p:selectOneMenu>
             </p:treeNode>
        </p:column>
      </p:treeTable>
 	 </h:panelGrid>
	</p:panel>
	<p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.zoneRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		  	
</ui:composition>
