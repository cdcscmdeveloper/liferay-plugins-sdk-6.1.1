<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="Zone Details" toggleable="true">
		<table style="width: 100%">
		  <tr>
			  <td style="width: 94px"><p:outputLabel value="Location Level" /></td>
			  <td><p:selectOneMenu id="locLevels" style="width: 178px;margin-bottom: 5px;" disabled="true"
			        value="#{contractDetailsBackingBean.managedBean.supplierLocation}">
                    <f:selectItems
						value="#{contractDetailsBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
					    <p:ajax event="change" listener="#{contractDetailsBackingBean.selectLocation}"></p:ajax>
				  </p:selectOneMenu></td>
			  </tr>
		  </table>
 		 <h:panelGrid width="100%" style="margin-top:20px">
			<p:dataTable id="zoneLocationDataTable" value="#{contractDetailsBackingBean.managedBean.zoneTrees}"
			   var="zoneTree" rowIndexVar="index">
			   <p:column headerText="Location">
				  <p:tree value="#{zoneTree}" var="location">
                      <p:treeNode type="zone">
						 <h:outputText value="#{location.locationName}" />
					  </p:treeNode>
					  <p:treeNode type="state">
						 <h:outputText value="#{location.locationName}" />
					  </p:treeNode>
					  <p:treeNode type="division">
						 <h:outputText value="#{location.locationName}" />
					  </p:treeNode>
					  <p:treeNode type="district">
						  <h:outputText value="#{location.locationName}" />
					  </p:treeNode>
					  <p:treeNode type="city">
					    <h:outputText value="#{location.locationName}" />
					  </p:treeNode>
					</p:tree>
				 </p:column>
				 <p:column headerText="Delivery Term">
					<p:inputText style="width:40px;"/>
					<p:spacer width="1"/>
                    <p:selectOneMenu id="dTerms" style="width:100px;"> 
                       <f:selectItem itemLabel="-Select One-" itemValue=""/>
                       <f:selectItem itemValue="Days" itemLabel="Days"  />  
                       <f:selectItem itemValue="Months" itemLabel="Months"  />  
                       <f:selectItem itemValue="Years" itemLabel="Years" />  
                    </p:selectOneMenu> 		
				 </p:column>
			</p:dataTable>
		 </h:panelGrid>
	 </p:panel>
</ui:composition>
