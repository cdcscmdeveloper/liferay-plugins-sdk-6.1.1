<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="cc" header="#{lbl['lbl.ct.panel.name']}" toggleable="true" collapsed="false" toggleSpeed="500">
	   <h:panelGrid columns="4" style="width:100%" columnClasses="columnWidth15,columnWidth30,columnWidth30,columnWidth30"
	    rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
		<p:outputLabel value="#{lbl['lbl.ct.agreement']}"/>
		<p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.agreement}" disabled="true" />
		<f:verbatim/><f:verbatim/>
	  </h:panelGrid>
	  <h:panelGrid columns="4" style="width:100%" columnClasses="columnWidth15,columnWidth30,columnWidth30,columnWidth30">
	  	<p:outputLabel id="cccno" value="#{lbl['lbl.ct.cno']}" />
			<p:inputText for="cccno" value="#{contractDetailsBackingBean.managedBean.contractVer.docNo}" 
			   disabled="true" style="width:170px;" />
			<p:outputLabel id="ccphysicalNo" value="#{lbl['lbl.ct.physicalNo']}" />
			<p:inputText for="ccphysicalNo" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}" style="width:170px;" />				
			
			<p:outputLabel id="cceffectiveDate" value="#{lbl['lbl.ct.effectiveDate']}" />
			<p:inputText for="cceffectiveDate" style="width:130px;" disabled="true"
				value="#{contractDetailsBackingBean.convertTime(contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate)}" />
			<p:outputLabel id="ccedate" value="#{lbl['lbl.ct.edate']}" />
			<p:inputText for="ccedate" style="width:130px;" disabled="true"
				value="#{contractDetailsBackingBean.convertTime(contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate)}" />
			
			
			<p:outputLabel id="cccontractAmount" value="#{lbl['lbl.ct.contractAmount']}" />
			<p:inputText for="cccontractAmount" styleClass="ppRightBtn" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				 disabled="true" style="width:130px;">
				   <f:convertNumber pattern="#,###.00" />
			</p:inputText>	
			 <h:outputLabel id="ccdperiod" value="#{lbl['lbl.ct.dperiod']}" />
			<h:panelGrid columns="3">
				<p:inputText for="ccdperiod" styleClass="ppRightBtn" size="8" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" 
					disabled="#{contractDetailsBackingBean.managedBean.ctContract.zonalPricing}" />
				<p:spacer width="2"/>
				<p:outputLabel value="Days" />
			</h:panelGrid>	
			
			 <h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="cccontractName" value="Contract Title" />
			</div>
			</h:panelGroup>
			 <h:panelGrid>
			<p:inputTextarea id="cccontractName"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.contractName}"
				required="false" rows="3" cols="31" disabled="true"
				autoResize="false" />	
			</h:panelGrid>		
			<f:verbatim /><f:verbatim />
			
			<h:outputLabel
				rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				value="#{lbl['lbl.ct.circularNo']}" />
			<p:commandLink
				rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				style="margin-right:20px;" ajax="false">
				<h:outputText
					value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo}"
					styleClass="linkcommand" />
			</p:commandLink>
		</h:panelGrid>
	</p:panel>
</ui:composition>
