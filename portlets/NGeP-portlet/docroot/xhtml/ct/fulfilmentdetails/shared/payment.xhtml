<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="paymentId" header="Payment History"  toggleable="true"  toggleSpeed="500" widgetVar="panelpayment">  
    <p:dataTable id="tablePayment" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
	   paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10">
	   <p:columnGroup type="header"> 
		<p:row> 
		  <p:column style="width:150px" headerText="#{lbl['lbl.ct.pay.table.no']}"  /> 
		  <p:column style="width:300px" headerText="#{lbl['lbl.ct.pay.table.payto']}" /> 
		  <p:column style="width:150px" headerText="#{lbl['lbl.ct.pay.table.invoice']}" /> 	
		  <p:column style="width:100px" headerText="#{lbl['lbl.ct.pay.table.invoice.amt']}"  /> 
		 </p:row>	
	   </p:columnGroup>
		<p:column>
		<p:commandLink id="fulfillmentNo" style="margin-right:20px;" process="@this"  partialSubmit="true" 
		 actionListener="#{contractDetailsBackingBean.changePaymentValue}">  
		  <h:outputText value="#{contractDetailsBackingBean.fulfillmentNo}"  styleClass="linkcommand"/>  
        </p:commandLink>  
	    </p:column>       
	  </p:dataTable>
      <h:panelGrid style="width:600px">
      <p:spacer height="8"/>
      <h:outputLabel  value="#{lbl['lbl.ct.pay.summ']}" style="width:100px;font-size:12px;font-weight:bold;float:left;"/>  
      <p:dataTable id="tablePaySum" var="data" value=" " widgetVar="dataTableObj" lazy="false" dynamic="true" 
		 paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10">
	     <p:columnGroup type="header"> 
		 <p:row> 
		   <p:column colspan="1" style="width:200px" headerText="#{lbl['lbl.ct.pay.table1.desc']}"  /> 
		   <p:column colspan="1"  style="width:150px" headerText="#{lbl['lbl.ct.pay.table1.amt']}" /> 
		 </p:row>	
		</p:columnGroup>
		<p:column></p:column>
       </p:dataTable>
     </h:panelGrid>
    </p:panel>
</ui:composition>
