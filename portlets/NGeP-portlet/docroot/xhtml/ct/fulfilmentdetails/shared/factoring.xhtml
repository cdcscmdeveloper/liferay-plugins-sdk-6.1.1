<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="factoringId" header="#{lbl['lbl.ct.fc.panel.name']}"    toggleable="true"  toggleSpeed="500" widgetVar="panelfactoring">    
    <h:panelGrid columns="1" style="width:750px;">  
     <h:panelGrid columns="2" style="width:430px;">  
     <h:outputLabel  value="#{lbl['lbl.ct.fc.name']}"/>  
     <p:inputText  value="MOF"  disabled="false" style="width:260px;" />  
      <h:outputLabel  value="#{lbl['lbl.ct.fc.authname']}"  />  
      <p:inputText  value="#{contractDetailsBackingBean.managedBean.ctFactoring.authRefNo}" disabled="false" style="width:200px;" />  
      <h:outputLabel  value="#{lbl['lbl.ct.fc.fdate']}"  />  
      <p:inputText  value="#{contractDetailsBackingBean.managedBean.ctFactoring.effDate}" disabled="false" style="width:160px;" >
       <f:convertDateTime pattern="MM/dd/yyyy" />
       </p:inputText>  
      <h:outputLabel  value="#{lbl['lbl.ct.fc.edate']}" />  
      <p:inputText  value="#{contractDetailsBackingBean.managedBean.ctFactoring.expDate}" disabled="false" style="width:160px;">
       <f:convertDateTime pattern="MM/dd/yyyy" />
      </p:inputText>  
      <h:outputLabel  value="#{lbl['lbl.ct.fc.adate']}" />  
      <p:inputText  value="#{contractDetailsBackingBean.managedBean.ctFactoring.approvedDate}" disabled="false" style="width:160px;" >
       <f:convertDateTime pattern="MM/dd/yyyy" />
       </p:inputText>  
    </h:panelGrid>
  </h:panelGrid>
 </p:panel>
</ui:composition>
