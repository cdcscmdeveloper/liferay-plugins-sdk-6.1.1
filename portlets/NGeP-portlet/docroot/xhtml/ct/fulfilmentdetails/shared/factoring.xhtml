<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="factoringId" header="#{lbl['lbl.ct.fc.panel.name']}"    toggleable="true"  toggleSpeed="500" widgetVar="panelfactoring">    
    <h:panelGrid columns="1" style="width:750px;">  
     <h:panelGrid columns="2" style="width:430px;" class="formTable">  
     <h:outputLabel  value="#{lbl['lbl.ct.fc.name']}" style="width:180px;" styleClass="txtsize"/>  
     <p:inputText  value="#{contractDetailsBackingBean.managedBean.factoringCompany.factoringName}"  disabled="false" style="width:260px;" />  
      <h:outputLabel  value="#{lbl['lbl.ct.fc.authname']}"  styleClass="txtsize"/>  
      <p:inputText  value="#{contractDetailsBackingBean.managedBean.factoringCompany.authRefNo}" disabled="false" style="width:200px;" />  
      <h:outputLabel  value="#{lbl['lbl.ct.fc.fdate']}"  styleClass="txtsize"/>  
      <p:inputText  value="#{contractDetailsBackingBean.managedBean.factoringCompany.effDate}" disabled="false" style="width:160px;" />  
      <h:outputLabel  value="#{lbl['lbl.ct.fc.edate']}"  styleClass="txtsize"/>  
      <p:inputText  value="#{contractDetailsBackingBean.managedBean.factoringCompany.expDate}" disabled="false" style="width:160px;" />  
      <h:outputLabel  value="#{lbl['lbl.ct.fc.adate']}"  styleClass="txtsize"/>  
      <p:inputText  value="#{contractDetailsBackingBean.managedBean.factoringCompany.appDate}" disabled="false" style="width:160px;" />  
    </h:panelGrid>
  </h:panelGrid>
 </p:panel>
</ui:composition>
