<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <p:panel id="itemId" header="Product Details"   toggleable="true"  toggleSpeed="500">
      <h:panelGrid  style="width:100%;">
        	<p:dataTable id="itemTable" var="data" value="#{contractDetailsBackingBean.contractItemList}" rowKey="#{data}" 
              	selectionMode="single" selection="#{contractDetailsBackingBean.managedBean.selectedCCItem}" lazy="true" >
               	<ac:paginator for="itemTable"/>
               	<p:ajax event="rowSelect" update=":form:tabview:changeFields" />
		     	   <p:column headerText="Item Name">
		     	      <p:outputLabel value="#{data.itemName}" style="float:left;"/> </p:column>       
		     	   <p:column headerText="UOM">
		     	      <p:outputLabel value="#{data.uom.uomName}" style="float:left;"/> </p:column>        
		     	   <p:column headerText="Minimum Order Qty." style="text-align: right;">
		     	     <p:outputLabel value="#{data.minimumOrderQty}"/></p:column>   
		     	   <p:column headerText="Maximum Qty." style="text-align: right;">
		     		 <p:outputLabel value="#{data.maxProcureAmount}"/></p:column>     
		     	   <p:column headerText="Type Of Goods">
		     		  <p:outputLabel value="#{contractDetailsBackingBean.getParameterDesc(data.itemOrigin)}" 
		     		    style="float:left;" />
		     	   </p:column>              
    		 </p:dataTable> 
       </h:panelGrid>
		  <p:spacer height="20"/>
		  <p:outputPanel id="changeFields">
		  <h:panelGrid columns="1" style="width:100%"
			rendered="#{contractDetailsBackingBean.managedBean.selectedCCItem!=null}">
		    <p:dataTable id="itemPriceTable" var="data" value="#{contractDetailsBackingBean.managedBean.selectedCCItem.ctItemPrices}"
			   rowKey="#{data}" lazy="true" >
			   <ac:paginator for="itemPriceTable"/>
			   <p:column headerText="From Qty." style="text-align: right;">
				  <p:outputLabel value="#{data.tierFrom}"/>
			   </p:column>       
			   <p:column headerText="To Qty." style="text-align: right;">
				  <p:outputLabel value="#{data.tierTo}"/>
			   </p:column>              
			   <p:column headerText="Price (MYR)" style="text-align: right;"><p:outputLabel value="#{data.unitPrice}"/></p:column>            
			   <p:column headerText="Effective Date">
				  <p:calendar style="width:130px;" value="#{data.effDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" 
				  disabled="true" />
			   </p:column>       
			   <p:column headerText="Expiry Date">
				  <p:calendar style="width:130px;" value="#{data.expDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				   disabled="true"  />
			   </p:column>       
			</p:dataTable>
	  	  </h:panelGrid>
		  </p:outputPanel>	     
  	</p:panel>
	<p:panel header="Remarks" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.itemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		  	
  	
 </ui:composition>
