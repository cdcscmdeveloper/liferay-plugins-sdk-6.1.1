<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <p:panel id="centralItemId" header="#{lbl['lbl.ct.panel.product']}"   toggleable="true"  toggleSpeed="500">
       <h:panelGrid  style="width:100%;">
           <p:dataTable id="centralitemTable" var="data" widgetVar="centralProductObj"
              value="#{contractDetailsBackingBean.managedBean.ctItemList}" rowKey="#{data}"  
              selectionMode="single" selection="#{contractDetailsBackingBean.managedBean.selectedItem}" >
              <ac:paginator for="centralitemTable"/>
              <p:ajax event="rowSelect" update=":form:changeCentralItemField"  />
		    
		      <p:column headerText="#{lbl['lbl.ct.item.name']}" 
		           filterBy="#{data.itemName}" style="width:40%;" filterMatchMode="contains">
		           <p:outputLabel value="#{data.itemName}" style="float:left;" /> 
		       </p:column>       
		       <p:column headerText="#{lbl['lbl.ct.uom']}" style="width:10%;">
		           <p:outputLabel value="#{data.uom.uomName}" style="float:left;"/> 
		       </p:column>        
		
		        <p:column headerText="#{lbl['lbl.ct.min.order.qty']}" style="text-align: right;width:15%;">
		           <h:outputText value="#{data.minimumOrderQty}">
		               <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, data.uom.uomCode)}" />					
		            </h:outputText>
		        </p:column>   
		
		        <p:column headerText="#{lbl['lbl.ct.max.order.qty']}" style="text-align: right;width:15%;">
		            <h:outputText value="#{data.maxProcureAmt}">
		               <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, data.uom.uomCode)}" />					
		            </h:outputText>
		        </p:column>     
		   
		        <p:column headerText="#{lbl['lbl.ct.type.of.goods']}" style="width:10%;">
		            <h:outputLabel rendered="#{data.itemOrigin.parameterCode eq 'Local'}" 
		               value="#{contractDetailsBackingBean.getParameterDesc(data.itemOrigin)}" style="float:left;"/>
		            <p:commandLink value="#{contractDetailsBackingBean.getParameterDesc(data.itemOrigin)}" 
		                styleClass="blue_font" rendered="#{data.itemOrigin.parameterCode eq 'Imported'}"  onclick="importedDlg.show();return false;" />	
		        </p:column> 
		   
		       <p:column headerText="Status" style="width:10%;">
		            <p:outputLabel value="#{data.recordStatusFlg == 1 ?  'Active' : 'Inactive' }"/>
		        </p:column> 
		                         
    	 </p:dataTable> 
       </h:panelGrid>
		<p:outputPanel id="changeCentralItemField">
		   <p:spacer height="50"/>
		    <h:panelGrid rendered="#{contractDetailsBackingBean.managedBean.selectedItem != null}" columns="1" style="width:100%">
		     
		      <p:dataTable id="centralItemPriceTier" var="data"
		          value="#{contractDetailsBackingBean.managedBean.selectedItem.ctItemPrices}" rowKey="#{data}">
			     <ac:paginator for="centralItemPriceTier"/>	        
			     
			        <c:if test="#{contractDetailsBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeStandard}">
			             <p:column headerText="#{lbl['lbl.ct.price']}" style="text-align: right;">
			                <p:outputLabel value="#{data.unitPrice}"/>
			             </p:column>   
                          <p:column headerText="#{lbl['lbl.ct.effective.date']}">
			                <h:outputText value="#{data.effDate}" style="float:left;">
                             <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                           </h:outputText>
			             </p:column>       
			             <p:column headerText="#{lbl['lbl.ct.expiry.date']}">
			                <h:outputText value="#{data.expDate}" style="float:left;">
                              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                            </h:outputText>
			             </p:column>
			       </c:if>  
			   
			       <c:if test="#{contractDetailsBackingBean.managedBean.selectedItem.priceType.parameterCode eq ParameterConst.priceTypeTier}">
			             <p:column headerText="#{lbl['lbl.ct.from.qty']}" style="text-align: right;">
				              <p:outputLabel value="#{data.fromQty}"/>
			             </p:column>       
			             <p:column headerText="#{lbl['lbl.ct.to.qty']}" style="text-align: right;">
				           <p:outputLabel value="#{data.toQty}"/>
			            </p:column> 
			            <p:column headerText="#{lbl['lbl.ct.price']}" style="text-align: right;">
			                <p:outputLabel value="#{data.unitPrice}"/>
			            </p:column>
			            <p:column headerText="#{lbl['lbl.ct.effective.date']}">
			                <h:outputText value="#{data.effDate}" style="float:left;">
                             <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                           </h:outputText>
			             </p:column>       
			             <p:column headerText="#{lbl['lbl.ct.expiry.date']}">
			                <h:outputText value="#{data.expDate}" style="float:left;">
                              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                            </h:outputText>
			            </p:column>     
			        </c:if>   
			       
			         <c:if test="#{contractDetailsBackingBean.managedBean.selectedItem.priceType.parameterCode
			            eq ParameterConst.priceTypeZonalStandard}">
			             <p:column headerText="#{lbl['lbl.ct.zone']}">
			               <p:outputLabel value="#{data.ctContractZone.zoneName}" style="float:left;" />
			            </p:column>    
			            <p:column headerText="#{lbl['lbl.ct.price']}" style="text-align: right;">
			                <p:outputLabel value="#{data.unitPrice}"/>
			            </p:column>
			            <p:column headerText="#{lbl['lbl.ct.effective.date']}">
			                <h:outputText value="#{data.effDate}" style="float:left;">
                             <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                           </h:outputText>
			             </p:column>       
			             <p:column headerText="#{lbl['lbl.ct.expiry.date']}">
			                <h:outputText value="#{data.expDate}" style="float:left;">
                              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                            </h:outputText>
			            </p:column>     
			         </c:if>
			   
			         <c:if test="#{contractDetailsBackingBean.managedBean.selectedItem.priceType.parameterCode
			            eq ParameterConst.priceTypeZonalTier}">
			             <p:column headerText="#{lbl['lbl.ct.zone']}">
			               <p:outputLabel value="#{data.ctContractZone.zoneName}" style="float:left;" />
			            </p:column> 
			            <p:column headerText="#{lbl['lbl.ct.from.qty']}" style="text-align: right;">
				              <p:outputLabel value="#{data.fromQty}"/>
			             </p:column>       
			             <p:column headerText="#{lbl['lbl.ct.to.qty']}" style="text-align: right;">
				           <p:outputLabel value="#{data.toQty}"/>
			            </p:column>    
			            <p:column headerText="#{lbl['lbl.ct.price']}" style="text-align: right;">
			                <p:outputLabel value="#{data.unitPrice}"/>
			            </p:column>
			            <p:column headerText="#{lbl['lbl.ct.effective.date']}">
			                <h:outputText value="#{data.effDate}" style="float:left;">
                             <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                           </h:outputText>
			             </p:column>       
			             <p:column headerText="#{lbl['lbl.ct.expiry.date']}">
			                <h:outputText value="#{data.expDate}" style="float:left;">
                              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                            </h:outputText>
			            </p:column>     
			         </c:if> 
                 
                     <c:if test="#{contractDetailsBackingBean.managedBean.selectedItem.priceType.parameterCode
			            eq ParameterConst.priceTypeTariff}">
			             <p:column headerText="#{lbl['lbl.ct.from.qty']}" style="text-align: right;">
				            <p:outputLabel value="#{data.fromQty}"/>
			            </p:column>       
			            <p:column headerText="#{lbl['lbl.ct.to.qty']}" style="text-align: right;">
				            <p:outputLabel value="#{data.toQty}"/>
			            </p:column>  
			            <p:column headerText="#{lbl['lbl.ct.sub.seq']}" style="text-align: right;">
				           <p:outputLabel/>
			            </p:column> 
			            <p:column headerText="#{lbl['lbl.ct.price']}" style="text-align: right;">
			                <p:outputLabel value="#{data.unitPrice}"/>
			            </p:column>            
			            <p:column headerText="#{lbl['lbl.ct.effective.date']}">
			              <h:outputText value="#{data.effDate}" style="float:left;">
                            <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                          </h:outputText>
			           </p:column>       
			           <p:column headerText="#{lbl['lbl.ct.expiry.date']}">
			              <h:outputText value="#{data.expDate}" style="float:left;">
                             <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                          </h:outputText>
			           </p:column>           
			        </c:if> 
			
			        <c:if test="#{contractDetailsBackingBean.managedBean.selectedItem.priceType.parameterCode
			            eq ParameterConst.priceTypeZonalTariff}">            
			         <p:column headerText="#{lbl['lbl.ct.zone']}">
			               <p:outputLabel value="#{data.ctContractZone.zoneName}" style="float:left;" />
			            </p:column> 
			            <p:column headerText="#{lbl['lbl.ct.from.qty']}" style="text-align: right;">
				              <p:outputLabel value="#{data.fromQty}"/>
			             </p:column>       
			             <p:column headerText="#{lbl['lbl.ct.to.qty']}" style="text-align: right;">
				           <p:outputLabel value="#{data.toQty}"/>
			            </p:column>
			             <p:column headerText="#{lbl['lbl.ct.sub.seq']}" style="text-align: right;">
				           <p:outputLabel/>
			            </p:column>     
			            <p:column headerText="#{lbl['lbl.ct.price']}" style="text-align: right;">
			                <p:outputLabel value="#{data.unitPrice}"/>
			            </p:column>
			            <p:column headerText="#{lbl['lbl.ct.effective.date']}">
			                <h:outputText value="#{data.effDate}" style="float:left;">
                             <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                           </h:outputText>
			             </p:column>       
			             <p:column headerText="#{lbl['lbl.ct.expiry.date']}">
			                <h:outputText value="#{data.expDate}" style="float:left;">
                              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                            </h:outputText>
			            </p:column>     
			        </c:if>
			</p:dataTable>
		  </h:panelGrid>
		</p:outputPanel>  
        <p:dialog id="importedCentralDialog" header="Shipping Details" widgetVar="importedDlg" modal="true" width="600" height="350">
		    
		     <h:panelGrid columns="2" width="100%">
		      
		        <p:outputLabel id="centralcentralmtoloa" value="MTO LOA No." />
	            <p:inputText id="centraltxtmtoloa" style="width:200px;"></p:inputText>
               
                <p:outputLabel id="centralmtocontract" value="MTO Contract No." />
	            <p:inputText id="centraltxtmtocontract" style="width:200px;"></p:inputText>
                
                <p:outputLabel id="centralagentname" value="Agent Name" />
                 <p:selectOneMenu id="centraltxtagentname" style="width:210px;">
                   <f:selectItem itemLabel="-Select One-" itemValue="" /> 
                   <f:selectItem itemLabel="-Interspiro AB-" itemValue="Interspiro AB" /> 
                </p:selectOneMenu>
                
                <p:outputLabel id="centralpromethod" value="Procurement Method" />
                <h:panelGrid columns="3">
                    <p:selectOneMenu id="centraltxtpromethod"  style="width:100px;">
                       <f:selectItem itemLabel="-Select One-" itemValue="" /> 
                       <f:selectItem itemLabel="-Ex-Work-" itemValue="Ex-Work" /> 
                       <f:selectItem itemLabel="-FOB-" itemValue="FOB" /> 
                       <f:selectItem itemLabel="-FCA-" itemValue="FCA" /> 
                       <f:selectItem itemLabel="-Others-" itemValue="Others" /> 
                    </p:selectOneMenu>
                    <p:spacer width="1"/>
                    <p:inputText style="width:95px;"/>
                </h:panelGrid>
	            
                <p:outputLabel id="centralexportlicense" value="Required Export License" />
                <p:selectOneRadio id="centraloptions">  
                    <f:selectItem itemLabel="Yes" itemValue="1" />  
                    <f:selectItem itemLabel="No" itemValue="2" />  
                 </p:selectOneRadio>  
                  
                <h:outputLabel id="centralcountryoforigin" value="* Country of Origin" />
                <p:selectOneMenu id="centraltxtcountryoforigin" style="width:110px;">
                   <f:selectItem itemLabel="-Select One-" itemValue="" /> 
                   <f:selectItem itemLabel="Sewden" itemValue="Sewden" /> 
                </p:selectOneMenu>
	             
                <h:outputLabel id="centralloadingport" value="* Loading Port" />
	            <p:inputText id="centraltxtloadingport" style="width:100px;"></p:inputText>
                 
                <p:outputLabel id="centralcountryofdestination" value="* Country of Destination" />
                <p:selectOneMenu id="centraltxtcountryofdestination" style="width:110px;">
                   <f:selectItem itemLabel="-Select One-" itemValue="" /> 
                   <f:selectItem itemLabel="Malaysia" itemValue="Malaysia" /> 
                </p:selectOneMenu>
	             
                <h:outputLabel id="centraldischargeport" value="* Discharge Port" />
	            <p:inputText id="centraltxtdischargeport" style="width:100px;"></p:inputText>
	            
	            <h:panelGroup>
                  <div style="height: 40px; vertical-align:top;">
                     <p:outputLabel for="centralfinaldestination" value="* Final Destination" />
                  </div>
               </h:panelGroup>
               <h:panelGrid>
                   <p:inputTextarea id="centralfinaldestination" rows="4" cols="31" maxlength="100"  autoResize="false" />
              </h:panelGrid>
              <h:outputLabel id="centraltransportmode" value=" Transport Mode" />
	          <p:selectOneMenu id="centraltxttransportmode" style="width:110px;">
                   <f:selectItem itemLabel="-Select One-" itemValue="" /> 
                   <f:selectItem itemLabel="Sea" itemValue="Sea" /> 
                   <f:selectItem itemLabel="Air" itemValue="Air" /> 
                   <f:selectItem itemLabel="Land" itemValue="Land" /> 
              </p:selectOneMenu>
           </h:panelGrid>
		</p:dialog>
  	 </p:panel>
  	 <p:panel header="Remarks" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.itemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		  	
 </ui:composition>
