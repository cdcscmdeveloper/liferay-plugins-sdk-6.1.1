<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
   <h:panelGrid columns="4" style="width:800px;" styleClass="top-aligned-columns"
        columnClasses="columnWidth150,columnWidth300,columnWidth150,columnWidth200">
   <p:outputLabel  value="#{lbl['lbl.ct.bank.name']}"/>  
   <p:inputText disabled="true" style="width:170px;" 
      value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.bankName}"/>
   <p:outputLabel  value="#{lbl['lbl.ct.bank.acc.no']}" />  
   <p:inputText  disabled="true" style="width:170px;"
         value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.bankAccountNo}"/> 
    <h:panelGroup>
           <div style="height: 60px; vertical-align: top;">
                <p:outputLabel for="bankAddress" value="#{lbl['lbl.ct.bank.address']}" />
           </div>
     </h:panelGroup>
	 <h:panelGrid>
           <p:inputTextarea id="bankAddress" value="#{contractDetailsBackingBean.getFullAddress(contractDetailsBackingBean.managedBean.contractVer.ctContractValue.bankAddress)}" 
              disabled="true" rows="3"  autoResize="false" style="width:170px; margin-bottom: 5px;"/>
	 </h:panelGrid>
	 <p:outputLabel  value="#{lbl['lbl.ct.bank.branch']}"/>  
     <p:inputText  disabled="true" style="width:170px;"
        value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.bankBranch}"  />
   </h:panelGrid>
</ui:composition>
