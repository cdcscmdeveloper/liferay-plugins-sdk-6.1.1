<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
		<p:panel  header="#{lbl['lbl.ct.panel.fulfilment.setting']}"  toggleable="true"  toggleSpeed="500">
         <h:panelGrid columns="3" style="width:100%;" columnClasses="columnWidth240">  
             <p:outputLabel value="#{lbl['lbl.ct.contract.notify']}"  />
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.contractVer.ctSetting.ctNotifyDays}"  style="width:50px;" label="#{lbl['lbl.ct.set.ct.notify']}" />
             <h:panelGrid columns="3">
             	<p:outputLabel value="#{lbl['lbl.ct.contract.notify.desc']}" style="float:left;" />
             	<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.notification']}" />
			 </h:panelGrid>
             <p:outputLabel value="#{lbl['lbl.ct.agreement.notify']}"  />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.contractVer.ctSetting.agNotifyDaysB4Ag}" style="width:50px;" label="#{lbl['lbl.ct.set.ag.notify']}"   />  
             <h:panelGrid columns="3">
	       		<p:outputLabel value="#{lbl['lbl.ct.agreement.notify.desc']}" style="float:left;"/>
	            <p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.notification']}" />
			 </h:panelGrid>
			 <p:outputLabel value="#{lbl['lbl.ct.pb.notify']}" />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.contractVer.ctSetting.bondNotifyDays}" style="width:50px;" label="#{lbl['lbl.ct.set.pb.notify']}"  />  
             <h:panelGrid columns="3">
             	<p:outputLabel value="#{lbl['lbl.ct.pb.notify.desc']}" style="float:left;"/>
             	<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.perforamnce.bond.notification']}" />
			 </h:panelGrid>
             <h:outputLabel value="#{lbl['lbl.ct.termination.notify']}"  />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.contractVer.ctSetting.terminationNotifyDays}" style="width:50px;" label="#{lbl['lbl.ct.set.ter.notify']}"  />  
             <h:panelGrid columns="3">
             	<p:outputLabel value="#{lbl['lbl.ct.termination.notify.desc']}" style="float:left;"/>
             	<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.termination.notification']}" />
			 </h:panelGrid>
             <p:outputLabel value="#{lbl['lbl.ct.do.notify']}" />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.contractVer.ctSetting.supplierDoDays}" style="width:50px;" label="#{lbl['lbl.ct.set.sup.notify']}" />  
             <h:panelGrid columns="3">
             	<p:outputLabel value="#{lbl['lbl.ct.do.notify.desc']}" style="float:left;"/>
             	<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.delivery.order.notification']}" />
			 </h:panelGrid>
             <p:outputLabel value="#{lbl['lbl.ct.approver.notify']}"  />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.contractVer.ctSetting.approverMtoDays}" style="width:50px;" label="#{lbl['lbl.ct.set.mto.notify']}" />  
             <h:outputLabel value="#{lbl['lbl.ct.approver.notify.desc']}" style="float:left;"/>
             <p:outputLabel value="#{lbl['lbl.ct.last.co.notify']}"  />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.contractVer.ctSetting.lastCOBeforeExpiryDays}" style="width:50px;" label="#{lbl['lbl.ct.set.last.co']}" />  
             <h:outputLabel value="#{lbl['lbl.ct.last.co.notify.desc']}" style="float:left;"/>             
           </h:panelGrid>
         </p:panel>
         
	<p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.settingRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.remark']}" rendered="#{remarkIndex==0}"/>
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		         
         
</ui:composition>
