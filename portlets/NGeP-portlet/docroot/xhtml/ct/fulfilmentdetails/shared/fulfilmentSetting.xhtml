<ui:composition

	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

             <p:outputLabel value="#{lbl['lbl.ct.set.ct.desc']}" style="float:left;" />
             <p:outputLabel value="#{lbl['lbl.ct.set.ag.notify']}"  />

             <p:outputLabel value="#{lbl['lbl.ct.set.sup.desc']}" style="float:left;"/>
             <p:outputLabel value="#{lbl['lbl.ct.set.mto.notify']}"  />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.contractVer.ctSetting.approverMtoDays}" style="width:50px;"  />
