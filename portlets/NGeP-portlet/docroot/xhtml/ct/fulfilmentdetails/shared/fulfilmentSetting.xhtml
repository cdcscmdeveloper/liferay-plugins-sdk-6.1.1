<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		<p:panel  header="#{lbl['lbl.ct.set.panel.name']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelfulilmentSeting">
         <h:panelGrid columns="3" style="width:800px;">  
             <p:outputLabel value="#{lbl['lbl.ct.set.ct.notify']}"  />
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.ctSetting.ctNotifyDays}"   />
             <p:outputLabel value="#{lbl['lbl.ct.set.ct.desc']}" style="float:left;"/>
             <p:outputLabel value="#{lbl['lbl.ct.set.ag.notify']}"  />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.ctSetting.agNotifyDaysB4Ag}"  />  
             <p:outputLabel value="#{lbl['lbl.ct.set.ag.desc']}"/>
             <p:outputLabel value="#{lbl['lbl.ct.set.agg.notify']}"  />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.ctSetting.agNotifyDayB4Ct}" />  
             <p:outputLabel value="#{lbl['lbl.ct.set.agg.desc']}"/>
             <p:outputLabel value="#{lbl['lbl.ct.set.pb.notify']}" />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.ctSetting.bondNotifyDays}" />  
             <p:outputLabel value="#{lbl['lbl.ct.set.pb.desc']}"/>
             <h:outputLabel value="#{lbl['lbl.ct.set.ter.notify']}"  />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.ctSetting.terminationNotifyDays}" />  
             <p:outputLabel value="#{lbl['lbl.ct.set.ter.desc']}"/>
             <p:outputLabel value="#{lbl['lbl.ct.set.sup.notify']}" />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.ctSetting.supplierActionDays}"  />  
             <p:outputLabel value="#{lbl['lbl.ct.set.sup.desc']}"/>
             <p:outputLabel value="#{lbl['lbl.ct.set.mto.notify']}"  />  
             <p:inputText   value="#{contractDetailsBackingBean.managedBean.ctSetting.approverMtoDays}" />  
             <h:outputLabel value="#{lbl['lbl.ct.set.mto.desc']}"/>
           </h:panelGrid>
         </p:panel>
</ui:composition>
