<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="bondId" header="#{lbl['lbl.ct.pbd.panel.name']}" toggleable="true"  toggleSpeed="500" 
	    rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctPerformanceBonds.size() != 0  or contractDetailsBackingBean.managedBean.updateContract}">
        <p:dataTable  id="tableBond" var="varBond" value="#{contractDetailsBackingBean.managedBean.contractVer.ctPerformanceBonds}"
           rowKey="#{varBond}" selection="#{contractDetailsBackingBean.selectedBondList}"> 
	      <ac:paginator for="tableBond" />
	       <p:columnGroup type="header"> 
	            <p:row> 
	                <p:column headerText="Select" rendered="#{contractDetailsBackingBean.managedBean.updateContract}"  /> 
                    <p:column headerText="#{lbl['lbl.ct.pbd.table.rno']}"  /> 
                    <p:column headerText="#{lbl['lbl.ct.pbd.table.fi']}" /> 
                    <p:column headerText="#{lbl['lbl.ct.pbd.table.amt']}" /> 
                    <p:column headerText="#{lbl['lbl.ct.pbd.table.efdate']}" /> 	
		            <p:column headerText="#{lbl['lbl.ct.pbd.table.edate']}" />
		            <p:column headerText="Attachment"/> 
		            <p:column headerText="Status"/> 
               </p:row>							
	        </p:columnGroup>
  
            <p:column selectionMode="multiple" style="width:18px;" disabledSelection="true" 
                   rendered="#{varBond.performanceBondId != null and contractDetailsBackingBean.managedBean.updateContract}" />
            <p:column selectionMode="multiple" style="width:18px;" 
               rendered="#{varBond.performanceBondId == null and contractDetailsBackingBean.managedBean.updateContract}"/>  
            <p:column>
                <p:inputText value="#{varBond.refNo}" disabled="#{varBond.performanceBondId != null}" style="width:70px;"/>
             </p:column>	
             <p:column>
                <p:selectOneMenu id="orgName" disabled="#{varBond.performanceBondId != null}"  style="width:120px;">
                  <f:selectItem itemLabel="-Select One-" itemValue="-Select One-"/>
               </p:selectOneMenu>         
              </p:column>	
              <p:column>  
                  <p:inputText value="#{varBond.bondAmount}" styleClass="ppRightBtn" disabled="#{varBond.performanceBondId != null}" style="width:60px;" >
                 <f:convertNumber pattern="#,###.00" /></p:inputText>
               </p:column>	
               <p:column>
                    <p:calendar value="#{varBond.effDate}" id="popupButtonCal4" showOn="button"  size="12" disabled="#{varBond.performanceBondId != null}"
                   pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/>
                </p:column>	
                <p:column>
                   <p:calendar value="#{varBond.expDate}" id="popupButtonCal5" showOn="button"  
                     pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="#{varBond.performanceBondId != null}" size="12"/>
                 </p:column>	
                 <p:column styleClass="column-align-center">
                    <h:panelGroup id="uploadBondPg">
				      <p:commandButton oncomplete="uploadBondDlg.show();return false;" icon="iconAttachment" 
					     update=":form:tabview:tableBond" rendered="#{varBond.filePath == null and contractDetailsBackingBean.managedBean.updateContract}"  >
					      <f:setPropertyActionListener value="#{varBond}" target="#{contractDetailsBackingBean.managedBean.ctPerformanceBond}" /></p:commandButton>	
				     <h:commandLink value="#{contractDetailsBackingBean.fileNames(varBond.filePath)}" style="float:left;" styleClass="blue_font" 
				         action="#{contractDetailsBackingBean.downloadFile(varBond.filePath)}" />					
			        </h:panelGroup>
              </p:column>
               <p:column>
                <p:selectOneMenu id="rStatus" disabled="#{varBond.performanceBondId != null}"  style="width:80px;">
                    <f:selectItem itemLabel="Inactive" itemValue="Inactive"/>
                    <f:selectItem itemLabel="Active" itemValue="Active"/>
               </p:selectOneMenu>   
               </p:column>
	    </p:dataTable>
       <div class="ppRightBtn"> 
         <c:if test ='#{contractDetailsBackingBean.managedBean.updateContract}'>
		   <p:commandButton value="Add" process="@form"  icon="ui-icon-add" action="#{contractDetailsBackingBean.addBondDetails}" update="tableBond" />
		   <p:spacer width="1"/>
		   <p:commandButton value="Delete" icon="ui-icon-delete" process="@form" onsuccess="performanceBondDlg.show()"/> 
	   	</c:if> 
	   	 </div>
	   	 <p:dialog id="uploadBondDlg" widgetVar="uploadBondDlg" modal="false" resizable="false" width="700px" height="350" 
	   	    styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		    <p:ajax event="close" />
	      	<p:fileUpload style="display:inline;" mode="advanced" 
			  fileUploadListener="#{contractDetailsBackingBean.fileUpload}" 
			  allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			  invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			  update=":form:tabview:tableBond" >
		    </p:fileUpload> 
	     </p:dialog>
	         <p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			   severity="alert" widgetVar="performanceBondDlg">
                 <h:panelGrid columns="2">
				 <p:commandButton value="Yes" process="@form" update=":form"
				    onclick="performanceBondDlg.hide();" actionListener="#{contractDetailsBackingBean.delBondDetails()}"/>
				  <p:commandButton value="No" 	onclick="performanceBondDlg.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>
  </p:panel>
</ui:composition>
