<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="bondId" header="#{lbl['lbl.ct.pbd.panel.name']}" toggleable="true"  toggleSpeed="500" widgetVar="panelbond">
       <div style="overflow-x:auto">
	    <p:dataTable  id="tableBond" var="data" value="#{contractDetailsBackingBean.managedBean.contractVer.ctPerformanceBonds}"  
	      lazy="false" dynamic="true" rowKey="#{data}" selection="#{contractDetailsBackingBean.managedBean.selectedBondList}" 
	      paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
	      <ac:paginator for="tableBond" />
	         <p:columnGroup type="header"> 
	            <p:row> 
	                <p:column headerText="Select"  /> 
                    <p:column headerText="#{lbl['lbl.ct.pbd.table.rno']}"  /> 
                    <p:column headerText="#{lbl['lbl.ct.pbd.table.fi']}" /> 
                    <p:column headerText="#{lbl['lbl.ct.pbd.table.amt']}" /> 
                    <p:column headerText="#{lbl['lbl.ct.pbd.table.efdate']}" /> 	
		            <p:column headerText="#{lbl['lbl.ct.pbd.table.edate']}" />
		            <p:column headerText="Action"  /> 
               </p:row>							
	        </p:columnGroup>
	        <p:column selectionMode="multiple" style="width:18px" rendered="#{data.performanceBondId != null}" disabledSelection="true"/>
            <p:column selectionMode="multiple" style="width:18px" rendered="#{data.performanceBondId == null}"/>  
            <p:column>
                    <p:outputLabel value="#{data.refNo}"  style="float:left;" rendered="#{data.refNo != null or data.refNo != ''}"/>
                    <p:inputText value="#{data.refNo}" style="width:120px;" rendered="#{data.refNo == null or data.refNo == ''}"/>
               </p:column>	
               <p:column>
                    <p:outputLabel value="#{data.financialOrg.finOrgName}"  style="float:left;" rendered="#{data.financialOrg.finOrgName != null}"/>
                    <p:selectOneMenu id="orgName" disabled="false"  style="width:120px;" rendered="#{data.financialOrg.finOrgName == null}">
                      <f:selectItem itemLabel="-Select One-" itemValue="-Select One-"/>
            	    </p:selectOneMenu>         
               </p:column>	
               <p:column>  
                    <h:outputLabel value="#{data.bondAmount}" rendered="#{data.bondAmount != 0.0}">
                     <f:convertNumber pattern="#,###.00" /></h:outputLabel>
                    <p:inputText value="#{data.bondAmount}" styleClass="ppRightBtn" rendered="#{data.bondAmount == 0.0}">
                     <f:convertNumber pattern="#,###.00" /></p:inputText>
               </p:column>	
               <p:column>
                    <h:outputText value="#{data.effDate}" style="float:left;" rendered="#{data.effDate !=null}">
                      <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                    </h:outputText>
                     <p:calendar value="#{data.effDate}" id="popupButtonCal4" showOn="button"  
                     pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" rendered="#{data.effDate ==null}"/>
                </p:column>	
                <p:column>
                     <h:outputText value="#{data.expDate}" style="float:left;" rendered="#{data.expDate !=null}">
                            <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                     </h:outputText>
                     <p:calendar value="#{data.expDate}" id="popupButtonCal5" showOn="button"  
                            pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" rendered="#{data.expDate == null}"/>
                 </p:column>	
                 <p:column styleClass="column-align-center">
                       <h:commandLink action="#{contractDetailsBackingBean.downloadFile(data.filePath)}" 
                          rendered="#{data.filePath != null}">	
			              <p:graphicImage library="ep/images/design" name="download.png"
					         value="/resources/ep/images/design/download.png" title="File Download" />
		               </h:commandLink>
		                  <p:commandLink id="uploadLink"  rendered="#{data.filePath == null}">
			                <p:graphicImage library="ep/images/design" name="upload.png"
					              value="/resources/ep/images/design/upload.png" title="File Upload" />
		                      </p:commandLink>
                    </p:column>
	    </p:dataTable>
     </div>
       <div class="ppRightBtn"> 
		       <p:commandButton value="Add" process="@form" partialSubmit="true"  icon="ui-icon-add"
		         action="#{contractDetailsBackingBean.addBondDetails}" update="tableBond"/>
		        <p:spacer width="1"/>
		        <p:commandButton value="Delete" icon="ui-icon-delete" partialSubmit="true" process="@this" onsuccess="performanceBondDlg.show()">
			        <f:setPropertyActionListener value="#{data}" target="#{contractDetailsBackingBean.managedBean.ctPerformanceBond}" />
			    </p:commandButton> 
	   	 </div>
	   	 
  </p:panel>
   <p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			   severity="alert" widgetVar="performanceBondDlg">
                 <h:panelGrid columns="2">
				 <p:commandButton value="Yes" update="tableBond" partialSubmit="true" process="@this"
				    onclick="performanceBondDlg.hide();" actionListener="#{contractDetailsBackingBean.delBondDetails()}"/>
				  <p:commandButton value="No" 	onclick="performanceBondDlg.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>
</ui:composition>
