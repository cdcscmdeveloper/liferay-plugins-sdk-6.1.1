<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<style type="text/css">
		.calendarDateField input {
			width: 80px;
		}
	</style>
	<p:panel id="bondId" header="#{lbl['lbl.ct.pbd.panel.name']}" toggleable="true" toggleSpeed="500"
		rendered="#{(contractDetailsBackingBean.managedBean.contractVer.ctPerformanceBonds.size() != 0  
	     or contractDetailsBackingBean.managedBean.updateContract) and !contractDetailsBackingBean.managedBean.directPurchase}">
		 <p:dataTable id="tableBond" var="varBond"
			  value="#{contractDetailsBackingBean.managedBean.contractVer.ctPerformanceBonds}"
			  rowKey="#{varBond}" selection="#{contractDetailsBackingBean.selectedBondList}">
			  <ac:paginator for="tableBond" />
			  <p:columnGroup type="header">
				<p:row>
					<p:column headerText="Select" rendered="#{contractDetailsBackingBean.managedBean.updateContract}" />
					<p:column headerText="#{lbl['lbl.ct.pbd.table.rno']}" />
					<p:column headerText="#{lbl['lbl.ct.pbd.table.fi']}" />
					<p:column headerText="#{lbl['lbl.ct.pbd.table.amt']}" />
					<p:column headerText="#{lbl['lbl.ct.pbd.table.efdate']}" />
					<p:column headerText="#{lbl['lbl.ct.pbd.table.edate']}" />
					<p:column headerText="Attachment" />
					<p:column headerText="Status" />
				</p:row>
			 </p:columnGroup>
			<p:column selectionMode="multiple" style="width:2%;" disabledSelection="true"
				rendered="#{varBond.performanceBondId != null and contractDetailsBackingBean.managedBean.updateContract}" />
			
			<p:column selectionMode="multiple" style="width:2%;"
				rendered="#{varBond.performanceBondId == null and contractDetailsBackingBean.managedBean.updateContract}" />
			
			<p:column style="width:8%;">
				<p:inputText value="#{varBond.refNo}" maxlength="50"
					disabled="#{varBond.performanceBondId != null}" style="width:70px;" />
			</p:column>
		
			<p:column style="width:30%;">
				<p:selectOneMenu id="orgName"  value="#{varBond.financialOrg.financialOrgId}" 
				    style="width:180px;" disabled="#{varBond.performanceBondId != null}">
					<f:selectItems value="#{contractDetailsBackingBean.retrieveFinancialOrgList()}" />
				</p:selectOneMenu>
			</p:column>
			
			<p:column style="width:10%;">
				<p:inputText value="#{varBond.bondAmount}" styleClass="ppRightBtn" maxlength="23"
				    disabled="#{varBond.performanceBondId != null}" style="width:80px;" label="#{lbl['lbl.ct.pbd.table.amt']}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</p:column>
			
			<p:column style="width:10%;">
				<p:calendar value="#{varBond.effDate}" id="popupButtonCal4" styleClass="calendarDateField"
					showOn="button" readonlyInput="true" size="12" 
					disabled="#{varBond.performanceBondId != null}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</p:column>
			
			<p:column style="width:10%;">
				<p:calendar value="#{varBond.expDate}" id="popupButtonCal5" styleClass="calendarDateField"
					showOn="button" readonlyInput="true" disabled="#{varBond.performanceBondId != null}" size="12" 
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
			</p:column>
			
			<p:column styleClass="column-align-center" style="width:20%;">
				<h:panelGroup id="uploadBondPg">
					<p:commandButton oncomplete="uploadBondDlg.show();return false;"
						icon="iconAttachment" update=":form:tableBond"
						rendered="#{varBond.filePath == null and contractDetailsBackingBean.managedBean.updateContract}">
						<f:setPropertyActionListener value="#{varBond}" target="#{contractDetailsBackingBean.managedBean.ctPerformanceBond}" />
					</p:commandButton>
					<h:commandLink
						value="#{varBond.fileName}"
						style="float:left;" styleClass="blue_font"
						action="#{contractDetailsBackingBean.downloadFile(varBond.filePath, varBond.fileName)}" />
				</h:panelGroup>
			</p:column>
			<p:column style="width:10%;">
				<p:selectOneMenu id="rStatus" value="#{varBond.recordStatusFlg}"
					disabled="#{varBond.performanceBondId != null}" style="width:80px;">
					<f:selectItem itemLabel="Active" itemValue="1" />
					<f:selectItem itemLabel="Inactive" itemValue="0" />
				</p:selectOneMenu>
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn">
			<c:if test='#{contractDetailsBackingBean.managedBean.updateContract}'>
				<p:commandButton value="Add" process="@form" icon="ui-icon-add"
					action="#{contractDetailsBackingBean.addBondDetails}"
					update="tableBond" />
				<p:spacer width="1" />
				<p:commandButton value="Delete" icon="ui-icon-delete"
					process="@form" onclick="dlgPerformDel.show();" />
			</c:if>
		</div>
		<p:dialog id="uploadBondDlg" widgetVar="uploadBondDlg" modal="false"
			resizable="false" width="700px" height="350" styleClass="pop_up_top"
			header="#{lbl['lbl.bpm.choose.file']}">
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;" mode="advanced"
				fileUploadListener="#{contractDetailsBackingBean.fileUpload}"
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
				invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
				update=":form:tableBond">
			</p:fileUpload>
		</p:dialog>
		<p:dialog id="dlgPerformDel" widgetVar="dlgPerformDel"
			header="Delete Confirmation" styleClass="screen-title"
			resizable="false" modal="true" width="350" height="95">
			<h:panelGrid columns="3">
				<p:graphicImage library="ep/images/design" name="exclamation.png"
					value="/css/images/design/exclamation.png"
					styleClass="ui-icon-complain"></p:graphicImage>
				<p:spacer width="10" />
				<p:inputTextarea
					value="Are you sure you want to delete this record?" rows="2"
					cols="48" styleClass="ui-inputtextarea"></p:inputTextarea>
			</h:panelGrid>
			<div class="ppRightBtn">
				<p:commandButton value="Yes" icon="ui-icon-accept"
					update="tableBond" process="@form"
					actionListener="#{contractDetailsBackingBean.delBondDetails()}"
					onclick="dlgPerformDel.hide();" />
				<p:commandButton value="No" icon="ui-icon-reject"
					onclick="dlgPerformDel.hide();" type="button" />
			</div>
		</p:dialog>
	</p:panel>
</ui:composition>
