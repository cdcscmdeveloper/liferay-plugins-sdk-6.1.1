<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<style type="text/css">
.calendarDateField input {
	width: 80px;
}
</style>
	<p:panel id="bondId" header="#{lbl['lbl.ct.panel.performance.bond']}" toggleable="true" toggleSpeed="500"
		rendered="#{contractDetailsBackingBean.managedBean.ctContract.bondReq and 
		!contractDetailsBackingBean.managedBean.directPurchase}">
		 <!-- <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.dtls']}"/> -->
		 <p:dataTable id="tableBond" var="varBond" rowIndexVar="index"
			  value="#{contractDetailsBackingBean.managedBean.contractVer.ctPerformanceBonds}"
			  selection="#{contractDetailsBackingBean.managedBean.performanceBondList}" rowKey="#{rowKeyObj}"
			  first="#{contractDetailsBackingBean.managedBean.firstRowSelected}">
			  <ac:paginator for="tableBond" />
			  
			 <p:column style="width:2%;"  rendered="#{!contractDetailsBackingBean.managedBean.viewContract}">
			 <f:facet name="header">
					<p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this"
							update="tableBond" listener="#{contractDetailsBackingBean.selectAll()}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{varBond.selectedCheckBox}" styleClass="myCustomChekBox">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
		      </p:column>
			
			<p:column style="width:10%;" headerText="#{lbl['lbl.ct.ref.no']}">
				<p:inputText value="#{varBond.refNo}" maxlength="50"  label="#{lbl['lbl.ct.ref.no']}"
					disabled="#{contractDetailsBackingBean.managedBean.viewContract}" style="width:85px;" />
			</p:column>
		
			<p:column style="width:30%;" headerText="#{lbl['lbl.ct.financial.inst']}">
				<p:selectOneMenu id="orgName"  value="#{varBond.financialOrg.financialOrgId}"
				    style="width:230px;" label="#{lbl['lbl.ct.financial.inst']}" disabled="#{contractDetailsBackingBean.managedBean.viewContract}">
					   <f:selectItems value="#{contractDetailsBackingBean.retrieveFinancialOrgList()}" />
				</p:selectOneMenu>
			</p:column>
			
			<p:column style="width:12%;" headerText="#{lbl['lbl.ct.amount']}" >
				<p:inputText value="#{varBond.bondAmount}" styleClass="ppRightBtn" maxlength="23" 
				    disabled="#{contractDetailsBackingBean.managedBean.viewContract}" style="width:90px;" label="#{lbl['lbl.ct.amount']}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax process="@this"></p:ajax>
				</p:inputText>
			</p:column>
			
			<p:column style="width:8%;" headerText="#{lbl['lbl.ct.effective.date']}">
				<p:calendar id="popupButtonCal4" value="#{varBond.effDate}"  styleClass="calendarDateField" size="9" 
					showOn="button" readonlyInput="true" navigator="true" disabled="#{!varBond.chckPerformaceBond}"
					mindate="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate}"
					maxdate="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
					 <p:ajax event="dateSelect" update="@([id$=bondExpDateCalId])" process="@this" />
				</p:calendar>
			</p:column>
			
			<p:column style="width:8%;" headerText="#{lbl['lbl.ct.expiry.date']}">
				<p:calendar id="bondExpDateCalId"  value="#{varBond.expDate}" styleClass="calendarDateField" showOn="button"
				    readonlyInput="true" disabled="true" mindate="#{contractDetailsBackingBean.exactDate}" 
				    navigator="true" maxdate="#{contractDetailsBackingBean.exactDate}"
					size="9"  pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
				    <f:attribute name="startDate" value="#{varBond.effDate}" />
                    <f:validator validatorId="primeDateRangeValidator" />
			    </p:calendar>
			</p:column>
			
			<p:column styleClass="column-align-center" style="width:32%;" headerText="#{lbl['lbl.txt.attachment']}" >
				<h:panelGroup id="uploadBondPg">
					<p:commandButton oncomplete="uploadBondDlg.show();return false;"  
					     style="float:left;" icon="iconAttachment" update=":form:tableBond, :form:uploadBondDlg">
						<f:setPropertyActionListener value="#{varBond}" target="#{contractDetailsBackingBean.managedBean.ctPerformanceBond}" />
					</p:commandButton>
					<h:commandLink
						value="#{varBond.fileName}"
						style="float:right;" styleClass="blue_font"
						action="#{contractDetailsBackingBean.downloadFile(varBond.filePath, varBond.fileName)}" />
				</h:panelGroup>
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn">
			
				<p:commandButton id="addPdBtn"  value="#{lbl['lbl.btn.add']}" process="@this,tableBond" 
				  rendered="#{!contractDetailsBackingBean.managedBean.viewContract}" 
				    icon="ui-icon-add" action="#{contractDetailsBackingBean.addBondDetails}" update="@all,tableBond">
					<p:tooltip for="addPdBtn">
					    <h:outputText value="#{lbl['lbl.ct.tooltip.add.performance.bond']}" escape="false" />
					</p:tooltip>
				</p:commandButton>
				<p:spacer width="1" />
		  
			     <p:commandButton id="delPdBtn" value="#{lbl['lbl.btn.delete']}" 
			          icon="ui-icon-delete" process="@this" partialSubmit="true" onsuccess="dlgPerformDel.show();"
				      rendered="#{!contractDetailsBackingBean.managedBean.viewContract}"
				      disabled="#{contractDetailsBackingBean.managedBean.buttonHideActive}" >
					<p:tooltip for="delPdBtn">
					    <h:outputText value="#{lbl['lbl.ct.tooltip.delete.performance.bond']}" escape="false" />
					</p:tooltip>
				</p:commandButton>
			
		</div>
		<p:dialog id="uploadBondDlg" widgetVar="uploadBondDlg" modal="false"
			resizable="false" width="700px" height="350" styleClass="pop_up_top"
			header="#{lbl['lbl.bpm.choose.file']}">
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;" mode="advanced"
				fileUploadListener="#{contractDetailsBackingBean.fileUpload}"
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
				invalidFileMessage="#{lbl['lbl.ct.upload.invalid.msg']}" update=":form:tableBond">
			</p:fileUpload>
		</p:dialog>
		<p:dialog id="dlgPerformDel" widgetVar="dlgPerformDel"
			styleClass="screen-title"
			resizable="false" modal="true" width="330">
			<h:panelGrid columns="3">
				<p:graphicImage library="ep/images/design" name="exclamation.png"
					value="/css/images/design/exclamation.png"
					styleClass="ui-icon-complain"></p:graphicImage>
				<p:spacer width="10" />
				<div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
			</h:panelGrid>
			<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update="tableBond" 
		         process="@this" actionListener="#{contractDetailsBackingBean.removeAddRow()}" onclick="dlgPerformDel.hide();">
		         <f:setPropertyActionListener
					target="#{contractDetailsBackingBean.managedBean.selectAll}" value="#{false}" /></p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgPerformDel.hide();" type="button" />
			</div>
		</p:dialog>
	</p:panel>
</ui:composition>
