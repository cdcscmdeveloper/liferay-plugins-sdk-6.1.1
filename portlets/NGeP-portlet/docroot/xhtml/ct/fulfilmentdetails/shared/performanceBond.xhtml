<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="bondId" header="#{lbl['lbl.ct.pbd.panel.name']}" toggleable="true"  toggleSpeed="500" widgetVar="panelbond">
    <div style="overflow-x:auto">
	<p:dataTable  id="tableBond" var="data" value="#{contractDetailsBackingBean.managedBean.contractVer.ctPerformanceBonds}"  
	lazy="false" widgetVar="dataTableObj" dynamic="true" paginator="true" paginatorPosition="bottom" 
	paginatorAlwaysVisible="true" emptyMessage="No Records!">
	    <ac:paginator for="tableBond" />
	   <p:columnGroup type="header"> 
	   <p:row> 
         <p:column headerText="#{lbl['lbl.ct.pbd.table.rno']}"  /> 
         <p:column headerText="#{lbl['lbl.ct.pbd.table.fi']}" /> 
         <p:column headerText="#{lbl['lbl.ct.pbd.table.cur']}"  /> 
         <p:column headerText="#{lbl['lbl.ct.pbd.table.amt']}" /> 
         <p:column headerText="#{lbl['lbl.ct.pbd.table.efdate']}" /> 	
		 <p:column headerText="#{lbl['lbl.ct.pbd.table.edate']}" />
		 <p:column headerText="#{lbl['lbl.ct.pbd.table.download']}"  /> 
       </p:row>							
	  </p:columnGroup>
          <p:column><p:outputLabel value="#{data.refNo}" style="float:left;"/></p:column>	
          <p:column><p:outputLabel value="CIMB BERHAD" style="float:left;"/></p:column>	
          <p:column > <p:outputLabel value="MYR" style="float:left;"/></p:column> 							
          <p:column><p:outputLabel value="#{data.bondAmount}" style="float:left;" />  </p:column>	
          <p:column>
                <h:outputText value="#{data.effDate}" style="float:left;">
                <f:convertDateTime pattern="MM/dd/yyyy" /></h:outputText>
          </p:column>	
          <p:column><h:outputText value="#{data.expDate}" style="float:left;">
          <f:convertDateTime pattern="MM/dd/yyyy" /></h:outputText></p:column>	
           <p:column>
             <p:commandLink id="downloadLink" onclick="PrimeFaces.monitorDownload(start, stop)">
			   <p:graphicImage library="ep/images/design" name="download.png"
					    value="/resources/ep/images/design/download.png" title="File Download" />
			    <p:fileDownload value="#{contractDetailsBackingBean.download}"/> 
		     </p:commandLink>
          </p:column>
	</p:dataTable>
   </div>
  </p:panel>
</ui:composition>
