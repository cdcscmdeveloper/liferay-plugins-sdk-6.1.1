<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="bondId" header="#{lbl['lbl.ct.pbd.panel.name']}" toggleable="true"  toggleSpeed="500" widgetVar="panelbond">
    <div style="overflow-x:auto">
	<p:dataTable id="tableBond" var="data" value="#{contractDetailsBackingBean.managedBean.ctContract.ctPerformanceBonds}" rowIndexVar="index" 
	lazy="false" widgetVar="dataTableObj" dynamic="true" paginator="true" paginatorPosition="bottom" 
	paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10">
	   <p:columnGroup type="header"> 
	   <p:row> 
	     <p:column headerText="#{lbl['lbl.ct.pbd.table.no']}"  />
         <p:column headerText="#{lbl['lbl.ct.pbd.table.btype']}"  /> 
         <p:column headerText="#{lbl['lbl.ct.pbd.table.rno']}"  /> 
         <p:column headerText="#{lbl['lbl.ct.pbd.table.fi']}" /> 
         <p:column headerText="#{lbl['lbl.ct.pbd.table.cur']}"  /> 
         <p:column headerText="#{lbl['lbl.ct.pbd.table.amt']}" /> 
         <p:column headerText="#{lbl['lbl.ct.pbd.table.efdate']}" /> 	
		 <p:column headerText="#{lbl['lbl.ct.pbd.table.edate']}" />
       </p:row>							
	  </p:columnGroup>
	  <p:column styleClass="column-align-center" > 
	      <h:outputText value="#{index+1}" /></p:column> 							
	      <p:column><p:outputLabel value="#{data.bondType}"/></p:column>
          <p:column><p:outputLabel value="#{data.refNo}"/></p:column>	
          <p:column><p:outputLabel value="CIMB BERHAD"/></p:column>	
          <p:column > <p:outputLabel value="MYR"/></p:column> 							
          <p:column><p:outputLabel value="#{data.bondAmount}"/>  </p:column>	
          <p:column><p:outputLabel value="11/11/2013"/></p:column>	
          <p:column><p:outputLabel value="10/11/2014"/></p:column>	
	</p:dataTable>
   </div>
  </p:panel>
</ui:composition>
