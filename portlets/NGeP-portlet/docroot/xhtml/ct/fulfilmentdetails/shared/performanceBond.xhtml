	<p:panel id="bondId" toggleable="true" toggleSpeed="500">

			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.dtls']}"/>
	   	</f:facet>
	   	<p:spacer width="2" />	
	   	<h:panelGrid columns="2">
	   		<p:outputLabel id="contractPeriod" value="#{lbl['lbl.ct.bond.contractperiod']}" />
	   		<h:panelGrid columns="6">
			<p:inputText for="contractPeriod" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"

			</p:inputText>
			<p:spacer width="2" />
			<p:outputLabel value="#{lbl['lbl.ct.months']}" />

			<p:inputText id="contractPeriodBondDaysId" styleClass="ppRightBtn"  value="#{ctBackingBean.managedBean.contractDaysPeriod}" maxlength="3" disabled="true" >

			<p:spacer width="2" />
			<p:outputLabel value="#{lbl['lbl.ct.days']}" />

			</p:inputText>
	   	
	   		<p:outputLabel id="bondPercentage" value="#{lbl['lbl.ct.bond.bondpercentage']}" />
			<p:inputText for="bondPercentage" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"

		 		<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>
			
			<p:outputLabel id="bondAmount" value="#{lbl['lbl.ct.bond.bondamount']}" />
			<p:inputText for="bondAmount" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"

		 		<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>

		<p:spacer width="1" />

					<p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.selectAll}" disabled="#{ctBackingBean.managedBean.disableOriginalBond}">

						update=":form:tableBond, :form:delPdBtn" listener="#{ctBackingBean.selectAllBond}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{varBond.selectedCheckBox}" styleClass="myCustomChekBox">

				</p:selectBooleanCheckbox>
			</p:column>
					
			<p:column style="width:30%;white-space:normal;"  styleClass="column-align-center">

				<p:inputText id="bondRefNoId" value="#{varBond.refNo}" maxlength="50" style="width:95%;"

				</p:inputText>			
				<h:outputText value="#{varBond.refNo}"

			</p:column>
				
			<p:column style="width:25%;white-space:normal;"  styleClass="column-align-center">
				<f:facet name="header">
				        <h:outputText value="#{lbl['lbl.ct.financial.inst']}"  styleClass="required"/>
				</f:facet>

				<p:selectOneMenu id="orgName"  value="#{varBond.financialOrg.financialOrgId}"

				    and ctBackingBean.managedBean.ctContractAmount.bondReq}" disabled="#{ctBackingBean.managedBean.disableOriginalBond}" >
					   <f:selectItems value="#{ctBackingBean.retrieveFinancialOrgList()}" />
					   <p:ajax  process="@this"></p:ajax>
				</p:selectOneMenu>	  
				<!-- #30479 end -->
				<h:outputText value="#{varBond.financialOrgName}"
				   style="float:left;text-align:left;" rendered="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.notificationSetting
				   or !ctBackingBean.managedBean.ctContractAmount.bondReq}" />
			</p:column>
					
			<p:column style="width:12%;" headerText="#{lbl['lbl.ct.amount']}" styleClass="column-align-center" >
				<p:inputText value="#{varBond.bondAmount}" styleClass="ppRightBtn" maxlength="18" 
				    rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting
				    and ctBackingBean.managedBean.ctContractAmount.bondReq}" disabled="#{ctBackingBean.managedBean.disableOriginalBond}" style="width:90px;" label="#{lbl['lbl.ct.amount']}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax process="@this"></p:ajax>
				</p:inputText>
				
				<h:outputText value="#{varBond.bondAmount}" style="float:right;" rendered="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.notificationSetting
					or !ctBackingBean.managedBean.ctContractAmount.bondReq}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>

					disabled="#{ctBackingBean.managedBean.disableOriginalBond}"
					mindate="#{ctBackingBean.managedBean.contractVer.ctContractValue.effDate}"
					maxdate="#{ctBackingBean.managedBean.contractVer.ctContractValue.expDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
					 <p:ajax event="dateSelect" update="@([id$=bondExpDateCalId])" process="@this" />
				</p:calendar>

						or !ctBackingBean.managedBean.ctContractAmount.bondReq}">
		                <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText>

			<p:column style="width:8%;" headerText="#{lbl['lbl.ct.expiry.date']}" styleClass="column-align-center">

			    </p:calendar>

						rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting and varBond.fileName == null
						and ctBackingBean.managedBean.ctContractAmount.bondReq and !ctBackingBean.managedBean.disableOriginalBond}"
						
						style="float:left;" icon="ui-icon-upload">
					</p:commandButton>
					<h:commandLink

						value="#{ctBackingBean.getShortFileName(varBond.fileName)}"						
						style="float:left;" styleClass="blue_font"
						action="#{ctBackingBean.commonDownload(varBond.filePath, varBond.fileName)}" />

					  	action="#{ctBackingBean.setIndexProperty(index)}"
					   	process="@this" partialSubmit="true"  onsuccess="deleteBondAttachmentDlg.show();">
			   			<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			 	</p:commandLink>
				</h:panelGroup>
			</p:column>
		</p:dataTable>
			<div class="ppRightBtn">
				
			<p:commandButton id="addPdBtn"  value="#{lbl['lbl.btn.add']}" process="@this"

				    <h:outputText value="#{lbl['lbl.ct.tooltip.add.performance.bond']}" escape="false" />
				</p:tooltip>
			</p:commandButton>
			
			
			<p:spacer width="1" />
			  
		     <p:commandButton id="delPdBtn" value="#{lbl['lbl.ct.delete']}"

		          disabled="#{ctBackingBean.managedBean.buttonHideActive}"
			      rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting
			      	and ctBackingBean.managedBean.contractVer.docType != ParameterConst.doctypeContractAmendment
			      	and ctBackingBean.managedBean.ctContractAmount.bondReq and !ctBackingBean.isContractExtendOrIsBond()}" >
				<p:tooltip for="delPdBtn">
				    <h:outputText value="#{lbl['lbl.ct.tooltip.delete.performance.bond']}" escape="false" />
				</p:tooltip>
			</p:commandButton>				
		</div>
		
		<p:spacer width="2" />

			<p:column style="width:30%;white-space:normal;"  styleClass="column-align-center">

			<p:column style="width:25%;white-space:normal;"  styleClass="column-align-center">

				</h:outputText>

					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >

				</p:calendar>

		                <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText>
			</p:column>
					
			<p:column style="width:8%;" headerText="#{lbl['lbl.ct.expiry.date']}" styleClass="column-align-center">
