<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<style type="text/css">
.calendarDateField input {
	width: 80px;
}
</style>
	<p:panel id="bondId" toggleable="true" toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.performance.bond']}"/>
			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.dtls']}"/>
	   	</f:facet>
	   	 <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.tooltip.performance.bond.instruction']}" escape="false"/><br/><br/>
	   	<h:panelGrid columns="2">
		   	<p:outputLabel id="bondAmount" value="#{lbl['lbl.ct.pb.amount']}" />
			<p:inputText for="bondAmount" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
	  				value="#{ctBackingBean.managedBean.ctContractAmount.totalBondAmt}"  disabled="true">
	   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>
		</h:panelGrid>
		 <p:dataTable id="tableBond" var="varBond" rowIndexVar="index" widgetVar="tableBondWidget"
			  value="#{ctBackingBean.managedBean.ctContractAmount.ctPerformanceBonds}"  rowKey="#{rowKeyObj}">
					  <ac:paginator for="tableBond" />
					 <p:column style="width:2%;"  rendered="#{!ctBackingBean.managedBean.viewContract}">
					 <f:facet name="header">
							<p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.selectAll}">
								<p:ajax partialSubmit="true" process="@this"
									 update=":form:tableBond,  :form:delPdBtn" listener="#{ctBackingBean.selectAllBond}" />
							</p:selectBooleanCheckbox>
						</f:facet>
						<p:selectBooleanCheckbox value="#{varBond.selectedCheckBox}" styleClass="myCustomChekBox">
							<p:ajax event="change"  update="@this, :form:tableBond, :form:delPdBtn" listener="#{ctBackingBean.selectOnePerformanceCheckboxSelect}" />
						</p:selectBooleanCheckbox>
				      </p:column>
					
					<p:column style="width:30%;white-space:normal;"  styleClass="column-align-center">
						  <f:facet name="header">
						        <h:outputText value="#{lbl['lbl.ct.ref.no']}"  styleClass="required"/>
						</f:facet>
						<p:inputText id="bondRefNoId" value="#{varBond.refNo}" maxlength="50" style="width:95%;" 
						     rendered="#{!ctBackingBean.managedBean.viewContract}">
						     <p:ajax  process="@this"></p:ajax>
						</p:inputText>
					
						<h:outputText value="#{varBond.refNo}" 
						      style="float:left;text-align:left;"  rendered="#{ctBackingBean.managedBean.viewContract}"/>
					</p:column>
				
					<p:column style="width:25%;white-space:normal;"  styleClass="column-align-center">
						<f:facet name="header">
						        <h:outputText value="#{lbl['lbl.ct.financial.inst']}"  styleClass="required"/>
						</f:facet>
						
						<p:selectOneMenu id="orgName"  value="#{varBond.financialOrg.financialOrgId}"
						    style="width:200px;" rendered="#{!ctBackingBean.managedBean.viewContract}" >
							   <f:selectItems value="#{ctBackingBean.retrieveFinancialOrgList()}" />
							   <p:ajax  process="@this"></p:ajax>
						</p:selectOneMenu>	  
	
						<h:outputText value="#{varBond.financialOrgName}"
						   style="float:left;text-align:left;" rendered="#{ctBackingBean.managedBean.viewContract}"/>
					</p:column>
					
					<p:column style="width:12%;" headerText="#{lbl['lbl.ct.amount']}" styleClass="column-align-center" >
						<p:inputText value="#{varBond.bondAmount}" styleClass="ppRightBtn" maxlength="18" 
						    rendered="#{!ctBackingBean.managedBean.viewContract}" style="width:90px;" label="#{lbl['lbl.ct.amount']}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								<p:ajax process="@this"></p:ajax>
						</p:inputText>
						
						<h:outputText value="#{varBond.bondAmount}" style="float:right;" rendered="#{ctBackingBean.managedBean.viewContract}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					
					<p:column style="width:8%;" styleClass="column-align-center">
						<f:facet name="header">
						        <h:outputText value="#{lbl['lbl.ct.effective.date']}"  styleClass="required"/>
						</f:facet>
						
						<p:calendar id="popupButtonCal4" value="#{varBond.effDate}"  styleClass="calendarDateField" size="9" 
							rendered="#{!ctBackingBean.managedBean.viewContract}"
							showOn="button" readonlyInput="true" navigator="true"
							mindate="#{ctBackingBean.managedBean.contractVer.ctContractValue.effDate}"
							maxdate="#{ctBackingBean.managedBean.contractVer.ctContractValue.expDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							 <p:ajax event="dateSelect" update="@([id$=bondExpDateCalId])" process="@this" />
						</p:calendar>
						
							<h:outputText value="#{varBond.effDate}" rendered="#{ctBackingBean.managedBean.viewContract}">
				                <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText>
					</p:column>
					
					<p:column style="width:8%;" headerText="#{lbl['lbl.ct.expiry.date']}" styleClass="column-align-center">
						<p:calendar id="bondExpDateCalId"  value="#{varBond.expDate}" styleClass="calendarDateField" showOn="button"
						    readonlyInput="true" disabled="true"  navigator="true" rendered="#{!ctBackingBean.managedBean.viewContract}"
							size="9"  pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						    <f:attribute name="startDate" value="#{varBond.effDate}" />
		                    <f:validator validatorId="primeDateRangeValidator" />
					    </p:calendar>
					    
					     <h:outputText value="#{varBond.expDate}" rendered="#{ctBackingBean.managedBean.viewContract}">
				            <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText>
					</p:column>
					
					<p:column styleClass="column-align-center"  headerText="#{lbl['lbl.txt.attachment']}" style="width:15%;">
						
						
						<h:panelGroup id="uploadBondPg" columns="2">
							<p:commandButton oncomplete="uploadBondDlg.show();return false;" 
							   process="@this" partialSubmit="true" actionListener="#{ctBackingBean.PerformanceBondValue(varBond)}"
									rendered="#{!ctBackingBean.managedBean.viewContract and varBond.fileName == null}" 
							     style="float:left;" icon="ui-icon-upload">
							</p:commandButton>
							<h:commandLink
								title="#{varBond.fileName}"
								value="#{ctBackingBean.getShortFileName(varBond.fileName)}"						
								style="float:left;" styleClass="blue_font"
								action="#{ctBackingBean.downloadFile(varBond.filePath, varBond.fileName)}" />
							<p:commandLink rendered="#{varBond.fileName != null and !ctBackingBean.managedBean.viewContract}" style="float:left;" 
							  action="#{ctBackingBean.setIndexProperty(index)}"
							   process="@this" partialSubmit="true"  onsuccess="deleteBondAttachmentDlg.show();">
					   				<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
					 	</p:commandLink>
						</h:panelGroup>
					</p:column>
		</p:dataTable>
		<div class="ppRightBtn">
			
				<p:commandButton id="addPdBtn"  value="#{lbl['lbl.btn.add']}" process="@this" 
				  rendered="#{!ctBackingBean.managedBean.viewContract
				  	and ctBackingBean.managedBean.contractVer.docType != ParameterConst.doctypeAmendmentWithoutSupplement}" 
				     action="#{ctBackingBean.addBondDetails}" update=":form:tableBond" partialSubmit="true"
				     oncomplete="tableBondWidget.paginator.endLink.click();">
					<p:tooltip for="addPdBtn">
					    <h:outputText value="#{lbl['lbl.ct.tooltip.add.performance.bond']}" escape="false" />
					</p:tooltip>
				</p:commandButton>
				<p:spacer width="1" />
		  
			     <p:commandButton id="delPdBtn" value="#{lbl['lbl.ct.delete']}" 
			          process="@this" partialSubmit="true" onsuccess="dlgPerformDel.show();"
			          disabled="#{ctBackingBean.managedBean.buttonHideActive}"
				      rendered="#{!ctBackingBean.managedBean.viewContract
				      	and ctBackingBean.managedBean.contractVer.docType != ParameterConst.doctypeAmendmentWithoutSupplement}" >
					<p:tooltip for="delPdBtn">
					    <h:outputText value="#{lbl['lbl.ct.tooltip.delete.performance.bond']}" escape="false" />
					</p:tooltip>
				</p:commandButton>
			
		</div>
		<p:dialog id="uploadBondDlg" widgetVar="uploadBondDlg" modal="true" resizable="false"
			width="700px" height="350" styleClass="pop_up_top"
			header="#{lbl['lbl.txt.choose.files']}"
			onShow="singleUploadListener(performanceBondUploadWV);">
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;"  dragDropSupport="false"
			   	fileUploadListener="#{ctBackingBean.fileUploadPerformance}"
			    mode="advanced" id="performanceFileuploadId" multiple="false"
			 	sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"  showButtons="false"
				allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" widgetVar="performanceBondUploadWV"
				invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"  
				update=":form:tableBond" label="#{lbl['lbl.btn.choose']}" oncomplete="uploadBondDlg.hide();" >
			</p:fileUpload>
			<f:facet name="footer">
			<div class="ppRightBtn">
			    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadBondDlg.hide();" />
	   		</div>
	   		</f:facet>
		</p:dialog>
		    <p:confirmDialog id="dlgPerformDel" widgetVar="dlgPerformDel" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
			<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:tableBond, :form:delPdBtn" partialSubmit="true"
		         process="@this" actionListener="#{ctBackingBean.removePerformanceBond()}" oncomplete="dlgPerformDel.hide();">
		         <f:setPropertyActionListener
					target="#{ctBackingBean.managedBean.selectAll}" value="#{false}" /></p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgPerformDel.hide();" type="button" />
			</div>
		</p:confirmDialog>
		
		   <p:confirmDialog id="deleteBondAttachmentDlg" widgetVar="deleteBondAttachmentDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
                severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
		<div class="ppRightBtn">
	     <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this" partialSubmit="true" update=":form:tableBond"
	     	actionListener="#{ctBackingBean.deleteBondAttachement()}" immediate="true"
	     	oncomplete="deleteBondAttachmentDlg.hide();"/>
		 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteBondAttachmentDlg.hide();" type="button" />
	   </div>
 	</p:confirmDialog>
	</p:panel>
</ui:composition>
