<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
  
   
   
           <div style="overflow-x:auto">
			                               
			                               <p:dataTable id="dataTable" var="data" value=" " rowIndexVar="index"
							               widgetVar="dataTableObj" lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom"
							               paginatorAlwaysVisible="false" emptyMessage="No Records!" rows="10" rowsPerPageTemplate="5,10,15,20"
							               currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
							               paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
							                {LastPageLink} {RowsPerPageDropdown}">
							
							                <p:columnGroup type="header"> 
								                <p:row> 
									                     <p:column rowspan="1" headerText="No."  />
									                     <p:column colspan="1" headerText="Bond Type"  /> 
									                     <p:column colspan="1" headerText="Reference No" /> 
									                     <p:column colspan="1" headerText="Financial Institution" /> 	
									                     <p:column colspan="1" headerText="Address"  /> 
									                     <p:column colspan="1" headerText="Currency" /> 
									                     <p:column colspan="1" headerText="Amount" /> 	
									                     <p:column colspan="1" headerText="Effective Date"  /> 
									                     <p:column colspan="1" headerText="Expiry Date" />
								               </p:row>							
								
							
							                </p:columnGroup>
							                     <p:column styleClass="column-align-center" > <h:outputText value="#{index+1}" /></p:column> 							
							                     <p:column></p:column>
							                     <p:column></p:column>	
							                     <p:column></p:column>	
							                     <p:column></p:column>	
							                     <p:column > </p:column> 							
							                     <p:column>  </p:column>	
							                     <p:column></p:column>	
							                     <p:column></p:column>	
							               </p:dataTable>
						            </div>
</ui:composition>
