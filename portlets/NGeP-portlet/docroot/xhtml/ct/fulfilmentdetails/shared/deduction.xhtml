<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <p:panel id="deductionId" header="#{lbl['lbl.ct.ded.panel.name']}"   toggleable="true"  toggleSpeed="500" widgetVar="paneldeduction">
		<p:dataTable id="tableDeduction" var="data" value="#{contractDetailsBackingBean.managedBean.ctContract.ctDeductions}" 
		  widgetVar="dataTableObj" editable="true" editMode="cell" paginator="true" paginatorPosition="bottom" 
		  paginatorAlwaysVisible="true" emptyMessage="No Records!">
		 <p:ajax event="cellEdit" listener="#{contractDetailsBackingBean.onCellEdit}" />  
          <p:column headerText="#{lbl['lbl.ct.ded.table.type']}" style="width:130px;">  
               <p:cellEditor>  
                    <f:facet name="output"> 
                    <h:outputText value="#{data.deductionTypeCode.category}" />
                    </f:facet>  
                    <f:facet name="input">  
                    <h:selectOneMenu value="#{data.deductionTypeCode.category}" style="width:100%">  
                    <f:selectItems value="#{contractDetailsBackingBean.deductions}" var="type" itemLabel="#{type}" itemValue="#{type}" />  
                    </h:selectOneMenu>  
                </f:facet>   
               </p:cellEditor>  
           </p:column>    
           <p:column headerText="#{lbl['lbl.ct.ded.table.per']}" style="width:300px;">  
               <p:cellEditor>  
                   <f:facet name="output">
                   <h:outputText value="#{data.description}" />
                   </f:facet>  
                   <f:facet name="input">
                   <p:inputText id="desInput" value="#{data.description}" style="width:96%"/>
                   </f:facet>  
               </p:cellEditor>  
           </p:column>  
			<p:column headerText="#{lbl['lbl.ct.ded.table.ramt']}" style="width:120px;">  
               <p:cellEditor>  
                   <f:facet name="output">
                   <h:outputText value="#{data.amount}" />
                   </f:facet>  
                   <f:facet name="input">
                   <p:inputText id="amtInput" value="#{data.amount}" style="width:96%"/>
                   </f:facet>  
               </p:cellEditor>  
           </p:column>  
			 <p:column headerText="#{lbl['lbl.ct.ded.table.action']}" styleClass="column-align-center">
			  <p:commandLink partialSubmit="true" process="@this" onsuccess="deleteDeduct.show()">
			        <f:setPropertyActionListener value="#{data}" target="#{contractDetailsBackingBean.managedBean.ctDeduction}" />
			        <p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
			  </p:commandLink>
			 </p:column>     
			</p:dataTable>
		   <h:panelGrid style="width:760px" columnClasses="column-align-right">
		       <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@this" partialSubmit="true"  icon="ui-icon-add"
		         action="#{contractDetailsBackingBean.addDeductionDetails()}" update="tableDeduction"/>
		  </h:panelGrid>
		  <p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			   severity="alert" widgetVar="deleteDeduct">
                 <h:panelGrid columns="2">
				 <p:commandButton value="Yes" update="tableDeduction" partialSubmit="true" process="@this"
				    onclick="deleteDeduct.hide();" actionListener="#{contractDetailsBackingBean.deleteDeductionDetails()}"/>
				  <p:commandButton value="No" 	onclick="deleteDeduct.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>
	 </p:panel>          
	 <p:panel id="clauseId" header="#{lbl['lbl.ct.ded.panel1.name']}"    toggleable="true"  toggleSpeed="500" widgetVar="panelclause">
          <p:dataTable id="tableClause" var="data" value="#{contractDetailsBackingBean.managedBean.addDeductionClause}" widgetVar="dataTableObj" lazy="false" 
          dynamic="true" emptyMessage="No Records!" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true">
              <p:columnGroup type="header"> 
                <p:row>          
                 <p:column style="width:200px;" headerText="#{lbl['lbl.ct.ded.table1.clause']}"  /> 
                 <p:column style="width:500px" headerText="#{lbl['lbl.ct.ded.table1.desc']}" /> 
                 <p:column style="width:100px" headerText="#{lbl['lbl.ct.ded.table1.action']}" /> 	
               </p:row>	
              </p:columnGroup>
      		  <p:column><p:outputLabel value = "#{data.clauseName}" style="float:left;"/></p:column>       
              <p:column><p:outputLabel value = "#{data.clauseDesc}" style="float:left;"/></p:column>    
              <p:column styleClass="column-align-center">
               <p:commandLink onsuccess="confirmation.show()" partialSubmit="true" process="@this" icon="ui-icon-delete">
                <f:setPropertyActionListener value="#{data}" target="#{contractDetailsBackingBean.managedBean.deductionClause}" />
                 <p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
			  </p:commandLink>
              </p:column>  
          </p:dataTable>
         <h:panelGrid style="width:760px" columnClasses="column-align-right">
          <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@this" partialSubmit="true" icon="ui-icon-add" onclick="dlg2.show();" >
		    <p:ajax event="change" update=":form:tableClause" process="@this" listener="#{contractDetailsBackingBean.addDeductionClause()}" />
		  </p:commandButton>
       </h:panelGrid>
	 </p:panel>
	 <p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			   severity="alert" widgetVar="confirmation">
                 <h:panelGrid columns="2">
				 <p:commandButton value="Yes" update="tableClause" partialSubmit="true" process="@this"
				    onclick="confirmation.hide();" actionListener="#{contractDetailsBackingBean.deleteClauseDetails()}"/>
				  <p:commandButton value="No" 	onclick="confirmation.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>
	
	 <p:dialog id="dialogClause" header="Add Deduction Clause" widgetVar="dlg2" modal="true" width="750" height="450">
		<p:panel  id="clause">
		<h:panelGrid style="width:700px;">
         <p:dataTable id="tableClause1" var="data" value="#{contractDetailsBackingBean.managedBean.ctDeductionClause}" rowIndexVar="index" 
           widgetVar="dataTableObj" scrollable="false" lazy="false" dynamic="true" 
           selection="#{contractDetailsBackingBean.chkDeductionClause}" rowKey="#{data.deductionClauseId}">
              <p:column selectionMode="multiple" style="width:18px" />
					<p:column headerText="#{lbl['lbl.ct.ded.table1.clause']}">
						<h:outputText value="#{data.clauseName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.ded.table1.desc']}">
						<h:outputText value="#{data.clauseDesc}" />
					</p:column>
          </p:dataTable>
           <h:panelGrid columns="2" style="float:right;height:100px;vertical-align: middle;">
             <p:commandButton value="#{lbl['lbl.ct.ded.btn.ok']}" actionListener="#{contractDetailsBackingBean.addDeductionClause}" process="dialogClause" icon="ui-icon-select"
              update="tableClause,dialogClause" onclick="dlg2.hide();"  />
        	 <p:commandButton value="#{lbl['lbl.ct.ded.btn.cancel']}"   type="button" ajax="false" icon="ui-icon-cancel" onclick="dlg2.hide();" />
       	  </h:panelGrid>
       	   </h:panelGrid>
	     </p:panel>    
     </p:dialog>
</ui:composition>
