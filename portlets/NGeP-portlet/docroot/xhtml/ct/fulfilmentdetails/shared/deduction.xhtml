<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <p:panel id="deductionId" header="#{lbl['lbl.ct.ded.panel.name']}"   toggleable="true"  toggleSpeed="500" widgetVar="paneldeduction">
		<p:dataTable id="tableDeduction" var="data" value="#{contractDetailsBackingBean.managedBean.ctContract.ctDeductions}" widgetVar="dataTableObj"	
		editable="true" editMode="cell" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="10" 
		 rowsPerPageTemplate="5,10,15,20" currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
		 paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink}
		  {LastPageLink} {RowsPerPageDropdown}">
		 <p:ajax event="cellEdit" listener="#{contractDetailsBackingBean.onCellEdit}" />  
          <p:column headerText="#{lbl['lbl.ct.ded.table.type']}" style="width:130px;">  
               <p:cellEditor>  
                    <f:facet name="output"> 
                    <h:outputText value="#{data.deductionType}" />
                    </f:facet>  
                    <f:facet name="input">  
                    <h:selectOneMenu value="#{data.deductionType}" style="width:100%">  
                    <f:selectItems value="#{contractDetailsBackingBean.deductions}" var="type" itemLabel="#{type}" itemValue="#{type}" />  
                    </h:selectOneMenu>  
                </f:facet>   
               </p:cellEditor>  
           </p:column>    
           <p:column headerText="#{lbl['lbl.ct.ded.table.desc']}" style="width:300px;">  
               <p:cellEditor>  
                   <f:facet name="output">
                   <h:outputText value="#{data.description}" />
                   </f:facet>  
                   <f:facet name="input">
                   <p:inputText id="desInput" value="#{data.description}" style="width:96%"/>
                   </f:facet>  
               </p:cellEditor>  
           </p:column>  
	    	 <p:column headerText="#{lbl['lbl.ct.ded.table.cur']}" style="width:100px;">  
               <p:cellEditor>  
                    <f:facet name="output">
                    <h:outputText value="" />
                    </f:facet>  
                    <f:facet name="input">  
                    <h:selectOneMenu value="" style="width:100%">  
                    <f:selectItems value="#{contractDetailsBackingBean.contractListItem.currency}"  />  
                    </h:selectOneMenu>  
                    </f:facet>   
               </p:cellEditor>  
           </p:column>  	
			<p:column headerText="#{lbl['lbl.ct.ded.table.ramt']}" style="width:120px;">  
               <p:cellEditor>  
                   <f:facet name="output">
                   <h:outputText value="#{data.amount}" />
                   </f:facet>  
                   <f:facet name="input">
                   <p:inputText id="amtInput" value="#{data.amount}" style="width:96%"/>
                   </f:facet>  
               </p:cellEditor>  
           </p:column>  
			 <p:column headerText="#{lbl['lbl.ct.ded.table.action']}" styleClass="column-align-center">
			  <p:commandButton title="delete" onsuccess="deleteDeduct.show()" partialSubmit="true" process="@this" icon="ui-icon-delete">
					    <f:setPropertyActionListener value="#{data}" target="#{contractDetailsBackingBean.managedBean.ctDeduction}" />
					  </p:commandButton>
			 </p:column>     
			</p:dataTable>
			<p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			   severity="alert" widgetVar="deleteDeduct">
                 <h:panelGrid columns="2" columnClasses="column-align-right-50,column-align-left">
				 <p:commandButton value="Yes" update="tableDeduction" partialSubmit="true" process="@this"
				    onclick="deleteDeduct.hide();" actionListener="#{contractDetailsBackingBean.deleteDeductionDetails()}"/>
				  <p:commandButton value="No" 	onclick="deleteDeduct.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>
		 <h:panelGrid style="width:750px" columnClasses="column-align-right">
		 <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@this" partialSubmit="true"  action="#{contractDetailsBackingBean.addDeductionDetails()}" 
		 update="tableDeduction"/>
		</h:panelGrid>
	 </p:panel>          
	 <p:panel id="clauseId" header="#{lbl['lbl.ct.ded.panel1.name']}"    toggleable="true"  toggleSpeed="500" widgetVar="panelclause">
          <p:dataTable id="tableClause" var="data" value="" widgetVar="dataTableObj" lazy="false" dynamic="true" 
              emptyMessage="No Records!" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" 
              rows="10"  rowsPerPageTemplate="5,10,15,20"  currentPageReportTemplate=" total {totalRecords},  page {currentPage} of {totalPages} "
              paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
              <p:columnGroup type="header"> 
                <p:row>          
                 <p:column style="width:200px;" headerText="#{lbl['lbl.ct.ded.table1.clause']}"  /> 
                 <p:column style="width:500px" headerText="#{lbl['lbl.ct.ded.table1.desc']}" /> 
                 <p:column style="width:100px" headerText="#{lbl['lbl.ct.ded.table1.action']}" /> 	
               </p:row>	
              </p:columnGroup>
      		  <p:column><p:outputLabel value = ""/></p:column>       
              <p:column><p:outputLabel value = ""/></p:column>    
              <p:column styleClass="column-align-center">
              <p:commandButton title="delete" onsuccess="confirmation.show()" partialSubmit="true" process="@this" icon="ui-icon-delete"/>
              </p:column>  
          </p:dataTable>
         <h:panelGrid style="width:750px" columnClasses="column-align-right-30">
          <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" styleClass="text-align: right;" process="@this" partialSubmit="true" icon="ui-icon-add"
           onclick="dlg2.show();" >
		    <p:ajax event="change" update=":form:tableClause" process="@this" />
		  </p:commandButton>
       </h:panelGrid>
	 </p:panel>
	 <p:dialog id="dialogClause" header="Add Deduction Clause" widgetVar="dlg2" modal="true" width="700" height="450">
		<p:panel  id="clause">
         <p:dataTable id="tableClause1" var="data" value=" " rowIndexVar="index" widgetVar="dataTableObj" scrollable="true"
            lazy="false" dynamic="true">
          </p:dataTable>
           <h:panelGrid  columns="2" style="width:600px" columnClasses="column-align-right-30">
             <p:commandButton value="#{lbl['lbl.ct.ded.btn.select']}"   process="dialogClause" update="tableClause" onclick="dlg2.hide();"/>
        	 <p:commandButton value="#{lbl['lbl.ct.ded.btn.cancel']}"   type="button" ajax="false" onclick="dlg2.hide();" />
       	  </h:panelGrid>
	     </p:panel>  
     </p:dialog>
</ui:composition>
