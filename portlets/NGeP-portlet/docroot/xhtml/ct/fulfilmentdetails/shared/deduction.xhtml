<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="deductionId" header="#{lbl['lbl.ct.ded.panel.name']}"   toggleable="true"  toggleSpeed="500">
	<p:dataTable id="tableDeduction" var="datas" value="#{contractDetailsBackingBean.managedBean.contractVer.ctDeductions}" 
	   rowKey="#{datas}" selection="#{contractDetailsBackingBean.selectedDeductionList}" 
	   paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true" emptyMessage="No Records!">
	   <ac:paginator for="tableDeduction" />
	    <p:columnGroup type="header"> 
	       <p:row> 
	                 <p:column headerText="Select"  /> 
                    <p:column headerText="#{lbl['lbl.ct.ded.table.type']}"  /> 
                    <p:column headerText="#{lbl['lbl.ct.ded.table.desc']}" /> 
                    <p:column headerText="#{lbl['lbl.ct.ded.table.ramt']}" /> 
  
		  </p:row>
	   </p:columnGroup>
	    <p:column selectionMode="multiple" style="width:18px" rendered="#{datas.deductionId != null}" disabledSelection="true"/>   
	     <p:column selectionMode="multiple" style="width:18px" rendered="#{datas.deductionId == null}"/>  
	        
	    <p:column style="width:150px;">
           <p:outputLabel value="#{contractDetailsBackingBean.getParameterDesc(datas.deductionType)}" rendered="#{datas.deductionId != null}" style="float:left;" />
           <h:selectOneMenu style="width:100%" value="#{datas.deductionType.parameterId}" rendered="#{datas.deductionId == null}">  
                  <f:selectItems value="#{contractDetailsBackingBean.getDropdownValues('DDT')}"/>  
           </h:selectOneMenu>  
        </p:column> 
	    <p:column style="width:500px;">  
	       <p:outputLabel value="#{datas.description}" rendered="#{datas.deductionId != null}" style="float:left;"/>
	       <p:inputText value="#{datas.description}"  rendered="#{datas.deductionId == null}" style="width:96%"/>
	    </p:column>
	     <p:column   style="width:150px;">
	       <h:outputLabel value="#{datas.amount}" rendered="#{datas.deductionId != null}" >
	        <f:convertNumber pattern="#,###.00" /></h:outputLabel>
	        <p:inputText id="amtInput" value="#{datas.amount}" rendered="#{datas.deductionId == null}" style="width:90%;" styleClass="ppRightBtn">
                   <f:convertNumber pattern="#,###.00" />
                </p:inputText> 
	      </p:column>  
	</p:dataTable>
			<p:spacer height="2" />
		   <div class="ppRightBtn"> 
		       <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}"  icon="ui-icon-add"
		         action="#{contractDetailsBackingBean.addDeductionDetails}" update="tableDeduction"/>
		        <p:spacer width="2"/>
		        <p:commandButton value="Delete" icon="ui-icon-delete" partialSubmit="true" process="@form" onsuccess="deleteDeduct.show()">
			    </p:commandButton> 
	   	 </div>
		  <p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			   severity="alert" widgetVar="deleteDeduct">
                 <h:panelGrid columns="2">
				 <p:commandButton value="Yes" update="tableDeduction" process="@form"
				    onclick="deleteDeduct.hide();" actionListener="#{contractDetailsBackingBean.deleteDeductionDetails()}"/>
				  <p:commandButton value="No" 	onclick="deleteDeduct.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>
	 </p:panel>          
	 <p:panel id="clauseId" header="#{lbl['lbl.ct.ded.panel1.name']}"    toggleable="true"  toggleSpeed="500">
          <p:dataTable id="tableClause" var="data" value="#{contractDetailsBackingBean.managedBean.ctDeductionClauseList}" widgetVar="dataTableObj" lazy="false" 
          dynamic="true" emptyMessage="No Records!" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true">
            <ac:paginator for="tableClause" />   
             <p:columnGroup type="header"> 
                <p:row>          
                 <p:column style="width:200px;" headerText="#{lbl['lbl.ct.ded.table1.clause']}"  /> 
                 <p:column style="width:500px" headerText="#{lbl['lbl.ct.ded.table1.desc']}" /> 
                 <p:column style="width:100px" headerText="#{lbl['lbl.ct.ded.table1.action']}" /> 	
               </p:row>	
              </p:columnGroup>
      		  <p:column><p:outputLabel value = "#{data.clauseName}" style="float:left;"/></p:column>       
              <p:column><p:outputLabel value = "#{data.clauseDesc}" style="float:left;"/></p:column>    
              <p:column styleClass="column-align-center">
               <p:commandLink onsuccess="confirmation.show()" partialSubmit="true" process="@this" icon="ui-icon-delete">
                <f:setPropertyActionListener value="#{data}" target="#{contractDetailsBackingBean.managedBean.ctDeductionClauseDel}" />
                 <p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
			  </p:commandLink>
              </p:column>  
          </p:dataTable>
          	<p:spacer height="2" />
           <div class="ppRightBtn"> 
          <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@this" partialSubmit="true" icon="ui-icon-add" onclick="dlg2.show();" >
		    <p:ajax event="change" update=":form:tableClause" process="@this" listener="#{contractDetailsBackingBean.addDeductionClause()}" />
		  </p:commandButton>
          </div>
	 </p:panel>
	 <p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			   severity="alert" widgetVar="confirmation">
                 <h:panelGrid columns="2">
				 <p:commandButton value="Yes" update="tableClause" partialSubmit="true" process="@this"
				    onclick="confirmation.hide();" actionListener="#{contractDetailsBackingBean.deleteClauseDetails()}"/>
				  <p:commandButton value="No" 	onclick="confirmation.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>
	
	 <p:dialog id="dialogClause" header="Add Deduction Clause" widgetVar="dlg2" modal="true" width="750" height="450">
		<p:panel  id="clause">
		<h:panelGrid style="width:700px;">
         <p:dataTable id="tableClause1" var="data" value="#{contractDetailsBackingBean.managedBean.ctDeductionClauseList}" rowIndexVar="index" 
           widgetVar="dataTableObj" scrollable="false" lazy="false" dynamic="true" 
           selection="#{contractDetailsBackingBean.chkDeductionClause}" rowKey="#{data.deductionClauseId}">
              <p:column selectionMode="multiple" style="width:18px" />
					<p:column headerText="#{lbl['lbl.ct.ded.table1.clause']}">
						<h:outputText value="#{data.clauseName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.ded.table1.desc']}">
						<h:outputText value="#{data.clauseDesc}" />
					</p:column>
          </p:dataTable>
           <h:panelGrid columns="2" style="float:right;height:100px;vertical-align: middle;">
             <p:commandButton value="#{lbl['lbl.ct.ded.btn.ok']}" actionListener="#{contractDetailsBackingBean.addDeductionClause}" process="dialogClause" icon="ui-icon-select"
              update="tableClause,dialogClause" onclick="dlg2.hide();"  />
        	 <p:commandButton value="#{lbl['lbl.ct.ded.btn.cancel']}"   type="button" ajax="false" icon="ui-icon-cancel" onclick="dlg2.hide();" />
       	  </h:panelGrid>
       	   </h:panelGrid>
	     </p:panel>    
     </p:dialog>
</ui:composition>
