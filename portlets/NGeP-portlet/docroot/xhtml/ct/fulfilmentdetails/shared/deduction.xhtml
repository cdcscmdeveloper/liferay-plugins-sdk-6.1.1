<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="deductionId" header="#{lbl['lbl.ct.ded.panel.name']}"   toggleable="true"  toggleSpeed="500">
	
		<p:dataTable id="tableDeduction" var="datas" 
		    value="#{contractDetailsBackingBean.managedBean.contractVer.ctDeductions}" 
		   	rowKey="#{datas}" selectionMode="single" selection="#{contractDetailsBackingBean.managedBean.selectedDeduction}" > 
		       	
		       	<ac:paginator for="tableDeduction" />
		   	    <p:ajax event="rowSelect" update=":form:clauseDescp"  />
		         
		          <p:column headerText="#{lbl['lbl.ct.ded.table.type']}" style="width:650px;">
	        	     <p:outputLabel value="#{contractDetailsBackingBean.getParameterDesc(datas.deductionType)}" style="float:left;" />
	              </p:column> 
		       
		          <p:column headerText="#{lbl['lbl.ct.ded.table.ramt']}" style="width:150px;text-align:right;">
	                 <h:outputText value="#{datas.amount}" rendered="#{datas.deductionType.parameterCode eq ParameterConst.deductionTypeFixedDeposit
		                   or datas.deductionType.parameterCode eq ParameterConst.deductionTypeAdvancePayment}">
		                <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		             </h:outputText>
		         </p:column>  
		   
		   </p:dataTable>  
	       <p:outputPanel id="clauseDescp">  
	            <h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.selectedDeduction != null 
	               and (contractDetailsBackingBean.managedBean.selectedDeduction.ctDeductionClauses.size() > 0 or
	               contractDetailsBackingBean.managedBean.selectedDeduction.deductionType.parameterCode eq 
        	       ParameterConst.deductionTypeAdvancePayment)}">
	               <p:spacer height="20"/>
     	           
     	           <p:dataTable id="tableClause" var="data" 
     	               value="#{contractDetailsBackingBean.managedBean.selectedDeduction.ctDeductionClauses}"  
        	           selection="#{contractDetailsBackingBean.selectedDeductionClauses}"  rowKey="#{data}"  > 
                       <ac:paginator for="tableClause" />   
                            <p:column selectionMode="multiple" style="width:2%;" 
                               disabledSelection="#{contractDetailsBackingBean.managedBean.selectedDeduction.deductionType.parameterCode !=
        	                       ParameterConst.deductionTypeAdvancePayment}"/>
                           
                            <p:column headerText="#{lbl['lbl.ct.ded.table1.desc']}" style="white-space:normal;width:98%;">
                                <p:outputLabel value="#{data.clauseDescription}" 
                                   rendered="#{contractDetailsBackingBean.managedBean.selectedDeduction.deductionType.parameterCode !=
        	                       ParameterConst.deductionTypeAdvancePayment}" style="float:left;"/>
                                 <p:inputTextarea value="#{data.clauseDescription}" maxlength="500" rows="1" cols="180"
                                     disabled="#{!contractDetailsBackingBean.managedBean.flgPaymentTracking}"
                                     rendered="#{contractDetailsBackingBean.managedBean.selectedDeduction.deductionType.parameterCode ==
        	                         ParameterConst.deductionTypeAdvancePayment}" styleClass="ui-inputtextarea">
        	                     <p:ajax process="@this"/>
        	                   </p:inputTextarea>
                           </p:column>    
           
                      </p:dataTable>
                      <p:spacer height="2" />
                      <div class="ppRightBtn"> 
                          <c:if test="#{contractDetailsBackingBean.managedBean.selectedDeduction != null and 
                                contractDetailsBackingBean.managedBean.selectedDeduction.deductionType.parameterCode eq 
        	                    ParameterConst.deductionTypeAdvancePayment}">
        	                <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@form" 
        	                    icon="ui-icon-add" action="#{contractDetailsBackingBean.addDeductionClause()}" update=":form:tableClause"/>
		  	                <p:commandButton value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" process="@form" onclick="dlgDeduction.show()" />
                         </c:if>
                    </div>
                </h:panelGroup>
             </p:outputPanel>
         </p:panel>      
	     <p:dialog id="dlgDeduction" widgetVar="dlgDeduction" modal="true" width="350"
	         header="Delete Confirmation"  styleClass="screen-title"  resizable="false"  height="95">  
             <h:panelGrid columns="3">
                  <p:graphicImage library="ep/images/design" name="exclamation.png"
			          value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			         <p:spacer width="10"/>
                     <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" styleClass="ui-inputtextarea"/>
             </h:panelGrid>
             <div class="ppRightBtn">
		            <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" icon="ui-icon-accept" update=":form:tableClause" 
		                 process="@form"  actionListener="#{contractDetailsBackingBean.deleteClauseDetails()}" onclick="dlgDeduction.hide();"/>
			        <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" icon="ui-icon-reject" onclick="dlgDeduction.hide();" type="button" />
		      </div>
        </p:dialog>  
	    <p:panel header="#{lbl['lbl.ct.remarks']}" toggleable="true">
		  <table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.deductionRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		     
</ui:composition>
