<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true" collapsed="false" toggleSpeed="500">
	   <h:panelGrid columns="5" style="width:100%;" columnClasses="columnWidth15,columnWidth20,columnWidth20,columnWidth20,columnWidth15">
		  <p:outputLabel id="cno" value="#{lbl['lbl.ct.cno']}" />
		  <p:inputText for="cno" value="#{contractDetailsBackingBean.managedBean.ctContract.contractNo}" 
			 disabled="true" style="width:170px;" />
		  <p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physicalNo']}" />
		  <p:inputText for="physicalNo" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}" style="width:170px;" />				
		  <h:panelGrid columns="3">
		    <p:selectBooleanCheckbox 
			   value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.agreement}" disabled="true" />
		    <p:spacer width="2" />	
		    <p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
	       </h:panelGrid>	
		   <p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effectiveDate']}" />
		   <p:inputText for="effectiveDate" style="width:170px;" disabled="true"
			  value="#{contractDetailsBackingBean.convertTime(contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate)}" />
		   <p:outputLabel id="edate" value="#{lbl['lbl.ct.edate']}" />
		   <p:inputText for="edate" style="width:170px;" disabled="true"
			  value="#{contractDetailsBackingBean.convertTime(contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate)}" />
		   <h:panelGrid columns="3">
		      <p:selectBooleanCheckbox value="false" disabled="true" />
		      <p:spacer width="2" />	
		       <p:outputLabel value="AP201 Exemption" />
	       </h:panelGrid>	
		   <h:outputLabel id="dperiod" value="#{lbl['lbl.ct.dperiod']}" />
		   <h:panelGrid columns="3">
			 <p:inputText for="dperiod" styleClass="ppRightBtn" style="width:72px;" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}"/>
			 <p:spacer width="2"/>
			 <p:selectOneMenu id="daysMonthYears" style="width:95px;"> 
		        <f:selectItem itemLabel="-Select One-" itemValue=""/>
                <f:selectItem itemLabel="Days" itemValue="D"/>  
                <f:selectItem itemLabel="Months" itemValue="M"/>
                <f:selectItem itemLabel="Years" itemValue="Y"/>
              </p:selectOneMenu> 
			</h:panelGrid>	
			<p:outputLabel id="signBy" value="Signed Date" />
			<p:inputText for="signBy" disabled="true" style="width:170px;"/>
			<f:verbatim/>
			<h:outputLabel
				rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				value="#{lbl['lbl.ct.circularNo']}" />
			<p:commandLink rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				style="margin-right:20px;" ajax="false">
				<h:outputText
					value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo}"
					styleClass="linkcommand" />
			</p:commandLink>
			<f:verbatim rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"/>
			<f:verbatim rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"/>
			<f:verbatim rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"/>
			<h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="Contract Title"/>
			</div>
			</h:panelGroup>
		    <h:panelGrid>
			<p:inputTextarea id="contractName"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.contractName}"
				required="false" rows="3" cols="31" disabled="true"
				autoResize="false" />	
			</h:panelGrid>		    
	 </h:panelGrid>
  </p:panel>
</ui:composition>
