<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="cc" header="#{lbl['lbl.ct.panel.name']}" toggleable="true" collapsed="false" toggleSpeed="500">
	   <h:panelGrid columns="5" style="width:93%;" 
	      columnClasses="columnWidth15,columnWidth20,columnWidth20,columnWidth20,columnWidth15">
		     <p:outputLabel id="centralNo" value="#{lbl['lbl.ct.cno']}" />
		     <p:inputText for="centralNo" disabled="true" style="width:170px;"
		        maxlength="17"  value="#{contractDetailsBackingBean.managedBean.ctContract.contractNo}" />
		     <p:outputLabel id="centralphyNo" value="#{lbl['lbl.ct.physicalNo']}" />
		     <p:inputText for="centralphyNo" style="width:170px;"  maxlength="30"
		       value="#{contractDetailsBackingBean.managedBean.ctContract.contractPhysicalNo}"/>				
		     <h:panelGrid columns="3">
		       <p:selectBooleanCheckbox 
			       value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true" />
		       <p:spacer width="2" />	
		       <p:outputLabel value="Fee Exemption" />
	         </h:panelGrid>	
		     <p:outputLabel id="centralEfDate" value="#{lbl['lbl.ct.effectiveDate']}" />
		     <p:inputText for="centralEfDate" style="width:170px;" disabled="true"
			    value="#{contractDetailsBackingBean.convertTime(contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate)}" />
		     <p:outputLabel id="centralExpDate" value="#{lbl['lbl.ct.edate']}" />
		     <p:inputText for="centralExpDate" style="width:170px;" disabled="true"
			    value="#{contractDetailsBackingBean.convertTime(contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate)}" />
		     <h:panelGrid columns="3">  
			   <p:selectBooleanCheckbox 
			      value="#{contractDetailsBackingBean.managedBean.ctContract.agreement}" disabled="true" />
		       <p:spacer width="2" />	
		       <p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
		     </h:panelGrid> 
		     <h:outputLabel id="centralPeriod" value="#{lbl['lbl.ct.dperiod']}" />
		     <h:panelGrid columns="3">
		       <p:inputText for="centralDelPeriod" styleClass="ppRightBtn" style="width:65px;" 
		          maxlength="4" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}"/>
               <p:spacer width="2" />
               <p:selectOneMenu id="centralDelPeriod" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.deliveryTermUom.parameterId}" 
                 style="width:100px;" >
			       <f:selectItems value="#{contractDetailsBackingBean.getDropdownValues(ParameterTypeConst.deliveryTerm)}" />
			   </p:selectOneMenu>
			</h:panelGrid>	
			<p:outputLabel id="centralSignDate" value="Signed Date" rendered="#{contractDetailsBackingBean.managedBean.ctContract.agreement}"/>
			<p:inputText for="centralSignDate"  disabled="true" rendered="#{contractDetailsBackingBean.managedBean.ctContract.agreement}"
			   style="width:170px;" value="#{contractDetailsBackingBean.convertTime(contractDetailsBackingBean.managedBean.ctContract.currentAgreement.signedDate)}"/>
			<f:verbatim   rendered="#{!contractDetailsBackingBean.managedBean.ctContract.agreement}"/>
			<f:verbatim   rendered="#{!contractDetailsBackingBean.managedBean.ctContract.agreement}"/> 
			<h:panelGrid columns="3">
			  <p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" disabled="false" style="text-align:top;">
			     <p:ajax event="change" update="centalJustificationPanel" listener="#{contractDetailsBackingBean.chkJustificationAction}" process="@this"/> 
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <p:outputLabel value="AP201 Exemption" style="text-align:top;" />
		   </h:panelGrid>	
			<h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="centralContractName" value="Contract Title"/>
			</div>
			</h:panelGroup>
		    <h:panelGrid>
			<p:inputTextarea id="centralContractName"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.contractName}"
				required="false" rows="3" cols="31" maxlength="1000" disabled="true" style="margin-bottom: 5px;"
				autoResize="false" />	
			</h:panelGrid>	
			<h:outputLabel value="Agreement No" 
				rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"/>
			<p:commandLink rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				style="margin-right:20px;" ajax="false">
				<h:outputText
					value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo}"
					styleClass="linkcommand" />
			</p:commandLink>	    
	 </h:panelGrid>
	 <p:outputPanel id="centalJustificationPanel">
	 <h:panelGrid columns="2" style="width:100%;" columnClasses="columnWidth15" 
	    rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}">
         <h:panelGroup>
		    <div style="height:70px; vertical-align:top;">
			   <p:outputLabel id="centralJustificationLbls" value="* Justification" />
		    </div>
	     </h:panelGroup>
	  <h:panelGrid columns="1">
	    <p:inputTextarea id="centralJustificationLbl" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.justification}"
		  rows="4" cols="113" validator="#{webappBean.checkSpaces}" maxlength="200"  required="true" autoResize="false">
		  </p:inputTextarea>	
	     <p:message for="centralJustificationLbl"/>
	  </h:panelGrid>		
    </h:panelGrid> 
  </p:outputPanel>
  </p:panel>
</ui:composition>
