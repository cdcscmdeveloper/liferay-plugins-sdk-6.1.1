<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <p:panel id="serviceId" header="#{lbl['lbl.ct.service.panel.name']}"
         rendered="#{contractDetailsBackingBean.managedBean.ctItemServiceList.size() > 0 }"  toggleable="true"  toggleSpeed="500">
  	     <h:panelGrid  style="width:100%;">
  	       
  	        <p:dataTable id="serviceTable" var="data"  widgetVar="serviceItemObj" 
  	           value="#{contractDetailsBackingBean.managedBean.ctItemServiceList}" rowKey="#{data}" 
               selectionMode="single" selection="#{contractDetailsBackingBean.managedBean.selectedServiceItem}">
               <ac:paginator for="serviceTable"/>
              <p:ajax event="rowSelect" update=":form:showServicePrice"/>
		      
		      <p:column headerText="#{lbl['lbl.ct.item.table.name']}"  
		             filterBy="#{data.itemName}" style="width:40%;" filterMatchMode="contains">
		         <p:outputLabel value="#{data.itemName}" style="float:left;"/>
		      </p:column>       
		    
		      <p:column headerText="#{lbl['lbl.ct.item.table.uom']}" style="width:15%;">
		        <p:outputLabel value="#{data.uom.uomName}" style="float:left;"/>
		      </p:column>        
		      
		      <p:column headerText="#{lbl['lbl.ct.item.service.qty']}"  style="text-align: right; width:20%;">
		          <h:outputText value="#{data.minimumOrderQty}">
     		           <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, data.uom.uomCode)}" />					
		          </h:outputText>		        
		      </p:column>               
		      
		      <p:column headerText="#{lbl['lbl.ct.item.uompermonth']}"  style="text-align: right;width:15%;">
		          <h:outputText value="#{data.uomPerMonth}">
     		           <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, data.uom.uomCode)}" />					
		          </h:outputText>		     	
		      </p:column>
		      
		       <p:column headerText="Status" style="width:10%;">
		            <p:outputLabel value="#{data.recordStatusFlg == 1 ?  'Active' : 'Inactive' }"/>
		        </p:column>   
    	   </p:dataTable> 
        </h:panelGrid>
       
        <p:outputPanel id="showServicePrice">
		   <p:spacer height="20"/>
		    <h:panelGrid columns="1" style="width:100%" 
		       rendered="#{contractDetailsBackingBean.managedBean.selectedServiceItem != null}">
		    
		      <p:dataTable id="servicePriceTable" var="itemPricesVar"
		          value="#{contractDetailsBackingBean.managedBean.selectedServiceItem.ctItemPrices}">
			      <ac:paginator for="servicePriceTable"/>
			     
			      <c:if test="#{contractDetailsBackingBean.managedBean.selectedServiceItem.priceType.parameterCode eq ParameterConst.priceTypeStandard}">
			            <p:column headerText="#{lbl['lbl.ct.item.table1.price.price']}" style="text-align: right;">
			               <h:outputText value="#{itemPricesVar.unitPrice}">
			                   <f:convertNumber
						         pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			                </h:outputText>			                   
			            </p:column>            
			            <p:column headerText="#{lbl['lbl.ct.item.table1.price.efdate']}">
			                <h:outputText value="#{itemPricesVar.effDate}" style="float:left;">
                              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                            </h:outputText>			            
			            </p:column>       
			            <p:column headerText="#{lbl['lbl.ct.item.table1.price.edate']}">
			                <h:outputText value="#{itemPricesVar.expDate}" style="float:left;">
                              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                            </h:outputText>			            
			             </p:column> 
			     </c:if>
			   
			     <c:if test="#{contractDetailsBackingBean.managedBean.selectedServiceItem.priceType.parameterCode eq ParameterConst.priceTypeZonalStandard}">
			           <p:column headerText="#{lbl['lbl.ct.item.table1.price.zone']}">
			                 <p:outputLabel value="#{itemPricesVar.ctContractZone.zoneName}" style="float:left;" />
			            </p:column>    
			            <p:column headerText="#{lbl['lbl.ct.item.table1.price.price']}" style="text-align: right;">
			               <h:outputText value="#{itemPricesVar.unitPrice}">
			                   <f:convertNumber
						         pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			                </h:outputText>
			            </p:column>
			            <p:column headerText="#{lbl['lbl.ct.item.table1.price.efdate']}">
			                <h:outputText value="#{itemPricesVar.effDate}" style="float:left;">
                             <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                           </h:outputText>
			             </p:column>       
			             <p:column headerText="#{lbl['lbl.ct.item.table1.price.edate']}">
			                <h:outputText value="#{itemPricesVar.expDate}" style="float:left;">
                              <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                            </h:outputText>
			            </p:column>   
			      </c:if>                
		  
		   </p:dataTable>
	    </h:panelGrid>
	 </p:outputPanel>
   </p:panel>
	<p:panel header="Remarks" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.itemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		  	
 </ui:composition>
