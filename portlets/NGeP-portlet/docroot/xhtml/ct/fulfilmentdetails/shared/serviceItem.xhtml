<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <p:panel id="serviceId" header="#{lbl['lbl.ct.service.panel.name']}"   toggleable="true"  toggleSpeed="500">
  	  <h:panelGrid  style="width:100%;">
  	    <p:dataTable id="serviceTable" var="data" value="#{contractDetailsBackingBean.managedBean.ctItemServiceList}" rowKey="#{data}" 
           selectionMode="single" selection="#{contractDetailsBackingBean.managedBean.selectedServiceItem}"  widgetVar="serviceItemObj" >
           <ac:paginator for="serviceTable"/>
              <p:ajax event="rowSelect" update=":form:showServicePrice"/>
		      <p:column headerText="#{lbl['lbl.ct.item.table.name']}"  
		             filterBy="#{data.itemName}" style="width:40%;" filterMatchMode="contains">
		         <p:outputLabel value="#{data.itemName}" style="float:left;"/>
		      </p:column>       
		      <p:column headerText="#{lbl['lbl.ct.item.table.uom']}" style="width:20%;">
		        <p:outputLabel value="#{data.uom.uomName}" style="float:left;"/>
		      </p:column>        
		      <p:column headerText="#{lbl['lbl.ct.item.service.qty']}"  style="text-align: right; width:20%;">
		        <p:outputLabel value="#{data.minimumOrderQty}"/>
		      </p:column>               
		      <p:column headerText="#{lbl['lbl.ct.item.uompermonth']}"  style="text-align: right;width:20%;">
		     	<p:outputLabel value="#{data.uomPerMonth}"/>
		      </p:column>  
    		</p:dataTable> 
        </h:panelGrid>
        <p:outputPanel id="showServicePrice">
		   <p:spacer height="20"/>
		    <h:panelGrid columns="1" style="width:100%" 
		       rendered="#{contractDetailsBackingBean.managedBean.selectedServiceItem != null}">
		      <p:dataTable id="servicePriceTable" var="itemPricesVar"
		         value="#{contractDetailsBackingBean.managedBean.selectedServiceItem.ctItemPrices}">
			    <ac:paginator for="servicePriceTable"/>
			     <p:column headerText="#{lbl['lbl.ct.item.table1.price.zone']}">
			        <p:outputLabel value="#{itemPricesVar.ctContractZone.zoneName}" style="float:left;" />
			     </p:column>                   
			     <p:column headerText="#{lbl['lbl.ct.item.table1.price.price']}" style="text-align: right;">
			        <p:outputLabel value="#{itemPricesVar.unitPrice}"/>
			     </p:column>            
			     <p:column headerText="#{lbl['lbl.ct.item.table1.price.efdate']}">
				   <p:calendar style="width:130px;" value="#{itemPricesVar.effDate}"
				       pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true" />
			     </p:column>       
			     <p:column headerText="#{lbl['lbl.ct.item.table1.price.edate']}">
			         <p:calendar style="width:130px;" value="#{itemPricesVar.expDate}"
			             pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"  />
			    </p:column>       
		    </p:dataTable>
		</h:panelGrid>
	  </p:outputPanel>
  	</p:panel>
	<p:panel header="Remarks" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.itemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		  	
 </ui:composition>
