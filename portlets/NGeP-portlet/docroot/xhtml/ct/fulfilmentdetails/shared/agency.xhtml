<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
   <p:panel id="agencyId" header="#{lbl['lbl.ct.panel.agency']}"  toggleable="true"  toggleSpeed="500">
       
       <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.add.agency']}" escape="false"/><br/>
	   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.delete.agency']}" escape="false"/><br/>
	   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.delivery.address1']}" escape="false"/>
	   <p:graphicImage value="/css/images/design/house.png" styleClass="ui-icon-address" />
	   <h:outputText styleClass="instruction" value=" #{lbl['lbl.ct.instruction.delivery.address2']}" escape="false"/><br/><br/>
  
       <p:dataTable var="agencyData"  value="#{contractDetailsBackingBean.managedBean.contractVer.ctAgencies}" 
           id="tableAgencyDetails"  selection="#{contractDetailsBackingBean.selectedListOfAgency}" rowKey="#{agencyData}">
              
               <ac:paginator for="tableAgencyDetails"/>
               <p:ajax event="rowSelect" update=":form:agencyId" />
              
               <p:column selectionMode="multiple" style="width:2%;" 
                  rendered="#{!contractDetailsBackingBean.managedBean.viewContract}"></p:column>
            
               <p:column headerText="#{lbl['lbl.ct.ministry']}" style="width:26%;white-space:normal;">
				    <h:outputText value="#{agencyData.orgProfile.parentOrgProfile.orgName}"/>
			   </p:column>
			
			   <p:column headerText="#{lbl['lbl.ct.ptj']}" style="width:32%;white-space:normal;">
				   <h:outputText  value="#{agencyData.orgProfile.orgName}"/>
				   <p:spacer width="5"/>
				   <p:commandLink partialSubmit="true" process="@this" update=":form:deliveryAddressDlg"
				       rendered="#{fn:length(agencyData.ctAgencyAddresses)!=0}" action="#{contractDetailsBackingBean.assignSelAgency(agencyData)}">
					   <p:graphicImage value="/css/images/design/house.png"  
					     styleClass="ui-icon-address" title="#{lbl['lbl.ct.tooltip.agency.address']}" style="margin-bottom: -5px;" />
				   </p:commandLink>
			    </p:column>
			
			    <p:column style="width:10%;white-space:normal;">
			  	    <f:facet name="header">
					   <h:outputText value="#{lbl['lbl.ct.ceiling.amount']}"/>
               		   <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ceiling.amt']}"/>
               	    </f:facet>
           		    <p:inputText value="#{agencyData.ceilingAmount}"  required="true"  label="#{lbl['lbl.ct.ceiling.amount']}"
           		        disabled="#{contractDetailsBackingBean.managedBean.viewContract}" style="width:100px;" maxlength="23"  styleClass="ppRightBtn">
			 		    <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			 		    <p:ajax event="change" update=":form:tableAgencyDetails" process="@form" listener="#{contractDetailsBackingBean.validateCeilingAmount(agencyData)}"/> 
				     </p:inputText>
		    	</p:column>
		   
		   	     <p:column headerText="#{lbl['lbl.ct.effective.date']}" style="width:8%;">
			      	<p:calendar id="agencyDateActive" value="#{agencyData.effDate}"  navigator="true" size="8"
		               readonlyInput="true"   mindate="#{contractDetailsBackingBean.currentDate}" maxdate="#{agencyData.expDate}"			             
		               showOn="button"  disabled="#{contractDetailsBackingBean.managedBean.viewContract}"
		               pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
		           	   <p:ajax event="dateSelect" update="agenyStatus" listener="#{contractDetailsBackingBean.checkAgencyStatus(agencyData)}"  /> 
		           </p:calendar>
		          </p:column>
		   	
		   	      <p:column headerText="#{lbl['lbl.ct.expiry.date']}" style="width:8%;">
				  <h:outputText value="#{agencyData.expDate}">
				      <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText>
		   	   </p:column>
		   	
		   	   <p:column style="width:8%;white-space:normal;">
		   	 	   <f:facet name="header">
					  <h:outputText value="#{lbl['lbl.ct.ap178']}"/>
               		  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap178']}"/>
               	   </f:facet>
		   	       <p:selectBooleanCheckbox value="#{agencyData.ap178}" style="width:50px;float:center;" disabled="true"
		   	          rendered="#{contractDetailsBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile.orgName != agencyData.orgProfile.parentOrgProfile.orgName}"/>
		       </p:column>
		        
		        <p:column headerText="#{lbl['lbl.ct.status']}" style="width:6%;white-space:normal;">
		   	        <p:outputLabel id="agenyStatus" value="#{agencyData.chkStatus ? lbl['lbl.ct.active']:lbl['lbl.ct.inactive']}" style="float:none" />
		       </p:column>
			</p:dataTable> 
       	<div class="ppRightBtn" style="padding-top:8px;">
       		<p:commandButton id="addBtn" value="#{lbl['lbl.btn.add']}"   oncomplete="dlgAgency.show();" 
       	        icon="ui-icon-add" partialSubmit="true" process="@this"	action="#{contractDetailsBackingBean.resetAgencyDetails}" 
       	        update=":form:agencyies" rendered="#{!contractDetailsBackingBean.managedBean.viewContract}">
       			<p:tooltip for="addBtn">
				    <h:outputText value="#{lbl['lbl.ct.tooltip.add.agency']}" escape="false" />
				</p:tooltip>
       		</p:commandButton> 
			<p:commandButton id="delBtn" value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" process="@form" onclick="dlgDel.show();"
				rendered="#{!contractDetailsBackingBean.managedBean.viewContract}" >
       			<p:tooltip for="delBtn">
				    <h:outputText value="#{lbl['lbl.ct.tooltip.delete.agency']}" escape="false" />
				</p:tooltip>
			</p:commandButton>
	  	</div>
	  	    
        <p:dialog id="dlgDel" widgetVar="dlgDel" styleClass="screen-title"  
           resizable="false" modal="true" width="330">  
           <h:panelGrid columns="3">
            <p:graphicImage library="ep/images/design" name="exclamation.png"
			   value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			 <p:spacer width="10"/>
             <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update=":form:agencyId,:form:itemId,:form:agencyRemarksAttachmentPnl"
		         process="@form" actionListener="#{contractDetailsBackingBean.deleteAgencyDetails()}" onclick="dlgDel.hide();"
		         onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/>
			  <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="dlgDel.hide();" type="button" />
		   </div>
        </p:dialog>  
	   </p:panel>  
		<p:dialog id="dialogAgency"  header="#{lbl['lbl.ct.add.agency']}" widgetVar="dlgAgency" modal="true" width="700" height="500">
			<p:messages id="agencyMsg" showSummary="false" showDetail="true"  autoUpdate="true" closable="true" severity="error, info" />
		   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.add.agency.list']}" escape="false"/><br/><br/>
		   <p:panel  id="agencyies">
              <h:panelGrid columns="3">
                 <p:selectOneMenu for="ministry"  style="width:150px" disabled="true" >
            	    <f:selectItem itemLabel="#{lbl['lbl.ct.ministry']}" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="ministry" style="width:300px"
                      value="#{contractDetailsBackingBean.managedBean.ministryProfileId}" >
            	   <f:selectItems value="#{contractDetailsBackingBean.getMinistryDropdown()}"/>
                 </p:selectOneMenu>
                 <p:selectOneMenu for="ptjcodename" 
                    value="#{contractDetailsBackingBean.managedBean.ptjCodeName}"  style="width:150px;">
                       <f:selectItem itemLabel="#{lbl['lbl.ct.ptj.code']}" itemValue="Code"/>
            	      <f:selectItem itemLabel="#{lbl['lbl.ct.ptj.name']}" itemValue="Name"/>
                 </p:selectOneMenu>
				 <p:spacer height="1"/>
                 <p:inputText id="ptjCodeVaue"  style="width:300px;" 
                     label="Ptj code or name" value="#{contractDetailsBackingBean.managedBean.ptjCodeNameSearchValues}" ></p:inputText>
                        <p:message id="ptjMsg" for="ptjCodeVaue" display="icon"/>
			  </h:panelGrid>
			  	<div class="ppRightBtn">
       		         <p:commandButton id="agencySearchId" value="#{lbl['lbl.btn.search']}" update=":form:tableAgency" icon="ui-icon-search" 
       		            action="#{contractDetailsBackingBean.searchAgencyDetails}" 
       		                onstart="blkAgencyTable.show();" oncomplete="blkAgencyTable.hide();" /> 
			         <p:commandButton id="resetlBtn" value="#{lbl['lbl.ct.reset']}" process="@this"
			            action="#{contractDetailsBackingBean.resetAgencyDetails}" update=":form:agencyies"   />
		       </div>
			   <p:spacer height="2"/>
              <p:dataTable id="tableAgency" var="pmVar" value="#{contractDetailsBackingBean.agencyDataModel}" 
                 rowIndexVar="rowIndex" selection="#{contractDetailsBackingBean.selectedPmOrgProfile}" rowKey="#{pmVar}" lazy="true">
                  <ac:paginator for="tableAgency"/>
                    <p:column selectionMode="multiple" style="width:18px;"> 
                         <f:facet name="header">
                             <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.popup.chkBox']}"/>
		               </f:facet>
                    </p:column>       
                    <p:column headerText="#{lbl['lbl.ct.ptj.code']}">
                       <p:outputLabel value="#{pmVar.orgCode}" style="float:left;"/>
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.ptj.name']}" >
                      <p:outputLabel value="#{pmVar.orgName}" style="float:left;"/>
					</p:column>
			 </p:dataTable>
			  <p:blockUI widgetVar="blkAgencyTable" trigger="agencySearchId"  block=":form:agencyies">  
			      <p:graphicImage value="/resources/ep/images/ajax-loader.gif"></p:graphicImage>  
		      </p:blockUI> 
             <f:facet name="footer">
			  <h:panelGrid columns="1"  style="float:right;height:100px;vertical-align: middle;">
				<p:commandButton value="#{lbl['lbl.btn.select']}" process="@form" update=":form:tableAgencyDetails,:form:itemId,:form:messages,:form:agencyRemarksAttachmentPnl" 
				    action="#{contractDetailsBackingBean.addAgencyDetails()}" icon="ui-icon-accept" onclick="dlgAgency.hide();"/>
			  </h:panelGrid>
			</f:facet>
           </p:panel>
	</p:dialog>
	<p:dialog id="deliveryAddressDlg" header="#{lbl['lbl.ct.delivery.address']}" widgetVar="deliveryAddressDlg" modal="true" width="600" height="400">
	  <p:dataTable id="deliveryAddressTbl" var="deliveryAddress" value="#{contractDetailsBackingBean.managedBean.selectedAgency.ctAgencyAddresses}"
		rowKey="#{deliveryAddress}">
		<ac:paginator for="deliveryAddressTbl"/>
		<p:column headerText="#{lbl['lbl.ct.delivery.address']}" style="white-space:normal;">
		   <p:outputLabel value="#{contractDetailsBackingBean.getFullAddress(deliveryAddress.addressType.pmAddress)}" style="float:left;" />
		</p:column>
	   </p:dataTable>
	</p:dialog>
	<p:panel id="agencyRemarksAttachmentPnl"  header="#{lbl['lbl.ct.panel.remarks.attachment.contract.sharing']}" toggleable="true">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.attachment']}" escape="false"/><br/><br/>
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.agencyRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000"
													disabled="#{contractDetailsBackingBean.managedBean.viewContract or !contractDetailsBackingBean.contractSharing}" />
												<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.remark']}" rendered="#{remarkIndex==0}" />
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				    <table style="width: 100%">
				    <tr>
			           <td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.attachment']}" /></td>
			           <td class="TableFieldRight">
				         <p:commandButton oncomplete="uploadDlg1.show();return false;" icon="iconAttachment" 
					        update="lampiran1, uploadDlg1" value="#{lbl['lbl.ct.upload.attach.files']}"
					        disabled="#{contractDetailsBackingBean.managedBean.viewContract or !contractDetailsBackingBean.contractSharing}"/>
			           </td>
		             </tr>
		             <tr>
			           <td/>
			           <td>
				            <p:dataGrid id="lampiran1" value="#{contractDetailsBackingBean.managedBean.contractVer.agencyAttachements}"
					           var="attachFile" rowIndexVar="attachFileIndex" columns="1" style="width:100%">
					           <table>
						          <tr>
							       <td rowspan="2"><h:graphicImage library="ep/images/design" name="#{ctBackingBean.determineIcon(attachFile)}" height="30" width="30"/></td>
							       <td width="5"></td>
							       <td>
								       <h:outputText value=" #{attachFile.createdUser.userName}"></h:outputText>,
								       <h:outputText value="#{attachFile.createdDate}">
									     <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
						   </h:outputText>
						</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<h:commandLink value="#{attachFile.fileName}" styleClass="blue_font" action="#{ctBackingBean.downloadFile(attachFile)}" />
			 	 				<p:commandLink onclick="deleteAttachmentDlg1.show();" action="#{contractDetailsBackingBean.setAttachFileIndex(attachFileIndex)}"
									rendered="#{ctBackingBean.compareUserName(attachFile.createdUser.loginId) and !contractDetailsBackingBean.managedBean.viewContract}">
			   						<h:graphicImage library="ep/images/design" name="icon_trash.png" styleClass="tasklist_title1"/>
			 	 				</p:commandLink>
			 	 			</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>

	<p:dialog id="uploadDlg1" widgetVar="uploadDlg1" modal="false" resizable="false" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{contractDetailsBackingBean.agencyFileUpload}"
			mode="advanced" id="upload1"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="#{lbl['lbl.ct.upload.invalid.msg']}"
			update="lampiran1" >
		</p:fileUpload> 
	</p:dialog>
	
	<p:dialog id="deleteAttachmentDlg1" widgetVar="deleteAttachmentDlg1"
      	styleClass="screen-title" resizable="false" modal="true" width="330">  
      	<h:panelGrid columns="3">
 			<p:graphicImage library="ep/images/design" name="exclamation.png"
		     	value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
		   	<p:spacer width="10"/>
            <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.delete.attachment.msg']}</div>
     	</h:panelGrid>
		<div class="ppRightBtn">
	     <p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept" update="lampiran1" process="@form" 
	     	actionListener="#{contractDetailsBackingBean.deleteAttachmentAction(contractDetailsBackingBean.managedBean.attachFileIndex)}" 
	     	onclick="deleteAttachmentDlg1.hide();"/>
		 <p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject" onclick="deleteAttachmentDlg1.hide();" type="button" />
	   </div>
 	</p:dialog>	
				</td>
			</tr>
		</table>
		
	</p:panel>		
</ui:composition>
