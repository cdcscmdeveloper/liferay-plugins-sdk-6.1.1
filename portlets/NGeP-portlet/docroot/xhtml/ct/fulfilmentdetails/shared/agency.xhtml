<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
   <p:panel id="agencyId" header="#{lbl['lbl.ct.agn.panel.name']}"   toggleable="true"  toggleSpeed="500">
     <div style="overflow-x:auto">
    <p:treeTable id="treetableAgency" value="#{contractDetailsBackingBean.rootNodeAgency}" var="data"  
       selection="#{contractDetailsBackingBean.selectedNode}"  selectionMode="single">
          <p:column>  
            <f:facet name="header"> #{lbl['lbl.ct.agn.tree.name']} </f:facet>  
             <h:outputText value="#{data.ministryName}" />  
          </p:column>  
          <p:column>  
           <f:facet name="header"> #{lbl['lbl.ct.agn.tree.ptj.code']} </f:facet>  
           <h:outputText value="#{data.ptjCode}" />  
          </p:column>  
          <p:column >  
            <f:facet name="header"> #{lbl['lbl.ct.agn.tree.ptj.name']}  </f:facet>  
            <h:outputText value="#{data.ptjName}" />  
          </p:column>  
          <p:column>  
            <f:facet name="header"> #{lbl['lbl.ct.agn.tree.ptj.amount']}  </f:facet>  
            <p:inputText value="#{data.selingAmount}" style="width:40" rendered="#{data.selingAmount !=null}"></p:inputText>  
          </p:column>  
          <p:column>  
            <f:facet name="header"> #{lbl['lbl.ct.agn.tree.ptj.efdate']}  </f:facet>  
            <p:calendar value="#{contractDetailsBackingBean.managedBean.createContractDetails.efdate}" 
              id="popupButtonCal" showOn="button" rendered="#{data.efdate != null}"/> 
          </p:column>  
          <p:column>  
            <f:facet name="header"> #{lbl['lbl.ct.agn.tree.ptj.exdate']}  </f:facet>  
              <p:calendar value="#{contractDetailsBackingBean.managedBean.createContractDetails.exdate}" 
              id="popupButtonCal1" showOn="button" rendered="#{data.exdate != null}"/>
          </p:column>  
          <p:column style="width:50"  styleClass="column-align-center">  
            <f:facet name="header"> #{lbl['lbl.ct.agn.tree.ptj.action']} </f:facet>  
            <p:commandButton title="delete"  onsuccess="confirmation.show()"
			  partialSubmit="true" process="@this" icon="ui-icon-delete">
		    </p:commandButton>
          </p:column>  
       </p:treeTable>
       </div>
       <h:panelGrid style="width:770px" columnClasses="column-align-right">
		 <p:commandButton value="#{lbl['lbl.ct.agn.btn.add']}" process="@this" partialSubmit="true" 
		     icon="ui-icon-add"   onclick="dlgAgency.show();">
		 </p:commandButton>
	   </h:panelGrid>	
	   </p:panel>  
        <p:confirmDialog message="Do you want to delete the record?" 
		  closable="true" appendToBody="true" header="Delete Confirmation" severity="alert" widgetVar="confirmation">
             <h:panelGrid columns="2" columnClasses="column-align-right,column-align-left">
				<p:commandButton value="Yes" icon="ui-icon-accept"
					update="treetableAgency" partialSubmit="true" process="@this"	onclick="confirmation.hide();"/>
				<p:commandButton value="No" icon="ui-icon-reject" onclick="confirmation.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>
		<p:dialog id="dialogAgency"  header="#{lbl['lbl.ct.agn.btn.add']}" widgetVar="dlgAgency" modal="true" width="600" height="400">
		   <p:panel  id="agencyies">
              <h:panelGrid columns="2">
						
							<h:outputLabel for="ministry" value="Ministry" />
            				<p:selectOneMenu id="ministry"  style="width:230px">
            				   <f:selectItem itemLabel="--Please Select--" itemValue="" /> 
                        	</p:selectOneMenu>
							<h:outputLabel for="department" value="Department" />
            				<p:selectOneMenu id="department"  style="width:230px" >
            					<f:selectItem itemLabel="--Please Select--" itemValue="" /> 
                				</p:selectOneMenu>
						</h:panelGrid>
             <p:dataTable id="tableAgency" var="data" value="#{contractDetailsBackingBean.ctAgencyList}" rowIndexVar="index" widgetVar="dataTableObj"
                lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="true"  emptyMessage="No Records!" rows="10" 
                selection="#{contractDetailsBackingBean.selectedAgencyList}" rowKey="#{data.agencyId}">
                <p:column selectionMode="multiple" style="width:18px" />
			        <p:column headerText="#{lbl['lbl.ct.agn.model.table.no']}">
						<h:outputText value="#{index+1}" />
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.agn.model.table.code']}">
                    <h:outputText value="#{data.orgProfile.orgCode}" />
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.agn.model.table.name']}" >
                    <h:outputText value="#{data.orgProfile.orgName}" />
					</p:column>
			 </p:dataTable>
             <f:facet name="footer">
			  <h:panelGrid columns="2"  style="float:right;height:100px;vertical-align: middle;">
				<p:commandButton value="#{lbl['lbl.ct.agn.btn.select']}"   process="dialogAgency" update="treetableAgency,dialogAgency" icon="ui-icon-select" onclick="dlgAgency.hide();"/>
                <p:commandButton value="#{lbl['lbl.ct.agn.btn.cancel']}" icon="ui-icon-cancel" type="button" ajax="false" onclick="dlgAgency.hide();" />
			  </h:panelGrid>
			</f:facet>
           </p:panel>
	 </p:dialog>
</ui:composition>
