<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
   <p:panel id="agencyId" header="#{lbl['lbl.ct.panel.agency']}"  toggleable="true"  toggleSpeed="500">
       
       <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.add.agency']}" escape="false"/><br/>
	   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.delete.agency']}" escape="false"/><br/><br/>
       <p:dataTable id="tableAgencyDetails" var="agencyData"  value="#{contractDetailsBackingBean.managedBean.contractVer.ctAgencies}" 
  			selectionMode="single" rowKey="#{agencyData}" selection="#{contractDetailsBackingBean.managedBean.selectedAgency}" 
  			rowIndexVar="indexVar" >
            <ac:paginator for="tableAgencyDetails"/>
            <p:ajax event="rowSelect" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				update="@([id$=agencyDeliveryAddress],[id$=delBtn])"  />	
				
				<p:columnGroup type="header"> 
								<p:row> 
									<p:column rowspan="2"
									     style="width:10px;"  rendered="#{!contractDetailsBackingBean.managedBean.viewContract}" />
									<p:column rowspan="2" headerText="#{lbl['lbl.ct.ministry']}" /> 
									<p:column rowspan="2" headerText="#{lbl['lbl.ct.ptj']}"/> 						
									<p:column rowspan="2" style="width:10%;white-space:normal;">
									      <f:facet name="header">
					                          <h:outputText value="#{lbl['lbl.ct.ceiling.amount']}"/>
               		                          <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ceiling.amt']}"/>
               	                           </f:facet>
									</p:column>
									 <p:column rowspan="2" headerText="#{lbl['lbl.ct.effective.date']}" style="width:8%;" />
									 <p:column rowspan="2" headerText="#{lbl['lbl.ct.expiry.date']}" style="width:8%;"/>
									<p:column colspan="3" headerText="#{lbl['lbl.ct.ap178']}" style="text-align:center; white-space:normal;"> 
									 <f:facet name="header">
					                       <h:outputText value="#{lbl['lbl.ct.ap178']}"/>
               		                      <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap178']}"/>
               	                     </f:facet>
               	                    </p:column>						
									<p:column rowspan="2" headerText="#{lbl['lbl.ct.status']}" style="width:6%;white-space:normal;"/>
								</p:row>							
								<p:row> 
									<p:column/>	
									<p:column>
									  <f:facet name="header">
									     <h:outputText value="* " styleClass="mandatory" />
									     <h:outputText value="#{lbl['lbl.txt.attachment']}"/>
									  </f:facet>
									</p:column>  
									<p:column>
									  <f:facet name="header">
									       <h:outputText value="* " styleClass="mandatory" />
									       <h:outputText value="#{lbl['lbl.ct.file.ref.no']}"/>
									   </f:facet>
									 </p:column>
								</p:row>
							</p:columnGroup>
						
							<p:column style="width:10px;" rendered="#{!contractDetailsBackingBean.managedBean.viewContract}">
	     		                   <p:selectBooleanCheckbox value="#{agencyData.selectedCheckBox}">
			  		               <p:ajax event="change" update=":form:delBtn" listener="#{contractDetailsBackingBean.selectAgencyListner}"></p:ajax>
		       	                   </p:selectBooleanCheckbox>
	      	                 </p:column>
	      	                 
	      	                 <p:column style="width:25%;white-space:normal;" >
				                    <h:outputText value="#{agencyData.orgProfile.parentOrgProfile.orgName}"/>
			                 </p:column>
			                 
			                  <p:column style="width:25%;white-space:normal;" >
				                     <h:outputText  value="#{agencyData.orgProfile.orgName}"/>
			                  </p:column>
			
			    <p:column>
           		    <p:inputText value="#{agencyData.ceilingAmount}"  required="true"  label="#{lbl['lbl.ct.ceiling.amount']}"
           		        disabled="#{contractDetailsBackingBean.managedBean.viewContract}" style="width:80px;" maxlength="23"  styleClass="ppRightBtn">
			 		    <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			 		    <p:ajax event="change" update=":form:tableAgencyDetails" process="@form" listener="#{contractDetailsBackingBean.validateCeilingAmount(agencyData)}"/> 
				     </p:inputText>
		    	</p:column>
		   
		   	     <p:column>
			      	<p:calendar id="agencyDateActive" value="#{agencyData.effDate}"  navigator="true" size="8"
		               readonlyInput="true" 
		               mindate="#{(contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate gt DateUtils.getCurrentDateWithoutTime()) ? contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate : DateUtils.getCurrentDateWithoutTime()}" 
		               maxdate="#{agencyData.expDate}"			             
		               showOn="button"  disabled="#{contractDetailsBackingBean.managedBean.viewContract}"
		               pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
		           	   <p:ajax event="dateSelect" update="agenyStatus" listener="#{contractDetailsBackingBean.checkAgencyStatus(agencyData)}"  /> 
		           </p:calendar>
		          </p:column>
		   	
		   	      <p:column>
				  <h:outputText value="#{agencyData.expDate}">
				      <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText>
		   	   </p:column>
		   	
		   	   <p:column>
		   	       <p:selectBooleanCheckbox value="#{agencyData.ap178}" style="width:10px;float:center;" disabled="true"
		   	          rendered="#{contractDetailsBackingBean.managedBean.ctContract.ownerOrgProfile.parentOrgProfile.orgName != agencyData.orgProfile.parentOrgProfile.orgName}">
		   	      </p:selectBooleanCheckbox>
		       </p:column>
		       <p:column style="white-space:normal;">
		         <p:commandButton id="uploadSharingDoc" oncomplete="uploadDlg1.show();return false;" icon="iconAttachment" 
					        rendered="#{agencyData.ap178 and agencyData.fileName == null}" action="#{contractDetailsBackingBean.setIndexProperty(indexVar)}"
					       disabled="#{contractDetailsBackingBean.managedBean.viewContract}"/>

		      <h:commandLink
						title="#{agencyData.fileName}"
						value="#{contractDetailsBackingBean.getShortFileName(agencyData.fileName)}"						
						style="float:left;margin-top:10px;" styleClass="blue_font"
						action="#{contractDetailsBackingBean.downloadFile(agencyData.filePath, agencyData.fileName)}" />
						
			   	<p:commandLink 
			   	   onclick="deleteAttachmentDlg1.show();" action="#{contractDetailsBackingBean.setIndexProperty(indexVar)}"
						  rendered="#{!contractDetailsBackingBean.managedBean.viewContract and agencyData.ap178 and agencyData.fileName != null}">
			   				<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			 	</p:commandLink>
			 	 				
		       </p:column>
		       <p:column style="white-space:normal;">
		           <p:inputText id="uploadRefNoDoc"  value="#{agencyData.refNo}" style="width:80px;" 
		              rendered="#{agencyData.ap178}"> </p:inputText>
		       </p:column>
		        
		        <p:column>
		   	         <h:outputText id="agenyStatus" value="#{agencyData.chkStatus ? lbl['lbl.ct.active']:lbl['lbl.ct.inactive']}" style="float:none" />
		       </p:column>
                  
           
			</p:dataTable> 
       	<div class="ppRightBtn">
       		<p:commandButton id="addBtn" value="#{lbl['lbl.btn.add']}"   oncomplete="dlgAgency.show();" 
       	         partialSubmit="true" process="@this"	action="#{contractDetailsBackingBean.resetAgencyDetails}" 
       	        update=":form:agencyies" rendered="#{!contractDetailsBackingBean.managedBean.viewContract}">
       			<p:tooltip for="addBtn">
				    <h:outputText value="#{lbl['lbl.ct.tooltip.add.agency']}" escape="false" />
				</p:tooltip>
       		</p:commandButton>
			 <p:commandButton id="delBtn" value="#{lbl['lbl.btn.delete']}" process="@this"
			 	onsuccess="dlgDel.show()" disabled="#{contractDetailsBackingBean.managedBean.buttonHideActive}" 
			 	rendered="#{!contractDetailsBackingBean.managedBean.viewContract}">
       			<p:tooltip for="delBtn">
				    <h:outputText value="#{lbl['lbl.ct.tooltip.delete.agency']}" escape="false" />
				</p:tooltip>
			</p:commandButton>
	  	</div>
	  	
	  	<p:outputPanel id="agencyDeliveryAddress">
	        <h:panelGroup  style="width:100%" rendered="#{contractDetailsBackingBean.managedBean.selectedAgency != null}">	     
	           	<div style="clear:both" />
	           	<p:spacer height="20"/>
	           	<p:dataTable id="deliveryAddressTbl" var="deliveryAddress" 
	           		value="#{contractDetailsBackingBean.managedBean.selectedAgency.ctAgencyAddresses}"
					rowKey="#{deliveryAddress}" selection="#{contractDetailsBackingBean.managedBean.selectedListOfAddress}">
					<ac:paginator for="deliveryAddressTbl"/>
					<p:column selectionMode="multiple" style="width:3%"  
						rendered="#{!contractDetailsBackingBean.managedBean.viewContract}"/>
					<p:column headerText="#{lbl['lbl.ct.delivery.address']}" style="width:100%; white-space:normal;">
					   <h:outputText value="#{contractDetailsBackingBean.getFullAddress(deliveryAddress.addressType.pmAddress)}" />
					</p:column>
				</p:dataTable>
				<div class="ppRightBtn">
					<ac:lov id="addressTypeId" lovId="PM_ADDRESS_TYPE"
						postUpdateListener="contractDetailsBackingBean.addDeliveryAddress(contractDetailsBackingBean.managedBean.addressTypeList)"
						headerText="#{lbl['lbl.ct.delivery.address']}" 
						buttonLabel="#{lbl['lbl.btn.add']}"
						selectionMode="multiple"
						saveObject="contractDetailsBackingBean.managedBean.addressTypeList"
						conditionField="#{contractDetailsBackingBean.getDeliveryAddressCondition()}"
						update=":form:deliveryAddressTbl"
						rendered="#{!contractDetailsBackingBean.managedBean.viewContract}"/>
					<ac:lovPopup />
					 <p:commandButton id="delAddressBtn" value="#{lbl['lbl.btn.delete']}" 
				     	 process="@this" onclick="delAddressDlg.show()" rendered="#{!contractDetailsBackingBean.managedBean.viewContract}"/>
				</div>
		      	<p:dialog id="delAddressDlg" widgetVar="delAddressDlg"
			   		styleClass="screen-title" modal="true" width="330">  
	           		<h:panelGrid columns="3">
	             	<p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
				   	<p:spacer width="10"/>
	              	<div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
	           		</h:panelGrid>
	           		<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.yes']}"  update="@([id$=deliveryAddressTbl])" process="@all"
							actionListener="#{contractDetailsBackingBean.deleteDeliveryAddress()}" onclick="delAddressDlg.hide();"/>
						<p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delAddressDlg.hide();" type="button" />
					</div>
	    		</p:dialog>  
				<p:spacer height="20"/>		
			</h:panelGroup>
	    </p:outputPanel> 
	  	    
        <p:dialog id="dlgDel" widgetVar="dlgDel" styleClass="screen-title"  
           modal="true" width="330">  
           <h:panelGrid columns="3">
            <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			 <p:spacer width="10"/>
             <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:agencyId,:form:itemId,:form:agencyRemarksAttachmentPnl"
		         process="@form" actionListener="#{contractDetailsBackingBean.deleteAgencyDetails()}" onclick="dlgDel.hide();"
		         onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/>
			  <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgDel.hide();" type="button" />
		   </div>
        </p:dialog>  
	   </p:panel>  
		<p:dialog id="dialogAgency"  header="#{lbl['lbl.ct.add.agency']}" widgetVar="dlgAgency" 
			styleClass="pop_up_top" modal="true" width="700" height="500">
			<p:messages id="agencyMsg" showSummary="false" showDetail="true"  autoUpdate="true" closable="true" severity="error, info" />
		   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.add.agency.list']}" escape="false"/><br/><br/>
		   <p:panel  id="agencyies">
              <h:panelGrid columns="3">
                 <p:selectOneMenu for="ministry"  style="width:150px" disabled="true" >
            	    <f:selectItem itemLabel="#{lbl['lbl.ct.ministry']}" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="ministry" style="width:300px"
                      value="#{contractDetailsBackingBean.managedBean.ministryProfileId}" >
            	   <f:selectItems value="#{contractDetailsBackingBean.getMinistryDropdown()}"/>
                 </p:selectOneMenu>
                 <p:selectOneMenu for="ptjcodename" 
                    value="#{contractDetailsBackingBean.managedBean.ptjCodeName}"  style="width:150px;">
                       <f:selectItem itemLabel="#{lbl['lbl.ct.ptj.code']}" itemValue="#{CtConst.ptjCode}"/>
            	      <f:selectItem itemLabel="#{lbl['lbl.ct.ptj.name']}" itemValue="#{CtConst.ptjName}"/>
                 </p:selectOneMenu>
				 <p:spacer height="1"/>
                 <p:inputText id="ptjCodeVaue"  style="width:300px;" 
                     label="Ptj code or name" value="#{contractDetailsBackingBean.managedBean.ptjCodeNameSearchValues}" ></p:inputText>
                        <p:message id="ptjMsg" for="ptjCodeVaue" display="icon"/>
			  </h:panelGrid>
			  	<div class="ppRightBtn">
       		         <p:commandButton id="agencySearchId" value="#{lbl['lbl.btn.search']}" update=":form:tableAgency"  
       		            action="#{contractDetailsBackingBean.searchAgencyDetails}" 
       		                onstart="blkAgencyTable.show();" oncomplete="blkAgencyTable.hide();" /> 
			         <p:commandButton id="resetlBtn" value="#{lbl['lbl.ct.reset']}" process="@this"
			            action="#{contractDetailsBackingBean.resetAgencyDetails}" update=":form:agencyies"   />
		       </div>
			   <p:spacer height="2"/>
              <p:dataTable id="tableAgency" var="pmVar" value="#{contractDetailsBackingBean.agencyDataModel}" 
                 rowIndexVar="rowIndex" selection="#{contractDetailsBackingBean.selectedPmOrgProfile}" rowKey="#{pmVar}" lazy="true">
                  <ac:paginator for="tableAgency"/>
                    <p:column selectionMode="multiple" style="width:18px;"> 
                         <f:facet name="header">
                             <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.popup.chkBox']}"/>
		               </f:facet>
                    </p:column>       
                    <p:column headerText="#{lbl['lbl.ct.ptj.code']}">
                       	#{pmVar.orgCode}
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.ptj.name']}" >
                      	#{pmVar.orgName}
					</p:column>
			 </p:dataTable>
			  <p:blockUI widgetVar="blkAgencyTable" trigger="agencySearchId"  block=":form:agencyies">  
			      <p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>  
		      </p:blockUI> 
             <f:facet name="footer">
			  <h:panelGrid columns="1"  style="float:right;height:100px;vertical-align: middle;">
				<p:commandButton value="#{lbl['lbl.btn.select']}" process="@form" update=":form:tableAgencyDetails,:form:itemId,:form:messages,:form:agencyRemarksAttachmentPnl" 
				    action="#{contractDetailsBackingBean.addAgencyDetails()}" onclick="dlgAgency.hide();"/>
			  </h:panelGrid>
			</f:facet>
           </p:panel>
	</p:dialog>
	<p:panel id="agencyRemarksAttachmentPnl" header="#{lbl['lbl.txt.remarks']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.agencyRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000"
													disabled="#{contractDetailsBackingBean.managedBean.viewContract or !contractDetailsBackingBean.contractSharing}" />
												<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.remark']}" rendered="#{remarkIndex==0}" />
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top"></td>
		</tr>
	</table>

	<p:dialog id="uploadDlg1" widgetVar="uploadDlg1" modal="true" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
		    sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			fileUploadListener="#{contractDetailsBackingBean.agencyFileUpload}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			mode="advanced" id="upload1"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}" 
			update=":form:tableAgencyDetails" >
		</p:fileUpload> 
	</p:dialog>
	
	<p:dialog id="deleteAttachmentDlg1" widgetVar="deleteAttachmentDlg1"
      	styleClass="screen-title" modal="true" width="330">  
      	<h:panelGrid columns="3">
 			<p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
		   	<p:spacer width="10"/>
            <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.delete.attachment.msg']}</div>
     	</h:panelGrid>
		<div class="ppRightBtn">
	     <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@form"  update=":form:tableAgencyDetails"
	     	actionListener="#{contractDetailsBackingBean.deleteAgencyAttachement()}" 
	     	onclick="deleteAttachmentDlg1.hide();"/>
		 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteAttachmentDlg1.hide();" type="button" />
	   </div>
 	</p:dialog>	
		
	</p:panel>		
</ui:composition>
