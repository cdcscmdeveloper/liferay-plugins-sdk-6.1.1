<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
   <p:panel id="agencyId" header="#{lbl['lbl.ct.agn.panel.name']}"   toggleable="true"  toggleSpeed="500">
     <div style="overflow-x:auto">
       <p:dataTable id="tableAgencyDetails" var="data" value="#{contractDetailsBackingBean.managedBean.contractVer.ctAgencies}" 
            selection="#{contractDetailsBackingBean.selectedListOfAgency}" rowKey="#{data}">
             <ac:paginator for="tableAgencyDetails"/>
             <p:ajax event="rowSelect" update=":form:tabview:agencyId" />
             <p:column selectionMode="multiple" style="width:18px;" />
             <p:column headerText="Ministry">
				<h:outputText value="#{data.orgProfile.parentOrgProfile.parentOrgProfile.orgCode} - #{data.orgProfile.parentOrgProfile.parentOrgProfile.orgName}"/>
			 </p:column>             
             <p:column headerText="Jabatan">
				<h:outputText value="#{data.orgProfile.parentOrgProfile.orgCode} - #{data.orgProfile.parentOrgProfile.orgName}"/>
			 </p:column>
			  <p:column headerText="PTJ">
				<h:outputText  value="#{data.orgProfile.orgCode} - #{data.orgProfile.orgName}"/>
			 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.agn.tree.ptj.amount']}" style="width:130px;">
				<p:inputText value="#{data.ceilingAmount}" styleClass="ppRightBtn" style="width:120px;">
				 	<f:convertNumber pattern="#,###.00" /> 
				</p:inputText>
		   	 </p:column>
			</p:dataTable> 
       	</div>
       	<div class="ppRightBtn">
       		<p:commandButton value="#{lbl['lbl.ct.agn.btn.add']}" process="@form" icon="ui-icon-add" onclick="dlgAgency.show();" /> 
			<p:commandButton value="Delete" icon="ui-icon-delete" process="@form" onsuccess="confirmation.show()"/>
			<p:commandButton value="Delivery Address" disabled="#{fn:length(contractDetailsBackingBean.selectedListOfAgency)!=1}" onclick="deliveryAddressDlg.show();" />
	  	</div>
	   <p:confirmDialog message="Do you want to delete the record?" 
		  closable="true" appendToBody="true" header="Delete Confirmation" severity="alert" widgetVar="confirmation">
             <h:panelGrid columns="2">
				<p:commandButton value="Yes" icon="ui-icon-accept" update="tableAgencyDetails" process="@form" 
				 actionListener="#{contractDetailsBackingBean.deleteAgencyDetails()}" onclick="confirmation.hide();"/>
				<p:commandButton value="No" icon="ui-icon-reject" onclick="confirmation.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>
	   </p:panel>  
		<p:dialog id="dialogAgency"  header="Add Agencies" widgetVar="dlgAgency" modal="true" width="600" height="400">
		   <p:panel  id="agencyies">
              <h:panelGrid columns="2">
				 <h:outputLabel for="ministry" value="Ministry" />
                 <p:selectOneMenu id="ministry" value="#{contractDetailsBackingBean.managedBean.ministryProfileId}" style="width:230px">
            	    <f:selectItems value="#{contractDetailsBackingBean.getMinistryDropdown()}"/>
            		<p:ajax event="change" process="@this" update="tableAgency,department" 
            		   listener="#{contractDetailsBackingBean.reset}"/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <f:verbatim/>
				 <h:outputLabel for="department" value="Department" />
            	 <p:selectOneMenu id="department" value="#{contractDetailsBackingBean.managedBean.departmentProfileId}" 
            	    style="width:230px" >
            		<f:selectItems value="#{contractDetailsBackingBean.getDepartmentDropdown()}"/>
            		<p:ajax event="change" update="tableAgency" process="@this" listener="#{contractDetailsBackingBean.resetDepartment}"/> 
                 </p:selectOneMenu>
			  </h:panelGrid>
			   <p:spacer height="2"/>
              <p:dataTable id="tableAgency" var="data" value="#{contractDetailsBackingBean.managedBean.pmOrgProfileList}" 
                lazy="false" dynamic="true" paginator="true"  selection="#{contractDetailsBackingBean.selectedPmOrgProfile}" 
                rowKey="#{data}"  paginatorAlwaysVisible="false" paginatorPosition="bottom"  emptyMessage="No Records!">
                  <ac:paginator for="tableAgency"/>
                    <p:column selectionMode="multiple" style="width:18px;"/>        
                    <p:column headerText="#{lbl['lbl.ct.agn.model.table.code']}">
                       <p:outputLabel value="#{data.orgCode}" style="float:left;"/>
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.agn.model.table.name']}" >
                      <p:outputLabel value="#{data.orgName}" style="float:left;"/>
					</p:column>
			 </p:dataTable>
             <f:facet name="footer">
			  <h:panelGrid columns="2"  style="float:right;height:100px;vertical-align: middle;">
				<p:commandButton value="Select"   process="@form" update="tableAgencyDetails,dialogAgency" 
				action="#{contractDetailsBackingBean.addAgencyDetails()}" icon="ui-icon-accept" onclick="dlgAgency.hide();"/>
                <p:commandButton value="Cancel" icon="ui-icon-cancel" type="button" ajax="false" onclick="dlgAgency.hide();" />
			  </h:panelGrid>
			</f:facet>
           </p:panel>
	</p:dialog>
	<p:dialog id="deliveryAddressDlg" header="Delivery Address" widgetVar="deliveryAddressDlg" modal="true" width="600" height="400">
		<p:dataTable id="deliveryAddressTbl" var="data" value="#{contractDetailsBackingBean.selectedListOfAgency[0].ctAgencyAddresses}"
			lazy="true" rowKey="#{data}" >
			<ac:paginator for="deliveryAddressTbl" />
			<p:column headerText="Delivery Address">
				<p:outputLabel value="#{data.addressType.pmAddress.address1}" style="float:left;" />
			</p:column>
		</p:dataTable>
	</p:dialog>
	
	<p:panel header="Remarks" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.agencyRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		
	
</ui:composition>
