<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	
   <p:panel id="agencyId" header="#{lbl['lbl.ct.agn.panel.name']}"    toggleable="true"  toggleSpeed="500">
     <div style="overflow-x:auto">
       <p:dataTable id="tableAgencyDetails" var="data" value="#{contractDetailsBackingBean.managedBean.contractVer.ctAgencies}" 
            selection="#{contractDetailsBackingBean.selectedListOfAgency}" rowKey="#{data}">
             <ac:paginator for="tableAgencyDetails"/>
             <p:ajax event="rowSelect" update=":form:tabview:agencyId" />
             <p:column selectionMode="multiple" style="width:2%;" />
             <p:column headerText="Ministry">
				<h:outputText value="#{data.orgProfile.parentOrgProfile.parentOrgProfile.orgName}"/>
			 </p:column>             
             <p:column headerText="Jabatan">
				<h:outputText value="#{data.orgProfile.parentOrgProfile.orgName}"/>
			 </p:column>
			  <p:column headerText="PTJ">
				<h:outputText  value="#{data.orgProfile.orgName}"/>
			 </p:column>
			 <p:column headerText="#{lbl['lbl.ct.agn.tree.ptj.amount']}" style="width:130px;">
				<p:inputText value="#{data.ceilingAmount}" styleClass="ppRightBtn" style="width:110px;">
				 	<f:convertNumber pattern="#,###.00" /> 
				</p:inputText>
		   	 </p:column>
		   	 <p:column headerText="Effective Date" style="width:80px;">
				<h:outputText value="#{data.effDate}">
				  <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText>
		   	 </p:column>
		   	 <p:column headerText="Expiry Date" style="width:80px;">
				<h:outputText value="#{data.expDate}">
				  <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText>
		   	 </p:column>
		   	 <p:column headerText="AP178" style="width:50px;">
		   	    <p:selectBooleanCheckbox style="width:50px;float:center;"/>
		   	 </p:column>
			</p:dataTable> 
       	</div>
       	<div class="ppRightBtn">
       		<p:commandButton value="#{lbl['lbl.ct.agn.btn.add']}" process="@form" icon="ui-icon-add" onclick="dlgAgency.show();" rendered="#{!contractDetailsBackingBean.managedBean.directPurchase}"/> 
			<p:commandButton id="delBtn" value="Delete" icon="ui-icon-delete" process="@form" onclick="dlgDel.show();"  rendered="#{!contractDetailsBackingBean.managedBean.directPurchase}"/>
			<p:commandButton value="Delivery Address" disabled="#{fn:length(contractDetailsBackingBean.selectedListOfAgency)!=1}" onclick="deliveryAddressDlg.show();" rendered="#{!contractDetailsBackingBean.managedBean.directPurchase}" />
	  	</div>
	  	    
        <p:dialog id="dlgDel" widgetVar="dlgDel" header="Delete Confirmation" styleClass="screen-title"  
           resizable="false" modal="true" width="325" height="90">  
           <h:panelGrid columns="3">
            <p:graphicImage library="ep/images/design" name="exclamation.png"
			   value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
             <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" 
                 styleClass="ui-inputtextarea"></p:inputTextarea>
           </h:panelGrid>
           <div class="ppRightBtn">
		     <p:commandButton value="Yes" icon="ui-icon-accept" update="tableAgencyDetails" process="@form" 
				actionListener="#{contractDetailsBackingBean.deleteAgencyDetails()}" onclick="dlgDel.hide();"/>
			  <p:commandButton value="No" icon="ui-icon-reject" onclick="dlgDel.hide();" type="button" />
		   </div>
        </p:dialog>  
	   </p:panel>  
		<p:dialog id="dialogAgency"  header="Add Agencies" widgetVar="dlgAgency" modal="true" width="650" height="450">
		   <p:panel  id="agencyies">
              <h:panelGrid columns="7">
                 <p:selectOneMenu for="ministry"  style="width:100px" disabled="true" >
            	    <f:selectItem itemLabel="Ministry" itemValue=""/>
                 </p:selectOneMenu>
				 <p:spacer height="1"/>
                 <p:selectOneMenu  style="width:70px" disabled="true">
            	    <f:selectItem itemLabel="Equals" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="ministry" value="#{contractDetailsBackingBean.managedBean.ministryProfileId}" style="width:230px">
            	   <f:selectItems value="#{contractDetailsBackingBean.getMinistryDropdown()}"/>
            	   <p:ajax event="change" process="@this" update="tableAgency,department" listener="#{contractDetailsBackingBean.reset}"/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                  <p:selectOneMenu  style="width:70px" disabled="true">
            	    <f:selectItem itemLabel="And" itemValue=""/>
                 </p:selectOneMenu>
                
                 <p:selectOneMenu for="department"  style="width:100px;" disabled="true" >
            	    <f:selectItem itemLabel="Department" itemValue=""/>
                 </p:selectOneMenu>
				 <p:spacer height="1"/>
                 <p:selectOneMenu  style="width:70px" disabled="true">
            	    <f:selectItem itemLabel="Equals" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
            	 <p:selectOneMenu id="department" value="#{contractDetailsBackingBean.managedBean.departmentProfileId}" 
            	    style="width:230px" >
            		<f:selectItems value="#{contractDetailsBackingBean.getDepartmentDropdown()}"/>
            		<p:ajax event="change" update="tableAgency" process="@this" listener="#{contractDetailsBackingBean.resetDepartment}"/> 
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu  style="width:70px" disabled="true">
            	    <f:selectItem itemLabel="And" itemValue=""/>
                 </p:selectOneMenu>
                 
                 <p:selectOneMenu for="ptjcodename"  style="width:100px;">
                    <f:selectItem itemLabel="-Select One-" itemValue=""/>
            	    <f:selectItem itemLabel="PTJ Code" itemValue="Code"/>
            	    <f:selectItem itemLabel="PTJ Name" itemValue="Name"/>
                 </p:selectOneMenu>
				 <p:spacer height="1"/>
                 <p:selectOneMenu  style="width:70px">
            	    <f:selectItem itemLabel="Equals" itemValue="E"/>
            	     <f:selectItem itemLabel="Like" itemValue="L"/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:inputText style="width:220px;"/>
			  </h:panelGrid>
			  	<div class="ppRightBtn">
       		         <p:commandButton value="Search" action="#{contractDetailsBackingBean.searchAgencyDetails}" icon="ui-icon-search"   update="tableAgency"/> 
			         <p:commandButton id="resetlBtn" value="Reset"/>
		       </div>
			   <p:spacer height="2"/>
              <p:dataTable id="tableAgency" var="pmVar" value="#{contractDetailsBackingBean.managedBean.pmOrgProfileList}" 
                selection="#{contractDetailsBackingBean.selectedPmOrgProfile}" rowKey="#{pmVar}">
                  <ac:paginator for="tableAgency"/>
                    <p:column selectionMode="multiple" style="width:18px;"/>        
                    <p:column headerText="#{lbl['lbl.ct.agn.model.table.code']}">
                       <p:outputLabel value="#{pmVar.orgCode}" style="float:left;"/>
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.agn.model.table.name']}" >
                      <p:outputLabel value="#{pmVar.orgName}" style="float:left;"/>
					</p:column>
			 </p:dataTable>
             <f:facet name="footer">
			  <h:panelGrid columns="2"  style="float:right;height:100px;vertical-align: middle;">
				<p:commandButton value="Select"   process="@form" update="tableAgencyDetails,dialogAgency" 
				action="#{contractDetailsBackingBean.addAgencyDetails()}" icon="ui-icon-accept" onclick="dlgAgency.hide();"/>
                <p:commandButton value="Cancel" icon="ui-icon-cancel" type="button" ajax="false" onclick="dlgAgency.hide();" />
			  </h:panelGrid>
			</f:facet>
           </p:panel>
	</p:dialog>
	<p:dialog id="deliveryAddressDlg" header="Delivery Address" widgetVar="deliveryAddressDlg" modal="true" width="600" height="400">
	  <p:dataTable id="deliveryAddressTbl" var="data" value="#{contractDetailsBackingBean.selectedListOfAgency[0].ctAgencyAddresses}"
		lazy="true" rowKey="#{data}">
		<ac:paginator for="deliveryAddressTbl"/>
		<p:column headerText="Delivery Address">
		   <p:outputLabel value="#{data.addressType.pmAddress.address1}" style="float:left;" />
		</p:column>
	   </p:dataTable>
	</p:dialog>
	<p:panel header="Remarks" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{contractDetailsBackingBean.managedBean.contractVer.agencyRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{contractDetailsBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" /> 
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				    <table style="width: 100%">
		             <tr>
			           <td class="TableFieldLeft" width="24%"><h:outputLabel value="Attachment" /></td>
			           <td class="TableFieldRight">
				         <p:commandButton oncomplete="uploadDlg.show();return false;" icon="iconAttachment" 
					        update="lampiran1" value="Attach file(s)" />
			           </td>
		             </tr>
		             <tr>
			           <td/>
			           <td>
				            <p:dataGrid id="lampiran1" value="#{contractDetailsBackingBean.managedBean.contractVer.agencyAttachements}"
					           var="attachFile" rowIndexVar="attachFileIndex" columns="1" style="width:100%">
					           <table>
						          <tr>
							       <td rowspan="2"><h:graphicImage library="ep/images/design" name="#{ctBackingBean.determineIcon(attachFile)}" height="30" width="30"/></td>
							       <td width="5"></td>
							       <td>
								       <h:outputText value=" #{attachFile.createdUser.userName}"></h:outputText>,
								       <h:outputText value="#{attachFile.createdDate}">
									     <f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
						   </h:outputText>
						</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<h:commandLink value="#{attachFile.fileName}" styleClass="blue_font" action="#{ctBackingBean.downloadFile(attachFile)}" />
								<p:commandLink action="#{ctBackingBean.deleteAttachmentAction(attachFileIndex)}" immediate="true" 
									rendered="#{ctBackingBean.compareUserName(attachFile.createdUser.loginId)}" update="lampiran1" >
			   						<h:graphicImage library="ep/images/design" name="icon_trash.png" styleClass="tasklist_title1"/>
			 	 				</p:commandLink>
			 	 			</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>

	<p:dialog id="uploadDlg1" widgetVar="uploadDlg1" modal="false" resizable="false" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{ctBackingBean.fileUpload}"
			mode="advanced" id="upload1"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="lampiran1" >
		</p:fileUpload> 
	</p:dialog>		
				</td>
			</tr>
		</table>
		
	</p:panel>		
</ui:composition>
