<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">  
	<ui:define name="contentSection">
	<script>
			$('#portlet_ctContractMaintenance_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{terminationBackingBean.getPortletTitle()}');
		</script>
	<style>
      .top-aligned-columns td{ vertical-align: top;}
      .columnWidth200 {
			width: 200px;
			vertical-align: top;
			text-align: right;
		}
      </style>
   	<f:event listener="#{terminationBackingBean.preRenderView}" type="preRenderView" />
   	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
   	<table style="width: 100%;">
    	<tr>
    		<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" action="#{terminationBackingBean.backAction}" /></td>
    	</tr>
  	</table>
  	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td style="width: 15%"><h:outputLabel
						value="#{lbl['lbl.ct.contract.no']}" /></td>
				<td style="width: 15%" class="header-info-text">
					#{terminationBackingBean.managedBean.ctContract.contractNo}</td>
				<td style="width: 20%"><h:outputLabel
						value="#{lbl['lbl.ct.ptj.name']}" /></td>
				<td style="width: 25%" class="header-info-text">
					#{terminationBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}
				</td>
			</tr>
		</table>
	</div>
	<br/>
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.contract']}" toggleable="true" collapsed="false" toggleSpeed="500">
	<f:facet name="header">
		<h:outputText value="#{lbl['lbl.ct.panel.contract']}"/>
        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fulfilment.dtls']}"/>
	</f:facet>
	<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		<h:panelGroup style="width:870px;" >
			<table style="width: 100%">
				<tr>
					<td class="columnWidth200">
						<p:outputLabel id="cno" value="#{lbl['lbl.ct.contract.no']}" />
					</td>
					<td>
						<p:inputText for="cno"  disabled="true" maxlength="17" style="width:160px;"
							value="#{terminationBackingBean.managedBean.ctContract.contractNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.no']}" />
					</td>
					<h:panelGroup rendered="#{terminationBackingBean.managedBean.contractVer.ctContractAmount.agreement or 
						terminationBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral}">
					<td class="columnWidth200">
						<p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physical.no']}" />
					</td> 
					<td>
						<p:inputText for="physicalNo" maxlength="30" style="width:160px;" disabled="true"
		 	    		value="#{terminationBackingBean.managedBean.agreementContractVer.contractPhysicalNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.physical.contract.no']}" />
					</td>
					</h:panelGroup>
				</tr>
				<tr>
					<td class="columnWidth200">
						<p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effective.date']}" />
					</td>
					<td>
						<p:inputText for="effectiveDate" disabled="true" style="width:160px;"
							value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
					<td class="columnWidth200">
						<p:outputLabel id="edate" value="#{lbl['lbl.ct.expiry.date']}" />
					</td> 
					<td>
						<p:inputText for="edate" disabled="true" style="width:160px;"
							value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
				</tr>
				<tr>
					<h:panelGroup rendered="#{terminationBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
					<td class="columnWidth200">
						<p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contract.amount']}" />
					</td>
					<td>
						<p:inputText for="contractAmount" styleClass="ppRightBtn"  maxlength="22" style="width:160px;"
			   				value="#{terminationBackingBean.managedBean.contractVer.ctContractAmount.contractAmount}"  disabled="true">
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</td>
					</h:panelGroup>
					<h:panelGroup rendered="#{!terminationBackingBean.managedBean.ctContract.zonalPricing}">
					<td class="columnWidth200">
						<h:panelGrid columns="2" style="float:right;">
			           		<p:outputLabel value="*" styleClass="mandatory" />
	     	             	<p:outputLabel id="dperiodtxt" value="#{lbl['lbl.ct.delivery.period']}" style="width:100%" />
	                  	</h:panelGrid>
					</td> 
					<td><p:inputText id="dperiod" styleClass="ppRightBtn" validator="#{webappBean.validateDPeriod}" required="true" style="width:45px;"
		              		maxlength="4" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" disabled="true" />
                		<p:spacer width="3"/>
                		<h:outputText value="#{lbl['lbl.ct.days']}" />
                	</td>
                	</h:panelGroup>
                	<h:panelGroup rendered="#{terminationBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral 
                		and !terminationBackingBean.managedBean.contractVer.ctContractAmount.agreement}">
					<td class="columnWidth200">
						<p:outputLabel id="signBy1" value="#{lbl['lbl.ct.signed.date']}" />
					</td> 
					<td>
						<p:inputText for="signBy1" disabled="true" style="width:160px;"
							value="#{terminationBackingBean.managedBean.agreementContractVer.signedDate}">
			   				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
					</td>
                	</h:panelGroup>
				</tr>
				<h:panelGroup rendered="#{terminationBackingBean.managedBean.contractVer.ctContractAmount.agreement}">
				<tr rowspan="2">
					<h:panelGroup rendered="#{terminationBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId != CtStatusConst.acComplete and
						terminationBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId != CtStatusConst.saComplete}">
					<td class="columnWidth200">
						<p:outputLabel for="astatus" value="#{lbl['lbl.ct.agreement.status']}" />
					</td>
					<td>
						<p:inputTextarea id="astatus" autoResize="false" maxlength="1000" 
							disabled="true" rows="2" style="width:160px;margin-bottom:5px;"
							value="#{terminationBackingBean.getStatusDescById(terminationBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId)}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.status']}" />
					</td>
					</h:panelGroup>
					<h:panelGroup rendered="#{terminationBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId eq CtStatusConst.acComplete or
						terminationBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId eq CtStatusConst.saComplete}">
					<td styleClass="columnWidth200">
						<p:outputLabel id="agreement" value="#{lbl['lbl.ct.agreement']}" />
					</td>
					<td>
						<h:commandLink for="agreement" styleClass="blue_font"
							title="#{terminationBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.fileName}"
							value="#{terminationBackingBean.getShortFileName(terminationBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.fileName)}"
							action="#{terminationBackingBean.downloadFile(terminationBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.filePath,
							terminationBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.fileName)}" />
					</td>
					</h:panelGroup>
					<td class="columnWidth200">
						<p:outputLabel id="signBy" value="#{lbl['lbl.ct.signed.date']}" />
					</td> 
					<td>
						<p:inputText for="signBy" disabled="true" style="width:160px;"
							value="#{terminationBackingBean.managedBean.agreementContractVer.signedDate}">
			   				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
					</td>
				</tr>
				</h:panelGroup>
				<tr rowspan="4">
					<td class="columnWidth200">
						<p:outputLabel for="contractName" value="#{lbl['lbl.ct.contract.title']}" />
					</td>
					<td colspan="3">
						<p:inputTextarea id="contractName" autoResize="false" maxlength="1000"
							disabled="true" rows="4" style="width:600px; margin-bottom:5px;" 
							value="#{terminationBackingBean.managedBean.ctContract.contractName}" />
					</td>					
				</tr>
			</table>
		</h:panelGroup>
		<h:panelGrid style="width:330px; margin-left:5px">
		   <h:panelGrid columns="3" rendered="#{terminationBackingBean.managedBean.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase
		   		and terminationBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
			 <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="true">
			 </p:selectBooleanCheckbox>
			 <p:spacer width="2" />
			 <h:panelGrid columns="2">
				 <h:outputText value="#{lbl['lbl.ct.concession']}" />
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.concession']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		     <h:panelGrid columns="2">
			     <h:outputText value="#{lbl['lbl.ct.fee.exmption']}"/>
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fee.exmption']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.contractVer.ctContractAmount.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <h:panelGrid columns="2">
			     <h:outputText value="#{lbl['lbl.ct.agreement']}" />
				 <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement']}" />
			 </h:panelGrid>
	       </h:panelGrid>	
	       <h:panelGrid columns="3" 
	          	rendered="#{false and terminationBackingBean.managedBean.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase
	          	and terminationBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry or false}">
			  <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.mto']}" />
			  </h:panelGrid>
		   </h:panelGrid>	
		   <h:panelGrid columns="3" rendered="#{terminationBackingBean.managedBean.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase}">
			  <p:selectBooleanCheckbox id="exemptId" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			    disabled="true" style="text-align:top;"> 
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.ap201']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap201.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3" 
		     rendered="#{terminationBackingBean.managedBean.ctContract.loa.loaAmt > terminationBackingBean.managedBean.performanceBondRuleAmt
		     	and terminationBackingBean.managedBean.ctContract.procurementMode.parameterCode != ParameterConst.procurementModeDirectPurchase
		     	and terminationBackingBean.managedBean.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
			 <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.ctContract.bondReq ? false : true}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.pb.exemption']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>	
	    </h:panelGrid>
	     <h:panelGrid columns="2" style="width:870px;"  styleClass="top-aligned-columns"
	      	rendered="#{terminationBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt or 
	       	terminationBackingBean.managedBean.contractVer.ctContractValue.concession}">	   		
	   		<p:outputLabel for="justificationLbl" value="#{lbl['lbl.ct.justification.ap201']}" style="width:173px;" />
			<p:inputTextarea id="justificationLbl" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.justification}"
  				rows="3" style="width:570px;" maxlength="200" autoResize="false" disabled="true" />		         		
    	</h:panelGrid>
	</h:panelGrid>
 	</p:panel>
 	<p:panel id="terminationHistoryId"	header="#{lbl['lbl.ct.panel.termination.history']}" toggleable="true" toggleSpeed="500">
			<div style="overflow-x: auto">
				<p:dataTable id="dataTable" var="data" rowIndexVar="index" rowKey="#{data}" 
					value="#{terminationBackingBean.managedBean.terminationList}" >
					<p:column headerText="#{lbl['lbl.ct.created.date']}" style="width:10%;">
						<p:commandLink action="#{terminationBackingBean.gotoTerminatePage}">
						<h:outputText value="#{data.createdDate}">
					        <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					    </h:outputText>
						<f:param name="contractVerId" value="#{data.ctContractVer.contractVerId}" />
						</p:commandLink>
					</p:column>					
					<p:column headerText="#{lbl['lbl.ct.termination.decision']}"  style="width:55%;">
						<h:outputText value="#{terminationBackingBean.getParameterDesc(data.decisionType)}" />
					</p:column>
				</p:dataTable>
			</div>
		</p:panel>
 	</ui:define>  
</ui:composition>
