<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
    <p:panel>
    	<f:event listener="#{terminationBackingBean.preRenderView}" type="preRenderView" />
	   	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	   	<table style="width: 100%;">
	    	<tr>
	    		<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" icon="ui-icon-back" action="#{terminationBackingBean.backAction}" /></td>
	    	</tr>
	  	</table>
	  	<table style="width: 99%; margin-left: 0px;" class="header-info">
	  	<tr>
				<td style="width: 15%">
					<h:outputLabel value="#{lbl['lbl.ct.contract.no']}" />
				</td>
				<td style="width: 15%" class="header-info-text">
					#{terminationBackingBean.managedBean.ctContract.contractNo}
				</td>
				<td style="width: 20%">
					<h:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
				</td>
				<td style="width: 25%" class="header-info-text">
					#{terminationBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}
				</td>
				<td style="width: 5%"></td>
				<td style="width: 20%" class="header-info-text"></td>
			</tr>
	</table>	 
	</p:panel>
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.contract']}" toggleable="true" collapsed="false" toggleSpeed="500">
	<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		<h:panelGrid columns="4" style="width:900px;" columnClasses="columnWidth15,columnWidth20,columnWidth15,columnWidth20">
	    	<p:outputLabel id="cno" value="#{lbl['lbl.ct.contract.no']}" />
		  	<p:inputText for="cno" value="#{terminationBackingBean.managedBean.ctContract.contractNo}" 
		    	disabled="true" style="width:170px;" />
		  	<p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physical.no']}" />
	 	  	<p:inputText for="physicalNo" value="#{terminationBackingBean.managedBean.ctContract.contractPhysicalNo}" style="width:170px;" disabled="true" />				
	      	<p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effective.date']}" />
		  	<p:inputText for="effectiveDate" style="width:170px;" disabled="true"
				value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.contractVer.ctContractValue.effDate)}" />
		  	<p:outputLabel id="edate" value="#{lbl['lbl.ct.expiry.date']}" />
		  	<p:inputText for="edate" style="width:170px;" disabled="true"
				value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.contractVer.ctContractValue.expDate)}" />
		  	<p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contract.amount']}" />
		  	<p:inputText for="contractAmount" styleClass="ppRightBtn" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
			 	disabled="true" style="width:170px;">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"/>
			</p:inputText>	
			<p:outputLabel id="signBy" value="#{lbl['lbl.ct.signed.date']}"  rendered="#{terminationBackingBean.managedBean.ctContract.agreement}" />
			<p:inputText for="signBy" value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.ctContract.currentAgreement.signedDate)}"
		   		rendered="#{terminationBackingBean.managedBean.ctContract.agreement}" disabled="true" style="width:170px;"/>
			<h:outputLabel id="dperiod" value="#{lbl['lbl.ct.delivery.period']}" rendered="#{!terminationBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:panelGrid columns="3" rendered="#{!terminationBackingBean.managedBean.ctContract.zonalPricing}">
				<p:inputText for="dperiod" styleClass="ppRightBtn" size="23" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" 
					disabled="#{terminationBackingBean.managedBean.ctContract.zonalPricing}" />
				<p:spacer width="2"/>
				<p:outputLabel value="#{lbl['lbl.ct.days']}" />
			</h:panelGrid>	
			<f:verbatim rendered="#{terminationBackingBean.managedBean.ctContract.zonalPricing and !terminationBackingBean.managedBean.ctContract.agreement}"/>
			<f:verbatim rendered="#{terminationBackingBean.managedBean.ctContract.zonalPricing and !terminationBackingBean.managedBean.ctContract.agreement}"/>
		 	<p:outputLabel id="astatus" value="#{lbl['lbl.ct.agreement.status']}"
		 		rendered="#{terminationBackingBean.managedBean.ctContract.agreement and
		    				terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
					 	 	terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
		    				!terminationBackingBean.managedBean.ctContract.zonalPricing}" />
		 	<p:inputText for="astatus" style="width:170px;" disabled="true"
		   		value="#{terminationBackingBean.getStatusDescById(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}"
		    	rendered="#{terminationBackingBean.managedBean.ctContract.agreement and
		    				terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
					 	 	terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
		    				!terminationBackingBean.managedBean.ctContract.zonalPricing}" />
		    <p:outputLabel id="agreement" value="#{lbl['lbl.ct.agreement']}"
			 	rendered="#{terminationBackingBean.managedBean.ctContract.agreement and 
							(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			!terminationBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:commandLink for="agreement" value="#{terminationBackingBean.managedBean.ctContract.currentAgreement.fileName}" styleClass="blue_font" 
				rendered="#{terminationBackingBean.managedBean.ctContract.agreement and 
							(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			!terminationBackingBean.managedBean.ctContract.zonalPricing}"
				action="#{terminationBackingBean.downloadFile(terminationBackingBean.managedBean.ctContract.currentAgreement.filePath,
							terminationBackingBean.managedBean.ctContract.currentAgreement.fileName)}" />
		<h:panelGroup>
	      	<div style="height: 40px; vertical-align: top;">
		  	<p:outputLabel for="contractName" value="#{lbl['lbl.ct.contract.title']}" />
			</div>
		</h:panelGroup>
	    <h:panelGrid>
		<p:inputTextarea id="contractName"
			value="#{terminationBackingBean.managedBean.ctContract.contractName}"
			required="false" rows="3" style="width:170px;" disabled="true"
			autoResize="false" />	
		</h:panelGrid>	
		<p:outputLabel id="astatus1" value="#{lbl['lbl.ct.agreement.status']}"
			rendered="#{terminationBackingBean.managedBean.ctContract.agreement and
		  			  	terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
					  	terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
		  			  	terminationBackingBean.managedBean.ctContract.zonalPricing}" />
		<p:inputText for="astatus1" style="width:170px;" disabled="true" 
		  	value="#{terminationBackingBean.getStatusDescById(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}"
		  	rendered="#{terminationBackingBean.managedBean.ctContract.agreement and
		  			  	terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
					  	terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
		  			  	terminationBackingBean.managedBean.ctContract.zonalPricing}" />
		 <p:outputLabel id="agreement1" value="#{lbl['lbl.ct.agreement']}"
			rendered="#{terminationBackingBean.managedBean.ctContract.agreement and 
						(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
			 			terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
			 			terminationBackingBean.managedBean.ctContract.zonalPricing}" />
		 <h:commandLink for="agreement1" value="#{terminationBackingBean.managedBean.ctContract.currentAgreement.fileName}" styleClass="blue_font" 
			rendered="#{terminationBackingBean.managedBean.ctContract.agreement and 
						(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
			 			terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
			 			terminationBackingBean.managedBean.ctContract.zonalPricing}"
			action="#{terminationBackingBean.downloadFile(terminationBackingBean.managedBean.ctContract.currentAgreement.filePath,
						terminationBackingBean.managedBean.ctContract.currentAgreement.fileName)}" />
    	</h:panelGrid>
		<h:panelGrid  style="width:300px;">
		   <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="true">
			 </p:selectBooleanCheckbox>
			 <p:spacer width="2" />
			 <p:outputLabel value="#{lbl['lbl.ct.concession']}" />
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		     <p:outputLabel value="#{lbl['lbl.ct.fee.exmption']}"/>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox 
			  value="#{terminationBackingBean.managedBean.ctContract.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
	       </h:panelGrid>	
	       <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
		   </h:panelGrid>	
		   <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox id="exemptId" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			     disabled="true" style="text-align:top;">
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.ap201']}" style="text-align:top;" />
		   </h:panelGrid>	
		    <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.ctContract.bondReq ? false : true}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.pb.exemption']}" style="text-align:top;" />
		   </h:panelGrid>			   
	    </h:panelGrid>
	</h:panelGrid>
 	</p:panel>
 	<p:panel id="terminationHistoryId"	header="#{lbl['lbl.ct.panel.termination.history']}" toggleable="true" toggleSpeed="500">
			<div style="overflow-x: auto">
				<p:dataTable id="dataTable" var="data" rowIndexVar="index" rowKey="#{data}" 
					value="#{terminationBackingBean.managedBean.terminationList}" >
					<p:column headerText="#{lbl['lbl.ct.created.date']}" style="width:10%;">
						<p:commandLink action="#{terminationBackingBean.gotoTerminatePage}">
						<h:outputText value="#{data.createdDate}">
					        <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					    </h:outputText>
						<f:param name="contractVerId" value="#{data.ctContractVer.contractVerId}" />
						</p:commandLink>
					</p:column>					
					<p:column headerText="#{lbl['lbl.ct.termination.decision']}"  style="width:55%;">
						<h:outputText value="#{terminationBackingBean.getParameterDesc(data.decisionType)}" />
					</p:column>
				</p:dataTable>
			</div>
		</p:panel>
 	</ui:define>  
</ui:composition>
