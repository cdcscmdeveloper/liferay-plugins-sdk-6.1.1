<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	<style>
      .column-align-right { text-align: right !important;}
    </style>
      <f:event listener="#{terminationBackingBean.preRenderView}" type="preRenderView" />
	 <p:panel>
	 <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	 <table style="width: 100%;">
	    		<tr>
	    			<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" /></td>
	    			<td class="ppRightBtn">
			  			 <ui:repeat var="outcome" value="#{terminationBackingBean.managedBean.action}">
			              <p:commandButton value="#{outcome}" process="@form" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(outcome)}" 
			              action="#{terminationBackingBean.saveContractTermination(outcome)}" />
		            </ui:repeat>    			
	    			</td>
	    		</tr>
	  </table>
	  <table style="width: 99%; margin-left: 25px;" class="header-info">
				<tr style="margin-button: 10px;">
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
					</td>
					<td>
							<p:inputText size="20" disabled="true"
								value="#{terminationBackingBean.managedBean.ctContract.contractNo}"  />
					</td>
					<td>
							<p:outputLabel value="Request No." />
					</td>
					<td>
							<p:inputText size="25" disabled="true"
								value="#{terminationBackingBean.managedBean.contractVer.docNo == null ? '-- System Generated --':terminationBackingBean.managedBean.contractVer.docNo}" />
					</td>
					 <td>
		    			   <p:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
					</td>
					<td>
						   <p:inputText size="30" disabled="true" value="#{terminationBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}"/>	
					</td>											
					<td>
		  				   <p:outputLabel value="Status" />
					</td>
					<td>
						<p:inputText size="20" disabled="true"
								value="#{terminationBackingBean.getStatusDescById(terminationBackingBean.managedBean.contractVer.status.statusId)}" />
					</td>
				</tr>
			</table>	 
	</p:panel>
	<p:tabView id="tabview" value="Termination" orientation="left" dynamic="true" cache="false" >
	   <p:tab title="#{lbl['lbl.ct.menu.fd']}" >
         <ui:include src="termination.xhtml"/>
         <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" /> 
       </p:tab> 
	   <p:tab title="#{lbl['lbl.ct.menu.remedy.notice']}" rendered="#{terminationBackingBean.managedBean.terminateWarningLetter}" >
         <ui:include src="remedyNotice.xhtml"/>
       </p:tab>  
	   <p:tab title="#{lbl['lbl.ct.menu.tnotice']}" rendered="#{terminationBackingBean.managedBean.terminateNotice}" >
         <ui:include src="terminationNotice.xhtml" />  
       </p:tab>   
	</p:tabView>
   </ui:define>  
</ui:composition>
