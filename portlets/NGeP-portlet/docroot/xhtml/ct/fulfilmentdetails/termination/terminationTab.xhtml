<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	<style>
      .column-align-center { text-align: center !important;}
      .top-aligned-columns td{ vertical-align: top;}
      
          .columnWidth200 {
	        width: 200px;
	        vertical-align: top;
	        text-align: right;
         }
         
        
            .columnWidth210 {
	        width: 210px;
         }
         
         columnWidth300{
          .width: 290px;
         }
         
    </style> 
 
	 <p:panel>
	   <f:event listener="#{terminationBackingBean.preRenderView}" type="preRenderView" />
	  	<p:messages id="messages" showDetail="true" showSummary="false" autoUpdate="true" closable="true" severity="error, info" />
	   <table style="width: 100%;">
	     <tr>
	    	<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" rendered="#{terminationBackingBean.managedBean.taskId==null}" action="#{terminationBackingBean.backAction}" /></td>
	    	<td class="ppRightBtn">
	    		<c:if test="#{!terminationBackingBean.managedBean.viewContract}">
				  	<ui:repeat var="outcome" value="#{terminationBackingBean.managedBean.action}">
				        <ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(outcome)}" />
						<p:commandButton value="#{lbl[buttonLabel]}"  process="@form" styleClass="ui-button" ajax="false" validateClient="true" 
				         icon="ui-icon-#{fn:toLowerCase(outcome)}" action="#{terminationBackingBean.saveContractTermination(outcome)}" />
			        </ui:repeat>  
		        </c:if>   			
	    	</td>
	    </tr>
	  </table>
	  <div align="left" class="header-info">
	   <table style="width: 100%">
			<tr>
				<td style="width: 15%">
					<h:outputLabel value="#{lbl['lbl.ct.contract.no']}" />
				</td>
				<td style="width: 15%" class="header-info-text">
					#{terminationBackingBean.managedBean.ctContract.contractNo}
				</td>
				<td style="width: 15%">
					<h:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
				</td>
				<td style="width: 25%" class="header-info-text">
					#{terminationBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}
				</td>
				<td style="width: 10%">
					<h:outputLabel value="#{lbl['lbl.ct.status']}" />
				</td>
				<td style="width: 20%" class="header-info-text">
					#{terminationBackingBean.getStatusDescById(terminationBackingBean.managedBean.contractVer.status.statusId)}
				</td>
			</tr>
		</table>
	</div>
	</p:panel>
		<ui:include src="termination.xhtml" />
		<ui:include src="terminationRecord.xhtml" />
		<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
	</ui:define>  
</ui:composition>
