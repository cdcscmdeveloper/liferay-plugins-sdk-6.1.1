<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<script>
			$('#portlet_ctContractMaintenance_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{terminationBackingBean.getPortletTitle()}');
		</script>
		<style>
.column-align-center {
	text-align: center !important;
}

.top-aligned-columns td {
	vertical-align: top;
}

.columnWidth200 {
	width: 220px;
	vertical-align: top;
	text-align: right;
}

.columnWidth210 {
	width: 210px;
}

.columnWidth290 {
	width: 290px;
}

 .fileupload-buttonbar.ui-widget-header.ui-corner-top {
                padding: 0.0em 0.0em;
                padding-top: 0em;
                padding-right: 0em;
                padding-bottom: 0em;
                padding-left: 0em;
        }
</style>
 <script type="text/javascript">  
           window.addEventListener('keydown',function(e)
    		      {
    	                  if(e.keyIdentifier=='U+000A'||e.keyIdentifier=='Enter'||e.keyCode==13)
    	                       {
    	            	            e.preventDefault();return false;
    	                   }
    	        },  true);
      </script>
		<p:blockUI id="blockUiId" block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<f:event listener="#{terminationBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" showSummary="false"
			autoUpdate="#{terminationBackingBean.managedBean.autoUpdate}"
			closable="true" severity="error, info" />
		<ac:gpkiPopup
			textBeforeSign="#{terminationBackingBean.managedBean.textBeforeSign}"
			postSignAction="#{terminationBackingBean.preSubmitContractTermination(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{terminationBackingBean.enableAutoUpdate()}" />
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}"
						immediate="true" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();" onkeypress="if (event.keyCode == 13) { return false; }"
						rendered="#{terminationBackingBean.managedBean.taskId==null}"
						action="#{terminationBackingBean.backAction}" /></td>
				<td class="ppRightBtn"><c:if
						test="#{!terminationBackingBean.managedBean.viewContract}">
						<ui:repeat var="outcome"
							value="#{terminationBackingBean.managedBean.outComes}">
							<ui:param name="buttonLabel"
								value="lbl.btn.#{fn:toLowerCase(outcome)}" />
							<p:commandButton value="#{lbl[buttonLabel]}" process="@form"
								update="@form" onstart="blockWidget.show();"
								oncomplete="blockWidget.hide();" styleClass="ui-button" 
								action="#{terminationBackingBean.gpkiSignAction(outcome)}" />
						</ui:repeat>
					</c:if></td>
			</tr>
		</table>
		<div align="left" class="header-info">
			<table style="width: 100%">
				<tr>
					<td style="width: 15%">
						<h:outputLabel value="#{lbl['lbl.ct.loa.no']}" />
					</td>
					<td style="width: 10%" class="header-info-text">
						<p:commandLink value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.loaNo}" 
					       process="@this" partialSubmit="true" styleClass="blue_font"
					       action="#{terminationBackingBean.goToLoaView(terminationBackingBean.managedBean.contractVer.ctContract.loa.loaId)}"/>
					</td>
					<td style="width: 15%"><h:outputLabel
							value="#{lbl['lbl.ct.contract.no']}" /></td>
					<td style="width: 15%" class="header-info-text">
						#{terminationBackingBean.managedBean.ctContract.contractNo}</td>
					<td style="width: 15%"><h:outputLabel
							value="#{lbl['lbl.ct.ptj.name']}" /></td>
					<td style="width: 25%" class="header-info-text">
						#{terminationBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}
					</td>
					<td style="width: 10%"><h:outputLabel
							value="#{lbl['lbl.ct.fulfilment.details.status']}" /></td>
					<td style="width: 20%" class="header-info-text">
						#{terminationBackingBean.getStatusDescById(terminationBackingBean.managedBean.contractVer.status.statusId)}
					</td>
				</tr>
			</table>
		</div>
		<br/>
		<ui:include src="/xhtml/ct/shared/ctHeaderDetails.xhtml" />
		<ui:include src="termination.xhtml" />
		<ui:include src="terminationRecord.xhtml" />
		<ui:include src="approverSetting.xhtml" />
		<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
		<p:confirmDialog message="#{terminationBackingBean.getCancelConfirmationContent(terminationBackingBean.managedBean.contractVer.docType)}"
			severity="alert" widgetVar="cancelConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					partialSubmit="true" process="@this"
					action="#{terminationBackingBean.saveContractTermination('CANCEL')}"
					onstart="cancelConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="cancelConfirmDlg.hide()" type="button" />
			</div>
		</p:confirmDialog>
	</ui:define>
</ui:composition>
