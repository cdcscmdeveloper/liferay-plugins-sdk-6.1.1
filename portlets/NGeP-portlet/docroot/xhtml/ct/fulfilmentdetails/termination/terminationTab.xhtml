<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	<style>
      .column-align-right { text-align: right !important;}
    </style>
     <c:if test='#{contractDetailsBackingBean.managedBean.chkRenderPage eq  "BPM"}'>
     <f:event listener="#{contractDetailsBackingBean.preRenderView}" type="preRenderView" />
	</c:if>
	 <p:panel>
	 <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	 <div class="ppRightBtn"> 
	     <ui:repeat var="outcome" value="#{contractDetailsBackingBean.managedBean.action}">
			<p:commandButton value="#{outcome}" process="@this" styleClass="ui-button" action="#{contractDetailsBackingBean.saveContract(outcome)}" />
		 </ui:repeat>		
    </div>
	</p:panel>
	<p:tabView id="tabview" value="Termination" orientation="left" dynamic="true" cache="false" >
	   <p:tab title="#{lbl['lbl.ct.menu.fd']}" >
         <ui:include src="termination.xhtml"/>
         <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" /> 
       </p:tab> 
	   <p:tab title="#{lbl['lbl.ct.menu.remedy.notice']}" rendered="#{contractDetailsBackingBean.managedBean.terminateWarningLetter}" >
         <ui:include src="/xhtml/ct/fulfilmentdetails/termination/remedyNotice.xhtml"/>
       </p:tab>  
	   <p:tab title="#{lbl['lbl.ct.menu.tnotice']}" rendered="#{contractDetailsBackingBean.managedBean.terminateNotice}" >
         <ui:include src="/xhtml/ct/fulfilmentdetails/termination/terminationNotice.xhtml" />  
       </p:tab>   
	</p:tabView>
   </ui:define>  
</ui:composition>
