<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.contract']}" toggleable="true" collapsed="false" toggleSpeed="500">
		<!-- <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fulfilment.dtls']}"/> -->
		<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		   <h:panelGrid columns="4" style="width:870px;" columnClasses="columnWidth200,columnWidth210,columnWidth200,columnWidth210">
		      <p:outputLabel id="cno" value="#{lbl['lbl.ct.contract.no']}" />
			  <h:panelGrid columns="3">
			  	<p:inputText for="cno" value="#{terminationBackingBean.managedBean.ctContract.contractNo}" 
			     	disabled="true" style="width:170px;" />
			    <p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.no']}" />
			  </h:panelGrid>
			  <p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physical.no']}" />
		 	  <h:panelGrid columns="3">
		 	  	<p:inputText for="physicalNo" value="#{terminationBackingBean.managedBean.ctContract.contractPhysicalNo}" style="width:170px;" disabled="true" />				
		      	<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.physical.contract.no']}" />
				</h:panelGrid>
		      <p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effective.date']}" />
			  <p:inputText for="effectiveDate" style="width:170px;" disabled="true" 
				value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.contractVer.ctContractValue.effDate)}" />
			  <p:outputLabel id="edate" value="#{lbl['lbl.ct.expiry.date']}" />
			  <p:inputText for="edate" style="width:170px;" disabled="true"
				value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.contractVer.ctContractValue.expDate)}" />
			  <p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contract.amount']}" />
			  <p:inputText for="contractAmount" styleClass="ppRightBtn" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				 disabled="true" style="width:170px;">
				   <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"/>
			</p:inputText>	
			<p:outputLabel id="signBy" value="#{lbl['lbl.ct.signed.date']}"  rendered="#{terminationBackingBean.managedBean.ctContract.agreement}" />
			<h:panelGrid columns="3" rendered="#{terminationBackingBean.managedBean.ctContract.agreement}">
				<p:inputText for="signBy" value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.ctContract.currentAgreement.signedDate)}"
			   		 disabled="true" style="width:170px;"/>
			   	<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
			</h:panelGrid>
			<p:outputLabel id="dperiod" value="#{lbl['lbl.ct.delivery.period']}" rendered="#{!terminationBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:panelGrid columns="3" rendered="#{!terminationBackingBean.managedBean.ctContract.zonalPricing}">
				<p:inputText for="dperiod" styleClass="ppRightBtn" style="width:65px;" disabled="true" 
				   value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" />
				<p:spacer width="2"/>
				<p:selectOneMenu  style="width:100px;"  disabled="true" 
				   value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.deliveryTermUom.parameterId}">
			       <f:selectItems value="#{terminationBackingBean.getDropdownValues(ParameterTypeConst.deliveryTerm)}" />
			   </p:selectOneMenu>
			</h:panelGrid>	
			<f:verbatim rendered="#{terminationBackingBean.managedBean.ctContract.zonalPricing and !terminationBackingBean.managedBean.ctContract.agreement}"/>
			<f:verbatim rendered="#{terminationBackingBean.managedBean.ctContract.zonalPricing and !terminationBackingBean.managedBean.ctContract.agreement}"/>
			 <p:outputLabel id="astatus" value="#{lbl['lbl.ct.agreement.status']}"
			 	rendered="#{terminationBackingBean.managedBean.ctContract.agreement and
			    			terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
					 	 	terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
			    			!terminationBackingBean.managedBean.ctContract.zonalPricing}" />
			 <h:panelGrid columns="3"
			 	rendered="#{terminationBackingBean.managedBean.ctContract.agreement and
			    			terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
					 	 	terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
			    			!terminationBackingBean.managedBean.ctContract.zonalPricing}" >
			 	<p:inputText for="astatus" style="width:170px;" disabled="true"
				   	value="#{terminationBackingBean.getStatusDescById(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}" />
			  	<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.status']}" />
			  </h:panelGrid>
			  <p:outputLabel id="agreement" value="#{lbl['lbl.ct.agreement']}"
			 	rendered="#{terminationBackingBean.managedBean.ctContract.agreement and 
							(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			!terminationBackingBean.managedBean.ctContract.zonalPricing}" />
		      <h:commandLink for="agreement" value="#{terminationBackingBean.managedBean.ctContract.currentAgreement.fileName}" styleClass="blue_font" 
				rendered="#{terminationBackingBean.managedBean.ctContract.agreement and 
							(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			!terminationBackingBean.managedBean.ctContract.zonalPricing}"
				action="#{terminationBackingBean.downloadFile(terminationBackingBean.managedBean.ctContract.currentAgreement.filePath,
							terminationBackingBean.managedBean.ctContract.currentAgreement.fileName)}" />
			<h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="#{lbl['lbl.ct.contract.title']}" />
			  </div>
			</h:panelGroup>
		    <h:panelGrid>
			<p:inputTextarea id="contractName"
				value="#{terminationBackingBean.managedBean.ctContract.contractName}"
				rows="3" style="width:170px;margin-bottom: 5px;" disabled="true"
				autoResize="false" />	
			</h:panelGrid>	
			<p:outputLabel id="astatus1" value="#{lbl['lbl.ct.agreement.status']}"
				rendered="#{terminationBackingBean.managedBean.ctContract.agreement and
			 			 	terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
					 	 	terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
			 			 	terminationBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:panelGrid columns="3"
				rendered="#{terminationBackingBean.managedBean.ctContract.agreement and
			 			 	terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.acComplete and
					 	 	terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId != CtStatusConst.saComplete and
			 			 	terminationBackingBean.managedBean.ctContract.zonalPricing}">
				<p:inputText for="astatus1" style="width:170px;" disabled="true" 
				 	value="#{terminationBackingBean.getStatusDescById(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}" />
			 	<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.status']}" />
			 </h:panelGrid>
			 <p:outputLabel id="agreement1" value="#{lbl['lbl.ct.agreement']}"
			 	rendered="#{terminationBackingBean.managedBean.ctContract.agreement and 
							(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			terminationBackingBean.managedBean.ctContract.zonalPricing}" />
			 <h:commandLink for="agreement1" value="#{terminationBackingBean.managedBean.ctContract.currentAgreement.fileName}" styleClass="blue_font" 
				rendered="#{terminationBackingBean.managedBean.ctContract.agreement and 
							(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.acComplete or
				 			terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId eq CtStatusConst.saComplete) and
				 			terminationBackingBean.managedBean.ctContract.zonalPricing}"
				action="#{terminationBackingBean.downloadFile(terminationBackingBean.managedBean.ctContract.currentAgreement.filePath,
							terminationBackingBean.managedBean.ctContract.currentAgreement.fileName)}" />
	    </h:panelGrid>
		<h:panelGrid  style="width:330px;">
		   <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="true"/>
			 <p:spacer width="2" />
			 <h:panelGrid columns="2">
			 	<p:outputLabel value="#{lbl['lbl.ct.concession']}" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.concession']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		     <h:panelGrid columns="2">
		     	<p:outputLabel value="#{lbl['lbl.ct.fee.exmption']}"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fee.exmption']}" />
			 </h:panelGrid>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.ctContract.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <h:panelGrid columns="2">
		     	<p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement']}" />
			 </h:panelGrid>
	       </h:panelGrid>	
	       <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
			  	<p:outputLabel value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.mto']}" />
			  </h:panelGrid>
		   </h:panelGrid>	
		   <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox id="exemptId" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			     disabled="true" style="text-align:top;"/>
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
			  	<p:outputLabel value="#{lbl['lbl.ct.ap201']}" style="text-align:top;" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap201.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>	
		    <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.ctContract.bondReq ? false : true}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
			  	<p:outputLabel value="#{lbl['lbl.ct.pb.exemption']}" style="text-align:top;" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>
	    </h:panelGrid>
	     <h:panelGrid columns="2" style="width:870px;"  styleClass="top-aligned-columns" columnClasses="columnWidth210"
	      rendered="#{terminationBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt or 
	       terminationBackingBean.managedBean.contractVer.ctContractValue.concession}">
	         <h:panelGrid columns="2" style="float:right;">
		    	<p:outputLabel value="*" styleClass="mandatory" />
			   <p:outputLabel for="justificationLbl" style="float:right;" value="#{lbl['lbl.ct.justification.ap201']}" />
			  </h:panelGrid>
	  <h:panelGrid>
	    <p:inputTextarea id="justificationLbl" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.justification}"
		  rows="4" style="width:600px;"  disabled="true" autoResize="false" />	
	  </h:panelGrid>		
    </h:panelGrid> 
	</h:panelGrid>
 </p:panel>
    <p:panel id="terminateContract" header="#{lbl['lbl.ct.panel.termination']}" toggleable="true"  toggleSpeed="500">
       <h:panelGrid columns="4" style="width:1100px;" columnClasses="columnWidth15,columnWidth20,columnWidth20,columnWidth20">
          <h:panelGrid columns="2" style="float:right;">
			<p:outputLabel value="*" styleClass="mandatory" />
            <p:outputLabel value="#{lbl['lbl.ct.termination.decision']}" />
         </h:panelGrid>
          <h:panelGrid columns="4">
	          <p:selectOneMenu id="menuSelectionId" required="true"  style="width:180px;" label="#{lbl['lbl.ct.termination.decision']}"
	          	 disabled="#{terminationBackingBean.managedBean.contractVer.status.statusId==CtStatusConst.ftPendingLetterPrintAndUpdate
	          	 or terminationBackingBean.isApprover()}"
				 value="#{terminationBackingBean.managedBean.contractVer.ctTermination.decisionType.parameterId}">
				 <f:selectItems value="#{terminationBackingBean.getDropdownValues(ParameterTypeConst.terminationDecisionType)}" />
				 <p:ajax event="change" update=":form:terminateContract" process="@this"
						listener="#{terminationBackingBean.changeField}" />
			  </p:selectOneMenu>
			  <p:message for="menuSelectionId" display="icon"/>
			  <p:spacer width="2" />
			  <p:commandLink value="#{lbl['lbl.ct.view.notice']}" update="editorDisplay" action="#{terminationBackingBean.previewNoticeAction}"
			  	rendered="#{terminationBackingBean.managedBean.termination || terminationBackingBean.managedBean.remedy || terminationBackingBean.managedBean.mutualTermination}" 
			  	oncomplete="if (args &amp;&amp; !args.validationFailed) noticeDlg.show()"/>
		  </h:panelGrid>
		  
		  <h:panelGrid columns="2" style="float:right;">
			<p:outputLabel value="*" styleClass="mandatory" />
		    <p:outputLabel value="#{lbl['lbl.ct.decision.date']}" />
		 </h:panelGrid>
		   <h:panelGrid columns="2">
             <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.decisionDate}"
          		readonlyInput="true" required="true" label="#{lbl['lbl.ct.decision.date']}" navigator="true"
                id="calItem1" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>                              
		      <p:message for="calItem1" display="icon"/>
		   </h:panelGrid>
		  
		<h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination || terminationBackingBean.managedBean.remedy}">
			<p:outputLabel value="*" styleClass="mandatory" />
		    <p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}" />
		</h:panelGrid> 
		 <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination || terminationBackingBean.managedBean.remedy}">
		    <p:inputText id="fileRefNum" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.fileRefNo}" 
		      style="width:170px;" maxlength="100"  required="true" label="#{lbl['lbl.ct.file.ref.no']}">
		     </p:inputText>
		     <p:message for="fileRefNum" display="icon"/>
		 </h:panelGrid>
		 
		 <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.remedy}">
			<p:outputLabel value="*" styleClass="mandatory" />
		    <p:outputLabel value="#{lbl['lbl.ct.termination.effective.date']}" />
		 </h:panelGrid>
		   <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.remedy}">
             <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.terminationEffDate}"
          		readonlyInput="true" required="true" label="#{lbl['lbl.ct.termination.effective.date']}" navigator="true"
                id="calItem2" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>                              
		      <p:message for="calItem2" display="icon"/>
		   </h:panelGrid>
		   
		   <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.remedy}">
			   <p:outputLabel value="*" styleClass="mandatory" />
		       <p:outputLabel value="#{lbl['lbl.ct.remedy.start.date']}" />
		  </h:panelGrid>
		   <h:panelGrid columns="2"  rendered="#{terminationBackingBean.managedBean.remedy}">
                <p:calendar id="calItem3"  readonlyInput="true"  required="true" label="#{lbl['lbl.ct.remedy.start.date']}" navigator="true"
                    value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}" size="20"
                     showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
                    <p:ajax event="dateSelect" update=":form:calItem4" process="@this" />
                </p:calendar>
                <p:message for="calItem3" display="icon"/>
		  </h:panelGrid>
		  
		   <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.remedy}">
			    <p:outputLabel value="*" styleClass="mandatory" />
		        <p:outputLabel value="#{lbl['lbl.ct.remedy.end.date']}" />
		  </h:panelGrid>
          <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.remedy}">
             <p:calendar id="calItem4"  readonlyInput="true" required="true" label="#{lbl['lbl.ct.remedy.end.date']}" navigator="true"
                 value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyEndDate}"
          		 mindate="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}"  size="24" 
                 showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
                 <f:attribute name="startDate" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}" />
                 <f:validator validatorId="primeDateRangeValidator" />
             </p:calendar>
             <p:message for="calItem4" display="icon"/>
          </h:panelGrid>
	
		  <p:spacer rendered="#{terminationBackingBean.managedBean.termination}" />
		  <p:spacer rendered="#{terminationBackingBean.managedBean.termination}" />                
		  
		   <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination}">
			<p:outputLabel value="*" styleClass="mandatory" />
		    <p:outputLabel value="#{lbl['lbl.ct.last.remedy.file.no']}" />
		  </h:panelGrid>
		  <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
           <p:inputText id="lastRemedyFileNo" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.lastRemedyFileNo}" 
             style="width:170px;" maxlength="100" required="true" label="#{lbl['lbl.ct.last.remedy.file.no']}">
              </p:inputText>
                <p:message for="lastRemedyFileNo" display="icon"/>
		  </h:panelGrid>
		 
		  <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination}">
			<p:outputLabel value="*" styleClass="mandatory" />
		   <p:outputLabel value="#{lbl['lbl.ct.last.remedy.notice.date']}" />
		  </h:panelGrid>
		  
		   <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
              <p:calendar id="calItem6" size="24"  value="#{terminationBackingBean.managedBean.contractVer.ctTermination.lastRemedyDate}"
                showOn="button" readonlyInput="true" required="true" label="#{lbl['lbl.ct.last.remedy.notice.date']}" navigator="true"
                 pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
		         <p:message for="calItem6" display="icon"/>
		    </h:panelGrid>
		
		   <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination}">
			  <p:outputLabel value="*" styleClass="mandatory" />
		      <p:outputLabel value="#{lbl['lbl.ct.last.remedy.start.date']}" />
		   </h:panelGrid>
		   <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
              <p:calendar  id="calItem7" readonlyInput="true" required="true" label="#{lbl['lbl.ct.last.remedy.start.date']}"  navigator="true"
          		  value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}"  size="20" 
          		  showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
                  <p:ajax event="dateSelect" update=":form:calItem8" process="@this" />
             </p:calendar>
		     <p:message for="calItem8" display="icon"/>
		 </h:panelGrid>
		
		 <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination}">
			<p:outputLabel value="*" styleClass="mandatory" />
		  <p:outputLabel value="#{lbl['lbl.ct.last.remedy.end.date']}" />
		 </h:panelGrid>
		  <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
             <p:calendar id="calItem8" readonlyInput="true"  required="true" label="#{lbl['lbl.ct.last.remedy.end.date']}"
                 value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyEndDate}" navigator="true"
                 mindate="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}" size="24" 
          		showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
          		 <f:attribute name="startDate" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}" />
                 <f:validator validatorId="primeDateRangeValidator" />
             </p:calendar> 
		     <p:message for="calItem8" display="icon"/>
		   </h:panelGrid>
		 
		  <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination}">
			<p:outputLabel value="*" styleClass="mandatory" />
		  <p:outputLabel value="#{lbl['lbl.ct.recommended.agency']}" />
		 </h:panelGrid>
		    <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
		       <p:inputText id="recomendAgency"  style="width:220px;" maxlength="255" required="true" label="#{lbl['lbl.ct.recommended.agency']}"
                 value="#{terminationBackingBean.managedBean.contractVer.ctTermination.recommendedAgency}"/>
                  <p:message for="recomendAgency" display="icon"/>
		     </h:panelGrid>
		     
		   <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination}">
			<p:outputLabel value="*" styleClass="mandatory" />
		  <p:outputLabel value="#{lbl['lbl.ct.recommended.agency.date']}" />
		 </h:panelGrid>
		    <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
              <p:calendar id="calItem9" size="24"  value="#{terminationBackingBean.managedBean.contractVer.ctTermination.recommendedAgencyDate}"
                  showOn="button" readonlyInput="true" required="true" label="#{lbl['lbl.ct.recommended.agency.date']}" navigator="true"
                  pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>		
                   <p:message for="calItem9" display="icon"/>  
		     </h:panelGrid>
		 </h:panelGrid>
         <p:spacer height="15"/>
         <h:panelGrid style="width:100%">
		   <p:dataTable id="terminationReason" var="data" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.ctTerminationReasons}" 
			 dynamic="true" rowKey="#{data}" selection="#{terminationBackingBean.selectedTerminationReasonsList}">
			 <ac:paginator for="terminationReason" />
			     <p:column selectionMode="multiple" style="width:1%;"/>  
		         <p:column style="width:24%;"  headerText="#{lbl['lbl.ct.clause.no']}" >
