<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true"  toggleSpeed="500">
		<h:panelGrid columns="5" style="width:100%" columnClasses="columnWidth15">
			<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
			<p:inputText value="#{terminationBackingBean.managedBean.contractVer.docNo}" style="width:170px;" disabled="true" />
			<p:outputLabel value="#{lbl['lbl.ct.physicalNo']}" />
			<p:inputText value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}" style="width:170px;" disabled="true" />				
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="false" />
				<p:spacer width="2" />
				<p:outputLabel value="Concession" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.effectiveDate']}" />
			<p:inputText style="width:130px;" disabled="true"
				value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.contractVer.ctContractValue.effDate)}" />
			<p:outputLabel value="#{lbl['lbl.ct.edate']}" />
			<p:inputText style="width:130px;" disabled="true"
				value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.contractVer.ctContractValue.expDate)}" />
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox value="true" disabled="true" />
				<p:spacer width="2" />	
				<p:outputLabel value="Exempted" />
			</h:panelGrid>
				<p:outputLabel value="#{lbl['lbl.ct.contractAmount']}" />
			<p:inputText value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				 disabled="true" style="width:130px;"  styleClass="ppRightBtn">
				  <f:convertNumber pattern="#,###.00" />
				 </p:inputText>	
				 <p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
		    	<p:inputText style="width:130px;" disabled="true" 
				    value="#{terminationBackingBean.managedBean.ctContract.loaNo}" />	
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{terminationBackingBean.managedBean.ctContract.agreement}" disabled="true" />
				<p:spacer width="2" />	
				<p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
			</h:panelGrid>
			 <p:outputLabel value="Supplier Name" />  
              <p:inputText value="#{terminationBackingBean.managedBean.ctContract.smSupplier.companyName}" 
                 disabled="true" style="width:170px;"/> 	
			 <p:outputLabel value="#{lbl['lbl.ct.dperiod']}" />
			<h:panelGrid columns="3">
				<p:inputText size="8" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" disabled="true"/>
				<p:spacer width="2"/>
				<p:outputLabel value="Days" />
			</h:panelGrid>	
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{terminationBackingBean.managedBean.ctContract.mto}"
					disabled="true" style="text-align:top;" />
				<p:spacer width="2" />	
				<p:outputLabel value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
			</h:panelGrid>		
			 <h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="#{lbl['lbl.ct.cname']}" />
			</div>
			</h:panelGroup>
			 <h:panelGrid>
			<p:inputTextarea id="contractName"
				value="#{terminationBackingBean.managedBean.ctContract.contractName}"
				required="false" rows="3" cols="31" disabled="true"
				autoResize="false" />	
			</h:panelGrid>		
			<f:verbatim /><f:verbatim /> <f:verbatim /><f:verbatim /><f:verbatim />
			<h:outputLabel
				rendered="#{terminationBackingBean.managedBean.ctContract.circular.latestCircularVer.circularNo != null}"
				value="#{lbl['lbl.ct.circularNo']}" />
			<p:commandLink
				rendered="#{terminationBackingBean.managedBean.ctContract.circular.latestCircularVer.circularNo != null}"
				style="margin-right:20px;" ajax="false">
				<h:outputText
					value="#{terminationBackingBean.managedBean.ctContract.circular.latestCircularVer.circularNo}"
					styleClass="linkcommand" />
			</p:commandLink>
		</h:panelGrid>
	</p:panel>
    <p:panel id="terCont" header="#{lbl['lbl.ct.tr.panel.header']}" toggleable="true"  toggleSpeed="500">
        <table style="width: 100%">
			<tr>
				<td style="width: 115px;"><p:outputLabel value="#{lbl['lbl.ct.tr.recom']}" /></td>
				<td>
					<p:selectOneMenu style="width:180px;"
						value="#{terminationBackingBean.managedBean.contractVer.ctTermination.decisionType.parameterId}">
						<f:selectItems value="#{terminationBackingBean.getDropdownValues('TDT')}" />
						<p:ajax event="change" update=":form:tabview" process="@this"
							listener="#{terminationBackingBean.changeField}" />
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td><p:spacer height="2" /></td>
			</tr>
			<tr>
				<td style="width: 115px;"><p:outputLabel value="#{lbl['lbl.ct.tr.discip.action']}" /></td>
				<td>
					<p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.contractVer.ctTermination.displinaryAction}">
                         <p:ajax event="change" update=":form:tabview" listener="#{terminationBackingBean.chkDisciplinaryAction}" process="@this"/> 
                        </p:selectBooleanCheckbox>
				</td>
			</tr>
		</table>
        <p:spacer height="2"/>
         <p:outputPanel rendered="#{terminationBackingBean.managedBean.disciplinaryValue}">
               <table style="width: 100%">
               <tr>
                   <td style="width:115px;"> <p:outputLabel value="#{lbl['lbl.ct.su.name']}"/></td>
			       <td> <p:inputText value="#{terminationBackingBean.managedBean.ctContract.smSupplier.companyName}"
			               style="width:170px;" disabled="true" /></td>
			       <td> <p:outputLabel value="#{lbl['lbl.ct.tr.complaint.type']}" /></td>
			       <td> <p:inputText value="#{terminationBackingBean.managedBean.complaintCategory}" 
			             style="width:220px;" disabled="true"/> </td>
                   <td style="width:110px;"><f:verbatim></f:verbatim></td>
                 </tr>
                 </table>
                 <h:panelGrid columns="2">
                   <h:panelGroup>
		                <div style="height:90px;width:115px; vertical-align:top;">
			               <p:outputLabel for="complaintDesc" value="#{lbl['lbl.ct.tr.complaint.details']}" />
			            </div>
			       </h:panelGroup>
			       <h:panelGrid>
			       <p:inputTextarea id="complaintDesc" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.displinaryActionDesc}" 
			          rows="7" cols="100" disabled="false" autoResize="false" />	
			</h:panelGrid>		
           </h:panelGrid> 
           <h:panelGrid columns="2">
           <h:panelGroup>
		         <div style="width:115px;">
                     <p:outputLabel value="Upload Complaint"/>
                 </div>
            </h:panelGroup>
			<h:panelGroup id="uploadComplaintPg">
				<p:commandButton oncomplete="uploadComplaintDlg.show();return false;" icon="iconAttachment" 
					update="uploadComplaintPg" value="Choose file" 
					rendered="#{terminationBackingBean.isContractAdmin()}" />	
				<h:commandLink value="#{terminationBackingBean.managedBean.contractVer.ctTermination.complaintFilePath}" styleClass="blue_font" 
					action="#{terminationBackingBean.downloadFile(1)}" />					
			</h:panelGroup>
           </h:panelGrid>     
		</p:outputPanel>
       <p:spacer height="10"/>
       <h:panelGrid style="width:100%">
		  <p:dataTable id="dataTable" var="data" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.ctTerminationReasons}" 
			 lazy="false" dynamic="true" rowKey="#{data}" selection="#{terminationBackingBean.selectedTerminationReasonsList}" 
			 paginator="true" paginatorPosition="bottom" paginatorAlwaysVisible="false" emptyMessage="No Records!">
			 <ac:paginator for="dataTable" />
			     <p:column selectionMode="multiple" style="width:15px;"/>  
		         <p:column style="width:200px;" headerText="#{lbl['lbl.ct.tr.table.reason']}" >
		             <p:selectOneMenu style="width:190px;" value="#{data.reasonType.parameterId}">
                       <f:selectItems value="#{terminationBackingBean.getDropdownValues(PmCodeCatConst.ctTerminationReasonType)}" />
               	     </p:selectOneMenu>
                 </p:column>
		        <p:column style="width:500px;" headerText="#{lbl['lbl.ct.tr.table.descp']}">
		           <p:inputText value="#{data.description}" style="width:500px;"/>
		        </p:column> 
		   </p:dataTable>
		 </h:panelGrid>
		 <p:spacer height="2" />
		   <div class="ppRightBtn"> 
		      <p:commandButton value="Add"  process="@form" partialSubmit="true"
		         icon="ui-icon-add" action="#{terminationBackingBean.addTerminateReason()}" update="dataTable"/>
		      <p:spacer width="2"/>
		        <p:commandButton value="Delete" icon="ui-icon-delete" partialSubmit="true" process="@this" onsuccess="confirmation.show()">
			  </p:commandButton> 
	   	  </div>
		  <p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			 severity="alert" widgetVar="confirmation">
             <h:panelGrid columns="2">
				<p:commandButton value="Yes" update="dataTable" partialSubmit="true" process="@form"
				   onclick="confirmation.hide();" action="#{terminationBackingBean.deleteTerminateReason}"/>
				<p:commandButton value="No" onclick="confirmation.hide()" type="button" />
		     </h:panelGrid>
		  </p:confirmDialog>
		  <p:dialog id="uploadComplaintDlg" widgetVar="uploadComplaintDlg" modal="false" resizable="false" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" 
			fileUploadListener="#{terminationBackingBean.fileUpload}" 
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="uploadComplaintPg" >
		</p:fileUpload> 
	</p:dialog>
		</p:panel>      
</ui:composition>
