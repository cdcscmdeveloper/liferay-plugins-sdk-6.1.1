<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true" collapsed="false" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		   <h:panelGrid columns="4" style="width:1000px;" columnClasses="columnWidth200,columnWidth250,columnWidth300,columnWidth250">
		      <p:outputLabel id="cno" value="#{lbl['lbl.ct.cno']}" />
			  <p:inputText for="cno" value="#{terminationBackingBean.managedBean.ctContract.contractNo}" 
			     disabled="true" style="width:170px;" />
			  <p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physicalNo']}" />
		 	  <p:inputText for="physicalNo" value="#{terminationBackingBean.managedBean.ctContract.contractPhysicalNo}" style="width:170px;" disabled="true" />				
		      <p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effectiveDate']}" />
			  <p:inputText for="effectiveDate" style="width:170px;" disabled="true" 
				value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.contractVer.ctContractValue.effDate)}" />
			  <p:outputLabel id="edate" value="#{lbl['lbl.ct.edate']}" />
			  <p:inputText for="edate" style="width:170px;" disabled="true"
				value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.contractVer.ctContractValue.expDate)}" />
			  <p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contractAmount']}" />
			  <p:inputText for="contractAmount" styleClass="ppRightBtn" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				 disabled="true" style="width:170px;">
				   <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"/>
			</p:inputText>	
			<p:outputLabel id="signBy" value="#{lbl['lbl.ct.sdate']}"  rendered="#{terminationBackingBean.managedBean.ctContract.agreement}" />
			<p:inputText for="signBy" value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.ctContract.currentAgreement.signedDate)}"
			   rendered="#{terminationBackingBean.managedBean.ctContract.agreement}" disabled="true" style="width:170px;"/>
			<p:outputLabel id="dperiod" value="#{lbl['lbl.ct.dperiod']}" rendered="#{!terminationBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:panelGrid columns="3" rendered="#{!terminationBackingBean.managedBean.ctContract.zonalPricing}">
				<p:inputText for="dperiod" styleClass="ppRightBtn" style="width:65px;" disabled="true" 
				   value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" />
				<p:spacer width="2"/>
				<p:selectOneMenu  style="width:100px;"  disabled="true" 
				   value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.deliveryTermUom.parameterId}">
			       <f:selectItems value="#{terminationBackingBean.getDropdownValues(ParameterTypeConst.deliveryTerm)}" />
			   </p:selectOneMenu>
			</h:panelGrid>	
			<f:verbatim rendered="#{terminationBackingBean.managedBean.ctContract.zonalPricing and !terminationBackingBean.managedBean.ctContract.agreement}"/>
			<f:verbatim rendered="#{terminationBackingBean.managedBean.ctContract.zonalPricing and !terminationBackingBean.managedBean.ctContract.agreement}"/>
			 <p:outputLabel id="astatus" value="#{lbl['lbl.ct.ag.agstatus']}" rendered="#{terminationBackingBean.managedBean.ctContract.agreement and 
			    !terminationBackingBean.managedBean.ctContract.zonalPricing}" />
			 <p:inputText for="astatus" style="width:170px;" disabled="true"
			   value="#{terminationBackingBean.getStatusDescById(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}"
			    rendered="#{terminationBackingBean.managedBean.ctContract.agreement and !terminationBackingBean.managedBean.ctContract.zonalPricing}"/>	<h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="#{lbl['lbl.ct.ctitle']}" />
			</div>
			</h:panelGroup>
		    <h:panelGrid>
			<p:inputTextarea id="contractName"
				value="#{terminationBackingBean.managedBean.ctContract.contractName}"
				rows="3" style="width:170px;margin-bottom: 5px;" disabled="true"
				autoResize="false" />	
			</h:panelGrid>	
			<p:outputLabel id="astatus1" value="#{lbl['lbl.ct.ag.agstatus']}" rendered="#{terminationBackingBean.managedBean.ctContract.agreement and 
			   terminationBackingBean.managedBean.ctContract.zonalPricing}" />
			<p:inputText for="astatus1" style="width:170px;" disabled="true" 
			  value="#{terminationBackingBean.getStatusDescById(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}"
			 rendered="#{terminationBackingBean.managedBean.ctContract.agreement and terminationBackingBean.managedBean.ctContract.zonalPricing}" />
	    </h:panelGrid>
		<h:panelGrid  style="width:200px;">
		   <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="true"/>
			 <p:spacer width="2" />
			 <p:outputLabel value="#{lbl['lbl.ct.chkbx.concession']}" />
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		     <p:outputLabel value="#{lbl['lbl.ct.chkbx.feeExmp']}"/>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox 
			  value="#{terminationBackingBean.managedBean.ctContract.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
	       </h:panelGrid>	
	       <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
		   </h:panelGrid>	
		   <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox id="exemptId" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			     disabled="true" style="text-align:top;"/>
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.chkbx.ap201']}" style="text-align:top;" />
		   </h:panelGrid>	
		    <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.ctContract.bondReq ? false : true}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.chkbx.pbexemption']}" style="text-align:top;" />
		   </h:panelGrid>	
	    </h:panelGrid>
	    <h:panelGrid columns="2" style="width:1000px;"  styleClass="top-aligned-columns" columnClasses="columnWidth200"
	    rendered="#{terminationBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt or 
	       terminationBackingBean.managedBean.contractVer.ctContractValue.concession}">
	          <h:panelGrid columns="2" style="float:right;">
		    	<p:outputLabel value="*" styleClass="mandatory" />
			      <p:outputLabel for="justificationLbl" style="float:right;" value="#{lbl['lbl.ct.justification']}" />
			  </h:panelGrid>
	  <h:panelGrid>
	    <p:inputTextarea id="justificationLbl" rows="4" style="width:720px;"  disabled="true" 
	        autoResize="false"  value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.justification}"/>	
	  </h:panelGrid>		
    </h:panelGrid> 
	</h:panelGrid>
 </p:panel>
    <p:panel id="terminateContract" header="#{lbl['lbl.ct.tr.panel.header']}" toggleable="true"  toggleSpeed="500">
       <h:panelGrid columns="4" style="width:1000px;" columnClasses="columnWidth200,columnWidth250,columnWidth300,columnWidth250">
        <h:panelGrid columns="2" style="float:right;">
			<p:outputLabel value="*" styleClass="mandatory" />
            <p:outputLabel value="#{lbl['lbl.ct.tr.recom']}" />
         </h:panelGrid>
          <h:panelGrid columns="4">
	          <p:selectOneMenu id="menuSelectionId" required="true"  style="width:180px;" label="#{lbl['lbl.ct.tr.recom']}"
	          	 disabled="#{terminationBackingBean.managedBean.contractVer.status.statusId==CtStatusConst.ftPendingLetterPrintAndUpdate}"
				 value="#{terminationBackingBean.managedBean.contractVer.ctTermination.decisionType.parameterId}">
				 <f:selectItems value="#{terminationBackingBean.getDropdownValues(ParameterTypeConst.terminationDecisionType)}" />
				 <p:ajax event="change" update=":form:terminateContract" process="@this"
						listener="#{terminationBackingBean.changeField}" />
			  </p:selectOneMenu>
			  <p:message for="menuSelectionId" display="icon"/>
			  <p:spacer width="2" />
			  <p:commandLink value="View Notice" update="editorDisplay" action="#{terminationBackingBean.previewNoticeAction}"
			  	rendered="#{terminationBackingBean.managedBean.termination || terminationBackingBean.managedBean.remedy || terminationBackingBean.managedBean.mutualTermination}" 
			  	oncomplete="noticeDlg.show()"/>
		  </h:panelGrid>
		  
		  <h:panelGrid columns="2" style="float:right;">
			<p:outputLabel value="*" styleClass="mandatory" />
		    <p:outputLabel value="#{lbl['lbl.ct.tr.decisiondt']}" />
		 </h:panelGrid>
		   <h:panelGrid columns="2">
             <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.decisionDate}"
          		readonlyInput="true" required="true" label="#{lbl['lbl.ct.tr.decisiondt']}"
                id="calItem1" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>                              
		      <p:message for="calItem1" display="icon"/>
		   </h:panelGrid>
		  
		<h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination || terminationBackingBean.managedBean.remedy}">
			<p:outputLabel value="*" styleClass="mandatory" />
		    <p:outputLabel value="#{lbl['lbl.ct.tr.fierefno']}" />
		</h:panelGrid> 
		 <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination || terminationBackingBean.managedBean.remedy}">
		    <p:inputText id="fileRefNum" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.fileRefNo}" 
		      style="width:170px;" maxlength="100"  required="true" label="#{lbl['lbl.ct.tr.fierefno']}">
		     </p:inputText>
		     <p:message for="fileRefNum" display="icon"/>
		 </h:panelGrid>
		 
		 <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.remedy}">
			<p:outputLabel value="*" styleClass="mandatory" />
		    <p:outputLabel value="#{lbl['lbl.ct.tr.treffdt']}" />
		 </h:panelGrid>
		   <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.remedy}">
             <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.terminationEffDate}"
          		readonlyInput="true" required="true" label="Termination Effective Date"
                id="calItem2" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>                              
		      <p:message for="calItem2" display="icon"/>
		   </h:panelGrid>
		   
		   <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.remedy}">
			<p:outputLabel value="*" styleClass="mandatory" />
		    <p:outputLabel value="#{lbl['lbl.ct.tr.remstartdt']}" />
		  </h:panelGrid>
		   <h:panelGrid columns="2"  rendered="#{terminationBackingBean.managedBean.remedy}">
              <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}"
          		readonlyInput="true"  required="true" label="Remedy Start Date" 
                id="calItem3" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
                 <p:message for="calItem3" display="icon"/>
		     </h:panelGrid>
		  
		   <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.remedy}">
			<p:outputLabel value="*" styleClass="mandatory" />
		    <p:outputLabel value="#{lbl['lbl.ct.tr.remenddt']}" />
		  </h:panelGrid>
          <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.remedy}">
             <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyEndDate}"
          		 readonlyInput="true" required="true" label="Remedy End Date"
                id="calItem4" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
             <p:message for="calItem4" display="icon"/>
            </h:panelGrid>
		  <p:spacer rendered="#{terminationBackingBean.managedBean.termination}" />
		  <p:spacer rendered="#{terminationBackingBean.managedBean.termination}" />                
		  
		   <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination}">
			<p:outputLabel value="*" styleClass="mandatory" />
		    <p:outputLabel value="#{lbl['lbl.ct.tr.lastremfileno']}" />
		  </h:panelGrid>
		  <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
           <p:inputText id="lastRemedyFileNo" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.lastRemedyFileNo}" 
             style="width:170px;" maxlength="100" required="true" label="Last Remedy File No">
              </p:inputText>
                <p:message for="lastRemedyFileNo" display="icon"/>
		  </h:panelGrid>
		 
		  <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination}">
			<p:outputLabel value="*" styleClass="mandatory" />
		   <p:outputLabel value="#{lbl['lbl.ct.tr.lastremnoticedt']}" />
		  </h:panelGrid>
		  
		   <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
              <p:calendar id="calItem6" size="24"  value="#{terminationBackingBean.managedBean.contractVer.ctTermination.lastRemedyDate}"
                showOn="button" readonlyInput="true" required="true" label="Last Remedy Notice Date"
                 pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
		         <p:message for="calItem6" display="icon"/>
		    </h:panelGrid>
		
		 <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination}">
			<p:outputLabel value="*" styleClass="mandatory" />
		  <p:outputLabel value="#{lbl['lbl.ct.tr.lastremstartdt']}" />
		</h:panelGrid>
		  <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
             <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}"
          		readonlyInput="true" required="true" label="Last Remedy Start Date"
                id="calItem7" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
		        <p:message for="calItem7" display="icon"/>
		 </h:panelGrid>
		
		 <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination}">
			<p:outputLabel value="*" styleClass="mandatory" />
		  <p:outputLabel value="#{lbl['lbl.ct.tr.lastremenddt']}" />
		 </h:panelGrid>
		  <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
             <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyEndDate}"
          		readonlyInput="true"  required="true" label="Last Remedy End Date" id="calItem8" size="24" 
          		showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/> 
		     <p:message for="calItem8" display="icon"/>
		   </h:panelGrid>
		 
		  <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination}">
			<p:outputLabel value="*" styleClass="mandatory" />
		  <p:outputLabel value="#{lbl['lbl.ct.tr.recomagency']}" />
		 </h:panelGrid>
		    <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
		       <p:inputText id="recomendAgency"  style="width:170px;" maxlength="255" required="true" label="Recommended Agency"
                 value="#{terminationBackingBean.managedBean.contractVer.ctTermination.recommendedAgency}"/>
                  <p:message for="recomendAgency" display="icon"/>
		     </h:panelGrid>
		     
		   <h:panelGrid columns="2" style="float:right;" rendered="#{terminationBackingBean.managedBean.termination}">
			<p:outputLabel value="*" styleClass="mandatory" />
		  <p:outputLabel value="#{lbl['lbl.ct.tr.recomagencydt']}" />
		 </h:panelGrid>
		    <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
              <p:calendar id="calItem9" size="24"  value="#{terminationBackingBean.managedBean.contractVer.ctTermination.recommendedAgencyDate}"
                  showOn="button" readonlyInput="true" required="true" label="Recommended Agency Date"
                  pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>		
                   <p:message for="calItem9" display="icon"/>  
		     </h:panelGrid>
		 </h:panelGrid>
         <p:spacer height="15"/>
         <h:panelGrid style="width:100%">
		   <p:dataTable id="terminationReason" var="data" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.ctTerminationReasons}" 
			 dynamic="true" rowKey="#{data}" selection="#{terminationBackingBean.selectedTerminationReasonsList}">
			 <ac:paginator for="terminationReason" />
			     <p:column selectionMode="multiple" style="width:1%;"/>  
		         <p:column style="width:24%;"  headerText="#{lbl['lbl.ct.tr.table.reason']}" >
		             <p:selectOneMenu value="#{data.reasonType.reasonId}" style="width:100%;">
                         <f:selectItems value="#{terminationBackingBean.getTerminationReasonDesc()}" />
               	     </p:selectOneMenu>
                 </p:column>
		        <p:column style="width:75%;" headerText="#{lbl['lbl.ct.tr.table.descp']}">
		           <p:inputText value="#{data.description}" style="width:98%;" maxlength="500"/>
		        </p:column> 
		   </p:dataTable>
		 </h:panelGrid>
		 <p:spacer height="2" />
		   <div class="ppRightBtn"> 
		      <p:commandButton value="#{lbl['lbl.btn.add']}"  process="@form" partialSubmit="true"
		         icon="ui-icon-add" action="#{terminationBackingBean.addTerminateReason()}" update="terminationReason"/>
		      <p:spacer width="2"/>
		        <p:commandButton value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" process="@form" onclick="dlgTerminationReason.show()">
			  </p:commandButton> 
	   	  </div>
	   	   <p:dialog id="dlgTerminationReason" widgetVar="dlgTerminationReason" header="Delete Confirmation" styleClass="screen-title"  
            resizable="false" modal="true" width="350" height="95">  
            <h:panelGrid columns="3">
               <p:graphicImage library="ep/images/design" name="exclamation.png"
			      value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
               <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" 
                  styleClass="ui-inputtextarea"></p:inputTextarea>
             </h:panelGrid>
             <div class="ppRightBtn">
		        <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.yes']}" icon="ui-icon-accept" update="terminationReason" process="@form" 
			      action="#{terminationBackingBean.deleteTerminateReason}" onclick="dlgTerminationReason.hide();"/>
			    <p:commandButton value="#{lbl['lbl.ct.dialong.cofirm.no']}" icon="ui-icon-reject" onclick="dlgTerminationReason.hide();" type="button" />
		    </div>
         </p:dialog>
     </p:panel>
	<p:dialog header="Notice" widgetVar="noticeDlg" modal="true" height="450" width="820" resizable="true">
		<p:editor controls="print" id="editorDisplay" value="#{terminationBackingBean.managedBean.editorValue}" width="800" height="430" />
	</p:dialog>
</ui:composition>
