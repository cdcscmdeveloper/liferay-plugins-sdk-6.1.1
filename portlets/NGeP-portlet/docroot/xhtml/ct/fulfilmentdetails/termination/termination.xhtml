<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true" collapsed="false" toggleSpeed="500">
		<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		   <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth15,columnWidth20,columnWidth20,columnWidth20">
		      <p:outputLabel id="cno" value="#{lbl['lbl.ct.cno']}" />
			  <p:inputText for="cno" value="#{terminationBackingBean.managedBean.ctContract.contractNo}" 
			     disabled="true" style="width:170px;" />
			  <p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physicalNo']}" />
		 	  <p:inputText for="physicalNo" value="#{terminationBackingBean.managedBean.ctContract.contractPhysicalNo}" style="width:170px;" disabled="true" />				
		      <p:outputLabel id="effectiveDate" value="#{lbl['lbl.ct.effectiveDate']}" />
			  <p:inputText for="effectiveDate" style="width:170px;" disabled="true"
				value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.contractVer.ctContractValue.effDate)}" />
			  <p:outputLabel id="edate" value="#{lbl['lbl.ct.edate']}" />
			  <p:inputText for="edate" style="width:170px;" disabled="true"
				value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.contractVer.ctContractValue.expDate)}" />
			  <p:outputLabel id="contractAmount" value="#{lbl['lbl.ct.contractAmount']}" />
			  <p:inputText for="contractAmount" styleClass="ppRightBtn" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				 disabled="true" style="width:170px;">
				   <f:convertNumber pattern="#,###.00"/>
			</p:inputText>	
			<p:outputLabel id="signBy" value="Signed Date"  rendered="#{terminationBackingBean.managedBean.ctContract.agreement}" />
			<p:inputText for="signBy" value="#{terminationBackingBean.convertTime(terminationBackingBean.managedBean.ctContract.currentAgreement.signedDate)}"
			   rendered="#{terminationBackingBean.managedBean.ctContract.agreement}" disabled="true" style="width:170px;"/>
			<h:outputLabel id="dperiod" value="#{lbl['lbl.ct.dperiod']}" rendered="#{!terminationBackingBean.managedBean.ctContract.zonalPricing}" />
			<h:panelGrid columns="3" rendered="#{!terminationBackingBean.managedBean.ctContract.zonalPricing}">
				<p:inputText for="dperiod" styleClass="ppRightBtn" size="23" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" 
					disabled="#{terminationBackingBean.managedBean.ctContract.zonalPricing}" />
				<p:spacer width="2"/>
				<p:outputLabel value="Days" />
			</h:panelGrid>	
			<f:verbatim rendered="#{terminationBackingBean.managedBean.ctContract.zonalPricing and !terminationBackingBean.managedBean.ctContract.agreement}"/>
			<f:verbatim rendered="#{terminationBackingBean.managedBean.ctContract.zonalPricing and !terminationBackingBean.managedBean.ctContract.agreement}"/>
			 <p:outputLabel id="astatus" value="Agreement Status" rendered="#{terminationBackingBean.managedBean.ctContract.agreement and 
			    !terminationBackingBean.managedBean.ctContract.zonalPricing}" />
			 <p:inputText for="astatus" style="width:170px;" disabled="true"
			   value="#{terminationBackingBean.getStatusDescById(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}"
			    rendered="#{terminationBackingBean.managedBean.ctContract.agreement and !terminationBackingBean.managedBean.ctContract.zonalPricing}"/>	<h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="Contract Title" />
			</div>
			</h:panelGroup>
		    <h:panelGrid>
			<p:inputTextarea id="contractName"
				value="#{terminationBackingBean.managedBean.ctContract.contractName}"
				required="false" rows="3" cols="31" disabled="true"
				autoResize="false" />	
			</h:panelGrid>	
			<p:outputLabel id="astatus1" value="Agreement Status" rendered="#{terminationBackingBean.managedBean.ctContract.agreement and 
			   terminationBackingBean.managedBean.ctContract.zonalPricing}" />
			<p:inputText for="astatus1" style="width:170px;" disabled="true" 
			  value="#{terminationBackingBean.getStatusDescById(terminationBackingBean.managedBean.ctContract.currentAgreement.status.statusId)}"
			 rendered="#{terminationBackingBean.managedBean.ctContract.agreement and terminationBackingBean.managedBean.ctContract.zonalPricing}" />
	    </h:panelGrid>
		<h:panelGrid  style="width:180px;">
		   <h:panelGrid columns="3">
			 <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.concession}" disabled="true">
			 </p:selectBooleanCheckbox>
			 <p:spacer width="2" />
			 <p:outputLabel value="Concession" />
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true"/>
		     <p:spacer width="2" />	
		     <p:outputLabel value="Fee Exemption"/>
		   </h:panelGrid>
		   <h:panelGrid columns="3">
		     <p:selectBooleanCheckbox 
			  value="#{terminationBackingBean.managedBean.ctContract.agreement}" disabled="true" />
		     <p:spacer width="2" />	
		     <p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
	       </h:panelGrid>	
	       <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox value="#{terminationBackingBean.managedBean.ctContract.mto}"
				 disabled="true" style="text-align:top;" />
			  <p:spacer width="2" />	
			  <p:outputLabel value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
		   </h:panelGrid>	
		   <h:panelGrid columns="3">
			  <p:selectBooleanCheckbox id="exemptId" value="#{terminationBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			     disabled="true" style="text-align:top;">
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <p:outputLabel value="AP201 Exemption" style="text-align:top;" />
		   </h:panelGrid>	
	    </h:panelGrid>
	</h:panelGrid>
 </p:panel>
    <p:panel id="terminateContract" header="#{lbl['lbl.ct.tr.panel.header']}" toggleable="true"  toggleSpeed="500">
       <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth15,columnWidth30,columnWidth25,columnWidth40">
          <p:outputLabel value="#{lbl['lbl.ct.tr.recom']}" />
          <h:panelGrid columns="3">
	          <p:selectOneMenu style="width:180px;"
	          	 disabled="#{terminationBackingBean.managedBean.contractVer.status.statusId==CtStatusConst.ftPendingLetterPrintAndUpdate}"
				 value="#{terminationBackingBean.managedBean.contractVer.ctTermination.decisionType.parameterId}">
				 <f:selectItems value="#{terminationBackingBean.getDropdownValues(ParameterTypeConst.terminationDecisionType)}" />
				 <p:ajax event="change" update=":form:terminateContract" process="@this"
						listener="#{terminationBackingBean.changeField}" />
			  </p:selectOneMenu>
			  <p:spacer width="2" />
			  <p:commandLink value="View Notice" update="editorDisplay" action="#{terminationBackingBean.previewNoticeAction}"
			  	rendered="#{terminationBackingBean.managedBean.termination || terminationBackingBean.managedBean.remedy || terminationBackingBean.managedBean.mutualTermination}" 
			  	oncomplete="noticeDlg.show()"/>
		  </h:panelGrid>
          <p:outputLabel value="Decision Date" />
          <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.decisionDate}" 
               id="calItem1" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
		  <p:outputLabel value="* File Ref. No." rendered="#{terminationBackingBean.managedBean.termination || terminationBackingBean.managedBean.remedy}"/>
		  <p:inputText value="#{terminationBackingBean.managedBean.contractVer.ctTermination.fileRefNo}" style="width:170px;"
               rendered="#{terminationBackingBean.managedBean.termination || terminationBackingBean.managedBean.remedy}"/>
		  <p:outputLabel value="* Termination Effective Date" rendered="#{terminationBackingBean.managedBean.remedy}"/>
          <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.terminationEffDate}"
          		rendered="#{terminationBackingBean.managedBean.remedy}" 
                id="calItem2" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>                              
		  <p:outputLabel value="* Remedy Start Date" rendered="#{terminationBackingBean.managedBean.remedy}"/>
          <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}"
          		rendered="#{terminationBackingBean.managedBean.remedy}" 
                id="calItem3" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
		  <p:outputLabel value="* Remedy End Date" rendered="#{terminationBackingBean.managedBean.remedy}"/>
          <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyEndDate}"
          		rendered="#{terminationBackingBean.managedBean.remedy}" 
                id="calItem4" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
		  <p:outputLabel value="* Last Remedy File No." rendered="#{terminationBackingBean.managedBean.termination}"/>
		  <p:inputText value="#{terminationBackingBean.managedBean.contractVer.ctTermination.lastRemedyFileNo}" style="width:170px;"
               rendered="#{terminationBackingBean.managedBean.termination}"/>
		  <p:outputLabel value="* Last Remedy Notice Date" rendered="#{terminationBackingBean.managedBean.termination}"/>
          <p:calendar id="calItem6" size="24"  value="#{terminationBackingBean.managedBean.contractVer.ctTermination.lastRemedyDate}"
              showOn="button" rendered="#{terminationBackingBean.managedBean.termination}" 
              pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
		  <p:spacer rendered="#{terminationBackingBean.managedBean.termination}" />
		  <p:spacer rendered="#{terminationBackingBean.managedBean.termination}" />
		  <p:outputLabel value="* Remedy Start Date" rendered="#{terminationBackingBean.managedBean.termination}"/>
          <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}"
          		rendered="#{terminationBackingBean.managedBean.termination}" 
                id="calItem7" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
		  <p:outputLabel value="* Remedy End Date" rendered="#{terminationBackingBean.managedBean.termination}"/>
          <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyEndDate}"
          		rendered="#{terminationBackingBean.managedBean.termination}" 
                id="calItem8" size="24" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/> 
		  <p:outputLabel value="* Recommended Agency" rendered="#{terminationBackingBean.managedBean.termination}"/>
		  <p:inputText value="#{terminationBackingBean.managedBean.contractVer.ctTermination.recommendedAgency}" style="width:170px;"
               rendered="#{terminationBackingBean.managedBean.termination}"/>
		  <p:outputLabel value="* Recommended Agency Date" rendered="#{terminationBackingBean.managedBean.termination}"/>
          <p:calendar id="calItem9" size="24"  value="#{terminationBackingBean.managedBean.contractVer.ctTermination.recommendedAgencyDate}"
              showOn="button" rendered="#{terminationBackingBean.managedBean.termination}" 
              pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>		  
		 </h:panelGrid>
         <p:spacer height="15"/>
         <h:panelGrid style="width:100%">
		   <p:dataTable id="terminationReason" var="data" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.ctTerminationReasons}" 
			 lazy="false" dynamic="true" rowKey="#{data}" selection="#{terminationBackingBean.selectedTerminationReasonsList}">
			 <ac:paginator for="terminationReason" />
			     <p:column selectionMode="multiple" style="width:1%;"/>  
		         <p:column style="width:24%;"  headerText="#{lbl['lbl.ct.tr.table.reason']}" >
		             <p:selectOneMenu value="#{data.reasonType.reasonId}" style="width:100%;">
                         <f:selectItems value="#{terminationBackingBean.getTerminationReasonDesc()}" />
               	     </p:selectOneMenu>
                 </p:column>
		        <p:column style="width:75%;" headerText="#{lbl['lbl.ct.tr.table.descp']}">
		           <p:inputText value="#{data.description}" style="width:98%;"/>
		        </p:column> 
		   </p:dataTable>
		 </h:panelGrid>
		 <p:spacer height="2" />
		   <div class="ppRightBtn"> 
		      <p:commandButton value="Add"  process="@form" partialSubmit="true"
		         icon="ui-icon-add" action="#{terminationBackingBean.addTerminateReason()}" update="terminationReason"/>
		      <p:spacer width="2"/>
		        <p:commandButton value="Delete" icon="ui-icon-delete" process="@form" onclick="dlgTerminationReason.show()">
			  </p:commandButton> 
	   	  </div>
	   	   <p:dialog id="dlgTerminationReason" widgetVar="dlgTerminationReason" header="Delete Confirmation" styleClass="screen-title"  
            resizable="false" modal="true" width="325" height="90">  
            <h:panelGrid columns="3">
               <p:graphicImage library="ep/images/design" name="exclamation.png"
			      value="/resources/ep/images/design/exclamation.png" styleClass="ui-icon-complain"></p:graphicImage>
			   <p:spacer width="10"/>
               <p:inputTextarea value="Are you sure you want to delete this record?"  rows="2" cols="48" 
                  styleClass="ui-inputtextarea"></p:inputTextarea>
             </h:panelGrid>
             <div class="ppRightBtn">
		        <p:commandButton value="Yes" icon="ui-icon-accept" update="terminationReason" process="@form" 
			      action="#{terminationBackingBean.deleteTerminateReason}" onclick="dlgTerminationReason.hide();"/>
			    <p:commandButton value="No" icon="ui-icon-reject" onclick="dlgTerminationReason.hide();" type="button" />
		    </div>
         </p:dialog>
     </p:panel>
	<p:dialog header="Notice" widgetVar="noticeDlg" modal="true" height="450" width="820" resizable="true">
		<p:editor controls="print" id="editorDisplay" value="#{terminationBackingBean.managedBean.editorValue}" width="800" height="430" />
	</p:dialog>
</ui:composition>
