<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <p:panel id="terminateContract" header="#{lbl['lbl.ct.panel.termination']}" toggleable="true"  toggleSpeed="500">
       <h:panelGrid columns="4" style="width:1050px;" styleClass="top-aligned-columns"
          columnClasses="columnWidth200">
              <p:outputLabel value="#{lbl['lbl.ct.termination.decision']}" styleClass="required" />
          <h:panelGrid columns="4">
	          <p:selectOneMenu id="menuSelectionId" required="true"  style="width:180px;" label="#{lbl['lbl.ct.termination.decision']}"
	          	 disabled="#{terminationBackingBean.managedBean.contractVer.status.statusId==CtStatusConst.ftPendingLetterPrintAndUpdate
	          	 or ctBackingBean.isApprover() or terminationBackingBean.managedBean.viewContract}"
				 value="#{terminationBackingBean.managedBean.contractVer.ctTermination.decisionType.parameterId}">
				 <f:selectItems value="#{terminationBackingBean.decisionTypeList}" />
				 <p:ajax event="change" update=":form:terminateContract" process="@this"
						listener="#{terminationBackingBean.changeField}" />
			  </p:selectOneMenu>
			  <p:message for="menuSelectionId" display="icon"/>
			  <p:spacer width="2" />
			  <p:commandLink value="#{lbl['lbl.ct.view.notice']}" update="editorDisplay" action="#{terminationBackingBean.previewNoticeAction}"
			  	rendered="#{terminationBackingBean.managedBean.termination || terminationBackingBean.managedBean.remedy || terminationBackingBean.managedBean.mutualTermination}" />
		  </h:panelGrid>
		  
		     <p:outputLabel value="#{lbl['lbl.ct.decision.date']}"  styleClass="required"/>
		   <h:panelGrid columns="2">
             <p:calendar value="#{terminationBackingBean.managedBean.contractVer.ctTermination.decisionDate}"
          		disabled="#{terminationBackingBean.managedBean.viewContract}"
          		readonlyInput="true" navigator="true"
                id="calItem1" size="12" showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>                              
		      <p:message for="calItem1" display="icon"/>
		   </h:panelGrid>
		  
		      <p:outputLabel value="#{lbl['lbl.ct.file.ref.no']}"  styleClass="required" 
		             rendered="#{terminationBackingBean.managedBean.termination || terminationBackingBean.managedBean.remedy || terminationBackingBean.managedBean.mutualTermination}"/>
		 <h:panelGrid columns="3" 
		      rendered="#{terminationBackingBean.managedBean.termination || terminationBackingBean.managedBean.remedy || terminationBackingBean.managedBean.mutualTermination}">
		    <p:inputText id="fileRefNum" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.fileRefNo}" 
		           disabled="#{terminationBackingBean.managedBean.viewContract}"
		           style="width:170px;" maxlength="100">
		     </p:inputText>
		     <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.file.ref.no']}" />
		     <p:message for="fileRefNum" display="icon"/>
		 </h:panelGrid>		 
		 
		      <p:outputLabel value="#{lbl['lbl.ct.copy.mutual.termination.agreement']}" style="padding-top:10px" 
		         styleClass="required"  rendered="#{terminationBackingBean.managedBean.mutualTermination}"  />
		     <h:panelGroup id="uploadTerminationPg" rendered="#{terminationBackingBean.managedBean.mutualTermination}">
				<p:commandButton 
					oncomplete="uploadTerminatinDlg.show();return false;"
					 icon="ui-icon-upload" immediate="true" disabled="#{terminationBackingBean.managedBean.viewContract}"
					rendered="#{terminationBackingBean.managedBean.contractVer.ctTermination.filePath == null}" />
				<h:commandLink
					title="#{terminationBackingBean.managedBean.contractVer.ctTermination.fileName}"
					value="#{terminationBackingBean.getShortFileName(terminationBackingBean.managedBean.contractVer.ctTermination.fileName)}"
					style="float:left;padding-top:10px" styleClass="blue_font"
					rendered="#{terminationBackingBean.managedBean.contractVer.ctTermination.filePath != null}"
					action="#{terminationBackingBean.downloadFile(terminationBackingBean.managedBean.contractVer.ctTermination.filePath, 
						terminationBackingBean.managedBean.contractVer.ctTermination.fileName)}" />
				<p:spacer width="3" />
						 <p:commandLink onclick="dlgAttachAgrementDoc.show();" style="margin-bottom:-5px;"
						        rendered="#{!terminationBackingBean.managedBean.viewContract and terminationBackingBean.managedBean.contractVer.ctTermination.filePath != null}">
			   				    <h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			        	     </p:commandLink>
		</h:panelGroup>
		
		   <p:outputLabel value="#{lbl['lbl.ct.remedy.start.date']}" styleClass="required" rendered="#{terminationBackingBean.managedBean.remedy}"  />
		  <h:panelGrid columns="2"  rendered="#{terminationBackingBean.managedBean.remedy}">
                <p:calendar id="calItem3"  readonlyInput="true" navigator="true"
                    disabled="#{terminationBackingBean.managedBean.viewContract}"
                    value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}" size="12"
                     showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
                    <p:ajax event="dateSelect" update=":form:calItem4" process="@this" />
                </p:calendar>
                <p:message for="calItem3" display="icon"/>
		  </h:panelGrid>
		  
		  
		   <p:spacer rendered="#{terminationBackingBean.managedBean.remedy}" />
		  <p:spacer rendered="#{terminationBackingBean.managedBean.remedy}" />       	
	     
		       <p:outputLabel value="#{lbl['lbl.ct.remedy.end.date']}"  styleClass="required" 
		               rendered="#{terminationBackingBean.managedBean.remedy}"/>
		  <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.remedy}">
             <p:calendar id="calItem4"  readonlyInput="true" navigator="true"
                 disabled="#{terminationBackingBean.managedBean.viewContract}"
                 value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyEndDate}"
          		 mindate="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}"  size="12" 
                 showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
                 <f:attribute name="startDate" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}" />
                 <f:validator validatorId="primeDateRangeValidator" />
             </p:calendar>
             <p:message for="calItem4" display="icon"/>
          </h:panelGrid>
          
          <p:outputLabel value="#{lbl['lbl.ct.last.remedy.notice.date']}" 
		        styleClass="required"  rendered="#{terminationBackingBean.managedBean.termination}" />
		   <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
              <p:calendar id="calItem6" size="12"  value="#{terminationBackingBean.managedBean.contractVer.ctTermination.lastRemedyDate}"
                disabled="#{terminationBackingBean.managedBean.viewContract}"
                showOn="button" readonlyInput="true" navigator="true"
                 pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>
		         <p:message for="calItem6" display="icon"/>
		    </h:panelGrid>
	
		    <p:outputLabel value="#{lbl['lbl.ct.last.remedy.file.no']}"  styleClass="required"  rendered="#{terminationBackingBean.managedBean.termination}" />
		  <h:panelGrid columns="3" rendered="#{terminationBackingBean.managedBean.termination}">
           <p:inputText id="lastRemedyFileNo" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.lastRemedyFileNo}" 
             disabled="#{terminationBackingBean.managedBean.viewContract}"
             style="width:170px;" maxlength="100">
              </p:inputText>
              <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.remedy.file.ref.no']}" />
                <p:message for="lastRemedyFileNo" display="icon"/>
		  </h:panelGrid>
		 
		    <p:outputLabel value="#{lbl['lbl.ct.last.remedy.start.date']}" styleClass="required" rendered="#{terminationBackingBean.managedBean.termination}"  />
		    <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
              <p:calendar  id="calItem7" readonlyInput="true" navigator="true"
          		  disabled="#{terminationBackingBean.managedBean.viewContract}"
          		  value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}"  size="12" 
          		  showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
                  <p:ajax event="dateSelect" update=":form:calItem8" process="@this" />
             </p:calendar>
		     <p:message for="calItem8" display="icon"/>
		 </h:panelGrid>
		 
		  <p:outputLabel value="#{lbl['lbl.ct.recommended.agency.date']}"  styleClass="required" rendered="#{terminationBackingBean.managedBean.termination}" />
		    <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
              <p:calendar id="calItem9" size="12"  value="#{terminationBackingBean.managedBean.contractVer.ctTermination.recommendedAgencyDate}"
                  disabled="#{terminationBackingBean.managedBean.viewContract}"
                  showOn="button" readonlyInput="true" navigator="true"
                  pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"/>		
                   <p:message for="calItem9" display="icon"/>  
		     </h:panelGrid>
		
		   <p:outputLabel value="#{lbl['lbl.ct.last.remedy.end.date']}"  styleClass="required" rendered="#{terminationBackingBean.managedBean.termination}"  />
		  <h:panelGrid columns="2" rendered="#{terminationBackingBean.managedBean.termination}">
             <p:calendar id="calItem8" readonlyInput="true"
                 disabled="#{terminationBackingBean.managedBean.viewContract}"
                 value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyEndDate}" navigator="true"
                 mindate="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}" size="12" 
          		showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
          		 <f:attribute name="startDate" value="#{terminationBackingBean.managedBean.contractVer.ctTermination.remedyStartDate}" />
                 <f:validator validatorId="primeDateRangeValidator" />
             </p:calendar> 
		     <p:message for="calItem8" display="icon"/>
		   </h:panelGrid>
		    
		   <p:outputLabel value="#{lbl['lbl.ct.recommended.agency']}"   styleClass="required" rendered="#{terminationBackingBean.managedBean.termination}"  />
		    <h:panelGrid columns="4" rendered="#{terminationBackingBean.managedBean.termination}">
		       <p:inputTextarea id="recomendAgency" rows="3"  style="width:170px;" 
					autoResize="false" maxlength="255"
                 	disabled="true"
                 	value="#{terminationBackingBean.managedBean.contractVer.ctTermination.recommendedAgency}"/>
                 	<p:spacer width="3" />
					<p:commandLink action="#{terminationBackingBean.resetSearchAgency()}" 
						disabled="#{terminationBackingBean.managedBean.viewContract}"
						process="@this"	update=":form:searchAgencyPanel" oncomplete="searchAgencyDlg.show();">
					<p:graphicImage value="/css/images/design/ico-search.png" /></p:commandLink>
                  <p:message for="recomendAgency" display="icon"/>
		     </h:panelGrid>
		     
		 </h:panelGrid>
         <p:spacer height="15"/>
         <h:panelGrid style="width:100%">
         	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.termination.clause']}" escape="false"/><br/>      
		   <p:dataTable id="terminationReason" var="data" widgetVar="terminationReasonWidget"
		             value="#{terminationBackingBean.managedBean.contractVer.ctTermination.ctTerminationReasons}" 
			         dynamic="true" rowKey="#{data}" selection="#{terminationBackingBean.selectedTerminationReasonsList}">
			               <ac:paginator for="terminationReason" />
			                <p:column
			                    style="width:3%;" rendered="#{!terminationBackingBean.managedBean.viewContract}">  
				                      <f:facet name="header">
							                <p:selectBooleanCheckbox id="checkBoxAll" value="#{terminationBackingBean.managedBean.selectAll}">
								               <p:ajax partialSubmit="true" process="@this"
									               update=":form:terminationReason,:form:terReasonDelBtn" listener="#{terminationBackingBean.selectAllTermination}" />
							               </p:selectBooleanCheckbox>
						                  </f:facet>
		           
		                                 <p:selectBooleanCheckbox 
		                                     value="#{data.selectedCheckBox}" styleClass="myCustomChekBox">
		           		                    <p:ajax event="change" partialSubmit="true" process="@this"
		           		                        update=":form:terminationReason,:form:terReasonDelBtn" listener="#{terminationBackingBean.selectOneTerminationCheckbox}"></p:ajax>
			                             </p:selectBooleanCheckbox>
			                      </p:column>
			            
		                     <p:column style="width:35%;">
		                           <f:facet name="header">
					                     <h:outputText value="* " styleClass="mandatory" rendered="#{!terminationBackingBean.managedBean.mutualTermination}" />
					                     <h:outputText value="#{lbl['lbl.ct.clause.no']}" />
				                  </f:facet>
		                          <p:inputTextarea id="cluseId" value="#{data.clauseNo}"  rows="2" 
		                                disabled="#{terminationBackingBean.managedBean.viewContract}" autoResize="false"
		                                onkeyup="limitTextArea(this,200);" onkeydown="limitTextArea(this,200);" style="width:95%;" />
                            </p:column>
		     
		                    <p:column  style="width:65%;">
		                          <f:facet name="header">
					                    <h:outputText value="* " styleClass="mandatory" rendered="#{!terminationBackingBean.managedBean.mutualTermination}" />
					                    <h:outputText value="#{lbl['lbl.ct.termination.desc']}"  />
				                  </f:facet>
		                          <p:inputTextarea id="descId" value="#{data.description}" rows="2" 
		                               disabled="#{terminationBackingBean.managedBean.viewContract}" autoResize="false"
		                               onkeyup="limitTextArea(this,500);" onkeydown="limitTextArea(this,500);" style="width:95%;" />
		                      </p:column> 
		            </p:dataTable>
		      </h:panelGrid>
		      <div class="ppRightBtn"> 
		             <p:commandButton value="#{lbl['lbl.btn.add']}"  
		      	            rendered="#{!terminationBackingBean.managedBean.viewContract}" partialSubmit="true"
		                    action="#{terminationBackingBean.addTerminateReason()}" update="terminationReason" process="@form"
		                    oncomplete="terminationReasonWidget.paginator.endLink.click();" />
		                    <p:spacer width="2"/>
		              <p:commandButton id="terReasonDelBtn" value="#{lbl['lbl.ct.delete']}"  process="@this" partialSubmit="true"
		                      disabled="#{terminationBackingBean.managedBean.buttonHideActive}"
                            onsuccess="dlgTerminationReason.show()" rendered="#{!terminationBackingBean.managedBean.viewContract}">
			          </p:commandButton> 
	   	     </div>
	   	     <p:confirmDialog id="dlgTerminationReason" widgetVar="dlgTerminationReason"  appendToBody="true" 
	   	           message="#{lbl['lbl.msg.confirm.delete']}" 	severity="alert"  closable="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
			       <div class="ppRightBtn">
				         <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"
					             partialSubmit="true"  update=":form:terminationReason, :form:terReasonDelBtn"
					             action="#{terminationBackingBean.deleteTableRow()}"
					             oncomplete="dlgTerminationReason.hide();" />
				          <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgTerminationReason.hide();" />	
			       </div>
			</p:confirmDialog>
			
			 <p:confirmDialog id="delAttachAgrementDoc" widgetVar="dlgAttachAgrementDoc"  appendToBody="true" 
	   	           message="#{lbl['lbl.msg.confirm.delete']}" 	severity="alert"  closable="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
			       <div class="ppRightBtn">
				         <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"
					             partialSubmit="true"  update=":form:uploadTerminationPg,:form:uploadTerminatinDlg"
					             action="#{terminationBackingBean.deleteAttachAgrementDoc()}"
					             oncomplete="dlgAttachAgrementDoc.hide();" />
				          <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgAttachAgrementDoc.hide();" />	
			       </div>
			</p:confirmDialog>
     </p:panel>
	
	<p:dialog header="#{lbl['lbl.ct.notice']}" widgetVar="noticeDlg" modal="true" height="450" width="820" styleClass="pop_up_top">
		<p:editor controls="print" id="editorDisplay" value="#{terminationBackingBean.managedBean.editorValue}" width="800" height="430" />
	</p:dialog>
	<p:dialog id="uploadTerminatinDlg" widgetVar="uploadTerminatinDlg"
		modal="true" width="700px" height="350px" resizable="false"
		styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}"
		onShow="singleUploadListener(terminationUploadWV);">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" dragDropSupport="false"
		    sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" showButtons="false"
			fileUploadListener="#{terminationBackingBean.fileUpload}" multiple="false"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" widgetVar="terminationUploadWV"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}" 
			update=":form:uploadTerminationPg" label="#{lbl['lbl.btn.choose']}">
		</p:fileUpload>
		<f:facet name="footer">
		<div class="ppRightBtn">
	    	<p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadTerminatinDlg.hide();" />
  		</div>
  		</f:facet>
	</p:dialog>
	<p:dialog id="searchAgencyDlg"  header="#{lbl['lbl.lov.listing']} - #{lbl['lbl.ct.recommended.agency']}" widgetVar="searchAgencyDlg" 
		styleClass="pop_up_top" modal="true" width="700" height="500">
		<p:panel id="searchAgencyPanel">
		<p:panel header="#{lbl['lbl.btn.search']}" toggleable="true">
			<h:panelGrid columns="3">
          		<p:selectOneMenu id="ptjCodeName" 
             		value="#{terminationBackingBean.managedBean.ptjCodeName}"  style="width:150px;">
           			<f:selectItem itemLabel="#{lbl['lbl.ct.ptj.code']}" itemValue="#{CtConst.ptjCode}"/>
            		<f:selectItem itemLabel="#{lbl['lbl.ct.ptj.name']}" itemValue="#{CtConst.ptjName}"/>
      			</p:selectOneMenu>
				<p:spacer height="1"/>
             	<p:inputText id="ptjCodeNameValue"  style="width:300px;" 
            		value="#{terminationBackingBean.managedBean.ptjCodeNameSearchValue}">
         		</p:inputText>
			</h:panelGrid>
			<div class="ppRightBtn">
     			<p:commandButton id="searchBtn" value="#{lbl['lbl.btn.search']}" update=":form:tableAgency, selectBtn"  
       		 		action="#{terminationBackingBean.searchRecommendedAgency}" 
       				onstart="blkAgencyTable.show();" oncomplete="blkAgencyTable.hide();" /> 
				<p:commandButton id="resetBtn" value="#{lbl['lbl.ct.reset']}" process="@this"
					action="#{terminationBackingBean.resetSearchAgency}" update=":form:searchAgencyPanel"   />
			</div>
			<p:spacer height="2"/>
		</p:panel>
		<p:panel header="#{lbl['lbl.ct.search.result']}" toggleable="true">
	     	<p:dataTable id="tableAgency"  value="#{terminationBackingBean.agencyDataModel}" 
	       		rowIndexVar="rowIndex" var="agencyVar" rowKey="#{agencyVar}" 
	       		selectionMode="single" lazy="true"
	       		selection="#{terminationBackingBean.selectedRecommendedAgency}" >
	        	<p:ajax event="rowSelect" update="@([id$=selectBtn])" />     
	        	<ac:paginator for="tableAgency"/>
				<p:column headerText="#{lbl['lbl.ct.ptj.code']}">
	      			#{agencyVar.orgProfile.orgCode}
				</p:column>
	   			<p:column headerText="#{lbl['lbl.ct.ptj.name']}" >
	       			#{agencyVar.orgProfile.orgName}
				</p:column>
		 	</p:dataTable>
	 	</p:panel>
		<p:blockUI widgetVar="blkAgencyTable" trigger="searchBtn"  block=":form:searchAgencyPanel">  
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>  
		</p:blockUI> 
		<f:facet name="footer">
			<h:panelGrid columns="1"  style="float:right;height:100px;vertical-align: middle;">
				<p:commandButton id="selectBtn" value="#{lbl['lbl.btn.select']}" process="@form" update=":form:recomendAgency" 
					disabled="#{terminationBackingBean.selectedRecommendedAgency == null}"
					action="#{terminationBackingBean.setSelectedRecommendedAgency}" onclick="searchAgencyDlg.hide();"/>
			</h:panelGrid>
		</f:facet>
 		</p:panel>
	</p:dialog>
</ui:composition>
