<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true"  toggleSpeed="500">
		<h:panelGrid columns="5" style="width:100%" columnClasses="columnWidth15">
			<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
			<p:inputText value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}" style="width:170px;" disabled="true" />
			<p:outputLabel value="#{lbl['lbl.ct.physicalNo']}" />
			<p:inputText value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}" style="width:170px;" disabled="true" />				
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="false" disabled="false" />
				<p:spacer width="2" />
				<p:outputLabel value="Concession" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.effectiveDate']}" />
			<h:inputText style="width:130px;" disabled="true"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate}" >
				<f:convertDateTime pattern="dd/MM/yyyy"></f:convertDateTime>
				</h:inputText>
			<p:outputLabel value="#{lbl['lbl.ct.edate']}" />
			<h:inputText style="width:130px;" disabled="true"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate}" >
				<f:convertDateTime pattern="dd/MM/yyyy"></f:convertDateTime>
				</h:inputText>
			
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox value="true" disabled="true" />
				<p:spacer width="2" />	
				<p:outputLabel value="Exempted" />
			</h:panelGrid>
			
				<p:outputLabel value="#{lbl['lbl.ct.contractAmount']}" />
			<p:inputText value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				 disabled="true" style="width:130px;"  styleClass="ppRightBtn">
				  <f:convertNumber pattern="#,###.00" />
				 </p:inputText>	
				 <p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
		    	<p:inputText style="width:130px;" disabled="true" 
				    value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.loaNo}" />	
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.agreement}" disabled="true" />
				<p:spacer width="2" />	
				<p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
			</h:panelGrid>
			 <p:outputLabel value="Supplier Name" />  
              <p:inputText value="KHAI SDN BHD" disabled="true" style="width:170px;"/> 	
			
			 <p:outputLabel value="#{lbl['lbl.ct.dperiod']}" />
			<h:panelGrid columns="2">
				<p:inputText size="8" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" disabled="true"/>
				<p:outputLabel value="Days" />
			</h:panelGrid>	
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.mto}"
					disabled="true" style="text-align:top;" />
				<p:spacer width="2" />	
				<p:outputLabel value="#{lbl['lbl.ct.mto']}" style="text-align:top;" />
			</h:panelGrid>		
			 <h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="Contract Title" />
			</div>
			</h:panelGroup>
			 <h:panelGrid>
			<h:inputTextarea id="contractName"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.contractName}"
				required="false" rows="3" cols="35" disabled="true"
				autoResize="false" />	
			</h:panelGrid>		
			<f:verbatim /><f:verbatim /> <f:verbatim /><f:verbatim /><f:verbatim />
			
			<h:outputLabel
				rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				value="#{lbl['lbl.ct.circularNo']}" />
			<p:commandLink
				rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				style="margin-right:20px;" ajax="false">
				<h:outputText
					value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo}"
					styleClass="linkcommand" />
			</p:commandLink>
		</h:panelGrid>
	</p:panel>
    <p:panel id="terCont" header="#{lbl['lbl.ct.tr.panel.header']}" toggleable="true"  toggleSpeed="500">
        <table style="width: 100%">
            <tr>
               <td style="width:115px;"> <p:outputLabel  value="#{lbl['lbl.ct.tr.recom']}"/>  </td>
               <td> <p:selectOneMenu value="#{contractDetailsBackingBean.managedBean.termination.caRecommendation.code}" style="width:180px;">
                  <f:selectItems value="#{contractDetailsBackingBean.getDropdownValues(PmCodeCatConst.ctTerminationRecommendType)}" />
            	   <p:ajax event="change" update=":form:tabview" listener="#{contractDetailsBackingBean.changeField}" process="@this"/>  
               </p:selectOneMenu>   </td>
               </tr> 
                 <tr><td><p:spacer height="2"/></td></tr>
               <tr>
                    <td style="width:115px;"><p:outputLabel value="Disciplinary Action"/>  </td>
                    <td><p:selectBooleanCheckbox value="#{contractDetailsBackingBean.managedBean.disciplinaryAction}">
                         <p:ajax event="change" update=":form:tabview" listener="#{contractDetailsBackingBean.ChkDisciplinaryAction}" process="@this"/> 
                        </p:selectBooleanCheckbox>
               </td> 
            </tr>
            </table>
             <p:spacer height="2"/>
             <p:outputPanel rendered="#{contractDetailsBackingBean.managedBean.disciplinaryValue}">
               <table style="width: 100%">
               <tr>
                   <td style="width:115px;"> <p:outputLabel value="Supplier Name" /></td>
			       <td>   <p:inputText  style="width:170px;" disabled="true" /></td>
			       <td>   <p:outputLabel value="Complaint Type" /></td>
			       <td>   <p:inputText value="Breach The Obligation Of Tender / Contract" style="width:220px;" disabled="true"/> </td>
                          <td style="width:110px;"><f:verbatim></f:verbatim></td>
                  </tr>
                  </table>
                  <h:panelGrid columns="2">
                   <h:panelGroup>
		                <div style="height:90px;width:115px; vertical-align: top;">
			               <p:outputLabel for="complaintDesc" value="Complaint Details" />
			            </div>
			       </h:panelGroup>
			       <h:panelGrid>
			       <h:inputTextarea id="complaintDesc"
				             value=" " rows="7" cols="110" disabled="false" autoResize="false" />	
			</h:panelGrid>		
           </h:panelGrid>       
		</p:outputPanel>
       <p:spacer height="10"/>
       <h:panelGrid style="width:100%">
			<p:dataTable id="dataTable" var="data" value="#{contractDetailsBackingBean.managedBean.termination.ctTerminationReasons}" rowIndexVar="index" 
			  widgetVar="dataTableObj" lazy="false" dynamic="true" 
			  emptyMessage="No Records!">
			   <p:columnGroup type="header"> 
				<p:row> 
				  <p:column style="width:200px;" headerText="#{lbl['lbl.ct.tr.table.reason']}"  /> 
				  <p:column style="width:480px;" headerText="#{lbl['lbl.ct.tr.table.descp']}" /> 
				  <p:column style="width:50px;" headerText="#{lbl['lbl.ct.tr.table.action']}" /> 
				</p:row>							
				</p:columnGroup>
				<p:column>  
				   <p:selectOneMenu   style="width:170px;">
                    <f:selectItems value="#{contractDetailsBackingBean.getDropdownValues(PmCodeCatConst.ctTerminationReasonType)}" />
               	  </p:selectOneMenu> 
            	</p:column>	
				<p:column> <p:inputText value="#{data.description}" style="width:430px;"/>
				</p:column> 	
				<p:column styleClass="column-align-center">
				 <p:commandLink partialSubmit="true" process="@this"  onsuccess="confirmation.show()">
				   <f:setPropertyActionListener value="#{data}" target="#{contractDetailsBackingBean.managedBean.terminationReason}" />
			       <p:graphicImage library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" title="Delete" />
			</p:commandLink>
				</p:column>						
		    </p:dataTable>
		 </h:panelGrid>
		 <h:panelGrid style="width:100%" columnClasses="column-align-right">
			<p:commandButton value="Add"  process="@this" partialSubmit="true" icon="ui-icon-add" 
			   action="#{contractDetailsBackingBean.addTerminateReason()}" update="dataTable"/>
		  </h:panelGrid>
		  <p:confirmDialog message="Do you want to delete the record?"  closable="true" appendToBody="true" header="Delete Confirmation"
			   severity="alert" widgetVar="confirmation">
                 <h:panelGrid columns="2">
				 <p:commandButton value="Yes" update="dataTable" partialSubmit="true" process="@this"
				    onclick="confirmation.hide();" actionListener="#{contractDetailsBackingBean.deleteTerminateReason()}"/>
				  <p:commandButton value="No" 	onclick="confirmation.hide()" type="button" />
				</h:panelGrid>
			</p:confirmDialog>
		</p:panel>      
</ui:composition>
