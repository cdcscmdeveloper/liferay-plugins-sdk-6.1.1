<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel id="qtnTenderPnl" header="Procurement Details" toggleable="true"  toggleSpeed="500">
		<h:panelGrid columns="4" style="width:100%" columnClasses="columnWidth15,columnWidth30,columnWidth30,columnWidth30">
			<p:outputLabel value="Procurement Mode" />
		    <p:inputText  style="width:170px;" disabled="true"
		      value="#{contractDetailsBackingBean.getParameterDesc(contractDetailsBackingBean.managedBean.contractVer.ctContract.procurementMode)}" />
		    
			<p:outputLabel value="Published Date" rendered="#{!contractDetailsBackingBean.managedBean.directPurchase}"/>
			<p:inputText style="width:170px;" disabled="true" rendered="#{!contractDetailsBackingBean.managedBean.directPurchase}"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.publishDate}">
				<f:convertDateTime pattern="MM/dd/yyyy" />
			</p:inputText>			
			<p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
			<p:inputText style="width:170px;" disabled="true" 
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.loaNo}" />
			<p:outputLabel value="LOA Acknowledged Date" />
			<p:inputText style="width:170px;" disabled="true"
				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.ackDate}" >
				<f:convertDateTime pattern="MM/dd/yyyy" />
			</p:inputText>	
			<p:outputLabel value="#{lbl['lbl.ct.fulfilmentType']}" />
			<p:inputText style="width:170px;" disabled="true"  value="#{contractDetailsBackingBean.getParameterDesc(contractDetailsBackingBean.managedBean.contractVer.ctContract.fulfillmentType)}" />			
			<p:outputLabel value="#{lbl['lbl.ct.sfee']}" />
			<h:panelGrid columns="2">
			<p:inputText styleClass="ppRightBtn" value="#{contractDetailsBackingBean.validateServiceFee(contractDetailsBackingBean.managedBean.contractVer.ctContract.serviceFee)}"
				style="width:160px;" disabled="true" />	
				<p:outputLabel value="%" />
		</h:panelGrid>		
		</h:panelGrid>
		</p:panel>
</ui:composition>
