<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>   
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/fulfilmentdetails/shared/sidemenu/creation.xhtml" />
	</ui:define>
	<ui:define name="content">
	<p:panel id="pRightPanel">
	   <div class="ppRightBtn">
		<p:commandButton id="ctSave" value="#{lbl['lbl.ct.btn.save']}"/>
		<p:commandButton id="ctSubmit" value="#{lbl['lbl.ct.btn.submit']}"/>
	   </div>
	</p:panel>
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true"  toggleSpeed="500" widgetVar="panelfd">
	<ui:include src="/xhtml/ct/fulfilmentdetails/shared/fulfilment.xhtml"/>
    </p:panel>                       
    <p:panel id="sbd" header="#{lbl['lbl.ct.su.panel.name']}"  toggleable="true"  toggleSpeed="500" widgetVar="panelsbd">
    <ui:include src="/xhtml/ct/fulfilmentdetails/shared/supplier.xhtml"/>            
    </p:panel>
    <p:panel id="factoringId" header="#{lbl['lbl.ct.fc.panel.name']}"    toggleable="true"  toggleSpeed="500" widgetVar="panelfactoring">
    <ui:include src="/xhtml/ct/fulfilmentdetails/shared/factoring.xhtml"/>             
    </p:panel>
    <p:panel id="bondId" header="#{lbl['lbl.ct.pbd.panel.name']}" toggleable="true"  toggleSpeed="500" widgetVar="panelbond">
    <ui:include src="/xhtml/ct/fulfilmentdetails/shared/performanceBond.xhtml"/>                             
    </p:panel>
    <p:panel id="mtoIds" header="#{lbl['lbl.ct.mto.panel.name']}"   rendered="#{contractDetailsBackingBean.managedBean.checkBoxSelections.checkedMto}"  
    toggleable="true"  toggleSpeed="500" widgetVar="panelmto">
    <ui:include src="/xhtml/ct/fulfilmentdetails/shared/mto.xhtml"/>                               
  </p:panel>
 </ui:define>
</ui:composition>
