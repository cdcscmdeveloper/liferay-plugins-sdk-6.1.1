<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
	  <style>
      .column-align-center { text-align: center !important;}
      .top-aligned-columns td{ vertical-align: top;}
      #dlgDel .ui-dialog .ui-dialog-titlebar {
         display:none !important;}
    </style> 
		<p:panel>
			<f:event listener="#{contractDetailsBackingBean.preRenderView}"  type="preRenderView"  />	
			<p:messages id="messages" showSummary="false" showDetail="true"  autoUpdate="true" closable="true" severity="error, info" />
			<p:tooltip global="true" position="left center" targetPosition="right center" forSelector=".ui-state-error"/>
	    	<ui:include src="fulfilmentButtons.xhtml" />
		    <ui:include src="fulfilmentHeader.xhtml" />	
		</p:panel>
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		  <tr>
			<td width="20%" valign="top">
				<p:tabMenu id="menuTabId" styleClass="sidemenu"  
					activeIndex="#{contractDetailsBackingBean.managedBean.selectedTabIndex}">
					<c:choose>
			          <c:when test="#{contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
				          <p:menuitem value="#{lbl['lbl.ct.menu.fd']}" update=":form"
					           action="#{contractDetailsBackingBean.setSelectedTabValue(0)}"  />
					      <p:menuitem value="#{lbl['lbl.ct.menu.item']}" update=":form" 
					        action="#{contractDetailsBackingBean.setSelectedTabValue(1)}"/>
					     <c:choose>
					       <c:when test="#{contractDetailsBackingBean.managedBean.ctContract.factored}">
					         <p:menuitem value="Factoring" update=":form" 
					           action="#{contractDetailsBackingBean.setSelectedTabValue(2)}"  
					       rendered="#{contractDetailsBackingBean.managedBean.ctContract.factored}"/>
					       <p:menuitem value="#{lbl['lbl.ct.menu.sett']}" update=":form" 
					         action="#{contractDetailsBackingBean.setSelectedTabValue(3)}"/>
			            </c:when>
					  <c:otherwise>
					  <p:menuitem value="#{lbl['lbl.ct.menu.sett']}" update=":form" 
					     action="#{contractDetailsBackingBean.setSelectedTabValue(2)}"/>
			          </c:otherwise>
			          </c:choose>
			        </c:when>
			      <c:otherwise>
			       <c:when test="#{contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
			          <p:menuitem value="#{lbl['lbl.ct.menu.fd']}" update=":form"
                        action="#{contractDetailsBackingBean.setSelectedTabValue(0)}">
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.ct.menu.agency']}" update=":form"
					     action="#{contractDetailsBackingBean.setSelectedTabValue(1)}">
					</p:menuitem>
					 <c:choose>
					   <c:when test="#{contractDetailsBackingBean.managedBean.ctContract.zonalPricing}">
					       <p:menuitem value="#{lbl['lbl.ct.menu.zone']}" update=":form" 
					          action="#{contractDetailsBackingBean.setSelectedTabValue(2)}"/>
					        <p:menuitem value="#{lbl['lbl.ct.menu.item']}" update=":form"
					           action="#{contractDetailsBackingBean.setSelectedTabValue(3)}"/>
					        <p:menuitem value="#{lbl['lbl.ct.menu.dedu']}" update=":form" 
					          action="#{contractDetailsBackingBean.setSelectedTabValue(4)}"/>
					        <p:menuitem value="#{lbl['lbl.ct.menu.sched']}" update=":form" 
					          action="#{contractDetailsBackingBean.setSelectedTabValue(5)}"/>
					        <c:choose>
					            <c:when test="#{contractDetailsBackingBean.managedBean.ctContract.factored and !contractDetailsBackingBean.managedBean.flgPaymentTracking}">
					              <p:menuitem value="Factoring" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(6)}"/>
					               <p:menuitem value="#{lbl['lbl.ct.menu.sett']}" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(7)}"/>
					            </c:when>
					             <c:when test="#{!contractDetailsBackingBean.managedBean.ctContract.factored and contractDetailsBackingBean.managedBean.flgPaymentTracking}">
					                <p:menuitem value="Advanced Payment Tracking" update=":form"  action="#{contractDetailsBackingBean.setSelectedTabValue(6)}"/>
					               <p:menuitem value="#{lbl['lbl.ct.menu.sett']}" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(7)}"/>
					            </c:when>
					            <c:when test="#{contractDetailsBackingBean.managedBean.ctContract.factored and contractDetailsBackingBean.managedBean.flgPaymentTracking}">
					             <p:menuitem value="Factoring" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(6)}"/>
					               <p:menuitem value="Advanced Payment Tracking" update=":form"  action="#{contractDetailsBackingBean.setSelectedTabValue(7)}"/>
					               <p:menuitem value="#{lbl['lbl.ct.menu.sett']}" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(8)}"/>
					           </c:when>
					            <c:when test="#{!contractDetailsBackingBean.managedBean.ctContract.factored and !contractDetailsBackingBean.managedBean.flgPaymentTracking}">
					               <p:menuitem value="#{lbl['lbl.ct.menu.sett']}" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(6)}"/>
					           </c:when>
					      </c:choose>
					  </c:when>
					   <c:otherwise>
					       <p:menuitem value="#{lbl['lbl.ct.menu.item']}" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(3)}"/>
					       <p:menuitem value="#{lbl['lbl.ct.menu.dedu']}" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(4)}"/>
					       <p:menuitem value="#{lbl['lbl.ct.menu.sched']}" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(5)}"/>
					       <c:choose>
					            <c:when test="#{contractDetailsBackingBean.managedBean.ctContract.factored and !contractDetailsBackingBean.managedBean.flgPaymentTracking}">
					              <p:menuitem value="Factoring" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(6)}"/>
					               <p:menuitem value="#{lbl['lbl.ct.menu.sett']}" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(7)}"/>
					            </c:when>
					             <c:when test="#{!contractDetailsBackingBean.managedBean.ctContract.factored and contractDetailsBackingBean.managedBean.flgPaymentTracking}">
					                <p:menuitem value="Advanced Payment Tracking" update=":form"  action="#{contractDetailsBackingBean.setSelectedTabValue(6)}"/>
					               <p:menuitem value="#{lbl['lbl.ct.menu.sett']}" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(7)}"/>
					            </c:when>
					            <c:when test="#{contractDetailsBackingBean.managedBean.ctContract.factored and contractDetailsBackingBean.managedBean.flgPaymentTracking}">
					             <p:menuitem value="Factoring" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(6)}"/>
					               <p:menuitem value="Advanced Payment Tracking" update=":form"  action="#{contractDetailsBackingBean.setSelectedTabValue(7)}"/>
					               <p:menuitem value="#{lbl['lbl.ct.menu.sett']}" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(8)}"/>
					           </c:when>
					            <c:when test="#{!contractDetailsBackingBean.managedBean.ctContract.factored and !contractDetailsBackingBean.managedBean.flgPaymentTracking}">
					               <p:menuitem value="#{lbl['lbl.ct.menu.sett']}" update=":form" action="#{contractDetailsBackingBean.setSelectedTabValue(6)}"/>
					           </c:when>
					      </c:choose>
					   </c:otherwise>
				</c:choose>
				</c:when>
              </c:otherwise>
             </c:choose>
		    </p:tabMenu>
			</td>
			<td width="80%">
			      <p:outputPanel rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 0}">
				   <p:outputPanel rendered="#{contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
		 	          <ui:include src="/xhtml/ct/fulfilmentdetails/shared/fulfilmentDetails.xhtml"/>
		 	        </p:outputPanel>
		 	        <p:outputPanel rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 0 and contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
		 	          <ui:include src="/xhtml/ct/fulfilmentdetails/shared/centralDetails.xhtml"/>
		 	        </p:outputPanel>
				    <ui:include	src="/xhtml/ct/fulfilmentdetails/shared/quotationTender.xhtml" />
				    <ui:include src="/xhtml/ct/fulfilmentdetails/shared/supplier.xhtml" />
				    <ui:include	src="/xhtml/ct/fulfilmentdetails/shared/performanceBond.xhtml" />
				    <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
				</p:outputPanel>
				<p:outputPanel rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 1 and 
				   contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/agency.xhtml" />
				</p:outputPanel>
	
				<p:outputPanel rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 2 and 
				   contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/zone.xhtml" />
			    </p:outputPanel>
				
				<p:outputPanel rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 3 and
				  contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/productItem.xhtml" />
				    <ui:include src="/xhtml/ct/fulfilmentdetails/shared/serviceItem.xhtml" />
				</p:outputPanel>
				<p:outputPanel rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 1 and 
				  contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/centralItem.xhtml" />
				</p:outputPanel>
				

				<p:outputPanel rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 4 and
				  contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/deduction.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 5 and
				  contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
					 <ui:include src="/xhtml/ct/fulfilmentdetails/shared/schedule.xhtml" />
				</p:outputPanel>
				<p:outputPanel rendered="#{(contractDetailsBackingBean.managedBean.selectedTabIndex == 6 and contractDetailsBackingBean.managedBean.ctContract.factored
				and contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry) or 
				 (contractDetailsBackingBean.managedBean.selectedTabIndex == 2 and  contractDetailsBackingBean.managedBean.ctContract.factored and 
				    contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral)}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/factoring.xhtml"/>
				</p:outputPanel>
	
				<p:outputPanel rendered="#{(contractDetailsBackingBean.managedBean.selectedTabIndex == 7 or contractDetailsBackingBean.managedBean.selectedTabIndex == 6) 
				and contractDetailsBackingBean.managedBean.flgPaymentTracking and
				contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/paymentTracking.xhtml"/>
				</p:outputPanel>
				
				<p:outputPanel rendered="#{((contractDetailsBackingBean.managedBean.selectedTabIndex == 2 or contractDetailsBackingBean.managedBean.selectedTabIndex == 3)
				and contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral) or 
				((contractDetailsBackingBean.managedBean.selectedTabIndex == 6 or contractDetailsBackingBean.managedBean.selectedTabIndex == 7 or contractDetailsBackingBean.managedBean.selectedTabIndex == 8) and 
				contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry)}">
					<ui:include	src="/xhtml/ct/fulfilmentdetails/shared/approverSetting.xhtml" />
				   <ui:include	src="/xhtml/ct/fulfilmentdetails/shared/fulfilmentSetting.xhtml" />
				</p:outputPanel>
			</td>
		</tr>
		</table>
	</ui:define>
</ui:composition>
