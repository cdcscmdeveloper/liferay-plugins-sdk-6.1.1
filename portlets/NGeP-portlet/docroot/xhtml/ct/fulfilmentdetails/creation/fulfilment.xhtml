<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
	  <style>
      .column-align-center {
         text-align: center !important;
      }
      .top-aligned-columns td { 
         vertical-align: top;
      }     
         .columnWidth150 {
	        width: 150px;
	        vertical-align: top;
	        text-align: right;
         }
          .columnWidth200 {
	        width: 200px;
         }
         .columnWidth250 {
	        width: 250px;
         }
         .columnWidth350 {
	        width: 350px;
         }
          .columnWidth180 {
	        width: 180px;
	        vertical-align: top;
	        text-align: right;
         }
         
          .columnWidth240 {
	        width: 240px;
	        vertical-align: top;
	        text-align: right;
         }
         .confirmation-message-box {
         	border: 1px solid #cecece;
			font-family: Arial;
			font-size: 12px;
			cursor: default;
			padding: 10px;
         }
         .columnWidthFact220 {
	        width: 220px;
	        vertical-align: top;
	        text-align: right;
         }
         .zone-tree-node tr td {
			border: none;
			padding: 4px 3px;
		}        
    </style> 
    <script type="text/javascript">  
    $(function(){
    	  $('form').on('keypress', function(event){
    	    if(event.which === 13){
    	        event.preventDefault();
    	        $('#save').trigger('click');
    	    }
    	  });
    	});
				</script> 	
	  <p:blockUI id="blockUiId" block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<p:panel id="fulfilmentPanelMsgId">
			<f:event listener="#{contractDetailsBackingBean.preRenderView}"  type="preRenderView"  />	
			<p:messages id="messages" showSummary="false" showDetail="true"  autoUpdate="#{contractDetailsBackingBean.managedBean.autoUpdate}" closable="true" severity="error, info, warn" />
			<p:tooltip id="headerTooltip" global="true" position="left center" targetPosition="right center" forSelector=".ui-state-error"/>
	    	<ui:include src="fulfilmentButtons.xhtml" />
		    <ui:include src="fulfilmentHeader.xhtml" />	
		</p:panel>
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		   <tr>
			<td width="20%;" style="vertical-align: baseline;" class="sidemenutd">
				<p:tabMenu id="sidemenuId" styleClass="sidemenu" 
						activeIndex="#{contractDetailsBackingBean.managedBean.selectedTabIndex}"
						model="#{contractDetailsBackingBean.managedBean.fulfilmentMenuModel}" />
			  </td>
			 	<td width="80%">
			 	<p:outputPanel id="ctMenuId1" rendered="#{contractDetailsBackingBean.managedBean.finalListOfSideMenu.get(contractDetailsBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.fd'] }">
				      <p:outputPanel id="ctMenuId2" rendered="#{contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
		 	               <ui:include src="/xhtml/ct/fulfilmentdetails/shared/fulfilmentDetails.xhtml"/>
		 	        </p:outputPanel>
		 	        <p:outputPanel id="ctMenuId3" rendered="#{contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
		 	             <ui:include src="/xhtml/ct/fulfilmentdetails/shared/centralDetails.xhtml"/>
		 	        </p:outputPanel>
				    <ui:include id="ctMenuId4"	src="/xhtml/ct/fulfilmentdetails/shared/quotationTender.xhtml" />
				    <ui:include src="/xhtml/ct/fulfilmentdetails/shared/supplier.xhtml" />
				    <ui:include	src="/xhtml/ct/fulfilmentdetails/shared/performanceBond.xhtml" />
				    <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
				</p:outputPanel>
				<p:outputPanel id="ctMenuId5" rendered="#{contractDetailsBackingBean.managedBean.finalListOfSideMenu.get(contractDetailsBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.agency'] }">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/agency.xhtml" />
				</p:outputPanel>
				<p:outputPanel id="ctMenuId6" rendered="#{contractDetailsBackingBean.managedBean.finalListOfSideMenu.get(contractDetailsBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.zone'] }">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/zone.xhtml" />
			    </p:outputPanel>
				
				<p:outputPanel id="ctMenuId7" rendered="#{contractDetailsBackingBean.managedBean.finalListOfSideMenu.get(contractDetailsBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.item']
				   and contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/productItem.xhtml" />
				    <ui:include src="/xhtml/ct/fulfilmentdetails/shared/serviceItem.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel id="ctMenuId8" rendered="#{contractDetailsBackingBean.managedBean.finalListOfSideMenu.get(contractDetailsBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.item'] and 
				     contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/centralItem.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel id="ctMenuId9" rendered="#{contractDetailsBackingBean.managedBean.finalListOfSideMenu.get(contractDetailsBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.deduction'] }">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/deduction.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel id="ctMenuId10" rendered="#{contractDetailsBackingBean.managedBean.finalListOfSideMenu.get(contractDetailsBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.schedule'] }">
					 <ui:include src="/xhtml/ct/fulfilmentdetails/shared/schedule.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel id="ctMenuId11" rendered="#{contractDetailsBackingBean.managedBean.finalListOfSideMenu.get(contractDetailsBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.factoring'] }">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/factoring.xhtml"/>
				</p:outputPanel>
	
				<p:outputPanel id="ctMenuId12" rendered="#{contractDetailsBackingBean.managedBean.finalListOfSideMenu.get(contractDetailsBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.adv.payment.tracking'] }">
				             	<ui:include src="/xhtml/ct/fulfilmentdetails/shared/paymentTracking.xhtml"/>
				   </p:outputPanel>
				
				<p:outputPanel id="ctMenuId13" rendered="#{contractDetailsBackingBean.managedBean.finalListOfSideMenu.get(contractDetailsBackingBean.managedBean.selectedTabIndex) == lbl['lbl.ct.menu.setting'] }">
					<ui:include	src="/xhtml/ct/fulfilmentdetails/shared/approverSetting.xhtml" />
				   <ui:include	src="/xhtml/ct/fulfilmentdetails/shared/fulfilmentSetting.xhtml" />
				</p:outputPanel>
			 	</td>
			 </tr>
		</table>
		<p:confirmDialog message="#{lbl['lbl.ct.dialog.confirm.message']}"
			severity="alert" widgetVar="cancelConfirmDlg" closable="true"
			appendToBody="true">
			<h:panelGrid columns="2">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					partialSubmit="true" process="@this"
					action="#{contractDetailsBackingBean.saveContract('CANCEL')}"
					onstart="cancelConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="cancelConfirmDlg.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>
	</ui:define>
</ui:composition>
