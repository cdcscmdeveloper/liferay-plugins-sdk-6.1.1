<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
	<script> $('#portlet_ctContractMaintenance_WAR_NGePportlet').find('.portlet-title-text').html('#{contractDetailsBackingBean.getViewPortletTitle()}'); </script>
	  <style>
      .column-align-center {
         text-align: center !important;
      }
      .top-aligned-columns td { 
         vertical-align: top;
      }     
         .columnWidth150 {
	        width: 150px;
	        vertical-align: top;
	        text-align: right;
         }
          .columnWidth200 {
	        width: 200px;
         }
         .columnWidth250 {
	        width: 250px;
         }
         .columnWidth350 {
	        width: 350px;
         }
         
          .columnWidth240 {
	        width: 240px;
	        vertical-align: top;
	        text-align: right;
         }
         .confirmation-message-box {
         	border: 1px solid #cecece;
			font-family: Arial;
			font-size: 12px;
			cursor: default;
			padding: 10px;
         }
         .columnWidthFact220 {
	        width: 220px;
	        vertical-align: top;
	        text-align: right;
         }
         .zone-tree-node tr td {
			border: none;
			padding: 4px 3px;
		}
		
		 .fileupload-buttonbar.ui-widget-header.ui-corner-top {
                padding: 0.0em 0.0em;
                padding-top: 0em;
                padding-right: 0em;
                padding-bottom: 0em;
                padding-left: 0em;
        }
    </style> 
    
      <script type="text/javascript">  
      $(document).on("keypress", 'form', function (e) {
    	    var code = e.keyCode || e.which;
    	    if (code == 13) {
    	        e.preventDefault();
    	        return false;
    	    }
    	});
     </script> 
   	
	  <p:blockUI id="blockUiId" block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<h:panelGroup id="fulfilmentPanelMsgId">
			<f:event listener="#{contractDetailsBackingBean.preRenderView}"  type="preRenderView"  />	
			<p:messages id="messages" showSummary="false" showDetail="true"  autoUpdate="#{contractDetailsBackingBean.managedBean.autoUpdate}" closable="true" severity="error, info, warn" />
			<p:tooltip id="headerTooltip" global="true" position="left center" targetPosition="right center" forSelector=".ui-state-error"/>
	   </h:panelGroup>
	   	<ui:include src="fulfilmentButtons.xhtml" />
		<ui:include src="/xhtml/ct/common/fulfilmentHeader.xhtml" />
		 <p:outputPanel rendered="#{ctBackingBean.managedBean.viewContract}">
		  		  <ui:include src="loaPhysicalNoSelection.xhtml" />
		  </p:outputPanel>
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		   <tr>
			<td width="20%;" style="vertical-align: baseline;" class="sidemenutd">
			<p:outputPanel id="menuMinistry"  
			       rendered="#{ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
		      <p:tabMenu id="sidemenuId" styleClass="sidemenu" 
						activeIndex="#{contractDetailsBackingBean.managedBean.selectedTabIndex}" >
		<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.fd']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{contractDetailsBackingBean.setTabValue('FD')}" update=":form" />
	
	    <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.zone']}"  onstart="blockWidget.show()" 
		    oncomplete="blockWidget.hide()" rendered="#{ctBackingBean.managedBean.contractVer.ctContract.zonalPricing}"
			actionListener="#{contractDetailsBackingBean.setTabValue('ZO')}" update=":form" />

		<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.agency']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{contractDetailsBackingBean.setTabValue('AG')}" update=":form" />
			 
		<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.item']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{contractDetailsBackingBean.setTabValue('IT')}" update=":form" />
		
		<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.deduction']}" 
		     onstart="blockWidget.show()"   oncomplete="blockWidget.hide()"
		     actionListener="#{contractDetailsBackingBean.setTabValue('DE')}" update=":form" />
			
			<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.schedule']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{ctBackingBean.managedBean.contractVer.ctContract.fulfillmentType.parameterCode eq ParameterConst.fulfilmentTypeScheduled}"
			actionListener="#{contractDetailsBackingBean.setTabValue('SC')}" update=":form" />
		
		<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.factoring']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{ctBackingBean.managedBean.contractVer.ctContract.factored and contractDetailsBackingBean.checkFactoringExpiryDate()}"
			actionListener="#{contractDetailsBackingBean.setTabValue('FT')}" update=":form" />
		  	  
		  <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.adv.payment.tracking']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{contractDetailsBackingBean.setTabValue('PY')}" update=":form" />
		  	 
		 <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.setting']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{contractDetailsBackingBean.setTabValue('SE')}" update=":form" />
		</p:tabMenu>
		</p:outputPanel>
		
		<p:outputPanel id="menuCentral"  
			   rendered="#{ ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
	         <p:tabMenu id="sidemenuId1" styleClass="sidemenu" 
						activeIndex="#{contractDetailsBackingBean.managedBean.selectedTabIndex}" >
		
	           <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.fd']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{contractDetailsBackingBean.setTabCentralValue('FD')}" update=":form" />
	
	      	<p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.zone']}"  onstart="blockWidget.show()" 
		    oncomplete="blockWidget.hide()" rendered="#{ctBackingBean.managedBean.contractVer.ctContract.zonalPricing}"
			actionListener="#{contractDetailsBackingBean.setTabCentralValue('ZO')}" update=":form" />
		
		    <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.item']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{contractDetailsBackingBean.setTabCentralValue('IT')}" update=":form" />
		
		   <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.factoring']}"
			    onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			    rendered="#{ctBackingBean.managedBean.contractVer.ctContract.factored and contractDetailsBackingBean.checkFactoringExpiryDate()}"
			    actionListener="#{contractDetailsBackingBean.setTabCentralValue('FT')}" update=":form" />
		
		 <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.adv.payment.tracking']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			rendered="#{ctBackingBean.managedBean.contractVer.ctContractValue.followLoaAmt}"
			actionListener="#{contractDetailsBackingBean.setTabCentralValue('PY')}" update=":form" />
		 
	      <p:menuitem style="white-space:normal;" value="#{lbl['lbl.ct.menu.setting']}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
			actionListener="#{contractDetailsBackingBean.setTabCentralValue('SE')}" update=":form" />
		</p:tabMenu>
		</p:outputPanel>
		
		 </td>
		 <td width="80%" valign="top">
			 	<p:outputPanel id="ctMenuId1"  rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex eq 0}">
			 	        <p:outputPanel id="ctMenuId2" rendered="#{ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
		 	               <ui:include src="/xhtml/ct/common/fulfilmentDetails.xhtml"/>
		 	        </p:outputPanel>
		 	        <p:outputPanel id="ctMenuId3" rendered="#{ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
		 	             <ui:include src="/xhtml/ct/common/centralDetails.xhtml"/>
		 	        </p:outputPanel>
		 	             <ui:include id="ctMenuId4"	src="/xhtml/ct/common/quotationTender.xhtml" />
				          <ui:include src="/xhtml/ct/common/supplier.xhtml" />
				             <p:outputPanel id="ctMenuIdPid" rendered="#{ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
		                              <ui:include  src="/xhtml/ct/common/purchaseInDefault.xhtml"  />
		                       </p:outputPanel>
				           <ui:include src="/xhtml/ct/fulfilmentdetails/shared/performanceBond.xhtml" />
				        <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml"  />
				</p:outputPanel>
				
				<p:outputPanel id="ctMenuId5" 
				     rendered="#{ctBackingBean.managedBean.contractVer.ctContract.zonalPricing and contractDetailsBackingBean.managedBean.selectedTabIndex eq 1}" >
				     <ui:include src="/xhtml/ct/common/zone.xhtml" />
			    </p:outputPanel>
				
				<p:outputPanel id="ctMenuId6" rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.agencyIndex}">
				      <ui:include src="/xhtml/ct/common/agency.xhtml" />
				</p:outputPanel>
			
			    <p:outputPanel id="ctMenuId7" rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.itemIndex}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/item.xhtml" />
				</p:outputPanel>
			   
				<p:outputPanel id="ctMenuId8"
				     rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.deductionIndex}">
					<ui:include src="/xhtml/ct/common/deduction.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel id="ctMenuId9" 
				      rendered="#{ctBackingBean.managedBean.contractVer.ctContract.fulfillmentType.parameterCode eq ParameterConst.fulfilmentTypeScheduled
				       and contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.scheduleIndex}">
					 <ui:include src="/xhtml/ct/common/schedule.xhtml" />
				</p:outputPanel>
				
				<p:outputPanel id="ctMenuId10" 
				     rendered="#{ctBackingBean.managedBean.contractVer.ctContract.factored and contractDetailsBackingBean.checkFactoringExpiryDate()
				     and contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.factoring}">
					<ui:include src="/xhtml/ct/common/factoring.xhtml"/>
				</p:outputPanel>
	
				<p:outputPanel id="ctMenuId11" 
				rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.paymentTracking 
				  and (ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry or 
				  (ctBackingBean.managedBean.contractVer.ctContractValue.followLoaAmt and 
				  ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral ))}">
				             	<ui:include src="/xhtml/ct/common/paymentTracking.xhtml"/>
				   </p:outputPanel>
				
				<p:outputPanel id="ctMenuId12" rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex eq contractDetailsBackingBean.managedBean.settingIndex}">
					<ui:include	src="/xhtml/ct/fulfilmentdetails/shared/approverSetting.xhtml" />
				   <ui:include	src="/xhtml/ct/common/fulfilmentSetting.xhtml" />
				</p:outputPanel>
			 	</td>
			 </tr>
		</table>
		<p:confirmDialog message="#{contractDetailsBackingBean.getCancelConfirmationContent(ctBackingBean.managedBean.contractVer.docType)}"
			severity="alert" widgetVar="cancelConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					partialSubmit="true" process="@this"
					action="#{contractDetailsBackingBean.saveContract('CANCEL')}"
					onstart="cancelConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="cancelConfirmDlg.hide()" type="button" />
			</div>
		</p:confirmDialog>
	</ui:define>
</ui:composition>
