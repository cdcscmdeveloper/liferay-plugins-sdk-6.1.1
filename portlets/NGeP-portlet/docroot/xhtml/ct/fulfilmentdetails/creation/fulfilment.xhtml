<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
	  <style>
      .column-align-center { text-align: center !important;}
      .top-aligned-columns td{ vertical-align: top;}
      #dlgDel .ui-dialog .ui-dialog-titlebar {
         display:none !important;}
    </style> 
		<p:panel>
			<f:event listener="#{contractDetailsBackingBean.preRenderView}"  type="preRenderView"  />	
			<p:messages id="messages" showSummary="false" showDetail="true"  autoUpdate="true" closable="true" severity="error, info" />
			<p:tooltip global="true" position="left center" targetPosition="right center" forSelector=".ui-state-error"/>
	    	<ui:include src="fulfilmentButtons.xhtml" />
		    <ui:include src="fulfilmentHeader.xhtml" />	
		</p:panel>
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		  <tr>
			<td width="20%" valign="top">
				<p:tabMenu styleClass="sidemenu"
					activeIndex="#{contractDetailsBackingBean.managedBean.selectedTabIndex}"
					style="display : table-caption;">
                    <p:menuitem value="#{lbl['lbl.ct.menu.fd']}" update="@form">
						<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.selectedTabIndex}" value="0" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.ct.menu.agency']}" update="@form"
					    rendered="#{contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
						<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.selectedTabIndex}" value="1" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.ct.menu.zone']}" update="@form"
					   rendered="#{contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry
			             and contractDetailsBackingBean.managedBean.ctContract.zonalPricing}">
						<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.selectedTabIndex}" value="2" />
					</p:menuitem>
					
					 <p:menuitem value="#{lbl['lbl.ct.menu.item']}" update="@form"
					    rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
						<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.selectedTabIndex}" value="3" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.ct.menu.item']}" update="@form" 
					   rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral}">
						<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.selectedTabIndex}" value="4" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.ct.menu.dedu']}" update="@form"
					    rendered="#{contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
						<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.selectedTabIndex}" value="5" />
					</p:menuitem>
					
					 <p:menuitem value="#{lbl['lbl.ct.menu.sched']}" update="@form"
					     rendered="#{contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
						<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.selectedTabIndex}" value="6" />
					</p:menuitem>
					<p:menuitem value="Factoring" update="@form" rendered="#{contractDetailsBackingBean.managedBean.ctContract.factored}">
						<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.selectedTabIndex}" value="7" />
					</p:menuitem>
					<p:menuitem value="Advanced Payment Tracking" update="@form"  rendered="#{contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry
			           and contractDetailsBackingBean.managedBean.flgPaymentTracking}">
						<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.selectedTabIndex}" value="8" />
					</p:menuitem>
					
					 <p:menuitem value="#{lbl['lbl.ct.menu.sett']}" update="@form">
						<f:setPropertyActionListener target="#{contractDetailsBackingBean.managedBean.selectedTabIndex}" value="9" />
					</p:menuitem>
				</p:tabMenu>
			</td>
			<td width="80%">
				<c:if test="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 0 }">
				    <p:outputPanel rendered="#{contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
		 	          <ui:include src="/xhtml/ct/fulfilmentdetails/shared/fulfilmentDetails.xhtml"/>
		 	        </p:outputPanel>
		 	        <p:outputPanel rendered="#{contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeCentral}">
		 	          <ui:include src="/xhtml/ct/fulfilmentdetails/shared/centralDetails.xhtml"/>
		 	        </p:outputPanel>
				    <ui:include	src="/xhtml/ct/fulfilmentdetails/shared/quotationTender.xhtml" />
				    <ui:include src="/xhtml/ct/fulfilmentdetails/shared/supplier.xhtml" />
				    <ui:include	src="/xhtml/ct/fulfilmentdetails/shared/performanceBond.xhtml" />
				    <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
				</c:if>
				<c:if test="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 1 and 
				   contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/agency.xhtml" />
				</c:if>
	
				<c:if test="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 2 
				and contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry
			    and contractDetailsBackingBean.managedBean.ctContract.zonalPricing}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/zone.xhtml" />
				</c:if>
				
				<c:if test="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 3 
				  and contractDetailsBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeMinistry}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/productItem.xhtml" />
				    <ui:include src="/xhtml/ct/fulfilmentdetails/shared/serviceItem.xhtml" />
				</c:if>
				<c:if test="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 4
				   and contractDetailsBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode eq ParameterConst.contractTypeCentral}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/centralItem.xhtml" />
				</c:if>
	
				<c:if test="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 5 and 
				   contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/deduction.xhtml" />
				</c:if>
				
				<c:if test="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 6 and 
				  contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
					 <ui:include src="/xhtml/ct/fulfilmentdetails/shared/schedule.xhtml" />
				</c:if>
				<c:if test="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 7 and contractDetailsBackingBean.managedBean.ctContract.factored}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/factoring.xhtml"/>
				</c:if>
	
				<c:if test="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 8 
				   and contractDetailsBackingBean.managedBean.ctContract.contractType.parameterCode == ParameterConst.contractTypeMinistry
			       and contractDetailsBackingBean.managedBean.flgPaymentTracking}">
					<ui:include src="/xhtml/ct/fulfilmentdetails/shared/paymentTracking.xhtml"/>
				</c:if>
				
				<c:if test="#{contractDetailsBackingBean.managedBean.selectedTabIndex == 9}">
					<ui:include	src="/xhtml/ct/fulfilmentdetails/shared/approverSetting.xhtml" />
				   <ui:include	src="/xhtml/ct/fulfilmentdetails/shared/fulfilmentSetting.xhtml" />
				</c:if>
			</td>
		</tr>
		</table>
	</ui:define>
</ui:composition>
