<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
	  <style>
      .column-align-center { text-align: center !important;}
    </style> 
		<p:panel>
			<ui:include	src="/xhtml/ct/fulfilmentdetails/shared/preRenderView.xhtml" />
			<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	    	<table style="width: 100%;">
	    		<tr>
	    			<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" /></td>
	    			<td class="ppRightBtn">
			  			<ui:repeat var="action"	value="#{contractDetailsBackingBean.managedBean.action}">
							<p:commandButton value="#{action}" ajax="false" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(action)}" 
								action="#{contractDetailsBackingBean.saveContract(outComes)}" />
						</ui:repeat>	    			
	    			</td>
	    		</tr>
	    	</table>
			<table style="width: 99%; margin-left: 25px;">
				<tr style="margin-button: 10px;">
					<td>
						<h6 style="color: blue;">
							<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
						</h6>
					</td>
					<td>
						<h6>
							<p:inputText size="20" disabled="true"
								value="#{contractDetailsBackingBean.managedBean.contractVer.docNo}" />
						</h6>
					</td>
					<td>
						<h6 style="color: blue;">
							<p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
						</h6>
					</td>
					<td>
						<h6>
							<p:inputText size="20" disabled="true"
								value="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.loaNo}"  />
						</h6>
					</td>					
					<td>
						<h6 style="color: blue;">
							<p:outputLabel value="#{lbl['lbl.ct.cc.status']}" />
						</h6>
					</td>
					<td>
						<h6>
							<p:inputText size="20"
								value="#{panelBackingBean.getStatusDescById(contractDetailsBackingBean.managedBean.contractVer.status.statusId)}"
								disabled="true" />
						</h6>
					</td>
				</tr>
			</table>	    			
		</p:panel>
		<p:tabView  widgetVar="CreateContractVar" id="tabview"  dynamic="true" cache="false" orientation="left">
			<p:tab id="tabfd" title="#{lbl['lbl.ct.menu.fd']}">
				<ui:include	src="/xhtml/ct/fulfilmentdetails/shared/fulfilment.xhtml" />
				<ui:include	src="/xhtml/ct/fulfilmentdetails/shared/quotationTender.xhtml" />
				<ui:include src="/xhtml/ct/fulfilmentdetails/shared/supplier.xhtml" />
				<ui:include	src="/xhtml/ct/fulfilmentdetails/shared/performanceBond.xhtml" />
				<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
			</p:tab>
			<p:tab id="tabAgency" title="#{lbl['lbl.ct.menu.agency']}">
				<ui:include src="/xhtml/ct/fulfilmentdetails/shared/agency.xhtml" />
			</p:tab>
			<p:tab id="tabZone" title="#{lbl['lbl.ct.menu.zone']}">
				<ui:include src="/xhtml/ct/fulfilmentdetails/shared/zone.xhtml" />
			</p:tab>
			<p:tab id="tabItem" title="#{lbl['lbl.ct.menu.item']}">
				<ui:include src="/xhtml/ct/fulfilmentdetails/shared/item.xhtml" />
			</p:tab>
			<p:tab id="tabDeduction" title="#{lbl['lbl.ct.menu.dedu']}">
				<ui:include src="/xhtml/ct/fulfilmentdetails/shared/deduction.xhtml" />
			</p:tab>
			<p:tab id="tabSchedule" title="#{lbl['lbl.ct.menu.sched']}">
				<ui:include src="/xhtml/ct/fulfilmentdetails/shared/schedule.xhtml" />
			</p:tab>
			<p:tab id="tabSetting" title="#{lbl['lbl.ct.menu.sett']}">
				<ui:include	src="/xhtml/ct/fulfilmentdetails/shared/approverSetting.xhtml" />
				<ui:include	src="/xhtml/ct/fulfilmentdetails/shared/fulfilmentSetting.xhtml" />
			</p:tab>
			<p:tab id="tabFactoring" title="Factoring" rendered="#{contractDetailsBackingBean.managedBean.ctContract.factored}" >
				<ui:include src="/xhtml/ct/fulfilmentdetails/shared/factoring.xhtml" />
			</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
