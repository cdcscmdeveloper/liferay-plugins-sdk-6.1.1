<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:blockUI block=":form" widgetVar="blockViewWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif" />
	</p:blockUI>
	<div align="left">
		
		<table style="width: 100%">
		<tr>
			<td style="width: 15%">  </td>
			<td style="width: 15%">  </td>
			<td style="width: 20%">  </td>
			<td style="width: 11%">  </td>
			<td style="width: 20%"> 
				<p:outputLabel value="#{lbl['lbl.ct.loa.physical.no']}" style="float:right;"></p:outputLabel>
			</td>
			<td style="width: 20%"> 
				<p:selectOneMenu id="loaVer" value="#{contractDetailsBackingBean.managedBean.loaContractVerId}" style="width:180px;">
					<f:selectItems value="#{contractDetailsBackingBean.loaContractVerList}" />
		       		<p:ajax event="change"  process="@this" listener="#{contractDetailsBackingBean.changeLoaContractVer()}" update=":form" 
	               	onstart="blockViewWidget.show()" oncomplete="blockViewWidget.hide()"></p:ajax>
		       	</p:selectOneMenu>
			</td>
		</tr>
		</table>
	</div>
</ui:composition>
