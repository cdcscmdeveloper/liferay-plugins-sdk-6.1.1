<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%;">
	    <tr>
	    <td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" icon="ui-icon-back" rendered="#{contractDetailsBackingBean.managedBean.taskId==null}" action="#{contractDetailsBackingBean.backAction}"  /></td>
	    	<td class="ppRightBtn">
	    	  <c:if test="#{!contractDetailsBackingBean.managedBean.viewContract}">
			  	<ui:repeat var="action"	value="#{contractDetailsBackingBean.managedBean.action}">
			  	  <ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(action)}" />
				  <p:commandButton value="#{lbl[buttonLabel]}" ajax="false" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(action)}" 
					action="#{contractDetailsBackingBean.saveContract(action)}">
				  </p:commandButton>
				</ui:repeat>	
			 </c:if>    			
	    	</td>
	    </tr>
	  </table>	
</ui:composition>
