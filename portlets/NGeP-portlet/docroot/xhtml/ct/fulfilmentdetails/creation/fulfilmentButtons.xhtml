<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<table style="width: 100%;">
	    <tr>
	    <td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true"  rendered="#{contractDetailsBackingBean.managedBean.taskId==null}" action="#{contractDetailsBackingBean.backAction}"  /></td>
	    	<td class="ppRightBtn">
	    	  <c:if test="#{!contractDetailsBackingBean.managedBean.viewContract}">			
				<ui:repeat var="action"	value="#{contractDetailsBackingBean.managedBean.action}">
				  <ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(action)}" />				  
				  <p:commandButton value="#{lbl[buttonLabel]}" ajax="false" styleClass="ui-button" 
					action="#{contractDetailsBackingBean.saveContract(action)}" 	
					rendered="#{action != 'SUBMIT' and action != 'REJECT' and action != 'APPROVE' }"/>				  			
					<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
						process="@form" update="@form,@([id$=messages])"
						actionListener="#{contractDetailsBackingBean.validateCtContractVer(action)}" action="#{contractDetailsBackingBean.disableUpdate}"
						oncomplete="if (args &amp;&amp; !args.validationFailed &amp;&amp; !args.epException) gpki_dlg.show(); "
						rendered="#{action == 'SUBMIT' or action == 'REJECT' or action == 'APPROVE' or action == 'SIGNOFF'}" />
				</ui:repeat>	
			 </c:if>    
			  <ac:gpkiPopup textBeforeSign="#{contractDetailsBackingBean.managedBean.textBeforeSign}"  
					postSignAction="#{contractDetailsBackingBean.preSubmitContract(gpkiBackingBean.pmDigiSign)}"  />
			 </td>
	    </tr>
	  </table>	
</ui:composition>
