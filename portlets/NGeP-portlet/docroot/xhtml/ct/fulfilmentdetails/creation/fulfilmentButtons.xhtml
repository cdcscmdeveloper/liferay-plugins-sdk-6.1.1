<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ac:gpkiPopup
		textBeforeSign="#{contractDetailsBackingBean.managedBean.textBeforeSign}"
		postSignAction="#{contractDetailsBackingBean.preSubmitContract(gpkiBackingBean.pmDigiSign)}"
		enableAutoUpdate="#{contractDetailsBackingBean.enableAutoUpdate()}" />
	<table style="width: 100%;">
		<tr>
			<td><p:commandButton value="#{lbl['lbl.btn.back']}"
					immediate="true"
					rendered="#{contractDetailsBackingBean.managedBean.taskId==null}"
					action="#{contractDetailsBackingBean.backAction}"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();" /></td>
			<td class="ppRightBtn"><c:if
					test="#{!ctBackingBean.managedBean.viewContract}">
					<ui:decorate template="/xhtml/ct/shared/claim_template.xhtml"><!-- #31422-basri 190821 -->
					<ui:define name="outComeSection"><!-- #31422-basri 190821 -->
					<ui:repeat var="action"
						value="#{contractDetailsBackingBean.managedBean.outComes}">
						<ui:param name="buttonLabel"
							value="lbl.btn.#{fn:toLowerCase(action)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" process="@form"
							update="@form" styleClass="ui-button" onkeypress="if (event.keyCode == 13) { return false; }"
							action="#{contractDetailsBackingBean.gpkiSignAction(action)}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
					</ui:repeat>
					</ui:define><!-- #31422-basri 190821 -->
					 </ui:decorate><!-- #31422-basri 190821 -->
				</c:if></td>
			<!-- #35506 Start -->
			<td style="float: right;">
			<c:if test='#{ctBackingBean.managedBean.viewContract and ctBackingBean..isAuditRoleCheck}'>
			<p:commandLink value="#{lbl['lbl.audit.link.auditTrail']}"
						action="#{auditContractBackingBean.redirectToAudittrailView(
                ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode,
                ctBackingBean.managedBean.contractVer.ctContract.contractId,
                ctBackingBean.managedBean.contractVer.docType)}"
						immediate="true" />
			</c:if>
			
			<c:if test='#{ctBackingBean.managedBean.viewContract}'>
			&#160;&#160;
			<p:commandLink value="#{lbl['lbl.td.doc.trackingDiary']}"
						immediate="true"
						action="#{pmTrackingDiaryBackingBean.redirectToSupplierTrackingDiary(
                ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode,
                ctBackingBean.managedBean.contractVer.ctContract.contractId, 
                ctBackingBean.isSupplier())}" />
			</c:if>
			</td>
			<!-- #35506 End -->				
		</tr>
	</table>
</ui:composition>
