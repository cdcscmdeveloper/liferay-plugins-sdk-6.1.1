<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<div align="left">
		<table style="width: 100%">
		<tr>
		<td style="width: 15%">  </td>

				<td style="width: 20%">  </td>
					<td style="width: 15%">  </td>
			<td style="width: 15%"> 
		
			  <p:outputLabel value="As At Date" style="float:right;"></p:outputLabel>
			  </td>
			  	<td style="width: 15%"> 
			  		<p:calendar id="selectedDateId" value="#{contractDetailsBackingBean.managedBean.asAtDate}"  navigator="true" size="8"

		               mindate="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate}" 
		               maxdate="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate}"			             
		               showOn="button"  rendered="#{contractDetailsBackingBean.managedBean.viewContract}"
		               pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
		               <p:ajax event="dateSelect"  process="@this"   listener="#{contractDetailsBackingBean.updateAsperDate()}" update=":form" ></p:ajax>
		             </p:calendar>

			</tr>
		</table>
	</div>
