<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <p:panel id="itemId" header="Product Details"   toggleable="true"  toggleSpeed="500">
      <h:panelGrid  style="width:100%;">
        <p:dataTable id="itemTable" var="data" value="#{contractDetailsBackingBean.contractItemList}" rowKey="#{data}" 
           selectionMode="single" selection="#{contractDetailsBackingBean.managedBean.selectedItem}" lazy="true">
           <ac:paginator for="itemTable"/>
           <p:ajax event="rowSelect" update=":form:tabview:changeField"  />
		   <p:column headerText="Item Name">
		     <p:outputLabel value="#{data.itemName}" style="float:left;"/> </p:column>       
		   <p:column headerText="UOM">
		     <p:outputLabel value="#{data.uom.uomName}" style="float:left;"/> </p:column>        
		   <p:column headerText="Minimum Order Qty." style="text-align: right;">
		     <p:outputLabel value="#{data.minimumOrderQty}"/></p:column>   
		   <p:column headerText="Maximum Qty." style="text-align: right;">
		     <p:outputLabel value="#{data.maxProcureAmount}"/></p:column>     
		   <p:column headerText="Type Of Goods">
		     <h:outputLabel value="#{contractDetailsBackingBean.getParameterDesc(data.itemOrigin)}"
		       rendered="#{contractDetailsBackingBean.getParameterDesc(data.itemOrigin) eq 'Local'}" style="float:left;"/>
		     <p:commandLink value="#{contractDetailsBackingBean.getParameterDesc(data.itemOrigin)}" styleClass="blue_font" 
		     	rendered="#{contractDetailsBackingBean.getParameterDesc(data.itemOrigin) eq 'Imported'}" 
		        onclick="importedDlg.show();return false;" />	
		     </p:column>              
    	 </p:dataTable> 
       </h:panelGrid>
       <p:outputPanel id="changeField">
		  <p:spacer height="20"/>
		  <h:panelGrid columns="2" style="height:50px;text-align:bottom;" 
			rendered="#{contractDetailsBackingBean.managedBean.selectedItem!=null}">
		    <h:outputLabel for="show" value="Show" style="width:50px;"/>  
		      <p:selectOneMenu id="show" value="#{contractDetailsBackingBean.managedBean.showItem}" style="width:200px;">
		         <f:selectItems value="#{contractDetailsBackingBean.getDropdownCodeValues(ParameterTypeConst.itemDisplayType)}" />
		         <p:ajax event="change" update="changeField" listener="#{contractDetailsBackingBean.changeField}" process="@this"/>  
			  </p:selectOneMenu>         
		  </h:panelGrid>
		  <p:spacer height="20"/>
		  <p:outputPanel columns="1" style="width:100%"
			rendered="#{(contractDetailsBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypePrice) 
			   and contractDetailsBackingBean.managedBean.selectedItem!=null
			   and contractDetailsBackingBean.getContractItemType(contractDetailsBackingBean.managedBean.selectedItem.itemType.parameterId) eq ''}">
		      <p:dataTable id="itemPriceTier" var="data" value="#{contractDetailsBackingBean.managedBean.selectedItem.ctItemPrices}"
			     rowKey="#{data}" lazy="true" >
			     <ac:paginator for="itemPriceTier"/>
			     <p:column headerText="Zone"><p:outputLabel value="#{data.ctContractZone.zoneName}" style="float:left;" /></p:column>       
			     <p:column headerText="From Qty." style="text-align: right;">
				  <p:outputLabel value="#{data.tierFrom}"/>
			     </p:column>       
			     <p:column headerText="To Qty." style="text-align: right;">
				  <p:outputLabel value="#{data.tierTo}"/>
			     </p:column>  
			     <p:column headerText="Price (MYR)" style="text-align: right;"><p:outputLabel value="#{data.unitPrice}"/></p:column>            
			     <p:column headerText="Effective Date">
			       <h:outputText value="#{data.effDate}" style="float:left;">
                            <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                     </h:outputText>
			     </p:column>       
			     <p:column headerText="Expiry Date">
			       <h:outputText value="#{data.expDate}" style="float:left;">
                      <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                   </h:outputText>
			     </p:column>       
			</p:dataTable>
		  </p:outputPanel>  
		  <p:outputPanel columns="1" style="width:100%"
			rendered="#{(contractDetailsBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypePrice) 
			   and contractDetailsBackingBean.managedBean.selectedItem!=null
			   and contractDetailsBackingBean.getContractItemType(contractDetailsBackingBean.managedBean.selectedItem.itemType.parameterId) eq ''}">
		      <p:dataTable id="itemPriceTariff" var="data" value="#{contractDetailsBackingBean.managedBean.selectedItem.ctItemPrices}"
			     rowKey="#{data}" lazy="true" >
			     <ac:paginator for="itemPriceTariff"/>
			     <p:column headerText="Zone"><p:outputLabel value="#{data.ctContractZone.zoneName}" style="float:left;" /></p:column>       
			     <p:column headerText="From Qty." style="text-align: right;">
				  <p:outputLabel value="#{data.tierFrom}"/>
			     </p:column>       
			     <p:column headerText="To Qty." style="text-align: right;">
				  <p:outputLabel value="#{data.tierTo}"/>
			     </p:column>  
			     <p:column headerText="Sub Sequence" style="text-align: right;">
				    <p:outputLabel/>
			     </p:column>           
			     <p:column headerText="Price (MYR)" style="text-align: right;"><p:outputLabel value="#{data.unitPrice}"/></p:column>            
			     <p:column headerText="Effective Date">
			       <h:outputText value="#{data.effDate}" style="float:left;">
                            <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                     </h:outputText>
			     </p:column>       
			     <p:column headerText="Expiry Date">
			       <h:outputText value="#{data.expDate}" style="float:left;">
                      <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                   </h:outputText>
			     </p:column>       
			</p:dataTable>
		  </p:outputPanel>  
		  <h:panelGrid columns="1" style="width:100%"
			 rendered="#{(contractDetailsBackingBean.managedBean.showItem == ParameterConst.itemDisplayTypeCeilQty)
			  and contractDetailsBackingBean.managedBean.selectedItem!=null}">
			 <p:dataTable id="ceilingTable" var="data" value="#{contractDetailsBackingBean.managedBean.selectedItem.ctItemCeilingQties}"
				rowKey="#{data}" lazy="true" >
				<ac:paginator for="ceilingTable"/>
				<p:column headerText="Ministry Name">
				   <p:outputLabel value="#{data.ctAgency.orgProfile.parentOrgProfile.parentOrgProfile.orgName}" style="float:left;" />
				</p:column>       
				<p:column headerText="Jabatan Name">
					<p:outputLabel value="#{data.ctAgency.orgProfile.parentOrgProfile.orgName}" style="float:left;" />
				</p:column>       
				<p:column headerText="PTJ Name">
				  <p:outputLabel value="#{data.ctAgency.orgProfile.orgName}" style="float:left;" />
				</p:column>              
				<p:column headerText="Ceiling Quantity" style="text-align: right;">
					<p:inputText style="width:70px;" styleClass="ppRightBtn" value="#{data.ceilingQuantity}">
					 <f:convertNumber pattern="#,###.00" /></p:inputText>
				</p:column>            
				<p:column headerText="Effective Date">
				     <h:outputText value="#{data.effDate}" style="float:left;">
                            <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                     </h:outputText>
			    </p:column>       
				<p:column headerText="Expiry Date">
				     <h:outputText value="#{data.expDate}" style="float:left;">
                            <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
                     </h:outputText>
				</p:column>           
			  </p:dataTable>
		  	</h:panelGrid>  
		</p:outputPanel> 
		<p:dialog id="importedDialog" header="Shipping Details" widgetVar="importedDlg" modal="true" width="600" height="350">
		    
		     <h:panelGrid columns="2" width="100%">
		      
		        <p:outputLabel id="mtoloa" value="MTO LOA No." />
	            <p:inputText id="txtmtoloa" style="width:200px;"></p:inputText>
               
                <p:outputLabel id="mtocontract" value="MTO Contract No." />
	            <p:inputText id="txtmtocontract" style="width:200px;"></p:inputText>
                
                <p:outputLabel id="agentname" value="Agent Name" />
                 <p:selectOneMenu id="txtagentname" style="width:210px;">
                   <f:selectItem itemLabel="-Select One-" itemValue="" /> 
                   <f:selectItem itemLabel="-Interspiro AB-" itemValue="Interspiro AB" /> 
                </p:selectOneMenu>
                
                <p:outputLabel id="promethod" value="Procurement Method" />
                <h:panelGrid columns="3">
                    <p:selectOneMenu id="txtpromethod"  style="width:100px;">
                       <f:selectItem itemLabel="-Select One-" itemValue="" /> 
                       <f:selectItem itemLabel="-Ex-Work-" itemValue="Ex-Work" /> 
                       <f:selectItem itemLabel="-FOB-" itemValue="FOB" /> 
                       <f:selectItem itemLabel="-FCA-" itemValue="FCA" /> 
                       <f:selectItem itemLabel="-Others-" itemValue="Others" /> 
                    </p:selectOneMenu>
                    <p:spacer width="1"/>
                    <p:inputText style="width:95px;"/>
                </h:panelGrid>
	            
                <p:outputLabel id="exportlicense" value="Required Export License" />
                <p:selectOneRadio id="options">  
                    <f:selectItem itemLabel="Yes" itemValue="1" />  
                    <f:selectItem itemLabel="No" itemValue="2" />  
                 </p:selectOneRadio>  
                  
                <h:outputLabel id="countryoforigin" value="* Country of Origin" />
                <p:selectOneMenu id="txtcountryoforigin" style="width:110px;">
                   <f:selectItem itemLabel="-Select One-" itemValue="" /> 
                   <f:selectItem itemLabel="Sewden" itemValue="Sewden" /> 
                </p:selectOneMenu>
	             
                <h:outputLabel id="loadingport" value="* Loading Port" />
	            <p:inputText id="txtloadingport" style="width:100px;"></p:inputText>
                 
                <p:outputLabel id="countryofdestination" value="* Country of Destination" />
                <p:selectOneMenu id="txtcountryofdestination" style="width:110px;">
                   <f:selectItem itemLabel="-Select One-" itemValue="" /> 
                   <f:selectItem itemLabel="Malaysia" itemValue="Malaysia" /> 
                </p:selectOneMenu>
	             
                <h:outputLabel id="dischargeport" value="* Discharge Port" />
	            <p:inputText id="txtdischargeport" style="width:100px;"></p:inputText>
	            
	            <h:panelGroup>
                  <div style="height: 40px; vertical-align:top;">
                     <p:outputLabel for="finaldestination" value="* Final Destination" />
                  </div>
               </h:panelGroup>
               <h:panelGrid>
                   <p:inputTextarea id="finaldestination" rows="4" cols="31" maxlength="100"  autoResize="false" />
              </h:panelGrid>
              <h:outputLabel id="transportmode" value=" Transport Mode" />
	          <p:selectOneMenu id="txttransportmode" style="width:110px;">
                   <f:selectItem itemLabel="-Select One-" itemValue="" /> 
                   <f:selectItem itemLabel="Sea" itemValue="Sea" /> 
                   <f:selectItem itemLabel="Air" itemValue="Air" /> 
                   <f:selectItem itemLabel="Land" itemValue="Land" /> 
              </p:selectOneMenu>
           </h:panelGrid>
		</p:dialog>
  	 </p:panel>
  	 <p:spacer height="50"/>
 </ui:composition>
