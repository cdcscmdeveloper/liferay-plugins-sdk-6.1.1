<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<script> $('#portlet_ctContractMaintenance_WAR_NGePportlet').find('.portlet-title-text').html('#{requestCtAdminBackingBean.getPortletTitle()}'); </script>
		<style>
		.column-align-center {
			text-align: center !important;
		}
		.top-aligned-columns td {
			vertical-align: top;
		}
		 .calanderWidth input {
	       width:110px;margin-bottom: 5px;
	   }
		
          .columnWidth200 {
	        width: 220px;
	        vertical-align: top;
	        text-align: right;
         }
         
            .columnWidth300 {
	        width: 210px;
         }
		</style>
		   <script type="text/javascript">  
           window.addEventListener('keydown',function(e)
    		      {
    	                  if(e.keyIdentifier=='U+000A'||e.keyIdentifier=='Enter'||e.keyCode==13)
    	                       {
    	            	            e.preventDefault();return false;
    	                   }
    	        },  true);
      </script>
		<p:blockUI id="blockUiId" block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>	
		<ac:gpkiPopup textBeforeSign="#{requestCtAdminBackingBean.managedBean.textBeforeSign}"  
						postSignAction="#{requestCtAdminBackingBean.preSubmitRequestCtAdmin(gpkiBackingBean.pmDigiSign)}" 
						enableAutoUpdate="#{requestCtAdminBackingBean.enableAutoUpdate()}" />
			<f:event listener="#{requestCtAdminBackingBean.preRenderView}" type="preRenderView" />
			<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="#{requestCtAdminBackingBean.managedBean.autoUpdate}" closable="true" severity="error, info" />
			
			<table style="width: 100%;">
				<tr>
					<td><p:commandButton value="#{lbl['lbl.btn.back']}" 
						immediate="true" 
						rendered="#{requestCtAdminBackingBean.managedBean.taskId==null
							and !requestCtAdminBackingBean.managedBean.viewOnly}" 
						action="#{requestCtAdminBackingBean.backAction}"
						onstart="blockWidget.show();" 
						oncomplete="blockWidget.hide();"/>
					</td>
					<td class="ppRightBtn">
						<c:if test="#{!requestCtAdminBackingBean.managedBean.viewOnly}">	
						<ui:repeat var="outcome" value="#{requestCtAdminBackingBean.managedBean.outComes}">
							<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(outcome)}" />		
							<p:commandButton value="#{lbl[buttonLabel]}" process="@form"
								update ="@form" onkeypress="if (event.keyCode == 13) { return false; }"
								styleClass="ui-button" onstart="blockWidget.show();" 
					  			oncomplete="blockWidget.hide();"  
								action="#{requestCtAdminBackingBean.gpkiSignAction(outcome)}" />
						</ui:repeat> 
						</c:if>
					</td>
			
				</tr>
			</table>
			<div align="left" class="header-info">
			 <table style="width: 100%">
				<tr>
				
					<td style="width: 15%">
						<h:outputLabel value="#{lbl['lbl.ct.loa.no']}" />
					</td>
					<td style="width: 10%">					
						<p:commandLink value="#{ctBackingBean.managedBean.contractVer.ctContractValue.loaNo}" 
					       process="@this" partialSubmit="true" styleClass="blue_font"
					       action="#{requestCtAdminBackingBean.goToLoaView(ctBackingBean.managedBean.contractVer.ctContract.loa)}"/>
					</td>
					<td style="width: 10%">
						<h:outputLabel value="#{lbl['lbl.ct.contract.no']}" />
					</td>
					<td style="width: 10%" class="header-info-text">
						#{ctBackingBean.managedBean.contractVer.ctContract.contractNo}
					</td>
					<td style="width: 10%">
						<h:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
					</td>
					<td style="width: 25%" class="header-info-text">
						#{ctBackingBean.managedBean.contractVer.ctContract.ownerOrgProfile.orgName}
					</td>
					<td style="width: 5%">
						<h:outputLabel value="#{lbl['lbl.ct.fulfilment.details.status']}" />
					</td>
					<td style="width: 15%" class="header-info-text">
						#{ctBackingBean.getStatusDescById(ctBackingBean.managedBean.contractVer.status.statusId)}
					</td>
				</tr>
	      </table>
	    </div>
	    <br/>
			<p:panel id="loaId" header="#{lbl['lbl.ct.menu.contract.details']}" toggleable="true" toggleSpeed="500">
				<h:outputText styleClass="instruction" 	value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" />
				<br />
				<br />
				<h:panelGrid columns="4" style="width:100%;"
					columnClasses="columnWidth200,columnWidth400,columnWidth300,columnWidth300">					
					
						<p:outputLabel value="#{lbl['lbl.ct.loa.no']}" />
						<p:inputText id="loaNo" style="width:200px;" disabled="true" 
							value="#{ctBackingBean.managedBean.contractVer.ctContractValue.loaNo}"/>
						
						<p:outputLabel value="#{lbl['lbl.ct.loa.date']}" />
						<p:inputText style="width:200px;" disabled="true"
							value="#{ctBackingBean.managedBean.contractVer.ctContractValue.ackDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
		
						<p:outputLabel value="#{lbl['lbl.ct.contract.no']}" />
						<h:panelGrid columns="3">
							<p:inputText style="width:200px;" disabled="true"
							    value="#{ctBackingBean.managedBean.contractVer.ctContract.contractNo}" />
							<p:spacer width="1" />
							<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.no']}" />
						</h:panelGrid>
		
						<p:outputLabel value="#{lbl['lbl.ct.loa.physical.no']}" />
						<p:inputText style="width:200px;" disabled="true"
							value="#{ctBackingBean.managedBean.contractVer.ctContractValue.loaPhysicalNo}" />
		
						<p:outputLabel value="#{lbl['lbl.ct.effective.date']}" />
						<p:inputText style="width:200px;" disabled="true"
							value="#{ctBackingBean.managedBean.contractVer.ctContractValue.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
		
						<p:outputLabel value="#{lbl['lbl.ct.expiry.date']}" />
						<p:inputText style="width:200px;" disabled="true"
							value="#{ctBackingBean.managedBean.contractVer.ctContractValue.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
		
						<p:outputLabel value="#{lbl['lbl.ct.ministry.name']}" />
						<p:inputText style="width:350px;" disabled="true"
							value="#{ctBackingBean.retrieveMinistryOrgProfile(ctBackingBean.managedBean.contractVer.ctContract.ownerOrgProfile.orgProfileId).orgName}" />
		
						<p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physical.no']}" />
						<p:inputText for="physicalNo" maxlength="100" style="width:200px;" disabled="true"
							value="#{ctBackingBean.managedBean.contractVer.contractPhysicalNo}" />
		
		
						<h:panelGroup>
							<div style="height: 40px; vertical-align: top;">
								<p:outputLabel value="#{lbl['lbl.ct.contract.title']}" />
							</div>
						</h:panelGroup>
						<h:panelGrid>
							<p:inputTextarea id="contractName" rows="3" style="width:350px;" disabled="true" 
								value="#{ctBackingBean.managedBean.contractVer.ctContract.contractName}" autoResize="false" />
						</h:panelGrid>
		
						<h:panelGroup>
							<div style="height: 40px; vertical-align: top;">
								<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.business.company.name']}" />
							</div>
						</h:panelGroup>
						<h:panelGrid>
							<p:inputTextarea id="compName" rows="3" style="width:200px;" disabled="true"
								value="#{ctBackingBean.managedBean.supplierCompanyName}" autoResize="false" />
						</h:panelGrid>
				</h:panelGrid>
		</p:panel>
		
		<!-- butiran pentadbir konrak -->
		<p:panel id="adminPanel" toggleable="true" toggleSpeed="500">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.ct.panel.requestCtAdmin']}" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.reqctadmin']}"/>
			</f:facet>
			<h:panelGrid columns="4" style="width:100%;"
				columnClasses="columnWidth200,columnWidth400,columnWidth300,columnWidth300">

					<p:outputLabel value="#{lbl['lbl.ct.contract.admin.list']}" styleClass="required" />
				    <h:panelGrid columns="2">
						<p:selectOneMenu id="contAdminId" styleClass="ppDropDownWidthM"
						disabled="#{ctBackingBean.isToShow()}" label="#{lbl['lbl.sc.loiloa.loa.cont.admin']}"  value="#{ctBackingBean.managedBean.contractVer.ctContract.assignedCtAdmin.userId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItems value="#{ctBackingBean.getUsersByAgency()}" />
					    </p:selectOneMenu>
						
				   </h:panelGrid>			
	
			</h:panelGrid>
		</p:panel>
		<!-- end butiran pentadbir kontrak -->
		<ui:include src="approverSetting.xhtml" />
		<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
		<p:confirmDialog message="#{requestCtAdminBackingBean.getCancelRequestAdminConfirmationContent(requestCtAdminBackingBean.managedBean.contractVer.docType)}"
			severity="alert" widgetVar="cancelConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					partialSubmit="true" process="@this"
					action="#{requestCtAdminBackingBean.saveRequestCtAdmin('CANCEL')}"
					onstart="cancelConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();"   />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="cancelConfirmDlg.hide()" type="button" />
			</div>
		</p:confirmDialog>
		<p:confirmDialog message="#{requestCtAdminBackingBean.getRejectRequestAdminConfirmationContent(requestCtAdminBackingBean.managedBean.contractVer.docType)}" 
			severity="alert" widgetVar="rejectConfirmDlg" closeAble="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.reject.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form" partialSubmit="true" 
					process="@this" action="#{requestCtAdminBackingBean.saveRequestCtAdmin('REJECT')}" 
					onstart="rejectConfirmDlg.hide();blockWidget.show();" 
					oncomplete="blockWidget.hide();"/>
				
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
					type="button"  onclick="rejectConfirmDlg.hide()" />
			</div>
		
		
		</p:confirmDialog>
	</ui:define>
</ui:composition>
