<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">   
	<ui:define name="contentSection">
	 <style>
      .column-align-center { text-align: center !important;}
      .top-aligned-columns td{ vertical-align: top;}
    </style> 
	<p:panel id="bankHeader">
		 <f:event listener="#{supplierBackingBean.preRenderView}" type="preRenderView" />
		   <p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	    	<table style="width: 100%;">
	    		<tr>
	    			<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" 
	    			    oncomplete="window.history.back();" rendered="#{supplierBackingBean.managedBean.taskId==null}" /></td>
	    			<td class="ppRightBtn">
	    			<ui:repeat var="outcome" value="#{supplierBackingBean.managedBean.action}">
							<p:commandButton value="#{outcome}" ajax="false" styleClass="ui-button"
							   icon="ui-icon-#{fn:toLowerCase(outcome)}" process="@form" action="#{supplierBackingBean.saveChangeBankRequest(outcome)}"/>
						</ui:repeat>	    			
	    			</td>
	    		</tr>
	    	</table>
	    	<div align="left" class="header-info">
	          <table style="width: 100%">
			   <tr>
				<td style="width: 10%">
					<h:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
				</td>
				<td style="width: 15%" class="header-info-text">
					#{supplierBackingBean.managedBean.ctContract.loaPhysicalNo}
				</td>
				<td style="width: 10%">
					<h:outputLabel value="#{lbl['lbl.ct.cno']}" />
				</td>
				<td style="width: 15%" class="header-info-text">
					#{supplierBackingBean.managedBean.ctContract.contractNo}
				</td>
				<td style="width: 10%">
							<h:outputLabel value="#{lbl['lbl.ct.ptj.sname']}" />
					</td>
					<td style="width: 15%" class="header-info-text">
							#{supplierBackingBean.managedBean.contractVer.ctContractValue.supplierName}
					</td>		
				<td style="width: 10%">
					<h:outputLabel value="#{lbl['lbl.ct.cc.status']}" />
				</td>
				<td style="width: 15%" class="header-info-text">
					#{supplierBackingBean.getStatusDescById(supplierBackingBean.managedBean.contractVer.status.statusId)}
				</td>
			</tr>
		</table>
	</div> 	
	</p:panel>
    <p:panel id="fulfilmentDetail" header="#{lbl['lbl.ct.panel.name']}" toggleable="true" toggleSpeed="500">
        <p:outputPanel id="ChangeBankAcc">
            <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth15,columnWidth20,columnWidth20,columnWidth20">
                <h:outputLabel for="contractId" value="Contract No." />
                <h:panelGrid id="menuContractId" columns="2" rendered="#{supplierBackingBean.managedBean.taskId==null}">
			      <p:selectOneMenu id="contractId" value="#{supplierBackingBean.managedBean.contractVerId}"  required="true" label="Contract No"
			         style="width:210px;margin-bottom: 3px;">
			         <f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
				        <f:selectItems value="#{supplierBackingBean.populateContractList}"/>
				        <p:ajax event="change" process="@this" update="fulfilmentDetail,bankHeader,accountId,bankId,supplierDetails" 
				           listener="#{supplierBackingBean.changeContractActionListener}"/>
				     </p:selectOneMenu>
				   <p:message for="contractId" display="icon"/>
				</h:panelGrid>
			     <p:inputText value="#{supplierBackingBean.managedBean.ctContract.contractNo}" style="width:200px;" disabled="true"
			       rendered="#{supplierBackingBean.managedBean.taskId != null}"/>
			     <p:outputLabel value="#{lbl['lbl.ct.physicalNo']}" />
		         <p:inputText disabled="true" style="width:200px;"
			        value="#{supplierBackingBean.managedBean.ctContract.contractPhysicalNo}"/>	
			     <p:outputLabel value="#{lbl['lbl.ct.effectiveDate']}" />
			     <p:inputText disabled="true" style="width:200px;" value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.effDate}">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />			           
			     </p:inputText>
			     <h:outputLabel value="#{lbl['lbl.ct.edate']}" />
			     <p:inputText disabled="true" style="width:200px;" value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.expDate}">
			     	<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			     </p:inputText>    
		         <h:panelGroup>
		            <div style="height: 40px; vertical-align: top;">
			            <p:outputLabel  value="Contract Title"/>
			        </div>
		        </h:panelGroup>
		        <h:panelGrid>
		           <p:inputTextarea id="contractName" value="#{supplierBackingBean.managedBean.ctContract.contractName}" 
			           rows="3" cols="35" disabled="true" autoResize="false" />	
			    </h:panelGrid>
			 </h:panelGrid>
		</p:outputPanel>
	</p:panel>
    <p:panel id="bankId" header="Bank Details"  toggleable="true"  toggleSpeed="500">
        <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth15,columnWidth20,columnWidth20,columnWidth20">
           <p:outputLabel  value="Bank A/C" />
             <h:panelGrid id="menuBankId" columns="2"  rendered="#{supplierBackingBean.managedBean.taskId==null}">
              <p:selectOneMenu id="accountId" required="true" style="width:210px;margin-bottom: 5px;" label="Bank A/C"
                value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.bankAccountNo}">
			     <f:selectItem itemLabel="-Select One-" itemValue="#{null}"/>
			     <f:selectItems value="#{supplierBackingBean.populateBankAccountList}"/>
			     <p:ajax event="change" process="@this" update="bankId,bankHeader" 
			      listener="#{supplierBackingBean.changeAccountActionListener}"/>
		   </p:selectOneMenu>
		   <p:message for="accountId" display="icon"/>
		  </h:panelGrid>
		   <p:inputText  style="width:200px;" disabled="true" rendered="#{supplierBackingBean.managedBean.taskId!=null}"
		      value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.bankAccountNo}"/> 
		   <f:verbatim />
		   <f:verbatim />		   
		   <p:outputLabel  value="#{lbl['lbl.ct.bank.name']}"/>
		   <p:inputText  disabled="true" style="width:200px;"
		     value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.bankName}" />		
		   <f:verbatim />
		   <f:verbatim />			           
		   <p:outputLabel value="#{lbl['lbl.ct.bank.branch']}" /> 
		   <p:inputText disabled="true" style="width:200px;"
		     value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.bankBranch}" />
		   <f:verbatim />
		   <f:verbatim />			     
           <h:panelGroup>
			 <div style="height:40px; vertical-align: top">
				 <p:outputLabel for="bankAddress" value="#{lbl['lbl.ct.bank.address']}" />
			 </div>
		   </h:panelGroup>
		   <h:panelGrid>
		       <p:inputTextarea id="bankAddress" rows="3" cols="35" disabled="true" maxlength="250" autoResize="false" 
		         value="#{supplierBackingBean.getFullAddress(supplierBackingBean.managedBean.contractVer.ctContractValue.bankAddress)}"/>
		   </h:panelGrid>  
		   <f:verbatim />
		   <f:verbatim />			                
        </h:panelGrid>
      </p:panel>
	  <p:panel id="supplierDetails" header="#{lbl['lbl.ct.su.panel.name']}"  toggleable="true"  toggleSpeed="500">
	      <h:panelGrid columns="4" style="width:100%;" styleClass="top-aligned-columns"
	          columnClasses="columnWidth15,columnWidth20,columnWidth20,columnWidth20">
             <p:outputLabel value="Business Reg. No." /> 
             <h:panelGrid columns="4">
                <p:inputText disabled="true" size="10"
                   value="#{supplierBackingBean.managedBean.ctContract.smSupplier.regNo}"/>
                   <p:spacer width="1"/>
                <p:outputLabel value="MOF No." />  
                <p:inputText disabled="true" size="10" 
                	value="#{supplierBackingBean.managedBean.ctContract.smSupplier.smMofAccounts[0].mofNo}" />
             </h:panelGrid> 
             <p:outputLabel value="Contact Person"/>  
             <p:inputText disabled="true" style="width:200px;" value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.supplierContact}"/>
             <p:outputLabel value="Supplier Name" /> 
             <p:inputText disabled="true" style="width:230px;"
                value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.supplierName}" /> 
             <p:outputLabel  value="#{lbl['lbl.ct.su.tel.office']}" />
             <p:inputText disabled="true"  style="width:200px;"
                value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.supplierPhoneNo}" />
             <p:outputLabel   value="Branch Name"/>
             <p:inputText disabled="true" style="width:200px;" value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.supplierBranch}" />
             <p:outputLabel  value="#{lbl['lbl.ct.su.fax']}"/>
             <p:inputText   disabled="true" style="width:200px;" value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.supplierFaxNo}" /> 
             <h:panelGroup>
			   <div style="height: 40px; vertical-align: top">
			     <p:outputLabel for="supplierAddress" value="#{lbl['lbl.ct.su.address']}" />
			   </div>
			 </h:panelGroup>
			 <h:panelGrid>
				 <p:inputTextarea id="supplierAddress"  disabled="true"   rows="3" cols="35" autoResize="false"  
				     value="#{supplierBackingBean.getFullAddress(supplierBackingBean.managedBean.contractVer.ctContractValue.supplierAddress)}"/>
			 </h:panelGrid>
			 <p:outputLabel  value="#{lbl['lbl.ct.su.email']}"/> 
			 <p:inputText disabled="true" style="width:200px;" value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.supplierEmail}" />
		</h:panelGrid>
	 </p:panel>
         <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
    </ui:define>
</ui:composition>
