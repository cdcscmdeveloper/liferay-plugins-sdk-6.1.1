<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
       <p:panel id="sbd" header="#{lbl['lbl.ct.su.panel.name']}"  toggleable="true"  toggleSpeed="500" 
          widgetVar="panelsbd">
         <h:panelGrid columns="2" style="width:650px;">  
           <h:panelGrid columns="2" style="width:320px;">  
              <p:outputLabel value="#{lbl['lbl.ct.su.id']}" />  
              <p:inputText  disabled="true" style="width:150px;" />  
              <p:outputLabel  value="#{lbl['lbl.ct.su.email']}"/>  
              <p:inputText   disabled="true"   style="width:150px;" />
              <p:outputLabel  value="#{lbl['lbl.ct.su.tel.hp']}"/>  
              <p:inputText  disabled="true" style="width:110px;" />  
              <h:outputLabel  value="#{lbl['lbl.ct.su.fax']}"/>
              <p:inputText   disabled="true" style="width:110px;" />  
              <h:outputLabel  value="#{lbl['lbl.ct.su.tel.office']}" />  
              <p:inputText  disabled="true"  style="width:110px;" />
              <h:panelGroup>
				<div style="height: 30px; vertical-align: top">
					<p:outputLabel for="supplierAddress" value="#{lbl['lbl.ct.su.address']}" />
			    </div>
			  </h:panelGroup>
			  <h:panelGrid>
				<p:inputTextarea id="supplierAddress"  value=""  rows="2" cols="20"   maxlength="150"  autoResize="false" />
			  </h:panelGrid>
            </h:panelGrid>  
            <h:panelGrid columns="2" style="width:330px;">  
              <h:outputLabel  value="#{lbl['lbl.ct.su.name']}" />  
              <p:inputText  disabled="true" style="width:150px;" />  
              <h:outputLabel  value="Bank A/C" />  
                <p:selectOneMenu value=" " style="width:110px;">
            	   <f:selectItem itemLabel="-Please Select--" itemValue="" /> 
            	   <f:selectItem itemLabel="011234560987" itemValue="1" /> 
            	   <f:selectItem itemLabel="011234560986" itemValue="2" /> 
                </p:selectOneMenu>     
               <h:outputLabel  value="#{lbl['lbl.ct.bank.name']}"/>  
               <p:inputText   disabled="true" style="width:150px;" />  
               <h:outputLabel  value="#{lbl['lbl.ct.bank.branch']}" />  
               <p:inputText  disabled="true" style="width:150px;" />
               <h:outputLabel  value="Bank Tel No" />  
               <p:inputText disabled="true"  style="width:110px;" />
               <h:panelGroup>
				  <div style="height: 30px; vertical-align: top">
					 <p:outputLabel for="bankAddress" value="#{lbl['lbl.ct.bank.address']}" />
				  </div>
			   </h:panelGroup>
			   <h:panelGrid>
				  <p:inputTextarea id="bankAddress" value="" rows="2" cols="20"  maxlength="50"  autoResize="false" />
			   </h:panelGrid>
             </h:panelGrid>
           </h:panelGrid> 
       </p:panel>
</ui:composition>
