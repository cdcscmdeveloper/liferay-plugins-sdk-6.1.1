<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	 <f:event listener="#{supplierBackingBean.preRenderView}" type="preRenderView" />
		<p:panel>
		   <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	    	<table style="width: 100%;">
	    		<tr>
	    			<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" /></td>
	    			<td class="ppRightBtn">
	    			<ui:repeat var="outcome"	value="#{supplierBackingBean.managedBean.action}">
							<p:commandButton value="#{outcome}" ajax="false" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(outcome)}" 
								action="#{supplierBackingBean.saveFactoringRequest(outcome)}" />
						</ui:repeat>	    			
	    			</td>
	    		</tr>
	    	</table>
			<table style="width: 99%; margin-left: 25px;" class="header-info">
				<tr style="margin-button: 10px;">
				     <td>	
							<p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
					</td>
					<td>
							<p:inputText size="20" disabled="true"
								value="#{supplierBackingBean.managedBean.ctContract.loaNo}"  />	
					</td>		
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
					</td>
					<td>
							<p:inputText size="20" disabled="true"
								value="#{supplierBackingBean.managedBean.ctContract.contractNo}" />
					</td>
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.ptj.sname']}" />
					</td>
					<td>
							<p:inputText size="30" disabled="true" value="#{supplierBackingBean.managedBean.ctContract.smSupplier.companyName}"/>
					</td>					
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.cc.status']}" />
					</td>
					<td>
							<p:inputText size="20"
								value="#{supplierBackingBean.getStatusDescById(supplierBackingBean.managedBean.contractVer.status.statusId)}"
								disabled="true" />
					</td>
				</tr>
			</table>	    		
	</p:panel>
	  <p:panel id="loaId" header="LOA Details"    toggleable="true"  toggleSpeed="500">
	   <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth15,columnWidth20,columnWidth20,columnWidth20">
			<p:outputLabel value="LOA No." />
			<p:selectOneMenu style="width:180px;" value="#{supplierBackingBean.managedBean.factoring.loa.loaId}"
			         rendered="#{supplierBackingBean.managedBean.chkMenuOrTxtBox == null}" >
				     <f:selectItem itemLabel="-Please Select--" itemValue="" />
				     <f:selectItem itemLabel="LOA-123" itemValue="1" />
				     </p:selectOneMenu>
			          <p:inputText  style="width:170px;" disabled="true"
			           rendered="#{supplierBackingBean.managedBean.chkMenuOrTxtBox == 'BPM'}"></p:inputText>
		       <p:outputLabel value="LOA Date" />
		       <p:inputText style="width:170px;"  disabled="true"/> 
		      
		       <p:outputLabel value="Contract No." />
		       <p:inputText style="width:170px;"  disabled="true"/>
		       <p:outputLabel value="Contract Name" />
		       <p:inputText style="width:170px;"  disabled="true"/> 
	           
	           <p:outputLabel value="Contract Effective Date" />
	           <p:inputText style="width:170px;"  disabled="true"/> 
	           <p:outputLabel value="Contract Expiry Date" />
	           <p:inputText style="width:170px;"  disabled="true"/> 
	  </h:panelGrid>
   </p:panel>
    <p:panel id="factoringPanel" header="#{lbl['lbl.ct.fc.panel.name']}"    toggleable="true"  toggleSpeed="500">
      <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth15,columnWidth20,columnWidth20,columnWidth20">
         <p:outputLabel  value="Factoring Company"/> 
		 <p:selectOneMenu style="width:180px;">
            <f:selectItems value="#{supplierBackingBean.retrieveFinancialOrgList()}" /> 
         </p:selectOneMenu> 
         <p:outputLabel  value="Factoring Agreement"/> 
         
           <h:panelGroup id="uploadBondPg">
             <h:panelGrid columns="3">
			 <p:commandButton oncomplete="uploadBondDlg.show();return false;" icon="iconAttachment"  update="factoringPanel">
				<f:setPropertyActionListener value="#{data}" target="#{amendmentBackingBean.managedBean.ctPerformanceBond}" /></p:commandButton>	
				<p:spacer width="1"/>
		     <h:commandLink value="#{amendmentBackingBean.fileNames('khan.doc')}" 
				style="float:left;" styleClass="blue_font" action="#{amendmentBackingBean.downloadFile('khan.doc')}"/>		
				</h:panelGrid>			
		   </h:panelGroup> 
         
          <p:outputLabel  value="Factoring Branch"/> 
		 <p:selectOneMenu style="width:180px;">
            <f:selectItem itemLabel="-Please Select--" itemValue="" /> 
         </p:selectOneMenu> 
		 <p:outputLabel  value="Authorization Ref No."/> 
         <p:inputText value="#{supplierBackingBean.managedBean.factoring.authRefNo}" style="width:170px;" disabled="false"/>
         <p:outputLabel  value="Payment Bank Name"/> 
         <p:inputText value="#{supplierBackingBean.managedBean.factoring.authRefNo}" style="width:170px;" disabled="false"/>
         <p:outputLabel value="Start Date"/>
         <p:calendar size="25" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				          value="#{supplierBackingBean.managedBean.factoring.effDate}"
				id="effdateCal" showOn="button" />
		  <p:outputLabel value="Account No." /> 
           <p:inputText style="width:170px;"  disabled="true"/> 
          <p:outputLabel value="End Date"/>
          <p:calendar size="25" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				          value="#{supplierBackingBean.managedBean.factoring.expDate}" id="expdateCal" showOn="button" />
      </h:panelGrid>
       <p:dialog id="uploadBondDlg" widgetVar="uploadBondDlg" modal="false" resizable="false" width="700px" height="350" 
	   	    styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		    <p:ajax event="close" />
	      	<p:fileUpload style="display:inline;" mode="advanced" 
			  fileUploadListener="#{supplierBackingBean.fileUpload}" 
			  allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			  invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			  update="factoringPanel" >
		    </p:fileUpload> 
	    </p:dialog>
     </p:panel>
     <p:panel id="calausePanel" header="Caluse Details"    toggleable="true"  toggleSpeed="500">
     <p:spacer height="8"/>
	    <table style="width: 100%">
				<tr>
					<td style="width: 15%;"><f:verbatim /></td>
					<td><p:outputLabel
							value="Therefore, according to the terms related to the payment for the requisition below, 
							 The Government need to pay all that is needed to Us under the specific requisition directly to the (Fill in the Factoring company)"/></td>
				</tr>
				<tr>
				<td /><td><p:commandButton value="View Factoring Clauses"/></td>
				</tr>
				<tr>
					<td />
					<td><p:selectBooleanCheckbox /><h:outputText value="I Agree" /></td>
				</tr>
			</table>
     </p:panel>
       <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
   </ui:define>
</ui:composition>
