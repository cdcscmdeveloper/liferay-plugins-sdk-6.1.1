<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
		<script>
			$('#portlet_ctRequestFactoring_WAR_NGePportlet').find('.portlet-title-text').html('#{supplierBackingBean.getPortletTitle()}');
		</script>
		<p:panel id="headerDetails">
		    <f:event listener="#{supplierBackingBean.preRenderView}" type="preRenderView" />
		   <p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	    	<table style="width: 100%;">
	    		<tr>
	    			<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" rendered="#{supplierBackingBean.managedBean.taskId==null}" /></td>
	    			<td class="ppRightBtn">
	    			<ui:repeat var="outcome" value="#{supplierBackingBean.managedBean.action}">
							<p:commandButton value="#{outcome}" ajax="false" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(outcome)}" 
								action="#{supplierBackingBean.saveFactoringRequest(outcome)}" />
						</ui:repeat>	    			
	    			</td>
	    		</tr>
	    	</table>
			<table style="width: 99%; margin-left: 0px;" class="header-info">
				<tr style="margin-button: 0px;">
				     <td>	
							<p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
					</td>
					<td>
							<p:inputText size="20" disabled="true"
								value="#{supplierBackingBean.managedBean.ctContract.loaPhysicalNo}"  />	
					</td>		
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
					</td>
					<td>
							<p:inputText size="20" disabled="true"
								value="#{supplierBackingBean.managedBean.ctContract.contractNo}" />
					</td>
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.ptj.sname']}" />
					</td>
					<td>
							<p:inputText size="30" disabled="true" 
							  value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.supplierCompanyName}"/>
					</td>					
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.cc.status']}" />
					</td>
					<td>
							<p:inputText size="30"
								value="#{supplierBackingBean.getStatusDescById(supplierBackingBean.managedBean.factoring.status.statusId)}"
								disabled="true" />
					</td>
				</tr>
			</table>	    		
	</p:panel>
	  <p:panel id="loaId" header="LOA Details" toggleable="true"  toggleSpeed="500">
	   <h:panelGrid columns="4" style="width:100%;" columnClasses="columnWidth15,columnWidth20,columnWidth20,columnWidth20">
			<p:outputLabel value="LOA No." />
			<p:selectOneMenu style="width:210px;" value="#{supplierBackingBean.managedBean.loaId}"
			   rendered="#{supplierBackingBean.managedBean.taskId==null}" >
			   <f:selectItems value="#{supplierBackingBean.getSupplierLoaDropdown()}"/>
			    <p:ajax event="change" process="@this" update="@form" listener="#{supplierBackingBean.setActionListener()}"/> 
		     </p:selectOneMenu>
			 <p:inputText  style="width:200px;" disabled="true" 
			    value="#{supplierBackingBean.managedBean.ctContract.loa.loaNo}"
			    rendered="#{supplierBackingBean.managedBean.taskId!=null}"/>
		       <p:outputLabel value="LOA Date" />
		       <p:inputText style="width:200px;" disabled="true" value="#{supplierBackingBean.managedBean.loaDate}"> 
		         	<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
		       </p:inputText>
		       <p:outputLabel value="Contract No." />
		       <p:inputText style="width:200px;"  value="#{supplierBackingBean.managedBean.contractNo}" disabled="true"/>
		       <p:outputLabel value="Contract Name" />
		       <p:inputText style="width:200px;" disabled="true"
		         value="#{supplierBackingBean.managedBean.contractName}"/> 
	           <p:outputLabel value="Contract Effective Date" />
	           <p:inputText style="width:200px;" disabled="true" value="#{supplierBackingBean.managedBean.effDate}" >
	              <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
	           </p:inputText> 
	           <p:outputLabel value="Contract Expiry Date" />
	           <p:inputText style="width:200px;" disabled="true" value="#{supplierBackingBean.managedBean.expDate}"> 
	              <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
	           </p:inputText> 
	  </h:panelGrid>
   </p:panel>
    <p:panel id="factoringPanel" header="#{lbl['lbl.ct.fc.panel.name']}"    toggleable="true"  toggleSpeed="500">
      <h:panelGrid columns="4" style="width:100%;" columnClasses="columnVCenterWidth15,columnWidth20,columnWidth20,columnWidth20">
         <p:outputLabel  value="Factoring Company"/> 
		 <p:selectOneMenu style="width:210px;" disabled="#{supplierBackingBean.managedBean.removeFactoring}"
		    value="#{supplierBackingBean.managedBean.factoring.financialOrg.financialOrgId}">
              <f:selectItems value="#{supplierBackingBean.retrieveFinancialOrgList()}" /> 
              <p:ajax event="change" process="@this" update="branchId,bankName,accNo,clausePanel" listener="#{supplierBackingBean.reset}"/>
         </p:selectOneMenu>
				<h:panelGrid columns="2" style="float:right;">
					<p:outputLabel value="*" styleClass="mandatory" />
					<p:outputLabel value="Authorization Ref No." />
				</h:panelGrid>
				<h:panelGrid columns="2">
					 <p:inputText id="authRefNo" value="#{supplierBackingBean.managedBean.factoring.authRefNo}" 
					 	style="width:200px;" label="Authorization Ref No." required="true" 
					 	disabled="#{supplierBackingBean.managedBean.removeFactoring}" />
					 <p:message for="authRefNo" display="icon" />				
				</h:panelGrid>
         <p:outputLabel  value="Factoring Branch"/> 
		 <p:selectOneMenu id="branchId" style="width:210px;" disabled="#{supplierBackingBean.managedBean.removeFactoring}" 
		    value="#{supplierBackingBean.managedBean.factoring.pmFinancialBranch.financialBranchId}">
            <f:selectItems value="#{supplierBackingBean.retrieveFinancialBranchOrgById()}"/> 
             <p:ajax event="change" process="@this" update="bankName,accNo" listener="#{supplierBackingBean.reset}"/>
         </p:selectOneMenu> 
				<h:panelGrid columns="2" style="float:right;">
					<p:outputLabel value="*" styleClass="mandatory" />         
         			<p:outputLabel value="Start Date"/>
         		</h:panelGrid>
         		<h:panelGrid columns="2">
         			<p:calendar size="30" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" required="true"
		    			value="#{supplierBackingBean.managedBean.factoring.effDate}" id="effdateCal" showOn="button" 
		    			disabled="#{supplierBackingBean.managedBean.removeFactoring}" />
					 <p:message for="effdateCal" display="icon" />				
				</h:panelGrid>		    			
         <p:outputLabel  value="Payment Bank Name"/> 
         <p:inputText id="bankName" value="#{supplierBackingBean.getPaymentBankName()}" style="width:200px;" disabled="true"/>
				<h:panelGrid columns="2" style="float:right;">
					<p:outputLabel value="*" styleClass="mandatory" />
					<p:outputLabel value="End Date" />
				</h:panelGrid>
				<h:panelGrid columns="2">
		 			<p:calendar size="30" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" required="true"
		    			 value="#{supplierBackingBean.managedBean.factoring.expDate}" id="expdateCal" showOn="button" 
		    			 disabled="#{supplierBackingBean.managedBean.removeFactoring}" />
					 <p:message for="expdateCal" display="icon" />				
				</h:panelGrid>		  		    			 
		 <p:outputLabel value="Account No."/> 
         <p:inputText id="accNo" style="width:200px;"  disabled="true"
            value="#{supplierBackingBean.managedBean.accountNo}"/>
				<f:verbatim	rendered="#{!supplierBackingBean.managedBean.removeFactoring}" />
				<f:verbatim	rendered="#{!supplierBackingBean.managedBean.removeFactoring}" />
				<p:outputLabel value="Status" rendered="#{supplierBackingBean.managedBean.removeFactoring}" />
				<p:selectOneMenu style="width:210px;" rendered="#{supplierBackingBean.managedBean.removeFactoring}" disabled="true"
					value="#{supplierBackingBean.managedBean.factoring.recordStatusFlg}">
					<f:selectItem itemValue="0" itemLabel="Inactive" />
					<f:selectItem itemValue="1" itemLabel="Active" />
				</p:selectOneMenu>
				<h:panelGrid columns="2" style="float:right;">
					<p:outputLabel value="*" styleClass="mandatory" />
					<p:outputLabel value="Factoring Agreement" />
				</h:panelGrid>
				<h:panelGroup id="uploadFactoringPg">
           <h:panelGrid columns="3">
			 <p:commandButton oncomplete="uploadFactoringDlg.show();return false;" icon="iconAttachment" value="Upload"
			 	disabled="#{supplierBackingBean.managedBean.removeFactoring}" update="factoringPanel" />	
				<p:spacer width="1"/>
		     <h:commandLink value="#{supplierBackingBean.managedBean.factoring.fileName}" 
		        style="float:left;" styleClass="blue_font"  rendered="#{supplierBackingBean.managedBean.factoring.filePath != null}" 
				action="#{supplierBackingBean.downloadFile(supplierBackingBean.managedBean.factoring.filePath)}"/>		
		    </h:panelGrid>		
		  </h:panelGroup> 
      </h:panelGrid>
       <p:dialog id="uploadFactoringDlg" widgetVar="uploadFactoringDlg" modal="false" resizable="false" width="700px" height="350" 
	   	    styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		    <p:ajax event="close" />
	      	<p:fileUpload style="display:inline;" mode="advanced" 
			  fileUploadListener="#{supplierBackingBean.fileUpload}" 
			  allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			  invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			  update="factoringPanel">
		    </p:fileUpload> 
	    </p:dialog>
     </p:panel>
     <p:panel id="clausePanel" header="Clause Details" toggleable="true"  toggleSpeed="500"
      rendered="#{!supplierBackingBean.managedBean.removeFactoring and !supplierBackingBean.approverRole}" >
       <p:spacer height="8"/>
	      <table style="width: 100%">
			 <tr>
				<td style="width: 15%;"><f:verbatim/></td>
				<td><p:outputLabel
					   value="Therefore, according to the terms related to the payment for the requisition below, 
					   The Government need to pay all that is needed to Us under the specific requisition directly to the #{supplierBackingBean.getFactoringCompany()}"/></td>
				</tr>
				<tr><td />
				 <td>
				 <p:commandButton value="View Factoring Clauses" process="@this" immediate="true" update="editorDisplay" actionListener="#{supplierBackingBean.previewAction()}" oncomplete="factoringClauseDlg.show();"/>
			  	</td>
				</tr>
				<tr><td />
				  <td><p:selectBooleanCheckbox value="#{supplierBackingBean.managedBean.agreeFactoringClause}" /><h:outputText value="I Agree"/></td>
				</tr>
			</table>
	        <p:dialog id="factoringClauseDlg" header="Factoring Clause" widgetVar="factoringClauseDlg" modal="true" width="820" height="450">
    	    	<p:editor controls="print" id="editorDisplay" value="#{supplierBackingBean.editorValue}" width="800" height="430" />
    	    </p:dialog>
     </p:panel>
       <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
   </ui:define>
</ui:composition>
