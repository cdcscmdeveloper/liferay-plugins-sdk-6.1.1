<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	<p:panel>
     <f:event listener="#{supplierBackingBean.preRenderView}" type="preRenderView" />
	 <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	  <div class="ppRightBtn">
				<ui:repeat var="outcome"	value="#{supplierBackingBean.managedBean.action}">
					<p:commandButton value="#{outcome}" process="@this" styleClass="ui-button" action="#{supplierBackingBean.saveFactoringRequest(outcome)}" />
				</ui:repeat>		
    </div>
	</p:panel>
	  <p:panel id="loaId" header="LOA Details"    toggleable="true"  toggleSpeed="500">
	  <table style="width: 100%">
			<tr>
			    <td style="width:200px;">  <p:outputLabel value="LOA No." /></td>
			    <td> <p:selectOneMenu style="width:180px;" value="#{supplierBackingBean.managedBean.factoring.loa.loaId}"
			         rendered="#{supplierBackingBean.managedBean.chkMenuOrTxtBox == null}" >
				     <f:selectItem itemLabel="-Please Select--" itemValue="" />
				     <f:selectItem itemLabel="LOA-123" itemValue="1" />
				     <f:selectItem itemLabel="LOA-456" itemValue="2" />
			         </p:selectOneMenu>
			          <p:inputText value="LOA-123" style="width:170px;" disabled="true"
			           rendered="#{supplierBackingBean.managedBean.chkMenuOrTxtBox == 'BPM'}"></p:inputText></td>
		       <td style="width:200px;"> 	<p:outputLabel value="LOA Date" /></td>
		       <td><p:inputText style="width:170px;"  disabled="true"/> </td>
		   </tr>
	       <tr>
		       <td>	<p:outputLabel value="Contract No." /></td>
		       <td>	<p:inputText style="width:130px;"  disabled="true"/> </td>
		       <td>	<p:outputLabel value="Contract Name" /></td>
		       <td>	<p:inputText style="width:170px;"  disabled="true"/> </td>
	      </tr>
	      <tr>
	           <td>	<p:outputLabel value="Contract Effective Date" /></td>
	           <td>	<p:inputText style="width:130px;"  disabled="true"/> </td>
	           <td>	<p:outputLabel value="Contract Expiry Date" /></td>
	           <td>	<p:inputText style="width:130px;"  disabled="true"/> </td>
	     </tr>
	   </table>
   </p:panel>
    <p:panel id="factoringId" header="#{lbl['lbl.ct.fc.panel.name']}"    toggleable="true"  toggleSpeed="500">
      	<table style="width: 100%">
		     <tr>
		          <td style="width:200px;"> <p:outputLabel  value="Factoring Name"/>  </td>
		          <td>	<p:selectOneMenu style="width:180px;">
                        <f:selectItem itemLabel="-Please Select--" itemValue="" /> 
                        <f:selectItem itemLabel="RHB Group" itemValue="1" /> 
                        <f:selectItem itemLabel="CIMB Group" itemValue="2" /> 
                        </p:selectOneMenu>     </td>
		          <td style="width:200px;">	 <p:outputLabel  value="Authorized Ref No."/>  </td>
                  <td>  <p:inputText value="#{supplierBackingBean.managedBean.factoring.authRefNo}" style="width:170px;" disabled="false"/></td>
             </tr>
             <tr>
                  <td>  <p:outputLabel value="Effective Date"/></td>
                  <td>  <p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				          value="#{supplierBackingBean.managedBean.factoring.effDate}"
				id="effdateCal" showOn="button" /></td>
                  <td> <p:outputLabel value="Expiry Date"/></td>
                  <td> <p:calendar style="width:170px;" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				          value="#{supplierBackingBean.managedBean.factoring.expDate}" id="expdateCal" showOn="button" /></td>
             </tr>
             <tr>
                  <td> <p:outputLabel value="Account No." />  </td>
                  <td> <p:inputText style="width:120px;"  disabled="true"/> </td>
                 <td><f:verbatim></f:verbatim></td>
                 <td><f:verbatim></f:verbatim></td>
            </tr>
            <tr>
            <td>        
                <h:panelGroup>
			        <div style="height:40px;vertical-align: top;">
				    <p:outputLabel for="fcaddress" value="Factoring Address"  />
			        </div>
		            </h:panelGroup></td>
		    <td>   <h:panelGrid>
		           <h:inputTextarea id="fcaddress" value="125, Jalan P RamLee, KL" rows="3" cols="34"  autoResize="false" />
	               </h:panelGrid></td>
	               <td></td>
	               <td></td>
	       </tr>
	    </table>
	    <p:spacer height="8"/>
	    <table style="width: 92%">
	     <tr>
	         <td style="width:200px;"><f:verbatim/></td>
	         <td><p:outputLabel value="Therefore, according to the terms related to the payment for the requisition below, 
	               The Government need to pay all that is needed to Us under the specific requisition directly to the (fill in the factoring company)"/></td>
	     </tr>
	     <tr>
	       <td><p:outputLabel value="I Agree With Term"/></td>
	        <td><p:selectBooleanCheckbox/>  </td>
	        </tr>
	    </table>
     </p:panel>
       <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
   </ui:define>
</ui:composition>
