<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<script>
			$('#portlet_ctContractMaintenance_WAR_NGePportlet').find(
					'.portlet-title-text').html('#{supplierBackingBean.getFactoringLabel()}');
			
			$('#portlet_ctRequestFactoring_WAR_NGePportlet').find(
					'.portlet-title-text').html('#{supplierBackingBean.getTaskListPortletTitle()}');
			
	   </script>
	  
	   <style>

           .columnWidth200 {
				width: 225px;
				vertical-align: top;
				text-align: right;
		   }

			.columnWidth400 {
					width: 375px;
			}

			.columnWidth300 {
				width: 300px;
			}
			
			 .fileupload-buttonbar.ui-widget-header.ui-corner-top {
                padding: 0.0em 0.0em;
                padding-top: 0em;
                padding-right: 0em;
                padding-bottom: 0em;
                padding-left: 0em;
        }
		</style>
		<script type="text/javascript">  
           window.addEventListener('keydown',function(e)
    		      {
    	                  if(e.keyIdentifier=='U+000A'||e.keyIdentifier=='Enter'||e.keyCode==13)
    	                       {
    	            	            e.preventDefault();return false;
    	                   }
    	        },  true);
      </script>
			<p:blockUI block=":form" widgetVar="blockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif" />
			</p:blockUI>
			<ac:gpkiPopup textBeforeSign="#{supplierBackingBean.managedBean.textBeforeSign}"
				postSignAction="#{supplierBackingBean.preSubmitFactoringRequest(gpkiBackingBean.pmDigiSign)}" />
			<ac:spkiPopup password="#{supplierBackingBean.managedBean.spkiBackingBean.password}"
				challengeAns1="#{supplierBackingBean.managedBean.spkiBackingBean.challengeAns1}"
				challengeQues1="#{supplierBackingBean.managedBean.spkiBackingBean.challengeQues1}"
				postSignAction="#{supplierBackingBean.preSubmitFactoringRequest(spkiBackingBean.pmDigiSign)}"
				enableAutoUpdate="#{supplierBackingBean.enableAutoUpdate()}" />
			<f:event listener="#{supplierBackingBean.preRenderView}" type="preRenderView" />
			<p:messages id="messages" showSummary="false" showDetail="true"
				autoUpdate="#{supplierBackingBean.managedBean.autoUpdate}"
				closable="true" severity="error, info" />
			<table style="width: 100%;">
			    <tr>
				     <td>
					       <p:commandButton value="#{lbl['lbl.btn.back']}"  
						        immediate="true"  rendered="#{supplierBackingBean.managedBean.taskId==null}" 
						       action="#{supplierBackingBean.backAction}" onstart="blockWidget.show();"  oncomplete="blockWidget.hide();"/>
				    </td>
				    <td class="ppRightBtn">
				         <ui:repeat var="outcome" value="#{supplierBackingBean.managedBean.outComes}">
						       <ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(outcome)}" />
								<p:commandButton value="#{lbl[buttonLabel]}" update="@form,@([id$=messages])"
									styleClass="ui-button" onstart="blockWidget.show();"	 oncomplete="blockWidget.hide();" 	
									 process="@form" action="#{supplierBackingBean.factoringRequestSignAction(outcome)}"
									rendered="#{!supplierBackingBean.managedBean.viewOnly and not supplierBackingBean.isSupplierRole()}"/>
								<p:commandButton value="#{lbl[buttonLabel]}" update="@form,@([id$=messages])"
									styleClass="ui-button" process="@form" onstart="blockWidget.show();"	
									onkeypress="if (event.keyCode == 13) { return false; }"	
									oncomplete="blockWidget.hide();"  action="#{supplierBackingBean.factoringRequestSignAction(outcome)}"
									actionListener="#{spkiBackingBean.getChallengeQuestions}"
									rendered="#{!supplierBackingBean.managedBean.viewOnly and supplierBackingBean.isSupplierRole()}"/>
					    </ui:repeat>
			     </td>
			  </tr>
		   </table>

		   <div align="left" class="header-info">
				<table style="width: 100%">
					<tr>
						<td style="width: 20%"><h:outputLabel value="#{lbl['lbl.ct.loa.no']}" /></td>
						<td style="width: 10%" class="header-info-text">
							<p:commandLink value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.loaNo}" 
								process="@this" partialSubmit="true" styleClass="blue_font"
						       	action="#{supplierBackingBean.goToLoaView(supplierBackingBean.managedBean.ctContract.loa.loaId)}"/>
						</td>
						
						<td style="width: 10%"><h:outputLabel value="#{lbl['lbl.ct.contract.no']}" /></td>
						<td style="width: 10%" class="header-info-text">
							#{supplierBackingBean.managedBean.ctContract.contractNo}
					    </td>
						
						<td style="width: 10%"><h:outputLabel value="#{lbl['lbl.ct.supplier.name']}" /></td>
						<td style="width: 15%" class="header-info-text">
							 #{supplierBackingBean.managedBean.contractVer.ctContractValue.supplierName}
					     </td>
						
						<td style="width: 10%"><h:outputLabel value="#{lbl['lbl.ct.status']}" /></td>
						<td style="width: 15%" class="header-info-text">
							#{supplierBackingBean.getStatusDescById(supplierBackingBean.managedBean.factoring.status.statusId)}
						</td>
					</tr>
				</table>
			 </div>
		   <br/>
		   
		   <p:panel id="loaId" header="#{lbl['lbl.ct.menu.loa.details']}" toggleable="true" toggleSpeed="500">
				<h:outputText styleClass="instruction" 	value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" />
				<br />
				<br />
				<h:panelGrid columns="4" style="width:100%;"
					columnClasses="columnWidth200,columnWidth400,columnWidth300,columnWidth300">					
					
						<p:outputLabel value="#{lbl['lbl.ct.loa.no']}" />
						<p:inputText id="loaNo" style="width:200px;" disabled="true" 
							value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.loaNo}"/>
						
						<p:outputLabel value="#{lbl['lbl.ct.loa.date']}" />
						<p:inputText style="width:200px;" disabled="true"
							value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.ackDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
		
						<p:outputLabel value="#{lbl['lbl.ct.contract.no']}" />
						<h:panelGrid columns="3">
							<p:inputText style="width:200px;" disabled="true"
							    value="#{supplierBackingBean.managedBean.ctContract.contractNo}" />
							<p:spacer width="1" />
							<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.no']}" />
						</h:panelGrid>
		
						<p:outputLabel value="#{lbl['lbl.ct.loa.physical.no']}" />
						<p:inputText style="width:200px;" disabled="true"
							value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.loaPhysicalNo}" />
		
						<p:outputLabel value="#{lbl['lbl.ct.effective.date']}" />
						<p:inputText style="width:200px;" disabled="true"
							value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
		
						<p:outputLabel value="#{lbl['lbl.ct.expiry.date']}" />
						<p:inputText style="width:200px;" disabled="true"
							value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
		
						<p:outputLabel value="#{lbl['lbl.ct.ministry.name']}" />
						<p:inputText style="width:350px;" disabled="true"
							value="#{supplierBackingBean.retrieveMinistryOrgProfile(supplierBackingBean.managedBean.ctContract.ownerOrgProfile.orgProfileId).orgName}" />
		
						<p:outputLabel id="physicalNo" value="#{lbl['lbl.ct.physical.no']}" />
						<p:inputText for="physicalNo" maxlength="30" style="width:200px;" disabled="true"
							value="#{supplierBackingBean.managedBean.contractVer.contractPhysicalNo}" />
		
		
						<h:panelGroup>
							<div style="height: 40px; vertical-align: top;">
								<p:outputLabel value="#{lbl['lbl.ct.contract.title']}" />
							</div>
						</h:panelGroup>
						<h:panelGrid>
							<p:inputTextarea id="contractName" rows="3" style="width:350px;" disabled="true" 
								value="#{supplierBackingBean.managedBean.ctContract.contractName}" autoResize="false" />
						</h:panelGrid>
		
						<h:panelGroup>
							<div style="height: 40px; vertical-align: top;">
								<p:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
							</div>
						</h:panelGroup>
						<h:panelGrid>
							<p:inputTextarea id="ptjName" rows="3" style="width:200px;" disabled="true"
								value="#{supplierBackingBean.managedBean.ctContract.ownerOrgProfile.orgName}" autoResize="false" />
						</h:panelGrid>
				</h:panelGrid>
		</p:panel>

		<p:panel id="factoringPanel" toggleable="true" toggleSpeed="500">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.ct.panel.factoring']}" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.dtls']}" />
			</f:facet>
			<h:panelGrid columns="4" style="width:100%;"
				columnClasses="columnWidth200,columnWidth400,columnWidth300,columnWidth300">

					<p:outputLabel value="#{lbl['lbl.ct.factoring.company']}" styleClass="required" />
				    <h:panelGrid columns="2">
						<p:selectOneMenu id="factoringId" label="#{lbl['lbl.ct.factoring.company']}" required="true"
							rendered="#{!supplierBackingBean.managedBean.removeFactoring and !supplierBackingBean.managedBean.viewOnly
								and !supplierBackingBean.isContractAdmin() and !supplierBackingBean.isApproverRole()}"
							style="width:360px;" value="#{supplierBackingBean.managedBean.factoring.financialOrg.financialOrgId}">
							    <f:selectItems value="#{supplierBackingBean.retrieveFinancialOrgList()}" />
							    <p:ajax event="change" process="@this" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								     update="bankName,clausePanel, notificationBtn" listener="#{supplierBackingBean.resetFactoringCompany}" />
						</p:selectOneMenu>
						<p:inputText style="width:360px;"
							rendered="#{supplierBackingBean.managedBean.removeFactoring or supplierBackingBean.managedBean.viewOnly
								or supplierBackingBean.isContractAdmin() or supplierBackingBean.isApproverRole()}"
							value="#{supplierBackingBean.managedBean.factoring.financialOrgName}" disabled="true" />
						<p:message for="factoringId" display="icon"></p:message>
				   </h:panelGrid>

					<p:outputLabel value="#{lbl['lbl.ct.factoring.agreement.ref']}"  styleClass="required" />
				    <h:panelGrid columns="2">
					     <p:inputText value="#{supplierBackingBean.managedBean.factoring.authRefNo}"
						      maxlength="50" style="width:200px;" label="#{lbl['lbl.ct.factoring.agreement.ref']}" id="authRefNo"
						      required="true" disabled="#{supplierBackingBean.managedBean.removeFactoring or supplierBackingBean.managedBean.viewOnly
							  or supplierBackingBean.isContractAdmin() or supplierBackingBean.isApproverRole()}">
						       <p:ajax event="change" process="@this" update="notificationBtn" />
					      </p:inputText>
					   <p:message for="authRefNo" display="icon" />
				   </h:panelGrid>

                   <p:outputLabel value="#{lbl['lbl.ct.bank.account.name']}" />
				   <h:panelGrid columns="3">
					   <p:inputText id="bankName" style="width:320px;"
						value="#{supplierBackingBean.managedBean.accBankName}" disabled="true" />
					    <p:spacer width="1" />
					    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.bank.name']}" />
				   </h:panelGrid>			
	
				   <p:outputLabel value="#{lbl['lbl.ct.start.date']}"  styleClass="required" />
				    <h:panelGrid columns="5">
					     <p:calendar id="effdateCal" size="10" required="true" showOn="button" 
						     value="#{supplierBackingBean.managedBean.factoring.effDate}" label="#{lbl['lbl.ct.start.date']}"
						     mindate="#{supplierBackingBean.managedBean.contractVer.ctContractValue.effDate}"
						     maxdate="#{supplierBackingBean.managedBean.contractVer.ctContractValue.expDate}"
						     disabled="#{supplierBackingBean.managedBean.removeFactoring or supplierBackingBean.managedBean.viewOnly
							    or supplierBackingBean.isContractAdmin() or supplierBackingBean.isApproverRole()}"
						     readonlyInput="true" navigator="true"
						     pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						       <p:ajax event="dateSelect" update="expdateCal, notificationBtn" />
					     </p:calendar>
					        <p:spacer width="1"/>
				            <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.request.effective.date']}" />
				            <p:spacer width="1"/>
					   <p:message for="effdateCal" display="icon" />
				   </h:panelGrid>
				
				   <p:outputLabel value="#{lbl['lbl.ct.copy.factoring.agreement']}"  styleClass="required" />
				    <h:panelGroup id="uploadFactoringPg">
					    <h:panelGrid columns="5">
						    <p:commandButton  oncomplete="uploadFactoringDlg.show();return false;"
							  icon="ui-icon-upload"  immediate="true" update="factoringPanel" 
							   actionListener="#{supplierBackingBean.setUploadIndexValue(2)}"
							   rendered="#{supplierBackingBean.managedBean.factoring.filePath == null}"/>			 
						     
						      <h:commandLink title="#{supplierBackingBean.managedBean.factoring.fileName}"
							     value="#{supplierBackingBean.getShortFileName(supplierBackingBean.managedBean.factoring.fileName)}"
							     style="float:left;" styleClass="blue_font" rendered="#{supplierBackingBean.managedBean.factoring.filePath != null}"
							     action="#{supplierBackingBean.downloadFile(supplierBackingBean.managedBean.factoring.filePath, supplierBackingBean.managedBean.factoring.fileName)}" />
					
					         <p:commandLink onclick="deleteFactoringAttach.show();"
						        rendered="#{supplierBackingBean.managedBean.factoring.filePath != null
									and !supplierBackingBean.managedBean.removeFactoring
									and !supplierBackingBean.isContractAdmin()
						        	and !supplierBackingBean.isApproverRole()
							       	and !supplierBackingBean.managedBean.viewOnly}" >
			   				    <h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			        	     </p:commandLink>
						      <p:spacer width="1" />
				     	      <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.agreement']}" />
					  </h:panelGrid>
				</h:panelGroup>
              
               	<p:outputLabel value="#{lbl['lbl.ct.end.date']}"  styleClass="required" />
				<h:panelGrid columns="5">
					<p:calendar id="expdateCal" size="10" required="true"
						showOn="button" label="#{lbl['lbl.ct.end.date']}" value="#{supplierBackingBean.managedBean.factoring.expDate}"
						disabled="#{supplierBackingBean.managedBean.removeFactoring or supplierBackingBean.managedBean.viewOnly
							or supplierBackingBean.isContractAdmin() or supplierBackingBean.isApproverRole()}"
						readonlyInput="true" navigator="true" mindate="#{supplierBackingBean.managedBean.factoring.effDate}"
						maxdate="#{supplierBackingBean.managedBean.contractVer.ctContractValue.expDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						<f:attribute name="startDate" value="#{supplierBackingBean.managedBean.factoring.effDate}" />
						<f:validator validatorId="primeDateRangeValidator" />
						<p:ajax event="dateSelect" update="notificationBtn" />
					</p:calendar>
					   <p:spacer width="1"/>
				            <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.request.expiry.date']}" />
				            <p:spacer width="1"/>
					<p:message for="expdateCal" display="icon" />
				</h:panelGrid>
				
			    <p:outputLabel value="#{lbl['lbl.ct.copy.factoring.removal']}" 
					  styleClass="required" rendered="#{supplierBackingBean.managedBean.removeFactoring}"  />
				     <h:panelGroup id="uploadRemoveFactoringPg" rendered="#{supplierBackingBean.managedBean.removeFactoring}">
					     <h:panelGrid columns="3">
					 		<p:commandButton  oncomplete="uploadFactoringDlg.show();return false;"
							  icon="ui-icon-upload"  immediate="true" update="factoringPanel" 
							   actionListener="#{supplierBackingBean.setUploadIndexValue(3)}"
							   rendered="#{supplierBackingBean.managedBean.factoring.removeFilePath == null}"/>			 
						     
						      <h:commandLink title="#{supplierBackingBean.managedBean.factoring.removeFileName}"
							     value="#{supplierBackingBean.getShortFileName(supplierBackingBean.managedBean.factoring.removeFileName)}"
							     style="float:left;" styleClass="blue_font" rendered="#{supplierBackingBean.managedBean.factoring.removeFilePath != null}"
							     action="#{supplierBackingBean.downloadFile(supplierBackingBean.managedBean.factoring.removeFilePath, supplierBackingBean.managedBean.factoring.removeFileName)}" />
					
					         <p:commandLink onclick="deleteFactoringAttach.show();"
						        rendered="#{supplierBackingBean.managedBean.factoring.removeFilePath!= null
									and !supplierBackingBean.isContractAdmin()
								    and !supplierBackingBean.isApproverRole()
							       and !supplierBackingBean.managedBean.viewOnly}" >
			   					<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			   				</p:commandLink>
					</h:panelGrid>
				</h:panelGroup>
				
				<f:verbatim rendered="#{!supplierBackingBean.managedBean.removeFactoring}"/>
				<f:verbatim rendered="#{!supplierBackingBean.managedBean.removeFactoring}"/>
				
				<p:outputLabel value="#{lbl['lbl.ct.ft.ag.date']}"  styleClass="required" />
				<h:panelGrid columns="2">
					<p:calendar id="agDateCal" size="10" required="true"
						showOn="button" label="#{lbl['lbl.ct.ft.ag.date']}" value="#{supplierBackingBean.managedBean.factoring.agreementDate}"
						disabled="#{supplierBackingBean.managedBean.removeFactoring or supplierBackingBean.managedBean.viewOnly
							or supplierBackingBean.isContractAdmin() or supplierBackingBean.isApproverRole()}"
						readonlyInput="true" navigator="true" 
						maxdate="#{supplierBackingBean.managedBean.contractVer.ctContractValue.expDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						<f:validator validatorId="primeDateRangeValidator" />
						<p:ajax event="dateSelect" update="notificationBtn" />
					</p:calendar>
					<p:message for="agDateCal" display="icon" />
				</h:panelGrid>
			</h:panelGrid>

			<p:dialog id="uploadFactoringDlg" widgetVar="uploadFactoringDlg"
				modal="true" width="700px" height="350px" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}" resizable="false"
				onShow="singleUploadListener(factoringUploadWV);">
				<p:ajax event="close" />
				<p:fileUpload style="display:inline;" mode="advanced" dragDropSupport="false"
				    sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}" multiple="false"
					fileUploadListener="#{supplierBackingBean.fileUpload}"  showButtons="false"
					allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" widgetVar="factoringUploadWV"
					invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}" 
					update="factoringPanel" label="#{lbl['lbl.btn.choose']}" >
				</p:fileUpload>
				<f:facet name="footer">
				<div class="ppRightBtn">
			    	<p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadFactoringDlg.hide();" />
		  		</div>
		  		</f:facet>
			</p:dialog>
		</p:panel>
		
		  <p:confirmDialog id="deleteFactoringAttachId" widgetVar="deleteFactoringAttach" message="#{lbl['lbl.msg.confirm.delete']}" 	
                severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                 <div class="ppRightBtn">
		             <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                   update=":form:factoringPanel" 
		                   action="#{supplierBackingBean.deleteFactoringAttachement()}" oncomplete="deleteFactoringAttach.hide();"/>
			          <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteFactoringAttach.hide();" type="button" />
		           </div>
          </p:confirmDialog>
		
		<p:panel id="clausePanel" header="#{lbl['lbl.ct.panel.notification.factoring']}"
			toggleable="true" toggleSpeed="500" rendered="#{!supplierBackingBean.managedBean.removeFactoring}">
			<table style="width: 100%">								
				<tr>
					<td />
					<td><p:commandButton id="notificationBtn"
							disabled="#{!supplierBackingBean.isLetterGenerated()}"
							value="#{lbl['lbl.ct.panel.notification.factoring']}"
							process="@this,approverpickList" update="editorDisplay"
							actionListener="#{supplierBackingBean.previewAction()}"
							oncomplete="factoringClauseDlg.show();" /></td>
				</tr>
				<tr rowspan="2">
					<h:panelGroup
						rendered="#{supplierBackingBean.supplierRole and !supplierBackingBean.managedBean.viewOnly}">
						<td style="width: 10%; vertical-align: top; text-align: right">
							<p:selectBooleanCheckbox id="agreeFactoring"
							     required="true" value="#{supplierBackingBean.managedBean.agreeFactoringClause}" />
						</td>
						<td><h:outputText value="#{lbl['lbl.ct.agree.factoring']}" />
							<span> #{supplierBackingBean.getFactoringCompany()}</span></td>
					</h:panelGroup>
				</tr>
				<tr>
					<h:panelGroup rendered="#{supplierBackingBean.approverRole and !supplierBackingBean.managedBean.viewOnly}">
						<td style="width: 10%; vertical-align: top; text-align: right">
							<p:selectBooleanCheckbox id="agreeCondition"
							     required="true" value="#{supplierBackingBean.managedBean.agreeFactoringClause}" />
						</td>
						<td><h:outputText value="#{lbl['lbl.ct.agree.condition']}" /></td>
					</h:panelGroup>
				</tr>
			</table>
			<p:dialog 
			     id="factoringClauseDlg" styleClass="pop_up_top" header="#{lbl['lbl.ct.factoring.clauses']}"
				widgetVar="factoringClauseDlg" modal="true" width="820" height="480" resizable="false">
				<p:editor controls="print" 
				  id="editorDisplay" value="#{supplierBackingBean.editorValue}" width="800" height="430" />
				  <p:commandButton value="#{lbl['lbl.btn.close']}" process="@this" 
				      onclick="factoringClauseDlg.hide()" style="float:right;"/>
			</p:dialog>
		</p:panel>
		<ui:include src="approverSetting.xhtml" />
		<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
	</ui:define>
</ui:composition>
