<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <p:panel id="factoringId" header="#{lbl['lbl.panel.fc.name']}"    toggleable="true"  toggleSpeed="500">
      <h:panelGrid columns="4" style="width:600px;">  
         <p:outputLabel  value="Company Name"/>  
            <p:selectOneMenu style="width:150px;">
               <f:selectItem itemLabel="-Please Select--" itemValue="" /> 
               <f:selectItem itemLabel="RHB Group" itemValue="1" /> 
               <f:selectItem itemLabel="CIMB Group" itemValue="2" /> 
            </p:selectOneMenu>    
          <p:outputLabel value=" Effective Date"/>
          <p:calendar style="width:140px;" value="#{supplierBackingBean.managedBean.startDate}" id="popupButtonCal" showOn="button" />
          <p:outputLabel  value="Authorized Ref. No"/>  
          <p:inputText  style="width:140px;" />  
          <p:outputLabel value=" Expiry Date"/>
          <p:calendar style="width:140px;" value="#{supplierBackingBean.managedBean.endDate}" id="popupButtonCal1" showOn="button" />
           </h:panelGrid>
           <h:panelGrid columns="2" style="width:550px;">  
           <h:panelGroup>
			<div style="height: 30px;width:108px; vertical-align: top">
				<p:outputLabel for="fcaddress" value="Factoring Company Address"  />
			</div>
		   </h:panelGroup>
		   <h:panelGrid>
		   <p:inputTextarea id="fcaddress" value="" rows="2" cols="63"  autoResize="false" />
	       </h:panelGrid>
	       </h:panelGrid>
       </p:panel>
</ui:composition>
