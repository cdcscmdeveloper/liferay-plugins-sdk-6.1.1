<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <p:panel id="factoringId" header="#{lbl['lbl.ct.fc.panel.name']}"    toggleable="true"  toggleSpeed="500">
      <h:panelGrid columns="4" style="width:770px;" columnClasses="columnWidth15">  
         <p:outputLabel  value="Company Name"/>  
            <p:selectOneMenu style="width:170px;">
               <f:selectItem itemLabel="-Please Select--" itemValue="" /> 
               <f:selectItem itemLabel="RHB Group" itemValue="1" /> 
               <f:selectItem itemLabel="CIMB Group" itemValue="2" /> 
            </p:selectOneMenu>    
          <p:outputLabel  value="Authorized Ref No."/>  
          <p:inputText value="#{supplierBackingBean.managedBean.factoring.authRefNo}" style="width:170px;" />  
          <p:outputLabel value=" Effective Date"/>
          <p:calendar style="width:140px;" value="#{supplierBackingBean.managedBean.factoring.effDate}" id="popupButtonCal" showOn="button" />
          <p:outputLabel value=" Expiry Date"/>
          <p:calendar style="width:140px;" value="#{supplierBackingBean.managedBean.factoring.expDate}" id="popupButtonCal1" showOn="button" />
           <h:panelGroup>
			<div style="height:40px;vertical-align: top;">
				<p:outputLabel for="fcaddress" value="Company Address"  />
			</div>
		   </h:panelGroup>
		   <h:panelGrid>
		   <p:inputTextarea id="fcaddress" value="125, Jalan P RamLee, KL" rows="3" cols="29"  autoResize="false" />
	       </h:panelGrid>
	       </h:panelGrid>
       </p:panel>
</ui:composition>
