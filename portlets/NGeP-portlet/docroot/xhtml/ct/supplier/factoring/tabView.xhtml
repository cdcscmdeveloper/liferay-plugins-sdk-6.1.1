<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	  <style>
      .column-align-center { text-align: center !important;}
    </style> 
	<p:panel>
     <f:event listener="#{supplierBackingBean.preRenderView}" type="preRenderView" />
	 <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	  <div class="ppRightBtn">
				<ui:repeat var="outcome"	value="#{supplierBackingBean.managedBean.action}">
					<p:commandButton value="#{outcome}" process="@this" styleClass="ui-button" action="#{supplierBackingBean.saveFactoringRequest(outcome)}" />
				</ui:repeat>		
    </div>
	</p:panel>
	 <p:tabView id="tabview" orientation="left">
	     <p:tab title="Set Factoring Company">
	         <ui:include src="/xhtml/ct/supplier/factoring/requestOfFactoring.xhtml"/>
	     </p:tab>
	      <p:tab title="#{lbl['lbl.ct.menu.remark']}" >
      	<ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
       </p:tab> 
	 </p:tabView>
   </ui:define>
</ui:composition>
