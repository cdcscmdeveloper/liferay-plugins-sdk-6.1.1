<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	<p:panel>
	 <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	   <div class="ppRightBtn">
				<ui:repeat var="action"	value="#{supplierBackingBean.managedBean.outComes}">
					<p:commandButton value="#{action}" process="@this" styleClass="ui-button" 
					   action="#{supplierBackingBean.saveTerminationRequest(action)}" />
				</ui:repeat>		
    </div>
	</p:panel>
	 <p:tabView id="tabview" orientation="left">
	     <p:tab title="Contract Termination">
	        <ui:include src="/xhtml/ct/supplier/shared/fulfilment.xhtml"/>
	         <ui:include src="/xhtml/ct/supplier/termination/terminationForm.xhtml"/>
	     </p:tab>
	      <p:tab title="Remarks And Attachements" >
       <ui:include src="/xhtml/ct/supplier/attachements.xhtml"/>
       </p:tab> 
	 </p:tabView>
   </ui:define>
</ui:composition>
