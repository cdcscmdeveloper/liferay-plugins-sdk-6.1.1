<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
         <p:panel id="sTermination" header="Termination Request Details" toggleable="true"  toggleSpeed="500">
            <h:panelGrid columns="4" style="width:100%" columnClasses="columnWidth15">  
            <p:outputLabel  value="Termination Type"/>  
              <p:selectOneMenu value="#{supplierBackingBean.managedBean.ctTerminationReason.reasonType.codeId}" style="width:180px;">
            	  <f:selectItems value="#{supplierBackingBean.getDropdownValues(PmCodeCatConst.ctTerminationReasonType)}" />
              </p:selectOneMenu>   
              <p:outputLabel value="Termination Date"/>
              <p:calendar size="22" value="#{supplierBackingBean.managedBean.termination.terminationDate}" id="popupButtonCal" showOn="button" />
             <h:panelGroup>
				<div style="height: 30px; vertical-align:top;">
                     <p:outputLabel for="rftermination" value="Termination Reason" />
			    </div>
			 </h:panelGroup>
			 <h:panelGrid>
                <p:inputTextarea id="rftermination" value="#{supplierBackingBean.managedBean.ctTerminationReason.description}"  rows="3" cols="31"  autoResize="false" />
			 </h:panelGrid>
	       </h:panelGrid>
		   </p:panel>
           <p:panel id="sdetails" header="Supplier  Details"   toggleable="true"  toggleSpeed="500">
              <h:panelGrid columns="4" style="width:100%" columnClasses="columnWidth15">  
              <p:outputLabel value="Supplier ID"/>
              <p:inputText value="SU-01145-456" style="width:170px;" disabled="true"/>   
              <p:outputLabel value="Supplier Name" />
              <p:inputText value="CDC Sdn Bhd" style="width:170px;" disabled="true"/>   
              <p:outputLabel value="Email ID" />
              <p:inputText value="abc@yahoo.com" style="width:170px;" disabled="true"/>   
               <p:outputLabel value="Tel No."/>
              <p:inputText value="60172487465" style="width:110px;" disabled="true"/>   
               <p:outputLabel value="Fax No." />
              <p:inputText value="60172487465" style="width:110px;" disabled="true"/> 
              <p:outputLabel value="Mobile No." />
              <p:inputText value="60172487465" style="width:110px;" disabled="true"/> 
              
             
               <h:panelGroup>
				<div style="height:40px; vertical-align: top;">
					<p:outputLabel for="spAddress" value="Supplier Address"/>
				</div>
			   </h:panelGroup>
			   <h:panelGrid>
				 <p:inputTextarea id="spAddress" value="25, Belatuk Block, CyberView Garden, CyberJaya, Selangor Malaysia"
				     rows="3" cols="31" autoResize="false" />
			   </h:panelGrid>
			</h:panelGrid>
		 </p:panel>
</ui:composition>
