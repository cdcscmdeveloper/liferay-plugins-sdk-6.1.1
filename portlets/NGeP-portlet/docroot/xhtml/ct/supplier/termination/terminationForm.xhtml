<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	<p:panel>
        <f:event listener="#{supplierBackingBean.preRenderView}" type="preRenderView" />
	 <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	   <div class="ppRightBtn">
				<ui:repeat var="outcome"	value="#{supplierBackingBean.managedBean.action}">
					<p:commandButton value="#{outcome}" process="@form" styleClass="ui-button" 
					   action="#{supplierBackingBean.saveTerminationRequest(outcome)}" />
				</ui:repeat>		
    </div>
	</p:panel>
	 <p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true" toggleSpeed="500">
	    <p:outputPanel id="terminationRequest">
	    <table style="width: 100%">
            <tr>
                <td style="width:200px;">  
                <h:outputLabel for="contractId" value="Contract No." /></td>
			    <td> <p:selectOneMenu id="contractId" value="#{supplierBackingBean.managedBean.contractNo}" style="width:180px;" disabled="false">
				     <f:selectItem itemLabel="-Select One-" itemValue="" />
				      <f:selectItems value="#{supplierBackingBean.populateContractList}"/>
				      <p:ajax event="change" process="@this" update="terminationRequest" listener="#{supplierBackingBean.changeContractActionListener}"/>
			         </p:selectOneMenu></td>
		         <td style="width:200px;">	<p:outputLabel value="#{lbl['lbl.ct.physicalNo']}" /></td>
		         <td>	<p:inputText disabled="true" style="width:170px;"
			               value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}"/>	</td>
		   </tr>
		   <tr>		
			     <td><p:outputLabel value="#{lbl['lbl.ct.effectiveDate']}" /></td>
			     <td> <p:inputText disabled="true" style="width:110px;" 
			            value="#{supplierBackingBean.convertTime(supplierBackingBean.managedBean.contractVer.ctContractValue.effDate)}"/> 
			          
			          </td>
			     <td><h:outputLabel value="#{lbl['lbl.ct.edate']}" /></td>
			     <td><p:inputText disabled="true" style="width:110px;" 
			          value="#{supplierBackingBean.convertTime(supplierBackingBean.managedBean.contractVer.ctContractValue.expDate)}" >
			         </p:inputText>	</td>
		   </tr>
		   <tr>
			    <td>		
			        
		               <div style="height: 40px; vertical-align: top;">
			               <p:outputLabel  value="Contract Title" />
			           </div>
		    
			   </td>
		   	   <td>
			           <p:inputTextarea id="contractName" value="#{supplierBackingBean.managedBean.contractVer.ctContract.contractName}" 
			           rows="3" cols="31" disabled="true" autoResize="false" />	
			      
			 </td>
			 <td></td>
			 <td></td>
			 </tr>
		  </table>
		</p:outputPanel>
		 </p:panel>
          <p:panel id="sbd" header="#{lbl['lbl.ct.su.panel.name']}"  toggleable="true"  toggleSpeed="500">
           <table style="width: 100%">
                  <tr>
                      <td style="width:200px;">   <p:outputLabel value="EP No." />  </td>
                      <td> <h:panelGrid columns="4">
                                <p:inputText value="#{supplierBackingBean.managedBean.contractVer.ctContract.smSupplier.epNo}" 
                                    disabled="true" size="12"/>
                                <p:spacer width="3"/>
                                <p:outputLabel value="MOF No." />  
                                <p:inputText value="123"
                                   disabled="true" size="12"/>
                             </h:panelGrid> 
                       </td>
                       <td style="width:130px;">  <p:outputLabel  value="Contact Person"/>  </td>
                       <td>  <p:inputText   disabled="true"   style="width:170px;" /></td>
                </tr> 
                <tr>       
                     <td>  <p:outputLabel value="Supplier Name" />  </td>
                     <td>  <p:inputText value="#{supplierBackingBean.managedBean.contractVer.ctContract.smSupplier.companyName}"
                               disabled="true" style="width:215px;"/> </td>
                     <td> <p:outputLabel  value="#{lbl['lbl.ct.su.tel.office']}" />  </td>       
                     <td> <p:inputText value="123" disabled="true"  style="width:110px;" /></td>
                    
                </tr>  
                 <tr>  
                      <td>  <p:outputLabel   value="#{lbl['lbl.ct.su.tel.hp']}"/> </td>
                      <td>  <p:inputText value="60172487465" disabled="true" style="width:110px;" /></td>       
                      <td> <p:outputLabel  value="#{lbl['lbl.ct.su.fax']}"/></td>       
                      <td> <p:inputText value="123"  disabled="true" style="width:110px;" /> </td>   
                 </tr>
                      <tr>
                         <td>       
                             <h:panelGroup>
			         	         <div style="height: 40px; vertical-align: top">
					               <p:outputLabel for="supplierAddress" value="#{lbl['lbl.ct.su.address']}" />
			                     </div>
			                 </h:panelGroup></td>
			              <td>
			                   <h:panelGrid>
				                  <p:inputTextarea id="supplierAddress"  disabled="true" value="25, Belatuk Block, CyberView Garden, CyberJaya, Selangor Malaysia"  rows="3" cols="34"   />
			                   </h:panelGrid></td>
			                 <td style="width:130px;" valign="top">  <p:outputLabel  value="#{lbl['lbl.ct.su.email']}"/>  </td>
                             <td valign="top">  <p:inputText value="1234"  disabled="true"   style="width:170px;" /></td>
			           </tr>
			       </table>
			   </p:panel>
		 <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
		</ui:define>
</ui:composition>
