<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">  
	<ui:define name="contentSection">
	 <f:event listener="#{supplierBackingBean.preRenderView}" type="preRenderView" />
		<p:panel>
		   <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	    	<table style="width: 100%;">
	    		<tr>
	    			<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" /></td>
	    			<td class="ppRightBtn">
	    			<ui:repeat var="outcome" value="#{supplierBackingBean.managedBean.action}">
						<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(outcome)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" ajax="false" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(outcome)}" 
								action="#{supplierBackingBean.saveTerminationRequest(outcome)}" />
						</ui:repeat>	    			
	    			</td>
	    		</tr>
	    	</table>
			<table style="width: 99%; margin-left: 25px;" class="header-info">
				<tr style="margin-button: 10px;">
				     <td>	
							<p:outputLabel value="#{lbl['lbl.ct.loa.no']}" />
					</td>
					<td>
							<p:inputText size="20" disabled="true"
								value="#{supplierBackingBean.managedBean.ctContract.loaNo}"  />	
					</td>		
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.contract.no']}" />
					</td>
					<td>
							<p:inputText size="20" disabled="true"
								value="#{supplierBackingBean.managedBean.ctContract.contractNo}" />
					</td>
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.business.name']}" />
					</td>
					<td>
							<p:inputText size="30" disabled="true" value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.supplierCompanyName}"/>
					</td>					
					<td>
							<p:outputLabel value="#{lbl['lbl.ct.status']}" />
					</td>
					<td>
							<p:inputText size="20"
								value="#{supplierBackingBean.getStatusDescById(supplierBackingBean.managedBean.contractVer.status.statusId)}"
								disabled="true" />
					</td>
				</tr>
			</table>	    	
	</p:panel>
	 <p:panel id="fd" header="#{lbl['lbl.ct.panel.contract']}" toggleable="true" toggleSpeed="500">
	    <p:outputPanel id="terminationRequest">
	    <table style="width: 100%">
            <tr>
                <td style="width:15%;">  
                <h:outputLabel for="contractId" value="#{lbl['lbl.ct.contract.no']}" /></td>
			    <td> <p:selectOneMenu id="contractId" value="#{supplierBackingBean.managedBean.contractNo}" style="width:180px;" disabled="false">
				     <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				      <f:selectItems value="#{supplierBackingBean.populateContractList}"/>
				      <p:ajax event="change" process="@this" update=":form" listener="#{supplierBackingBean.changeContractActionListener}"/>
			         </p:selectOneMenu></td>
		         <td style="width:20%;">	<p:outputLabel value="#{lbl['lbl.ct.physical.no']}" /></td>
		         <td>	<p:inputText disabled="true" style="width:170px;"
			               value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}"/>	</td>
		   </tr>
		   <tr>		
			     <td><p:outputLabel value="#{lbl['lbl.ct.effective.date']}" /></td>
			     <td> <p:inputText disabled="true" style="width:170px;" 
			            value="#{supplierBackingBean.convertTime(supplierBackingBean.managedBean.contractVer.ctContractValue.effDate)}"/> 
			          
			          </td>
			     <td><h:outputLabel value="#{lbl['lbl.ct.expiry.date']}" /></td>
			     <td><p:inputText disabled="true" style="width:170px;" 
			          value="#{supplierBackingBean.convertTime(supplierBackingBean.managedBean.contractVer.ctContractValue.expDate)}" >
			         </p:inputText>	</td>
		   </tr>
		   <tr>
			    <td>		
			        
		               <div style="height: 40px; vertical-align: top;">
			               <p:outputLabel  value="#{lbl['lbl.ct.contract.title']}"/>
			           </div>
		    
			   </td>
		   	   <td>
			           <p:inputTextarea id="contractName" value="#{supplierBackingBean.managedBean.contractVer.ctContract.contractName}" 
			           rows="3" cols="31" disabled="true" autoResize="false" />	
			      
			 </td>
			 <td></td>
			 <td></td>
			 </tr>
		  </table>
		</p:outputPanel>
		 </p:panel>
          <p:panel id="sbd" header="#{lbl['lbl.ct.panel.supplier']}"  toggleable="true"  toggleSpeed="500">
           <table style="width: 100%">
                  <tr>
                      <td style="width:15%;">   <p:outputLabel value="EP No." />  </td>
                      <td> <h:panelGrid columns="4">
                                <p:inputText value="#{supplierBackingBean.managedBean.contractVer.ctContract.smSupplier.epNo}" 
                                    disabled="true" size="10"/>
                                <p:spacer width="1"/>
                                <p:outputLabel value="MOF No." />  
                                <p:inputText 
                                   disabled="true" size="10"/>
                             </h:panelGrid> 
                       </td>
                       <td style="width:10%;">  <p:outputLabel  value="#{lbl['lbl.ct.contact.person']}"/>  </td>
                       <td>  <p:inputText   disabled="true"   style="width:170px;" /></td>
                </tr> 
                <tr>       
                     <td>  <p:outputLabel value="#{lbl['lbl.ct.business.name']}" />  </td>
                     <td>  <p:inputText value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.supplierCompanyName}"
                               disabled="true" style="width:218px;"/> </td>
                     <td> <p:outputLabel  value="#{lbl['lbl.ct.tel']}" />  </td>       
                     <td> <p:inputText disabled="true"  style="width:170px;" /></td>
                    
                </tr>  
                 <tr>  
                      <td>  <p:outputLabel   value="#{lbl['lbl.ct.mobile']}"/> </td>
                      <td>  <p:inputText  disabled="true" style="width:170px;" /></td>       
                      <td> <p:outputLabel  value="#{lbl['lbl.ct.fax']}"/></td>       
                      <td> <p:inputText   disabled="true" style="width:170px;" /> </td>   
                 </tr>
                      <tr>
                         <td>       
                             <h:panelGroup>
			         	         <div style="height: 40px; vertical-align: top">
					               <p:outputLabel for="supplierAddress" value="#{lbl['lbl.ct.address']}" />
			                     </div>
			                 </h:panelGroup></td>
			              <td>
			                   <h:panelGrid>
				                  <p:inputTextarea id="supplierAddress"  disabled="true"   rows="3" cols="31"   />
			                   </h:panelGrid></td>
			                 <td style="width:10%;" valign="top">  <p:outputLabel  value="#{lbl['lbl.ct.email']}"/>  </td>
                             <td valign="top">  <p:inputText   disabled="true"   style="width:170px;" /></td>
			           </tr>
			       </table>
			   </p:panel>
		 <ui:include src="/xhtml/ct/shared/remarkAndAttachment.xhtml" />
		</ui:define>
</ui:composition>
