<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="resourceSection">
	</ui:define>
    <ui:define name="content">
	  <p:tabView id="tabView" dynamic="true" cache="false">
         <p:tab id="searchTab" title="General">
           <p:panel id="searchId" header="Supplier Search" toggleable="true"  toggleSpeed="500" widgetVar="panelsearch">
              <h:panelGrid columns="4" style="width:900px;" >
                 <h:outputLabel value="Contract Number"/>
                 <p:inputText value="#{supplierBackingBean.managedBean.contractNo}" style="width:170px;"/>
                 <h:outputLabel value="Contract Name"/>
                 <p:inputText value="#{supplierBackingBean.managedBean.contractName}" style="width:170px;"/>
                 <h:outputLabel value="Contract Start Date" />
                 <p:calendar style="width:150px;" value="#{supplierBackingBean.managedBean.startDate}" id="popupButtonCal" showOn="button" />
                 <h:outputLabel value="Contract End Date" />
                 <p:calendar style="width:150px;" value="#{supplierBackingBean.managedBean.endDate}" id="popupButtonCal1" showOn="button" />
                 <h:outputLabel value="LOA No"/>
                 <p:inputText value="#{supplierBackingBean.managedBean.loaNo}" style="width:170px;"/>
                 <f:verbatim></f:verbatim>
                 <f:verbatim></f:verbatim>
                 <f:verbatim></f:verbatim>
                 <f:verbatim></f:verbatim>
                 <f:verbatim></f:verbatim>
                 <h:panelGrid columns="2" style="width:170px;" columnClasses="column-align-right">
                    <p:commandButton value="Search" styleClass="text-align:right;" actionListener="#{supplierBackingBean.searchContract()}"
                                    process="@this" partialSubmit="true"  icon="ui-icon-search"  update="supTable"/>
					<p:commandButton value="Reset" process="@this" partialSubmit="true" icon="ui-icon-reset"/>
			     </h:panelGrid>
               </h:panelGrid>
            </p:panel>
			<p:panel id="searchResulId" header="Search Result"   toggleable="true"  toggleSpeed="500" widgetVar="panelsearchResul">
              <div style="overflow-x:auto">
			     <p:dataTable id="supTable" var="data" value="#{supplierBackingBean.managedBean.contractList}" rowIndexVar="index"
				    widgetVar="dataTableObj" lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom"
				    paginatorAlwaysVisible="true" emptyMessage="No Records!" rows="4">
				    <p:columnGroup type="header"> 
					   <p:row> 
	                     <p:column headerText="No." />
	                     <p:column headerText=" Contact  No"   /> 
	                     <p:column headerText="Contract Name" /> 
	                     <p:column headerText="LOA No" /> 	
	                     <p:column headerText="Supplier Id" /> 
	                     <p:column headerText="Supplier Name"  /> 
	                     <p:column headerText="Circular Start"  /> 	
	                     <p:column headerText="Circular End"   /> 
	                     <p:column headerText="Action" />
					  </p:row>							
					  </p:columnGroup>
						<p:column styleClass="column-align-center" > <p:outputLabel value="#{index+1}" /></p:column> 							
						<p:column> <p:outputLabel value="CT102357-456" style="float:left;" /></p:column>
						<p:column> <p:outputLabel value="#{data.contractName}" style="float:left;" /></p:column>	
						<p:column> <p:outputLabel  value="#{data.qtLoaNo}" style="float:left;"  /></p:column>	
						<p:column> <p:outputLabel  value="SU34650-48" style="float:left;" /></p:column>	
						<p:column> <p:outputLabel  value="Khai Sdn Bhd" style="float:left;" /> </p:column> 							
						<p:column> <p:outputLabel  value="12/11/2013" style="float:left;"/> </p:column>	
						<p:column> <p:outputLabel  value="11/11/2014" style="float:left;"/> </p:column>	
						<p:column styleClass="column-align-center">
						<p:commandButton title="change Bank" action="#{supplierBackingBean.gotoBankPage}" partialSubmit="true" process="@this" 
						   icon="ui-icon-bank" styleClass="ui-icon-bank"/>
						<p:spacer width="3"/>
						<p:commandButton title="Change Factory" action="#{supplierBackingBean.gotoFactoringPage}" partialSubmit="true" process="@this" 
						   icon="ui-icon-factory" styleClass="ui-icon-button"/>
						<p:spacer width="3"/>
						<p:commandButton title="Terminate Contract" action="#{supplierBackingBean.gotoTerminationPage}" partialSubmit="true" process="@this" 
						   icon="ui-icon-terminate" styleClass="ui-icon-button"/>
						</p:column> 
					</p:dataTable>
				</div>
			</p:panel>
          </p:tab>
         </p:tabView>
      </ui:define>
</ui:composition>
