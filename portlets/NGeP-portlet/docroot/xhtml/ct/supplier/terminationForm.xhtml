<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	
  	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ct/supplier/shared/sidemenu/supplier.xhtml" />
	</ui:define>
  
	<ui:define name="content">
	 <p:panel id="pRightPanel">
			<div class="ppRightBtn">
				<p:commandButton id="ctSave" value="#{lbl['lbl.ct.btn.save']}"/>
				<p:commandButton id="ctSubmit" value="#{lbl['lbl.ct.btn.submit']}"/>
			</div>
		</p:panel>
	   
	     <p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true"  toggleSpeed="500" widgetVar="panelfd">
                                
                                    <ui:include src="/xhtml/ct/supplier/shared/fulfilment.xhtml"/>
                                
                              </p:panel>
                              
                               <p:panel id="sTermination" header="Termination Request Details"    toggleable="true"  toggleSpeed="500" widgetVar="panelsTermination">
                              
                                 
                                   <h:panelGrid columns="4" style="width:600px;">  
                                  
                                           <h:outputLabel value="Termination Start Date" />
                                          <p:calendar style="width:140px;" value="#{supplierBackingBean.date}" id="popupButtonCal" showOn="button" />
                                                    
                                          <h:outputLabel  value="Termination Type"/>  
                                           <p:selectOneMenu value=" " style="width:140px;">
            					                             <f:selectItem itemLabel="-Please Select--" itemValue="" /> 
            					                             <f:selectItem itemLabel="Late Supply" itemValue="1" /> 
            					                             <f:selectItem itemLabel="Fail To Supply" itemValue="2" /> 
            					                              <f:selectItem itemLabel="Lack Of Quality" itemValue="3" /> 
            					                             <f:selectItem itemLabel="Fail To Comply Term And Condition" itemValue="4" /> 
            					                              <f:selectItem itemLabel="Other" itemValue="5" /> 
                				                    </p:selectOneMenu>    
                				          </h:panelGrid>
                                        
                                          <h:panelGrid columns="2" style="width:600px;">  
                                           <h:panelGroup>
										             <div style="height: 45px;width:125px; vertical-align: top">
											              <p:outputLabel for="rftermination" value="Reason For Termination" />
										             </div>
								        	      </h:panelGroup>
									              <h:panelGrid>
										          <p:inputTextarea id="rftermination" value="" required="false"  rows="2" cols="66" disabled="true" autoResize="false" />
											      </h:panelGrid>
										</h:panelGrid>
										
										 
                				          
                                        </p:panel>
                                 <p:panel id="sdetails" header="Supplier  Details"    toggleable="true"  toggleSpeed="500" widgetVar="panelsdetails">
                           
                                        <h:panelGrid columns="4" style="width:600px;">  
                                  
                                           <p:outputLabel value="Supplier ID"/>
                                           <p:inputText value="" style="width:140px;"/>   
                                           
                                           <p:outputLabel value="Supplier Name" />
                                           <p:inputText value="" style="width:140px;"/>   
                                           
                                           <p:outputLabel value="Email ID" />
                                           <p:inputText value="" style="width:140px;"/>   
                                           
                                           <p:outputLabel value="Tel No (H.P)" />
                                           <p:inputText value="" style="width:140px;"/> 
                                           
                                            <p:outputLabel value="Tel No (Office)"/>
                                           <p:inputText value="" style="width:140px;"/>   
                                           
                                           <p:outputLabel value="Fax No" />
                                           <p:inputText value="" style="width:140px;"/> 
                                           </h:panelGrid>
                				          
                				          <h:panelGrid columns="2" style="width:600px;">  
                                           <h:panelGroup>
										             <div style="height: 45px;width:82px; vertical-align: top">
											              <p:outputLabel for="spAddress" value="Supplier Address" styleClass="txtsize" />
										             </div>
								        	      </h:panelGroup>
									              <h:panelGrid>
										          <p:inputTextarea id="spAddress" value="" required="false"  rows="2" cols="68" autoResize="false" />
											      </h:panelGrid>
										</h:panelGrid>
										</p:panel>
            </ui:define>
            </ui:composition>
