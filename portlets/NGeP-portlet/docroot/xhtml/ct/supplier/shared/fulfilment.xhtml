<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="5" style="width:100%" columnClasses="columnWidth15">
			<p:outputLabel value="#{lbl['lbl.ct.cno']}" />
			<p:inputText disabled="true" style="width:170px;"
				value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}" />
			<p:outputLabel value="#{lbl['lbl.ct.physicalNo']}" />
			<p:inputText disabled="true" style="width:170px;"
			 value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.contractPhysicalNo}"/>				
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox value="false" disabled="false" />
				<p:spacer width="2" />
				<p:outputLabel value="Concession" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.contractType']}" />
			<p:selectOneMenu disabled="true" style="width:180px;">
				<f:selectItems value="#{supplierBackingBean.getDropdownValues(PmCodeCatConst.contractType)}" />
			</p:selectOneMenu>						
			<p:outputLabel value="Created Date" />
			<p:inputText style="width:170px;" disabled="true"
				value="#{supplierBackingBean.managedBean.contractVer.ctContract.publishDate}" >
				<f:convertDateTime pattern="MM/dd/yyyy" />
			</p:inputText>				
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="false"
					disabled="true" />
				<p:spacer width="2" />	
				<p:outputLabel value="Exempted" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.effectiveDate']}" />
			<p:calendar style="width:170px;"
				value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.effDate}"
				id="popupCal1" showOn="button" />
			<h:outputLabel value="#{lbl['lbl.ct.edate']}" />
			<p:calendar style="width:170px;"
				value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.expDate}"
				id="popupCal" showOn="button" />			
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{supplierBackingBean.managedBean.contractVer.ctContract.agreement}"
					disabled="true" />
				<p:spacer width="2" />	
				<p:outputLabel value="#{lbl['lbl.ct.agreement']}" />
			</h:panelGrid>
			<p:outputLabel value="#{lbl['lbl.ct.cur']}" />
				<p:inputText value="#{supplierBackingBean.managedBean.contractVer.ctContract.currency.currencyName}" style="width:70px;" />				
			<p:outputLabel value="#{lbl['lbl.ct.contractAmount']}" />
			<p:inputText
				value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.contractAmount}"
				size="8" disabled="true" />			
			<h:panelGrid columns="3">
				<p:selectBooleanCheckbox
					value="#{supplierBackingBean.managedBean.contractVer.ctContract.mto}"
					disabled="true" />
				<p:spacer width="2" />	
				<p:outputLabel value="#{lbl['lbl.ct.mto']}" />
			</h:panelGrid>
			<h:outputLabel value="#{lbl['lbl.ct.liquidated']}" />
			<p:inputText
				value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.liquidatedDamage}"
				size="8" disabled="true" />
			<h:outputLabel value="#{lbl['lbl.ct.dperiod']}" />
			<h:panelGrid columns="2">
				<p:inputText size="8" value="#{supplierBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" />
				<p:outputLabel value="days" />
			</h:panelGrid>
			<f:verbatim />
			 <h:panelGroup>
		      <div style="height: 40px; vertical-align: top;">
			  <p:outputLabel for="contractName" value="Contract Title" />
			</div>
			</h:panelGroup>
			 <h:panelGrid>
			<p:inputTextarea id="contractName"
				value="#{supplierBackingBean.managedBean.contractVer.ctContract.contractName}"
				required="false" rows="2" cols="30" disabled="true"
				autoResize="false" />	
			</h:panelGrid>		
			<f:verbatim />
			<f:verbatim />
			<f:verbatim />
			<h:outputLabel
				rendered="#{supplierBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				value="#{lbl['lbl.ct.circularNo']}" />
			<p:commandLink
				rendered="#{supplierBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo != null}"
				style="margin-right:20px;" ajax="false">
				<h:outputText
					value="#{supplierBackingBean.managedBean.contractVer.ctContract.circular.latestCircularVer.circularNo}"
					styleClass="linkcommand" />
			</p:commandLink>
		</h:panelGrid>
	</p:panel>
	<p:panel id="qtnTenderPnl" header="Quotation / Tender Details" toggleable="true" toggleSpeed="500">
		<h:panelGrid columns="4" style="width:100%" columnClasses="columnWidth15">
			<p:outputLabel value="Procurement Mode" />
		    <p:inputText  style="width:170px;" disabled="true"/>
			<p:outputLabel value="Published Date" />
			<p:inputText style="width:170px;" disabled="true"
				value="#{supplierBackingBean.managedBean.contractVer.ctContract.publishDate}" >
				<f:convertDateTime pattern="MM/dd/yyyy" />
			</p:inputText>			
			<p:outputLabel value="#{lbl['lbl.ct.loaNo']}" />
			<p:inputText style="width:170px;" disabled="true" 
				value="#{supplierBackingBean.managedBean.contractVer.ctContract.loaNo}" />
			<p:outputLabel value="LOA Acknowledged Date" />
			<p:inputText style="width:170px;" disabled="true"
				value="#{supplierBackingBean.managedBean.contractVer.ctContract.ackDate}" >
				<f:convertDateTime pattern="MM/dd/yyyy" />
			</p:inputText>
			<p:outputLabel value="Item Type" />
			<p:inputText style="width:170px;" disabled="true"/>			
			<p:outputLabel value="Item Origin" />
			<p:inputText style="width:170px;" disabled="true"/>					
			<p:outputLabel value="#{lbl['lbl.ct.fulfilmentType']}" />
			<p:inputText style="width:170px;" disabled="true"/>		
			<p:outputLabel value="#{lbl['lbl.ct.sfee']}" />
			<p:inputText
				value="#{supplierBackingBean.managedBean.contractVer.ctContract.serviceFee}"
				style="width:55px;" disabled="true" />			
		</h:panelGrid>
	</p:panel>
</ui:composition>
