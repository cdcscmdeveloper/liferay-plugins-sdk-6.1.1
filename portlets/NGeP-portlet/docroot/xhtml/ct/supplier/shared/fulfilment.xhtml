<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	 <p:panel id="fd" header="#{lbl['lbl.ct.panel.name']}" toggleable="true"  toggleSpeed="500" widgetVar="panelfd">
    <h:panelGrid columns="5">  
    <p:outputLabel  value="#{lbl['lbl.ct.cno']}"/>  
    <p:inputText value=""  required="true" disabled="true" style="width:150px;"  /> 
    <p:outputLabel value="#{lbl['lbl.ct.sourcingType']}"/>  
    <p:selectOneMenu disabled="false" style="width:150px;" value=""  >
    <f:selectItems value="#{supplierBackingBean.contractListItem.sourcingType}" />
    </p:selectOneMenu>
    <h:panelGrid columns="2">
       <p:selectBooleanCheckbox value="#{supplierBackingBean.checkBoxSelections.checkedAgreement}" 
          disabled="#{supplierBackingBean.checkBoxSelections.disabledAgreement}"/> 
        <p:outputLabel value="#{lbl['lbl.ct.agreement']}"/>
    </h:panelGrid>
        <p:outputLabel value="#{lbl['lbl.ct.contractType']}"/>  
        <p:selectOneMenu disabled="false"  style="width:120px;">
          <f:selectItems value="#{supplierBackingBean.contractListItem.contractType}" />
        </p:selectOneMenu>
        <p:outputLabel value="#{lbl['lbl.ct.sourcingCategory']}" />  
        <p:selectOneMenu disabled="false" style="width:150px;">
          <f:selectItems value="#{supplierBackingBean.contractListItem.sourcingCategory}" />
        </p:selectOneMenu>
         <h:panelGrid columns="2">
        <p:selectBooleanCheckbox value="#{supplierBackingBean.checkBoxSelections.checkedConcession}" 
           disabled="#{supplierBackingBean.checkBoxSelections.checkedConcession}"/> 
        <p:outputLabel rendered="true"  value="Concession"/>
        </h:panelGrid>
        <p:outputLabel value="#{lbl['lbl.ct.createdDate']}" />  
        <p:inputText disabled="true" style="width:150px;" />  
        <p:outputLabel value="#{lbl['lbl.ct.publishingDate']}" />  
        <p:inputText  disabled="true" style="width:150px;"/>
         <h:panelGrid columns="2">
        <p:selectBooleanCheckbox value="#{supplierBackingBean.checkBoxSelections.checkedExempted}" 
           disabled="#{supplierBackingBean.checkBoxSelections.checkedExempted}"/> 
        <p:outputLabel value="Exempted"/>
        </h:panelGrid>
        <p:outputLabel value="#{lbl['lbl.ct.loaNo']}"  />  
        <p:inputText disabled="true" style="width:150px;" />  
        <p:outputLabel  value="#{lbl['lbl.ct.loaDate']}"/>  
        <p:inputText disabled="true" style="width:150px;" />  
         <h:panelGrid columns="2">
        <p:selectBooleanCheckbox value="#{supplierBackingBean.checkBoxSelections.checkedGood}" 
           disabled="#{supplierBackingBean.checkBoxSelections.disabledGood}"/> 
        <p:outputLabel value="#{lbl['lbl.ct.localGoods']}" />
        </h:panelGrid>
        <p:outputLabel value="#{lbl['lbl.ct.contractAmount']}" />  
        <p:inputText  disabled="true" style="width:90px;" />  
         <p:outputLabel value="#{lbl['lbl.ct.fulfilmentType']}" />  
         <p:selectOneMenu disabled="false" style="width:150px;" value="" >
           <f:selectItems value="#{supplierBackingBean.contractListItem.fulfilmentType}" />
         </p:selectOneMenu>
          <h:panelGrid columns="2">
         <p:selectBooleanCheckbox value="#{supplierBackingBean.checkBoxSelections.checkedIGood}" 
             disabled="#{supplierBackingBean.checkBoxSelections.checkedIGood}"/> 
          <p:outputLabel rendered="true"  value="#{lbl['lbl.ct.Igoods']}" />
          </h:panelGrid>
           <p:outputLabel value="Currency" />  
           <p:selectOneMenu style="width:65px;">
               <f:selectItems value="#{supplierBackingBean.contractListItem.currency}" /></p:selectOneMenu>
         <p:outputLabel  value="#{lbl['lbl.ct.sfee']}" />  
             <p:selectOneMenu  disabled="true" style="width:85px;">
                <f:selectItems value="#{supplierBackingBean.contractListItem.serviceFee}" />
            </p:selectOneMenu> 
           <h:panelGrid columns="2">
           <p:selectBooleanCheckbox value="#{supplierBackingBean.checkBoxSelections.checkedMto}" 
               disabled="#{supplierBackingBean.checkBoxSelections.disabledMto}"/> 
            <p:outputLabel value="#{lbl['lbl.ct.mto']}" />
            </h:panelGrid>
            
          <p:outputLabel value="#{lbl['lbl.ct.effectiveDate']}"/>  
          <p:inputText  style="width:150px;" disabled="true"/>  
          <p:outputLabel value="#{lbl['lbl.ct.edate']}"/>  
          <p:inputText  style="width:150px;" disabled="true" /> 
          <f:verbatim></f:verbatim> 
             <p:outputLabel value="#{lbl['lbl.ct.dperiod']}" />  
            <p:inputText style="width:85px;" disabled="true" />  
             <p:outputLabel value="#{lbl['lbl.ct.physicalNo']}"  />  
                <p:commandLink  style="margin-right:20px;" ajax="false">  
                <h:outputText value="2348-5674874" />  
            </p:commandLink> 
              <f:verbatim></f:verbatim>
            <p:outputLabel  value="#{lbl['lbl.ct.liquidated']}" />  
            <p:inputText value="" required="true" disabled="true" style="width:90px;" />  
          </h:panelGrid>
          <h:panelGrid columns="1" style="width:800px;">  
           <h:panelGrid columns="2">
              <h:panelGroup>
			   <div style="height: 30px;width:100px; vertical-align: top">
			      <p:outputLabel for="contractName" value="#{lbl['lbl.ct.cname']}" styleClass="txtsize" />
			    </div>
			   </h:panelGroup>
			   <h:panelGrid>
				<p:inputTextarea id="contractName"  required="false"  rows="1" cols="66" disabled="true" autoResize="false" />
			   </h:panelGrid>
		    </h:panelGrid>
            <h:panelGrid columns="4">
            <h:panelGroup>
            <div style="width:100px;">
               <p:outputLabel value="#{lbl['lbl.ct.owner']}" />  
            </div>
           </h:panelGroup>
           <p:selectOneMenu disabled="false"  style="width:160px;">
             <f:selectItems value="#{supplierBackingBean.contractListItem.contractOwner}" />
           </p:selectOneMenu>
           <p:selectOneMenu disabled="false" style="width:140px;">
              <f:selectItems value="#{supplierBackingBean.contractListItem.contractOwnerJabatan}" />
            </p:selectOneMenu>
            <p:selectOneMenu  disabled="false" style="width:120px;">
            		 <f:selectItems value="#{supplierBackingBean.contractListItem.contractOwnerPtj}" />
            </p:selectOneMenu>
         </h:panelGrid>   
       </h:panelGrid>
  </p:panel>
</ui:composition>
