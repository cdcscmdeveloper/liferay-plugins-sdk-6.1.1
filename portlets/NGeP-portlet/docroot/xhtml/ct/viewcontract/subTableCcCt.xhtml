<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<script> $('#portlet_ctContractMaintenance_WAR_NGePportlet').find('.portlet-title-text').html('#{contractDetailsBackingBean.getPortletTitle()}'); </script>
		<style>
.column-align-center {
	text-align: center !important;
}

.ui-menu.ui-menu-dynamic.ui-widget.ui-widget-content.ui-corner-all.ui-helper-clearfix.ui-shadow
	{
	width: 250px;
}
</style>


		<p:blockUI block=":form" widgetVar="blkContractSearchAuditTable">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<p:messages id="messages" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" severity="error, info, warning" />

		<div style="overflow-x: auto">
			<p:dataTable id="subTableCcContract"
				value="#{circularBackingBean.managedBean.circularCtListingDataModel}"
				var="metadata" lazy="true" rowIndexVar="index" rowKey="#{metadata}"
				rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<ac:paginator for="subTableCcContract" />

				<p:column headerText="#{lbl['lbl.ct.audit.circular.contract.no']}"
					style="width:10%;" styleClass="column-align-center">
					<p:commandLink value="#{metadata.contractNo}"
						styleClass="blue_font" style="text-align:left; float:left; color:#009ae5 !important;"
						action="#{contractDetailsBackingBean.gotoViewPage(metadata.ctContract.contractId, metadata.ctContract.latestContractVer.contractVerId)}"
						onstart="blkContractSearchAuditTable.show()"
						oncomplete="blkContractSearchAuditTable.hide()">
					</p:commandLink>
				</p:column>

				<p:column
					headerText="#{lbl['lbl.ct.audit.circular.contract.title']}"
					styleClass="column-align-center"
					style="width:15%; white-space:normal;">
					<div align="left">
						<h:outputText value="#{metadata.contractName}"
							style="text-align:left; float:left;" />
					</div>
				</p:column>

				<p:column headerText="#{lbl['lbl.ct.audit.circular.pkp.no']}"
					style="width:10%;" styleClass="column-align-center">
					<div align="left">
						<h:outputText value="#{metadata.circularNo}"
							style="text-align:left; float:left;" />
					</div>
				</p:column>

				<p:column headerText="#{lbl['lbl.ct.audit.circular.PP.status']}"
					styleClass="column-align-center"
					style="width:25%;white-space:normal;">
					<div align="left">
						<h:outputText value="#{metadata.statusName}"
							style="text-align:left; float:left;" />
					</div>
				</p:column>

				<p:column headerText="#{lbl['lbl.ct.audit.circular.business.name']}"
					styleClass="column-align-center"
					style="width:25%; white-space:normal;">
					<div align="left">
						<h:outputText value="#{metadata.supplierName}"
							style="text-align:left; float:left;" />
					</div>
				</p:column>

				<p:column headerText="#{lbl['lbl.ct.audit.circular.fileReff.no']}"
					style="width:10%;" styleClass="column-align-center">
					<div align="left">
						<h:outputText value="#{metadata.loaPhysicalNo}"
							style="text-align:left; float:left;" />
					</div>
				</p:column>

				<p:column headerText="#{lbl['lbl.ct.audit.circular.contractStart']}"
					style="width:10%;" styleClass="column-align-center">
					<div align="left">
						<h:outputText value="#{metadata.effDate}"
							style="text-align:left; float:left;"> 
							<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
						</h:outputText>
					</div>
				</p:column>

				<p:column headerText="#{lbl['lbl.ct.audit.circular.contractEnd']}"
					styleClass="column-align-center">
					<div align="left">
						<h:outputText value="#{metadata.expDate}"
							style="text-align:left; float:left;">
							<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /> 
						</h:outputText>
					</div>
				</p:column>

				<p:column
					headerText="#{lbl['lbl.ct.audit.circular.contractStatus']}"
					style="width:10%;" styleClass="column-align-center">
					<div align="left">
						<h:outputText
							value="#{circularBackingBean.chkContractStatusType(metadata.docStatus)}"
							style="text-align:left; float:left;" />
					</div>
				</p:column>

			</p:dataTable>
		</div>

	</ui:define>
</ui:composition>
