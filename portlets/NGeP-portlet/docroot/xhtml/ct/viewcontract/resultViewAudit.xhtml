<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<script>
			$('#portlet_ctContractMaintenance_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{contractDetailsBackingBean.getPortletTitle()}');
		</script>
		<style>
.column-align-center {
	text-align: center !important;
}

.ui-menu.ui-menu-dynamic.ui-widget.ui-widget-content.ui-corner-all.ui-helper-clearfix.ui-shadow
	{
	width: 250px;
}

.left-align {
	text-align: left;
}

.left-align a {
	text-align: left;
}

</style>

 <script>

        // Select all row toggler icons in the DataTable

        // Trigger a click event on each row toggler

		<p:blockUI block=":form" widgetVar="blkContractSearchTable">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<ui:fragment rendered="#{contractDetailsBackingBean.isAuditCheck()}">
			<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				action="#{contractDetailsBackingBean.backAction()}" />
		</ui:fragment>
		<p:messages id="messages" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" severity="error, info, warning" />

		<p:panel id="searchResulId" header="#{lbl['lbl.ct.search.result']}"
			toggleable="true" toggleSpeed="500">
			<div style="overflow-x: auto">
				<p:dataTable id="resultViewContractTbl"
					value="#{contractDetailsBackingBean.managedBean.contractDetailsAuditList}"
					var="data" lazy="true" rowIndexVar="index" rowKey="#{data}"
					rows="10">
					<p:column style="display: none; width:16px">
						<!--  <p:rowToggler />-->
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.contract.no']}"
						style="width:10%;" styleClass="column-align-center">
						<div class="left-align">
							<p:commandLink value="#{data.contractNo}" styleClass="blue_font"
								style="color:#009ae5 !important;"
								action="#{contractDetailsBackingBean.gotoViewPage(data.ctContract.contractId, data.ctContractVer.contractVerId)}"
								onstart="blkContractSearchTable.show()"
								oncomplete="blkContractSearchTable.hide()">
							</p:commandLink>
						</div>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.contract.title']}"
						styleClass="column-align-center"
						style="width:15%; white-space:normal;">
						<div class="left-align">
							<h:outputText value="#{data.contractName}" />
						</div>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.physical.circular.no']}"
						styleClass="column-align-center"
						style="width:8%; white-space:normal;"
						rendered="#{contractDetailsBackingBean.isBPKCCA()}">
						<div class="left-align">
							<h:outputText value="#{data.circularNo}"
								rendered="#{data.ctCircularVer != null and 
						(data.ctCircularVer.status.statusId != CtStatusConst.cqRejected
							or data.ctCircularVer.status.statusId != CtStatusConst.cqCancelled)}" />
						</div>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.circular.status']}"
						styleClass="column-align-center"
						style="width:8%; white-space:normal;"
						rendered="#{contractDetailsBackingBean.isBPKCCA()}">
						<div class="left-align">
							<h:outputText
								value="#{contractDetailsBackingBean.getStatusDescById(data.ctCircularVer.status.statusId)}"
								rendered="#{data.ctCircularVer != null and 
						      (data.ctCircularVer.status.statusId != CtStatusConst.cqRejected
						      	or data.ctCircularVer.status.statusId != CtStatusConst.cqCancelled)}" />
						</div>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.supplier.name']}"
						styleClass="column-align-center"
						style="width:8%; white-space:normal;"
						rendered="#{!contractDetailsBackingBean.isSupplierRole()}">
						<div class="left-align">
							<h:outputText value="#{data.companyName}" />
						</div>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.loa.physical.no']}"
						styleClass="column-align-center"
						style="width:8%; white-space:normal;">
						<div class="left-align">
							<h:outputText value="#{data.loaPhysicalNo}" />
						</div>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.contract.start']}"
						styleClass="column-align-center"
						style="width:5%; white-space:normal;">
						<div class="left-align">
							<h:outputText value="#{data.effDate}">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</h:outputText>
						</div>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.contract.end']}"
						styleClass="column-align-center"
						style="width:5%; white-space:normal;">
						<div class="left-align">
							<h:outputText value="#{data.expDate}">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</h:outputText>
						</div>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.contract.status']}"
						styleClass="column-align-center"
						style="width:8%; white-space:normal;">
						<div class="left-align">
							<h:outputText
								value="#{contractDetailsBackingBean.getContractStatusDesc(data.contractStatus)}" />
						</div>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.fulfilment.details.status']}"
						styleClass="column-align-center"
						style="width:15%; white-space:normal;">
						<div class="left-align">
							<h:outputText
								value="#{contractDetailsBackingBean.chkContractStatusType(data.fdStatus)}" />
						</div>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.agreement.status']}"
						styleClass="column-align-center"
						style="width:15%; white-space:normal;">
						<div class="left-align">
							<h:outputText
								value="#{contractDetailsBackingBean.chkContractStatusType(data.agStatus)}" />
						</div>
					</p:column>
					<p:column style="width:6%; white-space:normal;"
						styleClass="column-align-center">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.ct.doc.contract.status']}" />
							<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.status.contract']}" />
						</f:facet>
						<div class="left-align">
							<h:outputText
								value="#{contractDetailsBackingBean.chkContractStatusType(data.status)}" />
						</div>
					</p:column>

				</p:dataTable>
				<p:outputPanel
					rendered="#{!contractDetailsBackingBean.isToHideFlSubTable()}">
					<ui:include src="/xhtml/ct/viewcontract/subTableCtFl.xhtml" />
				</p:outputPanel>
			</div>

		</p:panel>
	</ui:define>
</ui:composition>
