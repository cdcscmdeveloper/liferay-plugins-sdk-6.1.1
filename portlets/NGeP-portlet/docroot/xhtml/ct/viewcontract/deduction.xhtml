<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="deductionId" toggleable="true"  toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.deduction']}"/>
			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.deduction.dtls']}"/>
	   	</f:facet>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.select.deduction']}" escape="false"/><br/><br/>
		<p:dataTable id="tableDeduction" var="datas" 
		    value="#{contractDetailsBackingBean.managedBean.contractVer.ctDeductions}" rowKey="#{datas}" 
		      selectionMode="single" selection="#{contractDetailsBackingBean.managedBean.selectedDeduction}"> 
		       	
		       	<ac:paginator for="tableDeduction" />
		   	    <p:ajax event="rowSelect" update=":form:clauseDescp" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  />
		         
		          <p:column style="width:650px;">
		        	<f:facet name="header">
			            <h:outputText value="#{lbl['lbl.ct.deduction.type']}"/>
	               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.deduction.type']}"/>
	           		</f:facet>
	        	    <p:outputLabel value="#{contractDetailsBackingBean.getParameterDesc(datas.deductionType)}" style="float:left;" />
	              </p:column> 
		       
		          <p:column headerText="#{lbl['lbl.ct.amount']}" style="width:150px;text-align:right;">
	                 <h:outputText value="#{datas.amount}" rendered="#{datas.deductionType.parameterCode eq ParameterConst.deductionTypeFixedDeposit
		                   or datas.deductionType.parameterCode eq ParameterConst.deductionTypeAdvancePayment}">
		                <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		             </h:outputText>
		         </p:column>  
		   
		   </p:dataTable>  
	       <p:outputPanel id="clauseDescp">  
	            <h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.selectedDeduction != null 
	               and (contractDetailsBackingBean.managedBean.selectedDeduction.ctDeductionClauses.size() > 0 or
	               contractDetailsBackingBean.managedBean.selectedDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeAdvancePayment)}">
	               <p:spacer height="20"/>
     	           
     	           <p:dataTable id="tableClause" var="data" 
     	               value="#{contractDetailsBackingBean.managedBean.selectedDeduction.ctDeductionClauses}"  
        	           selection="#{contractDetailsBackingBean.selectedDeductionClauses}"  rowKey="#{data}"  > 
                       <ac:paginator for="tableClause" />   
                          
                            <p:column style="white-space:normal;width:98%;">
			                   	<f:facet name="header">
						            <h:outputText value="#{lbl['lbl.ct.deduction.clause.desc']}"/>
				               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.deduction.clause']}"/>
				               	</f:facet>
                                 <h:outputText escape="false" value="#{data.clauseDescription}" 
                                   rendered="#{contractDetailsBackingBean.managedBean.selectedDeduction.deductionType.parameterCode !=
        	                       ParameterConst.deductionTypeAdvancePayment}" style="float:left;"/>
                                 <h:outputText value="#{data.clauseDescription}" 
                                      rendered="#{contractDetailsBackingBean.managedBean.selectedDeduction.deductionType.parameterCode ==
        	                         ParameterConst.deductionTypeAdvancePayment}" >
        	                     </h:outputText>
                           </p:column>    
           
                      </p:dataTable>         
                </h:panelGroup>
             </p:outputPanel>
         </p:panel>      
</ui:composition>
