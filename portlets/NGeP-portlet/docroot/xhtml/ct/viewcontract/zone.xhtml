<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel toggleable="true" toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.zone']}"/>
	        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.zone.dtls']}"/>
	  	</f:facet>
		<table style="width: 100%">
		  <tr>
			  <td style="width: 105px"><p:outputLabel value="#{lbl['lbl.ct.location.level']}" /></td>
				  <td>
				  		<p:inputText id="locLevels2" disabled="true" 
				  			value="#{contractDetailsBackingBean.getParameterDesc(contractDetailsBackingBean.managedBean.contractVer.ctContract.locationLevel)}" />
				  </td>
			  </tr>
		  </table>
 		 <h:panelGrid width="100%" style="margin-top:20px">
 		  <p:treeTable id="zoneLocationDataTable"  value="#{contractDetailsBackingBean.managedBean.ctZoneTrees}"
 		    var="zoneTree">
 		    
 		    <p:column style="width:70%;" styleClass="column-align-center">
            <f:facet name="header">#{lbl['lbl.ct.location.name']}</f:facet>
              <p:treeNode type="zone">
                  <h:outputText value="#{zoneTree.zone}" style="float:left;"/>
              </p:treeNode>
              <p:treeNode type="state">
               <h:outputText value="#{zoneTree.state.stateName}"  style="float:left;" />
              </p:treeNode>
              <p:treeNode type="district">
               <h:outputText value="#{zoneTree.district.districtName}" style="float:left;" />
              </p:treeNode>
               
              
        </p:column>
 
        <p:column style="width:30%;" styleClass="column-align-center">
            <f:facet name="header"><h:outputText value="*" styleClass="mandatory" />
            	#{lbl['lbl.ct.delivery.term']}
            	<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.delivery.term']}"/>
            </f:facet>
             <p:treeNode type="zone">
             	<h:panelGrid columns="2" style="width:30%;" styleClass="zone-tree-node">
	                <h:outputText value="#{zoneTree.deliveryTerm}"  rendered="#{zoneTree.zone != null}"  required="true"
	                     style="width:40px;" styleClass="ppRightBtn" />
	                <h:outputText rendered="#{zoneTree.zone != null}" value="#{lbl['lbl.ct.days']}" ></h:outputText>
             	</h:panelGrid>
             </p:treeNode>
        </p:column>
      </p:treeTable>
 	 </h:panelGrid>
	</p:panel>
</ui:composition>
