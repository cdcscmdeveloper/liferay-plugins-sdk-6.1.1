<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<style type="text/css">
.calendarDateField input {
	width: 80px;
}
</style>
	<p:panel id="bondId" header="#{lbl['lbl.ct.panel.performance.bond']}" toggleable="true" toggleSpeed="500"
		rendered="#{contractDetailsBackingBean.managedBean.ctContract.bondReq and 
		!contractDetailsBackingBean.managedBean.directPurchase}">
	
	 <p:dataTable id="tableBond" var="varBond" rowIndexVar="index"
			  value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.ctPerformanceBonds}">
			  <ac:paginator for="tableBond" />
			
			<p:column style="width:10%;" headerText="#{lbl['lbl.ct.ref.no']}">
				<p:outputLabel value="#{varBond.refNo}"  style="width:85px;" />
			</p:column>
		
			<p:column style="width:30%;" headerText="#{lbl['lbl.ct.financial.inst']}">
			    <p:outputLabel value="#{varBond.financialOrg.finOrgName}"    style="width:230px;" />
			</p:column>
			
			<p:column style="width:12%;" headerText="#{lbl['lbl.ct.amount']}" >
				<h:outputText value="#{varBond.bondAmount}" styleClass="ppRightBtn"  style="width:90px;" disabled="true">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column style="width:8%;" headerText="#{lbl['lbl.ct.effective.date']}">
				<p:calendar id="popupButtonCal4" value="#{varBond.effDate}"  styleClass="calendarDateField" size="9" 
					  disabled="true"  pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
		        </p:calendar>
			</p:column>
			
			<p:column style="width:8%;" headerText="#{lbl['lbl.ct.expiry.date']}">
				<p:calendar id="bondExpDateCalId"  value="#{varBond.expDate}" styleClass="calendarDateField" disabled="true"
					size="9"  pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
			    </p:calendar>
			</p:column>
			
			<p:column styleClass="column-align-center" style="width:32%;" headerText="#{lbl['lbl.txt.attachment']}" >
				<h:panelGroup id="uploadBondPg">
					<h:commandLink title="#{varBond.fileName}"
						value="#{contractDetailsBackingBean.getShortFileName(varBond.fileName)}"
						style="float:right;" styleClass="blue_font"
						action="#{contractDetailsBackingBean.downloadFile(varBond.filePath, varBond.fileName)}" />
				</h:panelGroup>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
