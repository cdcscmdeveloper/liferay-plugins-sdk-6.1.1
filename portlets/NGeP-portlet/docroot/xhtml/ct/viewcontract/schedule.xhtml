<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="scheduleId" header="#{lbl['lbl.ct.panel.schedule']}"  toggleable="true"  toggleSpeed="500">
	   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.add.schedule']}" escape="false"/><br/>
	   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.delete.schedule']}" escape="false"/><br/>
	   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.fulfilment.delete.schedule']}" escape="false"/><br/><br/>
	  
	   <h:panelGrid columns="4">
           <p:selectOneRadio id="radiOptions"  required="true"
               value="#{contractDetailsBackingBean.managedBean.frequencySchedule}"  disabled="true"  >  
               <f:selectItems value="#{contractDetailsBackingBean.managedBean.radioButtonSchedule}" />
           </p:selectOneRadio>
         </h:panelGrid>  
       
         <p:outputPanel id="paymentSchedule">   
             <h:panelGroup  style="width:100%;" rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContract.frequencySchedule}">    
	                <p:dataTable id="payScheduleTableId"  var="payScheduleObj"  
	                    value="#{contractDetailsBackingBean.managedBean.contractVer.ctSchedules}" >
	                
	                   <ac:paginator for="payScheduleTableId" />
	                 
		               <p:column style="width:9%;" headerText="#{lbl['lbl.ct.schedule.no']}" styleClass="column-align-center">
		                   <p:outputLabel value="#{payScheduleObj.scheduleNo}" styleClass="ppRightBtn"  maxlength="4"  style="width:60px;" />
		               </p:column> 
		      
		               <p:column style="width:28%;" headerText="#{lbl['lbl.ct.start.period']}" styleClass="column-align-center">
		                   <p:selectOneMenu id="fromMonth" value="#{payScheduleObj.startMonth}" disabled="true" style="width:110px;">
                               <f:selectItems value="#{contractDetailsBackingBean.retrieveStartMonthList(payScheduleObj.startYear)}"/> 
                           </p:selectOneMenu> 
                           <p:spacer width="1"/>
                           <p:selectOneMenu id="fromYear" value="#{payScheduleObj.startYear}" disabled="true" style="width:100px;">
                               <f:selectItems value="#{contractDetailsBackingBean.yearList}" var="year" itemValue="#{year}" itemLabel="#{year}"  /> 
                           </p:selectOneMenu> 
		               </p:column> 	
		       
		                <p:column style="width:32%;" headerText="#{lbl['lbl.ct.end.period']}" styleClass="column-align-center">
		                    <h:panelGroup>
		                        <p:selectOneMenu id="toMonth" value="#{payScheduleObj.endMonth}" disabled="true" style="width:110px;" >
                                   <f:selectItems value="#{contractDetailsBackingBean.retrieveEndMonthList(payScheduleObj.endYear)}" />
                                </p:selectOneMenu>
                                <p:spacer width="1"/>
                                <p:selectOneMenu id="toYear" value="#{payScheduleObj.endYear}"  disabled="true" style="width:100px;" >
                                    <f:selectItems value="#{contractDetailsBackingBean.yearList}" /> 
                                </p:selectOneMenu>
		                     </h:panelGroup>
		                 </p:column> 
		            
		                 <p:column headerText="#{lbl['lbl.ct.total.month']}" style="width:10%;" styleClass="column-align-center">
		                     <h:outputText id="totalMonth" style="float:right;"
		                         value="#{contractDetailsBackingBean.calculateTotalMonth(payScheduleObj, 'S')}">
		                      </h:outputText>
		                  </p:column>
		           
		                  <p:column style="width:15%;white-space:normal;" styleClass="column-align-center">
		                      <f:facet name="header">
						     	<h:outputText value="#{lbl['lbl.ct.schedule.type']}"/>
				               	<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.schedule.type']}"/>
				              </f:facet>
				              <p:outputLabel value="#{contractDetailsBackingBean.getParameterDesc(payScheduleObj.scheduleType)}"/>
		                 </p:column>
		            </p:dataTable>  
	            </h:panelGroup>
		   
		   <h:panelGroup style="width:100%" rendered="#{!contractDetailsBackingBean.managedBean.contractVer.ctContract.frequencySchedule}" >
	            <p:dataTable  id="progPaymentTableId" var="progPaymentObj" 
	                  value="#{contractDetailsBackingBean.managedBean.contractVer.ctProgressivePayments}">
		              <ac:paginator for="progPaymentTableId" />
		          
                      <p:column style="width:4%;" headerText="#{lbl['lbl.ct.phase']}" styleClass="column-align-center">
                           <p:outputLabel value="#{progPaymentObj.phaseNo}" style="float:left;"/>
                          </p:column>
		      
		               <p:column style="width:25%;" headerText="#{lbl['lbl.ct.description']}" styleClass="column-align-center">
		                    <p:outputLabel  value="#{progPaymentObj.phaseDesc}" style="float:left;" />
		                    </p:column>
              
                        <p:column style="width:20%;" headerText="#{lbl['lbl.ct.start.period']}" styleClass="column-align-center" >
		                    <p:selectOneMenu id="fromProMonth" value="#{progPaymentObj.startMonth}"  style="width:110px;" disabled="true">
                                <f:selectItems value="#{contractDetailsBackingBean.retrieveStartMonthList(progPaymentObj.startYear)}" />
                             </p:selectOneMenu> 
                             <p:spacer width="1"/>
                           
                              <p:selectOneMenu id="fromProYear" value="#{progPaymentObj.startYear}"  style="width:70px;"  disabled="true">
                                   <f:selectItems value="#{contractDetailsBackingBean.yearList}" />
                              </p:selectOneMenu> 
		                  </p:column> 	
		        
		                  <p:column style="width:28%;" headerText="#{lbl['lbl.ct.end.period']}" styleClass="column-align-center">
		                      <h:panelGroup columns="5">
		                          <p:selectOneMenu id="toProMonth" value="#{progPaymentObj.endMonth}"   style="width:110px;" disabled="true">
                                      <f:selectItems value="#{contractDetailsBackingBean.retrieveEndMonthList(progPaymentObj.endYear)}"  />
                                  </p:selectOneMenu>
                                  <p:spacer width="1"/>
                                
                                  <p:selectOneMenu id="toProYear" value="#{progPaymentObj.endYear}"  style="width:70px;" disabled="true">
                                       <f:selectItems value="#{contractDetailsBackingBean.yearList}" /> 
                                   </p:selectOneMenu>
		                        </h:panelGroup>
		                     </p:column>       
		         
		                     <p:column headerText="#{lbl['lbl.ct.total.month']}" style="width:7%;white-space:normal;" styleClass="column-align-center">
		                           <h:outputText id="totalMonth" style="float:right;"
		                               value="#{contractDetailsBackingBean.calculateTotalMonth(progPaymentObj,'P')}">
		                           </h:outputText>
		                      </p:column>
               
                              <p:column style="width:14%;" headerText="#{lbl['lbl.ct.percentage']}" styleClass="column-align-center">
                                 <h:panelGroup>
                                     <h:outputText id="percentValidationId" value="#{progPaymentObj.percentage}" styleClass="ppRightBtn" >
                                        <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
                                      </h:outputText>
                                     <p:spacer width="5"/>
		                             <p:tooltip for="percentValidationId" showEffect="fade" value="#{lbl['lbl.ct.validation.progressive.percentage']}"/> 
		                        </h:panelGroup>
                             </p:column>
		             </p:dataTable>  
			      <p:spacer height="2" />
		   </h:panelGroup>    
	</p:outputPanel>
   </p:panel>
</ui:composition>
