<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="cc" header="#{lbl['lbl.ct.panel.contract']}" toggleable="true" collapsed="false" toggleSpeed="500">
	<!-- <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fulfilment.dtls']}"/> -->
	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br/><br/>
	<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		<h:panelGroup style="width:750px;" >
			<table style="width: 100%">
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="centralNo" value="#{lbl['lbl.ct.contract.no']}" />
					</td>
					<td>
						<p:inputText for="centralNo"  disabled="true" maxlength="17" style="width:130px;"
							value="#{contractDetailsBackingBean.managedBean.ctContract.contractNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.no']}" />
					</td>
					<td class="columnWidth150">
						<p:outputLabel id="centralphyNo" value="#{lbl['lbl.ct.physical.no']}" />
					</td> 
					<td>
						<p:inputText for="centralphyNo" maxlength="30" style="width:130px;"
						disabled="true" value="#{contractDetailsBackingBean.managedBean.contractVer.contractPhysicalNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.physical.contract.no']}" />
					</td>
				</tr>
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="centralEfDate" value="#{lbl['lbl.ct.effective.date']}" />
					</td>
					<td>
						<p:inputText for="centralEfDate" disabled="true" style="width:130px;"
							value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
					<td class="columnWidth150">
						<p:outputLabel id="centralExpDate" value="#{lbl['lbl.ct.expiry.date']}" />
					</td> 
					<td>
						<p:inputText for="centralExpDate" disabled="true" style="width:130px;"
							value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
				</tr>				
				<tr>
					<h:panelGroup rendered="#{!contractDetailsBackingBean.managedBean.ctContract.zonalPricing}">
					<td class="columnWidth150">
						 	<p:outputLabel id="centralPeriod" value="#{lbl['lbl.ct.delivery.period']}"  style="width:100%" styleClass="required"/>
	                 </td> 
					<td><p:inputText id="centralDelPeriod" styleClass="ppRightBtn"  style="width:45px;" maxlength="4"
					         value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}" disabled="true"  />
                		<p:spacer width="3"/>
                		<h:outputText value="#{lbl['lbl.ct.days']}" />
                	</td>                	
                	</h:panelGroup>   
                	<h:panelGroup rendered="#{!contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.agreement}">
                	<td class="columnWidth150">
						<p:outputLabel id="centralSignDate1" value="#{lbl['lbl.ct.signed.date']}" />
					</td> 
					<td>
						<p:calendar value="#{contractDetailsBackingBean.managedBean.contractVer.signedDate}" id="popupButtonCal" 
			   				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
			       			 size="17"   disabled="true">
			      		</p:calendar>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
					</td>					
					</h:panelGroup>
				</tr>
				<h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.agreement}">
				<tr rowspan="2">
					<h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId != CtStatusConst.acComplete and
						contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId != CtStatusConst.saComplete}">
					<td class="columnWidth150">
						<p:outputLabel for="centralAstatus" value="#{lbl['lbl.ct.agreement.status']}" />
					</td>
					<td>
						<p:inputTextarea id="centralAstatus" autoResize="false" 
							disabled="true" rows="2" style="width:130px;margin-bottom:5px;"
							value="#{contractDetailsBackingBean.getStatusDescById(contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId)}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.status']}" />
					</td>
					</h:panelGroup>
					<h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId eq CtStatusConst.acComplete or
						contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.status.statusId eq CtStatusConst.saComplete}">
					<td styleClass="columnWidth150">
						<p:outputLabel id="centralAgreement" value="#{lbl['lbl.ct.agreement']}" />
					</td>
					<td>
						<h:commandLink for="centralAgreement" styleClass="blue_font"
							title="#{contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.fileName}"
							value="#{contractDetailsBackingBean.getShortFileName(contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.fileName)}"
							action="#{contractDetailsBackingBean.downloadFile(contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.filePath,
							contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.ctAgreement.fileName)}" />
					</td>
					</h:panelGroup>
					<td class="columnWidth150">
						<p:outputLabel id="centralSignDate" value="#{lbl['lbl.ct.signed.date']}" />
					</td> 
					<td>
						<p:inputText for="centralSignDate" disabled="true" style="width:130px;"
							value="#{contractDetailsBackingBean.managedBean.contractVer.signedDate}">
			   				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
					</td>
				</tr>
				</h:panelGroup>
				
				<tr>
					<h:panelGroup rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.followLoaAmt}">
					<td class="columnWidth150">
						<p:outputLabel id="centralCtAmountId" value="#{lbl['lbl.ct.contract.amount']}" />
					</td>
					<td>
						<p:inputText for="centralCtAmountId" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
			   				value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.contractAmount}"  disabled="true">
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</td>
                	</h:panelGroup>
                	<td></td><td></td>
				</tr>
				
				<tr rowspan="4">
					<td class="columnWidth150">
						<p:outputLabel for="centralContractName" value="#{lbl['lbl.ct.contract.title']}" />
					</td>
					<td colspan="3">
						<p:inputTextarea id="centralContractName" autoResize="false" maxlength="1000"
							disabled="true" rows="4" style="width:465px; margin-bottom:5px;" 
							value="#{contractDetailsBackingBean.managedBean.ctContract.contractName}" />
					</td>					
				</tr>
			</table>
		</h:panelGroup>
	  	
	  	<h:panelGrid style="width:280px; margin-left:5px">
	      <h:panelGrid columns="3">  
		       <p:selectBooleanCheckbox 
			       value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true" />
		       <p:spacer width="2" />	
		       <h:panelGrid columns="2">
		       		<h:outputText value="#{lbl['lbl.ct.fee.exmption']}" />
		       		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fee.exmption']}" />
			   </h:panelGrid>
	         </h:panelGrid>	
	         <h:panelGrid columns="3">  
			   <p:selectBooleanCheckbox 
			      value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractAmount.agreement}" disabled="true" />
		       <p:spacer width="2" />
		       <h:panelGrid columns="2">
		       		<h:outputText value="#{lbl['lbl.ct.agreement']}" />
		       		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement']}" />
			   </h:panelGrid>
		     </h:panelGrid> 
		     <h:panelGrid columns="3">  
			   <p:selectBooleanCheckbox 
			      value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.followLoaAmt}"  disabled="true"/>
		       <p:spacer width="2" />
		       <h:panelGrid columns="2">
		       		<h:outputText value="#{lbl['lbl.ct.follow.ctvalue']}" />
		       		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fctvalue']}" />
			   </h:panelGrid>
		     </h:panelGrid> 
		       <h:panelGrid columns="3" rendered="#{!contractDetailsBackingBean.managedBean.directPurchase}">
			  <p:selectBooleanCheckbox id="exemptCentralId" disabled="true" style="text-align:top;"
			      value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" >
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.ap201']}" style="text-align:left;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap201.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>
	 	</h:panelGrid>
	 </h:panelGrid>
	 <p:outputPanel id="justificationCentralPanel" rendered="false">
  		<h:panelGrid columns="2" style="width:740px;" 
  			rendered="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}">
   			<p:outputLabel id="justificationOutputLbls" value="#{lbl['lbl.ct.justification.ap201']}" style="width:120px;" />
			<p:inputTextarea id="justificationCentralLbl" value="#{contractDetailsBackingBean.managedBean.contractVer.ctContractValue.justification}"
  				rows="3" style="width:465px;" maxlength="200" autoResize="false" disabled="true"></p:inputTextarea>	
   		</h:panelGrid> 
 	</p:outputPanel>
  </p:panel>
</ui:composition>
