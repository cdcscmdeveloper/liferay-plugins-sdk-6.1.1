<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<script> $('#portlet_ctContractMaintenance_WAR_NGePportlet').find('.portlet-title-text').html('#{contractDetailsBackingBean.getPortletTitle()}'); </script>
		<style>
.column-align-center {
	text-align: center !important;
}

.ui-menu.ui-menu-dynamic.ui-widget.ui-widget-content.ui-corner-all.ui-helper-clearfix.ui-shadow
	{
	width: 250px;
}
</style>
		<p:blockUI block=":form" widgetVar="blkContractSearchAuditTable">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:messages id="messages" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" severity="error, info, warning" />
		<div style="overflow-x: auto">
			<p:dataTable id="subTableCcDirectPurchase"
				value="#{circularBackingBean.managedBean.circularDpListingDataModel}"
				var="metadata" lazy="true" rowIndexVar="index" rowKey="#{metadata}"
				rows="10" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<ac:paginator for="subTableCcDirectPurchase" />
				<p:column headerText="#{lbl['lbl.ct.audit.circular.panel.ptj']}"
					style="width:25%;white-space:normal;"
					styleClass="column-align-center">
					<div align="left">
						<h:outputText value="#{metadata.ptj}" />
					</div>
				</p:column>
				<p:column
					headerText="#{lbl['lbl.ct.audit.circular.panel.doc.type']}"
					style="width:10%;" styleClass="column-align-center">
					<h:outputText
						value="#{circularBackingBean.checkDpCode(metadata.docType)}"
						style="text-align:left; float:left;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.audit.circular.panel.doc.no']}"
					style="width:10%;" styleClass="column-align-center">
					<p:commandLink value="#{metadata.docNo}" styleClass="blue_font"
						style="text-align:left; float:left; color:#009ae5 !important;"
						action="#{purchaseRequestBackingBean.navigateRequestNotePage(metadata.scRequestNote.requestNoteId)}"
						onstart="blkContractSearchAuditTable.show()"
						oncomplete="blkContractSearchAuditTable.hide()">
					</p:commandLink>
				</p:column>
				<p:column
					headerText="#{lbl['lbl.ct.audit.circular.panel.doc.title']}"
					styleClass="column-align-center" style="width:15%; white-space:normal;">
					<h:outputText value="#{metadata.docTitle}"
						style="text-align:left; float:left;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.ct.audit.circular.panel.status']}"
					style="width:10%;" styleClass="column-align-center">
					<h:outputText
						value="#{circularBackingBean.getStatusDescById(metadata.status)}"
						style="text-align:left; float:left;" />
				</p:column>
			</p:dataTable>
		</div>
	</ui:define>
</ui:composition>
