<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<ui:define name="contentSection">
    <style>
      .column-align-center { text-align: center !important;}
    </style>
   
    <p:blockUI block=":form" trigger="searchBtnId" widgetVar="searchBtnVar">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	<ac:lovPopup />
    <p:messages id="messages" showDetail="true" 
          showSummary="false" autoUpdate="true" closable="true" severity="error, info, warning" />

     <p:panel id="searchPanelId" header="#{lbl['lbl.ct.search']}" toggleable="true"  toggleSpeed="500">
 		<h:panelGrid columns="2" style="width:100%;" columnClasses="columnWidth20">
 		  	 <p:outputLabel value="#{lbl['lbl.ct.ptj.code']}" styleClass="required" />
 			 	<ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="20" readonly="true"
						headerText="#{lbl['lbl.ct.ptj']}" 
						value="#{customerServiceBackingBean.managedBean.searchPtjProfile.orgCode}"
						update=":form:searchPanelId" 
						saveObject="customerServiceBackingBean.managedBean.searchPtjProfile">
				</ac:lov>
			<p:outputLabel value="#{lbl['lbl.ct.ptj.name']}" />
           	 <p:inputText  style="width:600px;"
           	      value="#{customerServiceBackingBean.managedBean.searchPtjProfile.orgName}" disabled="true"> </p:inputText>
     		<p:outputLabel value="#{lbl['lbl.ct.contract.no']}" />
           	<p:inputText value="#{customerServiceBackingBean.managedBean.contractNo}" style="width:200px;"></p:inputText>
           	<p:outputLabel value="#{lbl['lbl.ct.physical.no']}" />
           	<p:inputText value="#{customerServiceBackingBean.managedBean.physicalContactNo}" style="width:200px;"></p:inputText>
           	<p:outputLabel value="	#{lbl['lbl.ct.contract.title']}" />
            <p:inputText value="#{customerServiceBackingBean.managedBean.contractTitle}"  style="width:600px;"></p:inputText>
                
		     <p:outputLabel for="contractStatus" value="#{lbl['lbl.ct.contract.status']}" />
		   	<p:selectOneMenu id="contractStatus" 
		   	     value="#{customerServiceBackingBean.managedBean.searchContractStatus}" style="width:200px;">
				<f:selectItems value="#{customerServiceBackingBean.getSearchContractStatusDropdown()}" />
		   	</p:selectOneMenu>
		</h:panelGrid>
	  	<div class="ppRightBtn"> 
        	<p:commandButton
        		 id="searchBtnId" value="#{lbl['lbl.btn.search']}" 
        		 action="#{customerServiceBackingBean.searchCustomerService}" validateClient="true" 
        		 onstart="searchBtnVar.show();" oncomplete="searchBtnVar.hide();"    update="contractTbl"/>
             <p:commandButton value="#{lbl['lbl.btn.reset']}" 
                action="#{customerServiceBackingBean.searchReset}"    update=":form"/>
	  	</div>	  		  
	  </p:panel>
		<p:panel id="searchResultId"	header="#{lbl['lbl.ct.search.result']}" toggleable="true"	toggleSpeed="500">
			<div style="overflow-x: auto">				
				<p:dataTable id="contractTbl" value="#{customerServiceBackingBean.managedBean.customerServiceDataModel}"
					var="data" lazy="true" rowIndexVar="index" rowKey="#{data}" rows="10">
					<ac:paginator for="contractTbl" />
					<p:column style="width:2%" headerText="No.">
				              <h:outputText value="#{index+1}" style="float:left;"/>
			       	</p:column>
					<p:column headerText="#{lbl['lbl.ct.contract.no']}" style="width:10%;"  styleClass="column-align-center">
						<h:outputText value="#{data.contractNo}" style="text-align:left; float:left;" />
					</p:column>					
					<p:column headerText="#{lbl['lbl.ct.contract.title']}" styleClass="column-align-center"  style="width:33%; white-space:normal;">
						<h:outputText value="#{data.contractName}"  style="text-align:left; float:left;" />
					</p:column>
					
					<p:column headerText="#{lbl['lbl.ct.contract.start']}" styleClass="column-align-center"  style="width:10%; white-space:normal;">
						<h:outputText value="#{data.effDate}" style="text-align:left; float:left;">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.contract.end']}"  styleClass="column-align-center" style="width:10%; white-space:normal;">
						<h:outputText value="#{data.expDate}" style="text-align:left; float:left;">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>										
					<p:column headerText="#{lbl['lbl.ct.contract.status']}" styleClass="column-align-center"  style="width:10%; white-space:normal;">
						<h:outputText value="#{customerServiceBackingBean.getContractStatusDesc(data.contractStatus)}" style="text-align:left; float:left;"/>
					</p:column>
					<p:column style="width:15%; white-space:normal;" styleClass="column-align-center">
						<f:facet name="header" >
					   		<h:outputText value="#{lbl['lbl.ct.doc.contract.status']}"/>
               		   		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.status.contract']}" />
               	    	</f:facet>
               	    	<div align="left">
						<h:outputText value="#{customerServiceBackingBean.chkContractStatusType(data.status)}" /></div>						
					   </p:column>
					 	<p:column headerText="#{lbl['lbl.ct.action']}" styleClass="column-align-center"  style="width:10%;">
					 	<p:commandLink process="@this" partialSubmit="true" 
					 	     action="#{customerServiceBackingBean.gotoViewPage(data,data.status, data.contractStatus)}">
							<p:graphicImage 
								value="/css/images/design/ico-view.png" title="#{lbl['lbl.ct.view']}" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</div>		
			  	<ac:lovPopup />	
		</p:panel>
	</ui:define>
</ui:composition>
