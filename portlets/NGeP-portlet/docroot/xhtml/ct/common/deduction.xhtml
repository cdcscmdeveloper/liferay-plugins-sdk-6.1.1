<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="deductionId" toggleable="true"  toggleSpeed="500">
    	   <f:facet name="header">
			    <h:outputText value="#{lbl['lbl.ct.panel.deduction']}"/>
			    <ac:iconTooltip id="tooltipDeductionDtls" value="#{lbl['lbl.ct.tooltip.deduction.dtls']}"/>
	   	   </f:facet>
		   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.select.deduction']}" escape="false"/><br/><br/>
		   
		   <p:dataTable id="tableDeduction" var="datas" widgetVar="tableDeductionObj" rowIndexVar="index"
		         value="#{ctBackingBean.managedBean.contractVer.ctDeductions}" rowKey="#{datas}" 
		         selectionMode="single" selection="#{ctBackingBean.managedBean.selectedDeduction}">	
		         	<ac:paginator for="tableDeduction" />
		   	       <p:ajax event="rowSelect"  
                       update=":form:clauseDescp" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  />
		       
		           <p:column style="width:2%;" rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}">
		              <f:facet name="header">
							<p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.selectAll}" >
								<p:ajax partialSubmit="true" process="@this"
									 update=":form:tableDeduction,:form:delDeductionBtn" listener="#{ctBackingBean.selectAllDeduction}" />
							</p:selectBooleanCheckbox>
						</f:facet>
		           
		                   <p:selectBooleanCheckbox disabled="#{ctBackingBean.managedBean.disableAmendDetails or datas.fromDpQt
		                   		  or ctBackingBean.managedBean.viewSCL}"
		                          value="#{datas.selectedCheckBox}" styleClass="myCustomChekBox"><!-- Enhancement 15851 - shaqimi -->
		           		          <p:ajax event="change" update=":form:tableDeduction,:form:delDeductionBtn" listener="#{ctBackingBean.selectOneDeductCheckboxSelect}"></p:ajax>
			               </p:selectBooleanCheckbox>
		            </p:column>
		           
		            <p:column style="width:200px;" id="updateColumn"  styleClass="column-align-center">
		        	     <f:facet name="header">
			                  <h:outputText value="#{lbl['lbl.ct.deduction.type']}" styleClass="required"/>
	               		      <ac:iconTooltip id="index" value="#{lbl['lbl.ct.tooltip.deduction.type']}"/>
	           		     </f:facet>
	           		   
	           		     <p:selectOneMenu value="#{datas.deductionType.parameterId}" style="width:170px;float:left;text-align:left;"
			      		     disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"  
			      		     rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting and
			      		          datas.deductionType.parameterCode != ParameterConst.deductionTypeAdvancePayment}"><!-- Enhancement 15851 - shaqimi -->
			                    <f:selectItems value="#{ctBackingBean.retrieveParameterDescListByType()}" />
			                    <p:ajax event="change" update=":form:tableDeduction, :form:clauseDescp,:form:messages" 
			                         process="@this"  partialSubmit="true"
			                         listener="#{ctBackingBean.validateDeductionType(datas)}"></p:ajax>
			              </p:selectOneMenu>
			              <h:outputText  rendered="#{(ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.notificationSetting) and 
			      		          datas.deductionType.parameterCode != ParameterConst.deductionTypeAdvancePayment}" 
			                     value="#{ctBackingBean.getParameterDesc(datas.deductionType)}" style="float:left;" />
			              <!-- Start Fix - #31500 AP screen display should be under deduction type column-->
			              <h:outputText rendered="#{datas.deductionType.parameterCode == ParameterConst.deductionTypeAdvancePayment}" 
							value="#{ctBackingBean.getParameterDesc(datas.deductionType)}" style="float:left;" />
						  <!-- End Fix - #31500 -->
					</p:column> 
					<p:column style="width:400px;text-align:center;">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.ct.deduction.description']}" styleClass="required"/>
						</f:facet>
						<p:spacer width="15"/>
						<!--Start Fix #32123 -->
						<p:inputText  value="#{datas.deductionDesc}"  style="width:400px;float:left;" maxlength="255"
							disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.notificationSetting
								or ctBackingBean.managedBean.viewSCL}"  
							rendered="#{!ctBackingBean.managedBean.viewContract and  !ctBackingBean.managedBean.notificationSetting and 
								(ctBackingBean.getParameterCode(datas.deductionType) == ParameterConst.deductionTypeOthers
								or ctBackingBean.getParameterCode(datas.deductionType) == ParameterConst.deductionTypeFixed
								or ctBackingBean.getParameterCode(datas.deductionType) == ParameterConst.deductionTypeNonFixed)}" required="true" label="#{lbl['lbl.ct.deduction.description']}"><!-- Enhancement 15851 - shaqimi -->
							</p:inputText>
							<h:outputText rendered="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.notificationSetting}"
								value="#{datas.deductionDesc}" style="float:left;" />
						 <!--End Fix #32123 -->		
					</p:column> 

					<p:column style="width:150px;text-align:right;">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.ct.amount']}" styleClass="required"/>
						</f:facet>
						<h:outputText value="#{datas.amount}" 
							rendered="#{datas.deductionType.parameterCode eq ParameterConst.deductionTypeAdvancePayment}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
						<p:inputText  value="#{datas.amount}" styleClass="ppRightBtn" style="width:100px;" 
							disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"
							rendered="#{!ctBackingBean.managedBean.viewContract and  !ctBackingBean.managedBean.notificationSetting and
							ctBackingBean.getParameterCode(datas.deductionType) == ParameterConst.deductionTypeFixed}" required="true" label="#{lbl['lbl.ct.amount']}"><!-- Enhancement 15851 - shaqimi -->
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							<p:ajax process="@this"></p:ajax>
						</p:inputText>  
						<h:outputText value="#{datas.amount}"  rendered="#{(ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.notificationSetting) and  
							ctBackingBean.getParameterCode(datas.deductionType) == ParameterConst.deductionTypeFixed}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>

		   </p:dataTable>  
		   <c:if test="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}">
		   <div class="ppRightBtn">
                    <p:commandButton id="addDeductionBtn" value="#{lbl['lbl.btn.add']}" 
                       disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"
                       process="@form"  partialSubmit="true" action="#{ctBackingBean.addDeduction()}" update="tableDeduction"
                       oncomplete="tableDeductionObj.paginator.endLink.click();"/><!-- Enhancement 15851 - shaqimi -->
		  	        <p:commandButton id="delDeductionBtn" value="#{lbl['lbl.ct.delete']}" process="@this" partialSubmit="true"
		  	            disabled="#{ctBackingBean.managedBean.buttonHideDedActive or ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"  onsuccess="dlgDeduction.show()"/><!-- Enhancement 15851 - shaqimi -->
		  	</div>
		  	<p:confirmDialog id="dlgDeduction" widgetVar="dlgDeduction" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}"> 
             <div class="ppRightBtn">
		            <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:tableDeduction,:form:clauseDescp,:form:delDeductionBtn" 
		                 process="@form"  actionListener="#{ctBackingBean.deleteDeductionDetails()}" oncomplete="dlgDeduction.hide();"/>
			        <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgDeduction.hide();" type="button" />
		      </div>
             </p:confirmDialog>
		  	</c:if>
	       <p:outputPanel id="clauseDescp">  
	                <h:panelGroup rendered="#{ctBackingBean.managedBean.selectedDeduction != null}">
	                      <p:spacer height="20"/>
     	                  <p:dataTable id="tableClause" var="data" widgetVar="tableClauseWidget" rowIndexVar="index"
     	                         value="#{ctBackingBean.managedBean.selectedDeduction.ctDeductionClauses}"  
        	                      selection="#{ctBackingBean.selectedDeductionClauses}"  rowKey="#{data}"> 
                                   <ac:paginator for="tableClause" />   
                                   <p:column style="width:2%;" rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}">
		                                   <f:facet name="header">
							                    <p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.selectAll}">
								                    <p:ajax partialSubmit="true" process="@this"
									                      update=":form:tableClause,:form:delDeductionClauseBtn" listener="#{ctBackingBean.selectAllDeductionClause}" />
							                 </p:selectBooleanCheckbox>
						                 </f:facet>
		           
		                                <p:selectBooleanCheckbox disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"
		                                       value="#{data.selectedCheckBox}" styleClass="myCustomChekBox"
		                                          rendered="#{(!ctBackingBean.managedBean.viewContract  and !ctBackingBean.managedBean.notificationSetting) and 
                                                     ctBackingBean.managedBean.selectedDeduction.deductionType.parameterCode != ParameterConst.deductionTypeAdvancePayment }"><!-- Enhancement 15851 - shaqimi -->
		           		                            <p:ajax event="change" 
		           		                                update=":form:tableClause,:form:delDeductionClauseBtn" listener="#{ctBackingBean.selectOneClauseCheckboxSelect}"></p:ajax>
			                           </p:selectBooleanCheckbox>
		                           </p:column>
                            
                                    <p:column style="white-space:normal;width:98%;">
			                         	  <f:facet name="header">
						                        <h:outputText value="#{lbl['lbl.ct.deduction.clause.desc']}"/>
				               	          	   <ac:iconTooltip id="index" value="#{lbl['lbl.ct.tooltip.deduction.clause']}"/>
				               	          </f:facet>
                                          <p:inputTextarea value="#{data.clauseDescription}" maxlength="500" rows="4" style="width:97%;" autoResize="false"
                                               rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}"
                                               disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}" styleClass="ui-inputtextarea"><!-- Enhancement 15851 - shaqimi -->
        	                                  <p:ajax process="@this"/>
        	                              </p:inputTextarea>
        	                              
        	                              <h:outputText  rendered="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.notificationSetting}"  value="#{data.clauseDescription}" style="float:left;" />
                                     </p:column>    
           
                      </p:dataTable>
                    
                      <div class="ppRightBtn"> 
	                          <h:panelGroup  rendered="#{ctBackingBean.managedBean.selectedDeduction != null and  (!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting)}">
	        	                
	        	                <p:commandButton id="addDeductionClauseBtn" value="#{lbl['lbl.btn.add']}" process="@form" 
	        	                    disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"
	        	                    action="#{ctBackingBean.addDeductionClause()}" update=":form:tableClause"
	        	                    oncomplete="tableClauseWidget.paginator.endLink.click();"><!-- Enhancement 15851 - shaqimi -->
	        	                  	<p:tooltip for="addDeductionClauseBtn">
								    	<h:outputText value="#{lbl['lbl.ct.tooltip.add.clause']}" escape="false" />
									</p:tooltip>
								</p:commandButton>
			  	                
			  	                <p:commandButton id="delDeductionClauseBtn"  
			  	                       disabled="#{ctBackingBean.managedBean.buttonHideDedActive or ctBackingBean.managedBean.disableAmendDetails
			  	                       or ctBackingBean.managedBean.viewSCL}"
			  	                      value="#{lbl['lbl.ct.delete']}" process="@this" partialSubmit="true" onsuccess="dlgDeductionClause.show()"><!-- Enhancement 15851 -->
								</p:commandButton>
								
								<p:confirmDialog id="dlgDeductionClause" widgetVar="dlgDeductionClause" message="#{lbl['lbl.msg.confirm.delete']}" 	
                                        severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                                    <div class="ppRightBtn">
		                                    <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:tableClause,:form:delDeductionClauseBtn" 
		                                          process="@this"  partialSubmit="true" actionListener="#{ctBackingBean.deleteClauseDetails()}" oncomplete="dlgDeductionClause.hide();"/>
			                               <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgDeductionClause.hide();" type="button" />
		                           </div>
                                  </p:confirmDialog>
	                       </h:panelGroup>
                    </div>
                     
                </h:panelGroup>
             </p:outputPanel>
         </p:panel>      
	    <p:panel header="#{lbl['lbl.ct.panel.remarks.attachment']}" toggleable="true" rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting and !ctBackingBean.managedBean.viewSCL}">
		  <table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{ctBackingBean.managedBean.contractVer.deductionRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{ctBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<p:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" 
													disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.notificationSetting}"
													style="width:70%;" autoResize="false" /> 
												<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.remark']}" rendered="#{remarkIndex==0}" />
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.attachment']}" escape="false"/><br/><br/>
				<table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.attachment']}" /></td>
			<td class="TableFieldRight">
				<p:commandButton oncomplete="uploadDeductDlg.show();return false;"
					update="lampiranDeduct, uploadDeductDlg" value="#{lbl['lbl.txt.attach.files']}"
					disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.notificationSetting
						or (ctBackingBean.managedBean.taskId != null and !bpmTasklistBackingBean.managedBean.claim)}" />
			</td>
		</tr>
		<tr>
			<td/>
			<td>
				<p:dataGrid id="lampiranDeduct" value="#{ctBackingBean.managedBean.contractVer.deductionAttachments}"
					var="attachFile" rowIndexVar="attachFileIndex" columns="1" style="width:100%"
					emptyMessage ="#{lbl['lbl.datatable.msg.no.records.found']}">
					<table>
						<tr>
							<td rowspan="2"><h:graphicImage value="/css/images/design/#{ctBackingBean.determineIcon(attachFile)}" height="30" width="30"/></td>
							<td width="5"></td>
							<td>
								<h:outputText value=" #{attachFile.createdUser.userName}"></h:outputText>,
								<h:outputText value="#{attachFile.createdDate}">									
									<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<h:commandLink value="#{attachFile.fileName}" 
									styleClass="blue_font" action="#{ctBackingBean.downloadFile(attachFile)}" />
								<p:commandLink onsuccess="deleteDeductAttachmentDlg.show();" action="#{ctBackingBean.setAttachFileIndex(attachFileIndex)}"
									rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}"
									disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.notificationSetting
										or (ctBackingBean.managedBean.taskId != null and !bpmTasklistBackingBean.managedBean.claim)}">
			   						<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			 	 				</p:commandLink>
			 	 			</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>
				</td>
			</tr>
		</table>
		<p:dialog id="uploadDeductDlg" widgetVar="uploadDeductDlg" modal="true"  resizable="false"
	     width="700px" height="350px" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{ctBackingBean.fileUpload}"
			mode="advanced" id="uploadDeductId" multiple="true"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}"
			label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload.all']}" cancelLabel="#{lbl['lbl.btn.remove.all']}" 
			update="lampiranDeduct" >
		</p:fileUpload>
		<f:facet name="footer">
		<div class="ppRightBtn">
		    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadDeductDlg.hide();" />
  		</div>
   		</f:facet>
	</p:dialog>	
	
	  <p:confirmDialog id="deleteDeductAttachmentDlg" widgetVar="deleteDeductAttachmentDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                         <div class="ppRightBtn">
		                     <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                         update=":form:lampiranDeduct" 
		                         action="#{ctBackingBean.deleteDeductAttachmentAction(ctBackingBean.managedBean.attachFileIndex)}"
		                         oncomplete="deleteDeductAttachmentDlg.hide();"/>
			                 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteDeductAttachmentDlg.hide();" type="button" />
		                 </div>
                   </p:confirmDialog>
	</p:panel>		     
	<!-- Bug #29446 - start -->
	<p:panel header="#{lbl['lbl.ct.panel.remarks.attachment']}" toggleable="true" 
	    rendered="#{ctBackingBean.managedBean.viewContract}">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top" style="text-align:center"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" style="float:none;text-align:center"/></td>
				<td width="50%" valign="top" style="text-align:center"><h:outputLabel value="#{lbl['lbl.txt.attachment']}" style="float:none;text-align:center"/></td>
			</tr>
	<tr>
		<td class="TableFieldLeft" width="50%" style="padding-left:6.25%;text-align:left">
			<p:dataGrid var="remark" 
			value="#{ctBackingBean.managedBean.contractVer.deductionRemarks}" rowIndexVar="index"
				columns="1"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<table>
					<tr>
						<td rowspan="2" valign="top">
							<h:graphicImage value="#{ctBackingBean.userImagePath(remark.createdUser.loginId)}"
								height="30" width="30" />
							</td>
						<td width="5"></td>
						<td>
							<h:outputText id="remarkCreator"
								value="#{remark.createdUser.userName}" />, 
							<h:outputText id="remarkDates" value="#{remark.changedDate}">
								<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</h:outputText>
						</td>
					</tr>
					<tr>
						<td></td>
						<td>
							<h:outputText value="#{remark.remark}"
							style="display: inline-block; word-break: break-word; white-space:normal"/>
						</td>
					</tr>
				</table>
			</p:dataGrid>
		</td>
		<td class="TableFieldRight" width="50%" style="padding-left:6.25%">
			<p:dataGrid value="#{ctBackingBean.managedBean.contractVer.deductionAttachments}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" var="attachment"
				rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex != contractDetailsBackingBean.managedBean.settingIndex and
					contractDetailsBackingBean.managedBean.selectedTabIndex != contractDetailsBackingBean.managedBean.notificationIndex}"
				rowIndexVar="attachFileIndex" columns="1" style="width:100%">
				<table>
					<tr>
						<td rowspan="2" style="vertical-align: top;" align="left">
							<h:graphicImage value="/css/images/design/#{ctBackingBean.determineIcon(attachment)}"
								height="30" width="30" />
						</td>
						<td><h:outputText value="#{attachment.createdUser.userName}" />, 
							<h:outputText value="#{attachment.createdDate}">
								<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</h:outputText>
						</td>
					</tr>
					<tr>
						<td>
							<h:commandLink value="#{attachment.fileName}"
								styleClass="blue_font" immediate="true"
								action="#{ctBackingBean.downloadFile(attachment)}" />
						</td>
					</tr>
				</table>
			</p:dataGrid>
		</td>
	</tr>
		</table>
	</p:panel>
	<!-- Bug #29446 - end -->
</ui:composition>
