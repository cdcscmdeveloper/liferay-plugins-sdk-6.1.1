<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
    <p:panel id="deductionId" toggleable="true"  toggleSpeed="500">
    	   <f:facet name="header">
			    <h:outputText value="#{lbl['lbl.ct.panel.deduction']}"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.deduction.dtls']}"/>
	   	   </f:facet>
		   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.select.deduction']}" escape="false"/><br/><br/>
		   
		   <p:dataTable id="tableDeduction" var="datas" 
		         value="#{ctBackingBean.managedBean.contractVer.ctDeductions}" rowKey="#{datas}" 
		         selectionMode="single" selection="#{ctBackingBean.managedBean.selectedDeduction}">	
		         	<ac:paginator for="tableDeduction" />
		   	       <p:ajax event="rowSelect" update=":form:clauseDescp" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  />
		       
		           <p:column style="width:25px;" rendered="#{!ctBackingBean.managedBean.viewContract}">
		                   <p:selectBooleanCheckbox disabled="#{ctBackingBean.managedBean.disableAmendDetails}"
		                          value="#{datas.selectedCheckBox}" styleClass="myCustomChekBox">
		           		          <p:ajax event="change" update=":form:delDeductionBtn" listener="#{ctBackingBean.selectOneCheckboxSelect}"></p:ajax>
			               </p:selectBooleanCheckbox>
		            </p:column>
		           
		            <p:column style="width:650px;" id="updateColumn"  styleClass="column-align-center">
		        	     <f:facet name="header">
			                  <h:outputText value="#{lbl['lbl.ct.deduction.type']}" styleClass="required"/>
	               		      <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.deduction.type']}"/>
	           		     </f:facet>
	           		   
	           		     <p:selectOneMenu value="#{datas.deductionType.parameterId}" style="width:170px;float:left;text-align:left;"
			      		     disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.disableAmendDetails}"  
			      		     rendered="#{datas.deductionType.parameterCode != ParameterConst.deductionTypeAdvancePayment}">
			                    <f:selectItems value="#{ctBackingBean.retrieveParameterDescListByType()}" />
			                    <p:ajax event="change" update=":form:tableDeduction, :form:clauseDescp" process="@all"  partialSubmit="true"
			                         listener="#{ctBackingBean.validateDeductionType(datas.deductionType.parameterId)}"></p:ajax>
			              </p:selectOneMenu>
			            
			              <h:outputText rendered="#{datas.deductionType.parameterCode == ParameterConst.deductionTypeAdvancePayment}" 
			                 value="#{ctBackingBean.getParameterDesc(datas.deductionType)}" style="float:left;" />
			                 <p:spacer width="5"/>
			                   <p:inputText  value="#{datas.deductionDesc}"  style="width:400px;float:left;" maxlength="250"
		                           disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.disableAmendDetails}"
		                           rendered="#{ctBackingBean.getParameterCode(datas.deductionType) == ParameterConst.deductionTypeOthers}">
			                 </p:inputText>  
			              </p:column> 
		       
		              <p:column  headerText="#{lbl['lbl.ct.amount']}" style="width:150px;text-align:right;">
	                       <h:outputText value="#{datas.amount}" 
	                            rendered="#{datas.deductionType.parameterCode eq ParameterConst.deductionTypeAdvancePayment}">
		                       <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		                  </h:outputText>
		                  <p:inputText  value="#{datas.amount}" styleClass="ppRightBtn" style="width:100px;" 
		                      disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.disableAmendDetails}"
		                      rendered="#{ctBackingBean.getParameterCode(datas.deductionType) == ParameterConst.deductionTypeFixedDeposit}">
			                <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			                </p:inputText>  
		              </p:column>  
		   
		   </p:dataTable>  
		   <c:if test="#{!ctBackingBean.managedBean.viewContract }">
		   <div class="ppRightBtn">
                    <p:commandButton id="addDeductionBtn" value="#{lbl['lbl.btn.add']}" 
                       disabled="#{ctBackingBean.managedBean.disableAmendDetails}"
                       process="@form"  action="#{ctBackingBean.addDeduction()}" update=":form:tableDeduction"/>
		  	        <p:commandButton id="delDeductionBtn" value="#{lbl['lbl.btn.delete']}" process="@form" 
		  	            disabled="#{ctBackingBean.managedBean.buttonHideActive or ctBackingBean.managedBean.disableAmendDetails}"  onclick="dlgDeduction.show()"/>
		  	</div>
		  	</c:if>
		  	<p:dialog id="dlgDeduction" widgetVar="dlgDeduction" modal="true" width="330" styleClass="screen-title">  
             <h:panelGrid columns="3">
                  <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			         <p:spacer width="10"/>
                     <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
             </h:panelGrid>
             <div class="ppRightBtn">
		            <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:tableDeduction, :form:clauseDescp" 
		                 process="@form"  actionListener="#{ctBackingBean.deleteDeductionDetails()}" onclick="dlgDeduction.hide();"/>
			        <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgDeduction.hide();" type="button" />
		      </div>
        </p:dialog>  
	       <p:outputPanel id="clauseDescp">  
	            <h:panelGroup rendered="#{ctBackingBean.managedBean.selectedDeduction != null}">
	               <p:spacer height="20"/>
     	           <p:dataTable id="tableClause" var="data" 
     	               value="#{ctBackingBean.managedBean.selectedDeduction.ctDeductionClauses}"  
        	           selection="#{ctBackingBean.selectedDeductionClauses}"  rowKey="#{data}"> 
                       <ac:paginator for="tableClause" />   
                            <p:column selectionMode="multiple"   style="width:2%; vertical-align:top;" 
                               disabledSelection="#{ctBackingBean.managedBean.disableAmendDetails}"
                               rendered="#{ctBackingBean.managedBean.selectedDeduction.deductionType.parameterCode !=
        	                         ParameterConst.deductionTypeAdvancePayment or !ctBackingBean.managedBean.viewContract}">
        	                         </p:column>
                           
                             <p:column style="white-space:normal;width:98%;">
			                   	<f:facet name="header">
						            <h:outputText value="#{lbl['lbl.ct.deduction.clause.desc']}"/>
				               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.deduction.clause']}"/>
				               	</f:facet>
                                 <h:outputText escape="false" value="#{data.clauseDescription}" 
                                   rendered="#{ctBackingBean.managedBean.selectedDeduction.deductionType.parameterCode == ParameterConst.deductionTypeAdvancePayment}" style="float:left;"/>
                                 <p:inputTextarea value="#{data.clauseDescription}" maxlength="500" rows="4" style="width:97%;" autoResize="false"
                                     disabled="#{ctBackingBean.managedBean.flgPaymentTracking or ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.disableAmendDetails}"
                                     rendered="#{ctBackingBean.managedBean.selectedDeduction.deductionType.parameterCode != ParameterConst.deductionTypeAdvancePayment}" styleClass="ui-inputtextarea">
        	                     <p:ajax process="@this"/>
        	                   </p:inputTextarea>
                           </p:column>    
           
                      </p:dataTable>
                      <div class="ppRightBtn"> 
                          <c:if test="#{ctBackingBean.managedBean.selectedDeduction != null and 
                                ctBackingBean.managedBean.selectedDeduction.deductionType.parameterCode  != ParameterConst.deductionTypeAdvancePayment and
        	                    !ctBackingBean.managedBean.viewContract }">
        	                <p:commandButton id="addDeductionClauseBtn" value="#{lbl['lbl.btn.add']}" process="@form" 
        	                    disabled="#{ctBackingBean.managedBean.disableAmendDetails}"
        	                    action="#{ctBackingBean.addDeductionClause()}" update=":form:tableClause">
        	                  	<p:tooltip for="addDeductionClauseBtn">
							    	<h:outputText value="#{lbl['lbl.ct.tooltip.add.clause']}" escape="false" />
								</p:tooltip>
							</p:commandButton>
		  	                <p:commandButton id="delDeductionClauseBtn"  
		  	                       disabled="#{ctBackingBean.managedBean.disableAmendDetails}"
		  	                      value="#{lbl['lbl.btn.delete']}" process="@form" onclick="dlgDeductionClause.show()">
							</p:commandButton>
                         </c:if>
                    </div>
                </h:panelGroup>
                 <p:dialog id="dlgDeductionClause" widgetVar="dlgDeductionClause" modal="true" width="330" styleClass="screen-title">  
                   <h:panelGrid columns="3">
                  <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			         <p:spacer width="10"/>
                     <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
             </h:panelGrid>
             <div class="ppRightBtn">
		            <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:tableClause" 
		                 process="@form"  actionListener="#{ctBackingBean.deleteClauseDetails()}" onclick="dlgDeductionClause.hide();"/>
			        <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgDeductionClause.hide();" type="button" />
		      </div>
        </p:dialog>  
             </p:outputPanel>
         </p:panel>      
	    <p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true" rendered="#{!ctBackingBean.managedBean.viewContract}">
		  <table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{ctBackingBean.managedBean.contractVer.deductionRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{ctBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" 
													disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.disableAmendDetails}"/> 
												<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.remark']}"/>
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		     
</ui:composition>
