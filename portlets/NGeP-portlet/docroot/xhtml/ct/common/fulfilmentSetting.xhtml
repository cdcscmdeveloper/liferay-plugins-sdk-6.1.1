<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
		<p:panel  header="#{lbl['lbl.ct.panel.fulfilment.setting']}"  toggleable="true"  toggleSpeed="500">
         <h:panelGrid columns="3" style="width:100%;" columnClasses="columnWidth240">  
            
             <p:outputLabel value="#{lbl['lbl.ct.contract.notify']}" styleClass="required"  />
             <p:inputText maxlength="4" disabled="#{ctBackingBean.managedBean.viewContract}"
	             value="#{ctBackingBean.managedBean.contractVer.ctSetting.ctNotifyDays}"
	             style="width:50px;" label="#{lbl['lbl.ct.contract.notify']}" required="true" />
             <h:panelGrid columns="3">
             	<p:outputLabel value="#{lbl['lbl.ct.contract.notify.desc']}" style="float:left;text-align:left;"/>
             	<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.notification']}" />
			 </h:panelGrid>
             
             <p:outputLabel value="#{lbl['lbl.ct.agreement.notify']}"  styleClass="required" />  
             <p:inputText maxlength="4" disabled="#{ctBackingBean.managedBean.viewContract}"
             	value="#{ctBackingBean.managedBean.contractVer.ctSetting.agNotifyDaysB4Ag}"
             	style="width:50px;" label="#{lbl['lbl.ct.agreement.notify']}"   required="true" />  
             <h:panelGrid columns="3">
	       		<p:outputLabel value="#{lbl['lbl.ct.agreement.notify.desc']}" style="float:left;text-align:left;"/>
	            <p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.notification']}" />
			 </h:panelGrid>
			
			 <p:outputLabel value="#{lbl['lbl.ct.pb.notify']}"  styleClass="required"/>  
             <p:inputText maxlength="4" disabled="#{ctBackingBean.managedBean.viewContract}"
             	value="#{ctBackingBean.managedBean.contractVer.ctSetting.bondNotifyDays}"
             	style="width:50px;" label="#{lbl['lbl.ct.pb.notify']}"  required="true"  />  
             <h:panelGrid columns="3">
             	<p:outputLabel value="#{lbl['lbl.ct.pb.notify.desc']}" style="float:left;text-align:left;" />
             	<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.perforamnce.bond.notification']}" />
			 </h:panelGrid>
          
             <h:outputLabel value="#{lbl['lbl.ct.termination.notify']}"  styleClass="required" />  
             <p:inputText maxlength="4" disabled="#{ctBackingBean.managedBean.viewContract}"
             	value="#{ctBackingBean.managedBean.contractVer.ctSetting.terminationNotifyDays}"
             	style="width:50px;" label="#{lbl['lbl.ct.termination.notify']}"  required="true" />  
             <h:panelGrid columns="3">
             	<p:outputLabel value="#{lbl['lbl.ct.termination.notify.desc']}" style="float:left;text-align:left;"/>
             	<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.termination.notification']}" />
			 </h:panelGrid>
             
             <p:outputLabel value="#{lbl['lbl.ct.do.notify']}"  styleClass="required"/>  
             <p:inputText maxlength="4" disabled="#{ctBackingBean.managedBean.viewContract}"
             	value="#{ctBackingBean.managedBean.contractVer.ctSetting.supplierDoDays}"
             	style="width:50px;" label="#{lbl['lbl.ct.do.notify']}"  required="true" />  
             <h:panelGrid columns="3">
             	<p:outputLabel value="#{lbl['lbl.ct.do.notify.desc']}" style="float:left;text-align:left;"/>
             	<p:spacer width="1"/>
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.delivery.order.notification']}" />
			 </h:panelGrid>
			
			 <c:if test="#{!ctBackingBean.managedBean.directPurchase 
             	and ParameterConst.contractTypeMinistry == ctBackingBean.managedBean.contractVer.ctContract.contractType.parameterCode 
             	and ctBackingBean.managedBean.contractVer.ctContract.mto}">
	             <p:outputLabel value="#{lbl['lbl.ct.approver.notify']}"   styleClass="required"/>  
	             <p:inputText maxlength="4" disabled="#{ctBackingBean.managedBean.viewContract}"             	
	             	value="#{ctBackingBean.managedBean.contractVer.ctSetting.approverMtoDays}"
	             	style="width:50px;" label="#{lbl['lbl.ct.approver.notify']}" required="true" />              
	             <h:outputLabel value="#{lbl['lbl.ct.approver.notify.desc']}" style="float:left;text-align:left;"/>
             </c:if>
             <p:outputLabel value="#{lbl['lbl.ct.last.co.notify']}"  styleClass="required" />  
             <p:inputText maxlength="4" disabled="#{ctBackingBean.managedBean.viewContract}"
             	value="#{ctBackingBean.managedBean.contractVer.ctSetting.lastCOBeforeExpiryDays}"
             	style="width:50px;" label="#{lbl['lbl.ct.last.co.notify']}"  required="true"/>  
             <h:outputLabel value="#{lbl['lbl.ct.last.co.notify.desc']}" style="float:left;text-align:left;"/>             
           </h:panelGrid>
         </p:panel>
         
	<p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true" rendered="#{!ctBackingBean.managedBean.viewContract}">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{ctBackingBean.managedBean.contractVer.settingRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{ctBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<p:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000"
													disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.disableAmendDetails}"
													style="width:70%;" autoResize="false" /> 
												<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.remark']}" rendered="#{remarkIndex==0}"/>
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top">
				</td>
			</tr>
		</table>
	</p:panel>		         
         
</ui:composition>
