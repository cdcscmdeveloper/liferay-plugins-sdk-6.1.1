<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="factoringId" toggleable="true" toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.factoring']}" />
			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.dtls']}" />
		</f:facet>

		<h:panelGrid columns="2" style="width:100%"
			columnClasses="columnWidthFact220">
			<p:outputLabel value="#{lbl['lbl.ct.factoring.company']}" />
			<p:inputText disabled="true" style="width:620px;"
				value="#{ctBackingBean.managedBean.contractVer.ctContract.factoringExpired ? ctBackingBean.managedBean.contractVer.ctContract.ctFactoringExpired.financialOrg.finOrgName 
  				: ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.financialOrg.finOrgName}" />

			<p:outputLabel value="#{lbl['lbl.ct.factoring.agreement.ref']}" />
			<p:inputText disabled="true" style="width:200px;"
				value="#{ctBackingBean.managedBean.contractVer.ctContract.factoringExpired ? ctBackingBean.managedBean.contractVer.ctContract.ctFactoringExpired.authRefNo : 
      			ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.authRefNo}" />

			<p:outputLabel value="#{lbl['lbl.ct.effective.date']}" />
			<h:panelGrid columns="3">
				<p:inputText disabled="true" style="width:100px;"
					value="#{ctBackingBean.managedBean.contractVer.ctContract.factoringExpired ? ctBackingBean.managedBean.contractVer.ctContract.ctFactoringExpired.effDate :
	      			ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.effDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				<p:spacer width="1" />
				<ac:iconTooltip
					value="#{lbl['lbl.ct.tooltip.factoring.effective.date']}" />
			</h:panelGrid>

			<p:outputLabel value="#{lbl['lbl.ct.expiry.date']}" />
			<h:panelGrid columns="3">
				<p:inputText disabled="true" style="width:100px;"
					value="#{ctBackingBean.managedBean.contractVer.ctContract.factoringExpired ? ctBackingBean.managedBean.contractVer.ctContract.ctFactoringExpired.expDate :
         			ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.expDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				<p:spacer width="1" />
				<ac:iconTooltip
					value="#{lbl['lbl.ct.tooltip.factoring.expiry.date']}" />
			</h:panelGrid>

			<p:outputLabel value="#{lbl['lbl.ct.approved.date']}" />
			<h:panelGrid columns="3">
				<p:inputText disabled="true" style="width:100px;"
					value="#{ctBackingBean.managedBean.contractVer.ctContract.factoringExpired ? ctBackingBean.managedBean.contractVer.ctContract.ctFactoringExpired.approvedDate :
           			ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.approvedDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				<p:spacer width="1" />
				<ac:iconTooltip
					value="#{lbl['lbl.ct.tooltip.factoring.approved.date']}" />
			</h:panelGrid>

			<p:outputLabel value="#{lbl['lbl.ct.bank.name']}" />
			<h:panelGrid columns="3">
				<p:inputText disabled="true" style="width:200px;"
					value="#{ctBackingBean.managedBean.contractVer.ctContract.factoringExpired ? ctBackingBean.managedBean.contractVer.ctContract.ctFactoringExpired.bankName :
           			ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.bankName}" />
				<p:spacer width="1" />
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.bank.name']}" />
			</h:panelGrid>

			<p:outputLabel value="#{lbl['lbl.ct.bank.account.no']}" />
			<h:panelGrid columns="3">
				<p:inputText style="width:200px;" disabled="true"
					value="#{ctBackingBean.managedBean.contractVer.ctContract.factoringExpired ? ctBackingBean.managedBean.contractVer.ctContract.ctFactoringExpired.bankAccountNo :
         			ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.bankAccountNo}" />
				<p:spacer width="1" />
				<ac:iconTooltip
					value="#{lbl['lbl.ct.tooltip.factoring.bank.account']}" />
			</h:panelGrid>

			<p:outputLabel value="#{lbl['lbl.ct.copy.factoring.agreement']}" />

			<h:panelGroup id="uploadFactoringPg">
				<h:panelGrid columns="5">
					<p:dataGrid id="copyAgreement"
						value="#{ctBackingBean.retrieveAttachmentList()}"
						var="attachAggreement" rowIndexVar="attachAggreementIndex"
						columns="1" style="width:100%"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
						<table>
							<tr>
								<td></td>
								<td><h:commandLink value="#{attachAggreement.fileName}"
										styleClass="blue_font"
										action="#{ctBackingBean.downloadFile(attachAggreement)}" /></td>
							</tr>
						</table>
					</p:dataGrid>
					<p:spacer width="1" />
					<ac:iconTooltip
						value="#{lbl['lbl.ct.tooltip.factoring.agreement']}" />
				</h:panelGrid>
			</h:panelGroup>
		</h:panelGrid>
	</p:panel>
	<!-- Bug #29446 - start -->
	<p:panel header="#{lbl['lbl.ct.panel.remarks.attachment']}" toggleable="true" 
	    rendered="#{ctBackingBean.managedBean.viewContract}">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top" style="text-align:center"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" style="float:none;text-align:center"/></td>
				<td width="50%" valign="top" style="text-align:center"><h:outputLabel value="#{lbl['lbl.txt.attachment']}" style="float:none;text-align:center"/></td>
			</tr>
			<tr>
				<td class="TableFieldLeft" width="50%" style="padding-left:6.25%;text-align:left">
					<p:dataGrid var="remark" 
					value="#{ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.remark}" rowIndexVar="index"
						columns="1"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
						<table>
							<tr>
								<td rowspan="2" valign="top">
									<h:graphicImage value="#{ctBackingBean.userImagePath(remark.createdUser.loginId)}"
										height="30" width="30" />
									</td>
								<td width="5"></td>
								<td>
									<h:outputText id="remarkCreator"
										value="#{remark.createdUser.userName}" />, 
									<h:outputText id="remarkDates" value="#{remark.changedDate}">
										<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText>
								</td>
							</tr>
							<tr>
								<td></td>
								<td>
									<!-- Bug #29446 -->
									<h:outputText value="#{remark.remark}"
									style="display: inline-block; word-break: break-word; white-space:normal"/>
									<!-- Bug #29446 -->
								</td>
							</tr>
						</table>
					</p:dataGrid>
				</td>
				<td class="TableFieldRight" width="50%" style="padding-left:6.25%">
					<p:dataGrid value="#{ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.attachment}"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" var="attachment"
						rendered="#{contractDetailsBackingBean.managedBean.selectedTabIndex != contractDetailsBackingBean.managedBean.settingIndex and
							contractDetailsBackingBean.managedBean.selectedTabIndex != contractDetailsBackingBean.managedBean.notificationIndex}"
						rowIndexVar="attachFileIndex" columns="1" style="width:100%">
						<table>
							<tr>
								<td rowspan="2" style="vertical-align: top;" align="left">
									<h:graphicImage value="/css/images/design/#{ctBackingBean.determineIcon(attachment)}"
										height="30" width="30" />
								</td>
								<td><h:outputText value="#{attachment.createdUser.userName}" />, 
									<h:outputText value="#{attachment.createdDate}">
										<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText>
								</td>
							</tr>
							<tr>
								<td>
									<h:commandLink value="#{attachment.fileName}"
										styleClass="blue_font" immediate="true"
										action="#{ctBackingBean.downloadFile(attachment)}" />
								</td>
							</tr>
						</table>
					</p:dataGrid>
				</td>
			</tr>
		</table>
	</p:panel>
	<!-- Bug #29446 - end -->
</ui:composition>
