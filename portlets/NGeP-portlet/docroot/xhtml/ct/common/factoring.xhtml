<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="factoringId" toggleable="true"  toggleSpeed="500"> 
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.factoring']}"/>
			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.dtls']}"/>
	   	</f:facet>
         <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidthFact220" >  
            
               <p:outputLabel  value="#{lbl['lbl.ct.factoring.company']}"/>  
               <p:inputText disabled="true" style="width:620px;" 
                  value="#{ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.financialOrg.finOrgName}"  />  
                  
          </h:panelGrid>
        <h:panelGrid columns="4" style="width:100%" columnClasses="columnWidthFact220" >  
                  <p:outputLabel value="#{lbl['lbl.ct.factoring.agreement.ref']}"/>  
              <p:inputText  disabled="true" style="width:200px;"
                 value="#{ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.authRefNo}" />  
       
      		 
      		 <p:outputLabel  value="#{lbl['lbl.ct.effective.date']}"  /> 
      		 <h:panelGrid columns="3">
             	<p:inputText disabled="true" style="width:100px;" 
                	value="#{ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.effDate}">
               		<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
             	</p:inputText>  
             	<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.effective.date']}" />
			 </h:panelGrid>
             
      		 <p:outputLabel  value="#{lbl['lbl.ct.expiry.date']}" />
      		 <h:panelGrid columns="3">
             	<p:inputText disabled="true" style="width:100px;"
                 	value="#{ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.expDate}">
                 	<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
              	</p:inputText>
             	<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.expiry.date']}" />
			 </h:panelGrid>
               
     		  <p:outputLabel  value="#{lbl['lbl.ct.approved.date']}" />
              <h:panelGrid columns="3">
              	<p:inputText  disabled="true" style="width:100px;" 
                   	value="#{ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.approvedDate}" >
                	<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
              	</p:inputText>
              	<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.approved.date']}" />
			  </h:panelGrid>
			  </h:panelGrid>
              
             <h:panelGrid columns="2" style="width:100%" columnClasses="columnWidthFact220" >  
      
   			  <p:outputLabel  value="#{lbl['lbl.ct.bank.name']}"  />
              <h:panelGrid columns="3">
              	<p:inputText   disabled="true" style="width:200px;"
                    value="#{ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.bankName}" />
				<p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.bank.name']}" />
			  </h:panelGrid>
              
              <p:outputLabel  value="#{lbl['lbl.ct.bank.account.no']}"  /> 
              <h:panelGrid columns="3">
                 <p:inputText  style="width:200px;"
                    disabled="true" value="#{ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.bankAccountNo}" />
                 <p:spacer width="1"/>
			    <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.factoring.bank.account']}" />
			  </h:panelGrid> 
                 
                 <p:outputLabel  value="#{lbl['lbl.ct.copy.factoring.agreement']}"  />  
                    <h:commandLink value="#{ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.fileName}"  
                    	style="float:left;" styleClass="blue_font" 
	                    action="#{ctBackingBean.downloadFile(ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.filePath, 
	                       ctBackingBean.managedBean.contractVer.ctContract.ctFactoring.fileName)}" />			
             </h:panelGrid>
        </p:panel>
</ui:composition>
