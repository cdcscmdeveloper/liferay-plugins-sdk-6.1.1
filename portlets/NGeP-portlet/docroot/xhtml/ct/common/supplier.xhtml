<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
   <p:panel id="sbd" toggleable="true"  toggleSpeed="500">
        <f:facet name="header">
			<h:outputText id="sbdPanelHeader" value="#{lbl['lbl.ct.panel.supplier']}" />
	        <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.supplier.dtls']}" />
	  	</f:facet>
        <h:panelGrid style="width:100%;" styleClass="top-aligned-columns">
           <h:panelGroup style="width:100%;" >
                   <table style="width: 100%">
				          <tr>
					             <td class="columnWidth150">
                                      <p:outputLabel value="#{lbl['lbl.ct.business.reg.no']}"/>  
                                </td>
                                <td>
                                   <h:panelGrid columns="3" style="width:330px;" >   
                                          <h:panelGrid columns="2">
	                                          <p:inputText id="supplierRegNo" disabled="true" style="width:85px;" 
	                                              value="#{ctBackingBean.managedBean.supplierRegNo}" />
	                                            <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.business.reg.no']}" />
					                      </h:panelGrid>
                                      
                                         <p:outputLabel value="#{lbl['lbl.ct.mof.no']}" />
                                         <h:panelGrid columns="2"> 
	                                        <p:inputText id="supplierMofNo" disabled="true" style="width:85px;" 
	             	                            value="#{ctBackingBean.managedBean.supplierMofNo}" />
	             	                         <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.mof.no']}" />
					                     </h:panelGrid>
                                  </h:panelGrid>
                             </td>
                             <td class="columnWidth150">
                                <p:outputLabel value="#{lbl['lbl.ct.supplier.gst.reg']}"/> 
                             </td>
                             <td> 
                                 <p:inputText disabled="true" style="width:170px;margin-bottom: 5px;"  
                                     value="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstRegNo == null ? lbl['lbl.txt.na'] : ctBackingBean.managedBean.contractVer.ctContractValue.gstRegNo}" />
                             </td>
                        </tr>
                        
                         <h:panelGroup  rendered="#{!ctBackingBean.managedBean.viewContract 
                                           and ctBackingBean.managedBean.updateCompanyName}">
                                <tr>
                              <td></td>
                                      <td>
                                            <h:panelGrid columns="4">
                                            <p:selectBooleanCheckbox disabled="#{ctBackingBean.isApprover()}"
			                                       value="#{ctBackingBean.managedBean.contractVer.ctContractValue.companyNameChange}">
				                                   <p:ajax event="change" 
				                                        listener="#{ctBackingBean.retrieveCompanyName}" update="supplierCompanyName, supplierBranchName, supplierRegNo, supplierMofNo" />
				                            </p:selectBooleanCheckbox>
			                               <p:spacer width="2" />	
			                               <p:outputLabel value="#{lbl['lbl.ct.update.name']}" style="width:210px;text-align:left;"/>
			                               <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.update.business.name']}" />
		                                  </h:panelGrid>
                                     </td>
                                      
                                      <td width="100">
                                              <p:outputLabel value="#{lbl['lbl.ct.supplier.gst.eff.date']}" />
                                      </td>
                                      <td>
                                        <p:inputText disabled="true" style="width:100px;margin-bottom: 5px;"  
                                             value="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstEffDate}"
                                             rendered="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstEffDate != null}">
                                             <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
                                        </p:inputText>
                                       <p:inputText disabled="true" style="width:100px;margin-bottom: 5px;"  value="#{lbl['lbl.ct.value.na']}" 
                                              rendered="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstEffDate == null}"/> 
                                       </td>
                                       </tr>
                                   </h:panelGroup>
                  
                      
                             <tr>
                             <td>
                                <p:outputLabel value="#{lbl['lbl.ct.business.name']}" />
                             </td>
                             <td>
                               <p:inputText disabled="true" style="width:265px;" id="supplierCompanyName"
	             	                value="#{ctBackingBean.managedBean.supplierCompanyName}" />
                             </td>
                 <h:panelGroup  rendered="#{!ctBackingBean.managedBean.updateCompanyName}">
                  <td width="100">
                      <p:outputLabel value="#{lbl['lbl.ct.supplier.gst.eff.date']}" />
                  </td>
                  <td>
                      <p:inputText disabled="true" style="width:100px;margin-bottom: 5px;"  
                         value="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstEffDate}"
                         rendered="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstEffDate != null}">
                           <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
                         </p:inputText>
                          <p:inputText disabled="true" style="width:100px;margin-bottom: 5px;"  value="#{lbl['lbl.ct.value.na']}" 
                          rendered="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstEffDate == null}"/> 
                  </td>
                  </h:panelGroup>
                   <h:panelGroup  rendered="#{ctBackingBean.managedBean.updateCompanyName}">
                     <td width="100">
                     <p:outputLabel  value="#{lbl['lbl.ct.supplier.ep.date']}"/>  
                 </td>
                 <td>
                   <p:inputText disabled="true" style="width:100px;margin-bottom: 5px;"  
                       value="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstDeclaredDate}"
                       rendered="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstDeclaredDate != null}" > 
                       <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
                       </p:inputText> 
                        <p:inputText disabled="true" style="width:100px;margin-bottom: 5px;"  value="#{lbl['lbl.txt.na']}" 
                          rendered="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstDeclaredDate == null}"/> 
                       
                       </td>
                   </h:panelGroup>
                  </tr>
                  
                  <tr>
                     <td>
                        <p:outputLabel value="#{lbl['lbl.ct.branch.name']}" />
                    </td>
                    <td>
                <h:panelGrid columns="6">
	                <p:inputText id="supplierBranchName" disabled="true" style="width:265px;" 
	                   value="#{ctBackingBean.managedBean.supplierBranchName}" />
	           	  	<p:spacer width="1"/>
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.supplier.branch']}" />
					<p:spacer width="5"/>
					<h:commandLink for="branchInfo" styleClass="blue_font" style="width:80px;"
						rendered="#{ctBackingBean.managedBean.branchInfoFilePath != null}"
						title="#{lbl['lbl.ct.branch.info']}"
						value="#{lbl['lbl.ct.branch.info']}"
						action="#{ctBackingBean.downloadFile(ctBackingBean.managedBean.branchInfoFilePath)}" />
               		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.branch.info']}" rendered="#{ctBackingBean.managedBean.branchInfoFilePath != null}"/>
				</h:panelGrid>
				</td>
				<h:panelGroup  rendered="#{!ctBackingBean.managedBean.updateCompanyName}">
				<td width="100">
                     <p:outputLabel  value="#{lbl['lbl.ct.supplier.ep.date']}"/>  
                 </td>
                 <td>
                   <p:inputText disabled="true" style="width:100px;margin-bottom: 5px;"  
                       value="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstDeclaredDate}"
                       rendered="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstDeclaredDate != null}" > 
                       <f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
                       </p:inputText> 
                        <p:inputText disabled="true" style="width:100px;margin-bottom: 5px;"  value="#{lbl['lbl.txt.na']}" 
                          rendered="#{ctBackingBean.managedBean.contractVer.ctContractValue.gstDeclaredDate == null}"/> 
                       
                       </td>
                       </h:panelGroup>
                       <h:panelGroup  rendered="#{ctBackingBean.managedBean.updateCompanyName}">
                     <td></td>
                      <td></td>
                       </h:panelGroup>
                 </tr>
                 <h:panelGroup  rendered="#{!ctBackingBean.managedBean.viewContract 
                                           and ctBackingBean.managedBean.updateSupplierAddress}">
                 <tr>
                 <td></td>
                 <td>
                  <h:panelGrid columns="4">
                        <p:selectBooleanCheckbox disabled="#{ctBackingBean.isApprover()}"
			                   value="#{ctBackingBean.managedBean.contractVer.ctContractValue.addressChange}" >
			                          <p:ajax event="change" listener="#{ctBackingBean.retrieveSupplierAddress}" update="supplierAddress" />
			                 </p:selectBooleanCheckbox>
			                               <p:spacer width="2" />	
			                               <p:outputLabel value="#{lbl['lbl.ct.update.address']}" style="width:100px;text-align:left;"/>
			                               <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.update.supplier.address']}" />
			                               </h:panelGrid></td></tr></h:panelGroup>
                 <tr>
                 <td>
                <h:panelGroup>
                   <div style="height: 40px; vertical-align:top;">
                         <p:outputLabel for="supplierAddress" value="#{lbl['lbl.ct.address']}" />
                   </div>
                </h:panelGroup>
                </td>
                <td>
                    <p:inputTextarea id="supplierAddress" disabled="true" rows="5"   maxlength="200"   autoResize="false"
                        value="#{ctBackingBean.managedBean.supplierAddress}"  style="width:265px; margin-bottom: 5px;" />
                   </td>
                 </tr>
                 <tr>
                 <td>
                    <p:outputLabel value="#{lbl['lbl.ct.contact.person']}"/>  </td>
                <td>  <p:inputText disabled="true" style="width:265px;margin-bottom: 5px;" 
                      value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierAddress.contactPerson}" />
                </td>
                 </tr>
                  <tr>
                      <td>
                       <p:outputLabel  value="#{lbl['lbl.ct.tel']}"/>  
                      </td>
                      <td style="width:383px;">
                          <table>
                                 <tr>
                                    <td>
                                           <p:inputText  value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierAddress.phoneNoFull}"  
                                             disabled="true" style="width:97px;" />
                             </td> <td><p:spacer width="4"></p:spacer>
                               
                               <p:outputLabel  value="#{lbl['lbl.ct.fax']}"/>
                </td>
                 <td>
                <p:inputText  disabled="true" style="width:97px;"  
                   value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierAddress.faxNoFull}"/>  
                 </td>
                 </tr>
                 
                 
                         </table>
                      </td>
                     </tr>
                     <tr>
                       <td>
                 <p:outputLabel  value="#{lbl['lbl.ct.email']}"/>  
                 </td>
                 <td>
                 <p:inputText disabled="true" style="width:265px;" 
                       value="#{ctBackingBean.managedBean.contractVer.ctContractValue.supplierAddress.contactEmail}"/>
                       </td>
                       </tr>
                       </table>
                       </h:panelGroup>
              </h:panelGrid>
              
       </p:panel>
      
       <p:panel id="BankInfoPanel" header="#{lbl['lbl.ct.panel.bank.info']}"  toggleable="true"  
            toggleSpeed="500" rendered="#{!ctBackingBean.managedBean.contractVer.ctContract.factored}">
              <h:panelGrid style="width:100%;" styleClass="top-aligned-columns">
                    <h:panelGroup style="width:100%;" >
                         <table style="width: 100%">
				              <tr>
					             <td class="columnWidth150">
                                      <p:outputLabel  value="#{lbl['lbl.ct.bank.name']}"/> 
                                 </td>
                                 <td> 
                                      <p:inputText disabled="true" style="width:265px;" 
                                           value="#{ctBackingBean.managedBean.contractVer.ctContractValue.bankName}"/>
                                  </td>
                                  <td>
                                         <p:outputLabel  value="#{lbl['lbl.ct.account.no']}" />  
                                  </td>
                                  <td>
                                          <p:inputText  disabled="true" style="width:170px;"
                                             value="#{ctBackingBean.managedBean.contractVer.ctContractValue.bankAccountNo}"/> 
                                   </td>
                               </tr>
                               <tr>
                                        <h:panelGroup>
                                        <td>
                                           <div style="height: 60px; vertical-align: top;">
                                               <p:outputLabel for="bankAddress" value="#{lbl['lbl.ct.bank.address']}" />
                                           </div>
                                         </td>
                          </h:panelGroup>
                          <td>
	                      <h:panelGrid>
                                <p:inputTextarea id="bankAddress" disabled="true" rows="5"  autoResize="false" style="width:265px; margin-bottom: 5px;"
                                 value="#{ctBackingBean.getFullAddress(ctBackingBean.managedBean.contractVer.ctContractValue.bankAddress)}" />
	                      </h:panelGrid>
	                       </td>
	                       <td>
	                     <p:outputLabel  value="#{lbl['lbl.ct.bank.branch']}"/>
	                     </td>
	                     <td>  
	                     <p:inputTextarea id="bankBranch" disabled="true" rows="3"  style="width:170px; margin-bottom: 5px;"
	                            autoResize="false" value="#{ctBackingBean.managedBean.contractVer.ctContractValue.bankBranch}" />
                         </td>
                         </tr>
                         </table>
                       </h:panelGroup>
                 </h:panelGrid>
          </p:panel>
</ui:composition>
