<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
		<p:panel id="fd2" toggleable="true" toggleSpeed="500" rendered="#{ctBackingBean.managedBean.ctContractAmount.agreement}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.agreement.detail']}" />
			<ac:iconTooltip value="#{lbl['lbl.ct.agreement.detail']}" />
		</f:facet>
				<p:dataTable id="contractAgreementTableID" lazy="false"
					value="#{ctBackingBean.filterAgreementList()}"
					var="agreement" width="100%" rows="10" rowIndexVar="index">

					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.ct.agreement.no']}" />
						</f:facet>
						<h:outputText value="#{index + 1}"/>
				</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.ct.agreement.file.refno']}" />
						</f:facet>
				<h:outputText value="#{ctBackingBean.getAgreementLoaPhysicalNo(agreement)}" />
				</p:column>
				<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.ct.agreement.signed.date']}" />
						</f:facet>
						<h:outputText value="#{agreement.signedDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
						
				</p:column>
				<p:column>
						<f:facet name="header">
						<h:outputText value="#{lbl['lbl.ct.agreement.attachment.doc']}" />
						</f:facet>
						<h:outputText value="#{lbl['lbl.ct.agremeent.doc']} : " />
						<h:commandLink styleClass="blue_font"
							title="#{agreement.fileName}"
							value="#{agreement.fileName}"
							action="#{ctBackingBean.commonDownload(agreement.filePath, agreement.fileName)}" /><br />
						<h:outputText value="#{lbl['lbl.ct.agreement.front.page.attachment']} : " />
						<f:metadata>
     					 <ui:param name="agreementContents" value="#{ctBackingBean.getCoverPage(agreement)}" />
    					</f:metadata>
						<h:commandLink styleClass="blue_font"
							title="#{agreementContents.getFileName()}"
							value="#{agreementContents.getTitle()}"
							action="#{ctBackingBean.commonDownload(agreementContents.getFilePath(),agreementContents.getFileName())}" /><br />
						<h:outputText value="#{lbl['lbl.ct.agreement.signing.page.attachment']} : " />		
						<h:commandLink styleClass="blue_font"
							title="#{agreement.signedPageName}"
							value="#{agreement.signedPageName}"
							action="#{ctBackingBean.commonDownload(agreement.signedPagePath, agreement.signedPageName)}" /><br />		
						<h:outputText value="#{lbl['lbl.ct.agreement.stamping.page.attachment']} : " />
						<h:commandLink styleClass="blue_font"
							title="#{agreement.stampedPageName}"
							value="#{agreement.stampedPageName}"
							action="#{ctBackingBean.commonDownload(agreement.stampedPagePath, agreement.stampedPageName)}" />	
				</p:column>
				</p:dataTable>
				</p:panel>
				</ui:composition>
