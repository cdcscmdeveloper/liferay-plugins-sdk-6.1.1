<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<h:panelGroup id="purchaseInDefaultPanel">
	      <p:panel rendered="#{ctBackingBean.managedBean.contractVer.ctContractValue.pid}"
	            id="purchaseInDefault"  header="#{lbl['lbl.ct.pid.panel.name']}" toggleable="true" toggleSpeed="500" >
	     
	             <p:dataTable id="purchaseInDefaultTable" var="pidObj" widgetVar="PidReasonObj"
	                     value="#{ctBackingBean.managedBean.contractVer.ctPidReasons}" 
	                     rowKey="#{pidObj}" selection="#{ctBackingBean.managedBean.selectedPidReason}">
				       <ac:paginator for="purchaseInDefaultTable" />
				       <p:column selectionMode="multiple"
				             style="width:5%;text-align:center" rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.disableAmendDetails
				             and !ctBackingBean.managedBean.contractVer.panel}">
				        </p:column>
				        <p:column style="width:50%;" 
				            headerText="#{lbl['lbl.ct.pid.reason']}" id="updateColumn"  styleClass="column-align-center">
		                        <p:selectOneMenu value="#{pidObj.pmReason.reasonId}" 
		                          disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.disableAmendDetails
		                           or ctBackingBean.managedBean.contractVer.panel}"  style="width:360px;float:left;text-align:left;">
			                          <f:selectItems value="#{ctBackingBean.getDropdownPidCodeValues(pidObj.pmReason.reasonId)}" />
			                          <p:ajax event="change" partialSubmit="true" update="purchaseInDefaultTable"></p:ajax>
			                    </p:selectOneMenu>
			          </p:column> 
		              <p:column  headerText="#{lbl['lbl.ct.pid.reason.desc']}" id="updatePidPurchase"  styleClass="column-align-center" style="width:45%;">
		                      <p:inputText  value="#{pidObj.reasonDesc}" maxlength="255"
		                           style="width:350px;float:left;text-align:left;"  disabled="#{ctBackingBean.managedBean.viewContract
		                           	or ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.contractVer.panel}" 
		                           rendered="#{ctBackingBean.PidPurchaseTypeOther(pidObj.pmReason.reasonId)}"></p:inputText>  
		               </p:column>  
				 </p:dataTable>
	             <div class="ppRightBtn"> 
			         <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form"
				          partialSubmit="true" action="#{ctBackingBean.addPurchaseInDefault()}" update="purchaseInDefaultTable" 
				         oncomplete="PidReasonObj.paginator.endLink.click();" rendered="#{!ctBackingBean.managedBean.viewContract
				         	and !ctBackingBean.managedBean.disableAmendDetails and !ctBackingBean.managedBean.contractVer.panel}"/>	
				     <p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this"  partialSubmit="true"
			             onsuccess="delPidPurchaseDlg.show()" rendered="#{!ctBackingBean.managedBean.viewContract
			             	and !ctBackingBean.managedBean.disableAmendDetails and !ctBackingBean.managedBean.contractVer.panel}"/>			
		        </div>
		        <p:dialog id="delPidPurchaseDlg"   styleClass="screen-title" 
		             widgetVar="delPidPurchaseDlg"  modal="true" width="330">  
                     <h:panelGrid columns="3">
                           <p:graphicImage value="/css/images/design/exclamation.png" styleClass="ui-icon-complain"/>
			               <p:spacer width="10"/>
                           <div class="confirmation-message-box">#{lbl['lbl.ct.dialog.confirm.message']}</div>
                     </h:panelGrid>
                     <div class="ppRightBtn">
		                <p:commandButton value="#{lbl['lbl.btn.yes']}"  update="@([id$=purchaseInDefaultTable])"
		                    process="@all" actionListener="#{ctBackingBean.deletePidPurchase()}" onclick="delPidPurchaseDlg.hide();"/>
			            <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delPidPurchaseDlg.hide();" type="button" />
		            </div>
               </p:dialog>  		
	      </p:panel>
	     </h:panelGroup>
</ui:composition>
