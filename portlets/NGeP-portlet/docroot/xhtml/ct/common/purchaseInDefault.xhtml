<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<h:panelGroup id="purchaseInDefaultPanel">
	      <p:panel rendered="#{ctBackingBean.managedBean.contractVer.ctContractValue.pid}"
	            id="purchaseInDefault"  header="#{lbl['lbl.ct.pid.panel.name']}" toggleable="true" toggleSpeed="500" >
	     
	             <p:dataTable id="purchaseInDefaultTable" var="pidObj" widgetVar="purchaseInDefaultWidget"
	                     value="#{ctBackingBean.managedBean.contractVer.ctPidReasons}">
				                <ac:paginator for="purchaseInDefaultTable" />
				                 <p:column style="width:2%;" rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.disableAmendDetails
				                                    and !ctBackingBean.managedBean.contractVer.panel}">
		                                   <f:facet name="header">
							                    <p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.selectAll}">
								                    <p:ajax partialSubmit="true" process="@this"
									                      update=":form:purchaseInDefaultTable,:form:deleteCtPidBtn" listener="#{ctBackingBean.selectAllPidDtl}" />
							                 </p:selectBooleanCheckbox>
						                 </f:facet>
		           
		                                <p:selectBooleanCheckbox disabled="#{ctBackingBean.managedBean.disableAmendDetails}"
		                                       value="#{pidObj.selectedCheckBox}" styleClass="myCustomChekBox">
		           		                            <p:ajax event="change" 
		           		                                 update=":form:purchaseInDefaultTable,:form:deleteCtPidBtn" listener="#{ctBackingBean.selectOnePidCheckboxSelect}"></p:ajax>
			                           </p:selectBooleanCheckbox>
		                           </p:column>
				                
                                  <p:column style="width:45%;white-space:normal;" 
				                            headerText="#{lbl['lbl.ct.pid.reason']}" id="updateColumn"  styleClass="column-align-center">
		                                    <p:selectOneMenu value="#{pidObj.pmReason.reasonId}"  rendered="#{!ctBackingBean.managedBean.viewContract}"
		                                        disabled="#{ctBackingBean.managedBean.disableAmendDetails
		                                        or ctBackingBean.managedBean.contractVer.panel}"  style="width:360px;float:left;text-align:left;">
			                                        <f:selectItems value="#{ctBackingBean.getDropdownPidCodeValues()}" />
			                                       <p:ajax event="change" partialSubmit="true" update="purchaseInDefaultTable"
			                                           process="@this" listener="#{ctBackingBean.validatePidReason(pidObj.pmReason.reasonId)}"></p:ajax>
			                              </p:selectOneMenu>
			                              
			                              <h:outputText value="#{ctBackingBean.getReasonDesc(pidObj.pmReason)}"  
			                                   rendered="#{ctBackingBean.managedBean.viewContract}" style="float:left;text-align:left;"/>
			                      </p:column> 
		             
		                          <p:column  headerText="#{lbl['lbl.ct.pid.reason.desc']}" 
		                                 id="updatePidPurchase"  styleClass="column-align-center" style="width:50%;white-space:normal;">
		                                     <p:inputText  value="#{pidObj.reasonDesc}" maxlength="255"
		                                            style="width:450px;float:left;text-align:left;" 
		                                            disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.contractVer.panel}" 
		                                            rendered="#{ctBackingBean.PidPurchaseTypeOther(pidObj.pmReason.reasonId) and !ctBackingBean.managedBean.viewContract}">
		                                    </p:inputText>  
		                                    
		                                      <h:outputText value="#{pidObj.reasonDesc}"  
			                                   rendered="#{ctBackingBean.managedBean.viewContract}" style="float:left;text-align:left;"/>
		                         </p:column>  
				   </p:dataTable>
	             
	             <div class="ppRightBtn"> 
			         <p:commandButton value="#{lbl['lbl.btn.add']}" process="@form"
				          partialSubmit="true" action="#{ctBackingBean.addPurchaseInDefault()}" update="purchaseInDefaultTable" 
				         oncomplete="purchaseInDefaultWidget.paginator.endLink.click();" rendered="#{!ctBackingBean.managedBean.viewContract
				         	and !ctBackingBean.managedBean.disableAmendDetails and !ctBackingBean.managedBean.contractVer.panel}"/>	
				     <p:commandButton id="deleteCtPidBtn" value="#{lbl['lbl.ct.delete']}" process="@this"  partialSubmit="true"
				          disabled="#{ctBackingBean.managedBean.buttonHideActive}"
			             onsuccess="delPidPurchaseDlg.show()" rendered="#{!ctBackingBean.managedBean.viewContract
			             	and !ctBackingBean.managedBean.disableAmendDetails and !ctBackingBean.managedBean.contractVer.panel}"/>			
		        </div>
		         
		         <p:confirmDialog id="delPidPurchaseDlg" widgetVar="delPidPurchaseDlg" 
	   	                       message="#{lbl['lbl.msg.confirm.delete']}" 	severity="alert"  closable="true"
			                   appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                               <div class="ppRightBtn">
		                           <p:commandButton value="#{lbl['lbl.btn.yes']}"  update=":form:purchaseInDefaultTable,:form:deleteCtPidBtn"
		                                process="@this" partialSubmit="true" actionListener="#{ctBackingBean.deletePidPurchase()}" oncomplete="delPidPurchaseDlg.hide();"/>
			                       <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delPidPurchaseDlg.hide();" type="button" />
		                      </div>
              </p:confirmDialog>	
	      </p:panel>
     </h:panelGroup>
</ui:composition>
