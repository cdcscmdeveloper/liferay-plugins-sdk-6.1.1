<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    
	 <p:panel id="agencyId" toggleable="true" toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.agency']}" />
			<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.dtls']}" />
		</f:facet>
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.ct.instruction.add.agency']}" escape="false" />
		<br />
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.ct.instruction.delete.agency']}" escape="false" />
		<br />
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.ct.instruction.select.agency']}" escape="false" />
		<br />
		<br />		
		<p:dataTable id="tableAgencyDetails" var="agencyData"
			widgetVar="tableAgencyWidget"
			editable="true" 
			editMode="cell"
			value="#{ctBackingBean.managedBean.contractVer.ctAgencies}"
			selectionMode="single" rowKey="#{agencyData}"
			selection="#{ctBackingBean.managedBean.selectedAgency}"
			rowIndexVar="indexVar"
			rowStyleClass="#{agencyData.chkStatusPmOrgValidity == false ? 'ui-helper-hidden' : ''}" >
			<ac:paginator for="tableAgencyDetails" />
			<p:ajax event="rowSelect" onstart="blockWidget.show();"
				oncomplete="blockWidget.hide();"
				update="@([id$=agencyDeliveryAddress],[id$=delBtn])" />

			<p:column style="width:5px;"
				rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}">

				<f:facet name="header">
					<p:selectBooleanCheckbox
						value="#{ctBackingBean.managedBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this"
							update="@([id$=tableAgencyDetails],[id$=delBtn])"
							listener="#{ctBackingBean.selectAllAgencyCheckbox}" />
					</p:selectBooleanCheckbox>
				</f:facet>

				<p:selectBooleanCheckbox value="#{agencyData.selectedCheckBox}"
					disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"><!-- Enhancement 15851 - shaqimi -->
					<p:ajax event="change"
						update=":form:tableAgencyDetails,:form:delBtn"
						listener="#{ctBackingBean.selectOneAgencyCheckboxSelect}"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"></p:ajax>
				</p:selectBooleanCheckbox>
			</p:column>

			<!-- <p:column style="width:20%;white-space:normal;">
				<f:facet name="header" styleClass="column-align-center">
					<h:outputText value="#{lbl['lbl.ct.agency.comitment.no']}" />
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.commitment.no']}" />
				</f:facet>
				<h:outputText value="#{agencyData.commitmentNo}"
					style="float:left;text-align:left;"></h:outputText>
			</p:column> --> 

			<p:column headerText="#{lbl['lbl.ct.ministry']}"
				filterBy="#{agencyData.ministryName}" filterMatchMode="contains"
				styleClass="column-align-center"
				style="width:20%;white-space:normal;">
				<h:outputText value="#{agencyData.ministryName}"
					style="float:left;text-align:left;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.ct.jabatan']}"
				filterBy="#{agencyData.kumpulanPtjName}" filterMatchMode="contains"
				style="width:20%;white-space:normal;"
				styleClass="column-align-center">
				<h:outputText value="#{agencyData.kumpulanPtjName}"
					style="float:left;text-align:left;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.ct.ptj']}"
				filterBy="#{agencyData.orgProfile.orgName}"
				filterMatchMode="contains" style="width:20%;white-space:normal;"
				styleClass="column-align-center">
				<h:outputText  value="#{agencyData.orgProfile.orgCode}" style="float:left;text-align:left;"/><br />
				<h:outputText value="#{agencyData.orgProfile.orgName}" style="float:left;text-align:left;" />
			</p:column>
			<!-- Start Fixing - #28827 -->
			 <p:column style="width:10%;white-space:normal;">
			 <f:facet name="header" styleClass="column-align-center">
					<h:outputText value="#{lbl['lbl.ct.ceiling.amount']}" />
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ceiling.amt']}" />
					
			 </f:facet>			   
               <p:cellEditor>                            
                    <f:facet name="input">
                    <p:inputText id="modelInput" value="#{agencyData.ceilingAmount}" style="width:80px" maxlength="23" label="#{lbl['lbl.ct.ceiling.amount']}"			
				     disabled="#{ctBackingBean.managedBean.disableAmendDetails
           		        or (ctBackingBean.managedBean.contractVer.ctAgencies ne null and ctBackingBean.managedBean.contractVer.ctAgencies.size() eq 1)
           		        or ctBackingBean.managedBean.viewSCL}" 
					 styleClass="ppRightBtn"
					 rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}" > <!-- Enhancement 15851 - shaqimi -->
					  <p:ajax event="change" update=":form:tableAgencyDetails,:form:messages" listener="#{ctBackingBean.validateCeilingAmount(agencyData)}" />
					 </p:inputText>			 
					 </f:facet>					
					 <f:facet name="output"><h:outputText value="#{agencyData.ceilingAmount}" style="float:right;text-align:right;">
                     <f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />															  
					   </h:outputText></f:facet>					  	
               </p:cellEditor> 
                    <ui:fragment  rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting and !ctBackingBean.managedBean.viewSCL}"><!-- Enhancement 15851 - shaqimi -->
                         <div style="text-align:center;">
                          <h:graphicImage value="/css/images/design/icon-edit.png" />  <!--Fix #31740 -->           
                         </div>
                    </ui:fragment>							 					  
                <!-- End Fixing  #28827 -->
           </p:column> 
           
			<p:column rowspan="2" style="width:8%;"
				styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.ct.effective.date']}"
						styleClass="required" />
				</f:facet>
				     
		           <p:cellEditor>
                       <f:facet name="input">
				            <p:calendar id="agencyDateActive" value="#{agencyData.effDate}"
					           navigator="true" size="6" readonlyInput="true"
					           mindate="#{(ctBackingBean.managedBean.contractVer.ctContractValue.effDate gt DateUtils.getCurrentDateWithoutTime()) ? ctBackingBean.managedBean.contractVer.ctContractValue.effDate : DateUtils.getCurrentDateWithoutTime()}"
					           maxdate="#{agencyData.expDate}"
					           rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}"
				               showOn="button"
					           disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"
					           pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"><!-- Enhancement 15851 - shaqimi -->
					           <p:ajax event="dateSelect" update="agenyStatus"
						       listener="#{ctBackingBean.checkAgencyStatus(agencyData)}" />
				            </p:calendar>
				        </f:facet>
				     <f:facet name="output">				    
				     <h:outputText value="#{agencyData.effDate}">				  					
					          <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					           </h:outputText>				             
			        </f:facet>
				   </p:cellEditor>
			</p:column>

			<p:column headerText="#{lbl['lbl.ct.expiry.date']}" style="width:8%;"
				styleClass="column-align-center">
				<h:outputText value="#{agencyData.expDate}">
				<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.ct.ap178']}"
				style="text-align:center; white-space:normal;"
				styleClass="column-align-center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.ct.ap178']}" />
					<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap178']}" />
				</f:facet>
				<p:selectBooleanCheckbox value="#{agencyData.ap178}"
					style="float:center;" disabled="true" />
			</p:column>

			<p:column headerText="#{lbl['lbl.ct.status']}"
				style="width:6%;white-space:normal;"
				styleClass="column-align-center">
				<h:outputText id="agenyStatus"
					value="#{agencyData.chkStatus ? lbl['lbl.ct.active']:lbl['lbl.ct.inactive']}"
					style="float:none" />
			</p:column>
			
			  <!-- <p:column headerText="#{lbl['lbl.ct.status.org.validity']}"
				style="width:6%;white-space:normal;"
				styleClass="column-align-center">
				<h:outputText id="agencyPmOrgValidityStatus"
					value="#{agencyData.chkStatusPmOrgValidity ? lbl['lbl.ct.active']:lbl['lbl.ct.inactive']}"
					style="float:none" />
			</p:column> -->
					
		</p:dataTable>
	

		<div class="ppRightBtn">
			<p:commandButton id="addBtn" value="#{lbl['lbl.btn.add']}"
				oncomplete="dlgAgency.show();" partialSubmit="true" process="@this"
				action="#{ctBackingBean.resetAgencyDetails}"
				disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"
				update=":form:agencyies"
				rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}"><!-- Enhancement 15851 - shaqimi -->
				<p:tooltip for="addBtn">
					<h:outputText value="#{lbl['lbl.ct.tooltip.add.agency']}"
						escape="false" />
				</p:tooltip>
			</p:commandButton>
			<p:commandButton id="delBtn" value="#{lbl['lbl.ct.delete']}"
				process="@this" onsuccess="dlgAgenyDel.show()" partialSubmit="true"
				disabled="#{ctBackingBean.managedBean.buttonHideActive or ctBackingBean.managedBean.disableAmendDetails
					or ctBackingBean.managedBean.viewSCL}"
				rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}"><!-- Enhancement 15851 - shaqimi -->
				<p:tooltip for="delBtn">
					<h:outputText value="#{lbl['lbl.ct.tooltip.delete.agency']}"
						escape="false" />
				</p:tooltip>
			</p:commandButton>
		</div>
		<br />
		<br />
		
		<h:panelGroup id="panelCtSharingAttach">
			<p:outputPanel id="uploadSharingDoc" >
				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.ct.instruction.add.agency.doc']}" escape="false"
					rendered="#{!ctBackingBean.managedBean.disableAgent}" />
				<br />
				<br />							
				<table style="width: 100%">
					<tr>
						<td class="TableFieldLeft" width="15%">
							<p:outputLabel value="#{lbl['lbl.ct.agency.ap178.refno']}" rendered="#{!ctBackingBean.managedBean.disableAgent}" />
							
						</td>
						<td class="TableFieldRight">
							<p:inputText id="uploadRefNoDoc"
								style="width:80%;"
								value="#{ctBackingBean.managedBean.contractVer.ctContractValue.ap178RefNo}"
								rendered="#{!ctBackingBean.managedBean.disableAgent}"
								disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.notificationSetting
									or ctBackingBean.managedBean.viewSCL}"><!-- Enhancement 15851 - shaqimi -->
								<p:ajax process="@this" />
							</p:inputText>
							<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.sharing.agency.file.reference']}" rendered="#{!ctBackingBean.managedBean.disableAgent}"/>
						</td>
					</tr>
				</table>
				
				
				<p:dataTable id="lampiranCtSharing" lazy="true"
					value="#{ctBackingBean.managedBean.contractVer.agencyContractSharingAttachements}"
					var="attachFile" width="40%" rows="10" rowIndexVar="index" rendered="#{!ctBackingBean.managedBean.disableAgent}">

					<p:column width="50%">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.ct.agency.ap178.description']}" rendered="#{!ctBackingBean.managedBean.disableAgent}"/>
						</f:facet>
						<p:inputText id="uploadCtSharingDesc"
									style="width:98%;" value="#{attachFile.fileDescription}"
									rendered="#{!ctBackingBean.managedBean.disableAgent}"
									disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewContract  or ctBackingBean.managedBean.notificationSetting
										or ctBackingBean.managedBean.viewSCL}" /><!-- Enhancement 15851 - shaqimi -->
					</p:column>
					<p:column width="50%">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.ct.agency.ap178.attachment']}" rendered="#{!ctBackingBean.managedBean.disableAgent}"/>
						</f:facet>
						<h:graphicImage
							value="/css/images/design/#{ctBackingBean.determineIcon(attachFile)}"
							height="30" width="30" />
						<h:commandLink value="#{attachFile.fileName}"
							rendered="#{!ctBackingBean.managedBean.disableAgent}"
							styleClass="blue_font"
							action="#{ctBackingBean.downloadFile(attachFile)}" />
						<p:commandLink onsuccess="delCtSharingAttachDlg.show();"
							action="#{ctBackingBean.setAttachFileIndex(index)}"
							disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.disableAmendDetails 
								or ctBackingBean.managedBean.notificationSetting or ctBackingBean.managedBean.viewSCL}"
							rendered="#{!ctBackingBean.managedBean.disableAgent}"><!-- Enhancement 15851 - shaqimi -->
							<h:graphicImage value="/css/images/design/icon_trash.png"
								styleClass="tasklist_title1" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
				<p:commandButton
					oncomplete="ctSharingAttachDlg.show();return false;"
					value="#{lbl['lbl.txt.upload']}"
					disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.notificationSetting 
						or ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"
					rendered="#{!ctBackingBean.managedBean.disableAgent}"
					process="@this" partialSubmit="true"
					update="lampiranCtSharing, ctSharingAttachDlg" immediate="true" /><!-- Enhancement 15851 - shaqimi -->
				

			</p:outputPanel>
		</h:panelGroup>
		
		
		<p:confirmDialog id="dlgDelid" widgetVar="dlgAgenyDel"
			message="#{lbl['lbl.msg.confirm.delete']}" severity="alert"
			closable="true" appendToBody="true"
			header="#{lbl['lbl.msg.confirm.delete.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" process="@this"
					partialSubmit="true"
					update=":form:jabatan,:form:ptjCodeVaue,:form:agencyId,:form:itemId,:form:agencyRemarksAttachmentPnl"
					action="#{ctBackingBean.deleteAgencyDetails()}"
					onsuccess="dlgAgenyDel.hide();" onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="dlgAgenyDel.hide();" type="button" />
			</div>
		</p:confirmDialog>

		<p:outputPanel id="agencyDeliveryAddress">
			<h:panelGroup style="width:100%"
				rendered="#{ctBackingBean.managedBean.selectedAgency != null}">
				<div style="clear: both" />
				<p:spacer height="20" />
				<p:dataTable id="deliveryAddressTbl" var="deliveryAddress"
					widgetVar="deliveryAddressTblWidget"
					value="#{ctBackingBean.managedBean.selectedAgency.ctAgencyAddresses}"
					rowKey="#{deliveryAddress}"
					selection="#{ctBackingBean.managedBean.selectedListOfAddress}">
					<ac:paginator for="deliveryAddressTbl" />
					<p:ajax event="toggleSelect" listener="#{ctBackingBean.onToggleSelect}" update=":form:delAddressBtn" />
					<p:ajax event="rowSelect" listener="#{ctBackingBean.onRowSelect}" update=":form:delAddressBtn" />
					<p:ajax event="rowSelectCheckbox" listener="#{ctBackingBean.onRowSelect}" update=":form:delAddressBtn" />
					<p:ajax event="rowUnselectCheckbox" listener="#{ctBackingBean.onRowUnselect}" update=":form:delAddressBtn" />
					<p:column selectionMode="multiple" style="width:3%"
						disabledSelection="#{ctBackingBean.managedBean.disableAmendDetails
							or ctBackingBean.managedBean.viewSCL}"
						rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}" /> <!-- Enhancement 15851 - shaqimi -->
					<p:column headerText="#{lbl['lbl.ct.delivery.address']}"
						style="width:100%; white-space:normal;">
						<h:outputText
							value="#{ctBackingBean.getFullDeliveryAddress(deliveryAddress.deliveryAddress)}" />
					</p:column>
				</p:dataTable>
				<div class="ppRightBtn">
					<ac:lov id="addressTypeId" lovId="DELIVERY_FULL_ADDRESS"
						postUpdateListener="ctBackingBean.addDeliveryAddress"
						headerText="#{lbl['lbl.ct.delivery.address']}"
						buttonLabel="#{lbl['lbl.btn.add']}" selectionMode="multiple"
						saveObject="ctBackingBean.managedBean.addressTypeList"
						conditionField="#{ctBackingBean.getDeliveryAddressCondition()}"
						update=":form:deliveryAddressTbl"
						disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.viewSCL}"
						rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}" /><!-- Enhancement 15851 - shaqimi -->
					<p:commandButton id="delAddressBtn" value="#{lbl['lbl.ct.delete']}"
						process="@this" onsuccess="delAddressDlg.show()"
						partialSubmit="true"
						disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.buttonHideActive
							or ctBackingBean.managedBean.viewSCL}"
						rendered="#{!ctBackingBean.managedBean.viewContract and !ctBackingBean.managedBean.notificationSetting}" /><!-- Enhancement 15851 - shaqimi -->
				</div>

				<p:confirmDialog id="delAddressDlg" widgetVar="delAddressDlg"
					message="#{lbl['lbl.msg.confirm.delete']}" severity="alert"
					closable="true" appendToBody="true"
					header="#{lbl['lbl.msg.confirm.delete.header']}">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.yes']}" process="@this"
							partialSubmit="true"
							update=":form:deliveryAddressTbl, :form:delAddressBtn"
							action="#{ctBackingBean.deleteDeliveryAddress()}"
							oncomplete="delAddressDlg.hide();" />
						<p:commandButton value="#{lbl['lbl.btn.no']}"
							onclick="delAddressDlg.hide();" type="button" />
					</div>
				</p:confirmDialog>
				<p:spacer height="20" />
			</h:panelGroup>
		</p:outputPanel>
		<ac:lovPopup />

	</p:panel>


	<p:dialog id="dialogAgency" header="#{lbl['lbl.ct.add.agency']}"
		widgetVar="dlgAgency" styleClass="pop_up_top" modal="true" width="700"
		height="auto" resizable="false">
		<p:messages id="agencyMsg" showSummary="false" showDetail="true"
			autoUpdate="true" closable="true" severity="error, info" />
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.ct.instruction.add.agency.list']}" escape="false" />
		<br />
		<br />
		<h:panelGroup id="agencyies">
			<p:panel id="agencyPopUpId" header="#{lbl['lbl.ct.search']}"
				toggleable="true" toggleSpeed="500">
				<h:panelGrid columns="4">
					<p:outputLabel value="*" styleClass="mandatory" />
					<p:selectOneMenu for="ministry" style="width:150px" disabled="true">
						<f:selectItem itemLabel="#{lbl['lbl.ct.ministry']}" itemValue="" />
					</p:selectOneMenu>
					<p:spacer height="1" />
					<p:selectOneMenu id="ministry" style="width:300px"
						value="#{ctBackingBean.managedBean.ministryProfileId}">
						<f:selectItems value="#{ctBackingBean.getMinistryDropdown()}" />
						<p:ajax process="@this" partialSubmit="true" event="change"
							update=":form:jabatan,:form:ptjCodeVaue,:form:agencyTablePopUpId"
							listener="#{ctBackingBean.resetMinistryDetails}" />

					</p:selectOneMenu>
					<p:spacer height="1" />
					<p:selectOneMenu for="jabatan" style="width:150px" disabled="true">
						<f:selectItem itemLabel="#{lbl['lbl.ct.jabatan']}" itemValue="" />
					</p:selectOneMenu>
					<p:spacer height="1" />
					<p:selectOneMenu id="jabatan" style="width:300px"
						value="#{ctBackingBean.managedBean.jabatanProfileId}">
						<f:selectItems value="#{ctBackingBean.getJabatanDropdown()}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update=":form:ptjCodeVaue,:form:agencyTablePopUpId"
							listener="#{ctBackingBean.resetJabatanDetails}" />
					</p:selectOneMenu>
					<p:spacer height="1" />
					<p:selectOneMenu for="ptjcodename"
						value="#{ctBackingBean.managedBean.ptjCodeName}"
						style="width:150px;">
						<f:selectItem itemLabel="#{lbl['lbl.ct.ptj.code']}"
							itemValue="#{CtConst.ptjCode}" />
						<f:selectItem itemLabel="#{lbl['lbl.ct.ptj.name']}"
							itemValue="#{CtConst.ptjName}" />
						<p:ajax process="@this" />
					</p:selectOneMenu>
					<p:spacer height="1" />
					<p:inputText id="ptjCodeVaue" style="width:300px;"
						value="#{ctBackingBean.managedBean.ptjCodeNameSearchValues}">
						<p:ajax process="@this" />
					</p:inputText>
				</h:panelGrid>
				<div class="ppRightBtn">
					<p:commandButton id="agencySearchId"
						value="#{lbl['lbl.btn.search']}" update=":form:agencyTablePopUpId"
						action="#{ctBackingBean.searchAgencyDetails}" process="@this"
						partialSubmit="true"
						disabled="#{ctBackingBean.managedBean.ministryProfileId == null}" />
					<p:commandButton id="resetlBtn" value="#{lbl['lbl.btn.reset']}"
						process="@this" action="#{ctBackingBean.resetAgencyDetails}"
						update=":form:agencyies" />
				</div>
			</p:panel>
			<p:spacer height="2" />
			<p:panel id="agencyTablePopUpId"
				header="#{lbl['lbl.ct.search.result']}" toggleable="true"
				toggleSpeed="500">
				<p:dataTable id="tableAgency" var="pmVar"
					value="#{ctBackingBean.agencyDataModel}" rowIndexVar="rowIndex"
					rowKey="#{pmVar}" lazy="true"
					selection="#{ctBackingBean.managedBean.agencySelected}">
					<ac:paginator for="tableAgency" />
					<p:ajax event="toggleSelect" process="@this"
						update=":form:agySlectBtnId" />
					<p:ajax event="rowSelectCheckbox" process="@this"
						update=":form:agySlectBtnId" />
					<p:ajax event="rowUnselectCheckbox" process="@this"
						update=":form:agySlectBtnId" />
					<p:ajax event="rowUnselect" process="@this"
						update=":form:agySlectBtnId" />
					<p:ajax event="rowSelect" process="@this"
						update=":form:agySlectBtnId" />

					<p:column selectionMode="multiple" style="width:5%;" />
					<p:column headerText="#{lbl['lbl.ct.ptj.code']}">
                       	#{pmVar.orgCode}
