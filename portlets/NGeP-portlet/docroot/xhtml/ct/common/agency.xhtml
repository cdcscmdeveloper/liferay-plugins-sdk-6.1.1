<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
   <p:panel id="agencyId" toggleable="true"  toggleSpeed="500">
	   <f:facet name="header">
			<h:outputText value="#{lbl['lbl.ct.panel.agency']}"/>
        	<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.dtls']}"/>
  	   </f:facet>
       <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.add.agency']}" escape="false"/><br/>
	   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.delete.agency']}" escape="false"/><br/>	   
	   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.select.agency']}" escape="false"/><br/><br/>
       <p:dataTable id="tableAgencyDetails" var="agencyData"  value="#{ctBackingBean.managedBean.contractVer.ctAgencies}" 
  			selectionMode="single" rowKey="#{agencyData}" selection="#{ctBackingBean.managedBean.selectedAgency}" 
  			rowIndexVar="indexVar" >
            <ac:paginator for="tableAgencyDetails"/>
            <p:ajax event="rowSelect" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				update="@([id$=agencyDeliveryAddress],[id$=delBtn])"  />	
				
				<p:columnGroup type="header"> 
					<p:row> 
						<p:column rowspan="2"
							 style="width:10px;"  rendered="#{!ctBackingBean.managedBean.viewContract}" />
							 <p:column rowspan="2" headerText="#{lbl['lbl.ct.ministry']}" styleClass="column-align-center"/> 
							 <p:column rowspan="2" headerText="#{lbl['lbl.ct.jabatan']}" styleClass="column-align-center"/> 	
							 <p:column rowspan="2" headerText="#{lbl['lbl.ct.ptj']}" styleClass="column-align-center"/> 						
							 <p:column rowspan="2" style="width:10%;white-space:normal;">
						      <f:facet name="header" styleClass="column-align-center">
					               <h:outputText value="#{lbl['lbl.ct.ceiling.amount']}"/>
               		               <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ceiling.amt']}"/>
               	              </f:facet>
							  </p:column>
							  <p:column rowspan="2" style="width:8%;" styleClass="column-align-center">
							      <f:facet name="header">
							        <h:outputText value="#{lbl['lbl.ct.effective.date']}" styleClass="required"/>
							      </f:facet></p:column>
							  <p:column rowspan="2" headerText="#{lbl['lbl.ct.expiry.date']}" style="width:8%;" styleClass="column-align-center"/>
							  <p:column colspan="3" headerText="#{lbl['lbl.ct.ap178']}" style="text-align:center; white-space:normal;" styleClass="column-align-center"> 
									 <f:facet name="header">
					                       <h:outputText value="#{lbl['lbl.ct.ap178']}"/>
               		                      <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap178']}"/>
               	                     </f:facet>
               	               </p:column>						
							   <p:column rowspan="2" headerText="#{lbl['lbl.ct.status']}" style="width:6%;white-space:normal;" styleClass="column-align-center"/>
							</p:row>							
								<p:row> 
									<p:column/>	
									<p:column>
									  <f:facet name="header">
									     <h:outputText value="* " styleClass="mandatory" />
									     <h:outputText value="#{lbl['lbl.txt.attachment']}"/>
									  </f:facet>
									</p:column>  
									<p:column style="width:10%; white-space:normal;">
									  <f:facet name="header">
									       <h:outputText value="* " styleClass="mandatory" />
									       <h:outputText value="#{lbl['lbl.ct.file.ref.no']}"/>
									   </f:facet>
									 </p:column>
								</p:row>
							</p:columnGroup>
						
							<p:column style="width:10px;" 
							    rendered="#{!ctBackingBean.managedBean.viewContract}">
	     		                   <p:selectBooleanCheckbox value="#{agencyData.selectedCheckBox}" 
	     		                     disabled="#{ctBackingBean.managedBean.disableAmendDetails}">
			  		               <p:ajax event="change" update=":form:delBtn" listener="#{ctBackingBean.selectOneAgencyCheckboxSelect}"></p:ajax>
		       	                   </p:selectBooleanCheckbox>
	      	                 </p:column>
	      	                 
	      	                 <p:column style="width:25%;white-space:normal;" >
				                    <h:outputText value="#{ctBackingBean.retrieveMinistryByOrgProfileId(agencyData.orgProfile.orgProfileId)}" style="float:left;"/>
			                 </p:column>
			                 <p:column style="width:25%;white-space:normal;" >
				                    <h:outputText value="#{ctBackingBean.retrieveJabatanByOrgProfileId(agencyData.orgProfile.orgProfileId)}"  style="float:left;"/>
			                 </p:column>
			                 
			                  <p:column style="width:25%;white-space:normal;" >
				                     <h:outputText  value="#{agencyData.orgProfile.orgName}" style="float:left;"/>
			                  </p:column>
			
			    <p:column>
           		    <p:inputText value="#{agencyData.ceilingAmount}"  required="true"  label="#{lbl['lbl.ct.ceiling.amount']}"
           		        disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.disableAmendDetails}" style="width:80px;" maxlength="23"  styleClass="ppRightBtn">
			 		    <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			 		    <p:ajax event="change" update=":form:tableAgencyDetails" listener="#{ctBackingBean.validateCeilingAmount(agencyData)}"/> 
				     </p:inputText>
		    	</p:column>
		   
		   	     <p:column>
			      	<p:calendar id="agencyDateActive" value="#{agencyData.effDate}"  navigator="true" size="6"
		               readonlyInput="true"  
		               mindate="#{(ctBackingBean.managedBean.contractVer.ctContractValue.effDate gt DateUtils.getCurrentDateWithoutTime()) ? ctBackingBean.managedBean.contractVer.ctContractValue.effDate : DateUtils.getCurrentDateWithoutTime()}" 
		               maxdate="#{agencyData.expDate}"			             
		               showOn="button"  disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.disableAmendDetails}"
		               pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
		           	   <p:ajax event="dateSelect" update="agenyStatus" listener="#{ctBackingBean.checkAgencyStatus(agencyData)}"  /> 
		           </p:calendar>
		          </p:column>
		   	
		   	      <p:column>
				  <h:outputText value="#{agencyData.expDate}">
				      <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" /></h:outputText>
		   	   </p:column>
		   	   <p:column>
		   	       <p:selectBooleanCheckbox value="#{agencyData.ap178}" style="float:center;" disabled="true" />
		       </p:column>
		       <p:column style="white-space:normal;">
		         <p:commandButton id="uploadSharingDoc" oncomplete="uploadDlg1.show();return false;" icon="ui-icon-upload" 
					        rendered="#{agencyData.ap178 and agencyData.fileName == null}" action="#{ctBackingBean.setIndexProperty(indexVar)}"
					       disabled="#{ctBackingBean.managedBean.viewContract}"/>

		      <h:commandLink title="#{agencyData.fileName}"
						value="#{ctBackingBean.getShortFileName(agencyData.fileName)}"						
						style="float:left;margin-top:10px;" styleClass="blue_font"
						action="#{ctBackingBean.downloadFile(agencyData.filePath, agencyData.fileName)}" />
						
			   	<p:commandLink 
			   	   onclick="deleteAttachmentDlg1.show();" action="#{ctBackingBean.setIndexProperty(indexVar)}"
						  rendered="#{!ctBackingBean.managedBean.viewContract and agencyData.ap178 and agencyData.fileName != null}">
			   				<h:graphicImage value="/css/images/design/icon_trash.png" styleClass="tasklist_title1"/>
			 	</p:commandLink>
			 	 				
		       </p:column>
		       <p:column style="white-space:normal;">
		           <p:inputText id="uploadRefNoDoc"  value="#{agencyData.refNo}" 
		             style="width:80px;" disabled="#{ctBackingBean.managedBean.disableAmendDetails}"
		              rendered="#{agencyData.ap178}"> </p:inputText>
		       </p:column>
		        
		        <p:column>
		   	         <h:outputText id="agenyStatus" value="#{agencyData.chkStatus ? lbl['lbl.ct.active']:lbl['lbl.ct.inactive']}" style="float:none" />
		       </p:column>
                  
           
			</p:dataTable> 
       	<div class="ppRightBtn">
       		<p:commandButton id="addBtn" value="#{lbl['lbl.btn.add']}"   oncomplete="dlgAgency.show();" 
       	         partialSubmit="true" process="@this"	action="#{ctBackingBean.resetAgencyDetails}" 
       	         disabled="#{ctBackingBean.managedBean.disableAmendDetails}"
       	        update=":form:agencyies" rendered="#{!ctBackingBean.managedBean.viewContract}">
       			<p:tooltip for="addBtn">
				    <h:outputText value="#{lbl['lbl.ct.tooltip.add.agency']}" escape="false" />
				</p:tooltip>
       		</p:commandButton>
			 <p:commandButton id="delBtn" value="#{lbl['lbl.ct.delete']}" process="@form"
			 	onsuccess="dlgAgenyDel.show()"
			 	disabled="#{ctBackingBean.managedBean.buttonHideActive or ctBackingBean.managedBean.disableAmendDetails}" 
			 	rendered="#{!ctBackingBean.managedBean.viewContract}" >
       			<p:tooltip for="delBtn">
				    <h:outputText value="#{lbl['lbl.ct.tooltip.delete.agency']}" escape="false" />
				</p:tooltip>
			</p:commandButton>
	  	</div>
	  	<p:confirmDialog id="dlgDelid" widgetVar="dlgAgenyDel" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                         <div class="ppRightBtn">
		                     <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@all"  
		                         update=":form:agencyId,:form:itemId,:form:agencyRemarksAttachmentPnl" 
		                         action="#{ctBackingBean.deleteAgencyDetails()}" onclick="dlgAgenyDel.hide();"/>
			                 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="dlgAgenyDel.hide();" type="button" />
		                 </div>
                   </p:confirmDialog>
	  	
	  	<p:outputPanel id="agencyDeliveryAddress">
	        <h:panelGroup  style="width:100%" rendered="#{ctBackingBean.managedBean.selectedAgency != null}">	     
	           	<div style="clear:both" />
	           	<p:spacer height="20"/>
	           	<p:dataTable id="deliveryAddressTbl" var="deliveryAddress" 
	           		value="#{ctBackingBean.managedBean.selectedAgency.ctAgencyAddresses}"
					rowKey="#{deliveryAddress}" selection="#{ctBackingBean.managedBean.selectedListOfAddress}">
					<ac:paginator for="deliveryAddressTbl"/>
					<p:ajax event="toggleSelect" 
			                              listener="#{ctBackingBean.onToggleSelect}" update=":form:delAddressBtn" />
			                      <p:ajax event="rowSelect"
                                       listener="#{ctBackingBean.onRowSelect}" update=":form:delAddressBtn" />
			                      <p:ajax event="rowSelectCheckbox" 
			                             listener="#{ctBackingBean.onRowSelect}" update=":form:delAddressBtn" />
                                  <p:ajax event="rowUnselectCheckbox" 
                                         listener="#{ctBackingBean.onRowUnselect}" update=":form:delAddressBtn" />
					<p:column selectionMode="multiple" style="width:3%"  disabledSelection="#{ctBackingBean.managedBean.disableAmendDetails}"
						rendered="#{!ctBackingBean.managedBean.viewContract}"/>
					<p:column headerText="#{lbl['lbl.ct.delivery.address']}" style="width:100%; white-space:normal;">
					   <h:outputText value="#{ctBackingBean.getFullAddress(deliveryAddress.deliveryAddress)}" />
					</p:column>
				</p:dataTable>
				<div class="ppRightBtn">
					<ac:lov id="addressTypeId" lovId="PM_ADDRESS_TYPE"
						postUpdateListener="ctBackingBean.addDeliveryAddress"
						headerText="#{lbl['lbl.ct.delivery.address']}" 
						buttonLabel="#{lbl['lbl.btn.add']}"
						selectionMode="multiple"
						saveObject="ctBackingBean.managedBean.addressTypeList"
						conditionField="#{ctBackingBean.getDeliveryAddressCondition()}"
						update=":form:deliveryAddressTbl"
						disabled="#{ctBackingBean.managedBean.disableAmendDetails}"
						rendered="#{!ctBackingBean.managedBean.viewContract}"/>
					 <p:commandButton id="delAddressBtn" value="#{lbl['lbl.ct.delete']}" 
				     	 process="@this" onsuccess="delAddressDlg.show()" partialSubmit="true"
				     	 disabled="#{ctBackingBean.managedBean.disableAmendDetails or ctBackingBean.managedBean.buttonHideActive}"
				     	 rendered="#{!ctBackingBean.managedBean.viewContract}"/>
				</div>
				
				    <p:confirmDialog id="delAddressDlg" widgetVar="delAddressDlg" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                         <div class="ppRightBtn">
		                     <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                         update=":form:deliveryAddressTbl, :form:delAddressBtn" 
		                         action="#{ctBackingBean.deleteDeliveryAddress()}" oncomplete="delAddressDlg.hide();"/>
			                 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="delAddressDlg.hide();" type="button" />
		                 </div>
                   </p:confirmDialog>
				<p:spacer height="20"/>		
			</h:panelGroup>
	    </p:outputPanel> 
	  	<ac:lovPopup />
                   
	   </p:panel>  
		<p:dialog id="dialogAgency"  header="#{lbl['lbl.ct.add.agency']}" widgetVar="dlgAgency" 
			styleClass="pop_up_top" modal="true" width="700" height="500px" resizable="false">
			<p:messages id="agencyMsg" showSummary="false" showDetail="true"  autoUpdate="true" closable="true" severity="error, info" />
		   <h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.add.agency.list']}" escape="false"/><br/><br/>
		   <h:panelGroup  id="agencyies">
		       <p:panel id="agencyPopUpId" header="#{lbl['lbl.ct.search']}" toggleable="true" toggleSpeed="500" >
              <h:panelGrid columns="3">
                 <p:selectOneMenu for="ministry"  style="width:150px" disabled="true" >
            	    <f:selectItem itemLabel="#{lbl['lbl.ct.ministry']}" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="ministry" style="width:300px"
                      value="#{ctBackingBean.managedBean.ministryProfileId}" >
            	   <f:selectItems value="#{ctBackingBean.getMinistryDropdown()}"/>
            	   <p:ajax event="change" update=":form:jabatan" />
                 </p:selectOneMenu>
                 <p:selectOneMenu for="jabatan"  style="width:150px" disabled="true" >
            	    <f:selectItem itemLabel="#{lbl['lbl.ct.jabatan']}" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="jabatan" style="width:300px"
                      value="#{ctBackingBean.managedBean.jabatanProfileId}" >
            	   <f:selectItems value="#{ctBackingBean.getJabatanDropdown()}"/>
            	    <p:ajax event="change" update=":form:jabatan"/>
                 </p:selectOneMenu>
                 <p:selectOneMenu for="ptjcodename" 
                    value="#{ctBackingBean.managedBean.ptjCodeName}"  style="width:150px;">
                       <f:selectItem itemLabel="#{lbl['lbl.ct.ptj.code']}" itemValue="#{CtConst.ptjCode}"/>
            	      <f:selectItem itemLabel="#{lbl['lbl.ct.ptj.name']}" itemValue="#{CtConst.ptjName}"/>
            	      <p:ajax process="@this"/>
                 </p:selectOneMenu>
				 <p:spacer height="1"/>
                 <p:inputText id="ptjCodeVaue"  style="width:300px;" 
                     value="#{ctBackingBean.managedBean.ptjCodeNameSearchValues}" >
                     <p:ajax process="@this"/></p:inputText>
			  </h:panelGrid>
			  	<div class="ppRightBtn">
       		         <p:commandButton id="agencySearchId" value="#{lbl['lbl.btn.search']}" update=":form:tableAgency"  
       		            action="#{ctBackingBean.searchAgencyDetails}" process="@this" /> 
			         <p:commandButton id="resetlBtn" value="#{lbl['lbl.ct.reset']}" process="@this"
			            action="#{ctBackingBean.resetAgencyDetails}" update=":form:agencyies"   />
		       </div>
		       </p:panel>
			   <p:spacer height="2"/>
			        <p:panel id="agencyTablePopUpId" header="#{lbl['lbl.ct.search.result']}" toggleable="true" toggleSpeed="500" >
              <p:dataTable id="tableAgency" var="pmVar" value="#{ctBackingBean.agencyDataModel}" 
                 rowIndexVar="rowIndex" selection="#{ctBackingBean.selectedPmOrgProfile}" rowKey="#{pmVar}" lazy="true">
                  <ac:paginator for="tableAgency"/>
                    <p:column selectionMode="multiple" style="width:18px;"> 
                         <f:facet name="header">
                             <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agency.popup.chkBox']}"/>
		               </f:facet>
                    </p:column>       
                    <p:column headerText="#{lbl['lbl.ct.ptj.code']}" >
                       	#{pmVar.orgCode}
					</p:column>
                    <p:column headerText="#{lbl['lbl.ct.ptj.name']}" >
                      	#{pmVar.orgName}
					</p:column>
			 </p:dataTable>           
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.select']}" process="@form" 
				update=":form:tableAgencyDetails,:form:itemId,:form:messages,:form:agencyRemarksAttachmentPnl" 
				    action="#{ctBackingBean.addAgencyDetails()}" onclick="dlgAgency.hide();"/>
				    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="dlgAgency.hide();" />
           </div>
          </p:panel>
           </h:panelGroup>
	</p:dialog>
	<p:panel id="agencyRemarksAttachmentPnl" header="#{lbl['lbl.txt.remarks']}" toggleable="true" 
	  rendered="#{!ctBackingBean.managedBean.viewContract}" >
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top">
					<table style="width: 100%">
						<tr>
							<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
							<td class="TableFieldRight">
								<p:dataGrid value="#{ctBackingBean.managedBean.contractVer.agencyRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
									<table>
										<tr>
											<td rowspan="2" valign="top">
												<h:graphicImage value="#{ctBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
											</td>
											<td width="5"></td>
											<td>
												<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
												<h:outputText value="#{remarkVar.changedDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
												</h:outputText>
											</td>
										</tr>
										<tr>
											<td></td>
											<td>
												<p:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" 
													disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.disableAmendDetails}"
													style="width:70%;" autoResize="false" /> 
												<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.remark']}"/>
												<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>
					</table>    					
				</td>
				<td width="50%" valign="top"></td>
		</tr>
	</table>
	
	<p:dialog id="uploadDlg1" widgetVar="uploadDlg1" modal="true" resizable="false"
	   	width="700px" height="350px" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;" mode="advanced" dragDropSupport="false" id="upload1"
			fileUploadListener="#{ctBackingBean.agencyFileUpload}"  showButtons="false"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}" multiple="false"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			update=":form:tableAgencyDetails" >
		</p:fileUpload>
		<f:facet name="footer">
		<div class="ppRightBtn">
		    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadDlg1.hide();" />
   		</div>
   		</f:facet>
	</p:dialog>
	
    <p:confirmDialog id="deleteAttachmentDlg1" widgetVar="deleteAttachmentDlg1" message="#{lbl['lbl.msg.confirm.delete']}" 	
             severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
           <div class="ppRightBtn">
         <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
             update=":form:tableAgencyDetails" 
             action="#{ctBackingBean.deleteAgencyAttachement()}" oncomplete="deleteAttachmentDlg1.hide();"/>
      <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteAttachmentDlg1.hide();" type="button" />
     </div>
     </p:confirmDialog>
		
	</p:panel>		
</ui:composition>
