<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="cc" toggleable="true" collapsed="false" toggleSpeed="500">
	<f:facet name="header">
		<h:outputText value="#{lbl['lbl.ct.panel.contract']}"/>
		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fulfilment.dtls']}"/>
   	</f:facet>
	<h:outputText styleClass="instruction" value="#{lbl['lbl.ct.instruction.mandatory']}" escape="false" /><br/><br/>
	<h:panelGrid columns="2" style="width:100%;" styleClass="top-aligned-columns">
		<h:panelGroup style="width:765px;" >
			<table style="width: 100%">
				<tr>
					<td class="columnWidth150">
						<p:outputLabel id="centralNo" value="#{lbl['lbl.ct.contract.no']}" />
					</td>
					<td>
						<p:inputText for="centralNo"  disabled="true" maxlength="17" style="width:130px;"
							value="#{ctBackingBean.managedBean.contractVer.ctContract.contractNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.no']}" />
					</td>
					<td class="columnWidth150">
						<p:outputLabel id="centralphyNo" value="#{lbl['lbl.ct.physical.no']}" />
					</td> 
					<td>
						<p:inputText for="centralphyNo" maxlength="30" style="width:130px;"
						disabled="#{ctBackingBean.getConditionalValue()}"
		 	    		value="#{ctBackingBean.managedBean.contractVer.contractPhysicalNo}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.physical.contract.no']}" />
					</td>
				</tr>
				<tr>
				<td class="columnWidth150">
						<p:outputLabel id="centralCtAmountId" value="#{lbl['lbl.ct.contract.amount']}" />
					</td>
					<td>
						<p:inputText for="centralCtAmountId" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
			   				value="#{ctBackingBean.managedBean.contractVer.ctContractAmount.contractAmount}"  disabled="true">
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</td>
					<td class="columnWidth150">
						<p:outputLabel id="centralEfDate" value="#{lbl['lbl.ct.effective.date']}" />
					</td>
					<td>
						<p:inputText for="centralEfDate" disabled="true" style="width:80px;"
							value="#{ctBackingBean.managedBean.contractVer.ctContractValue.effDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
					</tr>				
				   
				   <tr>
				     <td class="columnWidth150">
						<p:outputLabel id="gstAmountCentral" value="#{lbl['lbl.ct.gst.amt']}"  />
					</td>
					<td>
						<p:inputText for="gstAmountCentral" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
			   				 disabled="#{ctBackingBean.managedBean.viewContract
						     		or ctBackingBean.managedBean.contractVer.docType eq ParameterConst.doctypeContractAmendment
						     		or ctBackingBean.managedBean.disableGstAmount}"
			   				 rendered="#{ctBackingBean.managedBean.gstCheckingGUI}"
			   				 value="#{ctBackingBean.managedBean.ctContractAmount.gstAmount}" >
			   				<p:ajax  event="blur" update="@all" process="@this"
				   			   listener="#{ctBackingBean.calculateOrverAllAmt()}"></p:ajax>
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
						<p:inputText styleClass="ppRightBtn" style="width:130px;"
			   				 disabled="true" value="#{lbl['lbl.txt.na']}"  rendered="#{!ctBackingBean.managedBean.gstCheckingGUI}">
						</p:inputText>
					</td>
		    	    <td class="columnWidth150">
						<p:outputLabel id="centralExpDate" value="#{lbl['lbl.ct.expiry.date']}" />
					</td> 
					<td>
						<p:inputText for="centralExpDate" disabled="true" style="width:80px;"
							value="#{ctBackingBean.managedBean.contractVer.ctContractValue.expDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			  			</p:inputText>
			  		</td>
                	</tr>
                	<tr>
                	<td class="columnWidth150">
						<p:outputLabel id="overAllAmtsCentrals" value="#{lbl['lbl.ct.gst.all.amt']}" />
					</td>
					<td>
						<p:inputText id="overAllAmtsCentral" styleClass="ppRightBtn"  maxlength="22" style="width:130px;"
			   				value="#{ctBackingBean.managedBean.gstTotalAmount}"  disabled="true">
				   			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText>
					</td>
                	<h:panelGroup rendered="#{!ctBackingBean.managedBean.contractVer.ctContract.zonalPricing}">
					<td class="columnWidth150">
	     	             	<p:outputLabel id="centralPeriod" value="#{lbl['lbl.ct.delivery.period']}" style="width:100%"  styleClass="required" />
					</td> 
					<td><p:inputText id="centralDelPeriod" styleClass="ppRightBtn" validator="#{webappBean.validateDPeriod}" style="width:45px;"
		              		maxlength="4" value="#{ctBackingBean.managedBean.contractVer.ctContractValue.deliveryTerm}"
		              		disabled="#{ctBackingBean.managedBean.viewContract
		              			or ctBackingBean.getValueFromAmendment() or ctBackingBean.managedBean.disableAmendDetails}" label="#{lbl['lbl.ct.delivery.period']}" />
                		<p:spacer width="3"/>
                		<h:outputText value="#{lbl['lbl.ct.days']}" />
                	</td>                	
                	</h:panelGroup>   
                </tr>
                <tr>
                	<h:panelGroup rendered="#{!ctBackingBean.managedBean.ctContractAmount.agreement
                		and ctBackingBean.managedBean.contractVer.docType != ParameterConst.doctypeContractCreation}">
                	<td class="columnWidth150">
						<p:outputLabel id="centralSignDate1" value="#{lbl['lbl.ct.signed.date']}" />
					</td> 
					<td>
						<p:calendar value="#{ctBackingBean.managedBean.contractVer.signedDate}" id="popupButtonCal" 
			   				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
			       			navigator="true" size="7" showOn="button" readonlyInput="true" label="#{lbl['lbl.ct.signed.date']}"
			      			disabled="#{ctBackingBean.managedBean.viewContract or ctBackingBean.managedBean.contractVer.docType eq ParameterConst.doctypeContractAmendment}">
			      		</p:calendar>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
					</td>					
					</h:panelGroup>
				</tr>
				
				<h:panelGroup rendered="#{ctBackingBean.managedBean.ctContractAmount.agreement}">
				<tr rowspan="2">
					<h:panelGroup rendered="#{ctBackingBean.managedBean.ctContractAmount.ctAgreement.status.statusId != CtStatusConst.acComplete and
						ctBackingBean.managedBean.ctContractAmount.ctAgreement.status.statusId != CtStatusConst.saComplete}">
					<td class="columnWidth150">
						<p:outputLabel for="centralAstatus" value="#{lbl['lbl.ct.agreement.status']}" />
					</td>
					<td>
						<p:inputTextarea id="centralAstatus" autoResize="false" maxlength="1000" 
							disabled="true" rows="2" style="width:130px;margin-bottom:5px;"
							value="#{ctBackingBean.getStatusDescById(ctBackingBean.managedBean.ctContractAmount.ctAgreement.status.statusId)}" />
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement.status']}" />
					</td>
					</h:panelGroup>
					<h:panelGroup rendered="#{ctBackingBean.managedBean.ctContractAmount.ctAgreement.status.statusId eq CtStatusConst.acComplete or
						ctBackingBean.managedBean.ctContractAmount.ctAgreement.status.statusId eq CtStatusConst.saComplete}">
					<td styleClass="columnWidth150">
						<p:outputLabel id="centralAgreement" value="#{lbl['lbl.ct.agreement']}" />
					</td>
					<td>
						<h:commandLink for="centralAgreement" styleClass="blue_font"
							title="#{ctBackingBean.managedBean.ctContractAmount.ctAgreement.fileName}"
							value="#{ctBackingBean.getShortFileName(ctBackingBean.managedBean.ctContractAmount.ctAgreement.fileName)}"
							action="#{ctBackingBean.downloadFile(ctBackingBean.managedBean.ctContractAmount.ctAgreement.filePath,
							ctBackingBean.managedBean.ctContractAmount.ctAgreement.fileName)}" />
					</td>
					</h:panelGroup>
					<td class="columnWidth150">
						<p:outputLabel id="centralSignDate" value="#{lbl['lbl.ct.signed.date']}" />
					</td> 
					<td>
						<p:inputText for="centralSignDate" disabled="true" style="width:80px;"
							value="#{ctBackingBean.managedBean.agreementContractVer.signedDate}">
			   				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.signed.date']}" />
					</td>
				</tr>
				</h:panelGroup>
				<tr>
					<h:panelGroup rendered="#{ctBackingBean.chkCircularActiveRecord()}">
					<td class="columnWidth150">
						<p:outputLabel id="centralCicularId" value="#{lbl['lbl.ct.circular.no']}" />
					</td>
					<td>
						<h:commandLink for="centralCicularId" styleClass="blue_font"
							title="#{ctBackingBean.managedBean.ctCircularVer.ctCircular.circularNo}"
							value="#{ctBackingBean.managedBean.ctCircularVer.ctCircular.circularNo}"
							action="#{ctBackingBean.gotoCicularPage(ctBackingBean.managedBean.ctCircularVer.circularVerId)}" />
					</td>
                	</h:panelGroup>
                	<td></td><td></td>
				</tr>
				
				<tr rowspan="4">
					<td class="columnWidth150">
						<p:outputLabel for="centralContractName" value="#{lbl['lbl.ct.contract.title']}" />
					</td>
					<td colspan="3">
						<p:inputTextarea id="centralContractName" autoResize="false" maxlength="1000"
							disabled="true" rows="4" style="width:455px; margin-bottom:5px;" 
							value="#{ctBackingBean.managedBean.contractVer.ctContract.contractName}" />
					</td>					
				</tr>
			</table>
		</h:panelGroup>
	  	
	  	<h:panelGrid style="width:270px; margin-left:5px">
	  	 <h:panelGrid columns="3" rendered="#{!ctBackingBean.managedBean.directPurchase}">
			  <p:selectBooleanCheckbox id="exemptCentralId" value="#{ctBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}" 
			    	disabled="#{true or ctBackingBean.managedBean.chkConceValue or ctBackingBean.managedBean.viewContract}" style="text-align:top;">
			     <p:ajax event="change" update=":form:justificationCentralPanel" listener="#{ctBackingBean.chkJustificationAction}" process="@this"/> 
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.ap201']}" style="text-align:left;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ap201.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>
		    <h:panelGrid columns="3">
			       <p:selectBooleanCheckbox disabled="#{ctBackingBean.managedBean.viewContract
			       		or ctBackingBean.getValueFromAmendment() or ctBackingBean.managedBean.disableAmendDetails}" 
			             value="#{ctBackingBean.managedBean.contractVer.ctContractValue.pid}"  style="text-align:top;">
			              <p:ajax event="change"  update=":form:purchaseInDefaultPanel" process="@this"></p:ajax>
			         </p:selectBooleanCheckbox>
			         <p:spacer width="2" />	
			          <h:panelGrid columns="2">
			  	            <h:outputText value="#{lbl['lbl.ct.pid']}"  />
			  	           <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.ct.pid']}" />
			  	      </h:panelGrid>
		 </h:panelGrid>	
		 
		     <h:panelGrid columns="3" 
		     	rendered="#{!ctBackingBean.managedBean.directPurchase and ctBackingBean.managedBean.ctContractAmount.bondReq}">
			 <p:selectBooleanCheckbox value="#{ctBackingBean.managedBean.ctContractAmount.bondExempted}"
				 disabled="#{ctBackingBean.managedBean.viewContract
				 	or ctBackingBean.managedBean.contractVer.docType eq ParameterConst.doctypeAmendmentWithoutSupplement
				 	or ctBackingBean.managedBean.contractVer.docType eq ParameterConst.doctypeContractAmendment}" style="text-align:top;">
				 <p:ajax event="change" update="@all" process="@this"></p:ajax>
			  </p:selectBooleanCheckbox>
			  <p:spacer width="2" />	
			  <h:panelGrid columns="2">
				  <h:outputText value="#{lbl['lbl.ct.pb.exemption']}" style="text-align:top;" />
				  <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.performance.bond.exemption']}" />
			  </h:panelGrid>
		   </h:panelGrid>
	      <h:panelGrid columns="3">  
		       <p:selectBooleanCheckbox 
			       value="#{ctBackingBean.managedBean.contractVer.ctContractValue.feeExampted}" disabled="true" />
		       <p:spacer width="2" />	
		       <h:panelGrid columns="2">
		       		<h:outputText value="#{lbl['lbl.ct.fee.exmption']}" />
		       		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fee.exmption']}" />
			   </h:panelGrid>
	         </h:panelGrid>	
	         <h:panelGrid columns="3">  
			   <p:selectBooleanCheckbox 
			      value="#{ctBackingBean.managedBean.ctContractAmount.agreement}" disabled="true" />
		       <p:spacer width="2" />
		       <h:panelGrid columns="2">
		       		<h:outputText value="#{lbl['lbl.ct.has.agreement']}" />
		       		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.agreement']}" />
			   </h:panelGrid>
		     </h:panelGrid>
		     <h:panelGrid columns="3">  
			   <p:selectBooleanCheckbox 
			      value="#{ctBackingBean.managedBean.contractVer.ctContractValue.followLoaAmt}"  disabled="true"/>
		       <p:spacer width="2" />
		       <h:panelGrid columns="2">
		       		<h:outputText value="#{lbl['lbl.ct.follow.ctvalue']}" />
		       		<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.fctvalue']}" />
			   </h:panelGrid>
		     </h:panelGrid> 
	 	</h:panelGrid>
	 </h:panelGrid>
	 <p:outputPanel id="justificationCentralPanel" rendered="false">
  		<h:panelGrid columns="2" style="width:740px;" 
  			rendered="#{ctBackingBean.managedBean.contractVer.ctContractValue.ap201Exempt}">
   			<p:outputLabel id="justificationOutputLbls" value="#{lbl['lbl.ct.justification.ap201']}" style="width:120px;" />
			<p:inputTextarea id="justificationCentralLbl" value="#{ctBackingBean.managedBean.contractVer.ctContractValue.justification}"
  				rows="3" style="width:455px;" maxlength="200" label="#{lbl['lbl.ct.justification.ap201']}"
      			autoResize="false" disabled="#{ctBackingBean.managedBean.viewContract
      				or ctBackingBean.getValueFromAmendment() or ctBackingBean.managedBean.disableAmendDetails}"></p:inputTextarea>	
   		</h:panelGrid> 
 	</p:outputPanel>
 	
 	<p:outputPanel>
	 <h:panelGrid columns="2" style="width:765px;"  columnClasses="columnWidth150"
 		rendered="#{!ctBackingBean.managedBean.directPurchase 
 			and ctBackingBean.managedBean.ctContractAmount.bondReq
 			and ctBackingBean.managedBean.ctContractAmount.bondExempted}">
			<p:outputLabel  value="#{lbl['lbl.ct.bond.exempted.letter']}"  styleClass="required" />
	  		 <h:panelGroup id="centralUploadBondExemptedPg">
				 <p:commandButton oncomplete="centralUploadBondExemptedDlg.show();return false;"
					 update="centralUploadBondExemptedPg" value="#{lbl['lbl.bpm.choose.file']}"
					 disabled="#{ctBackingBean.managedBean.viewContract
					 	or ctBackingBean.managedBean.contractVer.docType eq ParameterConst.doctypeAmendmentWithoutSupplement
					 	or ctBackingBean.managedBean.contractVer.docType eq ParameterConst.doctypeContractAmendment}"/>	
			     <h:commandLink value="#{ctBackingBean.managedBean.ctContractAmount.bondExemptedFileName}" 
			          styleClass="blue_font" action="#{ctBackingBean.downloadFile(ctBackingBean.managedBean.ctContractAmount.bondExemptedFilePath, ctBackingBean.managedBean.ctContractAmount.bondExemptedFileName)}" />					
			</h:panelGroup>
	 </h:panelGrid> 
	</p:outputPanel>
	<p:dialog id="centralUploadBondExemptedDlg" widgetVar="centralUploadBondExemptedDlg" modal="true" 
		   	width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;" mode="advanced" 
				fileUploadListener="#{ctBackingBean.uploadBondExemptedFile}" 
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
				invalidFileMessage="#{lbl['lbl.ct.upload.invalid.msg']}"
				update="centralUploadBondExemptedPg" >
			</p:fileUpload> 
	</p:dialog>
  </p:panel>
</ui:composition>
