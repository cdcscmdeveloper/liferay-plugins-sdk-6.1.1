### Developer Mode ###
#This means that changes to the individual files of the theme will be applied immediately if set true
theme.css.fast.load=true
#The Javascript will be loaded as individual files instead as one big file if set false, easy debug file by file
javascript.fast.load=false
#Enable/Disable javascript log
javascript.log.enabled=false
#Disable cache so changes can be viewed instantly
layout.template.cache.enabled=false
#The server won't start a browser when starting up
browser.launcher.url=
#The modification-based cache of web resources (such as the global CSS file, css_cached.jsp) is disabled if set false
last.modified.check=false
#The velocity templates of themes and journal articles won't be cached so changes will be applied immediately. 
velocity.engine.resource.manager.cache.enabled=false
